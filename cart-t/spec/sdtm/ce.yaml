domain: CE
label: Clinical Events
class: Events
structure: One record per clinical event (Suspected MI) per subject
purpose: Tabulation
keys: [STUDYID, USUBJID, CETERM, CESTDTC]
ig_anchor: "CE+Specification"

sources:
  - form: "Suspected MI"
    item_groups: [EVENT]
  - sdtm_domain: DM
    vars: [USUBJID, RFSTDTC, RFENDTC]

scope_note: |
  In SDTMIG v3.3, Clinical Events captures protocol-defined disease events
  that are not adverse events. The Suspected MI form captures the event
  itself (DESC, EVENTDATE) in the EVENT item group. The PANEL item group
  (CK, CKMB, TROP) holds lab values that belong in LB. UPLOADS (ANGIO,
  EKG, with their dates/times) describe diagnostic procedures and belong
  in PR / EG respectively. Those are out of scope for this domain.

  CETERM is mapped from the verbatim DESC item to a canonical sponsor
  term (CHEST PAIN or SUSPECTED MYOCARDIAL INFARCTION). Six of the 14
  raw DESC entries are operator test data ("This is a test", "lakjsd",
  "cjkcxhcj…") and are dropped from the emitted dataset.

record_rule: |
  One row per Suspected-MI EVENT item-group repeat per subject, after:
    (1) dropping rows whose DESC value does not map to a canonical CETERM
        (junk/test data — SD1021);
    (2) dropping rows where CESTDTC > DM.RFPENDTC — event date after the
        subject's last study participation. These represent synthetic data
        inconsistencies and are clinically impossible (SD0018).

variables:
  STUDYID:
    label: Study Identifier
    type: Char
    length: 12
    role: Identifier
    core: Req
    origin: Sponsor Defined
    derivation: Study constant ("CART-T-PILOT").

  DOMAIN:
    label: Domain Abbreviation
    type: Char
    length: 2
    role: Identifier
    core: Req
    origin: Assigned
    derivation: Constant value "CE".

  USUBJID:
    label: Unique Subject Identifier
    type: Char
    length: 30
    role: Identifier
    core: Req
    origin: Derived
    derivation: Joined from DM via subjectkey.

  CESEQ:
    label: Sequence Number
    type: Num
    length: 8
    role: Identifier
    core: Req
    origin: Derived
    derivation: row_number() within USUBJID, ordered by CESTDTC.

  CETERM:
    label: Reported Term for the Clinical Event
    type: Char
    length: 200
    role: Topic
    core: Req
    origin: CRF
    raw_item: DESC
    source_form: "Suspected MI"
    source_item_group: EVENT
    derivation: |
      Canonicalised from EVENT.DESC via map_ceterm():
        – Anything matching /chest pain/ or /cest pain/ -> "CHEST PAIN"
        – "MI" or anything matching /myocardial infarction/
          -> "SUSPECTED MYOCARDIAL INFARCTION"
        – All other free-text entries (test/junk data) -> row dropped.
      SD1021 fix (issue #15).

  CECAT:
    label: Category for Clinical Event
    type: Char
    length: 40
    role: Grouping Qualifier
    core: Req
    origin: Assigned
    derivation: Constant "SUSPECTED MI" (protocol-defined event category).

  CEPRESP:
    label: Clinical Event Pre-Specified
    type: Char
    length: 1
    role: Variable Qualifier
    core: Perm
    origin: Protocol
    codelist: NY
    derivation: |
      Null for all records — not included in the submitted dataset.
      SDTMIG v3.3 CE spec: "Value is 'Y' for pre-specified events and null
      for spontaneously reported events." Suspected MI events are spontaneously
      reported (subjects/clinicians report events as they occur; there is no
      visit-specific check-list solicitation). Including CEPRESP = "Y" without
      a paired visit time-point (VISITNUM or CESTTPT) triggers P21
      "Missing Start Time-Point value." Omitting CEPRESP is correct for
      spontaneous events and resolves SD1076 / the start time-point check.
    notes: Not included in dataset output (null for spontaneous events → SD1078).

  CEOCCUR:
    label: Clinical Event Occurrence
    type: Char
    length: 1
    role: Record Qualifier
    core: Perm
    origin: CRF
    codelist: NY
    derivation: |
      Null for all records — not included in the submitted dataset.
      SDTMIG v3.3 CE spec: "Used when the occurrence of specific events is
      solicited … Values are null for spontaneously reported events." Since
      CEPRESP is null (spontaneous events), CEOCCUR is also null per IG.
    notes: Not included in dataset output (null for spontaneous events → SD1078).

  CESER:
    label: Serious Event
    type: Char
    length: 1
    role: Record Qualifier
    core: Perm
    origin: Derived
    codelist: NY
    derivation: |
      Not included in the submitted dataset. CESER does not appear in the
      SDTMIG v3.3 CE domain variable specification table (only AESER exists
      in the AE table). Including CESER triggers SD1076 "Model Permissible
      variable added into standard domain." CE Assumption 6 permits AE-domain
      variables to be used in CE, but P21 does not validate this and flags
      CESER as non-standard for CE in v3.3.
    notes: Not included in dataset output (SD1076 — not in CE domain table).

  EPOCH:
    label: Epoch
    type: Char
    length: 40
    role: Timing
    core: Perm
    origin: Derived
    codelist: EPOCH
    derivation: |
      Derived from CESTDTC against DM reference dates:
        DM.RFSTDTC = null (screen failure, ARMNRS = "SCREEN FAILURE")
                                                   -> "SCREENING"
        CESTDTC < DM.RFSTDTC                       -> "SCREENING"
        DM.RFSTDTC <= CESTDTC <= DM.RFENDTC        -> "TREATMENT"
        CESTDTC > DM.RFENDTC                       -> "FOLLOW-UP"
        CESTDTC null                               -> null
      Null-RFSTDTC case: after the SDTMIG v3.3 ARM fix, screen failure
      subjects (ARMNRS = "SCREEN FAILURE") have RFSTDTC = null. Any CE
      record for such a subject is assigned EPOCH = "SCREENING" since an
      unassigned subject has no treatment reference period.

  CESTDTC:
    label: Start Date/Time of Clinical Event
    type: Char
    length: 10
    role: Timing
    core: Exp
    origin: CRF
    raw_item: EVENTDATE
    source_form: "Suspected MI"
    source_item_group: EVENT
    derivation: Copied from EVENT.EVENTDATE via normalize_iso_date().

  CESTDY:
    label: Study Day of Start of Clinical Event
    type: Num
    length: 8
    role: Timing
    core: Perm
    origin: Derived
    derivation: |
      as.integer(as.Date(CESTDTC) - as.Date(DM.RFSTDTC))
        + ifelse(CESTDTC >= RFSTDTC, 1L, 0L). Skip day 0.
      Null when CESTDTC or DM.RFSTDTC is missing.
