domain: AE
label: Adverse Events
class: Events
structure: One record per adverse event per subject
purpose: Tabulation
keys: [STUDYID, USUBJID, AETERM, AESTDTC]
ig_anchor: "AE+Specification"

sources:
  - form: "Adverse Event"
    item_groups: [AE]

variables:
  STUDYID:
    label: Study Identifier
    type: Char
    length: 12
    role: Identifier
    core: Req
    origin: Sponsor Defined
    derivation: Study constant ("CART-T-PILOT").

  DOMAIN:
    label: Domain Abbreviation
    type: Char
    length: 2
    role: Identifier
    core: Req
    origin: Assigned
    derivation: Constant value "AE".

  USUBJID:
    label: Unique Subject Identifier
    type: Char
    length: 30
    role: Identifier
    core: Req
    origin: Derived
    derivation: Joined from DM via subjectkey.

  AESEQ:
    label: Sequence Number
    type: Num
    length: 8
    role: Identifier
    core: Req
    origin: Derived
    derivation: row_number() within USUBJID, ordered by AESTDTC, AETERM.

  AESPID:
    label: Sponsor-Defined Identifier
    type: Char
    length: 40
    role: Identifier
    core: Perm
    origin: CRF
    raw_item: AESPID
    source_form: "Adverse Event"
    derivation: Copied from AESPID (CRF line-item identifier).

  AETERM:
    label: Reported Term for the Adverse Event
    type: Char
    length: 200
    role: Topic
    core: Req
    origin: CRF
    raw_item: AETERM
    source_form: "Adverse Event"
    derivation: Copied from CRF AETERM (verbatim).

  AEMODIFY:
    label: Modified Reported Term
    type: Char
    length: 200
    role: Synonym Qualifier
    core: Perm
    origin: Assigned
    derivation: Coder-modified version of AETERM (when modified for MedDRA coding); null otherwise.

  AEDECOD:
    label: Dictionary-Derived Term
    type: Char
    length: 200
    role: Synonym Qualifier
    core: Exp
    origin: Assigned
    derivation: MedDRA Preferred Term assigned post-coding; null until coding completes.

  AEBODSYS:
    label: Body System or Organ Class
    type: Char
    length: 200
    role: Record Qualifier
    core: Exp
    origin: Assigned
    derivation: MedDRA primary System Organ Class assigned post-coding.

  AESEV:
    label: Severity/Intensity
    type: Char
    length: 10
    role: Record Qualifier
    core: Exp
    origin: CRF
    codelist: AESEV
    raw_item: AESEV
    source_form: "Adverse Event"
    derivation: Copied from AESEV; map raw values to CDISC CT ("MILD" / "MODERATE" / "SEVERE").

  AESER:
    label: Serious Event
    type: Char
    length: 1
    role: Record Qualifier
    core: Exp
    origin: CRF
    codelist: NY
    raw_item: AESER
    source_form: "Adverse Event"
    derivation: Copied from AESER ("Y"/"N"); blank -> null.

  AEACN:
    label: Action Taken with Study Treatment
    type: Char
    length: 30
    role: Record Qualifier
    core: Exp
    origin: CRF
    codelist: ACN
    raw_item: AEACN
    source_form: "Adverse Event"
    derivation: Map AEACN to CDISC CT ACN ("DOSE NOT CHANGED", "DOSE REDUCED", "DRUG WITHDRAWN", "NOT APPLICABLE", "UNKNOWN").

  AEREL:
    label: Causality
    type: Char
    length: 30
    role: Record Qualifier
    core: Exp
    origin: CRF
    raw_item: AEREL
    source_form: "Adverse Event"
    derivation: Copied from AEREL (e.g., "NOT RELATED", "POSSIBLE", "PROBABLE", "RELATED").

  AERELNST:
    label: Relationship to Non-Study Treatment
    type: Char
    length: 200
    role: Record Qualifier
    core: Perm
    origin: CRF
    raw_item: AE_MEDREL
    source_form: "Adverse Event"
    derivation: Copied from AE_MEDREL when concomitant medication relatedness was assessed; else null.

  AEOUT:
    label: Outcome of Adverse Event
    type: Char
    length: 40
    role: Record Qualifier
    core: Exp
    origin: CRF
    codelist: OUT
    raw_item: AEOUT
    source_form: "Adverse Event"
    derivation: Map AEOUT to CDISC CT OUT ("RECOVERED/RESOLVED", "RECOVERING/RESOLVING", "NOT RECOVERED/NOT RESOLVED", "RECOVERED/RESOLVED WITH SEQUELAE", "FATAL", "UNKNOWN").

  AESCONG:
    label: Congenital Anomaly or Birth Defect
    type: Char
    length: 1
    role: Record Qualifier
    core: Perm
    origin: CRF
    codelist: NY
    raw_item: AESCONG
    derivation: Copied from AESCONG; blank -> null.

  AESDISAB:
    label: Persist/Significant Disability/Incapacity
    type: Char
    length: 1
    role: Record Qualifier
    core: Perm
    origin: CRF
    codelist: NY
    raw_item: AESDISAB
    derivation: Copied from AESDISAB; blank -> null.

  AESDTH:
    label: Results in Death
    type: Char
    length: 1
    role: Record Qualifier
    core: Perm
    origin: CRF
    codelist: NY
    raw_item: AESDTH
    derivation: Copied from AESDTH; blank -> null.

  AESHOSP:
    label: Requires or Prolongs Hospitalization
    type: Char
    length: 1
    role: Record Qualifier
    core: Perm
    origin: CRF
    codelist: NY
    raw_item: AESHOSP
    derivation: Copied from AESHOSP; blank -> null.

  AESLIFE:
    label: Is Life Threatening
    type: Char
    length: 1
    role: Record Qualifier
    core: Perm
    origin: CRF
    codelist: NY
    raw_item: AESLIFE
    derivation: Copied from AESLIFE; blank -> null.

  AESMIE:
    label: Other Medically Important Serious Event
    type: Char
    length: 1
    role: Record Qualifier
    core: Perm
    origin: CRF
    codelist: NY
    raw_item: AESIMIE
    derivation: Copied from AESIMIE (raw name keeps "I" before "M"); blank -> null.

  AESINTV:
    label: Required Intervention to Prevent Damage
    type: Char
    length: 1
    role: Record Qualifier
    core: Perm
    origin: CRF
    codelist: NY
    raw_item: AESINTV
    derivation: Copied from AESINTV; blank -> null.

  AECONTRT:
    label: Concomitant or Additional Trtmnt Given
    type: Char
    length: 1
    role: Record Qualifier
    core: Perm
    origin: Derived
    codelist: NY
    derivation: "Y" if any of CONMED1, CONMED3, MED1, MED2, MED3 is populated; else "N".

  AESTDTC:
    label: Start Date/Time of Adverse Event
    type: Char
    length: 10
    role: Timing
    core: Exp
    origin: CRF
    raw_item: AESTDAT
    source_form: "Adverse Event"
    derivation: Copied from AESTDAT (ISO 8601 yyyy-mm-dd).

  AEENDTC:
    label: End Date/Time of Adverse Event
    type: Char
    length: 10
    role: Timing
    core: Exp
    origin: CRF
    raw_item: AEENDDAT
    source_form: "Adverse Event"
    derivation: Copied from AEENDDAT; null when AEONGO = "Y".

  AEENRF:
    label: End Relative to Reference Period
    type: Char
    length: 10
    role: Timing
    core: Perm
    origin: Derived
    raw_item: AEONGO
    derivation: AEONGO = "Y" -> "ONGOING"; else null.

  AESTDY:
    label: Study Day of Start of Adverse Event
    type: Num
    length: 8
    role: Timing
    core: Perm
    origin: Derived
    derivation: as.integer(as.Date(AESTDTC) - as.Date(DM.RFSTDTC)) + ifelse(AESTDTC >= RFSTDTC, 1L, 0L). Skip day 0.

  AEENDY:
    label: Study Day of End of Adverse Event
    type: Num
    length: 8
    role: Timing
    core: Perm
    origin: Derived
    derivation: as.integer(as.Date(AEENDTC) - as.Date(DM.RFSTDTC)) + ifelse(AEENDTC >= RFSTDTC, 1L, 0L); null if AEENDTC null.

  VISITNUM:
    label: Visit Number
    type: Num
    length: 8
    role: Timing
    core: Perm
    origin: CRF
    derivation: From OpenClinica event for the AE record (studyeventoid).

  VISIT:
    label: Visit Name
    type: Char
    length: 40
    role: Timing
    core: Perm
    origin: CRF
    derivation: From OpenClinica event (eventname).
