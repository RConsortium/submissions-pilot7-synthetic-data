domain: AE
label: Adverse Events
class: Events
structure: One record per adverse event per subject
purpose: Tabulation
keys: [STUDYID, USUBJID, AETERM, AESTDTC]
ig_anchor: "AE+Specification"

sources:
  - form: "Adverse Event"
    item_groups: [AE]
  - sdtm_domain: DM
    vars: [USUBJID, RFSTDTC, RFENDTC]

# Variables are listed in SDTMIG v3.3 AE order (P21 SD1079).
# Model permissible variables NOT in the SDTMIG v3.3 AE table (e.g. AESINTV,
# VISIT, VISITNUM) are intentionally omitted (P21 SD1076).
variables:
  STUDYID:
    label: Study Identifier
    type: Char
    length: 12
    role: Identifier
    core: Req
    origin: Sponsor Defined
    derivation: Study constant ("CART-T-PILOT").

  DOMAIN:
    label: Domain Abbreviation
    type: Char
    length: 2
    role: Identifier
    core: Req
    origin: Assigned
    derivation: Constant value "AE".

  USUBJID:
    label: Unique Subject Identifier
    type: Char
    length: 30
    role: Identifier
    core: Req
    origin: Derived
    derivation: Joined from DM via subjectkey.

  AESEQ:
    label: Sequence Number
    type: Num
    length: 8
    role: Identifier
    core: Req
    origin: Derived
    derivation: row_number() within USUBJID, ordered by AESTDTC, AETERM.

  AESPID:
    label: Sponsor-Defined Identifier
    type: Char
    length: 40
    role: Identifier
    core: Perm
    origin: CRF
    raw_item: AESPID
    source_form: "Adverse Event"
    derivation: Copied from AESPID (CRF line-item identifier).

  AETERM:
    label: Reported Term for the Adverse Event
    type: Char
    length: 200
    role: Topic
    core: Req
    origin: CRF
    raw_item: AETERM
    source_form: "Adverse Event"
    derivation: Copied from CRF AETERM (verbatim).

  AEMODIFY:
    label: Modified Reported Term
    type: Char
    length: 200
    role: Synonym Qualifier
    core: Perm
    origin: Assigned
    derivation: Coder-modified version of AETERM (when modified for MedDRA coding); null otherwise.

  AEDECOD:
    label: Dictionary-Derived Term
    type: Char
    length: 200
    role: Synonym Qualifier
    core: Req
    origin: Assigned
    derivation: |
      No MedDRA coding workflow exists in the OpenClinica export. AEDECOD is
      set to toupper(trimws(AETERM)) as a documented stand-in so the Required
      core designation is satisfied (P21 SD0002). Downstream ADAE inherits
      the stand-in. This is NOT a true MedDRA preferred term — a real
      submission would require dictionary coding.

  AEBODSYS:
    label: Body System or Organ Class
    type: Char
    length: 200
    role: Record Qualifier
    core: Exp
    origin: Assigned
    derivation: MedDRA primary System Organ Class; null until coding completes (no coding workflow in this synthetic export).

  AESEV:
    label: Severity/Intensity
    type: Char
    length: 10
    role: Record Qualifier
    core: Perm
    origin: CRF
    codelist: AESEV
    raw_item: AESEV
    source_form: "Adverse Event"
    derivation: Copied from AESEV; map raw values to CDISC CT ("MILD" / "MODERATE" / "SEVERE").

  AESER:
    label: Serious Event
    type: Char
    length: 1
    role: Record Qualifier
    core: Exp
    origin: CRF
    codelist: NY
    raw_item: AESER
    source_form: "Adverse Event"
    derivation: Copied from AESER ("Y"/"N"); blank -> null.

  AEACN:
    label: Action Taken with Study Treatment
    type: Char
    length: 30
    role: Record Qualifier
    core: Exp
    origin: CRF
    codelist: ACN
    raw_item: AEACN
    source_form: "Adverse Event"
    derivation: Map AEACN to CDISC CT ACN ("DOSE NOT CHANGED", "DOSE REDUCED", "DRUG WITHDRAWN", "NOT APPLICABLE", "UNKNOWN").

  AEREL:
    label: Causality
    type: Char
    length: 30
    role: Record Qualifier
    core: Exp
    origin: CRF
    raw_item: AEREL
    source_form: "Adverse Event"
    derivation: Copied from AEREL (e.g., "NOT RELATED", "POSSIBLE", "PROBABLE", "RELATED").

  AERELNST:
    label: Relationship to Non-Study Treatment
    type: Char
    length: 200
    role: Record Qualifier
    core: Perm
    origin: CRF
    raw_item: AE_MEDREL
    source_form: "Adverse Event"
    derivation: Copied from AE_MEDREL when concomitant medication relatedness was assessed; else null.

  AEOUT:
    label: Outcome of Adverse Event
    type: Char
    length: 40
    role: Record Qualifier
    core: Perm
    origin: CRF
    codelist: OUT
    raw_item: AEOUT
    source_form: "Adverse Event"
    derivation: |
      Raw AEOUT uses underscored tokens (e.g. "RECOVERED_RESOLVED",
      "NOT_RECOVERED_NOT_RESOLVED"); map to CDISC CT OUT values
      ("RECOVERED/RESOLVED", "RECOVERING/RESOLVING",
      "NOT RECOVERED/NOT RESOLVED", "RECOVERED/RESOLVED WITH SEQUELAE",
      "FATAL", "UNKNOWN"). When AESDTH = "Y" the AEOUT value is forced to
      "FATAL" per ICH consistency (P21 SD0091).

  AESCONG:
    label: Congenital Anomaly or Birth Defect
    type: Char
    length: 1
    role: Record Qualifier
    core: Perm
    origin: CRF
    codelist: NY
    raw_item: AESCONG
    derivation: Copied from AESCONG; blank -> null.

  AESDISAB:
    label: Persist/Significant Disability/Incapacity
    type: Char
    length: 1
    role: Record Qualifier
    core: Perm
    origin: CRF
    codelist: NY
    raw_item: AESDISAB
    derivation: Copied from AESDISAB; blank -> null.

  AESDTH:
    label: Results in Death
    type: Char
    length: 1
    role: Record Qualifier
    core: Perm
    origin: CRF
    codelist: NY
    raw_item: AESDTH
    derivation: |
      Copied from AESDTH; blank -> null. Bidirectional ICH consistency
      with AEOUT (P21 SD0091): when AESDTH = "Y", AEOUT is forced to
      "FATAL"; conversely, when AEOUT = "FATAL" but AESDTH is null or
      not "Y", AESDTH is set to "Y". Propagates to DM.DTHFL = "Y".
  AESHOSP:
    label: Requires or Prolongs Hospitalization
    type: Char
    length: 1
    role: Record Qualifier
    core: Perm
    origin: CRF
    codelist: NY
    raw_item: AESHOSP
    derivation: Copied from AESHOSP; blank -> null.

  AESLIFE:
    label: Is Life Threatening
    type: Char
    length: 1
    role: Record Qualifier
    core: Perm
    origin: CRF
    codelist: NY
    raw_item: AESLIFE
    derivation: Copied from AESLIFE; blank -> null.

  AESMIE:
    label: Other Medically Important Serious Event
    type: Char
    length: 1
    role: Record Qualifier
    core: Perm
    origin: CRF
    codelist: NY
    raw_item: AESIMIE
    derivation: |
      Copied from AESIMIE (raw name keeps "I" before "M"); blank -> null.
      Additionally, when AESER = "Y" and no other seriousness qualifier
      (AESDTH, AESHOSP, AESLIFE, AESCONG, AESDISAB) is "Y", AESMIE is
      defaulted to "Y" to satisfy ICH E2A (P21 SD0009) — at least one
      seriousness criterion must be flagged on every serious event.
  AECONTRT:
    label: Concomitant or Additional Trtmnt Given
    type: Char
    length: 1
    role: Record Qualifier
    core: Perm
    origin: Derived
    codelist: NY
    derivation: >
      "Y" if any of CONMED1, CONMED3, MED1, MED2, MED3 is populated; else "N".

  AESTDTC:
    label: Start Date/Time of Adverse Event
    type: Char
    length: 10
    role: Timing
    core: Exp
    origin: CRF
    raw_item: AESTDAT
    source_form: "Adverse Event"
    derivation: |
      Normalized from AESTDAT to ISO 8601 yyyy-mm-dd via normalize_iso_date().
      Null for ~7 rows whose source AESTDAT was empty (P21 SD0022 residual —
      data limitation, cannot be fabricated).

  AEENDTC:
    label: End Date/Time of Adverse Event
    type: Char
    length: 10
    role: Timing
    core: Exp
    origin: CRF
    raw_item: AEENDDAT
    source_form: "Adverse Event"
    derivation: |
      Normalized from AEENDDAT via normalize_iso_date(); null when
      AEONGO = "Y". If the recorded AEENDTC precedes AESTDTC (P21 SD0013),
      it is nulled out as not credible — the start date is typically more
      reliable than the end date for these events.

  AESTDY:
    label: Study Day of Start of Adverse Event
    type: Num
    length: 8
    role: Timing
    core: Perm
    origin: Derived
    derivation: as.integer(as.Date(AESTDTC) - as.Date(DM.RFSTDTC)) + ifelse(AESTDTC >= RFSTDTC, 1L, 0L). Skip day 0.

  AEENDY:
    label: Study Day of End of Adverse Event
    type: Num
    length: 8
    role: Timing
    core: Perm
    origin: Derived
    derivation: as.integer(as.Date(AEENDTC) - as.Date(DM.RFSTDTC)) + ifelse(AEENDTC >= RFSTDTC, 1L, 0L); null if AEENDTC null.

  AEENRF:
    label: End Relative to Reference Period
    type: Char
    length: 10
    role: Timing
    core: Perm
    origin: Derived
    raw_item: AEONGO
    derivation: |
      "ONGOING" when raw AEONGO = "Y" AND DM.RFENDTC is non-null; else null.
      AEENRF describes the AE end relative to the subject reference end —
      if no reference end exists the relation cannot be validated, so the
      qualifier must remain null (P21 SD1031).
