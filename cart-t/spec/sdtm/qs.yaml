domain: QS
label: Questionnaires
class: Findings
structure: One record per questionnaire item per timepoint per subject
purpose: Tabulation
keys: [STUDYID, USUBJID, QSCAT, QSTESTCD, VISITNUM, QSDTC]
ig_anchor: "QS+Specification"

sources:
  - form: "RAND SF-12 Survey"
    item_groups: [G, G1, G2AND3, G4AND5, G6AND7, G9TO11, c]
    notes: |
      G, G1, G2AND3, G4AND5, G6AND7, G9TO11 hold the raw item responses
      (Q1..Q12). Item group "c" holds the validated / recoded item values
      (Q1V..Q12V) and the subscale scores (BP, GH, VT, SF) plus subscale
      score components (PF-A/PF-S, RP-A/RP-S, RE-A/RE-S, ME-A/ME-S). The
      composite subscale codes PF/RP/RE/ME are NOT present in the raw
      export — only their A/S components are — so QS emits only the
      BP/GH/VT/SF subscale rows alongside the 12 item rows.
  - sdtm_domain: DM
    vars: [RFSTDTC, RFENDTC]
    notes: |
      Used to derive EPOCH (SCREENING vs TREATMENT vs FOLLOW-UP) and
      QSDY (study day relative to RFSTDTC).

question_map:
  raw_items:
    Q1:  {QSTESTCD: SF1201, QSTEST: "General Health"}
    Q2:  {QSTESTCD: SF1202, QSTEST: "Moderate Activities"}
    Q3:  {QSTESTCD: SF1203, QSTEST: "Climb Several Flights"}
    Q4:  {QSTESTCD: SF1204, QSTEST: "Accomplished Less - Physical"}
    Q5:  {QSTESTCD: SF1205, QSTEST: "Limited in Kind - Physical"}
    Q6:  {QSTESTCD: SF1206, QSTEST: "Accomplished Less - Emotional"}
    Q7:  {QSTESTCD: SF1207, QSTEST: "Less Careful - Emotional"}
    Q8:  {QSTESTCD: SF1208, QSTEST: "Pain Interfered"}
    Q9:  {QSTESTCD: SF1209, QSTEST: "Calm and Peaceful"}
    Q10: {QSTESTCD: SF1210, QSTEST: "Energy"}
    Q11: {QSTESTCD: SF1211, QSTEST: "Felt Downhearted"}
    Q12: {QSTESTCD: SF1212, QSTEST: "Social Interference"}
  subscale_scores:
    PF:  {QSTESTCD: SF12PF, QSTEST: "Physical Functioning Score"}
    RP:  {QSTESTCD: SF12RP, QSTEST: "Role Physical Score"}
    BP:  {QSTESTCD: SF12BP, QSTEST: "Bodily Pain Score"}
    GH:  {QSTESTCD: SF12GH, QSTEST: "General Health Score"}
    VT:  {QSTESTCD: SF12VT, QSTEST: "Vitality Score"}
    SF:  {QSTESTCD: SF12SF, QSTEST: "Social Functioning Score"}
    RE:  {QSTESTCD: SF12RE, QSTEST: "Role Emotional Score"}
    ME:  {QSTESTCD: SF12MH, QSTEST: "Mental Health Score"}

variables:
  STUDYID:
    label: Study Identifier
    type: Char
    length: 12
    role: Identifier
    core: Req
    origin: Sponsor Defined
    derivation: Study constant ("CART-T-PILOT").

  DOMAIN:
    label: Domain Abbreviation
    type: Char
    length: 2
    role: Identifier
    core: Req
    origin: Assigned
    derivation: Constant value "QS".

  USUBJID:
    label: Unique Subject Identifier
    type: Char
    length: 30
    role: Identifier
    core: Req
    origin: Derived
    derivation: Joined from DM via subjectkey.

  QSSEQ:
    label: Sequence Number
    type: Num
    length: 8
    role: Identifier
    core: Req
    origin: Derived
    derivation: row_number() within USUBJID, ordered by VISITNUM, QSCAT, QSTESTCD.

  QSTESTCD:
    label: Questionnaire Short Name
    type: Char
    length: 8
    role: Topic
    core: Req
    origin: Assigned
    codelist: QSTESTCD
    derivation: |
      CDISC SF-12 v1 canonical pair (QSCAT="SF12"). Mapped from raw `itemname`
      via question_map. Items SF1201..SF1212; subscales SF12PF/RP/BP/GH/VT/SF/RE/MH.

  QSTEST:
    label: Questionnaire Name
    type: Char
    length: 40
    role: Synonym Qualifier
    core: Req
    origin: Assigned
    codelist: QSTEST
    derivation: |
      CDISC SF-12 v1 canonical short label, all ≤ 40 chars. No "SF-12 Qnn -"
      prefix. Looked up alongside QSTESTCD from question_map.

  QSCAT:
    label: Category for Questionnaire
    type: Char
    length: 40
    role: Grouping Qualifier
    core: Req
    origin: Assigned
    codelist: QSCAT
    derivation: |
      Constant "SF12" — CDISC controlled value for SF-12 v1 (no dash).
      P21 CT2002: the "Category of Questionnaire" extensible codelist
      contains "SF12", not "SF-12".

  QSSCAT:
    label: Subcategory for Questionnaire
    type: Char
    length: 40
    role: Grouping Qualifier
    core: Perm
    origin: Assigned
    derivation: |
      "ITEM"     for QSTESTCD in SF1201..SF1212.
      "SUBSCALE" for QSTESTCD in SF12BP / SF12GH / SF12VT / SF12SF
                 (the only subscales present in this export).

  QSORRES:
    label: Result or Finding in Original Units
    type: Char
    length: 200
    role: Result Qualifier
    core: Exp
    origin: CRF
    derivation: as.character(value) from raw form for the row's itemname.

  QSORRESU:
    label: Original Units
    type: Char
    length: 40
    role: Variable Qualifier
    core: Perm
    origin: Assigned
    codelist: UNIT
    derivation: |
      Null. SF-12 item responses are coded categorical values (no unit) and
      SF-12 subscale scores are unitless on a 0-100 scale. P21 CT2002: "SCORE"
      is not in the CDISC Unit codelist, so QSORRESU is left blank.

  QSSTRESC:
    label: Character Result/Finding in Std Format
    type: Char
    length: 200
    role: Result Qualifier
    core: Req
    origin: Derived
    derivation: as.character(QSSTRESN) when numeric; otherwise QSORRES.

  QSSTRESN:
    label: Numeric Finding in Standard Units
    type: Num
    length: 8
    role: Result Qualifier
    core: Exp
    origin: Derived
    derivation: |
      suppressWarnings(as.numeric(QSORRES)). NA when QSORRES non-numeric.
      Subscale scores are copied directly from raw (item group "c"); they are
      NOT recomputed from items Q1..Q12. Recomputing per the published
      SF-12v1 / v2 algorithm is a separable follow-up task.

  QSSTRESU:
    label: Standard Units
    type: Char
    length: 40
    role: Variable Qualifier
    core: Perm
    origin: Assigned
    codelist: UNIT
    derivation: |
      Null (same as QSORRESU). P21 CT2002: "SCORE" is not in the CDISC
      Unit codelist.

  QSBLFL:
    label: Baseline Flag
    type: Char
    length: 1
    role: Record Qualifier
    core: Perm
    origin: Derived
    codelist: NY
    derivation: |
      "Y" on records whose QSDTC is the earliest SF-12 administration for
      the subject and QSTESTCD. The SF-12 form is administered once in this
      pilot, so every record qualifies.

  EPOCH:
    label: Epoch
    type: Char
    length: 40
    role: Timing
    core: Perm
    origin: Derived
    codelist: EPOCH
    derivation: |
      Derived from QSDTC vs DM.RFSTDTC / DM.RFENDTC, mirroring CE / DS:
        QSDTC < RFSTDTC                 -> "SCREENING"
        RFSTDTC <= QSDTC <= RFENDTC     -> "TREATMENT"
        QSDTC > RFENDTC                 -> "FOLLOW-UP"
        any RFSTDTC missing             -> null.

  VISITNUM:
    label: Visit Number
    type: Num
    length: 8
    role: Timing
    core: Req
    origin: CRF
    derivation: From OpenClinica event (studyeventoid) via derive_visitnum() — always 7 (SE_QUALITYOFLIFE).

  VISIT:
    label: Visit Name
    type: Char
    length: 40
    role: Timing
    core: Perm
    origin: CRF
    derivation: From OpenClinica eventname.

  QSDTC:
    label: Date/Time of Finding
    type: Char
    length: 19
    role: Timing
    core: Exp
    origin: CRF
    raw_column: startdate
    derivation: |
      normalize_iso_date(substr(startdate, 1, 10)) on the SF-12 form startdate.
      Raw values are a mix of ISO date ("2024-09-12") and ISO datetime
      ("2022-10-20T10:47:00"); only the date portion is retained.

  QSDY:
    label: Study Day of Finding
    type: Num
    length: 8
    role: Timing
    core: Perm
    origin: Derived
    derivation: |
      as.integer(as.Date(QSDTC) - as.Date(DM.RFSTDTC)) +
      ifelse(QSDTC >= RFSTDTC, 1L, 0L). Skip day 0. Null when either
      QSDTC or DM.RFSTDTC is missing.
