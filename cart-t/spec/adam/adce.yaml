dataset: ADCE
label: Clinical Events Analysis Dataset
structure: OCCDS - One record per clinical event per subject
purpose: Analysis
keys: [STUDYID, USUBJID, CESEQ]
ig_reference: "OCCDS IG v1.1; ADaM Oncology Examples"

sources:
  - sdtm_domain: CE
    notes: Suspected MI events in this pilot.
  - sdtm_domain: ADSL

variables:
  STUDYID:
    label: Study Identifier
    type: Char
    length: 12
    role: Identifier
    core: Req
    origin: Predecessor
    derivation: CE.STUDYID.

  USUBJID:
    label: Unique Subject Identifier
    type: Char
    length: 30
    role: Identifier
    core: Req
    origin: Predecessor
    derivation: CE.USUBJID.

  SUBJID:
    label: Subject Identifier for the Study
    type: Char
    length: 10
    role: Identifier
    core: Req
    origin: Predecessor
    derivation: ADSL.SUBJID via merge.

  SITEID:
    label: Study Site Identifier
    type: Char
    length: 8
    role: Identifier
    core: Req
    origin: Predecessor
    derivation: ADSL.SITEID via merge.

  AGE:
    label: Age
    type: Num
    length: 8
    role: Covariate
    core: Req
    origin: Predecessor
    derivation: ADSL.AGE.

  SEX:
    label: Sex
    type: Char
    length: 1
    role: Covariate
    core: Req
    origin: Predecessor
    derivation: ADSL.SEX.

  RACE:
    label: Race
    type: Char
    length: 40
    role: Covariate
    core: Req
    origin: Predecessor
    derivation: ADSL.RACE.

  STRAT1:
    label: Phenotype Stratification Code
    type: Char
    length: 8
    role: Stratification
    core: Perm
    origin: Predecessor
    derivation: ADSL.STRAT1.

  TRT01P:
    label: Planned Treatment for Period 01
    type: Char
    length: 40
    role: Treatment
    core: Req
    origin: Predecessor
    derivation: ADSL.TRT01P.

  TRT01A:
    label: Actual Treatment for Period 01
    type: Char
    length: 40
    role: Treatment
    core: Req
    origin: Predecessor
    derivation: ADSL.TRT01A.

  CESEQ:
    label: Sequence Number
    type: Num
    length: 8
    role: Identifier
    core: Req
    origin: Predecessor
    derivation: CE.CESEQ.

  CETERM:
    label: Reported Term for the Clinical Event
    type: Char
    length: 200
    role: Topic
    core: Req
    origin: Predecessor
    derivation: CE.CETERM.

  # CEDECOD intentionally omitted — CE.CEDECOD is dropped from the SDTM build
  # (P21 SD1078: all-null permissible variable). A real submission with
  # MedDRA coding would add CEDECOD back in both CE and ADCE.

  CECAT:
    label: Category for Clinical Event
    type: Char
    length: 40
    role: Grouping Qualifier
    core: Req
    origin: Predecessor
    derivation: CE.CECAT.

  CESER:
    label: Serious Event
    type: Char
    length: 1
    role: Record Qualifier
    core: Exp
    origin: Predecessor
    derivation: CE.CESER.

  CEPRESP:
    label: Clinical Event Pre-Specified
    type: Char
    length: 1
    role: Variable Qualifier
    core: Exp
    origin: Predecessor
    derivation: CE.CEPRESP.

  CEOCCUR:
    label: Clinical Event Occurrence
    type: Char
    length: 1
    role: Record Qualifier
    core: Exp
    origin: Predecessor
    derivation: CE.CEOCCUR.

  ASTDT:
    label: Analysis Start Date
    type: Num
    length: 8
    role: Timing
    core: Exp
    origin: Derived
    derivation: as.Date(CE.CESTDTC). Via admiral::derive_vars_dt().

  ASTDY:
    label: Analysis Start Relative Day
    type: Num
    length: 8
    role: Timing
    core: Perm
    origin: Derived
    derivation: as.integer(ASTDT - ADSL.TRTSDT) + ifelse(ASTDT >= ADSL.TRTSDT, 1L, 0L). Skip day 0.

  AOCCFL:
    label: First Occurrence within Subject Flag
    type: Char
    length: 1
    role: Analysis Flag
    core: Exp
    origin: Derived
    codelist: NY
    derivation: |
      "Y" on the row with the earliest ASTDT per USUBJID; via
      admiral::derive_var_extreme_flag().

  SAFFL:
    label: Safety Population Flag
    type: Char
    length: 1
    role: Population Flag
    core: Req
    origin: Predecessor
    derivation: ADSL.SAFFL.

  ANL01FL:
    label: Analysis Record Flag 01
    type: Char
    length: 1
    role: Analysis Flag
    core: Exp
    origin: Derived
    codelist: NY
    derivation: |
      "Y" when SAFFL = "Y"; else null.
