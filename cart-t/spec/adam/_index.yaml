# Index of ADaM dataset specs for the CAR-T pilot study.
# Anchored to ADaMIG v1.3 / ADaM v2.1 / OCCDS IG v1.1
# (see ../ig/knowledge_adam_ig.md).

study:
  id: CART-T-PILOT
  source_sdtm: data/sdtm/
  adam_ig_version: "1.3"
  adam_model_version: "2.1"
  occds_ig_version: "1.1"

datasets:
  - name: ADSL
    label: Subject-Level Analysis Dataset
    structure: One record per subject
    spec: adsl.yaml
    sources: [DM, DS, EX(planned)]
    notes: Mandatory dataset; defines populations, treatment, key dates.

  - name: ADAE
    label: Adverse Events Analysis Dataset
    structure: OCCDS - One record per AE per subject
    spec: adae.yaml
    sources: [AE, ADSL]

  - name: ADCM
    label: Concomitant Medications Analysis Dataset
    structure: OCCDS - One record per ConMed per subject
    spec: adcm.yaml
    sources: [CM, ADSL]

  - name: ADLB
    label: Laboratory Analysis Dataset
    structure: BDS - One record per parameter per analysis timepoint per subject
    spec: adlb.yaml
    sources: [LB, ADSL]

  - name: ADQS
    label: Questionnaire (SF-12) Analysis Dataset
    structure: BDS - One record per item or subscale per analysis timepoint per subject
    spec: adqs.yaml
    sources: [QS, ADSL]

  - name: ADMH
    label: Medical History Analysis Dataset
    structure: OCCDS - One record per MH event per subject
    spec: admh.yaml
    sources: [MH, ADSL]

  - name: ADDS
    label: Disposition Analysis Dataset
    structure: OCCDS - One record per disposition event per subject
    spec: adds.yaml
    sources: [DS, ADSL]

  - name: ADIE
    label: Inclusion/Exclusion Not Met Analysis Dataset
    structure: OCCDS - One record per failed I/E criterion per subject
    spec: adie.yaml
    sources: [IE, ADSL]

  - name: ADCE
    label: Clinical Events Analysis Dataset
    structure: OCCDS - One record per clinical event per subject
    spec: adce.yaml
    sources: [CE, ADSL]
