yamaa: '1.0'
type: spec
model: ADaM
domain: ADLB
keys:
- STUDYID
- USUBJID
- ASEQ
input:
  ADSL:
    path: ../../../data/adam/adsl-yamaa.parquet
    schema: ../adam/adsl.yaml
    key:
    - USUBJID
  LB:
    path: ../../../data/sdtm/lb.parquet
    schema: ../sdtm/lb.yaml
base: LB

output:
  path: ../../../data/adam/adlb-yamaa.parquet
  columns:
  - STUDYID
  - USUBJID
  - LBSEQ
  - LBSPID
  - SUBJID
  - SITEID
  - AGE
  - AGEGR1
  - SEX
  - RACE
  - STRAT1
  - STRAT1L
  - TRT01P
  - TRT01PN
  - TRT01A
  - TRT01AN
  - TRTSDT
  - TRTEDT
  - RANDFL
  - ITTCAND
  - SAFFL
  - EFFFL
  - ASEQ
  - PARAMCD
  - PARAM
  - PARAMN
  - PARCAT1
  - AVAL
  - AVALC
  - AVALU
  - ADT
  - ADY
  - AVISIT
  - AVISITN
  - ABLFL
  - BASE
  - CHG
  - PCHG
  - ANL01FL
  - SRCDOM
  - SRCVAR
  - SRCSEQ
  report: ../../../log/adlb-report.parquet
  order_by:
  - variable: STUDYID
    nulls: last
  - variable: USUBJID
    nulls: last
  - variable: ASEQ
    nulls: last

columns:
- name: STUDYID
  type: str
  label: Study Identifier
  derivation: LB.STUDYID
  verifications:
  - max_length:
      max: 12
  submission:
    length: 12
    origins:
    - type: Predecessor
      description: LB.STUDYID
    core: Req
    mandatory: true
    data_type: text
    key_sequence: 1

- name: USUBJID
  type: str
  label: Unique Subject Identifier
  derivation: LB.USUBJID
  verifications:
  - max_length:
      max: 80
  submission:
    length: 80
    origins:
    - type: Predecessor
      description: LB.USUBJID
    core: Req
    mandatory: true
    data_type: text
    key_sequence: 2

- copy:
    dataset: LB
    columns:
    - LBSEQ
    - LBSPID
    submission:
      core: Perm
      mandatory: false

- copy:
    dataset: ADSL
    columns:
    - SUBJID
    - SITEID
    - AGE
    - SEX
    - RACE
    - TRT01P
    - TRT01A
    - SAFFL
    submission:
      core: Req
      mandatory: false

- copy:
    dataset: ADSL
    columns:
    - AGEGR1
    - STRAT1
    - STRAT1L
    - TRT01PN
    - TRT01AN
    - RANDFL
    - ITTCAND
    - EFFFL
    submission:
      core: Perm
      mandatory: false

- name: TRTSDT
  type: date
  label: Date of First Exposure to Treatment
  derivation: ADSL.TRTSDT
  submission:
    core: Perm
    mandatory: false
    data_type: integer
    length: 8
    display_format: DATE9.
    origins:
    - type: Predecessor
      description: ADSL.TRTSDT

- name: TRTEDT
  type: date
  label: Date of Last Exposure to Treatment
  derivation: ADSL.TRTEDT
  submission:
    core: Perm
    mandatory: false
    data_type: integer
    length: 8
    display_format: DATE9.
    origins:
    - type: Predecessor
      description: ADSL.TRTEDT

- name: ASEQ
  type: int
  label: Analysis Sequence Number
  derivation: LB.LBSEQ
  submission:
    origins:
    - type: Predecessor
      description: LB.LBSEQ
    core: Req
    mandatory: true
    data_type: integer
    length: 8
    key_sequence: 3

- name: PARAMCD
  type: str
  label: Parameter Code
  derivation: LB.LBTESTCD
  verifications:
  - max_length:
      max: 8
  submission:
    length: 8
    origins:
    - type: Predecessor
      description: LB.LBTESTCD
    core: Req
    mandatory: false
    data_type: text

- name: PARAM
  type: str
  label: Parameter
  derivation: LB.LBTEST
  verifications:
  - max_length:
      max: 80
  submission:
    length: 80
    origins:
    - type: Predecessor
      description: LB.LBTEST
    core: Req
    mandatory: false
    data_type: text

- name: PARAMN
  type: int
  label: Parameter (N)
  derivation:
    mapping:
      source: PARAMCD
      dict:
        AMYLASE: 1
        UREAN: 2
        CL: 3
        HOMOCY: 4
        CREAT: 5
        GFR: 6
        CHOL: 7
        TRIG: 8
        HCT: 9
        HGB: 10
        RBC: 11
        WBC: 12
      unmapped: null
  submission:
    origins:
    - type: Derived
    method: Fixed parameter order from the study mapping, independent
      of subject or observed test subset.
    comment: Fixed parameter order from the study mapping, independent
      of subject or observed test subset.
    core: Perm
    mandatory: false
    data_type: integer
    length: 8

- name: PARCAT1
  type: str
  label: Parameter Category 1
  derivation: LB.LBCAT
  verifications:
  - max_length:
      max: 40
  submission:
    length: 40
    origins:
    - type: Predecessor
      description: LB.LBCAT
    core: Cond
    mandatory: false
    data_type: text

- name: AVAL
  type: float
  label: Analysis Value
  derivation: LB.LBSTRESN
  submission:
    significant_digits: 6
    origins:
    - type: Predecessor
      description: LB.LBSTRESN
    core: Cond
    mandatory: false
    data_type: float
    length: 8

- name: AVALC
  type: str
  label: Analysis Value (C)
  derivation: LB.LBSTRESC
  verifications:
  - max_length:
      max: 80
  submission:
    length: 80
    origins:
    - type: Predecessor
      description: LB.LBSTRESC
    core: Perm
    mandatory: false
    data_type: text

- name: AVALU
  type: str
  label: Analysis Value Unit
  derivation: LB.LBSTRESU
  verifications:
  - max_length:
      max: 40
  submission:
    length: 40
    origins:
    - type: Predecessor
      description: LB.LBSTRESU
    core: Perm
    mandatory: false
    data_type: text

- name: ADT
  type: date
  label: Analysis Date
  derivation:
    impute:
      type: date
      source: LB.LBDTC
      invalid: null
  submission:
    origins:
    - type: Derived
    method: Only full valid dates become analysis dates. Partial
      dates are retained in the SDTM source; no date imputation
      is authorized.
    comment: Only full valid dates become analysis dates. Partial
      dates are retained in the SDTM source; no date imputation
      is authorized.
    core: Cond
    mandatory: false
    data_type: integer
    length: 8
    display_format: DATE9.

- name: ADY
  type: int
  label: Analysis Relative Day
  derivation:
    study_day:
      source: ADT
      reference: TRTSDT
  submission:
    origins:
    - type: Derived
    method: |-
      Executable yamaa derivation: study_day:
        source: ADT
        reference: TRTSDT
    core: Perm
    mandatory: false
    data_type: integer
    length: 8

- name: AVISIT
  type: str
  label: Analysis Visit
  derivation: LB.VISIT
  verifications:
  - max_length:
      max: 80
  submission:
    length: 80
    origins:
    - type: Predecessor
      description: LB.VISIT
    core: Cond
    mandatory: false
    data_type: text

- name: AVISITN
  type: int
  label: Analysis Visit (N)
  derivation: null
  submission:
    origins:
    - type: Derived
    comment: No approved nominal visit windows; event-type order
      is not a visit schedule.
    core: Cond
    mandatory: false
    data_type: integer
    length: 8
    method: No approved nominal visit windows; event-type order
      is not a visit schedule.

- name: ABLFL
  type: str
  label: Baseline Record Flag
  derivation: null
  verifications:
  - max_length:
      max: 1
  - allowed_values:
      values:
      - N
      - Y
  submission:
    length: 1
    origins:
    - type: Derived
    comment: No exposure reference or approved alternative baseline.
      Administrative Baseline form labels do not establish analysis
      baseline.
    core: Cond
    mandatory: false
    data_type: text
    method: No exposure reference or approved alternative baseline.
      Administrative Baseline form labels do not establish analysis
      baseline.
    codelist: NY

- name: BASE
  type: float
  label: Baseline Value
  derivation: null
  submission:
    significant_digits: 6
    origins:
    - type: Derived
    comment: Not derived until a baseline definition is approved
      and a valid baseline exists.
    core: Cond
    mandatory: false
    data_type: float
    length: 8
    method: Not derived until a baseline definition is approved
      and a valid baseline exists.

- name: CHG
  type: float
  label: Change from Baseline
  derivation: null
  submission:
    significant_digits: 6
    origins:
    - type: Derived
    comment: Not derived until a baseline definition is approved
      and a valid baseline exists.
    core: Cond
    mandatory: false
    data_type: float
    length: 8
    method: Not derived until a baseline definition is approved
      and a valid baseline exists.

- name: PCHG
  type: float
  label: Percent Change from Baseline
  derivation: null
  submission:
    significant_digits: 6
    origins:
    - type: Derived
    comment: Not derived until a baseline definition is approved
      and a valid baseline exists.
    core: Cond
    mandatory: false
    data_type: float
    length: 8
    method: Not derived until a baseline definition is approved
      and a valid baseline exists.

- name: ANL01FL
  type: str
  label: Analysis Record Flag 01
  derivation: null
  verifications:
  - max_length:
      max: 1
  - allowed_values:
      values:
      - N
      - Y
  submission:
    length: 1
    origins:
    - type: Derived
    comment: No approved selection rule. Questionnaire subscales
      are copied source scores, not validated recomputations.
    core: Cond
    mandatory: false
    data_type: text
    method: No approved selection rule. Questionnaire subscales
      are copied source scores, not validated recomputations.
    codelist: NY

- name: SRCDOM
  type: str
  label: Source Domain
  derivation: '''LB'''
  verifications:
  - max_length:
      max: 2
  submission:
    length: 2
    origins:
    - type: Assigned
    core: Perm
    mandatory: false
    data_type: text

- name: SRCVAR
  type: str
  label: Source Variable
  derivation: '''LBSTRESN'''
  verifications:
  - max_length:
      max: 8
  submission:
    length: 8
    origins:
    - type: Assigned
    core: Perm
    mandatory: false
    data_type: text

- name: SRCSEQ
  type: int
  label: Source Sequence Number
  derivation: LB.LBSEQ
  submission:
    origins:
    - type: Predecessor
      description: LB.LBSEQ
    core: Perm
    mandatory: false
    data_type: integer
    length: 8

submission:
  label: Laboratory Analysis
  class: BASIC DATA STRUCTURE
  structure: One record per source observation per subject
  repeating: true
  mode: historical
  artifact: adlb.xpt
  comment: Review draft metadata. Historical mode keeps declarations
    separate from incomplete data; this is not a validated submission.
    See spec/review/decisions.md.
