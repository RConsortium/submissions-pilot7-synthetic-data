yamaa: '1.0'
type: spec
model: ADaM
domain: ADAE
keys:
- STUDYID
- USUBJID
- ASEQ
input:
  ADSL:
    path: ../../../data/adam/adsl-yamaa.parquet
    schema: ../adam/adsl.yaml
    key:
    - USUBJID
  AE:
    path: ../../../data/sdtm/ae.parquet
    schema: ../sdtm/ae.yaml
base: AE

output:
  path: ../../../data/adam/adae-yamaa.parquet
  columns:
  - STUDYID
  - USUBJID
  - AESEQ
  - AESPID
  - AETERM
  - AEDECOD
  - AEBODSYS
  - AESEV
  - AESER
  - AEACN
  - AEREL
  - AESCONG
  - AESDISAB
  - AESDTH
  - AESHOSP
  - AESLIFE
  - AESMIE
  - AEOUT
  - AESTDTC
  - AEENDTC
  - AEENRTPT
  - AEENTPT
  - VISIT
  - SUBJID
  - SITEID
  - AGE
  - AGEGR1
  - SEX
  - RACE
  - STRAT1
  - STRAT1L
  - TRT01P
  - TRT01PN
  - TRT01A
  - TRT01AN
  - TRTSDT
  - TRTEDT
  - RANDFL
  - ITTCAND
  - SAFFL
  - EFFFL
  - ASEQ
  - ASTDT
  - AENDT
  - ASTDY
  - AENDY
  - TRTP
  - TRTA
  - SRCDOM
  - SRCSEQ
  - SRCVAR
  - ADURN
  - ADURU
  - ASEV
  - AESEVN
  - AREL
  - TRTEMFL
  - ANL01FL
  report: ../../../log/adae-report.parquet
  order_by:
  - variable: STUDYID
    nulls: last
  - variable: USUBJID
    nulls: last
  - variable: ASEQ
    nulls: last

columns:
- name: STUDYID
  type: str
  label: Study Identifier
  derivation: AE.STUDYID
  verifications:
  - max_length:
      max: 12
  submission:
    length: 12
    origins:
    - type: Predecessor
      description: AE.STUDYID
    core: Req
    mandatory: true
    data_type: text
    key_sequence: 1

- name: USUBJID
  type: str
  label: Unique Subject Identifier
  derivation: AE.USUBJID
  verifications:
  - max_length:
      max: 80
  submission:
    length: 80
    origins:
    - type: Predecessor
      description: AE.USUBJID
    core: Req
    mandatory: true
    data_type: text
    key_sequence: 2

- copy:
    dataset: AE
    columns:
    - AESEQ
    - AETERM
    submission:
      core: Req
      mandatory: false

- copy:
    dataset: AE
    columns:
    - AESPID
    - AEACN
    - AESCONG
    - AESDISAB
    - AESDTH
    - AESHOSP
    - AESLIFE
    - AESMIE
    - AEENRTPT
    - AEENTPT
    - VISIT
    submission:
      core: Perm
      mandatory: false

- copy:
    dataset: AE
    columns:
    - AEDECOD
    - AEBODSYS
    - AESEV
    - AESER
    - AEREL
    - AEOUT
    - AESTDTC
    - AEENDTC
    submission:
      core: Cond
      mandatory: false

- copy:
    dataset: ADSL
    columns:
    - SUBJID
    - SITEID
    - AGE
    - SEX
    - RACE
    - TRT01P
    - TRT01PN
    - TRT01A
    - TRT01AN
    - RANDFL
    - SAFFL
    submission:
      core: Req
      mandatory: false

- name: TRTSDT
  type: date
  label: Date of First Exposure to Treatment
  derivation: ADSL.TRTSDT
  submission:
    core: Req
    mandatory: false
    data_type: integer
    length: 8
    display_format: DATE9.
    origins:
    - type: Predecessor
      description: ADSL.TRTSDT

- name: TRTEDT
  type: date
  label: Date of Last Exposure to Treatment
  derivation: ADSL.TRTEDT
  submission:
    core: Req
    mandatory: false
    data_type: integer
    length: 8
    display_format: DATE9.
    origins:
    - type: Predecessor
      description: ADSL.TRTEDT

- copy:
    dataset: ADSL
    columns:
    - AGEGR1
    - STRAT1
    - STRAT1L
    - ITTCAND
    - EFFFL
    submission:
      core: Perm
      mandatory: false

- name: ASEQ
  type: int
  label: Analysis Sequence Number
  derivation: AE.AESEQ
  submission:
    origins:
    - type: Predecessor
      description: AE.AESEQ
    core: Req
    mandatory: true
    data_type: integer
    length: 8
    key_sequence: 3

- name: ASTDT
  type: date
  label: Analysis Start Date
  derivation:
    impute:
      type: date
      source: AE.AESTDTC
      invalid: null
  submission:
    origins:
    - type: Derived
    method: |-
      Executable yamaa derivation: impute:
        type: date
        source: AE.AESTDTC
        invalid: null
    core: Cond
    mandatory: false
    data_type: integer
    length: 8
    display_format: DATE9.

- name: AENDT
  type: date
  label: Analysis End Date
  derivation:
    impute:
      type: date
      source: AE.AEENDTC
      invalid: null
  submission:
    origins:
    - type: Derived
    method: |-
      Executable yamaa derivation: impute:
        type: date
        source: AE.AEENDTC
        invalid: null
    core: Cond
    mandatory: false
    data_type: integer
    length: 8
    display_format: DATE9.

- name: ASTDY
  type: int
  label: Analysis Start Relative Day
  derivation:
    study_day:
      source: ASTDT
      reference: TRTSDT
  submission:
    origins:
    - type: Derived
    method: |-
      Executable yamaa derivation: study_day:
        source: ASTDT
        reference: TRTSDT
    core: Perm
    mandatory: false
    data_type: integer
    length: 8

- name: AENDY
  type: int
  label: Analysis End Relative Day
  derivation:
    study_day:
      source: AENDT
      reference: TRTSDT
  submission:
    origins:
    - type: Derived
    method: |-
      Executable yamaa derivation: study_day:
        source: AENDT
        reference: TRTSDT
    core: Perm
    mandatory: false
    data_type: integer
    length: 8

- name: TRTP
  type: str
  label: Planned Treatment
  derivation: TRT01P
  verifications:
  - max_length:
      max: 40
  submission:
    length: 40
    origins:
    - type: Derived
    method: |-
      Executable yamaa derivation: TRT01P
      ...
    core: Req
    mandatory: false
    data_type: text

- name: TRTA
  type: str
  label: Actual Treatment
  derivation: TRT01A
  verifications:
  - max_length:
      max: 40
  submission:
    length: 40
    origins:
    - type: Derived
    method: |-
      Executable yamaa derivation: TRT01A
      ...
    core: Req
    mandatory: false
    data_type: text

- name: SRCDOM
  type: str
  label: Source Domain
  derivation: '''AE'''
  verifications:
  - max_length:
      max: 2
  submission:
    length: 2
    origins:
    - type: Assigned
    core: Perm
    mandatory: false
    data_type: text

- name: SRCSEQ
  type: int
  label: Source Sequence Number
  derivation: AE.AESEQ
  submission:
    origins:
    - type: Predecessor
      description: AE.AESEQ
    core: Perm
    mandatory: false
    data_type: integer
    length: 8

- name: SRCVAR
  type: str
  label: Source Variable
  derivation: '''AETERM'''
  verifications:
  - max_length:
      max: 8
  submission:
    length: 8
    origins:
    - type: Assigned
    core: Perm
    mandatory: false
    data_type: text

- name: DAYS
  type: int
  label: DAYS
  derivation:
    diff:
      type: date
      start: ASTDT
      end: AENDT
      unit: day
      closed: both

- name: ADURN
  type: int
  label: Analysis Duration (Days)
  derivation:
    case:
    - when: AENDT >= ASTDT
      then: DAYS
    - otherwise: null
  submission:
    origins:
    - type: Derived
    method: Inclusive duration only for two full non-inverted
      dates. Recorded dates are not corrected.
    comment: Inclusive duration only for two full non-inverted
      dates. Recorded dates are not corrected.
    core: Perm
    mandatory: false
    data_type: integer
    length: 8

- name: ADURU
  type: str
  label: Analysis Duration Unit
  derivation:
    case:
    - when: ADURN IS NOT NULL
      then: '''DAYS'''
    - otherwise: null
  verifications:
  - max_length:
      max: 4
  submission:
    length: 4
    origins:
    - type: Derived
    method: |-
      Executable yamaa derivation: case:
      - when: ADURN IS NOT NULL
        then: '''DAYS'''
      - otherwise: null
    core: Perm
    mandatory: false
    data_type: text

- name: ASEV
  type: str
  label: Analysis Severity/Intensity
  derivation: AESEV
  verifications:
  - max_length:
      max: 12
  submission:
    length: 12
    origins:
    - type: Derived
    method: |-
      Executable yamaa derivation: AESEV
      ...
    core: Req
    mandatory: false
    data_type: text

- name: AESEVN
  type: int
  label: Severity/Intensity (N)
  derivation:
    mapping:
      source: AESEV
      dict:
        MILD: 1
        MODERATE: 2
        SEVERE: 3
      unmapped: null
  submission:
    origins:
    - type: Derived
    method: |-
      Executable yamaa derivation: mapping:
        source: AESEV
        dict:
          MILD: 1
          MODERATE: 2
          SEVERE: 3
        missing: null
        unmapped: null
    core: Perm
    mandatory: false
    data_type: integer
    length: 8

- name: AREL
  type: str
  label: Analysis Causality
  derivation: AEREL
  verifications:
  - max_length:
      max: 40
  submission:
    length: 40
    origins:
    - type: Derived
    method: |-
      Executable yamaa derivation: AEREL
      ...
    core: Req
    mandatory: false
    data_type: text

- name: TRTEMFL
  type: str
  label: Treatment Emergent Analysis Flag
  derivation: null
  verifications:
  - max_length:
      max: 1
  - allowed_values:
      values:
      - N
      - Y
  submission:
    length: 1
    origins:
    - type: Derived
    comment: Treatment emergence cannot be established without
      exposure and an approved risk window.
    core: Cond
    mandatory: false
    data_type: text
    method: Treatment emergence cannot be established without
      exposure and an approved risk window.
    codelist: NY

- name: ANL01FL
  type: str
  label: Analysis Record Flag 01
  derivation: null
  verifications:
  - max_length:
      max: 1
  - allowed_values:
      values:
      - N
      - Y
  submission:
    length: 1
    origins:
    - type: Derived
    comment: No approved analysis-selection rule. These records
      are supplied for review.
    core: Cond
    mandatory: false
    data_type: text
    method: No approved analysis-selection rule. These records
      are supplied for review.
    codelist: NY

verifications:
- assert:
    id: recorded_end_before_start
    require: AENDT IS NULL OR ASTDT IS NULL OR AENDT >= ASTDT
    severity: warning

submission:
  label: Adverse Events Analysis
  class: OCCURRENCE DATA STRUCTURE
  structure: One record per source observation per subject
  repeating: true
  mode: historical
  artifact: adae.xpt
  comment: Review draft metadata. Historical mode keeps declarations
    separate from incomplete data; this is not a validated submission.
    See spec/review/decisions.md.
