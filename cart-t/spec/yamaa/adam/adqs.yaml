yamaa: '1.0'
type: spec
model: ADaM
domain: ADQS
keys:
- STUDYID
- USUBJID
- ASEQ
input:
  ADSL:
    path: ../../../data/adam/adsl-yamaa.parquet
    schema: ../adam/adsl.yaml
    key:
    - USUBJID
  QS:
    path: ../../../data/sdtm/qs.parquet
    schema: ../sdtm/qs.yaml
base: QS

output:
  path: ../../../data/adam/adqs-yamaa.parquet
  columns:
  - STUDYID
  - USUBJID
  - QSSEQ
  - QSSPID
  - SUBJID
  - SITEID
  - AGE
  - AGEGR1
  - SEX
  - RACE
  - STRAT1
  - STRAT1L
  - TRT01P
  - TRT01PN
  - TRT01A
  - TRT01AN
  - TRTSDT
  - TRTEDT
  - RANDFL
  - ITTCAND
  - SAFFL
  - EFFFL
  - ASEQ
  - PARAMCD
  - PARAM
  - PARAMN
  - PARCAT1
  - PARCAT2
  - AVAL
  - AVALC
  - ADT
  - ADY
  - AVISIT
  - AVISITN
  - ABLFL
  - BASE
  - CHG
  - PCHG
  - ANL01FL
  - SRCDOM
  - SRCVAR
  - SRCSEQ
  report: ../../../log/adqs-report.csv
  order_by:
  - variable: STUDYID
    nulls: last
  - variable: USUBJID
    nulls: last
  - variable: ASEQ
    nulls: last

columns:
- name: STUDYID
  type: str
  label: Study Identifier
  derivation: QS.STUDYID
  verifications:
  - max_length:
      max: 12
  submission:
    length: 12
    origins:
    - type: Predecessor
      description: QS.STUDYID
    core: Req
    mandatory: true
    data_type: text
    key_sequence: 1

- name: USUBJID
  type: str
  label: Unique Subject Identifier
  derivation: QS.USUBJID
  verifications:
  - max_length:
      max: 80
  submission:
    length: 80
    origins:
    - type: Predecessor
      description: QS.USUBJID
    core: Req
    mandatory: true
    data_type: text
    key_sequence: 2

- copy:
    dataset: QS
    columns:
    - QSSEQ
    - QSSPID
    submission:
      core: Perm
      mandatory: false

- copy:
    dataset: ADSL
    columns:
    - SUBJID
    - SITEID
    - AGE
    - SEX
    - RACE
    - TRT01P
    - TRT01A
    submission:
      core: Req
      mandatory: false

- copy:
    dataset: ADSL
    columns:
    - AGEGR1
    - STRAT1
    - STRAT1L
    - TRT01PN
    - TRT01AN
    - RANDFL
    - ITTCAND
    - SAFFL
    - EFFFL
    submission:
      core: Perm
      mandatory: false

- name: TRTSDT
  type: date
  label: Date of First Exposure to Treatment
  derivation: ADSL.TRTSDT
  submission:
    core: Perm
    mandatory: false
    data_type: integer
    length: 8
    display_format: DATE9.
    origins:
    - type: Predecessor
      description: ADSL.TRTSDT

- name: TRTEDT
  type: date
  label: Date of Last Exposure to Treatment
  derivation: ADSL.TRTEDT
  submission:
    core: Perm
    mandatory: false
    data_type: integer
    length: 8
    display_format: DATE9.
    origins:
    - type: Predecessor
      description: ADSL.TRTEDT

- name: ASEQ
  type: int
  label: Analysis Sequence Number
  derivation: QS.QSSEQ
  submission:
    origins:
    - type: Predecessor
      description: QS.QSSEQ
    core: Req
    mandatory: true
    data_type: integer
    length: 8
    key_sequence: 3

- name: PARAMCD
  type: str
  label: Parameter Code
  derivation: QS.QSTESTCD
  verifications:
  - max_length:
      max: 8
  submission:
    length: 8
    origins:
    - type: Predecessor
      description: QS.QSTESTCD
    core: Req
    mandatory: false
    data_type: text

- name: PARAM
  type: str
  label: Parameter
  derivation: QS.QSTEST
  verifications:
  - max_length:
      max: 80
  submission:
    length: 80
    origins:
    - type: Predecessor
      description: QS.QSTEST
    core: Req
    mandatory: false
    data_type: text

- name: PARAMN
  type: int
  label: Parameter (N)
  derivation:
    mapping:
      source: PARAMCD
      dict:
        SF1201: 1
        SF1202: 2
        SF1203: 3
        SF1204: 4
        SF1205: 5
        SF1206: 6
        SF1207: 7
        SF1208: 8
        SF1209: 9
        SF1210: 10
        SF1211: 11
        SF1212: 12
        SF12PF: 13
        SF12RP: 14
        SF12BP: 15
        SF12GH: 16
        SF12VT: 17
        SF12SF: 18
        SF12RE: 19
        SF12MH: 20
      unmapped: null
  submission:
    origins:
    - type: Derived
    method: Fixed parameter order from the study mapping, independent
      of subject or observed test subset.
    comment: Fixed parameter order from the study mapping, independent
      of subject or observed test subset.
    core: Perm
    mandatory: false
    data_type: integer
    length: 8

- name: PARCAT1
  type: str
  label: Parameter Category 1
  derivation: QS.QSCAT
  verifications:
  - max_length:
      max: 40
  submission:
    length: 40
    origins:
    - type: Predecessor
      description: QS.QSCAT
    core: Cond
    mandatory: false
    data_type: text

- name: PARCAT2
  type: str
  label: Parameter Category 2
  derivation: QS.QSSCAT
  verifications:
  - max_length:
      max: 20
  submission:
    length: 20
    origins:
    - type: Predecessor
      description: QS.QSSCAT
    core: Perm
    mandatory: false
    data_type: text

- name: AVAL
  type: float
  label: Analysis Value
  derivation: QS.QSSTRESN
  submission:
    significant_digits: 6
    origins:
    - type: Predecessor
      description: QS.QSSTRESN
    core: Cond
    mandatory: false
    data_type: float
    length: 8

- name: AVALC
  type: str
  label: Analysis Value (C)
  derivation: QS.QSSTRESC
  verifications:
  - max_length:
      max: 80
  submission:
    length: 80
    origins:
    - type: Predecessor
      description: QS.QSSTRESC
    core: Perm
    mandatory: false
    data_type: text

- name: ADT
  type: date
  label: Analysis Date
  derivation:
    impute:
      type: date
      source: QS.QSDTC
      invalid: null
  submission:
    origins:
    - type: Derived
    method: Only full valid dates become analysis dates. Partial dates
      are retained in the SDTM source; no date imputation is authorized.
    comment: Only full valid dates become analysis dates. Partial dates
      are retained in the SDTM source; no date imputation is authorized.
    core: Cond
    mandatory: false
    data_type: integer
    length: 8
    display_format: DATE9.

- name: ADY
  type: int
  label: Analysis Relative Day
  derivation:
    study_day:
      source: ADT
      reference: TRTSDT
  submission:
    origins:
    - type: Derived
    method: |-
      Executable yamaa derivation: study_day:
        source: ADT
        reference: TRTSDT
    core: Perm
    mandatory: false
    data_type: integer
    length: 8

- name: AVISIT
  type: str
  label: Analysis Visit
  derivation: QS.VISIT
  verifications:
  - max_length:
      max: 80
  submission:
    length: 80
    origins:
    - type: Predecessor
      description: QS.VISIT
    core: Cond
    mandatory: false
    data_type: text

- name: AVISITN
  type: int
  label: Analysis Visit (N)
  derivation: null
  submission:
    origins:
    - type: Derived
    comment: No approved nominal visit windows; event-type order is
      not a visit schedule.
    core: Cond
    mandatory: false
    data_type: integer
    length: 8
    method: No approved nominal visit windows; event-type order is
      not a visit schedule.

- name: ABLFL
  type: str
  label: Baseline Record Flag
  derivation: null
  verifications:
  - max_length:
      max: 1
  - allowed_values:
      values:
      - N
      - Y
  submission:
    length: 1
    origins:
    - type: Derived
    comment: No exposure reference or approved alternative baseline.
      Administrative Baseline form labels do not establish analysis
      baseline.
    core: Cond
    mandatory: false
    data_type: text
    method: No exposure reference or approved alternative baseline.
      Administrative Baseline form labels do not establish analysis
      baseline.
    codelist: NY

- name: BASE
  type: float
  label: Baseline Value
  derivation: null
  submission:
    significant_digits: 6
    origins:
    - type: Derived
    comment: Not derived until a baseline definition is approved and
      a valid baseline exists.
    core: Cond
    mandatory: false
    data_type: float
    length: 8
    method: Not derived until a baseline definition is approved and
      a valid baseline exists.

- name: CHG
  type: float
  label: Change from Baseline
  derivation: null
  submission:
    significant_digits: 6
    origins:
    - type: Derived
    comment: Not derived until a baseline definition is approved and
      a valid baseline exists.
    core: Cond
    mandatory: false
    data_type: float
    length: 8
    method: Not derived until a baseline definition is approved and
      a valid baseline exists.

- name: PCHG
  type: float
  label: Percent Change from Baseline
  derivation: null
  submission:
    significant_digits: 6
    origins:
    - type: Derived
    comment: Not derived until a baseline definition is approved and
      a valid baseline exists.
    core: Cond
    mandatory: false
    data_type: float
    length: 8
    method: Not derived until a baseline definition is approved and
      a valid baseline exists.

- name: ANL01FL
  type: str
  label: Analysis Record Flag 01
  derivation: null
  verifications:
  - max_length:
      max: 1
  - allowed_values:
      values:
      - N
      - Y
  submission:
    length: 1
    origins:
    - type: Derived
    comment: No approved selection rule. Questionnaire subscales are
      copied source scores, not validated recomputations.
    core: Cond
    mandatory: false
    data_type: text
    method: No approved selection rule. Questionnaire subscales are
      copied source scores, not validated recomputations.
    codelist: NY

- name: SRCDOM
  type: str
  label: Source Domain
  derivation: '''QS'''
  verifications:
  - max_length:
      max: 2
  submission:
    length: 2
    origins:
    - type: Assigned
    core: Perm
    mandatory: false
    data_type: text

- name: SRCVAR
  type: str
  label: Source Variable
  derivation: '''QSSTRESN'''
  verifications:
  - max_length:
      max: 8
  submission:
    length: 8
    origins:
    - type: Assigned
    core: Perm
    mandatory: false
    data_type: text

- name: SRCSEQ
  type: int
  label: Source Sequence Number
  derivation: QS.QSSEQ
  submission:
    origins:
    - type: Predecessor
      description: QS.QSSEQ
    core: Perm
    mandatory: false
    data_type: integer
    length: 8

submission:
  label: Questionnaire Analysis
  class: BASIC DATA STRUCTURE
  structure: One record per source observation per subject
  repeating: true
  mode: historical
  artifact: adqs.xpt
  comment: Review draft metadata. Historical mode keeps declarations
    separate from incomplete data; this is not a validated submission.
    See spec/review/decisions.md.
