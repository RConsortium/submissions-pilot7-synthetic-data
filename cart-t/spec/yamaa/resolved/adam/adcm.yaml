yamaa: '1.0'
type: spec
model: ADaM
domain: ADCM
keys:
- STUDYID
- USUBJID
- ASEQ
input:
  ADSL:
    path: ../../../../data/adam/adsl-yamaa.parquet
    relative_to: declaring
    schema: adsl.yaml
    empty_string: missing
    key:
    - USUBJID
  CM:
    path: ../../../../data/sdtm/cm.parquet
    relative_to: declaring
    schema: ../sdtm/cm.yaml
    empty_string: missing
base: CM
output:
  path: ../../../../data/adam/adcm-yamaa.parquet
  relative_to: declaring
  columns:
  - STUDYID
  - USUBJID
  - CMSEQ
  - CMSPID
  - CMTRT
  - CMDECOD
  - CMINDC
  - CMDOSE
  - CMDOSTXT
  - CMDOSU
  - CMDOSFRQ
  - CMDOSFRM
  - CMROUTE
  - CMSTDTC
  - CMENDTC
  - CMENRTPT
  - CMENTPT
  - VISIT
  - SUBJID
  - SITEID
  - AGE
  - AGEGR1
  - SEX
  - RACE
  - STRAT1
  - STRAT1L
  - TRT01P
  - TRT01PN
  - TRT01A
  - TRT01AN
  - TRTSDT
  - TRTEDT
  - RANDFL
  - ITTCAND
  - SAFFL
  - EFFFL
  - ASEQ
  - ASTDT
  - AENDT
  - ASTDY
  - AENDY
  - TRTP
  - TRTA
  - SRCDOM
  - SRCSEQ
  - SRCVAR
  - ADURN
  - ADURU
  - ANL01FL
  report: ../../../../log/adcm-report.parquet
  order_by:
  - variable: STUDYID
    direction: asc
    nulls: last
  - variable: USUBJID
    direction: asc
    nulls: last
  - variable: ASEQ
    direction: asc
    nulls: last
columns:
- name: STUDYID
  type: str
  label: Study Identifier
  derivation: CM.STUDYID
  verifications:
  - max_length:
      max: 12
      severity: error
  submission:
    key_sequence: 1
    core: Req
    mandatory: true
    data_type: text
    length: 12
    origins:
    - type: Predecessor
      description: CM.STUDYID
- name: USUBJID
  type: str
  label: Unique Subject Identifier
  derivation: CM.USUBJID
  verifications:
  - max_length:
      max: 80
      severity: error
  submission:
    key_sequence: 2
    core: Req
    mandatory: true
    data_type: text
    length: 80
    origins:
    - type: Predecessor
      description: CM.USUBJID
- name: CMSEQ
  type: int
  label: Sequence Number
  derivation: CM.CMSEQ
  submission:
    core: Req
    mandatory: false
    data_type: integer
    length: 8
    origins:
    - type: Predecessor
      description: CM.CMSEQ
- name: CMTRT
  type: str
  label: Reported Name of Drug, Med, or Therapy
  derivation: CM.CMTRT
  submission:
    core: Req
    mandatory: false
    data_type: text
    length: 200
    origins:
    - type: Predecessor
      description: CM.CMTRT
- name: CMSPID
  type: str
  label: Source Group Ordinal
  derivation: CM.CMSPID
  submission:
    core: Perm
    mandatory: false
    data_type: text
    length: 20
    origins:
    - type: Predecessor
      description: CM.CMSPID
- name: CMDOSTXT
  type: str
  label: Dose Description
  derivation: CM.CMDOSTXT
  submission:
    core: Perm
    mandatory: false
    data_type: text
    length: 80
    origins:
    - type: Predecessor
      description: CM.CMDOSTXT
- name: CMDOSFRQ
  type: str
  label: Dosing Frequency per Interval
  derivation: CM.CMDOSFRQ
  submission:
    core: Perm
    mandatory: false
    data_type: text
    length: 40
    origins:
    - type: Predecessor
      description: CM.CMDOSFRQ
- name: CMDOSFRM
  type: str
  label: Dose Form
  derivation: CM.CMDOSFRM
  submission:
    core: Perm
    mandatory: false
    data_type: text
    length: 40
    origins:
    - type: Predecessor
      description: CM.CMDOSFRM
- name: CMSTDTC
  type: str
  label: Start Date/Time of Medication
  derivation: CM.CMSTDTC
  submission:
    core: Perm
    mandatory: false
    data_type: text
    length: 25
    origins:
    - type: Predecessor
      description: CM.CMSTDTC
- name: CMENDTC
  type: str
  label: End Date/Time of Medication
  derivation: CM.CMENDTC
  submission:
    core: Perm
    mandatory: false
    data_type: text
    length: 25
    origins:
    - type: Predecessor
      description: CM.CMENDTC
- name: CMENRTPT
  type: str
  label: End Relative to Reference Time Point
  derivation: CM.CMENRTPT
  submission:
    core: Perm
    mandatory: false
    data_type: text
    length: 12
    origins:
    - type: Predecessor
      description: CM.CMENRTPT
- name: CMENTPT
  type: str
  label: End Reference Time Point
  derivation: CM.CMENTPT
  submission:
    core: Perm
    mandatory: false
    data_type: text
    length: 40
    origins:
    - type: Predecessor
      description: CM.CMENTPT
- name: VISIT
  type: str
  label: Visit Name
  derivation: CM.VISIT
  submission:
    core: Perm
    mandatory: false
    data_type: text
    length: 80
    origins:
    - type: Predecessor
      description: CM.VISIT
- name: CMDECOD
  type: str
  label: Standardized Medication Name
  derivation: CM.CMDECOD
  submission:
    core: Cond
    mandatory: false
    data_type: text
    length: 200
    origins:
    - type: Predecessor
      description: CM.CMDECOD
- name: CMINDC
  type: str
  label: Indication
  derivation: CM.CMINDC
  submission:
    core: Cond
    mandatory: false
    data_type: text
    length: 200
    origins:
    - type: Predecessor
      description: CM.CMINDC
- name: CMDOSE
  type: float
  label: Dose per Administration
  derivation: CM.CMDOSE
  submission:
    core: Cond
    mandatory: false
    data_type: float
    length: 8
    significant_digits: 6
    origins:
    - type: Predecessor
      description: CM.CMDOSE
- name: CMDOSU
  type: str
  label: Dose Units
  derivation: CM.CMDOSU
  submission:
    core: Cond
    mandatory: false
    data_type: text
    length: 40
    origins:
    - type: Predecessor
      description: CM.CMDOSU
- name: CMROUTE
  type: str
  label: Route of Administration
  derivation: CM.CMROUTE
  submission:
    core: Cond
    mandatory: false
    data_type: text
    length: 40
    origins:
    - type: Predecessor
      description: CM.CMROUTE
- name: SUBJID
  type: str
  label: Subject Identifier for the Study
  derivation: ADSL.SUBJID
  submission:
    core: Req
    mandatory: false
    data_type: text
    length: 40
    origins:
    - type: Predecessor
      description: ADSL.SUBJID
- name: SITEID
  type: str
  label: Study Site Identifier
  derivation: ADSL.SITEID
  submission:
    core: Req
    mandatory: false
    data_type: text
    length: 20
    origins:
    - type: Predecessor
      description: ADSL.SITEID
- name: AGE
  type: int
  label: Age
  derivation: ADSL.AGE
  submission:
    core: Req
    mandatory: false
    data_type: integer
    length: 8
    origins:
    - type: Predecessor
      description: ADSL.AGE
- name: SEX
  type: str
  label: Sex
  derivation: ADSL.SEX
  submission:
    core: Req
    mandatory: false
    data_type: text
    length: 1
    codelist: SEX
    origins:
    - type: Predecessor
      description: ADSL.SEX
- name: RACE
  type: str
  label: Race
  derivation: ADSL.RACE
  submission:
    core: Req
    mandatory: false
    data_type: text
    length: 60
    codelist: RACE
    origins:
    - type: Predecessor
      description: ADSL.RACE
- name: TRT01P
  type: str
  label: Planned Treatment for Period 01
  derivation: ADSL.TRT01P
  submission:
    core: Req
    mandatory: false
    data_type: text
    length: 40
    origins:
    - type: Predecessor
      description: ADSL.TRT01P
- name: TRT01A
  type: str
  label: Actual Treatment for Period 01
  derivation: ADSL.TRT01A
  submission:
    core: Req
    mandatory: false
    data_type: text
    length: 40
    origins:
    - type: Predecessor
      description: ADSL.TRT01A
- name: SAFFL
  type: str
  label: Documented Exposure Safety Flag
  derivation: ADSL.SAFFL
  submission:
    core: Req
    mandatory: false
    data_type: text
    length: 1
    codelist: NY
    origins:
    - type: Predecessor
      description: ADSL.SAFFL
- name: TRTSDT
  type: date
  label: Date of First Exposure to Treatment
  derivation: ADSL.TRTSDT
  submission:
    core: Req
    mandatory: false
    data_type: integer
    length: 8
    display_format: DATE9.
    origins:
    - type: Predecessor
      description: ADSL.TRTSDT
- name: TRTEDT
  type: date
  label: Date of Last Exposure to Treatment
  derivation: ADSL.TRTEDT
  submission:
    core: Req
    mandatory: false
    data_type: integer
    length: 8
    display_format: DATE9.
    origins:
    - type: Predecessor
      description: ADSL.TRTEDT
- name: AGEGR1
  type: str
  label: Pooled Age Group 1
  derivation: ADSL.AGEGR1
  submission:
    core: Perm
    mandatory: false
    data_type: text
    length: 8
    codelist: AGEGR1
    origins:
    - type: Predecessor
      description: ADSL.AGEGR1
- name: STRAT1
  type: str
  label: Phenotype Stratification Code
  derivation: ADSL.STRAT1
  submission:
    core: Perm
    mandatory: false
    data_type: text
    length: 8
    codelist: STRAT1
    origins:
    - type: Predecessor
      description: ADSL.STRAT1
- name: STRAT1L
  type: str
  label: Randomization Phenotype Label
  derivation: ADSL.STRAT1L
  submission:
    core: Perm
    mandatory: false
    data_type: text
    length: 80
    origins:
    - type: Predecessor
      description: ADSL.STRAT1L
- name: TRT01PN
  type: int
  label: Planned Treatment Number Period 01
  derivation: ADSL.TRT01PN
  submission:
    core: Perm
    mandatory: false
    data_type: integer
    length: 8
    origins:
    - type: Predecessor
      description: ADSL.TRT01PN
- name: TRT01AN
  type: int
  label: Actual Treatment Number Period 01
  derivation: ADSL.TRT01AN
  submission:
    core: Perm
    mandatory: false
    data_type: integer
    length: 8
    origins:
    - type: Predecessor
      description: ADSL.TRT01AN
- name: RANDFL
  type: str
  label: Randomization Workflow Record Flag
  derivation: ADSL.RANDFL
  submission:
    core: Perm
    mandatory: false
    data_type: text
    length: 1
    codelist: NY
    origins:
    - type: Predecessor
      description: ADSL.RANDFL
- name: ITTCAND
  type: str
  label: Candidate ITT Population Flag
  derivation: ADSL.ITTCAND
  submission:
    core: Perm
    mandatory: false
    data_type: text
    length: 1
    codelist: NY
    origins:
    - type: Predecessor
      description: ADSL.ITTCAND
- name: EFFFL
  type: str
  label: Efficacy Analysis Population Flag
  derivation: ADSL.EFFFL
  submission:
    core: Perm
    mandatory: false
    data_type: text
    length: 1
    codelist: NY
    origins:
    - type: Predecessor
      description: ADSL.EFFFL
- name: ASEQ
  type: int
  label: Analysis Sequence Number
  derivation: CM.CMSEQ
  submission:
    key_sequence: 3
    core: Req
    mandatory: true
    data_type: integer
    length: 8
    origins:
    - type: Predecessor
      description: CM.CMSEQ
- name: ASTDT
  type: date
  label: Analysis Start Date
  derivation:
    impute:
      type: date
      source: CM.CMSTDTC
      invalid: null
  submission:
    core: Cond
    mandatory: false
    data_type: integer
    length: 8
    display_format: DATE9.
    origins:
    - type: Derived
    method:
      type: Computation
      description: "Executable yamaa derivation: impute:\n  type: date\n  source:\
        \ CM.CMSTDTC\n  invalid: null"
- name: AENDT
  type: date
  label: Analysis End Date
  derivation:
    impute:
      type: date
      source: CM.CMENDTC
      invalid: null
  submission:
    core: Cond
    mandatory: false
    data_type: integer
    length: 8
    display_format: DATE9.
    origins:
    - type: Derived
    method:
      type: Computation
      description: "Executable yamaa derivation: impute:\n  type: date\n  source:\
        \ CM.CMENDTC\n  invalid: null"
- name: ASTDY
  type: int
  label: Analysis Start Relative Day
  derivation:
    study_day:
      source: ASTDT
      reference: TRTSDT
  submission:
    core: Perm
    mandatory: false
    data_type: integer
    length: 8
    origins:
    - type: Derived
    method:
      type: Computation
      description: "Executable yamaa derivation: study_day:\n  source: ASTDT\n  reference:\
        \ TRTSDT"
- name: AENDY
  type: int
  label: Analysis End Relative Day
  derivation:
    study_day:
      source: AENDT
      reference: TRTSDT
  submission:
    core: Perm
    mandatory: false
    data_type: integer
    length: 8
    origins:
    - type: Derived
    method:
      type: Computation
      description: "Executable yamaa derivation: study_day:\n  source: AENDT\n  reference:\
        \ TRTSDT"
- name: TRTP
  type: str
  label: Planned Treatment
  derivation: TRT01P
  verifications:
  - max_length:
      max: 40
      severity: error
  submission:
    core: Perm
    mandatory: false
    data_type: text
    length: 40
    origins:
    - type: Derived
    method:
      type: Computation
      description: 'Executable yamaa derivation: TRT01P

        ...'
- name: TRTA
  type: str
  label: Actual Treatment
  derivation: TRT01A
  verifications:
  - max_length:
      max: 40
      severity: error
  submission:
    core: Perm
    mandatory: false
    data_type: text
    length: 40
    origins:
    - type: Derived
    method:
      type: Computation
      description: 'Executable yamaa derivation: TRT01A

        ...'
- name: SRCDOM
  type: str
  label: Source Domain
  derivation: '''CM'''
  verifications:
  - max_length:
      max: 2
      severity: error
  submission:
    core: Perm
    mandatory: false
    data_type: text
    length: 2
    origins:
    - type: Assigned
- name: SRCSEQ
  type: int
  label: Source Sequence Number
  derivation: CM.CMSEQ
  submission:
    core: Perm
    mandatory: false
    data_type: integer
    length: 8
    origins:
    - type: Predecessor
      description: CM.CMSEQ
- name: SRCVAR
  type: str
  label: Source Variable
  derivation: '''CMTRT'''
  verifications:
  - max_length:
      max: 8
      severity: error
  submission:
    core: Perm
    mandatory: false
    data_type: text
    length: 8
    origins:
    - type: Assigned
- name: DAYS
  type: int
  label: DAYS
  derivation:
    diff:
      type: date
      start: ASTDT
      end: AENDT
      unit: day
      closed: both
- name: ADURN
  type: int
  label: Analysis Duration (Days)
  derivation:
    case:
    - when: AENDT >= ASTDT
      then: DAYS
    - otherwise: null
  submission:
    core: Perm
    mandatory: false
    data_type: integer
    length: 8
    origins:
    - type: Derived
    method:
      type: Computation
      description: Inclusive duration only for two full non-inverted dates. Recorded
        dates are not corrected.
    comment: Inclusive duration only for two full non-inverted dates. Recorded dates
      are not corrected.
- name: ADURU
  type: str
  label: Analysis Duration Unit
  derivation:
    case:
    - when: ADURN IS NOT NULL
      then: '''DAYS'''
    - otherwise: null
  verifications:
  - max_length:
      max: 4
      severity: error
  submission:
    core: Perm
    mandatory: false
    data_type: text
    length: 4
    origins:
    - type: Derived
    method:
      type: Computation
      description: "Executable yamaa derivation: case:\n- when: ADURN IS NOT NULL\n\
        \  then: '''DAYS'''\n- otherwise: null"
- name: ANL01FL
  type: str
  label: Analysis Record Flag 01
  derivation: null
  verifications:
  - max_length:
      max: 1
      severity: error
  - allowed_values:
      values:
      - N
      - Y
      severity: error
  submission:
    core: Perm
    mandatory: false
    data_type: text
    length: 1
    codelist: NY
    origins:
    - type: Derived
    method:
      type: Computation
      description: No approved analysis-selection rule. These records are supplied
        for review.
    comment: No approved analysis-selection rule. These records are supplied for review.
verifications:
- assert:
    id: recorded_end_before_start
    require: AENDT IS NULL OR ASTDT IS NULL OR AENDT >= ASTDT
    severity: warning
submission:
  mode: historical
  artifact: adcm.xpt
  has_no_data: false
  label: Concomitant Medications Analysis
  class: OCCURRENCE DATA STRUCTURE
  structure: One record per source observation per subject
  repeating: true
  reference_data: false
  non_standard: false
  comment: Review draft metadata. Historical mode keeps declarations separate from
    incomplete data; this is not a validated submission. See spec/review/decisions.md.
