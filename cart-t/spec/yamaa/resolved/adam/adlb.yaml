yamaa: '1.0'
type: spec
model: ADaM
domain: ADLB
keys:
- STUDYID
- USUBJID
- ASEQ
input:
  ADSL:
    path: ../../../../data/adam/adsl-yamaa.parquet
    relative_to: declaring
    schema: adsl.yaml
    empty_string: missing
    key:
    - USUBJID
  LB:
    path: ../../../../data/sdtm/lb.parquet
    relative_to: declaring
    schema: ../sdtm/lb.yaml
    empty_string: missing
base: LB
output:
  path: ../../../../data/adam/adlb-yamaa.parquet
  relative_to: declaring
  columns:
  - STUDYID
  - USUBJID
  - LBSEQ
  - LBSPID
  - SUBJID
  - SITEID
  - AGE
  - AGEGR1
  - SEX
  - RACE
  - STRAT1
  - STRAT1L
  - TRT01P
  - TRT01PN
  - TRT01A
  - TRT01AN
  - TRTSDT
  - TRTEDT
  - RANDFL
  - ITTCAND
  - SAFFL
  - EFFFL
  - ASEQ
  - PARAMCD
  - PARAM
  - PARAMN
  - PARCAT1
  - AVAL
  - AVALC
  - AVALU
  - ADT
  - ADY
  - AVISIT
  - AVISITN
  - ABLFL
  - BASE
  - CHG
  - PCHG
  - ANL01FL
  - SRCDOM
  - SRCVAR
  - SRCSEQ
  report: ../../../../log/adlb-report.parquet
  order_by:
  - variable: STUDYID
    direction: asc
    nulls: last
  - variable: USUBJID
    direction: asc
    nulls: last
  - variable: ASEQ
    direction: asc
    nulls: last
columns:
- name: STUDYID
  type: str
  label: Study Identifier
  derivation: LB.STUDYID
  verifications:
  - max_length:
      max: 12
      severity: error
  submission:
    key_sequence: 1
    core: Req
    mandatory: true
    data_type: text
    length: 12
    origins:
    - type: Predecessor
      description: LB.STUDYID
- name: USUBJID
  type: str
  label: Unique Subject Identifier
  derivation: LB.USUBJID
  verifications:
  - max_length:
      max: 80
      severity: error
  submission:
    key_sequence: 2
    core: Req
    mandatory: true
    data_type: text
    length: 80
    origins:
    - type: Predecessor
      description: LB.USUBJID
- name: LBSEQ
  type: int
  label: Sequence Number
  derivation: LB.LBSEQ
  submission:
    core: Perm
    mandatory: false
    data_type: integer
    length: 8
    origins:
    - type: Predecessor
      description: LB.LBSEQ
- name: LBSPID
  type: str
  label: Source Item Ordinal
  derivation: LB.LBSPID
  submission:
    core: Perm
    mandatory: false
    data_type: text
    length: 20
    origins:
    - type: Predecessor
      description: LB.LBSPID
- name: SUBJID
  type: str
  label: Subject Identifier for the Study
  derivation: ADSL.SUBJID
  submission:
    core: Req
    mandatory: false
    data_type: text
    length: 40
    origins:
    - type: Predecessor
      description: ADSL.SUBJID
- name: SITEID
  type: str
  label: Study Site Identifier
  derivation: ADSL.SITEID
  submission:
    core: Req
    mandatory: false
    data_type: text
    length: 20
    origins:
    - type: Predecessor
      description: ADSL.SITEID
- name: AGE
  type: int
  label: Age
  derivation: ADSL.AGE
  submission:
    core: Req
    mandatory: false
    data_type: integer
    length: 8
    origins:
    - type: Predecessor
      description: ADSL.AGE
- name: SEX
  type: str
  label: Sex
  derivation: ADSL.SEX
  submission:
    core: Req
    mandatory: false
    data_type: text
    length: 1
    codelist: SEX
    origins:
    - type: Predecessor
      description: ADSL.SEX
- name: RACE
  type: str
  label: Race
  derivation: ADSL.RACE
  submission:
    core: Req
    mandatory: false
    data_type: text
    length: 60
    codelist: RACE
    origins:
    - type: Predecessor
      description: ADSL.RACE
- name: TRT01P
  type: str
  label: Planned Treatment for Period 01
  derivation: ADSL.TRT01P
  submission:
    core: Req
    mandatory: false
    data_type: text
    length: 40
    origins:
    - type: Predecessor
      description: ADSL.TRT01P
- name: TRT01A
  type: str
  label: Actual Treatment for Period 01
  derivation: ADSL.TRT01A
  submission:
    core: Req
    mandatory: false
    data_type: text
    length: 40
    origins:
    - type: Predecessor
      description: ADSL.TRT01A
- name: SAFFL
  type: str
  label: Documented Exposure Safety Flag
  derivation: ADSL.SAFFL
  submission:
    core: Req
    mandatory: false
    data_type: text
    length: 1
    codelist: NY
    origins:
    - type: Predecessor
      description: ADSL.SAFFL
- name: AGEGR1
  type: str
  label: Pooled Age Group 1
  derivation: ADSL.AGEGR1
  submission:
    core: Perm
    mandatory: false
    data_type: text
    length: 8
    codelist: AGEGR1
    origins:
    - type: Predecessor
      description: ADSL.AGEGR1
- name: STRAT1
  type: str
  label: Phenotype Stratification Code
  derivation: ADSL.STRAT1
  submission:
    core: Perm
    mandatory: false
    data_type: text
    length: 8
    codelist: STRAT1
    origins:
    - type: Predecessor
      description: ADSL.STRAT1
- name: STRAT1L
  type: str
  label: Randomization Phenotype Label
  derivation: ADSL.STRAT1L
  submission:
    core: Perm
    mandatory: false
    data_type: text
    length: 80
    origins:
    - type: Predecessor
      description: ADSL.STRAT1L
- name: TRT01PN
  type: int
  label: Planned Treatment Number Period 01
  derivation: ADSL.TRT01PN
  submission:
    core: Perm
    mandatory: false
    data_type: integer
    length: 8
    origins:
    - type: Predecessor
      description: ADSL.TRT01PN
- name: TRT01AN
  type: int
  label: Actual Treatment Number Period 01
  derivation: ADSL.TRT01AN
  submission:
    core: Perm
    mandatory: false
    data_type: integer
    length: 8
    origins:
    - type: Predecessor
      description: ADSL.TRT01AN
- name: RANDFL
  type: str
  label: Randomization Workflow Record Flag
  derivation: ADSL.RANDFL
  submission:
    core: Perm
    mandatory: false
    data_type: text
    length: 1
    codelist: NY
    origins:
    - type: Predecessor
      description: ADSL.RANDFL
- name: ITTCAND
  type: str
  label: Candidate ITT Population Flag
  derivation: ADSL.ITTCAND
  submission:
    core: Perm
    mandatory: false
    data_type: text
    length: 1
    codelist: NY
    origins:
    - type: Predecessor
      description: ADSL.ITTCAND
- name: EFFFL
  type: str
  label: Efficacy Analysis Population Flag
  derivation: ADSL.EFFFL
  submission:
    core: Perm
    mandatory: false
    data_type: text
    length: 1
    codelist: NY
    origins:
    - type: Predecessor
      description: ADSL.EFFFL
- name: TRTSDT
  type: date
  label: Date of First Exposure to Treatment
  derivation: ADSL.TRTSDT
  submission:
    core: Perm
    mandatory: false
    data_type: integer
    length: 8
    display_format: DATE9.
    origins:
    - type: Predecessor
      description: ADSL.TRTSDT
- name: TRTEDT
  type: date
  label: Date of Last Exposure to Treatment
  derivation: ADSL.TRTEDT
  submission:
    core: Perm
    mandatory: false
    data_type: integer
    length: 8
    display_format: DATE9.
    origins:
    - type: Predecessor
      description: ADSL.TRTEDT
- name: ASEQ
  type: int
  label: Analysis Sequence Number
  derivation: LB.LBSEQ
  submission:
    key_sequence: 3
    core: Req
    mandatory: true
    data_type: integer
    length: 8
    origins:
    - type: Predecessor
      description: LB.LBSEQ
- name: PARAMCD
  type: str
  label: Parameter Code
  derivation: LB.LBTESTCD
  verifications:
  - max_length:
      max: 8
      severity: error
  submission:
    core: Req
    mandatory: false
    data_type: text
    length: 8
    origins:
    - type: Predecessor
      description: LB.LBTESTCD
- name: PARAM
  type: str
  label: Parameter
  derivation: LB.LBTEST
  verifications:
  - max_length:
      max: 80
      severity: error
  submission:
    core: Req
    mandatory: false
    data_type: text
    length: 80
    origins:
    - type: Predecessor
      description: LB.LBTEST
- name: PARAMN
  type: int
  label: Parameter (N)
  derivation:
    mapping:
      source: PARAMCD
      dict:
        AMYLASE: 1
        UREAN: 2
        CL: 3
        HOMOCY: 4
        CREAT: 5
        GFR: 6
        CHOL: 7
        TRIG: 8
        HCT: 9
        HGB: 10
        RBC: 11
        WBC: 12
      case_sensitive: true
      unmapped: null
  submission:
    core: Perm
    mandatory: false
    data_type: integer
    length: 8
    origins:
    - type: Derived
    method:
      type: Computation
      description: Fixed parameter order from the study mapping, independent of subject
        or observed test subset.
    comment: Fixed parameter order from the study mapping, independent of subject
      or observed test subset.
- name: PARCAT1
  type: str
  label: Parameter Category 1
  derivation: LB.LBCAT
  verifications:
  - max_length:
      max: 40
      severity: error
  submission:
    core: Cond
    mandatory: false
    data_type: text
    length: 40
    origins:
    - type: Predecessor
      description: LB.LBCAT
- name: AVAL
  type: float
  label: Analysis Value
  derivation: LB.LBSTRESN
  submission:
    core: Cond
    mandatory: false
    data_type: float
    length: 8
    significant_digits: 6
    origins:
    - type: Predecessor
      description: LB.LBSTRESN
- name: AVALC
  type: str
  label: Analysis Value (C)
  derivation: LB.LBSTRESC
  verifications:
  - max_length:
      max: 80
      severity: error
  submission:
    core: Perm
    mandatory: false
    data_type: text
    length: 80
    origins:
    - type: Predecessor
      description: LB.LBSTRESC
- name: AVALU
  type: str
  label: Analysis Value Unit
  derivation: LB.LBSTRESU
  verifications:
  - max_length:
      max: 40
      severity: error
  submission:
    core: Perm
    mandatory: false
    data_type: text
    length: 40
    origins:
    - type: Predecessor
      description: LB.LBSTRESU
- name: ADT
  type: date
  label: Analysis Date
  derivation:
    impute:
      type: date
      source: LB.LBDTC
      invalid: null
  submission:
    core: Cond
    mandatory: false
    data_type: integer
    length: 8
    display_format: DATE9.
    origins:
    - type: Derived
    method:
      type: Computation
      description: Only full valid dates become analysis dates. Partial dates are
        retained in the SDTM source; no date imputation is authorized.
    comment: Only full valid dates become analysis dates. Partial dates are retained
      in the SDTM source; no date imputation is authorized.
- name: ADY
  type: int
  label: Analysis Relative Day
  derivation:
    study_day:
      source: ADT
      reference: TRTSDT
  submission:
    core: Perm
    mandatory: false
    data_type: integer
    length: 8
    origins:
    - type: Derived
    method:
      type: Computation
      description: "Executable yamaa derivation: study_day:\n  source: ADT\n  reference:\
        \ TRTSDT"
- name: AVISIT
  type: str
  label: Analysis Visit
  derivation: LB.VISIT
  verifications:
  - max_length:
      max: 80
      severity: error
  submission:
    core: Cond
    mandatory: false
    data_type: text
    length: 80
    origins:
    - type: Predecessor
      description: LB.VISIT
- name: AVISITN
  type: int
  label: Analysis Visit (N)
  derivation: null
  submission:
    core: Cond
    mandatory: false
    data_type: integer
    length: 8
    origins:
    - type: Derived
    method:
      type: Computation
      description: No approved nominal visit windows; event-type order is not a visit
        schedule.
    comment: No approved nominal visit windows; event-type order is not a visit schedule.
- name: ABLFL
  type: str
  label: Baseline Record Flag
  derivation: null
  verifications:
  - max_length:
      max: 1
      severity: error
  - allowed_values:
      values:
      - N
      - Y
      severity: error
  submission:
    core: Cond
    mandatory: false
    data_type: text
    length: 1
    codelist: NY
    origins:
    - type: Derived
    method:
      type: Computation
      description: No exposure reference or approved alternative baseline. Administrative
        Baseline form labels do not establish analysis baseline.
    comment: No exposure reference or approved alternative baseline. Administrative
      Baseline form labels do not establish analysis baseline.
- name: BASE
  type: float
  label: Baseline Value
  derivation: null
  submission:
    core: Cond
    mandatory: false
    data_type: float
    length: 8
    significant_digits: 6
    origins:
    - type: Derived
    method:
      type: Computation
      description: Not derived until a baseline definition is approved and a valid
        baseline exists.
    comment: Not derived until a baseline definition is approved and a valid baseline
      exists.
- name: CHG
  type: float
  label: Change from Baseline
  derivation: null
  submission:
    core: Cond
    mandatory: false
    data_type: float
    length: 8
    significant_digits: 6
    origins:
    - type: Derived
    method:
      type: Computation
      description: Not derived until a baseline definition is approved and a valid
        baseline exists.
    comment: Not derived until a baseline definition is approved and a valid baseline
      exists.
- name: PCHG
  type: float
  label: Percent Change from Baseline
  derivation: null
  submission:
    core: Cond
    mandatory: false
    data_type: float
    length: 8
    significant_digits: 6
    origins:
    - type: Derived
    method:
      type: Computation
      description: Not derived until a baseline definition is approved and a valid
        baseline exists.
    comment: Not derived until a baseline definition is approved and a valid baseline
      exists.
- name: ANL01FL
  type: str
  label: Analysis Record Flag 01
  derivation: null
  verifications:
  - max_length:
      max: 1
      severity: error
  - allowed_values:
      values:
      - N
      - Y
      severity: error
  submission:
    core: Cond
    mandatory: false
    data_type: text
    length: 1
    codelist: NY
    origins:
    - type: Derived
    method:
      type: Computation
      description: No approved selection rule. Questionnaire subscales are copied
        source scores, not validated recomputations.
    comment: No approved selection rule. Questionnaire subscales are copied source
      scores, not validated recomputations.
- name: SRCDOM
  type: str
  label: Source Domain
  derivation: '''LB'''
  verifications:
  - max_length:
      max: 2
      severity: error
  submission:
    core: Perm
    mandatory: false
    data_type: text
    length: 2
    origins:
    - type: Assigned
- name: SRCVAR
  type: str
  label: Source Variable
  derivation: '''LBSTRESN'''
  verifications:
  - max_length:
      max: 8
      severity: error
  submission:
    core: Perm
    mandatory: false
    data_type: text
    length: 8
    origins:
    - type: Assigned
- name: SRCSEQ
  type: int
  label: Source Sequence Number
  derivation: LB.LBSEQ
  submission:
    core: Perm
    mandatory: false
    data_type: integer
    length: 8
    origins:
    - type: Predecessor
      description: LB.LBSEQ
submission:
  mode: historical
  artifact: adlb.xpt
  has_no_data: false
  label: Laboratory Analysis
  class: BASIC DATA STRUCTURE
  structure: One record per source observation per subject
  repeating: true
  reference_data: false
  non_standard: false
  comment: Review draft metadata. Historical mode keeps declarations separate from
    incomplete data; this is not a validated submission. See spec/review/decisions.md.
