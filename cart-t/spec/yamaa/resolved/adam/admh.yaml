yamaa: '1.0'
type: spec
model: ADaM
domain: ADMH
keys:
- STUDYID
- USUBJID
- ASEQ
input:
  ADSL:
    path: ../../../../data/adam/adsl-yamaa.parquet
    relative_to: declaring
    schema: adsl.yaml
    empty_string: missing
    key:
    - USUBJID
  MH:
    path: ../../../../data/sdtm/mh.parquet
    relative_to: declaring
    schema: ../sdtm/mh.yaml
    empty_string: missing
base: MH
output:
  path: ../../../../data/adam/admh-yamaa.parquet
  relative_to: declaring
  columns:
  - STUDYID
  - USUBJID
  - MHSEQ
  - MHSPID
  - MHTERM
  - MHCAT
  - MHDECOD
  - MHSTDTC
  - MHENDTC
  - VISIT
  - SUBJID
  - SITEID
  - AGE
  - AGEGR1
  - SEX
  - RACE
  - STRAT1
  - STRAT1L
  - TRT01P
  - TRT01PN
  - TRT01A
  - TRT01AN
  - TRTSDT
  - TRTEDT
  - RANDFL
  - ITTCAND
  - SAFFL
  - EFFFL
  - ASEQ
  - ASTDT
  - AENDT
  - ASTDY
  - AENDY
  - TRTP
  - TRTA
  - SRCDOM
  - SRCSEQ
  - SRCVAR
  - ADURN
  - ADURU
  - ANL01FL
  report: ../../../../log/admh-report.parquet
  order_by:
  - variable: STUDYID
    direction: asc
    nulls: last
  - variable: USUBJID
    direction: asc
    nulls: last
  - variable: ASEQ
    direction: asc
    nulls: last
columns:
- name: STUDYID
  type: str
  label: Study Identifier
  derivation: MH.STUDYID
  verifications:
  - max_length:
      max: 12
      severity: error
  submission:
    key_sequence: 1
    core: Req
    mandatory: true
    data_type: text
    length: 12
    origins:
    - type: Predecessor
      description: MH.STUDYID
- name: USUBJID
  type: str
  label: Unique Subject Identifier
  derivation: MH.USUBJID
  verifications:
  - max_length:
      max: 80
      severity: error
  submission:
    key_sequence: 2
    core: Req
    mandatory: true
    data_type: text
    length: 80
    origins:
    - type: Predecessor
      description: MH.USUBJID
- name: MHSEQ
  type: int
  label: Sequence Number
  derivation: MH.MHSEQ
  submission:
    core: Req
    mandatory: false
    data_type: integer
    length: 8
    origins:
    - type: Predecessor
      description: MH.MHSEQ
- name: MHTERM
  type: str
  label: Reported Term for the Medical History
  derivation: MH.MHTERM
  submission:
    core: Req
    mandatory: false
    data_type: text
    length: 200
    origins:
    - type: Predecessor
      description: MH.MHTERM
- name: MHSPID
  type: str
  label: Source Group Ordinal
  derivation: MH.MHSPID
  submission:
    core: Perm
    mandatory: false
    data_type: text
    length: 20
    origins:
    - type: Predecessor
      description: MH.MHSPID
- name: MHDECOD
  type: str
  label: Dictionary-Derived Term
  derivation: MH.MHDECOD
  submission:
    core: Perm
    mandatory: false
    data_type: text
    length: 200
    origins:
    - type: Predecessor
      description: MH.MHDECOD
- name: MHSTDTC
  type: str
  label: Start Date/Time of Medical History Event
  derivation: MH.MHSTDTC
  submission:
    core: Perm
    mandatory: false
    data_type: text
    length: 25
    origins:
    - type: Predecessor
      description: MH.MHSTDTC
- name: MHENDTC
  type: str
  label: End Date/Time of Medical History Event
  derivation: MH.MHENDTC
  submission:
    core: Perm
    mandatory: false
    data_type: text
    length: 25
    origins:
    - type: Predecessor
      description: MH.MHENDTC
- name: VISIT
  type: str
  label: Visit Name
  derivation: MH.VISIT
  submission:
    core: Perm
    mandatory: false
    data_type: text
    length: 80
    origins:
    - type: Predecessor
      description: MH.VISIT
- name: MHCAT
  type: str
  label: Category for Medical History
  derivation: MH.MHCAT
  submission:
    core: Cond
    mandatory: false
    data_type: text
    length: 40
    origins:
    - type: Predecessor
      description: MH.MHCAT
- name: SUBJID
  type: str
  label: Subject Identifier for the Study
  derivation: ADSL.SUBJID
  submission:
    core: Req
    mandatory: false
    data_type: text
    length: 40
    origins:
    - type: Predecessor
      description: ADSL.SUBJID
- name: SITEID
  type: str
  label: Study Site Identifier
  derivation: ADSL.SITEID
  submission:
    core: Req
    mandatory: false
    data_type: text
    length: 20
    origins:
    - type: Predecessor
      description: ADSL.SITEID
- name: AGE
  type: int
  label: Age
  derivation: ADSL.AGE
  submission:
    core: Req
    mandatory: false
    data_type: integer
    length: 8
    origins:
    - type: Predecessor
      description: ADSL.AGE
- name: SEX
  type: str
  label: Sex
  derivation: ADSL.SEX
  submission:
    core: Req
    mandatory: false
    data_type: text
    length: 1
    codelist: SEX
    origins:
    - type: Predecessor
      description: ADSL.SEX
- name: RACE
  type: str
  label: Race
  derivation: ADSL.RACE
  submission:
    core: Req
    mandatory: false
    data_type: text
    length: 60
    codelist: RACE
    origins:
    - type: Predecessor
      description: ADSL.RACE
- name: TRT01P
  type: str
  label: Planned Treatment for Period 01
  derivation: ADSL.TRT01P
  submission:
    core: Req
    mandatory: false
    data_type: text
    length: 40
    origins:
    - type: Predecessor
      description: ADSL.TRT01P
- name: TRT01A
  type: str
  label: Actual Treatment for Period 01
  derivation: ADSL.TRT01A
  submission:
    core: Req
    mandatory: false
    data_type: text
    length: 40
    origins:
    - type: Predecessor
      description: ADSL.TRT01A
- name: SAFFL
  type: str
  label: Documented Exposure Safety Flag
  derivation: ADSL.SAFFL
  submission:
    core: Req
    mandatory: false
    data_type: text
    length: 1
    codelist: NY
    origins:
    - type: Predecessor
      description: ADSL.SAFFL
- name: AGEGR1
  type: str
  label: Pooled Age Group 1
  derivation: ADSL.AGEGR1
  submission:
    core: Perm
    mandatory: false
    data_type: text
    length: 8
    codelist: AGEGR1
    origins:
    - type: Predecessor
      description: ADSL.AGEGR1
- name: STRAT1
  type: str
  label: Phenotype Stratification Code
  derivation: ADSL.STRAT1
  submission:
    core: Perm
    mandatory: false
    data_type: text
    length: 8
    codelist: STRAT1
    origins:
    - type: Predecessor
      description: ADSL.STRAT1
- name: STRAT1L
  type: str
  label: Randomization Phenotype Label
  derivation: ADSL.STRAT1L
  submission:
    core: Perm
    mandatory: false
    data_type: text
    length: 80
    origins:
    - type: Predecessor
      description: ADSL.STRAT1L
- name: TRT01PN
  type: int
  label: Planned Treatment Number Period 01
  derivation: ADSL.TRT01PN
  submission:
    core: Perm
    mandatory: false
    data_type: integer
    length: 8
    origins:
    - type: Predecessor
      description: ADSL.TRT01PN
- name: TRT01AN
  type: int
  label: Actual Treatment Number Period 01
  derivation: ADSL.TRT01AN
  submission:
    core: Perm
    mandatory: false
    data_type: integer
    length: 8
    origins:
    - type: Predecessor
      description: ADSL.TRT01AN
- name: RANDFL
  type: str
  label: Randomization Workflow Record Flag
  derivation: ADSL.RANDFL
  submission:
    core: Perm
    mandatory: false
    data_type: text
    length: 1
    codelist: NY
    origins:
    - type: Predecessor
      description: ADSL.RANDFL
- name: ITTCAND
  type: str
  label: Candidate ITT Population Flag
  derivation: ADSL.ITTCAND
  submission:
    core: Perm
    mandatory: false
    data_type: text
    length: 1
    codelist: NY
    origins:
    - type: Predecessor
      description: ADSL.ITTCAND
- name: EFFFL
  type: str
  label: Efficacy Analysis Population Flag
  derivation: ADSL.EFFFL
  submission:
    core: Perm
    mandatory: false
    data_type: text
    length: 1
    codelist: NY
    origins:
    - type: Predecessor
      description: ADSL.EFFFL
- name: TRTSDT
  type: date
  label: Date of First Exposure to Treatment
  derivation: ADSL.TRTSDT
  submission:
    core: Perm
    mandatory: false
    data_type: integer
    length: 8
    display_format: DATE9.
    origins:
    - type: Predecessor
      description: ADSL.TRTSDT
- name: TRTEDT
  type: date
  label: Date of Last Exposure to Treatment
  derivation: ADSL.TRTEDT
  submission:
    core: Perm
    mandatory: false
    data_type: integer
    length: 8
    display_format: DATE9.
    origins:
    - type: Predecessor
      description: ADSL.TRTEDT
- name: ASEQ
  type: int
  label: Analysis Sequence Number
  derivation: MH.MHSEQ
  submission:
    key_sequence: 3
    core: Req
    mandatory: true
    data_type: integer
    length: 8
    origins:
    - type: Predecessor
      description: MH.MHSEQ
- name: ASTDT
  type: date
  label: Analysis Start Date
  derivation:
    impute:
      type: date
      source: MH.MHSTDTC
      invalid: null
  submission:
    core: Cond
    mandatory: false
    data_type: integer
    length: 8
    display_format: DATE9.
    origins:
    - type: Derived
    method:
      type: Computation
      description: "Executable yamaa derivation: impute:\n  type: date\n  source:\
        \ MH.MHSTDTC\n  invalid: null"
- name: AENDT
  type: date
  label: Analysis End Date
  derivation:
    impute:
      type: date
      source: MH.MHENDTC
      invalid: null
  submission:
    core: Perm
    mandatory: false
    data_type: integer
    length: 8
    display_format: DATE9.
    origins:
    - type: Derived
    method:
      type: Computation
      description: "Executable yamaa derivation: impute:\n  type: date\n  source:\
        \ MH.MHENDTC\n  invalid: null"
- name: ASTDY
  type: int
  label: Analysis Start Relative Day
  derivation:
    study_day:
      source: ASTDT
      reference: TRTSDT
  submission:
    core: Perm
    mandatory: false
    data_type: integer
    length: 8
    origins:
    - type: Derived
    method:
      type: Computation
      description: "Executable yamaa derivation: study_day:\n  source: ASTDT\n  reference:\
        \ TRTSDT"
- name: AENDY
  type: int
  label: Analysis End Relative Day
  derivation:
    study_day:
      source: AENDT
      reference: TRTSDT
  submission:
    core: Perm
    mandatory: false
    data_type: integer
    length: 8
    origins:
    - type: Derived
    method:
      type: Computation
      description: "Executable yamaa derivation: study_day:\n  source: AENDT\n  reference:\
        \ TRTSDT"
- name: TRTP
  type: str
  label: Planned Treatment
  derivation: TRT01P
  verifications:
  - max_length:
      max: 40
      severity: error
  submission:
    core: Perm
    mandatory: false
    data_type: text
    length: 40
    origins:
    - type: Derived
    method:
      type: Computation
      description: 'Executable yamaa derivation: TRT01P

        ...'
- name: TRTA
  type: str
  label: Actual Treatment
  derivation: TRT01A
  verifications:
  - max_length:
      max: 40
      severity: error
  submission:
    core: Perm
    mandatory: false
    data_type: text
    length: 40
    origins:
    - type: Derived
    method:
      type: Computation
      description: 'Executable yamaa derivation: TRT01A

        ...'
- name: SRCDOM
  type: str
  label: Source Domain
  derivation: '''MH'''
  verifications:
  - max_length:
      max: 2
      severity: error
  submission:
    core: Perm
    mandatory: false
    data_type: text
    length: 2
    origins:
    - type: Assigned
- name: SRCSEQ
  type: int
  label: Source Sequence Number
  derivation: MH.MHSEQ
  submission:
    core: Perm
    mandatory: false
    data_type: integer
    length: 8
    origins:
    - type: Predecessor
      description: MH.MHSEQ
- name: SRCVAR
  type: str
  label: Source Variable
  derivation: '''MHTERM'''
  verifications:
  - max_length:
      max: 8
      severity: error
  submission:
    core: Perm
    mandatory: false
    data_type: text
    length: 8
    origins:
    - type: Assigned
- name: DAYS
  type: int
  label: DAYS
  derivation:
    diff:
      type: date
      start: ASTDT
      end: AENDT
      unit: day
      closed: both
- name: ADURN
  type: int
  label: Analysis Duration (Days)
  derivation:
    case:
    - when: AENDT >= ASTDT
      then: DAYS
    - otherwise: null
  submission:
    core: Perm
    mandatory: false
    data_type: integer
    length: 8
    origins:
    - type: Derived
    method:
      type: Computation
      description: Inclusive duration only for two full non-inverted dates. Recorded
        dates are not corrected.
    comment: Inclusive duration only for two full non-inverted dates. Recorded dates
      are not corrected.
- name: ADURU
  type: str
  label: Analysis Duration Unit
  derivation:
    case:
    - when: ADURN IS NOT NULL
      then: '''DAYS'''
    - otherwise: null
  verifications:
  - max_length:
      max: 4
      severity: error
  submission:
    core: Perm
    mandatory: false
    data_type: text
    length: 4
    origins:
    - type: Derived
    method:
      type: Computation
      description: "Executable yamaa derivation: case:\n- when: ADURN IS NOT NULL\n\
        \  then: '''DAYS'''\n- otherwise: null"
- name: ANL01FL
  type: str
  label: Analysis Record Flag 01
  derivation: null
  verifications:
  - max_length:
      max: 1
      severity: error
  - allowed_values:
      values:
      - N
      - Y
      severity: error
  submission:
    core: Perm
    mandatory: false
    data_type: text
    length: 1
    codelist: NY
    origins:
    - type: Derived
    method:
      type: Computation
      description: No approved analysis-selection rule. These records are supplied
        for review.
    comment: No approved analysis-selection rule. These records are supplied for review.
verifications:
- assert:
    id: recorded_end_before_start
    require: AENDT IS NULL OR ASTDT IS NULL OR AENDT >= ASTDT
    severity: warning
submission:
  mode: historical
  artifact: admh.xpt
  has_no_data: false
  label: Medical History Analysis
  class: OCCURRENCE DATA STRUCTURE
  structure: One record per source observation per subject
  repeating: true
  reference_data: false
  non_standard: false
  comment: Review draft metadata. Historical mode keeps declarations separate from
    incomplete data; this is not a validated submission. See spec/review/decisions.md.
