yamaa: '1.0'
type: spec
model: ADaM
domain: ADSL
keys:
- STUDYID
- USUBJID
input:
  SUPP:
    path: ../../../../data/sdtm/suppdm.parquet
    relative_to: declaring
    schema: ../sdtm/suppdm.yaml
    empty_string: missing
    key:
    - USUBJID
  DS:
    path: ../../../../data/sdtm/ds.parquet
    relative_to: declaring
    schema: ../sdtm/ds.yaml
    empty_string: missing
    key:
    - USUBJID
  DM:
    path: ../../../../data/sdtm/dm.parquet
    relative_to: declaring
    schema: ../sdtm/dm.yaml
    empty_string: missing
base: DM
output:
  path: ../../../../data/adam/adsl-yamaa.parquet
  relative_to: declaring
  columns:
  - STUDYID
  - USUBJID
  - SUBJID
  - SITEID
  - AGE
  - AGEU
  - SEX
  - RACE
  - ETHNIC
  - COUNTRY
  - ARMCD
  - ARM
  - ACTARMCD
  - ACTARM
  - AGEGR1
  - AGEGR1N
  - STRAT1
  - STRAT1L
  - TRT01P
  - TRT01A
  - TRT01PN
  - TRT01AN
  - TRTSDT
  - TRTEDT
  - TRTDURD
  - RANDDT
  - RANDFL
  - ITTCAND
  - SAFFL
  - EFFFL
  - DCDECOD
  - DCREASCD
  - EOSDT
  - EOSSTT
  - COMPLFL
  - DTHDT
  report: ../../../../log/adsl-report.parquet
  order_by:
  - variable: STUDYID
    direction: asc
    nulls: last
  - variable: USUBJID
    direction: asc
    nulls: last
intermediates:
- id: FINAL
  dataset: DS
  key:
  - USUBJID
  filter: DS.DSCAT = 'DISPOSITION EVENT'
  order_by:
  - variable: DS.DSSTDTC
    direction: asc
    nulls: last
  - variable: DS.DSSEQ
    direction: asc
    nulls: last
  keep: last
columns:
- name: STUDYID
  type: str
  label: Study Identifier
  derivation: DM.STUDYID
  verifications:
  - max_length:
      max: 12
      severity: error
  submission:
    key_sequence: 1
    core: Req
    mandatory: true
    data_type: text
    length: 12
    origins:
    - type: Predecessor
      description: DM.STUDYID
- name: USUBJID
  type: str
  label: Unique Subject Identifier
  derivation: DM.USUBJID
  verifications:
  - max_length:
      max: 80
      severity: error
  submission:
    key_sequence: 2
    core: Req
    mandatory: true
    data_type: text
    length: 80
    origins:
    - type: Predecessor
      description: DM.USUBJID
- name: SUBJID
  type: str
  label: Subject Identifier for the Study
  derivation: DM.SUBJID
  submission:
    core: Req
    mandatory: false
    data_type: text
    length: 40
    origins:
    - type: Predecessor
      description: DM.SUBJID
- name: SITEID
  type: str
  label: Study Site Identifier
  derivation: DM.SITEID
  submission:
    core: Req
    mandatory: false
    data_type: text
    length: 20
    origins:
    - type: Predecessor
      description: DM.SITEID
- name: AGE
  type: int
  label: Age
  derivation: DM.AGE
  submission:
    core: Req
    mandatory: false
    data_type: integer
    length: 8
    origins:
    - type: Predecessor
      description: DM.AGE
- name: AGEU
  type: str
  label: Age Units
  derivation: DM.AGEU
  submission:
    core: Req
    mandatory: false
    data_type: text
    length: 5
    codelist: AGEU
    origins:
    - type: Predecessor
      description: DM.AGEU
- name: SEX
  type: str
  label: Sex
  derivation: DM.SEX
  submission:
    core: Req
    mandatory: false
    data_type: text
    length: 1
    codelist: SEX
    origins:
    - type: Predecessor
      description: DM.SEX
- name: RACE
  type: str
  label: Race
  derivation: DM.RACE
  submission:
    core: Req
    mandatory: false
    data_type: text
    length: 60
    codelist: RACE
    origins:
    - type: Predecessor
      description: DM.RACE
- name: COUNTRY
  type: str
  label: Country
  derivation: DM.COUNTRY
  submission:
    core: Req
    mandatory: false
    data_type: text
    length: 3
    origins:
    - type: Predecessor
      description: DM.COUNTRY
- name: ARMCD
  type: str
  label: Planned Arm Code
  derivation: DM.ARMCD
  submission:
    core: Req
    mandatory: false
    data_type: text
    length: 40
    origins:
    - type: Predecessor
      description: DM.ARMCD
- name: ARM
  type: str
  label: Description of Planned Arm
  derivation: DM.ARM
  submission:
    core: Req
    mandatory: false
    data_type: text
    length: 40
    origins:
    - type: Predecessor
      description: DM.ARM
- name: ACTARMCD
  type: str
  label: Actual Arm Code
  derivation: DM.ACTARMCD
  submission:
    core: Req
    mandatory: false
    data_type: text
    length: 40
    origins:
    - type: Predecessor
      description: DM.ACTARMCD
- name: ACTARM
  type: str
  label: Description of Actual Arm
  derivation: DM.ACTARM
  submission:
    core: Req
    mandatory: false
    data_type: text
    length: 40
    origins:
    - type: Predecessor
      description: DM.ACTARM
- name: ETHNIC
  type: str
  label: Ethnicity
  derivation: DM.ETHNIC
  submission:
    core: Perm
    mandatory: false
    data_type: text
    length: 30
    codelist: ETHNIC
    origins:
    - type: Predecessor
      description: DM.ETHNIC
- name: AGEGR1
  type: str
  label: Pooled Age Group 1
  derivation:
    case:
    - when: AGE < 65
      then: '''<65'''
    - when: AGE >= 65
      then: '''>=65'''
    - otherwise: null
  verifications:
  - max_length:
      max: 8
      severity: error
  - allowed_values:
      values:
      - <65
      - '>=65'
      severity: error
  submission:
    core: Perm
    mandatory: false
    data_type: text
    length: 8
    codelist: AGEGR1
    origins:
    - type: Derived
    method:
      type: Computation
      description: "Executable yamaa derivation: case:\n- when: AGE < 65\n  then:\
        \ '''<65'''\n- when: AGE >= 65\n  then: '''>=65'''\n- otherwise: null"
- name: AGEGR1N
  type: int
  label: Pooled Age Group 1 (N)
  derivation:
    mapping:
      source: AGEGR1
      dict:
        <65: 1
        '>=65': 2
      case_sensitive: true
      unmapped: null
  submission:
    core: Perm
    mandatory: false
    data_type: integer
    length: 8
    origins:
    - type: Derived
    method:
      type: Computation
      description: "Executable yamaa derivation: mapping:\n  source: AGEGR1\n  dict:\n\
        \    <65: 1\n    '>=65': 2\n  missing: null\n  unmapped: null"
- name: PROFILE
  type: str
  label: PROFILE
  derivation:
    source:
      variable: SUPP.QVAL
      filter: SUPP.QNAM = 'RANDPROF'
- name: STRAT1
  type: str
  label: Phenotype Stratification Code
  derivation:
    mapping:
      source: PROFILE
      dict:
        a non-Hispanic male: NHM
        a non-Hispanic female: NHF
        an Hispanic male: HM
        an Hispanic female: HF
      case_sensitive: true
      unmapped: null
  verifications:
  - max_length:
      max: 8
      severity: error
  - allowed_values:
      values:
      - NHM
      - NHF
      - HM
      - HF
      severity: error
  submission:
    core: Perm
    mandatory: false
    data_type: text
    length: 8
    codelist: STRAT1
    origins:
    - type: Derived
    method:
      type: Computation
      description: Phenotype from SUPPDM.RANDPROF; not a treatment arm.
    comment: Phenotype from SUPPDM.RANDPROF; not a treatment arm.
- name: STRAT1L
  type: str
  label: Randomization Phenotype Label
  derivation: PROFILE
  verifications:
  - max_length:
      max: 80
      severity: error
  submission:
    core: Perm
    mandatory: false
    data_type: text
    length: 80
    origins:
    - type: Derived
    method:
      type: Computation
      description: 'Executable yamaa derivation: PROFILE

        ...'
- name: TRT01P
  type: str
  label: Planned Treatment for Period 01
  derivation: ARM
  verifications:
  - max_length:
      max: 40
      severity: error
  submission:
    core: Req
    mandatory: false
    data_type: text
    length: 40
    origins:
    - type: Derived
    method:
      type: Computation
      description: 'Executable yamaa derivation: ARM

        ...'
- name: TRT01A
  type: str
  label: Actual Treatment for Period 01
  derivation: ACTARM
  verifications:
  - max_length:
      max: 40
      severity: error
  submission:
    core: Req
    mandatory: false
    data_type: text
    length: 40
    origins:
    - type: Derived
    method:
      type: Computation
      description: 'Executable yamaa derivation: ACTARM

        ...'
- name: TRT01PN
  type: int
  label: Planned Treatment Number Period 01
  derivation: null
  submission:
    core: Req
    mandatory: false
    data_type: integer
    length: 8
    origins:
    - type: Derived
    method:
      type: Computation
      description: Not derivable; the output remains missing.
- name: TRT01AN
  type: int
  label: Actual Treatment Number Period 01
  derivation: null
  submission:
    core: Req
    mandatory: false
    data_type: integer
    length: 8
    origins:
    - type: Derived
    method:
      type: Computation
      description: Not derivable; the output remains missing.
- name: TRTSDT
  type: date
  label: Date of First Exposure to Treatment
  derivation:
    impute:
      type: date
      source: DM.RFXSTDTC
      invalid: null
  submission:
    core: Cond
    mandatory: false
    data_type: integer
    length: 8
    display_format: DATE9.
    origins:
    - type: Derived
    method:
      type: Computation
      description: "Executable yamaa derivation: impute:\n  type: date\n  source:\
        \ DM.RFXSTDTC\n  invalid: null"
- name: TRTEDT
  type: date
  label: Date of Last Exposure to Treatment
  derivation:
    impute:
      type: date
      source: DM.RFXENDTC
      invalid: null
  submission:
    core: Cond
    mandatory: false
    data_type: integer
    length: 8
    display_format: DATE9.
    origins:
    - type: Derived
    method:
      type: Computation
      description: "Executable yamaa derivation: impute:\n  type: date\n  source:\
        \ DM.RFXENDTC\n  invalid: null"
- name: TRTDURD
  type: int
  label: Duration of Treatment (Days)
  derivation: null
  submission:
    core: Perm
    mandatory: false
    data_type: integer
    length: 8
    origins:
    - type: Derived
    method:
      type: Computation
      description: No documented treatment reference dates.
    comment: No documented treatment reference dates.
- name: RAND_DTC
  type: str
  label: RAND_DTC
  derivation:
    source:
      variable: DS.DSSTDTC
      filter: DS.DSDECOD = 'RANDOMIZATION RECORD PRESENT'
      order_by:
      - variable: DS.DSSEQ
        direction: asc
      keep: first
- name: RANDDT
  type: date
  label: Date of Randomization
  derivation:
    impute:
      type: date
      source: RAND_DTC
      invalid: null
  submission:
    core: Perm
    mandatory: false
    data_type: integer
    length: 8
    display_format: DATE9.
    origins:
    - type: Derived
    method:
      type: Computation
      description: Administrative baseline event date attached to a recorded randomization
        phenotype. This is a proxy, not a verified randomization timestamp.
    comment: Administrative baseline event date attached to a recorded randomization
      phenotype. This is a proxy, not a verified randomization timestamp.
- name: RANDFL
  type: str
  label: Randomization Workflow Record Flag
  derivation:
    flag:
      condition: PROFILE IS NOT NULL
      true_value: Y
      false_value: N
      missing: N
  verifications:
  - max_length:
      max: 1
      severity: error
  - allowed_values:
      values:
      - N
      - Y
      severity: error
  submission:
    core: Cond
    mandatory: false
    data_type: text
    length: 1
    codelist: NY
    origins:
    - type: Derived
    method:
      type: Computation
      description: Y for recorded randomization PROFILE, regardless of RANDDT availability.
        This workflow proxy requires clinical confirmation.
    comment: Y for recorded randomization PROFILE, regardless of RANDDT availability.
      This workflow proxy requires clinical confirmation.
- name: ITTCAND
  type: str
  label: Candidate ITT Population Flag
  derivation: RANDFL
  verifications:
  - max_length:
      max: 1
      severity: error
  - allowed_values:
      values:
      - N
      - Y
      severity: error
  submission:
    core: Perm
    mandatory: false
    data_type: text
    length: 1
    codelist: NY
    origins:
    - type: Derived
    method:
      type: Computation
      description: Candidate ITT membership from recorded randomization workflow.
        No approved ITT population is claimed without a SAP.
    comment: Candidate ITT membership from recorded randomization workflow. No approved
      ITT population is claimed without a SAP.
- name: SAFFL
  type: str
  label: Documented Exposure Safety Flag
  derivation: '''N'''
  verifications:
  - max_length:
      max: 1
      severity: error
  - allowed_values:
      values:
      - N
      - Y
      severity: error
  submission:
    core: Cond
    mandatory: false
    data_type: text
    length: 1
    codelist: NY
    origins:
    - type: Assigned
    comment: No documented exposure in this export. AE occurrence is not evidence
      of study treatment. N means no documented eligibility for the safety population.
- name: EFFFL
  type: str
  label: Efficacy Analysis Population Flag
  derivation: '''N'''
  verifications:
  - max_length:
      max: 1
      severity: error
  - allowed_values:
      values:
      - N
      - Y
      severity: error
  submission:
    core: Perm
    mandatory: false
    data_type: text
    length: 1
    codelist: NY
    origins:
    - type: Assigned
    comment: No approved efficacy population or endpoint in the supplied materials.
- name: DCDECOD
  type: str
  label: Standardized Disposition Term
  derivation: FINAL.DSDECOD
  verifications:
  - max_length:
      max: 80
      severity: error
  submission:
    core: Perm
    mandatory: false
    data_type: text
    length: 80
    origins:
    - type: Predecessor
      description: FINAL.DSDECOD
- name: DCREASCD
  type: str
  label: Reason for Discontinuation
  derivation: FINAL.DSTERM
  verifications:
  - max_length:
      max: 200
      severity: error
  submission:
    core: Perm
    mandatory: false
    data_type: text
    length: 200
    origins:
    - type: Predecessor
      description: FINAL.DSTERM
- name: EOS_DTC
  type: str
  label: EOS_DTC
  derivation: FINAL.DSSTDTC
- name: EOSDT
  type: date
  label: Date of End of Study
  derivation:
    impute:
      type: date
      source: EOS_DTC
      invalid: null
  submission:
    core: Cond
    mandatory: false
    data_type: integer
    length: 8
    display_format: DATE9.
    origins:
    - type: Derived
    method:
      type: Computation
      description: "Executable yamaa derivation: impute:\n  type: date\n  source:\
        \ EOS_DTC\n  invalid: null"
- name: EOSSTT
  type: str
  label: End of Study Status
  derivation:
    case:
    - when: DCDECOD = 'ADVERSE EVENT' OR DCDECOD = 'WITHDRAWAL BY SUBJECT'
      then: '''DISCONTINUED'''
    - otherwise: '''UNKNOWN'''
  verifications:
  - max_length:
      max: 20
      severity: error
  submission:
    core: Cond
    mandatory: false
    data_type: text
    length: 20
    origins:
    - type: Derived
    method:
      type: Computation
      description: Only explicit disposition events establish discontinuation. No
        terminal record means UNKNOWN, not COMPLETED or ONGOING.
    comment: Only explicit disposition events establish discontinuation. No terminal
      record means UNKNOWN, not COMPLETED or ONGOING.
- name: COMPLFL
  type: str
  label: Study Completer Flag
  derivation: '''N'''
  verifications:
  - max_length:
      max: 1
      severity: error
  - allowed_values:
      values:
      - N
      - Y
      severity: error
  submission:
    core: Perm
    mandatory: false
    data_type: text
    length: 1
    codelist: NY
    origins:
    - type: Assigned
    comment: No explicit completion event exists. No completion is synthesized from
      randomization.
- name: DTHDT
  type: date
  label: DTHDT
  derivation:
    impute:
      type: date
      source: DM.DTHDTC
      invalid: null
  submission:
    core: Perm
    mandatory: false
    data_type: integer
    length: 8
    display_format: DATE9.
    origins:
    - type: Derived
    method:
      type: Computation
      description: "Executable yamaa derivation: impute:\n  type: date\n  source:\
        \ DM.DTHDTC\n  invalid: null"
submission:
  mode: historical
  artifact: adsl.xpt
  has_no_data: false
  label: Subject-Level Analysis Dataset
  class: SUBJECT LEVEL ANALYSIS DATASET
  structure: One record per subject
  repeating: false
  reference_data: false
  non_standard: false
  comment: Review draft metadata. Historical mode keeps declarations separate from
    incomplete data; this is not a validated submission. See spec/review/decisions.md.
