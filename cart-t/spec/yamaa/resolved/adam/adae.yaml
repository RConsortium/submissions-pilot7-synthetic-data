yamaa: '1.0'
type: spec
model: ADaM
domain: ADAE
keys:
- STUDYID
- USUBJID
- ASEQ
input:
  ADSL:
    path: ../../../../data/adam/adsl-yamaa.parquet
    relative_to: declaring
    schema: adsl.yaml
    empty_string: missing
    key:
    - USUBJID
  AE:
    path: ../../../../data/sdtm/ae.parquet
    relative_to: declaring
    schema: ../sdtm/ae.yaml
    empty_string: missing
base: AE
output:
  path: ../../../../data/adam/adae-yamaa.parquet
  relative_to: declaring
  columns:
  - STUDYID
  - USUBJID
  - AESEQ
  - AESPID
  - AETERM
  - AEDECOD
  - AEBODSYS
  - AESEV
  - AESER
  - AEACN
  - AEREL
  - AESCONG
  - AESDISAB
  - AESDTH
  - AESHOSP
  - AESLIFE
  - AESMIE
  - AEOUT
  - AESTDTC
  - AEENDTC
  - AEENRTPT
  - AEENTPT
  - VISIT
  - SUBJID
  - SITEID
  - AGE
  - AGEGR1
  - SEX
  - RACE
  - STRAT1
  - STRAT1L
  - TRT01P
  - TRT01PN
  - TRT01A
  - TRT01AN
  - TRTSDT
  - TRTEDT
  - RANDFL
  - ITTCAND
  - SAFFL
  - EFFFL
  - ASEQ
  - ASTDT
  - AENDT
  - ASTDY
  - AENDY
  - TRTP
  - TRTA
  - SRCDOM
  - SRCSEQ
  - SRCVAR
  - ADURN
  - ADURU
  - ASEV
  - AESEVN
  - AREL
  - TRTEMFL
  - ANL01FL
  report: ../../../../log/adae-report.parquet
  order_by:
  - variable: STUDYID
    direction: asc
    nulls: last
  - variable: USUBJID
    direction: asc
    nulls: last
  - variable: ASEQ
    direction: asc
    nulls: last
columns:
- name: STUDYID
  type: str
  label: Study Identifier
  derivation: AE.STUDYID
  verifications:
  - max_length:
      max: 12
      severity: error
  submission:
    key_sequence: 1
    core: Req
    mandatory: true
    data_type: text
    length: 12
    origins:
    - type: Predecessor
      description: AE.STUDYID
- name: USUBJID
  type: str
  label: Unique Subject Identifier
  derivation: AE.USUBJID
  verifications:
  - max_length:
      max: 80
      severity: error
  submission:
    key_sequence: 2
    core: Req
    mandatory: true
    data_type: text
    length: 80
    origins:
    - type: Predecessor
      description: AE.USUBJID
- name: AESEQ
  type: int
  label: Sequence Number
  derivation: AE.AESEQ
  submission:
    core: Req
    mandatory: false
    data_type: integer
    length: 8
    origins:
    - type: Predecessor
      description: AE.AESEQ
- name: AETERM
  type: str
  label: Reported Term for the Adverse Event
  derivation: AE.AETERM
  submission:
    core: Req
    mandatory: false
    data_type: text
    length: 200
    origins:
    - type: Predecessor
      description: AE.AETERM
- name: AESPID
  type: str
  label: Source Group Ordinal
  derivation: AE.AESPID
  submission:
    core: Perm
    mandatory: false
    data_type: text
    length: 20
    origins:
    - type: Predecessor
      description: AE.AESPID
- name: AEACN
  type: str
  label: Action Taken with Study Treatment
  derivation: AE.AEACN
  submission:
    core: Perm
    mandatory: false
    data_type: text
    length: 40
    origins:
    - type: Predecessor
      description: AE.AEACN
- name: AESCONG
  type: str
  label: Congenital Anomaly or Birth Defect
  derivation: AE.AESCONG
  submission:
    core: Perm
    mandatory: false
    data_type: text
    length: 12
    codelist: NY
    origins:
    - type: Predecessor
      description: AE.AESCONG
- name: AESDISAB
  type: str
  label: Persist/Significant Disability/Incapacit
  derivation: AE.AESDISAB
  submission:
    core: Perm
    mandatory: false
    data_type: text
    length: 12
    codelist: NY
    origins:
    - type: Predecessor
      description: AE.AESDISAB
- name: AESDTH
  type: str
  label: Results in Death
  derivation: AE.AESDTH
  submission:
    core: Perm
    mandatory: false
    data_type: text
    length: 12
    codelist: NY
    origins:
    - type: Predecessor
      description: AE.AESDTH
- name: AESHOSP
  type: str
  label: Requires or Prolongs Hospitalization
  derivation: AE.AESHOSP
  submission:
    core: Perm
    mandatory: false
    data_type: text
    length: 12
    codelist: NY
    origins:
    - type: Predecessor
      description: AE.AESHOSP
- name: AESLIFE
  type: str
  label: Is Life Threatening
  derivation: AE.AESLIFE
  submission:
    core: Perm
    mandatory: false
    data_type: text
    length: 12
    codelist: NY
    origins:
    - type: Predecessor
      description: AE.AESLIFE
- name: AESMIE
  type: str
  label: Other Medically Important Serious Event
  derivation: AE.AESMIE
  submission:
    core: Perm
    mandatory: false
    data_type: text
    length: 1
    codelist: NY
    origins:
    - type: Predecessor
      description: AE.AESMIE
- name: AEENRTPT
  type: str
  label: End Relative to Reference Time Point
  derivation: AE.AEENRTPT
  submission:
    core: Perm
    mandatory: false
    data_type: text
    length: 12
    origins:
    - type: Predecessor
      description: AE.AEENRTPT
- name: AEENTPT
  type: str
  label: End Reference Time Point
  derivation: AE.AEENTPT
  submission:
    core: Perm
    mandatory: false
    data_type: text
    length: 40
    origins:
    - type: Predecessor
      description: AE.AEENTPT
- name: VISIT
  type: str
  label: Visit Name
  derivation: AE.VISIT
  submission:
    core: Perm
    mandatory: false
    data_type: text
    length: 80
    origins:
    - type: Predecessor
      description: AE.VISIT
- name: AEDECOD
  type: str
  label: Dictionary-Derived Term
  derivation: AE.AEDECOD
  submission:
    core: Cond
    mandatory: false
    data_type: text
    length: 200
    origins:
    - type: Predecessor
      description: AE.AEDECOD
- name: AEBODSYS
  type: str
  label: Body System or Organ Class
  derivation: AE.AEBODSYS
  submission:
    core: Cond
    mandatory: false
    data_type: text
    length: 200
    origins:
    - type: Predecessor
      description: AE.AEBODSYS
- name: AESEV
  type: str
  label: Severity/Intensity
  derivation: AE.AESEV
  submission:
    core: Cond
    mandatory: false
    data_type: text
    length: 12
    origins:
    - type: Predecessor
      description: AE.AESEV
- name: AESER
  type: str
  label: Serious Event
  derivation: AE.AESER
  submission:
    core: Cond
    mandatory: false
    data_type: text
    length: 12
    codelist: NY
    origins:
    - type: Predecessor
      description: AE.AESER
- name: AEREL
  type: str
  label: Causality
  derivation: AE.AEREL
  submission:
    core: Cond
    mandatory: false
    data_type: text
    length: 40
    origins:
    - type: Predecessor
      description: AE.AEREL
- name: AEOUT
  type: str
  label: Outcome of Adverse Event
  derivation: AE.AEOUT
  submission:
    core: Cond
    mandatory: false
    data_type: text
    length: 40
    origins:
    - type: Predecessor
      description: AE.AEOUT
- name: AESTDTC
  type: str
  label: Start Date/Time of Adverse Event
  derivation: AE.AESTDTC
  submission:
    core: Cond
    mandatory: false
    data_type: text
    length: 25
    origins:
    - type: Predecessor
      description: AE.AESTDTC
- name: AEENDTC
  type: str
  label: End Date/Time of Adverse Event
  derivation: AE.AEENDTC
  submission:
    core: Cond
    mandatory: false
    data_type: text
    length: 25
    origins:
    - type: Predecessor
      description: AE.AEENDTC
- name: SUBJID
  type: str
  label: Subject Identifier for the Study
  derivation: ADSL.SUBJID
  submission:
    core: Req
    mandatory: false
    data_type: text
    length: 40
    origins:
    - type: Predecessor
      description: ADSL.SUBJID
- name: SITEID
  type: str
  label: Study Site Identifier
  derivation: ADSL.SITEID
  submission:
    core: Req
    mandatory: false
    data_type: text
    length: 20
    origins:
    - type: Predecessor
      description: ADSL.SITEID
- name: AGE
  type: int
  label: Age
  derivation: ADSL.AGE
  submission:
    core: Req
    mandatory: false
    data_type: integer
    length: 8
    origins:
    - type: Predecessor
      description: ADSL.AGE
- name: SEX
  type: str
  label: Sex
  derivation: ADSL.SEX
  submission:
    core: Req
    mandatory: false
    data_type: text
    length: 1
    codelist: SEX
    origins:
    - type: Predecessor
      description: ADSL.SEX
- name: RACE
  type: str
  label: Race
  derivation: ADSL.RACE
  submission:
    core: Req
    mandatory: false
    data_type: text
    length: 60
    codelist: RACE
    origins:
    - type: Predecessor
      description: ADSL.RACE
- name: TRT01P
  type: str
  label: Planned Treatment for Period 01
  derivation: ADSL.TRT01P
  submission:
    core: Req
    mandatory: false
    data_type: text
    length: 40
    origins:
    - type: Predecessor
      description: ADSL.TRT01P
- name: TRT01PN
  type: int
  label: Planned Treatment Number Period 01
  derivation: ADSL.TRT01PN
  submission:
    core: Req
    mandatory: false
    data_type: integer
    length: 8
    origins:
    - type: Predecessor
      description: ADSL.TRT01PN
- name: TRT01A
  type: str
  label: Actual Treatment for Period 01
  derivation: ADSL.TRT01A
  submission:
    core: Req
    mandatory: false
    data_type: text
    length: 40
    origins:
    - type: Predecessor
      description: ADSL.TRT01A
- name: TRT01AN
  type: int
  label: Actual Treatment Number Period 01
  derivation: ADSL.TRT01AN
  submission:
    core: Req
    mandatory: false
    data_type: integer
    length: 8
    origins:
    - type: Predecessor
      description: ADSL.TRT01AN
- name: RANDFL
  type: str
  label: Randomization Workflow Record Flag
  derivation: ADSL.RANDFL
  submission:
    core: Req
    mandatory: false
    data_type: text
    length: 1
    codelist: NY
    origins:
    - type: Predecessor
      description: ADSL.RANDFL
- name: SAFFL
  type: str
  label: Documented Exposure Safety Flag
  derivation: ADSL.SAFFL
  submission:
    core: Req
    mandatory: false
    data_type: text
    length: 1
    codelist: NY
    origins:
    - type: Predecessor
      description: ADSL.SAFFL
- name: TRTSDT
  type: date
  label: Date of First Exposure to Treatment
  derivation: ADSL.TRTSDT
  submission:
    core: Req
    mandatory: false
    data_type: integer
    length: 8
    display_format: DATE9.
    origins:
    - type: Predecessor
      description: ADSL.TRTSDT
- name: TRTEDT
  type: date
  label: Date of Last Exposure to Treatment
  derivation: ADSL.TRTEDT
  submission:
    core: Req
    mandatory: false
    data_type: integer
    length: 8
    display_format: DATE9.
    origins:
    - type: Predecessor
      description: ADSL.TRTEDT
- name: AGEGR1
  type: str
  label: Pooled Age Group 1
  derivation: ADSL.AGEGR1
  submission:
    core: Perm
    mandatory: false
    data_type: text
    length: 8
    codelist: AGEGR1
    origins:
    - type: Predecessor
      description: ADSL.AGEGR1
- name: STRAT1
  type: str
  label: Phenotype Stratification Code
  derivation: ADSL.STRAT1
  submission:
    core: Perm
    mandatory: false
    data_type: text
    length: 8
    codelist: STRAT1
    origins:
    - type: Predecessor
      description: ADSL.STRAT1
- name: STRAT1L
  type: str
  label: Randomization Phenotype Label
  derivation: ADSL.STRAT1L
  submission:
    core: Perm
    mandatory: false
    data_type: text
    length: 80
    origins:
    - type: Predecessor
      description: ADSL.STRAT1L
- name: ITTCAND
  type: str
  label: Candidate ITT Population Flag
  derivation: ADSL.ITTCAND
  submission:
    core: Perm
    mandatory: false
    data_type: text
    length: 1
    codelist: NY
    origins:
    - type: Predecessor
      description: ADSL.ITTCAND
- name: EFFFL
  type: str
  label: Efficacy Analysis Population Flag
  derivation: ADSL.EFFFL
  submission:
    core: Perm
    mandatory: false
    data_type: text
    length: 1
    codelist: NY
    origins:
    - type: Predecessor
      description: ADSL.EFFFL
- name: ASEQ
  type: int
  label: Analysis Sequence Number
  derivation: AE.AESEQ
  submission:
    key_sequence: 3
    core: Req
    mandatory: true
    data_type: integer
    length: 8
    origins:
    - type: Predecessor
      description: AE.AESEQ
- name: ASTDT
  type: date
  label: Analysis Start Date
  derivation:
    impute:
      type: date
      source: AE.AESTDTC
      invalid: null
  submission:
    core: Cond
    mandatory: false
    data_type: integer
    length: 8
    display_format: DATE9.
    origins:
    - type: Derived
    method:
      type: Computation
      description: "Executable yamaa derivation: impute:\n  type: date\n  source:\
        \ AE.AESTDTC\n  invalid: null"
- name: AENDT
  type: date
  label: Analysis End Date
  derivation:
    impute:
      type: date
      source: AE.AEENDTC
      invalid: null
  submission:
    core: Cond
    mandatory: false
    data_type: integer
    length: 8
    display_format: DATE9.
    origins:
    - type: Derived
    method:
      type: Computation
      description: "Executable yamaa derivation: impute:\n  type: date\n  source:\
        \ AE.AEENDTC\n  invalid: null"
- name: ASTDY
  type: int
  label: Analysis Start Relative Day
  derivation:
    study_day:
      source: ASTDT
      reference: TRTSDT
  submission:
    core: Perm
    mandatory: false
    data_type: integer
    length: 8
    origins:
    - type: Derived
    method:
      type: Computation
      description: "Executable yamaa derivation: study_day:\n  source: ASTDT\n  reference:\
        \ TRTSDT"
- name: AENDY
  type: int
  label: Analysis End Relative Day
  derivation:
    study_day:
      source: AENDT
      reference: TRTSDT
  submission:
    core: Perm
    mandatory: false
    data_type: integer
    length: 8
    origins:
    - type: Derived
    method:
      type: Computation
      description: "Executable yamaa derivation: study_day:\n  source: AENDT\n  reference:\
        \ TRTSDT"
- name: TRTP
  type: str
  label: Planned Treatment
  derivation: TRT01P
  verifications:
  - max_length:
      max: 40
      severity: error
  submission:
    core: Req
    mandatory: false
    data_type: text
    length: 40
    origins:
    - type: Derived
    method:
      type: Computation
      description: 'Executable yamaa derivation: TRT01P

        ...'
- name: TRTA
  type: str
  label: Actual Treatment
  derivation: TRT01A
  verifications:
  - max_length:
      max: 40
      severity: error
  submission:
    core: Req
    mandatory: false
    data_type: text
    length: 40
    origins:
    - type: Derived
    method:
      type: Computation
      description: 'Executable yamaa derivation: TRT01A

        ...'
- name: SRCDOM
  type: str
  label: Source Domain
  derivation: '''AE'''
  verifications:
  - max_length:
      max: 2
      severity: error
  submission:
    core: Perm
    mandatory: false
    data_type: text
    length: 2
    origins:
    - type: Assigned
- name: SRCSEQ
  type: int
  label: Source Sequence Number
  derivation: AE.AESEQ
  submission:
    core: Perm
    mandatory: false
    data_type: integer
    length: 8
    origins:
    - type: Predecessor
      description: AE.AESEQ
- name: SRCVAR
  type: str
  label: Source Variable
  derivation: '''AETERM'''
  verifications:
  - max_length:
      max: 8
      severity: error
  submission:
    core: Perm
    mandatory: false
    data_type: text
    length: 8
    origins:
    - type: Assigned
- name: DAYS
  type: int
  label: DAYS
  derivation:
    diff:
      type: date
      start: ASTDT
      end: AENDT
      unit: day
      closed: both
- name: ADURN
  type: int
  label: Analysis Duration (Days)
  derivation:
    case:
    - when: AENDT >= ASTDT
      then: DAYS
    - otherwise: null
  submission:
    core: Perm
    mandatory: false
    data_type: integer
    length: 8
    origins:
    - type: Derived
    method:
      type: Computation
      description: Inclusive duration only for two full non-inverted dates. Recorded
        dates are not corrected.
    comment: Inclusive duration only for two full non-inverted dates. Recorded dates
      are not corrected.
- name: ADURU
  type: str
  label: Analysis Duration Unit
  derivation:
    case:
    - when: ADURN IS NOT NULL
      then: '''DAYS'''
    - otherwise: null
  verifications:
  - max_length:
      max: 4
      severity: error
  submission:
    core: Perm
    mandatory: false
    data_type: text
    length: 4
    origins:
    - type: Derived
    method:
      type: Computation
      description: "Executable yamaa derivation: case:\n- when: ADURN IS NOT NULL\n\
        \  then: '''DAYS'''\n- otherwise: null"
- name: ASEV
  type: str
  label: Analysis Severity/Intensity
  derivation: AESEV
  verifications:
  - max_length:
      max: 12
      severity: error
  submission:
    core: Req
    mandatory: false
    data_type: text
    length: 12
    origins:
    - type: Derived
    method:
      type: Computation
      description: 'Executable yamaa derivation: AESEV

        ...'
- name: AESEVN
  type: int
  label: Severity/Intensity (N)
  derivation:
    mapping:
      source: AESEV
      dict:
        MILD: 1
        MODERATE: 2
        SEVERE: 3
      case_sensitive: true
      unmapped: null
  submission:
    core: Perm
    mandatory: false
    data_type: integer
    length: 8
    origins:
    - type: Derived
    method:
      type: Computation
      description: "Executable yamaa derivation: mapping:\n  source: AESEV\n  dict:\n\
        \    MILD: 1\n    MODERATE: 2\n    SEVERE: 3\n  missing: null\n  unmapped:\
        \ null"
- name: AREL
  type: str
  label: Analysis Causality
  derivation: AEREL
  verifications:
  - max_length:
      max: 40
      severity: error
  submission:
    core: Req
    mandatory: false
    data_type: text
    length: 40
    origins:
    - type: Derived
    method:
      type: Computation
      description: 'Executable yamaa derivation: AEREL

        ...'
- name: TRTEMFL
  type: str
  label: Treatment Emergent Analysis Flag
  derivation: null
  verifications:
  - max_length:
      max: 1
      severity: error
  - allowed_values:
      values:
      - N
      - Y
      severity: error
  submission:
    core: Cond
    mandatory: false
    data_type: text
    length: 1
    codelist: NY
    origins:
    - type: Derived
    method:
      type: Computation
      description: Treatment emergence cannot be established without exposure and
        an approved risk window.
    comment: Treatment emergence cannot be established without exposure and an approved
      risk window.
- name: ANL01FL
  type: str
  label: Analysis Record Flag 01
  derivation: null
  verifications:
  - max_length:
      max: 1
      severity: error
  - allowed_values:
      values:
      - N
      - Y
      severity: error
  submission:
    core: Cond
    mandatory: false
    data_type: text
    length: 1
    codelist: NY
    origins:
    - type: Derived
    method:
      type: Computation
      description: No approved analysis-selection rule. These records are supplied
        for review.
    comment: No approved analysis-selection rule. These records are supplied for review.
verifications:
- assert:
    id: recorded_end_before_start
    require: AENDT IS NULL OR ASTDT IS NULL OR AENDT >= ASTDT
    severity: warning
submission:
  mode: historical
  artifact: adae.xpt
  has_no_data: false
  label: Adverse Events Analysis
  class: OCCURRENCE DATA STRUCTURE
  structure: One record per source observation per subject
  repeating: true
  reference_data: false
  non_standard: false
  comment: Review draft metadata. Historical mode keeps declarations separate from
    incomplete data; this is not a validated submission. See spec/review/decisions.md.
