yamaa: '1.0'
type: spec
model: SDTM
domain: LB
keys:
- STUDYID
- USUBJID
- LBSEQ
input:
  RAW:
    path: ../../../../data/odm/car-t-openclinica.xml
    relative_to: declaring
    empty_string: missing
  DATES:
    path: ../../../../data/odm/car-t-openclinica.xml
    relative_to: declaring
    empty_string: missing
base: RAW
filter: (RAW.FormName = '2. Baseline Labs and Imaging' OR RAW.FormName = 'Lab Results')
  AND RAW.ItemName IN ('AMYLASE', 'BUN', 'CHLORIDE', 'HOMOC', 'CREAT', 'EGFR', 'CHOLES',
  'TRIG', 'HEMA', 'HEMO', 'RBC', 'WBC') AND RAW.Value IS NOT NULL
output:
  path: ../../../../data/sdtm/lb.parquet
  relative_to: declaring
  columns:
  - STUDYID
  - DOMAIN
  - USUBJID
  - LBSEQ
  - LBSPID
  - LBTESTCD
  - LBTEST
  - LBCAT
  - LBORRESU
  - LBORRES
  - LBSTRESC
  - LBSTRESN
  - LBSTRESU
  - LBDTC
  - LBBLFL
  - VISIT
  report: ../../../../log/lb-report.parquet
  order_by:
  - variable: STUDYID
    direction: asc
    nulls: last
  - variable: USUBJID
    direction: asc
    nulls: last
  - variable: LBSEQ
    direction: asc
    nulls: last
intermediates:
- id: DRAW_DATE
  dataset: DATES
  key:
    StudyOID: RAW.StudyOID
    MetaDataVersionOID: RAW.MetaDataVersionOID
    SubjectKey: RAW.SubjectKey
    StudyEventOID: RAW.StudyEventOID
  filter: DATES.ItemOID = 'I_2BASE_DATE_OF_BLOOD_DRAW' AND DATES.Value IS NOT NULL
    AND (DATES.StudyEventRepeatKey = RAW.StudyEventRepeatKey OR (DATES.StudyEventRepeatKey
    IS NULL AND RAW.StudyEventRepeatKey IS NULL))
  order_by:
  - variable: DATES.SourceOrdinal
    direction: asc
  keep: first
- id: DRAW_ALT
  dataset: DATES
  key:
    StudyOID: RAW.StudyOID
    MetaDataVersionOID: RAW.MetaDataVersionOID
    SubjectKey: RAW.SubjectKey
    StudyEventOID: RAW.StudyEventOID
  filter: DATES.ItemOID = 'I_2BASE_DRAWDATE' AND DATES.Value IS NOT NULL AND (DATES.StudyEventRepeatKey
    = RAW.StudyEventRepeatKey OR (DATES.StudyEventRepeatKey IS NULL AND RAW.StudyEventRepeatKey
    IS NULL))
  order_by:
  - variable: DATES.SourceOrdinal
    direction: asc
  keep: first
- id: FOLLOWUP_DATE
  dataset: DATES
  key:
    StudyOID: RAW.StudyOID
    MetaDataVersionOID: RAW.MetaDataVersionOID
    SubjectKey: RAW.SubjectKey
    StudyEventOID: RAW.StudyEventOID
    FormOID: RAW.FormOID
    ItemGroupOID: RAW.ItemGroupOID
  filter: DATES.ItemOID = 'I_LABRE_LABDATE' AND DATES.Value IS NOT NULL AND (DATES.StudyEventRepeatKey
    = RAW.StudyEventRepeatKey OR (DATES.StudyEventRepeatKey IS NULL AND RAW.StudyEventRepeatKey
    IS NULL)) AND (DATES.FormRepeatKey = RAW.FormRepeatKey OR (DATES.FormRepeatKey
    IS NULL AND RAW.FormRepeatKey IS NULL)) AND (DATES.ItemGroupRepeatKey = RAW.ItemGroupRepeatKey
    OR (DATES.ItemGroupRepeatKey IS NULL AND RAW.ItemGroupRepeatKey IS NULL))
  order_by:
  - variable: DATES.SourceOrdinal
    direction: asc
  keep: first
columns:
- name: STUDYID
  type: str
  label: Study Identifier
  derivation: '''CART-T-PILOT'''
  verifications:
  - max_length:
      max: 12
      severity: error
  submission:
    key_sequence: 1
    core: Req
    mandatory: true
    role: Identifier
    data_type: text
    length: 12
    origins:
    - type: Assigned
      source: Sponsor
- name: DOMAIN
  type: str
  label: Domain Abbreviation
  derivation: '''LB'''
  verifications:
  - max_length:
      max: 2
      severity: error
  submission:
    core: Req
    mandatory: true
    role: Identifier
    data_type: text
    length: 2
    origins:
    - type: Assigned
      source: Sponsor
- name: USUBJID
  type: str
  label: Unique Subject Identifier
  derivation:
    str_template: CART-T-PILOT-{RAW.SubjectKey}
  verifications:
  - max_length:
      max: 80
      severity: error
  submission:
    key_sequence: 2
    core: Req
    mandatory: true
    role: Identifier
    data_type: text
    length: 80
    origins:
    - type: Derived
      source: Sponsor
    method:
      type: Computation
      description: CART-T-PILOT followed by the globally unique ODM SubjectKey. Display
        subject ID is retained in DM.SUBJID.
    comment: CART-T-PILOT followed by the globally unique ODM SubjectKey. Display
      subject ID is retained in DM.SUBJID.
- name: LBSEQ
  type: int
  label: Sequence Number
  derivation:
    row_number:
      window:
        group_by:
        - USUBJID
        order_by:
        - variable: RAW.SourceOrdinal
          direction: asc
          nulls: last
  submission:
    key_sequence: 3
    core: Req
    mandatory: true
    role: Identifier
    data_type: integer
    length: 8
    origins:
    - type: Derived
      source: Sponsor
    method:
      type: Computation
      description: "Executable yamaa derivation: row_number:\n  window:\n    group_by:\n\
        \    - USUBJID\n    order_by:\n    - variable: RAW.SourceOrdinal\n      nulls:\
        \ last"
- name: LBSPID
  type: str
  label: Source Item Ordinal
  derivation: RAW.SourceOrdinal
  verifications:
  - max_length:
      max: 20
      severity: error
  submission:
    core: Perm
    mandatory: false
    role: Identifier
    data_type: text
    length: 20
    origins:
    - type: Predecessor
      description: RAW.SourceOrdinal
    comment: ODM SourceOrdinal (item), or first SourceOrdinal in the complete ODM
      item-group instance. Trace to SourceOrdinal in data/odm/items.parquet and the
      unchanged XML.
- name: LBTESTCD
  type: str
  label: Lab Test or Examination Short Name
  derivation:
    mapping:
      source: RAW.ItemName
      dict:
        AMYLASE: AMYLASE
        BUN: UREAN
        CHLORIDE: CL
        HOMOC: HOMOCY
        CREAT: CREAT
        EGFR: GFR
        CHOLES: CHOL
        TRIG: TRIG
        HEMA: HCT
        HEMO: HGB
        RBC: RBC
        WBC: WBC
      case_sensitive: true
      unmapped: null
  verifications:
  - max_length:
      max: 8
      severity: error
  - allowed_values:
      values:
      - AMYLASE
      - UREAN
      - CL
      - HOMOCY
      - CREAT
      - GFR
      - CHOL
      - TRIG
      - HCT
      - HGB
      - RBC
      - WBC
      severity: error
  submission:
    core: Req
    mandatory: true
    role: Topic
    data_type: text
    length: 8
    codelist: LBTESTCD
    origins:
    - type: Derived
      source: Sponsor
    method:
      type: Computation
      description: "Executable yamaa derivation: mapping:\n  source: RAW.ItemName\n\
        \  dict:\n    AMYLASE: AMYLASE\n    BUN: UREAN\n    CHLORIDE: CL\n    HOMOC:\
        \ HOMOCY\n    CREAT: CREAT\n    EGFR: GFR\n    CHOLES: CHOL\n    TRIG: TRIG\n\
        \    HEMA: HCT\n    HEMO: HGB\n    RBC: RBC\n    WBC: WBC\n  unmapped: null"
- name: LBTEST
  type: str
  label: Lab Test or Examination Name
  derivation:
    mapping:
      source: RAW.ItemName
      dict:
        AMYLASE: Amylase
        BUN: Urea Nitrogen
        CHLORIDE: Chloride
        HOMOC: Homocysteine
        CREAT: Creatinine
        EGFR: Glomerular Filtration Rate
        CHOLES: Cholesterol
        TRIG: Triglycerides
        HEMA: Hematocrit
        HEMO: Hemoglobin
        RBC: Erythrocytes
        WBC: Leukocytes
      case_sensitive: true
      unmapped: null
  verifications:
  - max_length:
      max: 40
      severity: error
  submission:
    core: Req
    mandatory: true
    role: Record Qualifier
    data_type: text
    length: 40
    origins:
    - type: Derived
      source: Sponsor
    method:
      type: Computation
      description: "Executable yamaa derivation: mapping:\n  source: RAW.ItemName\n\
        \  dict:\n    AMYLASE: Amylase\n    BUN: Urea Nitrogen\n    CHLORIDE: Chloride\n\
        \    HOMOC: Homocysteine\n    CREAT: Creatinine\n    EGFR: Glomerular Filtration\
        \ Rate\n    CHOLES: Cholesterol\n    TRIG: Triglycerides\n    HEMA: Hematocrit\n\
        \    HEMO: Hemoglobin\n    RBC: Erythrocytes\n    WBC: Leukocytes\n  unmapped:\
        \ null"
- name: LBCAT
  type: str
  label: Category for Lab Test
  derivation:
    mapping:
      source: RAW.ItemName
      dict:
        AMYLASE: CHEMISTRY
        BUN: CHEMISTRY
        CHLORIDE: CHEMISTRY
        HOMOC: CHEMISTRY
        CREAT: CHEMISTRY
        EGFR: CHEMISTRY
        CHOLES: CHEMISTRY
        TRIG: CHEMISTRY
        HEMA: HEMATOLOGY
        HEMO: HEMATOLOGY
        RBC: HEMATOLOGY
        WBC: HEMATOLOGY
      case_sensitive: true
      unmapped: null
  verifications:
  - max_length:
      max: 40
      severity: error
  submission:
    core: Exp
    mandatory: false
    role: Record Qualifier
    data_type: text
    length: 40
    origins:
    - type: Derived
      source: Sponsor
    method:
      type: Computation
      description: "Executable yamaa derivation: mapping:\n  source: RAW.ItemName\n\
        \  dict:\n    AMYLASE: CHEMISTRY\n    BUN: CHEMISTRY\n    CHLORIDE: CHEMISTRY\n\
        \    HOMOC: CHEMISTRY\n    CREAT: CHEMISTRY\n    EGFR: CHEMISTRY\n    CHOLES:\
        \ CHEMISTRY\n    TRIG: CHEMISTRY\n    HEMA: HEMATOLOGY\n    HEMO: HEMATOLOGY\n\
        \    RBC: HEMATOLOGY\n    WBC: HEMATOLOGY\n  unmapped: null"
- name: LBORRESU
  type: str
  label: Original Units
  derivation:
    mapping:
      source: RAW.ItemName
      dict:
        AMYLASE: U/L
        BUN: mg/dL
        CHLORIDE: mmol/L
        HOMOC: umol/L
        CREAT: mg/dL
        EGFR: mL/min/1.73 m2
        CHOLES: mg/dL
        TRIG: mg/dL
        HEMA: '%'
        HEMO: g/dL
        RBC: 10^12/L
        WBC: 10^9/L
      case_sensitive: true
      unmapped: null
  verifications:
  - max_length:
      max: 40
      severity: error
  submission:
    core: Exp
    mandatory: false
    role: Record Qualifier
    data_type: text
    length: 40
    origins:
    - type: Derived
      source: Sponsor
    method:
      type: Computation
      description: "Executable yamaa derivation: mapping:\n  source: RAW.ItemName\n\
        \  dict:\n    AMYLASE: U/L\n    BUN: mg/dL\n    CHLORIDE: mmol/L\n    HOMOC:\
        \ umol/L\n    CREAT: mg/dL\n    EGFR: mL/min/1.73 m2\n    CHOLES: mg/dL\n\
        \    TRIG: mg/dL\n    HEMA: '%'\n    HEMO: g/dL\n    RBC: 10^12/L\n    WBC:\
        \ 10^9/L\n  unmapped: null"
- name: LBORRES
  type: str
  label: Result or Finding in Original Units
  derivation: RAW.Value
  verifications:
  - max_length:
      max: 80
      severity: error
  submission:
    core: Exp
    mandatory: false
    role: Record Qualifier
    data_type: text
    length: 80
    origins:
    - type: Predecessor
      description: RAW.Value
- name: LBSTRESC
  type: str
  label: Character Result/Finding in Std Format
  derivation: LBORRES
  verifications:
  - max_length:
      max: 80
      severity: error
  submission:
    core: Req
    mandatory: true
    role: Record Qualifier
    data_type: text
    length: 80
    origins:
    - type: Derived
      source: Sponsor
    method:
      type: Computation
      description: 'Executable yamaa derivation: LBORRES

        ...'
- name: LBSTRESN
  type: float
  label: Numeric Result/Finding in Standard Units
  derivation:
    value: LBORRES
    unconvertible: null
  submission:
    core: Exp
    mandatory: false
    role: Record Qualifier
    data_type: float
    length: 8
    significant_digits: 6
    origins:
    - type: Derived
      source: Sponsor
    method:
      type: Computation
      description: 'Executable yamaa derivation: value: LBORRES

        unconvertible: null'
- name: LBSTRESU
  type: str
  label: Standard Units
  derivation: LBORRESU
  verifications:
  - max_length:
      max: 40
      severity: error
  submission:
    core: Exp
    mandatory: false
    role: Record Qualifier
    data_type: text
    length: 40
    origins:
    - type: Derived
      source: Sponsor
    method:
      type: Computation
      description: Collected CRF fixed units from the archived form specification;
        no unit conversion. Requires confirmation of the source CRF unit definitions.
    comment: Collected CRF fixed units from the archived form specification; no unit
      conversion. Requires confirmation of the source CRF unit definitions.
- name: DRAW1
  type: str
  label: DRAW1
  derivation: DRAW_DATE.Value
- name: DRAW2
  type: str
  label: DRAW2
  derivation: DRAW_ALT.Value
- name: DATE_RAW
  type: str
  label: DATE_RAW
  derivation:
    case:
    - when: RAW.FormName = 'Lab Results'
      then: FOLLOWUP_DATE.Value
    - otherwise:
        first_available:
          sources:
          - DRAW1
          - DRAW2
- name: LBDTC
  type: str
  label: Date/Time of Specimen Collection
  derivation:
    date_text:
      source: DATE_RAW
      forms:
      - iso
      - mdy_slash
      invalid: null
  verifications:
  - max_length:
      max: 25
      severity: error
  submission:
    core: Exp
    mandatory: false
    role: Timing
    data_type: text
    length: 25
    origins:
    - type: Derived
      source: Sponsor
    method:
      type: Computation
      description: Form blood-draw date, or Lab Results.LABDATE from the same complete
        repeated instance. No scan date or administrative event date substitutes for
        collection.
    comment: Form blood-draw date, or Lab Results.LABDATE from the same complete repeated
      instance. No scan date or administrative event date substitutes for collection.
- name: LBBLFL
  type: str
  label: Baseline Flag
  derivation: null
  verifications:
  - max_length:
      max: 1
      severity: error
  - allowed_values:
      values:
      - N
      - Y
      severity: error
  submission:
    core: Perm
    mandatory: false
    role: Record Qualifier
    data_type: text
    length: 1
    codelist: NY
    origins:
    - type: Derived
      source: Sponsor
    method:
      type: Computation
      description: No exposure reference exists. A form named Baseline is not sufficient
        for a treatment baseline flag.
    comment: No exposure reference exists. A form named Baseline is not sufficient
      for a treatment baseline flag.
- name: VISIT
  type: str
  label: Visit Name
  derivation: RAW.EventName
  verifications:
  - max_length:
      max: 80
      severity: error
  submission:
    core: Perm
    mandatory: false
    role: Timing
    data_type: text
    length: 80
    origins:
    - type: Predecessor
      description: RAW.EventName
submission:
  mode: historical
  artifact: lb.xpt
  has_no_data: false
  label: Laboratory Test Results
  class: FINDINGS
  structure: One record per source observation per subject
  repeating: true
  reference_data: false
  non_standard: false
  comment: Review draft metadata. Historical mode keeps declarations separate from
    incomplete data; this is not a validated submission. See spec/review/decisions.md.
