yamaa: '1.0'
type: spec
model: SDTM
domain: MH
keys:
- STUDYID
- USUBJID
- MHSEQ
input:
  SRC:
    path: ../../../data/odm/demographics.csv
    types:
      ROWID: int

output:
  path: ../../../data/sdtm/mh.parquet
  columns:
  - STUDYID
  - DOMAIN
  - USUBJID
  - MHSEQ
  - MHSPID
  - MHTERM
  - MHCAT
  - MHDECOD
  - MHSTDTC
  - MHENDTC
  - VISIT
  report: ../../../log/mh-report.csv
  order_by:
  - variable: STUDYID
    nulls: last
  - variable: USUBJID
    nulls: last
  - variable: MHSEQ
    nulls: last

columns:
- name: SUBJECTKEY
  type: str
  label: SUBJECTKEY
  derivation: SRC.SUBJECTKEY

- name: EVENTOID
  type: str
  label: EVENTOID
  derivation: SRC.EVENTOID

- name: EVENTREPEAT
  type: str
  label: EVENTREPEAT
  derivation: SRC.EVENTREPEAT

- name: ROWID
  type: int
  label: ROWID
  derivation: SRC.ROWID

- name: STUDYID
  type: str
  label: Study Identifier
  derivation: '''CART-T-PILOT'''
  verifications:
  - max_length:
      max: 12
  submission:
    length: 12
    origins:
    - type: Assigned
      source: Sponsor
    core: Req
    mandatory: true
    data_type: text
    key_sequence: 1
    role: Identifier

- name: DOMAIN
  type: str
  label: Domain Abbreviation
  derivation: '''MH'''
  verifications:
  - max_length:
      max: 2
  submission:
    length: 2
    origins:
    - type: Assigned
      source: Sponsor
    core: Req
    mandatory: true
    data_type: text
    role: Identifier

- name: USUBJID
  type: str
  label: Unique Subject Identifier
  derivation:
    str_template: CART-T-PILOT-{SRC.SUBJECTKEY}
  verifications:
  - max_length:
      max: 80
  submission:
    length: 80
    origins:
    - type: Derived
      source: Sponsor
    method: CART-T-PILOT followed by the globally unique ODM SubjectKey.
      Display subject ID is retained in DM.SUBJID.
    comment: CART-T-PILOT followed by the globally unique ODM SubjectKey.
      Display subject ID is retained in DM.SUBJID.
    core: Req
    mandatory: true
    data_type: text
    key_sequence: 2
    role: Identifier

- name: MHSEQ
  type: int
  label: Sequence Number
  derivation:
    row_number:
      window:
        group_by:
        - USUBJID
        order_by:
        - variable: SRC.ROWID
          nulls: last
  submission:
    origins:
    - type: Derived
      source: Sponsor
    method: |-
      Executable yamaa derivation: row_number:
        window:
          group_by:
          - USUBJID
          order_by:
          - variable: SRC.ROWID
            nulls: last
    core: Req
    mandatory: true
    data_type: integer
    length: 8
    key_sequence: 3
    role: Identifier

- name: MHSPID
  type: str
  label: Source Group Ordinal
  derivation: SRC.ROWID
  verifications:
  - max_length:
      max: 20
  submission:
    length: 20
    origins:
    - type: Predecessor
      description: SRC.ROWID
    comment: ODM SourceOrdinal (item), or first SourceOrdinal in the complete
      ODM item-group instance. Trace to data/odm/clinical_items.csv or
      groups.csv.
    core: Perm
    mandatory: false
    data_type: text
    role: Identifier

- name: MHTERM
  type: str
  label: Reported Term for the Medical History
  derivation: null
  verifications:
  - max_length:
      max: 200
  submission:
    length: 200
    origins:
    - type: Derived
      source: Sponsor
    core: Req
    mandatory: true
    data_type: text
    method: Not derivable; the output remains missing.
    role: Topic

- name: MHCAT
  type: str
  label: Category for Medical History
  derivation: null
  verifications:
  - max_length:
      max: 40
  submission:
    length: 40
    origins:
    - type: Derived
      source: Sponsor
    core: Exp
    mandatory: false
    data_type: text
    method: Not derivable; the output remains missing.
    role: Record Qualifier

- name: MHDECOD
  type: str
  label: Dictionary-Derived Term
  derivation: null
  verifications:
  - max_length:
      max: 200
  submission:
    length: 200
    origins:
    - type: Derived
      source: Sponsor
    comment: No MedDRA coding is available.
    core: Perm
    mandatory: false
    data_type: text
    method: No MedDRA coding is available.
    role: Record Qualifier

- name: MHSTDTC
  type: str
  label: Start Date/Time of Medical History Event
  derivation:
    date_text:
      source: SRC.I_DATE
      forms:
      - iso
      - mdy_slash
      invalid: null
  verifications:
  - max_length:
      max: 25
  submission:
    length: 25
    origins:
    - type: Derived
      source: Sponsor
    method: |-
      Executable yamaa derivation: date_text:
        source: SRC.I_DATE
        forms:
        - iso
        - mdy_slash
        invalid: null
    core: Exp
    mandatory: false
    data_type: text
    role: Timing

- name: MHENDTC
  type: str
  label: End Date/Time of Medical History Event
  derivation:
    date_text:
      source: SRC.I_STOP
      forms:
      - iso
      - mdy_slash
      invalid: null
  verifications:
  - max_length:
      max: 25
  submission:
    length: 25
    origins:
    - type: Derived
      source: Sponsor
    method: |-
      Executable yamaa derivation: date_text:
        source: SRC.I_STOP
        forms:
        - iso
        - mdy_slash
        invalid: null
    core: Perm
    mandatory: false
    data_type: text
    role: Timing

- name: VISIT
  type: str
  label: Visit Name
  derivation: SRC.EVENTNAME
  verifications:
  - max_length:
      max: 80
  submission:
    length: 80
    origins:
    - type: Predecessor
      description: SRC.EVENTNAME
    core: Perm
    mandatory: false
    data_type: text
    role: Timing

rows:
- id: general
  dataset: SRC
  filter: SRC.IGROUP = 'group1' AND SRC.I_DIAG IS NOT NULL
  derivations:
    MHTERM: SRC.I_DIAG
    MHCAT: '''GENERAL MEDICAL HISTORY'''

- id: cancer_type
  dataset: SRC
  filter: SRC.IGROUP = 'group2' AND SRC.I_CANCER1 IS NOT NULL
  derivations:
    MHTERM:
      mapping:
        source: SRC.I_CANCER1
        dict:
          '1': Carcinoma
          '2': Leukemia
          '3': Lymphoma
          '4': Sarcoma
          '5': Myeloma
        unmapped: null
    MHCAT: '''CANCER HISTORY'''
    MHSTDTC: null
    MHENDTC: null

- id: cancer_subtype
  dataset: SRC
  filter: SRC.IGROUP = 'group2' AND SRC.I_CANCER2 IS NOT NULL
  derivations:
    MHTERM:
      mapping:
        source: SRC.I_CANCER2
        dict:
          '22': Acute myeloid leukemia (AML)
          '23': Chronic myeloid leukemia (CML)
          '24': Acute lymphocytic leukemia (ALL)
          '25': Chronic lymphocytic leukemia (CLL)
          '26': IgG
          '27': IgA
          '28': IgM
          '29': IgD
          '30': IgE
          '10': Rhabdomyosarcomas
          '11': Gastrointestinal Stromal Tumours (GISTs)
          '12': Leiomyosarcoma
          '13': Liposarcoma
          '14': Osteosarcoma
          '15': Ewing's sarcoma
          '16': Chondrosarcoma
          '17': B-cell lymphoma
          '18': T-cell lymphoma
          '19': Burkitt's lymphoma
          '1': Adenocarcinoma
          '2': Small cell carcinoma
          '3': Squamos cell Carcinoma
          '4': Large cell carcinoma
          '5': Transitional cell carcinoma
          '6': Undifferentiated carcinoma
          '7': Soft Tissue Sarcoma
          '8': Bone Sarcoma
          '9': Fibroblastic sarcomas
          '20': Follicular lymphoma
          '21': Mantle cell lymphoma
        unmapped: null
    MHCAT: '''CANCER SUBTYPE'''
    MHSTDTC: null
    MHENDTC: null

verifications:
- assert:
    id: mh_end_before_start
    require: MHENDTC IS NULL OR MHSTDTC IS NULL OR MHENDTC >= MHSTDTC
    severity: warning

submission:
  label: Medical History
  class: EVENTS
  structure: One record per source observation per subject
  repeating: true
  mode: historical
  artifact: mh.xpt
  comment: Review draft metadata. Historical mode keeps declarations separate
    from incomplete data; this is not a validated submission. See
    spec/review/decisions.md.
