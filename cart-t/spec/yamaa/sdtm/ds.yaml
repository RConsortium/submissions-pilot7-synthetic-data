yamaa: '1.0'
type: spec
model: SDTM
domain: DS
keys:
- STUDYID
- USUBJID
- DSSEQ
input:
  ODM: ../../../data/odm/car-t-utf8.xml
  RAW: ../../../data/odm/car-t-utf8.xml

output:
  path: ../../../data/sdtm/ds.parquet
  columns:
  - STUDYID
  - DOMAIN
  - USUBJID
  - DSSEQ
  - DSSPID
  - DSTERM
  - DSDECOD
  - DSCAT
  - DSSTDTC
  report: ../../../log/ds-report.parquet
  order_by:
  - variable: STUDYID
    nulls: last
  - variable: USUBJID
    nulls: last
  - variable: DSSEQ
    nulls: last

intermediates:
- id: CONTEXT
  dataset: RAW
  key:
    StudyOID: ODM.StudyOID
    MetaDataVersionOID: ODM.MetaDataVersionOID
    SubjectKey: ODM.SubjectKey
    StudyEventOID: ODM.StudyEventOID
    FormOID: ODM.FormOID
    ItemGroupOID: ODM.ItemGroupOID
  filter: (RAW.StudyEventRepeatKey = ODM.StudyEventRepeatKey
    OR (RAW.StudyEventRepeatKey IS NULL AND ODM.StudyEventRepeatKey
    IS NULL)) AND (RAW.FormRepeatKey = ODM.FormRepeatKey OR
    (RAW.FormRepeatKey IS NULL AND ODM.FormRepeatKey IS NULL))
    AND (RAW.ItemGroupRepeatKey = ODM.ItemGroupRepeatKey OR
    (RAW.ItemGroupRepeatKey IS NULL AND ODM.ItemGroupRepeatKey
    IS NULL))
  order_by:
  - RAW.SourceOrdinal
  keep: first

columns:
- name: CRF_CONSENTEDDT
  type: str
  label: CRF_CONSENTEDDT

- name: CRF_EARLYTERMINATIONDATE
  type: str
  label: CRF_EARLYTERMINATIONDATE
  derivation:
    odm: ODM.I_DISPO_EARLYTERMINATIONDATE

- name: CRF_EARLYTERMINATIONREASON
  type: str
  label: CRF_EARLYTERMINATIONREASON

- name: CRF_ELIGIBLE
  type: str
  label: CRF_ELIGIBLE

- name: CRF_PROFILE
  type: str
  label: CRF_PROFILE

- name: STARTDATE
  type: str
  label: STARTDATE
  derivation: CONTEXT.StartDate

- name: EVENTNAME
  type: str
  label: EVENTNAME
  derivation: CONTEXT.EventName

- name: SUBJECTKEY
  type: str
  label: SUBJECTKEY
  derivation: ODM.SubjectKey

- name: ROWID
  type: int
  label: ROWID
  derivation: CONTEXT.SourceOrdinal

- name: STUDYID
  type: str
  label: Study Identifier
  derivation: '''CART-T-PILOT'''
  verifications:
  - max_length:
      max: 12
  submission:
    length: 12
    origins:
    - type: Assigned
      source: Sponsor
    core: Req
    mandatory: true
    data_type: text
    key_sequence: 1
    role: Identifier

- name: DOMAIN
  type: str
  label: Domain Abbreviation
  derivation: '''DS'''
  verifications:
  - max_length:
      max: 2
  submission:
    length: 2
    origins:
    - type: Assigned
      source: Sponsor
    core: Req
    mandatory: true
    data_type: text
    role: Identifier

- name: USUBJID
  type: str
  label: Unique Subject Identifier
  derivation:
    str_template: CART-T-PILOT-{SUBJECTKEY}
  verifications:
  - max_length:
      max: 80
  submission:
    length: 80
    origins:
    - type: Derived
      source: Sponsor
    method: 'Executable yamaa derivation:
      str_template: CART-T-PILOT-{SUBJECTKEY}'
    core: Req
    mandatory: true
    data_type: text
    key_sequence: 2
    role: Identifier

- name: DSSEQ
  type: int
  label: Sequence Number
  derivation:
    row_number:
      window:
        group_by:
        - USUBJID
        order_by:
        - variable: ROWID
          nulls: last
  submission:
    origins:
    - type: Derived
      source: Sponsor
    method: |-
      Executable yamaa derivation: row_number:
        window:
          group_by:
          - USUBJID
          order_by:
          - variable: ROWID
            nulls: last
    core: Req
    mandatory: true
    data_type: integer
    length: 8
    key_sequence: 3
    role: Identifier

- name: DSSPID
  type: str
  label: Source Group Ordinal
  derivation: ROWID
  verifications:
  - max_length:
      max: 20
  submission:
    length: 20
    origins:
    - type: Derived
      source: Sponsor
    method: |-
      Executable yamaa derivation: ROWID
      ...
    core: Perm
    mandatory: false
    data_type: text
    role: Identifier

- name: DSTERM
  type: str
  label: Reported Term for the Disposition Event
  derivation: null
  verifications:
  - max_length:
      max: 200
  submission:
    length: 200
    origins:
    - type: Derived
      source: Sponsor
    core: Req
    mandatory: true
    data_type: text
    method: Not derivable; the output remains missing.
    role: Topic

- name: DSDECOD
  type: str
  label: Standardized Disposition Term
  derivation: null
  verifications:
  - max_length:
      max: 80
  submission:
    length: 80
    origins:
    - type: Derived
      source: Sponsor
    core: Req
    mandatory: true
    data_type: text
    method: Not derivable; the output remains missing.
    role: Record Qualifier

- name: DSCAT
  type: str
  label: Category for Disposition Event
  derivation: null
  verifications:
  - max_length:
      max: 40
  submission:
    length: 40
    origins:
    - type: Derived
      source: Sponsor
    core: Req
    mandatory: true
    data_type: text
    method: Not derivable; the output remains missing.
    role: Record Qualifier

- name: DSSTDTC
  type: str
  label: Start Date/Time of Disposition Event
  derivation: null
  verifications:
  - max_length:
      max: 25
  submission:
    length: 25
    origins:
    - type: Derived
      source: Sponsor
    core: Exp
    mandatory: false
    data_type: text
    method: Not derivable; the output remains missing.
    role: Timing

- name: SOURCE_GROUP
  type: str
  label: SOURCE_GROUP

- name: SOURCE_FORM
  type: str
  label: SOURCE_FORM
  derivation: ODM.FormOID

rows:
- id: consent
  dataset: ODM
  group_by:
  - ODM.StudyOID
  - ODM.MetaDataVersionOID
  - ODM.SubjectKey
  - ODM.StudyEventOID
  - ODM.StudyEventRepeatKey
  - ODM.FormOID
  - ODM.FormRepeatKey
  - ODM.ItemGroupOID
  - ODM.ItemGroupRepeatKey
  filter: SOURCE_GROUP = 'IG_DISPO_PD' AND (CRF_CONSENTEDDT
    IS NOT NULL)
  derivations:
    DSTERM: '''Informed consent obtained'''
    DSDECOD: '''INFORMED CONSENT OBTAINED'''
    DSCAT: '''PROTOCOL MILESTONE'''
    DSSTDTC:
      date_text:
        source: CRF_CONSENTEDDT
        forms:
        - iso
        - mdy_slash
        invalid: null
    SOURCE_GROUP: ODM.ItemGroupOID
    CRF_CONSENTEDDT:
      odm: ODM.I_DISPO_CONSENTEDDT
    CRF_EARLYTERMINATIONREASON:
      odm: ODM.I_DISPO_EARLYTERMINATIONREASON
    CRF_ELIGIBLE:
      odm: ODM.I_DISPO_ELIGIBLE
    CRF_PROFILE:
      odm: ODM.I_3RAND_PROFILE

- id: eligible
  dataset: ODM
  group_by:
  - ODM.StudyOID
  - ODM.MetaDataVersionOID
  - ODM.SubjectKey
  - ODM.StudyEventOID
  - ODM.StudyEventRepeatKey
  - ODM.FormOID
  - ODM.FormRepeatKey
  - ODM.ItemGroupOID
  - ODM.ItemGroupRepeatKey
  filter: SOURCE_GROUP = 'IG_DISPO_PD' AND (CRF_ELIGIBLE = 'Yes')
  derivations:
    DSTERM: '''Determined eligible'''
    DSDECOD: '''ELIGIBILITY CRITERIA MET'''
    DSCAT: '''PROTOCOL MILESTONE'''
    DSSTDTC: null
    SOURCE_GROUP: ODM.ItemGroupOID
    CRF_CONSENTEDDT:
      odm: ODM.I_DISPO_CONSENTEDDT
    CRF_EARLYTERMINATIONREASON:
      odm: ODM.I_DISPO_EARLYTERMINATIONREASON
    CRF_ELIGIBLE:
      odm: ODM.I_DISPO_ELIGIBLE
    CRF_PROFILE:
      odm: ODM.I_3RAND_PROFILE

- id: discontinued
  dataset: ODM
  group_by:
  - ODM.StudyOID
  - ODM.MetaDataVersionOID
  - ODM.SubjectKey
  - ODM.StudyEventOID
  - ODM.StudyEventRepeatKey
  - ODM.FormOID
  - ODM.FormRepeatKey
  - ODM.ItemGroupOID
  - ODM.ItemGroupRepeatKey
  filter: SOURCE_GROUP = 'IG_DISPO_PD' AND (CRF_EARLYTERMINATIONREASON
    IS NOT NULL)
  derivations:
    DSTERM: CRF_EARLYTERMINATIONREASON
    DSDECOD:
      mapping:
        source: CRF_EARLYTERMINATIONREASON
        dict:
          Withdrew Consent: WITHDRAWAL BY SUBJECT
          Adverse Event: ADVERSE EVENT
        unmapped: null
    DSCAT: '''DISPOSITION EVENT'''
    DSSTDTC:
      date_text:
        source: CRF_EARLYTERMINATIONDATE
        forms:
        - iso
        - mdy_slash
        invalid: null
    SOURCE_GROUP: ODM.ItemGroupOID
    CRF_CONSENTEDDT:
      odm: ODM.I_DISPO_CONSENTEDDT
    CRF_EARLYTERMINATIONREASON:
      odm: ODM.I_DISPO_EARLYTERMINATIONREASON
    CRF_ELIGIBLE:
      odm: ODM.I_DISPO_ELIGIBLE
    CRF_PROFILE:
      odm: ODM.I_3RAND_PROFILE

- id: randomization_workflow
  dataset: ODM
  group_by:
  - ODM.StudyOID
  - ODM.MetaDataVersionOID
  - ODM.SubjectKey
  - ODM.StudyEventOID
  - ODM.StudyEventRepeatKey
  - ODM.FormOID
  - ODM.FormRepeatKey
  - ODM.ItemGroupOID
  - ODM.ItemGroupRepeatKey
  filter: SOURCE_GROUP = 'IG_3RAND_RAND1' AND (CRF_PROFILE IS
    NOT NULL)
  derivations:
    DSTERM: '''Randomization workflow record present'''
    DSDECOD: '''RANDOMIZATION RECORD PRESENT'''
    DSCAT: '''PROTOCOL MILESTONE'''
    DSSTDTC:
      date_text:
        source: STARTDATE
        forms:
        - iso
        - mdy_slash
        invalid: null
    SOURCE_GROUP: ODM.ItemGroupOID
    CRF_CONSENTEDDT:
      odm: ODM.I_DISPO_CONSENTEDDT
    CRF_EARLYTERMINATIONREASON:
      odm: ODM.I_DISPO_EARLYTERMINATIONREASON
    CRF_ELIGIBLE:
      odm: ODM.I_DISPO_ELIGIBLE
    CRF_PROFILE:
      odm: ODM.I_3RAND_PROFILE

submission:
  label: Disposition
  class: EVENTS
  structure: One record per source observation per subject
  repeating: true
  mode: historical
  artifact: ds.xpt
  comment: Review draft metadata. Historical mode keeps declarations
    separate from incomplete data; this is not a validated submission.
    See spec/review/decisions.md.
