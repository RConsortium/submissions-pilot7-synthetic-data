yamaa: '1.0'
type: spec
model: SDTM
domain: CM
keys:
- STUDYID
- USUBJID
- CMSEQ
input:
  ODM: ../../../data/odm/car-t-openclinica.xml
  RAW: ../../../data/odm/car-t-openclinica.xml

output:
  path: ../../../data/sdtm/cm.parquet
  columns:
  - STUDYID
  - DOMAIN
  - USUBJID
  - CMSEQ
  - CMSPID
  - CMTRT
  - CMDECOD
  - CMINDC
  - CMDOSE
  - CMDOSTXT
  - CMDOSU
  - CMDOSFRQ
  - CMDOSFRM
  - CMROUTE
  - CMSTDTC
  - CMENDTC
  - CMENRTPT
  - CMENTPT
  - VISIT
  report: ../../../log/cm-report.parquet
  order_by:
  - variable: STUDYID
    nulls: last
  - variable: USUBJID
    nulls: last
  - variable: CMSEQ
    nulls: last

intermediates:
- id: CONTEXT
  dataset: RAW
  key:
    StudyOID: ODM.StudyOID
    MetaDataVersionOID: ODM.MetaDataVersionOID
    SubjectKey: ODM.SubjectKey
    StudyEventOID: ODM.StudyEventOID
    FormOID: ODM.FormOID
    ItemGroupOID: ODM.ItemGroupOID
  filter: (RAW.StudyEventRepeatKey = ODM.StudyEventRepeatKey
    OR (RAW.StudyEventRepeatKey IS NULL AND ODM.StudyEventRepeatKey
    IS NULL)) AND (RAW.FormRepeatKey = ODM.FormRepeatKey OR
    (RAW.FormRepeatKey IS NULL AND ODM.FormRepeatKey IS NULL))
    AND (RAW.ItemGroupRepeatKey = ODM.ItemGroupRepeatKey OR
    (RAW.ItemGroupRepeatKey IS NULL AND ODM.ItemGroupRepeatKey
    IS NULL))
  order_by:
  - RAW.SourceOrdinal
  keep: first

columns:
- name: CRF_CMDOSE
  type: str
  label: CRF_CMDOSE

- name: CRF_CMDOSFRM
  type: str
  label: CRF_CMDOSFRM

- name: CRF_CMDOSFRQ
  type: str
  label: CRF_CMDOSFRQ

- name: CRF_CMDOSU
  type: str
  label: CRF_CMDOSU

- name: CRF_CMDOSUTXT
  type: str
  label: CRF_CMDOSUTXT

- name: CRF_CMENDAT
  type: str
  label: CRF_CMENDAT

- name: CRF_CMINDC
  type: str
  label: CRF_CMINDC

- name: CRF_CMROUTE
  type: str
  label: CRF_CMROUTE

- name: CRF_CMSTDAT
  type: str
  label: CRF_CMSTDAT

- name: CRF_CMTRTL
  type: str
  label: CRF_CMTRTL

- name: CRF_CMTRTLX
  type: str
  label: CRF_CMTRTLX

- name: CRF_MEDNAME
  type: str
  label: CRF_MEDNAME

- name: CRF_ONGOING
  type: str
  label: CRF_ONGOING

- name: STARTDATE
  type: str
  label: STARTDATE
  derivation: CONTEXT.StartDate

- name: EVENTNAME
  type: str
  label: EVENTNAME
  derivation: CONTEXT.EventName

- name: SUBJECTKEY
  type: str
  label: SUBJECTKEY
  derivation: ODM.SubjectKey

- name: EVENTOID
  type: str
  label: EVENTOID
  derivation: ODM.StudyEventOID

- name: EVENTREPEAT
  type: str
  label: EVENTREPEAT
  derivation: ODM.StudyEventRepeatKey

- name: ROWID
  type: int
  label: ROWID
  derivation: CONTEXT.SourceOrdinal

- name: STUDYID
  type: str
  label: Study Identifier
  derivation: '''CART-T-PILOT'''
  verifications:
  - max_length:
      max: 12
  submission:
    length: 12
    origins:
    - type: Assigned
      source: Sponsor
    core: Req
    mandatory: true
    data_type: text
    key_sequence: 1
    role: Identifier

- name: DOMAIN
  type: str
  label: Domain Abbreviation
  derivation: '''CM'''
  verifications:
  - max_length:
      max: 2
  submission:
    length: 2
    origins:
    - type: Assigned
      source: Sponsor
    core: Req
    mandatory: true
    data_type: text
    role: Identifier

- name: USUBJID
  type: str
  label: Unique Subject Identifier
  derivation:
    str_template: CART-T-PILOT-{SUBJECTKEY}
  verifications:
  - max_length:
      max: 80
  submission:
    length: 80
    origins:
    - type: Derived
      source: Sponsor
    method: CART-T-PILOT followed by the globally unique ODM
      SubjectKey. Display subject ID is retained in DM.SUBJID.
    comment: CART-T-PILOT followed by the globally unique ODM
      SubjectKey. Display subject ID is retained in DM.SUBJID.
    core: Req
    mandatory: true
    data_type: text
    key_sequence: 2
    role: Identifier

- name: CMSEQ
  type: int
  label: Sequence Number
  derivation:
    row_number:
      window:
        group_by:
        - USUBJID
        order_by:
        - variable: ROWID
          nulls: last
  submission:
    origins:
    - type: Derived
      source: Sponsor
    method: |-
      Executable yamaa derivation: row_number:
        window:
          group_by:
          - USUBJID
          order_by:
          - variable: ROWID
            nulls: last
    core: Req
    mandatory: true
    data_type: integer
    length: 8
    key_sequence: 3
    role: Identifier

- name: CMSPID
  type: str
  label: Source Group Ordinal
  derivation: ROWID
  verifications:
  - max_length:
      max: 20
  submission:
    length: 20
    origins:
    - type: Predecessor
      description: ROWID
    comment: ODM SourceOrdinal (item), or first SourceOrdinal
      in the complete ODM item-group instance. Trace to SourceOrdinal
      in data/odm/items.parquet and the unchanged XML.
    core: Perm
    mandatory: false
    data_type: text
    role: Identifier

- name: CMTRT
  type: str
  label: Reported Name of Drug, Med, or Therapy
  derivation:
    first_available:
      sources:
      - CRF_CMTRTL
      - CRF_CMTRTLX
  verifications:
  - max_length:
      max: 200
  submission:
    length: 200
    origins:
    - type: Derived
      source: Sponsor
    method: |-
      Executable yamaa derivation: first_available:
        sources:
        - CRF_CMTRTL
        - CRF_CMTRTLX
    core: Req
    mandatory: true
    data_type: text
    role: Topic

- name: CMDECOD
  type: str
  label: Standardized Medication Name
  derivation: CRF_MEDNAME
  verifications:
  - max_length:
      max: 200
  submission:
    length: 200
    origins:
    - type: Predecessor
      description: CRF_MEDNAME
    comment: Recorded MEDNAME only. No new WHO Drug or RxNorm
      coding is claimed.
    core: Exp
    mandatory: false
    data_type: text
    role: Record Qualifier

- name: CMINDC
  type: str
  label: Indication
  derivation: CRF_CMINDC
  verifications:
  - max_length:
      max: 200
  submission:
    length: 200
    origins:
    - type: Predecessor
      description: CRF_CMINDC
    core: Perm
    mandatory: false
    data_type: text
    role: Record Qualifier

- name: CMDOSE
  type: float
  label: Dose per Administration
  derivation:
    value: CRF_CMDOSE
    unconvertible: null
  submission:
    significant_digits: 6
    origins:
    - type: Derived
      source: Sponsor
    method: |-
      Executable yamaa derivation: value: CRF_CMDOSE
      unconvertible: null
    core: Perm
    mandatory: false
    data_type: float
    length: 8
    role: Record Qualifier

- name: CMDOSTXT
  type: str
  label: Dose Description
  derivation: CRF_CMDOSE
  verifications:
  - max_length:
      max: 80
  submission:
    length: 80
    origins:
    - type: Predecessor
      description: CRF_CMDOSE
    core: Perm
    mandatory: false
    data_type: text
    role: Record Qualifier

- name: CMDOSU
  type: str
  label: Dose Units
  derivation:
    case:
    - when: CRF_CMDOSU = 'Other'
      then:
        mapping:
          source: CRF_CMDOSUTXT
          dict:
            MG: mg
            mg: mg
            G: g
            g: g
            ML: mL
            mL: mL
            L: L
            mcg: ug
            ug: ug
            Other: null
            "\xB5g": ug
            IU: IU
            mg/m^2: mg/m2
          unmapped: null
    - otherwise:
        mapping:
          source: CRF_CMDOSU
          dict:
            MG: mg
            mg: mg
            G: g
            g: g
            ML: mL
            mL: mL
            L: L
            mcg: ug
            ug: ug
            Other: null
            "\xB5g": ug
            IU: IU
            mg/m^2: mg/m2
          unmapped: null
  verifications:
  - max_length:
      max: 40
  submission:
    length: 40
    origins:
    - type: Derived
      source: Sponsor
    method: Decode CL_205 units; microgram spellings map to
      ug. When CMDOSU=Other, use CMDOSUTXT (mg/m^2 -> mg/m2;
      mcg -> ug). No dose conversion.
    core: Perm
    mandatory: false
    data_type: text
    role: Record Qualifier

- name: CMDOSFRQ
  type: str
  label: Dosing Frequency per Interval
  derivation:
    mapping:
      source: CRF_CMDOSFRQ
      dict:
        QD (once a day): QD
        BID (twice a day): BID
        TID (three times a day): TID
        QID (four times a day): QID
        QH (every hour): QH
        QM (every month): QM
        QOM (every other mo): QOM
        QOD (every other day): QOD
        PC (after meals): PC
        AC (before meals): AC
        PRN (as needed): PRN
        '11': PRN
        '1': QD
        '2': BID
        '3': TID
        '4': QID
        '5': QOD
        '6': QM
        '7': QOM
        '8': QH
        '9': AC
        '10': PC
      unmapped: null
  verifications:
  - max_length:
      max: 40
  submission:
    length: 40
    origins:
    - type: Derived
      source: Sponsor
    method: Decode CL_209 text and numeric codes, then map the
      decoded frequency to the explicit frequency abbreviation.
    core: Perm
    mandatory: false
    data_type: text
    role: Record Qualifier

- name: CMDOSFRM
  type: str
  label: Dose Form
  derivation:
    mapping:
      source: CRF_CMDOSFRM
      dict:
        Implant: IMPLANT
        Aerosol: AEROSOL
        Cream: CREAM
        Suspension: SUSPENSION
        Capsule: CAPSULE
        Ointment: OINTMENT
        Spray: SPRAY
        Powder: POWDER
        Gel: GEL
        Liquid: LIQUID
        Gas: GAS
        Tablet: TABLET
        Chewable: CHEWABLE TABLET
        Suppository: SUPPOSITORY
        Patch: PATCH
      unmapped: null
  verifications:
  - max_length:
      max: 40
  submission:
    length: 40
    origins:
    - type: Derived
      source: Sponsor
    method: Decode CL_207. Chewable maps to CHEWABLE TABLET.
      Other without an approved standard term remains missing
      for review.
    comment: Uppercase collected term. Unmapped source terms
      remain visible for terminology review; no dictionary certification
      is claimed.
    core: Perm
    mandatory: false
    data_type: text
    role: Record Qualifier

- name: CMROUTE
  type: str
  label: Route of Administration
  derivation:
    mapping:
      source: CRF_CMROUTE
      dict:
        Rectal: RECTAL
        Oral: ORAL
        Intramuscular: INTRAMUSCULAR
        Intravaneous: INTRAVENOUS
        Intraperitoneal: INTRAPERITONEAL
        Nasal: NASAL
        Intradermal: INTRADERMAL
        '10': INTRAPERITONEAL
        '11': NASAL
        '12': VAGINAL
        '13': RECTAL
        Subcutaneous: SUBCUTANEOUS
        Introacular: INTRAOCULAR
        Topical: TOPICAL
        Transdermal: TRANSDERMAL
        Inhalation: INHALATION
        '1': ORAL
        '2': TOPICAL
        '3': SUBCUTANEOUS
        '4': INTRADERMAL
        '5': TRANSDERMAL
        Vaginal: VAGINAL
        '6': INTRAOCULAR
        '7': INTRAMUSCULAR
        '8': INHALATION
        '9': INTRAVENOUS
      unmapped: null
  verifications:
  - max_length:
      max: 40
  submission:
    length: 40
    origins:
    - type: Derived
      source: Sponsor
    method: Decode CL_211 text and numeric values. Source spelling
      Intravaneous means INTRAVENOUS; Introacular means INTRAOCULAR.
      Unspecified Other remains missing.
    comment: Uppercase collected term. Unmapped source terms
      remain visible for terminology review; no dictionary certification
      is claimed.
    core: Perm
    mandatory: false
    data_type: text
    role: Record Qualifier

- name: CMSTDTC
  type: str
  label: Start Date/Time of Medication
  derivation:
    date_text:
      source: CRF_CMSTDAT
      forms:
      - iso
      - mdy_slash
      invalid: null
  verifications:
  - max_length:
      max: 25
  submission:
    length: 25
    origins:
    - type: Derived
      source: Sponsor
    method: |-
      Executable yamaa derivation: date_text:
        source: CRF_CMSTDAT
        forms:
        - iso
        - mdy_slash
        invalid: null
    core: Perm
    mandatory: false
    data_type: text
    role: Timing

- name: CMENDTC
  type: str
  label: End Date/Time of Medication
  derivation:
    date_text:
      source: CRF_CMENDAT
      forms:
      - iso
      - mdy_slash
      invalid: null
  verifications:
  - max_length:
      max: 25
  submission:
    length: 25
    origins:
    - type: Derived
      source: Sponsor
    method: |-
      Executable yamaa derivation: date_text:
        source: CRF_CMENDAT
        forms:
        - iso
        - mdy_slash
        invalid: null
    core: Perm
    mandatory: false
    data_type: text
    role: Timing

- name: CMENRTPT
  type: str
  label: End Relative to Reference Time Point
  derivation:
    case:
    - when: CRF_ONGOING = 'Yes' OR CRF_ONGOING = '1'
      then: '''ONGOING'''
    - otherwise: null
  verifications:
  - max_length:
      max: 12
  submission:
    length: 12
    origins:
    - type: Derived
      source: Sponsor
    method: |-
      Executable yamaa derivation: case:
      - when: CRF_ONGOING = 'Yes' OR CRF_ONGOING = '1'
        then: '''ONGOING'''
      - otherwise: null
    core: Perm
    mandatory: false
    data_type: text
    role: Record Qualifier

- name: CMENTPT
  type: str
  label: End Reference Time Point
  derivation:
    case:
    - when: CMENRTPT = 'ONGOING'
      then: '''CM FORM ASSESSMENT'''
    - otherwise: null
  verifications:
  - max_length:
      max: 40
  submission:
    length: 40
    origins:
    - type: Derived
      source: Sponsor
    method: |-
      Executable yamaa derivation: case:
      - when: CMENRTPT = 'ONGOING'
        then: '''CM FORM ASSESSMENT'''
      - otherwise: null
    core: Perm
    mandatory: false
    data_type: text
    role: Record Qualifier

- name: VISIT
  type: str
  label: Visit Name
  derivation: EVENTNAME
  verifications:
  - max_length:
      max: 80
  submission:
    length: 80
    origins:
    - type: Predecessor
      description: EVENTNAME
    core: Perm
    mandatory: false
    data_type: text
    role: Timing

- name: SOURCE_GROUP
  type: str
  label: SOURCE_GROUP

- name: SOURCE_FORM
  type: str
  label: SOURCE_FORM

rows:
- id: collected
  dataset: ODM
  group_by:
  - ODM.StudyOID
  - ODM.MetaDataVersionOID
  - ODM.SubjectKey
  - ODM.StudyEventOID
  - ODM.StudyEventRepeatKey
  - ODM.FormOID
  - ODM.FormRepeatKey
  - ODM.ItemGroupOID
  - ODM.ItemGroupRepeatKey
  filter: SOURCE_FORM = 'F_CONMED' AND (CRF_CMTRTL IS NOT NULL
    OR CRF_CMTRTLX IS NOT NULL)
  derivations:
    SOURCE_GROUP: ODM.ItemGroupOID
    CRF_CMDOSE:
      odm: ODM.I_CONME_CMDOSE
    CRF_CMDOSFRM:
      odm: ODM.I_CONME_CMDOSFRM
    CRF_CMDOSFRQ:
      odm: ODM.I_CONME_CMDOSFRQ
    CRF_CMDOSU:
      odm: ODM.I_CONME_CMDOSU
    CRF_CMDOSUTXT:
      odm: ODM.I_CONME_CMDOSUTXT
    CRF_CMENDAT:
      odm: ODM.I_CONME_CMENDAT
    CRF_CMINDC:
      odm: ODM.I_CONME_CMINDC
    CRF_CMROUTE:
      odm: ODM.I_CONME_CMROUTE
    CRF_CMSTDAT:
      odm: ODM.I_CONME_CMSTDAT
    CRF_CMTRTL:
      odm: ODM.I_CONME_CMTRTL
    CRF_CMTRTLX:
      odm: ODM.I_CONME_CMTRTLX
    CRF_MEDNAME:
      odm: ODM.I_CONME_MEDNAME
    CRF_ONGOING:
      odm: ODM.I_CONME_ONGOING
    SOURCE_FORM: ODM.FormOID

verifications:
- assert:
    id: cm_end_before_start
    require: CMENDTC IS NULL OR CMSTDTC IS NULL OR CMENDTC >=
      CMSTDTC
    severity: warning

submission:
  label: Concomitant Medications
  class: INTERVENTIONS
  structure: One record per source observation per subject
  repeating: true
  mode: historical
  artifact: cm.xpt
  comment: Review draft metadata. Historical mode keeps declarations
    separate from incomplete data; this is not a validated submission.
    See spec/review/decisions.md.
