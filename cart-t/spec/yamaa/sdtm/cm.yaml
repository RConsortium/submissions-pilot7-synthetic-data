yamaa: '1.0'
type: spec
model: SDTM
domain: CM
keys:
- STUDYID
- USUBJID
- CMSEQ
input:
  SRC:
    path: ../../../data/odm/medications.csv
    types:
      ROWID: int
base: SRC
filter: SRC.I_CMTRTL IS NOT NULL OR SRC.I_CMTRTLX IS NOT NULL

output:
  path: ../../../data/sdtm/cm.parquet
  columns:
  - STUDYID
  - DOMAIN
  - USUBJID
  - CMSEQ
  - CMSPID
  - CMTRT
  - CMDECOD
  - CMINDC
  - CMDOSE
  - CMDOSTXT
  - CMDOSU
  - CMDOSFRQ
  - CMDOSFRM
  - CMROUTE
  - CMSTDTC
  - CMENDTC
  - CMENRTPT
  - CMENTPT
  - VISIT
  report: ../../../log/cm-report.csv
  order_by:
  - variable: STUDYID
    nulls: last
  - variable: USUBJID
    nulls: last
  - variable: CMSEQ
    nulls: last

columns:
- name: SUBJECTKEY
  type: str
  label: SUBJECTKEY
  derivation: SRC.SUBJECTKEY

- name: EVENTOID
  type: str
  label: EVENTOID
  derivation: SRC.EVENTOID

- name: EVENTREPEAT
  type: str
  label: EVENTREPEAT
  derivation: SRC.EVENTREPEAT

- name: ROWID
  type: int
  label: ROWID
  derivation: SRC.ROWID

- name: STUDYID
  type: str
  label: Study Identifier
  derivation: '''CART-T-PILOT'''
  verifications:
  - max_length:
      max: 12
  submission:
    length: 12
    origins:
    - type: Assigned
      source: Sponsor
    core: Req
    mandatory: true
    data_type: text
    key_sequence: 1
    role: Identifier

- name: DOMAIN
  type: str
  label: Domain Abbreviation
  derivation: '''CM'''
  verifications:
  - max_length:
      max: 2
  submission:
    length: 2
    origins:
    - type: Assigned
      source: Sponsor
    core: Req
    mandatory: true
    data_type: text
    role: Identifier

- name: USUBJID
  type: str
  label: Unique Subject Identifier
  derivation:
    str_template: CART-T-PILOT-{SRC.SUBJECTKEY}
  verifications:
  - max_length:
      max: 80
  submission:
    length: 80
    origins:
    - type: Derived
      source: Sponsor
    method: CART-T-PILOT followed by the globally unique ODM SubjectKey.
      Display subject ID is retained in DM.SUBJID.
    comment: CART-T-PILOT followed by the globally unique ODM SubjectKey.
      Display subject ID is retained in DM.SUBJID.
    core: Req
    mandatory: true
    data_type: text
    key_sequence: 2
    role: Identifier

- name: CMSEQ
  type: int
  label: Sequence Number
  derivation:
    row_number:
      window:
        group_by:
        - USUBJID
        order_by:
        - variable: SRC.ROWID
          nulls: last
  submission:
    origins:
    - type: Derived
      source: Sponsor
    method: |-
      Executable yamaa derivation: row_number:
        window:
          group_by:
          - USUBJID
          order_by:
          - variable: SRC.ROWID
            nulls: last
    core: Req
    mandatory: true
    data_type: integer
    length: 8
    key_sequence: 3
    role: Identifier

- name: CMSPID
  type: str
  label: Source Group Ordinal
  derivation: SRC.ROWID
  verifications:
  - max_length:
      max: 20
  submission:
    length: 20
    origins:
    - type: Predecessor
      description: SRC.ROWID
    comment: ODM SourceOrdinal (item), or first SourceOrdinal in the complete
      ODM item-group instance. Trace to data/odm/clinical_items.csv or
      groups.csv.
    core: Perm
    mandatory: false
    data_type: text
    role: Identifier

- name: CMTRT
  type: str
  label: Reported Name of Drug, Med, or Therapy
  derivation:
    first_available:
      sources:
      - SRC.I_CMTRTL
      - SRC.I_CMTRTLX
  verifications:
  - max_length:
      max: 200
  submission:
    length: 200
    origins:
    - type: Derived
      source: Sponsor
    method: |-
      Executable yamaa derivation: first_available:
        sources:
        - SRC.I_CMTRTL
        - SRC.I_CMTRTLX
    core: Req
    mandatory: true
    data_type: text
    role: Topic

- name: CMDECOD
  type: str
  label: Standardized Medication Name
  derivation: SRC.I_MEDNAME
  verifications:
  - max_length:
      max: 200
  submission:
    length: 200
    origins:
    - type: Predecessor
      description: SRC.I_MEDNAME
    comment: Recorded MEDNAME only. No new WHO
      Drug or RxNorm coding is claimed.
    core: Exp
    mandatory: false
    data_type: text
    role: Record Qualifier

- name: CMINDC
  type: str
  label: Indication
  derivation: SRC.I_CMINDC
  verifications:
  - max_length:
      max: 200
  submission:
    length: 200
    origins:
    - type: Predecessor
      description: SRC.I_CMINDC
    core: Perm
    mandatory: false
    data_type: text
    role: Record Qualifier

- name: CMDOSE
  type: float
  label: Dose per Administration
  derivation:
    value: SRC.I_CMDOSE
    unconvertible: null
  submission:
    significant_digits: 6
    origins:
    - type: Derived
      source: Sponsor
    method: |-
      Executable yamaa derivation: value: SRC.I_CMDOSE
      unconvertible: null
    core: Perm
    mandatory: false
    data_type: float
    length: 8
    role: Record Qualifier

- name: CMDOSTXT
  type: str
  label: Dose Description
  derivation: SRC.I_CMDOSE
  verifications:
  - max_length:
      max: 80
  submission:
    length: 80
    origins:
    - type: Predecessor
      description: SRC.I_CMDOSE
    core: Perm
    mandatory: false
    data_type: text
    role: Record Qualifier

- name: CMDOSU
  type: str
  label: Dose Units
  derivation:
    case:
    - when: SRC.I_CMDOSU = 'Other'
      then:
        mapping:
          source: SRC.I_CMDOSUTXT
          dict:
            MG: mg
            mg: mg
            G: g
            g: g
            ML: mL
            mL: mL
            L: L
            mcg: ug
            ug: ug
            Other: null
            "\xB5g": ug
            IU: IU
            mg/m^2: mg/m2
          unmapped: null
    - otherwise:
        mapping:
          source: SRC.I_CMDOSU
          dict:
            MG: mg
            mg: mg
            G: g
            g: g
            ML: mL
            mL: mL
            L: L
            mcg: ug
            ug: ug
            Other: null
            "\xB5g": ug
            IU: IU
            mg/m^2: mg/m2
          unmapped: null
  verifications:
  - max_length:
      max: 40
  submission:
    length: 40
    origins:
    - type: Derived
      source: Sponsor
    method: Decode CL_205 units; microgram spellings map to ug. When
      CMDOSU=Other,
      use CMDOSUTXT (mg/m^2 -> mg/m2; mcg -> ug). No dose conversion.
    core: Perm
    mandatory: false
    data_type: text
    role: Record Qualifier

- name: CMDOSFRQ
  type: str
  label: Dosing Frequency per Interval
  derivation:
    mapping:
      source: SRC.I_CMDOSFRQ
      dict:
        QD (once a day): QD
        BID (twice a day): BID
        TID (three times a day): TID
        QID (four times a day): QID
        QH (every hour): QH
        QM (every month): QM
        QOM (every other mo): QOM
        QOD (every other day): QOD
        PC (after meals): PC
        AC (before meals): AC
        PRN (as needed): PRN
        '11': PRN
        '1': QD
        '2': BID
        '3': TID
        '4': QID
        '5': QOD
        '6': QM
        '7': QOM
        '8': QH
        '9': AC
        '10': PC
      unmapped: null
  verifications:
  - max_length:
      max: 40
  submission:
    length: 40
    origins:
    - type: Derived
      source: Sponsor
    method: Decode CL_209 text and numeric codes, then map the decoded
      frequency
      to the explicit frequency abbreviation.
    core: Perm
    mandatory: false
    data_type: text
    role: Record Qualifier

- name: CMDOSFRM
  type: str
  label: Dose Form
  derivation:
    mapping:
      source: SRC.I_CMDOSFRM
      dict:
        Implant: IMPLANT
        Aerosol: AEROSOL
        Cream: CREAM
        Suspension: SUSPENSION
        Capsule: CAPSULE
        Ointment: OINTMENT
        Spray: SPRAY
        Powder: POWDER
        Gel: GEL
        Liquid: LIQUID
        Gas: GAS
        Tablet: TABLET
        Chewable: CHEWABLE TABLET
        Suppository: SUPPOSITORY
        Patch: PATCH
      unmapped: null
  verifications:
  - max_length:
      max: 40
  submission:
    length: 40
    origins:
    - type: Derived
      source: Sponsor
    method: Decode CL_207. Chewable maps to CHEWABLE TABLET. Other without
      an approved standard term remains missing for review.
    comment: Uppercase collected term. Unmapped source terms remain visible
      for terminology review; no dictionary certification is claimed.
    core: Perm
    mandatory: false
    data_type: text
    role: Record Qualifier

- name: CMROUTE
  type: str
  label: Route of Administration
  derivation:
    mapping:
      source: SRC.I_CMROUTE
      dict:
        Rectal: RECTAL
        Oral: ORAL
        Intramuscular: INTRAMUSCULAR
        Intravaneous: INTRAVENOUS
        Intraperitoneal: INTRAPERITONEAL
        Nasal: NASAL
        Intradermal: INTRADERMAL
        '10': INTRAPERITONEAL
        '11': NASAL
        '12': VAGINAL
        '13': RECTAL
        Subcutaneous: SUBCUTANEOUS
        Introacular: INTRAOCULAR
        Topical: TOPICAL
        Transdermal: TRANSDERMAL
        Inhalation: INHALATION
        '1': ORAL
        '2': TOPICAL
        '3': SUBCUTANEOUS
        '4': INTRADERMAL
        '5': TRANSDERMAL
        Vaginal: VAGINAL
        '6': INTRAOCULAR
        '7': INTRAMUSCULAR
        '8': INHALATION
        '9': INTRAVENOUS
      unmapped: null
  verifications:
  - max_length:
      max: 40
  submission:
    length: 40
    origins:
    - type: Derived
      source: Sponsor
    method: Decode CL_211 text and numeric values. Source spelling Intravaneous
      means INTRAVENOUS; Introacular means INTRAOCULAR. Unspecified Other
      remains missing.
    comment: Uppercase collected term. Unmapped source terms remain visible
      for terminology review; no dictionary certification is claimed.
    core: Perm
    mandatory: false
    data_type: text
    role: Record Qualifier

- name: CMSTDTC
  type: str
  label: Start Date/Time of Medication
  derivation:
    date_text:
      source: SRC.I_CMSTDAT
      forms:
      - iso
      - mdy_slash
      invalid: null
  verifications:
  - max_length:
      max: 25
  submission:
    length: 25
    origins:
    - type: Derived
      source: Sponsor
    method: |-
      Executable yamaa derivation: date_text:
        source: SRC.I_CMSTDAT
        forms:
        - iso
        - mdy_slash
        invalid: null
    core: Perm
    mandatory: false
    data_type: text
    role: Timing

- name: CMENDTC
  type: str
  label: End Date/Time of Medication
  derivation:
    date_text:
      source: SRC.I_CMENDAT
      forms:
      - iso
      - mdy_slash
      invalid: null
  verifications:
  - max_length:
      max: 25
  submission:
    length: 25
    origins:
    - type: Derived
      source: Sponsor
    method: |-
      Executable yamaa derivation: date_text:
        source: SRC.I_CMENDAT
        forms:
        - iso
        - mdy_slash
        invalid: null
    core: Perm
    mandatory: false
    data_type: text
    role: Timing

- name: CMENRTPT
  type: str
  label: End Relative to Reference Time Point
  derivation:
    case:
    - when: SRC.I_ONGOING = 'Yes' OR SRC.I_ONGOING = '1'
      then: '''ONGOING'''
    - otherwise: null
  verifications:
  - max_length:
      max: 12
  submission:
    length: 12
    origins:
    - type: Derived
      source: Sponsor
    method: |-
      Executable yamaa derivation: case:
      - when: SRC.I_ONGOING = 'Yes' OR SRC.I_ONGOING = '1'
        then: '''ONGOING'''
      - otherwise: null
    core: Perm
    mandatory: false
    data_type: text
    role: Record Qualifier

- name: CMENTPT
  type: str
  label: End Reference Time Point
  derivation:
    case:
    - when: CMENRTPT = 'ONGOING'
      then: '''CM FORM ASSESSMENT'''
    - otherwise: null
  verifications:
  - max_length:
      max: 40
  submission:
    length: 40
    origins:
    - type: Derived
      source: Sponsor
    method: |-
      Executable yamaa derivation: case:
      - when: CMENRTPT = 'ONGOING'
        then: '''CM FORM ASSESSMENT'''
      - otherwise: null
    core: Perm
    mandatory: false
    data_type: text
    role: Record Qualifier

- name: VISIT
  type: str
  label: Visit Name
  derivation: SRC.EVENTNAME
  verifications:
  - max_length:
      max: 80
  submission:
    length: 80
    origins:
    - type: Predecessor
      description: SRC.EVENTNAME
    core: Perm
    mandatory: false
    data_type: text
    role: Timing

verifications:
- assert:
    id: cm_end_before_start
    require: CMENDTC IS NULL OR CMSTDTC IS NULL OR CMENDTC >= CMSTDTC
    severity: warning

submission:
  label: Concomitant Medications
  class: INTERVENTIONS
  structure: One record per source observation per subject
  repeating: true
  mode: historical
  artifact: cm.xpt
  comment: Review draft metadata. Historical mode keeps declarations separate
    from incomplete data; this is not a validated submission. See
    spec/review/decisions.md.
