yamaa: '1.0'
type: spec
model: SDTM
domain: CE
keys:
- STUDYID
- USUBJID
- CESEQ
input:
  SRC:
    path: ../../../data/odm/clinical_events.csv
    types:
      ROWID: int
base: SRC
filter: SRC.IGROUP = 'EVENT' AND SRC.I_DESC IS NOT NULL

output:
  path: ../../../data/sdtm/ce.parquet
  columns:
  - STUDYID
  - DOMAIN
  - USUBJID
  - CESEQ
  - CESPID
  - CETERM
  - CECAT
  - CESTDTC
  - VISIT
  report: ../../../log/ce-report.csv
  order_by:
  - variable: STUDYID
    nulls: last
  - variable: USUBJID
    nulls: last
  - variable: CESEQ
    nulls: last

columns:
- name: SUBJECTKEY
  type: str
  label: SUBJECTKEY
  derivation: SRC.SUBJECTKEY

- name: EVENTOID
  type: str
  label: EVENTOID
  derivation: SRC.EVENTOID

- name: EVENTREPEAT
  type: str
  label: EVENTREPEAT
  derivation: SRC.EVENTREPEAT

- name: ROWID
  type: int
  label: ROWID
  derivation: SRC.ROWID

- name: STUDYID
  type: str
  label: Study Identifier
  derivation: '''CART-T-PILOT'''
  verifications:
  - max_length:
      max: 12
  submission:
    length: 12
    origins:
    - type: Assigned
      source: Sponsor
    core: Req
    mandatory: true
    data_type: text
    key_sequence: 1
    role: Identifier

- name: DOMAIN
  type: str
  label: Domain Abbreviation
  derivation: '''CE'''
  verifications:
  - max_length:
      max: 2
  submission:
    length: 2
    origins:
    - type: Assigned
      source: Sponsor
    core: Req
    mandatory: true
    data_type: text
    role: Identifier

- name: USUBJID
  type: str
  label: Unique Subject Identifier
  derivation:
    str_template: CART-T-PILOT-{SRC.SUBJECTKEY}
  verifications:
  - max_length:
      max: 80
  submission:
    length: 80
    origins:
    - type: Derived
      source: Sponsor
    method: CART-T-PILOT followed by the globally unique ODM SubjectKey.
      Display subject ID is retained in DM.SUBJID.
    comment: CART-T-PILOT followed by the globally unique ODM SubjectKey.
      Display subject ID is retained in DM.SUBJID.
    core: Req
    mandatory: true
    data_type: text
    key_sequence: 2
    role: Identifier

- name: CESEQ
  type: int
  label: Sequence Number
  derivation:
    row_number:
      window:
        group_by:
        - USUBJID
        order_by:
        - variable: SRC.ROWID
          nulls: last
  submission:
    origins:
    - type: Derived
      source: Sponsor
    method: |-
      Executable yamaa derivation: row_number:
        window:
          group_by:
          - USUBJID
          order_by:
          - variable: SRC.ROWID
            nulls: last
    core: Req
    mandatory: true
    data_type: integer
    length: 8
    key_sequence: 3
    role: Identifier

- name: CESPID
  type: str
  label: Source Group Ordinal
  derivation: SRC.ROWID
  verifications:
  - max_length:
      max: 20
  submission:
    length: 20
    origins:
    - type: Predecessor
      description: SRC.ROWID
    comment: ODM SourceOrdinal (item), or first SourceOrdinal in the complete
      ODM item-group instance. Trace to data/odm/clinical_items.csv or
      groups.csv.
    core: Perm
    mandatory: false
    data_type: text
    role: Identifier

- name: CETERM
  type: str
  label: Reported Term for the Clinical Event
  derivation: SRC.I_DESC
  verifications:
  - max_length:
      max: 200
  submission:
    length: 200
    origins:
    - type: Predecessor
      description: SRC.I_DESC
    comment: Verbatim suspected-MI description. Test text and dates outside
      participation are retained for review, not deleted or recoded.
    core: Req
    mandatory: true
    data_type: text
    role: Topic

- name: CECAT
  type: str
  label: Category for Clinical Event
  derivation: '''SUSPECTED MI'''
  verifications:
  - max_length:
      max: 40
  submission:
    length: 40
    origins:
    - type: Assigned
      source: Sponsor
    core: Req
    mandatory: true
    data_type: text
    role: Record Qualifier

- name: CESTDTC
  type: str
  label: Start Date/Time of Clinical Event
  derivation:
    date_text:
      source: SRC.I_EVENTDATE
      forms:
      - iso
      - mdy_slash
      invalid: null
  verifications:
  - max_length:
      max: 25
  submission:
    length: 25
    origins:
    - type: Derived
      source: Sponsor
    method: |-
      Executable yamaa derivation: date_text:
        source: SRC.I_EVENTDATE
        forms:
        - iso
        - mdy_slash
        invalid: null
    core: Exp
    mandatory: false
    data_type: text
    role: Timing

- name: VISIT
  type: str
  label: Visit Name
  derivation: SRC.EVENTNAME
  verifications:
  - max_length:
      max: 80
  submission:
    length: 80
    origins:
    - type: Predecessor
      description: SRC.EVENTNAME
    core: Perm
    mandatory: false
    data_type: text
    role: Timing

submission:
  label: Clinical Events
  class: EVENTS
  structure: One record per source observation per subject
  repeating: true
  mode: historical
  artifact: ce.xpt
  comment: Review draft metadata. Historical mode keeps declarations separate
    from incomplete data; this is not a validated submission. See
    spec/review/decisions.md.
