yamaa: '1.0'
type: spec
model: SDTM
domain: DM
keys:
- STUDYID
- USUBJID
input:
  RAW: ../../../data/odm/car-t-openclinica.xml
  ITEMS:
    path: ../../../data/odm/car-t-openclinica.xml
    key:
    - SubjectKey

output:
  path: ../../../data/sdtm/dm.parquet
  columns:
  - STUDYID
  - DOMAIN
  - USUBJID
  - SUBJID
  - SITEID
  - RFSTDTC
  - RFENDTC
  - RFXSTDTC
  - RFXENDTC
  - RFPENDTC
  - RFICDTC
  - BRTHDTC
  - AGE
  - AGEU
  - SEX
  - RACE
  - ETHNIC
  - COUNTRY
  - ARMCD
  - ARM
  - ACTARMCD
  - ACTARM
  - ARMNRS
  - DTHFL
  - DTHDTC
  report: ../../../log/dm-report.parquet
  order_by:
  - variable: STUDYID
    nulls: last
  - variable: USUBJID
    nulls: last

columns:
- name: SITE
  type: str
  label: SITE
  derivation:
    mapping:
      source: RAW.StudyOID
      dict:
        S_20204824(TEST): CART2020
        S_DF(TEST): DF
        S_1234(TEST): '1234'
        S_MGH_6315(TEST): MGH
        S_ABBOTT(TEST): Abbott
        S_ZZ01_7109(TEST): ZZ01
        S_CNH(TEST): CNH
        S_SJ01(TEST): SJ01
      unmapped: null

- name: SUBJECTID
  type: str
  label: SUBJECTID

- name: SubjectKey
  type: str
  label: SubjectKey
  derivation: RAW.SubjectKey

- name: SUBJECTKEY
  type: str
  label: SUBJECTKEY
  derivation: RAW.SubjectKey

- name: STUDYID
  type: str
  label: Study Identifier
  derivation: '''CART-T-PILOT'''
  verifications:
  - max_length:
      max: 12
  submission:
    length: 12
    origins:
    - type: Assigned
      source: Sponsor
    core: Req
    mandatory: true
    data_type: text
    key_sequence: 1
    role: Identifier

- name: DOMAIN
  type: str
  label: Domain Abbreviation
  derivation: '''DM'''
  verifications:
  - max_length:
      max: 2
  submission:
    length: 2
    origins:
    - type: Assigned
      source: Sponsor
    core: Req
    mandatory: true
    data_type: text
    role: Identifier

- name: USUBJID
  type: str
  label: Unique Subject Identifier
  derivation:
    str_template: CART-T-PILOT-{RAW.SubjectKey}
  verifications:
  - max_length:
      max: 80
  submission:
    length: 80
    origins:
    - type: Derived
      source: Sponsor
    method: CART-T-PILOT followed by native ODM SubjectKey;
      globally unique, stable across site labels.
    comment: CART-T-PILOT followed by native ODM SubjectKey;
      globally unique, stable across site labels.
    core: Req
    mandatory: true
    data_type: text
    key_sequence: 2
    role: Identifier

- name: SUBJID
  type: str
  label: Subject Identifier for the Study
  derivation: SUBJECTID
  verifications:
  - max_length:
      max: 40
  submission:
    length: 40
    origins:
    - type: Predecessor
      description: SUBJECTID
    core: Req
    mandatory: true
    data_type: text
    role: Record Qualifier

- name: SITEID
  type: str
  label: Study Site Identifier
  derivation: SITE
  verifications:
  - max_length:
      max: 20
  submission:
    length: 20
    origins:
    - type: Predecessor
      description: SITE
    core: Req
    mandatory: true
    data_type: text
    role: Record Qualifier

- name: RFSTDTC
  type: str
  label: Subject Reference Start Date/Time
  derivation: null
  verifications:
  - max_length:
      max: 25
  submission:
    length: 25
    origins:
    - type: Derived
      source: Sponsor
    comment: No documented exposure or complete participation
      period. No reference date is inferred from an administrative
      event date.
    core: Exp
    mandatory: false
    data_type: text
    method: No documented exposure or complete participation
      period. No reference date is inferred from an administrative
      event date.
    role: Timing

- name: RFENDTC
  type: str
  label: Subject Reference End Date/Time
  derivation: null
  verifications:
  - max_length:
      max: 25
  submission:
    length: 25
    origins:
    - type: Derived
      source: Sponsor
    comment: No documented exposure or complete participation
      period. No reference date is inferred from an administrative
      event date.
    core: Exp
    mandatory: false
    data_type: text
    method: No documented exposure or complete participation
      period. No reference date is inferred from an administrative
      event date.
    role: Timing

- name: RFXSTDTC
  type: str
  label: Date/Time of First Study Treatment
  derivation: null
  verifications:
  - max_length:
      max: 25
  submission:
    length: 25
    origins:
    - type: Derived
      source: Sponsor
    comment: No documented exposure or complete participation
      period. No reference date is inferred from an administrative
      event date.
    core: Exp
    mandatory: false
    data_type: text
    method: No documented exposure or complete participation
      period. No reference date is inferred from an administrative
      event date.
    role: Timing

- name: RFXENDTC
  type: str
  label: Date/Time of Last Study Treatment
  derivation: null
  verifications:
  - max_length:
      max: 25
  submission:
    length: 25
    origins:
    - type: Derived
      source: Sponsor
    comment: No documented exposure or complete participation
      period. No reference date is inferred from an administrative
      event date.
    core: Exp
    mandatory: false
    data_type: text
    method: No documented exposure or complete participation
      period. No reference date is inferred from an administrative
      event date.
    role: Timing

- name: RFPENDTC
  type: str
  label: Date/Time of End of Participation
  derivation: null
  verifications:
  - max_length:
      max: 25
  submission:
    length: 25
    origins:
    - type: Derived
      source: Sponsor
    comment: No documented exposure or complete participation
      period. No reference date is inferred from an administrative
      event date.
    core: Exp
    mandatory: false
    data_type: text
    method: No documented exposure or complete participation
      period. No reference date is inferred from an administrative
      event date.
    role: Timing

- name: CONSENT
  type: str
  label: CONSENT
  derivation:
    source:
      variable: ITEMS.Value
      filter: ITEMS.ItemOID = 'I_DISPO_CONSENTEDDT' AND ITEMS.Value
        IS NOT NULL
      order_by:
      - ITEMS.SourceOrdinal
      keep: first

- name: RFICDTC
  type: str
  label: Date/Time of Informed Consent
  derivation:
    date_text:
      source: CONSENT
      forms:
      - iso
      - mdy_slash
      invalid: null
  verifications:
  - max_length:
      max: 25
  submission:
    length: 25
    origins:
    - type: Derived
      source: Sponsor
    method: Only Disposition.CONSENTEDDT. No proxy consent date
      and no clamping to other event dates.
    comment: Only Disposition.CONSENTEDDT. No proxy consent
      date and no clamping to other event dates.
    core: Exp
    mandatory: false
    data_type: text
    role: Timing

- name: BYEAR
  type: str
  label: BYEAR
  derivation:
    source:
      variable: ITEMS.Value
      filter: ITEMS.ItemOID = 'I_ELIGI_PTBYEAR' AND ITEMS.Value
        IS NOT NULL
      order_by:
      - ITEMS.SourceOrdinal
      keep: first

- name: BRTHDTC
  type: str
  label: Date/Time of Birth
  derivation:
    date_text:
      source: BYEAR
      forms:
      - iso
      - mdy_slash
      invalid: null
  verifications:
  - max_length:
      max: 10
  submission:
    length: 10
    origins:
    - type: Derived
      source: Sponsor
    method: Eligibility.PTBYEAR, retaining year precision. BDAY
      is a binary item, not a birth date.
    comment: Eligibility.PTBYEAR, retaining year precision.
      BDAY is a binary item, not a birth date.
    core: Perm
    mandatory: false
    data_type: text
    role: Timing

- name: AGE_RAW
  type: str
  label: AGE_RAW
  derivation:
    source:
      variable: ITEMS.Value
      filter: ITEMS.ItemOID = 'I_ELIGI_PTAGE' AND ITEMS.Value
        IS NOT NULL
      order_by:
      - ITEMS.SourceOrdinal
      keep: first

- name: AGE
  type: int
  label: Age
  derivation:
    value: AGE_RAW
    unconvertible: null
  submission:
    origins:
    - type: Derived
      source: Sponsor
    method: First present Eligibility.PTAGE by source group
      ordinal. No age is invented when the recorded value is
      unavailable.
    comment: First present Eligibility.PTAGE by source group
      ordinal. No age is invented when the recorded value is
      unavailable.
    core: Exp
    mandatory: false
    data_type: integer
    length: 8
    role: Record Qualifier

- name: AGEU
  type: str
  label: Age Units
  derivation:
    case:
    - when: AGE IS NOT NULL
      then: '''YEARS'''
    - otherwise: null
  verifications:
  - max_length:
      max: 5
  - allowed_values:
      values:
      - YEARS
  submission:
    length: 5
    origins:
    - type: Derived
      source: Sponsor
    method: |-
      Executable yamaa derivation: case:
      - when: AGE IS NOT NULL
        then: '''YEARS'''
      - otherwise: null
    core: Exp
    mandatory: false
    data_type: text
    codelist: AGEU
    role: Record Qualifier

- name: S1
  type: str
  label: S1
  derivation:
    source:
      variable: ITEMS.Value
      filter: ITEMS.ItemOID = 'I_1DEMO_PTSEX' AND ITEMS.Value
        IS NOT NULL
      order_by:
      - ITEMS.SourceOrdinal
      keep: first

- name: S2
  type: str
  label: S2
  derivation:
    source:
      variable: ITEMS.Value
      filter: ITEMS.ItemOID = 'I_1DEMO_PTSEXEL' AND ITEMS.Value
        IS NOT NULL
      order_by:
      - ITEMS.SourceOrdinal
      keep: first

- name: S3
  type: str
  label: S3
  derivation:
    source:
      variable: ITEMS.Value
      filter: ITEMS.ItemOID = 'I_ELIGI_PSEX' AND ITEMS.Value
        IS NOT NULL
      order_by:
      - ITEMS.SourceOrdinal
      keep: first

- name: RACE_RAW
  type: str
  label: RACE_RAW
  derivation:
    source:
      variable: ITEMS.Value
      filter: ITEMS.ItemOID = 'I_1DEMO_PTRACE' AND ITEMS.Value
        IS NOT NULL
      order_by:
      - ITEMS.SourceOrdinal
      keep: first

- name: ETH_RAW
  type: str
  label: ETH_RAW
  derivation:
    source:
      variable: ITEMS.Value
      filter: ITEMS.ItemOID = 'I_1DEMO_HISP' AND ITEMS.Value
        IS NOT NULL
      order_by:
      - ITEMS.SourceOrdinal
      keep: first

- name: S1_STD
  type: str
  label: S1_STD
  derivation:
    mapping:
      source: S1
      dict:
        '1': M
        '2': F
        Male: M
        Female: F
        M: M
        F: F
      unmapped: null

- name: S2_STD
  type: str
  label: S2_STD
  derivation:
    mapping:
      source: S2
      dict:
        '1': M
        '2': F
        Male: M
        Female: F
        M: M
        F: F
      unmapped: null

- name: S3_STD
  type: str
  label: S3_STD
  derivation:
    mapping:
      source: S3
      dict:
        '1': M
        '2': F
        Male: M
        Female: F
        M: M
        F: F
      unmapped: null

- name: SEX
  type: str
  label: Sex
  derivation:
    first_available:
      sources:
      - S1_STD
      - S2_STD
      - S3_STD
      missing: U
  verifications:
  - max_length:
      max: 1
  - allowed_values:
      values:
      - F
      - M
      - U
      - UNDIFFERENTIATED
  submission:
    length: 1
    origins:
    - type: Derived
      source: Sponsor
    method: PTSEX, then PTSEXEL, then Eligibility.PSEX; source
      codes 1=male, 2=female. Missing or unrecognized is U.
      Conflicts are listed for review.
    comment: PTSEX, then PTSEXEL, then Eligibility.PSEX; source
      codes 1=male, 2=female. Missing or unrecognized is U.
      Conflicts are listed for review.
    core: Req
    mandatory: true
    data_type: text
    codelist: SEX
    role: Record Qualifier

- name: RACE
  type: str
  label: Race
  derivation:
    case:
    - when: STR_CONTAINS(RACE_RAW, ',')
      then: '''MULTIPLE'''
    - otherwise:
        mapping:
          source: RACE_RAW
          dict:
            '1': AMERICAN INDIAN OR ALASKA NATIVE
            '2': ASIAN
            '3': BLACK OR AFRICAN AMERICAN
            '4': NATIVE HAWAIIAN OR OTHER PACIFIC ISLANDER
            '5': WHITE
            '6': OTHER
          missing: UNKNOWN
          unmapped: UNKNOWN
  verifications:
  - max_length:
      max: 60
  - allowed_values:
      values:
      - AMERICAN INDIAN OR ALASKA NATIVE
      - ASIAN
      - BLACK OR AFRICAN AMERICAN
      - NATIVE HAWAIIAN OR OTHER PACIFIC ISLANDER
      - WHITE
      - OTHER
      - MULTIPLE
      - UNKNOWN
  submission:
    length: 60
    origins:
    - type: Derived
      source: Sponsor
    method: |-
      Executable yamaa derivation: case:
      - when: STR_CONTAINS(RACE_RAW, ',')
        then: '''MULTIPLE'''
      - otherwise:
          mapping:
            source: RACE_RAW
            dict:
              '1': AMERICAN INDIAN OR ALASKA NATIVE
              '2': ASIAN
              '3': BLACK OR AFRICAN AMERICAN
              '4': NATIVE HAWAIIAN OR OTHER PACIFIC ISLANDER
              '5': WHITE
              '6': OTHER
            missing: UNKNOWN
            unmapped: UNKNOWN
    core: Exp
    mandatory: false
    data_type: text
    codelist: RACE
    role: Record Qualifier

- name: ETHNIC
  type: str
  label: Ethnicity
  derivation:
    mapping:
      source: ETH_RAW
      dict:
        '0': NOT HISPANIC OR LATINO
        '1': HISPANIC OR LATINO
      missing: UNKNOWN
      unmapped: UNKNOWN
  verifications:
  - max_length:
      max: 30
  - allowed_values:
      values:
      - HISPANIC OR LATINO
      - NOT HISPANIC OR LATINO
      - UNKNOWN
  submission:
    length: 30
    origins:
    - type: Derived
      source: Sponsor
    method: |-
      Executable yamaa derivation: mapping:
        source: ETH_RAW
        dict:
          '0': NOT HISPANIC OR LATINO
          '1': HISPANIC OR LATINO
        missing: UNKNOWN
        unmapped: UNKNOWN
    core: Perm
    mandatory: false
    data_type: text
    codelist: ETHNIC
    role: Record Qualifier

- name: COUNTRY
  type: str
  label: Country
  derivation: null
  verifications:
  - max_length:
      max: 3
  submission:
    length: 3
    origins:
    - type: Derived
      source: Sponsor
    comment: Not assigned from institution names. Country is
      not collected in the source.
    core: Req
    mandatory: true
    data_type: text
    method: Not assigned from institution names. Country is
      not collected in the source.
    role: Record Qualifier

- name: ARMCD
  type: str
  label: Planned Arm Code
  derivation: null
  verifications:
  - max_length:
      max: 40
  submission:
    length: 40
    origins:
    - type: Derived
      source: Sponsor
    comment: No actual allocation or administration is identified.
      Randomization PROFILE describes sex/ethnicity, not a treatment
      arm.
    core: Exp
    mandatory: false
    data_type: text
    method: No actual allocation or administration is identified.
      Randomization PROFILE describes sex/ethnicity, not a treatment
      arm.
    role: Record Qualifier

- name: ARM
  type: str
  label: Description of Planned Arm
  derivation: null
  verifications:
  - max_length:
      max: 40
  submission:
    length: 40
    origins:
    - type: Derived
      source: Sponsor
    comment: No actual allocation or administration is identified.
      Randomization PROFILE describes sex/ethnicity, not a treatment
      arm.
    core: Exp
    mandatory: false
    data_type: text
    method: No actual allocation or administration is identified.
      Randomization PROFILE describes sex/ethnicity, not a treatment
      arm.
    role: Record Qualifier

- name: ACTARMCD
  type: str
  label: Actual Arm Code
  derivation: null
  verifications:
  - max_length:
      max: 40
  submission:
    length: 40
    origins:
    - type: Derived
      source: Sponsor
    comment: No actual allocation or administration is identified.
      Randomization PROFILE describes sex/ethnicity, not a treatment
      arm.
    core: Exp
    mandatory: false
    data_type: text
    method: No actual allocation or administration is identified.
      Randomization PROFILE describes sex/ethnicity, not a treatment
      arm.
    role: Record Qualifier

- name: ACTARM
  type: str
  label: Description of Actual Arm
  derivation: null
  verifications:
  - max_length:
      max: 40
  submission:
    length: 40
    origins:
    - type: Derived
      source: Sponsor
    comment: No actual allocation or administration is identified.
      Randomization PROFILE describes sex/ethnicity, not a treatment
      arm.
    core: Exp
    mandatory: false
    data_type: text
    method: No actual allocation or administration is identified.
      Randomization PROFILE describes sex/ethnicity, not a treatment
      arm.
    role: Record Qualifier

- name: ARMNRS
  type: str
  label: Reason Arm Information Is Missing
  derivation: '''ASSIGNMENT NOT DOCUMENTED'''
  verifications:
  - max_length:
      max: 40
  submission:
    length: 40
    origins:
    - type: Assigned
      source: Sponsor
    core: Exp
    mandatory: false
    data_type: text
    role: Record Qualifier

- name: DEATH_N
  type: int
  label: DEATH_N
  derivation:
    aggregate:
      filter: ITEMS.ItemOID = 'I_ADVER_AESDTH' AND ITEMS.Value
        = 'Y'
      expr: COUNT(ITEMS.SourceOrdinal)

- name: DTHFL
  type: str
  label: Subject Death Flag
  derivation:
    case:
    - when: DEATH_N > 0
      then: '''Y'''
    - otherwise: null
  verifications:
  - max_length:
      max: 1
  - allowed_values:
      values:
      - N
      - Y
  submission:
    length: 1
    origins:
    - type: Derived
      source: Sponsor
    method: Y only when a source AE seriousness death criterion
      is Y. Conflicting AE outcome is queried, not overwritten.
    comment: Y only when a source AE seriousness death criterion
      is Y. Conflicting AE outcome is queried, not overwritten.
    core: Perm
    mandatory: false
    data_type: text
    codelist: NY
    role: Record Qualifier

- name: DTHDTC
  type: str
  label: Date/Time of Death
  derivation:
    aggregate:
      derivations:
        D:
          type: str
          derivation:
            date_text:
              source: ITEMS.Value
              forms:
              - iso
              - mdy_slash
              invalid: null
      expr: MIN(D)
      filter: ITEMS.ItemOID = 'I_ADVER_DTHDAT'
  verifications:
  - max_length:
      max: 25
  submission:
    length: 25
    origins:
    - type: Derived
      source: Sponsor
    method: |-
      Executable yamaa derivation: aggregate:
        derivations:
          D:
            type: str
            derivation:
              date_text:
                source: ITEMS.Value
                forms:
                - iso
                - mdy_slash
                invalid: null
        expr: MIN(D)
        filter: ITEMS.ItemOID = 'I_ADVER_DTHDAT'
    core: Perm
    mandatory: false
    data_type: text
    role: Timing

rows:
- id: subject
  dataset: RAW
  group_by:
  - RAW.StudyOID
  - RAW.MetaDataVersionOID
  - RAW.SubjectKey
  derivations:
    SUBJECTID:
      aggregate: MIN(RAW.StudySubjectID)

verifications:
- assert:
    id: recorded_age_outside_adult_range
    require: AGE IS NULL OR (AGE >= 18 AND AGE <= 100)
    severity: warning

submission:
  label: Demographics
  class: SPECIAL PURPOSE
  structure: One record per subject
  repeating: false
  mode: historical
  artifact: dm.xpt
  comment: Review draft metadata. Historical mode keeps declarations
    separate from incomplete data; this is not a validated submission.
    See spec/review/decisions.md.
