yamaa: '1.0'
type: spec
model: SDTM
domain: DM
keys:
- STUDYID
- USUBJID
input:
  SRC: ../../../data/odm/subjects.csv
  DEM:
    path: ../../../data/odm/demographics.csv
    types:
      ROWID: int
    key:
    - SUBJECTKEY
  ELIG:
    path: ../../../data/odm/eligibility.csv
    types:
      ROWID: int
    key:
    - SUBJECTKEY
  DISP:
    path: ../../../data/odm/disposition.csv
    types:
      ROWID: int
    key:
    - SUBJECTKEY
  AE:
    path: ../../../data/odm/adverse_events.csv
    types:
      ROWID: int
    key:
    - SUBJECTKEY
base: SRC

output:
  path: ../../../data/sdtm/dm.parquet
  columns:
  - STUDYID
  - DOMAIN
  - USUBJID
  - SUBJID
  - SITEID
  - RFSTDTC
  - RFENDTC
  - RFXSTDTC
  - RFXENDTC
  - RFPENDTC
  - RFICDTC
  - BRTHDTC
  - AGE
  - AGEU
  - SEX
  - RACE
  - ETHNIC
  - COUNTRY
  - ARMCD
  - ARM
  - ACTARMCD
  - ACTARM
  - ARMNRS
  - DTHFL
  - DTHDTC
  report: ../../../log/dm-report.csv
  order_by:
  - variable: STUDYID
    nulls: last
  - variable: USUBJID
    nulls: last

columns:
- name: SUBJECTKEY
  type: str
  label: SUBJECTKEY
  derivation: SRC.SUBJECTKEY

- name: STUDYID
  type: str
  label: Study Identifier
  derivation: '''CART-T-PILOT'''
  verifications:
  - max_length:
      max: 12
  submission:
    length: 12
    origins:
    - type: Assigned
      source: Sponsor
    core: Req
    mandatory: true
    data_type: text
    key_sequence: 1
    role: Identifier

- name: DOMAIN
  type: str
  label: Domain Abbreviation
  derivation: '''DM'''
  verifications:
  - max_length:
      max: 2
  submission:
    length: 2
    origins:
    - type: Assigned
      source: Sponsor
    core: Req
    mandatory: true
    data_type: text
    role: Identifier

- name: USUBJID
  type: str
  label: Unique Subject Identifier
  derivation:
    str_template: CART-T-PILOT-{SRC.SUBJECTKEY}
  verifications:
  - max_length:
      max: 80
  submission:
    length: 80
    origins:
    - type: Derived
      source: Sponsor
    method: CART-T-PILOT followed by native ODM SubjectKey; globally unique,
      stable across site labels.
    comment: CART-T-PILOT followed by native ODM SubjectKey; globally unique,
      stable across site labels.
    core: Req
    mandatory: true
    data_type: text
    key_sequence: 2
    role: Identifier

- name: SUBJID
  type: str
  label: Subject Identifier for the Study
  derivation: SRC.SUBJECTID
  verifications:
  - max_length:
      max: 40
  submission:
    length: 40
    origins:
    - type: Predecessor
      description: SRC.SUBJECTID
    core: Req
    mandatory: true
    data_type: text
    role: Record Qualifier

- name: SITEID
  type: str
  label: Study Site Identifier
  derivation: SRC.SITEID
  verifications:
  - max_length:
      max: 20
  submission:
    length: 20
    origins:
    - type: Predecessor
      description: SRC.SITEID
    core: Req
    mandatory: true
    data_type: text
    role: Record Qualifier

- name: RFSTDTC
  type: str
  label: Subject Reference Start Date/Time
  derivation: null
  verifications:
  - max_length:
      max: 25
  submission:
    length: 25
    origins:
    - type: Derived
      source: Sponsor
    comment: No documented exposure or complete participation period. No
      reference date is inferred from an administrative event date.
    core: Exp
    mandatory: false
    data_type: text
    method: No documented exposure or complete participation period. No
      reference
      date is inferred from an administrative event date.
    role: Timing

- name: RFENDTC
  type: str
  label: Subject Reference End Date/Time
  derivation: null
  verifications:
  - max_length:
      max: 25
  submission:
    length: 25
    origins:
    - type: Derived
      source: Sponsor
    comment: No documented exposure or complete participation period. No
      reference date is inferred from an administrative event date.
    core: Exp
    mandatory: false
    data_type: text
    method: No documented exposure or complete participation period. No
      reference
      date is inferred from an administrative event date.
    role: Timing

- name: RFXSTDTC
  type: str
  label: Date/Time of First Study Treatment
  derivation: null
  verifications:
  - max_length:
      max: 25
  submission:
    length: 25
    origins:
    - type: Derived
      source: Sponsor
    comment: No documented exposure or complete participation period. No
      reference date is inferred from an administrative event date.
    core: Exp
    mandatory: false
    data_type: text
    method: No documented exposure or complete participation period. No
      reference
      date is inferred from an administrative event date.
    role: Timing

- name: RFXENDTC
  type: str
  label: Date/Time of Last Study Treatment
  derivation: null
  verifications:
  - max_length:
      max: 25
  submission:
    length: 25
    origins:
    - type: Derived
      source: Sponsor
    comment: No documented exposure or complete participation period. No
      reference date is inferred from an administrative event date.
    core: Exp
    mandatory: false
    data_type: text
    method: No documented exposure or complete participation period. No
      reference
      date is inferred from an administrative event date.
    role: Timing

- name: RFPENDTC
  type: str
  label: Date/Time of End of Participation
  derivation: null
  verifications:
  - max_length:
      max: 25
  submission:
    length: 25
    origins:
    - type: Derived
      source: Sponsor
    comment: No documented exposure or complete participation period. No
      reference date is inferred from an administrative event date.
    core: Exp
    mandatory: false
    data_type: text
    method: No documented exposure or complete participation period. No
      reference
      date is inferred from an administrative event date.
    role: Timing

- name: CONSENT
  type: str
  label: CONSENT
  derivation:
    source:
      variable: DISP.I_CONSENTEDDT
      filter: DISP.I_CONSENTEDDT IS NOT NULL
      order_by:
      - DISP.ROWID
      keep: first

- name: RFICDTC
  type: str
  label: Date/Time of Informed Consent
  derivation:
    date_text:
      source: CONSENT
      forms:
      - iso
      - mdy_slash
      invalid: null
  verifications:
  - max_length:
      max: 25
  submission:
    length: 25
    origins:
    - type: Derived
      source: Sponsor
    method: Only Disposition.CONSENTEDDT. No proxy consent date and no clamping
      to other event dates.
    comment: Only Disposition.CONSENTEDDT. No proxy consent date and no
      clamping
      to other event dates.
    core: Exp
    mandatory: false
    data_type: text
    role: Timing

- name: BYEAR
  type: str
  label: BYEAR
  derivation:
    source:
      variable: ELIG.I_PTBYEAR
      filter: ELIG.I_PTBYEAR IS NOT NULL
      order_by:
      - ELIG.ROWID
      keep: first

- name: BRTHDTC
  type: str
  label: Date/Time of Birth
  derivation:
    date_text:
      source: BYEAR
      forms:
      - iso
      - mdy_slash
      invalid: null
  verifications:
  - max_length:
      max: 10
  submission:
    length: 10
    origins:
    - type: Derived
      source: Sponsor
    method: Eligibility.PTBYEAR, retaining year precision. BDAY is a binary
      item, not a birth date.
    comment: Eligibility.PTBYEAR, retaining year precision. BDAY is a binary
      item, not a birth date.
    core: Perm
    mandatory: false
    data_type: text
    role: Timing

- name: AGE_RAW
  type: str
  label: AGE_RAW
  derivation:
    source:
      variable: ELIG.I_PTAGE
      filter: ELIG.I_PTAGE IS NOT NULL
      order_by:
      - ELIG.ROWID
      keep: first

- name: AGE
  type: int
  label: Age
  derivation:
    value: AGE_RAW
    unconvertible: null
  submission:
    origins:
    - type: Derived
      source: Sponsor
    method: First present Eligibility.PTAGE by source group ordinal. No age
      is invented when the recorded value is unavailable.
    comment: First present Eligibility.PTAGE by source group ordinal. No
      age is invented when the recorded value is unavailable.
    core: Exp
    mandatory: false
    data_type: integer
    length: 8
    role: Record Qualifier

- name: AGEU
  type: str
  label: Age Units
  derivation:
    case:
    - when: AGE IS NOT NULL
      then: '''YEARS'''
    - otherwise: null
  verifications:
  - max_length:
      max: 5
  - allowed_values:
      values:
      - YEARS
  submission:
    length: 5
    origins:
    - type: Derived
      source: Sponsor
    method: |-
      Executable yamaa derivation: case:
      - when: AGE IS NOT NULL
        then: '''YEARS'''
      - otherwise: null
    core: Exp
    mandatory: false
    data_type: text
    codelist: AGEU
    role: Record Qualifier

- name: S1
  type: str
  label: S1
  derivation:
    source:
      variable: DEM.I_PTSEX
      filter: DEM.I_PTSEX IS NOT NULL
      order_by:
      - DEM.ROWID
      keep: first

- name: S2
  type: str
  label: S2
  derivation:
    source:
      variable: DEM.I_PTSEXEL
      filter: DEM.I_PTSEXEL IS NOT NULL
      order_by:
      - DEM.ROWID
      keep: first

- name: S3
  type: str
  label: S3
  derivation:
    source:
      variable: ELIG.I_PSEX
      filter: ELIG.I_PSEX IS NOT NULL
      order_by:
      - ELIG.ROWID
      keep: first

- name: RACE_RAW
  type: str
  label: RACE_RAW
  derivation:
    source:
      variable: DEM.I_PTRACE
      filter: DEM.I_PTRACE IS NOT NULL
      order_by:
      - DEM.ROWID
      keep: first

- name: ETH_RAW
  type: str
  label: ETH_RAW
  derivation:
    source:
      variable: DEM.I_HISP
      filter: DEM.I_HISP IS NOT NULL
      order_by:
      - DEM.ROWID
      keep: first

- name: S1_STD
  type: str
  label: S1_STD
  derivation:
    mapping:
      source: S1
      dict:
        '1': M
        '2': F
        Male: M
        Female: F
        M: M
        F: F
      unmapped: null

- name: S2_STD
  type: str
  label: S2_STD
  derivation:
    mapping:
      source: S2
      dict:
        '1': M
        '2': F
        Male: M
        Female: F
        M: M
        F: F
      unmapped: null

- name: S3_STD
  type: str
  label: S3_STD
  derivation:
    mapping:
      source: S3
      dict:
        '1': M
        '2': F
        Male: M
        Female: F
        M: M
        F: F
      unmapped: null

- name: SEX
  type: str
  label: Sex
  derivation:
    first_available:
      sources:
      - S1_STD
      - S2_STD
      - S3_STD
      missing: U
  verifications:
  - max_length:
      max: 1
  - allowed_values:
      values:
      - F
      - M
      - U
      - UNDIFFERENTIATED
  submission:
    length: 1
    origins:
    - type: Derived
      source: Sponsor
    method: PTSEX, then PTSEXEL, then Eligibility.PSEX; source codes 1=male,
      2=female. Missing or unrecognized is U. Conflicts are listed for review.
    comment: PTSEX, then PTSEXEL, then Eligibility.PSEX; source codes 1=male,
      2=female. Missing or unrecognized is U. Conflicts are listed for review.
    core: Req
    mandatory: true
    data_type: text
    codelist: SEX
    role: Record Qualifier

- name: RACE
  type: str
  label: Race
  derivation:
    case:
    - when: STR_CONTAINS(RACE_RAW, ',')
      then: '''MULTIPLE'''
    - otherwise:
        mapping:
          source: RACE_RAW
          dict:
            '1': AMERICAN INDIAN OR ALASKA NATIVE
            '2': ASIAN
            '3': BLACK OR AFRICAN AMERICAN
            '4': NATIVE HAWAIIAN OR OTHER PACIFIC ISLANDER
            '5': WHITE
            '6': OTHER
          missing: UNKNOWN
          unmapped: UNKNOWN
  verifications:
  - max_length:
      max: 60
  - allowed_values:
      values:
      - AMERICAN INDIAN OR ALASKA NATIVE
      - ASIAN
      - BLACK OR AFRICAN AMERICAN
      - NATIVE HAWAIIAN OR OTHER PACIFIC ISLANDER
      - WHITE
      - OTHER
      - MULTIPLE
      - UNKNOWN
  submission:
    length: 60
    origins:
    - type: Derived
      source: Sponsor
    method: |-
      Executable yamaa derivation: case:
      - when: STR_CONTAINS(RACE_RAW, ',')
        then: '''MULTIPLE'''
      - otherwise:
          mapping:
            source: RACE_RAW
            dict:
              '1': AMERICAN INDIAN OR ALASKA NATIVE
              '2': ASIAN
              '3': BLACK OR AFRICAN AMERICAN
              '4': NATIVE HAWAIIAN OR OTHER PACIFIC ISLANDER
              '5': WHITE
              '6': OTHER
            missing: UNKNOWN
            unmapped: UNKNOWN
    core: Exp
    mandatory: false
    data_type: text
    codelist: RACE
    role: Record Qualifier

- name: ETHNIC
  type: str
  label: Ethnicity
  derivation:
    mapping:
      source: ETH_RAW
      dict:
        '0': NOT HISPANIC OR LATINO
        '1': HISPANIC OR LATINO
      missing: UNKNOWN
      unmapped: UNKNOWN
  verifications:
  - max_length:
      max: 30
  - allowed_values:
      values:
      - HISPANIC OR LATINO
      - NOT HISPANIC OR LATINO
      - UNKNOWN
  submission:
    length: 30
    origins:
    - type: Derived
      source: Sponsor
    method: |-
      Executable yamaa derivation: mapping:
        source: ETH_RAW
        dict:
          '0': NOT HISPANIC OR LATINO
          '1': HISPANIC OR LATINO
        missing: UNKNOWN
        unmapped: UNKNOWN
    core: Perm
    mandatory: false
    data_type: text
    codelist: ETHNIC
    role: Record Qualifier

- name: COUNTRY
  type: str
  label: Country
  derivation: null
  verifications:
  - max_length:
      max: 3
  submission:
    length: 3
    origins:
    - type: Derived
      source: Sponsor
    comment: Not assigned from institution names. Country is not collected
      in the source.
    core: Req
    mandatory: true
    data_type: text
    method: Not assigned from institution names. Country is not collected
      in the source.
    role: Record Qualifier

- name: ARMCD
  type: str
  label: Planned Arm Code
  derivation: null
  verifications:
  - max_length:
      max: 40
  submission:
    length: 40
    origins:
    - type: Derived
      source: Sponsor
    comment: No actual allocation or administration is identified.
      Randomization
      PROFILE describes sex/ethnicity, not a treatment arm.
    core: Exp
    mandatory: false
    data_type: text
    method: No actual allocation or administration is identified. Randomization
      PROFILE describes sex/ethnicity, not a treatment arm.
    role: Record Qualifier

- name: ARM
  type: str
  label: Description of Planned Arm
  derivation: null
  verifications:
  - max_length:
      max: 40
  submission:
    length: 40
    origins:
    - type: Derived
      source: Sponsor
    comment: No actual allocation or administration is identified.
      Randomization
      PROFILE describes sex/ethnicity, not a treatment arm.
    core: Exp
    mandatory: false
    data_type: text
    method: No actual allocation or administration is identified. Randomization
      PROFILE describes sex/ethnicity, not a treatment arm.
    role: Record Qualifier

- name: ACTARMCD
  type: str
  label: Actual Arm Code
  derivation: null
  verifications:
  - max_length:
      max: 40
  submission:
    length: 40
    origins:
    - type: Derived
      source: Sponsor
    comment: No actual allocation or administration is identified.
      Randomization
      PROFILE describes sex/ethnicity, not a treatment arm.
    core: Exp
    mandatory: false
    data_type: text
    method: No actual allocation or administration is identified. Randomization
      PROFILE describes sex/ethnicity, not a treatment arm.
    role: Record Qualifier

- name: ACTARM
  type: str
  label: Description of Actual Arm
  derivation: null
  verifications:
  - max_length:
      max: 40
  submission:
    length: 40
    origins:
    - type: Derived
      source: Sponsor
    comment: No actual allocation or administration is identified.
      Randomization
      PROFILE describes sex/ethnicity, not a treatment arm.
    core: Exp
    mandatory: false
    data_type: text
    method: No actual allocation or administration is identified. Randomization
      PROFILE describes sex/ethnicity, not a treatment arm.
    role: Record Qualifier

- name: ARMNRS
  type: str
  label: Reason Arm Information Is Missing
  derivation: '''ASSIGNMENT NOT DOCUMENTED'''
  verifications:
  - max_length:
      max: 40
  submission:
    length: 40
    origins:
    - type: Assigned
      source: Sponsor
    core: Exp
    mandatory: false
    data_type: text
    role: Record Qualifier

- name: DEATH_N
  type: int
  label: DEATH_N
  derivation:
    aggregate:
      filter: AE.I_AESDTH = 'Y'
      expr: COUNT(AE.ROWID)

- name: DTHFL
  type: str
  label: Subject Death Flag
  derivation:
    case:
    - when: DEATH_N > 0
      then: '''Y'''
    - otherwise: null
  verifications:
  - max_length:
      max: 1
  - allowed_values:
      values:
      - N
      - Y
  submission:
    length: 1
    origins:
    - type: Derived
      source: Sponsor
    method: Y only when a source AE seriousness death criterion is Y.
      Conflicting
      AE outcome is queried, not overwritten.
    comment: Y only when a source AE seriousness death criterion is Y.
      Conflicting
      AE outcome is queried, not overwritten.
    core: Perm
    mandatory: false
    data_type: text
    codelist: NY
    role: Record Qualifier

- name: DTHDTC
  type: str
  label: Date/Time of Death
  derivation:
    aggregate:
      derivations:
        D:
          type: str
          derivation:
            date_text:
              source: AE.I_DTHDAT
              forms:
              - iso
              - mdy_slash
              invalid: null
      expr: MIN(D)
  verifications:
  - max_length:
      max: 25
  submission:
    length: 25
    origins:
    - type: Derived
      source: Sponsor
    method: |-
      Executable yamaa derivation: aggregate:
        derivations:
          D:
            type: str
            derivation:
              date_text:
                source: AE.I_DTHDAT
                forms:
                - iso
                - mdy_slash
                invalid: null
        expr: MIN(D)
    core: Perm
    mandatory: false
    data_type: text
    role: Timing

verifications:
- assert:
    id: recorded_age_outside_adult_range
    require: AGE IS NULL OR (AGE >= 18 AND AGE <= 100)
    severity: warning

submission:
  label: Demographics
  class: SPECIAL PURPOSE
  structure: One record per subject
  repeating: false
  mode: historical
  artifact: dm.xpt
  comment: Review draft metadata. Historical mode keeps declarations separate
    from incomplete data; this is not a validated submission. See
    spec/review/decisions.md.
