## Build → XPT export → P21 Community validation pipeline
## Automatically rebuilds changed datasets, exports XPT, and runs P21
## validation on every PR that touches programs, specs, or raw data.
##
## P21 Community is downloaded and installed automatically on a
## windows-latest runner — no secrets or self-hosted infra needed.
##
## To adjust CT or engine versions, update the env block below.

name: Build, Export XPT & P21 Validate

on:
  pull_request:
    branches: [main]
    paths:
      - "program/sdtm/**"
      - "program/adam/**"
      - "program/raw/**"
      - "spec/**"
      - "data/raw/**"

concurrency:
  group: build-xpt-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # Job 1: figure out which datasets need rebuilding
  # ------------------------------------------------------------------
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      sdtm_datasets: ${{ steps.diff.outputs.sdtm_datasets }}
      adam_datasets: ${{ steps.diff.outputs.adam_datasets }}
      any_changed: ${{ steps.diff.outputs.any_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed datasets
        id: diff
        run: |
          BASE=${{ github.event.pull_request.base.sha }}
          HEAD=${{ github.event.pull_request.head.sha }}
          CHANGED=$(git diff --name-only "$BASE" "$HEAD")

          echo "--- changed files ---"
          echo "$CHANGED"
          echo "---------------------"

          SDTM_ORDER="dm mh ie ae cm ds lb qs ce"
          ADAM_ORDER="adsl adae adcm adlb adqs admh adds adie adce"
          sdtm_set=""
          adam_set=""

          # Cascade rules ------------------------------------------------

          # Rule 1: raw data or shared utility changed -> rebuild everything
          if echo "$CHANGED" | grep -qE '^(data/raw/|program/raw/|program/sdtm/ut_visits\.R)'; then
            sdtm_set="$SDTM_ORDER"
            adam_set="$ADAM_ORDER"
          else
            # Rule 2: detect individual SDTM programs
            for dom in $SDTM_ORDER; do
              if echo "$CHANGED" | grep -qE "^(program/sdtm/${dom}\.R|spec/sdtm/${dom}\.yaml)"; then
                sdtm_set="$sdtm_set $dom"
              fi
            done

            # Rule 3: DM changed -> all SDTM rebuild (all depend on DM)
            if echo "$sdtm_set" | grep -qw dm; then
              sdtm_set="$SDTM_ORDER"
            fi

            # Rule 4: detect individual ADaM programs
            for ds in $ADAM_ORDER; do
              if echo "$CHANGED" | grep -qE "^(program/adam/${ds}\.R|spec/adam/${ds}\.yaml)"; then
                adam_set="$adam_set $ds"
              fi
            done

            # Rule 5: any SDTM change -> its ADaM counterpart + ADSL
            if [ -n "$sdtm_set" ]; then
              adam_set="$adam_set adsl"
              for dom in $sdtm_set; do
                case $dom in
                  dm) adam_set="$adam_set adsl" ;;
                  ae) adam_set="$adam_set adae" ;;
                  cm) adam_set="$adam_set adcm" ;;
                  lb) adam_set="$adam_set adlb" ;;
                  qs) adam_set="$adam_set adqs" ;;
                  mh) adam_set="$adam_set admh" ;;
                  ds) adam_set="$adam_set adds" ;;
                  ie) adam_set="$adam_set adie" ;;
                  ce) adam_set="$adam_set adce" ;;
                esac
              done
            fi

            # Rule 6: ADSL changed -> all ADaM rebuild
            if echo "$adam_set" | grep -qw adsl; then
              adam_set="$ADAM_ORDER"
            fi
          fi

          # Deduplicate and preserve order
          dedup_ordered() {
            local full_order="$1"
            local selected="$2"
            local result=""
            for item in $full_order; do
              if echo " $selected " | grep -qw "$item"; then
                result="$result $item"
              fi
            done
            echo "$result" | xargs
          }

          sdtm_datasets=$(dedup_ordered "$SDTM_ORDER" "$sdtm_set")
          adam_datasets=$(dedup_ordered "$ADAM_ORDER" "$adam_set")
          any_changed="false"
          if [ -n "$sdtm_datasets" ] || [ -n "$adam_datasets" ]; then
            any_changed="true"
          fi

          echo "sdtm_datasets=$sdtm_datasets" >> "$GITHUB_OUTPUT"
          echo "adam_datasets=$adam_datasets"   >> "$GITHUB_OUTPUT"
          echo "any_changed=$any_changed"       >> "$GITHUB_OUTPUT"

          echo "SDTM to build: [$sdtm_datasets]"
          echo "ADaM to build: [$adam_datasets]"

  # ------------------------------------------------------------------
  # Job 2: build datasets and export XPT
  # ------------------------------------------------------------------
  build-and-export:
    needs: detect-changes
    if: needs.detect-changes.outputs.any_changed == 'true'
    runs-on: ubuntu-latest
    env:
      SDTM_DATASETS: ${{ needs.detect-changes.outputs.sdtm_datasets }}
      ADAM_DATASETS: ${{ needs.detect-changes.outputs.adam_datasets }}

    steps:
      - uses: actions/checkout@v4

      # --- R ---
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.2"

      # --- renv cache ---
      - name: Cache renv packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/R/renv
            renv/library
          key: renv-${{ runner.os }}-${{ hashFiles('renv.lock') }}
          restore-keys: renv-${{ runner.os }}-

      - name: Restore renv
        run: |
          Rscript -e 'if (!requireNamespace("renv", quietly = TRUE)) install.packages("renv")'
          Rscript -e 'renv::restore(prompt = FALSE)'

      # --- Build SDTM datasets ---
      - name: Build SDTM datasets
        if: env.SDTM_DATASETS != ''
        run: |
          for dom in $SDTM_DATASETS; do
            echo ">>> Building SDTM: $dom"
            Rscript "program/sdtm/${dom}.R"
          done

      # --- Convert SDTM .rds to .xpt ---
      - name: Convert SDTM to XPT
        if: env.SDTM_DATASETS != ''
        run: |
          Rscript -e '
          library(haven)
          library(yaml)

          domains <- strsplit(Sys.getenv("SDTM_DATASETS"), "\\s+")[[1]]
          domains <- domains[nzchar(domains)]

          for (dom in domains) {
            rds_path  <- file.path("data", "sdtm", paste0(dom, ".rds"))
            xpt_path  <- file.path("data", "sdtm", paste0(dom, ".xpt"))
            spec_path <- file.path("spec", "sdtm", paste0(dom, ".yaml"))

            if (!file.exists(rds_path)) {
              message("SKIP (no .rds): ", rds_path)
              next
            }

            df <- readRDS(rds_path)

            # Apply labels from spec YAML
            if (file.exists(spec_path)) {
              spec <- tryCatch(yaml::read_yaml(spec_path), error = function(e) {
                message("YAML error in ", spec_path, ": ", e$message)
                NULL
              })
              if (!is.null(spec)) {
                for (v in names(df)) {
                  lab <- spec$variables[[v]]$label
                  if (!is.null(lab) && nzchar(lab)) attr(df[[v]], "label") <- lab
                }
                attr(df, "label") <- spec$label
              }
            }

            # Coerce integer columns to double (haven::write_xpt requirement)
            int_cols <- names(df)[vapply(df, is.integer, logical(1))]
            for (col in int_cols) {
              lab <- attr(df[[col]], "label")
              df[[col]] <- as.double(df[[col]])
              if (!is.null(lab)) attr(df[[col]], "label") <- lab
            }

            haven::write_xpt(df, path = xpt_path, version = 5,
                              name = toupper(dom))
            message("XPT written: ", xpt_path,
                    " (", nrow(df), " rows x ", ncol(df), " cols)")
          }
          '

      # --- Build ADaM datasets (these produce their own XPT) ---
      - name: Build ADaM datasets
        if: env.ADAM_DATASETS != ''
        run: |
          for ds in $ADAM_DATASETS; do
            echo ">>> Building ADaM: $ds"
            Rscript "program/adam/${ds}.R"
          done

      # --- Upload XPT artifacts ---
      - name: Upload SDTM XPT files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdtm-xpt
          retention-days: 30
          if-no-files-found: ignore
          path: data/sdtm/*.xpt

      - name: Upload ADaM XPT files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adam-xpt
          retention-days: 30
          if-no-files-found: ignore
          path: data/adam/*.xpt

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          retention-days: 30
          if-no-files-found: ignore
          path: logs/

  # ------------------------------------------------------------------
  # Job 3: validate XPT with Pinnacle 21 Community CLI
  #
  # Runs on windows-latest because P21 Community only supports
  # Windows and macOS (no Linux).  The installer is downloaded from
  # Certara's public CDN and installed silently — no secrets needed.
  # ------------------------------------------------------------------
  p21-validate:
    needs: build-and-export
    if: always() && needs.build-and-export.result == 'success'
    runs-on: windows-latest

    env:
      # --- P21 version & download URL (update when Certara publishes a new release) ---
      P21_VERSION: "4.1.0"
      P21_INSTALLER_URL: "https://dthfq9xldm1jq.cloudfront.net/site/Pinnacle%2021%20Community%20Setup%204.1.0.exe"
      P21_INSTALL_DIR: "C:\\p21"
      # --- CDISC CT versions (update to match your study) ---
      CDISC_CT_SDTM: "2024-06-28"
      CDISC_CT_ADAM: "2024-06-28"

    steps:
      - uses: actions/checkout@v4

      # --- Java 8 (required by P21 CLI; newer versions not supported) ---
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      # --- Download XPT artifacts from the build job ---
      - name: Download SDTM XPT
        uses: actions/download-artifact@v4
        with:
          name: sdtm-xpt
          path: data/sdtm/

      - name: Download ADaM XPT
        uses: actions/download-artifact@v4
        with:
          name: adam-xpt
          path: data/adam/

      # --- Cache P21 installation to skip download on repeat runs ---
      - name: Cache P21 Community install
        id: p21-cache
        uses: actions/cache@v4
        with:
          path: C:\p21
          key: p21-community-${{ env.P21_VERSION }}

      # --- Download & silent-install P21 Community ---
      - name: Install P21 Community
        if: steps.p21-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Write-Host "Downloading P21 Community $env:P21_VERSION ..."
          $installer = "$env:TEMP\p21-setup.exe"
          Invoke-WebRequest -Uri $env:P21_INSTALLER_URL -OutFile $installer -UseBasicParsing

          Write-Host "Installing silently to $env:P21_INSTALL_DIR ..."
          # NSIS installer: /S = silent, /D= sets install directory (must be last)
          Start-Process -FilePath $installer `
            -ArgumentList "/S", "/D=$env:P21_INSTALL_DIR" `
            -Wait -NoNewWindow

          # Verify the install produced the expected layout
          $components = Join-Path $env:P21_INSTALL_DIR "resources\app.asar.unpacked\components"
          if (-not (Test-Path $components)) {
            Write-Error "P21 install failed — components dir not found at $components"
            exit 1
          }
          Get-ChildItem $components -Recurse -Filter "p21-client-*.jar" |
            ForEach-Object { Write-Host "Found CLI JAR: $($_.FullName)" }
          Write-Host "P21 Community installed."

      # --- Locate the CLI JAR and set up the working directory ---
      - name: Prepare P21 CLI
        id: p21-cli
        shell: pwsh
        run: |
          $components = Join-Path $env:P21_INSTALL_DIR "resources\app.asar.unpacked\components"

          # Find the CLI JAR
          $jar = Get-ChildItem $components -Recurse -Filter "p21-client-*.jar" |
                   Select-Object -First 1
          if (-not $jar) {
            Write-Error "p21-client JAR not found under $components"
            exit 1
          }

          # The CLI expects the JAR in a folder that contains a configs/ dir.
          # The configs/ dir lives alongside lib/ under components/.
          $cliDir = "$env:TEMP\p21-cli"
          New-Item -ItemType Directory -Path $cliDir -Force | Out-Null
          Copy-Item $jar.FullName -Destination $cliDir
          Copy-Item (Join-Path $components "configs") -Destination $cliDir -Recurse -Force

          $jarName = $jar.Name
          Write-Host "CLI working dir: $cliDir"
          Write-Host "CLI JAR: $jarName"
          Get-ChildItem $cliDir

          # Export for later steps
          echo "cli_dir=$cliDir"   >> $env:GITHUB_OUTPUT
          echo "jar_name=$jarName" >> $env:GITHUB_OUTPUT

      # --- Validate SDTM ---
      - name: Validate SDTM
        shell: pwsh
        run: |
          $cliDir  = "${{ steps.p21-cli.outputs.cli_dir }}"
          $jarName = "${{ steps.p21-cli.outputs.jar_name }}"
          $jar     = Join-Path $cliDir $jarName

          $sdtmDir = Join-Path $PWD "data\sdtm"
          $xptFiles = Get-ChildItem $sdtmDir -Filter "*.xpt" -ErrorAction SilentlyContinue
          Write-Host "SDTM XPT files found: $($xptFiles.Count)"

          if ($xptFiles.Count -eq 0) {
            Write-Host "No SDTM XPT files to validate — skipping."
            exit 0
          }

          New-Item -ItemType Directory -Path reports -Force | Out-Null
          $reportPath = Join-Path $PWD "reports\p21-sdtm-report.xlsx"

          Push-Location $cliDir
          & java -jar $jar `
            --standard sdtm `
            --standard.version 3.3 `
            --source.sdtm $sdtmDir `
            --cdisc.ct.sdtm.version $env:CDISC_CT_SDTM `
            --report $reportPath
          $exitCode = $LASTEXITCODE
          Pop-Location

          if ($exitCode -ne 0) {
            Write-Host "::warning::P21 SDTM validation exited with code $exitCode"
          }
          if (Test-Path $reportPath) {
            Write-Host "SDTM report written: $reportPath"
          }

      # --- Validate ADaM ---
      - name: Validate ADaM
        shell: pwsh
        run: |
          $cliDir  = "${{ steps.p21-cli.outputs.cli_dir }}"
          $jarName = "${{ steps.p21-cli.outputs.jar_name }}"
          $jar     = Join-Path $cliDir $jarName

          $adamDir = Join-Path $PWD "data\adam"
          $sdtmDir = Join-Path $PWD "data\sdtm"
          $xptFiles = Get-ChildItem $adamDir -Filter "*.xpt" -ErrorAction SilentlyContinue
          Write-Host "ADaM XPT files found: $($xptFiles.Count)"

          if ($xptFiles.Count -eq 0) {
            Write-Host "No ADaM XPT files to validate — skipping."
            exit 0
          }

          New-Item -ItemType Directory -Path reports -Force | Out-Null
          $reportPath = Join-Path $PWD "reports\p21-adam-report.xlsx"

          Push-Location $cliDir
          & java -jar $jar `
            --standard adam `
            --standard.version 1.3 `
            --source.adam $adamDir `
            --source.sdtm $sdtmDir `
            --cdisc.ct.adam.version $env:CDISC_CT_ADAM `
            --cdisc.ct.sdtm.version $env:CDISC_CT_SDTM `
            --report $reportPath
          $exitCode = $LASTEXITCODE
          Pop-Location

          if ($exitCode -ne 0) {
            Write-Host "::warning::P21 ADaM validation exited with code $exitCode"
          }
          if (Test-Path $reportPath) {
            Write-Host "ADaM report written: $reportPath"
          }

      # --- Upload validation reports ---
      - name: Upload P21 reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p21-validation-reports
          retention-days: 90
          if-no-files-found: warn
          path: reports/p21-*.xlsx

      # --- Post summary to the PR ---
      - name: Post validation summary
        if: always()
        shell: pwsh
        run: |
          $summary = @"
          ## Pinnacle 21 Validation

          | Standard | Version | CT Version | Status |
          |----------|---------|------------|--------|
          | SDTM | 3.3 | $env:CDISC_CT_SDTM | $(if (Test-Path reports\p21-sdtm-report.xlsx) { 'Report generated' } else { 'No report (no XPT or error)' }) |
          | ADaM | 1.3 | $env:CDISC_CT_ADAM | $(if (Test-Path reports\p21-adam-report.xlsx) { 'Report generated' } else { 'No report (no XPT or error)' }) |

          Download the **p21-validation-reports** artifact for the full Excel report.
          "@
          $summary | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
