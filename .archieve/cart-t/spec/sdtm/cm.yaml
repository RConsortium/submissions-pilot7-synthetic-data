domain: CM
label: Concomitant Medications
class: Interventions
structure: One record per recorded medication administration per subject
purpose: Tabulation
keys: [STUDYID, USUBJID, CMTRT, CMSTDTC]
ig_anchor: "CM+Specification"

sources:
  - form: "ConMed"
    item_groups: [group1]
  - form: "RxNorm Coding"
    notes: |
      Provides RXCUI, RXAUI, RXTTY (term type), RXTYPE enrichment per
      medication. The sponsor-defined dictionary for this study is RxNorm
      rather than WHO Drug; CMDECOD carries the RxNorm preferred name.
      RXCUI/RXAUI/RXTTY are non-standard CM variables and are not carried
      forward into CM (would belong in SUPPCM if a Supplemental Qualifiers
      dataset is added).

record_rule: |
  One row per non-blank CMTRT (raw item CMTRTL). Items repeating within
  the same ConMed form share itemgrouprepeatkey.

variables:
  STUDYID:
    label: Study Identifier
    type: Char
    length: 12
    role: Identifier
    core: Req
    origin: Sponsor Defined
    derivation: Study constant ("CART-T-PILOT").

  DOMAIN:
    label: Domain Abbreviation
    type: Char
    length: 2
    role: Identifier
    core: Req
    origin: Assigned
    derivation: Constant value "CM".

  USUBJID:
    label: Unique Subject Identifier
    type: Char
    length: 30
    role: Identifier
    core: Req
    origin: Derived
    derivation: make_usubjid(studysubjectid) — "CART-T-PILOT-01-<studysubjectid>".

  CMSEQ:
    label: Sequence Number
    type: Num
    length: 8
    role: Identifier
    core: Req
    origin: Derived
    derivation: row_number() within USUBJID, ordered by CMSTDTC, CMTRT.

  CMTRT:
    label: Reported Name of Drug, Med, or Therapy
    type: Char
    length: 200
    role: Topic
    core: Req
    origin: CRF
    raw_item: CMTRTL
    source_form: "ConMed"
    derivation: Copied verbatim from ConMed.group1.CMTRTL (verbatim trade or generic name).

  CMDECOD:
    label: Standardized Medication Name
    type: Char
    length: 200
    role: Synonym Qualifier
    core: Exp
    origin: Assigned
    raw_item: MEDNAME
    source_form: "ConMed"
    derivation: RxNorm preferred name from MEDNAME (set by RxNorm Coding workflow).

  CMINDC:
    label: Indication
    type: Char
    length: 200
    role: Record Qualifier
    core: Perm
    origin: CRF
    raw_item: CMINDC
    source_form: "ConMed"
    derivation: Copied verbatim from CMINDC.

  CMDOSE:
    label: Dose per Administration
    type: Num
    length: 8
    role: Record Qualifier
    core: Perm
    origin: CRF
    raw_item: CMDOSE
    source_form: "ConMed"
    derivation: as.numeric(CMDOSE); NA if not numeric.

  CMDOSU:
    label: Dose Units
    type: Char
    length: 20
    role: Variable Qualifier
    core: Perm
    origin: CRF
    codelist: UNIT
    raw_items: [CMDOSU, CMDOSUTXT]
    source_form: "ConMed"
    derivation: |
      map_dosu(coalesce(CMDOSU, CMDOSUTXT)) — maps OpenClinica CL UNIT
      values to CDISC UNIT (C71620): G→g, MG→mg, L→L, mL→mL, µg/mcg/ug→ug.
      "Other" and free-text "mg/m^2" return NA (no CT match).

  CMDOSFRM:
    label: Dose Form
    type: Char
    length: 40
    role: Variable Qualifier
    core: Perm
    origin: CRF
    codelist: FRM
    raw_items: [CMDOSFRM, CMDOSFRMTEXT]
    source_form: "ConMed"
    derivation: |
      map_dosfrm(coalesce(CMDOSFRM, CMDOSFRMTEXT)) — maps the OpenClinica
      CL_207 CMDOSFRM codelist to CDISC FRM (C66726): Aerosol→AEROSOL,
      Capsule→CAPSULE, Ointment→OINTMENT, Suppository→SUPPOSITORY,
      Suspension→SUSPENSION, Tablet→TABLET, Cream→CREAM, Gel→GEL,
      Patch→PATCH, Spray→SPRAY, Powder→POWDER, Implant→IMPLANT,
      Liquid→LIQUID, Gas→GAS, Chewable→CHEWABLE TABLET. "Other" → NA.

  CMDOSFRQ:
    label: Dosing Frequency per Interval
    type: Char
    length: 40
    role: Variable Qualifier
    core: Perm
    origin: CRF
    codelist: FREQ
    raw_item: CMDOSFRQ
    source_form: "ConMed"
    derivation: |
      map_dosfrq(CMDOSFRQ) — maps the OpenClinica CL_209 CMDOSFRQ codelist
      to CDISC FREQ (C71113): "QD (once a day)"→QD, "BID (twice a day)"→BID,
      "TID (three times a day)"→TID, "QID (four times a day)"→QID,
      "QH (every hour)"→QH, "QM (every month)"→QM, "QOM (every other mo)"
      →QOM, "QOD (every other day)"→QOD, "PC (after meals)"→PC,
      "AC (before meals)"→AC, "PRN (as needed)"→PRN. Numeric coded values
      and "Other" → NA (cannot be unambiguously mapped to CDISC FREQ).

  CMROUTE:
    label: Route of Administration
    type: Char
    length: 40
    role: Variable Qualifier
    core: Perm
    origin: CRF
    codelist: ROUTE
    raw_item: CMROUTE
    source_form: "ConMed"
    derivation: |
      map_route(CMROUTE) — maps the OpenClinica CL_211 CMROUTE codelist
      to CDISC ROUTE (C66729): Oral→ORAL, Topical→TOPICAL,
      Subcutaneous→SUBCUTANEOUS, Intravaneous→INTRAVENOUS (spelling fix),
      Introacular→INTRAOCULAR (spelling fix), Intramuscular→INTRAMUSCULAR,
      etc. Numeric coded values and "Other" → NA.

  CMSTDTC:
    label: Start Date/Time of Medication
    type: Char
    length: 10
    role: Timing
    core: Perm
    origin: CRF
    raw_item: CMSTDAT
    source_form: "ConMed"
    derivation: normalize_iso_date(CMSTDAT). NA when CMSTDAT not provided.

  CMENDTC:
    label: End Date/Time of Medication
    type: Char
    length: 10
    role: Timing
    core: Perm
    origin: CRF
    raw_item: CMENDAT
    source_form: "ConMed"
    derivation: |
      normalize_iso_date(CMENDAT). NA when ONGOING=Yes (use CMENRTPT
      instead). NA when CMENDTC < CMSTDTC (data-entry inversion;
      SD0013 — drops the bad end date rather than the medication).

  CMSTDY:
    label: Study Day of Start of Medication
    type: Num
    length: 8
    role: Timing
    core: Perm
    origin: Derived
    derivation: |
      as.integer(as.Date(CMSTDTC) - as.Date(DM.RFSTDTC)) +
      ifelse(CMSTDTC >= RFSTDTC, 1L, 0L). NA when CMSTDTC or RFSTDTC NA.

  CMENDY:
    label: Study Day of End of Medication
    type: Num
    length: 8
    role: Timing
    core: Perm
    origin: Derived
    derivation: |
      as.integer(as.Date(CMENDTC) - as.Date(DM.RFSTDTC)) +
      ifelse(CMENDTC >= RFSTDTC, 1L, 0L). NA when CMENDTC or RFSTDTC NA.

  CMSTRTPT:
    label: Start Relative to Reference Time Point
    type: Char
    length: 10
    role: Timing
    core: Perm
    origin: Derived
    codelist: STENRF
    derivation: |
      "UNKNOWN" when CMSTDTC is NA (justifies SD0022 missing start date);
      else NA.

  CMSTTPT:
    label: Start Reference Time Point
    type: Char
    length: 40
    role: Timing
    core: Perm
    origin: Derived
    derivation: |
      "DATE OF FIRST ASSESSMENT" when CMSTDTC is NA (paired with CMSTRTPT).

  CMENRTPT:
    label: End Relative to Reference Time Point
    type: Char
    length: 10
    role: Timing
    core: Perm
    origin: Derived
    codelist: STENRF
    derivation: |
      "ONGOING" when raw ONGOING = "Yes";
      "UNKNOWN" when CMENDTC is NA but ONGOING is not "Yes" (justifies
      SD0021 missing end date); else NA.

  CMENTPT:
    label: End Reference Time Point
    type: Char
    length: 40
    role: Timing
    core: Perm
    origin: Derived
    derivation: |
      "DATE OF LAST ASSESSMENT" whenever CMENDTC is NA (paired with
      CMENRTPT).

  VISITNUM:
    label: Visit Number
    type: Num
    length: 8
    role: Timing
    core: Perm
    origin: CRF
    derivation: derive_visitnum(studyeventoid) — OpenClinica event → integer.

  VISIT:
    label: Visit Name
    type: Char
    length: 40
    role: Timing
    core: Perm
    origin: CRF
    derivation: eventname (OpenClinica event name).
