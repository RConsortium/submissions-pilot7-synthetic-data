# Index of SDTM domain specs for the CAR-T pilot study.
# Anchored to SDTMIG v3.3 / SDTM v1.7 (see ../ig/knowledge_sdtm_ig.md).
#
# Each entry lists the target SDTM domain, its general observation class, and
# the CRF forms in data/raw/ that feed it.

study:
  id: CART-T-PILOT
  source: car-t-openclinica.xml (OpenClinica ODM)
  sdtm_ig_version: "3.3"
  sdtm_model_version: "1.7"

domains:
  - code: DM
    label: Demographics
    class: Special-Purpose
    spec: dm.yaml
    sources:
      - "1. Demographics and History"
      - "Eligibility"          # consent date, age at consent
      - "3. Randomize"         # treatment arm
      - "Disposition"          # consent flags, dates

  - code: MH
    label: Medical History
    class: Events
    spec: mh.yaml
    sources:
      - "1. Demographics and History"   # diagnosis groups group1, group2

  - code: IE
    label: Inclusion/Exclusion Exceptions
    class: Findings
    spec: ie.yaml
    sources:
      - "Eligibility"          # INC1, INC2, INCA, EXCT, SUMMARY

  - code: LB
    label: Laboratory Test Results
    class: Findings
    spec: lb.yaml
    sources:
      - "2. Baseline Labs and Imaging"  # CHEMPANEL, NEPH baseline
      - "Lab Results"                   # post-baseline labs

  - code: QS
    label: Questionnaires
    class: Findings
    spec: qs.yaml
    sources:
      - "RAND SF-12 Survey"

  - code: AE
    label: Adverse Events
    class: Events
    spec: ae.yaml
    sources:
      - "Adverse Event"

  - code: CM
    label: Concomitant Medications
    class: Interventions
    spec: cm.yaml
    sources:
      - "ConMed"
      - "RxNorm Coding"        # RXCUI / RXAUI enrichment

  - code: CE
    label: Clinical Events
    class: Events
    spec: ce.yaml
    notes: Used here for protocol-defined Suspected MI event capture.
    sources:
      - "Suspected MI"

  - code: DS
    label: Disposition
    class: Events
    spec: ds.yaml
    sources:
      - "Disposition"
      - "Eligibility"          # screen completion
      - "3. Randomize"         # randomization event

forms_excluded:
  # Operational / demo / read-only forms that do not feed SDTM.
  - "Kitchen Sink"                       # CRF-builder demo page
  - "Source Document"                    # operational uploads
  - "In-clinic Photo"                    # operational photo uploads
  - "4. View Randomization Assignment"   # read-only view, no new data
  - "RxNorm Coding"                      # coding workflow, joined into CM
  - "Evaluator A"                        # adjudication — out of scope for SDTMIG v3.3
  - "Committee Review"                   # adjudication — out of scope for SDTMIG v3.3
