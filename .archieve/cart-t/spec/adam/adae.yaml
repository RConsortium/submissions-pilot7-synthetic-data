dataset: ADAE
label: Adverse Events Analysis Dataset
structure: OCCDS - One record per adverse event per subject
purpose: Analysis
keys: [STUDYID, USUBJID, AESEQ]
ig_reference: "ADaM OCCDS IG v1.1; ADaMIG v1.3"

sources:
  - sdtm_domain: AE
    notes: All SDTM AE variables carry over (AETERM, AEDECOD, AEBODSYS, AESEV, AESER, AEREL, AEOUT, AESTDTC, AEENDTC, AESEQ, AESPID).
  - dataset: ADSL
    notes: |
      Treatment-period dates, treatment, population flags, demographics,
      and the CART-T phenotype stratum (STRAT1/STRAT1L) merged onto each
      AE record via left_join() on USUBJID.

variables:
  STUDYID:
    label: Study Identifier
    type: Char
    length: 12
    role: Identifier
    core: Req
    origin: Predecessor
    derivation: AE.STUDYID.

  USUBJID:
    label: Unique Subject Identifier
    type: Char
    length: 30
    role: Identifier
    core: Req
    origin: Predecessor
    derivation: AE.USUBJID.

  SUBJID:
    label: Subject Identifier for the Study
    type: Char
    length: 10
    role: Identifier
    core: Req
    origin: Predecessor
    derivation: ADSL.SUBJID via left_join() on USUBJID.

  SITEID:
    label: Study Site Identifier
    type: Char
    length: 8
    role: Identifier
    core: Req
    origin: Predecessor
    derivation: ADSL.SITEID via left_join().

  AGE:
    label: Age
    type: Num
    length: 8
    role: Covariate
    core: Req
    origin: Predecessor
    derivation: ADSL.AGE via left_join().

  AGEGR1:
    label: Pooled Age Group 1
    type: Char
    length: 10
    role: Covariate
    core: Perm
    origin: Predecessor
    derivation: ADSL.AGEGR1 via left_join().

  SEX:
    label: Sex
    type: Char
    length: 1
    role: Covariate
    core: Req
    origin: Predecessor
    derivation: ADSL.SEX via left_join().

  RACE:
    label: Race
    type: Char
    length: 40
    role: Covariate
    core: Req
    origin: Predecessor
    derivation: ADSL.RACE via left_join(). Extensible CDISC RACE codelist (C74457); value "MULTIPLE" is the SDTMIG-prescribed extension used by DM when PTRACE is multi-select.

  STRAT1:
    label: Phenotype Stratification Code
    type: Char
    length: 4
    role: Covariate
    core: Perm
    origin: Predecessor
    derivation: ADSL.STRAT1 via left_join(). Phenotype stratum (NHM / NHF / HM / HF) per CART-T pilot study design.

  STRAT1L:
    label: Phenotype Stratification Label
    type: Char
    length: 40
    role: Covariate
    core: Perm
    origin: Predecessor
    derivation: ADSL.STRAT1L via left_join().

  TRT01P:
    label: Planned Treatment for Period 01
    type: Char
    length: 40
    role: Treatment
    core: Req
    origin: Predecessor
    derivation: ADSL.TRT01P via left_join().

  TRT01PN:
    label: Planned Treatment for Period 01 (N)
    type: Num
    length: 8
    role: Treatment
    core: Req
    origin: Predecessor
    derivation: ADSL.TRT01PN via left_join().

  TRT01A:
    label: Actual Treatment for Period 01
    type: Char
    length: 40
    role: Treatment
    core: Req
    origin: Predecessor
    derivation: ADSL.TRT01A via left_join().

  TRT01AN:
    label: Actual Treatment for Period 01 (N)
    type: Num
    length: 8
    role: Treatment
    core: Req
    origin: Predecessor
    derivation: ADSL.TRT01AN via left_join().

  TRTP:
    label: Planned Treatment
    type: Char
    length: 40
    role: Treatment
    core: Req
    origin: Derived
    derivation: TRTP = TRT01P. Single-period study; planned per-record treatment equals ADSL.TRT01P.

  TRTPN:
    label: Planned Treatment (N)
    type: Num
    length: 8
    role: Treatment
    core: Req
    origin: Derived
    derivation: TRTPN = TRT01PN.

  TRTA:
    label: Actual Treatment
    type: Char
    length: 40
    role: Treatment
    core: Req
    origin: Derived
    derivation: TRTA = TRT01A. Single-period study; actual per-record treatment equals ADSL.TRT01A.

  TRTAN:
    label: Actual Treatment (N)
    type: Num
    length: 8
    role: Treatment
    core: Req
    origin: Derived
    derivation: TRTAN = TRT01AN.

  TRTSDT:
    label: Date of First Exposure to Treatment
    type: Num
    length: 8
    role: Timing
    core: Req
    origin: Predecessor
    derivation: ADSL.TRTSDT via left_join(). Reference date for ASTDY/AENDY and TRTEMFL.

  TRTEDT:
    label: Date of Last Exposure to Treatment
    type: Num
    length: 8
    role: Timing
    core: Req
    origin: Predecessor
    derivation: ADSL.TRTEDT via left_join(). Bound for the 30-day treatment-emergent window.

  TRTEMFL:
    label: Treatment Emergent Analysis Flag
    type: Char
    length: 1
    role: Analysis Flag
    core: Exp
    origin: Derived
    codelist: NY
    derivation: |
      "Y" when ASTDT >= TRTSDT AND (TRTEDT is null OR ASTDT <= TRTEDT + 30 days);
      else null. Implemented in dplyr::case_when().

  AESEQ:
    label: Sequence Number
    type: Num
    length: 8
    role: Identifier
    core: Req
    origin: Predecessor
    derivation: AE.AESEQ.

  AESPID:
    label: Sponsor-Defined Identifier
    type: Char
    length: 40
    role: Identifier
    core: Perm
    origin: Predecessor
    derivation: AE.AESPID.

  AETERM:
    label: Reported Term for the Adverse Event
    type: Char
    length: 200
    role: Topic
    core: Req
    origin: Predecessor
    derivation: AE.AETERM.

  AEDECOD:
    label: Dictionary-Derived Term
    type: Char
    length: 200
    role: Synonym Qualifier
    core: Exp
    origin: Predecessor
    derivation: AE.AEDECOD. Note - this CART-T pilot has no MedDRA coding workflow; AEDECOD in SDTM is an uppercased AETERM stand-in.

  AEBODSYS:
    label: Body System or Organ Class
    type: Char
    length: 200
    role: Record Qualifier
    core: Exp
    origin: Predecessor
    derivation: AE.AEBODSYS. Always null in this pilot - no MedDRA coding workflow.

  AESEV:
    label: Severity/Intensity
    type: Char
    length: 10
    role: Record Qualifier
    core: Exp
    origin: Predecessor
    derivation: AE.AESEV.

  AESEVN:
    label: Severity/Intensity (N)
    type: Num
    length: 8
    role: Record Qualifier
    core: Perm
    origin: Derived
    derivation: dplyr::recode(AESEV, MILD=1, MODERATE=2, SEVERE=3).

  ASEV:
    label: Analysis Severity/Intensity
    type: Char
    length: 10
    role: Record Qualifier
    core: Req
    origin: Derived
    derivation: ASEV = AESEV (verbatim copy for analysis use).

  AESER:
    label: Serious Event
    type: Char
    length: 1
    role: Record Qualifier
    core: Exp
    origin: Predecessor
    derivation: AE.AESER.

  AEREL:
    label: Causality
    type: Char
    length: 30
    role: Record Qualifier
    core: Exp
    origin: Predecessor
    derivation: AE.AEREL.

  AREL:
    label: Analysis Causality
    type: Char
    length: 30
    role: Record Qualifier
    core: Req
    origin: Derived
    derivation: AREL = AEREL (verbatim copy for analysis use).

  AEOUT:
    label: Outcome of Adverse Event
    type: Char
    length: 40
    role: Record Qualifier
    core: Exp
    origin: Predecessor
    derivation: AE.AEOUT.

  AESTDTC:
    label: Start Date/Time of Adverse Event
    type: Char
    length: 19
    role: Timing
    core: Exp
    origin: Predecessor
    derivation: AE.AESTDTC (ISO 8601 character).

  AEENDTC:
    label: End Date/Time of Adverse Event
    type: Char
    length: 19
    role: Timing
    core: Exp
    origin: Predecessor
    derivation: AE.AEENDTC (ISO 8601 character).

  ASTDT:
    label: Analysis Start Date
    type: Num
    length: 8
    role: Timing
    core: Exp
    origin: Derived
    derivation: as.Date(AE.AESTDTC) via admiral::derive_vars_dt(new_vars_prefix="AST", dtc=AESTDTC).

  AENDT:
    label: Analysis End Date
    type: Num
    length: 8
    role: Timing
    core: Exp
    origin: Derived
    derivation: as.Date(AE.AEENDTC) via admiral::derive_vars_dt(new_vars_prefix="AEN", dtc=AEENDTC).

  ASTDY:
    label: Analysis Start Relative Day
    type: Num
    length: 8
    role: Timing
    core: Perm
    origin: Derived
    derivation: as.integer(ASTDT - ADSL.TRTSDT) + ifelse(ASTDT >= ADSL.TRTSDT, 1L, 0L). Skip day 0. Via admiral::derive_vars_dy().

  AENDY:
    label: Analysis End Relative Day
    type: Num
    length: 8
    role: Timing
    core: Perm
    origin: Derived
    derivation: as.integer(AENDT - ADSL.TRTSDT) + ifelse(AENDT >= ADSL.TRTSDT, 1L, 0L). Skip day 0. Via admiral::derive_vars_dy().

  ADURN:
    label: AE Duration (N)
    type: Num
    length: 8
    role: Analysis
    core: Perm
    origin: Derived
    derivation: as.integer(AENDT - ASTDT) + 1L when both populated; else null.

  ADURU:
    label: AE Duration Units
    type: Char
    length: 10
    role: Analysis
    core: Perm
    origin: Assigned
    derivation: Constant "DAYS" when ADURN populated; else null.

  AOCCFL:
    label: First Occurrence within Subject Flag
    type: Char
    length: 1
    role: Analysis Flag
    core: Exp
    origin: Derived
    codelist: NY
    derivation: |
      "Y" on the row with the earliest ASTDT per USUBJID; via admiral::derive_var_extreme_flag().

  AOCCPFL:
    label: First Occurrence of Preferred Term within Subject Flag
    type: Char
    length: 1
    role: Analysis Flag
    core: Perm
    origin: Derived
    codelist: NY
    derivation: |
      "Y" on the row with the earliest ASTDT per USUBJID + AEDECOD.

  AOCCSFL:
    label: First Occurrence within Subject by System Organ Class Flag
    type: Char
    length: 1
    role: Analysis Flag
    core: Perm
    origin: Derived
    codelist: NY
    derivation: |
      "Y" on the row with the earliest ASTDT per USUBJID + AEBODSYS.

  RANDFL:
    label: Randomized Population Flag
    type: Char
    length: 1
    role: Population Flag
    core: Req
    origin: Predecessor
    derivation: ADSL.RANDFL via left_join().

  ITTFL:
    label: Intent-to-Treat Population Flag
    type: Char
    length: 1
    role: Population Flag
    core: Req
    origin: Predecessor
    derivation: ADSL.ITTFL via left_join().

  SAFFL:
    label: Safety Population Flag
    type: Char
    length: 1
    role: Population Flag
    core: Req
    origin: Predecessor
    derivation: ADSL.SAFFL via left_join().

  ANL01FL:
    label: Analysis Record Flag 01
    type: Char
    length: 1
    role: Analysis Flag
    core: Exp
    origin: Derived
    codelist: NY
    derivation: |
      "Y" when SAFFL = 'Y' AND TRTEMFL = 'Y'; else null.
