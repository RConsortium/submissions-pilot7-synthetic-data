yamaa: '1.0'
type: spec
model: SDTM
domain: EG
keys:
- STUDYID
- USUBJID
- EGSEQ
input:
  DM:
    path: ../../../../data/sdtm/dm-yamaa.parquet
    relative_to: declaring
    schema: dm.yaml
    empty_string: missing
    key:
    - STUDYID
    - USUBJID
  EGRAW:
    path: ../../../../data/odm/extracted/eg.csv
    relative_to: declaring
    types:
      SRCSEQ: int
      VISITNUM: int
    empty_string: missing
output:
  path: ../../../../data/sdtm/eg-yamaa.parquet
  relative_to: declaring
  columns:
  - DOMAIN
  - STUDYID
  - USUBJID
  - EGSPID
  - EGREFID
  - EGTESTCD
  - EGTEST
  - EGCAT
  - EGORRES
  - EGORRESU
  - EGSTRESC
  - EGSTRESN
  - EGSTRESU
  - EGDTC
  - VISIT
  - VISITNUM
  - EGDY
  - EGSEQ
  report: ../../../../data/sdtm/eg-report.parquet
  order_by:
  - variable: STUDYID
    direction: asc
  - variable: USUBJID
    direction: asc
  - variable: EGSEQ
    direction: asc
columns:
- name: DOMAIN
  type: str
  label: DOMAIN
  derivation: '''EG'''
  submission:
    core: Req
    mandatory: true
    role: Identifier
    length: 2
    origins:
    - type: Assigned
      source: Sponsor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: ''''''EG'''''''
- name: STUDYID
  type: str
  label: STUDYID
  derivation: null
  submission:
    core: Req
    mandatory: true
    role: Identifier
    length: 12
    origins:
    - type: Collected
      source: Vendor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: null

        ...'
- name: USUBJID
  type: str
  label: USUBJID
  derivation: null
  submission:
    core: Req
    mandatory: true
    role: Identifier
    length: 40
    origins:
    - type: Collected
      source: Vendor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: null

        ...'
- name: EGSPID
  type: str
  label: Source Group and Record Identifier
  derivation: null
  submission:
    core: Perm
    mandatory: false
    role: Record Qualifier
    length: 100
    origins:
    - type: Collected
      source: Vendor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: null

        ...'
- name: EGREFID
  type: str
  label: Source Item OID
  derivation: null
  submission:
    core: Perm
    mandatory: false
    role: Record Qualifier
    length: 100
    origins:
    - type: Assigned
      source: Sponsor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: null

        ...'
- name: EGTESTCD
  type: str
  label: Test Short Name
  derivation: null
  submission:
    core: Perm
    mandatory: false
    role: Topic
    length: 100
    origins:
    - type: Assigned
      source: Sponsor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: null

        ...'
- name: EGTEST
  type: str
  label: Test Name
  derivation: null
  submission:
    core: Perm
    mandatory: false
    role: Record Qualifier
    length: 100
    origins:
    - type: Assigned
      source: Sponsor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: null

        ...'
- name: EGCAT
  type: str
  label: Category
  derivation: null
  submission:
    core: Perm
    mandatory: false
    role: Record Qualifier
    length: 100
    origins:
    - type: Assigned
      source: Sponsor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: null

        ...'
- name: EGORRES
  type: str
  label: Result in Original Units
  derivation: null
  submission:
    core: Perm
    mandatory: false
    role: Record Qualifier
    length: 100
    origins:
    - type: Collected
      source: Vendor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: null

        ...'
- name: EGORRESU
  type: str
  label: Original Units
  derivation: null
  submission:
    core: Perm
    mandatory: false
    role: Record Qualifier
    length: 100
    origins:
    - type: Other
      source: Sponsor
      description: Not collected or not established from these synthetic sources.
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: null

        ...'
- name: EGSTRESC
  type: str
  label: Character Result in Std Format
  derivation: EGORRES
  submission:
    core: Perm
    mandatory: false
    role: Record Qualifier
    length: 100
    origins:
    - type: Derived
      source: Sponsor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: EGORRES

        ...'
- name: EGSTRESN
  type: float
  label: Numeric Result in Std Format
  derivation:
    value: EGORRES
    unconvertible: null
  submission:
    core: Perm
    mandatory: false
    role: Record Qualifier
    length: 8
    significant_digits: 8
    origins:
    - type: Derived
      source: Sponsor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: unconvertible:
        null

        value: EGORRES'
- name: EGSTRESU
  type: str
  label: Standard Units
  derivation: EGORRESU
  submission:
    core: Perm
    mandatory: false
    role: Record Qualifier
    length: 100
    origins:
    - type: Derived
      source: Sponsor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: EGORRESU

        ...'
- name: EGDTC
  type: str
  label: Date/Time of Collection
  derivation: null
  submission:
    core: Perm
    mandatory: false
    role: Timing
    length: 10
    origins:
    - type: Collected
      source: Vendor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: null

        ...'
- name: VISIT
  type: str
  label: Visit Name
  derivation: null
  submission:
    core: Perm
    mandatory: false
    role: Timing
    length: 100
    origins:
    - type: Collected
      source: Vendor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: null

        ...'
- name: VISITNUM
  type: int
  label: Source Visit Order
  derivation: null
  submission:
    core: Perm
    mandatory: false
    role: Timing
    length: 8
    origins:
    - type: Collected
      source: Vendor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: null

        ...'
- name: _RDATE
  type: date
  label: Internal Collection Date
  derivation:
    to_date:
      source: EGDTC
- name: _REFDT
  type: date
  label: Internal Reference Date
  derivation:
    to_date:
      source: DM.RFSTDTC
- name: EGDY
  type: int
  label: Study Day
  derivation:
    study_day:
      source: _RDATE
      reference: _REFDT
  submission:
    core: Perm
    mandatory: false
    role: Timing
    length: 8
    origins:
    - type: Derived
      source: Sponsor
    method:
      type: Computation
      description: "Executable derivation in the retained yamaa specification: study_day:\n\
        \  reference: _REFDT\n  source: _RDATE"
- name: EGSEQ
  type: int
  label: Sequence Number
  derivation:
    row_number:
      window:
        group_by:
        - STUDYID
        - USUBJID
        order_by:
        - variable: VISITNUM
          direction: asc
        - variable: EGSPID
          direction: asc
        - variable: EGREFID
          direction: asc
        - variable: EGTESTCD
          direction: asc
  submission:
    core: Req
    mandatory: true
    role: Identifier
    length: 8
    origins:
    - type: Derived
      source: Sponsor
    method:
      type: Computation
      description: "Executable derivation in the retained yamaa specification: row_number:\n\
        \  window:\n    group_by:\n    - STUDYID\n    - USUBJID\n    order_by:\n \
        \   - VISITNUM\n    - EGSPID\n    - EGREFID\n    - EGTESTCD"
rows:
- id: eg_qtcf
  dataset: EGRAW
  filter: EGRAW.QTCF IS NOT NULL
  derivations:
    STUDYID: EGRAW.STUDYID
    USUBJID: EGRAW.USUBJID
    EGSPID: EGRAW.SRCSEQ
    EGREFID: '''IT.NCT03142334.EG.QTCF'''
    EGTESTCD: '''QTCF'''
    EGTEST: '''QTCF'''
    EGCAT: '''ECG'''
    EGORRES: EGRAW.QTCF
    EGORRESU: null
    EGDTC: EGRAW.EGDTC
    VISIT: EGRAW.VISIT
    VISITNUM: EGRAW.VISITNUM
- id: eg_egintp
  dataset: EGRAW
  filter: EGRAW.EGINTP IS NOT NULL
  derivations:
    STUDYID: EGRAW.STUDYID
    USUBJID: EGRAW.USUBJID
    EGSPID: EGRAW.SRCSEQ
    EGREFID: '''IT.NCT03142334.EG.EGINTP'''
    EGTESTCD: '''INTP'''
    EGTEST: '''EGINTP'''
    EGCAT: '''ECG'''
    EGORRES: EGRAW.EGINTP
    EGORRESU: null
    EGDTC: EGRAW.EGDTC
    VISIT: EGRAW.VISIT
    VISITNUM: EGRAW.VISITNUM
submission:
  has_no_data: false
  label: ECG Test Results
  class: FINDINGS
  structure: One record per subject and declared keys
  repeating: true
  reference_data: false
  non_standard: false
  comment: Collected values retained. Units remain missing unless explicitly supplied
    by source metadata. See spec/review/findings.json for coding, baseline, and analysis
    restrictions.
