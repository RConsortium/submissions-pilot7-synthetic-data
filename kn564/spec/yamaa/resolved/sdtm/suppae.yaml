yamaa: '1.0'
type: spec
model: SDTM
domain: SUPPAE
keys:
- STUDYID
- USUBJID
- IDVARVAL
- QNAM
input:
  RAW:
    path: ../../../../data/odm/extracted/ae.csv
    relative_to: declaring
    types:
      SRCSEQ: int
      VISITNUM: int
    empty_string: missing
output:
  path: ../../../../data/sdtm/suppae-yamaa.parquet
  relative_to: declaring
  columns:
  - STUDYID
  - USUBJID
  - RDOMAIN
  - IDVAR
  - IDVARVAL
  - QNAM
  - QLABEL
  - QVAL
  - QORIG
  - QEVAL
  report: ../../../../data/sdtm/suppae-report.parquet
  order_by:
  - variable: STUDYID
    direction: asc
  - variable: USUBJID
    direction: asc
  - variable: IDVARVAL
    direction: asc
  - variable: QNAM
    direction: asc
columns:
- name: STUDYID
  type: str
  label: Study Identifier
  derivation: RAW.STUDYID
  submission:
    core: Req
    mandatory: true
    role: Identifier
    length: 12
    origins:
    - type: Collected
      source: Vendor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: RAW.STUDYID

        ...'
- name: USUBJID
