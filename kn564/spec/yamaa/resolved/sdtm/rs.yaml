yamaa: '1.0'
type: spec
model: SDTM
domain: RS
keys:
- STUDYID
- USUBJID
- RSSEQ
input:
  DM:
    path: ../../../../data/sdtm/dm-yamaa.parquet
    relative_to: declaring
    schema: dm.yaml
    empty_string: missing
    key:
    - STUDYID
    - USUBJID
  RSRAW:
    path: ../../../../data/odm/extracted/rs.csv
    relative_to: declaring
    types:
      SRCSEQ: int
      VISITNUM: int
    empty_string: missing
output:
  path: ../../../../data/sdtm/rs-yamaa.parquet
  relative_to: declaring
  columns:
  - DOMAIN
  - STUDYID
  - USUBJID
  - RSSPID
  - RSREFID
  - RSTESTCD
  - RSTEST
  - RSCAT
  - RSORRES
  - RSORRESU
  - RSSTRESC
  - RSSTRESN
  - RSSTRESU
  - RSDTC
  - VISIT
  - VISITNUM
  - RSDY
  - RSSEQ
  - RSMETHOD
  - RSEVAL
  report: ../../../../data/sdtm/rs-report.parquet
  order_by:
  - variable: STUDYID
    direction: asc
  - variable: USUBJID
    direction: asc
  - variable: RSSEQ
    direction: asc
columns:
- name: DOMAIN
  type: str
  label: DOMAIN
  derivation: '''RS'''
  submission:
    core: Req
    mandatory: true
    role: Identifier
    length: 2
    origins:
