    origins:
    - type: Collected
      source: Vendor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: null

        ...'
- name: _RDATE
  type: date
  label: Internal Collection Date
  derivation:
    to_date:
      source: RSDTC
- name: _REFDT
  type: date
  label: Internal Reference Date
  derivation:
    to_date:
      source: DM.RFSTDTC
- name: RSDY
  type: int
  label: Study Day
  derivation:
    study_day:
      source: _RDATE
      reference: _REFDT
  submission:
    core: Perm
    mandatory: false
    role: Timing
    length: 8
    origins:
    - type: Derived
      source: Sponsor
    method:
      type: Computation
      description: "Executable derivation in the retained yamaa specification: study_day:\n\
        \  reference: _REFDT\n  source: _RDATE"
- name: RSSEQ
  type: int
  label: Sequence Number
  derivation:
    row_number:
      window:
        group_by:
        - STUDYID
        - USUBJID
        order_by:
        - variable: VISITNUM
          direction: asc
        - variable: RSSPID
          direction: asc
        - variable: RSREFID
          direction: asc
        - variable: RSTESTCD
          direction: asc
  submission:
    core: Req
    mandatory: true
    role: Identifier
    length: 8
    origins:
    - type: Derived
      source: Sponsor
    method:
      type: Computation
      description: "Executable derivation in the retained yamaa specification: row_number:\n\
        \  window:\n    group_by:\n    - STUDYID\n    - USUBJID\n    order_by:\n \
        \   - VISITNUM\n    - RSSPID\n    - RSREFID\n    - RSTESTCD"
- name: RSMETHOD
  type: str
  label: Source Assessment Method
