      source: Sponsor
      description: Not collected or not established from these synthetic sources.
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: null

        ...'
rows:
- id: rs_rsorres
  dataset: RSRAW
  filter: RSRAW.RSORRES IS NOT NULL
  derivations:
    STUDYID: RSRAW.STUDYID
    USUBJID: RSRAW.USUBJID
    RSSPID: RSRAW.SRCSEQ
    RSREFID: '''IT.NCT03142334.RS.RSORRES'''
    RSTESTCD: '''RECUR'''
    RSTEST: '''Disease Recurrence Assessment'''
    RSCAT: '''DISEASE RECURRENCE'''
    RSORRES: RSRAW.RSORRES
    RSORRESU: null
    RSDTC: RSRAW.RSDTC
    VISIT: RSRAW.VISIT
    VISITNUM: RSRAW.VISITNUM
- id: rs_recursite
  dataset: RSRAW
  filter: RSRAW.RECURSITE IS NOT NULL
  derivations:
    STUDYID: RSRAW.STUDYID
    USUBJID: RSRAW.USUBJID
    RSSPID: RSRAW.SRCSEQ
    RSREFID: '''IT.NCT03142334.RS.RECURSITE'''
    RSTESTCD: '''RECSITE'''
    RSTEST: '''Recurrence Site'''
    RSCAT: '''DISEASE RECURRENCE'''
    RSORRES: RSRAW.RECURSITE
    RSORRESU: null
    RSDTC: RSRAW.RSDTC
    VISIT: RSRAW.VISIT
    VISITNUM: RSRAW.VISITNUM
submission:
  has_no_data: false
  label: Disease Response Assessments
  class: FINDINGS
  structure: One record per subject and declared keys
  repeating: true
  reference_data: false
  non_standard: false
  comment: Collected values retained. Units remain missing unless explicitly supplied
    by source metadata. See spec/review/findings.json for coding, baseline, and analysis
    restrictions.
