yamaa: '1.0'
type: spec
model: SDTM
domain: SC
keys:
- STUDYID
- USUBJID
- SCSEQ
input:
  DM:
    path: ../../../../data/sdtm/dm-yamaa.parquet
    relative_to: declaring
    schema: dm.yaml
    empty_string: missing
    key:
    - STUDYID
    - USUBJID
  MHRAW:
    path: ../../../../data/odm/extracted/mh.csv
    relative_to: declaring
    types:
      SRCSEQ: int
      VISITNUM: int
    empty_string: missing
  BMRAW:
    path: ../../../../data/odm/extracted/bm.csv
    relative_to: declaring
    types:
      SRCSEQ: int
      VISITNUM: int
    empty_string: missing
  IERAW:
    path: ../../../../data/odm/extracted/ie.csv
    relative_to: declaring
    types:
      SRCSEQ: int
      VISITNUM: int
    empty_string: missing
  PSRAW:
    path: ../../../../data/odm/extracted/ps.csv
    relative_to: declaring
    types:
      SRCSEQ: int
      VISITNUM: int
    empty_string: missing
output:
  path: ../../../../data/sdtm/sc-yamaa.parquet
  relative_to: declaring
  columns:
  - DOMAIN
  - STUDYID
  - USUBJID
  - SCSPID
  - SCREFID
  - SCTESTCD
  - SCTEST
  - SCCAT
  - SCORRES
  - SCORRESU
  - SCSTRESC
  - SCSTRESN
  - SCSTRESU
  - SCDTC
  - VISIT
  - VISITNUM
  - SCDY
  - SCSEQ
  report: ../../../../data/sdtm/sc-report.parquet
  order_by:
  - variable: STUDYID
    direction: asc
  - variable: USUBJID
    direction: asc
  - variable: SCSEQ
    direction: asc
columns:
- name: DOMAIN
  type: str
  label: DOMAIN
  derivation: '''SC'''
  submission:
    core: Req
    mandatory: true
    role: Identifier
    length: 2
    origins:
    - type: Assigned
      source: Sponsor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: ''''''SC'''''''
- name: STUDYID
  type: str
  label: STUDYID
  derivation: null
  submission:
    core: Req
    mandatory: true
    role: Identifier
    length: 12
    origins:
    - type: Collected
      source: Vendor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: null

        ...'
- name: USUBJID
  type: str
  label: USUBJID
  derivation: null
  submission:
    core: Req
    mandatory: true
    role: Identifier
    length: 40
    origins:
    - type: Collected
      source: Vendor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: null

        ...'
- name: SCSPID
  type: str
  label: Source Group and Record Identifier
  derivation: null
  submission:
    core: Perm
    mandatory: false
    role: Record Qualifier
    length: 100
    origins:
    - type: Collected
      source: Vendor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: null

        ...'
- name: SCREFID
  type: str
  label: Source Item OID
  derivation: null
  submission:
    core: Perm
    mandatory: false
    role: Record Qualifier
    length: 100
    origins:
    - type: Assigned
      source: Sponsor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: null

        ...'
- name: SCTESTCD
  type: str
  label: Test Short Name
  derivation: null
  submission:
    core: Perm
    mandatory: false
    role: Topic
    length: 100
    origins:
    - type: Assigned
      source: Sponsor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: null

        ...'
- name: SCTEST
  type: str
  label: Test Name
  derivation: null
  submission:
    core: Perm
    mandatory: false
    role: Record Qualifier
    length: 100
    origins:
    - type: Assigned
      source: Sponsor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: null

        ...'
- name: SCCAT
  type: str
  label: Category
  derivation: null
  submission:
    core: Perm
    mandatory: false
    role: Record Qualifier
    length: 100
    origins:
    - type: Assigned
      source: Sponsor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: null

        ...'
- name: SCORRES
  type: str
  label: Result in Original Units
  derivation: null
  submission:
    core: Perm
    mandatory: false
    role: Record Qualifier
    length: 100
    origins:
    - type: Collected
      source: Vendor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: null

        ...'
- name: SCORRESU
  type: str
  label: Original Units
  derivation: null
  submission:
    core: Perm
    mandatory: false
    role: Record Qualifier
    length: 100
    origins:
    - type: Other
      source: Sponsor
      description: Not collected or not established from these synthetic sources.
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: null

        ...'
- name: SCSTRESC
  type: str
  label: Character Result in Std Format
  derivation: SCORRES
  submission:
    core: Perm
    mandatory: false
    role: Record Qualifier
    length: 100
    origins:
    - type: Derived
      source: Sponsor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: SCORRES

        ...'
- name: SCSTRESN
  type: float
  label: Numeric Result in Std Format
  derivation:
    value: SCORRES
    unconvertible: null
  submission:
    core: Perm
    mandatory: false
    role: Record Qualifier
    length: 8
    significant_digits: 8
    origins:
    - type: Derived
      source: Sponsor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: unconvertible:
        null

        value: SCORRES'
- name: SCSTRESU
  type: str
  label: Standard Units
  derivation: SCORRESU
  submission:
    core: Perm
    mandatory: false
    role: Record Qualifier
    length: 100
    origins:
    - type: Derived
      source: Sponsor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: SCORRESU

        ...'
- name: SCDTC
  type: str
  label: Date/Time of Collection
  derivation: null
  submission:
    core: Perm
    mandatory: false
    role: Timing
    length: 10
    origins:
    - type: Collected
      source: Vendor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: null

        ...'
- name: VISIT
  type: str
  label: Visit Name
  derivation: null
  submission:
    core: Perm
    mandatory: false
    role: Timing
    length: 100
    origins:
    - type: Collected
      source: Vendor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: null

        ...'
- name: VISITNUM
  type: int
  label: Source Visit Order
  derivation: null
  submission:
    core: Perm
    mandatory: false
    role: Timing
    length: 8
    origins:
    - type: Collected
      source: Vendor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: null

        ...'
- name: _RDATE
  type: date
  label: Internal Collection Date
  derivation:
    to_date:
      source: SCDTC
- name: _REFDT
  type: date
  label: Internal Reference Date
  derivation:
    to_date:
      source: DM.RFSTDTC
- name: SCDY
  type: int
  label: Study Day
  derivation:
    study_day:
      source: _RDATE
      reference: _REFDT
  submission:
    core: Perm
    mandatory: false
    role: Timing
    length: 8
    origins:
    - type: Derived
      source: Sponsor
    method:
      type: Computation
      description: "Executable derivation in the retained yamaa specification: study_day:\n\
        \  reference: _REFDT\n  source: _RDATE"
- name: SCSEQ
  type: int
  label: Sequence Number
  derivation:
    row_number:
      window:
        group_by:
        - STUDYID
        - USUBJID
        order_by:
        - variable: VISITNUM
          direction: asc
        - variable: SCSPID
          direction: asc
        - variable: SCREFID
          direction: asc
        - variable: SCTESTCD
          direction: asc
  submission:
    core: Req
    mandatory: true
    role: Identifier
    length: 8
    origins:
    - type: Derived
      source: Sponsor
    method:
      type: Computation
      description: "Executable derivation in the retained yamaa specification: row_number:\n\
        \  window:\n    group_by:\n    - STUDYID\n    - USUBJID\n    order_by:\n \
        \   - VISITNUM\n    - SCSPID\n    - SCREFID\n    - SCTESTCD"
rows:
