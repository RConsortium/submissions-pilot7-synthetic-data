  submission:
    core: Perm
    mandatory: false
    length: 8
    origins:
    - type: Derived
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: RS.VISITNUM

        ...'
- name: TRTSDT
  type: date
  label: First Treatment Date
  derivation: ADSL.TRTSDT
  submission:
    core: Perm
    mandatory: false
    origins:
    - type: Derived
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: ADSL.TRTSDT

        ...'
- name: TRT01P
  type: str
  label: Planned Treatment
  derivation: ADSL.TRT01P
  submission:
    core: Perm
    mandatory: false
    length: 80
    origins:
    - type: Derived
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: ADSL.TRT01P

        ...'
- name: TRT01A
  type: str
  label: Actual Treatment
  derivation: ADSL.TRT01A
  submission:
    core: Perm
    mandatory: false
    length: 80
    origins:
    - type: Derived
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: ADSL.TRT01A

