yamaa: '1.0'
type: spec
model: ADaM
domain: ADRS
keys:
- STUDYID
- USUBJID
- ASEQ
input:
  RS:
    path: ../../../../data/sdtm/rs-yamaa.parquet
    relative_to: declaring
    schema: ../sdtm/rs.yaml
    empty_string: missing
  ADSL:
    path: ../../../../data/adam/adsl-yamaa.parquet
    relative_to: declaring
    schema: adsl.yaml
    empty_string: missing
    key:
    - STUDYID
    - USUBJID
base: RS
output:
  path: ../../../../data/adam/adrs-yamaa.parquet
  relative_to: declaring
  columns:
  - STUDYID
  - USUBJID
  - PARAMCD
  - PARAM
  - PARCAT1
  - ADT
  - AVAL
  - AVALC
  - AVALU
  - AVISIT
  - AVISITN
  - TRTSDT
  - TRT01P
  - TRT01A
  - ITTFL
  - SAFFL
  - ADY
  - ASEQ
  - SRCDOM
  - SRCVAR
  - SRCSEQ
  - APPRFL
  report: ../../../../data/adam/adrs-report.parquet
  order_by:
  - variable: STUDYID
    direction: asc
  - variable: USUBJID
    direction: asc
  - variable: ASEQ
    direction: asc
columns:
- name: STUDYID
  type: str
  label: Study Identifier
  derivation: RS.STUDYID
  submission:
    core: Req
    mandatory: true
    length: 12
    origins:
    - type: Derived
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: RS.STUDYID

        ...'
- name: USUBJID
  type: str
  label: Unique Subject Identifier
  derivation: RS.USUBJID
  submission:
    core: Req
    mandatory: true
    length: 40
    origins:
    - type: Derived
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: RS.USUBJID

        ...'
- name: PARAMCD
  type: str
  label: Parameter Code
  derivation: RS.RSTESTCD
  submission:
    core: Perm
    mandatory: false
    length: 8
    origins:
    - type: Derived
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: RS.RSTESTCD

        ...'
- name: PARAM
  type: str
  label: Parameter
  derivation: RS.RSTEST
  submission:
    core: Perm
    mandatory: false
    length: 80
    origins:
    - type: Derived
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: RS.RSTEST

        ...'
- name: PARCAT1
  type: str
  label: Parameter Category
  derivation: RS.RSCAT
  submission:
    core: Perm
    mandatory: false
    length: 100
    origins:
    - type: Derived
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: RS.RSCAT

        ...'
- name: ADT
  type: date
  label: Analysis Date
  derivation:
    to_date:
      source: RS.RSDTC
  submission:
    core: Perm
    mandatory: false
    origins:
    - type: Derived
    method:
      type: Computation
      description: "Executable derivation in the retained yamaa specification: to_date:\n\
        \  source: RS.RSDTC"
- name: AVAL
  type: float
  label: Analysis Value
  derivation: RS.RSSTRESN
  submission:
    core: Perm
    mandatory: false
    length: 8
    significant_digits: 8
    origins:
    - type: Derived
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: RS.RSSTRESN

        ...'
- name: AVALC
  type: str
  label: Analysis Value Character
  derivation: RS.RSSTRESC
  submission:
    core: Perm
    mandatory: false
    length: 100
    origins:
    - type: Derived
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: RS.RSSTRESC

        ...'
- name: AVALU
  type: str
  label: Analysis Value Unit
  derivation: RS.RSSTRESU
  submission:
    core: Perm
    mandatory: false
    length: 100
    origins:
    - type: Derived
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: RS.RSSTRESU

        ...'
- name: AVISIT
  type: str
  label: Source Visit
  derivation: RS.VISIT
  submission:
    core: Perm
    mandatory: false
    length: 100
    origins:
    - type: Derived
    method:
      type: Computation
