  submission:
    core: Perm
    mandatory: false
    length: 8
    origins:
    - type: Derived
    method:
      type: Computation
      description: "Executable derivation in the retained yamaa specification: study_day:\n\
        \  reference: TRTSDT\n  source: ADT"
- name: ASEQ
  type: int
  label: Analysis Sequence
  derivation: RS.RSSEQ
  submission:
    core: Req
    mandatory: true
    length: 8
    origins:
    - type: Derived
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: RS.RSSEQ

        ...'
- name: SRCDOM
  type: str
  label: Source Domain
  derivation: '''RS'''
  submission:
    core: Perm
    mandatory: false
    length: 8
    origins:
    - type: Assigned
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: ''''''RS'''''''
- name: SRCVAR
