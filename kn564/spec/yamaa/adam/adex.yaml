yamaa: '1.0'
type: spec
model: ADaM
domain: ADEX
keys:
- STUDYID
- USUBJID
- ASEQ
input:
  EX:
    path: ../../../data/sdtm/ex-yamaa.parquet
    schema: ../sdtm/ex.yaml
  ADSL:
    path: ../../../data/adam/adsl-yamaa.parquet
    schema: ../adam/adsl.yaml
    key:
    - STUDYID
    - USUBJID
output:
  path: ../../../data/adam/adex-yamaa.parquet
  columns:
  - STUDYID
  - USUBJID
  - ASEQ
  - PARAMCD
  - PARAM
  - ADT
  - AVAL
  - AVALU
  - EXADJ
  - TRT01A
  - SAFFL
  - SRCDOM
  - SRCSEQ
  - APPRFL
  report: ../../../data/adam/adex-report.parquet
  order_by:
  - STUDYID
  - USUBJID
  - ASEQ
columns:
- name: STUDYID
  type: str
  label: Study Identifier
  derivation: EX.STUDYID
  submission:
    mandatory: true
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: EX.STUDYID

      ...'
    length: 12
    core: Req
- name: USUBJID
  type: str
  label: Unique Subject Identifier
  derivation: EX.USUBJID
  submission:
    mandatory: true
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: EX.USUBJID

      ...'
    length: 40
    core: Req
- name: ASEQ
  type: int
  label: Analysis Sequence
  derivation: EX.EXSEQ
  submission:
    mandatory: true
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: EX.EXSEQ

      ...'
    length: 8
    core: Req
- name: PARAMCD
  type: str
  label: Parameter Code
  derivation: '''DOSE'''
  submission:
    mandatory: false
    origins:
    - type: Assigned
    method: 'Executable derivation in the retained yamaa specification: ''''''DOSE'''''''
    length: 8
    core: Perm
- name: PARAM
  type: str
  label: Study Treatment
  derivation: EX.EXTRT
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: EX.EXTRT

      ...'
    length: 80
    core: Perm
- name: ADT
  type: date
  label: Administration Date
  derivation:
    to_date:
      source: EX.EXSTDTC
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: "Executable derivation in the retained yamaa specification: to_date:\n  source: EX.EXSTDTC"
    core: Perm
- name: AVAL
  type: float
  label: Recorded Dose
  derivation: EX.EXDOSE
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: EX.EXDOSE

      ...'
    length: 8
    significant_digits: 8
    core: Perm
- name: AVALU
  type: str
  label: Recorded Dose Unit
  derivation: EX.EXDOSU
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: EX.EXDOSU

      ...'
    length: 100
    core: Perm
- name: EXADJ
  type: str
  label: Recorded Dose Adjustment
  derivation: EX.EXADJ
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: EX.EXADJ

      ...'
    length: 100
    core: Perm
- name: TRT01A
  type: str
  label: Actual Treatment
  derivation: ADSL.TRT01A
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: ADSL.TRT01A

      ...'
    length: 80
    core: Perm
- name: SAFFL
  type: str
  label: Safety Population Flag
  derivation: ADSL.SAFFL
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: ADSL.SAFFL

      ...'
    length: 1
    core: Perm
- name: SRCDOM
  type: str
  label: Source Domain
  derivation: '''EX'''
  submission:
    mandatory: false
    origins:
    - type: Assigned
    method: 'Executable derivation in the retained yamaa specification: ''''''EX'''''''
    length: 8
    core: Perm
- name: SRCSEQ
  type: int
  label: Source Sequence
  derivation: EX.EXSEQ
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: EX.EXSEQ

      ...'
    length: 8
    core: Perm
- name: APPRFL
  type: str
  label: Human Analysis Approval Flag
  derivation: '''N'''
  submission:
    mandatory: false
    origins:
    - type: Assigned
    method: 'Executable derivation in the retained yamaa specification: ''''''N'''''''
    length: 1
    core: Perm
submission:
  label: Exposure Analysis
  class: BASIC DATA STRUCTURE
  structure: One record per subject and declared keys
  repeating: true
  comment: Synthetic development output. Review findings before analysis use.
base: EX
