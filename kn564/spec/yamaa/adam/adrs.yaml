yamaa: '1.0'
type: spec
model: ADaM
domain: ADRS
keys:
- STUDYID
- USUBJID
- ASEQ
input:
  RS:
    path: ../../../data/sdtm/rs-yamaa.parquet
    schema: ../sdtm/rs.yaml
  ADSL:
    path: ../../../data/adam/adsl-yamaa.parquet
    schema: ../adam/adsl.yaml
    key:
    - STUDYID
    - USUBJID
output:
  path: ../../../data/adam/adrs-yamaa.parquet
  columns:
  - STUDYID
  - USUBJID
  - PARAMCD
  - PARAM
  - PARCAT1
  - ADT
  - AVAL
  - AVALC
  - AVALU
  - AVISIT
  - AVISITN
  - TRTSDT
  - TRT01P
  - TRT01A
  - ITTFL
  - SAFFL
  - ADY
  - ASEQ
  - SRCDOM
  - SRCVAR
  - SRCSEQ
  - APPRFL
  report: ../../../data/adam/adrs-report.parquet
  order_by:
  - STUDYID
  - USUBJID
  - ASEQ
columns:
- name: STUDYID
  type: str
  label: Study Identifier
  derivation: RS.STUDYID
  submission:
    mandatory: true
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: RS.STUDYID

      ...'
    length: 12
    core: Req
- name: USUBJID
  type: str
  label: Unique Subject Identifier
  derivation: RS.USUBJID
  submission:
    mandatory: true
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: RS.USUBJID

      ...'
    length: 40
    core: Req
- name: PARAMCD
  type: str
  label: Parameter Code
  derivation: RS.RSTESTCD
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: RS.RSTESTCD

      ...'
    length: 8
    core: Perm
- name: PARAM
  type: str
  label: Parameter
  derivation: RS.RSTEST
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: RS.RSTEST

      ...'
    length: 80
    core: Perm
- name: PARCAT1
  type: str
  label: Parameter Category
  derivation: RS.RSCAT
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: RS.RSCAT

      ...'
    length: 100
    core: Perm
- name: ADT
  type: date
  label: Analysis Date
  derivation:
    to_date:
      source: RS.RSDTC
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: "Executable derivation in the retained yamaa specification: to_date:\n  source: RS.RSDTC"
    core: Perm
- name: AVAL
  type: float
  label: Analysis Value
  derivation: RS.RSSTRESN
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: RS.RSSTRESN

      ...'
    length: 8
    significant_digits: 8
    core: Perm
- name: AVALC
  type: str
  label: Analysis Value Character
  derivation: RS.RSSTRESC
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: RS.RSSTRESC

      ...'
    length: 100
    core: Perm
- name: AVALU
  type: str
  label: Analysis Value Unit
  derivation: RS.RSSTRESU
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: RS.RSSTRESU

      ...'
    length: 100
    core: Perm
- name: AVISIT
  type: str
  label: Source Visit
  derivation: RS.VISIT
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: RS.VISIT

      ...'
    length: 100
    core: Perm
- name: AVISITN
  type: int
  label: Source Visit Order
  derivation: RS.VISITNUM
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: RS.VISITNUM

      ...'
    length: 8
    core: Perm
- name: TRTSDT
  type: date
  label: First Treatment Date
  derivation: ADSL.TRTSDT
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: ADSL.TRTSDT

      ...'
    core: Perm
- name: TRT01P
  type: str
  label: Planned Treatment
  derivation: ADSL.TRT01P
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: ADSL.TRT01P

      ...'
    length: 80
    core: Perm
- name: TRT01A
  type: str
  label: Actual Treatment
  derivation: ADSL.TRT01A
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: ADSL.TRT01A

      ...'
    length: 80
    core: Perm
- name: ITTFL
  type: str
  label: ITT Population Flag
  derivation: ADSL.ITTFL
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: ADSL.ITTFL

      ...'
    length: 1
    core: Perm
- name: SAFFL
  type: str
  label: Safety Population Flag
  derivation: ADSL.SAFFL
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: ADSL.SAFFL

      ...'
    length: 1
    core: Perm
- name: ADY
  type: int
  label: Analysis Relative Day
  derivation:
    study_day:
      source: ADT
      reference: TRTSDT
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: "Executable derivation in the retained yamaa specification: study_day:\n  reference: TRTSDT\n  source:\
      \ ADT"
    length: 8
    core: Perm
- name: ASEQ
  type: int
  label: Analysis Sequence
  derivation: RS.RSSEQ
  submission:
    mandatory: true
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: RS.RSSEQ

      ...'
    length: 8
    core: Req
- name: SRCDOM
  type: str
  label: Source Domain
  derivation: '''RS'''
  submission:
    mandatory: false
    origins:
    - type: Assigned
    method: 'Executable derivation in the retained yamaa specification: ''''''RS'''''''
    length: 8
    core: Perm
- name: SRCVAR
  type: str
  label: Source Variable
  derivation: '''RSSTRESC'''
  submission:
    mandatory: false
    origins:
    - type: Assigned
    method: 'Executable derivation in the retained yamaa specification: ''''''RSSTRESC'''''''
    length: 12
    core: Perm
- name: SRCSEQ
  type: int
  label: Source Sequence
  derivation: RS.RSSEQ
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: RS.RSSEQ

      ...'
    length: 8
    core: Perm
- name: APPRFL
  type: str
  label: Human Analysis Approval Flag
  derivation: '''N'''
  submission:
    mandatory: false
    origins:
    - type: Assigned
    method: 'Executable derivation in the retained yamaa specification: ''''''N'''''''
    length: 1
    core: Perm
submission:
  label: Disease Response Analysis
  class: BASIC DATA STRUCTURE
  structure: One record per subject and declared keys
  repeating: true
  comment: Synthetic development output. Review findings before analysis use.
base: RS
