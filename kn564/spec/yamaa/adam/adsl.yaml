yamaa: '1.0'
type: spec
model: ADaM
domain: ADSL
keys:
- STUDYID
- USUBJID
input:
  DM:
    path: ../../../data/sdtm/dm-yamaa.parquet
    schema: ../sdtm/dm.yaml
  EX:
    path: ../../../data/sdtm/ex-yamaa.parquet
    schema: ../sdtm/ex.yaml
  DS:
    path: ../../../data/sdtm/ds-yamaa.parquet
    schema: ../sdtm/ds.yaml
  SC:
    path: ../../../data/sdtm/sc-yamaa.parquet
    schema: ../sdtm/sc.yaml
  ZX:
    path: ../../../data/sdtm/zx-yamaa.parquet
    schema: ../sdtm/zx.yaml
  CM:
    path: ../../../data/sdtm/cm-yamaa.parquet
    schema: ../sdtm/cm.yaml
output:
  path: ../../../data/adam/adsl-yamaa.parquet
  columns:
  - STUDYID
  - USUBJID
  - SUBJID
  - SITEID
  - AGE
  - SEX
  - RACE
  - COUNTRY
  - RANDDT
  - TRTSDT
  - TRTEDT
  - TRT01P
  - TRT01PN
  - TRT01A
  - TRT01AN
  - ITTFL
  - SAFFL
  - TRTSWFL
  - AGEGR1
  - RACEGR1
  - REGIONUS
  - ECOG
  - SMOKE
  - PDL1
  - CNSMET
  - RISKGRP
  - METSTAT
  - PLATIN
  - NXTTRDT
  - DCSREAS
  - EOSDT
  - OSSRCDY
  - DTHFL
  - SRCOSDT
  - DTHDT
  - LSTALVDT
  - STRAT1
  - STRAT2
  - STRAT3
  - STRATA
  - APPRFL
  report: ../../../data/adam/adsl-report.parquet
  order_by:
  - STUDYID
  - USUBJID
columns:
- name: STUDYID
  type: str
  label: Study Identifier
  derivation: DM.STUDYID
  submission:
    mandatory: true
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: DM.STUDYID

      ...'
    length: 12
    core: Req
- name: USUBJID
  type: str
  label: Unique Subject Identifier
  derivation: DM.USUBJID
  submission:
    mandatory: true
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: DM.USUBJID

      ...'
    length: 40
    core: Req
- name: SUBJID
  type: str
  label: Subject Identifier
  derivation: DM.SUBJID
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: DM.SUBJID

      ...'
    length: 12
    core: Perm
- name: SITEID
  type: str
  label: Site Identifier
  derivation: DM.SITEID
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: DM.SITEID

      ...'
    length: 12
    core: Perm
- name: AGE
  type: int
  label: Age
  derivation: DM.AGE
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: DM.AGE

      ...'
    length: 8
    core: Perm
- name: SEX
  type: str
  label: Sex
  derivation: DM.SEX
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: DM.SEX

      ...'
    length: 1
    core: Perm
- name: RACE
  type: str
  label: Race
  derivation: DM.RACE
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: DM.RACE

      ...'
    length: 100
    core: Perm
- name: COUNTRY
  type: str
  label: Country
  derivation: DM.COUNTRY
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: DM.COUNTRY

      ...'
    length: 3
    core: Perm
- name: RANDDT
  type: date
  label: Randomization / Reference Date
  derivation: DM.RFSTDTC
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: DM.RFSTDTC

      ...'
    core: Perm
- name: TRTSDT
  type: date
  label: Date of First Study Treatment
  derivation: FIRSTEX.EXSTDTC
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: FIRSTEX.EXSTDTC

      ...'
    core: Perm
- name: TRTEDT
  type: date
  label: Date of Last Recorded Study Dose
  derivation: LASTEX.EXSTDTC
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: LASTEX.EXSTDTC

      ...'
    core: Perm
- name: TRT01P
  type: str
  label: Planned Treatment for Period 01
  derivation: DM.ARM
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: DM.ARM

      ...'
    length: 80
    core: Perm
- name: TRT01PN
  type: int
  label: Planned Treatment Code
  derivation:
    case:
    - when: DM.ARMCD = 'PEMBRO'
      then: 1
    - otherwise: 2
  submission:
    mandatory: false
    origins:
    - type: Assigned
    method: "Executable derivation in the retained yamaa specification: case:\n- then: 1\n  when: DM.ARMCD = 'PEMBRO'\n\
      - otherwise: 2"
    length: 8
    core: Perm
- name: TRT01A
  type: str
  label: Actual Treatment for Period 01
  derivation: IMMFIRST.EXTRT
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: IMMFIRST.EXTRT

      ...'
    length: 80
    core: Perm
- name: TRT01AN
  type: int
  label: Actual Treatment Code
  derivation:
    case:
    - when: IMMFIRST.EXTRT = 'Pembrolizumab'
      then: 1
    - when: IMMFIRST.EXTRT IS NOT NULL
      then: 2
    - otherwise: null
  submission:
    mandatory: false
    origins:
    - type: Assigned
    method: "Executable derivation in the retained yamaa specification: case:\n- then: 1\n  when: IMMFIRST.EXTRT\
      \ = 'Pembrolizumab'\n- then: 2\n  when: IMMFIRST.EXTRT IS NOT NULL\n- otherwise: null"
    length: 8
    core: Perm
- name: ITTFL
  type: str
  label: Intent-to-Treat Population Flag
  derivation: '''Y'''
  submission:
    mandatory: false
    origins:
    - type: Assigned
    method: 'Executable derivation in the retained yamaa specification: ''''''Y'''''''
    length: 1
    core: Perm
- name: SAFFL
  type: str
  label: Safety Population Flag
  derivation:
    case:
    - when: TRTSDT IS NOT NULL
      then: '''Y'''
    - otherwise: '''N'''
  submission:
    mandatory: false
    origins:
    - type: Assigned
    method: "Executable derivation in the retained yamaa specification: case:\n- then: '''Y'''\n  when: TRTSDT IS\
      \ NOT NULL\n- otherwise: '''N'''"
    length: 1
    core: Perm
- name: TRTSWFL
  type: str
  label: First vs Last Treatment Difference
  derivation:
    case:
    - when: IMMFIRST.EXTRT <> IMMLAST.EXTRT
      then: '''Y'''
    - otherwise: '''N'''
  submission:
    mandatory: false
    origins:
    - type: Assigned
    method: "Executable derivation in the retained yamaa specification: case:\n- then: '''Y'''\n  when: IMMFIRST.EXTRT\
      \ <> IMMLAST.EXTRT\n- otherwise: '''N'''"
    length: 1
    core: Perm
- name: AGEGR1
  type: str
  label: Age Group 1
  derivation:
    case:
    - when: AGE < 65
      then: '''<65'''
    - otherwise: '''>=65'''
  submission:
    mandatory: false
    origins:
    - type: Assigned
    method: "Executable derivation in the retained yamaa specification: case:\n- then: '''<65'''\n  when: AGE <\
      \ 65\n- otherwise: '''>=65'''"
    length: 100
    core: Perm
- name: RACEGR1
  type: str
  label: Race Group 1
  derivation:
    case:
    - when: RACE = 'WHITE'
      then: '''WHITE'''
    - otherwise: '''NON-WHITE'''
  submission:
    mandatory: false
    origins:
    - type: Assigned
    method: "Executable derivation in the retained yamaa specification: case:\n- then: '''WHITE'''\n  when: RACE\
      \ = 'WHITE'\n- otherwise: '''NON-WHITE'''"
    length: 100
    core: Perm
- name: REGIONUS
  type: str
  label: US Region Flag
  derivation:
    case:
    - when: COUNTRY = 'USA'
      then: '''Y'''
    - otherwise: '''N'''
  submission:
    mandatory: false
    origins:
    - type: Assigned
    method: "Executable derivation in the retained yamaa specification: case:\n- then: '''Y'''\n  when: COUNTRY\
      \ = 'USA'\n- otherwise: '''N'''"
    length: 100
    core: Perm
- name: ECOG
  type: int
  label: Baseline ECOG Performance Status
  derivation: ECOGB.SCSTRESN
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: ECOGB.SCSTRESN

      ...'
    length: 8
    core: Perm
- name: SMOKE
  type: str
  label: SMOKE
  derivation: SMOKEREC.SCSTRESC
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: SMOKEREC.SCSTRESC

      ...'
    length: 100
    core: Perm
- name: PDL1
  type: str
  label: PDL1
  derivation: PDL1REC.SCSTRESC
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: PDL1REC.SCSTRESC

      ...'
    length: 100
    core: Perm
- name: CNSMET
  type: str
  label: CNSMET
  derivation: CNSMETREC.SCSTRESC
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: CNSMETREC.SCSTRESC

      ...'
    length: 100
    core: Perm
- name: RISKGRP
  type: str
  label: RISKGRP
  derivation: RISKGRPREC.SCSTRESC
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: RISKGRPREC.SCSTRESC

      ...'
    length: 100
    core: Perm
- name: METSTAT
  type: str
  label: METSTAT
  derivation: METSTATREC.SCSTRESC
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: METSTATREC.SCSTRESC

      ...'
    length: 100
    core: Perm
- name: PLATIN
  type: str
  label: First Recorded Platinum Treatment
  derivation: PLAT.EXTRT
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: PLAT.EXTRT

      ...'
    length: 100
    core: Perm
- name: NXTTRDT
  type: date
  label: Subsequent Anticancer Therapy Start
  derivation: NEXTTR.CMSTDTC
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: NEXTTR.CMSTDTC

      ...'
    core: Perm
- name: DCSREAS
  type: str
  label: Disposition Reason
  derivation: DC.DSDECOD
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: DC.DSDECOD

      ...'
    length: 100
    core: Perm
- name: EOSDT
  type: date
  label: Disposition Date
  derivation: DC.DSSTDTC
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: DC.DSSTDTC

      ...'
    core: Perm
- name: OSSRCDY
  type: int
  label: Source Overall Survival Days
  derivation: OSD.ZXSTRESC
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: OSD.ZXSTRESC

      ...'
    length: 8
    core: Perm
- name: DTHFL
  type: str
  label: Death Flag from Source Summary
  derivation:
    case:
    - when: OSE.ZXSTRESC = '0'
      then: '''Y'''
    - otherwise: '''N'''
  submission:
    mandatory: false
    origins:
    - type: Assigned
    method: "Executable derivation in the retained yamaa specification: case:\n- then: '''Y'''\n  when: OSE.ZXSTRESC\
      \ = '0'\n- otherwise: '''N'''"
    length: 1
    core: Perm
- name: _OSOFF
  type: int
  label: Internal Source OS Day Offset
  derivation: OSSRCDY - 1
- name: SRCOSDT
  type: date
  label: Date Implied by Source OS Summary
  derivation:
    shift:
      type: date
      source: RANDDT
      days: _OSOFF
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: "Executable derivation in the retained yamaa specification: shift:\n  days: _OSOFF\n  source: RANDDT\n\
      \  type: date"
    core: Perm
- name: DTHDT
  type: date
  label: Source-Implied Death Date
  derivation:
    case:
    - when: DTHFL = 'Y'
      then: SRCOSDT
    - otherwise: null
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: Derived from precomputed source OS days and reference date; not an independently collected death date.
    core: Perm
- name: LSTALVDT
  type: date
  label: Source Last Known Alive Date
  derivation: SRCOSDT
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: SRCOSDT

      ...'
    core: Perm
- name: STRAT1
  type: str
  label: Primary Stratification Factor 1
  derivation: METSTAT
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: METSTAT

      ...'
    length: 100
    core: Perm
- name: STRAT2
  type: str
  label: Primary Stratification Factor 2
  derivation: ECOGB.SCSTRESC
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: ECOGB.SCSTRESC

      ...'
    length: 100
    core: Perm
- name: STRAT3
  type: str
  label: Primary Stratification Factor 3
  derivation: REGIONUS
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: REGIONUS

      ...'
    length: 100
    core: Perm
- name: STRATA
  type: str
  label: Reconstructed Randomization Stratum
  derivation:
    case:
    - when: METSTAT = 'M1 NED'
      then: '''M1 NED'''
    - otherwise:
        str_template: M0|{STRAT2}|{STRAT3}
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: "Executable derivation in the retained yamaa specification: case:\n- then: '''M1 NED'''\n  when: METSTAT\
      \ = 'M1 NED'\n- otherwise:\n    str_template: M0|{STRAT2}|{STRAT3}"
    length: 80
    core: Perm
- name: APPRFL
  type: str
  label: Human Analysis Approval Flag
  derivation: '''N'''
  submission:
    mandatory: false
    origins:
    - type: Assigned
    method: 'Executable derivation in the retained yamaa specification: ''''''N'''''''
    length: 1
    core: Perm
submission:
  label: Subject-Level Analysis
  class: SUBJECT LEVEL ANALYSIS DATASET
  structure: One record per subject
  repeating: false
  comment: Synthetic development output. Review findings before analysis use.
base: DM
intermediates:
- id: FIRSTEX
  dataset: EX
  key:
  - STUDYID
  - USUBJID
  filter: EX.EXADJ NOT IN ('WITHDRAWN', 'DOSE INTERRUPTED', 'DRUG INTERRUPTED') OR EX.EXADJ IS NULL
  order_by:
  - EX.EXSTDTC
  - EX.EXSEQ
  keep: first
- id: LASTEX
  dataset: EX
  key:
  - STUDYID
  - USUBJID
  filter: EX.EXADJ NOT IN ('WITHDRAWN', 'DOSE INTERRUPTED', 'DRUG INTERRUPTED') OR EX.EXADJ IS NULL
  order_by:
  - EX.EXSTDTC
  - EX.EXSEQ
  keep: last
- id: IMMFIRST
  dataset: EX
  key:
  - STUDYID
  - USUBJID
  filter: EX.EXTRT IN ('Pembrolizumab','Placebo','Saline placebo') AND (EX.EXADJ NOT IN ('WITHDRAWN', 'DOSE INTERRUPTED',
    'DRUG INTERRUPTED') OR EX.EXADJ IS NULL)
  order_by:
  - EX.EXSTDTC
  - EX.EXSEQ
  keep: first
- id: IMMLAST
  dataset: EX
  key:
  - STUDYID
  - USUBJID
  filter: EX.EXTRT IN ('Pembrolizumab','Placebo','Saline placebo') AND (EX.EXADJ NOT IN ('WITHDRAWN', 'DOSE INTERRUPTED',
    'DRUG INTERRUPTED') OR EX.EXADJ IS NULL)
  order_by:
  - EX.EXSTDTC
  - EX.EXSEQ
  keep: last
- id: PLAT
  dataset: EX
  key:
  - STUDYID
  - USUBJID
  filter: EX.EXTRT IN ('Cisplatin','Carboplatin')
  order_by:
  - EX.EXSTDTC
  - EX.EXSEQ
  keep: first
- id: DC
  dataset: DS
  key:
  - STUDYID
  - USUBJID
  filter: DS.DSCAT = 'DISPOSITION EVENT'
  order_by:
  - DS.DSSTDTC
  - DS.DSSEQ
  keep: last
- id: ECOGB
  dataset: SC
  key:
  - STUDYID
  - USUBJID
  filter: SC.SCTESTCD = 'ECOG' AND SC.VISITNUM <= 2
  order_by:
  - SC.VISITNUM
  - SC.SCSEQ
  keep: first
- id: SMOKEREC
  dataset: SC
  key:
  - STUDYID
  - USUBJID
  filter: SC.SCTESTCD = 'SMOKING'
- id: PDL1REC
  dataset: SC
  key:
  - STUDYID
  - USUBJID
  filter: SC.SCTESTCD = 'PDL1STAT'
- id: CNSMETREC
  dataset: SC
  key:
  - STUDYID
  - USUBJID
  filter: SC.SCTESTCD = 'CNSMET'
- id: RISKGRPREC
  dataset: SC
  key:
  - STUDYID
  - USUBJID
  filter: SC.SCTESTCD = 'RISKGRP'
- id: METSTATREC
  dataset: SC
  key:
  - STUDYID
  - USUBJID
  filter: SC.SCTESTCD = 'METSTAT'
- id: OSD
  dataset: ZX
  key:
  - STUDYID
  - USUBJID
  filter: ZX.ZXTESTCD = 'OSDY'
- id: OSE
  dataset: ZX
  key:
  - STUDYID
  - USUBJID
  filter: ZX.ZXTESTCD = 'OSCNSR'
- id: LCA
  dataset: ZX
  key:
  - STUDYID
  - USUBJID
  filter: ZX.ZXTESTCD = 'LSTCONT'
- id: REG
  dataset: ZX
  key:
  - STUDYID
  - USUBJID
  filter: ZX.ZXTESTCD = 'REGIONUS'
- id: NEXTTR
  dataset: CM
  key:
  - STUDYID
  - USUBJID
  filter: CM.CMCAT = 'POSTSTUDY ANTICANCER'
  order_by:
  - CM.CMSTDTC
  keep: first
