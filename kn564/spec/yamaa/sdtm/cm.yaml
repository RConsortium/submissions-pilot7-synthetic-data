yamaa: '1.0'
type: spec
model: SDTM
domain: CM
keys:
- STUDYID
- USUBJID
- CMSEQ
input:
  RAW:
    path: ../../../data/odm/extracted/cm.csv
    types:
      SRCSEQ: int
      VISITNUM: int
  DM:
    path: ../../../data/sdtm/dm-yamaa.parquet
    schema: ../sdtm/dm.yaml
    key:
    - STUDYID
    - USUBJID
output:
  path: ../../../data/sdtm/cm-yamaa.parquet
  columns:
  - DOMAIN
  - STUDYID
  - USUBJID
  - CMSEQ
  - CMSPID
  - CMREFID
  - CMTRT
  - CMCAT
  - CMINDC
  - CMSTDTC
  - CMENDTC
  - VISIT
  - VISITNUM
  - CMDY
  report: ../../../data/sdtm/cm-report.parquet
  order_by:
  - STUDYID
  - USUBJID
  - CMSEQ
columns:
- name: DOMAIN
  type: str
  label: DOMAIN
  derivation: '''CM'''
  submission:
    mandatory: true
    origins:
    - type: Assigned
      source: Sponsor
    method: 'Executable derivation in the retained yamaa specification: ''''''CM'''''''
    length: 2
    core: Req
    role: Identifier
- name: STUDYID
  type: str
  label: Study Identifier
  derivation: RAW.STUDYID
  submission:
    mandatory: true
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.STUDYID

      ...'
    length: 12
    core: Req
    role: Identifier
- name: USUBJID
  type: str
  label: Unique Subject Identifier
  derivation: RAW.USUBJID
  submission:
    mandatory: true
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.USUBJID

      ...'
    length: 40
    core: Req
    role: Identifier
- name: CMSEQ
  type: int
  label: Sequence Number
  derivation: RAW.SRCSEQ
  submission:
    mandatory: true
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.SRCSEQ

      ...'
    length: 8
    core: Req
    role: Identifier
- name: CMSPID
  type: str
  label: Source Group Identifier
  derivation: RAW.GROUPOID
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.GROUPOID

      ...'
    length: 100
    core: Perm
    role: Record Qualifier
- name: CMREFID
  type: str
  label: Source Group Repeat Identifier
  derivation: RAW.GROUPREP
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.GROUPREP

      ...'
    length: 100
    core: Perm
    role: Record Qualifier
- name: CMTRT
  type: str
  label: Reported Name of Drug, Med, or Therapy
  derivation: RAW.CMTRT
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.CMTRT

      ...'
    length: 100
    core: Perm
    role: Topic
- name: CMCAT
  type: str
  label: Category for Medication
  derivation: RAW.CMCAT
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.CMCAT

      ...'
    length: 100
    core: Perm
    role: Record Qualifier
- name: CMINDC
  type: str
  label: Indication
  derivation: RAW.CMINDC
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.CMINDC

      ...'
    length: 100
    core: Perm
    role: Record Qualifier
- name: CMSTDTC
  type: str
  label: Start Date/Time of Medication
  derivation: RAW.CMSTDTC
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.CMSTDTC

      ...'
    length: 10
    core: Perm
    role: Timing
- name: CMENDTC
  type: str
  label: End Date/Time of Medication
  derivation: RAW.CMENDTC
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.CMENDTC

      ...'
    length: 10
    core: Perm
    role: Timing
- name: VISIT
  type: str
  label: Visit Name
  derivation: RAW.VISIT
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.VISIT

      ...'
    length: 100
    core: Perm
    role: Timing
- name: VISITNUM
  type: int
  label: Source Visit Order
  derivation: RAW.VISITNUM
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.VISITNUM

      ...'
    length: 8
    core: Perm
    role: Timing
- name: _RDATE
  type: date
  label: Internal Collection Date
  derivation:
    to_date:
      source: CMSTDTC
- name: _REFDT
  type: date
  label: Internal Reference Date
  derivation:
    to_date:
      source: DM.RFSTDTC
- name: CMDY
  type: int
  label: Study Day
  derivation:
    study_day:
      source: _RDATE
      reference: _REFDT
  submission:
    mandatory: false
    origins:
    - type: Derived
      source: Sponsor
    method: "Executable derivation in the retained yamaa specification: study_day:\n  reference: _REFDT\n  source:\
      \ _RDATE"
    length: 8
    core: Perm
    role: Timing
submission:
  label: Concomitant Medications
  class: INTERVENTIONS
  structure: One record per subject and declared keys
  repeating: true
  comment: Synthetic development output. Review findings before analysis use.
base: RAW
