yamaa: '1.0'
type: spec
model: SDTM
domain: DS
keys:
- STUDYID
- USUBJID
- DSSEQ
input:
  RAW:
    path: ../../../data/odm/extracted/ds.csv
    types:
      SRCSEQ: int
      VISITNUM: int
  DM:
    path: ../../../data/sdtm/dm-yamaa.parquet
    schema: ../sdtm/dm.yaml
    key:
    - STUDYID
    - USUBJID
output:
  path: ../../../data/sdtm/ds-yamaa.parquet
  columns:
  - DOMAIN
  - STUDYID
  - USUBJID
  - DSSEQ
  - DSSPID
  - DSREFID
  - DSCAT
  - DSTERM
  - DSDECOD
  - DSSTDTC
  - VISIT
  - VISITNUM
  - DSDY
  report: ../../../data/sdtm/ds-report.parquet
  order_by:
  - STUDYID
  - USUBJID
  - DSSEQ
columns:
- name: DOMAIN
  type: str
  label: DOMAIN
  derivation: '''DS'''
  submission:
    mandatory: true
    origins:
    - type: Assigned
      source: Sponsor
    method: 'Executable derivation in the retained yamaa specification: ''''''DS'''''''
    length: 2
    core: Req
    role: Identifier
- name: STUDYID
  type: str
  label: Study Identifier
  derivation: RAW.STUDYID
  submission:
    mandatory: true
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.STUDYID

      ...'
    length: 12
    core: Req
    role: Identifier
- name: USUBJID
  type: str
  label: Unique Subject Identifier
  derivation: RAW.USUBJID
  submission:
    mandatory: true
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.USUBJID

      ...'
    length: 40
    core: Req
    role: Identifier
- name: DSSEQ
  type: int
  label: Sequence Number
  derivation: RAW.SRCSEQ
  submission:
    mandatory: true
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.SRCSEQ

      ...'
    length: 8
    core: Req
    role: Identifier
- name: DSSPID
  type: str
  label: Source Group Identifier
  derivation: RAW.GROUPOID
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.GROUPOID

      ...'
    length: 100
    core: Perm
    role: Record Qualifier
- name: DSREFID
  type: str
  label: Source Group Repeat Identifier
  derivation: RAW.GROUPREP
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.GROUPREP

      ...'
    length: 100
    core: Perm
    role: Record Qualifier
- name: DSCAT
  type: str
  label: Category for Disposition Event
  derivation: RAW.DSCAT
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.DSCAT

      ...'
    length: 100
    core: Perm
    role: Record Qualifier
- name: DSTERM
  type: str
  label: Reported Term for Disposition Event
  derivation: RAW.DSTERM
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.DSTERM

      ...'
    length: 100
    core: Perm
    role: Topic
- name: DSDECOD
  type: str
  label: Standardized Disposition Term
  derivation: RAW.DSDECOD
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.DSDECOD

      ...'
    length: 100
    core: Perm
    role: Record Qualifier
- name: DSSTDTC
  type: str
  label: Start Date/Time of Disposition Event
  derivation: RAW.DSSTDTC
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.DSSTDTC

      ...'
    length: 10
    core: Perm
    role: Timing
- name: VISIT
  type: str
  label: Visit Name
  derivation: RAW.VISIT
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.VISIT

      ...'
    length: 100
    core: Perm
    role: Timing
- name: VISITNUM
  type: int
  label: Source Visit Order
  derivation: RAW.VISITNUM
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.VISITNUM

      ...'
    length: 8
    core: Perm
    role: Timing
- name: _RDATE
  type: date
  label: Internal Collection Date
  derivation:
    to_date:
      source: DSSTDTC
- name: _REFDT
  type: date
  label: Internal Reference Date
  derivation:
    to_date:
      source: DM.RFSTDTC
- name: DSDY
  type: int
  label: Study Day
  derivation:
    study_day:
      source: _RDATE
      reference: _REFDT
  submission:
    mandatory: false
    origins:
    - type: Derived
      source: Sponsor
    method: "Executable derivation in the retained yamaa specification: study_day:\n  reference: _REFDT\n  source:\
      \ _RDATE"
    length: 8
    core: Perm
    role: Timing
submission:
  label: Disposition
  class: EVENTS
  structure: One record per subject and declared keys
  repeating: true
  comment: Synthetic development output. Review findings before analysis use.
base: RAW
