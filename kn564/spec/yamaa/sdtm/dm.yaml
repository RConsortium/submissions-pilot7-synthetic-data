yamaa: '1.0'
type: spec
model: SDTM
domain: DM
keys:
- STUDYID
- USUBJID
input:
  RAW:
    path: ../../../data/odm/extracted/dm.csv
    types:
      SRCSEQ: int
      VISITNUM: int
output:
  path: ../../../data/sdtm/dm-yamaa.parquet
  columns:
  - DOMAIN
  - STUDYID
  - USUBJID
  - SUBJID
  - SITEID
  - RFSTDTC
  - AGE
  - AGEU
  - SEX
  - RACE
  - ETHNIC
  - COUNTRY
  - ARMCD
  - ARM
  report: ../../../data/sdtm/dm-report.parquet
  order_by:
  - STUDYID
  - USUBJID
columns:
- name: DOMAIN
  type: str
  label: DOMAIN
  derivation: '''DM'''
  submission:
    mandatory: true
    origins:
    - type: Assigned
      source: Sponsor
    method: 'Executable derivation in the retained yamaa specification: ''''''DM'''''''
    length: 2
    core: Req
    role: Identifier
- name: STUDYID
  type: str
  label: Study Identifier
  derivation: RAW.STUDYID
  submission:
    mandatory: true
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.STUDYID

      ...'
    length: 12
    core: Req
    role: Identifier
- name: USUBJID
  type: str
  label: Unique Subject Identifier
  derivation: RAW.USUBJID
  submission:
    mandatory: true
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.USUBJID

      ...'
    length: 40
    core: Req
    role: Identifier
- name: SUBJID
  type: str
  label: Subject Identifier for the Study
  derivation: RAW.SUBJID
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.SUBJID

      ...'
    length: 12
    core: Perm
    role: Record Qualifier
- name: SITEID
  type: str
  label: Study Site Identifier
  derivation: RAW.SITEID
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.SITEID

      ...'
    length: 12
    core: Perm
    role: Record Qualifier
- name: RFSTDTC
  type: str
  label: Subject Reference Start Date/Time
  derivation: RAW.RFSTDTC
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.RFSTDTC

      ...'
    length: 10
    core: Perm
    role: Timing
- name: AGE
  type: int
  label: Age
  derivation: RAW.AGE
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.AGE

      ...'
    length: 8
    core: Perm
    role: Record Qualifier
- name: AGEU
  type: str
  label: Age Units
  derivation: '''YEARS'''
  submission:
    mandatory: false
    origins:
    - type: Assigned
      source: Sponsor
    method: 'Executable derivation in the retained yamaa specification: ''''''YEARS'''''''
    length: 100
    core: Perm
    role: Record Qualifier
- name: SEX
  type: str
  label: Sex
  derivation: RAW.SEX
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.SEX

      ...'
    length: 1
    core: Perm
    role: Record Qualifier
- name: RACE
  type: str
  label: Race
  derivation: RAW.RACE
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.RACE

      ...'
    length: 100
    core: Perm
    role: Record Qualifier
- name: ETHNIC
  type: str
  label: Ethnicity
  derivation: RAW.ETHNIC
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.ETHNIC

      ...'
    length: 100
    core: Perm
    role: Record Qualifier
- name: COUNTRY
  type: str
  label: Country
  derivation:
    mapping:
      source: RAW.COUNTRY
      dict:
        United States: USA
        Canada: CAN
        United Kingdom: GBR
        Germany: DEU
        France: FRA
        Spain: ESP
        Italy: ITA
        Russian Federation: RUS
        Japan: JPN
        Korea, Republic of: KOR
        China: CHN
        Australia: AUS
  submission:
    mandatory: false
    origins:
    - type: Derived
      source: Sponsor
    method: "Executable derivation in the retained yamaa specification: mapping:\n  dict:\n    Australia: AUS\n\
      \    Canada: CAN\n    China: CHN\n    France: FRA\n    Germany: DEU\n    Italy: ITA\n    Japan: JPN\n    Korea,\
      \ Republic of: KOR\n    Russian Federation: RUS\n    Spain: ESP\n    United Kingdom: GBR\n    United States:\
      \ USA\n  source: RAW.COUNTRY"
    length: 3
    core: Perm
    role: Record Qualifier
- name: ARMCD
  type: str
  label: Planned Arm Code
  derivation: RAW.ARMCD
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.ARMCD

      ...'
    length: 8
    core: Perm
    role: Record Qualifier
- name: ARM
  type: str
  label: Description of Planned Arm
  derivation: RAW.ARM
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.ARM

      ...'
    length: 80
    core: Perm
    role: Record Qualifier
submission:
  label: Demographics
  class: SPECIAL PURPOSE
  structure: One record per subject
  repeating: false
  comment: Synthetic development output. Review findings before analysis use.
base: RAW
