yamaa: '1.0'
type: spec
model: SDTM
domain: ZX
keys:
- STUDYID
- USUBJID
- ZXSEQ
input:
  DM:
    path: ../../../data/sdtm/dm-yamaa.parquet
    schema: ../sdtm/dm.yaml
    key:
    - STUDYID
    - USUBJID
  RERAW:
    path: ../../../data/odm/extracted/re.csv
    types:
      SRCSEQ: int
      VISITNUM: int
output:
  path: ../../../data/sdtm/zx-yamaa.parquet
  columns:
  - DOMAIN
  - STUDYID
  - USUBJID
  - ZXSPID
  - ZXREFID
  - ZXTESTCD
  - ZXTEST
  - ZXCAT
  - ZXORRES
  - ZXORRESU
  - ZXSTRESC
  - ZXSTRESN
  - ZXSTRESU
  - ZXDTC
  - VISIT
  - VISITNUM
  - ZXDY
  - ZXSEQ
  report: ../../../data/sdtm/zx-report.parquet
  order_by:
  - STUDYID
  - USUBJID
  - ZXSEQ
columns:
- name: DOMAIN
  type: str
  label: DOMAIN
  derivation: '''ZX'''
  submission:
    mandatory: true
    origins:
    - type: Assigned
      source: Sponsor
    method: 'Executable derivation in the retained yamaa specification: ''''''ZX'''''''
    length: 2
    core: Req
    role: Identifier
- name: STUDYID
  type: str
  label: STUDYID
  derivation: null
  submission:
    mandatory: true
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: null

      ...'
    length: 12
    core: Req
    role: Identifier
- name: USUBJID
  type: str
  label: USUBJID
  derivation: null
  submission:
    mandatory: true
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: null

      ...'
    length: 40
    core: Req
    role: Identifier
- name: ZXSPID
  type: str
  label: Source Group and Record Identifier
  derivation: null
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: null

      ...'
    length: 100
    core: Perm
    role: Record Qualifier
- name: ZXREFID
  type: str
  label: Source Item OID
  derivation: null
  submission:
    mandatory: false
    origins:
    - type: Assigned
      source: Sponsor
    method: 'Executable derivation in the retained yamaa specification: null

      ...'
    length: 100
    core: Perm
    role: Record Qualifier
- name: ZXTESTCD
  type: str
  label: Test Short Name
  derivation: null
  submission:
    mandatory: false
    origins:
    - type: Assigned
      source: Sponsor
    method: 'Executable derivation in the retained yamaa specification: null

      ...'
    length: 100
    core: Perm
    role: Topic
- name: ZXTEST
  type: str
  label: Test Name
  derivation: null
  submission:
    mandatory: false
    origins:
    - type: Assigned
      source: Sponsor
    method: 'Executable derivation in the retained yamaa specification: null

      ...'
    length: 100
    core: Perm
    role: Record Qualifier
- name: ZXCAT
  type: str
  label: Category
  derivation: null
  submission:
    mandatory: false
    origins:
    - type: Assigned
      source: Sponsor
    method: 'Executable derivation in the retained yamaa specification: null

      ...'
    length: 100
    core: Perm
    role: Record Qualifier
- name: ZXORRES
  type: str
  label: Result in Original Units
  derivation: null
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: null

      ...'
    length: 100
    core: Perm
    role: Record Qualifier
- name: ZXORRESU
  type: str
  label: Original Units
  derivation: null
  submission:
    mandatory: false
    origins:
    - type: Other
      source: Sponsor
      description: Not collected or not established from these synthetic sources.
    method: 'Executable derivation in the retained yamaa specification: null

      ...'
    length: 100
    core: Perm
    role: Record Qualifier
- name: ZXSTRESC
  type: str
  label: Character Result in Std Format
  derivation: ZXORRES
  submission:
    mandatory: false
    origins:
    - type: Derived
      source: Sponsor
    method: 'Executable derivation in the retained yamaa specification: ZXORRES

      ...'
    length: 100
    core: Perm
    role: Record Qualifier
- name: ZXSTRESN
  type: float
  label: Numeric Result in Std Format
  derivation:
    value: ZXORRES
    unconvertible: null
  submission:
    mandatory: false
    origins:
    - type: Derived
      source: Sponsor
    method: 'Executable derivation in the retained yamaa specification: unconvertible: null

      value: ZXORRES'
    length: 8
    significant_digits: 8
    core: Perm
    role: Record Qualifier
- name: ZXSTRESU
  type: str
  label: Standard Units
  derivation: ZXORRESU
  submission:
    mandatory: false
    origins:
    - type: Derived
      source: Sponsor
    method: 'Executable derivation in the retained yamaa specification: ZXORRESU

      ...'
    length: 100
    core: Perm
    role: Record Qualifier
- name: ZXDTC
  type: str
  label: Date/Time of Collection
  derivation: null
  submission:
    mandatory: false
    origins:
    - type: Other
      source: Sponsor
      description: Not collected or not established from these synthetic sources.
    method: 'Executable derivation in the retained yamaa specification: null

      ...'
    length: 10
    core: Perm
    role: Timing
- name: VISIT
  type: str
  label: Visit Name
  derivation: null
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: null

      ...'
    length: 100
    core: Perm
    role: Timing
- name: VISITNUM
  type: int
  label: Source Visit Order
  derivation: null
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: null

      ...'
    length: 8
    core: Perm
    role: Timing
- name: _RDATE
  type: date
  label: Internal Collection Date
  derivation:
    to_date:
      source: ZXDTC
- name: _REFDT
  type: date
  label: Internal Reference Date
  derivation:
    to_date:
      source: DM.RFSTDTC
- name: ZXDY
  type: int
  label: Study Day
  derivation:
    study_day:
      source: _RDATE
      reference: _REFDT
  submission:
    mandatory: false
    origins:
    - type: Derived
      source: Sponsor
    method: "Executable derivation in the retained yamaa specification: study_day:\n  reference: _REFDT\n  source:\
      \ _RDATE"
    length: 8
    core: Perm
    role: Timing
- name: ZXSEQ
  type: int
  label: Sequence Number
  derivation:
    row_number:
      window:
        group_by:
        - STUDYID
        - USUBJID
        order_by:
        - VISITNUM
        - ZXSPID
        - ZXREFID
        - ZXTESTCD
  submission:
    mandatory: true
    origins:
    - type: Derived
      source: Sponsor
    method: "Executable derivation in the retained yamaa specification: row_number:\n  window:\n    group_by:\n\
      \    - STUDYID\n    - USUBJID\n    order_by:\n    - VISITNUM\n    - ZXSPID\n    - ZXREFID\n    - ZXTESTCD"
    length: 8
    core: Req
    role: Identifier
submission:
  label: Source Efficacy Summaries - Custom
  class: FINDINGS
  structure: One record per subject and declared keys
  repeating: true
  comment: Collected values retained. Units remain missing unless explicitly supplied by source metadata. See spec/review/findings.json
    for coding, baseline, and analysis restrictions.
rows:
