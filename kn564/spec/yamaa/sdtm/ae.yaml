yamaa: '1.0'
type: spec
model: SDTM
domain: AE
keys:
- STUDYID
- USUBJID
- AESEQ
input:
  RAW:
    path: ../../../data/odm/extracted/ae.csv
    types:
      SRCSEQ: int
      VISITNUM: int
  DM:
    path: ../../../data/sdtm/dm-yamaa.parquet
    schema: ../sdtm/dm.yaml
    key:
    - STUDYID
    - USUBJID
output:
  path: ../../../data/sdtm/ae-yamaa.parquet
  columns:
  - DOMAIN
  - STUDYID
  - USUBJID
  - AESEQ
  - AESPID
  - AEREFID
  - AETERM
  - AEDECOD
  - AEBODSYS
  - AESTDTC
  - AEENDTC
  - AESEV
  - AETOXGR
  - AESER
  - AEREL
  - AEACN
  - AEOUT
  - VISIT
  - VISITNUM
  - AEDY
  report: ../../../data/sdtm/ae-report.parquet
  order_by:
  - STUDYID
  - USUBJID
  - AESEQ
columns:
- name: DOMAIN
  type: str
  label: DOMAIN
  derivation: '''AE'''
  submission:
    mandatory: true
    origins:
    - type: Assigned
      source: Sponsor
    method: 'Executable derivation in the retained yamaa specification: ''''''AE'''''''
    length: 2
    core: Req
    role: Identifier
- name: STUDYID
  type: str
  label: Study Identifier
  derivation: RAW.STUDYID
  submission:
    mandatory: true
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.STUDYID

      ...'
    length: 12
    core: Req
    role: Identifier
- name: USUBJID
  type: str
  label: Unique Subject Identifier
  derivation: RAW.USUBJID
  submission:
    mandatory: true
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.USUBJID

      ...'
    length: 40
    core: Req
    role: Identifier
- name: AESEQ
  type: int
  label: Sequence Number
  derivation: RAW.SRCSEQ
  submission:
    mandatory: true
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.SRCSEQ

      ...'
    length: 8
    core: Req
    role: Identifier
- name: AESPID
  type: str
  label: Source Group Identifier
  derivation: RAW.GROUPOID
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.GROUPOID

      ...'
    length: 100
    core: Perm
    role: Record Qualifier
- name: AEREFID
  type: str
  label: Source Group Repeat Identifier
  derivation: RAW.GROUPREP
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.GROUPREP

      ...'
    length: 100
    core: Perm
    role: Record Qualifier
- name: AETERM
  type: str
  label: Reported Term for the Adverse Event
  derivation: RAW.AETERM
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.AETERM

      ...'
    length: 100
    core: Perm
    role: Topic
- name: AEDECOD
  type: str
  label: Source Coded Adverse Event Term
  derivation: RAW.AEDECOD
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.AEDECOD

      ...'
    length: 100
    core: Perm
    role: Record Qualifier
- name: AEBODSYS
  type: str
  label: Body System or Organ Class
  derivation: RAW.AEBODSYS
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.AEBODSYS

      ...'
    length: 100
    core: Perm
    role: Record Qualifier
- name: AESTDTC
  type: str
  label: Start Date/Time of Adverse Event
  derivation: RAW.AESTDTC
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.AESTDTC

      ...'
    length: 10
    core: Perm
    role: Timing
- name: AEENDTC
  type: str
  label: End Date/Time of Adverse Event
  derivation: RAW.AEENDTC
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.AEENDTC

      ...'
    length: 10
    core: Perm
    role: Timing
- name: AESEV
  type: str
  label: Severity/Intensity
  derivation:
    case:
    - when: RAW.AESEV = 'LIFE-THREATENING'
      then: '''SEVERE'''
    - otherwise: RAW.AESEV
  submission:
    mandatory: false
    origins:
    - type: Derived
      source: Sponsor
    method: "Executable derivation in the retained yamaa specification: case:\n- then: '''SEVERE'''\n  when: RAW.AESEV\
      \ = 'LIFE-THREATENING'\n- otherwise: RAW.AESEV"
    length: 100
    core: Perm
    role: Record Qualifier
- name: AETOXGR
  type: str
  label: Standard Toxicity Grade
  derivation: RAW.AETOXGR
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.AETOXGR

      ...'
    length: 100
    core: Perm
    role: Record Qualifier
- name: AESER
  type: str
  label: Serious Event
  derivation: RAW.AESER
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.AESER

      ...'
    length: 100
    core: Perm
    role: Record Qualifier
- name: AEREL
  type: str
  label: Causality
  derivation: RAW.AEREL
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.AEREL

      ...'
    length: 100
    core: Perm
    role: Record Qualifier
- name: AEACN
  type: str
  label: Action Taken with Study Treatment
  derivation: RAW.AEACN
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.AEACN

      ...'
    length: 100
    core: Perm
    role: Record Qualifier
- name: AEOUT
  type: str
  label: Outcome of Adverse Event
  derivation: RAW.AEOUT
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.AEOUT

      ...'
    length: 100
    core: Perm
    role: Record Qualifier
- name: VISIT
  type: str
  label: Visit Name
  derivation: RAW.VISIT
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.VISIT

      ...'
    length: 100
    core: Perm
    role: Timing
- name: VISITNUM
  type: int
  label: Source Visit Order
  derivation: RAW.VISITNUM
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.VISITNUM

      ...'
    length: 8
    core: Perm
    role: Timing
- name: _RDATE
  type: date
  label: Internal Collection Date
  derivation:
    to_date:
      source: AESTDTC
- name: _REFDT
  type: date
  label: Internal Reference Date
  derivation:
    to_date:
      source: DM.RFSTDTC
- name: AEDY
  type: int
  label: Study Day
  derivation:
    study_day:
      source: _RDATE
      reference: _REFDT
  submission:
    mandatory: false
    origins:
    - type: Derived
      source: Sponsor
    method: "Executable derivation in the retained yamaa specification: study_day:\n  reference: _REFDT\n  source:\
      \ _RDATE"
    length: 8
    core: Perm
    role: Timing
submission:
  label: Adverse Events
  class: EVENTS
  structure: One record per subject and declared keys
  repeating: true
  comment: Synthetic development output. Review findings before analysis use.
base: RAW
