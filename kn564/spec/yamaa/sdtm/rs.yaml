yamaa: '1.0'
type: spec
model: SDTM
domain: RS
keys:
- STUDYID
- USUBJID
- RSSEQ
input:
  DM:
    path: ../../../data/sdtm/dm-yamaa.parquet
    schema: ../sdtm/dm.yaml
    key:
    - STUDYID
    - USUBJID
  RSRAW:
    path: ../../../data/odm/extracted/rs.csv
    types:
      SRCSEQ: int
      VISITNUM: int
output:
  path: ../../../data/sdtm/rs-yamaa.parquet
  columns:
  - DOMAIN
  - STUDYID
  - USUBJID
  - RSSPID
  - RSREFID
  - RSTESTCD
  - RSTEST
  - RSCAT
  - RSORRES
  - RSORRESU
  - RSSTRESC
  - RSSTRESN
  - RSSTRESU
  - RSDTC
  - VISIT
  - VISITNUM
  - RSDY
  - RSSEQ
  - RSMETHOD
  - RSEVAL
  report: ../../../data/sdtm/rs-report.parquet
  order_by:
  - STUDYID
  - USUBJID
  - RSSEQ
columns:
- name: DOMAIN
  type: str
  label: DOMAIN
  derivation: '''RS'''
  submission:
    mandatory: true
    origins:
    - type: Assigned
      source: Sponsor
    method: 'Executable derivation in the retained yamaa specification: ''''''RS'''''''
    length: 2
    core: Req
    role: Identifier
- name: STUDYID
  type: str
  label: STUDYID
  derivation: null
  submission:
    mandatory: true
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: null

      ...'
    length: 12
    core: Req
    role: Identifier
- name: USUBJID
  type: str
  label: USUBJID
  derivation: null
  submission:
    mandatory: true
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: null

      ...'
    length: 40
    core: Req
    role: Identifier
- name: RSSPID
  type: str
  label: Source Group and Record Identifier
  derivation: null
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: null

      ...'
    length: 100
    core: Perm
    role: Record Qualifier
- name: RSREFID
  type: str
  label: Source Item OID
  derivation: null
  submission:
    mandatory: false
    origins:
    - type: Assigned
      source: Sponsor
    method: 'Executable derivation in the retained yamaa specification: null

      ...'
    length: 100
    core: Perm
    role: Record Qualifier
- name: RSTESTCD
  type: str
  label: Test Short Name
  derivation: null
  submission:
    mandatory: false
    origins:
    - type: Assigned
      source: Sponsor
    method: 'Executable derivation in the retained yamaa specification: null

      ...'
    length: 100
    core: Perm
    role: Topic
- name: RSTEST
  type: str
  label: Test Name
  derivation: null
  submission:
    mandatory: false
    origins:
    - type: Assigned
      source: Sponsor
    method: 'Executable derivation in the retained yamaa specification: null

      ...'
    length: 100
    core: Perm
    role: Record Qualifier
- name: RSCAT
  type: str
  label: Category
  derivation: null
  submission:
    mandatory: false
    origins:
    - type: Assigned
      source: Sponsor
    method: 'Executable derivation in the retained yamaa specification: null

      ...'
    length: 100
    core: Perm
    role: Record Qualifier
- name: RSORRES
  type: str
  label: Result in Original Units
  derivation: null
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: null

      ...'
    length: 100
    core: Perm
    role: Record Qualifier
- name: RSORRESU
  type: str
  label: Original Units
  derivation: null
  submission:
    mandatory: false
    origins:
    - type: Other
      source: Sponsor
      description: Not collected or not established from these synthetic sources.
    method: 'Executable derivation in the retained yamaa specification: null

      ...'
    length: 100
    core: Perm
    role: Record Qualifier
- name: RSSTRESC
  type: str
  label: Character Result in Std Format
  derivation: RSORRES
  submission:
    mandatory: false
    origins:
    - type: Derived
      source: Sponsor
    method: 'Executable derivation in the retained yamaa specification: RSORRES

      ...'
    length: 100
    core: Perm
    role: Record Qualifier
- name: RSSTRESN
  type: float
  label: Numeric Result in Std Format
  derivation:
    value: RSORRES
    unconvertible: null
  submission:
    mandatory: false
    origins:
    - type: Derived
      source: Sponsor
    method: 'Executable derivation in the retained yamaa specification: unconvertible: null

      value: RSORRES'
    length: 8
    significant_digits: 8
    core: Perm
    role: Record Qualifier
- name: RSSTRESU
  type: str
  label: Standard Units
  derivation: RSORRESU
  submission:
    mandatory: false
    origins:
    - type: Derived
      source: Sponsor
    method: 'Executable derivation in the retained yamaa specification: RSORRESU

      ...'
    length: 100
    core: Perm
    role: Record Qualifier
- name: RSDTC
  type: str
  label: Date/Time of Collection
  derivation: null
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: null

      ...'
    length: 10
    core: Perm
    role: Timing
- name: VISIT
  type: str
  label: Visit Name
  derivation: null
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: null

      ...'
    length: 100
    core: Perm
    role: Timing
- name: VISITNUM
  type: int
  label: Source Visit Order
  derivation: null
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: null

      ...'
    length: 8
    core: Perm
    role: Timing
- name: _RDATE
  type: date
  label: Internal Collection Date
  derivation:
    to_date:
      source: RSDTC
- name: _REFDT
  type: date
  label: Internal Reference Date
  derivation:
    to_date:
      source: DM.RFSTDTC
- name: RSDY
  type: int
  label: Study Day
  derivation:
    study_day:
      source: _RDATE
      reference: _REFDT
  submission:
    mandatory: false
    origins:
    - type: Derived
      source: Sponsor
    method: "Executable derivation in the retained yamaa specification: study_day:\n  reference: _REFDT\n  source:\
      \ _RDATE"
    length: 8
    core: Perm
    role: Timing
- name: RSSEQ
  type: int
  label: Sequence Number
  derivation:
    row_number:
      window:
        group_by:
        - STUDYID
        - USUBJID
        order_by:
        - VISITNUM
        - RSSPID
        - RSREFID
        - RSTESTCD
  submission:
    mandatory: true
    origins:
    - type: Derived
      source: Sponsor
    method: "Executable derivation in the retained yamaa specification: row_number:\n  window:\n    group_by:\n\
      \    - STUDYID\n    - USUBJID\n    order_by:\n    - VISITNUM\n    - RSSPID\n    - RSREFID\n    - RSTESTCD"
    length: 8
    core: Req
    role: Identifier
- name: RSMETHOD
  type: str
  label: Source Assessment Method
  derivation: RSRAW.RSCAT
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RSRAW.RSCAT

      ...'
    length: 100
    core: Perm
    role: Record Qualifier
- name: RSEVAL
  type: str
  label: Evaluator
  derivation: null
  submission:
    mandatory: false
    origins:
    - type: Other
      source: Sponsor
      description: Not collected or not established from these synthetic sources.
    method: 'Executable derivation in the retained yamaa specification: null

      ...'
    length: 100
    core: Perm
    role: Record Qualifier
submission:
  label: Disease Response Assessments
  class: FINDINGS
  structure: One record per subject and declared keys
  repeating: true
  comment: Collected values retained. Units remain missing unless explicitly supplied by source metadata. See spec/review/findings.json
    for coding, baseline, and analysis restrictions.
rows:
- id: rs_rsorres
  dataset: RSRAW
  filter: RSRAW.RSORRES IS NOT NULL
  derivations:
    STUDYID: RSRAW.STUDYID
    USUBJID: RSRAW.USUBJID
    RSSPID: RSRAW.SRCSEQ
    RSREFID: '''IT.NCT03142334.RS.RSORRES'''
    RSTESTCD: '''RECUR'''
    RSTEST: '''Disease Recurrence Assessment'''
    RSCAT: '''DISEASE RECURRENCE'''
    RSORRES: RSRAW.RSORRES
    RSORRESU: null
    RSDTC: RSRAW.RSDTC
    VISIT: RSRAW.VISIT
    VISITNUM: RSRAW.VISITNUM
- id: rs_recursite
  dataset: RSRAW
  filter: RSRAW.RECURSITE IS NOT NULL
  derivations:
    STUDYID: RSRAW.STUDYID
    USUBJID: RSRAW.USUBJID
    RSSPID: RSRAW.SRCSEQ
    RSREFID: '''IT.NCT03142334.RS.RECURSITE'''
    RSTESTCD: '''RECSITE'''
    RSTEST: '''Recurrence Site'''
    RSCAT: '''DISEASE RECURRENCE'''
    RSORRES: RSRAW.RECURSITE
    RSORRESU: null
    RSDTC: RSRAW.RSDTC
    VISIT: RSRAW.VISIT
    VISITNUM: RSRAW.VISITNUM
