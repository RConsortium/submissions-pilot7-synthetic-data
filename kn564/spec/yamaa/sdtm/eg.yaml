yamaa: '1.0'
type: spec
model: SDTM
domain: EG
keys:
- STUDYID
- USUBJID
- EGSEQ
input:
  DM:
    path: ../../../data/sdtm/dm-yamaa.parquet
    schema: ../sdtm/dm.yaml
    key:
    - STUDYID
    - USUBJID
  EGRAW:
    path: ../../../data/odm/extracted/eg.csv
    types:
      SRCSEQ: int
      VISITNUM: int
output:
  path: ../../../data/sdtm/eg-yamaa.parquet
  columns:
  - DOMAIN
  - STUDYID
  - USUBJID
  - EGSPID
  - EGREFID
  - EGTESTCD
  - EGTEST
  - EGCAT
  - EGORRES
  - EGORRESU
  - EGSTRESC
  - EGSTRESN
  - EGSTRESU
  - EGDTC
  - VISIT
  - VISITNUM
  - EGDY
  - EGSEQ
  report: ../../../data/sdtm/eg-report.parquet
  order_by:
  - STUDYID
  - USUBJID
  - EGSEQ
columns:
- name: DOMAIN
  type: str
  label: DOMAIN
  derivation: '''EG'''
  submission:
    mandatory: true
    origins:
    - type: Assigned
      source: Sponsor
    method: 'Executable derivation in the retained yamaa specification: ''''''EG'''''''
    length: 2
    core: Req
    role: Identifier
- name: STUDYID
  type: str
  label: STUDYID
  derivation: null
  submission:
    mandatory: true
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: null

      ...'
    length: 12
    core: Req
    role: Identifier
- name: USUBJID
  type: str
  label: USUBJID
  derivation: null
  submission:
    mandatory: true
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: null

      ...'
    length: 40
    core: Req
    role: Identifier
- name: EGSPID
  type: str
  label: Source Group and Record Identifier
  derivation: null
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: null

      ...'
    length: 100
    core: Perm
    role: Record Qualifier
- name: EGREFID
  type: str
  label: Source Item OID
  derivation: null
  submission:
    mandatory: false
    origins:
    - type: Assigned
      source: Sponsor
    method: 'Executable derivation in the retained yamaa specification: null

      ...'
    length: 100
    core: Perm
    role: Record Qualifier
- name: EGTESTCD
  type: str
  label: Test Short Name
  derivation: null
  submission:
    mandatory: false
    origins:
    - type: Assigned
      source: Sponsor
    method: 'Executable derivation in the retained yamaa specification: null

      ...'
    length: 100
    core: Perm
    role: Topic
- name: EGTEST
  type: str
  label: Test Name
  derivation: null
  submission:
    mandatory: false
    origins:
    - type: Assigned
      source: Sponsor
    method: 'Executable derivation in the retained yamaa specification: null

      ...'
    length: 100
    core: Perm
    role: Record Qualifier
- name: EGCAT
  type: str
  label: Category
  derivation: null
  submission:
    mandatory: false
    origins:
    - type: Assigned
      source: Sponsor
    method: 'Executable derivation in the retained yamaa specification: null

      ...'
    length: 100
    core: Perm
    role: Record Qualifier
- name: EGORRES
  type: str
  label: Result in Original Units
  derivation: null
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: null

      ...'
    length: 100
    core: Perm
    role: Record Qualifier
- name: EGORRESU
  type: str
  label: Original Units
  derivation: null
  submission:
    mandatory: false
    origins:
    - type: Other
      source: Sponsor
      description: Not collected or not established from these synthetic sources.
    method: 'Executable derivation in the retained yamaa specification: null

      ...'
    length: 100
    core: Perm
    role: Record Qualifier
- name: EGSTRESC
  type: str
  label: Character Result in Std Format
  derivation: EGORRES
  submission:
    mandatory: false
    origins:
    - type: Derived
      source: Sponsor
    method: 'Executable derivation in the retained yamaa specification: EGORRES

      ...'
    length: 100
    core: Perm
    role: Record Qualifier
- name: EGSTRESN
  type: float
  label: Numeric Result in Std Format
  derivation:
    value: EGORRES
    unconvertible: null
  submission:
    mandatory: false
    origins:
    - type: Derived
      source: Sponsor
    method: 'Executable derivation in the retained yamaa specification: unconvertible: null

      value: EGORRES'
    length: 8
    significant_digits: 8
    core: Perm
    role: Record Qualifier
- name: EGSTRESU
  type: str
  label: Standard Units
  derivation: EGORRESU
  submission:
    mandatory: false
    origins:
    - type: Derived
      source: Sponsor
    method: 'Executable derivation in the retained yamaa specification: EGORRESU

      ...'
    length: 100
    core: Perm
    role: Record Qualifier
- name: EGDTC
  type: str
  label: Date/Time of Collection
  derivation: null
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: null

      ...'
    length: 10
    core: Perm
    role: Timing
- name: VISIT
  type: str
  label: Visit Name
  derivation: null
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: null

      ...'
    length: 100
    core: Perm
    role: Timing
- name: VISITNUM
  type: int
  label: Source Visit Order
  derivation: null
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: null

      ...'
    length: 8
    core: Perm
    role: Timing
- name: _RDATE
  type: date
  label: Internal Collection Date
  derivation:
    to_date:
      source: EGDTC
- name: _REFDT
  type: date
  label: Internal Reference Date
  derivation:
    to_date:
      source: DM.RFSTDTC
- name: EGDY
  type: int
  label: Study Day
  derivation:
    study_day:
      source: _RDATE
      reference: _REFDT
  submission:
    mandatory: false
    origins:
    - type: Derived
      source: Sponsor
    method: "Executable derivation in the retained yamaa specification: study_day:\n  reference: _REFDT\n  source:\
      \ _RDATE"
    length: 8
    core: Perm
    role: Timing
- name: EGSEQ
  type: int
  label: Sequence Number
  derivation:
    row_number:
      window:
        group_by:
        - STUDYID
        - USUBJID
        order_by:
        - VISITNUM
        - EGSPID
        - EGREFID
        - EGTESTCD
  submission:
    mandatory: true
    origins:
    - type: Derived
      source: Sponsor
    method: "Executable derivation in the retained yamaa specification: row_number:\n  window:\n    group_by:\n\
      \    - STUDYID\n    - USUBJID\n    order_by:\n    - VISITNUM\n    - EGSPID\n    - EGREFID\n    - EGTESTCD"
    length: 8
    core: Req
    role: Identifier
submission:
  label: ECG Test Results
  class: FINDINGS
  structure: One record per subject and declared keys
  repeating: true
  comment: Collected values retained. Units remain missing unless explicitly supplied by source metadata. See spec/review/findings.json
    for coding, baseline, and analysis restrictions.
rows:
- id: eg_qtcf
  dataset: EGRAW
  filter: EGRAW.QTCF IS NOT NULL
  derivations:
    STUDYID: EGRAW.STUDYID
    USUBJID: EGRAW.USUBJID
    EGSPID: EGRAW.SRCSEQ
    EGREFID: '''IT.NCT03142334.EG.QTCF'''
    EGTESTCD: '''QTCF'''
    EGTEST: '''QTCF'''
    EGCAT: '''ECG'''
    EGORRES: EGRAW.QTCF
    EGORRESU: null
    EGDTC: EGRAW.EGDTC
    VISIT: EGRAW.VISIT
    VISITNUM: EGRAW.VISITNUM
- id: eg_egintp
  dataset: EGRAW
  filter: EGRAW.EGINTP IS NOT NULL
  derivations:
    STUDYID: EGRAW.STUDYID
    USUBJID: EGRAW.USUBJID
    EGSPID: EGRAW.SRCSEQ
    EGREFID: '''IT.NCT03142334.EG.EGINTP'''
    EGTESTCD: '''INTP'''
    EGTEST: '''EGINTP'''
    EGCAT: '''ECG'''
    EGORRES: EGRAW.EGINTP
    EGORRESU: null
    EGDTC: EGRAW.EGDTC
    VISIT: EGRAW.VISIT
    VISITNUM: EGRAW.VISITNUM
