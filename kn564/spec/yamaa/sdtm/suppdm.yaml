yamaa: '1.0'
type: spec
model: SDTM
domain: SUPPDM
keys:
- STUDYID
- USUBJID
- QNAM
input:
  RAW:
    path: ../../../data/odm/extracted/dm.csv
    types:
      SRCSEQ: int
      VISITNUM: int
output:
  path: ../../../data/sdtm/suppdm-yamaa.parquet
  columns:
  - STUDYID
  - USUBJID
  - RDOMAIN
  - IDVAR
  - IDVARVAL
  - QNAM
  - QLABEL
  - QVAL
  - QORIG
  - QEVAL
  report: ../../../data/sdtm/suppdm-report.parquet
  order_by:
  - STUDYID
  - USUBJID
  - QNAM
columns:
- name: STUDYID
  type: str
  label: Study Identifier
  derivation: RAW.STUDYID
  submission:
    mandatory: true
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.STUDYID

      ...'
    length: 12
    core: Req
    role: Identifier
- name: USUBJID
  type: str
  label: Unique Subject Identifier
  derivation: RAW.USUBJID
  submission:
    mandatory: true
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.USUBJID

      ...'
    length: 40
    core: Req
    role: Identifier
- name: RDOMAIN
  type: str
  label: Related Domain Abbreviation
  derivation: '''DM'''
  submission:
    mandatory: false
    origins:
    - type: Assigned
      source: Sponsor
    method: 'Executable derivation in the retained yamaa specification: ''''''DM'''''''
    length: 100
    core: Perm
    role: Record Qualifier
- name: IDVAR
  type: str
  label: Identifying Variable
  derivation: null
  submission:
    mandatory: false
    origins:
    - type: Other
      source: Sponsor
      description: Not collected or not established from these synthetic sources.
    method: 'Executable derivation in the retained yamaa specification: null

      ...'
    length: 100
    core: Perm
    role: Record Qualifier
- name: IDVARVAL
  type: str
  label: Identifying Variable Value
  derivation: null
  submission:
    mandatory: false
    origins:
    - type: Other
      source: Sponsor
      description: Not collected or not established from these synthetic sources.
    method: 'Executable derivation in the retained yamaa specification: null

      ...'
    length: 100
    core: Perm
    role: Record Qualifier
- name: QNAM
  type: str
  label: Qualifier Variable Name
  derivation: null
  submission:
    mandatory: true
    origins:
    - type: Assigned
      source: Sponsor
    method: 'Executable derivation in the retained yamaa specification: null

      ...'
    length: 100
    core: Req
    role: Record Qualifier
- name: QLABEL
  type: str
  label: Qualifier Variable Label
  derivation: null
  submission:
    mandatory: false
    origins:
    - type: Assigned
      source: Sponsor
    method: 'Executable derivation in the retained yamaa specification: null

      ...'
    length: 100
    core: Perm
    role: Record Qualifier
- name: QVAL
  type: str
  label: Data Value
  derivation: null
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: null

      ...'
    length: 100
    core: Perm
    role: Record Qualifier
- name: QORIG
  type: str
  label: Origin
  derivation: '''CRF'''
  submission:
    mandatory: false
    origins:
    - type: Assigned
      source: Sponsor
    method: 'Executable derivation in the retained yamaa specification: ''''''CRF'''''''
    length: 100
    core: Perm
    role: Record Qualifier
- name: QEVAL
  type: str
  label: Evaluator
  derivation: '''SPONSOR'''
  submission:
    mandatory: false
    origins:
    - type: Assigned
      source: Sponsor
    method: 'Executable derivation in the retained yamaa specification: ''''''SPONSOR'''''''
    length: 100
    core: Perm
    role: Record Qualifier
submission:
  label: Supplemental DM Qualifiers
  class: FINDINGS
  structure: One record per subject and declared keys
  repeating: true
  comment: Synthetic development output. Review findings before analysis use.
rows:
- id: race
  dataset: RAW
  filter: RAW.RACE IS NOT NULL
  derivations:
    QNAM: '''ORIGRACE'''
    QLABEL: '''Original collected RACE'''
    QVAL: RAW.RACE
- id: country
  dataset: RAW
  filter: RAW.COUNTRY IS NOT NULL
  derivations:
    QNAM: '''ORIGCTRY'''
    QLABEL: '''Original collected COUNTRY'''
    QVAL: RAW.COUNTRY
