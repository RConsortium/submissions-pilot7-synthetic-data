# CORE validates committed study datasets. yamaa build/reference evidence is
# produced separately by yamaa-site.yml. Engine settings live in run_core.py.

name: CORE Validate

on:
  push:
    branches: [main]
    paths:
      - "*/data/sdtm/**.parquet"
      - "*/data/adam/**.parquet"
      - "*/data/sdtm/**.xpt"
      - "*/data/adam/**.xpt"
      - ".github/workflows/core-validate.yml"
      - ".github/workflows/study-check.yml"
      - ".github/scripts/parquet_to_xpt.py"
      - ".github/scripts/discover_core_studies.py"
      - ".github/scripts/check_structure.py"
      - ".github/repo-structure.json"
      - ".github/scripts/run_core.py"
      - ".github/scripts/core_render_block.sh"
      - ".github/scripts/core_block.jq"
  workflow_dispatch:

concurrency:
  group: core-validate-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------
  # Discover studies that hold CORE-validatable data (parquet or xpt).
  # ------------------------------------------------------------------
  discover:
    runs-on: ubuntu-latest
    outputs:
      studies: ${{ steps.list.outputs.studies }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - id: list
        run: python3 .github/scripts/discover_core_studies.py

  # ------------------------------------------------------------------
  # Validate each study (matrix). Converts parquet -> XPT, runs CORE for
  # SDTM + ADaM, renders dataset_comment.md, and uploads one artifact per
  # study laid out as <study>/data/{sdtm,adam}/...
  # ------------------------------------------------------------------
  validate:
    needs: discover
    if: needs.discover.outputs.studies != '[]' && needs.discover.outputs.studies != ''
    strategy:
      fail-fast: false
      matrix:
        study: ${{ fromJSON(needs.discover.outputs.studies) }}
    uses: ./.github/workflows/study-check.yml
    with:
      study: ${{ matrix.study }}
      core: true

  # ------------------------------------------------------------------
  # Deliver committed reports + comments into study folders via auto-PR.
  # Main only; PR checks use ci.yml and never deliver reports.
  # ------------------------------------------------------------------
  deliver:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          pattern: core-reports-*
          path: _dl
          merge-multiple: true

      - name: Copy publishable reports into study folders
        shell: bash
        run: |
          set -euo pipefail
          # JSON reports and execution records remain artifact-only.
          while IFS= read -r -d '' file; do
            target="${file#_dl/}"
            mkdir -p "$(dirname "$target")"
            cp "$file" "$target"
          done < <(find _dl -type f \( -name 'core-report-*.xlsx' -o -name dataset_comment.md \) -print0)

      - name: Open or update reports PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          branch: core/reports
          base: main
          delete-branch: false
          title: "CORE validation reports (automated)"
          commit-message: "chore(core): refresh CORE validation reports and dataset comments"
          labels: core-report
          body: |
            Automated CDISC CORE validation output, refreshed per study/domain:

            - `<study>/data/sdtm/core-report-SDTM.xlsx` + `dataset_comment.md`
            - `<study>/data/adam/core-report-ADAM.xlsx` + `dataset_comment.md`

            The full JSON reports can be very large (100k+ issues on big
            datasets), so they are kept in the 90-day per-study
            `core-reports-<study>` artifacts rather than committed. Only the
            human-readable `dataset_comment.md` and the (truncated) `.xlsx`
            are committed here.

            Per-domain `core-execution.json` records retain conversion coverage
            and engine exit status in the artifacts. Reports that list no rules
            are conformance **UNVERIFIED**, including ADaM under this engine pin
            (issue #66). A generated report is not a conformance pass.

            Generated by the `CORE Validate` workflow. Merging this PR does not
            re-trigger it (only `*.parquet`/`*.xpt` changes do).
