# CORE validates committed study datasets. yamaa build/reference evidence is
# produced separately by yamaa-site.yml. Engine settings live in run_core.py.
# Reports are retained as workflow artifacts only.

name: CORE Validate

on:
  push:
    branches: [main]
    paths:
      - "*/data/sdtm/**.parquet"
      - "*/data/adam/**.parquet"
      - "*/data/sdtm/**.xpt"
      - "*/data/adam/**.xpt"
      - ".github/workflows/core-validate.yml"
      - ".github/workflows/study-check.yml"
      - ".github/scripts/parquet_to_xpt.py"
      - ".github/scripts/discover_core_studies.py"
      - ".github/scripts/check_structure.py"
      - ".github/repo-structure.json"
      - ".github/scripts/run_core.py"
      - ".github/scripts/core_render_block.sh"
      - ".github/scripts/core_block.jq"
  workflow_dispatch:

concurrency:
  group: core-validate-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------
  # Discover studies that hold CORE-validatable data (parquet or xpt).
  # ------------------------------------------------------------------
  discover:
    runs-on: ubuntu-latest
    outputs:
      studies: ${{ steps.list.outputs.studies }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - id: list
        run: python3 .github/scripts/discover_core_studies.py

  # ------------------------------------------------------------------
  # Validate each study (matrix). Converts parquet -> XPT, runs CORE for
  # SDTM + ADaM, renders dataset_comment.md, and uploads one artifact per
  # study laid out as <study>/data/{sdtm,adam}/...
  # ------------------------------------------------------------------
  validate:
    needs: discover
    if: needs.discover.outputs.studies != '[]' && needs.discover.outputs.studies != ''
    strategy:
      fail-fast: false
      matrix:
        study: ${{ fromJSON(needs.discover.outputs.studies) }}
    uses: ./.github/workflows/study-check.yml
    with:
      study: ${{ matrix.study }}
      core: true
