## CDISC CORE validation
##
## Validates existing XPT files with the CDISC Open Rules Engine (CORE).
##
## Runs on every push to main (and on PRs to main, for pre-merge feedback).
## The JSON + XLSX reports are published two ways:
##   1. As the `core-validation-reports` artifact (90-day retention).
##   2. On push to main, the long-lived `core_report` branch is rebuilt to
##      MIRROR main plus the freshest reports, filed under the study's data
##      folders:
##        cart-t/data/sdtm/core-report-SDTM.{json,xlsx}
##        cart-t/data/adam/core-report-ADAM.{json,xlsx}
##      So core_report always == latest main + latest CORE reports. PR runs
##      validate and post a summary but do NOT touch core_report.
##
## Prerequisites:
##   - XPT files checked into cart-t/data/sdtm/ and cart-t/data/adam/
##
## To adjust engine version, standards, or CT packages, edit the env block.

name: CORE Validate

on:
  push:
    branches: [main]
    paths:
      - "cart-t/data/sdtm/**.xpt"
      - "cart-t/data/adam/**.xpt"
      - ".github/workflows/core-validate.yml"
  pull_request:
    branches: [main]
    paths:
      - "cart-t/data/sdtm/**.xpt"
      - "cart-t/data/adam/**.xpt"
      - ".github/workflows/core-validate.yml"
  workflow_dispatch:

concurrency:
  group: core-validate-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

# The validate job pushes the freshest reports to the core_report branch.
permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------
  # Validate XPT with the CDISC Open Rules Engine (CORE)
  #
  # Runs on ubuntu-latest. CORE ships a prebuilt Linux executable with a
  # bundled offline cache of published rules and CT, so it works with no API
  # key. If the CDISC_LIBRARY_API_KEY secret is set, the cache is refreshed
  # from the CDISC Library first (needed for ADaM rules — see that step).
  # ------------------------------------------------------------------
  core-validate:
    runs-on: ubuntu-latest

    env:
      # --- CORE release (update when CDISC publishes a new version) ---
      CORE_VERSION: "v0.16.0"
      CORE_ASSET: "core-ubuntu-latest.zip"
      # --- Standards & versions (CORE uses hyphenated version strings) ---
      SDTM_STANDARD: "sdtmig"
      SDTM_VERSION: "3-3"
      # NB: CORE's ADaM standard id is "adam" (not "adamig"), and the ADaM
      # version string must carry the product prefix — the library-metadata
      # cache key is "standards/adam/adamig-1-3", so pass version "adamig-1-3"
      # (not "1-3"). Supported standards: adam, sdtmig, sendig, tig, usdm.
      #
      # KNOWN LIMITATION — ADaM reports come back EMPTY with the bundled cache.
      # CORE's shipped offline cache (rules.pkl) contains ZERO ADaM conformance
      # rules: `core list-rules -s adam -v adamig-1-3` returns [] (vs. 423 rules
      # for sdtmig 3-3). The standard/version below are CORRECT — all ADaM
      # datasets are recognized and the metadata loads — there are simply no
      # ADaM rules to execute, so the run finishes in ~0s with 0 findings.
      # This is a bundled-cache gap, NOT a config bug; do not "fix" it by
      # changing the id/version ("adamig" is rejected; version "1-3" throws
      # LibraryMetadataNotFoundError). ADaM conformance rules are only
      # available from the CDISC Library API. To enable them, add a
      # `core update-cache --apikey <CDISC_LIBRARY_API_KEY>` step (key stored
      # as a repo secret) before the validate steps.
      ADAM_STANDARD: "adam"
      ADAM_VERSION: "adamig-1-3"
      # --- CDISC CT packages (must exist in CORE's bundled cache) ---
      # CORE bundles quarterly CT packages; 2024-06-28 is not among them, so
      # we use the closest available release. The Locate step falls back to
      # the newest cached package if these ids ever disappear on a version bump.
      CT_SDTM: "sdtmct-2024-09-27"
      CT_ADAM: "adamct-2024-09-27"
      # --- CDISC Library API key (optional repo secret) ---
      # When set, the "Refresh CORE cache" step below pulls the full published
      # rules + CT from the CDISC Library, enabling ADaM conformance rules that
      # the bundled offline cache lacks. When empty (e.g. fork PRs), the run
      # falls back to the bundled cache and ADaM reports stay empty.
      CDISC_LIBRARY_API_KEY: ${{ secrets.CDISC_LIBRARY_API_KEY }}

    steps:
      # fetch-depth: 0 gives full history so the core_report worktree push
      # below isn't a rejected shallow update.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # --- Check for XPT files ---
      - name: Check for XPT files
        id: check-xpt
        shell: bash
        run: |
          sdtm=$(find cart-t/data/sdtm -maxdepth 1 -name '*.xpt' 2>/dev/null | wc -l | tr -d ' ')
          adam=$(find cart-t/data/adam -maxdepth 1 -name '*.xpt' 2>/dev/null | wc -l | tr -d ' ')
          echo "SDTM XPT files: $sdtm"
          echo "ADaM XPT files: $adam"
          if [ $((sdtm + adam)) -eq 0 ]; then
            echo "::warning::No XPT files found — nothing to validate."
            echo "has_xpt=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_xpt=true" >> "$GITHUB_OUTPUT"
          fi

      # --- Cache the CORE executable + bundled rules cache ---
      - name: Cache CORE
        if: steps.check-xpt.outputs.has_xpt == 'true'
        id: core-cache
        uses: actions/cache@v5
        with:
          path: core-bin
          key: cdisc-core-${{ env.CORE_VERSION }}-${{ env.CORE_ASSET }}

      # --- Download & unpack CORE (skipped on a cache hit) ---
      - name: Download CORE
        if: steps.check-xpt.outputs.has_xpt == 'true' && steps.core-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/cdisc-org/cdisc-rules-engine/releases/download/${CORE_VERSION}/${CORE_ASSET}"
          echo "Downloading CORE from $url"
          curl -fsSL -o core.zip "$url"
          mkdir -p core-bin
          unzip -q core.zip -d core-bin
          rm -f core.zip
          # The bundle contains data files also named "core" (e.g. a JSON
          # schema vocabulary), so match the actual ELF executable, not the
          # first file named "core".
          exe=""
          while IFS= read -r f; do
            if file "$f" 2>/dev/null | grep -qi 'ELF'; then exe="$f"; break; fi
          done < <(find core-bin -type f -name core)
          if [ -z "$exe" ]; then
            echo "::error::CORE executable not found after unzip"; find core-bin | head -50; exit 1
          fi
          chmod +x "$exe"
          echo "CORE unpacked at $exe"

      # --- Locate the CORE executable (works on both fresh + cached runs) ---
      - name: Locate CORE
        if: steps.check-xpt.outputs.has_xpt == 'true'
        id: core
        shell: bash
        run: |
          set -euo pipefail
          # Match the ELF executable, not the data files also named "core".
          exe=""
          while IFS= read -r f; do
            if file "$f" 2>/dev/null | grep -qi 'ELF'; then exe="$f"; break; fi
          done < <(find core-bin -type f -name core)
          if [ -z "$exe" ]; then
            echo "::error::CORE executable missing"; find core-bin | head -50; exit 1
          fi
          chmod +x "$exe"
          # Absolute path + its directory (CORE resolves its bundled cache
          # relative to the executable, so validation runs from that dir).
          exe_abs="$(cd "$(dirname "$exe")" && pwd)/$(basename "$exe")"
          core_dir="$(dirname "$exe_abs")"
          echo "exe=$exe_abs" >> "$GITHUB_OUTPUT"
          echo "dir=$core_dir" >> "$GITHUB_OUTPUT"
          echo "CORE executable: $exe_abs"

          # Resolve CT packages against the bundled cache: use the requested
          # id if present, otherwise fall back to the newest cached package
          # for that standard so validation still runs.
          resolve_ct() {  # $1=prefix (sdtmct|adamct)  $2=desired id
            local prefix="$1" desired="$2" hit latest
            hit=$(find "$core_dir" -type f -name "${desired}.pkl" | head -1)
            if [ -n "$hit" ]; then echo "$desired"; return; fi
            latest=$(find "$core_dir" -type f -name "${prefix}-*.pkl" -exec basename {} .pkl \; | sort | tail -1)
            echo "::warning::CT package ${desired} not in cache; falling back to ${latest}" >&2
            echo "$latest"
          }
          ct_sdtm=$(resolve_ct sdtmct "$CT_SDTM")
          ct_adam=$(resolve_ct adamct "$CT_ADAM")
          echo "ct_sdtm=$ct_sdtm" >> "$GITHUB_OUTPUT"
          echo "ct_adam=$ct_adam" >> "$GITHUB_OUTPUT"
          echo "Resolved CT: SDTM=$ct_sdtm ADaM=$ct_adam"

      # --- Refresh CORE cache from the CDISC Library (only if key present) ---
      #
      # The bundled offline cache ships ZERO ADaM rules. Pulling the full cache
      # from the CDISC Library (requires CDISC_LIBRARY_API_KEY) makes ADaM
      # conformance rules available so the ADaM report is no longer empty.
      # Skipped when the secret is absent — the run then uses the bundled cache.
      - name: Refresh CORE cache from CDISC Library
        if: steps.check-xpt.outputs.has_xpt == 'true' && env.CDISC_LIBRARY_API_KEY != ''
        shell: bash
        run: |
          set -euo pipefail
          exe="${{ steps.core.outputs.exe }}"
          core_dir="${{ steps.core.outputs.dir }}"
          echo "Refreshing CORE cache from the CDISC Library..."
          ( cd "$core_dir" && "$exe" update-cache --apikey "$CDISC_LIBRARY_API_KEY" )
          echo "Cache refreshed."

      # --- Validate SDTM ---
      - name: Validate SDTM
        if: steps.check-xpt.outputs.has_xpt == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          exe="${{ steps.core.outputs.exe }}"
          core_dir="${{ steps.core.outputs.dir }}"
          sdtm_dir="$PWD/cart-t/data/sdtm"
          n=$(find "$sdtm_dir" -maxdepth 1 -name '*.xpt' | wc -l | tr -d ' ')
          echo "SDTM XPT files found: $n"
          if [ "$n" -eq 0 ]; then echo "No SDTM XPT files — skipping."; exit 0; fi

          out="$PWD/core-report-SDTM"
          ( cd "$core_dir" && "$exe" validate \
              --standard "$SDTM_STANDARD" \
              --version "$SDTM_VERSION" \
              --controlled-terminology-package "${{ steps.core.outputs.ct_sdtm }}" \
              --data "$sdtm_dir" \
              --filetype xpt \
              --output-format JSON \
              --output-format XLSX \
              --output "$out" )
          code=$?
          echo "CORE SDTM exit code: $code"
          [ "$code" -ne 0 ] && echo "::warning::CORE SDTM validation exited with code $code"
          ls -la "$PWD"/core-report-SDTM* 2>/dev/null || echo "::warning::No SDTM report produced"

      # --- Validate ADaM ---
      - name: Validate ADaM
        if: steps.check-xpt.outputs.has_xpt == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          exe="${{ steps.core.outputs.exe }}"
          core_dir="${{ steps.core.outputs.dir }}"
          adam_dir="$PWD/cart-t/data/adam"
          n=$(find "$adam_dir" -maxdepth 1 -name '*.xpt' | wc -l | tr -d ' ')
          echo "ADaM XPT files found: $n"
          if [ "$n" -eq 0 ]; then echo "No ADaM XPT files — skipping."; exit 0; fi

          out="$PWD/core-report-ADAM"
          ( cd "$core_dir" && "$exe" validate \
              --standard "$ADAM_STANDARD" \
              --version "$ADAM_VERSION" \
              --controlled-terminology-package "${{ steps.core.outputs.ct_adam }}" \
              --controlled-terminology-package "${{ steps.core.outputs.ct_sdtm }}" \
              --data "$adam_dir" \
              --filetype xpt \
              --output-format JSON \
              --output-format XLSX \
              --output "$out" )
          code=$?
          echo "CORE ADaM exit code: $code"
          [ "$code" -ne 0 ] && echo "::warning::CORE ADaM validation exited with code $code"
          ls -la "$PWD"/core-report-ADAM* 2>/dev/null || echo "::warning::No ADaM report produced"

      # --- Upload validation reports (JSON is parsed by job 2; XLSX for humans) ---
      - name: Upload CORE reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: core-validation-reports
          retention-days: 90
          if-no-files-found: warn
          path: core-report-*

      # --- Mirror main into core_report + attach the freshest reports ---
      #
      # core_report is a DERIVED branch: on every push to main it is rebuilt
      # to equal the current main commit plus the latest SDTM + ADaM reports,
      # filed under the study's data folders:
      #   cart-t/data/sdtm/core-report-SDTM.{json,xlsx}
      #   cart-t/data/adam/core-report-ADAM.{json,xlsx}
      # It is force-pushed each time (history is disposable). PR runs skip this
      # step — they validate and post a summary but never touch core_report.
      - name: Sync core_report with main
        if: >
          steps.check-xpt.outputs.has_xpt == 'true' &&
          github.event_name != 'pull_request' &&
          github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          reports=(core-report-*.json core-report-*.xlsx)
          if [ ${#reports[@]} -eq 0 ]; then
            echo "No report files produced — nothing to sync."; exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Rebuild core_report from the current commit (main), so it mirrors
          # main. Generated reports at the repo root are untracked, so the
          # branch switch keeps them for us to file below.
          git switch -C core_report

          sdtm_dir="cart-t/data/sdtm"
          adam_dir="cart-t/data/adam"
          mkdir -p "$sdtm_dir" "$adam_dir"
          for f in core-report-SDTM.*; do [ -e "$f" ] && cp "$f" "$sdtm_dir"/; done
          for f in core-report-ADAM.*; do [ -e "$f" ] && cp "$f" "$adam_dir"/; done

          git add "$sdtm_dir" "$adam_dir"
          git commit \
            -m "CORE reports: SDTM + ADaM (main @ ${GITHUB_SHA::7})" \
            -m "core_report mirrors main plus the latest CORE reports." \
            -m "Co-Authored-By: Claude Opus 4.8 (1M context) <noreply@anthropic.com>" \
            || echo "No report changes on top of main."

          # Force-push: core_report is fully derived from main each run.
          git push --force origin core_report
          echo "core_report synced with main @ ${GITHUB_SHA::7}."

      # --- Post summary to the PR ---
      - name: Post validation summary
        if: always()
        shell: bash
        run: |
          sdtm_status="No report (no XPT or error)"
          adam_status="No report (no XPT or error)"
          [ -f core-report-SDTM.json ] && sdtm_status="Report generated"
          # ADaM: CORE ships NO executable ADaM rules. Confirmed 2026-08-24 —
          # even after `update-cache` from the CDISC Library with a valid key,
          # `list-rules -s adam` returns [] (vs 423 for sdtmig, 257 for sendig).
          # So an ADaM report is ALWAYS 0 rules / 0 findings: conformance is
          # UNVERIFIED, not a clean pass. Setting the API key does not change
          # this. Use Pinnacle 21 for ADaM conformance.
          [ -f core-report-ADAM.json ] && adam_status="Report generated — 0 ADaM rules exist in CORE; conformance UNVERIFIED (use P21)"
          {
            echo "## CDISC CORE Validation"
            echo ""
            echo "Engine: CORE ${CORE_VERSION}"
            echo ""
            echo "| Standard | Version | CT Package | Status |"
            echo "|----------|---------|------------|--------|"
            echo "| SDTM | ${SDTM_VERSION//-/.} | ${{ steps.core.outputs.ct_sdtm }} | ${sdtm_status} |"
            echo "| ADaM | ${ADAM_VERSION} | ${{ steps.core.outputs.ct_adam }} | ${adam_status} |"
            echo ""
            echo "Download the **core-validation-reports** artifact for the full JSON + Excel reports."
            echo ""
            echo "Findings are posted to matching issues by the \`core_dataset_comments\` Claude Code routine, which picks up this artifact on its next run."
          } >> "$GITHUB_STEP_SUMMARY"
