## Pilot3 plan.csv reproducibility check
##
## data/mapping/plan.csv is a pinned artifact: python/make_plan.py is the reviewed
## rule and the CSV must be its byte-identical output. This job regenerates
## the CSV into a temp file and diffs it against the committed one, so any
## drift between the rule and the pinned file fails the run.
##
## It runs only when the generator, its pinned output, or its source SDTM
## changes.

name: Pilot3 plan.csv reproducibility

on:
  pull_request:
    branches: [main]
    paths:
      - "submission-pilot3/data/mapping/**"
      - "submission-pilot3/program/adam/python/make_plan.py"
      - "submission-pilot3/data/sdtm/qs.parquet"
      - "submission-pilot3/data/sdtm/ex.parquet"
  push:
    branches: [main]
    paths:
      - "submission-pilot3/data/mapping/**"
      - "submission-pilot3/program/adam/python/make_plan.py"
      - "submission-pilot3/data/sdtm/qs.parquet"
      - "submission-pilot3/data/sdtm/ex.parquet"
  workflow_dispatch:

concurrency:
  group: pilot3-plan-check-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  plan-repro:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install polars
        run: pip install polars

      - name: Regenerate plan.csv and diff against the pinned file
        run: |
          python3 submission-pilot3/program/adam/python/make_plan.py --out /tmp/plan.regen.csv
          diff /tmp/plan.regen.csv submission-pilot3/data/mapping/plan.csv \
            && echo "plan.csv reproduces byte-identically"
