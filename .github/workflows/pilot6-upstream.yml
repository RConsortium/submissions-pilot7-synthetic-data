name: Pilot 6 upstream R reproduction

on:
  pull_request:
    branches: [main]
    paths:
      - 'submission-pilot6/**'
      - '.github/scripts/import_pilot6_inputs.py'
      - '.github/workflows/pilot6-upstream.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pilot6-upstream-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyarrow==26.0.0 PyYAML==6.0.3
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.1'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::admiral
            any::datasetjson
            any::dplyr
            any::glue
            any::haven
            any::janitor
            any::jsonlite
            any::lubridate
            any::metacore
            any::metatools
            any::purrr
            any::stringr
            any::tibble
            any::tidyr
            any::xportr
      - name: Test input conversion and comparison safeguards
        run: python -m unittest discover -s submission-pilot6/program/adam -p 'test_*.py' -v
      - name: Generate ADaM from SDTM and compare with references
        run: python submission-pilot6/program/adam/verify_upstream.py --rscript Rscript
      - name: Print verification evidence
        if: always()
        shell: python
        run: |
          from pathlib import Path
          report = Path('submission-pilot6/log/upstream-verification.json')
          if report.exists():
              print('BEGIN_PILOT6_REPORT')
              print(report.read_text())
              print('END_PILOT6_REPORT')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pilot6-upstream-evidence
          path: |
            submission-pilot6/log/upstream-verification.json
            .build/pilot6-upstream/*/logs/*.log
          include-hidden-files: true
          if-no-files-found: warn
