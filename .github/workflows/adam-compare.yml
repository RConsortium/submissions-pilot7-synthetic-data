# Manual comparison utility. Study reference verification is performed by
# validate_yamaa.py; the comparator self-check runs in ci.yml.

name: ADaM Compare

on:
  workflow_dispatch:
    inputs:
      derived:
        description: "Derived ADaM parquet directory (or single file)"
        required: true
      official:
        description: "Official ADaM parquet directory"
        default: "submission-pilot5/data/adam"
        required: false
      datasets:
        description: "Comma-separated datasets to compare (empty = all)"
        default: ""
        required: false

permissions:
  contents: read

concurrency:
  group: adam-compare-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pyarrow
        run: python -m pip install pyarrow==25.0.1
      - name: Compare derived ADaM against official
        env:
          OFFICIAL: ${{ inputs.official }}
          DERIVED: ${{ inputs.derived }}
          DATASETS: ${{ inputs.datasets }}
        run: >-
          python3 .github/scripts/compare_adam.py
          --official "$OFFICIAL"
          --derived "$DERIVED"
          --datasets "$DATASETS"
          --keys-file submission-pilot5/program/adam/adam-compare-keys.json
          --null-empty-equal
