# Temporary cleanup requested by the repository maintainer. Remove after success.
name: Remove unwanted CORE issue comments

on:
  push:
    branches: [main]
    paths: ['.github/workflows/cleanup-core-comments.yml']

permissions:
  contents: read

jobs:
  cleanup:
    if: github.repository == 'RConsortium/submissions-pilot7-synthetic-data'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Delete the identified CORE bot comments and their issue labels
        uses: actions/github-script@v7
        with:
          script: |
            const targets = [
              {
                "issue": 90,
                "id": 6391354170
              },
              {
                "issue": 90,
                "id": 6391654963
              }
            ];
            const repo = context.repo;
            const prefix = '## CDISC CORE Validation Findings\n';
            const footer = /_\(posted by CDISC CORE validation -- run #\d+ \(\d+\), commit [a-f0-9]{7}\)_\s*$/;
            let deleted = 0;
            for (const target of targets) {
              let comment;
              try {
                ({data: comment} = await github.rest.issues.getComment({
                  ...repo, comment_id: target.id,
                }));
              } catch (error) {
                if (error.status === 404) continue;
                throw error;
              }
              if (comment.user.login !== 'github-actions[bot]' ||
                  !comment.body.startsWith(prefix) || !footer.test(comment.body) ||
                  comment.issue_url !== `https://api.github.com/repos/${repo.owner}/${repo.repo}/issues/${target.issue}`) {
                throw new Error(`Refusing to delete changed or unrelated comment ${target.id}`);
              }
              await github.rest.issues.deleteComment({...repo, comment_id: target.id});
              core.info(`Deleted CORE bot comment ${target.id} from issue #${target.issue}`);
              deleted++;
            }
            for (const issue_number of new Set(targets.map(target => target.issue))) {
              try {
                await github.rest.issues.removeLabel({...repo, issue_number, name: 'core-commented'});
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
            core.info(`Deleted ${deleted} CORE bot comments.`);
