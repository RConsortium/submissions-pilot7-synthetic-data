name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  structure-check:
    runs-on: ubuntu-latest
    outputs:
      studies: ${{ steps.scope.outputs.studies }}
      publication: ${{ steps.scope.outputs.publication }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select checks from the changed files
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]]; then BASE=$(git rev-parse "$HEAD^"); fi
          if [ "${{ github.event_name }}" = pull_request ]; then BASE=$(git merge-base "$BASE" "$HEAD"); fi
          python .github/scripts/ci_scope.py --base "$BASE" --head "$HEAD"
          git diff --check "$BASE" "$HEAD"
      - run: python -m pip install PyYAML==6.0.3
      - run: python .github/scripts/check_structure.py
      - run: python .github/scripts/check_ascii.py
      - run: python -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - run: git diff --check
      - name: Comparator self-check
        if: steps.scope.outputs.compare == 'true'
        run: |
          python -m pip install pyarrow==25.0.1
          python .github/scripts/compare_adam.py \
            --official submission-pilot5/data/adam --derived submission-pilot5/data/adam \
            --keys-file submission-pilot5/program/adam/adam-compare-keys.json
      - name: Check website layout and links (no study results)
        if: github.event_name == 'pull_request' && steps.scope.outputs.website == 'true' && steps.scope.outputs.publication != 'true'
        run: |
          python -m pip install -r docs/requirements.txt
          python .github/scripts/preview_site.py
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request' && steps.scope.outputs.website == 'true' && steps.scope.outputs.publication != 'true'
        with:
          name: pilot7-layout-preview
          path: .build/site-preview/site
          include-hidden-files: true
          if-no-files-found: error

  study-check:
    if: github.event_name == 'pull_request' && needs.structure-check.outputs.studies != '{}'
    needs: structure-check
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.structure-check.outputs.studies) }}
    uses: ./.github/workflows/study-check.yml
    with:
      study: ${{ matrix.study }}
      yamaa: ${{ matrix.yamaa }}
      core: ${{ matrix.core }}
      r: ${{ matrix.r }}

  publication-check:
    needs: [structure-check, study-check]
    if: needs.structure-check.outputs.publication == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: validation-*
          path: .build/validation
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: derived-*
          path: .
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: verification-*
          path: .build/verification
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r docs/requirements.txt
      - name: Record allowed pending studies without installing an engine
        run: |
          python - <<'PYTHON'
          from pathlib import Path
          import subprocess
          import sys
          sys.path.insert(0, '.github/scripts')
          from study_evidence import catalog
          for study, entry in catalog(Path.cwd()).items():
              if entry.get('allow_pending') and not Path(study, 'spec/yamaa/project.yaml').exists():
                  subprocess.run([sys.executable, '.github/scripts/validate_yamaa.py', study], check=True)
          PYTHON
      - name: Verify the full publication path with this commit's evidence
        run: |
          python .github/scripts/build_study_docs.py
          python .github/scripts/check_ascii.py
          python -m mkdocs build --strict
      - name: Install browser checks
        run: |
          python -m pip install -r .github/tests/dashboard/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Check dashboard modules and reviewer workflows
        run: bash .github/scripts/check_dashboard.sh site
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: dashboard-browser-failure
          path: .build/dashboard-browser/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: pilot7-publication-check
          path: site
          if-no-files-found: error
