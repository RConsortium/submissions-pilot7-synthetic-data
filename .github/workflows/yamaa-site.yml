name: yamaa studies and website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yamaa-site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  inventory:
    runs-on: ubuntu-24.04
    outputs:
      studies: ${{ steps.catalog.outputs.studies }}
      synthetic: ${{ steps.synthetic.outputs.studies }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - id: catalog
        run: python3 .github/scripts/study_evidence.py
      - id: synthetic
        run: python3 .github/scripts/synthetic_evidence.py --list

  validate:
    needs: inventory
    strategy:
      fail-fast: false
      matrix:
        study: ${{ fromJSON(needs.inventory.outputs.studies) }}
    uses: ./.github/workflows/study-check.yml
    with:
      study: ${{ matrix.study }}
      yamaa: true

  synthetic:
    needs: inventory
    strategy:
      fail-fast: false
      matrix:
        study: ${{ fromJSON(needs.inventory.outputs.synthetic) }}
    uses: ./.github/workflows/synthetic-check.yml
    with:
      study: ${{ matrix.study }}

  website:
    name: Build website
    needs: [validate, synthetic]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: validation-*
          path: .build/validation
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: derived-*
          path: .
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: verification-*
          path: .build/verification
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: synthetic-*
          path: .
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r docs/requirements.txt
      - name: Test evidence publication safeguards
        run: python -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Generate study pages from this run's evidence
        run: python .github/scripts/build_study_docs.py
      - name: Check ASCII-only sources and generated pages
        run: python .github/scripts/check_ascii.py
      - name: Build strict MkDocs site with current landing-page metrics
        run: python -m mkdocs build --strict
      - name: Install browser checks
        run: |
          python -m pip install -r .github/tests/dashboard/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Check dashboard modules and reviewer workflows
        run: bash .github/scripts/check_dashboard.sh site
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: dashboard-browser-failure
          path: .build/dashboard-browser/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: pilot7-site
          path: site
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v3
        if: github.repository == 'RConsortium/submissions-pilot7-synthetic-data' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    name: Publish GitHub Pages
    if: github.repository == 'RConsortium/submissions-pilot7-synthetic-data' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: website
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
