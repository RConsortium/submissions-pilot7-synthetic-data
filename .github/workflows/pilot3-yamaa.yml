name: Pilot3 yamaa 0.5.0

on:
  pull_request:
    branches: [main]
    paths:
      - "submission-pilot3/spec/yamaa/**"
      - "submission-pilot3/project.yaml"
      - "submission-pilot3/program/adam/**"
      - "submission-pilot3/data/**"
      - ".github/workflows/pilot3-yamaa.yml"
  push:
    branches: [main]
    paths:
      - "submission-pilot3/spec/yamaa/**"
      - "submission-pilot3/project.yaml"
      - "submission-pilot3/program/adam/**"
      - "submission-pilot3/data/**"
      - ".github/workflows/pilot3-yamaa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pilot3-yamaa-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  released-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.1"
          use-public-rspm: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the released R package and study dependencies
        run: Rscript --vanilla submission-pilot3/program/adam/r/setup.R
      - name: Run the R project and compare every target
        run: |
          Rscript --vanilla submission-pilot3/program/adam/r/run.R
          Rscript --vanilla submission-pilot3/program/adam/r/compare.R
          cp submission-pilot3/log/yamaa-comparison.json submission-pilot3/log/yamaa-comparison-r.json
      - name: Check corrected rules, comparator failures and planning bytes
        run: Rscript --vanilla submission-pilot3/program/adam/r/tests.R
      - name: Install released Python dependencies
        run: pip install -r submission-pilot3/program/adam/python/requirements.txt
      - name: Verify the Python runner with both comparators
        run: |
          python3 -m unittest discover -s submission-pilot3/program/adam/python -p 'test_*.py'
          python3 submission-pilot3/program/adam/python/run.py
          python3 submission-pilot3/program/adam/python/compare.py
          Rscript --vanilla submission-pilot3/program/adam/r/compare.R
      - name: Preserve qualification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pilot3-yamaa-reports
          path: |
            submission-pilot3/log/yamaa-*.json
            submission-pilot3/log/yamaa-*.csv
            submission-pilot3/log/yamaa-*.txt
