name: Synthetic study development checks

on:
  workflow_call:
    inputs:
      study:
        type: string
        required: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      STUDY: ${{ inputs.study }}
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: '**/program/adam/python/requirements.txt'
      - uses: dtolnay/rust-toolchain@1.99.1
      - name: Install the pinned development engine and independent readers
        run: python -m pip install -r "$STUDY/program/adam/python/requirements.txt"
      - name: Build SDTM, ADaM and Define-XML and measure review findings
        run: python .github/scripts/validate_yamaa.py "$STUDY"
      - name: Stage exact outputs and build evidence
        run: python .github/scripts/synthetic_evidence.py --stage "$STUDY"
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-${{ inputs.study }}
          path: .build/synthetic-artifact/
          include-hidden-files: true
          if-no-files-found: error
