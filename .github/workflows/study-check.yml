name: Study checks

on:
  workflow_call:
    inputs:
      study:
        type: string
        required: true
      yamaa:
        type: boolean
        default: false
      core:
        type: boolean
        default: false
      r:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate ${{ inputs.study }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      STUDY: ${{ inputs.study }}
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_RELEASE_OPT_LEVEL: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: ${{ (inputs.yamaa || inputs.r) && hashFiles(format('{0}/spec/yamaa/project.yaml', inputs.study)) != '' && 'pip' || '' }}
          cache-dependency-path: '**/program/adam/python/requirements.txt'
      # CORE reads the committed datasets before derivation runners save outputs.
      - name: Install CORE conversion tools
        if: inputs.core
        run: python -m pip install pyarrow pandas pyreadstat
      - uses: actions/cache@v5
        if: inputs.core
        with:
          path: .build/core-bin
          key: cdisc-core-${{ runner.os }}-${{ hashFiles('.github/scripts/run_core.py') }}
      - name: Validate and stage CORE reports
        if: inputs.core
        run: python .github/scripts/run_core.py "$STUDY" --output staging
      - uses: actions/upload-artifact@v5
        if: always() && inputs.core
        with:
          name: core-reports-${{ inputs.study }}
          path: staging/
          if-no-files-found: error
          retention-days: 90
      - uses: dtolnay/rust-toolchain@1.90.0
        if: (inputs.yamaa || inputs.r) && hashFiles(format('{0}/spec/yamaa/project.yaml', inputs.study)) != ''
      - name: Install pinned engine and comparison tools
        if: (inputs.yamaa || inputs.r) && hashFiles(format('{0}/spec/yamaa/project.yaml', inputs.study)) != ''
        run: python -m pip install --config-settings build-args=--profile=dev -r "$STUDY/program/adam/python/requirements.txt"
      - name: Check, build, compare, and record evidence
        if: inputs.yamaa
        run: python .github/scripts/validate_yamaa.py "$STUDY"
      - name: Check resolved specification publication contracts
        if: inputs.yamaa && hashFiles(format('{0}/spec/yamaa/project.yaml', inputs.study)) != ''
        run: python -m unittest discover -s .github/tests/dashboard -p 'test_specifications.py' -v
      - name: Check original-value comparison policy
        if: inputs.yamaa && hashFiles(format('{0}/spec/yamaa/project.yaml', inputs.study)) != ''
        run: python -m unittest discover -s .github/tests/dashboard -p 'test_comparison_policy.py' -v
      - uses: actions/upload-artifact@v4
        if: always() && inputs.yamaa
        with:
          name: validation-${{ inputs.study }}
          path: .build/validation/${{ inputs.study }}.json
          include-hidden-files: true
          if-no-files-found: error
      # Datasets with committed review claims are verified here, where the pinned
      # engine runs their probes; publication only checks and shows the report.
      - name: Install document readers for derivation verification
        if: inputs.yamaa && hashFiles(format('{0}/spec/review/*-claims.json', inputs.study)) != ''
        run: python -m pip install -r docs/requirements.txt
      - name: Verify reviewed derivations against the submission documents
        if: inputs.yamaa && hashFiles(format('{0}/spec/review/*-claims.json', inputs.study)) != ''
        run: |
          python .github/scripts/verify_derivations.py "$STUDY" --reviewed
          mkdir -p ".build/verification-artifact/$STUDY"
          cp ".build/verification/$STUDY/report.json" ".build/verification/$STUDY/report.md" ".build/verification-artifact/$STUDY/"
      - uses: actions/upload-artifact@v4
        if: inputs.yamaa && hashFiles(format('{0}/spec/review/*-claims.json', inputs.study)) != ''
        with:
          name: verification-${{ inputs.study }}
          path: .build/verification-artifact/
          include-hidden-files: true
          if-no-files-found: error
      - name: Stage verified generated datasets for publication
        if: inputs.yamaa
        run: python .github/scripts/stage_study_artifacts.py "$STUDY"
      - uses: actions/upload-artifact@v4
        if: inputs.yamaa && hashFiles(format('{0}/spec/yamaa/project.yaml', inputs.study)) != ''
        with:
          name: derived-${{ inputs.study }}
          path: .build/derived/
          include-hidden-files: true
          if-no-files-found: error
      - uses: r-lib/actions/setup-r@v2
        if: inputs.r
        with:
          r-version: '4.6.1'
          use-public-rspm: true
      - uses: actions/cache@v5
        id: r-cache
        if: inputs.r
        with:
          path: .build/r-library
          key: yamaa-r-${{ runner.os }}-${{ runner.arch }}-4.6.1-${{ hashFiles(format('{0}/program/adam/python/requirements.txt', inputs.study), '.github/workflows/study-check.yml') }}
      - name: Build the R package at the study's engine pin
        if: inputs.r && steps.r-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          revision=$(python -c 'import sys; from pathlib import Path; sys.path.insert(0, ".github/scripts"); from study_evidence import engine_revision; import os; print(engine_revision(Path.cwd(), os.environ["STUDY"]))')
          git init .build/yamaa-r-source
          git -C .build/yamaa-r-source remote add origin https://github.com/elong0527/yamaa.git
          git -C .build/yamaa-r-source fetch --depth=1 origin "$revision"
          git -C .build/yamaa-r-source checkout --detach FETCH_HEAD
          python -m pip install py-yaml12==0.2.0
          (cd .build/yamaa-r-source && python -m tools.staging.stage_r_package "$GITHUB_WORKSPACE/.build/yamaa-r-package")
          mkdir -p .build/r-library
          R CMD INSTALL --library=.build/r-library .build/yamaa-r-package
      - name: Run the R program and compare with official references
        if: inputs.r
        shell: bash
        run: |
          mkdir -p .build/validation
          R_LIBS="$PWD/.build/r-library" Rscript --vanilla "$STUDY/program/adam/R/run.R" | tee ".build/validation/r-$STUDY.log"
          python "$STUDY/program/adam/python/compare.py" | tee -a ".build/validation/r-$STUDY.log"
      - uses: actions/upload-artifact@v4
        if: always() && inputs.r
        with:
          name: validation-r-${{ inputs.study }}
          path: .build/validation/r-${{ inputs.study }}.log
          include-hidden-files: true
          if-no-files-found: error
