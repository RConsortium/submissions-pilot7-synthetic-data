site_name: Pilot 7 - Agentic data standardization
site_description: Pilot 7 uses publicly available pilot studies and synthetic clinical trial data to demonstrate and evaluate agentic workflows for clinical data standardization.
site_url: https://rconsortium.github.io/submissions-pilot7-synthetic-data/
repo_url: https://github.com/RConsortium/submissions-pilot7-synthetic-data
repo_name: RConsortium / Pilot 7
edit_uri: edit/main/docs/
copyright: R Consortium Submissions Working Group - Pilot 7
docs_dir: docs
site_dir: site
exclude_docs: |
  requirements.txt
  assets/dashboard/package.json
  overrides/

theme:
  name: material
  custom_dir: docs/overrides
  font: false
  icon:
    logo: material/flask-outline
    repo: fontawesome/brands/github
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.sections
    - navigation.top
    # Review fragments own state; heading tracking would overwrite shared views.
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css
  - stylesheets/dashboard.css
  - stylesheets/phmpt.css

extra_javascript:
  - path: assets/dashboard/app.js
    type: module
  - path: assets/phmpt/review.js
    type: module

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

plugins:
  - search

hooks:
  - .github/scripts/dashboard_nav.py
  - .github/scripts/build_index_table.py

nav:
  - Home: index.md
  - Pilot studies:
      - Pilot study report: studies/index.md
  - Synthetic studies:
      - Synthetic data report: synthetic/index.md
      - KN189: studies/kn189.md
      - KN564: studies/kn564.md
      - CAR-T for ALL: studies/cart-t.md
  - PHMPT reproduction:
      - Overview: phmpt/index.md
      - Glossary: phmpt/glossary.md
      - Findings: phmpt/findings/index.md
      - mRNA-1273-P201: phmpt/findings/mrna-1273-p201.md
      - mRNA-1273-P301: phmpt/findings/mrna-1273-p301.md
      - BNT162-01: phmpt/findings/bnt162-01.md
      - C4591001: phmpt/findings/c4591001.md
      - Inputs outside the analysis set: phmpt/findings/inputs.md
      - Define-XML against the data: phmpt/findings/define-data.md
      - Module 5 coverage: phmpt/coverage.md
      - Review a finding: phmpt/review/index.md
  - Review guide: review/index.md
