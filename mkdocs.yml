site_name: Pilot 7 - Agentic data standardization
site_description: Pilot 7 uses publicly available pilot studies and synthetic clinical trial data to demonstrate and evaluate agentic workflows for clinical data standardization.
site_url: https://rconsortium.github.io/submissions-pilot7-synthetic-data/
repo_url: https://github.com/RConsortium/submissions-pilot7-synthetic-data
repo_name: RConsortium / Pilot 7
edit_uri: edit/main/docs/
copyright: R Consortium Submissions Working Group - Pilot 7
docs_dir: docs
site_dir: site
exclude_docs: |
  requirements.txt
  assets/dashboard/package.json

theme:
  name: material
  font: false
  icon:
    logo: material/flask-outline
    repo: fontawesome/brands/github
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.sections
    - navigation.top
    # Review fragments own state; heading tracking would overwrite shared views.
    - search.highlight
    - toc.follow
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css
  - stylesheets/dashboard.css

extra_javascript:
  - path: assets/dashboard/app.js
    type: module

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

plugins:
  - search

hooks:
  - .github/scripts/dashboard_nav.py
  - .github/scripts/build_index_table.py

nav:
  - Home: index.md
  - Pilot studies:
      - Study report: studies/index.md
  - Synthetic data:
      - Synthetic report: synthetic/index.md
      - KN189: studies/kn189.md
      - KN564: studies/kn564.md
  - Review guide: review.md
  - Verification policy: verification.md
