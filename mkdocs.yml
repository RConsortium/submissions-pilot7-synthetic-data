site_name: Pilot 7 · Synthetic Clinical Data
site_description: Reusable clinical trial data and reproducible SDTM-to-ADaM derivations from the R Consortium Submissions Working Group.
site_url: https://rconsortium.github.io/submissions-pilot7-synthetic-data/
repo_url: https://github.com/RConsortium/submissions-pilot7-synthetic-data
repo_name: RConsortium / Pilot 7
edit_uri: edit/main/docs/
copyright: R Consortium Submissions Working Group · Pilot 7
docs_dir: docs
site_dir: site
exclude_docs: |
  requirements.txt

theme:
  name: material
  font: false
  icon:
    logo: material/flask-outline
    repo: fontawesome/brands/github
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - toc.follow
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

plugins:
  - search

nav:
  - Home: index.md
  - Studies:
      - Study verification: studies/index.md
      - CDISC Pilot 01: studies/cdiscpilot01.md
      - Submission Pilot 3: studies/submission-pilot3.md
      - Submission Pilot 5: studies/submission-pilot5.md
      - Submission Pilot 6: studies/submission-pilot6.md
  - Run the derivations: running.md
  - Verification policy: verification.md
  - Data and provenance: data.md
  - Join the project: contributing.md
