# Shared submitted ADSL demographics. Clinical rules remain study-specific.
# Paths are anchored to the study entry, not to this library directory.
yamaa: "1.0"
type: spec
model: ADaM
keys:
  - STUDYID
  - USUBJID
input:
  DM:
    path: ../../data/sdtm/dm.parquet
    relative_to: entry
base: DM

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: DM.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: DM.USUBJID

  - name: SUBJID
    type: str
    label: Subject Identifier for the Study
    derivation: DM.SUBJID

  - name: SITEID
    type: str
    label: Study Site Identifier
    derivation: DM.SITEID

  - name: ARM
    type: str
    label: Description of Planned Arm
    derivation: DM.ARM

  - name: TRT01P
    type: str
    label: Planned Treatment for Period 01
    derivation: DM.ARM

  - name: AGE
    type: float
    label: Age
    derivation: DM.AGE

  - name: AGEU
    type: str
    label: Age Units
    derivation: DM.AGEU

  - name: RACE
    type: str
    label: Race
    derivation: DM.RACE

  - name: SEX
    type: str
    label: Sex
    derivation: DM.SEX

  - name: ETHNIC
    type: str
    label: Ethnicity
    derivation: DM.ETHNIC

  - name: RFSTDTC
    type: str
    label: Subject Reference Start Date/Time
    derivation: DM.RFSTDTC
