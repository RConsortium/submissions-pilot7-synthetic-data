# Shared subject contract for SDTM-to-ADaM consumers.
# Only selected output columns survive composition; study overrides stay
# explicit.
yamaa: "1.0"
type: spec
model: ADaM
input:
  ADSL:
    path: ../../data/adam/adsl-yamaa.parquet
    relative_to: entry
    schema: adsl.yaml
    key:
      - STUDYID
      - USUBJID

columns:
  - copy:
      dataset: ADSL
      columns:
        - SUBJID
        - SITEID
        - SITEGR1
        - TRTSDT
        - TRTEDT
        - AGE
        - AGEGR1
        - AGEGR1N
        - RACE
        - RACEN
        - SEX
        - SAFFL
        - ITTFL
        - EFFFL
        - COMP24FL
        - DSRAEFL

  - name: TRTP
    type: str
    label: Planned Treatment
    derivation: ADSL.TRT01P

  - name: TRTPN
    type: float
    label: Planned Treatment (N)
    derivation: ADSL.TRT01PN

  - name: TRTA
    type: str
    label: Actual Treatment
    derivation: ADSL.TRT01A

  - name: TRTAN
    type: float
    label: Actual Treatment (N)
    derivation: ADSL.TRT01AN
