# Pilot program ADADAS, version 3: what R Submission Pilot 5 changed from
# version 2. Pilot 5 resubmitted the Pilot 3 ADaM datasets as Dataset-JSON.
yamaa: "1.0"
type: spec
parent: adadas_v2.yaml

# Pilot 5 lists the records in key order (USUBJID, PARAMCD, AVISIT, ADT)
# instead of the order of Pilot 3's R program.
output:
  path: ../../data/adam/adadas-yamaa.parquet
  relative_to: entry
  columns:
    - STUDYID
    - SITEID
    - SITEGR1
    - USUBJID
    - TRTSDT
    - TRTEDT
    - TRTP
    - TRTPN
    - AGE
    - AGEGR1
    - AGEGR1N
    - RACE
    - RACEN
    - SEX
    - ITTFL
    - EFFFL
    - COMP24FL
    - AVISIT
    - AVISITN
    - VISIT
    - VISITNUM
    - ADY
    - ADT
    - PARAM
    - PARAMCD
    - PARAMN
    - AVAL
    - BASE
    - CHG
    - PCHG
    - ABLFL
    - ANL01FL
    - DTYPE
    - AWRANGE
    - AWTARGET
    - AWTDIFF
    - AWLO
    - AWHI
    - AWU
    - QSSEQ
  order_by:
    - variable: USUBJID
      nulls: last
    - variable: PARAMCD
      nulls: last
    - variable: AVISIT
      nulls: last
    - variable: ADT
      nulls: last
