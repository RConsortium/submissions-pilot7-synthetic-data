# Pilot program ADLBC, version 3: what R Submission Pilot 3 changed from
# version 1, and the Define-XML 2.0 metadata that Pilots 3 and 5 share. Pilot
# 5 resubmitted the Pilot 3 ADaM datasets as Dataset-JSON.
yamaa: "1.0"
type: spec
parent: adlbc_v1.yaml
# Pilot 3 keeps the laboratory record order, End of Treatment rows last,
# instead of sorting by subject, study day, parameter and visit.
clear:
  - output.order_by

columns:
  - name: STUDYID
    submission:
      data_type: text
      mandatory: false
      length: 12
      origins:
        - type: Predecessor
          description: ADSL.STUDYID

  - name: SUBJID
    submission:
      data_type: text
      mandatory: false
      length: 4
      origins:
        - type: Predecessor
          description: ADSL.SUBJID

  - name: USUBJID
    submission:
      data_type: text
      mandatory: false
      key_sequence: 1
      length: 11
      origins:
        - type: Predecessor
          description: ADSL.USUBJID

  - name: TRTP
    submission:
      data_type: text
      mandatory: false
      length: 20
      codelist: ARM
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADLBC.TRTP
        description: ADSL.TRT01P

  - name: TRTPN
    submission:
      data_type: integer
      mandatory: false
      length: 8
      codelist: ARMN
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADLBC.TRTPN
        description: ADSL.TRT01PN

  - name: TRTA
    submission:
      data_type: text
      mandatory: false
      length: 20
      codelist: ARM
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADLBC.TRTA
        description: ADSL.TRT01A

  - name: TRTAN
    submission:
      data_type: integer
      mandatory: false
      length: 8
      codelist: ARMN
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADLBC.TRTAN
        description: ADSL.TRT01AN

  - name: TRTSDT
    submission:
      data_type: integer
      mandatory: false
      length: 8
      display_format: DATE9.
      origins:
        - type: Predecessor
          description: ADSL.TRTSDT

  - name: TRTEDT
    submission:
      data_type: integer
      mandatory: false
      length: 8
      display_format: DATE9.
      origins:
        - type: Predecessor
          description: ADSL.TRTEDT

  - name: AGE
    submission:
      data_type: integer
      mandatory: false
      length: 8
      origins:
        - type: Predecessor
          description: ADSL.AGE

  - name: AGEGR1
    submission:
      data_type: text
      mandatory: false
      length: 5
      codelist: AGEGR1
      origins:
        - type: Predecessor
          description: ADSL.AGEGR1

  - name: AGEGR1N
    submission:
      data_type: integer
      mandatory: false
      length: 8
      codelist: AGEGR1N
      origins:
        - type: Predecessor
          description: ADSL.AGEGR1N

  - name: RACE
    submission:
      data_type: text
      mandatory: false
      length: 32
      codelist: RACE
      origins:
        - type: Predecessor
          description: ADSL.RACE

  - name: RACEN
    submission:
      data_type: integer
      mandatory: false
      length: 8
      codelist: RACEN
      origins:
        - type: Predecessor
          description: ADSL.RACEN

  - name: SEX
    submission:
      data_type: text
      mandatory: false
      length: 1
      codelist: SEX
      origins:
        - type: Predecessor
          description: ADSL.SEX

  - name: COMP24FL
    submission:
      data_type: text
      mandatory: false
      length: 1
      codelist: YN
      origins:
        - type: Predecessor
          description: ADSL.COM01P24FL

  - name: DSRAEFL
    submission:
      data_type: text
      mandatory: false
      length: 1
      codelist: YN
      origins:
        - type: Predecessor
          description: ADSL.DSR01AEFL

  - name: SAFFL
    submission:
      data_type: text
      mandatory: false
      length: 1
      codelist: YN
      origins:
        - type: Predecessor
          description: ADSL.SAF01FL

  - name: AVISIT
    submission:
      data_type: text
      mandatory: false
      key_sequence: 3
      length: 16
      codelist: AVISIT
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADLBC.AVISIT
        description: "Last observed value for this lab parameter during
          treatment phase: 'Y' if VISITNUM=12,
          if subject discontinues prior to VISIT 12,
          then this variable is set to 'Y' if this is the
          last assessment of this analyte for the subject"

  - name: AVISITN
    submission:
      data_type: integer
      mandatory: false
      length: 8
      codelist: AVISITN
      origins:
        - type: Assigned

  - name: ADY
    submission:
      data_type: integer
      mandatory: false
      length: 8
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADLBC.ADY
        description: LB.LBDY

  - name: ADT
    submission:
      data_type: integer
      mandatory: false
      length: 8
      display_format: DATE9.
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADLBC.ADT
        description: LB.LBDTC

  - name: VISIT
    submission:
      data_type: text
      mandatory: false
      length: 19
      codelist: VISIT
      origins:
        - type: Predecessor
          description: LB.VISIT

  - name: VISITNUM
    submission:
      data_type: float
      mandatory: false
      length: 8
      significant_digits: 1
      codelist: VISITNUM
      origins:
        - type: Predecessor
          description: LB.VISITNUM

  - name: PARAM
    submission:
      data_type: text
      mandatory: false
      length: 100
      codelist: PARAM_ADLBC
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADLBC.PARAM
        description: Concatenated LB.LBTEST, '(', LB.LBSTRESU and ')'

  - name: PARAMCD
    submission:
      data_type: text
      mandatory: false
      key_sequence: 2
      length: 8
      codelist: PARAMCD_ADLBC
      origins:
        - type: Predecessor
          description: LB.TESTCD

  - name: PARAMN
    submission:
      data_type: integer
      mandatory: false
      length: 8
      codelist: PARAMN_ADLBC
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADLBC.PARAMN
        description: Numeric code for Parameter

  - name: PARCAT1
    submission:
      data_type: text
      mandatory: false
      length: 5
      codelist: ADLBCAT
      origins:
        - type: Assigned

  - name: AVAL
    submission:
      data_type: float
      mandatory: false
      length: 8
      significant_digits: 5
      origins:
        - type: Predecessor
          description: LB.LBSTRESN

  - name: BASE
    submission:
      data_type: float
      mandatory: false
      length: 8
      significant_digits: 5
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADLBC.BASE
        description: LB.LBSTNRHI

  - name: CHG
    submission:
      data_type: float
      mandatory: false
      length: 8
      significant_digits: 5
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADLBC.CHG
        description: AVAL - BASE

  - name: A1LO
    submission:
      data_type: float
      mandatory: false
      length: 8
      significant_digits: 5
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADLBC.A1LO
        description: LB.LBSTNRLO

  - name: A1HI
    submission:
      data_type: float
      mandatory: false
      length: 8
      significant_digits: 5
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADLBC.A1HI
        description: LB.LBSTNRHI

  - name: R2A1LO
    submission:
      data_type: float
      mandatory: false
      length: 8
      significant_digits: 1
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADLBC.R2A1LO
        description: AVAL / A1LO

  - name: R2A1HI
    submission:
      data_type: float
      mandatory: false
      length: 8
      significant_digits: 1
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADLBC.R2A1HI
        description: AVAL / A1HI

  - name: BR2A1LO
    submission:
      data_type: float
      mandatory: false
      length: 8
      significant_digits: 1
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADLBC.BR2A1LO
        description: AVAL / A1LO at baseline

  - name: BR2A1HI
    submission:
      data_type: float
      mandatory: false
      length: 8
      significant_digits: 1
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADLBC.BR2A1HI
        description: AVAL / A1HI at baseline

  # Pilot 3 label; CDISC Pilot 01: Analysis Record Flag 1.
  - name: ANL01FL
    label: Analysis Flag 01
    submission:
      data_type: text
      mandatory: false
      length: 1
      origins:
        - type: Assigned
      method:
        name: Algorithm to derive ADLBC.ANL01FL
        description: If ALBTRVAL = max(ALBTRVAL) then ANL01FL is 'Y'

  - name: ALBTRVAL
    submission:
      data_type: float
      mandatory: false
      length: 8
      significant_digits: 3
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADLBC.ALBTRVAL
        description: Maximum of [LBSTRESN-(1.5*ULN)] and [(.5*LLN) - LBSTRESN]

  - name: ANRIND
    submission:
      data_type: text
      mandatory: false
      length: 1
      codelist: LNH
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADLBC.ANRIND
        description: if AVAL < [0.5*LBSTNRLO) then ANRIND =
          'Y' else if AVAL > [0.5*LBSTRNHI),'H','N'

  - name: BNRIND
    submission:
      data_type: text
      mandatory: false
      length: 1
      codelist: LNH
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADLBC.BNRIND
        description: if BASE < [0.5*LBSTNRLO) then ANRIND =
          'Y' else if BASE > [0.5*LBSTRNHI),'H','N'

  - name: ABLFL
    submission:
      data_type: text
      mandatory: false
      length: 1
      origins:
        - type: Predecessor
          description: LB.LBBLFL

  - name: AENTMTFL
    submission:
      data_type: text
      mandatory: false
      length: 1
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADLBC.AENTMTFL
        description: "Last observed value for this lab parameter during
          treatment phase: 'Y' if VISITNUM=12,
          if subject discontinues prior to VISIT 12,
          then this variable is set to 'Y' if this is the
          last assessment of this analyte for the subject"

  - name: LBSEQ
    submission:
      data_type: integer
      mandatory: false
      key_sequence: 4
      length: 8
      origins:
        - type: Predecessor
          description: LB.LBSEQ

  - name: LBNRIND
    submission:
      data_type: text
      mandatory: false
      length: 8
      codelist: LBNRIND
      origins:
        - type: Predecessor
          description: LB.LBNRIND

  - name: LBSTRESN
    submission:
      data_type: float
      mandatory: false
      length: 8
      significant_digits: 5
      origins:
        - type: Predecessor
          description: LB.LBSTRESN

rows:
  - id: base-ord
    derivations:
      # Pilot 3 writes visit names without SAS right-justification and
      # leaves an unscheduled visit blank, where CDISC Pilot 01 writes ".".
      AVISIT:
        case:
          - when: "LB.VISIT = 'SCREENING 1'"
            then: "'Baseline'"
          - when: "LB.VISIT = 'WEEK 2'"
            then: "'Week 2'"
          - when: "LB.VISIT = 'WEEK 4'"
            then: "'Week 4'"
          - when: "LB.VISIT = 'WEEK 6'"
            then: "'Week 6'"
          - when: "LB.VISIT = 'WEEK 8'"
            then: "'Week 8'"
          - when: "LB.VISIT = 'WEEK 12'"
            then: "'Week 12'"
          - when: "LB.VISIT = 'WEEK 16'"
            then: "'Week 16'"
          - when: "LB.VISIT = 'WEEK 20'"
            then: "'Week 20'"
          - when: "LB.VISIT = 'WEEK 24'"
            then: "'Week 24'"
          - when: "LB.VISIT = 'WEEK 26'"
            then: "'Week 26'"
          - otherwise: "''"
      # Pilot 3 rounds the visit number to one decimal place, so an
      # unscheduled visit read as 4.199999999999999 is 4.2, as its
      # codelist lists it. Scheduled visits, the only End of Treatment
      # sources, have whole visit numbers.
      VISITNUM:
        round_half_away_from_zero:
          source: LB.VISITNUM
          digits: 1
