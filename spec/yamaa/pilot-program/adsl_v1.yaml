# Pilot program ADSL, version 1: one record per randomized subject, as the
# CDISC Pilot 01 submission derives it.
#
# adsl_v2.yaml inherits this version and states what R Submission Pilot 3
# changed. Each study's entry inherits the version its package submitted, names
# the dataset and adds its own Define-XML metadata. Paths are written from an
# entry, so every study reads and writes its own data.
yamaa: "1.0"
type: spec
model: ADaM
keys:
  - STUDYID
  - USUBJID
input:
  DM:
    path: ../../data/sdtm/dm.parquet
    relative_to: entry
    empty_string: present
  EX:
    path: ../../data/sdtm/ex.parquet
    relative_to: entry
    empty_string: present
    key:
      - STUDYID
      - USUBJID
  VS:
    path: ../../data/sdtm/vs.parquet
    relative_to: entry
    empty_string: present
  SV:
    path: ../../data/sdtm/sv.parquet
    relative_to: entry
    empty_string: present
  DS:
    path: ../../data/sdtm/ds.parquet
    relative_to: entry
    empty_string: present
  QS:
    path: ../../data/sdtm/qs.parquet
    relative_to: entry
    empty_string: present
  SC:
    path: ../../data/sdtm/sc.parquet
    relative_to: entry
    empty_string: present
  MH:
    path: ../../data/sdtm/mh.parquet
    relative_to: entry
    empty_string: present
base: DM

output:
  path: ../../data/adam/adsl-yamaa.parquet
  relative_to: entry
  columns:
    - STUDYID
    - USUBJID
    - SUBJID
    - SITEID
    - SITEGR1
    - ARM
    - TRT01P
    - TRT01PN
    - TRT01A
    - TRT01AN
    - TRTSDT
    - TRTEDT
    - TRTDUR
    - AVGDD
    - CUMDOSE
    - AGE
    - AGEGR1
    - AGEGR1N
    - AGEU
    - RACE
    - RACEN
    - SEX
    - ETHNIC
    - SAFFL
    - ITTFL
    - EFFFL
    - COMP8FL
    - COMP16FL
    - COMP24FL
    - DISCONFL
    - DSRAEFL
    - DTHFL
    - BMIBL
    - BMIBLGR1
    - HEIGHTBL
    - WEIGHTBL
    - EDUCLVL
    - DISONSDT
    - DURDIS
    - DURDSGR1
    - VISIT1DT
    - RFSTDTC
    - RFENDTC
    - VISNUMEN
    - RFENDT
    - DCDECOD
    - DCREASCD
    - MMSETOT
  order_by:
    - variable: USUBJID
      nulls: last

intermediates:
  - id: BASE_HT
    dataset: VS
    key:
      - STUDYID
      - USUBJID
    filter: "VS.VSTESTCD = 'HEIGHT'"
    order_by:
      - variable: VS.VISITNUM
        nulls: last
    keep: first

  - id: BASE_WT
    dataset: VS
    key:
      - STUDYID
      - USUBJID
    filter: "VS.VSTESTCD = 'WEIGHT' AND VS.VSBLFL = 'Y'"
    order_by:
      - variable: VS.VISITNUM
        nulls: last
    keep: first

  - id: LAST_EX
    dataset: EX
    key:
      - STUDYID
      - USUBJID
    order_by:
      - variable: EX.EXSEQ
        nulls: last
    keep: last

  - id: SV1
    dataset: SV
    key:
      - STUDYID
      - USUBJID
    filter: "SV.VISITNUM = 1"
    order_by:
      - variable: SV.VISITNUM
        nulls: last
    keep: first

  - id: SV8
    dataset: SV
    key:
      - STUDYID
      - USUBJID
    filter: "SV.VISITNUM = 8"
    order_by:
      - variable: SV.VISITNUM
        nulls: last
    keep: first

  - id: SV10
    dataset: SV
    key:
      - STUDYID
      - USUBJID
    filter: "SV.VISITNUM = 10"
    order_by:
      - variable: SV.VISITNUM
        nulls: last
    keep: first

  - id: SV12
    dataset: SV
    key:
      - STUDYID
      - USUBJID
    filter: "SV.VISITNUM = 12"
    order_by:
      - variable: SV.VISITNUM
        nulls: last
    keep: first

  - id: DS_DISP
    dataset: DS
    key:
      - STUDYID
      - USUBJID
    filter: "DS.DSCAT = 'DISPOSITION EVENT'"
    order_by:
      - variable: DS.DSSEQ
        nulls: last
    keep: first

  - id: SC_EDU
    dataset: SC
    key:
      - STUDYID
      - USUBJID
    filter: "SC.SCTESTCD = 'EDLEVEL'"
    order_by:
      - variable: SC.SCSEQ
        nulls: last
    keep: first

  - id: MH_DX
    dataset: MH
    key:
      - STUDYID
      - USUBJID
    filter: "MH.MHCAT = 'PRIMARY DIAGNOSIS'"
    order_by:
      - variable: MH.MHSEQ
        nulls: last
    keep: first

  - id: QS_ADAS
    dataset: QS
    key:
      - STUDYID
      - USUBJID
    filter: "QS.QSCAT = 'ALZHEIMER''S DISEASE ASSESSMENT SCALE'
      AND QS.VISITNUM > 3"
    order_by:
      - variable: QS.VISITNUM
        nulls: last
    keep: first

  - id: QS_CIBIC
    dataset: QS
    key:
      - STUDYID
      - USUBJID
    filter: "QS.QSCAT =
      'CLINICIAN''S INTERVIEW-BASED IMPRESSION OF CHANGE (CIBIC+)'
      AND QS.VISITNUM > 3"
    order_by:
      - variable: QS.VISITNUM
        nulls: last
    keep: first

  - id: QS_MMSE
    dataset: QS
    key:
      - STUDYID
      - USUBJID
    filter: "QS.QSCAT = 'MINI-MENTAL STATE'"

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: DM.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: DM.USUBJID

  - name: SUBJID
    type: str
    label: Subject Identifier for the Study
    derivation: DM.SUBJID

  - name: SITEID
    type: str
    label: Study Site Identifier
    derivation: DM.SITEID

  - name: SITEGR1
    type: str
    label: Pooled Site Group 1
    derivation:
      case:
        - when: "DM.SITEID IN ('702','706','707','711','714','715','717')"
          then: "'900'"
        - otherwise: DM.SITEID

  - name: ARM
    type: str
    label: Description of Planned Arm
    derivation: DM.ARM

  - name: TRT01P
    type: str
    label: Planned Treatment for Period 01
    derivation: DM.ARM

  - name: TRT01PN
    type: float
    label: Planned Treatment for Period 01 (N)
    derivation:
      mapping:
        source: DM.ARM
        dict:
          Placebo: 0
          Xanomeline Low Dose: 54
          Xanomeline High Dose: 81

  - name: TRT01A
    type: str
    label: Actual Treatment for Period 01
    derivation: DM.ARM

  - name: TRT01AN
    type: float
    label: Actual Treatment for Period 01 (N)
    derivation:
      mapping:
        source: DM.ARM
        dict:
          Placebo: 0
          Xanomeline Low Dose: 54
          Xanomeline High Dose: 81

  - name: EX_MINDTC
    type: str
    label: Earliest Exposure Start (character)
    derivation:
      aggregate: "MIN(EX.EXSTDTC)"

  - name: TRTSDT
    type: date
    label: Date of First Exposure to Treatment
    derivation:
      impute:
        type: date
        source: EX_MINDTC
        month: 1
        day: 1
        invalid:

  - name: TRTEDT
    type: date
    label: Date of Last Exposure to Treatment
    derivation:
      case:
        - when: "LAST_EX.EXENDTC IS NULL OR LAST_EX.EXENDTC = ''"
          then:
            impute:
              type: date
              source: DS_DISP.DSSTDTC
              month: 1
              day: 1
              invalid:
        - otherwise:
            impute:
              type: date
              source: LAST_EX.EXENDTC
              month: 1
              day: 1
              invalid:

  - name: TRTDUR
    type: float
    label: Duration of Treatment (days)
    derivation:
      diff:
        type: date
        start: TRTSDT
        end: TRTEDT
        unit: day
        closed: both

  - name: CUMDOSE_BASE
    type: float
    label: Cumulative dose from complete EX records
    derivation:
      aggregate: "SUM(EX.EXDOSE * (EX.EXENDY - EX.EXSTDY + 1))"

  - name: LAST_EXSTDTC_DT
    type: date
    label: Last Exposure Start (date)
    derivation:
      impute:
        type: date
        source: LAST_EX.EXSTDTC
        month: 1
        day: 1
        invalid:

  - name: LAST_EX_DAYS
    type: float
    label: Days on last EX record if end blank, else 0
    derivation:
      case:
        - when: "TRTEDT IS NULL OR LAST_EXSTDTC_DT IS NULL"
          then: 0
        - when: "LAST_EX.EXENDTC IS NULL OR LAST_EX.EXENDTC = ''"
          then:
            diff:
              type: date
              start: LAST_EXSTDTC_DT
              end: TRTEDT
              unit: day
              closed: both
        - otherwise: 0

  - name: _CUM0
    type: float
    label: _CUM0 (helper)
    derivation:
      case:
        - when: CUMDOSE_BASE IS NULL
          then: 0
        - otherwise: CUMDOSE_BASE

  - name: _DOSE0
    type: float
    label: _DOSE0 (helper)
    derivation:
      case:
        - when: LAST_EX.EXDOSE IS NULL
          then: 0
        - otherwise: LAST_EX.EXDOSE

  - name: CUMDOSE
    type: float
    label: Cumulative Dose (as planned)
    derivation: "_CUM0 + _DOSE0 * LAST_EX_DAYS"

  - name: AVGDD_RAW
    type: float
    label: Avg Daily Dose unrounded
    derivation: "CUMDOSE / NULLIF(TRTDUR, 0)"

  - name: AVGDD
    type: float
    label: Avg Daily Dose (as planned)
    derivation:
      round_half_away_from_zero:
        source: AVGDD_RAW
        digits: 1

  - name: AGE
    type: float
    label: Age
    derivation: DM.AGE

  - name: AGEGR1
    type: str
    label: Pooled Age Group 1
    derivation:
      case:
        - when: "DM.AGE < 65"
          then: "'<65'"
        - when: "DM.AGE <= 80"
          then: "'65-80'"
        - otherwise: "'>80'"

  - name: AGEGR1N
    type: float
    label: Pooled Age Group 1 (N)
    derivation:
      mapping:
        source: AGEGR1
        dict:
          "<65": 1
          "65-80": 2
          ">80": 3

  - name: AGEU
    type: str
    label: Age Units
    derivation: DM.AGEU

  - name: RACE
    type: str
    label: Race
    derivation: DM.RACE

  - name: RACEN
    type: float
    label: Race (N)
    derivation:
      mapping:
        source: DM.RACE
        dict:
          WHITE: 1
          BLACK OR AFRICAN AMERICAN: 2
          AMERICAN INDIAN OR ALASKA NATIVE: 6

  - name: SEX
    type: str
    label: Sex
    derivation: DM.SEX

  - name: ETHNIC
    type: str
    label: Ethnicity
    derivation: DM.ETHNIC

  - name: ITTFL
    type: str
    label: Intent-To-Treat Population Flag
    derivation:
      case:
        - when: "DM.ARMCD <> ''"
          then: "'Y'"
        - otherwise: "'N'"

  - name: SAFFL
    type: str
    label: Safety Population Flag
    derivation:
      case:
        - when: "ITTFL = 'Y' AND TRTSDT IS NOT NULL"
          then: "'Y'"
        - otherwise: "'N'"

  - name: EFFFL
    type: str
    label: Efficacy Population Flag
    derivation:
      case:
        - when: "SAFFL = 'Y' AND QS_ADAS.QSSEQ IS NOT NULL
            AND QS_CIBIC.QSSEQ IS NOT NULL"
          then: "'Y'"
        - otherwise: "'N'"

  - name: SV8DT
    type: date
    label: Visit 8 date
    derivation:
      impute:
        type: date
        source: SV8.SVSTDTC
        month: 1
        day: 1
        invalid:

  - name: RFSTDTC
    type: str
    label: Subject Reference Start Date/Time
    derivation: DM.RFSTDTC

  - name: RFENDTC
    type: str
    label: Subject Reference End Date/Time
    derivation: DM.RFENDTC

  - name: RFENDT
    type: date
    label: Date of Discontinuation/Completion
    derivation:
      impute:
        type: date
        source: RFENDTC
        month: 1
        day: 1
        invalid:

  - name: COMP8FL
    type: str
    label: Completers of Week 8 Population Flag
    derivation:
      case:
        - when: "SV8DT IS NOT NULL AND RFENDT >= SV8DT"
          then: "'Y'"
        - otherwise: "'N'"

  - name: SV10DT
    type: date
    label: Visit 10 date
    derivation:
      impute:
        type: date
        source: SV10.SVSTDTC
        month: 1
        day: 1
        invalid:

  - name: COMP16FL
    type: str
    label: Completers of Week 16 Population Flag
    derivation:
      case:
        - when: "SV10DT IS NOT NULL AND RFENDT >= SV10DT"
          then: "'Y'"
        - otherwise: "'N'"

  - name: SV12DT
    type: date
    label: Visit 12 date
    derivation:
      impute:
        type: date
        source: SV12.SVSTDTC
        month: 1
        day: 1
        invalid:

  - name: COMP24FL
    type: str
    label: Completers of Week 24 Population Flag
    derivation:
      case:
        - when: "SV12DT IS NOT NULL AND RFENDT >= SV12DT"
          then: "'Y'"
        - otherwise: "'N'"

  - name: DCDECOD
    type: str
    label: Standardized Disposition Term
    derivation: DS_DISP.DSDECOD

  - name: DCREASCD
    type: str
    label: Reason for Discontinuation
    derivation:
      case:
        - when: "DS_DISP.DSTERM = 'PROTOCOL ENTRY CRITERIA NOT MET'"
          then: "'I/E Not Met'"
        - otherwise:
            mapping:
              source: DCDECOD
              dict:
                ADVERSE EVENT: Adverse Event
                COMPLETED: Completed
                DEATH: Death
                LACK OF EFFICACY: Lack of Efficacy
                LOST TO FOLLOW-UP: Lost to Follow-up
                PHYSICIAN DECISION: Physician Decision
                PROTOCOL VIOLATION: Protocol Violation
                STUDY TERMINATED BY SPONSOR: Sponsor Decision
                WITHDRAWAL BY SUBJECT: Withdrew Consent

  - name: DISCONFL
    type: str
    label: Did the Subject Discontinue the Study?
    derivation:
      case:
        - when: "DCREASCD <> 'Completed'"
          then: "'Y'"
        - otherwise: "''"

  - name: DSRAEFL
    type: str
    label: Discontinued due to AE?
    derivation:
      case:
        - when: "DCREASCD = 'Adverse Event'"
          then: "'Y'"
        - otherwise: "''"

  - name: DTHFL
    type: str
    label: Subject Died?
    derivation: DM.DTHFL

  - name: HEIGHTBL
    type: float
    label: Baseline Height (cm)
    derivation:
      round_half_away_from_zero:
        source: BASE_HT.VSSTRESN
        digits: 1

  - name: WEIGHTBL
    type: float
    label: Baseline Weight (kg)
    derivation:
      round_half_away_from_zero:
        source: BASE_WT.VSSTRESN
        digits: 1

  - name: BMIBL_RAW
    type: float
    label: Baseline BMI unrounded
    derivation: "WEIGHTBL / POWER(NULLIF(HEIGHTBL, 0) / 100, 2)"

  - name: BMIBL
    type: float
    label: Baseline BMI (kg/m^2)
    derivation:
      round_half_away_from_zero:
        source: BMIBL_RAW
        digits: 1

  - name: BMIBLGR1
    type: str
    label: Pooled Baseline BMI Group 1
    derivation:
      case:
        - when: "BMIBL IS NULL"
          then: "'<25'"
        - when: "BMIBL < 25"
          then: "'<25'"
        - when: "BMIBL < 30"
          then: "'25-<30'"
        - otherwise: "'>=30'"

  - name: EDUCLVL
    type: float
    label: Years of Education
    derivation: SC_EDU.SCSTRESN

  - name: DISONSDT
    type: date
    label: Date of Onset of Disease
    derivation:
      impute:
        type: date
        source: MH_DX.MHSTDTC
        month: 1
        day: 1
        invalid:

  - name: VISIT1DT
    type: date
    label: Date of Visit 1
    derivation:
      impute:
        type: date
        source: SV1.SVSTDTC
        month: 1
        day: 1
        invalid:

  - name: DURDIS_DAYS
    type: float
    label: Disease duration days +1
    derivation:
      diff:
        type: date
        start: DISONSDT
        end: VISIT1DT
        unit: day
        closed: both

  - name: DURDIS_RAW
    type: float
    label: Duration of Disease (Months) unrounded
    derivation: "DURDIS_DAYS / 30.4375"

  - name: DURDIS
    type: float
    label: Duration of Disease (Months)
    derivation:
      round_half_away_from_zero:
        source: DURDIS_RAW
        digits: 1

  - name: DURDSGR1
    type: str
    label: Pooled Disease Duration Group 1
    derivation:
      case:
        - when: "DURDIS < 12"
          then: "'<12'"
        - otherwise: "'>=12'"

  - name: VISNUMEN
    type: float
    label: End of Trt Visit (Vis 12 or Early Term.)
    derivation:
      case:
        - when: "DS_DISP.VISITNUM = 13"
          then: 12
        - otherwise: DS_DISP.VISITNUM

  - name: MMSETOT
    type: float
    label: MMSE Total
    derivation:
      aggregate:
        expr: "SUM(QS.QSSTRESN)"
        filter: "QS.QSCAT = 'MINI-MENTAL STATE'"
        key:
          - STUDYID
          - USUBJID

rows:
  - id: treated-subjects
    dataset: DM
    filter: "DM.ACTARM <> 'Screen Failure'"
    derivations: {}
