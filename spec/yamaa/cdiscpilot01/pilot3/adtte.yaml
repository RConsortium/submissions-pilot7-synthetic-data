# R Submission Pilot 3 ADTTE: what Pilot 3 changed from the CDISC Pilot 01
# study layer, and the Define-XML 2.0 metadata that Pilots 3 and 5 share.
# Pilot 5 resubmitted the Pilot 3 ADaM datasets as Dataset-JSON.
yamaa: "1.0"
type: spec
parent: ../adtte.yaml

columns:
  - name: STUDYID
    submission:
      data_type: text
      mandatory: false
      length: 12
      origins:
        - type: Predecessor
          description: ADSL.STUDYID

  - name: USUBJID
    submission:
      data_type: text
      mandatory: false
      key_sequence: 1
      length: 11
      origins:
        - type: Predecessor
          description: ADSL.USUBJID

  # The Pilot 3 ADSL names the treatment duration TRTDURD.
  - name: TRTDUR
    derivation: ADSL.TRTDURD

  # Pilot 3 label; CDISC Pilot 01: Parameter Description.
  - name: PARAM
    label: Parameter
    submission:
      data_type: text
      mandatory: false
      length: 100
      codelist: PARAM_ADTTE
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADTTE.PARAM
        description: PARAM="Time to First Dermatologic Event"

  - name: PARAMCD
    submission:
      data_type: text
      mandatory: false
      key_sequence: 2
      length: 8
      codelist: PARAMCD_ADTTE
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADTTE.PARAMCD
        description: PARAMCD="TTDE"

  # Pilot 3 label; CDISC Pilot 01: Time to Event Origin Date for Subject.
  - name: STARTDT
    label: Time-to-Event Origin Date for Subject
    submission:
      data_type: integer
      mandatory: false
      length: 8
      display_format: DATE9.
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADTTE.STARTDT
        description: ADSL.RFSTDTC

  - name: ADT
    submission:
      data_type: integer
      mandatory: false
      length: 8
      display_format: DATE9.
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADTTE.ADT
        description: if ADAE.ASTDT is not missing and occurred after TRTSDT
          then ADAE.ASTDT else convert ADSL.RFENDTC to a SAS numeric date

  - name: CNSR
    submission:
      data_type: integer
      mandatory: false
      length: 8
      codelist: CENSOR
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADTTE.CNSR
        description: if ADAE.TRTEMFL ="Y" then CNSR=0, else CNSR=1

  - name: EVNTDESC
    submission:
      data_type: text
      mandatory: false
      length: 25
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADTTE.EVNTDESC
        description: if ADTTE.CNSR = 0 then "Dematologic Event Occured",
          else if ADTTE.CNSR =1 then "Study Completion Date"

  # Pilot 3 label; CDISC Pilot 01: Source Domain.
  - name: SRCDOM
    label: Source Data
    submission:
      data_type: text
      mandatory: false
      length: 4
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADTTE.SRCDOM
        description: The Source domain referred to in order
          to populate ADT (either ADAE or ADSL)

  - name: SRCVAR
    submission:
      data_type: text
      mandatory: false
      length: 6
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADTTE.SRCVAR
        description: The Source variable referred to in order
          to populate ADT (either ASTDT or RFENDT)

  - name: SRCSEQ
    submission:
      data_type: integer
      mandatory: false
      length: 8
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADTTE.SRCSEQ
        description: The value of ADAE.AESEQ if SRCDOM=ADAE, otherwise null.

  - name: AVAL
    submission:
      data_type: integer
      mandatory: false
      length: 8
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADTTE.AVAL
        description: ADT-STARTDT+1
