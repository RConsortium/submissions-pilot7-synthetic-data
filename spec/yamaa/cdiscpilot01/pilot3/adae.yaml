# R Submission Pilot 3 ADAE: what Pilot 3 changed from the CDISC Pilot 01
# study layer, and the Define-XML 2.0 metadata that Pilots 3 and 5 share.
# Pilot 5 resubmitted the Pilot 3 ADaM datasets as Dataset-JSON.
yamaa: "1.0"
type: spec
parent: ../adae.yaml
# Pilot 3 keeps the AE record order instead of sorting by subject and
# sequence number.
clear:
  - output.order_by

columns:
  - name: STUDYID
    submission:
      data_type: text
      mandatory: false
      length: 12
      origins:
        - type: Predecessor
          description: ADSL.STUDYID

  - name: SITEID
    submission:
      data_type: text
      mandatory: false
      length: 3
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADAE.SITEID
        description: ADSL.SITEID

  - name: USUBJID
    submission:
      data_type: text
      mandatory: false
      key_sequence: 1
      length: 11
      origins:
        - type: Predecessor
          description: ADSL.USUBJID

  - name: TRTA
    submission:
      data_type: text
      mandatory: false
      length: 20
      codelist: ARM
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADAE.TRTA
        description: ADSL.TRT01A

  - name: TRTAN
    submission:
      data_type: integer
      mandatory: false
      length: 8
      codelist: ARMN
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADAE.TRTAN
        description: ADSL.TRT01AN

  - name: AGE
    submission:
      data_type: integer
      mandatory: false
      length: 8
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADAE.AGE
        description: ADSL.AGE

  - name: AGEGR1
    submission:
      data_type: text
      mandatory: false
      length: 5
      codelist: AGEGR1
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADAE.AGEGR1
        description: ADSL.AGEGR1

  - name: AGEGR1N
    submission:
      data_type: integer
      mandatory: false
      length: 8
      codelist: AGEGR1N
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADAE.AGEGR1N
        description: ADSL.AGEGR1N

  - name: RACE
    submission:
      data_type: text
      mandatory: false
      length: 32
      codelist: RACE
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADAE.RACE
        description: ADSL.RACE

  - name: RACEN
    submission:
      data_type: integer
      mandatory: false
      length: 8
      codelist: RACEN
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADAE.RACEN
        description: ADSL.RACEN

  - name: SEX
    submission:
      data_type: text
      mandatory: false
      length: 1
      codelist: SEX
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADAE.SEX
        description: ADSL.SEX

  - name: SAFFL
    submission:
      data_type: text
      mandatory: false
      length: 1
      codelist: YN
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADAE.SAFFL
        description: ADSL.SAFFL

  - name: TRTSDT
    submission:
      data_type: integer
      mandatory: false
      length: 8
      display_format: DATE9.
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADAE.TRTSDT
        description: ADSL.TRTSDT

  - name: TRTEDT
    submission:
      data_type: integer
      mandatory: false
      length: 8
      display_format: DATE9.
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADAE.TRTEDT
        description: ADSL.TRTEDT

  - name: ASTDT
    submission:
      data_type: integer
      mandatory: false
      key_sequence: 3
      length: 8
      display_format: DATE9.
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADAE.ASTDT
        description: AE.AESTDTC, converted to a numeric SAS date. Some events
          with partial dates are imputed in a conservative manner. If the day
          component is missing, a value of '01' is used. If both the month and
          day are missing no imputation is performed as these dates clearly
          indicate a start prior to the beginning of treatment.
          There are no events with completely missing start dates.

  - name: ASTDTF
    submission:
      data_type: text
      mandatory: false
      length: 1
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADAE.ASTDTF
        description: ASTDTF='D' if the day value within the character date is
          imputed. Note that only day values
          needed to be imputed for this study.

  - name: ASTDY
    submission:
      data_type: integer
      mandatory: false
      length: 8
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADAE.ASTDY
        description: IF ASTDT>=TRTSDT>MISSING then ASTDY=ASTDT-TRTSDT+1
          Else if TRTSDT>ASTDT>MISSING then ASTDY=ASTDT-TRTSDT

  - name: AENDT
    submission:
      data_type: integer
      mandatory: false
      length: 8
      display_format: DATE9.
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADAE.AENDT
        description: AE.AEENDTC, converted to a numeric SAS date

  - name: AENDY
    submission:
      data_type: integer
      mandatory: false
      length: 8
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADAE.AENDY
        description: IF AENDT>=TRTSDT>MISSING then AENDY=AENDT-TRTSDT+1
          Else if TRTSDT>AENDT>MISSING then AENDY=AENDT-TRTSDT

  # Pilot 3 also counts the duration of an event whose start day was
  # imputed; CDISC Pilot 01 leaves it missing. Label in CDISC Pilot 01:
  # AE Duration (N).
  - name: ADURN
    label: Analysis Duration (N)
    derivation:
      diff:
        type: date
        start: ASTDT
        end: AENDT
        unit: day
        closed: both
    submission:
      data_type: integer
      mandatory: false
      length: 8
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADAE.ADURN
        description: ADURN=AENDT-ASTDT+1

  # Pilot 3 writes the unit as DAYS. Label in CDISC Pilot 01: AE Duration
  # Units.
  - name: ADURU
    label: Analysis Duration Units
    derivation:
      case:
        - when: "ADURN IS NOT NULL"
          then: "'DAYS'"
        - otherwise: "''"
    submission:
      data_type: text
      mandatory: false
      length: 3
      codelist: ADURU
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADAE.ADURU
        description: If ADURN is not missing then ADURU='DAYS'

  - name: AETERM
    submission:
      data_type: text
      mandatory: false
      key_sequence: 2
      length: 46
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADAE.AETERM
        description: AE.AETERM

  - name: AELLT
    submission:
      data_type: text
      mandatory: false
      length: 46
      codelist: ADVERSE_EVENT_DICTIONARY
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADAE.AELLT
        description: AE.AELLT

  - name: AELLTCD
    submission:
      data_type: integer
      mandatory: false
      length: 8
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADAE.AELLTCD
        description: AE.AELLTCD

  - name: AEDECOD
    submission:
      data_type: text
      mandatory: false
      length: 46
      codelist: ADVERSE_EVENT_DICTIONARY
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADAE.AEDECOD
        description: AE.AEDECOD

  - name: AEPTCD
    submission:
      data_type: integer
      mandatory: false
      length: 8
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADAE.AEPTCD
        description: AE.AEPTCD

  - name: AEHLT
    submission:
      data_type: text
      mandatory: false
      length: 8
      codelist: ADVERSE_EVENT_DICTIONARY
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADAE.AEHLT
        description: AE.AEHLT

  - name: AEHLTCD
    submission:
      data_type: integer
      mandatory: false
      length: 8
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADAE.AEHLTCD
        description: AE.AEHLTCD

  - name: AEHLGT
    submission:
      data_type: text
      mandatory: false
      length: 9
      codelist: ADVERSE_EVENT_DICTIONARY
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADAE.AEHLGT
        description: AE.AEHLGT

  - name: AEHLGTCD
    submission:
      data_type: integer
      mandatory: false
      length: 8
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADAE.AEHLGTCD
        description: AE.AEHLGTCD

  - name: AEBODSYS
    submission:
      data_type: text
      mandatory: false
      length: 67
      codelist: ADVERSE_EVENT_DICTIONARY
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADAE.AEBODSYS
        description: AE.AEBODSYS

  - name: AESOC
    submission:
      data_type: text
      mandatory: false
      length: 67
      codelist: ADVERSE_EVENT_DICTIONARY
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADAE.AESOC
        description: AE.AESOC

  - name: AESOCCD
    submission:
      data_type: integer
      mandatory: false
      length: 8
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADAE.AESOCCD
        description: AE.AESOCCD

  - name: AESEV
    submission:
      data_type: text
      mandatory: false
      length: 8
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADAE.AESEV
        description: AE.AESEV

  - name: AESER
    submission:
      data_type: text
      mandatory: false
      length: 1
      codelist: YN
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADAE.AESER
        description: AE.AESER

  - name: AESCAN
    submission:
      data_type: text
      mandatory: false
      length: 1
      codelist: YN
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADAE.AESCAN
        description: AE.AESCAN

  - name: AESCONG
    submission:
      data_type: text
      mandatory: false
      length: 1
      codelist: YN
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADAE.AESCONG
        description: AE.AESCONG

  - name: AESDISAB
    submission:
      data_type: text
      mandatory: false
      length: 1
      codelist: YN
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADAE.AESDISAB
        description: AE.AESDISAB

  - name: AESDTH
    submission:
      data_type: text
      mandatory: false
      length: 1
      codelist: YN
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADAE.AESDTH
        description: AE.AESDTH

  - name: AESHOSP
    submission:
      data_type: text
      mandatory: false
      length: 1
      codelist: YN
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADAE.AESHOSP
        description: AE.AESHOSP

  - name: AESLIFE
    submission:
      data_type: text
      mandatory: false
      length: 1
      codelist: YN
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADAE.AESLIFE
        description: AE.AESLIFE

  - name: AESOD
    submission:
      data_type: text
      mandatory: false
      length: 1
      codelist: YN
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADAE.AESOD
        description: AE.AESOD

  - name: AEREL
    submission:
      data_type: text
      mandatory: false
      length: 8
      codelist: AECAUS
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADAE.AEREL
        description: AE.AEREL

  - name: AEACN
    submission:
      data_type: text
      mandatory: false
      length: 1
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADAE.AEACN
        description: AE.AEACN

  - name: AEOUT
    submission:
      data_type: text
      mandatory: false
      length: 26
      codelist: OUT
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADAE.AEOUT
        description: AE.AEOUT

  - name: AESEQ
    submission:
      data_type: integer
      mandatory: false
      key_sequence: 4
      length: 8
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADAE.AESEQ
        description: AE.AESEQ

  # Pilot 3 leaves events that are not treatment emergent blank, not N.
  - name: TRTEMFL
    derivation:
      case:
        - when: "ASTDT IS NOT NULL AND TRTSDT IS NOT NULL AND ASTDT >= TRTSDT"
          then: "'Y'"
        - otherwise: "''"
    submission:
      data_type: text
      mandatory: false
      length: 1
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADAE.TRTEMFL
        description: If ASTDT >= TRTSDT > . then
          TRTEMFL='Y'. Otherwise TRTEMFL='N'

  - name: CQ01NAM
    submission:
      data_type: text
      mandatory: false
      length: 19
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADAE.CQ01NAM
        description: If AEDECOD contains any of the character strings of
          ('APPLICATION', 'DERMATITIS', 'ERYTHEMA', 'BLISTER')
          OR if AEBODSYS='SKIN AND SUBC UTANEOUS TISSUE DISORDERS' but AEDECOD
          is not in ('COLD SWEAT', 'HYPERHIDROSIS',
          'ALOPECIA') then CQ01NAM='DERMATOLOGIC EVENTS' Otherwise CQ01NAM=NULL

  # Pilot 3 label; CDISC Pilot 01: 1st Occurrence of Any AE Flag.
  - name: AOCCFL
    label: 1st Occurrence within Subject Flag
    submission:
      data_type: text
      mandatory: false
      length: 1
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADAE.AOCCFL
        description: Subset to TRTEMFL='Y' and sort by Subject (USUBJID),
          Start Date (ASTDT), and Sequence Number (AESEQ) and flag
          the first record (set AOCCFL=?Y?) within each Subject

  - name: AOCCSFL
    submission:
      data_type: text
      mandatory: false
      length: 1
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADAE.AOCCSFL
        description: Subset to TRTEMFL='Y' and sort by Subject (USUBJID),
          System Organ Class (AEBODSYS), Start Date (ASTDT),
          and Sequence Number (AESEQ) and flag the first
          record (set AOCCSFL=?Y?) within each Subject and SOC

  - name: AOCCPFL
    submission:
      data_type: text
      mandatory: false
      length: 1
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADAE.AOCCPFL
        description: Subset to TRTEMFL='Y' and sort by Subject (USUBJID),
          System Organ Class (AEBODSYS), Preferred Term (AEDECOD),
          Start Date (ASTDT), and Sequence Number (AESEQ) and flag the
          first record (set AOCCPFL=?Y?) within each Subject, SOC, and PT

  - name: AOCC02FL
    submission:
      data_type: text
      mandatory: false
      length: 1
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADAE.AOCC02FL
        description: Subset to TRTEMFL='Y' and AESER='Y' and sort by Subject
          (USUBJID), Start Date (ASTDT), and Sequence Number (AESEQ) and
          flag the first record (set AOCC02FL=?Y?) within each Subject

  - name: AOCC03FL
    submission:
      data_type: text
      mandatory: false
      length: 1
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADAE.AOCC03FL
        description: Subset to TRTEMFL='Y' and AESER='Y' and sort by Subject
          (USUBJID), System Organ Class (AEBODSYS), Start Date (ASTDT),
          and Sequence Number (AESEQ) and flag the first
          record (set AOCC03FL=?Y?) within each Subject and SOC

  - name: AOCC04FL
    submission:
      data_type: text
      mandatory: false
      length: 1
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADAE.AOCC04FL
        description: Subset to TRTEMFL='Y' and AESER='Y' and sort by Subject
          (USUBJID), System Organ Class (AEBODSYS), Preferred Term (AEDECOD),
          Start Date (ASTDT), and Sequence Number (AESEQ) and flag the
          first record (set AOCC04FL=?Y?) within each Subject, SOC, and PT
