# CDISC Pilot 01 ADAE: the study layer and this package's Define-XML 1.0
# metadata.
yamaa: "1.0"
type: spec
parent: ../../../spec/yamaa/cdiscpilot01/adae.yaml
domain: ADAE

columns:
  - name: STUDYID
    submission:
      data_type: text
      length: 12
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.STUDYID

  - name: USUBJID
    submission:
      data_type: text
      length: 11
      mandatory: false
      key_sequence: 1
      origins:
        - type: Derived
      comment: ADSL.USUBJID

  - name: SITEID
    submission:
      data_type: text
      length: 3
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.SITEID

  - name: TRTA
    submission:
      data_type: text
      length: 20
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.TRT01A
      codelist: ARM

  - name: TRTAN
    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.TRT01AN
      codelist: ARMN

  - name: AGE
    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.AGE

  - name: AGEGR1
    submission:
      data_type: text
      length: 5
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.AGEGR1
      codelist: AGEGR1

  - name: AGEGR1N
    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.AGEGR1N
      codelist: AGEGR1N

  - name: RACE
    submission:
      data_type: text
      length: 32
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.RACE
      codelist: RACE

  - name: RACEN
    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.RACEN
      codelist: RACEN

  - name: SEX
    submission:
      data_type: text
      length: 1
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.SEX
      codelist: SEX

  - name: SAFFL
    submission:
      data_type: text
      length: 1
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.SAFFL
      codelist: YN

  - name: TRTSDT
    submission:
      data_type: integer
      length: 8
      mandatory: false
      display_format: DATE9.
      origins:
        - type: Derived
      comment: ADSL.TRTSDT

  - name: TRTEDT
    submission:
      data_type: integer
      length: 8
      mandatory: false
      display_format: DATE9.
      origins:
        - type: Derived
      comment: ADSL.TRTEDT

  - name: ASTDT
    submission:
      data_type: integer
      length: 8
      mandatory: false
      display_format: DATE9.
      key_sequence: 3
      origins:
        - type: Derived
      comment: AE.AESTDTC, converted to a numeric SAS date. Some events with
        partial dates are imputed in a conservative manner. If the day
        component is missing, a value of '01' is used. If both the month and
        day are missing no imputation is performed as these dates clearly
        indicate a start prior to the beginning of treatment.
        There are no events with completely missing start dates.

  - name: ASTDTF
    submission:
      data_type: text
      length: 1
      mandatory: false
      origins:
        - type: Derived
      comment: ASTDTF='D' if the day value within the character date is
        imputed. Note that only day values needed to be imputed for this study.
      codelist: DMY

  - name: ASTDY
    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: IF ASTDT>=TRTSDT>MISSING then ASTDY=ASTDT-TRTSDT+1
        Else if TRTSDT>ASTDT>MISSING then ASTDY=ASTDT-TRTSDT

  - name: AENDT
    submission:
      data_type: integer
      length: 8
      mandatory: false
      display_format: DATE9.
      origins:
        - type: Derived
      comment: AE.AEENDTC, converted to a numeric SAS date

  - name: AENDY
    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: IF AENDT>=TRTSDT>MISSING then AENDY=AENDT-TRTSDT+1
        Else if TRTSDT>AENDT>MISSING then AENDY=AENDT-TRTSDT

  - name: ADURN
    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: ADURN=AENDT-ASTDT+1

  - name: ADURU
    submission:
      data_type: text
      length: 3
      mandatory: false
      origins:
        - type: Derived
      comment: If ADURN is not missing then ADURU='DAY'

  - name: AETERM
    submission:
      data_type: text
      length: 46
      mandatory: false
      key_sequence: 2
      origins:
        - type: Derived
      comment: AE.AETERM

  - name: AELLT
    submission:
      data_type: text
      length: 46
      mandatory: false
      origins:
        - type: Derived
      comment: AE.AELLT
      codelist: AEDICT

  - name: AELLTCD
    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: AE.AELLTCD

  - name: AEDECOD
    submission:
      data_type: text
      length: 46
      mandatory: false
      origins:
        - type: Derived
      comment: AE.AEDECOD
      codelist: AEDICT

  - name: AEPTCD
    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: AE.AEPTCD

  - name: AEHLT
    submission:
      data_type: text
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: AE.AEHLT
      codelist: AEDICT

  - name: AEHLTCD
    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: AE.AEHLTCD

  - name: AEHLGT
    submission:
      data_type: text
      length: 9
      mandatory: false
      origins:
        - type: Derived
      comment: AE.AEHLGT
      codelist: AEDICT

  - name: AEHLGTCD
    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: AE.AEHLGTCD

  - name: AEBODSYS
    submission:
      data_type: text
      length: 67
      mandatory: false
      origins:
        - type: Derived
      comment: AE.AEBODSYS
      codelist: AEDICT

  - name: AESOC
    submission:
      data_type: text
      length: 67
      mandatory: false
      origins:
        - type: Derived
      comment: AE.AESOC
      codelist: AEDICT

  - name: AESOCCD
    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: AE.AESOCCD

  - name: AESEV
    submission:
      data_type: text
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: AE.AESEV
      codelist: SEV

  - name: AESER
    submission:
      data_type: text
      length: 1
      mandatory: false
      origins:
        - type: Derived
      comment: AE.AESER
      codelist: YN

  - name: AESCAN
    submission:
      data_type: text
      length: 1
      mandatory: false
      origins:
        - type: Derived
      comment: AE.AESCAN
      codelist: YN

  - name: AESCONG
    submission:
      data_type: text
      length: 1
      mandatory: false
      origins:
        - type: Derived
      comment: AE.AESCONG
      codelist: YN

  - name: AESDISAB
    submission:
      data_type: text
      length: 1
      mandatory: false
      origins:
        - type: Derived
      comment: AE.AESDISAB
      codelist: YN

  - name: AESDTH
    submission:
      data_type: text
      length: 1
      mandatory: false
      origins:
        - type: Derived
      comment: AE.AESDTH
      codelist: YN

  - name: AESHOSP
    submission:
      data_type: text
      length: 1
      mandatory: false
      origins:
        - type: Derived
      comment: AE.AESHOSP
      codelist: YN

  - name: AESLIFE
    submission:
      data_type: text
      length: 1
      mandatory: false
      origins:
        - type: Derived
      comment: AE.AESLIFE
      codelist: YN

  - name: AESOD
    submission:
      data_type: text
      length: 1
      mandatory: false
      origins:
        - type: Derived
      comment: AE.AESOD
      codelist: YN

  - name: AEREL
    submission:
      data_type: text
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: AE.AEREL
      codelist: AECAUS

  - name: AEACN
    submission:
      data_type: text
      length: 1
      mandatory: false
      origins:
        - type: Derived
      comment: AE.AEACN

  - name: AEOUT
    submission:
      data_type: text
      length: 26
      mandatory: false
      origins:
        - type: Derived
      comment: AE.AEOUT
      codelist: OUT

  - name: AESEQ
    submission:
      data_type: integer
      length: 8
      mandatory: false
      key_sequence: 4
      origins:
        - type: Derived
      comment: AE.AESEQ

  - name: TRTEMFL
    submission:
      data_type: text
      length: 1
      mandatory: false
      origins:
        - type: Derived
      comment: If ASTDT >= TRTSDT > . then TRTEMFL='Y'. Otherwise TRTEMFL='N'
      codelist: YN

  - name: AOCCFL
    submission:
      data_type: text
      length: 1
      mandatory: false
      origins:
        - type: Derived
      comment: "Subset to TRTEMFL='Y' and sort by Subject (USUBJID),
        Start Date (ASTDT), and Sequence Number (AESEQ) and flag
        the first record (set AOCCFL=\x92Y\x92) within each Subject"
      codelist: Y_BLANK

  - name: AOCCSFL
    submission:
      data_type: text
      length: 1
      mandatory: false
      origins:
        - type: Derived
      comment: "Subset to TRTEMFL='Y' and sort by Subject (USUBJID),
        System Organ Class (AEBODSYS), Start Date (ASTDT),
        and Sequence Number (AESEQ) and flag the first record
        (set AOCCSFL=\x92Y\x92) within each Subject and SOC"
      codelist: Y_BLANK

  - name: AOCCPFL
    submission:
      data_type: text
      length: 1
      mandatory: false
      origins:
        - type: Derived
      comment: "Subset to TRTEMFL='Y' and sort by Subject (USUBJID),
        System Organ Class (AEBODSYS), Preferred Term (AEDECOD),
        Start Date (ASTDT), and Sequence Number (AESEQ) and flag the first
        record (set AOCCPFL=\x92Y\x92) within each Subject, SOC, and PT"
      codelist: Y_BLANK

  - name: AOCC02FL
    submission:
      data_type: text
      length: 1
      mandatory: false
      origins:
        - type: Derived
      comment: "Subset to TRTEMFL='Y' and AESER='Y' and sort by Subject
        (USUBJID), Start Date (ASTDT), and Sequence Number (AESEQ) and
        flag the first record (set AOCC02FL=\x92Y\x92) within each Subject"
      codelist: Y_BLANK

  - name: AOCC03FL
    submission:
      data_type: text
      length: 1
      mandatory: false
      origins:
        - type: Derived
      comment: "Subset to TRTEMFL='Y' and AESER='Y' and sort by Subject
        (USUBJID), System Organ Class (AEBODSYS), Start Date (ASTDT),
        and Sequence Number (AESEQ) and flag the first record
        (set AOCC03FL=\x92Y\x92) within each Subject and SOC"
      codelist: Y_BLANK

  - name: AOCC04FL
    submission:
      data_type: text
      length: 1
      mandatory: false
      origins:
        - type: Derived
      comment: "Subset to TRTEMFL='Y' and AESER='Y' and sort by Subject
        (USUBJID), System Organ Class (AEBODSYS), Preferred Term (AEDECOD),
        Start Date (ASTDT), and Sequence Number (AESEQ) and flag the first
        record (set AOCC04FL=\x92Y\x92) within each Subject, SOC, and PT"
      codelist: Y_BLANK

  - name: CQ01NAM
    submission:
      data_type: text
      length: 19
      mandatory: false
      origins:
        - type: Derived
      comment: If AEDECOD contains any of the character strings of
        ('APPLICATION', 'DERMATITIS', 'ERYTHEMA', 'BLISTER')
        OR if AEBODSYS='SKIN AND SUBC UTANEOUS TISSUE DISORDERS' but AEDECOD is
        not in ('COLD SWEAT', 'HYPERHIDROSIS',
        'ALOPECIA') then CQ01NAM='DERMATOLOGIC EVENTS' Otherwise CQ01NAM=NULL

  - name: AOCC01FL
    submission:
      data_type: text
      length: 1
      mandatory: false
      origins:
        - type: Derived
      comment: "Subset to CQ01NAM='' and TRTEMFL='Y' and sort by Subject
        (USUBJID), Start Date (ASTDT), and Sequence Number (AESEQ) and flag the
        first record (set AOCC01FL=\x92Y\x92) within each Subject (Flag First
        Treatment Emergent Dermatological Event for Time to Event Analysis)"
      codelist: Y_BLANK

submission:
  mode: historical
  label: Adverse Events Analysis Dataset
  class: OCCURRENCE DATA STRUCTURE
  structure: one record per subject per adverse event
  repeating: true
  artifact: adae.xpt
  comment: see program ..\programs\adae.sas
