yamaa: "1.0"
type: spec
model: ADaM
parent: ../../../spec/yamaa/templates/subject-analysis.yaml
domain: ADAE
keys:
  - STUDYID
  - USUBJID
  - AESEQ
input:
  AE:
    path: ../../data/sdtm/ae.parquet
    empty_string: present
  ADSL:
    empty_string: present
    key:
      - STUDYID
      - USUBJID
base: AE

output:
  path: ../../data/adam/adae-yamaa.parquet
  columns:
    - STUDYID
    - SITEID
    - USUBJID
    - TRTA
    - TRTAN
    - AGE
    - AGEGR1
    - AGEGR1N
    - RACE
    - RACEN
    - SEX
    - SAFFL
    - TRTSDT
    - TRTEDT
    - ASTDT
    - ASTDTF
    - ASTDY
    - AENDT
    - AENDY
    - ADURN
    - ADURU
    - AETERM
    - AELLT
    - AELLTCD
    - AEDECOD
    - AEPTCD
    - AEHLT
    - AEHLTCD
    - AEHLGT
    - AEHLGTCD
    - AEBODSYS
    - AESOC
    - AESOCCD
    - AESEV
    - AESER
    - AESCAN
    - AESCONG
    - AESDISAB
    - AESDTH
    - AESHOSP
    - AESLIFE
    - AESOD
    - AEREL
    - AEACN
    - AEOUT
    - AESEQ
    - TRTEMFL
    - AOCCFL
    - AOCCSFL
    - AOCCPFL
    - AOCC02FL
    - AOCC03FL
    - AOCC04FL
    - CQ01NAM
    - AOCC01FL
  order_by:
    - variable: USUBJID
      nulls: last
    - variable: AESEQ
      nulls: last

windows:
  TE_RN_ORDER:
    group_by:
      - STUDYID
      - USUBJID
    order_by:
      - variable: AESEQ
        nulls: last
    filter: "TRTEMFL = 'Y'"

  TE_SOC_RN_ORDER:
    group_by:
      - STUDYID
      - USUBJID
      - AESOC
    order_by:
      - variable: AESEQ
        nulls: last
    filter: "TRTEMFL = 'Y'"

  TE_PT_RN_ORDER:
    group_by:
      - STUDYID
      - USUBJID
      - AEDECOD
    order_by:
      - variable: AESEQ
        nulls: last
    filter: "TRTEMFL = 'Y'"

  SER_RN_ORDER:
    group_by:
      - STUDYID
      - USUBJID
    order_by:
      - variable: AESEQ
        nulls: last
    filter: "TRTEMFL = 'Y' AND AE.AESER = 'Y'"

  SER_SOC_RN_ORDER:
    group_by:
      - STUDYID
      - USUBJID
      - AESOC
    order_by:
      - variable: AESEQ
        nulls: last
    filter: "TRTEMFL = 'Y' AND AE.AESER = 'Y'"

  SER_PT_RN_ORDER:
    group_by:
      - STUDYID
      - USUBJID
      - AEDECOD
    order_by:
      - variable: AESEQ
        nulls: last
    filter: "TRTEMFL = 'Y' AND AE.AESER = 'Y'"

  DERM_RN_ORDER:
    group_by:
      - STUDYID
      - USUBJID
    order_by:
      - variable: AESEQ
        nulls: last
    filter: "TRTEMFL = 'Y' AND CQ01NAM = 'DERMATOLOGIC EVENTS'"

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: AE.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: AE.USUBJID

  - name: ASTDT
    type: date
    label: Analysis Start Date
    derivation:
      case:
        - when: "AE.AESTDTC LIKE '%-%'"
          then:
            impute:
              type: date
              source: AE.AESTDTC
              month: 1
              day: 1
              invalid:
        - otherwise:

  - name: ASTDTF
    type: str
    label: Analysis Start Date Imputation Flag
    derivation:
      case:
        - when: "AE.AESTDTC LIKE '%-%' AND AE.AESTDTC NOT LIKE
            '%-%-%'"
          then: "'D'"
        - otherwise: "''"

  - name: ASTDY_RAW
    type: float
    label: Analysis Start Day raw
    derivation:
      case:
        - when: "ASTDT >= TRTSDT"
          then:
            diff:
              type: date
              start: TRTSDT
              end: ASTDT
              unit: day
              closed: both
        - otherwise:
            diff:
              type: date
              start: TRTSDT
              end: ASTDT
              unit: day

  - name: ASTDY
    type: float
    label: Analysis Start Relative Day
    derivation: ASTDY_RAW

  - name: AENDT
    type: date
    label: Analysis End Date
    derivation:
      impute:
        type: date
        source: AE.AEENDTC
        month: 1
        day: 1
        invalid:

  - name: AENDY
    type: float
    label: Analysis End Relative Day
    derivation: AE.AEENDY

  - name: ADURN
    type: float
    label: AE Duration (N)
    derivation:
      case:
        - when: "ASTDT IS NOT NULL AND AENDT IS NOT NULL AND ASTDTF
            = ''"
          then:
            diff:
              type: date
              start: ASTDT
              end: AENDT
              unit: day
              closed: both
        - otherwise:

  - name: ADURU
    type: str
    label: AE Duration Units
    derivation:
      case:
        - when: "ADURN IS NOT NULL"
          then: "'DAY'"
        - otherwise: "''"

  - name: AETERM
    type: str
    label: Reported Term for the Adverse Event
    derivation: AE.AETERM

  - name: AELLT
    type: str
    label: Lowest Level Term
    derivation: AE.AELLT

  - name: AELLTCD
    type: float
    label: Lowest Level Term Code
    derivation: AE.AELLTCD

  - name: AEDECOD
    type: str
    label: Dictionary-Derived Term
    derivation: AE.AEDECOD

  - name: AEPTCD
    type: float
    label: Preferred Term Code
    derivation: AE.AEPTCD

  - name: AEHLT
    type: str
    label: High Level Term
    derivation: AE.AEHLT

  - name: AEHLTCD
    type: float
    label: High Level Term Code
    derivation: AE.AEHLTCD

  - name: AEHLGT
    type: str
    label: High Level Group Term
    derivation: AE.AEHLGT

  - name: AEHLGTCD
    type: float
    label: High Level Group Term Code
    derivation: AE.AEHLGTCD

  - name: AEBODSYS
    type: str
    label: Body System or Organ Class
    derivation: AE.AEBODSYS

  - name: AESOC
    type: str
    label: Primary System Organ Class
    derivation: AE.AESOC

  - name: AESOCCD
    type: float
    label: Primary System Organ Class Code
    derivation: AE.AESOCCD

  - name: AESEV
    type: str
    label: Severity/Intensity
    derivation: AE.AESEV

  - name: AESER
    type: str
    label: Serious Event
    derivation: AE.AESER

  - name: AESCAN
    type: str
    label: Involves Cancer
    derivation: AE.AESCAN

  - name: AESCONG
    type: str
    label: Congenital Anomaly or Birth Defect
    derivation: AE.AESCONG

  - name: AESDISAB
    type: str
    label: Persist or Signif Disability/Incapacity
    derivation: AE.AESDISAB

  - name: AESDTH
    type: str
    label: Results in Death
    derivation: AE.AESDTH

  - name: AESHOSP
    type: str
    label: Requires or Prolongs Hospitalization
    derivation: AE.AESHOSP

  - name: AESLIFE
    type: str
    label: Is Life Threatening
    derivation: AE.AESLIFE

  - name: AESOD
    type: str
    label: Occurred with Overdose
    derivation: AE.AESOD

  - name: AEREL
    type: str
    label: Causality
    derivation: AE.AEREL

  - name: AEACN
    type: str
    label: Action Taken with Study Treatment
    derivation: AE.AEACN

  - name: AEOUT
    type: str
    label: Outcome of Adverse Event
    derivation: AE.AEOUT

  - name: AESEQ
    type: float
    label: Sequence Number
    derivation: AE.AESEQ

  - name: TRTEMFL
    type: str
    label: Treatment Emergent Analysis Flag
    derivation:
      case:
        - when: "ASTDT IS NOT NULL AND TRTSDT IS NOT NULL AND
            ASTDT >= TRTSDT"
          then: "'Y'"
        - otherwise: "'N'"

  - name: TE_RN
    type: float
    label: Row number among treatment-emergent AEs
    derivation:
      row_number:
        window: TE_RN_ORDER

  - name: AOCCFL
    type: str
    label: 1st Occurrence of Any AE Flag
    derivation:
      case:
        - when: "TE_RN = 1"
          then: "'Y'"
        - otherwise: "''"

  - name: TE_SOC_RN
    type: float
    label: Row number among TE AEs per SOC
    derivation:
      row_number:
        window: TE_SOC_RN_ORDER

  - name: AOCCSFL
    type: str
    label: 1st Occurrence of SOC Flag
    derivation:
      case:
        - when: "TE_SOC_RN = 1"
          then: "'Y'"
        - otherwise: "''"

  - name: TE_PT_RN
    type: float
    label: Row number among TE AEs per PT
    derivation:
      row_number:
        window: TE_PT_RN_ORDER

  - name: AOCCPFL
    type: str
    label: 1st Occurrence of Preferred Term Flag
    derivation:
      case:
        - when: "TE_PT_RN = 1"
          then: "'Y'"
        - otherwise: "''"

  - name: SER_RN
    type: float
    label: Row number among serious TE AEs
    derivation:
      row_number:
        window: SER_RN_ORDER

  - name: AOCC02FL
    type: str
    label: 1st Occurrence 02 Flag for Serious
    derivation:
      case:
        - when: "SER_RN = 1"
          then: "'Y'"
        - otherwise: "''"

  - name: SER_SOC_RN
    type: float
    label: Row number among serious TE AEs per SOC
    derivation:
      row_number:
        window: SER_SOC_RN_ORDER

  - name: AOCC03FL
    type: str
    label: 1st Occurrence 03 Flag for Serious SOC
    derivation:
      case:
        - when: "SER_SOC_RN = 1"
          then: "'Y'"
        - otherwise: "''"

  - name: SER_PT_RN
    type: float
    label: Row number among serious TE AEs per PT
    derivation:
      row_number:
        window: SER_PT_RN_ORDER

  - name: AOCC04FL
    type: str
    label: 1st Occurrence 04 Flag for Serious PT
    derivation:
      case:
        - when: "SER_PT_RN = 1"
          then: "'Y'"
        - otherwise: "''"

  - name: CQ01NAM
    type: str
    label: Customized Query 01 Name
    derivation:
      case:
        - when: >-
            AE.AEDECOD IN ('ACTINIC KERATOSIS', 'APPLICATION SITE
            BLEEDING', 'APPLICATION SITE DERMATITIS', 'APPLICATION
            SITE DESQUAMATION', 'APPLICATION SITE DISCHARGE',
            'APPLICATION SITE DISCOLOURATION', 'APPLICATION SITE
            ERYTHEMA', 'APPLICATION SITE INDURATION', 'APPLICATION
            SITE IRRITATION', 'APPLICATION SITE PAIN', 'APPLICATION
            SITE PERSPIRATION', 'APPLICATION SITE PRURITUS', 'APPLICATION
            SITE REACTION', 'APPLICATION SITE SWELLING', 'APPLICATION
            SITE URTICARIA', 'APPLICATION SITE VESICLES', 'APPLICATION
            SITE WARMTH', 'BLISTER', 'DERMATITIS ATOPIC', 'DERMATITIS
            CONTACT', 'DRUG ERUPTION', 'ERYTHEMA', 'PHARYNGEAL
            ERYTHEMA', 'PRURITUS', 'PRURITUS GENERALISED', 'RASH',
            'RASH ERYTHEMATOUS', 'RASH MACULO-PAPULAR', 'RASH
            PAPULAR', 'RASH PRURITIC', 'SKIN EXFOLIATION', 'SKIN
            IRRITATION', 'SKIN ODOUR ABNORMAL', 'SKIN ULCER',
            'URTICARIA')
          then: "'DERMATOLOGIC EVENTS'"
        - otherwise: "''"

  - name: DERM_RN
    type: float
    label: Row number among dermatologic TE AEs
    derivation:
      row_number:
        window: DERM_RN_ORDER

  - name: AOCC01FL
    type: str
    label: 1st Occurrence 01 Flag for CQ01
    derivation:
      case:
        - when: "DERM_RN = 1"
          then: "'Y'"
        - otherwise: "''"

rows:
  - id: all-aes
    dataset: AE
    derivations: {}

verifications:
  - assert:
      id: treatment_date_order
      when: "TRTSDT IS NOT NULL AND TRTEDT IS NOT NULL"
      require: "TRTEDT >= TRTSDT"
