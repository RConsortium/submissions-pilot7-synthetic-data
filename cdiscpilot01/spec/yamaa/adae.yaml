yamaa: "1.0"
type: spec
model: ADaM
domain: ADAE
submission:
  mode: historical
  label: Adverse Events Analysis Dataset
  class: OCCURRENCE DATA STRUCTURE
  structure: one record per subject per adverse event
  repeating: true
  reference_data: false
  artifact: adae.xpt
  comment: see program ..\programs\adae.sas
keys:
  - STUDYID
  - USUBJID
  - AESEQ
input:
  AE:
    path: ../../data/sdtm/ae.parquet
    empty_string: present
  ADSL:
    path: ../../data/adam/adsl-yamaa.parquet
    schema: adsl.yaml
    empty_string: present
base: AE

output:
  path: ../../data/adam/adae-yamaa.parquet
  columns:
    - STUDYID
    - SITEID
    - USUBJID
    - TRTA
    - TRTAN
    - AGE
    - AGEGR1
    - AGEGR1N
    - RACE
    - RACEN
    - SEX
    - SAFFL
    - TRTSDT
    - TRTEDT
    - ASTDT
    - ASTDTF
    - ASTDY
    - AENDT
    - AENDY
    - ADURN
    - ADURU
    - AETERM
    - AELLT
    - AELLTCD
    - AEDECOD
    - AEPTCD
    - AEHLT
    - AEHLTCD
    - AEHLGT
    - AEHLGTCD
    - AEBODSYS
    - AESOC
    - AESOCCD
    - AESEV
    - AESER
    - AESCAN
    - AESCONG
    - AESDISAB
    - AESDTH
    - AESHOSP
    - AESLIFE
    - AESOD
    - AEREL
    - AEACN
    - AEOUT
    - AESEQ
    - TRTEMFL
    - AOCCFL
    - AOCCSFL
    - AOCCPFL
    - AOCC02FL
    - AOCC03FL
    - AOCC04FL
    - CQ01NAM
    - AOCC01FL
  order_by:
    - variable: USUBJID
      nulls: last
    - variable: AESEQ
      nulls: last

intermediates:
  - id: ADSL_SBJ
    dataset: ADSL
    key:
      - STUDYID
      - USUBJID
    order_by:
      - variable: ADSL.USUBJID
        nulls: last
    keep: first

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: AE.STUDYID

    submission:
      data_type: text
      length: 12
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.STUDYID
  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: AE.USUBJID

    submission:
      data_type: text
      length: 11
      mandatory: false
      key_sequence: 1
      origins:
        - type: Derived
      comment: ADSL.USUBJID
  - name: SITEID
    type: str
    label: Study Site Identifier
    derivation: ADSL_SBJ.SITEID

    submission:
      data_type: text
      length: 3
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.SITEID
  - name: TRTA
    type: str
    label: Actual Treatment
    derivation: ADSL_SBJ.TRT01A

    submission:
      data_type: text
      length: 20
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.TRT01A
      codelist: ARM
  - name: TRTAN
    type: float
    label: Actual Treatment (N)
    derivation: ADSL_SBJ.TRT01AN

    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.TRT01AN
      codelist: ARMN
  - name: AGE
    type: float
    label: Age
    derivation: ADSL_SBJ.AGE

    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.AGE
  - name: AGEGR1
    type: str
    label: Pooled Age Group 1
    derivation: ADSL_SBJ.AGEGR1

    submission:
      data_type: text
      length: 5
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.AGEGR1
      codelist: AGEGR1
  - name: AGEGR1N
    type: float
    label: Pooled Age Group 1 (N)
    derivation: ADSL_SBJ.AGEGR1N

    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.AGEGR1N
      codelist: AGEGR1N
  - name: RACE
    type: str
    label: Race
    derivation: ADSL_SBJ.RACE

    submission:
      data_type: text
      length: 32
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.RACE
      codelist: RACE
  - name: RACEN
    type: float
    label: Race (N)
    derivation: ADSL_SBJ.RACEN

    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.RACEN
      codelist: RACEN
  - name: SEX
    type: str
    label: Sex
    derivation: ADSL_SBJ.SEX

    submission:
      data_type: text
      length: 1
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.SEX
      codelist: SEX
  - name: SAFFL
    type: str
    label: Safety Population Flag
    derivation: ADSL_SBJ.SAFFL

    submission:
      data_type: text
      length: 1
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.SAFFL
      codelist: YN
  - name: TRTSDT
    type: date
    label: Date of First Exposure to Treatment
    derivation: ADSL_SBJ.TRTSDT

    submission:
      data_type: integer
      length: 8
      mandatory: false
      display_format: DATE9.
      origins:
        - type: Derived
      comment: ADSL.TRTSDT
  - name: TRTEDT
    type: date
    label: Date of Last Exposure to Treatment
    derivation: ADSL_SBJ.TRTEDT

    submission:
      data_type: integer
      length: 8
      mandatory: false
      display_format: DATE9.
      origins:
        - type: Derived
      comment: ADSL.TRTEDT
  - name: ASTDT
    type: date
    label: Analysis Start Date
    derivation:
      case:
        - when: "AE.AESTDTC LIKE '%-%'"
          then:
            impute:
              type: date
              source: AE.AESTDTC
              month: 1
              day: 1
              invalid:
        - otherwise:

    submission:
      data_type: integer
      length: 8
      mandatory: false
      display_format: DATE9.
      key_sequence: 3
      origins:
        - type: Derived
      comment: AE.AESTDTC, converted to a numeric SAS date. Some events with partial dates are imputed in a conservative manner. If the day component is missing, a value of '01' is used. If both the month and day are missing no imputation is performed as these dates clearly indicate a start prior to the beginning of treatment. There are no events with completely missing start dates.
  - name: ASTDTF
    type: str
    label: Analysis Start Date Imputation Flag
    derivation:
      case:
        - when: "AE.AESTDTC LIKE '%-%' AND AE.AESTDTC NOT LIKE '%-%-%'"
          then: "'D'"
        - otherwise: "''"

    submission:
      data_type: text
      length: 1
      mandatory: false
      origins:
        - type: Derived
      comment: ASTDTF='D' if the day value within the character date is imputed. Note that only day values needed to be imputed for this study.
      codelist: DMY
  - name: ASTDY_RAW
    type: float
    label: Analysis Start Day raw
    derivation:
      case:
        - when: "ASTDT >= TRTSDT"
          then:
            diff:
              type: date
              start: TRTSDT
              end: ASTDT
              unit: day
              closed: both
        - otherwise:
            diff:
              type: date
              start: TRTSDT
              end: ASTDT
              unit: day

  - name: ASTDY
    type: float
    label: Analysis Start Relative Day
    derivation: ASTDY_RAW

    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: IF ASTDT>=TRTSDT>MISSING then ASTDY=ASTDT-TRTSDT+1 Else if TRTSDT>ASTDT>MISSING then ASTDY=ASTDT-TRTSDT
  - name: AENDT
    type: date
    label: Analysis End Date
    derivation:
      impute:
        type: date
        source: AE.AEENDTC
        month: 1
        day: 1
        invalid:
    submission:
      data_type: integer
      length: 8
      mandatory: false
      display_format: DATE9.
      origins:
        - type: Derived
      comment: AE.AEENDTC, converted to a numeric SAS date
  - name: AENDY
    type: float
    label: Analysis End Relative Day
    derivation: AE.AEENDY

    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: IF AENDT>=TRTSDT>MISSING then AENDY=AENDT-TRTSDT+1 Else if TRTSDT>AENDT>MISSING then AENDY=AENDT-TRTSDT
  - name: ADURN
    type: float
    label: AE Duration (N)
    derivation:
      case:
        - when: "ASTDT IS NOT NULL AND AENDT IS NOT NULL AND ASTDTF = ''"
          then:
            diff:
              type: date
              start: ASTDT
              end: AENDT
              unit: day
              closed: both
        - otherwise:

    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: ADURN=AENDT-ASTDT+1
  - name: ADURU
    type: str
    label: AE Duration Units
    derivation:
      case:
        - when: "ADURN IS NOT NULL"
          then: "'DAY'"
        - otherwise: "''"

    submission:
      data_type: text
      length: 3
      mandatory: false
      origins:
        - type: Derived
      comment: If ADURN is not missing then ADURU='DAY'
  - name: AETERM
    type: str
    label: Reported Term for the Adverse Event
    derivation: AE.AETERM

    submission:
      data_type: text
      length: 46
      mandatory: false
      key_sequence: 2
      origins:
        - type: Derived
      comment: AE.AETERM
  - name: AELLT
    type: str
    label: Lowest Level Term
    derivation: AE.AELLT

    submission:
      data_type: text
      length: 46
      mandatory: false
      origins:
        - type: Derived
      comment: AE.AELLT
      codelist: AEDICT
  - name: AELLTCD
    type: float
    label: Lowest Level Term Code
    derivation: AE.AELLTCD

    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: AE.AELLTCD
  - name: AEDECOD
    type: str
    label: Dictionary-Derived Term
    derivation: AE.AEDECOD

    submission:
      data_type: text
      length: 46
      mandatory: false
      origins:
        - type: Derived
      comment: AE.AEDECOD
      codelist: AEDICT
  - name: AEPTCD
    type: float
    label: Preferred Term Code
    derivation: AE.AEPTCD

    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: AE.AEPTCD
  - name: AEHLT
    type: str
    label: High Level Term
    derivation: AE.AEHLT

    submission:
      data_type: text
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: AE.AEHLT
      codelist: AEDICT
  - name: AEHLTCD
    type: float
    label: High Level Term Code
    derivation: AE.AEHLTCD

    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: AE.AEHLTCD
  - name: AEHLGT
    type: str
    label: High Level Group Term
    derivation: AE.AEHLGT

    submission:
      data_type: text
      length: 9
      mandatory: false
      origins:
        - type: Derived
      comment: AE.AEHLGT
      codelist: AEDICT
  - name: AEHLGTCD
    type: float
    label: High Level Group Term Code
    derivation: AE.AEHLGTCD

    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: AE.AEHLGTCD
  - name: AEBODSYS
    type: str
    label: Body System or Organ Class
    derivation: AE.AEBODSYS

    submission:
      data_type: text
      length: 67
      mandatory: false
      origins:
        - type: Derived
      comment: AE.AEBODSYS
      codelist: AEDICT
  - name: AESOC
    type: str
    label: Primary System Organ Class
    derivation: AE.AESOC

    submission:
      data_type: text
      length: 67
      mandatory: false
      origins:
        - type: Derived
      comment: AE.AESOC
      codelist: AEDICT
  - name: AESOCCD
    type: float
    label: Primary System Organ Class Code
    derivation: AE.AESOCCD

    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: AE.AESOCCD
  - name: AESEV
    type: str
    label: Severity/Intensity
    derivation: AE.AESEV

    submission:
      data_type: text
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: AE.AESEV
      codelist: SEV
  - name: AESER
    type: str
    label: Serious Event
    derivation: AE.AESER

    submission:
      data_type: text
      length: 1
      mandatory: false
      origins:
        - type: Derived
      comment: AE.AESER
      codelist: YN
  - name: AESCAN
    type: str
    label: Involves Cancer
    derivation: AE.AESCAN

    submission:
      data_type: text
      length: 1
      mandatory: false
      origins:
        - type: Derived
      comment: AE.AESCAN
      codelist: YN
  - name: AESCONG
    type: str
    label: Congenital Anomaly or Birth Defect
    derivation: AE.AESCONG

    submission:
      data_type: text
      length: 1
      mandatory: false
      origins:
        - type: Derived
      comment: AE.AESCONG
      codelist: YN
  - name: AESDISAB
    type: str
    label: Persist or Signif Disability/Incapacity
    derivation: AE.AESDISAB

    submission:
      data_type: text
      length: 1
      mandatory: false
      origins:
        - type: Derived
      comment: AE.AESDISAB
      codelist: YN
  - name: AESDTH
    type: str
    label: Results in Death
    derivation: AE.AESDTH

    submission:
      data_type: text
      length: 1
      mandatory: false
      origins:
        - type: Derived
      comment: AE.AESDTH
      codelist: YN
  - name: AESHOSP
    type: str
    label: Requires or Prolongs Hospitalization
    derivation: AE.AESHOSP

    submission:
      data_type: text
      length: 1
      mandatory: false
      origins:
        - type: Derived
      comment: AE.AESHOSP
      codelist: YN
  - name: AESLIFE
    type: str
    label: Is Life Threatening
    derivation: AE.AESLIFE

    submission:
      data_type: text
      length: 1
      mandatory: false
      origins:
        - type: Derived
      comment: AE.AESLIFE
      codelist: YN
  - name: AESOD
    type: str
    label: Occurred with Overdose
    derivation: AE.AESOD

    submission:
      data_type: text
      length: 1
      mandatory: false
      origins:
        - type: Derived
      comment: AE.AESOD
      codelist: YN
  - name: AEREL
    type: str
    label: Causality
    derivation: AE.AEREL

    submission:
      data_type: text
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: AE.AEREL
      codelist: AECAUS
  - name: AEACN
    type: str
    label: Action Taken with Study Treatment
    derivation: AE.AEACN

    submission:
      data_type: text
      length: 1
      mandatory: false
      origins:
        - type: Derived
      comment: AE.AEACN
  - name: AEOUT
    type: str
    label: Outcome of Adverse Event
    derivation: AE.AEOUT

    submission:
      data_type: text
      length: 26
      mandatory: false
      origins:
        - type: Derived
      comment: AE.AEOUT
      codelist: OUT
  - name: AESEQ
    type: float
    label: Sequence Number
    derivation: AE.AESEQ

    submission:
      data_type: integer
      length: 8
      mandatory: false
      key_sequence: 4
      origins:
        - type: Derived
      comment: AE.AESEQ
  - name: TRTEMFL
    type: str
    label: Treatment Emergent Analysis Flag
    derivation:
      case:
        - when: "ASTDT IS NOT NULL AND TRTSDT IS NOT NULL AND ASTDT >= TRTSDT"
          then: "'Y'"
        - otherwise: "'N'"

    submission:
      data_type: text
      length: 1
      mandatory: false
      origins:
        - type: Derived
      comment: If ASTDT >= TRTSDT > . then TRTEMFL='Y'. Otherwise TRTEMFL='N'
      codelist: YN
  - name: TE_RN
    type: float
    label: Row number among treatment-emergent AEs
    derivation:
      row_number:
        window:
          group_by:
            - STUDYID
            - USUBJID
          order_by:
            - variable: AESEQ
              nulls: last
          filter: "TRTEMFL = 'Y'"

  - name: AOCCFL
    type: str
    label: 1st Occurrence of Any AE Flag
    derivation:
      case:
        - when: "TE_RN = 1"
          then: "'Y'"
        - otherwise: "''"

    submission:
      data_type: text
      length: 1
      mandatory: false
      origins:
        - type: Derived
      comment: "Subset to TRTEMFL='Y' and sort by Subject (USUBJID), Start Date (ASTDT), and Sequence Number (AESEQ) and flag the first record (set AOCCFL=\x92Y\x92) within each Subject"
      codelist: Y_BLANK
  - name: TE_SOC_RN
    type: float
    label: Row number among TE AEs per SOC
    derivation:
      row_number:
        window:
          group_by:
            - STUDYID
            - USUBJID
            - AESOC
          order_by:
            - variable: AESEQ
              nulls: last
          filter: "TRTEMFL = 'Y'"

  - name: AOCCSFL
    type: str
    label: 1st Occurrence of SOC Flag
    derivation:
      case:
        - when: "TE_SOC_RN = 1"
          then: "'Y'"
        - otherwise: "''"

    submission:
      data_type: text
      length: 1
      mandatory: false
      origins:
        - type: Derived
      comment: "Subset to TRTEMFL='Y' and sort by Subject (USUBJID), System Organ Class (AEBODSYS), Start Date (ASTDT), and Sequence Number (AESEQ) and flag the first record (set AOCCSFL=\x92Y\x92) within each Subject and SOC"
      codelist: Y_BLANK
  - name: TE_PT_RN
    type: float
    label: Row number among TE AEs per PT
    derivation:
      row_number:
        window:
          group_by:
            - STUDYID
            - USUBJID
            - AEDECOD
          order_by:
            - variable: AESEQ
              nulls: last
          filter: "TRTEMFL = 'Y'"

  - name: AOCCPFL
    type: str
    label: 1st Occurrence of Preferred Term Flag
    derivation:
      case:
        - when: "TE_PT_RN = 1"
          then: "'Y'"
        - otherwise: "''"

    submission:
      data_type: text
      length: 1
      mandatory: false
      origins:
        - type: Derived
      comment: "Subset to TRTEMFL='Y' and sort by Subject (USUBJID), System Organ Class (AEBODSYS), Preferred Term (AEDECOD), Start Date (ASTDT), and Sequence Number (AESEQ) and flag the first record (set AOCCPFL=\x92Y\x92) within each Subject, SOC, and PT"
      codelist: Y_BLANK
  - name: SER_RN
    type: float
    label: Row number among serious TE AEs
    derivation:
      row_number:
        window:
          group_by:
            - STUDYID
            - USUBJID
          order_by:
            - variable: AESEQ
              nulls: last
          filter: "TRTEMFL = 'Y' AND AE.AESER = 'Y'"

  - name: AOCC02FL
    type: str
    label: 1st Occurrence 02 Flag for Serious
    derivation:
      case:
        - when: "SER_RN = 1"
          then: "'Y'"
        - otherwise: "''"

    submission:
      data_type: text
      length: 1
      mandatory: false
      origins:
        - type: Derived
      comment: "Subset to TRTEMFL='Y' and AESER='Y' and sort by Subject (USUBJID), Start Date (ASTDT), and Sequence Number (AESEQ) and flag the first record (set AOCC02FL=\x92Y\x92) within each Subject"
      codelist: Y_BLANK
  - name: SER_SOC_RN
    type: float
    label: Row number among serious TE AEs per SOC
    derivation:
      row_number:
        window:
          group_by:
            - STUDYID
            - USUBJID
            - AESOC
          order_by:
            - variable: AESEQ
              nulls: last
          filter: "TRTEMFL = 'Y' AND AE.AESER = 'Y'"

  - name: AOCC03FL
    type: str
    label: 1st Occurrence 03 Flag for Serious SOC
    derivation:
      case:
        - when: "SER_SOC_RN = 1"
          then: "'Y'"
        - otherwise: "''"

    submission:
      data_type: text
      length: 1
      mandatory: false
      origins:
        - type: Derived
      comment: "Subset to TRTEMFL='Y' and AESER='Y' and sort by Subject (USUBJID), System Organ Class (AEBODSYS), Start Date (ASTDT), and Sequence Number (AESEQ) and flag the first record (set AOCC03FL=\x92Y\x92) within each Subject and SOC"
      codelist: Y_BLANK
  - name: SER_PT_RN
    type: float
    label: Row number among serious TE AEs per PT
    derivation:
      row_number:
        window:
          group_by:
            - STUDYID
            - USUBJID
            - AEDECOD
          order_by:
            - variable: AESEQ
              nulls: last
          filter: "TRTEMFL = 'Y' AND AE.AESER = 'Y'"

  - name: AOCC04FL
    type: str
    label: 1st Occurrence 04 Flag for Serious PT
    derivation:
      case:
        - when: "SER_PT_RN = 1"
          then: "'Y'"
        - otherwise: "''"

    submission:
      data_type: text
      length: 1
      mandatory: false
      origins:
        - type: Derived
      comment: "Subset to TRTEMFL='Y' and AESER='Y' and sort by Subject (USUBJID), System Organ Class (AEBODSYS), Preferred Term (AEDECOD), Start Date (ASTDT), and Sequence Number (AESEQ) and flag the first record (set AOCC04FL=\x92Y\x92) within each Subject, SOC, and PT"
      codelist: Y_BLANK
  - name: CQ01NAM
    type: str
    label: Customized Query 01 Name
    derivation:
      case:
        - when: "AE.AEDECOD IN ('ACTINIC KERATOSIS', 'APPLICATION SITE BLEEDING', 'APPLICATION SITE DERMATITIS', 'APPLICATION SITE DESQUAMATION', 'APPLICATION SITE DISCHARGE', 'APPLICATION SITE DISCOLOURATION', 'APPLICATION SITE ERYTHEMA', 'APPLICATION SITE INDURATION', 'APPLICATION SITE IRRITATION', 'APPLICATION SITE PAIN', 'APPLICATION SITE PERSPIRATION', 'APPLICATION SITE PRURITUS', 'APPLICATION SITE REACTION', 'APPLICATION SITE SWELLING', 'APPLICATION SITE URTICARIA', 'APPLICATION SITE VESICLES', 'APPLICATION SITE WARMTH', 'BLISTER', 'DERMATITIS ATOPIC', 'DERMATITIS CONTACT', 'DRUG ERUPTION', 'ERYTHEMA', 'PHARYNGEAL ERYTHEMA', 'PRURITUS', 'PRURITUS GENERALISED', 'RASH', 'RASH ERYTHEMATOUS', 'RASH MACULO-PAPULAR', 'RASH PAPULAR', 'RASH PRURITIC', 'SKIN EXFOLIATION', 'SKIN IRRITATION', 'SKIN ODOUR ABNORMAL', 'SKIN ULCER', 'URTICARIA')"
          then: "'DERMATOLOGIC EVENTS'"
        - otherwise: "''"

    submission:
      data_type: text
      length: 19
      mandatory: false
      origins:
        - type: Derived
      comment: If AEDECOD contains any of the character strings of ('APPLICATION', 'DERMATITIS', 'ERYTHEMA', 'BLISTER') OR if AEBODSYS='SKIN AND SUBC UTANEOUS TISSUE DISORDERS' but AEDECOD is not in ('COLD SWEAT', 'HYPERHIDROSIS', 'ALOPECIA') then CQ01NAM='DERMATOLOGIC EVENTS' Otherwise CQ01NAM=NULL
  - name: DERM_RN
    type: float
    label: Row number among dermatologic TE AEs
    derivation:
      row_number:
        window:
          group_by:
            - STUDYID
            - USUBJID
          order_by:
            - variable: AESEQ
              nulls: last
          filter: "TRTEMFL = 'Y' AND CQ01NAM = 'DERMATOLOGIC EVENTS'"

  - name: AOCC01FL
    type: str
    label: 1st Occurrence 01 Flag for CQ01
    derivation:
      case:
        - when: "DERM_RN = 1"
          then: "'Y'"
        - otherwise: "''"

    submission:
      data_type: text
      length: 1
      mandatory: false
      origins:
        - type: Derived
      comment: "Subset to CQ01NAM='' and TRTEMFL='Y' and sort by Subject (USUBJID), Start Date (ASTDT), and Sequence Number (AESEQ) and flag the first record (set AOCC01FL=\x92Y\x92) within each Subject (Flag First Treatment Emergent Dermatological Event for Time to Event Analysis)"
      codelist: Y_BLANK
rows:
  - id: all-aes
    dataset: AE
    derivations: {}
