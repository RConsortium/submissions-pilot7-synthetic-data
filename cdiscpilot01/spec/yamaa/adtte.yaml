yamaa: "1.0"
type: spec
model: ADaM
domain: ADTTE
submission:
  mode: historical
  label: AE Time To 1st Derm. Event Analysis
  class: BASIC DATA STRUCTURE
  structure: one record per subject per parameter
  repeating: true
  reference_data: false
  artifact: adtte.xpt
keys:
  - STUDYID
  - USUBJID
input:
  ADSL:
    path: ../../data/adam/adsl-yamaa.parquet
    schema: adsl.yaml
    empty_string: present
  ADAE:
    path: ../../data/adam/adae-yamaa.parquet
    schema: adae.yaml
    empty_string: present
base: ADSL

output:
  path: ../../data/adam/adtte-yamaa.parquet
  columns:
    - STUDYID
    - SITEID
    - USUBJID
    - AGE
    - AGEGR1
    - AGEGR1N
    - RACE
    - RACEN
    - SEX
    - TRTSDT
    - TRTEDT
    - TRTDUR
    - TRTP
    - TRTA
    - TRTAN
    - PARAM
    - PARAMCD
    - AVAL
    - STARTDT
    - ADT
    - CNSR
    - EVNTDESC
    - SRCDOM
    - SRCVAR
    - SRCSEQ
    - SAFFL
  order_by:
    - variable: USUBJID
      nulls: last
    - variable: PARAMCD
      nulls: last

intermediates:
  - id: FIRST_DERM
    dataset: ADAE
    key:
      - STUDYID
      - USUBJID
    filter: "ADAE.AOCC01FL = 'Y'"
    order_by:
      - variable: ADAE.ASTDT
        nulls: last
      - variable: ADAE.AESEQ
        nulls: last
    keep: first

columns:
  - derivation: ADSL.STUDYID
    label: Study Identifier
    name: STUDYID
    type: str
    submission:
      data_type: text
      length: 12
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.STUDYID
  - derivation: ADSL.SITEID
    label: Study Site Identifier
    name: SITEID
    type: str
    submission:
      data_type: text
      length: 3
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.SITEID
  - derivation: ADSL.USUBJID
    label: Unique Subject Identifier
    name: USUBJID
    type: str
    submission:
      data_type: text
      length: 11
      mandatory: false
      key_sequence: 1
      origins:
        - type: Derived
      comment: ADSL.USUBJID
  - derivation: ADSL.AGE
    label: Age
    name: AGE
    type: float
    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.AGE
  - derivation: ADSL.AGEGR1
    label: Pooled Age Group 1
    name: AGEGR1
    type: str
    submission:
      data_type: text
      length: 5
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.AGEGR1
      codelist: AGEGR1
  - derivation: ADSL.AGEGR1N
    label: Pooled Age Group 1 (N)
    name: AGEGR1N
    type: float
    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.AGEGR1N
      codelist: AGEGR1N
  - derivation: ADSL.RACE
    label: Race
    name: RACE
    type: str
    submission:
      data_type: text
      length: 32
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.RACE
      codelist: RACE
  - derivation: ADSL.RACEN
    label: Race (N)
    name: RACEN
    type: float
    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.RACEN
      codelist: RACEN
  - derivation: ADSL.SEX
    label: Sex
    name: SEX
    type: str
    submission:
      data_type: text
      length: 1
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.SEX
      codelist: SEX
  - derivation: ADSL.TRTSDT
    label: Date of First Exposure to Treatment
    name: TRTSDT
    type: date
    submission:
      data_type: integer
      length: 8
      mandatory: false
      display_format: DATE9.
      origins:
        - type: Derived
      comment: ADSL.TRTSDT
  - derivation: ADSL.TRTEDT
    label: Date of Last Exposure to Treatment
    name: TRTEDT
    type: date
    submission:
      data_type: integer
      length: 8
      mandatory: false
      display_format: DATE9.
      origins:
        - type: Derived
      comment: ADSL.TRTEDT
  - name: TRTDUR
    type: float
    label: Duration of treatment (days)
    derivation: ADSL.TRTDUR

    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.TRTDUR
  - name: TRTP
    type: str
    label: Planned Treatment
    derivation: ADSL.TRT01P

    submission:
      data_type: text
      length: 20
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.TRT01P
      codelist: ARM
  - name: TRTA
    type: str
    label: Actual Treatment
    derivation: ADSL.TRT01A

    submission:
      data_type: text
      length: 20
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.TRT01A
      codelist: ARM
  - name: TRTAN
    type: float
    label: Actual Treatment (N)
    derivation: ADSL.TRT01AN

    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.TRT01AN
      codelist: ARMN
  - name: PARAM
    type: str
    label: Parameter Description
    derivation: "'Time to First Dermatologic Event'"

    submission:
      data_type: text
      length: 100
      mandatory: false
      origins:
        - type: Derived
      comment: PARAM="Time to First Dermatologic Event"
      codelist: PARAM_ADTTE
  - name: PARAMCD
    type: str
    label: Parameter Code
    derivation: "'TTDE'"

    submission:
      data_type: text
      length: 8
      mandatory: false
      key_sequence: 2
      origins:
        - type: Derived
      comment: PARAMCD="TTDE"
      codelist: PARAMCD_ADTTE
  - name: STARTDT
    type: date
    label: Time to Event Origin Date for Subject
    derivation: ADSL.TRTSDT

    submission:
      data_type: integer
      length: 8
      mandatory: false
      display_format: DATE9.
      origins:
        - type: Derived
      comment: ADSL.RFSTDTC
  - name: HAS_EVENT
    type: str
    label: Dermatologic event flag
    derivation:
      case:
        - when: "FIRST_DERM.AESEQ IS NOT NULL"
          then: "'Y'"
        - otherwise: "'N'"

  - name: ADT
    type: date
    label: Analysis Date
    derivation:
      case:
        - when: "HAS_EVENT = 'Y'"
          then: FIRST_DERM.ASTDT
        - otherwise: ADSL.RFENDT

    submission:
      data_type: integer
      length: 8
      mandatory: false
      display_format: DATE9.
      origins:
        - type: Derived
      comment: if ADAE.ASTDT is not missing and occurred after TRTSDT then ADAE.ASTDT else convert ADSL.RFENDTC to a SAS numeric date
  - name: AVAL
    type: float
    label: Analysis Value
    derivation:
      diff:
        type: date
        start: STARTDT
        end: ADT
        unit: day
        closed: both

    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: ADT-STARTDT+1
  - name: CNSR
    type: float
    label: Censor
    derivation:
      case:
        - when: "HAS_EVENT = 'Y'"
          then: 0
        - otherwise: 1

    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: if ADAE.TRTEMFL ="Y" then CNSR=0, else CNSR=1
      codelist: CENSOR
  - name: EVNTDESC
    type: str
    label: Event or Censoring Description
    derivation:
      case:
        - when: "HAS_EVENT = 'Y'"
          then: "'Dematologic Event Occured'"
        - otherwise: "'Study Completion Date'"

    submission:
      data_type: text
      length: 25
      mandatory: false
      origins:
        - type: Derived
      comment: if ADTTE.CNSR = 0 then "Dematologic Event Occured", else if ADTTE.CNSR =1 then "Study Completion Date"
  - name: SRCDOM
    type: str
    label: Source Domain
    derivation:
      case:
        - when: "HAS_EVENT = 'Y'"
          then: "'ADAE'"
        - otherwise: "'ADSL'"

    submission:
      data_type: text
      length: 4
      mandatory: false
      origins:
        - type: Derived
      comment: The Source domain referred to in order to populate ADT (either ADAE or ADSL)
  - name: SRCVAR
    type: str
    label: Source Variable
    derivation:
      case:
        - when: "HAS_EVENT = 'Y'"
          then: "'ASTDT'"
        - otherwise: "'RFENDT'"

    submission:
      data_type: text
      length: 6
      mandatory: false
      origins:
        - type: Derived
      comment: The Source variable referred to in order to populate ADT (either ASTDT or RFENDT)
  - name: SRCSEQ
    type: float
    label: Source Sequence Number
    derivation: FIRST_DERM.AESEQ

    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: The value of ADAE.AESEQ if SRCDOM=ADAE, otherwise null.
  - derivation: ADSL.SAFFL
    label: Safety Population Flag
    name: SAFFL
    type: str
    submission:
      data_type: text
      length: 1
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.SAFFL
      codelist: YN
rows:
  - id: all-subjects
    dataset: ADSL
    derivations: {}
