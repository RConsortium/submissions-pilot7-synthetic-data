# CDISC Pilot 01 ADTTE: pilot program template version 1 and this package's
# Define-XML 1.0 metadata.
yamaa: "1.0"
type: spec
parent: ../../../spec/yamaa/pilot-program/adtte_v1.yaml
domain: ADTTE

columns:
  - name: STUDYID
    submission:
      data_type: text
      length: 12
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.STUDYID

  - name: SITEID
    submission:
      data_type: text
      length: 3
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.SITEID

  - name: USUBJID
    submission:
      data_type: text
      length: 11
      mandatory: false
      key_sequence: 1
      origins:
        - type: Derived
      comment: ADSL.USUBJID

  - name: AGE
    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.AGE

  - name: AGEGR1
    submission:
      data_type: text
      length: 5
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.AGEGR1
      codelist: AGEGR1

  - name: AGEGR1N
    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.AGEGR1N
      codelist: AGEGR1N

  - name: RACE
    submission:
      data_type: text
      length: 32
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.RACE
      codelist: RACE

  - name: RACEN
    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.RACEN
      codelist: RACEN

  - name: SEX
    submission:
      data_type: text
      length: 1
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.SEX
      codelist: SEX

  - name: TRTSDT
    submission:
      data_type: integer
      length: 8
      mandatory: false
      display_format: DATE9.
      origins:
        - type: Derived
      comment: ADSL.TRTSDT

  - name: TRTEDT
    submission:
      data_type: integer
      length: 8
      mandatory: false
      display_format: DATE9.
      origins:
        - type: Derived
      comment: ADSL.TRTEDT

  - name: TRTDUR
    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.TRTDUR

  - name: TRTP
    submission:
      data_type: text
      length: 20
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.TRT01P
      codelist: ARM

  - name: TRTA
    submission:
      data_type: text
      length: 20
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.TRT01A
      codelist: ARM

  - name: TRTAN
    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.TRT01AN
      codelist: ARMN

  - name: PARAM
    submission:
      data_type: text
      length: 100
      mandatory: false
      origins:
        - type: Derived
      comment: PARAM="Time to First Dermatologic Event"
      codelist: PARAM_ADTTE

  - name: PARAMCD
    submission:
      data_type: text
      length: 8
      mandatory: false
      key_sequence: 2
      origins:
        - type: Derived
      comment: PARAMCD="TTDE"
      codelist: PARAMCD_ADTTE

  - name: STARTDT
    submission:
      data_type: integer
      length: 8
      mandatory: false
      display_format: DATE9.
      origins:
        - type: Derived
      comment: ADSL.RFSTDTC

  - name: ADT
    submission:
      data_type: integer
      length: 8
      mandatory: false
      display_format: DATE9.
      origins:
        - type: Derived
      comment: if ADAE.ASTDT is not missing and occurred after TRTSDT then
        ADAE.ASTDT else convert ADSL.RFENDTC to a SAS numeric date

  - name: AVAL
    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: ADT-STARTDT+1

  - name: CNSR
    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: if ADAE.TRTEMFL ="Y" then CNSR=0, else CNSR=1
      codelist: CENSOR

  - name: EVNTDESC
    submission:
      data_type: text
      length: 25
      mandatory: false
      origins:
        - type: Derived
      comment: if ADTTE.CNSR = 0 then "Dematologic Event Occured",
        else if ADTTE.CNSR =1 then "Study Completion Date"

  - name: SRCDOM
    submission:
      data_type: text
      length: 4
      mandatory: false
      origins:
        - type: Derived
      comment: The Source domain referred to in order
        to populate ADT (either ADAE or ADSL)

  - name: SRCVAR
    submission:
      data_type: text
      length: 6
      mandatory: false
      origins:
        - type: Derived
      comment: The Source variable referred to in order
        to populate ADT (either ASTDT or RFENDT)

  - name: SRCSEQ
    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: The value of ADAE.AESEQ if SRCDOM=ADAE, otherwise null.

  - name: SAFFL
    submission:
      data_type: text
      length: 1
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.SAFFL
      codelist: YN

submission:
  mode: historical
  label: AE Time To 1st Derm. Event Analysis
  class: BASIC DATA STRUCTURE
  structure: one record per subject per parameter
  repeating: true
  artifact: adtte.xpt
