yamaa: "1.0"
type: spec
model: ADaM
domain: ADVS
submission:
  mode: historical
  label: Vital Signs Analysis Dataset
  class: BASIC DATA STRUCTURE
  structure: one record per subject per parameter per analysis visit per analysis timepoint
  repeating: true
  reference_data: false
  artifact: advs.xpt
keys:
  - STUDYID
  - USUBJID
  - VSSEQ
  - AVISIT
input:
  VS:
    path: ../../data/sdtm/vs.parquet
    empty_string: present
  ADSL:
    path: ../../data/adam/adsl-yamaa.parquet
    schema: adsl.yaml
    empty_string: present
base: VS

output:
  path: ../../data/adam/advs-yamaa.parquet
  columns:
    - STUDYID
    - SITEID
    - USUBJID
    - AGE
    - AGEGR1
    - AGEGR1N
    - RACE
    - RACEN
    - SEX
    - SAFFL
    - TRTSDT
    - TRTEDT
    - TRTP
    - TRTPN
    - TRTA
    - TRTAN
    - PARAMCD
    - PARAM
    - PARAMN
    - ADT
    - ADY
    - ATPTN
    - ATPT
    - AVISIT
    - AVISITN
    - AVAL
    - BASE
    - CHG
    - PCHG
    - VISITNUM
    - VISIT
    - VSSEQ
    - ANL01FL
    - ABLFL
  order_by:
    - variable: USUBJID
      nulls: last
    - variable: PARAMCD
      nulls: last
    - variable: ATPTN
      nulls: last
    - variable: VSSEQ
      nulls: last

intermediates:
  - id: ADSL1
    dataset: ADSL
    key:
      - STUDYID
      - USUBJID
    order_by:
      - variable: ADSL.USUBJID
        nulls: last
    keep: first

  - id: BASE1
    dataset: VS
    key: {USUBJID: USUBJID, VSTESTCD: PARAMCD, VSTPT: ATPT}
    filter: "VS.VISIT = 'BASELINE'"

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: VS.STUDYID

    submission:
      data_type: text
      length: 12
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.STUDYID
  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: VS.USUBJID

    submission:
      data_type: text
      length: 11
      mandatory: false
      key_sequence: 1
      origins:
        - type: Derived
      comment: ADSL.USUBJID
  - name: SITEID
    type: str
    label: Study Site Identifier
    derivation: ADSL1.SITEID

    submission:
      data_type: text
      length: 3
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.SITEID
  - name: AGE
    type: float
    label: Age
    derivation: ADSL1.AGE

    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.AGE
  - name: AGEGR1
    type: str
    label: Pooled Age Group 1
    derivation: ADSL1.AGEGR1

    submission:
      data_type: text
      length: 5
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.AGEGR1
      codelist: AGEGR1
  - name: AGEGR1N
    type: float
    label: Pooled Age Group 1 (N)
    derivation: ADSL1.AGEGR1N

    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.AGEGR1N
      codelist: AGEGR1N
  - name: RACE
    type: str
    label: Race
    derivation: ADSL1.RACE

    submission:
      data_type: text
      length: 32
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.RACE
      codelist: RACE
  - name: RACEN
    type: float
    label: Race (N)
    derivation: ADSL1.RACEN

    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.RACEN
      codelist: RACEN
  - name: SEX
    type: str
    label: Sex
    derivation: ADSL1.SEX

    submission:
      data_type: text
      length: 1
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.SEX
      codelist: SEX
  - name: SAFFL
    type: str
    label: Safety Population Flag
    derivation: ADSL1.SAFFL

    submission:
      data_type: text
      length: 1
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.SAFFL
      codelist: YN
  - name: TRTSDT
    type: date
    label: Date of First Exposure to Treatment
    derivation: ADSL1.TRTSDT

    submission:
      data_type: integer
      length: 8
      mandatory: false
      display_format: DATE9.
      origins:
        - type: Derived
      comment: ADSL.TRTSDT
  - name: TRTEDT
    type: date
    label: Date of Last Exposure to Treatment
    derivation: ADSL1.TRTEDT

    submission:
      data_type: integer
      length: 8
      mandatory: false
      display_format: DATE9.
      origins:
        - type: Derived
      comment: ADSL.TRTEDT
  - name: TRTP
    type: str
    label: Planned Treatment
    derivation: ADSL1.TRT01P

    submission:
      data_type: text
      length: 20
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.TRT01P
      codelist: ARM
  - name: TRTPN
    type: float
    label: Planned Treatment (N)
    derivation: ADSL1.TRT01PN

    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.TRT01PN
      codelist: ARMN
  - name: TRTA
    type: str
    label: Actual Treatment
    derivation: ADSL1.TRT01A

    submission:
      data_type: text
      length: 20
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.TRT01AN
      codelist: ARM
  - name: TRTAN
    type: float
    label: Actual Treatment (N)
    derivation: ADSL1.TRT01AN

    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.TRT01AN
      codelist: ARMN
  - name: PARAMCD
    type: str
    label: Parameter Code
    derivation: VS.VSTESTCD

    submission:
      data_type: text
      length: 8
      mandatory: false
      key_sequence: 2
      origins:
        - type: Derived
      comment: VS.VSTESTCD
      codelist: PARAMCD_ADVS
  - name: PARAM
    type: str
    label: Parameter
    derivation:
      mapping:
        source: VS.VSTESTCD
        dict:
          SYSBP: Systolic Blood Pressure (mmHg)
          DIABP: Diastolic Blood Pressure (mmHg)
          PULSE: Pulse Rate (BEATS/MIN)
          WEIGHT: Weight (kg)
          HEIGHT: Height (cm)
          TEMP: Temperature (C)

    submission:
      data_type: text
      length: 100
      mandatory: false
      origins:
        - type: Derived
      codelist: PARAM_ADVS
  - name: PARAMN
    type: float
    label: Parameter Number
    derivation:
      mapping:
        source: VS.VSTESTCD
        dict:
          SYSBP: 1
          DIABP: 2
          PULSE: 3
          WEIGHT: 4
          HEIGHT: 5
          TEMP: 6

    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: Numeric code for Parameter
      codelist: PARAMN_ADVS
  - name: ADT
    type: date
    label: Analysis Date
    derivation:
      impute:
        type: date
        source: VS.VSDTC
        month: 1
        day: 1
        invalid:
    submission:
      data_type: integer
      length: 8
      mandatory: false
      display_format: DATE9.
      origins:
        - type: Derived
      comment: the date part of VS.VSDTC converted to a SAS date
  - name: ADY
    type: float
    label: Analysis Relative Day
    derivation: VS.VSDY

    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: VS.VSDY
  - name: ATPTN
    type: float
    label: Analysis Timepoint (N)
    derivation: VS.VSTPTNUM

    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: Numeric code for ATPT
  - name: ATPT
    type: str
    label: Analysis Timepoint
    derivation: VS.VSTPT

    submission:
      data_type: text
      length: 30
      mandatory: false
      key_sequence: 4
      origins:
        - type: Derived
      comment: VS.VSTPT
      codelist: ATPT
  - name: _SRC_AVISIT
    type: str
    label: "Working value: _SRC_AVISIT"

  - name: _SRC_AVISITN
    type: float
    label: "Working value: _SRC_AVISITN"

  - name: _AVISIT_OUT
    type: str
    label: "Working value: _AVISIT_OUT"

  - name: _AVISITN_OUT
    type: float
    label: "Working value: _AVISITN_OUT"

  - name: _USUBJID
    type: str
    label: "Working value: _USUBJID"

  - name: _VSTESTCD
    type: str
    label: "Working value: _VSTESTCD"

  - name: _VSTPT
    type: str
    label: "Working value: _VSTPT"

  - name: _RANK
    type: float
    label: "Working value: _RANK"

  - name: AVISIT
    type: str
    label: Analysis Visit
    derivation: _AVISIT_OUT

    submission:
      data_type: text
      length: 16
      mandatory: false
      key_sequence: 3
      origins:
        - type: Derived
      comment: Derived from VS.VISIT for values to be included in a per visit analysis. AVISIT is missing for values from SDTM screening visits, unscheduled visits, and event related visits, e.g. "AMBUL ECG REMOVAL", which are not included in a per visit analysis.
      codelist: AVISIT
  - name: AVISITN
    type: float
    label: Analysis Visit (N)
    derivation: _AVISITN_OUT

    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: Numeric code for AVISIT
      codelist: AVISITN
  - name: AVAL
    type: float
    label: Analysis Value
    derivation: VS.VSSTRESN

    submission:
      data_type: float
      length: 8
      mandatory: false
      significant_digits: 1
      origins:
        - type: Derived
      comment: VS.VSSTRESN
      value_level:
        - id: DIABP
          where:
            PARAMCD:
              - DIABP
          label: Diastolic Blood Pressure (mmHg)
          data_type: integer
          length: 8
          mandatory: false
          origins:
            - type: Derived
          comment: VS.VSSTRESN
        - id: HEIGHT
          where:
            PARAMCD:
              - HEIGHT
          label: Height (cm)
          data_type: integer
          length: 8
          mandatory: false
          origins:
            - type: Derived
          comment: VS.VSSTRESN
        - id: PULSE
          where:
            PARAMCD:
              - PULSE
          label: Pulse Rate (BEATS/MIN)
          data_type: integer
          length: 8
          mandatory: false
          origins:
            - type: Derived
          comment: VS.VSSTRESN
        - id: SYSBP
          where:
            PARAMCD:
              - SYSBP
          label: Systolic Blood Pressure (mmHg)
          data_type: integer
          length: 8
          mandatory: false
          origins:
            - type: Derived
          comment: VS.VSSTRESN
        - id: TEMP
          where:
            PARAMCD:
              - TEMP
          label: Temperature (C)
          data_type: float
          length: 8
          mandatory: false
          significant_digits: 1
          display_format: '4.1'
          origins:
            - type: Derived
          comment: VS.VSSTRESN
        - id: WEIGHT
          where:
            PARAMCD:
              - WEIGHT
          label: Weight (kg)
          data_type: float
          length: 8
          mandatory: false
          significant_digits: 1
          display_format: '4.1'
          origins:
            - type: Derived
          comment: VS.VSSTRESN
  - name: BASE
    type: float
    label: Baseline Value
    derivation: BASE1.VSSTRESN

    submission:
      data_type: float
      length: 8
      mandatory: false
      significant_digits: 1
      origins:
        - type: Derived
      comment: VS.VSSTRESN where VSBLFL="Y"
      value_level:
        - id: DIABP
          where:
            PARAMCD:
              - DIABP
          label: Diastolic Blood Pressure (mmHg)
          data_type: integer
          length: 8
          mandatory: false
          origins:
            - type: Derived
          comment: VS.VSSTRESN where VSBLFL="Y"
        - id: HEIGHT
          where:
            PARAMCD:
              - HEIGHT
          label: Height (cm)
          data_type: integer
          length: 8
          mandatory: false
          origins:
            - type: Derived
          comment: VS.VSSTRESN where VSBLFL="Y"
        - id: PULSE
          where:
            PARAMCD:
              - PULSE
          label: Pulse Rate (BEATS/MIN)
          data_type: integer
          length: 8
          mandatory: false
          origins:
            - type: Derived
          comment: VS.VSSTRESN where VSBLFL="Y"
        - id: SYSBP
          where:
            PARAMCD:
              - SYSBP
          label: Systolic Blood Pressure (mmHg)
          data_type: integer
          length: 8
          mandatory: false
          origins:
            - type: Derived
          comment: VS.VSSTRESN where VSBLFL="Y"
        - id: TEMP
          where:
            PARAMCD:
              - TEMP
          label: Temperature (C)
          data_type: float
          length: 8
          mandatory: false
          significant_digits: 1
          display_format: '4.1'
          origins:
            - type: Derived
          comment: VS.VSSTRESN where VSBLFL="Y"
        - id: WEIGHT
          where:
            PARAMCD:
              - WEIGHT
          label: Weight (kg)
          data_type: float
          length: 8
          mandatory: false
          significant_digits: 1
          display_format: '4.1'
          origins:
            - type: Derived
          comment: VS.VSSTRESN where VSBLFL="Y"
  - name: CHG
    type: float
    label: Change from Baseline
    derivation: "AVAL - BASE"

    submission:
      data_type: float
      length: 8
      mandatory: false
      significant_digits: 1
      origins:
        - type: Derived
      comment: AVAL-BASE
      value_level:
        - id: DIABP
          where:
            PARAMCD:
              - DIABP
          label: Diastolic Blood Pressure (mmHg)
          data_type: integer
          length: 8
          mandatory: false
          origins:
            - type: Derived
          comment: AVAL-BASE
        - id: HEIGHT
          where:
            PARAMCD:
              - HEIGHT
          label: Height (cm)
          data_type: integer
          length: 8
          mandatory: false
          origins:
            - type: Derived
          comment: AVAL-BASE
        - id: PULSE
          where:
            PARAMCD:
              - PULSE
          label: Pulse Rate (BEATS/MIN)
          data_type: integer
          length: 8
          mandatory: false
          origins:
            - type: Derived
          comment: AVAL-BASE
        - id: SYSBP
          where:
            PARAMCD:
              - SYSBP
          label: Systolic Blood Pressure (mmHg)
          data_type: integer
          length: 8
          mandatory: false
          origins:
            - type: Derived
          comment: AVAL-BASE
        - id: TEMP
          where:
            PARAMCD:
              - TEMP
          label: Temperature (C)
          data_type: float
          length: 8
          mandatory: false
          significant_digits: 1
          display_format: '4.1'
          origins:
            - type: Derived
          comment: AVAL-BASE
        - id: WEIGHT
          where:
            PARAMCD:
              - WEIGHT
          label: Weight (kg)
          data_type: float
          length: 8
          mandatory: false
          significant_digits: 1
          display_format: '4.1'
          origins:
            - type: Derived
          comment: AVAL-BASE
  - name: PCHG
    type: float
    label: Percent Change from Baseline
    derivation: "(AVAL - BASE) / BASE * 100"

    submission:
      data_type: float
      length: 8
      mandatory: false
      significant_digits: 1
      origins:
        - type: Derived
      comment: 100* (CHG/BASE)
  - name: VISITNUM
    type: float
    label: Visit Number
    derivation: VS.VISITNUM

    submission:
      data_type: float
      length: 8
      mandatory: false
      significant_digits: 1
      origins:
        - type: Derived
      comment: VS.VISITNUM
      codelist: VISITNUM
  - name: VISIT
    type: str
    label: Visit Name
    derivation: VS.VISIT

    submission:
      data_type: text
      length: 19
      mandatory: false
      origins:
        - type: Derived
      comment: VS.VISIT
      codelist: VISIT
  - name: VSSEQ
    type: float
    label: Sequence Number
    derivation: VS.VSSEQ

    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: VS.VSSEQ
  - name: ANL01FL
    type: str
    label: Analysis Record Flag 01
    derivation:
      case:
        - when: "_AVISIT_OUT <> ''"
          then: "'Y'"
        - otherwise: "''"

    submission:
      data_type: text
      length: 1
      mandatory: false
      origins:
        - type: Derived
      comment: ANL01FL="Y" if the value is to be included in a per visit analysis. ANL01FL is missing for values from SDTM screening visits, unscheduled visits, and event related visits, e.g. "AMBUL ECG REMOVAL"
      codelist: Y_BLANK
  - name: ABLFL
    type: str
    label: Baseline Record Flag
    derivation:
      case:
        - when: "VS.VISIT = 'BASELINE'"
          then: "'Y'"
        - otherwise: "''"

    submission:
      data_type: text
      length: 1
      mandatory: false
      origins:
        - type: Derived
      comment: VS.VSBLFL
      codelist: Y_BLANK
rows:
  - id: base
    dataset: VS
    derivations:
      _SRC_AVISIT:
        mapping:
          source: VS.VISIT
          dict:
            BASELINE: Baseline
            WEEK 2: Week 2
            WEEK 4: Week 4
            WEEK 6: Week 6
            WEEK 8: Week 8
            WEEK 12: Week 12
            WEEK 16: Week 16
            WEEK 20: Week 20
            WEEK 24: Week 24
            WEEK 26: Week 26
          missing: ''
          unmapped: ''
      _SRC_AVISITN:
        mapping:
          source: VS.VISIT
          dict:
            BASELINE: 0.0
            WEEK 2: 2.0
            WEEK 4: 4.0
            WEEK 6: 6.0
            WEEK 8: 8.0
            WEEK 12: 12.0
            WEEK 16: 16.0
            WEEK 20: 20.0
            WEEK 24: 24.0
            WEEK 26: 26.0
          unmapped:
      _AVISIT_OUT: _SRC_AVISIT
      _AVISITN_OUT: _SRC_AVISITN
      _USUBJID:
      _VSTESTCD:
      _VSTPT:
      _RANK:

  - id: eot
    dataset: VS
    group_by:
      - VS.STUDYID
      - VS.USUBJID
      - VS.VSTESTCD
      - VS.VSTPT
      - VS.VSSEQ
      - VS.VISIT
      - VS.VSDTC
      - VS.VSDY
      - VS.VSTPTNUM
      - VS.VSSTRESN
      - VS.VISITNUM
    filter: "_RANK = 1 AND _SRC_AVISITN > 2"
    derivations:
      _USUBJID: VS.USUBJID
      _VSTESTCD: VS.VSTESTCD
      _VSTPT: VS.VSTPT
      _SRC_AVISIT:
        mapping:
          source: VS.VISIT
          dict:
            BASELINE: Baseline
            WEEK 2: Week 2
            WEEK 4: Week 4
            WEEK 6: Week 6
            WEEK 8: Week 8
            WEEK 12: Week 12
            WEEK 16: Week 16
            WEEK 20: Week 20
            WEEK 24: Week 24
            WEEK 26: Week 26
          missing: ''
          unmapped: ''
      _SRC_AVISITN:
        mapping:
          source: VS.VISIT
          dict:
            BASELINE: 0.0
            WEEK 2: 2.0
            WEEK 4: 4.0
            WEEK 6: 6.0
            WEEK 8: 8.0
            WEEK 12: 12.0
            WEEK 16: 16.0
            WEEK 20: 20.0
            WEEK 24: 24.0
            WEEK 26: 26.0
          unmapped:
      _AVISIT_OUT: "'End of Treatment'"
      _AVISITN_OUT: 99.0
      _RANK:
        rank:
          window:
            group_by:
              - _USUBJID
              - _VSTESTCD
              - _VSTPT
            order_by:
              - {variable: _SRC_AVISITN, direction: desc, nulls: last}
            filter: "_SRC_AVISITN IS NOT NULL"
