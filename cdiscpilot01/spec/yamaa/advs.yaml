yamaa: "1.0"
type: spec
model: ADaM
parent: ../../../spec/yamaa/templates/subject-analysis.yaml
domain: ADVS
keys:
  - STUDYID
  - USUBJID
  - VSSEQ
  - AVISIT
input:
  VS:
    path: ../../data/sdtm/vs.parquet
    empty_string: present
  ADSL:
    empty_string: present
    key:
      - STUDYID
      - USUBJID
base: VS

output:
  path: ../../data/adam/advs-yamaa.parquet
  columns:
    - STUDYID
    - SITEID
    - USUBJID
    - AGE
    - AGEGR1
    - AGEGR1N
    - RACE
    - RACEN
    - SEX
    - SAFFL
    - TRTSDT
    - TRTEDT
    - TRTP
    - TRTPN
    - TRTA
    - TRTAN
    - PARAMCD
    - PARAM
    - PARAMN
    - ADT
    - ADY
    - ATPTN
    - ATPT
    - AVISIT
    - AVISITN
    - AVAL
    - BASE
    - CHG
    - PCHG
    - VISITNUM
    - VISIT
    - VSSEQ
    - ANL01FL
    - ABLFL
  order_by:
    - variable: USUBJID
      nulls: last
    - variable: PARAMCD
      nulls: last
    - variable: ATPTN
      nulls: last
    - variable: VSSEQ
      nulls: last

windows:
  EOT_ORDER:
    group_by:
      - _USUBJID
      - _VSTESTCD
      - _VSTPT
    order_by:
      - variable: _SRC_AVISITN
        direction: desc
        nulls: last
    filter: "_SRC_AVISITN IS NOT NULL"

intermediates:
  - id: BASE1
    dataset: VS
    key:
      USUBJID: USUBJID
      VSTESTCD: PARAMCD
      VSTPT: ATPT
    filter: "VS.VISIT = 'BASELINE'"

columns:
  - name: VISIT
    type: str
    label: Visit Name

    derivation: VS.VISIT

  - name: VISITNUM
    type: float
    label: Visit Number

    derivation: VS.VISITNUM

  - name: PARAMCD
    type: str
    label: Parameter Code
    derivation: VS.VSTESTCD

  - name: ABLFL
    type: str
    label: Baseline Record Flag
    derivation:
      case:
        - when: "VS.VISIT = 'BASELINE'"
          then: "'Y'"
        - otherwise: "''"
    verifications:
      - allowed_values:
          values:
            - Y
            - N
            - ''

  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: VS.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: VS.USUBJID

  - name: PARAM
    type: str
    label: Parameter
    derivation:
      mapping:
        source: VS.VSTESTCD
        dict:
          SYSBP: Systolic Blood Pressure (mmHg)
          DIABP: Diastolic Blood Pressure (mmHg)
          PULSE: Pulse Rate (BEATS/MIN)
          WEIGHT: Weight (kg)
          HEIGHT: Height (cm)
          TEMP: Temperature (C)

  - name: PARAMN
    type: float
    label: Parameter Number
    derivation:
      mapping:
        source: VS.VSTESTCD
        dict:
          SYSBP: 1
          DIABP: 2
          PULSE: 3
          WEIGHT: 4
          HEIGHT: 5
          TEMP: 6

  - name: ADT
    type: date
    label: Analysis Date
    derivation:
      impute:
        type: date
        source: VS.VSDTC
        month: 1
        day: 1
        invalid:

  - name: ADY
    type: float
    label: Analysis Relative Day
    derivation: VS.VSDY

  - name: ATPTN
    type: float
    label: Analysis Timepoint (N)
    derivation: VS.VSTPTNUM

  - name: ATPT
    type: str
    label: Analysis Timepoint
    derivation: VS.VSTPT

  - name: _SRC_AVISIT
    type: str
    label: "Working value: _SRC_AVISIT"

    derivation:
      mapping:
        source: VS.VISIT
        dict:
          BASELINE: Baseline
          WEEK 2: Week 2
          WEEK 4: Week 4
          WEEK 6: Week 6
          WEEK 8: Week 8
          WEEK 12: Week 12
          WEEK 16: Week 16
          WEEK 20: Week 20
          WEEK 24: Week 24
          WEEK 26: Week 26
        missing: ''
        unmapped: ''

  - name: _SRC_AVISITN
    type: float
    label: "Working value: _SRC_AVISITN"

  - name: _AVISIT_OUT
    type: str
    label: "Working value: _AVISIT_OUT"

  - name: _AVISITN_OUT
    type: float
    label: "Working value: _AVISITN_OUT"

  - name: _USUBJID
    type: str
    label: "Working value: _USUBJID"

  - name: _VSTESTCD
    type: str
    label: "Working value: _VSTESTCD"

  - name: _VSTPT
    type: str
    label: "Working value: _VSTPT"

  - name: _RANK
    type: float
    label: "Working value: _RANK"

  - name: AVISIT
    type: str
    label: Analysis Visit
    derivation: _AVISIT_OUT

  - name: AVISITN
    type: float
    label: Analysis Visit (N)
    derivation: _AVISITN_OUT

  - name: AVAL
    type: float
    label: Analysis Value
    derivation: VS.VSSTRESN

  - name: BASE
    type: float
    label: Baseline Value
    derivation: BASE1.VSSTRESN

  - name: CHG
    type: float
    label: Change from Baseline
    derivation: "AVAL - BASE"

  - name: PCHG
    type: float
    label: Percent Change from Baseline
    derivation: "(AVAL - BASE) / BASE * 100"

  - name: VSSEQ
    type: float
    label: Sequence Number
    derivation: VS.VSSEQ

  - name: ANL01FL
    type: str
    label: Analysis Record Flag 01
    derivation:
      case:
        - when: "_AVISIT_OUT <> ''"
          then: "'Y'"
        - otherwise: "''"

rows:
  - id: base
    dataset: VS
    derivations:
      _SRC_AVISITN:
        mapping:
          source: VS.VISIT
          dict:
            BASELINE: 0.0
            WEEK 2: 2.0
            WEEK 4: 4.0
            WEEK 6: 6.0
            WEEK 8: 8.0
            WEEK 12: 12.0
            WEEK 16: 16.0
            WEEK 20: 20.0
            WEEK 24: 24.0
            WEEK 26: 26.0
          unmapped:
      _AVISIT_OUT: _SRC_AVISIT
      _AVISITN_OUT: _SRC_AVISITN
      _USUBJID:
      _VSTESTCD:
      _VSTPT:
      _RANK:

  - id: eot
    dataset: VS
    group_by:
      - VS.STUDYID
      - VS.USUBJID
      - VS.VSTESTCD
      - VS.VSTPT
      - VS.VSSEQ
      - VS.VISIT
      - VS.VSDTC
      - VS.VSDY
      - VS.VSTPTNUM
      - VS.VSSTRESN
      - VS.VISITNUM
    filter: "_RANK = 1 AND _SRC_AVISITN > 2"
    derivations:
      _USUBJID: VS.USUBJID
      _VSTESTCD: VS.VSTESTCD
      _VSTPT: VS.VSTPT
      _SRC_AVISITN:
        mapping:
          source: VS.VISIT
          dict:
            BASELINE: 0.0
            WEEK 2: 2.0
            WEEK 4: 4.0
            WEEK 6: 6.0
            WEEK 8: 8.0
            WEEK 12: 12.0
            WEEK 16: 16.0
            WEEK 20: 20.0
            WEEK 24: 24.0
            WEEK 26: 26.0
          unmapped:
      _AVISIT_OUT: "'End of Treatment'"
      _AVISITN_OUT: 99.0
      _RANK:
        rank:
          window: EOT_ORDER

verifications:
  - assert:
      id: treatment_date_order
      when: "TRTSDT IS NOT NULL AND TRTEDT IS NOT NULL"
      require: "TRTEDT >= TRTSDT"
