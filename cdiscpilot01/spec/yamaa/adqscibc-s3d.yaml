schema_version: "1.0"
domain: ADQSCIBC_S3D
keys: [USUBJID]
input:
  S2:
    path: adqscibc-s2.parquet
    empty_string: present
base: S2

rows:
  - id: w16sel
    dataset: S2
    filter: "S2._AVISITN = 16 AND S2._ANL01FL = 'Y'"
    derivations:
      _W16_AVAL: S2._AVAL
      _U: S2.USUBJID

output:
  path: adqscibc-s3d.parquet
  order_by: [USUBJID]
  columns: [USUBJID, _W16_AVAL]

columns:
  - name: _W16_AVAL
    type: float
  - name: _U
    type: str
  - name: USUBJID
    type: str
    derivation: {source: _U}
