schema_version: "1.0"
domain: ADQSCIBC
keys: [STUDYID, USUBJID, AVISITN, QSSEQ]
input:
  COMB:
    path: adqscibc-combined.parquet
    empty_string: present
base: COMB

rows:
  - id: final
    dataset: COMB
    derivations:
      _STUDYID: {literal: 'CDISCPILOT01'}
      _PARAMCD: {literal: 'CIBICVAL'}
      _PARAM: {literal: 'CIBIC Score'}
      _PARAMN: {literal: 1.0}
      _AWU: {literal: 'DAYS'}


output:
  path: adqscibc-final.parquet
  order_by: [USUBJID, AVISITN, QSSEQ]
  columns: [STUDYID, SITEID, SITEGR1, USUBJID, TRTSDT, TRTEDT, TRTP, TRTPN,
    AGE, AGEGR1, AGEGR1N, RACE, RACEN, SEX, ITTFL, EFFFL, COMP24FL,
    AVISIT, AVISITN, VISIT, VISITNUM, ADY, ADT,
    PARAMCD, PARAM, PARAMN, AVAL, ANL01FL, DTYPE,
    AWRANGE, AWTARGET, AWTDIFF, AWLO, AWHI, AWU, QSSEQ]

columns:
  - name: _STUDYID
    type: str
  - name: _PARAMCD
    type: str
  - name: _PARAM
    type: str
  - name: _PARAMN
    type: float
  - name: _AWU
    type: str

  - name: STUDYID
    label: Study Identifier
    type: str
    derivation: {source: _STUDYID}
  - name: SITEID
    label: Study Site Identifier
    type: str
    derivation: COMB._SITEID
  - name: SITEGR1
    label: Pooled Site Group 1
    type: str
    derivation: COMB._SITEGR1
  - name: USUBJID
    label: Unique Subject Identifier
    type: str
    derivation: COMB.USUBJID
  - name: TRTSDT
    label: Date of First Exposure to Treatment
    type: date
    derivation: COMB._TRTSDT
  - name: TRTEDT
    label: Date of Last Exposure to Treatment
    type: date
    derivation: COMB._TRTEDT
  - name: TRTP
    label: Planned Treatment
    type: str
    derivation: COMB._TRT01P
  - name: TRTPN
    label: Planned Treatment (N)
    type: float
    derivation: COMB._TRT01PN
  - name: AGE
    label: Age
    type: float
    derivation: COMB._AGE
  - name: AGEGR1
    label: Pooled Age Group 1
    type: str
    derivation: COMB._AGEGR1
  - name: AGEGR1N
    label: Pooled Age Group 1 (N)
    type: float
    derivation: COMB._AGEGR1N
  - name: RACE
    label: Race
    type: str
    derivation: COMB._RACE
  - name: RACEN
    label: Race (N)
    type: float
    derivation: COMB._RACEN
  - name: SEX
    label: Sex
    type: str
    derivation: COMB._SEX
  - name: ITTFL
    label: Intent-to-Treat Population Flag
    type: str
    derivation: COMB._ITTFL
  - name: EFFFL
    label: Efficacy Population Flag
    type: str
    derivation: COMB._EFFFL
  - name: COMP24FL
    label: Completers of Week 24 Population Flag
    type: str
    derivation: COMB._COMP24FL
  - name: AVISIT
    label: Analysis Visit
    type: str
    derivation: COMB._AVISIT
  - name: AVISITN
    label: Analysis Visit (N)
    type: float
    derivation: COMB._AVISITN
  - name: VISIT
    label: Visit Name
    type: str
    derivation: COMB.VISIT
  - name: VISITNUM
    label: Visit Number
    type: float
    derivation: COMB.VISITNUM
  - name: ADY
    label: Analysis Relative Day
    type: float
    derivation: COMB.QSDY
  - name: ADT
    type: date
    label: Analysis Date
    derivation:
      date_impute:
        source: COMB.QSDTC
        month: 1
        day: 1
        missing: null
        invalid: null
  - name: PARAMCD
    label: Parameter Code
    type: str
    derivation: {source: _PARAMCD}
  - name: PARAM
    label: Parameter
    type: str
    derivation: {source: _PARAM}
  - name: PARAMN
    label: Parameter (N)
    type: float
    derivation: {source: _PARAMN}
  - name: AVAL
    label: Analysis Value
    type: float
    derivation: COMB._AVAL
  - name: ANL01FL
    label: Analysis Record Flag 01
    type: str
    derivation: COMB._ANL01FL
  - name: DTYPE
    label: Derivation Type
    type: str
    derivation: COMB._DTYPE
  - name: AWRANGE
    label: Analysis Window Valid Relative Range
    type: str
    derivation: COMB._AWRANGE
  - name: AWTARGET
    label: Analysis Window Target
    type: float
    derivation: COMB._AWTARGET
  - name: AWTDIFF
    label: Analysis Window Diff from Target
    type: float
    derivation: COMB._AWTDIFF
  - name: AWLO
    label: Analysis Window Beginning Timepoint
    type: float
    derivation: COMB._AWLO
  - name: AWHI
    label: Analysis Window Ending Timepoint
    type: float
    derivation: COMB._AWHI
  - name: AWU
    label: Analysis Window Unit
    type: str
    derivation: {source: _AWU}
  - name: QSSEQ
    label: Sequence Number
    type: float
    derivation: COMB.QSSEQ
