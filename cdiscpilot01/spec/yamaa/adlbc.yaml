          - otherwise: {literal: 'Y'}
      _PREV_AVAL: PREV.PREV_AVAL

      _U_RAW:
        compute:
          expr: "(_AVAL_BASE - _PREV_AVAL) / (0.5 * (_B_A1HI - _B_A1LO))"
      _IS_LAST_ELIGIBLE:
        row_number:
          window:
            group_by: [USUBJID, _PARAMCD_BASE]
            order_by: [{variable: LBSEQ, direction: desc}]
            filter: "VISIT IN ('WEEK 2', 'WEEK 4', 'WEEK 6', 'WEEK 8',
