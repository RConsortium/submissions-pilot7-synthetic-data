yamaa: "1.0"
type: spec
model: ADaM
domain: ADLBC
keys:
  - STUDYID
  - USUBJID
  - PARAMCD
  - LBSEQ
  - AVISIT
input:
  LB:
    path: ../../data/sdtm/lb.parquet
    empty_string: present
    key:
      - STUDYID
      - USUBJID
  ADSL:
    path: ../../data/adam/adsl-yamaa.parquet
    schema: adsl.yaml
    empty_string: present
base: LB

output:
  path: ../../data/adam/adlbc-yamaa.parquet
  columns:
    - STUDYID
    - SUBJID
    - USUBJID
    - TRTP
    - TRTPN
    - TRTA
    - TRTAN
    - TRTSDT
    - TRTEDT
    - AGE
    - AGEGR1
    - AGEGR1N
    - RACE
    - RACEN
    - SEX
    - COMP24FL
    - DSRAEFL
    - SAFFL
    - AVISIT
    - AVISITN
    - ADY
    - ADT
    - VISIT
    - VISITNUM
    - PARAM
    - PARAMCD
    - PARAMN
    - PARCAT1
    - AVAL
    - BASE
    - CHG
    - A1LO
    - A1HI
    - R2A1LO
    - R2A1HI
    - BR2A1LO
    - BR2A1HI
    - ANL01FL
    - ALBTRVAL
    - ANRIND
    - BNRIND
    - ABLFL
    - AENTMTFL
    - LBSEQ
    - LBNRIND
    - LBSTRESN
  order_by:
    - variable: USUBJID
      nulls: last
    - variable: ADY
      nulls: last
    - variable: PARAMN
      nulls: last
    - variable: AVISITN
      nulls: last

intermediates:
  - id: ADSL_SBJ
    dataset: ADSL
    key:
      - USUBJID

  - id: PREV
    dataset: LB
    key:
      - USUBJID
      - LBTESTCD
      - LBSEQ
    filter: "LB.VISIT NOT LIKE 'UNSCHEDULED%'"
    columns:
      - PREV_AVAL
    derivations:
      PREV_AVAL:
        row_value:
          source: LB.LBSTRESN
          offset: -1
          window:
            group_by:
              - LB.USUBJID
              - LB.LBTESTCD
            order_by:
              - {variable: LB.LBDTC, nulls: last}
              - {variable: LB.LBSEQ, nulls: last}
            filter: "LB.VISIT NOT LIKE 'UNSCHEDULED%'"

columns:
  # ADSL lookups (via ADSL_SBJ intermediate)
  - name: STUDYID
    type: str
    label: Study Identifier

  - name: SUBJID
    type: str
    label: Subject Identifier for the Study
    derivation: ADSL_SBJ.SUBJID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier

  - name: TRTP
    type: str
    label: Planned Treatment
    derivation: ADSL_SBJ.TRT01P

  - name: TRTPN
    type: float
    label: Planned Treatment (N)
    derivation: ADSL_SBJ.TRT01PN

  - name: TRTA
    type: str
    label: Actual Treatment
    derivation: ADSL_SBJ.TRT01A

  - name: TRTAN
    type: float
    label: Actual Treatment (N)
    derivation: ADSL_SBJ.TRT01AN

  - name: TRTSDT
    type: date
    label: Date of First Exposure to Treatment
    derivation: ADSL_SBJ.TRTSDT

  - name: TRTEDT
    type: date
    label: Date of Last Exposure to Treatment
    derivation: ADSL_SBJ.TRTEDT

  - name: AGE
    type: float
    label: Age
    derivation: ADSL_SBJ.AGE

  - name: AGEGR1
    type: str
    label: Pooled Age Group 1
    derivation: ADSL_SBJ.AGEGR1

  - name: AGEGR1N
    type: float
    label: Pooled Age Group 1 (N)
    derivation: ADSL_SBJ.AGEGR1N

  - name: RACE
    type: str
    label: Race
    derivation: ADSL_SBJ.RACE

  - name: RACEN
    type: float
    label: Race (N)
    derivation: ADSL_SBJ.RACEN

  - name: SEX
    type: str
    label: Sex
    derivation: ADSL_SBJ.SEX

  - name: COMP24FL
    type: str
    label: Completers of Week 24 Population Flag
    derivation: ADSL_SBJ.COMP24FL

  - name: DSRAEFL
    type: str
    label: Discontinued due to AE?
    derivation: ADSL_SBJ.DSRAEFL

  - name: SAFFL
    type: str
    label: Safety Population Flag
    derivation: ADSL_SBJ.SAFFL

  # Helpers (not in output)
  - name: _IS_UNDER
    type: str
    label: "Working value: _IS_UNDER"

  - name: _IS_EOT
    type: str
    label: "Working value: _IS_EOT"

  - name: LBTESTCD
    type: str
    label: "Working value: LBTESTCD"

  - name: _LBDTM_TXT
    type: str
    label: "Working value: _LBDTM_TXT"

  - name: _LBDTM
    type: datetime
    label: "Working value: _LBDTM"

  - name: _ADT_DATE
    type: date
    label: "Working value: _ADT_DATE"

  - name: _PARAM_BASE
    type: str
    label: "Working value: _PARAM_BASE"

  - name: _PARAMN_BASE
    type: float
    label: "Working value: _PARAMN_BASE"

  - name: _AVAL_BASE
    type: float
    label: "Working value: _AVAL_BASE"

  - name: _BASE
    type: float
    label: "Working value: _BASE"

  - name: _BASELINE_AVAL
    type: float
    label: "Working value: _BASELINE_AVAL"

  - name: _PNM_BASE
    type: float
    label: "Working value: _PNM_BASE"

  - name: _IS_LAST_ELIGIBLE
    type: int
    label: "Working value: _IS_LAST_ELIGIBLE"

  - name: _RANK_AVISITN
    type: float
    label: "Working value: _RANK_AVISITN"

  - name: _T1
    type: float
    label: "Working value: _T1"

  - name: _T2
    type: float
    label: "Working value: _T2"

  - name: _B_A1HI
    type: float
    label: "Working value: _B_A1HI"

  - name: _B_A1LO
    type: float
    label: "Working value: _B_A1LO"

  - name: _PARAMCD_BASE
    type: str
    label: "Working value: _PARAMCD_BASE"

  - name: _SCHED
    type: str
    label: "Working value: _SCHED"

  - name: _PREV_AVAL
    type: float
    label: "Working value: _PREV_AVAL"

  - name: _U_RAW
    type: float
    label: "Working value: _U_RAW"

  - name: _U_AVAL_ROUNDED
    type: float
    label: "Working value: _U_AVAL_ROUNDED"
    derivation:
      round_half_away_from_zero:
        source: _U_RAW
        digits: 1

  - name: _U_AVAL
    type: float
    label: "Working value: _U_AVAL"
    derivation:
      case:
        - when: "_IS_UNDER = 'Y' AND _SCHED = 'Y'"
          then: _U_AVAL_ROUNDED
        - otherwise:

  - name: _ABS_U_AVAL
    type: float
    label: "Working value: _ABS_U_AVAL"
    derivation: "abs(_U_AVAL)"

  - name: _R2A1HI_R
    type: float
    label: "Working value: _R2A1HI_R"

  - name: _R2A1LO_R
    type: float
    label: "Working value: _R2A1LO_R"

  - name: _ANRIND_BASE
    type: str
    label: "Working value: _ANRIND_BASE"

  - name: _BASELINE_ANRIND
    type: str
    label: "Working value: _BASELINE_ANRIND"

  - name: _PNM_BNRIND
    type: str
    label: "Working value: _PNM_BNRIND"

  - name: _BNRIND_VAL
    type: str
    label: "Working value: _BNRIND_VAL"

  - name: _LBCAT
    type: str
    label: "Working value: _LBCAT"

  - name: _VISIT_RAW
    type: str
    label: "Working value: _VISIT_RAW"

  - name: _LBBLFL
    type: str
    label: "Working value: _LBBLFL"

  - name: _LBTESTCD
    type: str
    label: "Working value: _LBTESTCD"

  - name: ABLFL
    type: str
    label: Baseline Record Flag

  - name: ALBTRVAL
    type: float
    label: Amount Threshold Range

  - name: _RANK_VAL
    type: float
    label: "Working value: _RANK_VAL"
    derivation:
      case:
        - when: "_IS_UNDER = 'Y'"
          then: _ABS_U_AVAL
        - otherwise: ALBTRVAL

  - name: _ANL01_RANK
    type: int
    label: "Working value: _ANL01_RANK"
    derivation:
      rank:
        window:
          group_by:
            - USUBJID
            - PARAMCD
          order_by:
            - {variable: _RANK_VAL, direction: desc, nulls: last}
            - {variable: _RANK_AVISITN, nulls: last}
            - {variable: _ADT_DATE, nulls: last}
            - {variable: LBSEQ, nulls: last}
          filter: "_RANK_AVISITN >= 2 AND _RANK_AVISITN <= 24"

  # Row-level
  - name: AVISIT
    type: str
    label: Analysis Visit

  - name: AVISITN
    type: float
    label: Analysis Visit (N)

  - name: ADY
    type: float
    label: Analysis Relative Day
    derivation:
      study_day:
        source: _ADT_DATE
        reference: TRTSDT

  - name: ADT
    type: date
    label: Analysis Date
    derivation: _ADT_DATE

  - name: VISIT
    type: str
    label: Visit Name

  - name: VISITNUM
    type: float
    label: Visit Number

  - name: PARAM
    type: str
    label: Parameter
    derivation:
      case:
        - when: "_IS_UNDER = 'Y'"
          then:
            str_template: "{_PARAM_BASE} change from previous visit,
              relative to normal range"
        - otherwise: _PARAM_BASE

  - name: PARAMCD
    type: str
    label: Parameter Code

  - name: PARAMN
    type: float
    label: Parameter (N)
    derivation:
      case:
        - when: "_IS_UNDER = 'Y'"
          then: "_PARAMN_BASE + 100"
        - otherwise: _PARAMN_BASE

  - name: PARCAT1
    type: str
    label: Parameter Category 1
    derivation: "'CHEM'"

  - name: AVAL
    type: float
    label: Analysis Value
    derivation:
      case:
        - when: "_IS_UNDER = 'Y'"
          then: _U_AVAL
        - otherwise: _AVAL_BASE

  - name: BASE
    type: float
    label: Baseline Value
    derivation: _BASE

  - name: CHG
    type: float
    label: Change from Baseline
    derivation:
      case:
        - when: "_IS_UNDER = 'Y'"
          then:
        - when: "ABLFL = 'Y'"
          then:
        - otherwise: "_AVAL_BASE - _BASE"

  - name: A1LO
    type: float
    label: Analysis Range 1 Lower Limit

  - name: A1HI
    type: float
    label: Analysis Range 1 Upper Limit

  - name: R2A1LO
    type: float
    label: Ratio to Analysis Range 1 Lower Limit
    derivation: "_AVAL_BASE / A1LO"

  - name: R2A1HI
    type: float
    label: Ratio to Analysis Range 1 Upper Limit
    derivation: "_AVAL_BASE / A1HI"

  - name: BR2A1LO
    type: float
    label: Base Ratio to Analysis Range 1 Lower Lim
    derivation:
      case:
        - when: "_IS_UNDER = 'Y'"
          then:
        - otherwise: "_BASE / A1LO"

  - name: BR2A1HI
    type: float
    label: Base Ratio to Analysis Range 1 Upper Lim
    derivation:
      case:
        - when: "_IS_UNDER = 'Y'"
          then:
        - otherwise: "_BASE / A1HI"

  - name: ANL01FL
    type: str
    label: Analysis Record Flag 1
    derivation:
      case:
        - when: "_ANL01_RANK = 1 AND _RANK_VAL IS NOT NULL"
          then: "'Y'"
        - otherwise: "''"

  - name: ANRIND
    type: str
    label: Analysis Reference Range Indicator
    derivation:
      case:
        - when: "_IS_UNDER = 'Y' AND _U_AVAL IS NULL"
          then: "''"
        - when: "_IS_UNDER = 'Y' AND _U_AVAL > 1.0"
          then: "'H'"
        - when: "_IS_UNDER = 'Y' AND _U_AVAL < -1.0"
          then: "'L'"
        - when: "_IS_UNDER = 'Y'"
          then: "'N'"
        - otherwise: _ANRIND_BASE

  - name: BNRIND
    type: str
    label: Baseline Reference Range Indicator
    derivation:
      case:
        - when: "_IS_UNDER = 'Y'"
          then: "''"
        - when: "_BNRIND_VAL IS NULL"
          then: "''"
        - otherwise: _BNRIND_VAL

  - name: AENTMTFL
    type: str
    label: Last value in treatment visit
    derivation:
      case:
        - when: "_IS_EOT = 'Y'"
          then: "'Y'"
        - when: "_IS_LAST_ELIGIBLE = 1"
          then: "'Y'"
        - otherwise: "''"

  - name: LBSEQ
    type: float
    label: Sequence Number

  - name: LBNRIND
    type: str
    label: Reference Range Indicator

  - name: LBSTRESN
    type: float
    label: Numeric Result/Finding in Standard Units

rows:
  # ------------------------------------------------------------------
  # base-ord: ordinary base rows (one per chemistry LB record)
  # ------------------------------------------------------------------
  - id: base-ord
    dataset: LB
    filter: "LB.LBCAT = 'CHEMISTRY' AND LB.VISIT NOT IN ('RETRIEVAL',
      'AMBUL ECG REMOVAL')"
    derivations:
      STUDYID: LB.STUDYID
      USUBJID: LB.USUBJID
      PARAMCD: LB.LBTESTCD
      _IS_UNDER: "''"
      _IS_EOT: "''"
      VISIT: LB.VISIT
      VISITNUM: LB.VISITNUM
      LBSEQ: LB.LBSEQ
      LBNRIND: LB.LBNRIND
      LBSTRESN: LB.LBSTRESN
      A1LO: LB.LBSTNRLO
      A1HI: LB.LBSTNRHI
      _LBDTM_TXT: LB.LBDTC
      _LBDTM:
        impute:
          type: datetime
          source: _LBDTM_TXT
          time: first
          invalid:
      _ADT_DATE:
        to_date:
          source: _LBDTM
      AVISIT:
        case:
          - when: "LB.VISIT = 'SCREENING 1'"
            then: "'        Baseline'"
          - when: "LB.VISIT = 'WEEK 2'"
            then: "'          Week 2'"
          - when: "LB.VISIT = 'WEEK 4'"
            then: "'          Week 4'"
          - when: "LB.VISIT = 'WEEK 6'"
            then: "'          Week 6'"
          - when: "LB.VISIT = 'WEEK 8'"
            then: "'          Week 8'"
          - when: "LB.VISIT = 'WEEK 12'"
            then: "'         Week 12'"
          - when: "LB.VISIT = 'WEEK 16'"
            then: "'         Week 16'"
          - when: "LB.VISIT = 'WEEK 20'"
            then: "'         Week 20'"
          - when: "LB.VISIT = 'WEEK 24'"
            then: "'         Week 24'"
          - when: "LB.VISIT = 'WEEK 26'"
            then: "'         Week 26'"
          - otherwise: "'               .'"
      AVISITN:
        case:
          - when: "LB.VISIT = 'SCREENING 1'"
            then: 0.0
          - when: "LB.VISIT = 'WEEK 2'"
            then: 2.0
          - when: "LB.VISIT = 'WEEK 4'"
            then: 4.0
          - when: "LB.VISIT = 'WEEK 6'"
            then: 6.0
          - when: "LB.VISIT = 'WEEK 8'"
            then: 8.0
          - when: "LB.VISIT = 'WEEK 12'"
            then: 12.0
          - when: "LB.VISIT = 'WEEK 16'"
            then: 16.0
          - when: "LB.VISIT = 'WEEK 20'"
            then: 20.0
          - when: "LB.VISIT = 'WEEK 24'"
            then: 24.0
          - when: "LB.VISIT = 'WEEK 26'"
            then: 26.0
          - otherwise:
      ABLFL:
        case:
          - when: "LB.LBBLFL = 'Y'"
            then: "'Y'"
          - otherwise: "''"
      _PARAM_BASE:
        mapping:
          source: LB.LBTESTCD
          unmapped:
          dict:
            SODIUM: 'Sodium (mmol/L)'
            K: 'Potassium (mmol/L)'
            CL: 'Chloride (mmol/L)'
            BILI: 'Bilirubin (umol/L)'
            ALP: 'Alkaline Phosphatase (U/L)'
            GGT: 'Gamma Glutamyl Transferase (U/L)'
            ALT: 'Alanine Aminotransferase (U/L)'
            AST: 'Aspartate Aminotransferase (U/L)'
            BUN: 'Blood Urea Nitrogen (mmol/L)'
            CREAT: 'Creatinine (umol/L)'
            URATE: 'Urate (umol/L)'
            PHOS: 'Phosphate (mmol/L)'
            CA: 'Calcium (mmol/L)'
            GLUC: 'Glucose (mmol/L)'
            PROT: 'Protein (g/L)'
            ALB: 'Albumin (g/L)'
            CHOL: 'Cholesterol (mmol/L)'
            CK: 'Creatine Kinase (U/L)'
      _PARAMN_BASE:
        mapping:
          source: LB.LBTESTCD
          unmapped:
          dict:
            SODIUM: 18.0
            K: 19.0
            CL: 20.0
            BILI: 21.0
            ALP: 22.0
            GGT: 23.0
            ALT: 24.0
            AST: 25.0
            BUN: 26.0
            CREAT: 27.0
            URATE: 28.0
            PHOS: 29.0
            CA: 30.0
            GLUC: 31.0
            PROT: 32.0
            ALB: 33.0
            CHOL: 34.0
            CK: 35.0
      _AVAL_BASE: LB.LBSTRESN
      _BASELINE_AVAL:
        case:
          - when: "ABLFL = 'Y'"
            then: _AVAL_BASE
          - otherwise:
      _PNM_BASE:
        locf:
          source: _BASELINE_AVAL
          window:
            group_by:
              - USUBJID
              - PARAMCD
            order_by:
              - {variable: LBSEQ, nulls: last}
      _BASE:
        first_available:
          sources:
            - _BASELINE_AVAL
            - _PNM_BASE
      _IS_LAST_ELIGIBLE:
        row_number:
          window:
            group_by:
              - USUBJID
              - PARAMCD
            order_by:
              - {variable: LBSEQ, direction: desc, nulls: last}
            filter: "VISIT IN ('WEEK 2', 'WEEK 4', 'WEEK 6', 'WEEK
              8', 'WEEK 12', 'WEEK 16', 'WEEK 20', 'WEEK 24')"
      _RANK_AVISITN: AVISITN
      _B_A1HI:
      _B_A1LO:
      _T1: "1.5 * A1HI - _AVAL_BASE"
      _T2: "_AVAL_BASE - 0.5 * A1LO"
      ALBTRVAL:
        greatest:
          sources:
            - _T1
            - _T2
      _R2A1HI_R: "_AVAL_BASE / A1HI"
      _R2A1LO_R:
        case:
          - when: "A1LO IS NULL OR A1LO = 0"
            then:
          - otherwise: "_AVAL_BASE / A1LO"
      _ANRIND_BASE:
        case:
          - when: "_R2A1HI_R > 1.5"
            then: "'H'"
          - when: "_R2A1LO_R < 0.5"
            then: "'L'"
          - otherwise: "'N'"
      _BASELINE_ANRIND:
        case:
          - when: "ABLFL = 'Y'"
            then: _ANRIND_BASE
          - otherwise:
      _PNM_BNRIND:
        locf:
          source: _BASELINE_ANRIND
          window:
            group_by:
              - USUBJID
              - PARAMCD
            order_by:
              - {variable: LBSEQ, nulls: last}
      _BNRIND_VAL:
        first_available:
          sources:
            - _BASELINE_ANRIND
            - _PNM_BNRIND
      _LBCAT:
      _VISIT_RAW:
      _LBBLFL:
      _LBTESTCD:
      _PARAMCD_BASE:
      LBTESTCD: LB.LBTESTCD
      _SCHED:
      _PREV_AVAL:
      _U_RAW:

  - id: base-eot
    dataset: LB
    group_by:
      - LB.USUBJID
      - LB.LBTESTCD
      - LB.LBSEQ
    filter: "_IS_LAST_ELIGIBLE = 1"
    derivations:
      STUDYID:
        aggregate: "ONLY(LB.STUDYID)"
      USUBJID: LB.USUBJID
      PARAMCD: LB.LBTESTCD
      LBSEQ: LB.LBSEQ
      _IS_UNDER: "''"
      _IS_EOT: "'Y'"
      _LBCAT:
        aggregate: "ONLY(LB.LBCAT)"
      _VISIT_RAW:
        aggregate: "ONLY(LB.VISIT)"
      VISIT:
        aggregate: "ONLY(LB.VISIT)"
      VISITNUM:
        aggregate: "ONLY(LB.VISITNUM)"
      LBNRIND:
        aggregate: "ONLY(LB.LBNRIND)"
      LBSTRESN:
        aggregate: "ONLY(LB.LBSTRESN)"
      A1LO:
        aggregate: "ONLY(LB.LBSTNRLO)"
      A1HI:
        aggregate: "ONLY(LB.LBSTNRHI)"
      _LBDTM_TXT:
        aggregate: "ONLY(LB.LBDTC)"
      _LBDTM:
        impute:
          type: datetime
          source: _LBDTM_TXT
          time: first
          invalid:
      _ADT_DATE:
        to_date:
          source: _LBDTM
      _LBBLFL:
        aggregate: "ONLY(LB.LBBLFL)"
      _LBTESTCD:
        aggregate: "ONLY(LB.LBTESTCD)"
      AVISIT: "'End of Treatment'"
      AVISITN: 99.0
      ABLFL: "''"
      _PARAM_BASE:
        case:
          - when: "_LBTESTCD = 'SODIUM'"
            then: "'Sodium (mmol/L)'"
          - when: "_LBTESTCD = 'K'"
            then: "'Potassium (mmol/L)'"
          - when: "_LBTESTCD = 'CL'"
            then: "'Chloride (mmol/L)'"
          - when: "_LBTESTCD = 'BILI'"
            then: "'Bilirubin (umol/L)'"
          - when: "_LBTESTCD = 'ALP'"
            then: "'Alkaline Phosphatase (U/L)'"
          - when: "_LBTESTCD = 'GGT'"
            then: "'Gamma Glutamyl Transferase (U/L)'"
          - when: "_LBTESTCD = 'ALT'"
            then: "'Alanine Aminotransferase (U/L)'"
          - when: "_LBTESTCD = 'AST'"
            then: "'Aspartate Aminotransferase (U/L)'"
          - when: "_LBTESTCD = 'BUN'"
            then: "'Blood Urea Nitrogen (mmol/L)'"
          - when: "_LBTESTCD = 'CREAT'"
            then: "'Creatinine (umol/L)'"
          - when: "_LBTESTCD = 'URATE'"
            then: "'Urate (umol/L)'"
          - when: "_LBTESTCD = 'PHOS'"
            then: "'Phosphate (mmol/L)'"
          - when: "_LBTESTCD = 'CA'"
            then: "'Calcium (mmol/L)'"
          - when: "_LBTESTCD = 'GLUC'"
            then: "'Glucose (mmol/L)'"
          - when: "_LBTESTCD = 'PROT'"
            then: "'Protein (g/L)'"
          - when: "_LBTESTCD = 'ALB'"
            then: "'Albumin (g/L)'"
          - when: "_LBTESTCD = 'CHOL'"
            then: "'Cholesterol (mmol/L)'"
          - when: "_LBTESTCD = 'CK'"
            then: "'Creatine Kinase (U/L)'"
          - otherwise:
      _PARAMN_BASE:
        case:
          - when: "_LBTESTCD = 'SODIUM'"
            then: 18.0
          - when: "_LBTESTCD = 'K'"
            then: 19.0
          - when: "_LBTESTCD = 'CL'"
            then: 20.0
          - when: "_LBTESTCD = 'BILI'"
            then: 21.0
          - when: "_LBTESTCD = 'ALP'"
            then: 22.0
          - when: "_LBTESTCD = 'GGT'"
            then: 23.0
          - when: "_LBTESTCD = 'ALT'"
            then: 24.0
          - when: "_LBTESTCD = 'AST'"
            then: 25.0
          - when: "_LBTESTCD = 'BUN'"
            then: 26.0
          - when: "_LBTESTCD = 'CREAT'"
            then: 27.0
          - when: "_LBTESTCD = 'URATE'"
            then: 28.0
          - when: "_LBTESTCD = 'PHOS'"
            then: 29.0
          - when: "_LBTESTCD = 'CA'"
            then: 30.0
          - when: "_LBTESTCD = 'GLUC'"
            then: 31.0
