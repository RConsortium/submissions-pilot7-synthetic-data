schema_version: "1.0"
domain: ADLBC
keys: [STUDYID, USUBJID, PARAMCD, LBSEQ, AVISIT]
input:
  SRC:
    path: upstream/adlbc_input.parquet
    empty_string: present
base: SRC
rows:
  - id: all-rows
    dataset: SRC
    derivations: {}
output:
  path: output/adlbc.parquet
  order_by: [USUBJID, ADY, PARAMN, AVISITN]
  columns: [STUDYID, SUBJID, USUBJID, TRTP, TRTPN, TRTA, TRTAN, TRTSDT, TRTEDT, AGE, AGEGR1, AGEGR1N, RACE, RACEN, SEX, COMP24FL, DSRAEFL, SAFFL, AVISIT, AVISITN, ADY, ADT, VISIT, VISITNUM, PARAM, PARAMCD, PARAMN, PARCAT1, AVAL, BASE, CHG, A1LO, A1HI, R2A1LO, R2A1HI, BR2A1LO, BR2A1HI, ANL01FL, ALBTRVAL, ANRIND, BNRIND, ABLFL, AENTMTFL, LBSEQ, LBNRIND, LBSTRESN]
columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: SRC.STUDYID
  - name: SUBJID
    type: str
    label: Subject Identifier for the Study
    derivation: SRC.SUBJID
  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: SRC.USUBJID
  - name: TRTP
    type: str
    label: Planned Treatment
    derivation: SRC.TRTP
  - name: TRTPN
    type: float
    label: Planned Treatment (N)
    derivation: SRC.TRTPN
  - name: TRTA
    type: str
    label: Actual Treatment
    derivation: SRC.TRTA
  - name: TRTAN
    type: float
    label: Actual Treatment (N)
    derivation: SRC.TRTAN
  - name: TRTSDT
    type: date
    label: Date of First Exposure to Treatment
    derivation: SRC.TRTSDT
  - name: TRTEDT
    type: date
    label: Date of Last Exposure to Treatment
    derivation: SRC.TRTEDT
  - name: AGE
    type: float
    label: Age
    derivation: SRC.AGE
  - name: AGEGR1
    type: str
    label: Pooled Age Group 1
    derivation: SRC.AGEGR1
  - name: AGEGR1N
    type: float
    label: Pooled Age Group 1 (N)
    derivation: SRC.AGEGR1N
  - name: RACE
    type: str
    label: Race
    derivation: SRC.RACE
  - name: RACEN
    type: float
    label: Race (N)
    derivation: SRC.RACEN
  - name: SEX
    type: str
    label: Sex
    derivation: SRC.SEX
  - name: COMP24FL
    type: str
    label: Completers of Week 24 Population Flag
    derivation: SRC.COMP24FL
  - name: DSRAEFL
    type: str
    label: Discontinued due to AE?
    derivation: SRC.DSRAEFL
  - name: SAFFL
    type: str
    label: Safety Population Flag
    derivation: SRC.SAFFL
  - name: AVISIT
    type: str
    label: Analysis Visit
    derivation: SRC.AVISIT
  - name: AVISITN
    type: float
    label: Analysis Visit (N)
    derivation: SRC.AVISITN
  - name: ADY
    type: float
    label: Analysis Relative Day
    derivation: SRC.ADY
  - name: ADT
    type: date
    label: Analysis Date
    derivation: SRC.ADT
  - name: VISIT
    type: str
    label: Visit Name
    derivation: SRC.VISIT
  - name: VISITNUM
    type: float
    label: Visit Number
    derivation: SRC.VISITNUM
  - name: PARAM
    type: str
    label: Parameter
    derivation: SRC.PARAM
  - name: PARAMCD
    type: str
    label: Parameter Code
    derivation: SRC.PARAMCD
  - name: PARAMN
    type: float
    label: Parameter (N)
    derivation: SRC.PARAMN
  - name: PARCAT1
    type: str
    label: Parameter Category 1
    derivation: SRC.PARCAT1
  - name: AVAL
    type: float
    label: Analysis Value
    derivation: SRC.AVAL
  - name: BASE
    type: float
    label: Baseline Value
    derivation: SRC.BASE
  - name: CHG
    type: float
    label: Change from Baseline
    derivation: SRC.CHG
  - name: A1LO
    type: float
    label: Analysis Range 1 Lower Limit
    derivation: SRC.A1LO
  - name: A1HI
    type: float
    label: Analysis Range 1 Upper Limit
    derivation: SRC.A1HI
  - name: R2A1LO
    type: float
    label: Ratio to Analysis Range 1 Lower Limit
    derivation: SRC.R2A1LO
  - name: R2A1HI
    type: float
    label: Ratio to Analysis Range 1 Upper Limit
    derivation: SRC.R2A1HI
  - name: BR2A1LO
    type: float
    label: Base Ratio to Analysis Range 1 Lower Lim
    derivation: SRC.BR2A1LO
  - name: BR2A1HI
    type: float
    label: Base Ratio to Analysis Range 1 Upper Lim
    derivation: SRC.BR2A1HI
  - name: ANL01FL
    type: str
    label: Analysis Record Flag 1
    derivation: SRC.ANL01FL
  - name: ALBTRVAL
    type: float
    label: Amount Threshold Range
    derivation: SRC.ALBTRVAL
  - name: ANRIND
    type: str
    label: Analysis Reference Range Indicator
    derivation: SRC.ANRIND
  - name: BNRIND
    type: str
    label: Baseline Reference Range Indicator
    derivation: SRC.BNRIND
  - name: ABLFL
    type: str
    label: Baseline Record Flag
    derivation: SRC.ABLFL
  - name: AENTMTFL
    type: str
    label: Last value in treatment visit
    derivation: SRC.AENTMTFL
  - name: LBSEQ
    type: float
    label: Sequence Number
    derivation: SRC.LBSEQ
  - name: LBNRIND
    type: str
    label: Reference Range Indicator
    derivation: SRC.LBNRIND
  - name: LBSTRESN
    type: float
    label: Numeric Result/Finding in Standard Units
    derivation: SRC.LBSTRESN
