schema_version: "1.0"
domain: ADLBC
keys: [STUDYID, USUBJID, PARAMCD, LBSEQ, AVISIT]
input:
  LB:
    path: ../../data/sdtm/lb.parquet
    empty_string: present
  ADSL:
    path: ../../data/adam/adsl-yamaa.parquet
    empty_string: present
base: LB

output:
  path: ../../data/adam/adlbc-yamaa.parquet
  columns: [STUDYID, SUBJID, USUBJID, TRTP, TRTPN, TRTA, TRTAN, TRTSDT, TRTEDT,
            AGE, AGEGR1, AGEGR1N, RACE, RACEN, SEX, COMP24FL, DSRAEFL, SAFFL,
            AVISIT, AVISITN, ADY, ADT, VISIT, VISITNUM, PARAM, PARAMCD, PARAMN,
            PARCAT1, AVAL, BASE, CHG, A1LO, A1HI, R2A1LO, R2A1HI, BR2A1LO,
            BR2A1HI, ANL01FL, ALBTRVAL, ANRIND, BNRIND, ABLFL, AENTMTFL, LBSEQ,
            LBNRIND, LBSTRESN]
  order_by: [USUBJID, ADY, PARAMN, AVISITN]

intermediates:
  - id: ADSL_SBJ
    dataset: ADSL
    key: [USUBJID]

  # PREV: previous scheduled AVAL within (USUBJID, LBTESTCD), ordered by
  # (LBDTC, LBSEQ). Replaces the adlbc-prevmap.yaml stage + Python join:
  # unscheduled records (VISIT LIKE 'UNSCHEDULED%') are excluded from the
  # shift, matching upstream build_adlbc.py.
  - id: PREV
    dataset: LB
    key: [USUBJID, LBTESTCD, LBSEQ]
    filter: "LB.VISIT NOT LIKE 'UNSCHEDULED%'"
    columns: [PREV_AVAL]
    no_match: null
    derivations:
      PREV_AVAL:
        row_value:
          source: LB.LBSTRESN
          offset: -1
          window:
            group_by: [LB.USUBJID, LB.LBTESTCD]
            order_by: [{variable: LB.LBDTC}, {variable: LB.LBSEQ}]
            filter: "LB.VISIT NOT LIKE 'UNSCHEDULED%'"

columns:
  # ADSL lookups (via ADSL_SBJ intermediate)
  - name: STUDYID
    type: str
    label: Study Identifier

  - name: SUBJID
    type: str
    label: Subject Identifier for the Study
    derivation: ADSL_SBJ.SUBJID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier

  - name: TRTP
    type: str
    label: Planned Treatment
    derivation: ADSL_SBJ.TRT01P

  - name: TRTPN
    type: float
    label: Planned Treatment (N)
    derivation: ADSL_SBJ.TRT01PN

  - name: TRTA
    type: str
    label: Actual Treatment
    derivation: ADSL_SBJ.TRT01A

  - name: TRTAN
    type: float
    label: Actual Treatment (N)
    derivation: ADSL_SBJ.TRT01AN

  - name: TRTSDT
    type: date
    label: Date of First Exposure to Treatment
    derivation: ADSL_SBJ.TRTSDT

  - name: TRTEDT
    type: date
    label: Date of Last Exposure to Treatment
    derivation: ADSL_SBJ.TRTEDT

  - name: AGE
    type: float
    label: Age
    derivation: ADSL_SBJ.AGE

  - name: AGEGR1
    type: str
    label: Pooled Age Group 1
    derivation: ADSL_SBJ.AGEGR1

  - name: AGEGR1N
    type: float
    label: Pooled Age Group 1 (N)
    derivation: ADSL_SBJ.AGEGR1N

  - name: RACE
    type: str
    label: Race
    derivation: ADSL_SBJ.RACE

  - name: RACEN
    type: float
    label: Race (N)
    derivation: ADSL_SBJ.RACEN

  - name: SEX
    type: str
    label: Sex
    derivation: ADSL_SBJ.SEX

  - name: COMP24FL
    type: str
    label: Completers of Week 24 Population Flag
    derivation: ADSL_SBJ.COMP24FL

  - name: DSRAEFL
    type: str
    label: Discontinued due to AE?
    derivation: ADSL_SBJ.DSRAEFL

  - name: SAFFL
    type: str
    label: Safety Population Flag
    derivation: ADSL_SBJ.SAFFL

  # Helpers (not in output)
  - name: _IS_UNDER
    type: str
    label: "Working value: _IS_UNDER"

  - name: _IS_EOT
    type: str
    label: "Working value: _IS_EOT"

  - name: LBTESTCD
    type: str
    label: "Working value: LBTESTCD"

  - name: _LBDTM_TXT
    type: str
    label: "Working value: _LBDTM_TXT"

  - name: _LBDTM
    type: datetime
    label: "Working value: _LBDTM"

  - name: _ADT_DATE
    type: date
    label: "Working value: _ADT_DATE"

  - name: _PARAM_BASE
    type: str
    label: "Working value: _PARAM_BASE"

  - name: _PARAMN_BASE
    type: float
    label: "Working value: _PARAMN_BASE"

  - name: _AVAL_BASE
    type: float
    label: "Working value: _AVAL_BASE"

  - name: _BASE
    type: float
    label: "Working value: _BASE"

  - name: _BASELINE_AVAL
    type: float
    label: "Working value: _BASELINE_AVAL"

  - name: _PNM_BASE
    type: float
    label: "Working value: _PNM_BASE"

  - name: _IS_LAST_ELIGIBLE
    type: int
    label: "Working value: _IS_LAST_ELIGIBLE"

  - name: _RANK_AVISITN
    type: float
    label: "Working value: _RANK_AVISITN"

  - name: _T1
    type: float
    label: "Working value: _T1"

  - name: _T2
    type: float
    label: "Working value: _T2"

  - name: _B_A1HI
    type: float
    label: "Working value: _B_A1HI"

  - name: _B_A1LO
    type: float
    label: "Working value: _B_A1LO"

  - name: _PARAMCD_BASE
    type: str
    label: "Working value: _PARAMCD_BASE"

  - name: _SCHED
    type: str
    label: "Working value: _SCHED"

  - name: _PREV_AVAL
    type: float
    label: "Working value: _PREV_AVAL"

  - name: _U_RAW
    type: float
    label: "Working value: _U_RAW"

  - name: _U_AVAL_ROUNDED
    type: float
    label: "Working value: _U_AVAL_ROUNDED"
    derivation:
      round_half_away_from_zero:
        source: _U_RAW
        digits: 1

  - name: _U_AVAL
    type: float
    label: "Working value: _U_AVAL"
    derivation:
      case:
        - when: "_IS_UNDER = 'Y' AND _SCHED = 'Y'"
          then: _U_AVAL_ROUNDED
        - otherwise: {literal: null}

  - name: _ABS_U_AVAL
    type: float
    label: "Working value: _ABS_U_AVAL"
    derivation:
      compute:
        expr: "abs(_U_AVAL)"

  - name: _R2A1HI_R
    type: float
    label: "Working value: _R2A1HI_R"

  - name: _R2A1LO_R
    type: float
    label: "Working value: _R2A1LO_R"

  - name: _ANRIND_BASE
    type: str
    label: "Working value: _ANRIND_BASE"

  - name: _BASELINE_ANRIND
    type: str
    label: "Working value: _BASELINE_ANRIND"

  - name: _PNM_BNRIND
    type: str
    label: "Working value: _PNM_BNRIND"

  - name: _BNRIND_VAL
    type: str
    label: "Working value: _BNRIND_VAL"

  - name: _LBCAT
    type: str
    label: "Working value: _LBCAT"

  - name: _VISIT_RAW
    type: str
    label: "Working value: _VISIT_RAW"

  - name: _LBBLFL
    type: str
    label: "Working value: _LBBLFL"

  - name: _LBTESTCD
    type: str
    label: "Working value: _LBTESTCD"

  - name: ABLFL
    type: str
    label: Baseline Record Flag

  - name: ALBTRVAL
    type: float
    label: Amount Threshold Range

  - name: _RANK_VAL
    type: float
    label: "Working value: _RANK_VAL"
    derivation:
      case:
        - when: "_IS_UNDER = 'Y'"
          then: _ABS_U_AVAL
        - otherwise: ALBTRVAL

  - name: _ANL01_RANK
    type: int
    label: "Working value: _ANL01_RANK"
    derivation:
      rank:
        window:
          group_by: [USUBJID, PARAMCD]
          order_by: [{variable: _RANK_VAL, direction: desc},
            {variable: _RANK_AVISITN}, {variable: _ADT_DATE},
            {variable: LBSEQ}]
          filter: "_RANK_AVISITN >= 2 AND _RANK_AVISITN <= 24"

  # Row-level
  - name: AVISIT
    type: str
    label: Analysis Visit

  - name: AVISITN
    type: float
    label: Analysis Visit (N)

  - name: ADY
    type: float
    label: Analysis Relative Day
    derivation:
      study_day:
        date: _ADT_DATE
        reference: TRTSDT

  - name: ADT
    type: date
    label: Analysis Date
    derivation: _ADT_DATE

  - name: VISIT
    type: str
    label: Visit Name

  - name: VISITNUM
    type: float
    label: Visit Number

  - name: PARAM
    type: str
    label: Parameter
    derivation:
      case:
        - when: "_IS_UNDER = 'Y'"
          then:
            str_concat:
              sources:
                - {source: _PARAM_BASE}
                - {literal: ' change from previous visit,
                    relative to normal range'}
        - otherwise: _PARAM_BASE

  - name: PARAMCD
    type: str
    label: Parameter Code

  - name: PARAMN
    type: float
    label: Parameter (N)
    derivation:
      case:
        - when: "_IS_UNDER = 'Y'"
          then:
            compute:
              expr: "_PARAMN_BASE + 100"
        - otherwise: _PARAMN_BASE

  - name: PARCAT1
    type: str
    label: Parameter Category 1
    derivation: {literal: 'CHEM'}

  - name: AVAL
    type: float
    label: Analysis Value
    derivation:
      case:
        - when: "_IS_UNDER = 'Y'"
          then: _U_AVAL
        - otherwise: _AVAL_BASE

  - name: BASE
    type: float
    label: Baseline Value
    derivation: _BASE

  - name: CHG
    type: float
    label: Change from Baseline
    derivation:
      case:
        - when: "_IS_UNDER = 'Y'"
          then: {literal: null}
        - when: "ABLFL = 'Y'"
          then: {literal: null}
        - otherwise:
            compute:
              expr: "_AVAL_BASE - _BASE"

  - name: A1LO
    type: float
    label: Analysis Range 1 Lower Limit

  - name: A1HI
    type: float
    label: Analysis Range 1 Upper Limit

  - name: R2A1LO
    type: float
    label: Ratio to Analysis Range 1 Lower Limit
    derivation:
      compute:
        expr: "_AVAL_BASE / A1LO"

  - name: R2A1HI
    type: float
    label: Ratio to Analysis Range 1 Upper Limit
    derivation:
      compute:
        expr: "_AVAL_BASE / A1HI"

  - name: BR2A1LO
    type: float
    label: Base Ratio to Analysis Range 1 Lower Lim
    derivation:
      case:
        - when: "_IS_UNDER = 'Y'"
          then: {literal: null}
        - otherwise:
            compute:
              expr: "_BASE / A1LO"

  - name: BR2A1HI
    type: float
    label: Base Ratio to Analysis Range 1 Upper Lim
    derivation:
      case:
        - when: "_IS_UNDER = 'Y'"
          then: {literal: null}
        - otherwise:
            compute:
              expr: "_BASE / A1HI"

  - name: ANL01FL
    type: str
    label: Analysis Record Flag 1
    derivation:
      case:
        - when: "_ANL01_RANK = 1 AND _RANK_VAL IS NOT NULL"
          then: {literal: 'Y'}
        - otherwise: {literal: ''}

  - name: ANRIND
    type: str
    label: Analysis Reference Range Indicator
    derivation:
      case:
        - when: "_IS_UNDER = 'Y' AND _U_AVAL IS NULL"
          then: {literal: ''}
        - when: "_IS_UNDER = 'Y' AND _U_AVAL > 1.0"
          then: {literal: 'H'}
        - when: "_IS_UNDER = 'Y' AND _U_AVAL < -1.0"
          then: {literal: 'L'}
        - when: "_IS_UNDER = 'Y'"
          then: {literal: 'N'}
        - otherwise: _ANRIND_BASE

  - name: BNRIND
    type: str
    label: Baseline Reference Range Indicator
    derivation:
      case:
        - when: "_IS_UNDER = 'Y'"
          then: {literal: ''}
        - when: "_BNRIND_VAL IS NULL"
          then: {literal: ''}
        - otherwise: _BNRIND_VAL

  - name: AENTMTFL
    type: str
    label: Last value in treatment visit
    derivation:
      case:
        - when: "_IS_EOT = 'Y'"
          then: {literal: 'Y'}
        - when: "_IS_LAST_ELIGIBLE = 1"
          then: {literal: 'Y'}
        - otherwise: {literal: ''}

  - name: LBSEQ
    type: float
    label: Sequence Number

  - name: LBNRIND
    type: str
    label: Reference Range Indicator

  - name: LBSTRESN
    type: float
    label: Numeric Result/Finding in Standard Units

rows:
  # ------------------------------------------------------------------
  # base-ord: ordinary base rows (one per chemistry LB record)
  # ------------------------------------------------------------------
  - id: base-ord
    dataset: LB
    filter: "LB.LBCAT = 'CHEMISTRY' AND LB.VISIT NOT IN ('RETRIEVAL',
      'AMBUL ECG REMOVAL')"
    derivations:
      STUDYID: LB.STUDYID
      USUBJID: LB.USUBJID
      PARAMCD: LB.LBTESTCD
      _IS_UNDER: {literal: ''}
      _IS_EOT: {literal: ''}
      VISIT: LB.VISIT
      VISITNUM: LB.VISITNUM
      LBSEQ: LB.LBSEQ
      LBNRIND: LB.LBNRIND
      LBSTRESN: LB.LBSTRESN
      A1LO: LB.LBSTNRLO
      A1HI: LB.LBSTNRHI
      _LBDTM_TXT: LB.LBDTC
      _LBDTM:
        datetime_impute:
          source: _LBDTM_TXT
          time: first
          missing: null
          invalid: null
      _ADT_DATE:
        to_date:
          source: _LBDTM
      AVISIT:
        case:
          - when: "LB.VISIT = 'SCREENING 1'"
            then: {literal: '        Baseline'}
          - when: "LB.VISIT = 'WEEK 2'"
            then: {literal: '          Week 2'}
          - when: "LB.VISIT = 'WEEK 4'"
            then: {literal: '          Week 4'}
          - when: "LB.VISIT = 'WEEK 6'"
            then: {literal: '          Week 6'}
          - when: "LB.VISIT = 'WEEK 8'"
            then: {literal: '          Week 8'}
          - when: "LB.VISIT = 'WEEK 12'"
            then: {literal: '         Week 12'}
          - when: "LB.VISIT = 'WEEK 16'"
            then: {literal: '         Week 16'}
          - when: "LB.VISIT = 'WEEK 20'"
            then: {literal: '         Week 20'}
          - when: "LB.VISIT = 'WEEK 24'"
            then: {literal: '         Week 24'}
          - when: "LB.VISIT = 'WEEK 26'"
            then: {literal: '         Week 26'}
          - otherwise: {literal: '               .'}
      AVISITN:
        case:
          - when: "LB.VISIT = 'SCREENING 1'"
            then: {literal: 0.0}
          - when: "LB.VISIT = 'WEEK 2'"
            then: {literal: 2.0}
          - when: "LB.VISIT = 'WEEK 4'"
            then: {literal: 4.0}
          - when: "LB.VISIT = 'WEEK 6'"
            then: {literal: 6.0}
          - when: "LB.VISIT = 'WEEK 8'"
            then: {literal: 8.0}
          - when: "LB.VISIT = 'WEEK 12'"
            then: {literal: 12.0}
          - when: "LB.VISIT = 'WEEK 16'"
            then: {literal: 16.0}
          - when: "LB.VISIT = 'WEEK 20'"
            then: {literal: 20.0}
          - when: "LB.VISIT = 'WEEK 24'"
            then: {literal: 24.0}
          - when: "LB.VISIT = 'WEEK 26'"
            then: {literal: 26.0}
          - otherwise: {literal: null}
      ABLFL:
        case:
          - when: "LB.LBBLFL = 'Y'"
            then: {literal: 'Y'}
          - otherwise: {literal: ''}
      _PARAM_BASE:
        mapping:
          source: LB.LBTESTCD
          unmapped: null
          dict:
            SODIUM: 'Sodium (mmol/L)'
            K: 'Potassium (mmol/L)'
            CL: 'Chloride (mmol/L)'
            BILI: 'Bilirubin (umol/L)'
            ALP: 'Alkaline Phosphatase (U/L)'
            GGT: 'Gamma Glutamyl Transferase (U/L)'
            ALT: 'Alanine Aminotransferase (U/L)'
            AST: 'Aspartate Aminotransferase (U/L)'
            BUN: 'Blood Urea Nitrogen (mmol/L)'
            CREAT: 'Creatinine (umol/L)'
            URATE: 'Urate (umol/L)'
            PHOS: 'Phosphate (mmol/L)'
            CA: 'Calcium (mmol/L)'
            GLUC: 'Glucose (mmol/L)'
            PROT: 'Protein (g/L)'
            ALB: 'Albumin (g/L)'
            CHOL: 'Cholesterol (mmol/L)'
            CK: 'Creatine Kinase (U/L)'
      _PARAMN_BASE:
        mapping:
          source: LB.LBTESTCD
          unmapped: null
          dict:
            SODIUM: 18.0
            K: 19.0
            CL: 20.0
            BILI: 21.0
            ALP: 22.0
            GGT: 23.0
            ALT: 24.0
            AST: 25.0
            BUN: 26.0
            CREAT: 27.0
            URATE: 28.0
            PHOS: 29.0
            CA: 30.0
            GLUC: 31.0
            PROT: 32.0
            ALB: 33.0
            CHOL: 34.0
            CK: 35.0
      _AVAL_BASE: LB.LBSTRESN
      _BASELINE_AVAL:
        case:
          - when: "ABLFL = 'Y'"
            then: _AVAL_BASE
          - otherwise: {literal: null}
      _PNM_BASE:
        previous_non_missing:
          source: _BASELINE_AVAL
          window:
            group_by: [USUBJID, PARAMCD]
            order_by: [{variable: LBSEQ}]
      _BASE:
        first_available:
          sources: [_BASELINE_AVAL, _PNM_BASE]
      _IS_LAST_ELIGIBLE:
        row_number:
          window:
            group_by: [USUBJID, PARAMCD]
            order_by: [{variable: LBSEQ, direction: desc}]
            filter: "VISIT IN ('WEEK 2', 'WEEK 4', 'WEEK 6', 'WEEK 8',
              'WEEK 12', 'WEEK 16', 'WEEK 20', 'WEEK 24')"
      _RANK_AVISITN: AVISITN
      _B_A1HI: {literal: null}
      _B_A1LO: {literal: null}
      _T1:
        compute:
          expr: "1.5 * A1HI - _AVAL_BASE"
      _T2:
        compute:
          expr: "_AVAL_BASE - 0.5 * A1LO"
      ALBTRVAL:
        greatest:
          sources: [_T1, _T2]
      _R2A1HI_R:
        compute:
          expr: "_AVAL_BASE / A1HI"
      _R2A1LO_R:
        case:
          - when: "A1LO IS NULL OR A1LO = 0"
            then: {literal: null}
          - otherwise:
              compute:
                expr: "_AVAL_BASE / A1LO"
      _ANRIND_BASE:
        case:
          - when: "_R2A1HI_R > 1.5"
            then: {literal: 'H'}
          - when: "_R2A1LO_R < 0.5"
            then: {literal: 'L'}
          - otherwise: {literal: 'N'}
      _BASELINE_ANRIND:
        case:
          - when: "ABLFL = 'Y'"
            then: _ANRIND_BASE
          - otherwise: {literal: null}
      _PNM_BNRIND:
        previous_non_missing:
          source: _BASELINE_ANRIND
          window:
            group_by: [USUBJID, PARAMCD]
            order_by: [{variable: LBSEQ}]
      _BNRIND_VAL:
        first_available:
          sources: [_BASELINE_ANRIND, _PNM_BNRIND]
      _LBCAT: {literal: null}
      _VISIT_RAW: {literal: null}
      _LBBLFL: {literal: null}
      _LBTESTCD: {literal: null}
      _PARAMCD_BASE: {literal: null}
      LBTESTCD: LB.LBTESTCD
      _SCHED: {literal: null}
      _PREV_AVAL: {literal: null}
      _U_RAW: {literal: null}

  # ------------------------------------------------------------------
  # base-eot: EOT base rows (last eligible record per USUBJID/PARAMCD)
  # Single-record groups; grouped filter keeps the last eligible.
  # ------------------------------------------------------------------
  - id: base-eot
    dataset: LB
    group_by: [LB.USUBJID, LB.LBTESTCD, LB.LBSEQ]
    filter: "_IS_LAST_ELIGIBLE = 1"
    derivations:
      STUDYID:
        aggregate: "ONLY(LB.STUDYID)"
      USUBJID: LB.USUBJID
      PARAMCD: LB.LBTESTCD
      LBSEQ: LB.LBSEQ
      _IS_UNDER: {literal: ''}
      _IS_EOT: {literal: 'Y'}
      _LBCAT:
        aggregate: "ONLY(LB.LBCAT)"
      _VISIT_RAW:
        aggregate: "ONLY(LB.VISIT)"
      VISIT:
        aggregate: "ONLY(LB.VISIT)"
      VISITNUM:
        aggregate: "ONLY(LB.VISITNUM)"
      LBNRIND:
        aggregate: "ONLY(LB.LBNRIND)"
      LBSTRESN:
        aggregate: "ONLY(LB.LBSTRESN)"
      A1LO:
        aggregate: "ONLY(LB.LBSTNRLO)"
      A1HI:
        aggregate: "ONLY(LB.LBSTNRHI)"
      _LBDTM_TXT:
        aggregate: "ONLY(LB.LBDTC)"
      _LBDTM:
        datetime_impute:
          source: _LBDTM_TXT
          time: first
          missing: null
          invalid: null
      _ADT_DATE:
        to_date:
          source: _LBDTM
      _LBBLFL:
        aggregate: "ONLY(LB.LBBLFL)"
      _LBTESTCD:
        aggregate: "ONLY(LB.LBTESTCD)"
      AVISIT: {literal: 'End of Treatment'}
      AVISITN: {literal: 99.0}
      ABLFL: {literal: ''}
      _PARAM_BASE:
        case:
          - when: "_LBTESTCD = 'SODIUM'"
            then: {literal: 'Sodium (mmol/L)'}
          - when: "_LBTESTCD = 'K'"
            then: {literal: 'Potassium (mmol/L)'}
          - when: "_LBTESTCD = 'CL'"
            then: {literal: 'Chloride (mmol/L)'}
          - when: "_LBTESTCD = 'BILI'"
            then: {literal: 'Bilirubin (umol/L)'}
          - when: "_LBTESTCD = 'ALP'"
            then: {literal: 'Alkaline Phosphatase (U/L)'}
          - when: "_LBTESTCD = 'GGT'"
            then: {literal: 'Gamma Glutamyl Transferase (U/L)'}
          - when: "_LBTESTCD = 'ALT'"
            then: {literal: 'Alanine Aminotransferase (U/L)'}
          - when: "_LBTESTCD = 'AST'"
            then: {literal: 'Aspartate Aminotransferase (U/L)'}
          - when: "_LBTESTCD = 'BUN'"
            then: {literal: 'Blood Urea Nitrogen (mmol/L)'}
          - when: "_LBTESTCD = 'CREAT'"
            then: {literal: 'Creatinine (umol/L)'}
          - when: "_LBTESTCD = 'URATE'"
            then: {literal: 'Urate (umol/L)'}
          - when: "_LBTESTCD = 'PHOS'"
            then: {literal: 'Phosphate (mmol/L)'}
          - when: "_LBTESTCD = 'CA'"
            then: {literal: 'Calcium (mmol/L)'}
          - when: "_LBTESTCD = 'GLUC'"
            then: {literal: 'Glucose (mmol/L)'}
          - when: "_LBTESTCD = 'PROT'"
            then: {literal: 'Protein (g/L)'}
          - when: "_LBTESTCD = 'ALB'"
            then: {literal: 'Albumin (g/L)'}
          - when: "_LBTESTCD = 'CHOL'"
            then: {literal: 'Cholesterol (mmol/L)'}
          - when: "_LBTESTCD = 'CK'"
            then: {literal: 'Creatine Kinase (U/L)'}
          - otherwise: {literal: null}
      _PARAMN_BASE:
        case:
          - when: "_LBTESTCD = 'SODIUM'"
            then: {literal: 18.0}
          - when: "_LBTESTCD = 'K'"
            then: {literal: 19.0}
          - when: "_LBTESTCD = 'CL'"
            then: {literal: 20.0}
          - when: "_LBTESTCD = 'BILI'"
            then: {literal: 21.0}
          - when: "_LBTESTCD = 'ALP'"
            then: {literal: 22.0}
          - when: "_LBTESTCD = 'GGT'"
            then: {literal: 23.0}
          - when: "_LBTESTCD = 'ALT'"
            then: {literal: 24.0}
          - when: "_LBTESTCD = 'AST'"
            then: {literal: 25.0}
          - when: "_LBTESTCD = 'BUN'"
            then: {literal: 26.0}
          - when: "_LBTESTCD = 'CREAT'"
            then: {literal: 27.0}
          - when: "_LBTESTCD = 'URATE'"
            then: {literal: 28.0}
          - when: "_LBTESTCD = 'PHOS'"
            then: {literal: 29.0}
          - when: "_LBTESTCD = 'CA'"
            then: {literal: 30.0}
          - when: "_LBTESTCD = 'GLUC'"
            then: {literal: 31.0}
          - when: "_LBTESTCD = 'PROT'"
            then: {literal: 32.0}
          - when: "_LBTESTCD = 'ALB'"
            then: {literal: 33.0}
          - when: "_LBTESTCD = 'CHOL'"
            then: {literal: 34.0}
          - when: "_LBTESTCD = 'CK'"
            then: {literal: 35.0}
          - otherwise: {literal: null}
      _AVAL_BASE:
        aggregate: "ONLY(LB.LBSTRESN)"
      _BASELINE_AVAL:
        case:
          - when: "_LBBLFL = 'Y'"
            then: _AVAL_BASE
          - otherwise: {literal: null}
      _PNM_BASE:
        previous_non_missing:
          source: _BASELINE_AVAL
          window:
            group_by: [USUBJID, PARAMCD]
            order_by: [{variable: LBSEQ}]
      _BASE:
        first_available:
          sources: [_BASELINE_AVAL, _PNM_BASE]
      _IS_LAST_ELIGIBLE:
        row_number:
          window:
            group_by: [USUBJID, PARAMCD]
            order_by: [{variable: LBSEQ, direction: desc}]
            filter: "_LBCAT = 'CHEMISTRY' AND _VISIT_RAW NOT IN ('RETRIEVAL',
              'AMBUL ECG REMOVAL') AND _VISIT_RAW IN ('WEEK 2', 'WEEK 4',
              'WEEK 6', 'WEEK 8', 'WEEK 12', 'WEEK 16', 'WEEK 20', 'WEEK 24')"
      _RANK_AVISITN:
        case:
          - when: "_VISIT_RAW = 'SCREENING 1'"
            then: {literal: 0.0}
          - when: "_VISIT_RAW = 'WEEK 2'"
            then: {literal: 2.0}
          - when: "_VISIT_RAW = 'WEEK 4'"
            then: {literal: 4.0}
          - when: "_VISIT_RAW = 'WEEK 6'"
            then: {literal: 6.0}
          - when: "_VISIT_RAW = 'WEEK 8'"
            then: {literal: 8.0}
          - when: "_VISIT_RAW = 'WEEK 12'"
            then: {literal: 12.0}
          - when: "_VISIT_RAW = 'WEEK 16'"
            then: {literal: 16.0}
          - when: "_VISIT_RAW = 'WEEK 20'"
            then: {literal: 20.0}
          - when: "_VISIT_RAW = 'WEEK 24'"
            then: {literal: 24.0}
          - when: "_VISIT_RAW = 'WEEK 26'"
            then: {literal: 26.0}
          - otherwise: {literal: null}
      _B_A1HI: {literal: null}
      _B_A1LO: {literal: null}
      _T1:
        compute:
          expr: "1.5 * A1HI - _AVAL_BASE"
      _T2:
        compute:
          expr: "_AVAL_BASE - 0.5 * A1LO"
      ALBTRVAL:
        greatest:
          sources: [_T1, _T2]
      _R2A1HI_R:
        compute:
          expr: "_AVAL_BASE / A1HI"
      _R2A1LO_R:
        case:
          - when: "A1LO IS NULL OR A1LO = 0"
            then: {literal: null}
          - otherwise:
              compute:
                expr: "_AVAL_BASE / A1LO"
      _ANRIND_BASE:
        case:
          - when: "_R2A1HI_R > 1.5"
            then: {literal: 'H'}
          - when: "_R2A1LO_R < 0.5"
            then: {literal: 'L'}
          - otherwise: {literal: 'N'}
      _BASELINE_ANRIND:
        case:
          - when: "_LBBLFL = 'Y'"
            then: _ANRIND_BASE
          - otherwise: {literal: null}
      _PNM_BNRIND:
        previous_non_missing:
          source: _BASELINE_ANRIND
          window:
            group_by: [USUBJID, PARAMCD]
            order_by: [{variable: LBSEQ}]
      _BNRIND_VAL:
        first_available:
          sources: [_BASELINE_ANRIND, _PNM_BNRIND]
      _PARAMCD_BASE: {literal: null}
      LBTESTCD: LB.LBTESTCD
      _SCHED: {literal: null}
      _PREV_AVAL: {literal: null}
      _U_RAW: {literal: null}

  # ------------------------------------------------------------------
  # under-ord: ordinary underscore rows (change from previous visit)
