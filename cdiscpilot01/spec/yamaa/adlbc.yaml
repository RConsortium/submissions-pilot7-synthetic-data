        case:
          - when: "_LBBLFL = 'Y'"
            then: _AVAL_BASE
          - otherwise:
      _PNM_BASE:
        locf:
          source: _BASELINE_AVAL
          window:
            group_by:
              - USUBJID
              - PARAMCD
            order_by:
              - {variable: LBSEQ, nulls: last}
      _BASE:
        first_available:
          sources:
            - _BASELINE_AVAL
            - _PNM_BASE
      _IS_LAST_ELIGIBLE:
        row_number:
          window:
            group_by:
              - USUBJID
              - PARAMCD
            order_by:
              - {variable: LBSEQ, direction: desc, nulls: last}
            filter: "_LBCAT = 'CHEMISTRY' AND _VISIT_RAW NOT IN ('RETRIEVAL',
