          - when: "LB.VISIT = 'WEEK 16'"
            then: {literal: 16.0}
          - when: "LB.VISIT = 'WEEK 20'"
            then: {literal: 20.0}
          - when: "LB.VISIT = 'WEEK 24'"
            then: {literal: 24.0}
          - when: "LB.VISIT = 'WEEK 26'"
            then: {literal: 26.0}
          - otherwise: {literal: null}
      ABLFL: {literal: ''}
      _PARAM_BASE:
        mapping:
          source: LB.LBTESTCD
          unmapped: null
          dict:
            SODIUM: 'Sodium (mmol/L)'
            K: 'Potassium (mmol/L)'
            CL: 'Chloride (mmol/L)'
            BILI: 'Bilirubin (umol/L)'
            ALP: 'Alkaline Phosphatase (U/L)'
            GGT: 'Gamma Glutamyl Transferase (U/L)'
            ALT: 'Alanine Aminotransferase (U/L)'
            AST: 'Aspartate Aminotransferase (U/L)'
            BUN: 'Blood Urea Nitrogen (mmol/L)'
            CREAT: 'Creatinine (umol/L)'
            URATE: 'Urate (umol/L)'
            PHOS: 'Phosphate (mmol/L)'
            CA: 'Calcium (mmol/L)'
            GLUC: 'Glucose (mmol/L)'
            PROT: 'Protein (g/L)'
            ALB: 'Albumin (g/L)'
            CHOL: 'Cholesterol (mmol/L)'
            CK: 'Creatine Kinase (U/L)'
      _PARAMN_BASE:
        mapping:
          source: LB.LBTESTCD
          unmapped: null
          dict:
            SODIUM: 18.0
            K: 19.0
            CL: 20.0
            BILI: 21.0
            ALP: 22.0
            GGT: 23.0
            ALT: 24.0
            AST: 25.0
            BUN: 26.0
            CREAT: 27.0
            URATE: 28.0
            PHOS: 29.0
            CA: 30.0
            GLUC: 31.0
            PROT: 32.0
            ALB: 33.0
