yamaa: "1.0"
type: spec
model: ADaM
parent: templates/laboratory.yaml
domain: ADLBC

output:
  path: ../../data/adam/adlbc-yamaa.parquet
  columns:
    - STUDYID
    - SUBJID
    - USUBJID
    - TRTP
    - TRTPN
    - TRTA
    - TRTAN
    - TRTSDT
    - TRTEDT
    - AGE
    - AGEGR1
    - AGEGR1N
    - RACE
    - RACEN
    - SEX
    - COMP24FL
    - DSRAEFL
    - SAFFL
    - AVISIT
    - AVISITN
    - ADY
    - ADT
    - VISIT
    - VISITNUM
    - PARAM
    - PARAMCD
    - PARAMN
    - PARCAT1
    - AVAL
    - BASE
    - CHG
    - A1LO
    - A1HI
    - R2A1LO
    - R2A1HI
    - BR2A1LO
    - BR2A1HI
    - ANL01FL
    - ALBTRVAL
    - ANRIND
    - BNRIND
    - ABLFL
    - AENTMTFL
    - LBSEQ
    - LBNRIND
    - LBSTRESN
  order_by:
    - variable: USUBJID
      nulls: last
    - variable: ADY
      nulls: last
    - variable: PARAMN
      nulls: last
    - variable: AVISITN
      nulls: last

windows:
  PREV_ORDER:
    group_by:
      - LB.USUBJID
      - LB.LBTESTCD
    order_by:
      - variable: LB.LBDTC
        nulls: last
      - variable: LB.LBSEQ
        nulls: last
    filter: "LB.VISIT NOT LIKE 'UNSCHEDULED%'"

  ANL01_RANK_ORDER:
    group_by:
      - USUBJID
      - PARAMCD
    order_by:
      - variable: _RANK_VAL
        direction: desc
        nulls: last
      - variable: _RANK_AVISITN
        nulls: last
      - variable: _ADT_DATE
        nulls: last
      - variable: LBSEQ
        nulls: last
    filter: "_RANK_AVISITN >= 2 AND _RANK_AVISITN <= 24"

  # Row-level
  BASE_ORD_ORDER:
    group_by:
      - USUBJID
      - PARAMCD
    order_by:
      - variable: LBSEQ
        nulls: last
  BASE_ORD_ORDER_2:
    group_by:
      - USUBJID
      - PARAMCD
    order_by:
      - variable: LBSEQ
        direction: desc
        nulls: last
    filter: >-
      VISIT IN ('WEEK 2', 'WEEK 4', 'WEEK 6', 'WEEK 8', 'WEEK
      12', 'WEEK 16', 'WEEK 20', 'WEEK 24')
  BASE_EOT_ORDER:
    group_by:
      - USUBJID
      - PARAMCD
    order_by:
      - variable: LBSEQ
        direction: desc
        nulls: last
    filter: >-
      _LBCAT = 'CHEMISTRY' AND _VISIT_RAW NOT IN ('RETRIEVAL',
      'AMBUL ECG REMOVAL') AND _VISIT_RAW IN ('WEEK 2', 'WEEK
      4', 'WEEK 6', 'WEEK 8', 'WEEK 12', 'WEEK 16', 'WEEK 20',
      'WEEK 24')
  UNDER_ORD_ORDER:
    group_by:
      - USUBJID
      - _PARAMCD_BASE
    order_by:
      - variable: LBSEQ
        direction: desc
        nulls: last
    filter: >-
      VISIT IN ('WEEK 2', 'WEEK 4', 'WEEK 6', 'WEEK 8', 'WEEK
      12', 'WEEK 16', 'WEEK 20', 'WEEK 24')
  UNDER_EOT_ORDER:
    group_by:
      - USUBJID
      - _PARAMCD_BASE
    order_by:
      - variable: LBSEQ
        direction: desc
        nulls: last
    filter: >-
      _LBCAT = 'CHEMISTRY' AND _VISIT_RAW NOT IN ('RETRIEVAL',
      'AMBUL ECG REMOVAL') AND _VISIT_RAW IN ('WEEK 2', 'WEEK
      4', 'WEEK 6', 'WEEK 8', 'WEEK 12', 'WEEK 16', 'WEEK 20',
      'WEEK 24')

intermediates:
  - id: PREV
    key:
      - USUBJID
      - LBTESTCD
      - LBSEQ
    filter: "LB.VISIT NOT LIKE 'UNSCHEDULED%'"

columns:
  - name: LBTESTCD
    type: str
    label: "Working value: LBTESTCD"

  - name: PARAM
    derivation:
      case:
        - when: "_IS_UNDER = 'Y'"
          then:
            str_template: >-
              {_PARAM_BASE} change from previous visit, relative
              to normal range
        - otherwise: _PARAM_BASE

  - name: PARCAT1
    derivation: "'CHEM'"

  - name: ALBTRVAL
    derivation:
      greatest:
        sources:
          - _T1
          - _T2

rows:
  - id: base-ord
    filter: >-
      LB.LBCAT = 'CHEMISTRY' AND LB.VISIT NOT IN ('RETRIEVAL',
      'AMBUL ECG REMOVAL')
    derivations:
      A1LO: LB.LBSTNRLO
      _PARAM_BASE:
        mapping:
          source: LB.LBTESTCD
          unmapped:
          dict:
            SODIUM: 'Sodium (mmol/L)'
            K: 'Potassium (mmol/L)'
            CL: 'Chloride (mmol/L)'
            BILI: 'Bilirubin (umol/L)'
            ALP: 'Alkaline Phosphatase (U/L)'
            GGT: 'Gamma Glutamyl Transferase (U/L)'
            ALT: 'Alanine Aminotransferase (U/L)'
            AST: 'Aspartate Aminotransferase (U/L)'
            BUN: 'Blood Urea Nitrogen (mmol/L)'
            CREAT: 'Creatinine (umol/L)'
            URATE: 'Urate (umol/L)'
            PHOS: 'Phosphate (mmol/L)'
            CA: 'Calcium (mmol/L)'
            GLUC: 'Glucose (mmol/L)'
            PROT: 'Protein (g/L)'
            ALB: 'Albumin (g/L)'
            CHOL: 'Cholesterol (mmol/L)'
            CK: 'Creatine Kinase (U/L)'
      _PARAMN_BASE:
        mapping:
          source: LB.LBTESTCD
          unmapped:
          dict:
            SODIUM: 18.0
            K: 19.0
            CL: 20.0
            BILI: 21.0
            ALP: 22.0
            GGT: 23.0
            ALT: 24.0
            AST: 25.0
            BUN: 26.0
            CREAT: 27.0
            URATE: 28.0
            PHOS: 29.0
            CA: 30.0
            GLUC: 31.0
            PROT: 32.0
            ALB: 33.0
            CHOL: 34.0
            CK: 35.0
      _R2A1LO_R:
        case:
          - when: "A1LO IS NULL OR A1LO = 0"
            then:
          - otherwise: "_AVAL_BASE / A1LO"
      _ANRIND_BASE:
        case:
          - when: "_R2A1HI_R > 1.5"
            then: "'H'"
          - when: "_R2A1LO_R < 0.5"
            then: "'L'"
          - otherwise: "'N'"
      _LBTESTCD:
      LBTESTCD: LB.LBTESTCD

  - id: base-eot
    derivations:
      A1LO:
        aggregate: "ONLY(LB.LBSTNRLO)"
      _PARAM_BASE:
        case:
          - when: "_LBTESTCD = 'SODIUM'"
            then: "'Sodium (mmol/L)'"
          - when: "_LBTESTCD = 'K'"
            then: "'Potassium (mmol/L)'"
          - when: "_LBTESTCD = 'CL'"
            then: "'Chloride (mmol/L)'"
          - when: "_LBTESTCD = 'BILI'"
            then: "'Bilirubin (umol/L)'"
          - when: "_LBTESTCD = 'ALP'"
            then: "'Alkaline Phosphatase (U/L)'"
          - when: "_LBTESTCD = 'GGT'"
            then: "'Gamma Glutamyl Transferase (U/L)'"
          - when: "_LBTESTCD = 'ALT'"
            then: "'Alanine Aminotransferase (U/L)'"
          - when: "_LBTESTCD = 'AST'"
            then: "'Aspartate Aminotransferase (U/L)'"
          - when: "_LBTESTCD = 'BUN'"
            then: "'Blood Urea Nitrogen (mmol/L)'"
          - when: "_LBTESTCD = 'CREAT'"
            then: "'Creatinine (umol/L)'"
          - when: "_LBTESTCD = 'URATE'"
            then: "'Urate (umol/L)'"
          - when: "_LBTESTCD = 'PHOS'"
            then: "'Phosphate (mmol/L)'"
          - when: "_LBTESTCD = 'CA'"
            then: "'Calcium (mmol/L)'"
          - when: "_LBTESTCD = 'GLUC'"
            then: "'Glucose (mmol/L)'"
          - when: "_LBTESTCD = 'PROT'"
            then: "'Protein (g/L)'"
          - when: "_LBTESTCD = 'ALB'"
            then: "'Albumin (g/L)'"
          - when: "_LBTESTCD = 'CHOL'"
            then: "'Cholesterol (mmol/L)'"
          - when: "_LBTESTCD = 'CK'"
            then: "'Creatine Kinase (U/L)'"
          - otherwise:
      _PARAMN_BASE:
        case:
          - when: "_LBTESTCD = 'SODIUM'"
            then: 18.0
          - when: "_LBTESTCD = 'K'"
            then: 19.0
          - when: "_LBTESTCD = 'CL'"
            then: 20.0
          - when: "_LBTESTCD = 'BILI'"
            then: 21.0
          - when: "_LBTESTCD = 'ALP'"
            then: 22.0
          - when: "_LBTESTCD = 'GGT'"
            then: 23.0
          - when: "_LBTESTCD = 'ALT'"
            then: 24.0
          - when: "_LBTESTCD = 'AST'"
            then: 25.0
          - when: "_LBTESTCD = 'BUN'"
            then: 26.0
          - when: "_LBTESTCD = 'CREAT'"
            then: 27.0
          - when: "_LBTESTCD = 'URATE'"
            then: 28.0
          - when: "_LBTESTCD = 'PHOS'"
            then: 29.0
          - when: "_LBTESTCD = 'CA'"
            then: 30.0
          - when: "_LBTESTCD = 'GLUC'"
            then: 31.0
          - when: "_LBTESTCD = 'PROT'"
            then: 32.0
          - when: "_LBTESTCD = 'ALB'"
            then: 33.0
          - when: "_LBTESTCD = 'CHOL'"
            then: 34.0
          - when: "_LBTESTCD = 'CK'"
            then: 35.0
          - otherwise:
      _R2A1LO_R:
        case:
          - when: "A1LO IS NULL OR A1LO = 0"
            then:
          - otherwise: "_AVAL_BASE / A1LO"
      _ANRIND_BASE:
        case:
          - when: "_R2A1HI_R > 1.5"
            then: "'H'"
          - when: "_R2A1LO_R < 0.5"
            then: "'L'"
          - otherwise: "'N'"
      LBTESTCD: LB.LBTESTCD

  - id: under-ord
    filter: >-
      LB.LBCAT = 'CHEMISTRY' AND LB.VISIT NOT IN ('RETRIEVAL',
      'AMBUL ECG REMOVAL')
    derivations:
      _PARAM_BASE:
        mapping:
          source: LB.LBTESTCD
          unmapped:
          dict:
            SODIUM: 'Sodium (mmol/L)'
            K: 'Potassium (mmol/L)'
            CL: 'Chloride (mmol/L)'
            BILI: 'Bilirubin (umol/L)'
            ALP: 'Alkaline Phosphatase (U/L)'
            GGT: 'Gamma Glutamyl Transferase (U/L)'
            ALT: 'Alanine Aminotransferase (U/L)'
            AST: 'Aspartate Aminotransferase (U/L)'
            BUN: 'Blood Urea Nitrogen (mmol/L)'
            CREAT: 'Creatinine (umol/L)'
            URATE: 'Urate (umol/L)'
            PHOS: 'Phosphate (mmol/L)'
            CA: 'Calcium (mmol/L)'
            GLUC: 'Glucose (mmol/L)'
            PROT: 'Protein (g/L)'
            ALB: 'Albumin (g/L)'
            CHOL: 'Cholesterol (mmol/L)'
            CK: 'Creatine Kinase (U/L)'
      _PARAMN_BASE:
        mapping:
          source: LB.LBTESTCD
          unmapped:
          dict:
            SODIUM: 18.0
            K: 19.0
            CL: 20.0
            BILI: 21.0
            ALP: 22.0
            GGT: 23.0
            ALT: 24.0
            AST: 25.0
            BUN: 26.0
            CREAT: 27.0
            URATE: 28.0
            PHOS: 29.0
            CA: 30.0
            GLUC: 31.0
            PROT: 32.0
            ALB: 33.0
            CHOL: 34.0
            CK: 35.0
      LBTESTCD: LB.LBTESTCD
      _SCHED:
        case:
          - when: "AVISIT = '               .' OR AVISIT = 'End
              of Treatment'"
            then: "''"
          - otherwise: "'Y'"
      _LBTESTCD:

  - id: under-eot
    derivations:
      _PARAM_BASE:
        case:
          - when: "_LBTESTCD = 'SODIUM'"
            then: "'Sodium (mmol/L)'"
          - when: "_LBTESTCD = 'K'"
            then: "'Potassium (mmol/L)'"
          - when: "_LBTESTCD = 'CL'"
            then: "'Chloride (mmol/L)'"
          - when: "_LBTESTCD = 'BILI'"
            then: "'Bilirubin (umol/L)'"
          - when: "_LBTESTCD = 'ALP'"
            then: "'Alkaline Phosphatase (U/L)'"
          - when: "_LBTESTCD = 'GGT'"
            then: "'Gamma Glutamyl Transferase (U/L)'"
          - when: "_LBTESTCD = 'ALT'"
            then: "'Alanine Aminotransferase (U/L)'"
          - when: "_LBTESTCD = 'AST'"
            then: "'Aspartate Aminotransferase (U/L)'"
          - when: "_LBTESTCD = 'BUN'"
            then: "'Blood Urea Nitrogen (mmol/L)'"
          - when: "_LBTESTCD = 'CREAT'"
            then: "'Creatinine (umol/L)'"
          - when: "_LBTESTCD = 'URATE'"
            then: "'Urate (umol/L)'"
          - when: "_LBTESTCD = 'PHOS'"
            then: "'Phosphate (mmol/L)'"
          - when: "_LBTESTCD = 'CA'"
            then: "'Calcium (mmol/L)'"
          - when: "_LBTESTCD = 'GLUC'"
            then: "'Glucose (mmol/L)'"
          - when: "_LBTESTCD = 'PROT'"
            then: "'Protein (g/L)'"
          - when: "_LBTESTCD = 'ALB'"
            then: "'Albumin (g/L)'"
          - when: "_LBTESTCD = 'CHOL'"
            then: "'Cholesterol (mmol/L)'"
          - when: "_LBTESTCD = 'CK'"
            then: "'Creatine Kinase (U/L)'"
          - otherwise:
      _PARAMN_BASE:
        case:
          - when: "_LBTESTCD = 'SODIUM'"
            then: 18.0
          - when: "_LBTESTCD = 'K'"
            then: 19.0
          - when: "_LBTESTCD = 'CL'"
            then: 20.0
          - when: "_LBTESTCD = 'BILI'"
            then: 21.0
          - when: "_LBTESTCD = 'ALP'"
            then: 22.0
          - when: "_LBTESTCD = 'GGT'"
            then: 23.0
          - when: "_LBTESTCD = 'ALT'"
            then: 24.0
          - when: "_LBTESTCD = 'AST'"
            then: 25.0
          - when: "_LBTESTCD = 'BUN'"
            then: 26.0
          - when: "_LBTESTCD = 'CREAT'"
            then: 27.0
          - when: "_LBTESTCD = 'URATE'"
            then: 28.0
          - when: "_LBTESTCD = 'PHOS'"
            then: 29.0
          - when: "_LBTESTCD = 'CA'"
            then: 30.0
          - when: "_LBTESTCD = 'GLUC'"
            then: 31.0
          - when: "_LBTESTCD = 'PROT'"
            then: 32.0
          - when: "_LBTESTCD = 'ALB'"
            then: 33.0
          - when: "_LBTESTCD = 'CHOL'"
            then: 34.0
          - when: "_LBTESTCD = 'CK'"
            then: 35.0
          - otherwise:
      LBTESTCD:
        aggregate: "ONLY(LB.LBTESTCD)"

verifications:
  - assert:
      id: treatment_date_order
      when: "TRTSDT IS NOT NULL AND TRTEDT IS NOT NULL"
      require: "TRTEDT >= TRTSDT"
