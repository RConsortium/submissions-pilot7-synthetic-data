yamaa: "1.0"
type: spec
model: ADaM
domain: ADLBHY
submission:
  mode: historical
  label: Analysis Dataset Lab Hy's Law
  class: BASIC DATA STRUCTURE
  structure: one record per subject per parameter per analysis visit
  repeating: true
  reference_data: false
  artifact: adlbhy.xpt
keys:
  - STUDYID
  - USUBJID
  - AVISITN
  - PARAMN
input:
  ADLBC:
    path: ../../data/adam/adlbc-yamaa.parquet
    schema: adlbc.yaml
    empty_string: present
    key:
      - STUDYID
      - USUBJID
base: ADLBC

output:
  path: ../../data/adam/adlbhy-yamaa.parquet
  columns:
    - STUDYID
    - SUBJID
    - USUBJID
    - TRTP
    - TRTPN
    - TRTA
    - TRTAN
    - TRTSDT
    - TRTEDT
    - AGE
    - AGEGR1
    - AGEGR1N
    - RACE
    - RACEN
    - SEX
    - COMP24FL
    - DSRAEFL
    - SAFFL
    - AVISIT
    - AVISITN
    - ADY
    - ADT
    - VISIT
    - VISITNUM
    - PARAMTYP
    - PARAM
    - PARAMCD
    - PARAMN
    - PARCAT1
    - AVAL
    - BASE
    - A1LO
    - A1HI
    - R2A1LO
    - R2A1HI
    - BR2A1LO
    - BR2A1HI
    - ABLFL
    - SHIFT1
    - SHIFT1N
    - CRIT1
    - CRIT1FL
    - CRIT1FN
  order_by:
    - variable: USUBJID
      nulls: last
    - variable: AVISITN
      nulls: last
    - variable: PARAMN
      nulls: last

intermediates:
  - id: VINFO
    dataset: ADLBC
    key:
      - USUBJID
      - AVISIT
      - AVISITN
    filter: "ADLBC.AVISITN IN (0.0, 2.0, 4.0, 6.0, 8.0, 12.0, 16.0, 20.0, 24.0)"
    order_by:
      - variable: ADLBC.PARAMCD
        nulls: last
    keep: first

  - id: BL_BILI
    dataset: ADLBC
    key:
      - USUBJID
    filter: "ADLBC.AVISITN = 0 AND ADLBC.PARAMCD = 'BILI'"

  - id: BL_ALT
    dataset: ADLBC
    key:
      - USUBJID
    filter: "ADLBC.AVISITN = 0 AND ADLBC.PARAMCD = 'ALT'"

  - id: BL_AST
    dataset: ADLBC
    key:
      - USUBJID
    filter: "ADLBC.AVISITN = 0 AND ADLBC.PARAMCD = 'AST'"

  - id: BL_ANY
    dataset: ADLBC
    key:
      - USUBJID
    filter: "ADLBC.AVISITN = 0"
    order_by:
      - variable: ADLBC.PARAMCD
        nulls: last
    keep: first

columns:
  - name: USUBJID
    type: str
    label: Unique Subject Identifier

    submission:
      data_type: text
      length: 11
      mandatory: false
      key_sequence: 1
      origins:
        - type: Derived
      comment: ADSL.USUBJID
  - name: AVISIT
    type: str
    label: Analysis Visit

    submission:
      data_type: text
      length: 16
      mandatory: false
      key_sequence: 3
      origins:
        - type: Derived
      comment: Analysis Visit
      codelist: AVISIT
  - name: AVISITN
    type: float
    label: Analysis Visit (N)

    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: Numeric code for AVISIT
      codelist: AVISITN
  - name: _PARAMN_OUT
    type: float
    label: "Working value: _PARAMN_OUT"

  - name: _CRIT1FL
    type: str
    label: "Working value: _CRIT1FL"

  - name: _CRIT1FN
    type: float
    label: "Working value: _CRIT1FN"

  - name: _HAS_P
    type: int
    label: "Working value: _HAS_P"

  - name: _BILI_R
    type: float
    label: "Working value: _BILI_R"

  - name: _ALT_R
    type: float
    label: "Working value: _ALT_R"

  - name: _AST_R
    type: float
    label: "Working value: _AST_R"

  - name: _MAX_R
    type: float
    label: "Working value: _MAX_R"

  - name: _AVAL
    type: float
    label: "Working value: _AVAL"

  - name: _BASE_R
    type: float
    label: "Working value: _BASE_R"

  - name: _BASE_ALT_R
    type: float
    label: "Working value: _BASE_ALT_R"

  - name: _BASE_AST_R
    type: float
    label: "Working value: _BASE_AST_R"

  - name: _BASE_BILI_R
    type: float
    label: "Working value: _BASE_BILI_R"

  - name: _BASE_MAX_R
    type: float
    label: "Working value: _BASE_MAX_R"

  - name: _BASE_D
    type: float
    label: "Working value: _BASE_D"

  - name: _BASE_BILI
    type: float
    label: "Working value: _BASE_BILI"

  - name: _BASE_TRANS
    type: float
    label: "Working value: _BASE_TRANS"

  - name: _AVAL_BILI
    type: float
    label: "Working value: _AVAL_BILI"

  - name: _AVAL_TRANS
    type: float
    label: "Working value: _AVAL_TRANS"

  - name: _HAS_BL
    type: str
    label: "Working value: _HAS_BL"

  - name: _BASE
    type: float
    label: "Working value: _BASE"

  - name: _SHIFT1
    type: str
    label: "Working value: _SHIFT1"

  - name: _SHIFT1N
    type: float
    label: "Working value: _SHIFT1N"

  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: VINFO.STUDYID

    submission:
      data_type: text
      length: 12
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.STUDYID
  - name: SUBJID
    type: str
    label: Subject Identifier for the Study
    derivation: VINFO.SUBJID

    submission:
      data_type: text
      length: 4
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.SUBJID
  - name: TRTP
    type: str
    label: Planned Treatment
    derivation: VINFO.TRTP

    submission:
      data_type: text
      length: 20
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.TRT01P
      codelist: ARM
  - name: TRTPN
    type: float
    label: Planned Treatment (N)
    derivation: VINFO.TRTPN

    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.TRT01PN
      codelist: ARMN
  - name: TRTA
    type: str
    label: Actual Treatment
    derivation: VINFO.TRTA

    submission:
      data_type: text
      length: 20
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.TRT01A
      codelist: ARM
  - name: TRTAN
    type: float
    label: Actual Treatment (N)
    derivation: VINFO.TRTAN

    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.TRT01AN
      codelist: ARMN
  - name: TRTSDT
    type: date
    label: Date of First Exposure to Treatment
    derivation: VINFO.TRTSDT

    submission:
      data_type: integer
      length: 8
      mandatory: false
      display_format: DATE9.
      origins:
        - type: Derived
      comment: ADSL.TRTSDT
  - name: TRTEDT
    type: date
    label: Date of Last Exposure to Treatment
    derivation: VINFO.TRTEDT

    submission:
      data_type: integer
      length: 8
      mandatory: false
      display_format: DATE9.
      origins:
        - type: Derived
      comment: ADSL.TRTEDT
  - name: AGE
    type: float
    label: Age
    derivation: VINFO.AGE

    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.AGE
  - name: AGEGR1
    type: str
    label: Pooled Age Group 1
    derivation: VINFO.AGEGR1

    submission:
      data_type: text
      length: 5
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.AGEGR1
      codelist: AGEGR1
  - name: AGEGR1N
    type: float
    label: Pooled Age Group 1 (N)
    derivation: VINFO.AGEGR1N

    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.AGEGR1N
      codelist: AGEGR1N
  - name: RACE
    type: str
    label: Race
    derivation: VINFO.RACE

    submission:
      data_type: text
      length: 32
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.RACE
      codelist: RACE
  - name: RACEN
    type: float
    label: Race (N)
    derivation: VINFO.RACEN

    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.RACEN
      codelist: RACEN
  - name: SEX
    type: str
    label: Sex
    derivation: VINFO.SEX

    submission:
      data_type: text
      length: 1
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.SEX
      codelist: SEX
  - name: COMP24FL
    type: str
    label: Completers of Week 24 Population Flag
    derivation: VINFO.COMP24FL

    submission:
      data_type: text
      length: 1
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.COMP24FL
      codelist: YN
  - name: DSRAEFL
    type: str
    label: Discontinued due to AE?
    derivation: VINFO.DSRAEFL

    submission:
      data_type: text
      length: 1
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.DSRAEFL
      codelist: YN
  - name: SAFFL
    type: str
    label: Safety Population Flag
    derivation: VINFO.SAFFL

    submission:
      data_type: text
      length: 1
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.SAFFL
      codelist: YN
  - name: ADY
    type: float
    label: Analysis Relative Day

    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: LB.LBDY
  - name: ADT
    type: date
    label: Analysis Date

    submission:
      data_type: integer
      length: 8
      mandatory: false
      display_format: DATE9.
      origins:
        - type: Derived
      comment: LB.LBDTC converted to SAS date
  - name: VISIT
    type: str
    label: Visit Name

    submission:
      data_type: text
      length: 19
      mandatory: false
      origins:
        - type: Derived
      comment: LB.VISIT
      codelist: VISIT
  - name: VISITNUM
    type: float
    label: Visit Number

    submission:
      data_type: float
      length: 8
      mandatory: false
      significant_digits: 1
      origins:
        - type: Derived
      comment: LB.VISITNUM
      codelist: VISITNUM
  - name: PARAM
    type: str
    label: Parameter

    submission:
      data_type: text
      length: 100
      mandatory: false
      origins:
        - type: Derived
      comment: same as LBTEST concatenated with LBSTRESU except for hylaw params
      codelist: PARAM_ADLBHY
  - name: PARAMCD
    type: str
    label: Parameter Code

    submission:
      data_type: text
      length: 8
      mandatory: false
      key_sequence: 2
      origins:
        - type: Derived
      codelist: PARAMCD_ADLBHY
  - name: PARAMN
    type: float
    label: Parameter (N)

    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: Numeric code for Parameter
      codelist: PARAMN_ADLBHY
  - name: PARAMTYP
    type: str
    label: Parameter Type

    submission:
      data_type: text
      length: 7
      mandatory: false
      origins:
        - type: Derived
      codelist: PARAMTYP
      value_level:
        - id: ALT
          where:
            PARAMCD:
              - ALT
          label: Alanine Aminotransferase (U/L)
          data_type: text
          length: 7
          mandatory: false
          origins:
            - type: Derived
          comment: Set to missing
          codelist: PARAMTYP
        - id: AST
          where:
            PARAMCD:
              - AST
          label: Aspartate Aminotransferase (U/L)
          data_type: text
          length: 7
          mandatory: false
          origins:
            - type: Derived
          comment: Set to missing
          codelist: PARAMTYP
        - id: BILI
          where:
            PARAMCD:
              - BILI
          label: Bilirubin (umol/L)
          data_type: text
          length: 7
          mandatory: false
          origins:
            - type: Derived
          comment: Set to missing
          codelist: PARAMTYP
        - id: BILIHY
          where:
            PARAMCD:
              - BILIHY
          label: Bilirubin 1.5 x ULN
          data_type: text
          length: 7
          mandatory: false
          origins:
            - type: Derived
          comment: Set to "DERIVED"
          codelist: PARAMTYP
        - id: TRANSHY
          where:
            PARAMCD:
              - TRANSHY
          label: Transaminase 1.5 x ULN
          data_type: text
          length: 7
          mandatory: false
          origins:
            - type: Derived
          comment: Set to "DERIVED"
          codelist: PARAMTYP
        - id: HYLAW
          where:
            PARAMCD:
              - HYLAW
          label: Total Bili 1.5 x ULN and Transaminase 1.5 x ULN
          data_type: text
          length: 7
          mandatory: false
          origins:
            - type: Derived
          comment: Set to "DERIVED"
          codelist: PARAMTYP
  - name: PARCAT1
    type: str
    label: Parameter Category 1

    submission:
      data_type: text
      length: 5
      mandatory: false
      origins:
        - type: Derived
      codelist: ADLBCAT
      value_level:
        - id: ALT
          where:
            PARAMCD:
              - ALT
          label: Alanine Aminotransferase (U/L)
          data_type: text
          length: 8
          mandatory: false
          origins:
            - type: Derived
          comment: ADLBC.PARCAT1
          codelist: ADLBCAT
        - id: AST
          where:
            PARAMCD:
              - AST
          label: Aspartate Aminotransferase (U/L)
          data_type: text
          length: 8
          mandatory: false
          origins:
            - type: Derived
          comment: ADLBC.PARCAT1
          codelist: ADLBCAT
        - id: BILI
          where:
            PARAMCD:
              - BILI
          label: Bilirubin (umol/L)
          data_type: text
          length: 8
          mandatory: false
          origins:
            - type: Derived
          comment: ADLBC.PARCAT1
          codelist: ADLBCAT
        - id: BILIHY
          where:
            PARAMCD:
              - BILIHY
          label: Bilirubin 1.5 x ULN
          data_type: text
          length: 8
          mandatory: false
          origins:
            - type: Derived
          comment: Set to "HYLAW"
          codelist: ADLBCAT
        - id: TRANSHY
          where:
            PARAMCD:
              - TRANSHY
          label: Transaminase 1.5 x ULN
          data_type: text
          length: 8
          mandatory: false
          origins:
            - type: Derived
          comment: Set to "HYLAW"
          codelist: ADLBCAT
        - id: HYLAW
          where:
            PARAMCD:
              - HYLAW
          label: Total Bili 1.5 x ULN and Transaminase 1.5 x ULN
          data_type: text
          length: 8
          mandatory: false
          origins:
            - type: Derived
          comment: Set to "HYLAW"
          codelist: ADLBCAT
  - name: AVAL
    type: float
    label: Analysis Value

    submission:
      data_type: float
      length: 8
      mandatory: false
      significant_digits: 2
      origins:
        - type: Derived
      value_level:
        - id: ALT
          where:
            PARAMCD:
              - ALT
          label: Alanine Aminotransferase (U/L)
          data_type: integer
          length: 8
          mandatory: false
          origins:
            - type: Derived
          comment: ADLBC.AVAL
        - id: AST
          where:
            PARAMCD:
              - AST
          label: Aspartate Aminotransferase (U/L)
          data_type: integer
          length: 8
          mandatory: false
          origins:
            - type: Derived
          comment: ADLBC.AVAL
        - id: BILI
          where:
            PARAMCD:
              - BILI
          label: Bilirubin (umol/L)
          data_type: float
          length: 8
          mandatory: false
          significant_digits: 2
          display_format: '6.2'
          origins:
            - type: Derived
          comment: ADLBC.AVAL
        - id: BILIHY
          where:
            PARAMCD:
              - BILIHY
          label: Bilirubin 1.5 x ULN
          data_type: integer
          length: 8
          mandatory: false
          origins:
            - type: Derived
          comment: for a given visit, if param='BILI' and r2a1hi > 1.5 then aval=1. otherwise if param='BILI' then aval=0
          codelist: YNN
        - id: TRANSHY
          where:
            PARAMCD:
              - TRANSHY
          label: Transaminase 1.5 x ULN
          data_type: integer
          length: 8
          mandatory: false
          origins:
            - type: Derived
          comment: for a given visit, if param='ALT' or 'AST' and if either r2a1hi > 1.5 then aval=1. otherwise if param='ALT' or 'AST' then aval=0
          codelist: YNN
        - id: HYLAW
          where:
            PARAMCD:
              - HYLAW
          label: Total Bili 1.5 x ULN and Transaminase 1.5 x ULN
          data_type: integer
          length: 8
          mandatory: false
          origins:
            - type: Derived
          comment: for a given visit, if param='BILHY' or 'TRANSHY' and if both has aval=1 then for this param then aval=1. otherwise if for a given visit, if param='BILHY' or 'TRANSHY' then aval=0.
          codelist: YNN
  - name: BASE
    type: float
    label: Baseline Value

    submission:
      data_type: float
      length: 8
      mandatory: false
      significant_digits: 2
      origins:
        - type: Derived
      value_level:
        - id: ALT
          where:
            PARAMCD:
              - ALT
          label: Alanine Aminotransferase (U/L)
          data_type: integer
          length: 8
          mandatory: false
          origins:
            - type: Derived
          comment: ADLBC.AVAL when ADLBC.ABLFL=Y
        - id: AST
          where:
            PARAMCD:
              - AST
          label: Aspartate Aminotransferase (U/L)
          data_type: integer
          length: 8
          mandatory: false
          origins:
            - type: Derived
          comment: ADLBC.AVAL when ADLBC.ABLFL=Y
        - id: BILI
          where:
            PARAMCD:
              - BILI
          label: Bilirubin (umol/L)
          data_type: float
          length: 8
          mandatory: false
          significant_digits: 2
          display_format: '6.2'
          origins:
            - type: Derived
          comment: ADLBC.AVAL when ADLBC.ABLFL=Y
        - id: BILIHY
          where:
            PARAMCD:
              - BILIHY
          label: Bilirubin 1.5 x ULN
          data_type: integer
          length: 8
          mandatory: false
          origins:
            - type: Derived
          comment: ADLBC.AVAL when ADLBC.ABLFL=Y
          codelist: YNN
        - id: TRANSHY
          where:
            PARAMCD:
              - TRANSHY
          label: Transaminase 1.5 x ULN
          data_type: integer
          length: 8
          mandatory: false
          origins:
            - type: Derived
          comment: ADLBC.AVAL when ADLBC.ABLFL=Y
          codelist: YNN
        - id: HYLAW
          where:
            PARAMCD:
              - HYLAW
          label: Total Bili 1.5 x ULN and Transaminase 1.5 x ULN
          data_type: integer
          length: 8
          mandatory: false
          origins:
            - type: Derived
          comment: ADLBC.AVAL when ADLBC.ABLFL=Y
          codelist: YNN
  - name: A1LO
    type: float
    label: Analysis Range 1 Lower Limit

    submission:
      data_type: float
      length: 8
      mandatory: false
      significant_digits: 1
      origins:
        - type: Derived
      value_level:
        - id: ALT
          where:
            PARAMCD:
              - ALT
          label: Alanine Aminotransferase (U/L)
          data_type: integer
          length: 8
          mandatory: false
          origins:
            - type: Derived
          comment: ADLBC.A1LO
        - id: AST
          where:
            PARAMCD:
              - AST
          label: Aspartate Aminotransferase (U/L)
          data_type: integer
          length: 8
          mandatory: false
          origins:
            - type: Derived
          comment: ADLBC.A1LO
        - id: BILI
          where:
            PARAMCD:
              - BILI
          label: Bilirubin (umol/L)
          data_type: float
          length: 8
          mandatory: false
          significant_digits: 1
          display_format: '4.1'
          origins:
            - type: Derived
          comment: ADLBC.A1LO
        - id: BILIHY
          where:
            PARAMCD:
              - BILIHY
          label: Bilirubin 1.5 x ULN
          data_type: integer
          length: 8
          mandatory: false
          origins:
            - type: Derived
          comment: Set to missing
        - id: TRANSHY
          where:
            PARAMCD:
              - TRANSHY
          label: Transaminase 1.5 x ULN
          data_type: integer
          length: 8
          mandatory: false
          origins:
            - type: Derived
          comment: Set to missing
        - id: HYLAW
          where:
            PARAMCD:
              - HYLAW
          label: Total Bili 1.5 x ULN and Transaminase 1.5 x ULN
          data_type: integer
          length: 8
          mandatory: false
          origins:
            - type: Derived
          comment: Set to missing
  - name: A1HI
    type: float
    label: Analysis Range 1 Upper Limit

    submission:
      data_type: float
      length: 8
      mandatory: false
      significant_digits: 1
      origins:
        - type: Derived
      value_level:
        - id: ALT
          where:
            PARAMCD:
              - ALT
          label: Alanine Aminotransferase (U/L)
          data_type: integer
          length: 8
          mandatory: false
          origins:
            - type: Derived
          comment: ADLBC.A1HI
        - id: AST
          where:
            PARAMCD:
              - AST
          label: Aspartate Aminotransferase (U/L)
          data_type: integer
          length: 8
          mandatory: false
          origins:
            - type: Derived
          comment: ADLBC.A1HI
        - id: BILI
          where:
            PARAMCD:
              - BILI
          label: Bilirubin (umol/L)
          data_type: float
          length: 8
          mandatory: false
          significant_digits: 1
          display_format: '4.1'
          origins:
            - type: Derived
          comment: ADLBC.A1HI
        - id: BILIHY
          where:
            PARAMCD:
              - BILIHY
          label: Bilirubin 1.5 x ULN
          data_type: integer
          length: 8
          mandatory: false
          origins:
            - type: Derived
          comment: Set to missing
        - id: TRANSHY
          where:
            PARAMCD:
              - TRANSHY
          label: Transaminase 1.5 x ULN
          data_type: integer
          length: 8
          mandatory: false
          origins:
            - type: Derived
