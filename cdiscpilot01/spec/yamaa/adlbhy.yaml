schema_version: "1.0"
domain: ADLBHY
keys: [STUDYID, USUBJID, PARAMCD, AVISIT]
input:
  SRC:
    path: upstream/adlbhy_input.parquet
    empty_string: present
base: SRC
rows:
  - id: all-rows
    dataset: SRC
    derivations: {}
output:
  path: output/adlbhy.parquet
  order_by: [USUBJID, AVISITN, PARAMN]
  columns: [STUDYID, SUBJID, USUBJID, TRTP, TRTPN, TRTA, TRTAN, TRTSDT, TRTEDT, AGE, AGEGR1, AGEGR1N, RACE, RACEN, SEX, COMP24FL, DSRAEFL, SAFFL, AVISIT, AVISITN, ADY, ADT, VISIT, VISITNUM, PARAMTYP, PARAM, PARAMCD, PARAMN, PARCAT1, AVAL, BASE, A1LO, A1HI, R2A1LO, R2A1HI, BR2A1LO, BR2A1HI, ABLFL, SHIFT1, SHIFT1N, CRIT1, CRIT1FL, CRIT1FN]
columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: SRC.STUDYID
  - name: SUBJID
    type: str
    label: Subject Identifier for the Study
    derivation: SRC.SUBJID
  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: SRC.USUBJID
  - name: TRTP
    type: str
    label: Planned Treatment
    derivation: SRC.TRTP
  - name: TRTPN
    type: float
    label: Planned Treatment (N)
    derivation: SRC.TRTPN
  - name: TRTA
    type: str
    label: Actual Treatment
    derivation: SRC.TRTA
  - name: TRTAN
    type: float
    label: Actual Treatment (N)
    derivation: SRC.TRTAN
  - name: TRTSDT
    type: date
    label: Date of First Exposure to Treatment
    derivation: SRC.TRTSDT
  - name: TRTEDT
    type: date
    label: Date of Last Exposure to Treatment
    derivation: SRC.TRTEDT
  - name: AGE
    type: float
    label: Age
    derivation: SRC.AGE
  - name: AGEGR1
    type: str
    label: Pooled Age Group 1
    derivation: SRC.AGEGR1
  - name: AGEGR1N
    type: float
    label: Pooled Age Group 1 (N)
    derivation: SRC.AGEGR1N
  - name: RACE
    type: str
    label: Race
    derivation: SRC.RACE
  - name: RACEN
    type: float
    label: Race (N)
    derivation: SRC.RACEN
  - name: SEX
    type: str
    label: Sex
    derivation: SRC.SEX
  - name: COMP24FL
    type: str
    label: Completers of Week 24 Population Flag
    derivation: SRC.COMP24FL
  - name: DSRAEFL
    type: str
    label: Discontinued due to AE?
    derivation: SRC.DSRAEFL
  - name: SAFFL
    type: str
    label: Safety Population Flag
    derivation: SRC.SAFFL
  - name: AVISIT
    type: str
    label: Analysis Visit
    derivation: SRC.AVISIT
  - name: AVISITN
    type: float
    label: Analysis Visit (N)
    derivation: SRC.AVISITN
  - name: ADY
    type: float
    label: Analysis Relative Day
    derivation: SRC.ADY
  - name: ADT
    type: date
    label: Analysis Date
    derivation: SRC.ADT
  - name: VISIT
    type: str
    label: Visit Name
    derivation: SRC.VISIT
  - name: VISITNUM
    type: float
    label: Visit Number
    derivation: SRC.VISITNUM
  - name: PARAMTYP
    type: str
    label: Parameter Type
    derivation: SRC.PARAMTYP
  - name: PARAM
    type: str
    label: Parameter
    derivation: SRC.PARAM
  - name: PARAMCD
    type: str
    label: Parameter Code
    derivation: SRC.PARAMCD
  - name: PARAMN
    type: float
    label: Parameter (N)
    derivation: SRC.PARAMN
  - name: PARCAT1
    type: str
    label: Parameter Category 1
    derivation: SRC.PARCAT1
  - name: AVAL
    type: float
    label: Analysis Value
    derivation: SRC.AVAL
  - name: BASE
    type: float
    label: Baseline Value
    derivation: SRC.BASE
  - name: A1LO
    type: float
    label: Analysis Range 1 Lower Limit
    derivation: SRC.A1LO
  - name: A1HI
    type: float
    label: Analysis Range 1 Upper Limit
    derivation: SRC.A1HI
  - name: R2A1LO
    type: float
    label: Ratio to Analysis Range 1 Lower Limit
    derivation: SRC.R2A1LO
  - name: R2A1HI
    type: float
    label: Ratio to Analysis Range 1 Upper Limit
    derivation: SRC.R2A1HI
  - name: BR2A1LO
    type: float
    label: Base Ratio to Analysis Range 1 Lower Lim
    derivation: SRC.BR2A1LO
  - name: BR2A1HI
    type: float
    label: Base Ratio to Analysis Range 1 Upper Lim
    derivation: SRC.BR2A1HI
  - name: ABLFL
    type: str
    label: Baseline Record Flag
    derivation: SRC.ABLFL
  - name: SHIFT1
    type: str
    label: Shift 1
    derivation: SRC.SHIFT1
  - name: SHIFT1N
    type: float
    label: Shift 1 (N)
    derivation: SRC.SHIFT1N
  - name: CRIT1
    type: str
    label: Analysis Criterion 1
    derivation: SRC.CRIT1
  - name: CRIT1FL
    type: str
    label: Criterion 1 Evaluation Result Flag
    derivation: SRC.CRIT1FL
  - name: CRIT1FN
    type: float
    label: Criterion 1 Evaluation Result Flag (N)
    derivation: SRC.CRIT1FN
