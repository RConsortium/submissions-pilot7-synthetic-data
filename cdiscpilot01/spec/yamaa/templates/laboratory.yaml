# Shared chemistry/hematology derivations from the submitted CDISC pilot.
# Children retain category filters, parameter dictionaries and range
# conventions.
yamaa: "1.0"
type: spec
model: ADaM
parent:
  ../../../../spec/yamaa/templates/subject-analysis.yaml

include:
  - ../../../../spec/yamaa/fragments/bds-record.yaml
  - ../../../../spec/yamaa/fragments/analysis-flags.yaml

keys:
  - STUDYID
  - USUBJID
  - PARAMCD
  - LBSEQ
  - AVISIT

input:
  LB:
    path: ../../data/sdtm/lb.parquet
    relative_to: entry
    empty_string: present
  ADSL:
    empty_string: present
    key:
      - USUBJID

base: LB

intermediates:
  - id: PREV
    dataset: LB
    columns:
      - PREV_AVAL
    derivations:
      PREV_AVAL:
        row_value:
          source: LB.LBSTRESN
          offset: -1
          window: PREV_ORDER

columns:
  - name: STUDYID
    type: str
    label: Study Identifier

  - name: USUBJID
    type: str
    label: Unique Subject Identifier

  - name: _IS_UNDER
    type: str
    label: "Working value: _IS_UNDER"

  - name: _IS_EOT
    type: str
    label: "Working value: _IS_EOT"

  - name: _LBDTM_TXT
    type: str
    label: "Working value: _LBDTM_TXT"

  - name: _LBDTM
    type: datetime
    label: "Working value: _LBDTM"

  - name: _ADT_DATE
    type: date
    label: "Working value: _ADT_DATE"

  - name: _PARAM_BASE
    type: str
    label: "Working value: _PARAM_BASE"

  - name: _PARAMN_BASE
    type: float
    label: "Working value: _PARAMN_BASE"

  - name: _AVAL_BASE
    type: float
    label: "Working value: _AVAL_BASE"

  - name: _BASE
    type: float
    label: "Working value: _BASE"

  - name: _BASELINE_AVAL
    type: float
    label: "Working value: _BASELINE_AVAL"

  - name: _PNM_BASE
    type: float
    label: "Working value: _PNM_BASE"

  - name: _IS_LAST_ELIGIBLE
    type: int
    label: "Working value: _IS_LAST_ELIGIBLE"

  - name: _RANK_AVISITN
    type: float
    label: "Working value: _RANK_AVISITN"

  - name: _T1
    type: float
    label: "Working value: _T1"

  - name: _T2
    type: float
    label: "Working value: _T2"

  - name: _B_A1HI
    type: float
    label: "Working value: _B_A1HI"

  - name: _B_A1LO
    type: float
    label: "Working value: _B_A1LO"

  - name: _PARAMCD_BASE
    type: str
    label: "Working value: _PARAMCD_BASE"

  - name: _SCHED
    type: str
    label: "Working value: _SCHED"

  - name: _PREV_AVAL
    type: float
    label: "Working value: _PREV_AVAL"

  - name: _U_RAW
    type: float
    label: "Working value: _U_RAW"

  - name: _U_AVAL_ROUNDED
    type: float
    label: "Working value: _U_AVAL_ROUNDED"
    derivation:
      round_half_away_from_zero:
        source: _U_RAW
        digits: 1

  - name: _U_AVAL
    type: float
    label: "Working value: _U_AVAL"
    derivation:
      case:
        - when: "_IS_UNDER = 'Y' AND _SCHED = 'Y'"
          then: _U_AVAL_ROUNDED
        - otherwise:

  - name: _ABS_U_AVAL
    type: float
    label: "Working value: _ABS_U_AVAL"
    derivation: "abs(_U_AVAL)"

  - name: _R2A1HI_R
    type: float
    label: "Working value: _R2A1HI_R"

  - name: _R2A1LO_R
    type: float
    label: "Working value: _R2A1LO_R"

  - name: _ANRIND_BASE
    type: str
    label: "Working value: _ANRIND_BASE"

  - name: _BASELINE_ANRIND
    type: str
    label: "Working value: _BASELINE_ANRIND"

  - name: _PNM_BNRIND
    type: str
    label: "Working value: _PNM_BNRIND"

  - name: _BNRIND_VAL
    type: str
    label: "Working value: _BNRIND_VAL"

  - name: _LBCAT
    type: str
    label: "Working value: _LBCAT"

  - name: _VISIT_RAW
    type: str
    label: "Working value: _VISIT_RAW"

  - name: _LBBLFL
    type: str
    label: "Working value: _LBBLFL"

  - name: _LBTESTCD
    type: str
    label: "Working value: _LBTESTCD"

  - name: ABLFL
    type: str
    label: Baseline Record Flag

  - name: ALBTRVAL
    type: float
    label: Amount Threshold Range

  - name: _RANK_VAL
    type: float
    label: "Working value: _RANK_VAL"
    derivation:
      case:
        - when: "_IS_UNDER = 'Y'"
          then: _ABS_U_AVAL
        - otherwise: ALBTRVAL

  - name: _ANL01_RANK
    type: int
    label: "Working value: _ANL01_RANK"
    derivation:
      rank:
        window: ANL01_RANK_ORDER

  - name: AVISIT
    type: str
    label: Analysis Visit

  - name: AVISITN
    type: float
    label: Analysis Visit (N)

  - name: ADY
    type: float
    label: Analysis Relative Day
    derivation:
      study_day:
        source: _ADT_DATE
        reference: TRTSDT

  - name: ADT
    type: date
    label: Analysis Date
    derivation: _ADT_DATE

  - name: VISIT
    type: str
    label: Visit Name

  - name: VISITNUM
    type: float
    label: Visit Number

  - name: PARAM
    type: str
    label: Parameter

  - name: PARAMCD
    type: str
    label: Parameter Code

  - name: PARAMN
    type: float
    label: Parameter (N)
    derivation:
      case:
        - when: "_IS_UNDER = 'Y'"
          then: "_PARAMN_BASE + 100"
        - otherwise: _PARAMN_BASE

  - name: PARCAT1
    type: str
    label: Parameter Category 1

  - name: AVAL
    type: float
    label: Analysis Value
    derivation:
      case:
        - when: "_IS_UNDER = 'Y'"
          then: _U_AVAL
        - otherwise: _AVAL_BASE

  - name: BASE
    type: float
    label: Baseline Value
    derivation: _BASE

  - name: CHG
    type: float
    label: Change from Baseline
    derivation:
      case:
        - when: "_IS_UNDER = 'Y'"
          then:
        - when: "ABLFL = 'Y'"
          then:
        - otherwise: "_AVAL_BASE - _BASE"

  - name: A1LO
    type: float
    label: Analysis Range 1 Lower Limit

  - name: A1HI
    type: float
    label: Analysis Range 1 Upper Limit

  - name: R2A1LO
    type: float
    label: Ratio to Analysis Range 1 Lower Limit
    derivation: "_AVAL_BASE / A1LO"

  - name: R2A1HI
    type: float
    label: Ratio to Analysis Range 1 Upper Limit
    derivation: "_AVAL_BASE / A1HI"

  - name: BR2A1LO
    type: float
    label: Base Ratio to Analysis Range 1 Lower Lim
    derivation:
      case:
        - when: "_IS_UNDER = 'Y'"
          then:
        - otherwise: "_BASE / A1LO"

  - name: BR2A1HI
    type: float
    label: Base Ratio to Analysis Range 1 Upper Lim
    derivation:
      case:
        - when: "_IS_UNDER = 'Y'"
          then:
        - otherwise: "_BASE / A1HI"

  - name: ANL01FL
    type: str
    label: Analysis Record Flag 1
    derivation:
      case:
        - when: "_ANL01_RANK = 1 AND _RANK_VAL IS NOT NULL"
          then: "'Y'"
        - otherwise: "''"

  - name: ANRIND
    type: str
    label: Analysis Reference Range Indicator
    derivation:
      case:
        - when: "_IS_UNDER = 'Y' AND _U_AVAL IS NULL"
          then: "''"
        - when: "_IS_UNDER = 'Y' AND _U_AVAL > 1.0"
          then: "'H'"
        - when: "_IS_UNDER = 'Y' AND _U_AVAL < -1.0"
          then: "'L'"
        - when: "_IS_UNDER = 'Y'"
          then: "'N'"
        - otherwise: _ANRIND_BASE

  - name: BNRIND
    type: str
    label: Baseline Reference Range Indicator
    derivation:
      case:
        - when: "_IS_UNDER = 'Y'"
          then: "''"
        - when: "_BNRIND_VAL IS NULL"
          then: "''"
        - otherwise: _BNRIND_VAL

  - name: AENTMTFL
    type: str
    label: Last value in treatment visit
    derivation:
      case:
        - when: "_IS_EOT = 'Y'"
          then: "'Y'"
        - when: "_IS_LAST_ELIGIBLE = 1"
          then: "'Y'"
        - otherwise: "''"

  - name: LBSEQ
    type: float
    label: Sequence Number

  - name: LBNRIND
    type: str
    label: Reference Range Indicator

  - name: LBSTRESN
    type: float
    label: Numeric Result/Finding in Standard Units

rows:
  - id: base-ord
    dataset: LB
    derivations:
      STUDYID: LB.STUDYID
      # yamaa-lint: allow repeated_row_derivation -- Bind before grouping.
      USUBJID: LB.USUBJID
      PARAMCD: LB.LBTESTCD
      _IS_UNDER: "''"
      _IS_EOT: "''"
      VISIT: LB.VISIT
      VISITNUM: LB.VISITNUM
      # yamaa-lint: allow repeated_row_derivation -- Bind before grouping.
      LBSEQ: LB.LBSEQ
      LBNRIND: LB.LBNRIND
      LBSTRESN: LB.LBSTRESN
      A1HI: LB.LBSTNRHI
      _LBDTM_TXT: LB.LBDTC
      # yamaa-lint: allow repeated_row_derivation -- Bind before grouping.
      _LBDTM:
        impute:
          type: datetime
          source: _LBDTM_TXT
          time: first
          invalid:
      # yamaa-lint: allow repeated_row_derivation -- Bind before grouping.
      _ADT_DATE:
        to_date:
          source: _LBDTM
      AVISIT:
        case:
          - when: "LB.VISIT = 'SCREENING 1'"
            then: "'        Baseline'"
          - when: "LB.VISIT = 'WEEK 2'"
            then: "'          Week 2'"
          - when: "LB.VISIT = 'WEEK 4'"
            then: "'          Week 4'"
          - when: "LB.VISIT = 'WEEK 6'"
            then: "'          Week 6'"
          - when: "LB.VISIT = 'WEEK 8'"
            then: "'          Week 8'"
          - when: "LB.VISIT = 'WEEK 12'"
            then: "'         Week 12'"
          - when: "LB.VISIT = 'WEEK 16'"
            then: "'         Week 16'"
          - when: "LB.VISIT = 'WEEK 20'"
            then: "'         Week 20'"
          - when: "LB.VISIT = 'WEEK 24'"
            then: "'         Week 24'"
          - when: "LB.VISIT = 'WEEK 26'"
            then: "'         Week 26'"
          - otherwise: "'               .'"
      AVISITN:
        case:
          - when: "LB.VISIT = 'SCREENING 1'"
            then: 0.0
          - when: "LB.VISIT = 'WEEK 2'"
            then: 2.0
          - when: "LB.VISIT = 'WEEK 4'"
            then: 4.0
          - when: "LB.VISIT = 'WEEK 6'"
            then: 6.0
          - when: "LB.VISIT = 'WEEK 8'"
            then: 8.0
          - when: "LB.VISIT = 'WEEK 12'"
            then: 12.0
          - when: "LB.VISIT = 'WEEK 16'"
            then: 16.0
          - when: "LB.VISIT = 'WEEK 20'"
            then: 20.0
          - when: "LB.VISIT = 'WEEK 24'"
            then: 24.0
          - when: "LB.VISIT = 'WEEK 26'"
            then: 26.0
          - otherwise:
      ABLFL:
        case:
          - when: "LB.LBBLFL = 'Y'"
            then: "'Y'"
          - otherwise: "''"
      _AVAL_BASE: LB.LBSTRESN
      _BASELINE_AVAL:
        case:
          - when: "ABLFL = 'Y'"
            then: _AVAL_BASE
          - otherwise:
      _PNM_BASE:
        locf:
          source: _BASELINE_AVAL
          window: BASE_ORD_ORDER
      _BASE:
        first_available:
          sources:
            - _BASELINE_AVAL
            - _PNM_BASE
      _IS_LAST_ELIGIBLE:
        row_number:
          window: BASE_ORD_ORDER_2
      _RANK_AVISITN: AVISITN
      _B_A1HI:
      _B_A1LO:
      _T1: "1.5 * A1HI - _AVAL_BASE"
      _T2: "_AVAL_BASE - 0.5 * A1LO"
      _R2A1HI_R: "_AVAL_BASE / A1HI"
      _BASELINE_ANRIND:
        case:
          - when: "ABLFL = 'Y'"
            then: _ANRIND_BASE
          - otherwise:
      _PNM_BNRIND:
        locf:
          source: _BASELINE_ANRIND
          window: BASE_ORD_ORDER
      _BNRIND_VAL:
        first_available:
          sources:
            - _BASELINE_ANRIND
            - _PNM_BNRIND
      _LBCAT:
      _VISIT_RAW:
      _LBBLFL:
      _PARAMCD_BASE:
      _SCHED:
      _PREV_AVAL:
      _U_RAW:

  - id: base-eot
    dataset: LB
    group_by:
      - LB.USUBJID
      - LB.LBTESTCD
      - LB.LBSEQ
    filter: "_IS_LAST_ELIGIBLE = 1"
    derivations:
      STUDYID:
        aggregate: ONLY(LB.STUDYID)
      USUBJID: LB.USUBJID
      PARAMCD: LB.LBTESTCD
      LBSEQ: LB.LBSEQ
      _IS_UNDER: "''"
      _IS_EOT: "'Y'"
      _LBCAT:
        aggregate: "ONLY(LB.LBCAT)"
      _VISIT_RAW:
        aggregate: "ONLY(LB.VISIT)"
      VISIT:
        aggregate: "ONLY(LB.VISIT)"
      VISITNUM:
        aggregate: "ONLY(LB.VISITNUM)"
      LBNRIND:
        aggregate: "ONLY(LB.LBNRIND)"
      LBSTRESN:
        aggregate: "ONLY(LB.LBSTRESN)"
      A1HI:
        aggregate: "ONLY(LB.LBSTNRHI)"
      _LBDTM_TXT:
        aggregate: "ONLY(LB.LBDTC)"
      _LBDTM:
        impute:
          type: datetime
          source: _LBDTM_TXT
          time: first
          invalid:
      _ADT_DATE:
        to_date:
          source: _LBDTM
      _LBBLFL:
        aggregate: "ONLY(LB.LBBLFL)"
      _LBTESTCD:
        aggregate: "ONLY(LB.LBTESTCD)"
      AVISIT: "'End of Treatment'"
      AVISITN: 99.0
      ABLFL: "''"
      _AVAL_BASE:
        aggregate: "ONLY(LB.LBSTRESN)"
      _BASELINE_AVAL:
        case:
          - when: "_LBBLFL = 'Y'"
            then: _AVAL_BASE
          - otherwise:
      _PNM_BASE:
        locf:
          source: _BASELINE_AVAL
          window: BASE_ORD_ORDER
      _BASE:
        first_available:
          sources:
            - _BASELINE_AVAL
            - _PNM_BASE
      _IS_LAST_ELIGIBLE:
        row_number:
          window: BASE_EOT_ORDER
      _RANK_AVISITN:
        case:
          - when: "_VISIT_RAW = 'SCREENING 1'"
            then: 0.0
          - when: "_VISIT_RAW = 'WEEK 2'"
            then: 2.0
          - when: "_VISIT_RAW = 'WEEK 4'"
            then: 4.0
          - when: "_VISIT_RAW = 'WEEK 6'"
            then: 6.0
          - when: "_VISIT_RAW = 'WEEK 8'"
            then: 8.0
          - when: "_VISIT_RAW = 'WEEK 12'"
            then: 12.0
          - when: "_VISIT_RAW = 'WEEK 16'"
            then: 16.0
          - when: "_VISIT_RAW = 'WEEK 20'"
            then: 20.0
          - when: "_VISIT_RAW = 'WEEK 24'"
            then: 24.0
          - when: "_VISIT_RAW = 'WEEK 26'"
            then: 26.0
          - otherwise:
      _B_A1HI:
      _B_A1LO:
      _T1: "1.5 * A1HI - _AVAL_BASE"
      _T2: "_AVAL_BASE - 0.5 * A1LO"
      _R2A1HI_R: "_AVAL_BASE / A1HI"
      _BASELINE_ANRIND:
        case:
          - when: "_LBBLFL = 'Y'"
            then: _ANRIND_BASE
          - otherwise:
      _PNM_BNRIND:
        locf:
          source: _BASELINE_ANRIND
          window: BASE_ORD_ORDER
      _BNRIND_VAL:
        first_available:
          sources:
            - _BASELINE_ANRIND
            - _PNM_BNRIND
      _PARAMCD_BASE:
      _SCHED:
      _PREV_AVAL:
      _U_RAW:

  - id: under-ord
    dataset: LB
    derivations:
      STUDYID: LB.STUDYID
      USUBJID: LB.USUBJID
      _IS_UNDER: "'Y'"
      _IS_EOT: "''"
      VISIT: LB.VISIT
      VISITNUM: LB.VISITNUM
      LBSEQ: LB.LBSEQ
      LBNRIND: LB.LBNRIND
      LBSTRESN: LB.LBSTRESN
      A1LO:
      A1HI:
      _LBDTM_TXT: LB.LBDTC
      _LBDTM:
        impute:
          type: datetime
          source: _LBDTM_TXT
          time: first
          invalid:
      _ADT_DATE:
        to_date:
          source: _LBDTM
      PARAMCD:
        str_template: "_{LB.LBTESTCD}"
      AVISIT:
        case:
          - when: "LB.VISIT = 'SCREENING 1'"
            then: "'        Baseline'"
          - when: "LB.VISIT = 'WEEK 2'"
            then: "'          Week 2'"
          - when: "LB.VISIT = 'WEEK 4'"
            then: "'          Week 4'"
          - when: "LB.VISIT = 'WEEK 6'"
            then: "'          Week 6'"
          - when: "LB.VISIT = 'WEEK 8'"
            then: "'          Week 8'"
          - when: "LB.VISIT = 'WEEK 12'"
            then: "'         Week 12'"
          - when: "LB.VISIT = 'WEEK 16'"
            then: "'         Week 16'"
          - when: "LB.VISIT = 'WEEK 20'"
            then: "'         Week 20'"
          - when: "LB.VISIT = 'WEEK 24'"
            then: "'         Week 24'"
          - when: "LB.VISIT = 'WEEK 26'"
            then: "'         Week 26'"
          - otherwise: "'               .'"
      AVISITN:
        case:
          - when: "LB.VISIT = 'SCREENING 1'"
            then: 0.0
          - when: "LB.VISIT = 'WEEK 2'"
            then: 2.0
          - when: "LB.VISIT = 'WEEK 4'"
            then: 4.0
          - when: "LB.VISIT = 'WEEK 6'"
            then: 6.0
          - when: "LB.VISIT = 'WEEK 8'"
            then: 8.0
          - when: "LB.VISIT = 'WEEK 12'"
            then: 12.0
          - when: "LB.VISIT = 'WEEK 16'"
            then: 16.0
          - when: "LB.VISIT = 'WEEK 20'"
            then: 20.0
          - when: "LB.VISIT = 'WEEK 24'"
            then: 24.0
          - when: "LB.VISIT = 'WEEK 26'"
            then: 26.0
          - otherwise:
      ABLFL: "''"
      _AVAL_BASE: LB.LBSTRESN
      _BASE:
        first_available:
          sources:
            - _BASELINE_AVAL
            - _PNM_BASE
      _BASELINE_AVAL:
      _PNM_BASE:
      _PARAMCD_BASE: LB.LBTESTCD
      _PREV_AVAL: PREV.PREV_AVAL
      _U_RAW: "(_AVAL_BASE - _PREV_AVAL) / (0.5 * (_B_A1HI - _B_A1LO))"
      _IS_LAST_ELIGIBLE:
        row_number:
          window: UNDER_ORD_ORDER
      _RANK_AVISITN: AVISITN
      _B_A1HI: LB.LBSTNRHI
      _B_A1LO: LB.LBSTNRLO
      _T1: "1.5 * _B_A1HI - _AVAL_BASE"
      _T2: "_AVAL_BASE - 0.5 * _B_A1LO"
      _R2A1HI_R:
      _R2A1LO_R:
      _BASELINE_ANRIND:
      _PNM_BNRIND:
      _BNRIND_VAL:
      _ANRIND_BASE:
      _LBCAT:
      _VISIT_RAW:
      _LBBLFL:

  - id: under-eot
    dataset: LB
    group_by:
      - LB.USUBJID
      - LB.LBTESTCD
      - LB.LBSEQ
    filter: "_IS_LAST_ELIGIBLE = 1"
    derivations:
      STUDYID:
        aggregate: ONLY(LB.STUDYID)
      USUBJID: LB.USUBJID
      LBSEQ: LB.LBSEQ
      _IS_UNDER: "'Y'"
      _IS_EOT: "'Y'"
      _LBCAT:
        aggregate: "ONLY(LB.LBCAT)"
      _VISIT_RAW:
        aggregate: "ONLY(LB.VISIT)"
      VISIT:
        aggregate: "ONLY(LB.VISIT)"
      VISITNUM:
        aggregate: "ONLY(LB.VISITNUM)"
      LBNRIND:
        aggregate: "ONLY(LB.LBNRIND)"
      LBSTRESN:
        aggregate: "ONLY(LB.LBSTRESN)"
      A1LO:
      A1HI:
      _LBDTM_TXT:
        aggregate: "ONLY(LB.LBDTC)"
      _LBDTM:
        impute:
          type: datetime
          source: _LBDTM_TXT
          time: first
          invalid:
      _ADT_DATE:
        to_date:
          source: _LBDTM
      _LBTESTCD:
        aggregate: "ONLY(LB.LBTESTCD)"
      _LBBLFL:
        aggregate: "ONLY(LB.LBBLFL)"
      PARAMCD:
        str_template: "_{_LBTESTCD}"
      AVISIT: "'End of Treatment'"
      AVISITN: 99.0
      ABLFL: "''"
      _AVAL_BASE:
        aggregate: "ONLY(LB.LBSTRESN)"
      _BASE:
      _BASELINE_AVAL:
      _PNM_BASE:
      _PARAMCD_BASE:
        aggregate: "ONLY(LB.LBTESTCD)"
      _SCHED:
        case:
          - when: >-
              _VISIT_RAW IN ('SCREENING 1', 'WEEK 2', 'WEEK 4',
              'WEEK 6', 'WEEK 8', 'WEEK 12', 'WEEK 16', 'WEEK
              20', 'WEEK 24', 'WEEK 26')
            then: "'Y'"
          - otherwise: "''"
      _PREV_AVAL: PREV.PREV_AVAL
      _U_RAW: "(_AVAL_BASE - _PREV_AVAL) / (0.5 * (_B_A1HI - _B_A1LO))"
      _IS_LAST_ELIGIBLE:
        row_number:
          window: UNDER_EOT_ORDER
      _RANK_AVISITN:
        case:
          - when: "_VISIT_RAW = 'SCREENING 1'"
            then: 0.0
          - when: "_VISIT_RAW = 'WEEK 2'"
            then: 2.0
          - when: "_VISIT_RAW = 'WEEK 4'"
            then: 4.0
          - when: "_VISIT_RAW = 'WEEK 6'"
            then: 6.0
          - when: "_VISIT_RAW = 'WEEK 8'"
            then: 8.0
          - when: "_VISIT_RAW = 'WEEK 12'"
            then: 12.0
          - when: "_VISIT_RAW = 'WEEK 16'"
            then: 16.0
          - when: "_VISIT_RAW = 'WEEK 20'"
            then: 20.0
          - when: "_VISIT_RAW = 'WEEK 24'"
            then: 24.0
          - when: "_VISIT_RAW = 'WEEK 26'"
            then: 26.0
          - otherwise:
      _B_A1HI:
        aggregate: "ONLY(LB.LBSTNRHI)"
      _B_A1LO:
        aggregate: "ONLY(LB.LBSTNRLO)"
      _T1: "1.5 * _B_A1HI - _AVAL_BASE"
      _T2: "_AVAL_BASE - 0.5 * _B_A1LO"
      _R2A1HI_R:
      _R2A1LO_R:
      _BASELINE_ANRIND:
      _PNM_BNRIND:
      _BNRIND_VAL:
      _ANRIND_BASE:
