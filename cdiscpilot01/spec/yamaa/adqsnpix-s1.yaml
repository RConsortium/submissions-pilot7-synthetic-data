# ADQSNPIX stage S1: analysis-window assignment + closest-to-target selection.
#
# One row per SDTM QS record (NPITM01S-12S, NPTOT). Assigns each record to
# its analysis window on QSDY (Baseline <=1 target 1; Week 2 2-21 target 14;
# Week N (4..24) 7N-6..7N+7 target 7N; Week 26 >=176 target 182) and ranks
# records within (USUBJID, QSTESTCD, window) by (|QSDY - target|, QSDY,
# QSSEQ). _RANK = 1 marks the selected record (ANL01FL='Y').
schema_version: "1.0"
domain: ADQSNPIX_S1
keys: [USUBJID, QSTESTCD, QSSEQ]

input:
  QS:
    path: sdtm/qs.parquet
    empty_string: present

base: QS

rows:
  - id: qs-recs
    dataset: QS
    filter: "QS.QSTESTCD IN ('NPITM01S','NPITM02S','NPITM03S','NPITM04S','NPITM05S','NPITM06S','NPITM07S','NPITM08S','NPITM09S','NPITM10S','NPITM11S','NPITM12S','NPTOT')"
    derivations:
      STUDYID: QS.STUDYID
      USUBJID: QS.USUBJID
      QSTESTCD: QS.QSTESTCD
      QSSEQ: QS.QSSEQ
      QSDY: QS.QSDY
      QSDTC: QS.QSDTC
      VISIT: QS.VISIT
      VISITNUM: QS.VISITNUM
      QSSTRESN: QS.QSSTRESN
      QSBLFL: QS.QSBLFL
      _WINDOW:
        case:
          - when: "QS.QSDY <= 1"
            then: {literal: 0}
          - when: "QS.QSDY <= 21"
            then: {literal: 1}
          - when: "QS.QSDY <= 35"
            then: {literal: 2}
          - when: "QS.QSDY <= 49"
            then: {literal: 3}
          - when: "QS.QSDY <= 63"
            then: {literal: 4}
          - when: "QS.QSDY <= 77"
            then: {literal: 5}
          - when: "QS.QSDY <= 91"
            then: {literal: 6}
          - when: "QS.QSDY <= 105"
            then: {literal: 7}
          - when: "QS.QSDY <= 119"
            then: {literal: 8}
          - when: "QS.QSDY <= 133"
            then: {literal: 9}
          - when: "QS.QSDY <= 147"
            then: {literal: 10}
          - when: "QS.QSDY <= 161"
            then: {literal: 11}
          - when: "QS.QSDY <= 175"
            then: {literal: 12}
          - otherwise: {literal: 13}
      _TARGET:
        case:
          - when: "_WINDOW = 0"
            then: {literal: 1.0}
          - when: "_WINDOW = 1"
            then: {literal: 14.0}
          - when: "_WINDOW = 2"
            then: {literal: 28.0}
          - when: "_WINDOW = 3"
            then: {literal: 42.0}
          - when: "_WINDOW = 4"
            then: {literal: 56.0}
          - when: "_WINDOW = 5"
            then: {literal: 70.0}
          - when: "_WINDOW = 6"
            then: {literal: 84.0}
          - when: "_WINDOW = 7"
            then: {literal: 98.0}
          - when: "_WINDOW = 8"
            then: {literal: 112.0}
          - when: "_WINDOW = 9"
            then: {literal: 126.0}
          - when: "_WINDOW = 10"
            then: {literal: 140.0}
          - when: "_WINDOW = 11"
            then: {literal: 154.0}
          - when: "_WINDOW = 12"
            then: {literal: 168.0}
          - otherwise: {literal: 182.0}
      _DIFF:
        compute:
          expr: "abs(QS.QSDY - _TARGET)"
      _RANK:
        rank:
          method: dense
          window:
            group_by: [USUBJID, QSTESTCD, _WINDOW]
            order_by: [{variable: _DIFF}, {variable: QSDY}, {variable: QSSEQ}]
      _IS_SEL:
        case:
          - when: "_RANK = 1"
            then: {literal: 'Y'}
          - otherwise: {literal: ''}
      _ABLFL:
        case:
          - when: "QS.QSBLFL = 'Y' AND _WINDOW = 0"
            then: {literal: 'Y'}
          - otherwise: {literal: ''}
      _ADT:
        str_extract:
          source: QS.QSDTC
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}"

output:
  path: output/adqsnpix-s1.parquet
  columns: [STUDYID, USUBJID, QSTESTCD, QSSEQ, QSDY, QSDTC, VISIT, VISITNUM,
    QSSTRESN, QSBLFL, _WINDOW, _RANK, _IS_SEL, _ABLFL, _ADT]

columns:
  - name: STUDYID
    type: str
  - name: USUBJID
    type: str
  - name: QSTESTCD
    type: str
  - name: QSSEQ
    type: float
  - name: QSDY
    type: float
  - name: QSDTC
    type: str
  - name: VISIT
    type: str
  - name: VISITNUM
    type: float
  - name: QSSTRESN
    type: float
  - name: QSBLFL
    type: str
  - name: _WINDOW
    type: int
  - name: _RANK
    type: int
  - name: _IS_SEL
    type: str
  - name: _ABLFL
    type: str
  - name: _ADT
    type: str
  - name: _TARGET
    type: float
  - name: _DIFF
    type: float
