- name: _BASELINE_ANRIND
  type: str
  label: 'Working value: _BASELINE_ANRIND'
- name: _PNM_BNRIND
  type: str
  label: 'Working value: _PNM_BNRIND'
- name: _BNRIND_VAL
  type: str
  label: 'Working value: _BNRIND_VAL'
- name: _AVAL_BASE
  type: float
