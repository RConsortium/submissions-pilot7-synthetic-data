    codelist: ARMN
    origins:
    - type: Derived
    comment: ADSL.TRT01PN
- name: TRTA
  type: str
  label: Actual Treatment
  derivation: ADSL_SBJ.TRT01A
  submission:
    mandatory: false
    data_type: text
    length: 20
    codelist: ARM
    origins:
    - type: Derived
    comment: ADSL.TRT01A
- name: TRTAN
