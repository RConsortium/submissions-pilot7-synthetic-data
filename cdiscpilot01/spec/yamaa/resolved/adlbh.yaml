    USUBJID: LB.USUBJID
    PARAMCD: LB.LBTESTCD
    _IS_UNDER: ''''''
    _IS_EOT: ''''''
    VISIT: LB.VISIT
    VISITNUM: LB.VISITNUM
    LBSEQ: LB.LBSEQ
    LBNRIND: LB.LBNRIND
