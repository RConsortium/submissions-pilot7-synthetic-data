      - when: _B_A1LO IS NULL AND _B_A1HI IS NULL
        then: null
      - when: _B_A1LO IS NULL
        then: _T1
      - when: _B_A1HI IS NULL
        then: _T2
      - otherwise:
          greatest:
            sources:
            - _T1
            - _T2
    _R2A1HI_R: null
    _R2A1LO_R: null
    _BASELINE_ANRIND: null
