          filter: _LBCAT = 'HEMATOLOGY' AND _VISIT_RAW NOT IN ('RETRIEVAL', 'AMBUL
            ECG REMOVAL') AND _VISIT_RAW IN ('WEEK 2', 'WEEK 4', 'WEEK 6', 'WEEK 8',
            'WEEK 12', 'WEEK 16', 'WEEK 20', 'WEEK 24')
    _RANK_AVISITN:
      case:
      - when: _VISIT_RAW = 'SCREENING 1'
