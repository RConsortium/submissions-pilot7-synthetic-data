        then: '''        Baseline'''
      - when: LB.VISIT = 'WEEK 2'
        then: '''          Week 2'''
      - when: LB.VISIT = 'WEEK 4'
        then: '''          Week 4'''
      - when: LB.VISIT = 'WEEK 6'
        then: '''          Week 6'''
      - when: LB.VISIT = 'WEEK 8'
        then: '''          Week 8'''
      - when: LB.VISIT = 'WEEK 12'
        then: '''         Week 12'''
      - when: LB.VISIT = 'WEEK 16'
        then: '''         Week 16'''
      - when: LB.VISIT = 'WEEK 20'
        then: '''         Week 20'''
      - when: LB.VISIT = 'WEEK 24'
        then: '''         Week 24'''
      - when: LB.VISIT = 'WEEK 26'
        then: '''         Week 26'''
      - otherwise: '''               .'''
    AVISITN:
      case:
      - when: LB.VISIT = 'SCREENING 1'
        then: 0.0
      - when: LB.VISIT = 'WEEK 2'
        then: 2.0
      - when: LB.VISIT = 'WEEK 4'
        then: 4.0
      - when: LB.VISIT = 'WEEK 6'
        then: 6.0
      - when: LB.VISIT = 'WEEK 8'
        then: 8.0
      - when: LB.VISIT = 'WEEK 12'
        then: 12.0
      - when: LB.VISIT = 'WEEK 16'
        then: 16.0
      - when: LB.VISIT = 'WEEK 20'
        then: 20.0
      - when: LB.VISIT = 'WEEK 24'
        then: 24.0
      - when: LB.VISIT = 'WEEK 26'
        then: 26.0
      - otherwise: null
    ABLFL:
      case:
      - when: LB.LBBLFL = 'Y'
        then: '''Y'''
      - otherwise: ''''''
    _PARAM_BASE:
      mapping:
        source: LB.LBTESTCD
        dict:
          HGB: Hemoglobin (mmol/L)
          HCT: Hematocrit
          MCV: Ery. Mean Corpuscular Volume (fL)
          MCH: Ery. Mean Corpuscular Hemoglobin (fmol(Fe))
          MCHC: Ery. Mean Corpuscular HGB Concentration (mmol/L)
          WBC: Leukocytes (GI/L)
          LYM: Lymphocytes (GI/L)
          MONO: Monocytes (GI/L)
          EOS: Eosinophils (GI/L)
          BASO: Basophils (GI/L)
          PLAT: Platelet (GI/L)
          RBC: Erythrocytes (TI/L)
          ANISO: Anisocytes
          MACROCY: Macrocytes
          MICROCY: Microcytes
          POIKILO: Poikilocytes
          POLYCHR: Polychromasia
        case_sensitive: true
        unmapped: null
    _PARAMN_BASE:
      mapping:
        source: LB.LBTESTCD
        dict:
          HGB: 1.0
          HCT: 2.0
          MCV: 3.0
          MCH: 4.0
          MCHC: 5.0
          WBC: 6.0
          LYM: 7.0
          MONO: 8.0
          EOS: 9.0
          BASO: 10.0
          PLAT: 11.0
          RBC: 12.0
          ANISO: 13.0
          MACROCY: 14.0
          MICROCY: 15.0
          POIKILO: 16.0
          POLYCHR: 17.0
        case_sensitive: true
        unmapped: null
    _AVAL_BASE: LB.LBSTRESN
    _BASELINE_AVAL:
      case:
      - when: ABLFL = 'Y'
        then: _AVAL_BASE
      - otherwise: null
    _PNM_BASE:
      locf:
        source: _BASELINE_AVAL
        include_current: true
        window:
          group_by:
          - USUBJID
          - PARAMCD
          order_by:
          - variable: LBSEQ
            direction: asc
            nulls: last
    _BASE:
      first_available:
        sources:
        - _BASELINE_AVAL
        - _PNM_BASE
    _IS_LAST_ELIGIBLE:
      row_number:
        window:
          group_by:
          - USUBJID
          - PARAMCD
          order_by:
          - variable: LBSEQ
            direction: desc
            nulls: last
          filter: VISIT IN ('WEEK 2', 'WEEK 4', 'WEEK 6', 'WEEK 8', 'WEEK 12', 'WEEK
            16', 'WEEK 20', 'WEEK 24')
    _RANK_AVISITN: AVISITN
    _B_A1HI: null
    _B_A1LO: null
    _EOT_A1LO_RAW: null
    _T1: 1.5 * A1HI - _AVAL_BASE
    _T2: _AVAL_BASE - 0.5 * A1LO
    ALBTRVAL:
      case:
      - when: A1LO IS NULL AND A1HI IS NULL
        then: null
      - when: A1LO IS NULL
        then:
          greatest:
            sources:
            - _T1
            - _AVAL_BASE
      - when: A1HI IS NULL
        then: _T2
      - otherwise:
          greatest:
            sources:
            - _T1
            - _T2
    _R2A1HI_R: _AVAL_BASE / A1HI
    _R2A1LO_R: _AVAL_BASE / A1LO
    _ANRIND_BASE:
      case:
      - when: _R2A1HI_R > 1.5
        then: '''H'''
      - when: _R2A1LO_R < 0.5
        then: '''L'''
      - when: A1LO IS NULL AND A1HI IS NULL AND _AVAL_BASE IS NOT NULL
        then: '''H'''
      - otherwise: '''N'''
    _BASELINE_ANRIND:
      case:
      - when: ABLFL = 'Y'
        then: _ANRIND_BASE
      - otherwise: null
    _PNM_BNRIND:
      locf:
        source: _BASELINE_ANRIND
        include_current: true
        window:
          group_by:
          - USUBJID
          - PARAMCD
          order_by:
          - variable: LBSEQ
            direction: asc
            nulls: last
    _BNRIND_VAL:
      first_available:
        sources:
        - _BASELINE_ANRIND
        - _PNM_BNRIND
    _LBCAT: null
    _VISIT_RAW: null
    _LBBLFL: null
    _LBTESTCD: LB.LBTESTCD
    _PARAMCD_BASE: null
    _SCHED: null
    _PREV_AVAL: null
    _U_RAW: null
