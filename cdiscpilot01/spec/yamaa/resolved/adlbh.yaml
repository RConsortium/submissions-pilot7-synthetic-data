- name: ANRIND
  type: str
  label: Analysis Reference Range Indicator
  derivation:
    case:
    - when: _IS_UNDER = 'Y' AND _U_AVAL IS NULL
      then: ''''''
    - when: _IS_UNDER = 'Y' AND _U_AVAL > 1.0
      then: '''H'''
    - when: _IS_UNDER = 'Y' AND _U_AVAL < -1.0
      then: '''L'''
    - when: _IS_UNDER = 'Y'
      then: '''N'''
    - otherwise: _ANRIND_BASE
  submission:
    mandatory: false
    data_type: text
    length: 1
    codelist: LNH
    origins:
    - type: Derived
    value_level:
    - id: ANISO
      where:
        PARAMCD:
        - ANISO
      label: Anisocytes
      mandatory: false
      data_type: text
      length: 1
      codelist: LNH
      origins:
      - type: Derived
      comment: if AVAL < (0.5*LBSTNRLO) then ANRIND='L'; if LAVAL > 1.5* LBSTNRHI
        then ANRIND='H'; ANRIND='N' otherwise. Used for shift tables
    - id: BASO
      where:
        PARAMCD:
        - BASO
      label: Basophils (GI/L)
      mandatory: false
      data_type: text
      length: 1
      codelist: LNH
      origins:
      - type: Derived
      comment: if AVAL < (0.5*LBSTNRLO) then ANRIND='L'; if LAVAL > 1.5* LBSTNRHI
