      comment: Set to missing
- name: ALBTRVAL
  type: float
  label: Amount Threshold Range
  submission:
    mandatory: false
    data_type: float
    length: 8
    significant_digits: 3
    origins:
    - type: Derived
    comment: Maximum of [LBSTRESN-(1.5*ULN)] and [(.5*LLN) - LBSTRESN]
- name: _RANK_VAL
  type: float
  label: 'Working value: _RANK_VAL'
  derivation:
    case:
    - when: _IS_UNDER = 'Y'
      then: abs(_U_AVAL)
    - otherwise: ALBTRVAL
- name: _ANL01_RANK
  type: int
  label: 'Working value: _ANL01_RANK'
  derivation:
    rank:
      method: competition
      window:
        group_by:
        - USUBJID
        - PARAMCD
        order_by:
        - variable: _RANK_VAL
          direction: desc
          nulls: last
        - variable: _RANK_AVISITN
          direction: asc
          nulls: last
        - variable: _ADT_DATE
          direction: asc
          nulls: last
        - variable: LBSEQ
          direction: asc
          nulls: last
        filter: _RANK_AVISITN >= 2 AND _RANK_AVISITN <= 24
- name: AVISIT
  type: str
  label: Analysis Visit
  submission:
    key_sequence: 3
    mandatory: false
    data_type: text
    length: 16
    codelist: AVISIT
    origins:
    - type: Derived
    comment: Analysis Visit
- name: AVISITN
  type: float
  label: Analysis Visit (N)
  submission:
    mandatory: false
    data_type: integer
    length: 8
    codelist: AVISITN
    origins:
    - type: Derived
    comment: Numeric code for AVISIT
- name: ADY
  type: float
