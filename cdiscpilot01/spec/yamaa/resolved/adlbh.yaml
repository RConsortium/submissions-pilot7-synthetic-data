  submission:
    mandatory: false
    data_type: text
    length: 1
    codelist: SEX
    origins:
    - type: Derived
    comment: ADSL.SEX
- name: COMP24FL
  type: str
  label: Completers of Week 24 Population Flag
  derivation: ADSL_SBJ.COMP24FL
  submission:
    mandatory: false
    data_type: text
    length: 1
