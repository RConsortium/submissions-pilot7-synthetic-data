yamaa: '1.0'
type: spec
model: ADaM
domain: ADLBH
keys:
- STUDYID
- USUBJID
- PARAMCD
- LBSEQ
- AVISIT
input:
  LB:
    path: ../../../data/sdtm/lb.parquet
    relative_to: declaring
    empty_string: present
    key:
    - STUDYID
    - USUBJID
  ADSL:
    path: ../../../data/adam/adsl-yamaa.parquet
    relative_to: declaring
    schema: adsl.yaml
    empty_string: present
base: LB
output:
  path: ../../../data/adam/adlbh-yamaa.parquet
  relative_to: declaring
  columns:
  - STUDYID
  - SUBJID
  - USUBJID
  - TRTP
  - TRTPN
  - TRTA
  - TRTAN
  - TRTSDT
  - TRTEDT
  - AGE
  - AGEGR1
  - AGEGR1N
  - RACE
  - RACEN
  - SEX
  - COMP24FL
  - DSRAEFL
  - SAFFL
  - AVISIT
  - AVISITN
  - ADY
  - ADT
  - VISIT
  - VISITNUM
  - PARAM
  - PARAMCD
  - PARAMN
  - PARCAT1
  - AVAL
  - BASE
  - CHG
  - A1LO
  - A1HI
  - R2A1LO
  - R2A1HI
  - BR2A1LO
  - BR2A1HI
  - ANL01FL
  - ALBTRVAL
  - ANRIND
  - BNRIND
  - ABLFL
  - AENTMTFL
  - LBSEQ
  - LBNRIND
  - LBSTRESN
  order_by:
  - variable: USUBJID
    direction: asc
    nulls: last
  - variable: ADY
    direction: asc
    nulls: last
  - variable: PARAMN
    direction: asc
    nulls: last
  - variable: AVISITN
    direction: asc
    nulls: last
intermediates:
- id: ADSL_SBJ
  dataset: ADSL
  key:
  - USUBJID
- id: PREV
  dataset: LB
  key:
    USUBJID: USUBJID
    LBTESTCD: _LBTESTCD
    LBSEQ: LBSEQ
  filter: LB.LBCAT = 'HEMATOLOGY' AND LB.VISIT NOT IN ('AMBUL ECG REMOVAL', 'BASELINE',
    'RETRIEVAL') AND LB.VISIT NOT LIKE 'UNSCHEDULED%'
  columns:
  - PREV_AVAL
  derivations:
    _AVISITN:
      case:
      - when: LB.VISIT = 'SCREENING 1'
        then: 0.0
      - when: LB.VISIT = 'WEEK 2'
        then: 2.0
      - when: LB.VISIT = 'WEEK 4'
        then: 4.0
      - when: LB.VISIT = 'WEEK 6'
        then: 6.0
      - when: LB.VISIT = 'WEEK 8'
        then: 8.0
      - when: LB.VISIT = 'WEEK 12'
        then: 12.0
      - when: LB.VISIT = 'WEEK 16'
        then: 16.0
      - when: LB.VISIT = 'WEEK 20'
        then: 20.0
      - when: LB.VISIT = 'WEEK 24'
        then: 24.0
      - when: LB.VISIT = 'WEEK 26'
        then: 26.0
      - otherwise: null
    PREV_AVAL:
      row_value:
        source: LB.LBSTRESN
        offset: -1
        window:
          group_by:
          - LB.USUBJID
          - LB.LBTESTCD
          order_by:
          - variable: _AVISITN
            direction: asc
            nulls: last
          - variable: LB.LBDTC
            direction: asc
            nulls: last
          - variable: LB.LBSEQ
            direction: asc
            nulls: last
          filter: LB.LBCAT = 'HEMATOLOGY' AND LB.VISIT NOT IN ('AMBUL ECG REMOVAL',
            'BASELINE', 'RETRIEVAL') AND LB.VISIT NOT LIKE 'UNSCHEDULED%'
columns:
- name: STUDYID
  type: str
  label: Study Identifier
  submission:
    mandatory: false
    data_type: text
    length: 12
    origins:
    - type: Derived
    comment: ADSL.STUDYID
- name: SUBJID
  type: str
  label: Subject Identifier for the Study
  derivation: ADSL_SBJ.SUBJID
  submission:
    mandatory: false
    data_type: text
    length: 4
    origins:
    - type: Derived
    comment: ADSL.SUBJID
- name: USUBJID
  type: str
  label: Unique Subject Identifier
  submission:
    key_sequence: 1
    mandatory: false
    data_type: text
    length: 11
    origins:
    - type: Derived
    comment: ADSL.USUBJID
- name: TRTP
  type: str
  label: Planned Treatment
  derivation: ADSL_SBJ.TRT01P
  submission:
    mandatory: false
    data_type: text
    length: 20
    codelist: ARM
    origins:
    - type: Derived
    comment: ADSL.TRT01P
- name: TRTPN
  type: float
  label: Planned Treatment (N)
  derivation: ADSL_SBJ.TRT01PN
  submission:
    mandatory: false
    data_type: integer
