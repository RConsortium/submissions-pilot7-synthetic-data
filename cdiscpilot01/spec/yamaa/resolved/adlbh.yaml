- name: AENTMTFL
  type: str
  label: Last value in treatment visit
  derivation:
    case:
    - when: _IS_EOT = 'Y'
      then: '''Y'''
    - when: _IS_LAST_ELIGIBLE = 1
      then: '''Y'''
    - otherwise: ''''''
  submission:
    mandatory: false
    data_type: text
    length: 1
    codelist: Y_BLANK
    origins:
    - type: Derived
    comment: 'Last observed value for this lab test during treatment phase: ''Y''
