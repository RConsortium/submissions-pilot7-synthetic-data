- id: natural
  dataset: QS
  filter: QS.QSTESTCD IN ('NPITM01S','NPITM02S','NPITM03S','NPITM04S','NPITM05S','NPITM06S','NPITM07S','NPITM08S','NPITM09S','NPITM10S','NPITM11S','NPITM12S','NPTOT')
  derivations:
    STUDYID: QS.STUDYID
    USUBJID: QS.USUBJID
    QSTESTCD: QS.QSTESTCD
    QSSEQ: QS.QSSEQ
    _WINDOW:
      case:
      - when: QS.QSDY <= 1
        then: 0
      - when: QS.QSDY <= 21
        then: 1
      - when: QS.QSDY <= 35
        then: 2
      - when: QS.QSDY <= 49
        then: 3
      - when: QS.QSDY <= 63
        then: 4
      - when: QS.QSDY <= 77
        then: 5
      - when: QS.QSDY <= 91
        then: 6
      - when: QS.QSDY <= 105
        then: 7
      - when: QS.QSDY <= 119
        then: 8
      - when: QS.QSDY <= 133
        then: 9
      - when: QS.QSDY <= 147
        then: 10
      - when: QS.QSDY <= 161
        then: 11
      - when: QS.QSDY <= 175
        then: 12
      - otherwise: 13
    _TARGET:
      case:
      - when: _WINDOW = 0
        then: 1.0
      - when: _WINDOW = 1
        then: 14.0
      - when: _WINDOW = 2
        then: 28.0
      - when: _WINDOW = 3
        then: 42.0
      - when: _WINDOW = 4
