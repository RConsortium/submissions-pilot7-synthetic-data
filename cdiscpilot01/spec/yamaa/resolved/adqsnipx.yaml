yamaa: '1.0'
type: spec
model: ADaM
domain: ADQSNPIX
keys:
- STUDYID
- USUBJID
- PARAMCD
- AVISITN
- ANL01FL
- VISIT
input:
  QS:
    path: ../../../data/sdtm/qs.parquet
    relative_to: declaring
    empty_string: present
    key:
    - STUDYID
    - USUBJID
  ADSL:
    path: ../../../data/adam/adsl-yamaa.parquet
    relative_to: declaring
    schema: adsl.yaml
    empty_string: present
base: QS
output:
  path: ../../../data/adam/adqsnipx-yamaa.parquet
  relative_to: declaring
  columns:
  - STUDYID
  - SITEID
  - SITEGR1
  - USUBJID
  - TRTSDT
  - TRTEDT
  - TRTP
  - TRTPN
  - AGE
  - AGEGR1
  - AGEGR1N
  - RACE
  - RACEN
  - SEX
  - ITTFL
  - EFFFL
  - COMP24FL
  - AVISIT
  - AVISITN
  - ADY
  - ADT
  - VISITNUM
  - VISIT
  - PARAM
  - PARAMCD
  - PARAMN
  - PARAMTYP
  - AVAL
  - BASE
  - CHG
  - PCHG
  - ABLFL
  - ANL01FL
  - DTYPE
  - AWRANGE
  - AWTARGET
  - AWTDIFF
  - AWLO
  - AWHI
  - AWU
  - QSSEQ
  order_by:
  - variable: USUBJID
    direction: asc
    nulls: last
  - variable: PARAMN
    direction: asc
    nulls: last
  - variable: AVISITN
    direction: asc
    nulls: last
  - variable: ANL01FL
    direction: desc
    nulls: last
  - variable: QSSEQ
    direction: asc
    nulls: last
intermediates:
- id: ADSL_LKP
  dataset: ADSL
  key:
  - USUBJID
  order_by:
  - variable: ADSL.USUBJID
    direction: asc
    nulls: last
  keep: first
- id: BASE_LKP
  dataset: SELF
  key:
  - USUBJID
  filter: QSTESTCD = 'NPTOT' AND _ABLFL = 'Y'
  order_by:
  - variable: QSSEQ
    direction: asc
    nulls: last
  keep: first
- id: BASE_PARAM
  dataset: SELF
  key:
  - USUBJID
  - QSTESTCD
  filter: _ABLFL = 'Y'
  order_by:
  - variable: QSSEQ
    direction: asc
    nulls: last
  keep: first
- id: W3_LKP
  dataset: SELF
  key:
  - USUBJID
  filter: QSTESTCD = 'NPTOT' AND _IS_SEL = 'Y' AND _WINDOW = 3
  order_by:
  - variable: QSSEQ
    direction: asc
    nulls: last
  keep: first
- id: W4_LKP
  dataset: SELF
  key:
  - USUBJID
  filter: QSTESTCD = 'NPTOT' AND _IS_SEL = 'Y' AND _WINDOW = 4
  order_by:
  - variable: QSSEQ
    direction: asc
    nulls: last
  keep: first
- id: W5_LKP
  dataset: SELF
  key:
  - USUBJID
  filter: QSTESTCD = 'NPTOT' AND _IS_SEL = 'Y' AND _WINDOW = 5
  order_by:
  - variable: QSSEQ
    direction: asc
    nulls: last
  keep: first
- id: W6_LKP
  dataset: SELF
  key:
  - USUBJID
  filter: QSTESTCD = 'NPTOT' AND _IS_SEL = 'Y' AND _WINDOW = 6
  order_by:
  - variable: QSSEQ
    direction: asc
    nulls: last
  keep: first
columns:
- name: QSTESTCD
  type: str
  label: 'Working value: QSTESTCD'
- name: _W
  type: float
  label: 'Working value: _W'
- name: _WINDOW
  type: int
  label: 'Working value: _WINDOW'
- name: _TARGET
  type: float
  label: 'Working value: _TARGET'
- name: _DIFF
  type: float
  label: 'Working value: _DIFF'
- name: _RANK
  type: int
  label: 'Working value: _RANK'
- name: _IS_SEL
  type: str
  label: 'Working value: _IS_SEL'
- name: _AVISIT
  type: str
  label: 'Working value: _AVISIT'
- name: _AVISITN
  type: float
  label: 'Working value: _AVISITN'
- name: _AWRANGE
  type: str
  label: 'Working value: _AWRANGE'
- name: _AWTARGET
  type: float
  label: 'Working value: _AWTARGET'
- name: _AWLO
  type: float
  label: 'Working value: _AWLO'
- name: _AWHI
  type: float
  label: 'Working value: _AWHI'
- name: _AVAL
  type: float
  label: 'Working value: _AVAL'
- name: _ABLFL
  type: str
  label: 'Working value: _ABLFL'
- name: _AWTDIFF
  type: float
  label: 'Working value: _AWTDIFF'
- name: _W3N
  type: int
  label: 'Working value: _W3N'
- name: _W4N
  type: int
  label: 'Working value: _W4N'
- name: _W5N
  type: int
  label: 'Working value: _W5N'
- name: _W6N
  type: int
  label: 'Working value: _W6N'
- name: _CNT
  type: int
  label: 'Working value: _CNT'
- name: _W3Z
  type: float
  label: _W3Z (helper)
  derivation: null
- name: _W4Z
  type: float
  label: _W4Z (helper)
  derivation: null
- name: _W5Z
  type: float
  label: _W5Z (helper)
  derivation: null
- name: _W6Z
  type: float
  label: _W6Z (helper)
  derivation: null
- name: _MEAN
  type: float
  label: 'Working value: _MEAN'
- name: STUDYID
  type: str
  label: Study Identifier
  submission:
    mandatory: false
    data_type: text
    length: 12
    origins:
    - type: Derived
    comment: ADSL.STUDYID
- name: SITEID
  type: str
  label: Study Site Identifier
  derivation: ADSL_LKP.SITEID
  submission:
    mandatory: false
    data_type: text
    length: 3
    origins:
    - type: Derived
    comment: ADSL.SITEID
- name: SITEGR1
  type: str
  label: Pooled Site Group 1
  derivation: ADSL_LKP.SITEGR1
  submission:
    mandatory: false
    data_type: text
    length: 3
    origins:
    - type: Derived
    comment: ADSL.SITEGR1
- name: USUBJID
  type: str
  label: Unique Subject Identifier
  submission:
    key_sequence: 1
    mandatory: false
    data_type: text
    length: 11
    origins:
    - type: Derived
    comment: ADSL.USUBJID
- name: TRTSDT
  type: date
  label: Date of First Exposure to Treatment
  derivation: ADSL_LKP.TRTSDT
  submission:
    mandatory: false
    data_type: integer
    length: 8
    display_format: DATE9.
    origins:
    - type: Derived
    comment: ADSL.TRTSDT
- name: TRTEDT
  type: date
  label: Date of Last Exposure to Treatment
  derivation: ADSL_LKP.TRTEDT
  submission:
    mandatory: false
    data_type: integer
    length: 8
    display_format: DATE9.
    origins:
    - type: Derived
    comment: ADSL.TRTEDT
- name: TRTP
  type: str
  label: Planned Treatment
  derivation: ADSL_LKP.TRT01P
  submission:
    mandatory: false
    data_type: text
    length: 20
    codelist: ARM
    origins:
    - type: Derived
    comment: ADSL.TRT01P
- name: TRTPN
  type: float
  label: Planned Treatment (N)
  derivation: ADSL_LKP.TRT01PN
  submission:
    mandatory: false
    data_type: integer
    length: 8
    codelist: ARMN
    origins:
    - type: Derived
    comment: ADSL.TRT01PN
- name: AGE
  type: float
  label: Age
  derivation: ADSL_LKP.AGE
  submission:
    mandatory: false
    data_type: integer
    length: 8
    origins:
    - type: Derived
    comment: ADSL.AGE
- name: AGEGR1
  type: str
  label: Pooled Age Group 1
  derivation: ADSL_LKP.AGEGR1
  submission:
    mandatory: false
    data_type: text
    length: 5
    codelist: AGEGR1
    origins:
    - type: Derived
    comment: ADSL.AGEGR1
- name: AGEGR1N
  type: float
  label: Pooled Age Group 1 (N)
  derivation: ADSL_LKP.AGEGR1N
  submission:
    mandatory: false
    data_type: integer
    length: 8
    codelist: AGEGR1N
    origins:
    - type: Derived
    comment: ADSL.AGEGR1N
- name: RACE
  type: str
  label: Race
  derivation: ADSL_LKP.RACE
  submission:
    mandatory: false
    data_type: text
    length: 32
    codelist: RACE
    origins:
    - type: Derived
    comment: ADSL.RACE
- name: RACEN
  type: float
  label: Race (N)
  derivation: ADSL_LKP.RACEN
  submission:
    mandatory: false
    data_type: integer
    length: 8
    codelist: RACEN
    origins:
    - type: Derived
    comment: ADSL.RACEN
- name: SEX
  type: str
  label: Sex
  derivation: ADSL_LKP.SEX
  submission:
    mandatory: false
    data_type: text
    length: 1
    codelist: SEX
    origins:
    - type: Derived
    comment: ADSL.SEX
- name: ITTFL
  type: str
  label: Intent-to-Treat Population Flag
  derivation: ADSL_LKP.ITTFL
  submission:
    mandatory: false
    data_type: text
    length: 1
    codelist: YN
    origins:
    - type: Derived
    comment: ADSL.ITTFL
- name: EFFFL
  type: str
  label: Efficacy Population Flag
  derivation: ADSL_LKP.EFFFL
  submission:
    mandatory: false
    data_type: text
    length: 1
    codelist: YN
    origins:
    - type: Derived
    comment: ADSL.FASFL
- name: COMP24FL
  type: str
  label: Completers of Week 24 Population Flag
  derivation: ADSL_LKP.COMP24FL
  submission:
    mandatory: false
    data_type: text
    length: 1
    codelist: YN
    origins:
    - type: Derived
    comment: ADSL.COMP24FL
- name: AVISIT
  type: str
  label: Analysis Visit
  derivation: _AVISIT
  submission:
    key_sequence: 3
    mandatory: false
    data_type: text
    length: 16
    codelist: AVISIT
    origins:
    - type: Derived
    comment: Character version of the visit.
- name: AVISITN
  type: float
  label: Analysis Visit (N)
  derivation: _AVISITN
  submission:
    mandatory: false
    data_type: integer
    length: 8
    codelist: AVISITN
    origins:
    - type: Derived
    comment: Using window method in SAP Page 10 to determine AVISITN value based on
      ADY.
- name: ADY
  type: float
  label: Analysis Relative Day
  submission:
    mandatory: false
    data_type: integer
    length: 8
    origins:
    - type: Derived
    comment: ADY = ADT - TRTSDT + 1, if ADT>=TRTSDT. ADY = ADT - TRTSDT, if ADT<TRTSDT.
- name: ADT
  type: date
  label: Analysis Date
  submission:
    key_sequence: 4
    mandatory: false
    data_type: integer
    length: 8
    display_format: DATE9.
    origins:
    - type: Derived
    comment: SAS date from QS.QSDTC
- name: VISITNUM
  type: float
  label: Visit Number
  submission:
    mandatory: false
    data_type: float
    length: 8
    significant_digits: 1
    codelist: VISITNUM
    origins:
    - type: Derived
    comment: QS.VISITNUM
- name: VISIT
  type: str
  label: Visit Name
  submission:
    mandatory: false
    data_type: text
    length: 19
    codelist: VISIT
    origins:
    - type: Derived
    comment: QS.VISIT
- name: PARAM
  type: str
  label: Parameter
  submission:
    mandatory: false
    data_type: text
    length: 100
    codelist: PARAM_ADQSNPIX
    origins:
    - type: Derived
- name: PARAMCD
  type: str
  label: Parameter Code
  submission:
    key_sequence: 2
    mandatory: false
    data_type: text
    length: 8
    codelist: PARAMCD_ADQSNPIX
    origins:
    - type: Derived
- name: PARAMN
  type: float
  label: Parameter (N)
  submission:
    mandatory: false
    data_type: integer
    length: 8
    codelist: PARAMN_ADQSNPIX
    origins:
    - type: Derived
    comment: Assign a numeric code for each value of PARAMCD (see codelist PRMNNPIX)
- name: PARAMTYP
  type: str
  label: Parameter Type
  submission:
    mandatory: false
    data_type: text
    length: 7
    codelist: PARAMTYP
    origins:
    - type: Derived
    value_level:
    - id: NPITM01S
      where:
        PARAMCD:
        - NPITM01S
      label: NPI-X Item A (Delusion) Score
      mandatory: false
      data_type: text
      length: 15
      codelist: PARAMTYP
      origins:
      - type: Derived
      comment: Set PARAMTYP to missing.
    - id: NPITM02S
      where:
        PARAMCD:
        - NPITM02S
      label: NPI-X Item B (Hallucination) Score
      mandatory: false
      data_type: text
      length: 15
      codelist: PARAMTYP
      origins:
      - type: Derived
      comment: Set PARAMTYP to missing.
    - id: NPITM03S
      where:
        PARAMCD:
        - NPITM03S
      label: NPI-X Item C (Agitation/Agression) Score
      mandatory: false
      data_type: text
      length: 15
      codelist: PARAMTYP
      origins:
      - type: Derived
      comment: Set PARAMTYP to missing.
    - id: NPITM04S
      where:
        PARAMCD:
        - NPITM04S
      label: NPI-X Item D (Depression/Dysphoria) Score
      mandatory: false
      data_type: text
      length: 15
      codelist: PARAMTYP
      origins:
      - type: Derived
      comment: Set PARAMTYP to missing.
    - id: NPITM05S
      where:
        PARAMCD:
        - NPITM05S
      label: NPI-X Item E (Anxiety) Score
      mandatory: false
      data_type: text
      length: 15
      codelist: PARAMTYP
      origins:
      - type: Derived
      comment: Set PARAMTYP to missing.
    - id: NPITM06S
      where:
        PARAMCD:
        - NPITM06S
      label: NPI-X Item F (Eupohoria/Elation) Score
      mandatory: false
      data_type: text
      length: 15
      codelist: PARAMTYP
      origins:
      - type: Derived
      comment: Set PARAMTYP to missing.
    - id: NPITM07S
      where:
        PARAMCD:
        - NPITM07S
      label: NPI-X Item G (Apathy/Indifference) Score
      mandatory: false
      data_type: text
      length: 15
      codelist: PARAMTYP
      origins:
      - type: Derived
      comment: Set PARAMTYP to missing.
    - id: NPITM08S
      where:
        PARAMCD:
        - NPITM08S
      label: NPI-X Item H (Disinhibition) Score
      mandatory: false
      data_type: text
      length: 15
      codelist: PARAMTYP
      origins:
      - type: Derived
      comment: Set PARAMTYP to missing.
    - id: NPITM09S
      where:
        PARAMCD:
        - NPITM09S
      label: NPI-X Item I (Irritability/Lability) Score
      mandatory: false
      data_type: text
      length: 15
      codelist: PARAMTYP
      origins:
      - type: Derived
      comment: Set PARAMTYP to missing.
    - id: NPITM10S
      where:
        PARAMCD:
        - NPITM10S
      label: NPI-X Item J (Aberrant Motor Behavior) Score
      mandatory: false
      data_type: text
      length: 15
      codelist: PARAMTYP
      origins:
      - type: Derived
      comment: Set PARAMTYP to missing.
    - id: NPITM11S
      where:
        PARAMCD:
        - NPITM11S
      label: NPI-X Item K (Night-time Behavior) Score
      mandatory: false
      data_type: text
      length: 15
      codelist: PARAMTYP
      origins:
      - type: Derived
      comment: Set PARAMTYP to missing.
    - id: NPITM12S
      where:
        PARAMCD:
        - NPITM12S
      label: NPI-X Item L (Appetite/Eating Change) Score
      mandatory: false
      data_type: text
      length: 15
      codelist: PARAMTYP
      origins:
      - type: Derived
      comment: Set PARAMTYP to missing.
    - id: NPTOT
      where:
        PARAMCD:
        - NPTOT
      label: NPI-X (9) Total Score
      mandatory: false
      data_type: text
      length: 15
      codelist: PARAMTYP
      origins:
      - type: Derived
      comment: Set PARAMTYP to missing.
    - id: NPTOTMN
      where:
        PARAMCD:
        - NPTOTMN
      label: Mean NPI-X (9) Total (Week 4 to 24)
      mandatory: false
      data_type: text
      length: 15
      codelist: PARAMTYP
      origins:
      - type: Derived
      comment: Set PARAMTYP to DERIVED.
- name: AVAL
  type: float
  label: Analysis Value
  derivation: _AVAL
  submission:
    mandatory: false
    data_type: integer
    length: 8
    origins:
    - type: Derived
    value_level:
    - id: NPITM01S
      where:
        PARAMCD:
        - NPITM01S
      label: NPI-X Item A (Delusion) Score
      mandatory: false
      data_type: integer
      length: 8
      origins:
      - type: Derived
      comment: QS.QSSTRESN where QSTESTCD = given PARAMCD
    - id: NPITM02S
      where:
        PARAMCD:
        - NPITM02S
      label: NPI-X Item B (Hallucination) Score
      mandatory: false
      data_type: integer
      length: 8
      origins:
      - type: Derived
      comment: QS.QSSTRESN where QSTESTCD = given PARAMCD
    - id: NPITM03S
      where:
        PARAMCD:
        - NPITM03S
      label: NPI-X Item C (Agitation/Agression) Score
      mandatory: false
      data_type: integer
      length: 8
      origins:
      - type: Derived
      comment: QS.QSSTRESN where QSTESTCD = given PARAMCD
    - id: NPITM04S
      where:
        PARAMCD:
        - NPITM04S
      label: NPI-X Item D (Depression/Dysphoria) Score
      mandatory: false
      data_type: integer
      length: 8
      origins:
      - type: Derived
      comment: QS.QSSTRESN where QSTESTCD = given PARAMCD
    - id: NPITM05S
      where:
        PARAMCD:
        - NPITM05S
      label: NPI-X Item E (Anxiety) Score
      mandatory: false
      data_type: integer
      length: 8
      origins:
      - type: Derived
      comment: QS.QSSTRESN where QSTESTCD = given PARAMCD
    - id: NPITM06S
      where:
        PARAMCD:
        - NPITM06S
      label: NPI-X Item F (Eupohoria/Elation) Score
      mandatory: false
      data_type: integer
      length: 8
      origins:
      - type: Derived
      comment: QS.QSSTRESN where QSTESTCD = given PARAMCD
    - id: NPITM07S
      where:
        PARAMCD:
        - NPITM07S
      label: NPI-X Item G (Apathy/Indifference) Score
      mandatory: false
      data_type: integer
      length: 8
      origins:
      - type: Derived
      comment: QS.QSSTRESN where QSTESTCD = given PARAMCD
    - id: NPITM08S
      where:
        PARAMCD:
        - NPITM08S
      label: NPI-X Item H (Disinhibition) Score
      mandatory: false
      data_type: integer
      length: 8
      origins:
      - type: Derived
      comment: QS.QSSTRESN where QSTESTCD = given PARAMCD
    - id: NPITM09S
      where:
        PARAMCD:
        - NPITM09S
      label: NPI-X Item I (Irritability/Lability) Score
      mandatory: false
      data_type: integer
      length: 8
      origins:
      - type: Derived
      comment: QS.QSSTRESN where QSTESTCD = given PARAMCD
    - id: NPITM10S
      where:
        PARAMCD:
        - NPITM10S
      label: NPI-X Item J (Aberrant Motor Behavior) Score
      mandatory: false
      data_type: integer
      length: 8
      origins:
      - type: Derived
      comment: QS.QSSTRESN where QSTESTCD = given PARAMCD
    - id: NPITM11S
      where:
        PARAMCD:
        - NPITM11S
      label: NPI-X Item K (Night-time Behavior) Score
      mandatory: false
      data_type: integer
      length: 8
      origins:
      - type: Derived
      comment: QS.QSSTRESN where QSTESTCD = given PARAMCD
    - id: NPITM12S
      where:
        PARAMCD:
        - NPITM12S
      label: NPI-X Item L (Appetite/Eating Change) Score
      mandatory: false
      data_type: integer
      length: 8
      origins:
      - type: Derived
      comment: QS.QSSTRESN where QSTESTCD = given PARAMCD
    - id: NPTOT
      where:
        PARAMCD:
        - NPTOT
      label: NPI-X (9) Total Score
      mandatory: false
      data_type: integer
      length: 8
      origins:
      - type: Derived
      comment: QS.QSSTRESN where QSTESTCD = given PARAMCD
    - id: NPTOTMN
      where:
        PARAMCD:
        - NPTOTMN
      label: Mean NPI-X (9) Total (Week 4 to 24)
      mandatory: false
      data_type: integer
      length: 8
      origins:
      - type: Derived
      comment: take the mean of AVAL when PARAMCD=NPTOT from week 4 to 24.
- name: BASE
  type: float
  label: Baseline Value
  derivation: BASE_PARAM._AVAL
  submission:
    mandatory: false
    data_type: integer
    length: 8
    origins:
    - type: Derived
    value_level:
    - id: NPITM01S
      where:
        PARAMCD:
        - NPITM01S
      label: NPI-X Item A (Delusion) Score
      mandatory: false
      data_type: integer
      length: 8
      origins:
      - type: Derived
      comment: QS.QSSTRESN when QS.QSBLFL=Y.
    - id: NPITM02S
      where:
        PARAMCD:
        - NPITM02S
      label: NPI-X Item B (Hallucination) Score
      mandatory: false
      data_type: integer
      length: 8
      origins:
      - type: Derived
      comment: QS.QSSTRESN when QS.QSBLFL=Y.
    - id: NPITM03S
      where:
        PARAMCD:
        - NPITM03S
      label: NPI-X Item C (Agitation/Agression) Score
      mandatory: false
      data_type: integer
      length: 8
      origins:
      - type: Derived
      comment: QS.QSSTRESN when QS.QSBLFL=Y.
    - id: NPITM04S
      where:
        PARAMCD:
        - NPITM04S
      label: NPI-X Item D (Depression/Dysphoria) Score
      mandatory: false
      data_type: integer
      length: 8
      origins:
      - type: Derived
      comment: QS.QSSTRESN when QS.QSBLFL=Y.
    - id: NPITM05S
