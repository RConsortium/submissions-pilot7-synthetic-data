      - when: _WINDOW = 9
        then: 126.0
      - when: _WINDOW = 10
        then: 140.0
      - when: _WINDOW = 11
        then: 154.0
      - when: _WINDOW = 12
        then: 168.0
      - otherwise: 182.0
    _DIFF: abs(QS.QSDY - _TARGET)
    _RANK:
      rank:
        method: dense
        window:
          group_by:
          - USUBJID
          - QSTESTCD
          - _WINDOW
          order_by:
          - variable: _DIFF
            direction: asc
            nulls: last
          - variable: QS.QSDY
            direction: asc
            nulls: last
          - variable: QSSEQ
            direction: asc
            nulls: last
    _IS_SEL:
