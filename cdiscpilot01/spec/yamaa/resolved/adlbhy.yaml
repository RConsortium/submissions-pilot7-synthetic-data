rows:
- id: base
  dataset: ADLBC
  filter: ADLBC.PARAMCD IN ('ALT', 'AST', 'BILI') AND ADLBC.AVISITN IN (0.0, 2.0,
    4.0, 6.0, 8.0, 12.0, 16.0, 20.0, 24.0)
  derivations:
    USUBJID: ADLBC.USUBJID
    AVISIT: ADLBC.AVISIT
    AVISITN: ADLBC.AVISITN
    ADY: ADLBC.ADY
    ADT: ADLBC.ADT
    VISIT: ADLBC.VISIT
    VISITNUM: ADLBC.VISITNUM
    PARAM: ADLBC.PARAM
    PARAMCD: ADLBC.PARAMCD
    PARAMN: _PARAMN_OUT
    PARAMTYP: ''''''
    PARCAT1: '''CHEM'''
    AVAL: ADLBC.AVAL
    BASE: ADLBC.BASE
    A1LO: ADLBC.A1LO
    A1HI: ADLBC.A1HI
    R2A1LO: ADLBC.R2A1LO
    R2A1HI: ADLBC.R2A1HI
    BR2A1LO: ADLBC.BR2A1LO
    BR2A1HI: ADLBC.BR2A1HI
    ABLFL: ADLBC.ABLFL
    SHIFT1: ''''''
    SHIFT1N: null
    CRIT1: '''R2A1HI > 1.5'''
    CRIT1FL: _CRIT1FL
    CRIT1FN: _CRIT1FN
    _PARAMN_OUT:
      mapping:
        source: ADLBC.PARAMCD
        dict:
          ALT: 1.0
          AST: 2.0
          BILI: 3.0
        case_sensitive: true
        unmapped: null
    _CRIT1FL:
      case:
      - when: ADLBC.R2A1HI IS NULL
        then: ''''''
      - when: ADLBC.R2A1HI > 1.5
        then: '''Y'''
      - otherwise: '''N'''
    _CRIT1FN:
      case:
      - when: ADLBC.R2A1HI IS NULL
        then: null
      - when: ADLBC.R2A1HI > 1.5
        then: 1.0
      - otherwise: 0.0
    _HAS_P: null
    _BILI_R: null
    _ALT_R: null
    _AST_R: null
    _MAX_R: null
    _AVAL: null
    _BASE_ALT_R: null
    _BASE_AST_R: null
    _BASE_BILI_R: null
    _BASE_MAX_R: null
    _BASE_D: null
    _BASE_BILI: null
    _BASE_TRANS: null
    _AVAL_BILI: null
    _AVAL_TRANS: null
    _HAS_BL: null
    _BASE: null
    _SHIFT1: null
    _SHIFT1N: null
- id: bilihy
  dataset: ADLBC
  group_by:
  - ADLBC.USUBJID
  - ADLBC.AVISIT
  - ADLBC.AVISITN
  filter: AVISITN IS NOT NULL AND AVISITN IN (0.0, 2.0, 4.0, 6.0, 8.0, 12.0, 16.0,
    20.0, 24.0) AND _HAS_P > 0
  derivations:
    _HAS_P:
      aggregate:
        filter: ADLBC.PARAMCD IN ('ALT', 'AST', 'BILI') AND ADLBC.AVISITN IS NOT NULL
        expr: COUNT(ADLBC.*)
    USUBJID: ADLBC.USUBJID
    AVISIT: ADLBC.AVISIT
    AVISITN: ADLBC.AVISITN
    ADY: null
    ADT: null
    VISIT: ''''''
    VISITNUM: null
    PARAM: '''Bilirubin 1.5 x ULN'''
    PARAMCD: '''BILIHY'''
    PARAMN: 4.0
    PARAMTYP: '''DERIVED'''
    PARCAT1: '''HYLAW'''
    AVAL: _AVAL
    BASE: _BASE
    A1LO: null
    A1HI: null
    R2A1LO: null
    R2A1HI: null
    BR2A1LO: null
    BR2A1HI: null
    ABLFL:
      case:
      - when: AVISITN = 0
        then: '''Y'''
      - otherwise: ''''''
    SHIFT1: _SHIFT1
    SHIFT1N: _SHIFT1N
    CRIT1: ''''''
    CRIT1FL: ''''''
    CRIT1FN: null
    _PARAMN_OUT: null
    _CRIT1FL: null
    _CRIT1FN: null
    _BILI_R:
      aggregate:
        filter: ADLBC.PARAMCD = 'BILI' AND ADLBC.AVISITN IS NOT NULL
        expr: ONLY(ADLBC.R2A1HI)
    _ALT_R: null
    _AST_R: null
    _MAX_R: null
    _AVAL:
      case:
      - when: _BILI_R IS NULL
        then: null
      - when: _BILI_R > 1.5
        then: 1.0
      - otherwise: 0.0
    _BASE_ALT_R: null
    _BASE_AST_R: null
    _BASE_BILI_R: BL_BILI.R2A1HI
    _BASE_MAX_R: null
    _BASE_D:
      case:
      - when: _BASE_BILI_R IS NULL
        then: null
      - when: _BASE_BILI_R > 1.5
        then: 1.0
      - otherwise: 0.0
    _BASE_BILI: null
    _BASE_TRANS: null
    _AVAL_BILI: null
    _AVAL_TRANS: null
    _HAS_BL: null
    _BASE:
      case:
      - when: _AVAL IS NULL
        then: null
      - otherwise: _BASE_D
    _SHIFT1:
      case:
      - when: _BASE IS NULL OR _AVAL IS NULL
        then: ''''''
      - when: _BASE = 0 AND _AVAL = 0
        then: '''Normal to Normal'''
      - when: _BASE = 0 AND _AVAL = 1
        then: '''Normal to High'''
      - when: _BASE = 1 AND _AVAL = 0
        then: '''High to Normal'''
      - otherwise: ''''''
    _SHIFT1N:
      case:
      - when: _BASE IS NULL OR _AVAL IS NULL
        then: null
      - when: _BASE = 0 AND _AVAL = 0
        then: 1.0
      - when: _BASE = 0 AND _AVAL = 1
        then: 2.0
      - when: _BASE = 1 AND _AVAL = 0
        then: 0.0
      - otherwise: null
- id: transhy
  dataset: ADLBC
  group_by:
  - ADLBC.USUBJID
  - ADLBC.AVISIT
  - ADLBC.AVISITN
  filter: AVISITN IS NOT NULL AND AVISITN IN (0.0, 2.0, 4.0, 6.0, 8.0, 12.0, 16.0,
    20.0, 24.0) AND _HAS_P > 0
  derivations:
    _HAS_P:
      aggregate:
        filter: ADLBC.PARAMCD IN ('ALT', 'AST', 'BILI') AND ADLBC.AVISITN IS NOT NULL
        expr: COUNT(ADLBC.*)
    USUBJID: ADLBC.USUBJID
    AVISIT: ADLBC.AVISIT
    AVISITN: ADLBC.AVISITN
    ADY: null
    ADT: null
    VISIT: ''''''
    VISITNUM: null
    PARAM: '''Transaminase 1.5 x ULN'''
    PARAMCD: '''TRANSHY'''
    PARAMN: 5.0
    PARAMTYP: '''DERIVED'''
    PARCAT1: '''HYLAW'''
    AVAL: _AVAL
    BASE: _BASE
    A1LO: null
    A1HI: null
