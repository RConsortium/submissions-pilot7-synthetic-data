      label: Aspartate Aminotransferase (U/L)
      mandatory: false
      data_type: integer
      length: 8
      origins:
      - type: Derived
      comment: ADLBC.AVAL
    - id: BILI
      where:
        PARAMCD:
        - BILI
      label: Bilirubin (umol/L)
      mandatory: false
      data_type: float
      length: 8
      significant_digits: 2
      display_format: '6.2'
      origins:
      - type: Derived
      comment: ADLBC.AVAL
    - id: BILIHY
      where:
        PARAMCD:
        - BILIHY
      label: Bilirubin 1.5 x ULN
      mandatory: false
      data_type: integer
      length: 8
      codelist: YNN
      origins:
      - type: Derived
      comment: for a given visit, if param='BILI' and r2a1hi > 1.5 then aval=1. otherwise
        if param='BILI' then aval=0
    - id: TRANSHY
      where:
        PARAMCD:
        - TRANSHY
      label: Transaminase 1.5 x ULN
      mandatory: false
      data_type: integer
      length: 8
      codelist: YNN
      origins:
      - type: Derived
      comment: for a given visit, if param='ALT' or 'AST' and if either r2a1hi > 1.5
        then aval=1. otherwise if param='ALT' or 'AST' then aval=0
    - id: HYLAW
      where:
        PARAMCD:
        - HYLAW
      label: Total Bili 1.5 x ULN and Transaminase 1.5 x ULN
      mandatory: false
      data_type: integer
      length: 8
      codelist: YNN
      origins:
      - type: Derived
      comment: for a given visit, if param='BILHY' or 'TRANSHY' and if both has aval=1
        then for this param then aval=1. otherwise if for a given visit, if param='BILHY'
        or 'TRANSHY' then aval=0.
