yamaa: '1.0'
type: spec
model: ADaM
domain: ADLBHY
keys:
- STUDYID
- USUBJID
- AVISITN
- PARAMN
input:
  ADLBC:
    path: ../../../data/adam/adlbc-yamaa.parquet
    relative_to: declaring
    schema: adlbc.yaml
    empty_string: present
    key:
    - STUDYID
    - USUBJID
base: ADLBC
output:
  path: ../../../data/adam/adlbhy-yamaa.parquet
  relative_to: declaring
  columns:
  - STUDYID
  - SUBJID
  - USUBJID
  - TRTP
  - TRTPN
  - TRTA
  - TRTAN
  - TRTSDT
  - TRTEDT
  - AGE
  - AGEGR1
  - AGEGR1N
  - RACE
  - RACEN
  - SEX
  - COMP24FL
  - DSRAEFL
  - SAFFL
  - AVISIT
  - AVISITN
  - ADY
  - ADT
  - VISIT
  - VISITNUM
  - PARAMTYP
  - PARAM
  - PARAMCD
  - PARAMN
  - PARCAT1
  - AVAL
  - BASE
  - A1LO
  - A1HI
  - R2A1LO
  - R2A1HI
  - BR2A1LO
  - BR2A1HI
  - ABLFL
  - SHIFT1
  - SHIFT1N
  - CRIT1
  - CRIT1FL
  - CRIT1FN
  order_by:
  - variable: USUBJID
    direction: asc
    nulls: last
  - variable: AVISITN
    direction: asc
    nulls: last
  - variable: PARAMN
    direction: asc
    nulls: last
intermediates:
- id: VINFO
  dataset: ADLBC
  key:
  - USUBJID
  - AVISIT
  - AVISITN
  filter: ADLBC.AVISITN IN (0.0, 2.0, 4.0, 6.0, 8.0, 12.0, 16.0, 20.0, 24.0)
  order_by:
  - variable: ADLBC.PARAMCD
    direction: asc
    nulls: last
  keep: first
- id: BL_BILI
  dataset: ADLBC
  key:
  - USUBJID
  filter: ADLBC.AVISITN = 0 AND ADLBC.PARAMCD = 'BILI'
- id: BL_ALT
  dataset: ADLBC
  key:
  - USUBJID
  filter: ADLBC.AVISITN = 0 AND ADLBC.PARAMCD = 'ALT'
- id: BL_AST
  dataset: ADLBC
  key:
  - USUBJID
  filter: ADLBC.AVISITN = 0 AND ADLBC.PARAMCD = 'AST'
- id: BL_ANY
  dataset: ADLBC
  key:
  - USUBJID
  filter: ADLBC.AVISITN = 0
  order_by:
  - variable: ADLBC.PARAMCD
    direction: asc
    nulls: last
  keep: first
columns:
- name: USUBJID
  type: str
  label: Unique Subject Identifier
  submission:
    key_sequence: 1
    mandatory: false
    data_type: text
    length: 11
    origins:
    - type: Derived
    comment: ADSL.USUBJID
- name: AVISIT
  type: str
  label: Analysis Visit
  submission:
    key_sequence: 3
    mandatory: false
    data_type: text
    length: 16
    codelist: AVISIT
    origins:
    - type: Derived
    comment: Analysis Visit
- name: AVISITN
  type: float
  label: Analysis Visit (N)
  submission:
    mandatory: false
    data_type: integer
    length: 8
    codelist: AVISITN
    origins:
