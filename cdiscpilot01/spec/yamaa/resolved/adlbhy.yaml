      mandatory: false
      data_type: text
      length: 8
      codelist: ADLBCAT
      origins:
      - type: Derived
      comment: Set to "HYLAW"
    - id: TRANSHY
      where:
        PARAMCD:
        - TRANSHY
      label: Transaminase 1.5 x ULN
      mandatory: false
      data_type: text
      length: 8
      codelist: ADLBCAT
      origins:
      - type: Derived
