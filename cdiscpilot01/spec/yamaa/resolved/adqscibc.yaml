yamaa: '1.0'
type: spec
model: ADaM
domain: ADQSCIBC
keys:
- STUDYID
- USUBJID
- PARAMCD
- AVISITN
- QSSEQ
input:
  QS:
    path: ../../../data/sdtm/qs.parquet
    relative_to: declaring
    empty_string: present
  ADSL:
    path: ../../../data/adam/adsl-yamaa.parquet
    relative_to: declaring
    schema: adsl.yaml
    empty_string: present
    key:
    - STUDYID
    - USUBJID
base: QS
output:
  path: ../../../data/adam/adqscibc-yamaa.parquet
  relative_to: declaring
  columns:
  - STUDYID
  - SITEID
  - SITEGR1
  - USUBJID
  - TRTSDT
  - TRTEDT
  - TRTP
  - TRTPN
  - AGE
  - AGEGR1
  - AGEGR1N
  - RACE
  - RACEN
  - SEX
  - ITTFL
  - EFFFL
  - COMP24FL
  - AVISIT
  - AVISITN
  - VISIT
  - VISITNUM
  - ADY
  - ADT
  - PARAMCD
  - PARAM
  - PARAMN
  - AVAL
  - ANL01FL
  - DTYPE
  - AWRANGE
  - AWTARGET
  - AWTDIFF
  - AWLO
  - AWHI
  - AWU
  - QSSEQ
  order_by:
  - variable: USUBJID
    direction: asc
    nulls: last
  - variable: PARAMN
    direction: asc
    nulls: last
  - variable: AVISITN
    direction: asc
    nulls: last
  - variable: QSSEQ
    direction: asc
    nulls: last
intermediates:
- id: DONOR16
  dataset: SELF
  key:
  - STUDYID
  - USUBJID
  filter: PARAMCD = 'CIBICVAL' AND AVISITN <= 16
  order_by:
  - variable: AVISITN
    direction: desc
    nulls: last
  - variable: ADY
    direction: desc
    nulls: last
  - variable: QSSEQ
    direction: desc
    nulls: last
  keep: first
  columns:
  - QSSEQ
  - ADY
  - ADT
  - VISIT
  - VISITNUM
  - AVISITN
- id: DONOR24
  dataset: SELF
  key:
  - STUDYID
  - USUBJID
  filter: PARAMCD = 'CIBICVAL' AND AVISITN <= 24
  order_by:
  - variable: AVISITN
    direction: desc
    nulls: last
  - variable: ADY
    direction: desc
    nulls: last
  - variable: QSSEQ
    direction: desc
    nulls: last
  keep: first
  columns:
  - QSSEQ
  - ADY
  - ADT
  - VISIT
  - VISITNUM
  - AVISITN
- id: SCORE16
  dataset: SELF
  key:
  - STUDYID
  - USUBJID
  filter: PARAMCD = 'CIBICVAL' AND AVISITN <= 16 AND ANL01FL = 'Y'
  order_by:
  - variable: AVISITN
    direction: desc
    nulls: last
  - variable: ADY
    direction: desc
    nulls: last
  - variable: QSSEQ
    direction: desc
    nulls: last
  keep: first
  columns:
  - AVAL
- id: SCORE24
  dataset: SELF
  key:
  - STUDYID
  - USUBJID
  filter: PARAMCD = 'CIBICVAL' AND AVISITN <= 24 AND ANL01FL = 'Y'
  order_by:
  - variable: AVISITN
    direction: desc
    nulls: last
  - variable: ADY
    direction: desc
    nulls: last
  - variable: QSSEQ
    direction: desc
    nulls: last
  keep: first
  columns:
  - AVAL
columns:
- name: STUDYID
  type: str
  label: Study Identifier
  derivation: QS.STUDYID
  submission:
    mandatory: false
    data_type: text
    length: 12
    origins:
    - type: Derived
    comment: ADSL.STUDYID
- name: SITEID
  type: str
  label: Study Site Identifier
  derivation: ADSL.SITEID
  submission:
    mandatory: false
    data_type: text
    length: 3
    origins:
    - type: Derived
    comment: ADSL.SITEID
- name: SITEGR1
  type: str
  label: Pooled Site Group 1
  derivation: ADSL.SITEGR1
  submission:
    mandatory: false
    data_type: text
    length: 3
    origins:
    - type: Derived
    comment: ADSL.SITEGR1
- name: USUBJID
  type: str
  label: Unique Subject Identifier
  derivation: QS.USUBJID
  submission:
    key_sequence: 1
    mandatory: false
    data_type: text
    length: 11
    origins:
    - type: Derived
    comment: ADSL.USUBJID
- name: TRTSDT
  type: date
  label: Date of First Exposure to Treatment
  derivation: ADSL.TRTSDT
  submission:
    mandatory: false
    data_type: integer
    length: 8
    display_format: DATE9.
    origins:
    - type: Derived
    comment: ADSL.TRTSDT
- name: TRTEDT
  type: date
  label: Date of Last Exposure to Treatment
  derivation: ADSL.TRTEDT
  submission:
    mandatory: false
    data_type: integer
    length: 8
    display_format: DATE9.
    origins:
    - type: Derived
    comment: ADSL.TRTEDT
- name: TRTP
  type: str
  label: Planned Treatment
  derivation: ADSL.TRT01P
  submission:
    mandatory: false
    data_type: text
    length: 20
    codelist: ARM
    origins:
    - type: Derived
    comment: ADSL.TRT01P
- name: TRTPN
  type: float
  label: Planned Treatment (N)
  derivation: ADSL.TRT01PN
  submission:
    mandatory: false
    data_type: integer
    length: 8
    codelist: ARMN
    origins:
    - type: Derived
    comment: ADSL.TRT01PN
- name: AGE
  type: float
  label: Age
  derivation: ADSL.AGE
  submission:
    mandatory: false
    data_type: integer
    length: 8
    origins:
    - type: Derived
    comment: ADSL.AGE
- name: AGEGR1
  type: str
  label: Pooled Age Group 1
  derivation: ADSL.AGEGR1
  submission:
    mandatory: false
    data_type: text
    length: 5
    codelist: AGEGR1
    origins:
    - type: Derived
    comment: ADSL.AGEGR1
- name: AGEGR1N
  type: float
  label: Pooled Age Group 1 (N)
  derivation: ADSL.AGEGR1N
  submission:
    mandatory: false
    data_type: integer
    length: 8
    codelist: AGEGR1N
    origins:
    - type: Derived
    comment: ADSL.AGEGR1N
- name: RACE
  type: str
  label: Race
  derivation: ADSL.RACE
  submission:
    mandatory: false
    data_type: text
    length: 32
    codelist: RACE
    origins:
    - type: Derived
    comment: ADSL.RACE
- name: RACEN
  type: float
  label: Race (N)
  derivation: ADSL.RACEN
  submission:
    mandatory: false
    data_type: integer
    length: 8
    codelist: RACEN
    origins:
    - type: Derived
    comment: ADSL.RACEN
- name: SEX
  type: str
  label: Sex
  derivation: ADSL.SEX
  submission:
    mandatory: false
    data_type: text
    length: 1
    codelist: SEX
    origins:
    - type: Derived
    comment: ADSL.SEX
- name: ITTFL
  type: str
  label: Intent-to-Treat Population Flag
  derivation: ADSL.ITTFL
  submission:
    mandatory: false
    data_type: text
    length: 1
    codelist: YN
    origins:
    - type: Derived
    comment: ADSL.ITTFL
- name: EFFFL
  type: str
  label: Efficacy Population Flag
  derivation: ADSL.EFFFL
  submission:
    mandatory: false
    data_type: text
    length: 1
    codelist: YN
    origins:
    - type: Derived
    comment: ADSL.FASFL
- name: COMP24FL
  type: str
  label: Completers of Week 24 Population Flag
  derivation: ADSL.COMP24FL
  submission:
    mandatory: false
    data_type: text
    length: 1
    codelist: YN
    origins:
    - type: Derived
    comment: ADSL.COMP24FL
- name: AVISIT
  type: str
  label: Analysis Visit
  submission:
    key_sequence: 3
    mandatory: false
    data_type: text
    length: 16
    codelist: AVISIT
    origins:
    - type: Derived
    comment: Character version of the visit.
- name: AVISITN
  type: float
  label: Analysis Visit (N)
  submission:
    mandatory: false
    data_type: integer
    length: 8
    significant_digits: 1
    codelist: AVISITN
    origins:
    - type: Derived
    comment: Using window method in SAP Page 10 to determine AVISITN value based on
      ADY.
- name: VISIT
  type: str
  label: Visit Name
  submission:
    mandatory: false
    data_type: text
    length: 19
    codelist: VISIT
    origins:
    - type: Derived
    comment: QS.VISIT
- name: VISITNUM
  type: float
  label: Visit Number
  submission:
    mandatory: false
    data_type: float
    length: 8
    significant_digits: 1
    codelist: VISITNUM
    origins:
    - type: Derived
    comment: QS.VISITNUM
- name: ADY
  type: float
  label: Analysis Relative Day
  submission:
    mandatory: false
    data_type: integer
    length: 8
    origins:
    - type: Derived
    comment: ADY = ADT - TRTSDT + 1, if ADT>=TRTSDT. ADY = ADT - TRTSDT, if ADT<TRTSDT.
- name: ADT
  type: date
  label: Analysis Date
  submission:
    key_sequence: 4
    mandatory: false
    data_type: integer
    length: 8
    display_format: DATE9.
    origins:
    - type: Derived
    comment: SAS date from QS.QSDTC
- name: PARAMCD
  type: str
  label: Parameter Code
  submission:
    key_sequence: 2
    mandatory: false
    data_type: text
    length: 8
    codelist: PARAMCD_ADQSCIBC
    origins:
    - type: Derived
    comment: 'Value: CIBICVAL'
- name: PARAM
  type: str
  label: Parameter
  derivation: '''CIBIC Score'''
  submission:
    mandatory: false
    data_type: text
    length: 100
    codelist: PARAM_ADQSCIBC
    origins:
    - type: Derived
    comment: 'Value: CIBIC Score'
- name: PARAMN
  type: float
  label: Parameter (N)
  derivation: 1.0
  submission:
    mandatory: false
    data_type: integer
    length: 8
    codelist: PARAMN_ADQSCIBC
    origins:
    - type: Derived
    comment: Numeric code for Parameter
- name: AVAL
  type: float
  label: Analysis Value
  submission:
    mandatory: false
    data_type: integer
    length: 8
    origins:
    - type: Derived
    comment: QS.QSSTRESN, where QS.QSTESTCD = CIBIC
- name: ANL01FL
  type: str
  label: Analysis Record Flag 01
  submission:
    mandatory: false
    data_type: text
    length: 1
    codelist: Y_BLANK
    origins:
    - type: Derived
    comment: Set ANL01FL=Y based on SAP Page 10 analysis windows.
- name: DTYPE
  type: str
  label: Derivation Type
  submission:
    mandatory: false
    data_type: text
    length: 7
    codelist: DTYPE
    origins:
    - type: Derived
    comment: 'Value: LOCF denotes that the LOCF imputation method was used to impute
      the value for the given parameter and analysis visit.'
- name: AWTARGET
  type: float
  label: Analysis Window Target
  submission:
    mandatory: false
    data_type: integer
    length: 8
    origins:
    - type: Derived
    comment: Target day within the window, specified in the SAP.
- name: AWTDIFF
  type: float
  label: Analysis Window Diff from Target
  submission:
    mandatory: false
    data_type: integer
    length: 8
    origins:
    - type: Derived
    comment: Absolute difference between AWTARGET and ADY
- name: _DIFF
  type: float
  label: signed AWTARGET-ADY (internal)
- name: _RN_ANL
  type: float
  label: rank by window closeness within subject-param-visit (internal)
  derivation: 1.0
- name: _HIT
  type: float
  label: QSSEQ of an observed ANL01FL record at the LOCF visit, if any (internal)
- name: _SRC_QSSEQ
  type: float
  label: carried QSSEQ (internal)
- name: _SRC_AVAL
  type: float
  label: carried AVAL (internal)
- name: _SRC_ADY
  type: float
  label: carried ADY (internal)
- name: _SRC_ADT
  type: date
  label: carried ADT (internal)
- name: _SRC_VISIT
  type: str
  label: carried VISIT (internal)
- name: _SRC_VISITNUM
  type: float
  label: carried VISITNUM (internal)
- name: QSSEQ
  type: float
  label: Sequence Number
  submission:
    mandatory: false
    data_type: integer
    length: 8
    origins:
    - type: Derived
    comment: QS.QSSEQ
- name: AWRANGE
  type: str
  label: Analysis Window Valid Relative Range
  derivation:
    mapping:
      source: AVISIT
      dict:
        Week 8: 2-84
        Week 16: 85-140
        Week 24: '>140'
      case_sensitive: true
  submission:
    mandatory: false
    data_type: text
    length: 9
    origins:
    - type: Derived
    comment: Window range, specified in the SAP.
- name: AWLO
  type: float
  label: Analysis Window Beginning Timepoint
  derivation:
    mapping:
      source: AVISIT
      dict:
        Week 8: 2.0
        Week 16: 85.0
        Week 24: 141.0
      case_sensitive: true
  submission:
    mandatory: false
    data_type: integer
    length: 8
    origins:
    - type: Derived
    comment: Start day of the window, specified in the SAP.
- name: AWHI
  type: float
  label: Analysis Window Ending Timepoint
  derivation:
    mapping:
      source: AVISIT
      dict:
        Week 8: 84.0
        Week 16: 140.0
        Week 24: null
      case_sensitive: true
  submission:
    mandatory: false
    data_type: integer
    length: 8
    origins:
    - type: Derived
    comment: End day of the window, specified in the SAP.
- name: AWU
  type: str
  label: Analysis Window Unit
  derivation: '''DAYS'''
  submission:
    mandatory: false
    data_type: text
    length: 4
    codelist: AWU
    origins:
    - type: Derived
    comment: Assigned as "DAYS".
rows:
- id: obs
  dataset: QS
  filter: QS.QSTESTCD = 'CIBIC'
  derivations:
    QSSEQ: QS.QSSEQ
    PARAMCD: '''CIBICVAL'''
    ADT:
      impute:
        type: date
        source: QS.QSDTC
        day: 1
    ADY:
      study_day:
        source: ADT
        reference: TRTSDT
    AVISIT:
      case:
      - when: ADY <= 84
        then: '''Week 8'''
      - when: ADY <= 140
        then: '''Week 16'''
      - otherwise: '''Week 24'''
    AVAL: QS.QSSTRESN
    AVISITN:
      mapping:
        source: AVISIT
        dict:
          Week 8: 8.0
          Week 16: 16.0
          Week 24: 24.0
        case_sensitive: true
    VISIT: QS.VISIT
    VISITNUM: QS.VISITNUM
    AWTARGET:
      mapping:
        source: AVISIT
        dict:
          Week 8: 56.0
          Week 16: 112.0
          Week 24: 168.0
        case_sensitive: true
    AWTDIFF: ABS(AWTARGET - ADY)
    _DIFF: AWTARGET - ADY
    _RN_ANL:
      row_number:
        window:
          group_by:
          - STUDYID
          - USUBJID
          - PARAMCD
          - AVISIT
          order_by:
          - variable: AWTDIFF
            direction: asc
            nulls: last
          - variable: _DIFF
            direction: asc
            nulls: last
    ANL01FL:
      flag:
        condition: _RN_ANL = 1
        true_value: Y
        false_value: ''
        missing: ''
    DTYPE: ''''''
    _HIT: null
    _SRC_QSSEQ: null
    _SRC_AVAL: null
    _SRC_ADY: null
    _SRC_ADT: null
    _SRC_VISIT: null
    _SRC_VISITNUM: null
- id: locf16
  dataset: QS
  group_by:
  - QS.STUDYID
  - QS.USUBJID
  filter: _HIT IS NULL AND _SRC_QSSEQ IS NOT NULL
  derivations:
    _HIT:
      case:
      - when: DONOR16.AVISITN = 16
        then: DONOR16.QSSEQ
    _SRC_QSSEQ: DONOR16.QSSEQ
    _SRC_AVAL: SCORE16.AVAL
    _SRC_ADY: DONOR16.ADY
    _SRC_ADT: DONOR16.ADT
    _SRC_VISIT: DONOR16.VISIT
    _SRC_VISITNUM: DONOR16.VISITNUM
    AVISIT: '''Week 16'''
    AVISITN: 16.0
    AWTARGET: 112.0
    AWTDIFF: ABS(AWTARGET - ADY)
    _DIFF: AWTARGET - ADY
    VISIT: _SRC_VISIT
    VISITNUM: _SRC_VISITNUM
    ADY: _SRC_ADY
    ADT: _SRC_ADT
    PARAMCD: '''CIBICVAL'''
    AVAL: _SRC_AVAL
    ANL01FL: '''Y'''
    DTYPE: '''LOCF'''
    QSSEQ: _SRC_QSSEQ
- id: locf24
  dataset: QS
  group_by:
  - QS.STUDYID
  - QS.USUBJID
  filter: _HIT IS NULL AND _SRC_QSSEQ IS NOT NULL
  derivations:
    _HIT:
      case:
      - when: DONOR24.AVISITN = 24
        then: DONOR24.QSSEQ
    _SRC_QSSEQ: DONOR24.QSSEQ
    _SRC_AVAL: SCORE24.AVAL
    _SRC_ADY: DONOR24.ADY
    _SRC_ADT: DONOR24.ADT
    _SRC_VISIT: DONOR24.VISIT
    _SRC_VISITNUM: DONOR24.VISITNUM
    AVISIT: '''Week 24'''
    AVISITN: 24.0
    AWTARGET: 168.0
    AWTDIFF: ABS(AWTARGET - ADY)
    _DIFF: AWTARGET - ADY
    VISIT: _SRC_VISIT
    VISITNUM: _SRC_VISITNUM
    ADY: _SRC_ADY
    ADT: _SRC_ADT
    PARAMCD: '''CIBICVAL'''
    AVAL: _SRC_AVAL
    ANL01FL: '''Y'''
    DTYPE: '''LOCF'''
    QSSEQ: _SRC_QSSEQ
submission:
  mode: historical
  artifact: adqscibc.xpt
  has_no_data: false
  label: CIBIC+ Analysis
  class: BASIC DATA STRUCTURE
  structure: one record per subject per parameter per analysis visit per analysis
    date
  repeating: true
  reference_data: false
  non_standard: false
