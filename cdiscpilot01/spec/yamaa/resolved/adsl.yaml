yamaa: '1.0'
type: spec
model: ADaM
domain: ADSL
keys:
- STUDYID
- USUBJID
input:
  DM:
    path: ../../../data/sdtm/dm.parquet
    relative_to: entry
    empty_string: present
  EX:
    path: ../../../data/sdtm/ex.parquet
    relative_to: entry
    empty_string: present
    key:
    - STUDYID
    - USUBJID
  VS:
    path: ../../../data/sdtm/vs.parquet
    relative_to: entry
    empty_string: present
  SV:
    path: ../../../data/sdtm/sv.parquet
    relative_to: entry
    empty_string: present
  DS:
    path: ../../../data/sdtm/ds.parquet
    relative_to: entry
    empty_string: present
  QS:
    path: ../../../data/sdtm/qs.parquet
    relative_to: entry
    empty_string: present
  SC:
    path: ../../../data/sdtm/sc.parquet
    relative_to: entry
    empty_string: present
  MH:
    path: ../../../data/sdtm/mh.parquet
    relative_to: entry
    empty_string: present
base: DM
output:
  path: ../../../data/adam/adsl-yamaa.parquet
  relative_to: entry
  columns:
  - STUDYID
  - USUBJID
  - SUBJID
  - SITEID
  - SITEGR1
  - ARM
  - TRT01P
  - TRT01PN
  - TRT01A
  - TRT01AN
  - TRTSDT
  - TRTEDT
  - TRTDUR
  - AVGDD
  - CUMDOSE
  - AGE
  - AGEGR1
  - AGEGR1N
  - AGEU
  - RACE
  - RACEN
  - SEX
  - ETHNIC
  - SAFFL
  - ITTFL
  - EFFFL
  - COMP8FL
  - COMP16FL
  - COMP24FL
  - DISCONFL
  - DSRAEFL
  - DTHFL
  - BMIBL
  - BMIBLGR1
  - HEIGHTBL
  - WEIGHTBL
  - EDUCLVL
  - DISONSDT
  - DURDIS
  - DURDSGR1
  - VISIT1DT
  - RFSTDTC
  - RFENDTC
  - VISNUMEN
  - RFENDT
  - DCDECOD
  - DCREASCD
  - MMSETOT
  order_by:
  - variable: USUBJID
    direction: asc
    nulls: last
intermediates:
- id: BASE_HT
  dataset: VS
  key:
  - STUDYID
  - USUBJID
  filter: VS.VSTESTCD = 'HEIGHT'
  order_by:
  - variable: VS.VISITNUM
    direction: asc
    nulls: last
  keep: first
- id: BASE_WT
  dataset: VS
  key:
  - STUDYID
  - USUBJID
  filter: VS.VSTESTCD = 'WEIGHT' AND VS.VSBLFL = 'Y'
  order_by:
  - variable: VS.VISITNUM
    direction: asc
    nulls: last
  keep: first
- id: LAST_EX
  dataset: EX
  key:
  - STUDYID
  - USUBJID
  order_by:
  - variable: EX.EXSEQ
    direction: asc
    nulls: last
  keep: last
- id: SV1
  dataset: SV
  key:
  - STUDYID
  - USUBJID
  filter: SV.VISITNUM = 1
  order_by:
  - variable: SV.VISITNUM
    direction: asc
    nulls: last
  keep: first
- id: SV8
  dataset: SV
  key:
  - STUDYID
  - USUBJID
  filter: SV.VISITNUM = 8
  order_by:
  - variable: SV.VISITNUM
    direction: asc
    nulls: last
  keep: first
- id: SV10
  dataset: SV
  key:
  - STUDYID
  - USUBJID
  filter: SV.VISITNUM = 10
  order_by:
  - variable: SV.VISITNUM
    direction: asc
    nulls: last
  keep: first
- id: SV12
  dataset: SV
  key:
  - STUDYID
  - USUBJID
  filter: SV.VISITNUM = 12
  order_by:
  - variable: SV.VISITNUM
    direction: asc
    nulls: last
  keep: first
- id: DS_DISP
  dataset: DS
  key:
  - STUDYID
  - USUBJID
  filter: DS.DSCAT = 'DISPOSITION EVENT'
  order_by:
  - variable: DS.DSSEQ
    direction: asc
    nulls: last
  keep: first
- id: SC_EDU
  dataset: SC
  key:
  - STUDYID
  - USUBJID
  filter: SC.SCTESTCD = 'EDLEVEL'
  order_by:
  - variable: SC.SCSEQ
    direction: asc
    nulls: last
  keep: first
- id: MH_DX
  dataset: MH
  key:
  - STUDYID
  - USUBJID
  filter: MH.MHCAT = 'PRIMARY DIAGNOSIS'
  order_by:
  - variable: MH.MHSEQ
    direction: asc
    nulls: last
  keep: first
- id: QS_ADAS
  dataset: QS
  key:
  - STUDYID
  - USUBJID
  filter: QS.QSCAT = 'ALZHEIMER''S DISEASE ASSESSMENT SCALE' AND QS.VISITNUM > 3
  order_by:
  - variable: QS.VISITNUM
    direction: asc
    nulls: last
  keep: first
- id: QS_CIBIC
  dataset: QS
  key:
  - STUDYID
  - USUBJID
  filter: QS.QSCAT = 'CLINICIAN''S INTERVIEW-BASED IMPRESSION OF CHANGE (CIBIC+)'
    AND QS.VISITNUM > 3
  order_by:
  - variable: QS.VISITNUM
    direction: asc
    nulls: last
  keep: first
columns:
- name: STUDYID
  type: str
  label: Study Identifier
  derivation: DM.STUDYID
  submission:
    mandatory: false
    data_type: text
    length: 12
    origins:
    - type: Derived
    comment: DM.STUDYID
- name: USUBJID
  type: str
  label: Unique Subject Identifier
  derivation: DM.USUBJID
  submission:
    key_sequence: 1
    mandatory: false
    data_type: text
    length: 11
    origins:
    - type: Derived
    comment: DM.USUBJID
- name: SUBJID
  type: str
  label: Subject Identifier for the Study
  derivation: DM.SUBJID
  submission:
    mandatory: false
    data_type: text
    length: 4
    origins:
    - type: Derived
    comment: DM.SUBJID
- name: SITEID
  type: str
  label: Study Site Identifier
  derivation: DM.SITEID
  submission:
    mandatory: false
    data_type: text
    length: 3
    origins:
    - type: Derived
    comment: DM.SITEID
- name: SITEGR1
  type: str
  label: Pooled Site Group 1
  derivation:
    case:
    - when: DM.SITEID IN ('702','706','707','711','714','715','717')
      then: '''900'''
    - otherwise: DM.SITEID
  submission:
    mandatory: false
    data_type: text
    length: 3
    origins:
    - type: Derived
    comment: refer to SAP, Section 7.1 - if not pooled then SITEGR1=SITEID. If pooled,
      SITEGR1 will be 900
- name: ARM
  type: str
  label: Description of Planned Arm
  derivation: DM.ARM
  submission:
    mandatory: false
    data_type: text
    length: 20
    codelist: ARM
    origins:
    - type: Derived
    comment: DM.ARM
- name: TRT01P
  type: str
  label: Planned Treatment for Period 01
  derivation: DM.ARM
  submission:
    mandatory: false
    data_type: text
    length: 20
    codelist: ARM
    origins:
    - type: Derived
    comment: DM.ARM
- name: TRT01PN
  type: float
  label: Planned Treatment for Period 01 (N)
  derivation:
    mapping:
      source: DM.ARM
      dict:
        Placebo: 0
        Xanomeline Low Dose: 54
        Xanomeline High Dose: 81
      case_sensitive: true
  submission:
    mandatory: false
    data_type: integer
    length: 8
    codelist: ARMN
    origins:
    - type: Derived
    comment: Numeric code for TRT01P which corresponds to the randomized dose
- name: TRT01A
  type: str
  label: Actual Treatment for Period 01
  derivation: DM.ARM
  submission:
    mandatory: false
    data_type: text
    length: 20
    codelist: ARM
    origins:
    - type: Derived
    comment: TRT01A=TRT01P, i.e., no difference between actual and randomized treatment
      in this study.
- name: TRT01AN
  type: float
  label: Actual Treatment for Period 01 (N)
  derivation:
    mapping:
      source: DM.ARM
      dict:
        Placebo: 0
        Xanomeline Low Dose: 54
        Xanomeline High Dose: 81
      case_sensitive: true
  submission:
    mandatory: false
    data_type: integer
    length: 8
    codelist: ARMN
    origins:
    - type: Derived
    comment: Numeric code for TRT01A which corresponds to the randomized dose
- name: EX_MINDTC
  type: str
  label: Earliest Exposure Start (character)
  derivation:
    aggregate: MIN(EX.EXSTDTC)
- name: TRTSDT
  type: date
  label: Date of First Exposure to Treatment
  derivation:
    impute:
      type: date
      source: EX_MINDTC
      month: 1
      day: 1
      invalid: null
  submission:
    mandatory: false
    data_type: integer
    length: 8
    display_format: DATE9.
    origins:
    - type: Derived
    comment: SV.SVSTDTC when SV.VISITNUM=3, converted to SAS date
- name: TRTEDT
  type: date
  label: Date of Last Exposure to Treatment
  derivation:
    case:
    - when: LAST_EX.EXENDTC IS NULL OR LAST_EX.EXENDTC = ''
      then:
        impute:
          type: date
          source: DS_DISP.DSSTDTC
          month: 1
          day: 1
          invalid: null
    - otherwise:
        impute:
          type: date
          source: LAST_EX.EXENDTC
          month: 1
          day: 1
          invalid: null
  submission:
    mandatory: false
    data_type: integer
    length: 8
    display_format: DATE9.
    origins:
    - type: Derived
    comment: The date of final dose (from the CRF) is EX.EXENDTC on the subject's
      last EX record. If the date of final dose is missing for the subject and the
      subject discontinued after visit 3, use the date of discontinuation as the date
      of last dose. Convert the date to a SAS date.
- name: TRTDUR
  type: float
  label: Duration of Treatment (days)
  derivation:
    diff:
      type: date
      start: TRTSDT
      end: TRTEDT
      unit: day
      closed: both
  submission:
    mandatory: false
    data_type: integer
    length: 8
    origins:
    - type: Derived
    comment: TRTEDT-TRTSDT+1
- name: CUMDOSE_BASE
  type: float
  label: Cumulative dose from complete EX records
  derivation:
    aggregate: SUM(EX.EXDOSE * (EX.EXENDY - EX.EXSTDY + 1))
- name: LAST_EXSTDTC_DT
  type: date
  label: Last Exposure Start (date)
  derivation:
    impute:
      type: date
      source: LAST_EX.EXSTDTC
      month: 1
      day: 1
      invalid: null
- name: LAST_EX_DAYS
  type: float
  label: Days on last EX record if end blank, else 0
  derivation:
    case:
    - when: TRTEDT IS NULL OR LAST_EXSTDTC_DT IS NULL
      then: 0
    - when: LAST_EX.EXENDTC IS NULL OR LAST_EX.EXENDTC = ''
      then:
        diff:
          type: date
          start: LAST_EXSTDTC_DT
          end: TRTEDT
          unit: day
          closed: both
    - otherwise: 0
- name: _CUM0
  type: float
  label: _CUM0 (helper)
  derivation:
    case:
    - when: CUMDOSE_BASE IS NULL
      then: 0
    - otherwise: CUMDOSE_BASE
- name: _DOSE0
  type: float
  label: _DOSE0 (helper)
  derivation:
    case:
    - when: LAST_EX.EXDOSE IS NULL
      then: 0
    - otherwise: LAST_EX.EXDOSE
- name: CUMDOSE
  type: float
  label: Cumulative Dose (as planned)
  derivation: _CUM0 + _DOSE0 * LAST_EX_DAYS
  submission:
    mandatory: false
    data_type: float
    length: 8
    significant_digits: 1
    origins:
    - type: Derived
    comment: 'For ARMN=0 or 1: CUMDOSE=TRT01PN*TRTDUR. --- For ARMN=2: CUMDOSE will
      be based on 54mg per day for the # of days subj was in 1st dosing interval (i.e.,
      visit4date-TRTSTDT+1 if 1st interval completed, TRTEDT-TRTSTDT+1 if subj discontinued
      <=visit 4 and > visit 3), 81mg per day for the # of days subj was in 2nd dosing
      interval (i.e., visit12date-visit4date if 2nd interval completed, TRTEDT-visit4date
      if subj discontinued <= visit 12 and > visit 4), and 54mg per day for the #
      of days subj was in 3rd dosing interval (i.e., TRTEDT - visit12date if subj
      continued after visit 12).'
- name: AVGDD_RAW
  type: float
  label: Avg Daily Dose unrounded
  derivation: CUMDOSE / NULLIF(TRTDUR, 0)
- name: AVGDD
  type: float
  label: Avg Daily Dose (as planned)
  derivation:
    round_half_away_from_zero:
      source: AVGDD_RAW
      digits: 1
  submission:
    mandatory: false
    data_type: float
    length: 8
    significant_digits: 1
    origins:
    - type: Derived
    comment: CUMDOSE/TRTDUR
- name: AGE
  type: float
  label: Age
  derivation: DM.AGE
  submission:
    mandatory: false
    data_type: integer
    length: 8
    origins:
    - type: Derived
    comment: DM.AGE
- name: AGEGR1
  type: str
  label: Pooled Age Group 1
  derivation:
    case:
    - when: DM.AGE < 65
      then: '''<65'''
    - when: DM.AGE <= 80
      then: '''65-80'''
    - otherwise: '''>80'''
  submission:
    mandatory: false
    data_type: text
    length: 5
    codelist: AGEGR1
    origins:
    - type: Derived
    comment: Character variable derived from ADSL.AGEGR1N
- name: AGEGR1N
  type: float
  label: Pooled Age Group 1 (N)
  derivation:
    mapping:
      source: AGEGR1
      dict:
        <65: 1
        65-80: 2
        '>80': 3
      case_sensitive: true
  submission:
    mandatory: false
    data_type: integer
    length: 8
    codelist: AGEGR1N
    origins:
    - type: Derived
    comment: AGEGR1 = 1 if AGE <65. AGEGR1 = 2 if AGE 65-80. AGEGR1 = 3 if AGE >80.
- name: AGEU
  type: str
  label: Age Units
  derivation: DM.AGEU
  submission:
    mandatory: false
    data_type: text
    length: 5
    codelist: AGEU
    origins:
    - type: Derived
    comment: DM.AGEU
- name: RACE
  type: str
  label: Race
  derivation: DM.RACE
  submission:
    mandatory: false
    data_type: text
    length: 32
    codelist: RACE
    origins:
    - type: Derived
    comment: DM.RACE
- name: RACEN
  type: float
  label: Race (N)
  derivation:
    mapping:
      source: DM.RACE
      dict:
        WHITE: 1
        BLACK OR AFRICAN AMERICAN: 2
        AMERICAN INDIAN OR ALASKA NATIVE: 6
      case_sensitive: true
  submission:
    mandatory: false
    data_type: integer
    length: 8
    codelist: RACEN
    origins:
    - type: Derived
    comment: Numeric code for RACE
- name: SEX
  type: str
  label: Sex
  derivation: DM.SEX
  submission:
    mandatory: false
    data_type: text
    length: 1
    codelist: SEX
    origins:
    - type: Derived
    comment: DM.SEX
- name: ETHNIC
  type: str
  label: Ethnicity
  derivation: DM.ETHNIC
  submission:
    mandatory: false
    data_type: text
    length: 22
    codelist: ETHNIC
    origins:
    - type: Derived
    comment: DM.ETHNIC
- name: ITTFL
  type: str
  label: Intent-To-Treat Population Flag
  derivation:
    case:
    - when: DM.ARMCD <> ''
      then: '''Y'''
    - otherwise: '''N'''
  submission:
    mandatory: false
    data_type: text
    length: 1
    codelist: YN
    origins:
    - type: Derived
    comment: Y if ARMCD ne ' '. N otherwise
- name: SAFFL
  type: str
  label: Safety Population Flag
  derivation:
    case:
    - when: ITTFL = 'Y' AND TRTSDT IS NOT NULL
      then: '''Y'''
    - otherwise: '''N'''
  submission:
    mandatory: false
    data_type: text
    length: 1
    codelist: YN
    origins:
    - type: Derived
    comment: Y if ITTFL='Y' and TRTSDT ne missing. N otherwise
- name: EFFFL
  type: str
  label: Efficacy Population Flag
  derivation:
    case:
    - when: SAFFL = 'Y' AND QS_ADAS.QSSEQ IS NOT NULL AND QS_CIBIC.QSSEQ IS NOT NULL
      then: '''Y'''
    - otherwise: '''N'''
  submission:
    mandatory: false
    data_type: text
    length: 1
    codelist: YN
    origins:
    - type: Derived
    comment: Y if SAFFL='Y AND subject has at least one record in QS for ADAS-Cog
      with VISITNUM>3 AND at least one record in QS for CIBIC+ with VISITNUM>3, N
      otherwise
- name: SV8DT
  type: date
  label: Visit 8 date
  derivation:
    impute:
      type: date
      source: SV8.SVSTDTC
      month: 1
      day: 1
      invalid: null
- name: RFSTDTC
  type: str
  label: Subject Reference Start Date/Time
  derivation: DM.RFSTDTC
  submission:
    mandatory: false
    data_type: datetime
    length: 20
    origins:
    - type: Derived
    comment: DM.RFSTDTC
- name: RFENDTC
  type: str
  label: Subject Reference End Date/Time
  derivation: DM.RFENDTC
  submission:
    mandatory: false
    data_type: datetime
    length: 20
    origins:
    - type: Derived
    comment: DM.RFENDTC
- name: RFENDT
  type: date
  label: Date of Discontinuation/Completion
  derivation:
    impute:
      type: date
      source: RFENDTC
      month: 1
      day: 1
      invalid: null
  submission:
    mandatory: false
    data_type: integer
    length: 8
    display_format: DATE9.
    origins:
    - type: Derived
    comment: RFENDTC converted to SAS date
- name: COMP8FL
  type: str
  label: Completers of Week 8 Population Flag
  derivation:
    case:
    - when: SV8DT IS NOT NULL AND RFENDT >= SV8DT
      then: '''Y'''
    - otherwise: '''N'''
  submission:
    mandatory: false
    data_type: text
    length: 1
    codelist: YN
    origins:
    - type: Derived
    comment: Y if subject has a SV.VISITNUM=8 and ENDDT >= date of visit 8, N otherwise
- name: SV10DT
  type: date
  label: Visit 10 date
  derivation:
    impute:
      type: date
      source: SV10.SVSTDTC
      month: 1
      day: 1
      invalid: null
- name: COMP16FL
  type: str
  label: Completers of Week 16 Population Flag
  derivation:
    case:
    - when: SV10DT IS NOT NULL AND RFENDT >= SV10DT
      then: '''Y'''
    - otherwise: '''N'''
  submission:
    mandatory: false
    data_type: text
    length: 1
    codelist: YN
    origins:
    - type: Derived
    comment: Y if subject has a SV.VISITNUM=10 and ENDDT>=date of visit 10, N otherwise
- name: SV12DT
  type: date
  label: Visit 12 date
  derivation:
    impute:
      type: date
      source: SV12.SVSTDTC
      month: 1
      day: 1
      invalid: null
- name: COMP24FL
  type: str
  label: Completers of Week 24 Population Flag
  derivation:
    case:
    - when: SV12DT IS NOT NULL AND RFENDT >= SV12DT
      then: '''Y'''
    - otherwise: '''N'''
  submission:
    mandatory: false
    data_type: text
    length: 1
    codelist: YN
    origins:
    - type: Derived
    comment: Y if subject has a SV.VISITNUM=12 and ENDDT>= date of visit 12 , N otherwise
- name: DCDECOD
  type: str
  label: Standardized Disposition Term
  derivation: DS_DISP.DSDECOD
  submission:
    mandatory: false
    data_type: text
    length: 27
    codelist: DISCCD
    origins:
    - type: Derived
    comment: DS.DSDECOD where DSCAT='DISPOSITION EVENT'
- name: DCREASCD
  type: str
  label: Reason for Discontinuation
  derivation:
    case:
    - when: DS_DISP.DSTERM = 'PROTOCOL ENTRY CRITERIA NOT MET'
      then: '''I/E Not Met'''
    - otherwise:
        mapping:
          source: DCDECOD
          dict:
            ADVERSE EVENT: Adverse Event
            COMPLETED: Completed
            DEATH: Death
            LACK OF EFFICACY: Lack of Efficacy
            LOST TO FOLLOW-UP: Lost to Follow-up
            PHYSICIAN DECISION: Physician Decision
            PROTOCOL VIOLATION: Protocol Violation
            STUDY TERMINATED BY SPONSOR: Sponsor Decision
            WITHDRAWAL BY SUBJECT: Withdrew Consent
          case_sensitive: true
  submission:
    mandatory: false
    data_type: text
    length: 18
    codelist: DISCREAS
    origins:
    - type: Derived
    comment: Grouping of DCDECOD values to support summarizing study completion status
      and reason for discontinuation
- name: DISCONFL
  type: str
  label: Did the Subject Discontinue the Study?
  derivation:
    case:
    - when: DCREASCD <> 'Completed'
      then: '''Y'''
    - otherwise: ''''''
  submission:
    mandatory: false
    data_type: text
    length: 1
    codelist: Y_BLANK
    origins:
    - type: Derived
    comment: Y if DCREASCD ^= 'Completed'. Null otherwise
- name: DSRAEFL
  type: str
  label: Discontinued due to AE?
  derivation:
    case:
    - when: DCREASCD = 'Adverse Event'
      then: '''Y'''
    - otherwise: ''''''
  submission:
    mandatory: false
    data_type: text
    length: 1
    codelist: Y_BLANK
    origins:
    - type: Derived
    comment: Y if DCREASCD='Adverse Event'. Null otherwise
- name: DTHFL
  type: str
  label: Subject Died?
  derivation: DM.DTHFL
  submission:
    mandatory: false
    data_type: text
    length: 1
    codelist: Y_BLANK
    origins:
    - type: Derived
    comment: DM.DTHFL
- name: HEIGHTBL
  type: float
  label: Baseline Height (cm)
  derivation:
    round_half_away_from_zero:
      source: BASE_HT.VSSTRESN
      digits: 1
  submission:
    mandatory: false
    data_type: float
    length: 8
    significant_digits: 1
    origins:
    - type: Derived
    comment: VSSTRESN when VS.VSTESTCD='HEIGHT' and VS.VISITNUM=1
- name: WEIGHTBL
  type: float
  label: Baseline Weight (kg)
  derivation:
    round_half_away_from_zero:
      source: BASE_WT.VSSTRESN
      digits: 1
  submission:
    mandatory: false
    data_type: float
    length: 8
    significant_digits: 1
    origins:
    - type: Derived
    comment: VSSTRESN when VS.VSTESTCD='WEIGHT' and VS.VISITNUM=3
- name: BMIBL_RAW
  type: float
  label: Baseline BMI unrounded
  derivation: WEIGHTBL / POWER(NULLIF(HEIGHTBL, 0) / 100, 2)
- name: BMIBL
  type: float
  label: Baseline BMI (kg/m^2)
  derivation:
    round_half_away_from_zero:
      source: BMIBL_RAW
      digits: 1
  submission:
    mandatory: false
    data_type: float
    length: 8
    significant_digits: 1
    origins:
    - type: Derived
    comment: WEIGHTBL / ((HEIGHTBL*100)**2)
- name: BMIBLGR1
  type: str
  label: Pooled Baseline BMI Group 1
  derivation:
    case:
    - when: BMIBL IS NULL
      then: '''<25'''
    - when: BMIBL < 25
      then: '''<25'''
    - when: BMIBL < 30
      then: '''25-<30'''
    - otherwise: '''>=30'''
  submission:
    mandatory: false
    data_type: text
    length: 6
    codelist: BMICAT
    origins:
    - type: Derived
    comment: BMIBLGR1=Normal if . < BMIBL <25. BMIBLGR1=Overweight if 25 <=BMIBL <30.
      BMIBLGR1=Obese if BMIBL >=30
- name: EDUCLVL
  type: float
  label: Years of Education
  derivation: SC_EDU.SCSTRESN
  submission:
    mandatory: false
    data_type: integer
    length: 8
    origins:
    - type: Derived
    comment: SC.SCSTRESN where SC.SCTESTCD=YEARSEDU
- name: DISONSDT
  type: date
  label: Date of Onset of Disease
  derivation:
    impute:
      type: date
      source: MH_DX.MHSTDTC
      month: 1
      day: 1
      invalid: null
  submission:
    mandatory: false
    data_type: integer
    length: 8
    display_format: DATE9.
    origins:
    - type: Derived
    comment: MH.MHSTDTC where MHCAT='PRIMARY DIAGNOSIS' converted to SAS date
- name: VISIT1DT
  type: date
  label: Date of Visit 1
  derivation:
    impute:
      type: date
      source: SV1.SVSTDTC
      month: 1
      day: 1
      invalid: null
  submission:
    mandatory: false
    data_type: integer
    length: 8
    display_format: DATE9.
    origins:
    - type: Derived
    comment: SV.SVSTDTC when SV.VISITNUM=1, converted to SAS date
- name: DURDIS_DAYS
  type: float
  label: Disease duration days +1
  derivation:
    diff:
      type: date
      start: DISONSDT
      end: VISIT1DT
      unit: day
      closed: both
- name: DURDIS_RAW
  type: float
  label: Duration of Disease (Months) unrounded
  derivation: DURDIS_DAYS / 30.4375
- name: DURDIS
  type: float
  label: Duration of Disease (Months)
  derivation:
    round_half_away_from_zero:
      source: DURDIS_RAW
      digits: 1
  submission:
    mandatory: false
    data_type: float
    length: 8
    significant_digits: 1
    origins:
    - type: Derived
    comment: number of months between VISIT1DT and DISONSET
- name: DURDSGR1
  type: str
  label: Pooled Disease Duration Group 1
  derivation:
    case:
    - when: DURDIS < 12
      then: '''<12'''
    - otherwise: '''>=12'''
  submission:
    mandatory: false
    data_type: text
    length: 4
    codelist: DURDISC
    origins:
    - type: Derived
    comment: grouping DURDIS values as <12 and >=12
- name: VISNUMEN
  type: float
  label: End of Trt Visit (Vis 12 or Early Term.)
  derivation:
    case:
    - when: DS_DISP.VISITNUM = 13
      then: 12
    - otherwise: DS_DISP.VISITNUM
  submission:
    mandatory: false
    data_type: integer
    length: 8
    origins:
    - type: Derived
    comment: if DS.VISITNUM=13 where DSTERM='PROTCOL COMPLETED' then VISNUMEN=12,
      otherwise VISNUMEN=DS.VISITNUM where DSTERM='PROTCOL COMPLETED'
- name: MMSETOT
  type: float
  label: MMSE Total
  derivation:
    aggregate:
      key:
      - STUDYID
      - USUBJID
      filter: QS.QSCAT = 'MINI-MENTAL STATE'
      expr: SUM(QS.QSSTRESN)
  submission:
    mandatory: false
    data_type: integer
    length: 8
    origins:
    - type: Derived
    comment: sum of QS.QSORRES values for the subject
rows:
- id: treated-subjects
  dataset: DM
  filter: DM.ACTARM <> 'Screen Failure'
  derivations: {}
submission:
  mode: historical
  artifact: adsl.xpt
  has_no_data: false
  label: Subject-Level Analysis
  class: SUBJECT LEVEL ANALYSIS DATASET
  structure: one record per subject
  repeating: false
  reference_data: false
  non_standard: false
