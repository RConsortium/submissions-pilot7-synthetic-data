rows:
- id: base-ord
  dataset: LB
  filter: LB.LBCAT = 'CHEMISTRY' AND LB.VISIT NOT IN ('RETRIEVAL', 'AMBUL ECG REMOVAL')
  derivations:
    STUDYID: LB.STUDYID
    USUBJID: LB.USUBJID
    PARAMCD: LB.LBTESTCD
    _IS_EOT: ''''''
    VISIT: LB.VISIT
    VISITNUM: LB.VISITNUM
    LBSEQ: LB.LBSEQ
    LBNRIND: LB.LBNRIND
    LBSTRESN: LB.LBSTRESN
    A1LO: LB.LBSTNRLO
    A1HI: LB.LBSTNRHI
    _LBDTM_TXT: LB.LBDTC
    _LBDTM:
      impute:
        type: datetime
        source: _LBDTM_TXT
        time: first
        invalid: null
    _ADT_DATE:
      to_date:
        source: _LBDTM
    AVISIT:
      case:
      - when: LB.VISIT = 'SCREENING 1'
        then: '''        Baseline'''
      - when: LB.VISIT = 'WEEK 2'
        then: '''          Week 2'''
      - when: LB.VISIT = 'WEEK 4'
        then: '''          Week 4'''
      - when: LB.VISIT = 'WEEK 6'
        then: '''          Week 6'''
      - when: LB.VISIT = 'WEEK 8'
        then: '''          Week 8'''
      - when: LB.VISIT = 'WEEK 12'
        then: '''         Week 12'''
      - when: LB.VISIT = 'WEEK 16'
        then: '''         Week 16'''
      - when: LB.VISIT = 'WEEK 20'
        then: '''         Week 20'''
      - when: LB.VISIT = 'WEEK 24'
        then: '''         Week 24'''
      - when: LB.VISIT = 'WEEK 26'
        then: '''         Week 26'''
      - otherwise: '''               .'''
    AVISITN:
      case:
      - when: LB.VISIT = 'SCREENING 1'
        then: 0.0
      - when: LB.VISIT = 'WEEK 2'
        then: 2.0
      - when: LB.VISIT = 'WEEK 4'
        then: 4.0
      - when: LB.VISIT = 'WEEK 6'
        then: 6.0
      - when: LB.VISIT = 'WEEK 8'
        then: 8.0
      - when: LB.VISIT = 'WEEK 12'
        then: 12.0
      - when: LB.VISIT = 'WEEK 16'
        then: 16.0
      - when: LB.VISIT = 'WEEK 20'
        then: 20.0
      - when: LB.VISIT = 'WEEK 24'
        then: 24.0
      - when: LB.VISIT = 'WEEK 26'
        then: 26.0
      - otherwise: null
    ABLFL:
      case:
      - when: LB.LBBLFL = 'Y'
        then: '''Y'''
      - otherwise: ''''''
    _PARAM_BASE:
      mapping:
        source: LB.LBTESTCD
        dict:
          SODIUM: Sodium (mmol/L)
          K: Potassium (mmol/L)
          CL: Chloride (mmol/L)
          BILI: Bilirubin (umol/L)
          ALP: Alkaline Phosphatase (U/L)
          GGT: Gamma Glutamyl Transferase (U/L)
          ALT: Alanine Aminotransferase (U/L)
          AST: Aspartate Aminotransferase (U/L)
          BUN: Blood Urea Nitrogen (mmol/L)
          CREAT: Creatinine (umol/L)
          URATE: Urate (umol/L)
          PHOS: Phosphate (mmol/L)
          CA: Calcium (mmol/L)
          GLUC: Glucose (mmol/L)
          PROT: Protein (g/L)
          ALB: Albumin (g/L)
          CHOL: Cholesterol (mmol/L)
          CK: Creatine Kinase (U/L)
        case_sensitive: true
        unmapped: null
    _PARAMN_BASE:
      mapping:
        source: LB.LBTESTCD
        dict:
          SODIUM: 18.0
          K: 19.0
          CL: 20.0
          BILI: 21.0
          ALP: 22.0
          GGT: 23.0
          ALT: 24.0
          AST: 25.0
          BUN: 26.0
          CREAT: 27.0
          URATE: 28.0
          PHOS: 29.0
          CA: 30.0
          GLUC: 31.0
          PROT: 32.0
          ALB: 33.0
          CHOL: 34.0
          CK: 35.0
        case_sensitive: true
        unmapped: null
    _AVAL_BASE: LB.LBSTRESN
    _BASELINE_AVAL:
      case:
      - when: ABLFL = 'Y'
        then: _AVAL_BASE
      - otherwise: null
    _PNM_BASE:
      locf:
        source: _BASELINE_AVAL
        include_current: true
        window:
          group_by:
          - USUBJID
          - PARAMCD
          order_by:
          - variable: LBSEQ
            direction: asc
            nulls: last
    _BASE:
      first_available:
        sources:
        - _BASELINE_AVAL
        - _PNM_BASE
    _IS_LAST_ELIGIBLE:
      row_number:
        window:
          group_by:
          - USUBJID
          - PARAMCD
          order_by:
          - variable: LBSEQ
            direction: desc
            nulls: last
          filter: VISIT IN ('WEEK 2', 'WEEK 4', 'WEEK 6', 'WEEK 8', 'WEEK 12', 'WEEK
            16', 'WEEK 20', 'WEEK 24')
    _RANK_AVISITN: AVISITN
    _T1: 1.5 * A1HI - _AVAL_BASE
    _T2: _AVAL_BASE - 0.5 * A1LO
    ALBTRVAL:
      greatest:
        sources:
        - _T1
        - _T2
    _R2A1HI_R: _AVAL_BASE / A1HI
    _R2A1LO_R:
      case:
      - when: A1LO IS NULL OR A1LO = 0
        then: null
      - otherwise: _AVAL_BASE / A1LO
    _ANRIND_BASE:
      case:
      - when: _R2A1HI_R > 1.5
        then: '''H'''
      - when: _R2A1LO_R < 0.5
        then: '''L'''
      - otherwise: '''N'''
    _BASELINE_ANRIND:
      case:
      - when: ABLFL = 'Y'
        then: _ANRIND_BASE
      - otherwise: null
    _PNM_BNRIND:
      locf:
        source: _BASELINE_ANRIND
        include_current: true
        window:
          group_by:
          - USUBJID
          - PARAMCD
          order_by:
          - variable: LBSEQ
            direction: asc
            nulls: last
    _BNRIND_VAL:
      first_available:
        sources:
        - _BASELINE_ANRIND
        - _PNM_BNRIND
    _LBCAT: null
    _VISIT_RAW: null
    _LBBLFL: null
    _LBTESTCD: null
    LBTESTCD: LB.LBTESTCD
    _IS_UNDER: ''''''
    _B_A1HI: null
    _B_A1LO: null
    _PARAMCD_BASE: null
    _SCHED: null
    _PREV_AVAL: null
    _U_RAW: null
