  filter: _IS_LAST_ELIGIBLE = 1
  derivations:
    STUDYID:
      aggregate: ONLY(LB.STUDYID)
    USUBJID: LB.USUBJID
    LBSEQ: LB.LBSEQ
    _IS_UNDER: '''Y'''
    _IS_EOT: '''Y'''
