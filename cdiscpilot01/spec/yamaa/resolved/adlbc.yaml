  derivation: ADSL_SBJ.TRT01P
  submission:
    mandatory: false
    data_type: text
    length: 20
    codelist: ARM
    origins:
    - type: Derived
    comment: ADSL.TRT01P
- name: TRTPN
  type: float
  label: Planned Treatment (N)
  derivation: ADSL_SBJ.TRT01PN
  submission:
    mandatory: false
    data_type: integer
    length: 8
    codelist: ARMN
    origins:
    - type: Derived
    comment: ADSL.TRT01PN
- name: TRTA
  type: str
