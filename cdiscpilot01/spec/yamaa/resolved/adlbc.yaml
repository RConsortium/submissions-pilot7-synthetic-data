  type: float
  label: Amount Threshold Range
  submission:
    mandatory: false
    data_type: float
    length: 8
    significant_digits: 3
    origins:
    - type: Derived
    comment: Maximum of [LBSTRESN-(1.5*ULN)] and [(.5*LLN) - LBSTRESN]
- name: _PARAMCD_BASE
  type: str
  label: 'Working value: _PARAMCD_BASE'
- name: _IS_LAST_ELIGIBLE
  type: int
  label: 'Working value: _IS_LAST_ELIGIBLE'
- name: AENTMTFL
  type: str
  label: Last value in treatment visit
  derivation:
    case:
    - when: _IS_EOT = 'Y'
      then: '''Y'''
    - when: _IS_LAST_ELIGIBLE = 1
      then: '''Y'''
    - otherwise: ''''''
  submission:
    mandatory: false
    data_type: text
    length: 1
    codelist: Y_BLANK
    origins:
    - type: Derived
    comment: 'Last observed value for this lab parameter during treatment phase: ''Y''
      if VISITNUM=12, if subject discontinues prior to VISIT 12, then this variable
      is set to ''Y'' if this is the last assessment of this analyte for the subject'
- name: _SCHED
  type: str
  label: 'Working value: _SCHED'
- name: _PREV_AVAL
  type: float
  label: 'Working value: _PREV_AVAL'
- name: _U_RAW
  type: float
  label: 'Working value: _U_RAW'
- name: _U_AVAL
  type: float
  label: 'Working value: _U_AVAL'
  derivation:
    case:
    - when: _IS_UNDER = 'Y' AND _SCHED = 'Y'
      then:
        round_half_away_from_zero:
          source: _U_RAW
          digits: 1
    - otherwise: null
- name: _RANK_VAL
  type: float
  label: 'Working value: _RANK_VAL'
  derivation:
    case:
    - when: _IS_UNDER = 'Y'
      then: abs(_U_AVAL)
    - otherwise: ALBTRVAL
- name: _ANL01_RANK
  type: int
  label: 'Working value: _ANL01_RANK'
  derivation:
    rank:
      method: competition
      window:
        group_by:
        - USUBJID
        - PARAMCD
        order_by:
        - variable: _RANK_VAL
          direction: desc
          nulls: last
        - variable: _RANK_AVISITN
          direction: asc
          nulls: last
        - variable: _ADT_DATE
          direction: asc
          nulls: last
        - variable: LBSEQ
          direction: asc
          nulls: last
        filter: _RANK_AVISITN >= 2 AND _RANK_AVISITN <= 24
