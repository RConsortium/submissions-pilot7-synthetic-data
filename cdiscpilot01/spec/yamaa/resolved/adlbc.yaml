yamaa: '1.0'
type: spec
model: ADaM
domain: ADLBC
keys:
- STUDYID
- USUBJID
- PARAMCD
- LBSEQ
- AVISIT
input:
  LB:
    path: ../../../data/sdtm/lb.parquet
    relative_to: entry
    empty_string: present
  ADSL:
    path: ../../../data/adam/adsl-yamaa.parquet
    relative_to: entry
    schema: adsl.yaml
    empty_string: present
base: LB
output:
  path: ../../../data/adam/adlbc-yamaa.parquet
  relative_to: entry
  columns:
  - STUDYID
  - SUBJID
  - USUBJID
  - TRTP
  - TRTPN
  - TRTA
  - TRTAN
  - TRTSDT
  - TRTEDT
  - AGE
  - AGEGR1
  - AGEGR1N
  - RACE
  - RACEN
  - SEX
  - COMP24FL
  - DSRAEFL
  - SAFFL
  - AVISIT
  - AVISITN
  - ADY
  - ADT
  - VISIT
  - VISITNUM
  - PARAM
  - PARAMCD
  - PARAMN
  - PARCAT1
  - AVAL
  - BASE
  - CHG
  - A1LO
  - A1HI
  - R2A1LO
  - R2A1HI
  - BR2A1LO
  - BR2A1HI
  - ANL01FL
  - ALBTRVAL
  - ANRIND
  - BNRIND
  - ABLFL
  - AENTMTFL
  - LBSEQ
  - LBNRIND
  - LBSTRESN
  order_by:
  - variable: USUBJID
    direction: asc
    nulls: last
  - variable: ADY
    direction: asc
    nulls: last
  - variable: PARAMN
    direction: asc
    nulls: last
  - variable: AVISITN
    direction: asc
    nulls: last
intermediates:
- id: ADSL_SBJ
  dataset: ADSL
  key:
  - USUBJID
- id: PREV
  dataset: LB
  key:
  - USUBJID
  - LBTESTCD
  - LBSEQ
  filter: LB.VISIT NOT LIKE 'UNSCHEDULED%'
  columns:
  - PREV_AVAL
  derivations:
    PREV_AVAL:
      row_value:
        source: LB.LBSTRESN
        offset: -1
        window:
          group_by:
          - LB.USUBJID
          - LB.LBTESTCD
          order_by:
          - variable: LB.LBDTC
            direction: asc
            nulls: last
          - variable: LB.LBSEQ
            direction: asc
            nulls: last
          filter: LB.VISIT NOT LIKE 'UNSCHEDULED%'
columns:
- name: STUDYID
  type: str
  label: Study Identifier
  submission:
    mandatory: false
    data_type: text
    length: 12
    origins:
    - type: Derived
    comment: ADSL.STUDYID
- name: USUBJID
  type: str
  label: Unique Subject Identifier
  submission:
    key_sequence: 1
    mandatory: false
    data_type: text
    length: 11
    origins:
    - type: Derived
    comment: ADSL.USUBJID
- name: SUBJID
  type: str
  label: Subject Identifier for the Study
  derivation: ADSL_SBJ.SUBJID
  submission:
    mandatory: false
    data_type: text
    length: 4
    origins:
    - type: Derived
    comment: ADSL.SUBJID
- name: TRTP
  type: str
