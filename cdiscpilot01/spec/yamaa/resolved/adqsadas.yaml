- name: BASE
  type: float
  label: Baseline Value
  derivation:
    aggregate:
      filter: ABLFL = 'Y'
      group_by:
      - STUDYID
      - USUBJID
      - PARAMCD
      expr: ONLY(AVAL)
  submission:
    mandatory: false
    data_type: integer
    length: 8
    origins:
    - type: Derived
    comment: QS.QSSTRESN when QS.QSBLFL=Y (QS.VISITNUM=3)
- name: CHG
  type: float
  label: Baseline Value
  derivation:
    case:
    - when: ABLFL <> 'Y'
      then: AVAL - BASE
  submission:
    mandatory: false
    data_type: integer
    length: 8
    origins:
    - type: Derived
    comment: AVAL - BASE
- name: PCHG
  type: float
  label: Percent Change from Baseline
  derivation:
    case:
    - when: ABLFL <> 'Y' AND BASE <> 0
      then: 100 * (AVAL - BASE) / BASE
  submission:
    mandatory: false
    data_type: integer
    length: 8
    origins:
    - type: Derived
    comment: 100* (CHG/BASE)
rows:
- id: obs
  dataset: QS
  filter: QS.QSTESTCD IN ('ACITM01','ACITM02','ACITM03','ACITM04','ACITM05','ACITM06','ACITM07','ACITM08','ACITM09','ACITM10','ACITM11','ACITM12','ACITM13','ACITM14','ACTOT')
  derivations:
    QSSEQ: QS.QSSEQ
    PARAMCD: QS.QSTESTCD
    ADT:
      impute:
        type: date
        source: QS.QSDTC
        day: 1
    ADY:
      study_day:
        source: ADT
        reference: TRTSDT
    AVISIT:
      case:
      - when: ADY <= 1
        then: '''Baseline'''
      - when: ADY >= 2 AND ADY <= 84
        then: '''Week 8'''
      - when: ADY >= 85 AND ADY <= 140
        then: '''Week 16'''
      - otherwise: '''Week 24'''
    AVAL:
      case:
      - when: PARAMCD = 'ACTOT'
        then: _CARRIED_AVAL
      - otherwise: QS.QSSTRESN
    AVISITN:
      mapping:
        source: AVISIT
        dict:
          Baseline: 0.0
          Week 8: 8.0
          Week 16: 16.0
          Week 24: 24.0
        case_sensitive: true
    VISIT: QS.VISIT
    VISITNUM: QS.VISITNUM
    AWTARGET:
      mapping:
        source: AVISIT
        dict:
          Baseline: 1.0
          Week 8: 56.0
          Week 16: 112.0
          Week 24: 168.0
        case_sensitive: true
    AWTDIFF: ABS(AWTARGET - ADY)
    _DIFF: AWTARGET - ADY
    _RN_ANL:
      row_number:
        window:
          group_by:
          - STUDYID
          - USUBJID
          - PARAMCD
          - AVISIT
          order_by:
          - variable: AWTDIFF
            direction: asc
            nulls: last
          - variable: _DIFF
            direction: asc
            nulls: last
    ABLFL:
      flag:
        condition: QS.QSBLFL = 'Y'
        true_value: Y
        false_value: ''
        missing: ''
    ANL01FL:
      flag:
        condition: _RN_ANL = 1
        true_value: Y
        false_value: ''
        missing: ''
    DTYPE:
      case:
      - when: PARAMCD = 'ACTOT' AND (AVAL <> QS.QSSTRESN OR (AVAL IS NOT NULL AND
          QS.QSSTRESN IS NULL))
        then: '''LOCF'''
      - otherwise: ''''''
    _HIT: null
    _SRC_QSSEQ: null
    _SRC_AVAL: null
    _SRC_ADY: null
    _SRC_ADT: null
    _SRC_VISIT: null
    _SRC_VISITNUM: null
    _SELECTED_AVAL:
      case:
      - when: ANL01FL = 'Y'
        then: QS.QSSTRESN
    _CARRIED_AVAL:
      locf:
        source: _SELECTED_AVAL
        include_current: true
        window:
          group_by:
          - STUDYID
          - USUBJID
          - PARAMCD
          order_by:
          - variable: ADY
            direction: asc
            nulls: last
          - variable: QSSEQ
            direction: asc
            nulls: last
