yamaa: '1.0'
type: spec
model: ADaM
domain: ADQSADAS
keys:
- STUDYID
- USUBJID
- PARAMCD
- AVISITN
- QSSEQ
input:
  QS:
    path: ../../../data/sdtm/qs.parquet
    relative_to: entry
    empty_string: present
  ADSL:
    path: ../../../data/adam/adsl-yamaa.parquet
    relative_to: entry
    schema: adsl.yaml
    empty_string: present
    key:
    - STUDYID
    - USUBJID
base: QS
output:
  path: ../../../data/adam/adqsadas-yamaa.parquet
  relative_to: entry
  columns:
  - STUDYID
  - SITEID
  - SITEGR1
  - USUBJID
  - TRTSDT
  - TRTEDT
  - TRTP
  - TRTPN
  - AGE
  - AGEGR1
  - AGEGR1N
  - RACE
  - RACEN
  - SEX
  - ITTFL
  - EFFFL
  - COMP24FL
  - AVISIT
  - AVISITN
  - VISIT
  - VISITNUM
  - ADY
  - ADT
  - PARAM
  - PARAMCD
  - PARAMN
  - AVAL
  - BASE
  - CHG
  - PCHG
  - ABLFL
  - ANL01FL
  - DTYPE
  - AWRANGE
  - AWTARGET
  - AWTDIFF
  - AWLO
  - AWHI
  - AWU
  - QSSEQ
  order_by:
  - variable: USUBJID
    direction: asc
    nulls: last
  - variable: PARAMN
    direction: asc
    nulls: last
  - variable: AVISITN
    direction: asc
    nulls: last
  - variable: QSSEQ
    direction: asc
    nulls: last
intermediates:
- id: DONOR8
  dataset: SELF
  key:
  - STUDYID
  - USUBJID
  filter: SELF.PARAMCD = 'ACTOT' AND SELF.AVISITN <= 8
  order_by:
  - variable: SELF.AVISITN
    direction: desc
    nulls: last
  - variable: SELF.ADY
    direction: desc
    nulls: last
  - variable: SELF.QSSEQ
    direction: desc
    nulls: last
  keep: first
  columns:
  - QSSEQ
  - AVAL
  - ADY
  - ADT
  - VISIT
  - VISITNUM
  - AVISITN
- id: DONOR16
  dataset: SELF
  key:
  - STUDYID
  - USUBJID
  filter: SELF.PARAMCD = 'ACTOT' AND SELF.AVISITN <= 16
  order_by:
  - variable: SELF.AVISITN
    direction: desc
    nulls: last
  - variable: SELF.ADY
    direction: desc
    nulls: last
  - variable: SELF.QSSEQ
    direction: desc
    nulls: last
  keep: first
  columns:
  - QSSEQ
  - AVAL
  - ADY
  - ADT
  - VISIT
  - VISITNUM
  - AVISITN
- id: DONOR24
  dataset: SELF
  key:
  - STUDYID
  - USUBJID
  filter: SELF.PARAMCD = 'ACTOT' AND SELF.AVISITN <= 24
  order_by:
  - variable: SELF.AVISITN
    direction: desc
    nulls: last
  - variable: SELF.ADY
    direction: desc
    nulls: last
  - variable: SELF.QSSEQ
    direction: desc
    nulls: last
  keep: first
  columns:
  - QSSEQ
  - AVAL
  - ADY
  - ADT
  - VISIT
  - VISITNUM
  - AVISITN
columns:
- name: STUDYID
  type: str
  label: Study Identifier
  derivation: QS.STUDYID
  submission:
    mandatory: false
    data_type: text
    length: 12
    origins:
    - type: Derived
    comment: ADSL.STUDYID
- name: USUBJID
  type: str
  label: Unique Subject Identifier
  derivation: QS.USUBJID
  submission:
    key_sequence: 1
    mandatory: false
    data_type: text
    length: 11
    origins:
    - type: Derived
    comment: ADSL.USUBJID
- name: SITEID
  type: str
  label: Study Site Identifier
  derivation: ADSL.SITEID
  submission:
    mandatory: false
    data_type: text
    length: 3
    origins:
    - type: Derived
    comment: ADSL.SITEID
- name: SITEGR1
  type: str
  label: Pooled Site Group 1
  derivation: ADSL.SITEGR1
  submission:
    mandatory: false
    data_type: text
    length: 3
    origins:
    - type: Derived
    comment: ADSL.SITEGR1
- name: TRTSDT
  type: date
  label: Date of First Exposure to Treatment
  derivation: ADSL.TRTSDT
  submission:
    mandatory: false
    data_type: integer
    length: 8
    display_format: DATE9.
    origins:
    - type: Derived
    comment: ADSL.TRTSDT
- name: TRTEDT
  type: date
  label: Date of Last Exposure to Treatment
  derivation: ADSL.TRTEDT
  submission:
    mandatory: false
    data_type: integer
    length: 8
    display_format: DATE9.
    origins:
    - type: Derived
    comment: ADSL.TRTEDT
- name: TRTP
  type: str
  label: Planned Treatment
  derivation: ADSL.TRT01P
  submission:
    mandatory: false
    data_type: text
    length: 20
    codelist: ARM
    origins:
    - type: Derived
    comment: ADSL.TRT01P
- name: TRTPN
  type: float
  label: Planned Treatment (N)
  derivation: ADSL.TRT01PN
  submission:
    mandatory: false
    data_type: integer
    length: 8
    codelist: ARMN
    origins:
    - type: Derived
    comment: ADSL.TRT01PN
- name: AGE
  type: float
  label: Age
  derivation: ADSL.AGE
  submission:
    mandatory: false
    data_type: integer
    length: 8
    origins:
    - type: Derived
    comment: ADSL.AGE
- name: AGEGR1
  type: str
  label: Pooled Age Group 1
  derivation: ADSL.AGEGR1
  submission:
    mandatory: false
    data_type: text
    length: 5
    codelist: AGEGR1
    origins:
    - type: Derived
    comment: ADSL.AGEGR1
- name: AGEGR1N
  type: float
  label: Pooled Age Group 1 (N)
  derivation: ADSL.AGEGR1N
  submission:
    mandatory: false
    data_type: integer
    length: 8
    codelist: AGEGR1N
    origins:
    - type: Derived
    comment: ADSL.AGEGR1N
- name: RACE
  type: str
  label: Race
  derivation: ADSL.RACE
  submission:
    mandatory: false
    data_type: text
    length: 32
    codelist: RACE
    origins:
    - type: Derived
    comment: ADSL.RACE
- name: RACEN
  type: float
  label: Race (N)
  derivation: ADSL.RACEN
  submission:
    mandatory: false
    data_type: integer
    length: 8
    codelist: RACEN
    origins:
    - type: Derived
    comment: ADSL.RACEN
- name: SEX
  type: str
  label: Sex
  derivation: ADSL.SEX
  submission:
    mandatory: false
    data_type: text
    length: 1
    codelist: SEX
    origins:
    - type: Derived
    comment: ADSL.SEX
- name: ITTFL
  type: str
  label: Intent-to-Treat Population Flag
  derivation: ADSL.ITTFL
  submission:
    mandatory: false
    data_type: text
    length: 1
    codelist: YN
    origins:
    - type: Derived
    comment: ADSL.ITTFL
- name: EFFFL
  type: str
  label: Efficacy Population Flag
  derivation: ADSL.EFFFL
  submission:
    mandatory: false
    data_type: text
    length: 1
    codelist: YN
    origins:
    - type: Derived
    comment: ADSL.FASFL
- name: COMP24FL
  type: str
  label: Completers of Week 24 Population Flag
  derivation: ADSL.COMP24FL
  submission:
    mandatory: false
    data_type: text
    length: 1
    codelist: YN
    origins:
    - type: Derived
    comment: ADSL.COMP24FL
- name: PARAMCD
  type: str
  label: Parameter Code
  submission:
    key_sequence: 2
    mandatory: false
    data_type: text
    length: 8
    codelist: PARAMCD_ADQSADAS
    origins:
    - type: Derived
- name: PARAM
  type: str
  label: Parameter
  derivation:
    mapping:
      source: PARAMCD
      dict:
        ACITM01: Word Recall Task
        ACITM02: Naming Objects And Fingers (Refer To 5 C
        ACITM03: Delayed Word Recall
        ACITM04: Commands
        ACITM05: Constructional Praxis
        ACITM06: Ideational Praxis
        ACITM07: Orientation
        ACITM08: Word Recognition
        ACITM09: Attention/Visual Search Task
        ACITM10: Maze Solution
        ACITM11: Spoken Language Ability
        ACITM12: Comprehension Of Spoken Language
        ACITM13: Word Finding Difficulty In Spontaneous S
        ACITM14: Recall Of Test Instructions
        ACTOT: Adas-Cog(11) Subscore
      case_sensitive: true
  submission:
    mandatory: false
    data_type: text
    length: 100
    codelist: PARAM_ADQSADAS
    origins:
    - type: Derived
- name: PARAMN
  type: float
  label: Parameter (N)
  derivation:
    mapping:
      source: PARAMCD
      dict:
        ACITM01: 1.0
        ACITM02: 2.0
        ACITM03: 3.0
        ACITM04: 4.0
        ACITM05: 5.0
        ACITM06: 6.0
        ACITM07: 7.0
        ACITM08: 8.0
        ACITM09: 9.0
        ACITM10: 10.0
        ACITM11: 11.0
        ACITM12: 12.0
        ACITM13: 13.0
        ACITM14: 14.0
        ACTOT: 15.0
      case_sensitive: true
  submission:
    mandatory: false
    data_type: integer
    length: 8
    codelist: PARAMN_ADQSADAS
    origins:
    - type: Derived
    comment: Assign a numeric code for each value of PARAMCD (see codelistPARAMN_ADQSADAS)
- name: ABLFL
  type: str
  label: ABLFL
  submission:
    mandatory: false
    data_type: text
    length: 1
    codelist: Y_BLANK
    origins:
    - type: Derived
    comment: QS.QSBLFL
- name: _HIT
  type: float
  label: QSSEQ of an observed ANL01FL record at the LOCF visit, if any (internal)
- name: _SRC_QSSEQ
  type: float
  label: carried QSSEQ (internal)
- name: _SRC_AVAL
  type: float
  label: carried AVAL (internal)
- name: _SRC_ADY
  type: float
  label: carried ADY (internal)
- name: _SRC_ADT
  type: date
  label: carried ADT (internal)
- name: ADT
  type: date
  label: Analysis Date
  submission:
    key_sequence: 4
    mandatory: false
    data_type: integer
    length: 8
    display_format: DATE9.
    origins:
    - type: Derived
    comment: SAS date from QS.QSDTC
- name: ADY
  type: float
  label: Analysis Relative Day
  submission:
    mandatory: false
    data_type: integer
    length: 8
    origins:
    - type: Derived
    comment: ADY = ADT - TRTSDT + 1, if ADT>=TRTSDT. ADY = ADT - TRTSDT, if ADT<TRTSDT.
- name: AVISIT
  type: str
  label: Analysis Visit
  submission:
    key_sequence: 3
    mandatory: false
    data_type: text
    length: 16
    codelist: AVISIT
    origins:
    - type: Derived
    comment: Derived based on windowing algorithm described in SAP, Section 8.2
- name: AVISITN
  type: float
  label: Analysis Visit (N)
  submission:
    mandatory: false
    data_type: integer
    length: 8
    significant_digits: 1
    codelist: AVISITN
    origins:
    - type: Derived
    comment: Numeric code for AVISIT
- name: AWTARGET
  type: float
  label: Analysis Window Target
  submission:
    mandatory: false
    data_type: integer
    length: 8
    origins:
    - type: Derived
    comment: Target day within the window, specified in the SAP.
- name: AWTDIFF
  type: float
  label: Analysis Window Diff from Target
  submission:
    mandatory: false
    data_type: integer
    length: 8
    origins:
    - type: Derived
    comment: Absolute difference between AWTARGET and ADY
- name: _DIFF
  type: float
  label: signed AWTARGET-ADY (internal)
- name: _RN_ANL
  type: float
  label: rank by window closeness within subject-param-visit (internal)
  derivation: 1.0
- name: ANL01FL
  type: str
  label: Analysis Record Flag 01
  submission:
    mandatory: false
    data_type: text
    length: 1
    codelist: Y_BLANK
    origins:
    - type: Derived
    comment: If multiple visits fall into the same visit window, then the one closest
      to the target date is chosen for analysis. These are flagged with ANL01FL="Y".
- name: _SRC_VISIT
  type: str
  label: carried VISIT (internal)
- name: VISIT
  type: str
  label: Visit Name
  submission:
    mandatory: false
    data_type: text
    length: 19
    codelist: VISIT
    origins:
    - type: Derived
    comment: QS.VISIT
- name: _SRC_VISITNUM
  type: float
  label: carried VISITNUM (internal)
- name: VISITNUM
  type: float
  label: Visit Number
  submission:
    mandatory: false
    data_type: float
    length: 8
    significant_digits: 1
    codelist: VISITNUM
    origins:
    - type: Derived
    comment: QS.VISITNUM
- name: QSSEQ
  type: float
  label: Sequence Number
  submission:
    mandatory: false
    data_type: integer
    length: 8
    origins:
    - type: Derived
    value_level:
    - id: ACITM01
      where:
        PARAMCD:
        - ACITM01
      label: Word Recall Task
      mandatory: false
      data_type: integer
      length: 8
      origins:
      - type: Derived
      comment: QS.QSSEQ
    - id: ACITM02
      where:
        PARAMCD:
        - ACITM02
      label: Naming Objects And Fingers (Refer To 5 C
      mandatory: false
      data_type: integer
      length: 8
      origins:
      - type: Derived
      comment: QS.QSSEQ
    - id: ACITM03
      where:
        PARAMCD:
        - ACITM03
      label: Delayed Word Recall
      mandatory: false
      data_type: integer
      length: 8
      origins:
      - type: Derived
      comment: QS.QSSEQ
    - id: ACITM04
      where:
        PARAMCD:
        - ACITM04
      label: Commands
      mandatory: false
      data_type: integer
      length: 8
      origins:
      - type: Derived
      comment: QS.QSSEQ
    - id: ACITM05
      where:
        PARAMCD:
        - ACITM05
      label: Constructional Praxis
      mandatory: false
      data_type: integer
      length: 8
      origins:
      - type: Derived
      comment: QS.QSSEQ
    - id: ACITM06
      where:
        PARAMCD:
        - ACITM06
      label: Ideational Praxis
      mandatory: false
      data_type: integer
      length: 8
      origins:
      - type: Derived
      comment: QS.QSSEQ
    - id: ACITM07
      where:
        PARAMCD:
        - ACITM07
      label: Orientation
      mandatory: false
      data_type: integer
      length: 8
      origins:
      - type: Derived
      comment: QS.QSSEQ
    - id: ACITM08
      where:
        PARAMCD:
        - ACITM08
      label: Word Recognition
      mandatory: false
      data_type: integer
      length: 8
      origins:
      - type: Derived
      comment: QS.QSSEQ
    - id: ACITM09
      where:
        PARAMCD:
        - ACITM09
      label: Attention/Visual Search Task
      mandatory: false
      data_type: integer
      length: 8
      origins:
      - type: Derived
      comment: QS.QSSEQ
    - id: ACITM10
      where:
        PARAMCD:
        - ACITM10
      label: Maze Solution
      mandatory: false
      data_type: integer
      length: 8
      origins:
      - type: Derived
      comment: QS.QSSEQ
    - id: ACITM11
      where:
        PARAMCD:
        - ACITM11
      label: Spoken Language Ability
      mandatory: false
      data_type: integer
      length: 8
      origins:
      - type: Derived
      comment: QS.QSSEQ
    - id: ACITM12
      where:
        PARAMCD:
        - ACITM12
      label: Comprehension Of Spoken Language
      mandatory: false
      data_type: integer
      length: 8
      origins:
      - type: Derived
      comment: QS.QSSEQ
    - id: ACITM13
      where:
        PARAMCD:
        - ACITM13
      label: Word Finding Difficulty In Spontaneous S
      mandatory: false
      data_type: integer
      length: 8
      origins:
      - type: Derived
      comment: QS.QSSEQ
    - id: ACITM14
      where:
        PARAMCD:
        - ACITM14
      label: Recall Of Test Instructions
      mandatory: false
      data_type: integer
      length: 8
      origins:
      - type: Derived
      comment: QS.QSSEQ
    - id: ACTOT
      where:
        PARAMCD:
        - ACTOT
      label: Adas-Cog(11) Subscore
      mandatory: false
      data_type: integer
      length: 8
      origins:
      - type: Derived
      comment: Set QSSEQ to missing for post baseline records. Set to QS.QSSEQ where
        QS.VISIT=BASELINE and QS.QSTESTCD=ACTOT.
- name: AWRANGE
  type: str
  label: Analysis Window Valid Relative Range
  derivation:
    mapping:
      source: AVISIT
      dict:
        Baseline: <=1
        Week 8: 2-84
        Week 16: 85-140
        Week 24: '>140'
      case_sensitive: true
  submission:
    mandatory: false
    data_type: text
    length: 9
    origins:
    - type: Derived
    comment: Window range, specified in the SAP.
- name: AWLO
  type: float
  label: Analysis Window Beginning Timepoint
  derivation:
    mapping:
      source: AVISIT
      dict:
        Baseline: null
        Week 8: 2.0
        Week 16: 85.0
        Week 24: 141.0
      case_sensitive: true
  submission:
    mandatory: false
    data_type: integer
    length: 8
    origins:
    - type: Derived
    comment: Start day of the window, specified in the SAP.
- name: AWHI
  type: float
  label: Analysis Window Ending Timepoint
  derivation:
    mapping:
      source: AVISIT
      dict:
        Baseline: 1.0
        Week 8: 84.0
        Week 16: 140.0
        Week 24: null
      case_sensitive: true
  submission:
    mandatory: false
    data_type: integer
    length: 8
    origins:
    - type: Derived
    comment: End day of the window, specified in the SAP.
- name: AWU
  type: str
  label: Analysis Window Unit
  derivation: '''DAYS'''
  submission:
    mandatory: false
    data_type: text
    length: 4
    codelist: AWU
    origins:
    - type: Derived
    comment: Assigned as "DAYS".
- name: _SELECTED_AVAL
  type: float
  label: Selected observed score (helper)
- name: _CARRIED_AVAL
  type: float
  label: Carried selected score (helper)
- name: AVAL
  type: float
  label: Analysis Value
  submission:
    mandatory: false
    data_type: integer
    length: 8
    origins:
    - type: Derived
    value_level:
    - id: ACITM01
      where:
        PARAMCD:
        - ACITM01
      label: Word Recall Task
      mandatory: false
      data_type: integer
      length: 8
      origins:
      - type: Derived
      comment: QS.QSSTRESN where QSTESTCD=PARAMCD
    - id: ACITM02
      where:
        PARAMCD:
        - ACITM02
      label: Naming Objects And Fingers (Refer To 5 C
      mandatory: false
      data_type: integer
      length: 8
      origins:
      - type: Derived
      comment: QS.QSSTRESN where QSTESTCD=PARAMCD
    - id: ACITM03
      where:
        PARAMCD:
        - ACITM03
      label: Delayed Word Recall
      mandatory: false
      data_type: integer
      length: 8
      origins:
      - type: Derived
      comment: QS.QSSTRESN where QSTESTCD=PARAMCD
    - id: ACITM04
      where:
        PARAMCD:
        - ACITM04
      label: Commands
      mandatory: false
      data_type: integer
      length: 8
      origins:
      - type: Derived
      comment: QS.QSSTRESN where QSTESTCD=PARAMCD
    - id: ACITM05
      where:
        PARAMCD:
        - ACITM05
      label: Constructional Praxis
      mandatory: false
      data_type: integer
      length: 8
      origins:
      - type: Derived
      comment: QS.QSSTRESN where QSTESTCD=PARAMCD
    - id: ACITM06
      where:
        PARAMCD:
        - ACITM06
      label: Ideational Praxis
      mandatory: false
      data_type: integer
      length: 8
      origins:
      - type: Derived
      comment: QS.QSSTRESN where QSTESTCD=PARAMCD
    - id: ACITM07
      where:
        PARAMCD:
        - ACITM07
      label: Orientation
      mandatory: false
      data_type: integer
      length: 8
      origins:
      - type: Derived
      comment: QS.QSSTRESN where QSTESTCD=PARAMCD
    - id: ACITM08
      where:
        PARAMCD:
        - ACITM08
      label: Word Recognition
      mandatory: false
      data_type: integer
      length: 8
      origins:
      - type: Derived
      comment: QS.QSSTRESN where QSTESTCD=PARAMCD
    - id: ACITM09
      where:
        PARAMCD:
        - ACITM09
      label: Attention/Visual Search Task
      mandatory: false
      data_type: integer
      length: 8
      origins:
      - type: Derived
      comment: QS.QSSTRESN where QSTESTCD=PARAMCD
    - id: ACITM10
      where:
        PARAMCD:
        - ACITM10
      label: Maze Solution
      mandatory: false
      data_type: integer
      length: 8
      origins:
      - type: Derived
      comment: QS.QSSTRESN where QSTESTCD=PARAMCD
    - id: ACITM11
      where:
        PARAMCD:
        - ACITM11
      label: Spoken Language Ability
      mandatory: false
      data_type: integer
      length: 8
      origins:
      - type: Derived
      comment: QS.QSSTRESN where QSTESTCD=PARAMCD
    - id: ACITM12
      where:
        PARAMCD:
        - ACITM12
      label: Comprehension Of Spoken Language
      mandatory: false
      data_type: integer
      length: 8
      origins:
      - type: Derived
      comment: QS.QSSTRESN where QSTESTCD=PARAMCD
    - id: ACITM13
      where:
        PARAMCD:
        - ACITM13
      label: Word Finding Difficulty In Spontaneous S
      mandatory: false
      data_type: integer
      length: 8
      origins:
      - type: Derived
      comment: QS.QSSTRESN where QSTESTCD=PARAMCD
    - id: ACITM14
      where:
        PARAMCD:
        - ACITM14
      label: Recall Of Test Instructions
      mandatory: false
      data_type: integer
      length: 8
      origins:
      - type: Derived
      comment: QS.QSSTRESN where QSTESTCD=PARAMCD
    - id: ACTOT
      where:
        PARAMCD:
        - ACTOT
      label: Adas-Cog(11) Subscore
      mandatory: false
      data_type: integer
      length: 8
