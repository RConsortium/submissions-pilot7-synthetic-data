# Reproduce the submitted baseline rules, including package-specific
# conventions.
yamaa: "1.0"
type: spec
model: ADaM

columns:
  - name: HEIGHTBL
    type: float
    label: Baseline Height (cm)
    derivation: "FLOOR(BASE_HT.VSSTRESN * 10 + 0.5) / 10"

  - name: WEIGHTBL
    type: float
    label: Baseline Weight (kg)
    derivation: "FLOOR(BASE_WT.VSSTRESN * 10 + 0.5) / 10"

  - name: BMIBL_RAW
    type: float
    label: Baseline BMI unrounded
    derivation: "WEIGHTBL / POWER(NULLIF(HEIGHTBL, 0) / 100, 2)"

  - name: BMIBL
    type: float
    label: Baseline BMI (kg/m^2)
    derivation: "FLOOR(BMIBL_RAW * 10 + 0.5) / 10"

  - name: BMIBLGR1
    type: str
    label: Pooled Baseline BMI Group 1
    derivation:
      case:
        - when: "BMIBL IS NULL"
          then: "'<25'"
        - when: "BMIBL < 25"
          then: "'<25'"
        - when: "BMIBL < 30"
          then: "'25-<30'"
        - otherwise: "'>=30'"

  - name: EDUCLVL
    type: float
    label: Years of Education
    derivation: SC_EDU.SCSTRESN

  - name: MH_DTC
    type: str
    label: Diagnosis onset (character)
    derivation: MH_DX.MHSTDTC

  - name: DISONSDT
    type: date
    label: Date of Onset of Disease
    derivation:
      impute:
        type: date
        source: MH_DTC
        month: 1
        day: 1
        invalid:

  - name: SV1_DTC
    type: str
    label: Visit 1 date (character)
    derivation: SV1.SVSTDTC

  - name: VISIT1DT
    type: date
    label: Date of Visit 1
    derivation:
      impute:
        type: date
        source: SV1_DTC
        month: 1
        day: 1
        invalid:

  - name: DURDIS_DAYS
    type: float
    label: Disease duration days +1
    derivation:
      diff:
        type: date
        start: DISONSDT
        end: VISIT1DT
        unit: day
        closed: both

  - name: DURDIS
    type: float
    label: Duration of Disease (Months)
    derivation: "FLOOR(DURDIS_DAYS / 30.4375 * 10 + 0.5) / 10"

  - name: DURDSGR1
    type: str
    label: Pooled Disease Duration Group 1
    derivation:
      case:
        - when: "DURDIS < 12"
          then: "'<12'"
        - otherwise: "'>=12'"

  - name: MMSETOT
    type: float
    label: MMSE Total
    derivation:
      aggregate:
        expr: "SUM(QS.QSSTRESN)"
        filter: "QS.QSCAT = 'MINI-MENTAL STATE'"
        key:
          - STUDYID
          - USUBJID
