# Reproduce the submitted population rules, including package-specific
# conventions.
yamaa: "1.0"
type: spec
model: ADaM

columns:
  - name: SITEGR1
    type: str
    label: Pooled Site Group 1
    derivation:
      case:
        - when: "DM.SITEID IN ('702','706','707','711','714','715','717')"
          then: "'900'"
        - otherwise: DM.SITEID

  - name: TRT01PN
    type: float
    label: Planned Treatment for Period 01 (N)
    derivation:
      mapping:
        source: DM.ARM
        dict:
          Placebo: 0
          Xanomeline Low Dose: 54
          Xanomeline High Dose: 81

  - name: TRT01A
    type: str
    label: Actual Treatment for Period 01
    derivation: DM.ARM

  - name: TRT01AN
    type: float
    label: Actual Treatment for Period 01 (N)
    derivation:
      mapping:
        source: DM.ARM
        dict:
          Placebo: 0
          Xanomeline Low Dose: 54
          Xanomeline High Dose: 81

  - name: AGEGR1
    type: str
    label: Pooled Age Group 1
    derivation:
      case:
        - when: "DM.AGE < 65"
          then: "'<65'"
        - when: "DM.AGE <= 80"
          then: "'65-80'"
        - otherwise: "'>80'"

  - name: AGEGR1N
    type: float
    label: Pooled Age Group 1 (N)
    derivation:
      mapping:
        source: AGEGR1
        dict:
          "<65": 1
          "65-80": 2
          ">80": 3

  - name: RACEN
    type: float
    label: Race (N)
    derivation:
      mapping:
        source: DM.RACE
        dict:
          WHITE: 1
          BLACK OR AFRICAN AMERICAN: 2
          AMERICAN INDIAN OR ALASKA NATIVE: 6

  - name: ITTFL
    type: str
    label: Intent-To-Treat Population Flag
    derivation:
      case:
        - when: "DM.ARMCD <> ''"
          then: "'Y'"
        - otherwise: "'N'"

  - name: SAFFL
    type: str
    label: Safety Population Flag
    derivation:
      case:
        - when: "ITTFL = 'Y' AND TRTSDT IS NOT NULL"
          then: "'Y'"
        - otherwise: "'N'"

  - name: EFFFL
    type: str
    label: Efficacy Population Flag
    derivation:
      case:
        - when: >-
            SAFFL = 'Y' AND QS_ADAS.QSSEQ IS NOT NULL AND QS_CIBIC.QSSEQ
            IS NOT NULL
          then: "'Y'"
        - otherwise: "'N'"

  - name: SV8_DTC
    type: str
    label: Visit 8 date (character)
    derivation: SV8.SVSTDTC

  - name: SV8DT
    type: date
    label: Visit 8 date
    derivation:
      impute:
        type: date
        source: SV8_DTC
        month: 1
        day: 1
        invalid:

  - name: RFENDTC
    type: str
    label: Subject Reference End Date/Time
    derivation: DM.RFENDTC

  - name: RFENDT
    type: date
    label: Date of Discontinuation/Completion
    derivation:
      impute:
        type: date
        source: RFENDTC
        month: 1
        day: 1
        invalid:

  - name: COMP8FL
    type: str
    label: Completers of Week 8 Population Flag
    derivation:
      case:
        - when: "SV8DT IS NOT NULL AND RFENDT >= SV8DT"
          then: "'Y'"
        - otherwise: "'N'"

  - name: SV10_DTC
    type: str
    label: Visit 10 date (character)
    derivation: SV10.SVSTDTC

  - name: SV10DT
    type: date
    label: Visit 10 date
    derivation:
      impute:
        type: date
        source: SV10_DTC
        month: 1
        day: 1
        invalid:

  - name: COMP16FL
    type: str
    label: Completers of Week 16 Population Flag
    derivation:
      case:
        - when: "SV10DT IS NOT NULL AND RFENDT >= SV10DT"
          then: "'Y'"
        - otherwise: "'N'"

  - name: SV12_DTC
    type: str
    label: Visit 12 date (character)
    derivation: SV12.SVSTDTC

  - name: SV12DT
    type: date
    label: Visit 12 date
    derivation:
      impute:
        type: date
        source: SV12_DTC
        month: 1
        day: 1
        invalid:

  - name: COMP24FL
    type: str
    label: Completers of Week 24 Population Flag
    derivation:
      case:
        - when: "SV12DT IS NOT NULL AND RFENDT >= SV12DT"
          then: "'Y'"
        - otherwise: "'N'"

  - name: DCDECOD
    type: str
    label: Standardized Disposition Term
    derivation: DS_DISP.DSDECOD

  - name: DS_DSTERM
    type: str
    label: Disposition term (character)
    derivation: DS_DISP.DSTERM

  - name: DC_REAS_MAP
    type: str
    label: Discontinuation reason mapped
    derivation:
      mapping:
        source: DCDECOD
        dict:
          ADVERSE EVENT: Adverse Event
          COMPLETED: Completed
          DEATH: Death
          LACK OF EFFICACY: Lack of Efficacy
          LOST TO FOLLOW-UP: Lost to Follow-up
          PHYSICIAN DECISION: Physician Decision
          PROTOCOL VIOLATION: Protocol Violation
          STUDY TERMINATED BY SPONSOR: Sponsor Decision
          WITHDRAWAL BY SUBJECT: Withdrew Consent

  - name: DCREASCD
    type: str
    label: Reason for Discontinuation
    derivation:
      case:
        - when: "DS_DSTERM = 'PROTOCOL ENTRY CRITERIA NOT MET'"
          then: "'I/E Not Met'"
        - otherwise: DC_REAS_MAP

  - name: DISCONFL
    type: str
    label: Did the Subject Discontinue the Study?
    derivation:
      case:
        - when: "DCREASCD <> 'Completed'"
          then: "'Y'"
        - otherwise: "''"

  - name: DSRAEFL
    type: str
    label: Discontinued due to AE?
    derivation:
      case:
        - when: "DCREASCD = 'Adverse Event'"
          then: "'Y'"
        - otherwise: "''"

  - name: DTHFL
    type: str
    label: Subject Died?
    derivation: DM.DTHFL

  - name: DS_VISITNUM
    type: float
    label: Disposition visit number
    derivation: DS_DISP.VISITNUM

  - name: VISNUMEN
    type: float
    label: End of Trt Visit (Vis 12 or Early Term.)
    derivation:
      case:
        - when: "DS_VISITNUM = 13"
          then: 12
        - otherwise: DS_VISITNUM
