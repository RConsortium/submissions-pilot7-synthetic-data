# CDISC Pilot 01 ADSL: the study layer and this package's Define-XML 1.0
# metadata.
yamaa: "1.0"
type: spec
parent: ../../../spec/yamaa/cdiscpilot01/adsl.yaml
domain: ADSL

columns:
  - name: STUDYID
    submission:
      data_type: text
      length: 12
      mandatory: false
      origins:
        - type: Derived
      comment: DM.STUDYID

  - name: USUBJID
    submission:
      data_type: text
      length: 11
      mandatory: false
      key_sequence: 1
      origins:
        - type: Derived
      comment: DM.USUBJID

  - name: SUBJID
    submission:
      data_type: text
      length: 4
      mandatory: false
      origins:
        - type: Derived
      comment: DM.SUBJID

  - name: SITEID
    submission:
      data_type: text
      length: 3
      mandatory: false
      origins:
        - type: Derived
      comment: DM.SITEID

  - name: SITEGR1
    submission:
      data_type: text
      length: 3
      mandatory: false
      origins:
        - type: Derived
      comment: refer to SAP, Section 7.1 - if not pooled then
        SITEGR1=SITEID. If pooled, SITEGR1 will be 900

  - name: ARM
    submission:
      data_type: text
      length: 20
      mandatory: false
      origins:
        - type: Derived
      comment: DM.ARM
      codelist: ARM

  - name: TRT01P
    submission:
      data_type: text
      length: 20
      mandatory: false
      origins:
        - type: Derived
      comment: DM.ARM
      codelist: ARM

  - name: TRT01PN
    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: Numeric code for TRT01P which corresponds to the randomized dose
      codelist: ARMN

  - name: TRT01A
    submission:
      data_type: text
      length: 20
      mandatory: false
      origins:
        - type: Derived
      comment: TRT01A=TRT01P, i.e., no difference between
        actual and randomized treatment in this study.
      codelist: ARM

  - name: TRT01AN
    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: Numeric code for TRT01A which corresponds to the randomized dose
      codelist: ARMN

  - name: TRTSDT
    submission:
      data_type: integer
      length: 8
      mandatory: false
      display_format: DATE9.
      origins:
        - type: Derived
      comment: SV.SVSTDTC when SV.VISITNUM=3, converted to SAS date

  - name: TRTEDT
    submission:
      data_type: integer
      length: 8
      mandatory: false
      display_format: DATE9.
      origins:
        - type: Derived
      comment: The date of final dose (from the CRF) is EX.EXENDTC on the
        subject's last EX record. If the date of final dose is missing for the
        subject and the subject discontinued after visit 3,
        use the date of discontinuation as the date
        of last dose. Convert the date to a SAS date.

  - name: TRTDUR
    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: TRTEDT-TRTSDT+1

  - name: CUMDOSE
    submission:
      data_type: float
      length: 8
      mandatory: false
      significant_digits: 1
      origins:
        - type: Derived
      comment: 'For ARMN=0 or 1: CUMDOSE=TRT01PN*TRTDUR. --- For ARMN=2:
        CUMDOSE will be based on 54mg per day for the # of days subj was in 1st
        dosing interval (i.e., visit4date-TRTSTDT+1 if 1st interval completed,
        TRTEDT-TRTSTDT+1 if subj discontinued <=visit 4 and > visit 3), 81mg
        per day for the # of days subj was in 2nd dosing interval (i.e.,
        visit12date-visit4date if 2nd interval completed, TRTEDT-visit4date if
        subj discontinued <= visit 12 and > visit 4), and 54mg per day for the
        # of days subj was in 3rd dosing interval (i.e., TRTEDT - visit12date
        if subj continued after visit 12).'

  - name: AVGDD
    submission:
      data_type: float
      length: 8
      mandatory: false
      significant_digits: 1
      origins:
        - type: Derived
      comment: CUMDOSE/TRTDUR

  - name: AGE
    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: DM.AGE

  - name: AGEGR1
    submission:
      data_type: text
      length: 5
      mandatory: false
      origins:
        - type: Derived
      comment: Character variable derived from ADSL.AGEGR1N
      codelist: AGEGR1

  - name: AGEGR1N
    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: AGEGR1 = 1 if AGE <65. AGEGR1 = 2
        if AGE 65-80. AGEGR1 = 3 if AGE >80.
      codelist: AGEGR1N

  - name: AGEU
    submission:
      data_type: text
      length: 5
      mandatory: false
      origins:
        - type: Derived
      comment: DM.AGEU
      codelist: AGEU

  - name: RACE
    submission:
      data_type: text
      length: 32
      mandatory: false
      origins:
        - type: Derived
      comment: DM.RACE
      codelist: RACE

  - name: RACEN
    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: Numeric code for RACE
      codelist: RACEN

  - name: SEX
    submission:
      data_type: text
      length: 1
      mandatory: false
      origins:
        - type: Derived
      comment: DM.SEX
      codelist: SEX

  - name: ETHNIC
    submission:
      data_type: text
      length: 22
      mandatory: false
      origins:
        - type: Derived
      comment: DM.ETHNIC
      codelist: ETHNIC

  - name: ITTFL
    submission:
      data_type: text
      length: 1
      mandatory: false
      origins:
        - type: Derived
      comment: Y if ARMCD ne ' '. N otherwise
      codelist: YN

  - name: SAFFL
    submission:
      data_type: text
      length: 1
      mandatory: false
      origins:
        - type: Derived
      comment: Y if ITTFL='Y' and TRTSDT ne missing. N otherwise
      codelist: YN

  - name: EFFFL
    submission:
      data_type: text
      length: 1
      mandatory: false
      origins:
        - type: Derived
      comment: Y if SAFFL='Y AND subject has at least one record in QS for
        ADAS-Cog with VISITNUM>3 AND at least one record
        in QS for CIBIC+ with VISITNUM>3, N otherwise
      codelist: YN

  - name: RFSTDTC
    submission:
      data_type: datetime
      length: 20
      mandatory: false
      origins:
        - type: Derived
      comment: DM.RFSTDTC

  - name: RFENDTC
    submission:
      data_type: datetime
      length: 20
      mandatory: false
      origins:
        - type: Derived
      comment: DM.RFENDTC

  - name: RFENDT
    submission:
      data_type: integer
      length: 8
      mandatory: false
      display_format: DATE9.
      origins:
        - type: Derived
      comment: RFENDTC converted to SAS date

  - name: COMP8FL
    submission:
      data_type: text
      length: 1
      mandatory: false
      origins:
        - type: Derived
      comment: Y if subject has a SV.VISITNUM=8 and ENDDT >= date of visit 8,
        N otherwise
      codelist: YN

  - name: COMP16FL
    submission:
      data_type: text
      length: 1
      mandatory: false
      origins:
        - type: Derived
      comment: Y if subject has a SV.VISITNUM=10 and ENDDT>=date of visit 10,
        N otherwise
      codelist: YN

  - name: COMP24FL
    submission:
      data_type: text
      length: 1
      mandatory: false
      origins:
        - type: Derived
      comment: Y if subject has a SV.VISITNUM=12 and ENDDT>= date of visit 12 ,
        N otherwise
      codelist: YN

  - name: DCDECOD
    submission:
      data_type: text
      length: 27
      mandatory: false
      origins:
        - type: Derived
      comment: DS.DSDECOD where DSCAT='DISPOSITION EVENT'
      codelist: DISCCD

  - name: DCREASCD
    submission:
      data_type: text
      length: 18
      mandatory: false
      origins:
        - type: Derived
      comment: Grouping of DCDECOD values to support summarizing
        study completion status and reason for discontinuation
      codelist: DISCREAS

  - name: DISCONFL
    submission:
      data_type: text
      length: 1
      mandatory: false
      origins:
        - type: Derived
      comment: Y if DCREASCD ^= 'Completed'. Null otherwise
      codelist: Y_BLANK

  - name: DSRAEFL
    submission:
      data_type: text
      length: 1
      mandatory: false
      origins:
        - type: Derived
      comment: Y if DCREASCD='Adverse Event'. Null otherwise
      codelist: Y_BLANK

  - name: DTHFL
    submission:
      data_type: text
      length: 1
      mandatory: false
      origins:
        - type: Derived
      comment: DM.DTHFL
      codelist: Y_BLANK

  - name: HEIGHTBL
    submission:
      data_type: float
      length: 8
      mandatory: false
      significant_digits: 1
      origins:
        - type: Derived
      comment: VSSTRESN when VS.VSTESTCD='HEIGHT' and VS.VISITNUM=1

  - name: WEIGHTBL
    submission:
      data_type: float
      length: 8
      mandatory: false
      significant_digits: 1
      origins:
        - type: Derived
      comment: VSSTRESN when VS.VSTESTCD='WEIGHT' and VS.VISITNUM=3

  - name: BMIBL
    submission:
      data_type: float
      length: 8
      mandatory: false
      significant_digits: 1
      origins:
        - type: Derived
      comment: WEIGHTBL / ((HEIGHTBL*100)**2)

  - name: BMIBLGR1
    submission:
      data_type: text
      length: 6
      mandatory: false
      origins:
        - type: Derived
      comment: BMIBLGR1=Normal if . < BMIBL <25. BMIBLGR1=Overweight
        if 25 <=BMIBL <30. BMIBLGR1=Obese if BMIBL >=30
      codelist: BMICAT

  - name: EDUCLVL
    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: SC.SCSTRESN where SC.SCTESTCD=YEARSEDU

  - name: DISONSDT
    submission:
      data_type: integer
      length: 8
      mandatory: false
      display_format: DATE9.
      origins:
        - type: Derived
      comment: MH.MHSTDTC where MHCAT='PRIMARY DIAGNOSIS' converted to SAS date

  - name: VISIT1DT
    submission:
      data_type: integer
      length: 8
      mandatory: false
      display_format: DATE9.
      origins:
        - type: Derived
      comment: SV.SVSTDTC when SV.VISITNUM=1, converted to SAS date

  - name: DURDIS
    submission:
      data_type: float
      length: 8
      mandatory: false
      significant_digits: 1
      origins:
        - type: Derived
      comment: number of months between VISIT1DT and DISONSET

  - name: DURDSGR1
    submission:
      data_type: text
      length: 4
      mandatory: false
      origins:
        - type: Derived
      comment: grouping DURDIS values as <12 and >=12
      codelist: DURDISC

  - name: VISNUMEN
    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: if DS.VISITNUM=13 where DSTERM='PROTCOL COMPLETED' then
        VISNUMEN=12, otherwise VISNUMEN=DS.VISITNUM
        where DSTERM='PROTCOL COMPLETED'

  - name: MMSETOT
    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: sum of QS.QSORRES values for the subject

submission:
  mode: historical
  label: Subject-Level Analysis
  class: SUBJECT LEVEL ANALYSIS DATASET
  structure: one record per subject
  repeating: false
  artifact: adsl.xpt
