yamaa: "1.0"
type: spec
model: ADaM
parent: ../../../spec/yamaa/templates/adsl.yaml
include:
  - fragments/adsl-exposure.yaml
  - fragments/adsl-baseline.yaml
  - fragments/adsl-population.yaml
domain: ADSL
input:
  DM:
    empty_string: present
  EX:
    path: ../../data/sdtm/ex.parquet
    empty_string: present
    key:
      - STUDYID
      - USUBJID
  VS:
    path: ../../data/sdtm/vs.parquet
    empty_string: present
  SV:
    path: ../../data/sdtm/sv.parquet
    empty_string: present
  DS:
    path: ../../data/sdtm/ds.parquet
    empty_string: present
  QS:
    path: ../../data/sdtm/qs.parquet
    empty_string: present
  SC:
    path: ../../data/sdtm/sc.parquet
    empty_string: present
  MH:
    path: ../../data/sdtm/mh.parquet
    empty_string: present

output:
  path: ../../data/adam/adsl-yamaa.parquet
  columns:
    - STUDYID
    - USUBJID
    - SUBJID
    - SITEID
    - SITEGR1
    - ARM
    - TRT01P
    - TRT01PN
    - TRT01A
    - TRT01AN
    - TRTSDT
    - TRTEDT
    - TRTDUR
    - AVGDD
    - CUMDOSE
    - AGE
    - AGEGR1
    - AGEGR1N
    - AGEU
    - RACE
    - RACEN
    - SEX
    - ETHNIC
    - SAFFL
    - ITTFL
    - EFFFL
    - COMP8FL
    - COMP16FL
    - COMP24FL
    - DISCONFL
    - DSRAEFL
    - DTHFL
    - BMIBL
    - BMIBLGR1
    - HEIGHTBL
    - WEIGHTBL
    - EDUCLVL
    - DISONSDT
    - DURDIS
    - DURDSGR1
    - VISIT1DT
    - RFSTDTC
    - RFENDTC
    - VISNUMEN
    - RFENDT
    - DCDECOD
    - DCREASCD
    - MMSETOT
  order_by:
    - variable: USUBJID
      nulls: last

intermediates:
  - id: BASE_HT
    dataset: VS
    key:
      - STUDYID
      - USUBJID
    filter: "VS.VSTESTCD = 'HEIGHT'"
    order_by:
      - variable: VS.VISITNUM
        nulls: last
    keep: first

  - id: BASE_WT
    dataset: VS
    key:
      - STUDYID
      - USUBJID
    filter: "VS.VSTESTCD = 'WEIGHT' AND VS.VSBLFL = 'Y'"
    order_by:
      - variable: VS.VISITNUM
        nulls: last
    keep: first

  - id: LAST_EX
    dataset: EX
    key:
      - STUDYID
      - USUBJID
    order_by:
      - variable: EX.EXSEQ
        nulls: last
    keep: last

  - id: SV1
    dataset: SV
    key:
      - STUDYID
      - USUBJID
    filter: "SV.VISITNUM = 1"
    order_by:
      - variable: SV.VISITNUM
        nulls: last
    keep: first

  - id: SV8
    dataset: SV
    key:
      - STUDYID
      - USUBJID
    filter: "SV.VISITNUM = 8"
    order_by:
      - variable: SV.VISITNUM
        nulls: last
    keep: first

  - id: SV10
    dataset: SV
    key:
      - STUDYID
      - USUBJID
    filter: "SV.VISITNUM = 10"
    order_by:
      - variable: SV.VISITNUM
        nulls: last
    keep: first

  - id: SV12
    dataset: SV
    key:
      - STUDYID
      - USUBJID
    filter: "SV.VISITNUM = 12"
    order_by:
      - variable: SV.VISITNUM
        nulls: last
    keep: first

  - id: DS_DISP
    dataset: DS
    key:
      - STUDYID
      - USUBJID
    filter: "DS.DSCAT = 'DISPOSITION EVENT'"
    order_by:
      - variable: DS.DSSEQ
        nulls: last
    keep: first

  - id: SC_EDU
    dataset: SC
    key:
      - STUDYID
      - USUBJID
    filter: "SC.SCTESTCD = 'EDLEVEL'"
    order_by:
      - variable: SC.SCSEQ
        nulls: last
    keep: first

  - id: MH_DX
    dataset: MH
    key:
      - STUDYID
      - USUBJID
    filter: "MH.MHCAT = 'PRIMARY DIAGNOSIS'"
    order_by:
      - variable: MH.MHSEQ
        nulls: last
    keep: first

  - id: QS_ADAS
    dataset: QS
    key:
      - STUDYID
      - USUBJID
    filter: "QS.QSCAT = 'ALZHEIMER''S DISEASE ASSESSMENT SCALE'
      AND QS.VISITNUM > 3"
    order_by:
      - variable: QS.VISITNUM
        nulls: last
    keep: first

  - id: QS_CIBIC
    dataset: QS
    key:
      - STUDYID
      - USUBJID
    filter: >-
      QS.QSCAT = 'CLINICIAN''S INTERVIEW-BASED IMPRESSION OF CHANGE
      (CIBIC+)' AND QS.VISITNUM > 3
    order_by:
      - variable: QS.VISITNUM
        nulls: last
    keep: first

  - id: QS_MMSE
    dataset: QS
    key:
      - STUDYID
      - USUBJID
    filter: "QS.QSCAT = 'MINI-MENTAL STATE'"

rows:
  - id: treated-subjects
    dataset: DM
    filter: "DM.ACTARM <> 'Screen Failure'"
    derivations: {}

verifications:
  - assert:
      id: treatment_date_order
      when: "TRTSDT IS NOT NULL AND TRTEDT IS NOT NULL"
      require: "TRTEDT >= TRTSDT"
