schema_version: "1.0"
domain: ADQSCIBC_S1
keys: [USUBJID, QSSEQ]
input:
  QS:
    path: sdtm/qs.parquet
    empty_string: present
  ADSL:
    path: upstream/adsl.parquet
    empty_string: present
base: QS

intermediates:
  - id: ADSL1
    dataset: ADSL
    key: [USUBJID]

rows:
  - id: rec-w8
    dataset: QS
    filter: "QS.QSTESTCD = 'CIBIC' AND QS.QSDY >= 2 AND QS.QSDY <= 84"
    derivations:
      _AVISIT: {literal: 'Week 8'}
      _AVISITN: {literal: 8.0}
      _AWTARGET: {literal: 56.0}
      _AWLO: {literal: 2.0}
      _AWHI: {literal: 84.0}
      _AWRANGE: {literal: '2-84'}
      _AWTDIFF:
        compute:
          expr: "ABS(QS.QSDY - 56.0)"
      _DTYPE: {literal: ''}
      _AVAL: QS.QSSTRESN

  - id: rec-w16
    dataset: QS
    filter: "QS.QSTESTCD = 'CIBIC' AND QS.QSDY >= 85 AND QS.QSDY <= 140"
    derivations:
      _AVISIT: {literal: 'Week 16'}
      _AVISITN: {literal: 16.0}
      _AWTARGET: {literal: 112.0}
      _AWLO: {literal: 85.0}
      _AWHI: {literal: 140.0}
      _AWRANGE: {literal: '85-140'}
      _AWTDIFF:
        compute:
          expr: "ABS(QS.QSDY - 112.0)"
      _DTYPE: {literal: ''}
      _AVAL: QS.QSSTRESN

  - id: rec-w24
    dataset: QS
    filter: "QS.QSTESTCD = 'CIBIC' AND QS.QSDY >= 141"
    derivations:
      _AVISIT: {literal: 'Week 24'}
      _AVISITN: {literal: 24.0}
      _AWTARGET: {literal: 168.0}
      _AWLO: {literal: 141.0}
      _AWHI: {literal: null}
      _AWRANGE: {literal: '>140'}
      _AWTDIFF:
        compute:
          expr: "ABS(QS.QSDY - 168.0)"
      _DTYPE: {literal: ''}
      _AVAL: QS.QSSTRESN

output:
  path: adqscibc-s1.parquet
  order_by: [USUBJID, _AVISITN, QSSEQ]
  columns: [USUBJID, QSSEQ, VISIT, VISITNUM, QSDY, QSDTC, QSSTRESN,
    _AVISIT, _AVISITN, _AWTARGET, _AWLO, _AWHI, _AWRANGE, _AWTDIFF, _DTYPE, _AVAL,
    _SITEID, _SITEGR1, _TRTSDT, _TRTEDT, _TRT01P, _TRT01PN, _AGE, _AGEGR1, _AGEGR1N,
    _RACE, _RACEN, _SEX, _ITTFL, _EFFFL, _COMP24FL]

columns:
  - name: USUBJID
    type: str
    derivation: QS.USUBJID
  - name: QSSEQ
    type: float
    derivation: QS.QSSEQ
  - name: VISIT
    type: str
    derivation: QS.VISIT
  - name: VISITNUM
    type: float
    derivation: QS.VISITNUM
  - name: QSDY
    type: float
    derivation: QS.QSDY
  - name: QSDTC
    type: str
    derivation: QS.QSDTC
  - name: QSSTRESN
    type: float
    derivation: QS.QSSTRESN
  - name: _AVISIT
    type: str
  - name: _AVISITN
    type: float
  - name: _AWTARGET
    type: float
  - name: _AWLO
    type: float
  - name: _AWHI
    type: float
  - name: _AWRANGE
    type: str
  - name: _AWTDIFF
    type: float
  - name: _DTYPE
    type: str
  - name: _AVAL
    type: float
  - name: _SITEID
    type: str
    derivation: ADSL1.SITEID
  - name: _SITEGR1
    type: str
    derivation: ADSL1.SITEGR1
  - name: _TRTSDT
    type: date
    derivation: ADSL1.TRTSDT
  - name: _TRTEDT
    type: date
    derivation: ADSL1.TRTEDT
  - name: _TRT01P
    type: str
    derivation: ADSL1.TRT01P
  - name: _TRT01PN
    type: float
    derivation: ADSL1.TRT01PN
  - name: _AGE
    type: float
    derivation: ADSL1.AGE
  - name: _AGEGR1
    type: str
    derivation: ADSL1.AGEGR1
  - name: _AGEGR1N
    type: float
    derivation: ADSL1.AGEGR1N
  - name: _RACE
    type: str
    derivation: ADSL1.RACE
  - name: _RACEN
    type: float
    derivation: ADSL1.RACEN
  - name: _SEX
    type: str
    derivation: ADSL1.SEX
  - name: _ITTFL
    type: str
    derivation: ADSL1.ITTFL
  - name: _EFFFL
    type: str
    derivation: ADSL1.EFFFL
  - name: _COMP24FL
    type: str
    derivation: ADSL1.COMP24FL
