# ADQSNIPX: single-spec derivation (collapsed from adqsnpix-s1/s2/final).
#
# One row per SDTM QS record (NPITM01S-12S, NPTOT) with analysis-window
# assignment (_WINDOW 0-13), closest-to-target selection (_IS_SEL='Y'),
# baseline flag (_ABLFL='Y'), plus NPTOTMN baseline duplicates and
# Weeks 4-24 mean rows.
#
# Row sources (all native yamaa):
#   natural: every QS record; window/rank/selection computed inline.
#   BASE_LKP: SELF lookup of the subject's NPTOT baseline record.
#   W3/W4/W5/W6_LKP: SELF lookups of selected NPTOT at Weeks 6/8/10/12.
#   nptotmn_base: NPTOTMN baseline duplicate per subject.
#   nptotmn_mean: NPTOTMN Weeks 4-24 mean per subject (_N_MEAN >= 1).
#
# Official behavior (verified against the expected dataset):
#   - every QS record is kept; ANL01FL='Y' only on the selected record.
#   - NPTOTMN baseline rows duplicate the NPTOT baseline record
#     (PARAMTYP='DERIVED', DTYPE='AVERAGE').
#   - one NPTOTMN row per subject with _N_MEAN >= 1 at AVISITN=98
#     ('      Weeks 4-24'), AVAL=_MEAN, CHG/PCHG null, DTYPE='AVERAGE',
#     VISIT='', ADY/ADT/VISITNUM/QSSEQ null.
#   - AVISIT strings are left-padded to length 16.
#   - order: (USUBJID, PARAMN, AVISITN, ANL01FL desc, QSSEQ asc).
yamaa: "1.0"
type: spec
model: ADaM
domain: ADQSNPIX
keys:
  - STUDYID
  - USUBJID
  - PARAMCD
  - AVISITN
  - ANL01FL
  - VISIT

input:
  QS:
    path: ../../data/sdtm/qs.parquet
    empty_string: present
    key:
      - STUDYID
      - USUBJID
  ADSL:
    path: ../../data/adam/adsl-yamaa.parquet
    schema: adsl.yaml
    empty_string: present

base: QS

output:
  path: ../../data/adam/adqsnipx-yamaa.parquet
  columns:
    - STUDYID
    - SITEID
    - SITEGR1
    - USUBJID
    - TRTSDT
    - TRTEDT
    - TRTP
    - TRTPN
    - AGE
    - AGEGR1
    - AGEGR1N
    - RACE
    - RACEN
    - SEX
    - ITTFL
    - EFFFL
    - COMP24FL
    - AVISIT
    - AVISITN
    - ADY
    - ADT
    - VISITNUM
    - VISIT
    - PARAM
    - PARAMCD
    - PARAMN
    - PARAMTYP
    - AVAL
    - BASE
    - CHG
    - PCHG
    - ABLFL
    - ANL01FL
    - DTYPE
    - AWRANGE
    - AWTARGET
    - AWTDIFF
    - AWLO
    - AWHI
    - AWU
    - QSSEQ
  order_by:
    - variable: USUBJID
      nulls: last
    - variable: PARAMN
      nulls: last
    - variable: AVISITN
      nulls: last
    - variable: ANL01FL
      direction: desc
      nulls: last
    - variable: QSSEQ
      nulls: last

windows:
  ANALYSIS_RECORD_ORDER:
    group_by:
      - USUBJID
      - QSTESTCD
      - _WINDOW
    order_by:
      - variable: _DIFF
        nulls: last
      - variable: QS.QSDY
        nulls: last
      - variable: QSSEQ
        nulls: last

intermediates:
  - id: ADSL_LKP
    dataset: ADSL
    key:
      - USUBJID
    order_by:
      - variable: ADSL.USUBJID
        nulls: last
    keep: first

  - id: BASE_LKP
    dataset: SELF
    key:
      - USUBJID
    filter: "QSTESTCD = 'NPTOT' AND _ABLFL = 'Y'"
    order_by:
      - variable: QSSEQ
        nulls: last
    keep: first

  - id: BASE_PARAM
    dataset: SELF
    key:
      - USUBJID
      - QSTESTCD
    filter: "_ABLFL = 'Y'"
    order_by:
      - variable: QSSEQ
        nulls: last
    keep: first

  - id: W3_LKP
    dataset: SELF
    key:
      - USUBJID
    filter: "QSTESTCD = 'NPTOT' AND _IS_SEL = 'Y' AND _WINDOW
      = 3"
    order_by:
      - variable: QSSEQ
        nulls: last
    keep: first

  - id: W4_LKP
    dataset: SELF
    key:
      - USUBJID
    filter: "QSTESTCD = 'NPTOT' AND _IS_SEL = 'Y' AND _WINDOW
      = 4"
    order_by:
      - variable: QSSEQ
        nulls: last
    keep: first

  - id: W5_LKP
    dataset: SELF
    key:
      - USUBJID
    filter: "QSTESTCD = 'NPTOT' AND _IS_SEL = 'Y' AND _WINDOW
      = 5"
    order_by:
      - variable: QSSEQ
        nulls: last
    keep: first

  - id: W6_LKP
    dataset: SELF
    key:
      - USUBJID
    filter: "QSTESTCD = 'NPTOT' AND _IS_SEL = 'Y' AND _WINDOW
      = 6"
    order_by:
      - variable: QSSEQ
        nulls: last
    keep: first

columns:
  - name: QSTESTCD
    type: str
    label: "Working value: QSTESTCD"

  - name: _W
    type: float
    label: "Working value: _W"

  - name: _WINDOW
    type: int
    label: "Working value: _WINDOW"

  - name: _TARGET
    type: float
    label: "Working value: _TARGET"

  - name: _DIFF
    type: float
    label: "Working value: _DIFF"

  - name: _RANK
    type: int
    label: "Working value: _RANK"

  - name: _IS_SEL
    type: str
    label: "Working value: _IS_SEL"

  - name: _AVISIT
    type: str
    label: "Working value: _AVISIT"

  - name: _AVISITN
    type: float
    label: "Working value: _AVISITN"

  - name: _AWRANGE
    type: str
    label: "Working value: _AWRANGE"

  - name: _AWTARGET
    type: float
    label: "Working value: _AWTARGET"

  - name: _AWLO
    type: float
    label: "Working value: _AWLO"

  - name: _AWHI
    type: float
    label: "Working value: _AWHI"

  - name: _AVAL
    type: float
    label: "Working value: _AVAL"

  - name: _ABLFL
    type: str
    label: "Working value: _ABLFL"

  - name: _AWTDIFF
    type: float
    label: "Working value: _AWTDIFF"

  - name: _W3N
    type: int
    label: "Working value: _W3N"

  - name: _W4N
    type: int
    label: "Working value: _W4N"

  - name: _W5N
    type: int
    label: "Working value: _W5N"

  - name: _W6N
    type: int
    label: "Working value: _W6N"

  - name: _CNT
    type: int
    label: "Working value: _CNT"

  - name: _W3Z
    type: float
    label: _W3Z (helper)
    derivation:

  - name: _W4Z
    type: float
    label: _W4Z (helper)
    derivation:

  - name: _W5Z
    type: float
    label: _W5Z (helper)
    derivation:

  - name: _W6Z
    type: float
    label: _W6Z (helper)
    derivation:

  - name: _MEAN
    type: float
    label: "Working value: _MEAN"

  - name: STUDYID
    type: str
    label: Study Identifier

  - name: SITEID
    type: str
    label: Study Site Identifier
    derivation: ADSL_LKP.SITEID

  - name: SITEGR1
    type: str
    label: Pooled Site Group 1
    derivation: ADSL_LKP.SITEGR1

  - name: USUBJID
    type: str
    label: Unique Subject Identifier

  - name: TRTSDT
    type: date
    label: Date of First Exposure to Treatment
    derivation: ADSL_LKP.TRTSDT

  - name: TRTEDT
    type: date
    label: Date of Last Exposure to Treatment
    derivation: ADSL_LKP.TRTEDT

  - name: TRTP
    type: str
    label: Planned Treatment
    derivation: ADSL_LKP.TRT01P

  - name: TRTPN
    type: float
    label: Planned Treatment (N)
    derivation: ADSL_LKP.TRT01PN

  - name: AGE
    type: float
    label: Age
    derivation: ADSL_LKP.AGE

  - name: AGEGR1
    type: str
    label: Pooled Age Group 1
    derivation: ADSL_LKP.AGEGR1

  - name: AGEGR1N
    type: float
    label: Pooled Age Group 1 (N)
    derivation: ADSL_LKP.AGEGR1N

  - name: RACE
    type: str
    label: Race
    derivation: ADSL_LKP.RACE

  - name: RACEN
    type: float
    label: Race (N)
    derivation: ADSL_LKP.RACEN

  - name: SEX
    type: str
    label: Sex
    derivation: ADSL_LKP.SEX

  - name: ITTFL
    type: str
    label: Intent-to-Treat Population Flag
    derivation: ADSL_LKP.ITTFL

  - name: EFFFL
    type: str
    label: Efficacy Population Flag
    derivation: ADSL_LKP.EFFFL

  - name: COMP24FL
    type: str
    label: Completers of Week 24 Population Flag
    derivation: ADSL_LKP.COMP24FL

  - name: AVISIT
    type: str
    label: Analysis Visit
    derivation: _AVISIT

  - name: AVISITN
    type: float
    label: Analysis Visit (N)
    derivation: _AVISITN

  - name: ADY
    type: float
    label: Analysis Relative Day

  - name: ADT
    type: date
    label: Analysis Date

  - name: VISITNUM
    type: float
    label: Visit Number

  - name: VISIT
    type: str
    label: Visit Name

  - name: PARAM
    type: str
    label: Parameter

  - name: PARAMCD
    type: str
    label: Parameter Code

  - name: PARAMN
    type: float
    label: Parameter (N)

  - name: PARAMTYP
    type: str
    label: Parameter Type

  - name: AVAL
    type: float
    label: Analysis Value
    derivation: _AVAL

  - name: BASE
    type: float
    label: Baseline Value
    derivation: BASE_PARAM._AVAL

  - name: CHG
    type: float
    label: Change from Baseline
    derivation:
      case:
        - when: >-
            _AVISITN <> 98.0 AND _AVAL IS NOT NULL AND BASE_PARAM._AVAL
            IS NOT NULL
          then: "_AVAL - BASE_PARAM._AVAL"

  - name: PCHG
    type: float
    label: Percent Change from Baseline
    derivation:
      case:
        - when: >-
            _AVISITN <> 98.0 AND _AVAL IS NOT NULL AND BASE_PARAM._AVAL
            IS NOT NULL AND BASE_PARAM._AVAL <> 0
          then: "(_AVAL - BASE_PARAM._AVAL) / BASE_PARAM._AVAL
            * 100"

  - name: ABLFL
    type: str
    label: Analysis Baseline Flag
    derivation: _ABLFL

    verifications:
      - allowed_values:
          values:
            - Y
            - N
            - ''

  - name: ANL01FL
    type: str
    label: Analysis Record Flag 01

    verifications:
      - allowed_values:
          values:
            - Y
            - N
            - ''

  - name: DTYPE
    type: str
    label: Derivation Type

  - name: AWRANGE
    type: str
    label: Analysis Window Valid Relative Range
    derivation: _AWRANGE

  - name: AWTARGET
    type: float
    label: Analysis Window Target
    derivation: _AWTARGET

  - name: AWTDIFF
    type: float
    label: Analysis Window Diff from Target
    derivation: _AWTDIFF

  - name: AWLO
    type: float
    label: Analysis Window Beginning Timepoint
    derivation: _AWLO

  - name: AWHI
    type: float
    label: Analysis Window Ending Timepoint
    derivation: _AWHI

  - name: AWU
    type: str
    label: Analysis Window Unit
    derivation: "'DAYS'"

  - name: QSSEQ
    type: float
    label: Sequence Number

rows:
  # ------------------------------------------------------------------
  # natural: every QS record with window assignment and selection.
  # _WINDOW 0-13, _RANK by (|QSDY-target|, QSDY, QSSEQ), _IS_SEL='Y'
  # on rank 1, _ABLFL='Y' on the QSBLFL baseline record.
  # ------------------------------------------------------------------
  - id: natural
    dataset: QS
    filter: >-
      QS.QSTESTCD IN ('NPITM01S', 'NPITM02S', 'NPITM03S', 'NPITM04S',
      'NPITM05S', 'NPITM06S', 'NPITM07S', 'NPITM08S', 'NPITM09S',
      'NPITM10S', 'NPITM11S', 'NPITM12S', 'NPTOT')
    derivations:
      STUDYID: QS.STUDYID
      USUBJID: QS.USUBJID
      QSTESTCD: QS.QSTESTCD
      QSSEQ: QS.QSSEQ
      _WINDOW:
        case:
          - when: "QS.QSDY <= 1"
            then: 0
          - when: "QS.QSDY <= 21"
            then: 1
          - when: "QS.QSDY <= 35"
            then: 2
          - when: "QS.QSDY <= 49"
            then: 3
          - when: "QS.QSDY <= 63"
            then: 4
          - when: "QS.QSDY <= 77"
            then: 5
          - when: "QS.QSDY <= 91"
            then: 6
          - when: "QS.QSDY <= 105"
            then: 7
          - when: "QS.QSDY <= 119"
            then: 8
          - when: "QS.QSDY <= 133"
            then: 9
          - when: "QS.QSDY <= 147"
            then: 10
          - when: "QS.QSDY <= 161"
            then: 11
          - when: "QS.QSDY <= 175"
            then: 12
          - otherwise: 13
      _TARGET:
        case:
          - when: "_WINDOW = 0"
            then: 1.0
          - when: "_WINDOW = 1"
            then: 14.0
          - when: "_WINDOW = 2"
            then: 28.0
          - when: "_WINDOW = 3"
            then: 42.0
          - when: "_WINDOW = 4"
            then: 56.0
          - when: "_WINDOW = 5"
            then: 70.0
          - when: "_WINDOW = 6"
            then: 84.0
          - when: "_WINDOW = 7"
            then: 98.0
          - when: "_WINDOW = 8"
            then: 112.0
          - when: "_WINDOW = 9"
            then: 126.0
          - when: "_WINDOW = 10"
            then: 140.0
          - when: "_WINDOW = 11"
            then: 154.0
          - when: "_WINDOW = 12"
            then: 168.0
          - otherwise: 182.0
      _DIFF: "abs(QS.QSDY - _TARGET)"
      _RANK:
        rank:
          method: dense
          window: ANALYSIS_RECORD_ORDER
      _IS_SEL:
        case:
          - when: "_RANK = 1"
            then: "'Y'"
          - otherwise: "''"
      _ABLFL:
        case:
          - when: "QS.QSBLFL = 'Y' AND _WINDOW = 0"
            then: "'Y'"
          - otherwise: "''"
      _W: _WINDOW
      _W3N:
      _W4N:
      _W5N:
      _W6N:
      _CNT:
      _MEAN:
      _AVISIT:
        case:
          - when: "_W = 0"
            then: "'        Baseline'"
          - when: "_W = 1"
            then: "'          Week 2'"
          - when: "_W = 2"
            then: "'          Week 4'"
          - when: "_W = 3"
            then: "'          Week 6'"
          - when: "_W = 4"
            then: "'          Week 8'"
          - when: "_W = 5"
            then: "'         Week 10'"
          - when: "_W = 6"
            then: "'         Week 12'"
          - when: "_W = 7"
            then: "'         Week 14'"
          - when: "_W = 8"
            then: "'         Week 16'"
          - when: "_W = 9"
            then: "'         Week 18'"
          - when: "_W = 10"
            then: "'         Week 20'"
          - when: "_W = 11"
            then: "'         Week 22'"
          - when: "_W = 12"
            then: "'         Week 24'"
          - otherwise: "'         Week 26'"
      _AVISITN:
        case:
          - when: "_W = 0"
            then: 0.0
          - when: "_W = 1"
            then: 2.0
          - when: "_W = 2"
            then: 4.0
          - when: "_W = 3"
            then: 6.0
          - when: "_W = 4"
            then: 8.0
          - when: "_W = 5"
            then: 10.0
          - when: "_W = 6"
            then: 12.0
          - when: "_W = 7"
            then: 14.0
          - when: "_W = 8"
            then: 16.0
          - when: "_W = 9"
            then: 18.0
          - when: "_W = 10"
            then: 20.0
          - when: "_W = 11"
            then: 22.0
          - when: "_W = 12"
            then: 24.0
          - otherwise: 26.0
      _AWRANGE:
        case:
          - when: "_W = 0"
            then: "'<= 1'"
          - when: "_W = 1"
            then: "'2 - 21'"
          - when: "_W = 2"
            then: "'22 - 35'"
          - when: "_W = 3"
            then: "'36 - 49'"
          - when: "_W = 4"
            then: "'50 - 63'"
          - when: "_W = 5"
            then: "'64 - 77'"
          - when: "_W = 6"
            then: "'78 - 91'"
          - when: "_W = 7"
            then: "'92 - 105'"
          - when: "_W = 8"
            then: "'106 - 119'"
          - when: "_W = 9"
            then: "'120 - 133'"
          - when: "_W = 10"
            then: "'134 - 147'"
          - when: "_W = 11"
            then: "'148 - 161'"
          - when: "_W = 12"
            then: "'162 - 175'"
          - otherwise: "'>175'"
      _AWTARGET:
        case:
          - when: "_W = 0"
            then: 1.0
          - when: "_W = 1"
            then: 14.0
          - when: "_W = 2"
            then: 28.0
          - when: "_W = 3"
            then: 42.0
          - when: "_W = 4"
            then: 56.0
          - when: "_W = 5"
            then: 70.0
          - when: "_W = 6"
            then: 84.0
          - when: "_W = 7"
            then: 98.0
          - when: "_W = 8"
            then: 112.0
          - when: "_W = 9"
            then: 126.0
          - when: "_W = 10"
            then: 140.0
          - when: "_W = 11"
            then: 154.0
          - when: "_W = 12"
            then: 168.0
          - otherwise: 182.0
      _AWLO:
        case:
          - when: "_W = 1"
            then: 2.0
          - when: "_W = 2"
            then: 22.0
          - when: "_W = 3"
            then: 36.0
          - when: "_W = 4"
            then: 50.0
          - when: "_W = 5"
            then: 64.0
          - when: "_W = 6"
            then: 78.0
          - when: "_W = 7"
            then: 92.0
          - when: "_W = 8"
            then: 106.0
          - when: "_W = 9"
            then: 120.0
          - when: "_W = 10"
            then: 134.0
          - when: "_W = 11"
            then: 148.0
          - when: "_W = 12"
            then: 162.0
          - when: "_W = 13"
            then: 176.0
      _AWHI:
        case:
          - when: "_W = 0"
            then: 1.0
          - when: "_W = 1"
            then: 21.0
          - when: "_W = 2"
            then: 35.0
          - when: "_W = 3"
            then: 49.0
          - when: "_W = 4"
            then: 63.0
          - when: "_W = 5"
            then: 77.0
          - when: "_W = 6"
            then: 91.0
          - when: "_W = 7"
            then: 105.0
          - when: "_W = 8"
            then: 119.0
          - when: "_W = 9"
            then: 133.0
          - when: "_W = 10"
            then: 147.0
          - when: "_W = 11"
            then: 161.0
          - when: "_W = 12"
            then: 175.0
      _AVAL: QS.QSSTRESN
      _AWTDIFF: "abs(_AWTARGET - QS.QSDY)"
      ANL01FL:
        case:
          - when: "_IS_SEL = 'Y'"
            then: "'Y'"
          - otherwise: "''"
      ADY: QS.QSDY
      ADT:
        impute:
          type: date
          source: QS.QSDTC
          month: 1
          day: 1
      VISIT: QS.VISIT
      VISITNUM: QS.VISITNUM
      PARAMCD: QS.QSTESTCD
      PARAM:
        case:
          - when: "QSTESTCD = 'NPITM01S'"
            then: "'NPI-X Item A (Delusion) Score'"
          - when: "QSTESTCD = 'NPITM02S'"
            then: "'NPI-X Item B (Hallucination)  Score'"
          - when: "QSTESTCD = 'NPITM03S'"
            then: "'NPI-X Item C (Agitation/Agression) Score'"
          - when: "QSTESTCD = 'NPITM04S'"
            then: "'NPI-X Item D (Depression/Dysphoria) Score'"
          - when: "QSTESTCD = 'NPITM05S'"
            then: "'NPI-X Item E (Anxiety) Score'"
          - when: "QSTESTCD = 'NPITM06S'"
            then: "'NPI-X Item F (Eupohoria/Elation) Score'"
          - when: "QSTESTCD = 'NPITM07S'"
            then: "'NPI-X Item G (Apathy/Indifference) Score'"
          - when: "QSTESTCD = 'NPITM08S'"
            then: "'NPI-X Item H (Disinhibition) Score'"
          - when: "QSTESTCD = 'NPITM09S'"
            then: "'NPI-X Item I (Irritability/Lability) Score'"
          - when: "QSTESTCD = 'NPITM10S'"
            then: "'NPI-X Item J (Aberrant Motor Behavior) Score'"
          - when: "QSTESTCD = 'NPITM11S'"
            then: "'NPI-X Item K (Night-time Behavior) Score'"
          - when: "QSTESTCD = 'NPITM12S'"
            then: "'NPI-X Item L (Appetite/Eating Change) Score'"
          - otherwise: "'NPI-X (9) Total Score'"
      PARAMN:
        case:
          - when: "QSTESTCD = 'NPITM01S'"
            then: 1.0
          - when: "QSTESTCD = 'NPITM02S'"
            then: 2.0
          - when: "QSTESTCD = 'NPITM03S'"
            then: 3.0
          - when: "QSTESTCD = 'NPITM04S'"
            then: 4.0
          - when: "QSTESTCD = 'NPITM05S'"
            then: 5.0
          - when: "QSTESTCD = 'NPITM06S'"
            then: 6.0
          - when: "QSTESTCD = 'NPITM07S'"
            then: 7.0
          - when: "QSTESTCD = 'NPITM08S'"
            then: 8.0
          - when: "QSTESTCD = 'NPITM09S'"
            then: 9.0
          - when: "QSTESTCD = 'NPITM10S'"
            then: 10.0
          - when: "QSTESTCD = 'NPITM11S'"
            then: 11.0
          - when: "QSTESTCD = 'NPITM12S'"
            then: 12.0
          - otherwise: 13.0
      PARAMTYP: "''"
      DTYPE: "''"

  # ------------------------------------------------------------------
  # nptotmn_base: baseline duplicate of the NPTOT baseline record.
  # Uses BASE_LKP (SELF) instead of S2._B_*.
  # ------------------------------------------------------------------
  - id: nptotmn_base
    dataset: QS
    group_by:
      - QS.USUBJID
    derivations:
      STUDYID: ADSL_LKP.STUDYID
      _WINDOW:
      _TARGET:
      _DIFF:
      _RANK:
      _IS_SEL:
      _W3N:
      _W4N:
      _W5N:
      _W6N:
      _CNT:
      _MEAN:
      USUBJID:
        aggregate: "MIN(QS.USUBJID)"
      QSTESTCD: "'NPTOT'"
      _W:
      _AVISIT: "'        Baseline'"
      _AVISITN: 0.0
      _AWRANGE: "'<= 1'"
      _AWTARGET: 1.0
      _AWLO:
      _AWHI: 1.0
      _AVAL: BASE_LKP._AVAL
