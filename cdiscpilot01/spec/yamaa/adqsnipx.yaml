  # ------------------------------------------------------------------
  # nptotmn_mean: Weeks 4-24 mean of selected NPTOT at Weeks 6/8/10/12.
  # Mean computed from W3-W6_LKP (SELF) using null-presence flags.
  # ------------------------------------------------------------------
  - id: nptotmn_mean
    dataset: QS
    group_by: [QS.USUBJID]
    filter: "_CNT >= 1"
    derivations:
      STUDYID: ADSL_LKP.STUDYID
      USUBJID:
        aggregate:
          expr: "MIN(QS.USUBJID)"
      QSTESTCD: {literal: 'NPTOT'}
      _WINDOW: {literal: null}
      _TARGET: {literal: null}
      _DIFF: {literal: null}
      _RANK: {literal: null}
      _IS_SEL: {literal: null}
      _B_QSDY: {literal: null}
      _B_DTSTR: {literal: null}
      _W: {literal: null}
      _W3N:
        case:
          - when: "W3_LKP._AVAL IS NOT NULL"
            then: {literal: 1}
          - otherwise: {literal: 0}
      _W4N:
        case:
          - when: "W4_LKP._AVAL IS NOT NULL"
            then: {literal: 1}
          - otherwise: {literal: 0}
      _W5N:
        case:
          - when: "W5_LKP._AVAL IS NOT NULL"
            then: {literal: 1}
          - otherwise: {literal: 0}
      _W6N:
        case:
          - when: "W6_LKP._AVAL IS NOT NULL"
            then: {literal: 1}
          - otherwise: {literal: 0}
      _CNT:
        compute:
          expr: "_W3N + _W4N + _W5N + _W6N"
      _MEAN:
        case:
          - when: "_CNT >= 1"
            then:
              compute:
                expr: "(coalesce(W3_LKP._AVAL, 0) + coalesce(W4_LKP._AVAL,
                  0) + coalesce(W5_LKP._AVAL, 0) + coalesce(W6_LKP._AVAL,
                  0)) / _CNT"
      _AVAL: _MEAN
      _ABLFL: {literal: ''}
      _AWTDIFF: {literal: 0.0}
      _AVISIT: {literal: '      Weeks 4-24'}
      _AVISITN: {literal: 98.0}
      _AWRANGE: {literal: '22 - 175'}
      _AWTARGET: {literal: 98.0}
      _AWLO: {literal: 22.0}
      _AWHI: {literal: 175.0}
      ANL01FL: {literal: 'Y'}
