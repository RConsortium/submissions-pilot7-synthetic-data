  - id: nptotmn_mean
    dataset: QS
    group_by:
      - QS.USUBJID
    filter: "_CNT >= 1"
    derivations:
      STUDYID: ADSL_LKP.STUDYID
      USUBJID:
        aggregate: "MIN(QS.USUBJID)"
      QSTESTCD: "'NPTOT'"
      _WINDOW:
      _TARGET:
      _DIFF:
      _RANK:
      _IS_SEL:
      _W:
      _W3N:
        case:
          - when: "W3_LKP._AVAL IS NOT NULL"
            then: 1
          - otherwise: 0
      _W4N:
        case:
          - when: "W4_LKP._AVAL IS NOT NULL"
            then: 1
          - otherwise: 0
      _W5N:
        case:
          - when: "W5_LKP._AVAL IS NOT NULL"
            then: 1
          - otherwise: 0
      _W6N:
        case:
          - when: "W6_LKP._AVAL IS NOT NULL"
            then: 1
          - otherwise: 0
      _CNT: "_W3N + _W4N + _W5N + _W6N"
      _W3Z:
        case:
          - when: W3_LKP._AVAL IS NULL
            then: 0
          - otherwise: W3_LKP._AVAL
      _W4Z:
        case:
          - when: W4_LKP._AVAL IS NULL
            then: 0
          - otherwise: W4_LKP._AVAL
      _W5Z:
        case:
          - when: W5_LKP._AVAL IS NULL
            then: 0
          - otherwise: W5_LKP._AVAL
      _W6Z:
        case:
          - when: W6_LKP._AVAL IS NULL
            then: 0
          - otherwise: W6_LKP._AVAL
      _MEAN:
        case:
          - when: "_CNT >= 1"
            then: "(_W3Z + _W4Z + _W5Z + _W6Z) / _CNT"
      _AVAL: _MEAN
