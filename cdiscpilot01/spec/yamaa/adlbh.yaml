    type: str
    label: Last value in treatment visit
    derivation:
      case:
        - when: "_IS_EOT = 'Y'"
          then: "'Y'"
        - when: "_IS_LAST_ELIGIBLE = 1"
          then: "'Y'"
        - otherwise: "''"

    submission:
      data_type: text
      length: 1
      mandatory: false
      origins:
        - type: Derived
      comment: "Last observed value for this lab test during treatment phase: 'Y' if VISITNUM=12, if subject discontinues prior to VISIT 12, then this variable is set to 'Y' if this is the last assessment of this analyte for the subject"
      codelist: Y_BLANK
