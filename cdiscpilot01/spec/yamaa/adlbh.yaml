yamaa: "1.0"
type: spec
model: ADaM
parent: templates/laboratory.yaml
clear:
  - intermediates.PREV.derivations
domain: ADLBH

output:
  path: ../../data/adam/adlbh-yamaa.parquet
  columns:
    - STUDYID
    - SUBJID
    - USUBJID
    - TRTP
    - TRTPN
    - TRTA
    - TRTAN
    - TRTSDT
    - TRTEDT
    - AGE
    - AGEGR1
    - AGEGR1N
    - RACE
    - RACEN
    - SEX
    - COMP24FL
    - DSRAEFL
    - SAFFL
    - AVISIT
    - AVISITN
    - ADY
    - ADT
    - VISIT
    - VISITNUM
    - PARAM
    - PARAMCD
    - PARAMN
    - PARCAT1
    - AVAL
    - BASE
    - CHG
    - A1LO
    - A1HI
    - R2A1LO
    - R2A1HI
    - BR2A1LO
    - BR2A1HI
    - ANL01FL
    - ALBTRVAL
    - ANRIND
    - BNRIND
    - ABLFL
    - AENTMTFL
    - LBSEQ
    - LBNRIND
    - LBSTRESN
  order_by:
    - variable: USUBJID
      nulls: last
    - variable: ADY
      nulls: last
    - variable: PARAMN
      nulls: last
    - variable: AVISITN
      nulls: last

windows:
  PREV_ORDER:
    group_by:
      - LB.USUBJID
      - LB.LBTESTCD
    order_by:
      - variable: _AVISITN
        nulls: last
      - variable: LB.LBDTC
        nulls: last
      - variable: LB.LBSEQ
        nulls: last
    filter: >-
      LB.LBCAT = 'HEMATOLOGY' AND LB.VISIT NOT IN ('AMBUL ECG
      REMOVAL', 'BASELINE', 'RETRIEVAL') AND LB.VISIT NOT LIKE
      'UNSCHEDULED%'

  ANL01_RANK_ORDER:
    group_by:
      - USUBJID
      - PARAMCD
    order_by:
      - variable: _RANK_VAL
        direction: desc
        nulls: last
      - variable: _RANK_AVISITN
        nulls: last
      - variable: _ADT_DATE
        nulls: last
      - variable: LBSEQ
        nulls: last
    filter: "_RANK_AVISITN >= 2 AND _RANK_AVISITN <= 24"

  # Row-level
  BASE_ORD_ORDER:
    group_by:
      - USUBJID
      - PARAMCD
    order_by:
      - variable: LBSEQ
        nulls: last
  BASE_ORD_ORDER_2:
    group_by:
      - USUBJID
      - PARAMCD
    order_by:
      - variable: LBSEQ
        direction: desc
        nulls: last
    filter: >-
      VISIT IN ('WEEK 2', 'WEEK 4', 'WEEK 6', 'WEEK 8', 'WEEK
      12', 'WEEK 16', 'WEEK 20', 'WEEK 24')
  BASE_EOT_ORDER:
    group_by:
      - USUBJID
      - PARAMCD
    order_by:
      - variable: LBSEQ
        direction: desc
        nulls: last
    filter: >-
      _LBCAT = 'HEMATOLOGY' AND _VISIT_RAW NOT IN ('RETRIEVAL',
      'AMBUL ECG REMOVAL') AND _VISIT_RAW IN ('WEEK 2', 'WEEK
      4', 'WEEK 6', 'WEEK 8', 'WEEK 12', 'WEEK 16', 'WEEK 20',
      'WEEK 24')
  UNDER_ORD_ORDER:
    group_by:
      - USUBJID
      - _PARAMCD_BASE
    order_by:
      - variable: LBSEQ
        direction: desc
        nulls: last
    filter: >-
      VISIT IN ('WEEK 2', 'WEEK 4', 'WEEK 6', 'WEEK 8', 'WEEK
      12', 'WEEK 16', 'WEEK 20', 'WEEK 24')
  UNDER_EOT_ORDER:
    group_by:
      - USUBJID
      - _PARAMCD_BASE
    order_by:
      - variable: LBSEQ
        direction: desc
        nulls: last
    filter: >-
      _LBCAT = 'HEMATOLOGY' AND _VISIT_RAW NOT IN ('RETRIEVAL',
      'AMBUL ECG REMOVAL') AND _VISIT_RAW IN ('WEEK 2', 'WEEK
      4', 'WEEK 6', 'WEEK 8', 'WEEK 12', 'WEEK 16', 'WEEK 20',
      'WEEK 24')

intermediates:
  - id: PREV
    key:
      USUBJID: USUBJID
      LBTESTCD: _LBTESTCD
      LBSEQ: LBSEQ
    filter: >-
      LB.LBCAT = 'HEMATOLOGY' AND LB.VISIT NOT IN ('AMBUL ECG
      REMOVAL', 'BASELINE', 'RETRIEVAL') AND LB.VISIT NOT LIKE
      'UNSCHEDULED%'
    derivations:
      _AVISITN:
        case:
          - when: "LB.VISIT = 'SCREENING 1'"
            then: 0.0
          - when: "LB.VISIT = 'WEEK 2'"
            then: 2.0
          - when: "LB.VISIT = 'WEEK 4'"
            then: 4.0
          - when: "LB.VISIT = 'WEEK 6'"
            then: 6.0
          - when: "LB.VISIT = 'WEEK 8'"
            then: 8.0
          - when: "LB.VISIT = 'WEEK 12'"
            then: 12.0
          - when: "LB.VISIT = 'WEEK 16'"
            then: 16.0
          - when: "LB.VISIT = 'WEEK 20'"
            then: 20.0
          - when: "LB.VISIT = 'WEEK 24'"
            then: 24.0
          - when: "LB.VISIT = 'WEEK 26'"
            then: 26.0
          - otherwise:
      PREV_AVAL:
        row_value:
          source: LB.LBSTRESN
          offset: -1
          window: PREV_ORDER

columns:
  - name: _EOT_A1LO_RAW
    type: float
    label: "Working value: _EOT_A1LO_RAW"

  - name: _PARAM_UNDER_RAW
    type: str
    label: "Working value: _PARAM_UNDER_RAW"
    derivation:
      case:
        - when: "_IS_UNDER = 'Y'"
          then:
            str_template: >-
              {_PARAM_BASE} change from previous visit, relative
              to normal range
        - otherwise:

  - name: PARAM
    derivation:
      case:
        - when: "_IS_UNDER = 'Y'"
          then:
            str_extract:
              source: _PARAM_UNDER_RAW
              pattern: "^.{1,100}"
        - otherwise: _PARAM_BASE

  - name: PARCAT1
    derivation: "'HEM'"

rows:
  - id: base-ord
    filter: >-
      LB.LBCAT = 'HEMATOLOGY' AND LB.VISIT NOT IN ('RETRIEVAL',
      'AMBUL ECG REMOVAL', 'BASELINE')
    derivations:
      A1LO:
        case:
          - when: "LB.LBSTNRLO = 0"
            then:
          - otherwise: LB.LBSTNRLO
      # yamaa-lint: allow repeated_row_derivation -- Bind before grouping.
      _PARAM_BASE:
        mapping:
          source: LB.LBTESTCD
          unmapped:
          dict:
            HGB: 'Hemoglobin (mmol/L)'
            HCT: 'Hematocrit'
            MCV: 'Ery. Mean Corpuscular Volume (fL)'
            MCH: 'Ery. Mean Corpuscular Hemoglobin (fmol(Fe))'
            MCHC: 'Ery. Mean Corpuscular HGB Concentration (mmol/L)'
            WBC: 'Leukocytes (GI/L)'
            LYM: 'Lymphocytes (GI/L)'
            MONO: 'Monocytes (GI/L)'
            EOS: 'Eosinophils (GI/L)'
            BASO: 'Basophils (GI/L)'
            PLAT: 'Platelet (GI/L)'
            RBC: 'Erythrocytes (TI/L)'
            ANISO: 'Anisocytes'
            MACROCY: 'Macrocytes'
            MICROCY: 'Microcytes'
            POIKILO: 'Poikilocytes'
            POLYCHR: 'Polychromasia'
      # yamaa-lint: allow repeated_row_derivation -- Bind before grouping.
      _PARAMN_BASE:
        mapping:
          source: LB.LBTESTCD
          unmapped:
          dict:
            HGB: 1.0
            HCT: 2.0
            MCV: 3.0
            MCH: 4.0
            MCHC: 5.0
            WBC: 6.0
            LYM: 7.0
            MONO: 8.0
            EOS: 9.0
            BASO: 10.0
            PLAT: 11.0
            RBC: 12.0
            ANISO: 13.0
            MACROCY: 14.0
            MICROCY: 15.0
            POIKILO: 16.0
            POLYCHR: 17.0
      _EOT_A1LO_RAW:
      ALBTRVAL:
        case:
          - when: "A1LO IS NULL AND A1HI IS NULL"
            then:
          - when: "A1LO IS NULL"
            then:
              greatest:
                sources:
                  - _T1
                  - _AVAL_BASE
          - when: "A1HI IS NULL"
            then: _T2
          - otherwise:
              greatest:
                sources:
                  - _T1
                  - _T2
      _R2A1LO_R: "_AVAL_BASE / A1LO"
      _ANRIND_BASE:
        case:
          - when: "_R2A1HI_R > 1.5"
            then: "'H'"
          - when: "_R2A1LO_R < 0.5"
            then: "'L'"
          - when: "A1LO IS NULL AND A1HI IS NULL AND _AVAL_BASE
              IS NOT NULL"
            then: "'H'"
          - otherwise: "'N'"
      _LBTESTCD: LB.LBTESTCD

  - id: base-eot
    derivations:
      _EOT_A1LO_RAW:
        aggregate: "ONLY(LB.LBSTNRLO)"
      A1LO:
        case:
          - when: "_EOT_A1LO_RAW = 0"
            then:
          - otherwise: _EOT_A1LO_RAW
      _PARAM_BASE:
        mapping:
          source: LB.LBTESTCD
          unmapped:
          dict:
            HGB: 'Hemoglobin (mmol/L)'
            HCT: 'Hematocrit'
            MCV: 'Ery. Mean Corpuscular Volume (fL)'
            MCH: 'Ery. Mean Corpuscular Hemoglobin (fmol(Fe))'
            MCHC: 'Ery. Mean Corpuscular HGB Concentration (mmol/L)'
            WBC: 'Leukocytes (GI/L)'
            LYM: 'Lymphocytes (GI/L)'
            MONO: 'Monocytes (GI/L)'
            EOS: 'Eosinophils (GI/L)'
            BASO: 'Basophils (GI/L)'
            PLAT: 'Platelet (GI/L)'
            RBC: 'Erythrocytes (TI/L)'
            ANISO: 'Anisocytes'
            MACROCY: 'Macrocytes'
            MICROCY: 'Microcytes'
            POIKILO: 'Poikilocytes'
            POLYCHR: 'Polychromasia'
      _PARAMN_BASE:
        mapping:
          source: LB.LBTESTCD
          unmapped:
          dict:
            HGB: 1.0
            HCT: 2.0
            MCV: 3.0
            MCH: 4.0
            MCHC: 5.0
            WBC: 6.0
            LYM: 7.0
            MONO: 8.0
            EOS: 9.0
            BASO: 10.0
            PLAT: 11.0
            RBC: 12.0
            ANISO: 13.0
            MACROCY: 14.0
            MICROCY: 15.0
            POIKILO: 16.0
            POLYCHR: 17.0
      ALBTRVAL:
        case:
          - when: "A1LO IS NULL AND A1HI IS NULL"
            then:
          - when: "A1LO IS NULL"
            then:
              greatest:
                sources:
                  - _T1
                  - _AVAL_BASE
          - when: "A1HI IS NULL"
            then: _T2
          - otherwise:
              greatest:
                sources:
                  - _T1
                  - _T2
      _R2A1LO_R: "_AVAL_BASE / A1LO"
      _ANRIND_BASE:
        case:
          - when: "_R2A1HI_R > 1.5"
            then: "'H'"
          - when: "_R2A1LO_R < 0.5"
            then: "'L'"
          - when: "A1LO IS NULL AND A1HI IS NULL AND _AVAL_BASE
              IS NOT NULL"
            then: "'H'"
          - otherwise: "'N'"

  - id: under-ord
    filter: >-
      LB.LBCAT = 'HEMATOLOGY' AND LB.VISIT NOT IN ('RETRIEVAL',
      'AMBUL ECG REMOVAL', 'BASELINE')
    derivations:
      _PARAM_BASE:
        mapping:
          source: LB.LBTESTCD
          unmapped:
          dict:
            HGB: 'Hemoglobin (mmol/L)'
            HCT: 'Hematocrit'
            MCV: 'Ery. Mean Corpuscular Volume (fL)'
            MCH: 'Ery. Mean Corpuscular Hemoglobin (fmol(Fe))'
            MCHC: 'Ery. Mean Corpuscular HGB Concentration (mmol/L)'
            WBC: 'Leukocytes (GI/L)'
            LYM: 'Lymphocytes (GI/L)'
            MONO: 'Monocytes (GI/L)'
            EOS: 'Eosinophils (GI/L)'
            BASO: 'Basophils (GI/L)'
            PLAT: 'Platelet (GI/L)'
            RBC: 'Erythrocytes (TI/L)'
            ANISO: 'Anisocytes'
            MACROCY: 'Macrocytes'
            MICROCY: 'Microcytes'
            POIKILO: 'Poikilocytes'
            POLYCHR: 'Polychromasia'
      _PARAMN_BASE:
        mapping:
          source: LB.LBTESTCD
          unmapped:
          dict:
            HGB: 1.0
            HCT: 2.0
            MCV: 3.0
            MCH: 4.0
            MCHC: 5.0
            WBC: 6.0
            LYM: 7.0
            MONO: 8.0
            EOS: 9.0
            BASO: 10.0
            PLAT: 11.0
            RBC: 12.0
            ANISO: 13.0
            MACROCY: 14.0
            MICROCY: 15.0
            POIKILO: 16.0
            POLYCHR: 17.0
      _SCHED:
        case:
          - when: >-
              AVISIT = '               .' OR AVISIT = 'End of
              Treatment' OR AVISIT = '        Baseline'
            then: "''"
          - otherwise: "'Y'"
      _EOT_A1LO_RAW:
      ALBTRVAL:
        case:
          - when: "_B_A1LO IS NULL AND _B_A1HI IS NULL"
            then:
          - when: "_B_A1LO IS NULL"
            then: _T1
          - when: "_B_A1HI IS NULL"
            then: _T2
          - otherwise:
              greatest:
                sources:
                  - _T1
                  - _T2
      _LBTESTCD: LB.LBTESTCD

  - id: under-eot
    derivations:
      _PARAM_BASE:
        mapping:
          source: LB.LBTESTCD
          unmapped:
          dict:
            HGB: 'Hemoglobin (mmol/L)'
            HCT: 'Hematocrit'
            MCV: 'Ery. Mean Corpuscular Volume (fL)'
            MCH: 'Ery. Mean Corpuscular Hemoglobin (fmol(Fe))'
            MCHC: 'Ery. Mean Corpuscular HGB Concentration (mmol/L)'
            WBC: 'Leukocytes (GI/L)'
            LYM: 'Lymphocytes (GI/L)'
            MONO: 'Monocytes (GI/L)'
            EOS: 'Eosinophils (GI/L)'
            BASO: 'Basophils (GI/L)'
            PLAT: 'Platelet (GI/L)'
            RBC: 'Erythrocytes (TI/L)'
            ANISO: 'Anisocytes'
            MACROCY: 'Macrocytes'
            MICROCY: 'Microcytes'
            POIKILO: 'Poikilocytes'
            POLYCHR: 'Polychromasia'
      _PARAMN_BASE:
        mapping:
          source: LB.LBTESTCD
          unmapped:
          dict:
            HGB: 1.0
            HCT: 2.0
            MCV: 3.0
            MCH: 4.0
            MCHC: 5.0
            WBC: 6.0
            LYM: 7.0
            MONO: 8.0
            EOS: 9.0
            BASO: 10.0
            PLAT: 11.0
            RBC: 12.0
            ANISO: 13.0
            MACROCY: 14.0
            MICROCY: 15.0
            POIKILO: 16.0
            POLYCHR: 17.0
      _EOT_A1LO_RAW:
      ALBTRVAL:
        case:
          - when: "_B_A1LO IS NULL AND _B_A1HI IS NULL"
            then:
          - when: "_B_A1LO IS NULL"
            then: _T1
          - when: "_B_A1HI IS NULL"
            then: _T2
          - otherwise:
              greatest:
                sources:
                  - _T1
                  - _T2

verifications:
  - assert:
      id: treatment_date_order
      when: "TRTSDT IS NOT NULL AND TRTEDT IS NOT NULL"
      require: "TRTEDT >= TRTSDT"
