yamaa: "1.0"
type: spec
model: ADaM
domain: ADLBH
submission:
  mode: historical
  label: Analysis Dataset Lab Hematology
  class: BASIC DATA STRUCTURE
  structure: one record per subject per parameter per analysis visit
  repeating: true
  reference_data: false
  artifact: adlbh.xpt
keys:
  - STUDYID
  - USUBJID
  - PARAMCD
  - LBSEQ
  - AVISIT
input:
  LB:
    path: ../../data/sdtm/lb.parquet
    empty_string: present
    key:
      - STUDYID
      - USUBJID
  ADSL:
    path: ../../data/adam/adsl-yamaa.parquet
    schema: adsl.yaml
    empty_string: present
base: LB

output:
  path: ../../data/adam/adlbh-yamaa.parquet
  columns:
    - STUDYID
    - SUBJID
    - USUBJID
    - TRTP
    - TRTPN
    - TRTA
    - TRTAN
    - TRTSDT
    - TRTEDT
    - AGE
    - AGEGR1
    - AGEGR1N
    - RACE
    - RACEN
    - SEX
    - COMP24FL
    - DSRAEFL
    - SAFFL
    - AVISIT
    - AVISITN
    - ADY
    - ADT
    - VISIT
    - VISITNUM
    - PARAM
    - PARAMCD
    - PARAMN
    - PARCAT1
    - AVAL
    - BASE
    - CHG
    - A1LO
    - A1HI
    - R2A1LO
    - R2A1HI
    - BR2A1LO
    - BR2A1HI
    - ANL01FL
    - ALBTRVAL
    - ANRIND
    - BNRIND
    - ABLFL
    - AENTMTFL
    - LBSEQ
    - LBNRIND
    - LBSTRESN
  order_by:
    - variable: USUBJID
      nulls: last
    - variable: ADY
      nulls: last
    - variable: PARAMN
      nulls: last
    - variable: AVISITN
      nulls: last

intermediates:
  - id: ADSL_SBJ
    dataset: ADSL
    key:
      - USUBJID

  - id: PREV
    dataset: LB
    key: {USUBJID: USUBJID, LBTESTCD: _LBTESTCD, LBSEQ: LBSEQ}
    filter: "LB.LBCAT = 'HEMATOLOGY' AND LB.VISIT NOT IN ('AMBUL ECG REMOVAL', 'BASELINE', 'RETRIEVAL') AND LB.VISIT NOT LIKE 'UNSCHEDULED%'"
    columns:
      - PREV_AVAL
    derivations:
      _AVISITN:
        case:
          - when: "LB.VISIT = 'SCREENING 1'"
            then: 0.0
          - when: "LB.VISIT = 'WEEK 2'"
            then: 2.0
          - when: "LB.VISIT = 'WEEK 4'"
            then: 4.0
          - when: "LB.VISIT = 'WEEK 6'"
            then: 6.0
          - when: "LB.VISIT = 'WEEK 8'"
            then: 8.0
          - when: "LB.VISIT = 'WEEK 12'"
            then: 12.0
          - when: "LB.VISIT = 'WEEK 16'"
            then: 16.0
          - when: "LB.VISIT = 'WEEK 20'"
            then: 20.0
          - when: "LB.VISIT = 'WEEK 24'"
            then: 24.0
          - when: "LB.VISIT = 'WEEK 26'"
            then: 26.0
          - otherwise:
      PREV_AVAL:
        row_value:
          source: LB.LBSTRESN
          offset: -1
          window:
            group_by:
              - LB.USUBJID
              - LB.LBTESTCD
            order_by:
              - {variable: _AVISITN, nulls: last}
              - {variable: LB.LBDTC, nulls: last}
              - {variable: LB.LBSEQ, nulls: last}
            filter: "LB.LBCAT = 'HEMATOLOGY' AND LB.VISIT NOT IN ('AMBUL ECG REMOVAL', 'BASELINE', 'RETRIEVAL') AND LB.VISIT NOT LIKE 'UNSCHEDULED%'"

columns:
  # ADSL lookups (via ADSL_SBJ intermediate)
  - name: STUDYID
    type: str
    label: Study Identifier

    submission:
      data_type: text
      length: 12
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.STUDYID
  - name: SUBJID
    type: str
    label: Subject Identifier for the Study
    derivation: ADSL_SBJ.SUBJID

    submission:
      data_type: text
      length: 4
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.SUBJID
  - name: USUBJID
    type: str
    label: Unique Subject Identifier

    submission:
      data_type: text
      length: 11
      mandatory: false
      key_sequence: 1
      origins:
        - type: Derived
      comment: ADSL.USUBJID
  - name: TRTP
    type: str
    label: Planned Treatment
    derivation: ADSL_SBJ.TRT01P

    submission:
      data_type: text
      length: 20
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.TRT01P
      codelist: ARM
  - name: TRTPN
    type: float
    label: Planned Treatment (N)
    derivation: ADSL_SBJ.TRT01PN

    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.TRT01PN
      codelist: ARMN
  - name: TRTA
    type: str
    label: Actual Treatment
    derivation: ADSL_SBJ.TRT01A

    submission:
      data_type: text
      length: 20
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.TRT01A
      codelist: ARM
  - name: TRTAN
    type: float
    label: Actual Treatment (N)
    derivation: ADSL_SBJ.TRT01AN

    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.TRT01AN
      codelist: ARMN
  - name: TRTSDT
    type: date
    label: Date of First Exposure to Treatment
    derivation: ADSL_SBJ.TRTSDT

    submission:
      data_type: integer
      length: 8
      mandatory: false
      display_format: DATE9.
      origins:
        - type: Derived
      comment: ADSL.TRTSDT
  - name: TRTEDT
    type: date
    label: Date of Last Exposure to Treatment
    derivation: ADSL_SBJ.TRTEDT

    submission:
      data_type: integer
      length: 8
      mandatory: false
      display_format: DATE9.
      origins:
        - type: Derived
      comment: ADSL.TRTEDT
  - name: AGE
    type: float
    label: Age
    derivation: ADSL_SBJ.AGE

    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.AGE
  - name: AGEGR1
    type: str
    label: Pooled Age Group 1
    derivation: ADSL_SBJ.AGEGR1

    submission:
      data_type: text
      length: 5
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.AGEGR1
      codelist: AGEGR1
  - name: AGEGR1N
    type: float
    label: Pooled Age Group 1 (N)
    derivation: ADSL_SBJ.AGEGR1N

    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.AGEGR1N
      codelist: AGEGR1N
  - name: RACE
    type: str
    label: Race
    derivation: ADSL_SBJ.RACE

    submission:
      data_type: text
      length: 32
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.RACE
      codelist: RACE
  - name: RACEN
    type: float
    label: Race (N)
    derivation: ADSL_SBJ.RACEN

    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.RACEN
      codelist: RACEN
  - name: SEX
    type: str
    label: Sex
    derivation: ADSL_SBJ.SEX

    submission:
      data_type: text
      length: 1
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.SEX
      codelist: SEX
  - name: COMP24FL
    type: str
    label: Completers of Week 24 Population Flag
    derivation: ADSL_SBJ.COMP24FL

    submission:
      data_type: text
      length: 1
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.COMP24FL
      codelist: YN
  - name: DSRAEFL
    type: str
    label: Discontinued due to AE?
    derivation: ADSL_SBJ.DSRAEFL

    submission:
      data_type: text
      length: 1
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.DSRAEFL
      codelist: YN
  - name: SAFFL
    type: str
    label: Safety Population Flag
    derivation: ADSL_SBJ.SAFFL

  # Helpers (not in output)
    submission:
      data_type: text
      length: 1
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.SAFFL
      codelist: YN
  - name: _IS_UNDER
    type: str
    label: "Working value: _IS_UNDER"

  - name: _IS_EOT
    type: str
    label: "Working value: _IS_EOT"

  - name: _LBDTM_TXT
    type: str
    label: "Working value: _LBDTM_TXT"

  - name: _LBDTM
    type: datetime
    label: "Working value: _LBDTM"

  - name: _ADT_DATE
    type: date
    label: "Working value: _ADT_DATE"

  - name: _PARAM_BASE
    type: str
    label: "Working value: _PARAM_BASE"

  - name: _PARAMN_BASE
    type: float
    label: "Working value: _PARAMN_BASE"

  - name: _EOT_A1LO_RAW
    type: float
    label: "Working value: _EOT_A1LO_RAW"

  - name: _PARAM_UNDER_RAW
    type: str
    label: "Working value: _PARAM_UNDER_RAW"
    derivation:
      case:
        - when: "_IS_UNDER = 'Y'"
          then:
            str_template: "{_PARAM_BASE} change from previous visit, relative to normal range"
        - otherwise:

  - name: _R2A1HI_R
    type: float
    label: "Working value: _R2A1HI_R"

  - name: _R2A1LO_R
    type: float
    label: "Working value: _R2A1LO_R"

  - name: _ANRIND_BASE
    type: str
    label: "Working value: _ANRIND_BASE"

  - name: _BASELINE_ANRIND
    type: str
    label: "Working value: _BASELINE_ANRIND"

  - name: _PNM_BNRIND
    type: str
    label: "Working value: _PNM_BNRIND"

  - name: _BNRIND_VAL
    type: str
    label: "Working value: _BNRIND_VAL"

  - name: _AVAL_BASE
    type: float
    label: "Working value: _AVAL_BASE"

  - name: _BASE
    type: float
    label: "Working value: _BASE"

  - name: _BASELINE_AVAL
    type: float
    label: "Working value: _BASELINE_AVAL"

  - name: _PNM_BASE
    type: float
    label: "Working value: _PNM_BASE"

  - name: _IS_LAST_ELIGIBLE
    type: int
    label: "Working value: _IS_LAST_ELIGIBLE"

  - name: _RANK_AVISITN
    type: float
    label: "Working value: _RANK_AVISITN"

  - name: _T1
    type: float
    label: "Working value: _T1"

  - name: _T2
    type: float
    label: "Working value: _T2"

  - name: _B_A1HI
    type: float
    label: "Working value: _B_A1HI"

  - name: _B_A1LO
    type: float
    label: "Working value: _B_A1LO"

  - name: _PARAMCD_BASE
    type: str
    label: "Working value: _PARAMCD_BASE"

  - name: _SCHED
    type: str
    label: "Working value: _SCHED"

  - name: _PREV_AVAL
    type: float
    label: "Working value: _PREV_AVAL"

  - name: _U_RAW
    type: float
    label: "Working value: _U_RAW"

  - name: _U_AVAL_ROUNDED
    type: float
    label: "Working value: _U_AVAL_ROUNDED"
    derivation:
      round_half_away_from_zero:
        source: _U_RAW
        digits: 1

  - name: _U_AVAL
    type: float
    label: "Working value: _U_AVAL"
    derivation:
      case:
        - when: "_IS_UNDER = 'Y' AND _SCHED = 'Y'"
          then: _U_AVAL_ROUNDED
        - otherwise:

  - name: _ABS_U_AVAL
    type: float
    label: "Working value: _ABS_U_AVAL"
    derivation: "abs(_U_AVAL)"

  - name: _LBCAT
    type: str
    label: "Working value: _LBCAT"

  - name: _VISIT_RAW
    type: str
    label: "Working value: _VISIT_RAW"

  - name: _LBBLFL
    type: str
    label: "Working value: _LBBLFL"

  - name: _LBTESTCD
    type: str
    label: "Working value: _LBTESTCD"

  - name: ABLFL
    type: str
    label: Baseline Record Flag

    submission:
      data_type: text
      length: 1
      mandatory: false
      origins:
        - type: Derived
      codelist: Y_BLANK
      value_level:
        - id: ANISO
          where:
            PARAMCD:
              - ANISO
          label: Anisocytes
          data_type: text
          length: 1
          mandatory: false
          origins:
            - type: Derived
          comment: Y if VISITNUM=1, null otherwise
          codelist: Y_BLANK
        - id: BASO
          where:
            PARAMCD:
              - BASO
          label: Basophils (GI/L)
          data_type: text
          length: 1
          mandatory: false
          origins:
            - type: Derived
          comment: Y if VISITNUM=1, null otherwise
          codelist: Y_BLANK
        - id: EOS
          where:
            PARAMCD:
              - EOS
          label: Eosinophils (GI/L)
          data_type: text
          length: 1
          mandatory: false
          origins:
            - type: Derived
          comment: Y if VISITNUM=1, null otherwise
          codelist: Y_BLANK
        - id: MCHC
          where:
            PARAMCD:
              - MCHC
          label: Ery. Mean Corpuscular HGB Concentration (mmol/L)
          data_type: text
          length: 1
          mandatory: false
          origins:
            - type: Derived
          comment: Y if VISITNUM=1, null otherwise
          codelist: Y_BLANK
        - id: MCH
          where:
            PARAMCD:
              - MCH
          label: Ery. Mean Corpuscular Hemoglobin (fmol(Fe))
          data_type: text
          length: 1
          mandatory: false
          origins:
            - type: Derived
          comment: Y if VISITNUM=1, null otherwise
          codelist: Y_BLANK
        - id: MCV
          where:
            PARAMCD:
              - MCV
          label: Ery. Mean Corpuscular Volume (fL)
          data_type: text
          length: 1
          mandatory: false
          origins:
            - type: Derived
          comment: Y if VISITNUM=1, null otherwise
          codelist: Y_BLANK
        - id: RBC
          where:
            PARAMCD:
              - RBC
          label: Erythrocytes (TI/L)
          data_type: text
          length: 1
          mandatory: false
          origins:
            - type: Derived
          comment: Y if VISITNUM=1, null otherwise
          codelist: Y_BLANK
        - id: HCT
          where:
            PARAMCD:
              - HCT
          label: Hematocrit
          data_type: text
          length: 1
          mandatory: false
          origins:
            - type: Derived
          comment: Y if VISITNUM=1, null otherwise
          codelist: Y_BLANK
        - id: HGB
          where:
            PARAMCD:
              - HGB
          label: Hemoglobin (mmol/L)
          data_type: text
          length: 1
          mandatory: false
          origins:
            - type: Derived
          comment: Y if VISITNUM=1, null otherwise
          codelist: Y_BLANK
        - id: WBC
          where:
            PARAMCD:
              - WBC
          label: Leukocytes (GI/L)
          data_type: text
          length: 1
          mandatory: false
          origins:
            - type: Derived
          comment: Y if VISITNUM=1, null otherwise
          codelist: Y_BLANK
        - id: LYM
          where:
            PARAMCD:
              - LYM
          label: Lymphocytes (GI/L)
          data_type: text
          length: 1
          mandatory: false
          origins:
            - type: Derived
          comment: Y if VISITNUM=1, null otherwise
          codelist: Y_BLANK
        - id: MACROCY
          where:
            PARAMCD:
              - MACROCY
          label: Macrocytes
          data_type: text
          length: 1
          mandatory: false
          origins:
            - type: Derived
          comment: Y if VISITNUM=1, null otherwise
          codelist: Y_BLANK
        - id: MICROCY
          where:
            PARAMCD:
              - MICROCY
          label: Microcytes
          data_type: text
          length: 1
          mandatory: false
          origins:
            - type: Derived
          comment: Y if VISITNUM=1, null otherwise
          codelist: Y_BLANK
        - id: MONO
          where:
            PARAMCD:
              - MONO
          label: Monocytes (GI/L)
          data_type: text
          length: 1
          mandatory: false
          origins:
            - type: Derived
          comment: Y if VISITNUM=1, null otherwise
          codelist: Y_BLANK
        - id: PLAT
          where:
            PARAMCD:
              - PLAT
          label: Platelet (GI/L)
          data_type: text
          length: 1
          mandatory: false
          origins:
            - type: Derived
          comment: Y if VISITNUM=1, null otherwise
          codelist: Y_BLANK
        - id: POIKILO
          where:
            PARAMCD:
              - POIKILO
          label: Poikilocytes
          data_type: text
          length: 1
          mandatory: false
          origins:
            - type: Derived
          comment: Y if VISITNUM=1, null otherwise
          codelist: Y_BLANK
        - id: POLYCHR
          where:
            PARAMCD:
              - POLYCHR
          label: Polychromasia
          data_type: text
          length: 1
          mandatory: false
          origins:
            - type: Derived
          comment: Y if VISITNUM=1, null otherwise
          codelist: Y_BLANK
        - id: _ANISO
          where:
            PARAMCD:
              - _ANISO
          label: Anisocytes change from previous visit, relative to normal range
          data_type: text
          length: 1
          mandatory: false
          origins:
            - type: Derived
          comment: Set to missing
        - id: _BASO
          where:
            PARAMCD:
              - _BASO
          label: Basophils (GI/L) change from previous visit, relative to normal range
          data_type: text
          length: 1
          mandatory: false
          origins:
            - type: Derived
          comment: Set to missing
        - id: _EOS
          where:
            PARAMCD:
              - _EOS
          label: Eosinophils (GI/L) change from previous visit, relative to normal range
          data_type: text
          length: 1
          mandatory: false
          origins:
            - type: Derived
          comment: Set to missing
        - id: _MCHC
          where:
            PARAMCD:
              - _MCHC
          label: Ery. Mean Corpuscular HGB Concentration (mmol/L) change from previous visit, relative to normal rang
          data_type: text
          length: 1
          mandatory: false
          origins:
            - type: Derived
          comment: Set to missing
        - id: _MCH
          where:
            PARAMCD:
              - _MCH
          label: Ery. Mean Corpuscular Hemoglobin (fmol(Fe)) change from previous visit, relative to normal range
          data_type: text
          length: 1
          mandatory: false
          origins:
            - type: Derived
          comment: Set to missing
        - id: _MCV
          where:
            PARAMCD:
              - _MCV
          label: Ery. Mean Corpuscular Volume (fL) change from previous visit, relative to normal range
          data_type: text
          length: 1
          mandatory: false
          origins:
            - type: Derived
          comment: Set to missing
        - id: _RBC
          where:
            PARAMCD:
              - _RBC
          label: Erythrocytes (TI/L) change from previous visit, relative to normal range
          data_type: text
          length: 1
          mandatory: false
          origins:
            - type: Derived
          comment: Set to missing
        - id: _HCT
          where:
            PARAMCD:
              - _HCT
          label: Hematocrit change from previous visit, relative to normal range
          data_type: text
          length: 1
          mandatory: false
          origins:
            - type: Derived
          comment: Set to missing
        - id: _HGB
          where:
            PARAMCD:
              - _HGB
          label: Hemoglobin (mmol/L) change from previous visit, relative to normal range
          data_type: text
          length: 1
          mandatory: false
          origins:
            - type: Derived
          comment: Set to missing
        - id: _WBC
          where:
            PARAMCD:
              - _WBC
          label: Leukocytes (GI/L) change from previous visit, relative to normal range
          data_type: text
          length: 1
          mandatory: false
          origins:
            - type: Derived
          comment: Set to missing
        - id: _LYM
          where:
            PARAMCD:
              - _LYM
          label: Lymphocytes (GI/L) change from previous visit, relative to normal range
          data_type: text
          length: 1
          mandatory: false
          origins:
            - type: Derived
          comment: Set to missing
        - id: _MACROCY
          where:
            PARAMCD:
              - _MACROCY
          label: Macrocytes change from previous visit, relative to normal range
          data_type: text
          length: 1
          mandatory: false
          origins:
            - type: Derived
          comment: Set to missing
        - id: _MICROCY
          where:
            PARAMCD:
              - _MICROCY
          label: Microcytes change from previous visit, relative to normal range
          data_type: text
          length: 1
          mandatory: false
          origins:
            - type: Derived
          comment: Set to missing
        - id: _MONO
          where:
            PARAMCD:
              - _MONO
          label: Monocytes (GI/L) change from previous visit, relative to normal range
          data_type: text
          length: 1
          mandatory: false
          origins:
            - type: Derived
          comment: Set to missing
        - id: _PLAT
          where:
            PARAMCD:
              - _PLAT
          label: Platelet (GI/L) change from previous visit, relative to normal range
          data_type: text
          length: 1
          mandatory: false
          origins:
            - type: Derived
          comment: Set to missing
        - id: _POIKILO
          where:
            PARAMCD:
              - _POIKILO
          label: Poikilocytes change from previous visit, relative to normal range
          data_type: text
          length: 1
          mandatory: false
          origins:
            - type: Derived
          comment: Set to missing
        - id: _POLYCHR
          where:
            PARAMCD:
              - _POLYCHR
          label: Polychromasia change from previous visit, relative to normal range
          data_type: text
          length: 1
          mandatory: false
          origins:
            - type: Derived
          comment: Set to missing
  - name: ALBTRVAL
    type: float
    label: Amount Threshold Range

    submission:
      data_type: float
      length: 8
      mandatory: false
      significant_digits: 3
      origins:
        - type: Derived
      comment: Maximum of [LBSTRESN-(1.5*ULN)] and [(.5*LLN) - LBSTRESN]
  - name: _RANK_VAL
    type: float
    label: "Working value: _RANK_VAL"
    derivation:
      case:
        - when: "_IS_UNDER = 'Y'"
          then: _ABS_U_AVAL
        - otherwise: ALBTRVAL

  - name: _ANL01_RANK
    type: int
    label: "Working value: _ANL01_RANK"
    derivation:
      rank:
        window:
          group_by:
            - USUBJID
            - PARAMCD
          order_by:
            - {variable: _RANK_VAL, direction: desc, nulls: last}
            - {variable: _RANK_AVISITN, nulls: last}
            - {variable: _ADT_DATE, nulls: last}
            - {variable: LBSEQ, nulls: last}
          filter: "_RANK_AVISITN >= 2 AND _RANK_AVISITN <= 24"

  # Row-level
  - name: AVISIT
    type: str
    label: Analysis Visit

