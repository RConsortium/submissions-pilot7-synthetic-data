schema_version: "1.0"
domain: ADQSCIBC_S4
keys: [USUBJID]
input:
  S4J:
    path: adqscibc-s4j.parquet
    empty_string: present
base: S4J

rows:
  - id: w16locf
    dataset: S4J
    group_by: [S4J.USUBJID]
    filter: "_H16E IS NULL AND _P16E IS NOT NULL AND _W8E IS NOT NULL"
    derivations:
      _H16E: {aggregate: "ONLY(S4J._HAS16_EXISTS)"}
      _P16E: {aggregate: "ONLY(S4J._P16_EXISTS)"}
      _W8E: {aggregate: "ONLY(S4J._W8_EXISTS)"}
      _P_QSDY: {aggregate: "ONLY(S4J._P16_QSDY)"}
      _AVISIT: {literal: 'Week 16'}
      _AVISITN: {literal: 16.0}
      _AWTARGET: {literal: 112.0}
      _AWLO: {literal: 85.0}
      _AWHI: {literal: 140.0}
      _AWRANGE: {literal: '85-140'}
      _AWTDIFF:
        compute:
          expr: "ABS(_P_QSDY - 112.0)"
      _DTYPE: {literal: 'LOCF'}
      _ANL01FL: {literal: 'Y'}
      _RANK: {literal: null}
      _AVAL: {aggregate: "ONLY(S4J._W8_AVAL)"}
      _VISIT: {aggregate: "ONLY(S4J._P16_VISIT)"}
      _VISITNUM: {aggregate: "ONLY(S4J._P16_VISITNUM)"}
      _QSDY: {aggregate: "ONLY(S4J._P16_QSDY)"}
      _QSDTC: {aggregate: "ONLY(S4J._P16_QSDTC)"}
      _QSSEQ: {aggregate: "ONLY(S4J._P16_QSSEQ)"}
      _SITEID: {aggregate: "ONLY(S4J._SITEID)"}
      _SITEGR1: {aggregate: "ONLY(S4J._SITEGR1)"}
      _TRTSDT: {aggregate: "ONLY(S4J._TRTSDT)"}
      _TRTEDT: {aggregate: "ONLY(S4J._TRTEDT)"}
      _TRT01P: {aggregate: "ONLY(S4J._TRT01P)"}
      _TRT01PN: {aggregate: "ONLY(S4J._TRT01PN)"}
      _AGE: {aggregate: "ONLY(S4J._AGE)"}
      _AGEGR1: {aggregate: "ONLY(S4J._AGEGR1)"}
      _AGEGR1N: {aggregate: "ONLY(S4J._AGEGR1N)"}
      _RACE: {aggregate: "ONLY(S4J._RACE)"}
      _RACEN: {aggregate: "ONLY(S4J._RACEN)"}
      _SEX: {aggregate: "ONLY(S4J._SEX)"}
      _ITTFL: {aggregate: "ONLY(S4J._ITTFL)"}
      _EFFFL: {aggregate: "ONLY(S4J._EFFFL)"}
      _COMP24FL: {aggregate: "ONLY(S4J._COMP24FL)"}

output:
  path: adqscibc-s4.parquet
  order_by: [USUBJID]
  columns: [USUBJID, QSSEQ, VISIT, VISITNUM, QSDY, QSDTC,
    _AVISIT, _AVISITN, _AWTARGET, _AWLO, _AWHI, _AWRANGE, _AWTDIFF, _DTYPE, _AVAL,
    _ANL01FL, _RANK,
    _SITEID, _SITEGR1, _TRTSDT, _TRTEDT, _TRT01P, _TRT01PN, _AGE, _AGEGR1, _AGEGR1N,
    _RACE, _RACEN, _SEX, _ITTFL, _EFFFL, _COMP24FL]

columns:
  - name: USUBJID
    type: str
    derivation: S4J.USUBJID
  - name: _H16E
    type: str
  - name: _P16E
    type: str
  - name: _W8E
    type: str
  - name: _QSSEQ
    type: float
  - name: _VISIT
    type: str
  - name: _VISITNUM
    type: float
  - name: _QSDY
    type: float
  - name: _QSDTC
    type: str
  - name: QSSEQ
    type: float
    derivation: {source: _QSSEQ}
  - name: VISIT
    type: str
    derivation: {source: _VISIT}
  - name: VISITNUM
    type: float
    derivation: {source: _VISITNUM}
  - name: QSDY
    type: float
    derivation: {source: _QSDY}
  - name: QSDTC
    type: str
    derivation: {source: _QSDTC}
  - name: _AVISIT
    type: str
  - name: _AVISITN
    type: float
  - name: _AWTARGET
    type: float
  - name: _AWLO
    type: float
  - name: _AWHI
    type: float
  - name: _AWRANGE
    type: str
  - name: _AWTDIFF
    type: float
  - name: _DTYPE
    type: str
  - name: _AVAL
    type: float
  - name: _ANL01FL
    type: str
  - name: _RANK
    type: float
  - name: _SITEID
    type: str
  - name: _SITEGR1
    type: str
  - name: _TRTSDT
    type: date
  - name: _TRTEDT
    type: date
  - name: _TRT01P
    type: str
  - name: _TRT01PN
    type: float
  - name: _AGE
    type: float
  - name: _AGEGR1
    type: str
  - name: _AGEGR1N
    type: float
  - name: _RACE
    type: str
  - name: _RACEN
    type: float
  - name: _SEX
    type: str
  - name: _ITTFL
    type: str
  - name: _EFFFL
    type: str
  - name: _COMP24FL
    type: str
  - name: _P_QSDY
    type: float
