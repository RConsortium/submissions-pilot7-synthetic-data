# CIBIC observations, closest-to-target selection, and LOCF visits.
# Only visits with an earlier observed score receive a LOCF record.
# SCORE donors supply the last selected value; DONOR records supply the
# latest observation's date, visit, and sequence, including unselected rows.
# Variable metadata: ../define/define-adam.xml, ADQSCIBC.

yamaa: '1.0'
type: spec
model: ADaM
domain: ADQSCIBC
submission:
  mode: historical
  label: CIBIC+ Analysis
  class: BASIC DATA STRUCTURE
  structure: one record per subject per parameter per analysis visit per analysis date
  repeating: true
  reference_data: false
  artifact: adqscibc.xpt
keys:
  - STUDYID
  - USUBJID
  - PARAMCD
  - AVISITN
  - QSSEQ
input:
  QS:
    path: ../../data/sdtm/qs.parquet
    empty_string: present
  ADSL:
    path: ../../data/adam/adsl-yamaa.parquet
    schema: adsl.yaml
    key:
      - STUDYID
      - USUBJID
    empty_string: present
base: QS
output:
  path: ../../data/adam/adqscibc-yamaa.parquet
  columns:
    - STUDYID
    - SITEID
    - SITEGR1
    - USUBJID
    - TRTSDT
    - TRTEDT
    - TRTP
    - TRTPN
    - AGE
    - AGEGR1
    - AGEGR1N
    - RACE
    - RACEN
    - SEX
    - ITTFL
    - EFFFL
    - COMP24FL
    - AVISIT
    - AVISITN
    - VISIT
    - VISITNUM
    - ADY
    - ADT
    - PARAMCD
    - PARAM
    - PARAMN
    - AVAL
    - ANL01FL
    - DTYPE
    - AWRANGE
    - AWTARGET
    - AWTDIFF
    - AWLO
    - AWHI
    - AWU
    - QSSEQ
  order_by:
    - variable: USUBJID
      nulls: last
    - variable: PARAMN
      nulls: last
    - variable: AVISITN
      nulls: last
    - variable: QSSEQ
      nulls: last
intermediates:
  - id: DONOR16
    dataset: SELF
    key:
      - STUDYID
      - USUBJID
    filter: "PARAMCD = 'CIBICVAL' AND AVISITN <= 16"
    order_by:
      - variable: AVISITN
        direction: desc
        nulls: last
      - variable: ADY
        direction: desc
        nulls: last
      - variable: QSSEQ
        direction: desc
        nulls: last
    keep: first
    columns:
      - QSSEQ
      - ADY
      - ADT
      - VISIT
      - VISITNUM
      - AVISITN
  - id: DONOR24
    dataset: SELF
    key:
      - STUDYID
      - USUBJID
    filter: "PARAMCD = 'CIBICVAL' AND AVISITN <= 24"
    order_by:
      - variable: AVISITN
        direction: desc
        nulls: last
      - variable: ADY
        direction: desc
        nulls: last
      - variable: QSSEQ
        direction: desc
        nulls: last
    keep: first
    columns:
      - QSSEQ
      - ADY
      - ADT
      - VISIT
      - VISITNUM
      - AVISITN
  - id: SCORE16
    dataset: SELF
    key:
      - STUDYID
      - USUBJID
    filter: "PARAMCD = 'CIBICVAL' AND AVISITN <= 16 AND ANL01FL = 'Y'"
    order_by:
      - variable: AVISITN
        direction: desc
        nulls: last
      - variable: ADY
        direction: desc
        nulls: last
      - variable: QSSEQ
        direction: desc
        nulls: last
    keep: first
    columns:
      - AVAL
  - id: SCORE24
    dataset: SELF
    key:
      - STUDYID
      - USUBJID
    filter: "PARAMCD = 'CIBICVAL' AND AVISITN <= 24 AND ANL01FL = 'Y'"
    order_by:
      - variable: AVISITN
        direction: desc
        nulls: last
      - variable: ADY
        direction: desc
        nulls: last
      - variable: QSSEQ
        direction: desc
        nulls: last
    keep: first
    columns:
      - AVAL
columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: QS.STUDYID
    submission:
      data_type: text
      length: 12
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.STUDYID
  - derivation: ADSL.SITEID
    label: Study Site Identifier
    name: SITEID
    type: str
    submission:
      data_type: text
      length: 3
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.SITEID
  - derivation: ADSL.SITEGR1
    label: Pooled Site Group 1
    name: SITEGR1
    type: str
    submission:
      data_type: text
      length: 3
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.SITEGR1
  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: QS.USUBJID
    submission:
      data_type: text
      length: 11
      mandatory: false
      key_sequence: 1
      origins:
        - type: Derived
      comment: ADSL.USUBJID
  - derivation: ADSL.TRTSDT
    label: Date of First Exposure to Treatment
    name: TRTSDT
    type: date
    submission:
      data_type: integer
      length: 8
      mandatory: false
      display_format: DATE9.
      origins:
        - type: Derived
      comment: ADSL.TRTSDT
  - derivation: ADSL.TRTEDT
    label: Date of Last Exposure to Treatment
    name: TRTEDT
    type: date
    submission:
      data_type: integer
      length: 8
      mandatory: false
      display_format: DATE9.
      origins:
        - type: Derived
      comment: ADSL.TRTEDT
  - name: TRTP
    type: str
    label: Planned Treatment
    derivation: ADSL.TRT01P
    submission:
      data_type: text
      length: 20
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.TRT01P
      codelist: ARM
  - name: TRTPN
    type: float
    label: Planned Treatment (N)
    derivation: ADSL.TRT01PN
    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.TRT01PN
      codelist: ARMN
  - derivation: ADSL.AGE
    label: Age
    name: AGE
    type: float
    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.AGE
  - derivation: ADSL.AGEGR1
    label: Pooled Age Group 1
    name: AGEGR1
    type: str
    submission:
      data_type: text
      length: 5
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.AGEGR1
      codelist: AGEGR1
  - derivation: ADSL.AGEGR1N
    label: Pooled Age Group 1 (N)
    name: AGEGR1N
    type: float
    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.AGEGR1N
      codelist: AGEGR1N
  - derivation: ADSL.RACE
    label: Race
    name: RACE
    type: str
    submission:
      data_type: text
      length: 32
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.RACE
      codelist: RACE
  - derivation: ADSL.RACEN
    label: Race (N)
    name: RACEN
    type: float
    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.RACEN
      codelist: RACEN
  - derivation: ADSL.SEX
    label: Sex
    name: SEX
    type: str
    submission:
      data_type: text
      length: 1
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.SEX
      codelist: SEX
  - name: ITTFL
    type: str
    label: Intent-to-Treat Population Flag
    derivation: ADSL.ITTFL
    submission:
      data_type: text
      length: 1
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.ITTFL
      codelist: YN
  - derivation: ADSL.EFFFL
    label: Efficacy Population Flag
    name: EFFFL
    type: str
    submission:
      data_type: text
      length: 1
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.FASFL
      codelist: YN
  - derivation: ADSL.COMP24FL
    label: Completers of Week 24 Population Flag
    name: COMP24FL
    type: str
    submission:
      data_type: text
      length: 1
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.COMP24FL
      codelist: YN
  - name: AVISIT
    type: str
    label: Analysis Visit
    submission:
      data_type: text
      length: 16
      mandatory: false
      key_sequence: 3
      origins:
        - type: Derived
      comment: Character version of the visit.
      codelist: AVISIT
  - name: AVISITN
    type: float
    label: Analysis Visit (N)
    submission:
      data_type: integer
      length: 8
      mandatory: false
      significant_digits: 1
      origins:
        - type: Derived
      comment: Using window method in SAP Page 10 to determine AVISITN value based on ADY.
      codelist: AVISITN
  - name: VISIT
    type: str
    label: Visit Name
    submission:
      data_type: text
      length: 19
      mandatory: false
      origins:
        - type: Derived
      comment: QS.VISIT
      codelist: VISIT
  - name: VISITNUM
    type: float
    label: Visit Number
    submission:
      data_type: float
      length: 8
      mandatory: false
      significant_digits: 1
      origins:
        - type: Derived
      comment: QS.VISITNUM
      codelist: VISITNUM
  - name: ADY
    type: float
    label: Analysis Relative Day
    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: ADY = ADT - TRTSDT + 1, if ADT>=TRTSDT. ADY = ADT - TRTSDT, if ADT<TRTSDT.
  - name: ADT
    type: date
    label: Analysis Date
    submission:
      data_type: integer
      length: 8
      mandatory: false
      display_format: DATE9.
      key_sequence: 4
      origins:
        - type: Derived
      comment: SAS date from QS.QSDTC
  - name: PARAMCD
    type: str
    label: Parameter Code
    submission:
      data_type: text
      length: 8
      mandatory: false
      key_sequence: 2
      origins:
        - type: Derived
      comment: 'Value: CIBICVAL'
      codelist: PARAMCD_ADQSCIBC
  - name: PARAM
    type: str
    label: Parameter
    derivation: "'CIBIC Score'"
    submission:
      data_type: text
      length: 100
      mandatory: false
      origins:
        - type: Derived
      comment: 'Value: CIBIC Score'
      codelist: PARAM_ADQSCIBC
  - name: PARAMN
    type: float
    label: Parameter (N)
    derivation: 1.0
    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: Numeric code for Parameter
      codelist: PARAMN_ADQSCIBC
  - name: AVAL
    type: float
    label: Analysis Value
    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: QS.QSSTRESN, where QS.QSTESTCD = CIBIC
  - name: ANL01FL
    type: str
    label: Analysis Record Flag 01
    submission:
      data_type: text
      length: 1
      mandatory: false
      origins:
        - type: Derived
      comment: Set ANL01FL=Y based on SAP Page 10 analysis windows.
      codelist: Y_BLANK
  - name: DTYPE
    type: str
    label: Derivation Type
    submission:
      data_type: text
      length: 7
      mandatory: false
      origins:
        - type: Derived
      comment: 'Value: LOCF denotes that the LOCF imputation method was used to impute the value for the given parameter and analysis visit.'
      codelist: DTYPE
  - name: AWTARGET
    type: float
    label: Analysis Window Target
    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: Target day within the window, specified in the SAP.
  - name: AWTDIFF
    type: float
    label: Analysis Window Diff from Target
    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: Absolute difference between AWTARGET and ADY
  - name: _DIFF
    type: float
    label: signed AWTARGET-ADY (internal)
  - name: _RN_ANL
    type: float
    label: rank by window closeness within subject-param-visit (internal)
    derivation: 1.0
  - name: _HIT
    type: float
    label: QSSEQ of an observed ANL01FL record at the LOCF visit, if any (internal)
  - name: _SRC_QSSEQ
    type: float
    label: carried QSSEQ (internal)
  - name: _SRC_AVAL
    type: float
    label: carried AVAL (internal)
  - name: _SRC_ADY
    type: float
    label: carried ADY (internal)
  - name: _SRC_ADT
    type: date
    label: carried ADT (internal)
  - name: _SRC_VISIT
    type: str
    label: carried VISIT (internal)
  - name: _SRC_VISITNUM
    type: float
    label: carried VISITNUM (internal)
  - name: QSSEQ
    type: float
    label: Sequence Number
    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: QS.QSSEQ
  - name: AWRANGE
    type: str
    label: Analysis Window Valid Relative Range
    derivation:
      mapping:
        source: AVISIT
        dict:
          Week 8: 2-84
          Week 16: 85-140
          Week 24: '>140'
    submission:
      data_type: text
      length: 9
      mandatory: false
      origins:
        - type: Derived
      comment: Window range, specified in the SAP.
  - name: AWLO
    type: float
    label: Analysis Window Beginning Timepoint
    derivation:
      mapping:
        source: AVISIT
        dict:
          Week 8: 2.0
          Week 16: 85.0
          Week 24: 141.0
    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: Start day of the window, specified in the SAP.
  - name: AWHI
    type: float
    label: Analysis Window Ending Timepoint
    derivation:
      mapping:
        source: AVISIT
        dict:
          Week 8: 84.0
          Week 16: 140.0
          Week 24:
    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: End day of the window, specified in the SAP.
  - name: AWU
    type: str
    label: Analysis Window Unit
    derivation: "'DAYS'"
    submission:
      data_type: text
      length: 4
      mandatory: false
      origins:
        - type: Derived
      comment: Assigned as "DAYS".
      codelist: AWU
rows:
  - id: obs
    dataset: QS
    filter: "QS.QSTESTCD = 'CIBIC'"
    derivations:
      QSSEQ: QS.QSSEQ
      PARAMCD: "'CIBICVAL'"
      ADT:
        impute:
          type: date
          source: QS.QSDTC
          day: 1
      ADY:
        study_day:
          source: ADT
          reference: TRTSDT
      AVISIT:
        case:
          - when: ADY <= 84
            then: "'Week 8'"
          - when: ADY <= 140
            then: "'Week 16'"
          - otherwise: "'Week 24'"
      AVAL: QS.QSSTRESN
      AVISITN:
        mapping:
          source: AVISIT
          dict:
            Week 8: 8.0
            Week 16: 16.0
            Week 24: 24.0
      VISIT: QS.VISIT
      VISITNUM: QS.VISITNUM
      AWTARGET:
        mapping:
          source: AVISIT
          dict:
            Week 8: 56.0
            Week 16: 112.0
            Week 24: 168.0
      AWTDIFF: ABS(AWTARGET - ADY)
      _DIFF: AWTARGET - ADY
      _RN_ANL:
        row_number:
          window:
            group_by:
              - STUDYID
              - USUBJID
              - PARAMCD
              - AVISIT
            order_by:
              - variable: AWTDIFF
                nulls: last
              - variable: _DIFF
                nulls: last
      ANL01FL:
        flag:
          condition: _RN_ANL = 1
          false_value: ""
          missing: ""
      DTYPE: "''"
      _HIT:
      _SRC_QSSEQ:
      _SRC_AVAL:
      _SRC_ADY:
      _SRC_ADT:
      _SRC_VISIT:
      _SRC_VISITNUM:
  - id: locf16
    dataset: QS
    group_by:
      - QS.STUDYID
      - QS.USUBJID
    filter: _HIT IS NULL AND _SRC_QSSEQ IS NOT NULL
    derivations:
      _HIT:
        case:
          - when: DONOR16.AVISITN = 16
            then: DONOR16.QSSEQ
      _SRC_QSSEQ: DONOR16.QSSEQ
      _SRC_AVAL: SCORE16.AVAL
      _SRC_ADY: DONOR16.ADY
      _SRC_ADT: DONOR16.ADT
      _SRC_VISIT: DONOR16.VISIT
      _SRC_VISITNUM: DONOR16.VISITNUM
      AVISIT: "'Week 16'"
      AVISITN: 16.0
      AWTARGET: 112.0
      AWTDIFF: ABS(AWTARGET - ADY)
      _DIFF: AWTARGET - ADY
      VISIT: _SRC_VISIT
      VISITNUM: _SRC_VISITNUM
      ADY: _SRC_ADY
      ADT: _SRC_ADT
      PARAMCD: "'CIBICVAL'"
      AVAL: _SRC_AVAL
      ANL01FL: "'Y'"
      DTYPE: "'LOCF'"
      QSSEQ: _SRC_QSSEQ
  - id: locf24
    dataset: QS
    group_by:
      - QS.STUDYID
      - QS.USUBJID
    filter: _HIT IS NULL AND _SRC_QSSEQ IS NOT NULL
    derivations:
      _HIT:
        case:
          - when: DONOR24.AVISITN = 24
            then: DONOR24.QSSEQ
      _SRC_QSSEQ: DONOR24.QSSEQ
      _SRC_AVAL: SCORE24.AVAL
      _SRC_ADY: DONOR24.ADY
      _SRC_ADT: DONOR24.ADT
      _SRC_VISIT: DONOR24.VISIT
      _SRC_VISITNUM: DONOR24.VISITNUM
      AVISIT: "'Week 24'"
      AVISITN: 24.0
      AWTARGET: 168.0
      AWTDIFF: ABS(AWTARGET - ADY)
      _DIFF: AWTARGET - ADY
      VISIT: _SRC_VISIT
      VISITNUM: _SRC_VISITNUM
      ADY: _SRC_ADY
      ADT: _SRC_ADT
      PARAMCD: "'CIBICVAL'"
      AVAL: _SRC_AVAL
      ANL01FL: "'Y'"
      DTYPE: "'LOCF'"
      QSSEQ: _SRC_QSSEQ
