# CIBIC observations, closest-to-target selection, and LOCF visits.
# Only visits with an earlier observed score receive a LOCF record.
# SCORE donors supply the last selected value; DONOR records supply the
# latest observation's date, visit, and sequence, including unselected rows.
# Variable metadata: ../define/define-adam.xml, ADQSCIBC.

yamaa: '1.0'
type: spec
model: ADaM
domain: ADQSCIBC
keys:
- STUDYID
- USUBJID
- PARAMCD
- AVISITN
- QSSEQ
input:
  QS:
    path: ../../data/sdtm/qs.parquet
    empty_string: present
  ADSL:
    path: ../../data/adam/adsl-yamaa.parquet
    schema: adsl.yaml
    key:
    - STUDYID
    - USUBJID
    empty_string: present
base: QS
output:
  path: ../../data/adam/adqscibc-yamaa.parquet
  columns:
  - STUDYID
  - SITEID
  - SITEGR1
  - USUBJID
  - TRTSDT
  - TRTEDT
  - TRTP
  - TRTPN
  - AGE
  - AGEGR1
  - AGEGR1N
  - RACE
  - RACEN
  - SEX
  - ITTFL
  - EFFFL
  - COMP24FL
  - AVISIT
  - AVISITN
  - VISIT
  - VISITNUM
  - ADY
  - ADT
  - PARAMCD
  - PARAM
  - PARAMN
  - AVAL
  - ANL01FL
  - DTYPE
  - AWRANGE
  - AWTARGET
  - AWTDIFF
  - AWLO
  - AWHI
  - AWU
  - QSSEQ
  order_by:
  - variable: USUBJID
    nulls: last
  - variable: PARAMN
    nulls: last
  - variable: AVISITN
    nulls: last
  - variable: QSSEQ
    nulls: last
intermediates:
- id: DONOR16
  dataset: SELF
  key:
  - STUDYID
  - USUBJID
  filter: "PARAMCD = 'CIBICVAL' AND AVISITN <= 16"
  order_by:
  - variable: AVISITN
    direction: desc
    nulls: last
  - variable: ADY
    direction: desc
    nulls: last
  - variable: QSSEQ
    direction: desc
    nulls: last
  keep: first
  columns:
  - QSSEQ
  - ADY
  - ADT
  - VISIT
  - VISITNUM
  - AVISITN
- id: DONOR24
  dataset: SELF
  key:
  - STUDYID
  - USUBJID
  filter: "PARAMCD = 'CIBICVAL' AND AVISITN <= 24"
  order_by:
  - variable: AVISITN
    direction: desc
    nulls: last
  - variable: ADY
    direction: desc
    nulls: last
  - variable: QSSEQ
    direction: desc
    nulls: last
  keep: first
  columns:
  - QSSEQ
  - ADY
  - ADT
  - VISIT
  - VISITNUM
  - AVISITN
- id: SCORE16
  dataset: SELF
  key:
  - STUDYID
  - USUBJID
  filter: "PARAMCD = 'CIBICVAL' AND AVISITN <= 16 AND ANL01FL = 'Y'"
  order_by:
  - variable: AVISITN
    direction: desc
    nulls: last
  - variable: ADY
    direction: desc
    nulls: last
  - variable: QSSEQ
    direction: desc
    nulls: last
  keep: first
  columns:
  - AVAL
- id: SCORE24
  dataset: SELF
  key:
  - STUDYID
  - USUBJID
  filter: "PARAMCD = 'CIBICVAL' AND AVISITN <= 24 AND ANL01FL = 'Y'"
  order_by:
  - variable: AVISITN
    direction: desc
    nulls: last
  - variable: ADY
    direction: desc
    nulls: last
  - variable: QSSEQ
    direction: desc
    nulls: last
  keep: first
  columns:
  - AVAL
columns:
- name: STUDYID
  type: str
  label: Study Identifier
  derivation: QS.STUDYID
- copy:
    dataset: ADSL
    columns: [SITEID, SITEGR1]
- name: USUBJID
  type: str
  label: Unique Subject Identifier
  derivation: QS.USUBJID
- copy:
    dataset: ADSL
    columns: [TRTSDT, TRTEDT]
- name: TRTP
  type: str
  label: Planned Treatment
  derivation: ADSL.TRT01P
- name: TRTPN
  type: float
  label: Planned Treatment (N)
  derivation: ADSL.TRT01PN
- copy:
    dataset: ADSL
    columns: [AGE, AGEGR1, AGEGR1N, RACE, RACEN, SEX]
- name: ITTFL
  type: str
  label: Intent-to-Treat Population Flag
  derivation: ADSL.ITTFL
- copy:
    dataset: ADSL
    columns: [EFFFL, COMP24FL]
- name: AVISIT
  type: str
  label: Analysis Visit
- name: AVISITN
  type: float
  label: Analysis Visit (N)
- name: VISIT
  type: str
  label: Visit Name
- name: VISITNUM
  type: float
  label: Visit Number
- name: ADY
  type: float
  label: Analysis Relative Day
- name: ADT
  type: date
  label: Analysis Date
- name: PARAMCD
  type: str
  label: Parameter Code
- name: PARAM
  type: str
  label: Parameter
  derivation: "'CIBIC Score'"
- name: PARAMN
  type: float
  label: Parameter (N)
  derivation: 1.0
- name: AVAL
  type: float
  label: Analysis Value
- name: ANL01FL
  type: str
  label: Analysis Record Flag 01
- name: DTYPE
  type: str
  label: Derivation Type
- name: AWTARGET
  type: float
  label: Analysis Window Target
- name: AWTDIFF
  type: float
  label: Analysis Window Diff from Target
- name: _DIFF
  type: float
  label: signed AWTARGET-ADY (internal)
- name: _RN_ANL
  type: float
  label: rank by window closeness within subject-param-visit (internal)
  derivation: 1.0
- name: _HIT
  type: float
  label: QSSEQ of an observed ANL01FL record at the LOCF visit, if any (internal)
- name: _SRC_QSSEQ
  type: float
  label: carried QSSEQ (internal)
- name: _SRC_AVAL
  type: float
  label: carried AVAL (internal)
- name: _SRC_ADY
  type: float
  label: carried ADY (internal)
- name: _SRC_ADT
  type: date
  label: carried ADT (internal)
- name: _SRC_VISIT
  type: str
  label: carried VISIT (internal)
- name: _SRC_VISITNUM
  type: float
  label: carried VISITNUM (internal)
- name: QSSEQ
  type: float
  label: Sequence Number
- name: AWRANGE
  type: str
  label: Analysis Window Valid Relative Range
  derivation:
    mapping:
      source: AVISIT
      dict:
        Week 8: 2-84
        Week 16: 85-140
        Week 24: '>140'
- name: AWLO
  type: float
  label: Analysis Window Beginning Timepoint
  derivation:
    mapping:
      source: AVISIT
      dict:
        Week 8: 2.0
        Week 16: 85.0
        Week 24: 141.0
- name: AWHI
  type: float
  label: Analysis Window Ending Timepoint
  derivation:
    mapping:
      source: AVISIT
      dict:
        Week 8: 84.0
        Week 16: 140.0
        Week 24: null
- name: AWU
  type: str
  label: Analysis Window Unit
  derivation: "'DAYS'"
rows:
- id: obs
  dataset: QS
  filter: "QS.QSTESTCD = 'CIBIC'"
  derivations:
    QSSEQ: QS.QSSEQ
    PARAMCD: "'CIBICVAL'"
    ADT:
      impute:
        type: date
        source: QS.QSDTC
        day: 1
    ADY:
      study_day:
        source: ADT
        reference: TRTSDT
    AVISIT:
      case:
      - when: ADY <= 84
        then: "'Week 8'"
      - when: ADY <= 140
        then: "'Week 16'"
      - otherwise: "'Week 24'"
    AVAL: QS.QSSTRESN
    AVISITN:
      mapping:
        source: AVISIT
        dict:
          Week 8: 8.0
          Week 16: 16.0
          Week 24: 24.0
    VISIT: QS.VISIT
    VISITNUM: QS.VISITNUM
    AWTARGET:
      mapping:
        source: AVISIT
        dict:
          Week 8: 56.0
          Week 16: 112.0
          Week 24: 168.0
    AWTDIFF: ABS(AWTARGET - ADY)
    _DIFF: AWTARGET - ADY
    _RN_ANL:
      row_number:
        window:
          group_by:
          - STUDYID
          - USUBJID
          - PARAMCD
          - AVISIT
          order_by:
          - variable: AWTDIFF
            nulls: last
          - variable: _DIFF
            nulls: last
    ANL01FL:
      flag:
        condition: _RN_ANL = 1
        false_value: ""
        missing: ""
    DTYPE: "''"
    _HIT: null
    _SRC_QSSEQ: null
    _SRC_AVAL: null
    _SRC_ADY: null
    _SRC_ADT: null
    _SRC_VISIT: null
    _SRC_VISITNUM: null
- id: locf16
  dataset: QS
  group_by:
  - QS.STUDYID
  - QS.USUBJID
  filter: _HIT IS NULL AND _SRC_QSSEQ IS NOT NULL
  derivations:
    _HIT:
      case:
      - when: DONOR16.AVISITN = 16
        then: DONOR16.QSSEQ
    _SRC_QSSEQ: DONOR16.QSSEQ
    _SRC_AVAL: SCORE16.AVAL
    _SRC_ADY: DONOR16.ADY
    _SRC_ADT: DONOR16.ADT
    _SRC_VISIT: DONOR16.VISIT
    _SRC_VISITNUM: DONOR16.VISITNUM
    AVISIT: "'Week 16'"
    AVISITN: 16.0
    AWTARGET: 112.0
    AWTDIFF: ABS(AWTARGET - ADY)
    _DIFF: AWTARGET - ADY
    VISIT: _SRC_VISIT
    VISITNUM: _SRC_VISITNUM
    ADY: _SRC_ADY
    ADT: _SRC_ADT
    PARAMCD: "'CIBICVAL'"
    AVAL: _SRC_AVAL
    ANL01FL: "'Y'"
    DTYPE: "'LOCF'"
    QSSEQ: _SRC_QSSEQ
- id: locf24
  dataset: QS
  group_by:
  - QS.STUDYID
  - QS.USUBJID
  filter: _HIT IS NULL AND _SRC_QSSEQ IS NOT NULL
  derivations:
    _HIT:
      case:
      - when: DONOR24.AVISITN = 24
        then: DONOR24.QSSEQ
    _SRC_QSSEQ: DONOR24.QSSEQ
    _SRC_AVAL: SCORE24.AVAL
    _SRC_ADY: DONOR24.ADY
    _SRC_ADT: DONOR24.ADT
    _SRC_VISIT: DONOR24.VISIT
    _SRC_VISITNUM: DONOR24.VISITNUM
    AVISIT: "'Week 24'"
    AVISITN: 24.0
    AWTARGET: 168.0
    AWTDIFF: ABS(AWTARGET - ADY)
    _DIFF: AWTARGET - ADY
    VISIT: _SRC_VISIT
    VISITNUM: _SRC_VISITNUM
    ADY: _SRC_ADY
    ADT: _SRC_ADT
    PARAMCD: "'CIBICVAL'"
    AVAL: _SRC_AVAL
    ANL01FL: "'Y'"
    DTYPE: "'LOCF'"
    QSSEQ: _SRC_QSSEQ
