# CIBIC observations, closest-to-target selection, and LOCF visits.
# Only visits with an earlier observed score receive a LOCF record.
# SCORE donors supply the last selected value; DONOR records supply the
# latest observation's date, visit, and sequence, including unselected rows.
# Variable metadata: ../define/define-adam.xml, ADQSCIBC.

yamaa: '1.0'
type: spec
model: ADaM
parent: ../../../spec/yamaa/templates/subject-analysis.yaml
domain: ADQSCIBC
keys:
  - STUDYID
  - USUBJID
  - PARAMCD
  - AVISITN
  - QSSEQ
input:
  QS:
    path: ../../data/sdtm/qs.parquet
    empty_string: present
  ADSL:
    empty_string: present
    key:
      - STUDYID
      - USUBJID
base: QS

output:
  path: ../../data/adam/adqscibc-yamaa.parquet
  columns:
    - STUDYID
    - SITEID
    - SITEGR1
    - USUBJID
    - TRTSDT
    - TRTEDT
    - TRTP
    - TRTPN
    - AGE
    - AGEGR1
    - AGEGR1N
    - RACE
    - RACEN
    - SEX
    - ITTFL
    - EFFFL
    - COMP24FL
    - AVISIT
    - AVISITN
    - VISIT
    - VISITNUM
    - ADY
    - ADT
    - PARAMCD
    - PARAM
    - PARAMN
    - AVAL
    - ANL01FL
    - DTYPE
    - AWRANGE
    - AWTARGET
    - AWTDIFF
    - AWLO
    - AWHI
    - AWU
    - QSSEQ
  order_by:
    - variable: USUBJID
      nulls: last
    - variable: PARAMN
      nulls: last
    - variable: AVISITN
      nulls: last
    - variable: QSSEQ
      nulls: last

windows:
  OBS_ORDER:
    group_by:
      - STUDYID
      - USUBJID
      - PARAMCD
      - AVISIT
    order_by:
      - variable: AWTDIFF
        nulls: last
      - variable: _DIFF
        nulls: last

intermediates:
  - id: SUBJECT_FOR_VISIT
    dataset: ADSL
    key:
      - USUBJID

  - id: DONOR16
    dataset: QS
    key:
      - STUDYID
      - USUBJID
    filter: >-
      (QS.QSTESTCD = 'CIBIC') AND (QS.PARAMCD = 'CIBICVAL' AND
      QS.AVISITN <= 16)
    order_by:
      - variable: QS.AVISITN
        direction: desc
        nulls: last
      - variable: QS.ADY
        direction: desc
        nulls: last
      - variable: QS.QSSEQ
        direction: desc
        nulls: last
    keep: first
    columns:
      - QSSEQ
      - ADY
      - ADT
      - VISIT
      - VISITNUM
      - AVISITN
    derivations:
      ADT:
        type: date
        derivation:
          impute:
            type: date
            source: QS.QSDTC
            day: 1
      TRTSDT:
        type: date
        derivation: SUBJECT_FOR_VISIT.TRTSDT
      ADY:
        type: float
        derivation:
          study_day:
            source: QS.ADT
            reference: QS.TRTSDT
      AVISIT:
        type: str
        derivation:
          case:
            - when: QS.ADY <= 84
              then: "'Week 8'"
            - when: QS.ADY <= 140
              then: "'Week 16'"
            - otherwise: "'Week 24'"
      AVISITN:
        type: float
        derivation:
          mapping:
            source: QS.AVISIT
            dict:
              Week 8: 8.0
              Week 16: 16.0
              Week 24: 24.0
      PARAMCD:
        type: str
        derivation: "'CIBICVAL'"

  - id: DONOR24
    dataset: QS
    key:
      - STUDYID
      - USUBJID
    filter: >-
      (QS.QSTESTCD = 'CIBIC') AND (QS.PARAMCD = 'CIBICVAL' AND
      QS.AVISITN <= 24)
    order_by:
      - variable: QS.AVISITN
        direction: desc
        nulls: last
      - variable: QS.ADY
        direction: desc
        nulls: last
      - variable: QS.QSSEQ
        direction: desc
        nulls: last
    keep: first
    columns:
      - QSSEQ
      - ADY
      - ADT
      - VISIT
      - VISITNUM
      - AVISITN
    derivations:
      ADT:
        type: date
        derivation:
          impute:
            type: date
            source: QS.QSDTC
            day: 1
      TRTSDT:
        type: date
        derivation: SUBJECT_FOR_VISIT.TRTSDT
      ADY:
        type: float
        derivation:
          study_day:
            source: QS.ADT
            reference: QS.TRTSDT
      AVISIT:
        type: str
        derivation:
          case:
            - when: QS.ADY <= 84
              then: "'Week 8'"
            - when: QS.ADY <= 140
              then: "'Week 16'"
            - otherwise: "'Week 24'"
      AVISITN:
        type: float
        derivation:
          mapping:
            source: QS.AVISIT
            dict:
              Week 8: 8.0
              Week 16: 16.0
              Week 24: 24.0
      PARAMCD:
        type: str
        derivation: "'CIBICVAL'"

  - id: SCORE16
    dataset: QS
    key:
      - STUDYID
      - USUBJID
    filter: >-
      (QS.QSTESTCD = 'CIBIC') AND (QS.PARAMCD = 'CIBICVAL' AND
      QS.AVISITN <= 16 AND QS.ANL01FL = 'Y')
    order_by:
      - variable: QS.AVISITN
        direction: desc
        nulls: last
      - variable: QS.ADY
        direction: desc
        nulls: last
      - variable: QS.QSSEQ
        direction: desc
        nulls: last
    keep: first
    columns:
      - AVAL
    derivations:
      AVAL:
        type: float
        derivation: QS.QSSTRESN
      PARAMCD:
        type: str
        derivation: "'CIBICVAL'"
      ADT:
        type: date
        derivation:
          impute:
            type: date
            source: QS.QSDTC
            day: 1
      TRTSDT:
        type: date
        derivation: SUBJECT_FOR_VISIT.TRTSDT
      ADY:
        type: float
        derivation:
          study_day:
            source: QS.ADT
            reference: QS.TRTSDT
      AVISIT:
        type: str
        derivation:
          case:
            - when: QS.ADY <= 84
              then: "'Week 8'"
            - when: QS.ADY <= 140
              then: "'Week 16'"
            - otherwise: "'Week 24'"
      AVISITN:
        type: float
        derivation:
          mapping:
            source: QS.AVISIT
            dict:
              Week 8: 8.0
              Week 16: 16.0
              Week 24: 24.0
      AWTARGET:
        type: float
        derivation:
          mapping:
            source: QS.AVISIT
            dict:
              Week 8: 56.0
              Week 16: 112.0
              Week 24: 168.0
      AWTDIFF:
        type: float
        derivation: ABS(QS.AWTARGET - QS.ADY)
      _DIFF:
        type: float
        derivation: QS.AWTARGET - QS.ADY
      _RN_ANL:
        type: float
        derivation:
          row_number:
            window:
              group_by:
                - QS.STUDYID
                - QS.USUBJID
                - QS.QSTESTCD
                - QS.AVISIT
              order_by:
                - variable: QS.AWTDIFF
                  nulls: last
                - variable: QS._DIFF
                  nulls: last
      ANL01FL:
        type: str
        derivation:
          flag:
            condition: QS._RN_ANL = 1
            false_value: ""
            missing: ""

  - id: SCORE24
    dataset: QS
    key:
      - STUDYID
      - USUBJID
    filter: >-
      (QS.QSTESTCD = 'CIBIC') AND (QS.PARAMCD = 'CIBICVAL' AND
      QS.AVISITN <= 24 AND QS.ANL01FL = 'Y')
    order_by:
      - variable: QS.AVISITN
        direction: desc
        nulls: last
      - variable: QS.ADY
        direction: desc
        nulls: last
      - variable: QS.QSSEQ
        direction: desc
        nulls: last
    keep: first
    columns:
      - AVAL
    derivations:
      AVAL:
        type: float
        derivation: QS.QSSTRESN
      PARAMCD:
        type: str
        derivation: "'CIBICVAL'"
      ADT:
        type: date
        derivation:
          impute:
            type: date
            source: QS.QSDTC
            day: 1
      TRTSDT:
        type: date
        derivation: SUBJECT_FOR_VISIT.TRTSDT
      ADY:
        type: float
        derivation:
          study_day:
            source: QS.ADT
            reference: QS.TRTSDT
      AVISIT:
        type: str
        derivation:
          case:
            - when: QS.ADY <= 84
              then: "'Week 8'"
            - when: QS.ADY <= 140
              then: "'Week 16'"
            - otherwise: "'Week 24'"
      AVISITN:
        type: float
        derivation:
          mapping:
            source: QS.AVISIT
            dict:
              Week 8: 8.0
              Week 16: 16.0
              Week 24: 24.0
      AWTARGET:
        type: float
        derivation:
          mapping:
            source: QS.AVISIT
            dict:
              Week 8: 56.0
              Week 16: 112.0
              Week 24: 168.0
      AWTDIFF:
        type: float
        derivation: ABS(QS.AWTARGET - QS.ADY)
      _DIFF:
        type: float
        derivation: QS.AWTARGET - QS.ADY
      _RN_ANL:
        type: float
        derivation:
          row_number:
            window:
              group_by:
                - QS.STUDYID
                - QS.USUBJID
                - QS.QSTESTCD
                - QS.AVISIT
              order_by:
                - variable: QS.AWTDIFF
                  nulls: last
                - variable: QS._DIFF
                  nulls: last
      ANL01FL:
        type: str
        derivation:
          flag:
            condition: QS._RN_ANL = 1
            false_value: ""
            missing: ""

columns:
  - name: VISIT
    type: str
    label: Visit Name

  - name: VISITNUM
    type: float
    label: Visit Number

  - name: PARAMCD
    type: str
    label: Parameter Code
    derivation: "'CIBICVAL'"

  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: QS.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: QS.USUBJID

  - name: ITTFL
    type: str
    label: Intent-to-Treat Population Flag
    derivation: ADSL.ITTFL

  - name: AVISIT
    type: str
    label: Analysis Visit

  - name: AVISITN
    type: float
    label: Analysis Visit (N)

  - name: ADY
    type: float
    label: Analysis Relative Day

  - name: ADT
    type: date
    label: Analysis Date

  - name: PARAM
    type: str
    label: Parameter
    derivation: "'CIBIC Score'"

  - name: PARAMN
    type: float
    label: Parameter (N)
    derivation: 1.0

  - name: AVAL
    type: float
    label: Analysis Value

  - name: ANL01FL
    type: str
    label: Analysis Record Flag 01

  - name: DTYPE
    type: str
    label: Derivation Type

  - name: AWTARGET
    type: float
    label: Analysis Window Target

  - name: AWTDIFF
    type: float
    label: Analysis Window Diff from Target

    derivation: ABS(AWTARGET - ADY)

  - name: _DIFF
    type: float
    label: signed AWTARGET-ADY (internal)

    derivation: AWTARGET - ADY

  - name: _RN_ANL
    type: float
    label: rank by window closeness within
      subject-param-visit (internal)
    derivation: 1.0

  - name: _HIT
    type: float
    label: QSSEQ of an observed ANL01FL record at the LOCF
      visit, if any (internal)

  - name: _SRC_QSSEQ
    type: float
    label: carried QSSEQ (internal)

  - name: _SRC_AVAL
    type: float
    label: carried AVAL (internal)

  - name: _SRC_ADY
    type: float
    label: carried ADY (internal)

  - name: _SRC_ADT
    type: date
    label: carried ADT (internal)

  - name: _SRC_VISIT
    type: str
    label: carried VISIT (internal)

  - name: _SRC_VISITNUM
    type: float
    label: carried VISITNUM (internal)

  - name: QSSEQ
    type: float
    label: Sequence Number

  - name: AWRANGE
    type: str
    label: Analysis Window Valid Relative Range
    derivation:
      mapping:
        source: AVISIT
        dict:
          Week 8: 2-84
          Week 16: 85-140
          Week 24: '>140'

  - name: AWLO
    type: float
    label: Analysis Window Beginning Timepoint
    derivation:
      mapping:
        source: AVISIT
        dict:
          Week 8: 2.0
          Week 16: 85.0
          Week 24: 141.0

  - name: AWHI
    type: float
    label: Analysis Window Ending Timepoint
    derivation:
      mapping:
        source: AVISIT
        dict:
          Week 8: 84.0
          Week 16: 140.0
          Week 24:

  - name: AWU
    type: str
    label: Analysis Window Unit
    derivation: "'DAYS'"

rows:
  - id: obs
    dataset: QS
    filter: "QS.QSTESTCD = 'CIBIC'"
    derivations:
      QSSEQ: QS.QSSEQ
      ADT:
        impute:
          type: date
          source: QS.QSDTC
          day: 1
      ADY:
        study_day:
          source: ADT
          reference: TRTSDT
      AVISIT:
        case:
          - when: ADY <= 84
            then: "'Week 8'"
          - when: ADY <= 140
            then: "'Week 16'"
          - otherwise: "'Week 24'"
      AVAL: QS.QSSTRESN
      AVISITN:
        mapping:
          source: AVISIT
          dict:
            Week 8: 8.0
            Week 16: 16.0
            Week 24: 24.0
      VISIT: QS.VISIT
      VISITNUM: QS.VISITNUM
      AWTARGET:
        mapping:
          source: AVISIT
          dict:
            Week 8: 56.0
            Week 16: 112.0
            Week 24: 168.0
      _RN_ANL:
        row_number:
          window: OBS_ORDER
      ANL01FL:
        flag:
          condition: _RN_ANL = 1
          false_value: ""
          missing: ""
      DTYPE: "''"
      _HIT:
      _SRC_QSSEQ:
      _SRC_AVAL:
      _SRC_ADY:
      _SRC_ADT:
      _SRC_VISIT:
      _SRC_VISITNUM:

  - id: locf16
    dataset: QS
    group_by:
      - QS.STUDYID
      - QS.USUBJID
    filter: _HIT IS NULL AND _SRC_QSSEQ IS NOT NULL
    derivations:
      _HIT:
        case:
          - when: DONOR16.AVISITN = 16
            then: DONOR16.QSSEQ
      _SRC_QSSEQ: DONOR16.QSSEQ
      _SRC_AVAL: SCORE16.AVAL
      _SRC_ADY: DONOR16.ADY
      _SRC_ADT: DONOR16.ADT
      _SRC_VISIT: DONOR16.VISIT
      _SRC_VISITNUM: DONOR16.VISITNUM
      AVISIT: "'Week 16'"
      AVISITN: 16.0
      AWTARGET: 112.0
      VISIT: _SRC_VISIT
      VISITNUM: _SRC_VISITNUM
      ADY: _SRC_ADY
      ADT: _SRC_ADT
      AVAL: _SRC_AVAL
      ANL01FL: "'Y'"
      DTYPE: "'LOCF'"
      QSSEQ: _SRC_QSSEQ

  - id: locf24
    dataset: QS
    group_by:
      - QS.STUDYID
      - QS.USUBJID
    filter: _HIT IS NULL AND _SRC_QSSEQ IS NOT NULL
    derivations:
      _HIT:
        case:
          - when: DONOR24.AVISITN = 24
            then: DONOR24.QSSEQ
      _SRC_QSSEQ: DONOR24.QSSEQ
      _SRC_AVAL: SCORE24.AVAL
      _SRC_ADY: DONOR24.ADY
      _SRC_ADT: DONOR24.ADT
      _SRC_VISIT: DONOR24.VISIT
      _SRC_VISITNUM: DONOR24.VISITNUM
      AVISIT: "'Week 24'"
      AVISITN: 24.0
      AWTARGET: 168.0
      VISIT: _SRC_VISIT
      VISITNUM: _SRC_VISITNUM
      ADY: _SRC_ADY
      ADT: _SRC_ADT
      AVAL: _SRC_AVAL
      ANL01FL: "'Y'"
      DTYPE: "'LOCF'"
      QSSEQ: _SRC_QSSEQ

verifications:
  - assert:
      id: treatment_date_order
      when: "TRTSDT IS NOT NULL AND TRTEDT IS NOT NULL"
      require: "TRTEDT >= TRTSDT"
