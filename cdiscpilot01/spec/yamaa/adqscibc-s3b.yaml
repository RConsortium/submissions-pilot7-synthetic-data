schema_version: "1.0"
domain: ADQSCIBC_S3B
keys: [USUBJID]
input:
  S1:
    path: adqscibc-s1.parquet
    empty_string: present
base: S1

rows:
  # Latest QS record with QSDY < 85 (Week 16 LOCF source)
  - id: prior24
    dataset: S1
    group_by: [S1.USUBJID, S1.QSSEQ]
    filter: "_R24 = 1"
    derivations:
      _U: S1.USUBJID
      _Q: {aggregate: "ONLY(S1.QSDY)"}
      _S: {aggregate: "ONLY(S1.QSSEQ)"}
      _R24:
        rank:
          window:
            group_by: [_U]
            order_by: [{variable: _Q, direction: desc}, {variable: _S, direction: desc}]
            filter: "_Q < 141"
      _P24_VISIT: {aggregate: "ONLY(S1.VISIT)"}
      _P24_VISITNUM: {aggregate: "ONLY(S1.VISITNUM)"}
      _P24_QSDY: {aggregate: "ONLY(S1.QSDY)"}
      _P24_QSDTC: {aggregate: "ONLY(S1.QSDTC)"}
      _P24_QSSEQ: S1.QSSEQ

output:
  path: adqscibc-s3b.parquet
  order_by: [USUBJID]
  columns: [USUBJID,
    _P24_VISIT, _P24_VISITNUM, _P24_QSDY, _P24_QSDTC, _P24_QSSEQ]

columns:
  - name: _U
    type: str
  - name: _Q
    type: float
  - name: _S
    type: float
  - name: _R24
    type: float
  - name: USUBJID
    type: str
    derivation: {source: _U}
  - name: _P24_VISIT
    type: str
  - name: _P24_VISITNUM
    type: float
  - name: _P24_QSDY
    type: float
  - name: _P24_QSDTC
    type: str
  - name: _P24_QSSEQ
    type: float
