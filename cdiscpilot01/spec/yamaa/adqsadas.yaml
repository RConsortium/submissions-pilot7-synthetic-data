# ADAS-Cog observations, closest-to-target selection, and ACTOT LOCF.
# Published reference behavior carries selected ACTOT scores onto
# unselected records while retaining each record's date and sequence.
# DTYPE marks a changed score or an added visit; equal collected/carried
# scores keep the observed record's blank DTYPE.
# Variable metadata: ../define/define-adam.xml, ADQSADAS.

yamaa: '1.0'
type: spec
model: ADaM
domain: ADQSADAS
submission:
  mode: historical
  label: ADAS-Cog Analysis
  class: BASIC DATA STRUCTURE
  structure: one record per subject per parameter per analysis visit per analysis date
  repeating: true
  reference_data: false
  artifact: adqsadas.xpt
keys:
  - STUDYID
  - USUBJID
  - PARAMCD
  - AVISITN
  - QSSEQ
input:
  QS:
    path: ../../data/sdtm/qs.parquet
    empty_string: present
  ADSL:
    path: ../../data/adam/adsl-yamaa.parquet
    schema: adsl.yaml
    key:
      - STUDYID
      - USUBJID
    empty_string: present
base: QS
output:
  path: ../../data/adam/adqsadas-yamaa.parquet
  columns:
    - STUDYID
    - SITEID
    - SITEGR1
    - USUBJID
    - TRTSDT
    - TRTEDT
    - TRTP
    - TRTPN
    - AGE
    - AGEGR1
    - AGEGR1N
    - RACE
    - RACEN
    - SEX
    - ITTFL
    - EFFFL
    - COMP24FL
    - AVISIT
    - AVISITN
    - VISIT
    - VISITNUM
    - ADY
    - ADT
    - PARAM
    - PARAMCD
    - PARAMN
    - AVAL
    - BASE
    - CHG
    - PCHG
    - ABLFL
    - ANL01FL
    - DTYPE
    - AWRANGE
    - AWTARGET
    - AWTDIFF
    - AWLO
    - AWHI
    - AWU
    - QSSEQ
  order_by:
    - variable: USUBJID
      nulls: last
    - variable: PARAMN
      nulls: last
    - variable: AVISITN
      nulls: last
    - variable: QSSEQ
      nulls: last
intermediates:
  - id: DONOR8
    dataset: SELF
    key:
      - STUDYID
      - USUBJID
    filter: "PARAMCD = 'ACTOT' AND AVISITN <= 8"
    order_by:
      - variable: AVISITN
        direction: desc
        nulls: last
      - variable: ADY
        direction: desc
        nulls: last
      - variable: QSSEQ
        direction: desc
        nulls: last
    keep: first
    columns:
      - QSSEQ
      - AVAL
      - ADY
      - ADT
      - VISIT
      - VISITNUM
      - AVISITN
  - id: DONOR16
    dataset: SELF
    key:
      - STUDYID
      - USUBJID
    filter: "PARAMCD = 'ACTOT' AND AVISITN <= 16"
    order_by:
      - variable: AVISITN
        direction: desc
        nulls: last
      - variable: ADY
        direction: desc
        nulls: last
      - variable: QSSEQ
        direction: desc
        nulls: last
    keep: first
    columns:
      - QSSEQ
      - AVAL
      - ADY
      - ADT
      - VISIT
      - VISITNUM
      - AVISITN
  - id: DONOR24
    dataset: SELF
    key:
      - STUDYID
      - USUBJID
    filter: "PARAMCD = 'ACTOT' AND AVISITN <= 24"
    order_by:
      - variable: AVISITN
        direction: desc
        nulls: last
      - variable: ADY
        direction: desc
        nulls: last
      - variable: QSSEQ
        direction: desc
        nulls: last
    keep: first
    columns:
      - QSSEQ
      - AVAL
      - ADY
      - ADT
      - VISIT
      - VISITNUM
      - AVISITN
columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: QS.STUDYID
    submission:
      data_type: text
      length: 12
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.STUDYID
  - derivation: ADSL.SITEID
    label: Study Site Identifier
    name: SITEID
    type: str
    submission:
      data_type: text
      length: 3
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.SITEID
  - derivation: ADSL.SITEGR1
    label: Pooled Site Group 1
    name: SITEGR1
    type: str
    submission:
      data_type: text
      length: 3
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.SITEGR1
  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: QS.USUBJID
    submission:
      data_type: text
      length: 11
      mandatory: false
      key_sequence: 1
      origins:
        - type: Derived
      comment: ADSL.USUBJID
  - derivation: ADSL.TRTSDT
    label: Date of First Exposure to Treatment
    name: TRTSDT
    type: date
    submission:
      data_type: integer
      length: 8
      mandatory: false
      display_format: DATE9.
      origins:
        - type: Derived
      comment: ADSL.TRTSDT
  - derivation: ADSL.TRTEDT
    label: Date of Last Exposure to Treatment
    name: TRTEDT
    type: date
    submission:
      data_type: integer
      length: 8
      mandatory: false
      display_format: DATE9.
      origins:
        - type: Derived
      comment: ADSL.TRTEDT
  - name: TRTP
    type: str
    label: Planned Treatment
    derivation: ADSL.TRT01P
    submission:
      data_type: text
      length: 20
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.TRT01P
      codelist: ARM
  - name: TRTPN
    type: float
    label: Planned Treatment (N)
    derivation: ADSL.TRT01PN
    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.TRT01PN
      codelist: ARMN
  - derivation: ADSL.AGE
    label: Age
    name: AGE
    type: float
    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.AGE
  - derivation: ADSL.AGEGR1
    label: Pooled Age Group 1
    name: AGEGR1
    type: str
    submission:
      data_type: text
      length: 5
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.AGEGR1
      codelist: AGEGR1
  - derivation: ADSL.AGEGR1N
    label: Pooled Age Group 1 (N)
    name: AGEGR1N
    type: float
    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.AGEGR1N
      codelist: AGEGR1N
  - derivation: ADSL.RACE
    label: Race
    name: RACE
    type: str
    submission:
      data_type: text
      length: 32
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.RACE
      codelist: RACE
  - derivation: ADSL.RACEN
    label: Race (N)
    name: RACEN
    type: float
    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.RACEN
      codelist: RACEN
  - derivation: ADSL.SEX
    label: Sex
    name: SEX
    type: str
    submission:
      data_type: text
      length: 1
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.SEX
      codelist: SEX
  - name: ITTFL
    type: str
    label: Intent-to-Treat Population Flag
    derivation: ADSL.ITTFL
    submission:
      data_type: text
      length: 1
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.ITTFL
      codelist: YN
  - derivation: ADSL.EFFFL
    label: Efficacy Population Flag
    name: EFFFL
    type: str
    submission:
      data_type: text
      length: 1
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.FASFL
      codelist: YN
  - derivation: ADSL.COMP24FL
    label: Completers of Week 24 Population Flag
    name: COMP24FL
    type: str
    submission:
      data_type: text
      length: 1
      mandatory: false
      origins:
        - type: Derived
      comment: ADSL.COMP24FL
      codelist: YN
  - name: AVISIT
    type: str
    label: Analysis Visit
    submission:
      data_type: text
      length: 16
      mandatory: false
      key_sequence: 3
      origins:
        - type: Derived
      comment: Derived based on windowing algorithm described in SAP, Section 8.2
      codelist: AVISIT
  - name: AVISITN
    type: float
    label: Analysis Visit (N)
    submission:
      data_type: integer
      length: 8
      mandatory: false
      significant_digits: 1
      origins:
        - type: Derived
      comment: Numeric code for AVISIT
      codelist: AVISITN
  - name: VISIT
    type: str
    label: Visit Name
    submission:
      data_type: text
      length: 19
      mandatory: false
      origins:
        - type: Derived
      comment: QS.VISIT
      codelist: VISIT
  - name: VISITNUM
    type: float
    label: Visit Number
    submission:
      data_type: float
      length: 8
      mandatory: false
      significant_digits: 1
      origins:
        - type: Derived
      comment: QS.VISITNUM
      codelist: VISITNUM
  - name: ADY
    type: float
    label: Analysis Relative Day
    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: ADY = ADT - TRTSDT + 1, if ADT>=TRTSDT. ADY = ADT - TRTSDT, if ADT<TRTSDT.
  - name: ADT
    type: date
    label: Analysis Date
    submission:
      data_type: integer
      length: 8
      mandatory: false
      display_format: DATE9.
      key_sequence: 4
      origins:
        - type: Derived
      comment: SAS date from QS.QSDTC
  - name: PARAMCD
    type: str
    label: Parameter Code
    submission:
      data_type: text
      length: 8
      mandatory: false
      key_sequence: 2
      origins:
        - type: Derived
      codelist: PARAMCD_ADQSADAS
  - name: PARAM
    type: str
    label: Parameter
    derivation:
      mapping:
        source: PARAMCD
        dict:
          ACITM01: Word Recall Task
          ACITM02: Naming Objects And Fingers (Refer To 5 C
          ACITM03: Delayed Word Recall
          ACITM04: Commands
          ACITM05: Constructional Praxis
          ACITM06: Ideational Praxis
          ACITM07: Orientation
          ACITM08: Word Recognition
          ACITM09: Attention/Visual Search Task
          ACITM10: Maze Solution
          ACITM11: Spoken Language Ability
          ACITM12: Comprehension Of Spoken Language
          ACITM13: Word Finding Difficulty In Spontaneous S
          ACITM14: Recall Of Test Instructions
          ACTOT: Adas-Cog(11) Subscore
    submission:
      data_type: text
      length: 100
      mandatory: false
      origins:
        - type: Derived
      codelist: PARAM_ADQSADAS
  - name: PARAMN
    type: float
    label: Parameter (N)
    derivation:
      mapping:
        source: PARAMCD
        dict:
          ACITM01: 1.0
          ACITM02: 2.0
          ACITM03: 3.0
          ACITM04: 4.0
          ACITM05: 5.0
          ACITM06: 6.0
          ACITM07: 7.0
          ACITM08: 8.0
          ACITM09: 9.0
          ACITM10: 10.0
          ACITM11: 11.0
          ACITM12: 12.0
          ACITM13: 13.0
          ACITM14: 14.0
          ACTOT: 15.0
    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: Assign a numeric code for each value of PARAMCD (see codelistPARAMN_ADQSADAS)
      codelist: PARAMN_ADQSADAS
  - name: AVAL
    type: float
    label: Analysis Value
    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      value_level:
        - id: ACITM01
          where:
            PARAMCD:
              - ACITM01
          label: Word Recall Task
          data_type: integer
          length: 8
          mandatory: false
          origins:
            - type: Derived
          comment: QS.QSSTRESN where QSTESTCD=PARAMCD
        - id: ACITM02
          where:
            PARAMCD:
              - ACITM02
          label: Naming Objects And Fingers (Refer To 5 C
          data_type: integer
          length: 8
          mandatory: false
          origins:
            - type: Derived
          comment: QS.QSSTRESN where QSTESTCD=PARAMCD
        - id: ACITM03
          where:
            PARAMCD:
              - ACITM03
          label: Delayed Word Recall
          data_type: integer
          length: 8
          mandatory: false
          origins:
            - type: Derived
          comment: QS.QSSTRESN where QSTESTCD=PARAMCD
        - id: ACITM04
          where:
            PARAMCD:
              - ACITM04
          label: Commands
          data_type: integer
          length: 8
          mandatory: false
          origins:
            - type: Derived
          comment: QS.QSSTRESN where QSTESTCD=PARAMCD
        - id: ACITM05
          where:
            PARAMCD:
              - ACITM05
          label: Constructional Praxis
          data_type: integer
          length: 8
          mandatory: false
          origins:
            - type: Derived
          comment: QS.QSSTRESN where QSTESTCD=PARAMCD
        - id: ACITM06
          where:
            PARAMCD:
              - ACITM06
          label: Ideational Praxis
          data_type: integer
          length: 8
          mandatory: false
          origins:
            - type: Derived
          comment: QS.QSSTRESN where QSTESTCD=PARAMCD
        - id: ACITM07
          where:
            PARAMCD:
              - ACITM07
          label: Orientation
          data_type: integer
          length: 8
          mandatory: false
          origins:
            - type: Derived
          comment: QS.QSSTRESN where QSTESTCD=PARAMCD
        - id: ACITM08
          where:
            PARAMCD:
              - ACITM08
          label: Word Recognition
          data_type: integer
          length: 8
          mandatory: false
          origins:
            - type: Derived
          comment: QS.QSSTRESN where QSTESTCD=PARAMCD
        - id: ACITM09
          where:
            PARAMCD:
              - ACITM09
          label: Attention/Visual Search Task
          data_type: integer
          length: 8
          mandatory: false
          origins:
            - type: Derived
          comment: QS.QSSTRESN where QSTESTCD=PARAMCD
        - id: ACITM10
          where:
            PARAMCD:
              - ACITM10
          label: Maze Solution
          data_type: integer
          length: 8
          mandatory: false
          origins:
            - type: Derived
          comment: QS.QSSTRESN where QSTESTCD=PARAMCD
        - id: ACITM11
          where:
            PARAMCD:
              - ACITM11
          label: Spoken Language Ability
          data_type: integer
          length: 8
          mandatory: false
          origins:
            - type: Derived
          comment: QS.QSSTRESN where QSTESTCD=PARAMCD
        - id: ACITM12
          where:
            PARAMCD:
              - ACITM12
          label: Comprehension Of Spoken Language
          data_type: integer
          length: 8
          mandatory: false
          origins:
            - type: Derived
          comment: QS.QSSTRESN where QSTESTCD=PARAMCD
        - id: ACITM13
          where:
            PARAMCD:
              - ACITM13
          label: Word Finding Difficulty In Spontaneous S
          data_type: integer
          length: 8
          mandatory: false
          origins:
            - type: Derived
          comment: QS.QSSTRESN where QSTESTCD=PARAMCD
        - id: ACITM14
          where:
            PARAMCD:
              - ACITM14
          label: Recall Of Test Instructions
          data_type: integer
          length: 8
          mandatory: false
          origins:
            - type: Derived
          comment: QS.QSSTRESN where QSTESTCD=PARAMCD
        - id: ACTOT
          where:
            PARAMCD:
              - ACTOT
          label: Adas-Cog(11) Subscore
          data_type: integer
          length: 8
          mandatory: false
          origins:
            - type: Derived
          comment: Sum of ADAS scores for items 1, 2, 4, 5, 6, 7, 8, 11, 12, 13, and 14, see SAP section 14.2 for details on adjusting for missing values.
  - name: ABLFL
    type: str
    label: ABLFL
    submission:
      data_type: text
      length: 1
      mandatory: false
      origins:
        - type: Derived
      comment: QS.QSBLFL
      codelist: Y_BLANK
  - name: ANL01FL
    type: str
    label: Analysis Record Flag 01
    submission:
      data_type: text
      length: 1
      mandatory: false
      origins:
        - type: Derived
      comment: If multiple visits fall into the same visit window, then the one closest to the target date is chosen for analysis. These are flagged with ANL01FL="Y".
      codelist: Y_BLANK
  - name: DTYPE
    type: str
    label: Derivation Type
    submission:
      data_type: text
      length: 7
      mandatory: false
      origins:
        - type: Derived
      codelist: DTYPE
      value_level:
        - id: ACITM01
          where:
            PARAMCD:
              - ACITM01
          label: Word Recall Task
          data_type: text
          length: 10
          mandatory: false
          origins:
            - type: Derived
          comment: 'Value: null'
          codelist: DTYPE
        - id: ACITM02
          where:
            PARAMCD:
              - ACITM02
          label: Naming Objects And Fingers (Refer To 5 C
          data_type: text
          length: 10
          mandatory: false
          origins:
            - type: Derived
          comment: 'Value: null'
          codelist: DTYPE
        - id: ACITM03
