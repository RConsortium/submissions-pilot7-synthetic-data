  - name: AWRANGE
    type: str
    label: Analysis Window Valid Relative Range
    derivation:
      mapping:
        source: AVISIT
        dict:
          Baseline: <=1
          Week 8: 2-84
          Week 16: 85-140
          Week 24: '>140'
    submission:
      data_type: text
      length: 9
      mandatory: false
      origins:
        - type: Derived
      comment: Window range, specified in the SAP.
  - name: AWLO
    type: float
    label: Analysis Window Beginning Timepoint
    derivation:
      mapping:
        source: AVISIT
        dict:
          Baseline:
          Week 8: 2.0
          Week 16: 85.0
          Week 24: 141.0
    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: Start day of the window, specified in the SAP.
  - name: AWHI
    type: float
    label: Analysis Window Ending Timepoint
    derivation:
      mapping:
        source: AVISIT
        dict:
          Baseline: 1.0
          Week 8: 84.0
          Week 16: 140.0
          Week 24:
    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: End day of the window, specified in the SAP.
  - name: AWU
    type: str
    label: Analysis Window Unit
    derivation: "'DAYS'"
    submission:
      data_type: text
      length: 4
      mandatory: false
      origins:
        - type: Derived
      comment: Assigned as "DAYS".
      codelist: AWU
  - name: BASE
    type: float
    label: Baseline Value
    derivation:
      aggregate:
        filter: "ABLFL = 'Y'"
        group_by:
          - STUDYID
          - USUBJID
          - PARAMCD
        expr: ONLY(AVAL)
    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: QS.QSSTRESN when QS.QSBLFL=Y (QS.VISITNUM=3)
  - name: CHG
    type: float
    label: Baseline Value
    derivation:
      case:
        - when: "ABLFL <> 'Y'"
          then: AVAL - BASE
    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: AVAL - BASE
  - name: PCHG
    type: float
    label: Percent Change from Baseline
    derivation:
      case:
        - when: "ABLFL <> 'Y' AND BASE <> 0"
          then: 100 * (AVAL - BASE) / BASE
    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: 100* (CHG/BASE)
  - name: _SELECTED_AVAL
    type: float
    label: Selected observed score (helper)
  - name: _CARRIED_AVAL
    type: float
    label: Carried selected score (helper)
rows:
  - id: obs
    dataset: QS
    filter: "QS.QSTESTCD IN ('ACITM01','ACITM02','ACITM03','ACITM04','ACITM05','ACITM06','ACITM07','ACITM08','ACITM09','ACITM10','ACITM11','ACITM12','ACITM13','ACITM14','ACTOT')"
    derivations:
      QSSEQ: QS.QSSEQ
      PARAMCD: QS.QSTESTCD
      ADT:
        impute:
          type: date
          source: QS.QSDTC
          day: 1
      ADY:
        study_day:
          source: ADT
          reference: TRTSDT
      AVISIT:
        case:
          - when: ADY <= 1
            then: "'Baseline'"
          - when: ADY >= 2 AND ADY <= 84
            then: "'Week 8'"
          - when: ADY >= 85 AND ADY <= 140
            then: "'Week 16'"
          - otherwise: "'Week 24'"
      AVAL:
        case:
          - when: "PARAMCD = 'ACTOT'"
            then: _CARRIED_AVAL
          - otherwise: QS.QSSTRESN
      AVISITN:
        mapping:
          source: AVISIT
          dict:
            Baseline: 0.0
            Week 8: 8.0
            Week 16: 16.0
            Week 24: 24.0
      VISIT: QS.VISIT
      VISITNUM: QS.VISITNUM
      AWTARGET:
        mapping:
          source: AVISIT
          dict:
            Baseline: 1.0
            Week 8: 56.0
            Week 16: 112.0
            Week 24: 168.0
      AWTDIFF: ABS(AWTARGET - ADY)
      _DIFF: AWTARGET - ADY
      _RN_ANL:
        row_number:
          window:
            group_by:
              - STUDYID
              - USUBJID
              - PARAMCD
              - AVISIT
            order_by:
              - variable: AWTDIFF
                nulls: last
              - variable: _DIFF
                nulls: last
      ABLFL:
        flag:
          condition: "QS.QSBLFL = 'Y'"
          false_value: ""
          missing: ""
      ANL01FL:
        flag:
          condition: _RN_ANL = 1
          false_value: ""
          missing: ""
      DTYPE:
        case:
          - when: "PARAMCD = 'ACTOT' AND (AVAL <> QS.QSSTRESN OR (AVAL IS NOT NULL AND QS.QSSTRESN IS NULL))"
            then: "'LOCF'"
          - otherwise: "''"
      _HIT:
      _SRC_QSSEQ:
      _SRC_AVAL:
      _SRC_ADY:
      _SRC_ADT:
      _SRC_VISIT:
      _SRC_VISITNUM:
      _SELECTED_AVAL:
        case:
          - when: "ANL01FL = 'Y'"
            then: QS.QSSTRESN
      _CARRIED_AVAL:
        locf:
          source: _SELECTED_AVAL
          window:
            group_by:
              - STUDYID
              - USUBJID
              - PARAMCD
            order_by:
              - variable: ADY
                nulls: last
              - variable: QSSEQ
                nulls: last
  - id: locf8
    dataset: QS
    group_by:
      - QS.STUDYID
      - QS.USUBJID
    filter: _HIT IS NULL AND _SRC_QSSEQ IS NOT NULL
    derivations:
      _HIT:
        case:
          - when: DONOR8.AVISITN = 8
            then: DONOR8.QSSEQ
      _SRC_QSSEQ: DONOR8.QSSEQ
      _SRC_AVAL: DONOR8.AVAL
      _SRC_ADY: DONOR8.ADY
      _SRC_ADT: DONOR8.ADT
      _SRC_VISIT: DONOR8.VISIT
      _SRC_VISITNUM: DONOR8.VISITNUM
      AVISIT: "'Week 8'"
      AVISITN: 8.0
      AWTARGET: 56.0
      AWTDIFF: ABS(AWTARGET - ADY)
      _DIFF: AWTARGET - ADY
      VISIT: _SRC_VISIT
      VISITNUM: _SRC_VISITNUM
      ADY: _SRC_ADY
      ADT: _SRC_ADT
      PARAMCD: "'ACTOT'"
      AVAL: _SRC_AVAL
      ABLFL: "''"
      ANL01FL: "'Y'"
      DTYPE: "'LOCF'"
      QSSEQ: _SRC_QSSEQ
      _SELECTED_AVAL:
      _CARRIED_AVAL:
  - id: locf16
    dataset: QS
    group_by:
      - QS.STUDYID
      - QS.USUBJID
    filter: _HIT IS NULL AND _SRC_QSSEQ IS NOT NULL
    derivations:
      _HIT:
        case:
          - when: DONOR16.AVISITN = 16
            then: DONOR16.QSSEQ
      _SRC_QSSEQ: DONOR16.QSSEQ
      _SRC_AVAL: DONOR16.AVAL
      _SRC_ADY: DONOR16.ADY
      _SRC_ADT: DONOR16.ADT
      _SRC_VISIT: DONOR16.VISIT
      _SRC_VISITNUM: DONOR16.VISITNUM
      AVISIT: "'Week 16'"
      AVISITN: 16.0
      AWTARGET: 112.0
      AWTDIFF: ABS(AWTARGET - ADY)
      _DIFF: AWTARGET - ADY
      VISIT: _SRC_VISIT
      VISITNUM: _SRC_VISITNUM
      ADY: _SRC_ADY
      ADT: _SRC_ADT
      PARAMCD: "'ACTOT'"
      AVAL: _SRC_AVAL
      ABLFL: "''"
      ANL01FL: "'Y'"
      DTYPE: "'LOCF'"
      QSSEQ: _SRC_QSSEQ
      _SELECTED_AVAL:
      _CARRIED_AVAL:
  - id: locf24
    dataset: QS
    group_by:
      - QS.STUDYID
      - QS.USUBJID
    filter: _HIT IS NULL AND _SRC_QSSEQ IS NOT NULL
    derivations:
      _HIT:
        case:
          - when: DONOR24.AVISITN = 24
            then: DONOR24.QSSEQ
      _SRC_QSSEQ: DONOR24.QSSEQ
      _SRC_AVAL: DONOR24.AVAL
      _SRC_ADY: DONOR24.ADY
      _SRC_ADT: DONOR24.ADT
      _SRC_VISIT: DONOR24.VISIT
      _SRC_VISITNUM: DONOR24.VISITNUM
      AVISIT: "'Week 24'"
      AVISITN: 24.0
      AWTARGET: 168.0
      AWTDIFF: ABS(AWTARGET - ADY)
      _DIFF: AWTARGET - ADY
      VISIT: _SRC_VISIT
      VISITNUM: _SRC_VISITNUM
      ADY: _SRC_ADY
      ADT: _SRC_ADT
      PARAMCD: "'ACTOT'"
      AVAL: _SRC_AVAL
      ABLFL: "''"
      ANL01FL: "'Y'"
      DTYPE: "'LOCF'"
      QSSEQ: _SRC_QSSEQ
      _SELECTED_AVAL:
      _CARRIED_AVAL:
