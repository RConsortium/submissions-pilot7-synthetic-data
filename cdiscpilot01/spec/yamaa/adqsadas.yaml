              - ACITM03
          label: Delayed Word Recall
          data_type: text
          length: 10
          mandatory: false
          origins:
            - type: Derived
          comment: 'Value: null'
          codelist: DTYPE
        - id: ACITM04
          where:
            PARAMCD:
              - ACITM04
          label: Commands
          data_type: text
          length: 10
          mandatory: false
          origins:
            - type: Derived
          comment: 'Value: null'
          codelist: DTYPE
        - id: ACITM05
          where:
            PARAMCD:
              - ACITM05
          label: Constructional Praxis
          data_type: text
          length: 10
          mandatory: false
          origins:
            - type: Derived
          comment: 'Value: null'
          codelist: DTYPE
        - id: ACITM06
          where:
            PARAMCD:
              - ACITM06
          label: Ideational Praxis
          data_type: text
          length: 10
          mandatory: false
          origins:
            - type: Derived
          comment: 'Value: null'
          codelist: DTYPE
        - id: ACITM07
          where:
            PARAMCD:
              - ACITM07
          label: Orientation
          data_type: text
          length: 10
          mandatory: false
          origins:
            - type: Derived
          comment: 'Value: null'
          codelist: DTYPE
        - id: ACITM08
          where:
            PARAMCD:
              - ACITM08
          label: Word Recognition
          data_type: text
          length: 10
          mandatory: false
          origins:
            - type: Derived
          comment: 'Value: null'
          codelist: DTYPE
        - id: ACITM09
          where:
            PARAMCD:
              - ACITM09
          label: Attention/Visual Search Task
          data_type: text
          length: 10
          mandatory: false
          origins:
            - type: Derived
          comment: 'Value: null'
          codelist: DTYPE
        - id: ACITM10
          where:
            PARAMCD:
              - ACITM10
          label: Maze Solution
          data_type: text
          length: 10
          mandatory: false
          origins:
            - type: Derived
          comment: 'Value: null'
          codelist: DTYPE
        - id: ACITM11
          where:
            PARAMCD:
              - ACITM11
          label: Spoken Language Ability
          data_type: text
          length: 10
          mandatory: false
          origins:
            - type: Derived
          comment: 'Value: null'
          codelist: DTYPE
        - id: ACITM12
          where:
            PARAMCD:
              - ACITM12
          label: Comprehension Of Spoken Language
          data_type: text
          length: 10
          mandatory: false
          origins:
            - type: Derived
          comment: 'Value: null'
          codelist: DTYPE
        - id: ACITM13
          where:
            PARAMCD:
              - ACITM13
          label: Word Finding Difficulty In Spontaneous S
          data_type: text
          length: 10
          mandatory: false
          origins:
            - type: Derived
          comment: 'Value: null'
          codelist: DTYPE
        - id: ACITM14
          where:
            PARAMCD:
              - ACITM14
          label: Recall Of Test Instructions
          data_type: text
          length: 10
          mandatory: false
          origins:
            - type: Derived
          comment: 'Value: null'
          codelist: DTYPE
        - id: ACTOT
          where:
            PARAMCD:
              - ACTOT
          label: Adas-Cog(11) Subscore
          data_type: text
          length: 10
          mandatory: false
          origins:
            - type: Derived
          comment: 'Value: LOCF denotes that the LOCF imputation method was used to impute the value for the given parameter and analysis visit.'
          codelist: DTYPE
  - name: AWTARGET
    type: float
    label: Analysis Window Target
    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: Target day within the window, specified in the SAP.
  - name: AWTDIFF
    type: float
    label: Analysis Window Diff from Target
    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      comment: Absolute difference between AWTARGET and ADY
  - name: _DIFF
    type: float
    label: signed AWTARGET-ADY (internal)
  - name: _RN_ANL
    type: float
    label: rank by window closeness within subject-param-visit (internal)
    derivation: 1.0
  - name: _HIT
    type: float
    label: QSSEQ of an observed ANL01FL record at the LOCF visit, if any (internal)
  - name: _SRC_QSSEQ
    type: float
    label: carried QSSEQ (internal)
  - name: _SRC_AVAL
    type: float
    label: carried AVAL (internal)
  - name: _SRC_ADY
    type: float
    label: carried ADY (internal)
  - name: _SRC_ADT
    type: date
    label: carried ADT (internal)
  - name: _SRC_VISIT
    type: str
    label: carried VISIT (internal)
  - name: _SRC_VISITNUM
    type: float
    label: carried VISITNUM (internal)
  - name: QSSEQ
    type: float
    label: Sequence Number
    submission:
      data_type: integer
      length: 8
      mandatory: false
      origins:
        - type: Derived
      value_level:
        - id: ACITM01
          where:
            PARAMCD:
              - ACITM01
          label: Word Recall Task
          data_type: integer
          length: 8
          mandatory: false
          origins:
            - type: Derived
          comment: QS.QSSEQ
        - id: ACITM02
          where:
            PARAMCD:
              - ACITM02
          label: Naming Objects And Fingers (Refer To 5 C
          data_type: integer
          length: 8
          mandatory: false
          origins:
            - type: Derived
          comment: QS.QSSEQ
        - id: ACITM03
          where:
            PARAMCD:
              - ACITM03
          label: Delayed Word Recall
          data_type: integer
          length: 8
          mandatory: false
          origins:
            - type: Derived
          comment: QS.QSSEQ
        - id: ACITM04
