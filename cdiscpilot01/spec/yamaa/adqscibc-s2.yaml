    type: str
    derivation: S1.USUBJID
  - name: _USUBJID
    type: str
  - name: _VISIT
    type: str
  - name: _VISITNUM
    type: float
  - name: _QSDY
    type: float
  - name: _QSDTC
    type: str
  - name: _QSSEQ
    type: float
  - name: QSSEQ
    type: float
    derivation: S1.QSSEQ
  - name: VISIT
    type: str
    derivation: {source: _VISIT}
  - name: VISITNUM
    type: float
    derivation: {source: _VISITNUM}
