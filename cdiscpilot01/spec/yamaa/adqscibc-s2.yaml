    type: float
  - name: _AWTARGET
    type: float
  - name: _AWLO
    type: float
  - name: _AWHI
    type: float
  - name: _AWRANGE
    type: str
  - name: _AWTDIFF
    type: float
  - name: _DTYPE
    type: str
  - name: _AVAL
    type: float
  - name: _ANL01FL
    type: str
  - name: _RANK
    type: float
