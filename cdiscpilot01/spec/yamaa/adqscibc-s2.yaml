schema_version: "1.0"
domain: ADQSCIBC_S2
keys: [USUBJID, QSSEQ]
input:
  S1:
    path: adqscibc-s1.parquet
    empty_string: present
base: S1

rows:
  - id: sel
    dataset: S1
    group_by: [S1.USUBJID, S1.QSSEQ]
    filter: "_RANK = 1"
    derivations:
      _USUBJID: S1.USUBJID
      _AVISIT:
        aggregate: "ONLY(S1._AVISIT)"
      _AWTDIFF:
        aggregate: "ONLY(S1._AWTDIFF)"
      _RANK:
        rank:
          window:
            group_by: [_USUBJID, _AVISIT]
            order_by: [{variable: _AWTDIFF, direction: asc}]
      _ANL01FL: {literal: 'Y'}
      _SITEID:
        aggregate: "ONLY(S1._SITEID)"
      _SITEGR1:
        aggregate: "ONLY(S1._SITEGR1)"
      _TRTSDT:
        aggregate: "ONLY(S1._TRTSDT)"
      _TRTEDT:
        aggregate: "ONLY(S1._TRTEDT)"
      _TRT01P:
        aggregate: "ONLY(S1._TRT01P)"
      _TRT01PN:
        aggregate: "ONLY(S1._TRT01PN)"
      _AGE:
        aggregate: "ONLY(S1._AGE)"
      _AGEGR1:
        aggregate: "ONLY(S1._AGEGR1)"
      _AGEGR1N:
        aggregate: "ONLY(S1._AGEGR1N)"
      _RACE:
        aggregate: "ONLY(S1._RACE)"
      _RACEN:
        aggregate: "ONLY(S1._RACEN)"
      _SEX:
        aggregate: "ONLY(S1._SEX)"
      _ITTFL:
        aggregate: "ONLY(S1._ITTFL)"
      _EFFFL:
        aggregate: "ONLY(S1._EFFFL)"
      _COMP24FL:
        aggregate: "ONLY(S1._COMP24FL)"
      _AVISITN:
        aggregate: "ONLY(S1._AVISITN)"
      _AWTARGET:
        aggregate: "ONLY(S1._AWTARGET)"
      _AWLO:
        aggregate: "ONLY(S1._AWLO)"
      _AWHI:
        aggregate: "ONLY(S1._AWHI)"
      _AWRANGE:
        aggregate: "ONLY(S1._AWRANGE)"
      _DTYPE:
        aggregate: "ONLY(S1._DTYPE)"
      _AVAL:
        aggregate: "ONLY(S1._AVAL)"
      _VISIT:
        aggregate: "ONLY(S1.VISIT)"
      _VISITNUM:
        aggregate: "ONLY(S1.VISITNUM)"
      _QSDY:
        aggregate: "ONLY(S1.QSDY)"
      _QSDTC:
        aggregate: "ONLY(S1.QSDTC)"
      _QSSEQ:
        aggregate: "ONLY(S1.QSSEQ)"

  - id: nsel
    dataset: S1
    group_by: [S1.USUBJID, S1.QSSEQ]
    filter: "_RANK <> 1"
    derivations:
      _USUBJID: S1.USUBJID
      _AVISIT:
        aggregate: "ONLY(S1._AVISIT)"
      _AWTDIFF:
        aggregate: "ONLY(S1._AWTDIFF)"
      _RANK:
        rank:
          window:
            group_by: [_USUBJID, _AVISIT]
            order_by: [{variable: _AWTDIFF, direction: asc}]
      _ANL01FL: {literal: ''}
      _SITEID:
        aggregate: "ONLY(S1._SITEID)"
      _SITEGR1:
        aggregate: "ONLY(S1._SITEGR1)"
      _TRTSDT:
        aggregate: "ONLY(S1._TRTSDT)"
      _TRTEDT:
        aggregate: "ONLY(S1._TRTEDT)"
      _TRT01P:
        aggregate: "ONLY(S1._TRT01P)"
      _TRT01PN:
        aggregate: "ONLY(S1._TRT01PN)"
      _AGE:
        aggregate: "ONLY(S1._AGE)"
      _AGEGR1:
        aggregate: "ONLY(S1._AGEGR1)"
      _AGEGR1N:
        aggregate: "ONLY(S1._AGEGR1N)"
      _RACE:
        aggregate: "ONLY(S1._RACE)"
      _RACEN:
        aggregate: "ONLY(S1._RACEN)"
      _SEX:
        aggregate: "ONLY(S1._SEX)"
      _ITTFL:
        aggregate: "ONLY(S1._ITTFL)"
      _EFFFL:
        aggregate: "ONLY(S1._EFFFL)"
      _COMP24FL:
        aggregate: "ONLY(S1._COMP24FL)"
      _AVISITN:
        aggregate: "ONLY(S1._AVISITN)"
      _AWTARGET:
        aggregate: "ONLY(S1._AWTARGET)"
      _AWLO:
        aggregate: "ONLY(S1._AWLO)"
      _AWHI:
        aggregate: "ONLY(S1._AWHI)"
      _AWRANGE:
        aggregate: "ONLY(S1._AWRANGE)"
      _DTYPE:
        aggregate: "ONLY(S1._DTYPE)"
      _AVAL:
        aggregate: "ONLY(S1._AVAL)"
      _VISIT:
        aggregate: "ONLY(S1.VISIT)"
      _VISITNUM:
        aggregate: "ONLY(S1.VISITNUM)"
      _QSDY:
        aggregate: "ONLY(S1.QSDY)"
      _QSDTC:
        aggregate: "ONLY(S1.QSDTC)"
      _QSSEQ:
        aggregate: "ONLY(S1.QSSEQ)"

output:
  path: adqscibc-s2.parquet
  order_by: [USUBJID, _AVISITN, QSSEQ]
  columns: [USUBJID, QSSEQ, VISIT, VISITNUM, QSDY, QSDTC,
    _AVISIT, _AVISITN, _AWTARGET, _AWLO, _AWHI, _AWRANGE, _AWTDIFF, _DTYPE, _AVAL,
    _ANL01FL, _RANK,
    _SITEID, _SITEGR1, _TRTSDT, _TRTEDT, _TRT01P, _TRT01PN, _AGE, _AGEGR1, _AGEGR1N,
    _RACE, _RACEN, _SEX, _ITTFL, _EFFFL, _COMP24FL]

