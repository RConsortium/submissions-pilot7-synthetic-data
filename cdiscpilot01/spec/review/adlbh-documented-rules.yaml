yamaa: '1.0'
type: spec
model: ADaM
domain: ADLBH
keys:
- STUDYID
- USUBJID
- PARAMCD
- LBSEQ
- AVISIT
input:
  REF:
    path: ../../data/adam/adlbh.parquet
    empty_string: present
  LB:
    path: ../../data/sdtm/lb.parquet
    empty_string: present
  ADSL:
    path: ../../data/adam/adsl.parquet
    empty_string: present
base: REF
output:
  path: ../../../.build/verification/cdiscpilot01/adlbh-documented-rules.parquet
  columns:
  - STUDYID
  - USUBJID
  - PARAMCD
  - LBSEQ
  - AVISIT
  - AVISITN
  - ADT
  - PARAM
  - PARAM__CODELIST_LENGTH
  - PARAMCD__LITERAL
  - PARAMN
  - PARCAT1
  - R2A1LO
  - R2A1LO__SAP_LIMIT
  - R2A1HI
  - R2A1HI__SAP_LIMIT
  - BR2A1LO
  - BR2A1LO__SAP_LIMIT
  - BR2A1HI
  - BR2A1HI__SAP_LIMIT
  - ALBTRVAL
  - STUDYID__LITERAL
  - USUBJID__LITERAL
intermediates:
- id: _LBH1_LB
  dataset: LB
  key:
  - STUDYID
  - USUBJID
  - LBSEQ
- id: _LBH2_REF
  dataset: REF
  key:
  - STUDYID
  - USUBJID
  - PARAMCD
  - LBSEQ
  - AVISIT
  order_by:
  - variable: REF.LBSEQ
    nulls: last
  keep: first
- id: _LBH2_BL
  dataset: REF
  key:
  - STUDYID
  - USUBJID
  - PARAMCD
  filter: REF.ABLFL = 'Y'
  order_by:
  - variable: REF.LBSEQ
    nulls: last
  keep: first
- id: _LBH3_LB
  dataset: LB
  key:
  - STUDYID
  - USUBJID
  - LBSEQ
- id: _LBH3_REF
  dataset: REF
  key:
  - STUDYID
  - USUBJID
  - PARAMCD
  - LBSEQ
  - AVISIT
  order_by:
  - variable: REF.LBSEQ
    nulls: last
  keep: first
- id: _LBH3_ADSL
  dataset: ADSL
  key:
  - STUDYID
  - USUBJID
  order_by:
  - variable: ADSL.USUBJID
    nulls: last
  keep: first
columns:
- name: STUDYID
  type: str
  label: Study Identifier
  derivation: REF.STUDYID
- name: USUBJID
  type: str
  label: Unique Subject Identifier
  derivation: REF.USUBJID
- name: PARAMCD
  type: str
  label: Parameter Code
  derivation: REF.PARAMCD
- name: LBSEQ
  type: float
  label: Sequence Number
  derivation: REF.LBSEQ
- name: AVISIT
  type: str
  label: Analysis Visit
  derivation: REF.AVISIT
- name: _LBH1_AVISIT
  type: str
  label: Analysis visit without storage padding
  derivation:
    str_replace:
      source: REF.AVISIT
      pattern: ^\s+|\s+$
      replacement: ''
- name: AVISITN
  type: float
  label: Documented analysis visit numeric code
  derivation:
    mapping:
      source: _LBH1_AVISIT
      unmapped: null
      dict:
        Baseline: 0.0
        Week 2: 2.0
        Week 4: 4.0
        Week 6: 6.0
        Week 8: 8.0
        Week 10: 10.0
        Week 12: 12.0
        Week 14: 14.0
        Week 16: 16.0
        Week 18: 18.0
        Week 20: 20.0
        Week 22: 22.0
        Week 24: 24.0
        Week 26: 26.0
        Weeks 4-24: 98.0
        End of Treatment: 99.0
- name: _LBH1_LBDTM
  type: datetime
  label: Source laboratory collection datetime
  derivation:
    impute:
      type: datetime
      source: _LBH1_LB.LBDTC
      time: first
      invalid: null
- name: ADT
  type: date
  label: Documented laboratory analysis date
  derivation:
    to_date:
      source: _LBH1_LBDTM
- name: _LBH1_UNIT
  type: str
  label: Source standard unit without storage padding
  derivation:
    str_replace:
      source: _LBH1_LB.LBSTRESU
      pattern: ^\s+|\s+$
      replacement: ''
- name: _LBH1_PARAM_BASE
  type: str
  label: Source test name with its nonblank standard unit
  derivation:
    case:
    - when: _LBH1_UNIT IS NULL OR _LBH1_UNIT = ''
      then: _LBH1_LB.LBTEST
    - otherwise:
        str_template: '{_LBH1_LB.LBTEST} ({_LBH1_UNIT})'
- name: PARAM
  type: str
  label: Documented full laboratory parameter concatenation
  derivation:
    case:
    - when: REF.PARAMN < 100
      then: _LBH1_PARAM_BASE
    - when: REF.PARAMN > 100
      then:
        str_template: '{_LBH1_PARAM_BASE} change from previous visit, relative to
          normal range'
    - otherwise: null
- name: PARAM__CODELIST_LENGTH
  type: str
  label: Derived MCHC enumerated label length reading
  derivation:
    case:
    - when: REF.PARAMCD = '_MCHC'
      then:
        str_extract:
          source: PARAM
          pattern: ^.{1,100}
    - otherwise: PARAM
- name: PARAMCD__LITERAL
  type: str
  label: Documented laboratory parameter code
  derivation:
    case:
    - when: REF.PARAMN < 100
      then: _LBH1_LB.LBTESTCD
    - when: REF.PARAMN > 100
      then:
        str_template: _{_LBH1_LB.LBTESTCD}
    - otherwise: null
- name: PARAMN
  type: float
  label: Documented parameter numeric code
  derivation:
    mapping:
      source: REF.PARAM
      unmapped: null
      dict:
        Hemoglobin (mmol/L): 1.0
        Hematocrit: 2.0
        Ery. Mean Corpuscular Volume (fL): 3.0
        Ery. Mean Corpuscular Hemoglobin (fmol(Fe)): 4.0
        Ery. Mean Corpuscular HGB Concentration (mmol/L): 5.0
        Leukocytes (GI/L): 6.0
        Lymphocytes (GI/L): 7.0
        Monocytes (GI/L): 8.0
        Eosinophils (GI/L): 9.0
        Basophils (GI/L): 10.0
        Platelet (GI/L): 11.0
        Erythrocytes (TI/L): 12.0
        Anisocytes: 13.0
        Macrocytes: 14.0
        Microcytes: 15.0
        Poikilocytes: 16.0
        Polychromasia: 17.0
        Hemoglobin (mmol/L) change from previous visit, relative to normal range: 101.0
        Hematocrit change from previous visit, relative to normal range: 102.0
        Ery. Mean Corpuscular Volume (fL) change from previous visit, relative to normal range: 103.0
        Ery. Mean Corpuscular Hemoglobin (fmol(Fe)) change from previous visit, relative to normal range: 104.0
        Ery. Mean Corpuscular HGB Concentration (mmol/L) change from previous visit, relative to normal rang: 105.0
        Leukocytes (GI/L) change from previous visit, relative to normal range: 106.0
        Lymphocytes (GI/L) change from previous visit, relative to normal range: 107.0
        Monocytes (GI/L) change from previous visit, relative to normal range: 108.0
        Eosinophils (GI/L) change from previous visit, relative to normal range: 109.0
        Basophils (GI/L) change from previous visit, relative to normal range: 110.0
        Platelet (GI/L) change from previous visit, relative to normal range: 111.0
        Erythrocytes (TI/L) change from previous visit, relative to normal range: 112.0
        Anisocytes change from previous visit, relative to normal range: 113.0
        Macrocytes change from previous visit, relative to normal range: 114.0
        Microcytes change from previous visit, relative to normal range: 115.0
        Poikilocytes change from previous visit, relative to normal range: 116.0
        Polychromasia change from previous visit, relative to normal range: 117.0
- name: PARCAT1
  type: str
  label: Documented hematology category
  derivation: '''HEM'''
- name: _LBH2_R2A1LO_RAW
  type: float
  label: Unrounded documented laboratory ratio
  derivation: _LBH2_REF.AVAL / _LBH2_REF.A1HI
- name: R2A1LO
  type: float
  label: Documented R2A1LO rule
  derivation:
    round_half_away_from_zero:
      source: _LBH2_R2A1LO_RAW
      digits: 1
- name: _LBH2_R2A1LO__SAP_LIMIT_RAW
  type: float
  label: Unrounded documented laboratory ratio
  derivation: _LBH2_REF.AVAL / _LBH2_REF.A1LO
- name: R2A1LO__SAP_LIMIT
  type: float
  label: Documented R2A1LO__SAP_LIMIT rule
  derivation:
    round_half_away_from_zero:
      source: _LBH2_R2A1LO__SAP_LIMIT_RAW
      digits: 1
- name: _LBH2_R2A1HI_RAW
  type: float
  label: Unrounded documented laboratory ratio
  derivation: _LBH2_REF.AVAL / _LBH2_REF.A1LO
- name: R2A1HI
  type: float
  label: Documented R2A1HI rule
  derivation:
    round_half_away_from_zero:
      source: _LBH2_R2A1HI_RAW
      digits: 1
- name: _LBH2_R2A1HI__SAP_LIMIT_RAW
  type: float
  label: Unrounded documented laboratory ratio
  derivation: _LBH2_REF.AVAL / _LBH2_REF.A1HI
- name: R2A1HI__SAP_LIMIT
  type: float
  label: Documented R2A1HI__SAP_LIMIT rule
  derivation:
    round_half_away_from_zero:
      source: _LBH2_R2A1HI__SAP_LIMIT_RAW
      digits: 1
- name: _LBH2_BR2A1LO_RAW
  type: float
  label: Unrounded documented laboratory ratio
  derivation: _LBH2_BL.AVAL / _LBH2_BL.A1HI
- name: BR2A1LO
  type: float
  label: Documented BR2A1LO rule
  derivation:
    round_half_away_from_zero:
      source: _LBH2_BR2A1LO_RAW
      digits: 1
- name: _LBH2_BR2A1LO__SAP_LIMIT_RAW
  type: float
  label: Unrounded documented laboratory ratio
  derivation: _LBH2_BL.AVAL / _LBH2_BL.A1LO
- name: BR2A1LO__SAP_LIMIT
  type: float
  label: Documented BR2A1LO__SAP_LIMIT rule
  derivation:
    round_half_away_from_zero:
      source: _LBH2_BR2A1LO__SAP_LIMIT_RAW
      digits: 1
- name: _LBH2_BR2A1HI_RAW
  type: float
  label: Unrounded documented laboratory ratio
  derivation: _LBH2_BL.AVAL / _LBH2_BL.A1LO
- name: BR2A1HI
  type: float
  label: Documented BR2A1HI rule
  derivation:
    round_half_away_from_zero:
      source: _LBH2_BR2A1HI_RAW
      digits: 1
- name: _LBH2_BR2A1HI__SAP_LIMIT_RAW
  type: float
  label: Unrounded documented laboratory ratio
  derivation: _LBH2_BL.AVAL / _LBH2_BL.A1HI
- name: BR2A1HI__SAP_LIMIT
  type: float
  label: Documented BR2A1HI__SAP_LIMIT rule
  derivation:
    round_half_away_from_zero:
      source: _LBH2_BR2A1HI__SAP_LIMIT_RAW
      digits: 1
- name: _LBH3_HIGH_EXCESS
  type: float
  label: Amount above upper laboratory threshold
  derivation: _LBH3_REF.LBSTRESN - 1.5 * _LBH3_LB.LBSTNRHI
- name: _LBH3_LOW_EXCESS
  type: float
  label: Amount below lower laboratory threshold
  derivation: 0.5 * _LBH3_LB.LBSTNRLO - _LBH3_REF.LBSTRESN
- name: _LBH3_THRESHOLD
  type: float
  label: Documented signed threshold distance
  derivation:
    greatest:
      sources:
      - _LBH3_HIGH_EXCESS
      - _LBH3_LOW_EXCESS
- name: ALBTRVAL
  type: float
  label: Documented amount threshold range
  derivation:
    round_half_away_from_zero:
      source: _LBH3_THRESHOLD
      digits: 3
- name: STUDYID__LITERAL
  type: str
  label: Documented ADSL study identifier copy
  derivation: _LBH3_ADSL.STUDYID
- name: USUBJID__LITERAL
  type: str
  label: Documented ADSL subject identifier copy
  derivation: _LBH3_ADSL.USUBJID
