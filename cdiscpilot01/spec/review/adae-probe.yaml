yamaa: '1.0'
type: spec
model: ADaM
domain: ADAE
keys:
- STUDYID
- USUBJID
- AESEQ
input:
  REF:
    path: ../../data/adam/adae.parquet
    empty_string: present
  AE:
    path: ../../data/sdtm/ae.parquet
    empty_string: present
  ADAE_FU_ADSL_REF:
    path: ../../data/adam/adsl.parquet
    empty_string: present
base: REF
output:
  path: ../../../.build/verification/cdiscpilot01/adae-probe.parquet
  columns:
  - STUDYID
  - USUBJID
  - AESEQ
  - ASTDT
  - ASTDT__SAP_MISSING
  - ASTDTF
  - ASTDY
  - AENDT
  - AENDY
  - ADURN
  - ADURU
  - TRTEMFL
  - AOCCFL
  - AOCCSFL
  - AOCCPFL
  - AOCC02FL
  - AOCC03FL
  - AOCC04FL
  - CQ01NAM
  - CQ01NAM__CORRECTED_SOC
  - AOCC01FL
  - AOCC01FL__DERMATOLOGIC
  - STUDYID__LITERAL
  - AELLTCD
  - AEDECOD
  - AESDTH
  - USUBJID__LITERAL
intermediates:
- id: _AE
  dataset: AE
  key:
  - STUDYID
  - USUBJID
  - AESEQ
  order_by:
  - variable: AE.AESEQ
    nulls: last
  keep: first
- id: _ADAE_FU_ADSL
  dataset: ADAE_FU_ADSL_REF
  key:
  - STUDYID
  - USUBJID
  order_by:
  - variable: ADAE_FU_ADSL_REF.USUBJID
    nulls: last
  keep: first
columns:
- name: STUDYID
  type: str
  label: Study Identifier
  derivation: REF.STUDYID
- name: USUBJID
  type: str
  label: Unique Subject Identifier
  derivation: REF.USUBJID
- name: AESEQ
  type: float
  label: Sequence Number
  derivation: REF.AESEQ
- name: ASTDT
  type: date
  label: Analysis start date literal
  derivation:
    case:
    - when: _AE.AESTDTC LIKE '%-%'
      then:
        impute:
          type: date
          source: _AE.AESTDTC
          day: 1
          invalid: null
    - otherwise: null
- name: ASTDT__SAP_MISSING
  type: date
  label: SAP completely missing start-date reading
  derivation:
    case:
    - when: _AE.AESTDTC IS NULL OR _AE.AESTDTC = ''
      then: REF.TRTSDT
    - otherwise: ASTDT
- name: ASTDTF
  type: str
  label: Start-date imputation flag literal
  derivation:
    case:
    - when: _AE.AESTDTC LIKE '%-%' AND _AE.AESTDTC NOT LIKE '%-%-%'
      then: '''D'''
    - otherwise: ''''''
- name: ASTDY
  type: float
  label: Start relative day literal
  derivation:
    case:
    - when: REF.ASTDT >= REF.TRTSDT
      then:
        diff:
          type: date
          start: REF.TRTSDT
          end: REF.ASTDT
          unit: day
          closed: both
    - otherwise:
        diff:
          type: date
          start: REF.TRTSDT
          end: REF.ASTDT
          unit: day
- name: AENDT
  type: date
  label: Analysis end date literal
  derivation:
    impute:
      type: date
      source: _AE.AEENDTC
      invalid: null
- name: AENDY
  type: float
  label: End relative day literal
  derivation:
    case:
    - when: REF.AENDT >= REF.TRTSDT
      then:
        diff:
          type: date
          start: REF.TRTSDT
          end: REF.AENDT
          unit: day
          closed: both
    - otherwise:
        diff:
          type: date
          start: REF.TRTSDT
          end: REF.AENDT
          unit: day
- name: ADURN
  type: float
  label: Inclusive AE duration literal
  derivation:
    diff:
      type: date
      start: REF.ASTDT
      end: REF.AENDT
      unit: day
      closed: both
- name: ADURU
  type: str
  label: AE duration unit literal
  derivation:
    case:
    - when: REF.ADURN IS NOT NULL
      then: '''DAY'''
    - otherwise: ''''''
- name: TRTEMFL
  type: str
  label: Treatment emergent flag literal
  derivation:
    case:
    - when: REF.ASTDT IS NOT NULL AND REF.TRTSDT IS NOT NULL AND REF.ASTDT >= REF.TRTSDT
      then: '''Y'''
    - otherwise: '''N'''
- name: _OCC_AOCCFL_RN
  type: float
  label: Documented chronological occurrence rank
  derivation:
    row_number:
      window:
        group_by:
        - STUDYID
        - USUBJID
        order_by:
        - variable: REF.ASTDT
          nulls: first
        - variable: REF.AESEQ
          nulls: last
        filter: REF.TRTEMFL = 'Y'
- name: AOCCFL
  type: str
  label: Documented occurrence flag
  derivation:
    case:
    - when: _OCC_AOCCFL_RN = 1
      then: '''Y'''
    - otherwise: ''''''
- name: _OCC_AOCCSFL_RN
  type: float
  label: Documented chronological occurrence rank
  derivation:
    row_number:
      window:
        group_by:
        - STUDYID
        - USUBJID
        - REF.AEBODSYS
        order_by:
        - variable: REF.ASTDT
          nulls: first
        - variable: REF.AESEQ
          nulls: last
        filter: REF.TRTEMFL = 'Y'
- name: AOCCSFL
  type: str
  label: Documented occurrence flag
  derivation:
    case:
    - when: _OCC_AOCCSFL_RN = 1
      then: '''Y'''
    - otherwise: ''''''
- name: _OCC_AOCCPFL_RN
  type: float
  label: Documented chronological occurrence rank
  derivation:
    row_number:
      window:
        group_by:
        - STUDYID
        - USUBJID
        - REF.AEBODSYS
        - REF.AEDECOD
        order_by:
        - variable: REF.ASTDT
          nulls: first
        - variable: REF.AESEQ
          nulls: last
        filter: REF.TRTEMFL = 'Y'
- name: AOCCPFL
  type: str
  label: Documented occurrence flag
  derivation:
    case:
    - when: _OCC_AOCCPFL_RN = 1
      then: '''Y'''
    - otherwise: ''''''
- name: _OCC_AOCC02FL_RN
  type: float
  label: Documented chronological occurrence rank
  derivation:
    row_number:
      window:
        group_by:
        - STUDYID
        - USUBJID
        order_by:
        - variable: REF.ASTDT
          nulls: first
        - variable: REF.AESEQ
          nulls: last
        filter: REF.TRTEMFL = 'Y' AND REF.AESER = 'Y'
- name: AOCC02FL
  type: str
  label: Documented occurrence flag
  derivation:
    case:
    - when: _OCC_AOCC02FL_RN = 1
      then: '''Y'''
    - otherwise: ''''''
- name: _OCC_AOCC03FL_RN
  type: float
  label: Documented chronological occurrence rank
  derivation:
    row_number:
      window:
        group_by:
        - STUDYID
        - USUBJID
        - REF.AEBODSYS
        order_by:
        - variable: REF.ASTDT
          nulls: first
        - variable: REF.AESEQ
          nulls: last
        filter: REF.TRTEMFL = 'Y' AND REF.AESER = 'Y'
- name: AOCC03FL
  type: str
  label: Documented occurrence flag
  derivation:
    case:
    - when: _OCC_AOCC03FL_RN = 1
      then: '''Y'''
    - otherwise: ''''''
- name: _OCC_AOCC04FL_RN
  type: float
  label: Documented chronological occurrence rank
  derivation:
    row_number:
      window:
        group_by:
        - STUDYID
        - USUBJID
        - REF.AEBODSYS
        - REF.AEDECOD
        order_by:
        - variable: REF.ASTDT
          nulls: first
        - variable: REF.AESEQ
          nulls: last
        filter: REF.TRTEMFL = 'Y' AND REF.AESER = 'Y'
- name: AOCC04FL
  type: str
  label: Documented occurrence flag
  derivation:
    case:
    - when: _OCC_AOCC04FL_RN = 1
      then: '''Y'''
    - otherwise: ''''''
- name: CQ01NAM
  type: str
  label: Documented dermatologic event query
  derivation:
    case:
    - when: REF.AEDECOD LIKE '%APPLICATION%' OR REF.AEDECOD LIKE '%DERMATITIS%' OR
        REF.AEDECOD LIKE '%ERYTHEMA%' OR REF.AEDECOD LIKE '%BLISTER%' OR (REF.AEBODSYS
        = 'SKIN AND SUBC UTANEOUS TISSUE DISORDERS' AND REF.AEDECOD NOT IN ('COLD
        SWEAT', 'HYPERHIDROSIS', 'ALOPECIA'))
      then: '''DERMATOLOGIC EVENTS'''
    - otherwise: ''''''
- name: CQ01NAM__CORRECTED_SOC
  type: str
  label: Documented dermatologic event query
  derivation:
    case:
    - when: REF.AEDECOD LIKE '%APPLICATION%' OR REF.AEDECOD LIKE '%DERMATITIS%' OR
        REF.AEDECOD LIKE '%ERYTHEMA%' OR REF.AEDECOD LIKE '%BLISTER%' OR (REF.AEBODSYS
        = 'SKIN AND SUBCUTANEOUS TISSUE DISORDERS' AND REF.AEDECOD NOT IN ('COLD SWEAT',
        'HYPERHIDROSIS', 'ALOPECIA'))
      then: '''DERMATOLOGIC EVENTS'''
    - otherwise: ''''''
- name: _OCC_AOCC01FL_RN
  type: float
  label: Documented chronological occurrence rank
  derivation:
    row_number:
      window:
        group_by:
        - STUDYID
        - USUBJID
        order_by:
        - variable: REF.ASTDT
          nulls: first
        - variable: REF.AESEQ
          nulls: last
        filter: REF.CQ01NAM = '' AND REF.TRTEMFL = 'Y'
- name: AOCC01FL
  type: str
  label: Documented occurrence flag
  derivation:
    case:
    - when: _OCC_AOCC01FL_RN = 1
      then: '''Y'''
    - otherwise: ''''''
- name: _OCC_AOCC01FL__DERMATOLOGIC_RN
  type: float
  label: Documented chronological occurrence rank
  derivation:
    row_number:
      window:
        group_by:
        - STUDYID
        - USUBJID
        order_by:
        - variable: REF.ASTDT
          nulls: first
        - variable: REF.AESEQ
          nulls: last
        filter: REF.CQ01NAM = 'DERMATOLOGIC EVENTS' AND REF.TRTEMFL = 'Y'
- name: AOCC01FL__DERMATOLOGIC
  type: str
  label: Documented occurrence flag
  derivation:
    case:
    - when: _OCC_AOCC01FL__DERMATOLOGIC_RN = 1
      then: '''Y'''
    - otherwise: ''''''
- name: STUDYID__LITERAL
  type: str
  label: Documented ADSL study identifier copy
  derivation: _ADAE_FU_ADSL.STUDYID
- name: AELLTCD
  type: float
  label: Documented raw lowest level term code copy
  derivation: _AE.AELLTCD
- name: AEDECOD
  type: str
  label: Documented raw dictionary derived term copy
  derivation: _AE.AEDECOD
- name: AESDTH
  type: str
  label: Documented raw results in death flag copy
  derivation: _AE.AESDTH
- name: USUBJID__LITERAL
  type: str
  label: Documented ADSL unique subject identifier copy
  derivation: _ADAE_FU_ADSL.USUBJID
