yamaa: '1.0'
type: spec
model: ADaM
domain: ADQSADAS
keys:
- STUDYID
- USUBJID
- PARAMCD
- AVISITN
- QSSEQ
input:
  REF:
    path: ../../data/adam/adqsadas.parquet
    empty_string: present
  _ADAS1_QS:
    path: ../../data/sdtm/qs.parquet
    empty_string: present
  _ADAS2_QS:
    path: ../../data/sdtm/qs.parquet
    empty_string: present
  _ADAS3_ADSL:
    path: ../../data/adam/adsl.parquet
    empty_string: present
base: REF
output:
  path: ../../../.build/verification/cdiscpilot01/adqsadas-documented-rules.parquet
  columns:
  - STUDYID
  - USUBJID
  - PARAMCD
  - AVISITN
  - QSSEQ
  - AVISITN__LITERAL
  - ADY
  - ADT
  - PARAM
  - PARAMN
  - BASE
  - CHG
  - CHG__POSTBASELINE
  - CHG__PROGRAM
  - PCHG
  - AWTARGET
  - AWTDIFF
  - AWU
  - STUDYID__LITERAL
  - USUBJID__LITERAL
intermediates:
- id: _ADAS1_QSSRC
  dataset: _ADAS1_QS
  key:
  - STUDYID
  - USUBJID
  - QSSEQ
  columns:
  - QSDTC
- id: _ADAS2_BASESRC
  dataset: _ADAS2_QS
  key:
    STUDYID: STUDYID
    USUBJID: USUBJID
    QSTESTCD: PARAMCD
  filter: _ADAS2_QS.QSBLFL = 'Y' AND _ADAS2_QS.VISITNUM = 3
  columns:
  - QSSTRESN
- id: _ADAS3_ADSLSRC
  dataset: _ADAS3_ADSL
  key:
  - STUDYID
  - USUBJID
  columns:
  - STUDYID
  - USUBJID
columns:
- name: STUDYID
  type: str
  label: Study Identifier
  derivation: REF.STUDYID
- name: USUBJID
  type: str
  label: Unique Subject Identifier
  derivation: REF.USUBJID
- name: PARAMCD
  type: str
  label: Parameter Code
  derivation: REF.PARAMCD
- name: AVISITN
  type: float
  label: Analysis Visit (N)
  derivation: REF.AVISITN
- name: QSSEQ
  type: float
  label: Sequence Number
  derivation: REF.QSSEQ
- name: AVISITN__LITERAL
  type: float
  label: Documented analysis-visit code
  derivation:
    mapping:
      source: REF.AVISIT
      dict:
        Baseline: 0.0
        Week 2: 2.0
        Week 4: 4.0
        Week 6: 6.0
        Week 8: 8.0
        Week 10: 10.0
        Week 12: 12.0
        Week 14: 14.0
        Week 16: 16.0
        Week 18: 18.0
        Week 20: 20.0
        Week 22: 22.0
        Week 24: 24.0
        Week 26: 26.0
        Weeks 4-24: 98.0
        End of Treatment: 99.0
- name: ADY
  type: float
  label: Documented analysis relative day
  derivation:
    study_day:
      source: REF.ADT
      reference: REF.TRTSDT
- name: ADT
  type: date
  label: Documented source analysis date
  derivation:
    to_date:
      source: _ADAS1_QSSRC.QSDTC
- name: PARAM
  type: str
  label: Documented parameter description
  derivation:
    mapping:
      source: REF.PARAMCD
      dict:
        ACITM01: Word Recall Task
        ACITM02: Naming Objects And Fingers (Refer To 5 C
        ACITM03: Delayed Word Recall
        ACITM04: Commands
        ACITM05: Constructional Praxis
        ACITM06: Ideational Praxis
        ACITM07: Orientation
        ACITM08: Word Recognition
        ACITM09: Attention/Visual Search Task
        ACITM10: Maze Solution
        ACITM11: Spoken Language Ability
        ACITM12: Comprehension Of Spoken Language
        ACITM13: Word Finding Difficulty In Spontaneous S
        ACITM14: Recall Of Test Instructions
        ACTOT: Adas-Cog(11) Subscore
- name: PARAMN
  type: float
  label: Documented numeric parameter code
  derivation:
    mapping:
      source: REF.PARAMCD
      dict:
        ACITM01: 1.0
        ACITM02: 2.0
        ACITM03: 3.0
        ACITM04: 4.0
        ACITM05: 5.0
        ACITM06: 6.0
        ACITM07: 7.0
        ACITM08: 8.0
        ACITM09: 9.0
        ACITM10: 10.0
        ACITM11: 11.0
        ACITM12: 12.0
        ACITM13: 13.0
        ACITM14: 14.0
        ACTOT: 15.0
- name: _ADAS2_AVAL
  type: float
  label: Published upstream analysis value
  derivation: REF.AVAL
- name: _ADAS2_BASE
  type: float
  label: Published upstream baseline for arithmetic
  derivation: REF.BASE
- name: _ADAS2_CHG
  type: float
  label: Published upstream change for percent arithmetic
  derivation: REF.CHG
- name: _ADAS2_AWTARGET
  type: float
  label: Published upstream window target for distance
  derivation: REF.AWTARGET
- name: _ADAS2_ADY
  type: float
  label: Published upstream analysis day for distance
  derivation: REF.ADY
- name: _ADAS2_AVISIT
  type: str
  label: Published upstream analysis visit
  derivation: REF.AVISIT
- name: _ADAS2_ABLFL
  type: str
  label: Published baseline record flag
  derivation: REF.ABLFL
- name: BASE
  type: float
  label: Documented raw QS baseline value
  derivation: _ADAS2_BASESRC.QSSTRESN
- name: CHG
  type: float
  label: Documented unqualified change formula
  derivation: _ADAS2_AVAL - _ADAS2_BASE
- name: CHG__POSTBASELINE
  type: float
  label: SAP post-baseline analysis-visit reading
  derivation:
    case:
    - when: _ADAS2_AVISIT IN ('Week 8','Week 16','Week 24')
      then: _ADAS2_AVAL - _ADAS2_BASE
- name: CHG__PROGRAM
  type: float
  label: Pilot 6 program non-baseline-record reading
  derivation:
    case:
    - when: _ADAS2_ABLFL IS NULL OR _ADAS2_ABLFL <> 'Y'
      then: _ADAS2_AVAL - _ADAS2_BASE
- name: PCHG
  type: float
  label: Documented percent-change quotient with nullable undefined arithmetic
  derivation: 100 * (_ADAS2_CHG / NULLIF(_ADAS2_BASE, 0))
- name: AWTARGET
  type: float
  label: Documented SAP target day
  derivation:
    mapping:
      source: _ADAS2_AVISIT
      dict:
        Baseline: 1.0
        Week 8: 56.0
        Week 16: 112.0
        Week 24: 168.0
- name: AWTDIFF
  type: float
  label: Documented absolute target difference
  derivation: ABS(_ADAS2_AWTARGET - _ADAS2_ADY)
- name: AWU
  type: str
  label: Documented analysis window unit
  derivation: '''DAYS'''
- name: STUDYID__LITERAL
  type: str
  label: Documented published ADSL study identifier
  derivation: _ADAS3_ADSLSRC.STUDYID
- name: USUBJID__LITERAL
  type: str
  label: Documented published ADSL subject identifier
  derivation: _ADAS3_ADSLSRC.USUBJID
