# Known differences between the yamaa output and the submitted datasets,
# read by scripts/site/collect_results.py; the site shows each reason.
#
#   missing_input  differences whose input the release lacks: a dictionary or
#                  sponsor file that was not submitted, or SDTM values FDA
#                  redacted. The spec derives the columns as the program does;
#                  the release cannot supply what they are derived from. The
#                  dataset is reported "matches except missing input" (owner
#                  decision 2026-11-26), a category of its own beside "exact".
#                  `missing` names the absent input.
#   open           differences still to fix, with their diagnosed cause. The
#                  dataset stays "differs"; the reason is shown next to it.
#   hold           datasets on hold by the owner's decision.
#   program_notes  places where a released program's text and the submitted
#                  dataset disagree (the submitted file was not produced by the
#                  program as released, or the spec follows the program's own
#                  stated intent over its code). Shown on the dataset and on the
#                  findings index; they do not change the verdict.
#
# An entry may also name a `substitute`: the input the spec read in place of
# the absent one (another release's snapshot of the same domain). The dataset
# is then reported "reproduced on a substitute input" (owner decision
# 2026-11-26), apart from "matches except missing input": the differences are
# not a few unrecoverable values but everything the two snapshots disagree
# on. `subjects: {exact, of}` gives how many subjects reproduce exactly.
#
# A dataset listed under `missing_input` is reported so when the listed
# differences are its only ones:
#   columns      columns yamaa does not derive at all (missing from its output);
#   rows_differ  true when the row count may differ because of those columns;
#   cells        {column: n}: at most n cells of that column may differ.
# Any other difference, or more cells than listed, still shows as a difference.
missing_input:
- study: c4591001
  dataset: ADCM
  cuts: [s1, s211-1mth, s135, s211-6mth]
  columns: [DRUGNAME, DRGNAME1, ATC1CD, ATC1T, ATC2CD, ATC2T, ATC3CD, ATC3T, ATC4CD, ATC4T, ATC5CD, ATC5T]
  rows_differ: true
  missing: "WHO Drug dictionary (WHODRUG DDE v202003), licensed, not submitted"
  reason: >-
    The 12 WHODRUG coding columns, and the one-row-per-ATC-class expansion
    (7,985 records to 19,925 rows), need the WHO Drug dictionary (WHODRUG
    DDE v202003), which is not in the submission.
  decided: "2026-11-25"

