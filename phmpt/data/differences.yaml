          AGEGR4: 1, AGEGR4N: 1, AGETGR3: 219, AGETGR3N: 219, OBESEFL: 19}
  missing: "DM.BRTHDTC, redacted to (b)(6) for every subject"
  reason: >-
    DM.BRTHDTC is redacted to (b)(6) for every subject, so ages at a date
