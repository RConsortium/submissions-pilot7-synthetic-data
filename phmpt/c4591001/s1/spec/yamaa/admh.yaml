            "12": '12'
            "13": '13'
            "14": '14'
            "15": '15'
            "16": '16'
            "17": '17'
            "18": '18'
            "19": '19'
            "20": '20'
            "21": '21'
            "22": '22'
            "23": '23'
            "24": '24'
            "25": '25'
            "26": '26'
            "27": '27'
            "28": '28'
            "29": '29'
            "30": '30'
            "31": '31'
          unmapped: null
    _AENDT_D9:
      type: str
      derivation:
        str_template:
          template: '{_AENDT_DAY}-{_AENDT_MON}-{_AENDT_YR}'
          missing: null
    _ASTDT_EPOCH:
      type: int
      derivation:
        to_epoch_day:
          source: _ASTDT_L
    _ADT_EPOCH:
      type: int
      derivation:
        to_epoch_day:
          source: _ADT_L
    _ASTDY_INT:
      type: int
      derivation:
        study_day:
          source: _ASTDT_L
          reference: ADSL_R._TRTSDT
    _AENDY_INT:
      type: int
      derivation:
        study_day:
          source: _AENDT_L
          reference: ADSL_R._TRTSDT
    _ASTDY_STR:
      type: str
      derivation: _ASTDY_INT
    _AENDY_STR:
      type: str
      derivation: _AENDY_INT
    _ADURN_DAYS:
      type: int
      derivation: _ADT_EPOCH - _ASTDT_EPOCH + 1
    _ADURN_RAW:
      type: float
      derivation: _ADURN_DAYS / 365.25
    _ADURN_F:
      type: float
      derivation:
        round_half_away_from_zero:
          source: _ADURN_RAW
          digits: 2
    _ADURN_STR:
      type: str
      derivation: _ADURN_F
    _ADT_F:
      type: float
      derivation: _ADT_EPOCH * 86400 + 2082844800
    _ASTDT_STR:
      type: str
      derivation:
        case:
        - when: MH.MHSTDTC = '(b)(6)'
          then: '''(b)(6)'''
        - otherwise: _ASTDT_D9
    _AENDT_STR:
      type: str
      derivation:
        case:
        - when: MH.MHENDTC = '(b)(6)'
          then: '''(b)(6)'''
        - otherwise: _AENDT_D9
    _ASTDY_STR2:
      type: str
      derivation:
        case:
        - when: MH.MHSTDTC = '(b)(6)'
          then: '''(b)(6)'''
        - otherwise: _ASTDY_STR
    _AENDY_STR2:
      type: str
      derivation:
        case:
        - when: MH.MHENDTC = '(b)(6)'
          then: '''(b)(6)'''
        - otherwise: _AENDY_STR
    _ADURN_STR2:
      type: str
      derivation:
        case:
        - when: MH.MHSTDTC = '(b)(6)' OR MH.MHENDTC = '(b)(6)'
          then: '''(b)(6)'''
        - when: _ADURN_F IS NULL
          then: '''0'''
        - otherwise: _ADURN_STR
    _ADURU:
      type: str
      derivation:
        case:
        - when: MH.MHSTDTC IS NULL
          then: ''''''
        - otherwise: '''YEARS'''
