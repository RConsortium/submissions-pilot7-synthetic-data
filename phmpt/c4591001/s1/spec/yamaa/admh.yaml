# Charlson comorbidity categories of a MedDRA PT code (admh.sas). The
# program stacks the 19 report-cci-*.xlsx lists in a fixed order, tags each
# file's rows with its category, and transposes by code: CAT1 is the first
# category in stack order that lists the code, CAT2 the second, each
# sentence-cased except AIDS/HIV. COMORBFL is Y for a code any list holds.
- id: CCI_I
  dataset: CCI_REPORTS
  key:
  - CODE
  order_by:
  - CCI_REPORTS._STACK
  keep: first
  derivations:
    _STACK:
      type: int
      derivation:
        mapping:
          source: CCI_REPORTS.FILE
          dict:
            report-cci-aids-hiv.xlsx: 1
            report-cci-any-malignancy.xlsx: 2
            report-cci-cerebrovascular.xlsx: 3
            report-cci-chf.xlsx: 4
            report-cci-dementia.xlsx: 5
            report-cci-diabetes-with-comp.xlsx: 6
            report-cci-diabetes-without-comp.xlsx: 7
            report-cci-hemiplegia.xlsx: 8
            report-cci-leukemia.xlsx: 9
            report-cci-lymphoma.xlsx: 10
            report-cci-metastatic-tumour.xlsx: 11
            report-cci-mi.xlsx: 12
            report-cci-mild-liver.xlsx: 13
            report-cci-mod-sev-liver.xlsx: 14
            report-cci-peptic-ulcer.xlsx: 15
            report-cci-periph-vasc.xlsx: 16
            report-cci-pulmonary.xlsx: 17
            report-cci-renal.xlsx: 18
            report-cci-rheumatic.xlsx: 19
          unmapped: null
    _CAT:
      type: str
      derivation:
        mapping:
          source: CCI_REPORTS.FILE
          dict:
            report-cci-aids-hiv.xlsx: AIDS/HIV
            report-cci-any-malignancy.xlsx: Any Malignancy
            report-cci-cerebrovascular.xlsx: Cerebrovascular Disease
            report-cci-chf.xlsx: Congestive Heart Failure
            report-cci-dementia.xlsx: Dementia
            report-cci-diabetes-with-comp.xlsx: Diabetes With Chronic Complication
            report-cci-diabetes-without-comp.xlsx: Diabetes Without Chronic Complication
            report-cci-hemiplegia.xlsx: Hemiplegia or Paraplegia
            report-cci-leukemia.xlsx: Leukemia
            report-cci-lymphoma.xlsx: Lymphoma
            report-cci-metastatic-tumour.xlsx: Metastatic Solid Tumor
            report-cci-mi.xlsx: Myocardial Infarction
            report-cci-mild-liver.xlsx: Mild Liver Disease
            report-cci-mod-sev-liver.xlsx: Moderate or Severe Liver Disease
            report-cci-peptic-ulcer.xlsx: Peptic Ulcer Disease
            report-cci-periph-vasc.xlsx: Peripheral Vascular Disease
            report-cci-pulmonary.xlsx: Chronic Pulmonary Disease
            report-cci-renal.xlsx: Renal Disease
            report-cci-rheumatic.xlsx: Rheumatic Disease
          unmapped: null
    _NEXT_CAT:
      type: str
      derivation:
        row_value:
          source: _CAT
          offset: 1
          window:
            group_by:
            - CCI_REPORTS.CODE
            order_by:
            - _STACK
    _CAT_SC:
      type: str
      derivation:
        str_case:
          source: _CAT
          to: sentence
    _NEXT_SC:
      type: str
      derivation:
        str_case:
          source: _NEXT_CAT
          to: sentence
    _CAT1:
      type: str
      derivation:
        case:
        - when: _CAT = 'AIDS/HIV'
          then: _CAT
        - otherwise: _CAT_SC
    _CAT2:
      type: str
      derivation:
        case:
        - when: _NEXT_CAT IS NULL
          then: "''"
        - when: _NEXT_CAT = 'AIDS/HIV'
          then: _NEXT_CAT
        - otherwise: _NEXT_SC
    _COMORBFL:
      type: str
      derivation: "'Y'"
- id: _MH_D1
  dataset: MH
  key:
  - STUDYID
  - USUBJID
  - MHSEQ
  derivations:
    _ASTDT:
      type: date
