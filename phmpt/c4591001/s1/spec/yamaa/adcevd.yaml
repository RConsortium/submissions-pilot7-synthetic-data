# C4591001 S1 ADCEVD.
# Parent: ../../../spec/yamaa/base/adam-base.yaml (section 3.1 core columns).
# Derivations implement the S1 ADaM define.xml MethodDefs + adcevd.sas
# (10Mar2021), recovered against the submitted data (see the pandas
# prototype tools/adcevd_proto*.py, verified EXACT MATCH 2026-11-23).
# ADSL columns (cols 1-76) are read from the SUBMITTED S1 ADSL Parquet,
# exactly as the SAS merges the sponsor's ADSL, so the 13 known ADSL-gap
# columns do NOT propagate into ADCEVD. STUDYID/USUBJID come from CE.
# The 57 INVESTIGATOR-evaluator VS FEVER rows are included via a pair
# relation (_INV_PAIRS: each INVESTIGATOR VS row joined to the FACE rows
# on its own VSDTC-date; aggregates over the pair relation keyed by the
# matched FATPTREF). The variant-A gap (9 cells, measured 2026-11-23) is
# closed by this change. Design proven by the synthetic probe
# adcevd/probe/pair_list.yaml (EXACT) and avoids yamaa #4790 (no row
# reads a lookup over a record relation).
# First generated by tools/gen_adcevd_spec.py (retired); this file is the source.
yamaa: '1.0'
type: spec
model: ADaM
parent: ../../../spec/yamaa/base/adam-base.yaml
domain: ADCEVD
keys:
- USUBJID
- CETPTREF
- CETERM
- ASEV
input:
  CE: <sdtm-dir>/ce.parquet
  SUPPCE: <sdtm-dir>/suppce.parquet
  FACE: <sdtm-dir>/face.parquet
  VS: <sdtm-dir>/vs.parquet
  EX: <sdtm-dir>/ex.parquet
  ADSL:
    path: <adam-dir>/adsl.parquet
    key:
    - STUDYID
    - USUBJID
submission:
  label: Reactogenicity Analysis Dataset
  class: OCCURRENCE DATA STRUCTURE
  structure: One record per subject per clinical event
  repeating: true
intermediates:
- id: _EX_DOSE
  dataset: EX
  key:
    USUBJID: CE.USUBJID
    EXLNKGRP: CE.CETPTREF
  order_by:
  - EX._EXDT
  keep: first
  derivations:
    _EXDT:
      type: date
      derivation:
        to_date:
          source: EX.EXSTDTC
    _EXDOSE:
      type: float
      derivation: EX.EXDOSE
    _EXTRT:
      type: str
      derivation: EX.EXTRT
    _EXDOSU:
      type: str
      derivation: EX.EXDOSU
    _EXSTDTC:
      type: str
      derivation: EX.EXSTDTC
    _EXENDTC:
      type: str
      derivation: EX.EXENDTC
- id: _EX_PLAIN
  dataset: EX
  key:
    USUBJID: CE.USUBJID
    EXLNKGRP: CE.CETPTREF
  order_by:
  - EX.EXSTDTC
  keep: first
- id: _ADSL_BY_SUBJ
  dataset: ADSL
  key:
    USUBJID: CE.USUBJID
  order_by:
  - ADSL.USUBJID
  keep: first
  derivations:
    _UNBLNDDT:
      type: date
      derivation: ADSL.UNBLNDDT
- id: _SEV21
  dataset: FACE
  key:
    USUBJID: CE.USUBJID
    FATPTREF: CE.CETPTREF
    FAOBJ: CE.CETERM
  filter: FACE.FADTC IS NOT NULL AND FACE.FASTRESN >= 10.5 AND str_contains(FACE.FATESTCD,
    'DIAM') AND (str_contains(FACE.FAOBJ, 'SWELLING') OR str_contains(FACE.FAOBJ,
    'REDNESS'))
  order_by:
  - FACE.FADTC
  keep: first
  derivations:
    _DT:
      type: date
      derivation:
        to_date:
          source: FACE.FADTC
- id: _SUPPCE
  dataset: SUPPCE
  key:
    USUBJID: CE.USUBJID
    _CESEQ: CE.CESEQ
  filter: SUPPCE.QNAM IN ('RCENDTC', 'ONGNXVIS')
  pivot:
    name: QNAM
    value: QVAL
    fields:
    - RCENDTC
    - ONGNXVIS
  derivations:
    _CESEQ:
      type: int
      derivation: SUPPCE.IDVARVAL
- id: _VS_INV
  dataset: VS
  filter: str_contains(VS.VSTESTCD, 'TEMP') AND ((str_contains(VS.VSCAT, 'REACTOGENICITY')
    AND VS.VSTPT <> '') OR (VS.VISIT IS NULL AND VS.VSDTC <> '')) AND VS.VSEVAL =
    'INVESTIGATOR'
  columns:
  - _USUBJID
  - _VDT
  - _JDT
  - _VFATPT_DAY
  - _VFASTRESC
  - _VSSTAT
  derivations:
    _USUBJID:
      type: str
      derivation: VS.USUBJID
    _VDT:
      type: date
      derivation:
        to_date:
          source: VS.VSDTC
    _JDT:
      type: date
      derivation:
        to_date:
          source: VS.VSDTC
    _VFATPT_DAY:
      type: int
      derivation:
        case:
        - when: VS.VSTPT = 'DAY 1'
          then: 1
        - when: VS.VSTPT = 'DAY 2'
          then: 2
        - when: VS.VSTPT = 'DAY 3'
          then: 3
        - when: VS.VSTPT = 'DAY 4'
          then: 4
        - when: VS.VSTPT = 'DAY 5'
          then: 5
        - when: VS.VSTPT = 'DAY 6'
          then: 6
        - when: VS.VSTPT = 'DAY 7'
          then: 7
    _VFASTRESC:
      type: str
      derivation:
        case:
        - when: VS.VSSTRESU = 'C' AND VS.VSSTRESN < 38
          then: "'N'"
        - when: VS.VSSTRESU = 'C' AND VS.VSSTRESN >= 38 AND VS.VSSTRESN <= 42
          then: "'Y'"
        - when: VS.VSSTRESU = 'C' AND VS.VSSTRESN > 42
          then: "'N'"
        - when: VS.VSSTRESU <> 'C' AND VS.VSSTAT = 'NOT DONE'
          then: "' '"
        - otherwise: "''"
    _VSSTAT:
      type: str
      derivation: VS.VSSTAT
- id: _FACE_DATES
  dataset: FACE
  filter: FACE.FACAT IN ('REACTOGENICITY', 'REACTOGENICITY EVENT', 'REACTOGENICITY
    - UNPLANNED ASSESSMENT')
  columns:
  - _USUBJID
  - _JDT
  - _FATPTREF
  derivations:
    _USUBJID:
      type: str
      derivation: FACE.USUBJID
    _JDT:
      type: date
      derivation:
        to_date:
          source: FACE.FADTC
    _FATPTREF:
      type: str
      derivation: FACE.FATPTREF
- id: _INV_PAIRS
  dataset: _VS_INV
  inner_join: _FACE_DATES
  key:
  - _USUBJID
  - _JDT
  derivations:
    _P_USUBJID:
      type: str
      derivation: _VS_INV._USUBJID
    _P_FATPTREF:
      type: str
      derivation: _FACE_DATES._FATPTREF
    _P_VDT:
      type: date
      derivation: _VS_INV._VDT
    _P_VFATPT_DAY:
      type: int
      derivation: _VS_INV._VFATPT_DAY
    _P_VFASTRESC:
      type: str
      derivation: _VS_INV._VFASTRESC
    _P_VSSTAT:
      type: str
      derivation: _VS_INV._VSSTAT
rows:
- id: base
  dataset: CE
  filter: CE.CECAT IN ('REACTOGENICITY', 'REACTOGENICITY EVENT') AND (CE.CESTAT IS
    NULL OR CE.CESTAT = '') AND CE.CETPTREF <> ''
  derivations:
    ASEV: "''"
- id: severe
  dataset: CE
  filter: CE.CECAT IN ('REACTOGENICITY', 'REACTOGENICITY EVENT') AND (CE.CESTAT IS
    NULL OR CE.CESTAT = '') AND CE.CETPTREF <> '' AND _SEV21._DT IS NOT NULL
  derivations:
    ASEV: "'Severe'"
columns:
- name: _MIN_DT_FB
  type: date
  derivation:
    aggregate:
      key:
        USUBJID: CE.USUBJID
        FATPTREF: CE.CETPTREF
        FAOBJ: CE.CETERM
      derivations:
        _DT:
          type: date
          derivation:
            to_date:
              source: FACE.FADTC
        _FAOBJ_U:
          type: str
          derivation:
            str_case:
              source: FACE.FAOBJ
              to: upper
        _FATESTCD_U:
          type: str
          derivation:
            str_case:
              source: FACE.FATESTCD
              to: upper
        _EXDT:
          type: date
          derivation: _EX_DOSE._EXDT
        _UNBLNDDT:
          type: date
          derivation: _ADSL_BY_SUBJ._UNBLNDDT
        _EPOCH_F:
          type: int
          derivation:
            to_epoch_day:
              source: _DT
        _EPOCH_EX:
          type: int
          derivation:
            to_epoch_day:
              source: _EXDT
        _FATPT_DIFF:
          type: int
          derivation: _EPOCH_F - _EPOCH_EX + 1
        _FATPT:
          type: int
          derivation:
            case:
            - when: FACE.FATPT = 'DAY 1'
              then: 1
            - when: FACE.FATPT = 'DAY 2'
              then: 2
            - when: FACE.FATPT = 'DAY 3'
              then: 3
            - when: FACE.FATPT = 'DAY 4'
              then: 4
            - when: FACE.FATPT = 'DAY 5'
              then: 5
            - when: FACE.FATPT = 'DAY 6'
              then: 6
            - when: FACE.FATPT = 'DAY 7'
              then: 7
            - otherwise: _FATPT_DIFF
      expr: MIN(_DT)
      filter: FACE.FACAT IN ('REACTOGENICITY', 'REACTOGENICITY EVENT', 'REACTOGENICITY
        - UNPLANNED ASSESSMENT') AND NOT (str_contains(_FAOBJ_U, 'HOSPITAL') OR FACE.FATESTCD
        = 'REL') AND NOT (FACE.FAEVAL = 'INVESTIGATOR' AND _FATPT IS NOT NULL AND
        _FATPT > 7 AND FACE.FAOBJ <> 'MEDICATIONS') AND (_DT IS NULL OR _UNBLNDDT
        IS NULL OR _DT < _UNBLNDDT) AND FACE.FADTC IS NOT NULL AND ((FACE.FASTRESC
        = 'Y' AND FACE.FATESTCD = 'OCCUR' AND NOT str_contains(_FAOBJ_U, 'MEDICATION')
        AND NOT str_contains(_FAOBJ_U, 'SWELLING') AND NOT str_contains(_FAOBJ_U,
        'REDNESS')) OR (FACE.FASTRESN >= 2.5 AND str_contains(_FATESTCD_U, 'DIAM')
        AND (str_contains(_FAOBJ_U, 'SWELLING') OR str_contains(_FAOBJ_U, 'REDNESS'))))
