- name: _ASTDT_B
  type: date
  derivation:
    case:
    - when: CE.CETERM = 'FEVER' AND _MIN_DT_VB IS NOT NULL AND (_MIN_DT_FB IS NULL
        OR _MIN_DT_VB < _MIN_DT_FB)
      then: _MIN_DT_VB
    - otherwise: _MIN_DT_FB
- name: _LASTDT_B
  type: date
  derivation:
    case:
    - when: CE.CETERM = 'FEVER' AND _MAX_DT_VB IS NOT NULL AND (_MAX_DT_FB IS NULL
        OR _MAX_DT_VB > _MAX_DT_FB)
      then: _MAX_DT_VB
    - otherwise: _MAX_DT_FB
- name: _QFATPT_B
  type: int
  derivation:
    case:
    - when: CE.CETERM = 'FEVER' AND _MAXF_Q_VB IS NOT NULL AND (_MAXF_Q_FB IS NULL
        OR _MAXF_Q_VB > _MAXF_Q_FB)
      then: _MAXF_Q_VB
    - otherwise: _MAXF_Q_FB
- name: _ALLFATPT_B
  type: int
  derivation:
    case:
    - when: CE.CETERM = 'FEVER' AND _MAXF_ALL_V IS NOT NULL AND (_MAXF_ALL_F IS NULL
        OR _MAXF_ALL_V > _MAXF_ALL_F)
      then: _MAXF_ALL_V
    - otherwise: _MAXF_ALL_F
- name: _ASTDT_S
  type: date
  derivation: _MIN_DT_FS
- name: _LASTDT_S
  type: date
  derivation: _MAX_DT_FS
- name: _QFATPT_S
  type: int
  derivation: _MAXF_Q_FS
- name: _ALLFATPT_S
  type: int
  derivation: _MAXF_ALL_F
- name: _ASTDT_I
  type: date
  derivation:
    case:
    - when: CE.CETERM = 'FEVER' AND _MIN_DT_VI IS NOT NULL AND (_ASTDT_B IS NULL OR
        _MIN_DT_VI < _ASTDT_B)
      then: _MIN_DT_VI
    - otherwise: _ASTDT_B
- name: _LASTDT_I
  type: date
  derivation:
    case:
    - when: CE.CETERM = 'FEVER' AND _MAX_DT_VI IS NOT NULL AND (_LASTDT_B IS NULL
        OR _MAX_DT_VI > _LASTDT_B)
      then: _MAX_DT_VI
    - otherwise: _LASTDT_B
- name: _QFATPT_I
  type: int
  derivation:
    case:
    - when: CE.CETERM = 'FEVER' AND _MAXF_Q_VI IS NOT NULL AND (_QFATPT_B IS NULL
        OR _MAXF_Q_VI > _QFATPT_B)
      then: _MAXF_Q_VI
    - otherwise: _QFATPT_B
- name: _ALLFATPT_I
  type: int
  derivation:
    case:
    - when: CE.CETERM = 'FEVER' AND _MAXF_ALL_VI IS NOT NULL AND (_ALLFATPT_B IS NULL
        OR _MAXF_ALL_VI > _ALLFATPT_B)
      then: _MAXF_ALL_VI
    - otherwise: _ALLFATPT_B
- name: _ASTDT_V
  type: date
  derivation:
    case:
    - when: ASEV = 'Severe'
      then: _ASTDT_S
    - otherwise: _ASTDT_I
- name: _LASTDT_V
  type: date
  derivation:
    case:
    - when: ASEV = 'Severe'
      then: _LASTDT_S
    - otherwise: _LASTDT_I
- name: _QFATPT_V
  type: int
  derivation:
    case:
    - when: ASEV = 'Severe'
      then: _QFATPT_S
    - otherwise: _QFATPT_I
- name: _ALLFATPT_V
  type: int
  derivation:
    case:
    - when: ASEV = 'Severe'
      then: _ALLFATPT_S
    - otherwise: _ALLFATPT_I
- name: _AENDT_V
  type: date
  derivation:
    case:
    - when: _QFATPT_V < _ALLFATPT_V
      then: _LASTDT_V
- name: _RCENDTC
  type: str
  derivation: _SUPPCE.RCENDTC
- name: _ONGNXVIS
  type: str
  derivation: _SUPPCE.ONGNXVIS
- name: _RC_LEN
  type: int
  derivation:
    str_length:
      source: _RCENDTC
- name: _RC_DT
  type: date
  derivation:
    case:
    - when: _RC_LEN = 10
      then:
        to_date:
          source: _RCENDTC
- name: _EP_ASTDT
  type: int
  derivation:
    to_epoch_day:
      source: _ASTDT_V
- name: _EP_AENDT_V
  type: int
  derivation:
    to_epoch_day:
      source: _AENDT_V
- name: _EP_RC
  type: int
  derivation:
    to_epoch_day:
      source: _RC_DT
- name: _EP_VAX102DT
  type: int
  derivation:
    to_epoch_day:
      source: ADSL.VAX102DT
- name: _AENDT_PRE
  type: date
  derivation:
    case:
    - when: _ASTDT_V IS NULL
      then: null
    - when: _AENDT_V IS NOT NULL
      then: _AENDT_V
    - when: _RC_LEN = 10
      then: _RC_DT
- name: _ADURN_PRE
  type: int
  derivation:
    case:
    - when: _ASTDT_V IS NULL
      then: null
    - when: _AENDT_V IS NOT NULL
      then: _EP_AENDT_V - _EP_ASTDT + 1
    - when: _RC_LEN = 10
      then: _EP_RC - _EP_ASTDT + 1
- name: _ADJ
  type: int
  derivation:
    case:
    - when: CE.CETPTREF = 'VACCINATION 1' AND ADSL.VAX102DT IS NOT NULL AND _ASTDT_V
        IS NOT NULL AND _AENDT_V IS NULL AND (_RC_DT > ADSL.VAX102DT OR (_ONGNXVIS
        = 'Y' AND _AENDT_PRE IS NULL))
      then: 1
    - otherwise: 0
