            _VISIT = 'V6_WEEK2_POSTVAX2_S' OR _VISIT = 'V7_MONTH1_S') AND (D_COHORTN._CN IS NULL OR D_COHORTN._CN
            <> 1.16)))
          then: 1
        - otherwise: 0
    _FLAG:
      type: int
      derivation:
        case:
        - when: _P = 1
          then: 1
- id: D_VISIT3DT
  dataset: SV
  key:
  - USUBJID
  order_by:
  - variable: SV._M
    direction: desc
  - variable: SV._HAS
    direction: desc
  - variable: SV._SVSTDT
    direction: asc
    nulls: last
  keep: first
  derivations:
    _V:
      type: str
      derivation: SV.VISIT
    _SVSTDT:
      type: date
      derivation:
        to_date:
          source: SV.SVSTDTC
    _HAS:
      type: int
      derivation:
        case:
        - when: _SVSTDT IS NOT NULL
          then: 1
        - otherwise: 0
    _M:
      type: int
      derivation:
        case:
        - when: str_contains(_V, 'V103_')
          then: 0
        - when: ((str_contains(_V, '_MONTH1_') AND (D_COHORTN._CN IS NULL OR D_COHORTN._CN <> 1.16)) OR
            (_V = 'V7_MONTH1_S_R' AND D_COHORTN._CN = 1.16))
          then: 1
        - otherwise: 0
    _DT:
      type: date
      derivation:
        case:
        - when: _M = 1
          then: _SVSTDT
