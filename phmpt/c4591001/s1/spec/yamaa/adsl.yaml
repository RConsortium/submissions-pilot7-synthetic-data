- id: EV1_VAXU
  dataset: EX
  key:
  - USUBJID
  filter: EX.VISIT IS NULL OR EX.VISIT = ''
  order_by:
  - variable: EX._IS10U
    direction: asc
    nulls: last
  keep: first
  derivations:
    _EXSTDT:
      type: date
      derivation:
        to_date:
          source: EX.EXSTDTC
    _PRD2DT:
      type: date
      derivation: EX_PRD2._EXSTDT
    _PERIODN:
      type: int
      derivation:
        case:
        - when: _PRD2DT IS NULL
          then: 1
        - when: _EXSTDT < _PRD2DT
          then: 1
        - otherwise: 2
    _IS10U:
      type: date
      derivation:
        case:
        - when: _PERIODN = 1
          then: _EXSTDT
    _VUDT:
      type: date
      derivation: _IS10U
