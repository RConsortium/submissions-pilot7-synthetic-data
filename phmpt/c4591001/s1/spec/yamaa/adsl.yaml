    _UNBM1:
      type: date
      derivation:
        shift:
          type: date
          source: _UNB
          days: -1
- id: FUP2CUT_I
  dataset: DM
  key:
  - USUBJID
  derivations:
    _V2:
      type: date
      derivation: EV1_VAX2._V2DT
    _EOS:
      type: date
      derivation:
        case:
        - when: DS_EOS._DSPHASE = 'FOLLOW-UP'
          then:
            first_available:
              sources:
              - DS_EOS._DT
              - DS_EOS._DDT
    _CUT:
      type: date
      derivation: CUT_I._CUT
    _D1:
      type: int
      derivation:
        diff:
          type: date
          start: _V2
          end: _EOS
          unit: day
          closed: both
    _D2:
      type: int
      derivation:
        diff:
          type: date
          start: _V2
          end: _CUT
          unit: day
          closed: both
    _FU:
      type: int
      derivation:
        case:
        - when: DS_RAND._DT IS NOT NULL AND _V2 IS NULL
          then: 0
        - when: DS_RAND._DT IS NOT NULL AND _EOS IS NOT NULL
          then: _D1
        - when: DS_RAND._DT IS NOT NULL
          then: _D2
    _FUC:
      type: int
      derivation:
        case:
        - when: _FU IS NOT NULL AND _FU <= 0
          then: 0
        - otherwise: _FU
- id: LB_RNA
  dataset: LB
  key:
  - USUBJID
  filter: LB.LBTESTCD = 'HIVR_US' AND (LB.LBSTAT IS NULL OR LB.LBSTAT <> 'NOT DONE') AND str_contains(LB.VISIT,
    'V1_DAY1_VAX1') AND (LB.LBDY IS NULL OR LB.LBDY <= 1)
  order_by:
  - LB._DT
  keep: first
  derivations:
    _DT:
      type: date
      derivation:
        to_date:
          source: LB.LBDTC
    _U:
      type: str
      derivation: LB.USUBJID
    _N:
      type: float
      derivation: LB.LBSTRESN
    _ORRES:
      type: str
      derivation: LB.LBORRES
    _ORRES_U:
      type: str
      derivation:
        str_case:
          source: _ORRES
          to: upper
    _NUMTXT:
      type: str
      derivation:
        str_extract:
          source: _ORRES
          pattern: \d+(\.\d+)?
          group: 0
          no_match: null
    _NUM:
      type: float
      derivation: _NUMTXT
    _ADJ:
      type: float
      derivation:
        case:
        - when: str_contains(_ORRES, '<')
          then: _NUM - 0.01
        - otherwise: _NUM
- id: LB_CD4
  dataset: LB
  key:
  - USUBJID
  filter: LB.LBTESTCD = 'CD4' AND LB.LBSTRESU IN ('10^9/L', '/uL') AND (LB.LBSTAT IS NULL OR LB.LBSTAT
    <> 'NOT DONE') AND str_contains(LB.VISIT, 'V1_DAY1_VAX1') AND (LB.LBDY IS NULL OR LB.LBDY <= 1)
  order_by:
  - LB._DT
  keep: first
  derivations:
    _DT:
      type: date
      derivation:
        to_date:
          source: LB.LBDTC
    _U:
      type: str
      derivation: LB.USUBJID
    _N:
      type: float
      derivation: LB.LBSTRESN
    _ORRES:
      type: str
      derivation: LB.LBORRES
    _ORRES_U:
      type: str
      derivation:
        str_case:
          source: _ORRES
          to: upper
    _NUMTXT:
      type: str
      derivation:
        str_extract:
          source: _ORRES
          pattern: \d+(\.\d+)?
          group: 0
          no_match: null
    _NUM:
      type: float
      derivation: _NUMTXT
    _ADJ:
      type: float
      derivation:
        case:
        - when: str_contains(_ORRES, '<')
          then: _NUM - 0.01
        - otherwise: _NUM
    _V:
      type: float
      derivation:
        case:
        - when: _N IS NOT NULL
          then: _N * 1000
