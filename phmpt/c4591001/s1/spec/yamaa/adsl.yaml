# A band of the 12-15 BMI scale runs from its age in months (B) to the next
# band's age within the same sex, the last band without end.
- id: BMI_SM
  dataset: BMI_SCALE
  key: none
  filter: BMI_SCALE.A = 'Male'
  order_by:
  - BMI_SCALE.B
  keep: first
  derivations:
    _LO:
      type: float
      derivation: BMI_SCALE.B
    _NEXT_B:
      type: float
      derivation:
        row_value:
          source: BMI_SCALE.B
          offset: 1
          window:
            group_by:
            - BMI_SCALE.A
            order_by:
            - BMI_SCALE.B
    _HI:
      type: float
      derivation:
        case:
        - when: _NEXT_B IS NULL
          then: 9999
        - otherwise: _NEXT_B
    _C:
      type: float
      derivation: BMI_SCALE.C
  between:
    value: OBESE_I._MONTHS
    lower: _LO
    upper: _HI
- id: BMI_SF
  dataset: BMI_SCALE
  key: none
  filter: BMI_SCALE.A = 'Female'
  order_by:
  - BMI_SCALE.B
  keep: first
  derivations:
    _LO:
      type: float
      derivation: BMI_SCALE.B
    _NEXT_B:
      type: float
      derivation:
        row_value:
          source: BMI_SCALE.B
          offset: 1
          window:
            group_by:
            - BMI_SCALE.A
            order_by:
            - BMI_SCALE.B
    _HI:
      type: float
      derivation:
        case:
        - when: _NEXT_B IS NULL
          then: 9999
        - otherwise: _NEXT_B
    _C:
      type: float
      derivation: BMI_SCALE.C
  between:
    value: OBESE_I._MONTHS
    lower: _LO
    upper: _HI
