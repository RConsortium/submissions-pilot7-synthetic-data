# The infection-evidence events of adsl.sas (sym_n, pos_s, pos_s_c), from
# helper/adsl_ev1.yaml; a subject with one from Dose 1 to the visit 3 date
# is not EV1MD2FL.
- id: EV1_EXCL
  dataset: EV1X
  key:
  - USUBJID
  filter: EV1X.EVSYMDT IS NOT NULL OR EV1X.EVPOSDT IS NOT NULL OR EV1X.EVPOSCDT IS NOT NULL
  order_by:
  - EV1X._INWIN
  - EV1X.SEQ
  keep: last
  derivations:
    _V1DT:
      type: date
      derivation: EV1_VAX1._V1DT
    _V3DT:
      type: date
      derivation: VIS3_I._V3DT
    _INWIN:
      type: int
      derivation:
        case:
        - when: (EV1X.EVSYMDT >= _V1DT AND EV1X.EVSYMDT <= _V3DT) OR (EV1X.EVPOSDT >= _V1DT AND
            EV1X.EVPOSDT <= _V3DT) OR (EV1X.EVPOSCDT >= _V1DT AND EV1X.EVPOSCDT <= _V3DT)
          then: 1
        - otherwise: 0
- id: EV1_POSN
  dataset: IS
  key:
  - USUBJID
  filter: IS.ISTESTCD = 'C19NIG' AND IS.ISORRES = 'POS' AND IS.VISIT <> 'V1_DAY1_VAX1_L'
  order_by:
  - IS._INWIN
  - IS._DT
  keep: last
  derivations:
    _DT:
      type: date
      derivation:
        to_date:
          source: IS.ISDTC
    _V1DT:
      type: date
      derivation: EV1_VAX1._V1DT
    _V3DT:
      type: date
      derivation: VIS3_I._V3DT
    _INWIN:
      type: int
      derivation:
        case:
        - when: _V1DT IS NOT NULL AND _V3DT IS NOT NULL AND _DT > _V1DT AND _DT <= _V3DT
          then: 1
        - otherwise: 0
