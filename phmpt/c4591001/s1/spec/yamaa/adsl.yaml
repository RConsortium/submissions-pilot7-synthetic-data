yamaa: '1.0'
type: spec
model: ADaM
parent: ../../../spec/yamaa/base/adam-base.yaml
domain: ADSL
keys:
- STUDYID
- USUBJID
input:
  DM: <sdtm-dir>/dm.parquet
  SUPPDM: <sdtm-dir>/suppdm.parquet
  DS: <sdtm-dir>/ds.parquet
  SUPPDS: <sdtm-dir>/suppds.parquet
  EX: <sdtm-dir>/ex.parquet
  IS: <sdtm-dir>/is.parquet
  CO: <sdtm-dir>/co.parquet
  LB: <sdtm-dir>/lb.parquet
  CM: <sdtm-dir>/cm.parquet
  IE: <sdtm-dir>/ie.parquet
  DV: <sdtm-dir>/dv.parquet
  SUPPDV: <sdtm-dir>/suppdv.parquet
  VS: <sdtm-dir>/vs.parquet
  SV: <sdtm-dir>/sv.parquet
  MB: <sdtm-dir>/mb.parquet
  MH: <sdtm-dir>/mh.parquet
  PR: <sdtm-dir>/pr.parquet
  PHASE1_LIST: <list-dir>/PHASE1_LIST.parquet
  DS360_LIST: <list-dir>/DS360_LIST.parquet
  DS6000_LIST: <list-dir>/DS6000_LIST.parquet
  IMMUNO1225_LIST: <list-dir>/IMMUNO1225_LIST.parquet
  HIV_TERMS: <list-dir>/HIV_TERMS.parquet
  BMI_SCALE: <list-dir>/BMI_SCALE.parquet
  CCI_REPORTS: <list-dir>/CCI_REPORTS.parquet
  EV1X:
    path: <work-dir>/adsl_ev1.parquet
    schema: helper/adsl_ev1.yaml
submission:
  label: Subject-Level Analysis Dataset
  class: SUBJECT LEVEL ANALYSIS DATASET
  structure: One record per subject
  repeating: false
rows:
- id: subjects
  dataset: DM
intermediates:
- id: SUPPDM_P
  dataset: SUPPDM
  key:
  - USUBJID
  filter: SUPPDM.QNAM IN ('CDECASE', 'REACTOFL', 'RACE1', 'RACIALD') AND (SUPPDM.IDVAR IS NULL OR SUPPDM.IDVAR
    = '')
  pivot:
    name: QNAM
    value: QVAL
    fields:
    - CDECASE
    - REACTOFL
    - RACE1
    - RACIALD
- id: SUPPDS_BYSEQ
  dataset: SUPPDS
  key:
  - USUBJID
  - DSSEQ
  filter: SUPPDS.QNAM IN ('DSPHASE', 'DSRANGRP')
  pivot:
    name: QNAM
    value: QVAL
    fields:
    - DSPHASE
    - DSRANGRP
  derivations:
    DSSEQ:
      type: int
      derivation: SUPPDS.IDVARVAL
- id: SUPPDS_SUBJ
  dataset: SUPPDS
  key:
  - USUBJID
  filter: SUPPDS.QNAM = 'DSRANGRP'
  pivot:
    name: QNAM
    value: QVAL
    fields:
    - DSRANGRP
- id: DS_RAND
  dataset: DS
  key:
  - USUBJID
  filter: DS.DSDECOD = 'RANDOMIZED' AND DS.DSSTDTC IS NOT NULL AND DS.DSREFID IS NOT NULL
  order_by:
  - DS._DT
  keep: first
  derivations:
    _DT:
      type: date
      derivation:
        to_date:
          source: DS.DSSTDTC
    _RANDNO:
      type: str
      derivation: DS.DSREFID
- id: DS_ENRL
  dataset: DS
  key:
  - USUBJID
  filter: str_contains(DS.DSDECOD, 'OBTAINED') AND DS.DSSTDTC IS NOT NULL
  order_by:
  - DS._DT
  keep: first
  derivations:
    _DT:
      type: date
      derivation:
        to_date:
          source: DS.DSSTDTC
- id: DS_EOS
  dataset: DS
  key:
  - USUBJID
  filter: DS.DSCAT = 'DISPOSITION EVENT' AND DS.DSDECOD <> 'COMPLETED'
  order_by:
  - DS._DT_FU
  keep: last
  derivations:
    _DSPHASE:
      type: str
      derivation: SUPPDS_BYSEQ.DSPHASE
    _DT:
      type: date
      derivation:
        to_date:
          source: DS.DSSTDTC
    _DDT:
      type: date
      derivation:
        to_date:
          source: DS.DSDTC
    _DT_FU:
      type: date
      derivation:
        case:
        - when: _DSPHASE = 'FOLLOW-UP'
          then: _DT
- id: DS_EOT
  dataset: DS
  key:
  - USUBJID
  filter: DS.DSCAT = 'DISPOSITION EVENT' AND DS.DSDECOD <> 'COMPLETED'
  order_by:
  - DS._DT_VAC
  keep: last
  derivations:
    _DSPHASE:
      type: str
      derivation: SUPPDS_BYSEQ.DSPHASE
    _DT:
      type: date
      derivation:
        to_date:
          source: DS.DSSTDTC
    _DDT:
      type: date
      derivation:
        to_date:
          source: DS.DSDTC
    _DT_VAC:
      type: date
      derivation:
        case:
        - when: _DSPHASE = 'VACCINATION'
          then: _DT
- id: EX_PRD2
  dataset: EX
  key:
  - USUBJID
  filter: (str_contains(EX.VISIT, '_VAX3') OR str_contains(EX.VISIT, '_VAX4')) AND EX.EXSTDTC IS NOT NULL
  order_by:
  - EX._EXSTDT
  keep: first
  derivations:
    _EXSTDT:
      type: date
      derivation:
        to_date:
          source: EX.EXSTDTC
- id: EX_ACT
  dataset: EX
  key:
  - USUBJID
  order_by:
  - EX._PERIODN
  - EX._EXTRT_S
  keep: first
  derivations:
    _PRD2DT:
      type: date
      derivation: EX_PRD2._EXSTDT
    _EXSTDT:
      type: date
      derivation:
        to_date:
          source: EX.EXSTDTC
    _PERIODN:
      type: int
      derivation:
        case:
        - when: _PRD2DT IS NULL
          then: 1
        - when: _EXSTDT < _PRD2DT
          then: 1
        - otherwise: 2
    _EXTRT_S:
      type: str
      derivation:
        case:
        - when: EX.EXTRT IS NULL
          then: "'ZZZZZZ'"
        - otherwise: EX.EXTRT
    _EXTRT:
      type: str
      derivation: EX.EXTRT
- id: DM_TM
  dataset: DM
  key:
  - USUBJID
  derivations:
    _RFSTDTM:
      type: datetime
      derivation:
        case:
        - when: str_contains(DM.RFSTDTC, 'T')
          then:
            impute:
              type: datetime
              source: DM.RFSTDTC
              time: first
    _RFENDTM:
      type: datetime
      derivation:
        case:
        - when: str_contains(DM.RFENDTC, 'T')
          then:
            impute:
              type: datetime
              source: DM.RFENDTC
              time: first
- id: EX_FIRST
  dataset: EX
  key:
  - USUBJID
  order_by:
  - EX._EXSTDT
  - EX._EXSTTM
  keep: first
  derivations:
    _EXSTDT:
      type: date
      derivation:
        to_date:
          source: EX.EXSTDTC
    _EXDTM_T:
      type: datetime
      derivation:
        case:
        - when: str_contains(EX.EXSTDTC, 'T')
          then:
            impute:
              type: datetime
              source: EX.EXSTDTC
              time: first
    _EXSTTM:
      type: time
      derivation:
        to_time:
          source: _EXDTM_T
    _EXDTM:
      type: datetime
      derivation:
        impute:
          type: datetime
          source: EX.EXSTDTC
          time: first
- id: EX_LAST
  dataset: EX
  key:
  - USUBJID
  order_by:
  - EX._EXENDT
  - EX._EXENTM
  keep: last
  derivations:
    _EXENDT:
      type: date
      derivation:
        to_date:
          source: EX.EXENDTC
    _EXDTM_T:
      type: datetime
      derivation:
        case:
        - when: str_contains(EX.EXENDTC, 'T')
          then:
            impute:
              type: datetime
              source: EX.EXENDTC
              time: first
    _EXENTM:
      type: time
      derivation:
        to_time:
          source: _EXDTM_T
    _EXDTM:
      type: datetime
      derivation:
        impute:
          type: datetime
          source: EX.EXENDTC
          time: first
- id: DV_POP1
  dataset: SUPPDV
  key:
  - USUBJID
  filter: SUPPDV.QNAM = 'CAPE' AND str_contains(SUPPDV.QVAL, 'POP1')
  order_by:
  - SUPPDV.QVAL
  keep: first
  derivations:
    _QVAL:
      type: str
      derivation: SUPPDV.QVAL
- id: PHASE1_I
  dataset: PHASE1_LIST
  key:
  - SUBJID
  order_by:
  - PHASE1_LIST.SUBJID
  keep: first
  derivations:
    _SUBJID:
      type: str
      derivation: PHASE1_LIST.SUBJID
- id: DS360_I
  dataset: DS360_LIST
  key:
  - SUBJID
  order_by:
  - DS360_LIST.SUBJID
  keep: first
  derivations:
    _SUBJID:
      type: str
      derivation: DS360_LIST.SUBJID
- id: DS6000_I
  dataset: DS6000_LIST
  key:
  - SUBJID
  order_by:
  - DS6000_LIST.SUBJID
  keep: first
  derivations:
    _SUBJID:
      type: str
      derivation: DS6000_LIST.SUBJID
- id: COHORT_I
  dataset: DM
  key:
  - USUBJID
  derivations:
    _DSR:
      type: str
      derivation: SUPPDS_SUBJ.DSRANGRP
    _P3:
      type: str
      derivation:
        str_extract:
          source: _DSR
          pattern: ^(?:[^,]*,){2}\s*([^,]*)
          group: 1
          no_match: null
    _FIRSTWORD:
      type: str
      derivation:
        str_extract:
          source: _P3
          pattern: ^\s*(\S+)
          group: 1
          no_match: null
    _LVL:
      type: int
      derivation:
        mapping:
          source: _FIRSTWORD
          dict:
            TBD: 0
            Low: 1
            Low-Mid: 2
            Medium: 3
            Mid-High: 4
            High: 5
          unmapped: null
    _INSIDE:
      type: str
      derivation:
        str_extract:
          source: _P3
          pattern: \(([^)]*)\)
          group: 1
          no_match: null
    _TXT1:
      type: str
      derivation:
        str_replace:
          source: _INSIDE
          pattern: mcg
          replacement: ' (*ESC*){unicode 03BC}g'
    _TXT:
      type: str
      derivation:
        case:
        - when: _INSIDE IS NULL
          then: "''"
        - otherwise:
            str_replace:
              source: _TXT1
              pattern: '100'
              replacement: 100 (*ESC*){unicode 03BC}g/10
    _SRT1:
      type: int
      derivation:
        case:
        - when: str_contains(_DSR, 'Stage 1')
          then: 1
        - when: str_contains(_DSR, 'Stage 2')
          then: 2
    _SRT2:
      type: int
      derivation:
        case:
        - when: str_contains(_DSR, '21 Day')
          then: 1
        - when: str_contains(_DSR, '1-dose')
          then: 2
        - when: str_contains(_DSR, '60 Day')
          then: 3
    _SRT3:
      type: int
      derivation:
        case:
        - when: str_contains(_DSR, 'Age 18 to 55')
          then: 1
        - when: str_contains(_DSR, 'Age 65 to 85')
          then: 2
        - when: str_contains(_DSR, 'Age 56 to 85')
          then: 3
    _SRT4:
      type: int
      derivation:
        case:
        - when: str_contains(_DSR, 'BNT162a1')
          then: 1
        - when: str_contains(_DSR, 'BNT162b1')
          then: 2
        - when: str_contains(_DSR, 'BNT162b2')
          then: 3
        - when: str_contains(_DSR, 'BNT162c2')
          then: 4
    _SRT5:
      type: int
      derivation:
        case:
        - when: str_contains(_DSR, 'Low-')
          then: 2
        - when: str_contains(_DSR, 'Low')
          then: 1
        - when: str_contains(_DSR, '-High')
          then: 4
        - when: str_contains(_DSR, 'Medium')
          then: 3
        - when: str_contains(_DSR, 'High')
          then: 5
    _CN:
      type: float
      derivation:
        case:
        - when: _SRT1 = 1 AND _SRT2 = 1
          then: 1 + 0.1 + (_SRT3 - 1) * 0.2 + (_SRT4 - 1) * 0.03 + 0.01 + (_SRT5 - 1) * 0.005
        - when: _SRT1 = 1 AND _SRT2 > 1
          then: 1 + 0.5 + (_SRT3 - 1) * 0.2 + (_SRT2 - 2) * 0.1 + _SRT4 * 0.01
        - when: _SRT1 > 1
          then: _SRT1 + 0.1 + (_SRT3 - 1) / 2 * 0.3 + (_SRT2 - 1) * 0.1 + _SRT4 * 0.01 + _SRT5 * 0.001
- id: EX_VAX_DTM
  dataset: EX
  key:
  - USUBJID
  filter: EX.EXTPTREF IN ('VACCINATION 1', 'VACCINATION 2', 'VACCINATION 3', 'VACCINATION 4', 'UNPLANNED
    VACCINATION') AND EX.EXSTDTC IS NOT NULL
  order_by:
  - EX._EXSTDT
  keep: first
  pivot:
    name: _EXTN_TXT
    value: _DTM
    fields:
    - VAX101
    - VAX102
    - VAX10U
    - VAX201
    - VAX202
    - VAX20U
  derivations:
    _PRD2DT:
      type: date
      derivation: EX_PRD2._EXSTDT
    _EXSTDT:
      type: date
      derivation:
        to_date:
          source: EX.EXSTDTC
    _PERIODN:
      type: int
      derivation:
        case:
        - when: _PRD2DT IS NULL
          then: 1
        - when: _EXSTDT < _PRD2DT
          then: 1
        - otherwise: 2
    _EXTMP:
      type: int
      derivation:
        mapping:
          source: EX.EXTPTREF
          dict:
            VACCINATION 1: 1
            VACCINATION 3: 1
            VACCINATION 2: 2
            VACCINATION 4: 2
            UNPLANNED VACCINATION: 3
          unmapped: null
    _EXTN:
      type: int
      derivation: _PERIODN * 100 + _EXTMP
    _EXTN_TXT:
      type: str
      derivation:
        case:
        - when: _EXTN = 101
          then: "'VAX101'"
        - when: _EXTN = 102
          then: "'VAX102'"
        - when: _EXTN = 103
          then: "'VAX10U'"
        - when: _EXTN = 201
          then: "'VAX201'"
        - when: _EXTN = 202
          then: "'VAX202'"
        - when: _EXTN = 203
          then: "'VAX20U'"
        - otherwise: "''"
    _EXTRT:
      type: str
      derivation: EX.EXTRT
    _DTM:
      type: datetime
      derivation:
        impute:
          type: datetime
          source: EX.EXSTDTC
          time: first
- id: EX_VAX_TRT
  dataset: EX
  key:
