  filter: (str_contains(CO.VISIT, 'COVID') OR CO.VISIT = 'V101_VAX3' OR CO.VISIT = 'V201_SURVEIL_CONSENT')
    AND CO.RDOMAIN = 'IS' AND CO.COREF = 'Sample Collected' AND CO.COVAL = 'Y'
  order_by:
  - variable: CO._CHFLG
    direction: desc
  - variable: CO._CHABS
    direction: asc
    nulls: last
  keep: first
  derivations:
    _CODT:
      type: date
      derivation:
        to_date:
          source: CO.CODTC
    _V102DT:
