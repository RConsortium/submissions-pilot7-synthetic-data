      type: date
      derivation:
        case:
        - when: DS_EOS._DSPHASE = 'FOLLOW-UP'
          then:
            first_available:
              sources:
              - DS_EOS._DT
              - DS_EOS._DDT
    _TR02:
      type: date
      derivation:
        to_date:
          source: TR02_I._SDTM
    _TR02M1:
      type: date
      derivation:
        shift:
          type: date
          source: _TR02
          days: -1
    _UNB:
