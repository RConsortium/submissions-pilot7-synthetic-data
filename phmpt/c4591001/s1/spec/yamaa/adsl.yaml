          then:
            shift:
              type: date
              source: D_VAX101._DT
              days: 58
    _PRE:
      type: date
      derivation:
        first_available:
          sources:
          - _B1
          - _B2
          - _B3
          - _B4
          - _B5
    _CAP:
      type: date
      derivation:
        shift:
          type: date
          source: D_UNBLND._DT
          days: -1
    _V:
      type: date
      derivation:
        case:
        - when: (D_UNBLND._DT IS NOT NULL AND _PRE IS NOT NULL AND _PRE > _CAP)
