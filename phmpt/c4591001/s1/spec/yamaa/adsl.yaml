- id: DOS_SPLIT
  dataset: DM
  key:
  - USUBJID
  derivations:
    _TXT:
      type: str
      derivation: COHORT_I._TXT
    _DSR:
      type: str
      derivation: COHORT_I._DSR
    _PH1:
      type: int
      derivation:
        case:
        - when: PHASE1_I._SUBJID IS NOT NULL
          then: 1
        - otherwise: 0
    _DOSALVL:
      type: str
      derivation:
        case:
        - when: _PH1 = 1 AND EX_ACT.USUBJID IS NOT NULL AND DM.ARMCD = 'PLACEBO' AND _DSR IS NOT NULL
            AND _DSR <> ''
          then: "'Placebo'"
        - when: _PH1 = 1 AND EX_ACT.USUBJID IS NOT NULL AND _DSR IS NOT NULL AND _DSR <> ''
          then: _TXT
        - otherwise: "''"
    _P1:
      type: str
      derivation:
        str_extract:
          source: _DOSALVL
          pattern: ^([^/]*)
          group: 1
          no_match: null
    _P2:
      type: str
      derivation:
        str_extract:
          source: _DOSALVL
          pattern: /(.*)$
          group: 1
          no_match: null
    _P1N:
      type: str
      derivation:
        str_extract:
          source: _P1
          pattern: ^(\S+)
          group: 1
          no_match: null
    _P2N:
      type: str
      derivation:
        str_extract:
          source: _P2
          pattern: ^(\S+)
          group: 1
          no_match: null
    _DOS_MCG:
      type: str
      derivation:
        str_replace:
          source: _DOSALVL
          pattern: \(\*ESC\*\)\{unicode 03BC\}g
          replacement: mcg
- id: TR01_I
  dataset: DM
  key:
  - USUBJID
  derivations:
    _EDTM:
      type: datetime
      derivation:
        greatest:
          sources:
          - EX_VAX_DTM.VAX101
          - EX_VAX_DTM.VAX102
          - EX_VAX_DTM.VAX10U
- id: TR02_I
  dataset: DM
  key:
  - USUBJID
  derivations:
    _SDTM:
      type: datetime
      derivation: EX_VAX_DTM.VAX201
    _EDTM:
      type: datetime
      derivation:
        greatest:
          sources:
          - EX_VAX_DTM.VAX201
          - EX_VAX_DTM.VAX202
          - EX_VAX_DTM.VAX20U
- id: MID_BDATE
  dataset: DM
  key:
  - USUBJID
  derivations:
    _RFICDT:
      type: date
      derivation:
        to_date:
          source: DM.RFICDTC
    _VAX101DT:
      type: date
      derivation:
        to_date:
          source: EX_VAX_DTM.VAX101
    _VAX201DT:
      type: date
      derivation:
        to_date:
          source: EX_VAX_DTM.VAX201
    _AGE:
      type: float
      derivation: DM.AGE
    _RFIC_YR:
      type: int
      derivation:
        case:
        - when: _RFICDT IS NOT NULL AND _RFICDT < DATE '2021-01-01'
          then: 2020
        - when: _RFICDT IS NOT NULL
          then: 2021
    _G1:
      type: int
      derivation:
        diff:
          type: date
          start: _RFICDT
          end: _VAX101DT
          unit: day
    _N:
      type: int
      derivation: 365 - _G1
    _OFF:
      type: int
      derivation:
        case:
        - when: MOD(_N, 2) = 0
          then: FLOOR(_N / 2)
        - when: MOD(_N, 4) = 1
          then: FLOOR((_N - 1) / 2)
        - otherwise: FLOOR((_N + 1) / 2)
    _BMID:
      type: date
      derivation:
        shift:
          type: date
          source: _VAX101DT
          days: _OFF
    _BMID_YR:
      type: int
      derivation:
        case:
        - when: _BMID IS NOT NULL AND _BMID < DATE '2021-01-01'
          then: 2020
        - when: _BMID IS NOT NULL
          then: 2021
    _M3:
      type: int
      derivation: '3'
    _D1:
      type: int
      derivation: '1'
    _MAR1_BMIDYR:
      type: date
      derivation:
        dtc:
          year: _BMID_YR
          month: _M3
          day: _D1
    _BYR:
      type: int
      derivation:
        case:
        - when: (_BMID IS NOT NULL AND _BMID_YR <= _RFIC_YR AND _BMID > _RFICDT)
          then: FLOOR(_RFIC_YR - _AGE - 1)
        - when: _BMID IS NOT NULL
          then: FLOOR(_RFIC_YR - _AGE)
    _LEAP_BYR:
      type: int
      derivation:
        case:
        - when: MOD(_BYR, 4) = 0 AND (MOD(_BYR, 100) <> 0 OR MOD(_BYR, 400) = 0)
          then: 1
        - otherwise: 0
    _LEAP_BMIDYR:
      type: int
      derivation:
        case:
        - when: MOD(_BMID_YR, 4) = 0 AND (MOD(_BMID_YR, 100) <> 0 OR MOD(_BMID_YR, 400) = 0)
          then: 1
        - otherwise: 0
    _MAR1_BYR:
      type: date
      derivation:
        dtc:
          year: _BYR
          month: _M3
          day: _D1
    _D:
      type: int
      derivation:
        case:
        - when: _BMID >= _MAR1_BMIDYR
          then: FLOOR((_BMID_YR - _BYR) * 365 + (FLOOR((_BMID_YR - 1) / 4) - FLOOR((_BMID_YR - 1) / 100)
            + FLOOR((_BMID_YR - 1) / 400)) - (FLOOR((_BYR - 1) / 4) - FLOOR((_BYR - 1) / 100) + FLOOR((_BYR
            - 1) / 400)) + _LEAP_BMIDYR - _LEAP_BYR)
        - otherwise: FLOOR((_BMID_YR - _BYR) * 365 + (FLOOR((_BMID_YR - 1) / 4) - FLOOR((_BMID_YR - 1)
            / 100) + FLOOR((_BMID_YR - 1) / 400)) - (FLOOR((_BYR - 1) / 4) - FLOOR((_BYR - 1) / 100) +
            FLOOR((_BYR - 1) / 400)))
    _DP1:
      type: int
      derivation: _D + 1
    _DNEG:
      type: int
      derivation: 0 - _D
    _DP1NEG:
      type: int
      derivation: 0 - _DP1
    _BDATE:
      type: date
      derivation:
        case:
        - when: _BMID = DATE '2020-02-29' AND _LEAP_BYR = 0
          then:
            shift:
              type: date
              source: _BMID
              days: _DP1NEG
        - otherwise:
            shift:
              type: date
              source: _BMID
              days: _DNEG
    _V201_YR:
      type: int
      derivation:
        case:
        - when: _VAX201DT IS NOT NULL AND _VAX201DT < DATE '2021-01-01'
          then: 2020
        - when: _VAX201DT IS NOT NULL
          then: 2021
    _LEAP_V201YR:
      type: int
      derivation:
        case:
        - when: MOD(_V201_YR, 4) = 0 AND (MOD(_V201_YR, 100) <> 0 OR MOD(_V201_YR, 400) = 0)
          then: 1
        - otherwise: 0
    _DAYS03:
      type: int
      derivation:
        diff:
          type: date
          start: _BDATE
          end: _VAX201DT
          unit: day
    _D_FWD:
      type: int
      derivation:
        case:
        - when: _BDATE >= _MAR1_BYR
          then: FLOOR((_V201_YR - _BYR) * 365 + (FLOOR((_V201_YR - 1) / 4) - FLOOR((_V201_YR - 1) / 100)
            + FLOOR((_V201_YR - 1) / 400)) - (FLOOR((_BYR - 1) / 4) - FLOOR((_BYR - 1) / 100) + FLOOR((_BYR
            - 1) / 400)) + _LEAP_V201YR - _LEAP_BYR)
        - otherwise: FLOOR((_V201_YR - _BYR) * 365 + (FLOOR((_V201_YR - 1) / 4) - FLOOR((_V201_YR - 1)
            / 100) + FLOOR((_V201_YR - 1) / 400)) - (FLOOR((_BYR - 1) / 4) - FLOOR((_BYR - 1) / 100) +
            FLOOR((_BYR - 1) / 400)))
    _BDATE_FWD:
      type: date
      derivation:
        shift:
          type: date
          source: _BDATE
          days: _D_FWD
    _AGETR03:
      type: int
      derivation:
        case:
        - when: _BDATE_FWD = _VAX201DT
          then: _V201_YR - _BYR
        - when: _VAX201DT IS NOT NULL
          then: FLOOR(_DAYS03 / 365.25)
