- id: DTH_I
  dataset: DM
  key:
  - USUBJID
  derivations:
    _DTC:
      type: str
      derivation: DM.DTHDTC
    _YR:
      type: str
      derivation:
        str_substr:
          source: _DTC
          start: 1
          length: 4
    _MO:
      type: str
      derivation:
        str_substr:
          source: _DTC
          start: 6
          length: 2
    _DY:
      type: str
      derivation:
        str_substr:
          source: _DTC
          start: 9
          length: 2
    _FLAG:
      type: str
      derivation:
        case:
        - when: _DTC IS NULL OR _DTC = ''
          then: "''"
        - when: _MO IS NULL OR _MO = ''
          then: "'M'"
        - when: _DY IS NULL OR _DY = ''
          then: "'D'"
        - otherwise: "''"
    _MO2:
      type: str
      derivation:
        case:
        - when: _MO IS NULL OR _MO = ''
          then: "'01'"
        - otherwise: _MO
    _DY2:
      type: str
      derivation:
        case:
        - when: _DY IS NULL OR _DY = ''
          then: "'01'"
        - otherwise: _DY
    _YRI:
      type: int
      derivation: _YR
    _MOI:
      type: int
      derivation: _MO2
    _DYI:
      type: int
      derivation: _DY2
    _TXT:
      type: str
      derivation:
        dtc:
          year: _YRI
          month: _MOI
          day: _DYI
    _DTH:
      type: date
      derivation:
        to_date:
          source: _TXT
    _SRV:
      type: date
      derivation: SRV_I._SRV
    _DTH2:
      type: date
      derivation:
        case:
        - when: (_FLAG <> '' AND _DTH <= _SRV) OR (DM.DTHFL = 'Y' AND _DTH IS NULL)
          then:
            shift:
              type: date
              source: _SRV
              days: 1
        - otherwise: _DTH
