          time: first
    _EXDOSE:
      type: float
      derivation: EX.EXDOSE
    _DOSE_TXT:
      type: str
      derivation:
        case:
        - when: _EXDOSE = FLOOR(_EXDOSE)
          then:
            str_decimal:
              source: _EXDOSE
              decimals: 0
        - otherwise:
            str_decimal:
              source: _EXDOSE
