        - when: _EXTN = 102
          then: "'VAX102'"
        - when: _EXTN = 103
          then: "'VAX10U'"
        - when: _EXTN = 201
          then: "'VAX201'"
        - when: _EXTN = 202
          then: "'VAX202'"
        - when: _EXTN = 203
          then: "'VAX20U'"
        - otherwise: "''"
    _EXTRT:
      type: str
      derivation: EX.EXTRT
    _DTM:
      type: datetime
      derivation:
        impute:
          type: datetime
          source: EX.EXSTDTC
          time: first
- id: EX_VAX_DOSE
