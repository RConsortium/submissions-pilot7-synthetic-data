        - when: (_ISC.ADTM IS NOT NULL) AND (_APX_TR01EDTM IS NOT NULL) AND (_ISC.ADTM > _APX_TR01EDTM)
          then: 2
    APERIODC:
      type: str
      derivation:
        case:
        - when: APERIOD = 1
          then: '''Period 01'''
        - when: APERIOD = 2
          then: '''Period 02'''
    TRTP:
      type: str
      derivation:
        case:
        - when: APERIOD = 1
          then: _TRT01P
        - when: APERIOD = 2
          then: _TRT02P
    TRTA:
      type: str
      derivation:
        case:
        - when: APERIOD = 1
          then: _TRT01A
        - when: APERIOD = 2
          then: _TRT02A
    TRTPN:
      type: int
      derivation:
        case:
        - when: APERIOD = 1
          then: _TRT01PN
        - when: APERIOD = 2
          then: _TRT02PN
    TRTAN:
      type: int
      derivation:
        case:
        - when: APERIOD = 1
          then: _TRT01AN
        - when: APERIOD = 2
          then: _TRT02AN
    APERSDTM:
      type: datetime
      derivation:
        case:
        - when: APERIOD = 1
          then: _APX_TR01SDTM
        - when: APERIOD = 2
          then: _APX_TR02SDTM
    APEREDTM:
      type: datetime
      derivation:
        case:
        - when: APERIOD = 1
          then: _APX_TR01EDTM
        - when: APERIOD = 2
          then: _APX_TR02EDTM
    _AVISITN_RAW:
      type: float
      derivation:
        case:
        - when: (_COHORTN = 1.16) AND (_ISC.VISITNUM = 60752)
          then: 3.1
        - when: (_COHORTN = 1.16) AND (_ISC.VISITNUM = 60753)
          then: 3.2
        - when: (_COHORTN = 1.16) AND (_ISC.VISITNUM = 60754)
          then: 3.3
        - when: (_COHORTN = 1.16) AND (_ISC.VISITNUM = 1165454)
          then: 3.9
        - otherwise: _ISC._AVISITN_MAP
    _AVISIT_RAW:
      type: str
      derivation:
        case:
        - when: (_COHORTN = 1.16) AND (_ISC.VISITNUM = 60752)
          then: '''4 Weeks after Vaccination 1'''
        - when: (_COHORTN = 1.16) AND (_ISC.VISITNUM = 60753)
          then: '''5 Weeks after Vaccination 1'''
        - when: (_COHORTN = 1.16) AND (_ISC.VISITNUM = 60754)
          then: '''1 Month and 3 weeks after Vaccination 1'''
        - when: (_COHORTN = 1.16) AND (_ISC.VISITNUM = 1165454)
          then: '''Before Vaccination 2'''
        - otherwise: _ISC._AVISIT_MAP
    _BASEINFO:
      type: str
      derivation:
        case:
        - when: (_ISC.VISITNUM = 60748 OR _ISC.VISITNUM = 60765)
          then: '''PRE'''
        - when: _AVISITN_RAW IS NOT NULL
          then: '''POST'''
    _PARAMCD:
      type: str
      derivation: _ISC.PARAMCD
    _PICK_RN:
      type: int
      derivation:
        row_number:
          window:
            group_by:
            - _ISC.USUBJID
            - _PARAMCD
            - APERIOD
            - _AVISITN_RAW
            order_by:
            - variable: _ISC.ADTM
              direction: desc
            - variable: _ISC._ISUSE
              direction: desc
            filter: _AVISITN_RAW IS NOT NULL AND _BASEINFO <> 'PRE'
    _PICK:
      type: int
      derivation:
        case:
        - when: _PICK_RN = 1
          then: 1
        - otherwise: 0
    _BASE_RAW:
      type: float
      derivation: _BASE_REC._AVAL
    _BASEC_RAW:
      type: str
      derivation: _BASE_REC._AVALC
    _BASEDT:
      type: datetime
      derivation: _BASE_REC._ADTM
    _ABLFL:
      type: str
      derivation:
        case:
        - when: _BASE_REC._SRCSEQ = _ISC.ISSEQ
          then: '''Y'''
    _BASETYPE_RAW:
      type: str
      derivation:
        case:
        - when: _BASE_REC._AVALC IS NOT NULL
          then: '''Study'''
    _APSBLFL:
      type: str
      derivation:
        case:
        - when: ((_BASEDT IS NOT NULL AND _ISC.ADTM > _BASEDT) OR (_BASEDT IS NULL AND _TRTDT IS NOT NULL
            AND _ISC.ADTM > _TRTDT))
          then: '''Y'''
    _ANL01FL:
      type: str
      derivation:
        case:
        - when: _PICK = 1
          then: '''Y'''
        - when: (_ABLFL = 'Y') AND (_BASEINFO = 'PRE')
          then: '''Y'''
- id: _IS3
  dataset: _ISC
  key:
    USUBJID: _ISC.USUBJID
    ISSEQ: _ISC.ISSEQ
  derivations:
    _AVAL_IMPUTED:
      type: int
      derivation:
        case:
        - when: (_ISC.PARAMCD <> 'C19NIG') AND (((_ISC._AVAL_RAW < _ISC._ISLLOQ) AND (_ISC._AVAL_RAW IS
            NOT NULL)) OR (_ISC._AVALC_RAW = 'BLQ'))
          then: 1
        - otherwise: 0
    _AVAL:
      type: float
      derivation:
        case:
        - when: _AVAL_IMPUTED = 1
          then: _ISC._ISLLOQ * 0.5
        - when: (_ISC.PARAMCD = 'C19NIG') AND (_ISC._AVALC_RAW = 'NEG')
          then: 0
        - when: (_ISC.PARAMCD = 'C19NIG') AND (_ISC._AVALC_RAW = 'POS')
          then: 1
        - otherwise: _ISC._AVAL_RAW
    _BASE_IMPUTED:
      type: int
      derivation:
        case:
        - when: (_ISC.PARAMCD <> 'C19NIG') AND (((_IS2._BASE_RAW < _ISC._ISLLOQ) AND (_IS2._BASE_RAW IS
            NOT NULL)) OR (_IS2._BASEC_RAW = 'BLQ'))
          then: 1
        - otherwise: 0
    _BASE:
      type: float
      derivation:
        case:
        - when: _BASE_IMPUTED = 1
          then: _ISC._ISLLOQ * 0.5
        - when: (_ISC.PARAMCD = 'C19NIG') AND (_IS2._BASEC_RAW = 'NEG')
          then: 0
        - when: (_ISC.PARAMCD = 'C19NIG') AND (_IS2._BASEC_RAW = 'POS')
          then: 1
        - otherwise: _IS2._BASE_RAW
    _BASE4F:
      type: float
      derivation:
        case:
        - when: _BASE_IMPUTED = 1
          then: _ISC._ISLLOQ
        - when: (_ISC.PARAMCD = 'C19NIG') AND (_IS2._BASEC_RAW = 'NEG')
          then: 0
        - when: (_ISC.PARAMCD = 'C19NIG') AND (_IS2._BASEC_RAW = 'POS')
          then: 1
        - otherwise: _IS2._BASE_RAW
    _BSSEROC:
      type: str
      derivation:
        case:
        - when: (_ISC.PARAMCD <> 'C19NIG') AND (_BASE_IMPUTED = 1)
          then: '''< LLOQ'''
        - when: (_ISC.PARAMCD <> 'C19NIG') AND (_BASE IS NULL)
          then: '''Missing'''
        - when: (_ISC.PARAMCD <> 'C19NIG')
          then: '''>= LLOQ'''
    _BSSERON:
      type: int
      derivation:
        case:
        - when: (_ISC.PARAMCD <> 'C19NIG') AND (_BASE_IMPUTED = 1)
          then: 1
        - when: (_ISC.PARAMCD <> 'C19NIG') AND (_BASE IS NULL)
          then: 0
        - when: (_ISC.PARAMCD <> 'C19NIG')
          then: 2
    _BASETYPE:
      type: str
      derivation:
        case:
        - when: (_ISC.PARAMCD <> 'C19NIG') AND (_BASE IS NOT NULL)
          then: '''Study (LLOQIMP)'''
        - otherwise: _IS2._BASETYPE_RAW
    _DTYPE:
      type: str
      derivation:
        case:
        - when: (_ISC.PARAMCD <> 'C19NIG')
          then: '''LLOQIMP'''
    _R2BASE:
      type: float
      derivation:
        case:
        - when: (_ISC.PARAMCD <> 'C19NIG') AND (_BASE > 0) AND ((_IS2._ABLFL IS NULL) OR (_IS2._ABLFL
            <> 'Y'))
          then: _AVAL / _BASE
    _R2BASE4F:
      type: float
      derivation:
        case:
        - when: (_ISC.PARAMCD <> 'C19NIG') AND (_BASE4F > 0) AND ((_IS2._ABLFL IS NULL) OR (_IS2._ABLFL
            <> 'Y'))
          then: _AVAL / _BASE4F
    _FOLD4FL:
      type: str
      derivation:
        case:
        - when: (_R2BASE4F IS NOT NULL) AND (_R2BASE4F >= 4)
          then: '''Y'''
    _ANL03FL:
      type: str
      derivation:
        case:
        - when: (_ISC._AVALC_RAW IS NOT NULL) AND (_ISC._AVALC_RAW <> 'IND') AND (_ISC._AVALC_RAW <> 'QNS')
            AND (_ISC._AVALC_RAW <> 'INDETERMINATE')
          then: '''Y'''
    _ANL04FL:
      type: str
      derivation:
        case:
        - when: (_ISC._ISLLOQ IS NOT NULL) AND (_ISC._AVAL_RAW IS NOT NULL) AND (_ISC._AVAL_RAW >= _ISC._ISLLOQ)
          then: '''Y'''
    _AVALC_BEST_RAW:
      type: str
      derivation:
        case:
        - when: _AVAL < 1
          then:
            str_decimal:
              source: _AVAL
              decimals: 10
        - when: _AVAL < 10
          then:
            str_decimal:
              source: _AVAL
              decimals: 10
        - when: _AVAL < 100
          then:
            str_decimal:
              source: _AVAL
              decimals: 9
        - when: _AVAL < 1000
          then:
            str_decimal:
              source: _AVAL
              decimals: 8
        - when: _AVAL < 10000
          then:
            str_decimal:
              source: _AVAL
              decimals: 7
        - when: _AVAL < 100000
          then:
            str_decimal:
              source: _AVAL
              decimals: 6
        - otherwise:
            str_decimal:
              source: _AVAL
              decimals: 5
    _AVALC_BEST_T1:
      type: str
      derivation:
        str_extract:
          source: _AVALC_BEST_RAW
          pattern: ^(\d+\.\d*[1-9])0+$
          group: 1
          no_match: null
    _AVALC_BEST_T2:
      type: str
      derivation:
        str_extract:
          source: _AVALC_BEST_RAW
          pattern: ^(\d+)\.0+$
          group: 1
          no_match: null
    _AVALC_BEST:
      type: str
      derivation:
        case:
        - when: _AVALC_BEST_T1 IS NOT NULL
          then: _AVALC_BEST_T1
        - when: _AVALC_BEST_T2 IS NOT NULL
          then: _AVALC_BEST_T2
        - otherwise: _AVALC_BEST_RAW
    _BASEC_BEST_RAW:
      type: str
      derivation:
        case:
        - when: _BASE < 1
          then:
            str_decimal:
              source: _BASE
              decimals: 10
        - when: _BASE < 10
          then:
            str_decimal:
              source: _BASE
              decimals: 10
        - when: _BASE < 100
          then:
            str_decimal:
              source: _BASE
              decimals: 9
        - when: _BASE < 1000
          then:
            str_decimal:
              source: _BASE
              decimals: 8
        - when: _BASE < 10000
          then:
            str_decimal:
              source: _BASE
              decimals: 7
        - when: _BASE < 100000
          then:
            str_decimal:
              source: _BASE
              decimals: 6
        - otherwise:
            str_decimal:
              source: _BASE
              decimals: 5
    _BASEC_BEST_T1:
      type: str
      derivation:
        str_extract:
          source: _BASEC_BEST_RAW
          pattern: ^(\d+\.\d*[1-9])0+$
          group: 1
          no_match: null
    _BASEC_BEST_T2:
      type: str
      derivation:
        str_extract:
          source: _BASEC_BEST_RAW
          pattern: ^(\d+)\.0+$
          group: 1
          no_match: null
    _BASEC_BEST:
      type: str
      derivation:
        case:
        - when: _BASEC_BEST_T1 IS NOT NULL
          then: _BASEC_BEST_T1
        - when: _BASEC_BEST_T2 IS NOT NULL
          then: _BASEC_BEST_T2
        - otherwise: _BASEC_BEST_RAW
    _BASEC_RAW:
      type: str
      derivation: _IS2._BASEC_RAW
    _BASEC:
      type: str
      derivation:
        case:
        - when: _BASE_IMPUTED = 1
          then: _BASEC_BEST
        - otherwise: _IS2._BASEC_RAW
