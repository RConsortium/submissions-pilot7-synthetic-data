- id: _FIRST_NT50
  dataset: _ISC
  key:
    USUBJID: _ISC.USUBJID
  filter: _ISC.PARAMCD = 'C2NGNT50' AND _ISC._ISUSE = 'Y' AND _ISC._S1_AVAL IS NOT NULL
  order_by:
  - _ISC.ADT
  - _ISC.VISITNUM
  keep: first
  derivations:
    _NT50_AVAL:
      type: float
      derivation:
        case:
        - when: (((_ISC._AVAL_RAW < _ISC._ISLLOQ) AND (_ISC._AVAL_RAW IS NOT NULL)) OR (_ISC._AVALC_RAW
            = 'BLQ'))
          then: _ISC._ISLLOQ * 0.5
        - otherwise: _ISC._AVAL_RAW
    _S1_AVAL:
      type: float
      derivation: _R_S1._AVAL_IMP
    _RATIO_RAW:
      type: float
      derivation: _NT50_AVAL / _S1_AVAL
    _RATIO_AVAL:
      type: float
      derivation:
        round_half_away_from_zero:
          source: _RATIO_RAW
          digits: 4
    _HAS_ABL:
      type: int
      derivation:
        case:
        - when: (_ISC.VISITNUM = _V1CELL._CELL_VISITNUM) AND (_ISC.ADT = _V1CELL._ADT)
          then: 1
        - otherwise: 0
