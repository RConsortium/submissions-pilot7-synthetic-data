- id: _IS4
  dataset: _ISC
  key:
    USUBJID: _ISC.USUBJID
    ISSEQ: _ISC.ISSEQ
  derivations:
    _V3FLAG:
      type: int
      derivation:
        case:
        - when: _V3._X IS NOT NULL
          then: 1
        - otherwise: 0
    _COVID_DIFF:
      type: int
      derivation:
        diff:
          type: date
          start: _ADSL2._VAX102DT
          end: _ISC.ADT
          unit: day
    _AVISITN_V3:
      type: float
      derivation:
        case:
        - when: (_ISC._IS_COVID = 1) AND (_V3FLAG = 0) AND (_COVID_DIFF >= 28) AND (_COVID_DIFF <= 42)
          then: 6.0
        - when: _ISC._IS_COVID = 0
          then: _IS2._AVISITN_RAW
    _AVISIT_V3:
      type: str
      derivation:
        case:
        - when: (_ISC._IS_COVID = 1) AND (_V3FLAG = 0) AND (_COVID_DIFF >= 28) AND (_COVID_DIFF <= 42)
          then: '''1 Month after Vaccination 2'''
        - when: _ISC._IS_COVID = 0
          then: _IS2._AVISIT_RAW
    _ANL01FL_V3:
      type: str
      derivation:
        case:
        - when: (_ISC._IS_COVID = 1) AND (_V3FLAG = 0) AND (_COVID_DIFF >= 28) AND (_COVID_DIFF <= 42)
          then: '''Y'''
        - when: _ISC._IS_COVID = 0
          then: _IS2._ANL01FL
    _ANL01FL_C:
      type: str
      derivation:
        case:
        - when: (_ADSL2._COHORTN = 1.16) AND (_ISC.VISITNUM = 60752)
          then: '''Y'''
        - when: (_ADSL2._COHORTN = 1.16) AND (_ISC.VISITNUM = 60753)
          then: '''Y'''
        - when: (_ADSL2._COHORTN = 1.16) AND (_ISC.VISITNUM = 60754)
          then: '''Y'''
        - when: (_ADSL2._COHORTN = 1.16) AND (_ISC.VISITNUM = 1165454)
          then: '''Y'''
        - otherwise: _ANL01FL_V3
    _EVIMMFL:
      type: str
      derivation:
        case:
        - when: (_ADSL2._PHASEN = 1) AND (_AVISITN_V3 < 4) AND (_ADSL2._EVAL01FL = 'Y')
          then: '''Y'''
        - when: (_ADSL2._PHASEN = 1) AND (_AVISITN_V3 < 4)
          then: '''N'''
        - when: (_ADSL2._PHASEN = 1) AND (_AVISITN_V3 >= 4) AND (_ADSL2._EVAL02FL = 'Y')
          then: '''Y'''
        - when: (_ADSL2._PHASEN = 1) AND (_AVISITN_V3 >= 4)
          then: '''N'''
        - when: ((_ADSL2._PHASEN = 2) OR (_ADSL2._PHASEN = 3) OR (_ADSL2._PHASEN = 4)) AND (_ADSL2._EVAL02FL
            = 'Y')
          then: '''Y'''
        - when: ((_ADSL2._PHASEN = 2) OR (_ADSL2._PHASEN = 3) OR (_ADSL2._PHASEN = 4))
          then: '''N'''
    _AAIMMFL:
      type: str
      derivation:
        case:
        - when: (_ADSL2._PHASEN = 1) AND (_AVISITN_V3 < 4) AND (_ADSL2._AAI01FL = 'Y')
          then: '''Y'''
        - when: (_ADSL2._PHASEN = 1) AND (_AVISITN_V3 < 4)
          then: '''N'''
        - when: (_ADSL2._PHASEN = 1) AND (_AVISITN_V3 >= 4) AND (_ADSL2._AAI02FL = 'Y')
          then: '''Y'''
        - when: (_ADSL2._PHASEN = 1) AND (_AVISITN_V3 >= 4)
          then: '''N'''
        - when: ((_ADSL2._PHASEN = 2) OR (_ADSL2._PHASEN = 3) OR (_ADSL2._PHASEN = 4)) AND (_ADSL2._AAI02FL
            = 'Y')
          then: '''Y'''
        - when: ((_ADSL2._PHASEN = 2) OR (_ADSL2._PHASEN = 3) OR (_ADSL2._PHASEN = 4))
          then: '''N'''
    _ADY:
      type: int
      derivation:
        case:
        - when: (_ADSL2._VAX101DT IS NOT NULL) AND (_ADSL2._VAX102DT IS NOT NULL) AND (_ISC.ADT > _ADSL2._VAX102DT)
          then:
            study_day:
              source: _ISC.ADT
              reference: _ADSL2._VAX102DT
        - when: (_ADSL2._VAX101DT IS NOT NULL) AND (_ISC.ADT >= _ADSL2._VAX101DT)
          then:
            study_day:
              source: _ISC.ADT
              reference: _ADSL2._VAX101DT
        - when: _ADSL2._VAX101DT IS NOT NULL
          then: _ISC._ADY_RAW
    _ANL01FL:
      type: str
      derivation:
        case:
        - when: (_ISC.PARAMCD <> 'C19NIG') AND (_ISC._ISUSE <> 'N') AND (((_AVISITN_V3 IS NULL) OR (_AVISITN_V3
            < 4)) OR (_ADSL2._VAX201DT IS NULL) OR (_ISC.ADT <= _ADSL2._VAX201DT))
          then: _ANL01FL_C
    _AVISITN_F:
      type: float
      derivation:
        case:
        - when: (_ISC.PARAMCD <> 'C19NIG') AND (_ISC._ISUSE <> 'N')
          then: _AVISITN_V3
    _AVISIT_F:
      type: str
      derivation:
        case:
        - when: (_ISC.PARAMCD <> 'C19NIG') AND (_ISC._ISUSE <> 'N')
          then: _AVISIT_V3
    _ABLPBLFL:
      type: str
      derivation:
        case:
        - when: (_HAS_ABL._X IS NOT NULL) AND (_HAS_APS._X IS NOT NULL)
          then: '''Y'''
        - otherwise: '''N'''
    _AVISIT:
      type: str
      derivation:
        case:
        - when: _ANL01FL = 'Y'
          then: _AVISIT_F
    _AVISITN:
      type: float
      derivation:
        case:
        - when: _ANL01FL = 'Y'
          then: _AVISITN_F
    _AVISIT_PB:
      type: str
      derivation: _AVISIT_V3
    _AVISITN_PB:
      type: float
      derivation: _AVISITN_V3
