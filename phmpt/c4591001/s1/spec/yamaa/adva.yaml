yamaa: '1.0'
type: spec
model: ADaM
parent: ../../../spec/yamaa/base/adam-base.yaml
domain: ADVA
keys:
- STUDYID
- USUBJID
- _SEQ
input:
  IS: <sdtm-dir>/is.parquet
  ADSL:
    path: <adam-dir>/adsl.parquet
    key:
    - STUDYID
    - USUBJID
submission:
  label: Immunogenicity Analysis Dataset
  class: BASIC DATA STRUCTURE
  structure: One record per subject per parameter per visit
  repeating: true
rows:
- id: base
  dataset: _ISC
  derivations:
    ISDTC: _ISC._ISDTC_STR
    ADT: _ISC.ADT
    VISIT: _ISC.VISIT
    VISITNUM: _ISC.VISITNUM
    PARCAT1: _ISC.PARCAT1
    PARCAT1N: _ISC.PARCAT1N
    PARAM: _ISC.PARAM
    PARAMN: _ISC.PARAMN
    PARAMCD: _ISC.PARAMCD
    SRCDOM: _ISC.SRCDOM
    SRCVAR: _ISC.SRCVAR
    ISLLOQ: _ISC.ISLLOQ
    ISSTRESC: _ISC._AVALC_RAW
    ISTSTDTL: _ISC.ISTSTDTL
    TRTP: _IS2.TRTP
    TRTPN: _IS2.TRTPN
    TRTA: _IS2.TRTA
    TRTAN: _IS2.TRTAN
    APERIOD: _IS2.APERIOD
    APERIODC: _IS2.APERIODC
    APERSDTM: _IS2.APERSDTM
    APEREDTM: _IS2.APEREDTM
    ABLFL: _IS2._ABLFL
    APSBLFL: _IS2._APSBLFL
    AVAL: _IS3._AVAL
    BASE: _IS3._BASE
    BASETYPE: _IS3._BASETYPE
    DTYPE: _IS3._DTYPE
    R2BASE: _IS3._R2BASE
    ANL03FL: _IS3._ANL03FL
    ANL04FL: _IS3._ANL04FL
    BSSERON: _IS3._BSSERON
    BSSEROC: _IS3._BSSEROC
    BASE4F: _IS3._BASE4F
    R2BASE4F: _IS3._R2BASE4F
    FOLD4FL: _IS3._FOLD4FL
    _AVAL_IMPUTED: _IS3._AVAL_IMPUTED
    _BASE_IMPUTED: _IS3._BASE_IMPUTED
    _AVALC_BEST: _IS3._AVALC_BEST
    _BASEC_BEST: _IS3._BASEC_BEST
    _BASEC_RAW: _IS3._BASEC_RAW
    _AVALC_BEST_RAW: _IS3._AVALC_BEST_RAW
    _AVALC_BEST_T1: _IS3._AVALC_BEST_T1
    _AVALC_BEST_T2: _IS3._AVALC_BEST_T2
    _BASEC_BEST_RAW: _IS3._BASEC_BEST_RAW
    _BASEC_BEST_T1: _IS3._BASEC_BEST_T1
    _BASEC_BEST_T2: _IS3._BASEC_BEST_T2
    ADY: _IS4._ADY
    AVISIT: _IS4._AVISIT
    AVISITN: _IS4._AVISITN
    ANL01FL: _IS4._ANL01FL
    EVIMMFL: _IS4._EVIMMFL
    AAIMMFL: _IS4._AAIMMFL
    ABLPBLFL: _IS4._ABLPBLFL
    STUDYID: '''C4591001'''
    USUBJID: _ISC.USUBJID
    SRCSEQ: _ISC.ISSEQ
    _DERIVED: 0
    _RATIO_RAW:
      case:
      - when: _ISC.VISITNUM = -1
        then: 0
    _EMIT: 1
- id: ratio_nt50_s1
  dataset: _ISC
  group_by:
  - _ISC.USUBJID
  - _ISC.VISITNUM
  - _ISC.ADT
  filter: _EMIT = 1
  derivations:
    _DERIVED: 1
    STUDYID: '''C4591001'''
    USUBJID: _ISC.USUBJID
    VISITNUM: _ISC.VISITNUM
    ADT: _ISC.ADT
    TRTP: _SHELL4.TRTP
    TRTA: _SHELL4.TRTA
    TRTPN: _SHELL4.TRTPN
    TRTAN: _SHELL4.TRTAN
    APERIOD: _SHELL4.APERIOD
    APERIODC: _SHELL4.APERIODC
    APERSDTM: _SHELL4.APERSDTM
    APEREDTM: _SHELL4.APEREDTM
    VISIT: _SHELL4._SHELL_VISIT
    ISDTC: _SHELL4._SHELL_ISDTC
    ADY: _SHELL4._ADY
    AVISIT: _SHELL4._AVISIT_PB
    AVISITN: _SHELL4._AVISITN_PB
    EVIMMFL: _SHELL4._EVIMMFL
    AAIMMFL: _SHELL4._AAIMMFL
    PARAMCD: '''NT50_S1'''
    PARAM: '''SARS-CoV-2 serum neutralizing titer 50 to COVID-19 S1 IgG'''
    PARAMN: 11
    PARCAT1: '''SEROLOGY'''
    PARCAT1N: 1
    SRCVAR: ''''''
    SRCDOM: ''''''
    ISTSTDTL: ''''''
    ISSTRESC: ''''''
    ANL03FL: ''''''
    ANL04FL: ''''''
    FOLD4FL: ''''''
    BSSEROC: ''''''
    ISLLOQ:
      case:
      - when: _ISC.VISITNUM = -1
        then: 0
    SRCSEQ:
      case:
      - when: _ISC.VISITNUM = -1
        then: 0
    BSSERON:
      case:
      - when: _ISC.VISITNUM = -1
        then: 0
    R2BASE4F:
      case:
      - when: _ISC.VISITNUM = -1
        then: 0
    BASE4F:
      case:
      - when: _ISC.VISITNUM = -1
        then: 0
    _RATIO_RAW: _R_NT50._AVAL_IMP / _R_S1._AVAL_IMP
    AVAL:
      round_half_away_from_zero:
        source: _RATIO_RAW
        digits: 4
    _AVAL_IMPUTED: 0
    _BASE_IMPUTED: 0
    _AVALC_BEST_RAW:
      case:
      - when: AVAL < 1
        then:
          str_decimal:
            source: AVAL
            decimals: 10
      - when: AVAL < 10
        then:
          str_decimal:
            source: AVAL
            decimals: 10
      - when: AVAL < 100
        then:
          str_decimal:
            source: AVAL
            decimals: 9
      - when: AVAL < 1000
        then:
          str_decimal:
            source: AVAL
            decimals: 8
      - when: AVAL < 10000
        then:
          str_decimal:
            source: AVAL
            decimals: 7
      - when: AVAL < 100000
        then:
          str_decimal:
            source: AVAL
            decimals: 6
      - otherwise:
          str_decimal:
            source: AVAL
            decimals: 5
    _AVALC_BEST_T1:
      str_extract:
        source: _AVALC_BEST_RAW
        pattern: ^(\d+\.\d*[1-9])0+$
        group: 1
        no_match: null
    _AVALC_BEST_T2:
      str_extract:
        source: _AVALC_BEST_RAW
        pattern: ^(\d+)\.0+$
        group: 1
        no_match: null
    _AVALC_BEST:
      case:
      - when: _AVALC_BEST_T1 IS NOT NULL
        then: _AVALC_BEST_T1
      - when: _AVALC_BEST_T2 IS NOT NULL
        then: _AVALC_BEST_T2
      - otherwise: _AVALC_BEST_RAW
    BASE:
      case:
      - when: _FIRST_NT50._HAS_ABL = 1
        then: _FIRST_NT50._RATIO_AVAL
    _BASEC_RAW: ''''''
    _BASEC_BEST_RAW:
      case:
      - when: BASE < 1
        then:
          str_decimal:
            source: BASE
            decimals: 10
      - when: BASE < 10
        then:
          str_decimal:
            source: BASE
            decimals: 10
      - when: BASE < 100
        then:
          str_decimal:
            source: BASE
            decimals: 9
      - when: BASE < 1000
        then:
          str_decimal:
            source: BASE
            decimals: 8
      - when: BASE < 10000
        then:
          str_decimal:
            source: BASE
            decimals: 7
      - when: BASE < 100000
        then:
          str_decimal:
            source: BASE
            decimals: 6
      - otherwise:
          str_decimal:
            source: BASE
            decimals: 5
    _BASEC_BEST_T1:
      str_extract:
        source: _BASEC_BEST_RAW
        pattern: ^(\d+\.\d*[1-9])0+$
        group: 1
        no_match: null
    _BASEC_BEST_T2:
      str_extract:
        source: _BASEC_BEST_RAW
        pattern: ^(\d+)\.0+$
        group: 1
        no_match: null
    _BASEC_BEST:
      case:
      - when: _BASEC_BEST_T1 IS NOT NULL
        then: _BASEC_BEST_T1
      - when: _BASEC_BEST_T2 IS NOT NULL
        then: _BASEC_BEST_T2
      - otherwise: _BASEC_BEST_RAW
    BASETYPE:
      case:
      - when: BASE IS NOT NULL
        then: '''Study (Derived)'''
    R2BASE:
      case:
      - when: (BASE > 0) AND ((ABLFL IS NULL) OR (ABLFL <> 'Y'))
        then: AVAL / BASE
    DTYPE: '''Derived'''
    ABLFL: _SHELL4._ABLFL
    APSBLFL: _SHELL4._APSBLFL
    ABLPBLFL:
      case:
      - when: (_FIRST_NT50._HAS_ABL = 1) AND (_R_HAS_APS50._X IS NOT NULL)
        then: '''Y'''
      - otherwise: '''N'''
    ANL01FL: '''Y'''
    _EMIT:
      case:
      - when: _R_NT50._AVAL_IMP IS NOT NULL AND _R_S1._AVAL_IMP IS NOT NULL
        then: 1
      - otherwise: 0
