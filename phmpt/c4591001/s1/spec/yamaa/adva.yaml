intermediates:
- id: _RET
  dataset: IS
  filter: IS.ISTSTDTL = 'REPEAT TEST'
  key:
    USUBJID: USUBJID
    VISIT: VISIT
  order_by:
  - IS.ISSEQ
  keep: first
  derivations:
    _R:
      type: int
      derivation: 1
- id: _IS
  dataset: IS
  filter: IS.ISORRES <> 'NOT DONE'
  columns:
  - _USUBJID
  - _ISSEQ
  - _VISIT
  - _VISITNUM
  - _ISTSTDTL
  - _ISLLOQ
  - PARAMCD
  - _ISTEST
  - _ISMETHOD
  - _ISSTRESU
  - _AVAL_RAW
  - _AVALC_RAW
  - _ADY_RAW
  - _ISDTC
  - ADT
  - PARCAT1
  - SRCDOM
  - SRCVAR
  - _HAS_RETEST
  - _IS_RETEST
  - _ISUSE
  - _IS_COVID
  - _ATM_SEC
  - _ADT_MIDNIGHT
  - ADTM
  - PARAM
  - PARAMN
  - PARCAT1N
  - _AVISITN_MAP
  - _AVISIT_MAP
  derivations:
    _USUBJID:
      type: str
      derivation: IS.USUBJID
    _ISSEQ:
      type: int
      derivation: IS.ISSEQ
    _VISIT:
      type: str
      derivation: IS.VISIT
    _VISITNUM:
      type: int
      derivation: IS.VISITNUM
    _ISTSTDTL:
      type: str
      derivation: IS.ISTSTDTL
    _ISLLOQ:
      type: float
      derivation: IS.ISLLOQ
    PARAMCD:
      type: str
      derivation: IS.ISTESTCD
    _ISTEST:
      type: str
      derivation: IS.ISTEST
    _ISMETHOD:
      type: str
      derivation: IS.ISMETHOD
    _ISSTRESU:
      type: str
      derivation: IS.ISSTRESU
    _AVAL_RAW:
      type: float
      derivation: IS.ISSTRESN
    _AVALC_RAW:
      type: str
      derivation: IS.ISSTRESC
    _ADY_RAW:
      type: int
      derivation: IS.ISDY
    _ISDTC:
      type: date
      derivation:
        to_date:
          source: IS.ISDTC
    ADT:
      type: date
      derivation:
        to_date:
          source: IS.ISDTC
    PARCAT1:
      type: str
      derivation: IS.ISCAT
    SRCDOM:
      type: str
      derivation: IS.DOMAIN
    SRCVAR:
      type: str
      derivation: '''ISSTRESN'''
    _HAS_RETEST:
      type: int
      derivation:
        case:
        - when: _RET._R IS NOT NULL
          then: 1
        - otherwise: 0
    _IS_RETEST:
      type: int
      derivation:
        case:
        - when: IS.ISTSTDTL = 'REPEAT TEST'
          then: 1
        - otherwise: 0
    _ISUSE:
      type: str
      derivation:
        case:
        - when: _HAS_RETEST = _IS_RETEST
          then: '''Y'''
        - otherwise: '''N'''
    _IS_COVID:
      type: int
      derivation:
        case:
        - when: (IS.VISIT = 'COVID_A1' OR IS.VISIT = 'COVID_B1' OR IS.VISIT = 'V101_VAX3' OR IS.VISIT
            = 'V201_SURVEIL_CONSENT')
          then: 1
        - otherwise: 0
    _ATM_SEC:
      type: int
      derivation:
        case:
        - when: _IS_COVID = 1
          then: 86399
        - otherwise: 0
    _ADT_MIDNIGHT:
      type: datetime
      derivation:
        impute:
          type: datetime
          source: ADT
          time: first
    ADTM:
      type: datetime
      derivation:
        shift:
          type: datetime
          source: _ADT_MIDNIGHT
          amount: _ATM_SEC
          unit: second
    PARAM:
      type: str
      derivation:
        case:
        - when: (PARAMCD = 'C2NGNT50' OR PARAMCD = 'C2NGNT90') AND (_ISMETHOD IS NOT NULL)
          then:
            str_template: '{_ISTEST} (titer) - {_ISMETHOD}'
        - when: (PARAMCD = 'C2NGNT50' OR PARAMCD = 'C2NGNT90')
          then:
            str_template: '{_ISTEST} (titer)'
        - when: (PARAMCD = 'C19NIG') AND (_ISMETHOD IS NOT NULL)
          then:
            str_template: '{_ISTEST} - {_ISMETHOD}'
        - when: PARAMCD = 'C19NIG'
          then:
            str_template: '{_ISTEST}'
        - when: (_ISMETHOD IS NOT NULL)
          then:
            str_template: '{_ISTEST} ({_ISSTRESU}) - {_ISMETHOD}'
        - otherwise:
            str_template: '{_ISTEST} ({_ISSTRESU})'
    PARAMN:
      type: int
      derivation:
        mapping:
          source: PARAMCD
          dict:
            C2NGNT50: 1
            C2NGNT90: 2
            C19S1IGG: 3
            C19RBDIG: 4
            C19NIG: 5
          unmapped: null
    PARCAT1N:
      type: int
      derivation:
        case:
        - when: PARCAT1 = 'SEROLOGY'
          then: 1
    _AVISITN_MAP:
      type: float
      derivation:
        case:
        - when: _VISITNUM = 60748
          then: 1.0
        - when: _VISITNUM = 60765
          then: 1.0
        - when: _VISITNUM = 60750
          then: 2.0
        - when: _VISITNUM = 60751
          then: 3.0
        - when: _VISITNUM = 60752
          then: 4.0
        - when: _VISITNUM = 1165455
          then: 4.0
        - when: _VISITNUM = 60753
          then: 5.0
        - when: _VISITNUM = 1165456
          then: 5.0
        - when: _VISITNUM = 60754
          then: 6.0
        - when: _VISITNUM = 60767
          then: 6.0
        - when: _VISITNUM = 1165457
          then: 6.0
        - when: _VISITNUM = 60755
          then: 7.0
        - when: _VISITNUM = 60768
          then: 7.0
        - when: _VISITNUM = 60756
          then: 8.0
        - when: _VISITNUM = 60769
          then: 8.0
        - when: _VISITNUM = 60757
          then: 9.0
        - when: _VISITNUM = 60770
          then: 9.0
    _AVISIT_MAP:
      type: str
      derivation:
        case:
        - when: _VISITNUM = 60748
          then: '''Before Vaccination 1'''
        - when: _VISITNUM = 60765
          then: '''Before Vaccination 1'''
        - when: _VISITNUM = 60750
          then: '''1 Week after Vaccination 1'''
        - when: _VISITNUM = 60751
          then: '''3 Weeks after Vaccination 1'''
        - when: _VISITNUM = 60752
          then: '''1 Week after Vaccination 2'''
        - when: _VISITNUM = 1165455
          then: '''1 Week after Vaccination 2'''
        - when: _VISITNUM = 60753
          then: '''2 Weeks after Vaccination 2'''
        - when: _VISITNUM = 1165456
          then: '''2 Weeks after Vaccination 2'''
        - when: _VISITNUM = 60754
          then: '''1 Month after Vaccination 2'''
        - when: _VISITNUM = 60767
          then: '''1 Month after Vaccination 2'''
        - when: _VISITNUM = 1165457
          then: '''1 Month after Vaccination 2'''
        - when: _VISITNUM = 60755
          then: '''6 Months after Vaccination 2'''
        - when: _VISITNUM = 60768
          then: '''6 Months after Vaccination 2'''
        - when: _VISITNUM = 60756
          then: '''12 Months after Vaccination 2'''
        - when: _VISITNUM = 60769
          then: '''12 Months after Vaccination 2'''
        - when: _VISITNUM = 60757
          then: '''24 Months after Vaccination 2'''
        - when: _VISITNUM = 60770
          then: '''24 Months after Vaccination 2'''
- id: _ISC
  dataset: _IS
  repeat:
    count: 1
    index: _IDX
  derivations:
    _USUBJID:
      type: str
      derivation: _IS._USUBJID
    _ISSEQ:
      type: int
      derivation: _IS._ISSEQ
    _VISIT:
      type: str
      derivation: _IS._VISIT
    _VISITNUM:
      type: int
      derivation: _IS._VISITNUM
    _ISTSTDTL:
      type: str
      derivation: _IS._ISTSTDTL
    _ISLLOQ:
      type: float
      derivation: _IS._ISLLOQ
    PARAMCD:
      type: str
      derivation: _IS.PARAMCD
    _ISTEST:
      type: str
      derivation: _IS._ISTEST
    _ISMETHOD:
