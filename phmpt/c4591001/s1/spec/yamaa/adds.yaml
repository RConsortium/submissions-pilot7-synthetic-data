# ADDS for Pfizer/BioNTech C4591001, data cut S1 (125742).
# Parent: ../../../spec/yamaa/base/adam-base.yaml (section 3.1 core columns).
# Rows are DS disposition events; DSPHASE comes from SUPPDS;
# the M1/M6 visit dates from SV; all other subject columns are
# read from the submitted ADSL file (mapping input, key
# STUDYID/USUBJID; verify.py resolves it from --adam-dir).
# Derivations implement adds.sas (1mth, 07Mar2021) as translated
# and validated in tools/adds_proto.py (exact match, 0 mismatched
# cells, 123,135 rows x 108 cols).
# First generated by tools/gen_adds_spec.py (retired); this file is the source.
yamaa: '1.0'
type: spec
model: ADaM
parent: ../../../spec/yamaa/base/adam-base.yaml
domain: ADDS
keys:
- STUDYID
- USUBJID
- DSSEQ
input:
  DS: <sdtm-dir>/ds.parquet
  SUPPDS: <sdtm-dir>/suppds.parquet
  SV: <sdtm-dir>/sv.parquet
  ADSL:
    path: <adam-dir>/adsl.parquet
    key:
    - STUDYID
    - USUBJID
submission:
  label: Disposition Analysis Dataset
  class: OCCURRENCE DATA STRUCTURE
  structure: One record per disposition event
  repeating: true
rows:
- id: base
  dataset: DS
  filter: DS.DSCAT = 'DISPOSITION EVENT'
intermediates:
- id: ADSL_R
  dataset: ADSL
  key:
  - STUDYID
  - USUBJID
  derivations:
    _TRTSDT:
      type: date
      derivation: ADSL.TRTSDT
    _BLDV6DT:
      type: date
      derivation: ADSL.BLDV6DT
    _BLDV7DT:
      type: date
      derivation: ADSL.BLDV7DT
    _EOSDCDT:
      type: date
      derivation: ADSL.EOSDCDT
    _EOTDCDT:
      type: date
      derivation: ADSL.EOTDCDT
    _VAX101DT:
      type: date
      derivation: ADSL.VAX101DT
    _VAX102DT:
      type: date
      derivation: ADSL.VAX102DT
    _VAX10UDT:
      type: date
      derivation: ADSL.VAX10UDT
    _VAX201DT:
      type: date
      derivation: ADSL.VAX201DT
    _COHORTN:
      type: float
      derivation: ADSL.COHORTN
- id: _SUPPDS
  dataset: SUPPDS
  key:
    USUBJID: DS.USUBJID
    _DSSEQ: DS.DSSEQ
  filter: SUPPDS.QNAM = 'DSPHASE'
  derivations:
    _DSSEQ:
      type: int
      derivation: SUPPDS.IDVARVAL
    _DSPHASE:
      type: str
      derivation: SUPPDS.QVAL
- id: _SV_M1
  dataset: SV
  key:
    USUBJID: DS.USUBJID
  filter: SV.VISIT IN ('V3_MONTH1_POSTVAX2_L', 'V7_MONTH1_S')
  derivations:
    _DT:
      type: date
      derivation:
        to_date:
          source: SV.SVSTDTC
- id: _SV_M1R
  dataset: SV
  key:
    USUBJID: DS.USUBJID
  filter: SV.VISIT = 'V7_MONTH1_S_R'
  derivations:
    _DT:
      type: date
      derivation:
        to_date:
          source: SV.SVSTDTC
- id: _SV_M6
  dataset: SV
  key:
    USUBJID: DS.USUBJID
  filter: SV.VISIT IN ('V4_MONTH6_L', 'V8_MONTH6_S')
  derivations:
    _DT:
      type: date
      derivation:
        to_date:
          source: SV.SVSTDTC
- id: _SV_M1X
  dataset: SV
  key:
    USUBJID: DS.USUBJID
  filter: SV.VISIT = 'V103_MONTH1'
  derivations:
    _DT:
      type: date
      derivation:
        to_date:
          source: SV.SVSTDTC
- id: _DSX
  dataset: DS
  key:
  - USUBJID
  - DSSEQ
  filter: DS.DSCAT = 'DISPOSITION EVENT'
  derivations:
    _ADT:
      type: date
      derivation:
        impute:
          type: date
          source: DS.DSDTC
          month: 1
          day: first
    _ASTDT:
      type: date
      derivation:
        to_date:
          source: DS.DSSTDTC
    _ASTDY:
      type: int
      derivation:
        case:
        - when: _ASTDT IS NULL OR ADSL_R._TRTSDT IS NULL
          then: null
        - otherwise:
            study_day:
              source: _ASTDT
              reference: ADSL_R._TRTSDT
    _DSPHASE:
      type: str
      derivation: _SUPPDS._DSPHASE
    _DSPHASEN:
      type: int
      derivation:
        mapping:
          source: _DSPHASE
          dict:
            SCREENING: 1
            OPEN LABEL TREATMENT: 7
            VACCINATION: 26
            FOLLOW-UP: 31
            REPEAT SCREENING 1: 101
            REPEAT SCREENING 2: 102
          unmapped: null
    _DSDECODN:
      type: int
      derivation:
        mapping:
          source: DS.DSDECOD
          dict:
            ADVERSE EVENT: 1
            COMPLETED: 2
            DEATH: 3
            LOST TO FOLLOW-UP: 5
            OTHER: 7
            PHYSICIAN DECISION: 8
            PREGNANCY: 9
            PROTOCOL DEVIATION: 11
            SCREEN FAILURE: 13
            STUDY TERMINATED BY SPONSOR: 14
            WITHDRAWAL BY SUBJECT: 16
            MEDICATION ERROR WITHOUT ASSOCIATED ADVERSE EVENT: 17
            NO LONGER MEETS ELIGIBILITY CRITERIA: 18
            REFUSED FURTHER STUDY PROCEDURES: 25
            WITHDRAWAL BY PARENT/GUARDIAN: 26
          unmapped: null
    _M1PD2DT:
      type: date
      derivation:
        case:
        - when: ADSL_R._COHORTN = 1.16 AND _SV_M1R._DT IS NOT NULL
          then: _SV_M1R._DT
        - when: ADSL_R._COHORTN = 1.16
          then: ADSL_R._BLDV6DT
        - when: _SV_M1._DT IS NOT NULL
          then: _SV_M1._DT
        - otherwise: ADSL_R._BLDV6DT
    _M6PD2DT:
      type: date
      derivation:
        case:
        - when: _SV_M6._DT IS NOT NULL
          then: _SV_M6._DT
        - otherwise: ADSL_R._BLDV7DT
    _M1PX2DT:
      type: date
      derivation: _SV_M1X._DT
    _CUT0:
      type: date
      derivation:
        case:
        - when: ADSL_R._BLDV6DT IS NOT NULL
          then: ADSL_R._BLDV6DT
        - otherwise: _M1PD2DT
    _CUT1:
      type: date
      derivation:
        case:
        - when: _M1PD2DT IS NOT NULL AND ADSL_R._BLDV6DT IS NOT NULL AND _M1PD2DT
            > ADSL_R._BLDV6DT
          then: _M1PD2DT
        - otherwise: _CUT0
    _CUT2:
      type: date
      derivation:
        case:
        - when: _CUT1 IS NOT NULL
          then: _CUT1
        - when: ADSL_R._EOSDCDT IS NOT NULL AND ADSL_R._EOTDCDT IS NOT NULL AND ADSL_R._EOSDCDT
            = ADSL_R._EOTDCDT
          then: ADSL_R._EOSDCDT
        - when: ADSL_R._VAX10UDT IS NOT NULL AND ADSL_R._VAX102DT IS NOT NULL AND
            ADSL_R._VAX10UDT > ADSL_R._VAX102DT
          then:
            shift:
              type: date
              source: ADSL_R._VAX10UDT
              days: 42
        - when: ADSL_R._VAX102DT IS NOT NULL
          then:
            shift:
              type: date
              source: ADSL_R._VAX102DT
              days: 42
        - when: ADSL_R._VAX10UDT IS NOT NULL AND ADSL_R._VAX101DT IS NOT NULL AND
            ADSL_R._VAX10UDT > ADSL_R._VAX101DT AND ADSL_R._VAX102DT IS NULL
          then:
            shift:
              type: date
              source: ADSL_R._VAX10UDT
              days: 42
        - when: ADSL_R._VAX102DT IS NULL AND ADSL_R._VAX101DT IS NOT NULL
          then:
            shift:
              type: date
              source: ADSL_R._VAX101DT
              days: 84
        - otherwise: null
    _M1P2CUT:
      type: date
      derivation:
        case:
        - when: _CUT1 IS NULL AND _CUT2 IS NOT NULL AND ADSL_R._VAX201DT IS NOT NULL
            AND _CUT2 >= ADSL_R._VAX201DT
          then:
            shift:
              type: date
              source: ADSL_R._VAX201DT
              days: -1
        - otherwise: _CUT2
    _M1P2EXC:
      type: str
      derivation:
        case:
        - when: _DSPHASE = 'OPEN LABEL TREATMENT'
          then: "'Y'"
        - when: _DSPHASE = 'FOLLOW-UP' AND _ASTDT IS NOT NULL AND _M1P2CUT IS NOT
            NULL AND _ASTDT > _M1P2CUT
          then: "'Y'"
        - when: _DSPHASE = 'FOLLOW-UP' AND ADSL_R._EOSDCDT IS NOT NULL AND ADSL_R._EOTDCDT
            IS NOT NULL AND _M1P2CUT IS NOT NULL AND ADSL_R._EOSDCDT > ADSL_R._EOTDCDT
            AND ADSL_R._EOSDCDT > _M1P2CUT
          then: "'Y'"
        - otherwise: null
