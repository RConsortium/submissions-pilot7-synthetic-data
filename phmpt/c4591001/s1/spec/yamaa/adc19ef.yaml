          then: _A._GRP_A
        - otherwise: _A._GRP_B
    _SRTDT_X:
      type: date
      derivation:
        case:
        - when: _GRP_X IN (3, 21, 22, 23)
          then: _A._ADT
        - otherwise: _A._ASTDT
    _ASTDT_X:
      type: date
      derivation:
        case:
        - when: _GRP_X = 3
          then: _A._ADT
        - otherwise: _A._ASTDT
    _FINALDT:
      type: date
      derivation:
        case:
        - when: _GRP_X < 20
          then: _ASTDT_X
        - when: _GRP_X > 20
          then: _ADT
    _AVISITN:
      type: int
      derivation:
        case:
        - when: _GRP_X IN (10, 20) AND _A._AVISITN IS NULL
          then: _WIN_AVISITN
        - otherwise: _A._AVISITN
    _AVISIT:
      type: str
      derivation:
        case:
        - when: _GRP_X IN (10, 20) AND _A._AVISIT IS NULL
          then: _WIN_AVISIT
        - otherwise: _A._AVISIT
    _GRPCAT:
      type: int
      derivation:
        case:
        - when: _GRP_X IN (1, 2)
          then: 1
        - when: _GRP_X >= 3 AND _GRP_X <= 10
          then: 2
        - when: _GRP_X >= 11 AND _GRP_X <= 20
          then: 3
