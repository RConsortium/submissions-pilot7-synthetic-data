    - otherwise: _PREV_VS_DTH_ONLY
- name: _VIS_STAT_CDC
  type: int
  derivation:
    case:
    - when: _ROWKIND IN ('SYMP', 'SYM711')
      then: _VS2_CDC
    - otherwise: _PREV_VIS_STAT_CDC
- name: _VIS_ASTDT_CDC
  type: date
  derivation:
    case:
    - when: _ROWKIND IN ('SYMP', 'SYM711')
      then: _VA3_CDC
    - otherwise: _PREV_VIS_ASTDT_CDC
- name: _VIS_AENDT_CDC
  type: date
  derivation:
    case:
    - when: _ROWKIND IN ('SYMP', 'SYM711')
      then: _VE2_CDC
    - otherwise: _PREV_VIS_AENDT_CDC
- name: _SETFLG_CDC
  type: int
  derivation:
    case:
    - when: _ROWKIND IN ('SYMP', 'SYM711')
      then: _SF1_CDC
    - otherwise: _PREV_SETFLG_CDC
- name: _VIS_ENDTFL_CDC
  type: int
  derivation:
    case:
    - when: _ROWKIND IN ('SYMP', 'SYM711')
      then: _EF1_CDC
    - otherwise: _PREV_VIS_ENDTFL_CDC
- name: _DTH_STAT_M
  type: int
  derivation:
    case:
    - when: _DTH_AVISITN = _AVISITN
      then: _DTH_STAT
- name: _DTH_ASTDT_M
  type: date
  derivation:
    case:
    - when: _DTH_AVISITN = _AVISITN
      then: _DTH_ASTDT
- name: _DTH_AENDT_M
  type: date
  derivation:
    case:
    - when: _DTH_AVISITN = _AVISITN
      then: _DTH_AENDT
- name: _G12_ASTDT_TERM_C
  type: date
  derivation:
    case:
    - when: _G12_HAS > 0 AND _G12_MAXSTAT <> 4 AND _G12_FIRST_ASTDT IS NULL
      then: null
    - when: _G12_HAS > 0
      then: _G12_ASTDT_TERM
- name: _G12_AENDT_C
  type: date
  derivation:
    case:
    - when: _G12_HAS > 0 AND _G12_CNT_AENDT = _G12_HAS
      then: _G12_AENDT
- name: _VIS_STAT_FINAL
  type: int
  derivation: _VIS_STAT
- name: _VIS_ASTDT_FINAL
  type: date
  derivation: _VIS_ASTDT
- name: _VIS_AENDT_FINAL
  type: date
  derivation:
    case:
    - when: _VIS_ENDTFL = 0 AND _VS_DTH_ONLY = 0
      then: _VIS_AENDT
- name: _VIS_STAT_CDC_FINAL
  type: int
  derivation:
    case:
    - when: _VIS_STAT_CDC IS NOT NULL AND (_G12_MAXSTAT IS NULL OR _VIS_STAT_CDC >=
        _G12_MAXSTAT) AND (_DTH_STAT_M IS NULL OR _VIS_STAT_CDC >= _DTH_STAT_M)
      then: _VIS_STAT_CDC
    - when: _G12_MAXSTAT IS NOT NULL AND (_DTH_STAT_M IS NULL OR _G12_MAXSTAT >= _DTH_STAT_M)
      then: _G12_MAXSTAT
    - when: _DTH_STAT_M IS NOT NULL
      then: _DTH_STAT_M
- name: _DTH_ASTDT_IF_MAX
  type: date
  derivation:
    case:
    - when: _DTH_STAT_M IS NOT NULL AND _DTH_STAT_M = _VIS_STAT_CDC_FINAL
      then: _DTH_ASTDT_M
- name: _VIS_ASTDT_CDC_FINAL
  type: date
  derivation:
    case:
    - when: _VIS_ASTDT_CDC IS NOT NULL AND (_G12_ASTDT_TERM_C IS NULL OR _VIS_ASTDT_CDC
        <= _G12_ASTDT_TERM_C) AND (_DTH_ASTDT_IF_MAX IS NULL OR _VIS_ASTDT_CDC <=
        _DTH_ASTDT_IF_MAX)
      then: _VIS_ASTDT_CDC
    - when: _G12_ASTDT_TERM_C IS NOT NULL AND (_DTH_ASTDT_IF_MAX IS NULL OR _G12_ASTDT_TERM_C
        <= _DTH_ASTDT_IF_MAX)
      then: _G12_ASTDT_TERM_C
    - when: _DTH_ASTDT_IF_MAX IS NOT NULL
      then: _DTH_ASTDT_IF_MAX
- name: _VIS_ENDTFL_CDC_C
  type: int
  derivation:
    case:
    - when: _VIS_ENDTFL_CDC = 1
      then: 1
    - when: _G12_BAD > 0
      then: 1
    - when: _DTH_STAT_M IS NOT NULL AND (_DTH_AENDT_M IS NULL OR _DTH_STAT_M <> 4)
      then: 1
    - otherwise: 0
- name: _VIS_AENDT_CDC_CORR
  type: date
  derivation:
    case:
    - when: _VIS_AENDT_CDC IS NOT NULL AND (_G12_AENDT_C IS NULL OR _VIS_AENDT_CDC
        >= _G12_AENDT_C) AND (_DTH_AENDT_M IS NULL OR _VIS_AENDT_CDC >= _DTH_AENDT_M)
      then: _VIS_AENDT_CDC
    - when: _G12_AENDT_C IS NOT NULL AND (_DTH_AENDT_M IS NULL OR _G12_AENDT_C >=
        _DTH_AENDT_M)
      then: _G12_AENDT_C
    - when: _DTH_AENDT_M IS NOT NULL
      then: _DTH_AENDT_M
- name: _VIS_AENDT_CDC_FINAL
  type: date
  derivation:
    case:
    - when: _VIS_ENDTFL_CDC_C = 0
      then: _VIS_AENDT_CDC_CORR
- name: _MIN_SRTDT_V
  type: date
  derivation: _MIN_SRTDT._MIN_SRTDT
- name: _PREV_KB_AV_N
  type: int
  derivation:
    row_value:
      source: _KB_AV_N
      offset: -1
      window: W_KB
- name: _PREV_KB_AV_V
  type: str
  derivation:
    row_value:
      source: _KB_AV_V
      offset: -1
      window: W_KB
- name: _PREV_KB_CNT
  type: int
  derivation:
    row_value:
      source: _KB_CNT
      offset: -1
      window: W_KB
- name: _KB_AV_N
  type: int
  derivation:
    case:
    - when: _MIN_SRTDT_V IS NOT NULL
      then: _AVISITN
    - otherwise: _PREV_KB_AV_N
- name: _KB_AV_V
  type: str
  derivation:
    case:
    - when: _MIN_SRTDT_V IS NOT NULL
      then: _AVISIT
    - otherwise: _PREV_KB_AV_V
- name: _KB_CNT
  type: int
  derivation:
    case:
    - when: _MIN_SRTDT_V IS NULL
      then: _PREV_KB_CNT
    - when: _PREV_KB_CNT IS NULL
      then: 0
    - when: (_PREV_KB_AV_N IS NULL OR _PREV_KB_AV_N <> _AVISITN OR _PREV_KB_AV_V <>
        _AVISIT)
      then: _PREV_KB_CNT + 1
    - otherwise: _PREV_KB_CNT
- name: _KB
  type: float
  derivation:
    case:
    - when: _MIN_SRTDT_V IS NULL
      then: null
    - otherwise: 10 + 2 * _KB_CNT
- name: _PREV_SRTORD
  type: float
  derivation:
    row_value:
      source: _SRTORD
      offset: -1
      window: W_SRTORD
- name: _PREV_SRTB_CNT
  type: int
  derivation:
    row_value:
      source: _SRTB_CNT
      offset: -1
      window: W_SRTORD
- name: _PREV_SRTORD_USUBJID
  type: str
  derivation:
    row_value:
      source: _SRTORD_USUBJID
      offset: -1
      window: W_SRTORD
- name: _SRTB_CNT
  type: int
  derivation:
    case:
    - when: _ROWKIND IN ('SYMP', 'SYM711', 'SEV', 'NVA') AND _AVISIT IN ('V1_DAY1_VAX1_L',
        'V2_VAX2_L') AND (_PREV_SRTORD_USUBJID IS NULL OR _PREV_SRTORD_USUBJID <>
        _USUBJID)
      then: 0
    - when: _ROWKIND IN ('SYMP', 'SYM711', 'SEV', 'NVA') AND _AVISIT IN ('V1_DAY1_VAX1_L',
        'V2_VAX2_L')
      then: _PREV_SRTB_CNT + 1
    - otherwise: _PREV_SRTB_CNT
- name: _SRTORD_USUBJID
  type: str
  derivation:
    case:
    - when: _ROWKIND IN ('SYMP', 'SYM711', 'SEV', 'NVA')
      then: _USUBJID
    - otherwise: _PREV_SRTORD_USUBJID
- name: _SRTORD
  type: float
  derivation:
    case:
    - when: _ROWKIND IN ('SYMP', 'SYM711', 'SEV', 'NVA') AND _AVISIT IN ('V1_DAY1_VAX1_L',
        'V2_VAX2_L')
      then: _SRTB_CNT
    - when: _ROWKIND IN ('SYMP', 'SYM711', 'SEV', 'NVA') AND _KB IS NOT NULL
      then: _KB
    - when: _ROWKIND IN ('SYMP', 'SYM711', 'SEV', 'NVA') AND (_PREV_SRTORD_USUBJID
        IS NULL OR _PREV_SRTORD_USUBJID <> _USUBJID)
      then: 10.1
    - when: _ROWKIND IN ('SYMP', 'SYM711', 'SEV', 'NVA')
      then: _PREV_SRTORD + 0.1
    - otherwise: _PREV_SRTORD
- name: _S4_STAT
  type: int
  derivation:
    case:
    - when: _ROWKIND = 'SEV' AND _GRP = 20.1
      then: _VIS_STAT_FINAL
    - when: _ROWKIND = 'SEV' AND _GRP = 20.2
      then: _VIS_STAT_CDC_FINAL
    - when: _ROWKIND = 'NVA'
      then: _STAT
    - when: _ROWKIND = 'SYM711'
      then: _STAT
    - otherwise: _STAT
- name: _S4_ASTDT
  type: date
  derivation:
    case:
    - when: _ROWKIND = 'SEV' AND _GRP = 20.1
      then: _VIS_ASTDT_FINAL
    - when: _ROWKIND = 'SEV' AND _GRP = 20.2
      then: _VIS_ASTDT_CDC_FINAL
    - when: _ROWKIND = 'NVA'
      then: _ASTDT_RAW
    - when: _ROWKIND = 'SYM711'
      then: _ASTDT_RAW
    - otherwise: _SYMP_ASTDT
- name: _S4_AENDT
  type: date
  derivation:
    case:
    - when: _ROWKIND = 'SEV' AND _GRP = 20.1
      then: _VIS_AENDT_FINAL
    - when: _ROWKIND = 'SEV' AND _GRP = 20.2
      then: _VIS_AENDT_CDC_FINAL
    - when: _ROWKIND = 'NVA'
      then: _AENDT_RAW
    - when: _ROWKIND = 'SYM711'
      then: _AENDT_RAW
    - otherwise: _SYMP_AENDT
- name: _S4_ASTDT_EPOCH
  type: int
  derivation:
    to_epoch_day:
      source: _S4_ASTDT
- name: _S4_AENDT_EPOCH
  type: int
  derivation:
    to_epoch_day:
      source: _S4_AENDT
