  type: str
  derivation:
    case:
    - when: _GRP = 2 AND (_S4_ASTDT IS NULL OR _S4_NAAT_UNP_DT IS NULL)
      then: ''''''
    - when: _GRP = 2 AND _S4_AENDT IS NULL AND _S4_ASTDT_EPOCH - 4 <= _S4_NAUDT_EPOCH
      then: '''Y'''
    - when: _GRP = 2 AND _S4_AENDT IS NOT NULL AND _S4_ASTDT_EPOCH - 4 <= _S4_NAUDT_EPOCH
        AND _S4_NAUDT_EPOCH <= _S4_AENDT_EPOCH + 4
      then: '''Y'''
    - when: _GRP = 2
