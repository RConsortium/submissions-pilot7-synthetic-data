    - when: _S4_ASTDT >= _VAX101DT
      then: _S4_ASTDT_EPOCH - _VAX101_EPOCH + 1
    - otherwise: _S4_ASTDT_EPOCH - _VAX101_EPOCH
- name: _STDY2
  type: int
  derivation:
    case:
    - when: _S4_ASTDT IS NULL OR _VAX102DT IS NULL
      then: null
    - when: _S4_ASTDT >= _VAX102DT
      then: _S4_ASTDT_EPOCH - _VAX102_EPOCH + 1
    - otherwise: _S4_ASTDT_EPOCH - _VAX102_EPOCH
