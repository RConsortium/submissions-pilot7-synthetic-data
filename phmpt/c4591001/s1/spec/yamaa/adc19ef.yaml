- name: _VS1
  type: int
  derivation:
    case:
    - when: _ROWKIND IN ('SYMP', 'SYM711') AND 3 <= _GRP AND _GRP <= 10 AND _SF0 =
        0
      then: _STAT
    - otherwise: _VS0
- name: _VA1
  type: date
  derivation:
    case:
    - when: _ROWKIND IN ('SYMP', 'SYM711') AND 3 <= _GRP AND _GRP <= 10 AND _SF0 =
        0
      then: _SYMP_ASTDT
    - otherwise: _VA0
- name: _VE1
  type: date
  derivation:
    case:
    - when: _ROWKIND IN ('SYMP', 'SYM711') AND 3 <= _GRP AND _GRP <= 10 AND _SF0 =
        0 AND _STAT = 2
      then: _SYMP_ASTDT
    - when: _ROWKIND IN ('SYMP', 'SYM711') AND 3 <= _GRP AND _GRP <= 10 AND _SF0 =
        0
      then: _SYMP_AENDT
    - otherwise: _VE0
- name: _SF1
  type: int
  derivation:
    case:
    - when: _ROWKIND IN ('SYMP', 'SYM711') AND 3 <= _GRP AND _GRP <= 10 AND _SF0 =
        0 AND _STAT = 2 AND _SYMP_ASTDT IS NULL
      then: 0
    - when: _ROWKIND IN ('SYMP', 'SYM711') AND 3 <= _GRP AND _GRP <= 10 AND _SF0 =
        0 AND _GRP = 3 AND _STAT = 2
      then: 0
    - when: _ROWKIND IN ('SYMP', 'SYM711') AND 3 <= _GRP AND _GRP <= 10 AND _SF0 =
        0
      then: 1
    - otherwise: _SF0
- name: _VS1_CDC
  type: int
  derivation:
    case:
    - when: _ROWKIND IN ('SYMP', 'SYM711') AND 11 <= _GRP AND _GRP <= 20 AND _SF0_CDC
        = 0
      then: _STAT
    - otherwise: _VS0_CDC
- name: _VA1_CDC
  type: date
  derivation:
    case:
    - when: _ROWKIND IN ('SYMP', 'SYM711') AND 11 <= _GRP AND _GRP <= 20 AND _SF0_CDC
        = 0
      then: _SYMP_ASTDT
    - otherwise: _VA0_CDC
- name: _VE1_CDC
  type: date
  derivation:
    case:
    - when: _ROWKIND IN ('SYMP', 'SYM711') AND 11 <= _GRP AND _GRP <= 20 AND _SF0_CDC
        = 0
      then: _SYMP_AENDT
    - otherwise: _VE0_CDC
- name: _SF1_CDC
  type: int
  derivation:
    case:
    - when: _ROWKIND IN ('SYMP', 'SYM711') AND 11 <= _GRP AND _GRP <= 20 AND _SF0_CDC
        = 0
      then: 1
    - otherwise: _SF0_CDC
- name: _EF1
  type: int
  derivation:
    case:
    - when: _ROWKIND IN ('SYMP', 'SYM711') AND 3 <= _GRP AND _GRP <= 10 AND _SYMP_AENDT
        IS NULL AND _STAT = 2
      then: 0
    - when: _ROWKIND IN ('SYMP', 'SYM711') AND 3 <= _GRP AND _GRP <= 10 AND (_SYMP_AENDT
        IS NULL OR _STAT <> 4)
      then: 1
    - otherwise: _EF0
- name: _DTH1
  type: int
  derivation:
    case:
    - when: _ROWKIND IN ('SYMP', 'SYM711') AND 3 <= _GRP AND _GRP <= 10 AND _GRP NOT
        IN (3, 10)
      then: 0
    - otherwise: _DTH0
- name: _EF1_CDC
  type: int
  derivation:
    case:
    - when: _ROWKIND IN ('SYMP', 'SYM711') AND 11 <= _GRP AND _GRP <= 20 AND (_SYMP_AENDT
        IS NULL OR _STAT <> 4)
      then: 1
    - otherwise: _EF0_CDC
- name: _VS2
  type: int
  derivation:
    case:
    - when: _ROWKIND IN ('SYMP', 'SYM711') AND 3 <= _GRP AND _GRP <= 10 AND (_VS1
        IS NULL OR _VS1 <= _STAT)
      then: _STAT
    - otherwise: _VS1
- name: _VA2
  type: date
  derivation:
    case:
    - when: _ROWKIND IN ('SYMP', 'SYM711') AND 3 <= _GRP AND _GRP <= 10 AND (_VS1
        IS NULL OR _VS1 <= _STAT) AND (_VA1 IS NULL OR (_VA1 IS NOT NULL AND _SYMP_ASTDT
        IS NOT NULL AND _SYMP_ASTDT < _VA1))
      then: _SYMP_ASTDT
    - otherwise: _VA1
- name: _VA3
  type: date
  derivation:
    case:
    - when: _ROWKIND IN ('SYMP', 'SYM711') AND 3 <= _GRP AND _GRP <= 10 AND _VS2 =
        _STAT AND _SYMP_ASTDT IS NOT NULL AND _VA2 IS NOT NULL AND _SYMP_ASTDT < _VA2
      then: _SYMP_ASTDT
    - otherwise: _VA2
- name: _VE2
  type: date
  derivation:
    case:
    - when: _ROWKIND IN ('SYMP', 'SYM711') AND 3 <= _GRP AND _GRP <= 10 AND _VE1 IS
        NOT NULL AND _SYMP_AENDT IS NOT NULL AND _VE1 < _SYMP_AENDT
      then: _SYMP_AENDT
    - otherwise: _VE1
- name: _VS2_CDC
  type: int
  derivation:
    case:
    - when: _ROWKIND IN ('SYMP', 'SYM711') AND 11 <= _GRP AND _GRP <= 20 AND (_VS1_CDC
        IS NULL OR _VS1_CDC <= _STAT)
      then: _STAT
    - otherwise: _VS1_CDC
- name: _VA2_CDC
  type: date
  derivation:
    case:
    - when: _ROWKIND IN ('SYMP', 'SYM711') AND 11 <= _GRP AND _GRP <= 20 AND (_VS1_CDC
        IS NULL OR _VS1_CDC <= _STAT) AND (_VA1_CDC IS NULL OR (_VA1_CDC IS NOT NULL
        AND _SYMP_ASTDT IS NOT NULL AND _SYMP_ASTDT < _VA1_CDC))
      then: _SYMP_ASTDT
    - otherwise: _VA1_CDC
- name: _VA3_CDC
  type: date
  derivation:
    case:
    - when: _ROWKIND IN ('SYMP', 'SYM711') AND 11 <= _GRP AND _GRP <= 20 AND _VS2_CDC
        = _STAT AND _SYMP_ASTDT IS NOT NULL AND _VA2_CDC IS NOT NULL AND _SYMP_ASTDT
        < _VA2_CDC
      then: _SYMP_ASTDT
    - otherwise: _VA2_CDC
- name: _VE2_CDC
  type: date
  derivation:
    case:
    - when: _ROWKIND IN ('SYMP', 'SYM711') AND 11 <= _GRP AND _GRP <= 20 AND _VE1_CDC
        IS NOT NULL AND _SYMP_AENDT IS NOT NULL AND _VE1_CDC < _SYMP_AENDT
      then: _SYMP_AENDT
    - otherwise: _VE1_CDC
- name: _LAST_VISITNUM
  type: int
  derivation:
    case:
    - when: _ROWKIND IN ('SYMP', 'SYM711') AND _IS_DEATH = 1
      then: _VISITNUM
    - when: _ROWKIND IN ('SYMP', 'SYM711')
      then: _GRP_FIRST_VISITNUM_V
    - otherwise: _PREV_LAST_VISITNUM
- name: _LAST_VISIT
  type: str
  derivation:
    case:
    - when: _ROWKIND IN ('SYMP', 'SYM711') AND _IS_DEATH = 1
      then: _VISIT
    - when: _ROWKIND IN ('SYMP', 'SYM711')
      then: _GRP_FIRST_VISIT_V
    - otherwise: _PREV_LAST_VISIT
- name: _VIS_STAT
  type: int
  derivation:
    case:
    - when: _ROWKIND IN ('SYMP', 'SYM711')
      then: _VS2
    - otherwise: _PREV_VIS_STAT
- name: _VIS_ASTDT
  type: date
  derivation:
    case:
    - when: _ROWKIND IN ('SYMP', 'SYM711')
      then: _VA3
    - otherwise: _PREV_VIS_ASTDT
- name: _VIS_AENDT
  type: date
  derivation:
    case:
    - when: _ROWKIND IN ('SYMP', 'SYM711')
      then: _VE2
    - otherwise: _PREV_VIS_AENDT
- name: _SETFLG
  type: int
  derivation:
    case:
