        - when: _S1._AVISIT NOT IN ('V1_DAY1_VAX1_L', 'V2_VAX2_L') AND _HAS_AV_ASTDT
            IS NOT NULL AND _HAS_AV_AENDT IS NOT NULL AND _ADT_EPOCH IS NOT NULL AND
            _AV_ASTDT_M4 <= _ADT_EPOCH AND _ADT_EPOCH <= _AV_AENDT_P4
          then: '''Y'''
        - when: _S1._AVISIT NOT IN ('V1_DAY1_VAX1_L', 'V2_VAX2_L') AND _HAS_AV_ASTDT
            IS NULL AND _HAS_V_ASTDT IS NOT NULL AND _HAS_V_AENDT IS NULL AND _ADT_EPOCH
            IS NOT NULL AND _V_ASTDT_M4 <= _ADT_EPOCH
          then: '''Y'''
        - when: _S1._AVISIT NOT IN ('V1_DAY1_VAX1_L', 'V2_VAX2_L') AND _HAS_AV_ASTDT
            IS NULL AND _HAS_V_ASTDT IS NOT NULL AND _HAS_V_AENDT IS NOT NULL AND
            _ADT_EPOCH IS NOT NULL AND _V_ASTDT_M4 <= _ADT_EPOCH AND _ADT_EPOCH <=
            _V_AENDT_P4
          then: '''Y'''
        - otherwise: '''N'''
    _CNCRSLFL:
      type: str
      derivation:
        case:
        - when: _S1._AVISIT NOT IN ('V1_DAY1_VAX1_L', 'V2_VAX2_L') AND _HAS_AV_ASTDT
            IS NULL AND _HAS_V_ASTDT IS NULL
          then: '''Y'''
        - when: _RUN_MIN_RECSEQ._MIN_RECSEQ = _RUN_MAX_RECSEQ._MAX_RECSEQ
          then: '''Y'''
        - when: _VLD = 'Y'
          then: '''Y'''
    _IS_4D:
      type: int
      derivation:
        case:
        - when: _S1._RECSEQ = _NVA4D._CNT_RECSEQ
          then: 1
        - otherwise: 0
    _HAS_4D:
      type: int
      derivation:
        case:
        - when: _NVA4D._CNT_UNP IS NOT NULL
          then: 1
        - otherwise: 0
    _IS_4E:
      type: int
      derivation:
        case:
        - when: _S1._RECSEQ = _NVA4E._LCL_RECSEQ
          then: 1
        - otherwise: 0
    _C_USUBJID:
      type: str
      derivation: _S1._USUBJID
    _C_AVISITN:
      type: int
      derivation: _S1._AVISITN
    _C_AVISIT:
      type: str
      derivation: _S1._AVISIT
    _C_VISITNUM:
      type: int
      derivation: _S1._VISITNUM
    _C_VISIT:
      type: str
      derivation: _S1._VISIT
    _CNT_UNP:
      type: int
      derivation:
        case:
        - when: _S1._RECSEQ = _NVA4D._CNT_RECSEQ
          then: _S1._STAT
        - otherwise: _NVA4D._CNT_UNP
    _CNT_UNP_DT:
      type: date
      derivation:
        case:
        - when: _S1._RECSEQ = _NVA4D._CNT_RECSEQ
          then: _S1._ADT
        - otherwise: _NVA4D._CNT_UNP_DT
    _C_VLD:
      type: str
      derivation:
        case:
        - when: _S1._RECSEQ = _NVA4D._CNT_RECSEQ
          then: _VLD
        - otherwise: _NVA4D._CNT_VLD
    _CNT_SRTDT:
      type: date
      derivation:
        case:
        - when: _S1._RECSEQ = _NVA4D._CNT_RECSEQ
          then: _S1._SRTDT_X
        - otherwise: _NVA4D._CNT_SRTDT
    _LCL_UNP:
      type: int
      derivation:
        case:
        - when: _S1._RECSEQ = _NVA4E._LCL_RECSEQ
          then: _S1._STAT
        - otherwise: _NVA4E._LCL_UNP
    _LCL_UNP_DT:
      type: date
      derivation:
        case:
        - when: _S1._RECSEQ = _NVA4E._LCL_RECSEQ
          then: _S1._ADT
        - otherwise: _NVA4E._LCL_UNP_DT
    _L_VLD:
      type: str
      derivation:
        case:
        - when: _S1._RECSEQ = _NVA4E._LCL_RECSEQ
          then: _VLD
        - otherwise: _NVA4E._LCL_VLD
    _LCL_SRTDT:
      type: date
      derivation:
        case:
        - when: _S1._RECSEQ = _NVA4E._LCL_RECSEQ
          then: _S1._SRTDT_X
        - otherwise: _NVA4E._LCL_SRTDT
    _NAAT_UNP:
      type: int
      derivation:
        case:
        - when: _C_VLD = 'Y'
          then: _CNT_UNP
        - when: _L_VLD = 'Y'
          then: _LCL_UNP
    _NAAT_UNP_DT:
      type: date
      derivation:
        case:
        - when: _C_VLD = 'Y'
          then: _CNT_UNP_DT
        - when: _L_VLD = 'Y'
          then: _LCL_UNP_DT
    _VUNPRFL:
      type: str
      derivation:
        case:
        - when: (_C_VLD = 'Y' OR _L_VLD = 'Y')
          then: '''Y'''
    _STAT_SORT:
      type: int
      derivation:
        case:
        - when: (_C_VLD = 'Y' OR _L_VLD = 'Y')
          then: _NAAT_UNP
        - otherwise: _CNT_UNP
    _DT_SORT:
      type: date
      derivation:
        case:
        - when: (_C_VLD = 'Y' OR _L_VLD = 'Y')
          then: _NAAT_UNP_DT
        - otherwise: _CNT_UNP_DT
    _DT_SORT_EPOCH:
      type: int
      derivation:
        to_epoch_day:
          source: _DT_SORT
    _VUNP_RANK:
      type: int
      derivation:
        case:
        - when: _VUNPRFL = 'Y'
          then: 1
        - otherwise: 0
    _NAAT_RANK:
      type: int
      derivation:
        case:
        - when: _NAAT_UNP IS NULL
          then: 0
        - otherwise: _NAAT_UNP + 1
    _STAT_RANK:
      type: int
      derivation:
        case:
        - when: _STAT_SORT IS NULL
          then: 0
        - otherwise: _STAT_SORT + 1
    _DT_RANK:
      type: int
      derivation:
        case:
        - when: _DT_SORT IS NULL
          then: 0
        - otherwise: _DT_SORT_EPOCH
    _C1_KEY:
      type: int
      derivation: _VUNP_RANK * 1000000000000 + _NAAT_RANK * 1000000000 + _STAT_RANK
        * 100000 + _DT_RANK
