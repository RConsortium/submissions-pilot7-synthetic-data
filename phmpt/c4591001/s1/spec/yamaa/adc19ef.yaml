- name: _GRP_STDT
  type: date
  derivation:
    case:
    - when: _MAXSTAT = 4
      then: _MIN_ASTDT_4
    - when: _MAXSTAT = 3
      then:
        case:
        - when: _CNT_ASTDT_3 < _N_3
          then: null
        - otherwise: _MIN_ASTDT_3
    - when: _MAXSTAT = 2
      then:
        case:
        - when: _CNT_ASTDT_2 < _N_2
          then: null
        - otherwise: _MIN_ASTDT_2
    - when: _MAXSTAT = 1
      then:
        case:
        - when: _CNT_ASTDT_1 < _N_1
          then: null
        - otherwise: _MIN_ASTDT_1
    - when: _MAXSTAT = 0
      then:
        case:
        - when: _CNT_ASTDT_0 < _N_0
          then: null
        - otherwise: _MIN_ASTDT_0
- name: _GRP_ENDT
  type: date
  derivation:
    case:
    - when: _MAXSTAT = 4
      then:
        case:
        - when: _CNT_AENDT_4 < _N_4
          then: null
        - otherwise: _MAX_AENDT_4
    - when: _MAXSTAT = 3
      then:
        case:
        - when: _CNT_AENDT_3 < _N_3
          then: null
        - otherwise: _MAX_AENDT_3
    - when: _MAXSTAT = 2
      then:
        case:
        - when: _CNT_AENDT_2 < _N_2
          then: null
        - otherwise: _MAX_AENDT_2
    - when: _MAXSTAT = 1
      then:
        case:
        - when: _CNT_AENDT_1 < _N_1
          then: null
        - otherwise: _MAX_AENDT_1
    - when: _MAXSTAT = 0
      then:
        case:
        - when: _CNT_AENDT_0 < _N_0
          then: null
        - otherwise: _MAX_AENDT_0
- name: _GRP_FIRST_VISITNUM_V
  type: int
  derivation: _GRP_FIRST._FIRST_VISITNUM
- name: _GRP_FIRST_VISIT_V
  type: str
  derivation: _GRP_FIRST._FIRST_VISIT
- name: _SYMP_ASTDT
  type: date
  derivation:
    case:
    - when: _ROWKIND = 'SYMP'
      then: _GRP_STDT
    - when: _ROWKIND = 'ONSET'
      then: _GRP_STDT
    - when: _ROWKIND = 'SYM711'
      then: _ASTDT_RAW
    - when: _ROWKIND = 'NVA'
      then: _ASTDT_RAW
- name: _SYMP_AENDT
  type: date
  derivation:
    case:
    - when: _ROWKIND = 'SYMP'
      then: _GRP_ENDT
    - when: _ROWKIND = 'ONSET'
      then: _GRP_ENDT
    - when: _ROWKIND = 'SYM711'
      then: _AENDT_RAW
    - when: _ROWKIND = 'NVA'
      then: _AENDT_RAW
- name: _PREV_SYMP_AV
  type: int
  derivation:
    row_value:
      source: _SYMP_AV
      offset: -1
      window: W_SYMP2
- name: _SYMP_AV
  type: int
  derivation:
    case:
    - when: _ROWKIND IN ('SYMP', 'SYM711')
      then: _AVISITN
