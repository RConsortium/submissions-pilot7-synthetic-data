# First generated by tools/gen_adc19ef_spec.py (retired); this file is the source.
# C4591001 S1 ADC19EF yamaa spec. Ground truth: tools/adc19ef_proto.py
# (EXACT MATCH vs the submitted S1 ADC19EF, 2,149,013 rows x 75 cols,
# 0 mismatch cells, 4 SEX x age partitions, 2026-11-23). Derivations
# from the S1 ADaM define.xml + adc19ef.sas (28Mar2021) + data.
# Design in adc19ef/DESIGN.md. _SEQ is the OUTPUT-3 identity column
# (the submitted file has 3 fully-identical duplicate rows); the
# partition driver drops it before comparison.
yamaa: '1.0'
type: spec
model: ADaM
parent: ../../../spec/yamaa/base/adam-base.yaml
domain: ADC19EF
keys:
- USUBJID
- _SEQ
windows:
  W_SYMP2:
    group_by:
    - USUBJID
    order_by:
    - _AVISITN
    - _AVISIT
    - _GRPCAT
    - _GRP
    - _SCAN_ORD
    - _STAT
    - _SYMP_ASTDT
    - _SYMP_AENDT
    - _VISITNUM
  W_SYMP4:
    group_by:
    - USUBJID
    order_by:
    - _VAX101DT
    - _VAX102DT
    - _SRTORD
    - _AVISITN
    - _AVISIT
    - _GRPCAT
    - _GRP
    - _SCAN_ORD
    - _SYMP_ASTDT
  W_KB:
    group_by:
    - USUBJID
    order_by:
    - _MIN_SRTDT_V
    - _AVISITN
    - _AVISIT
  W_SRTORD:
    group_by: []
    order_by:
    - _USUBJID
    - _AVISITN
    - _KB
    - _SRTDT
input:
  ADSYMPT:
    path: <adam-dir>/adsympt.parquet
    key:
    - USUBJID
  ADSL:
    path: <adam-dir>/adsl.parquet
    key:
    - STUDYID
    - USUBJID
submission:
  label: Covid-19 Efficacy Analysis
  class: BASIC DATA STRUCTURE
  structure: One record or multiple records per subject per analysis parameter per
    analysis timepoint
  repeating: true
intermediates:
- id: _ADSYMPT_PLAIN
  dataset: ADSYMPT
  key:
    SUBJID: _SUBJID
  order_by:
  - ADSYMPT.SUBJID
  keep: first
- id: _ADSL_PLAIN
  dataset: ADSL
  key:
    USUBJID: _USUBJID
  order_by:
  - ADSL.USUBJID
  keep: first
- id: _ADSL_BY_SUBJ
  dataset: ADSL
  key:
    USUBJID: ADSYMPT.USUBJID
  order_by:
  - ADSL.USUBJID
  keep: first
  derivations:
    _STUDYID:
      type: str
      derivation: ADSL.STUDYID
    _SITEID:
      type: str
      derivation: ADSL.SITEID
    _SUBJID:
      type: str
      derivation: ADSL.SUBJID
    _BRTHDT:
      type: str
      derivation: ADSL.BRTHDT_2
    _AGEGR1N:
      type: int
      derivation: ADSL.AGEGR1N
    _AGEGR1:
      type: str
      derivation: ADSL.AGEGR1
    _SEX:
      type: str
      derivation: ADSL.SEX
    _RACE:
      type: str
      derivation: ADSL.RACE
    _ETHNIC:
      type: str
      derivation: ADSL.ETHNIC
    _ARMCD:
      type: str
      derivation: ADSL.ARMCD
    _ARM:
      type: str
      derivation: ADSL.ARM
    _ACTARMCD:
      type: str
      derivation: ADSL.ACTARMCD
    _ACTARM:
      type: str
      derivation: ADSL.ACTARM
    _RANDDT:
      type: date
      derivation: ADSL.RANDDT
    _TRTSDT:
      type: date
      derivation: ADSL.TRTSDT
    _TRTEDT:
      type: date
      derivation: ADSL.TRTEDT
    _VAX101DT:
      type: date
      derivation: ADSL.VAX101DT
    _VAX102DT:
      type: date
      derivation: ADSL.VAX102DT
    _DVSTDT:
      type: date
      derivation: ADSL.DVSTDT
    _UNBLNDDT:
      type: date
      derivation: ADSL.UNBLNDDT
    _DTHDT:
      type: date
      derivation: ADSL.DTHDT
    _EOTDCDT:
      type: date
      derivation: ADSL.EOTDCDT
    _EOSDCDT:
      type: date
      derivation: ADSL.EOSDCDT
    _EOSDCRS:
      type: str
      derivation: ADSL.EOSDCRS
    _EOTDCRS:
      type: str
      derivation: ADSL.EOTDCRS
    _RANDFL:
      type: str
      derivation: ADSL.RANDFL
    _EVALEFFL:
      type: str
      derivation: ADSL.EVALEFFL
    _AAI1EFFL:
      type: str
      derivation: ADSL.AAI1EFFL
    _AAI2EFFL:
      type: str
      derivation: ADSL.AAI2EFFL
    _DTHFL:
      type: str
      derivation: ADSL.DTHFL
    _PHASEN:
      type: int
      derivation: ADSL.PHASEN
    _PHASE:
      type: str
      derivation: ADSL.PHASE
- id: _A_DTH
  dataset: ADSYMPT
  columns:
  - _USUBJID
  - _PARAMCD
  - _AVISITN
  - _PARAMN
  - _AVAL
  - _AVALC
  - _ADT
  - _ASTDT
  - _UNBLNDDT
  - _IS_KEPT_APPR
  derivations:
    _USUBJID:
      type: str
      derivation: ADSYMPT.USUBJID
    _PARAMCD:
      type: str
      derivation: ADSYMPT.PARAMCD
    _AVISITN:
      type: int
      derivation: ADSYMPT.AVISITN
    _PARAMN:
      type: int
      derivation: ADSYMPT.PARAMN
    _AVAL:
      type: float
      derivation: ADSYMPT.AVAL
    _AVALC:
      type: str
      derivation: ADSYMPT.AVALC
    _ADT:
      type: date
      derivation: ADSYMPT.ADT
    _ASTDT:
      type: date
      derivation: ADSYMPT.ASTDT
    _UNBLNDDT:
      type: date
      derivation: _ADSL_BY_SUBJ._UNBLNDDT
    _IS_KEPT_APPR:
      type: int
      derivation:
        case:
        - when: _UNBLNDDT IS NULL OR (_ADT IS NOT NULL AND _ADT < _UNBLNDDT)
          then: 1
        - otherwise: 0
- id: _DTH_BY_SUBJ
  dataset: _A_DTH
  key:
    _USUBJID: _USUBJID
  filter: _A_DTH._PARAMCD IN ('PRCDTH', 'SECDTH') AND _A_DTH._IS_KEPT_APPR = 1
  order_by:
  - _A_DTH._AVISITN
  - _A_DTH._PARAMN
  - _A_DTH._AVAL
  - _A_DTH._AVALC
  - _A_DTH._ADT
  - _A_DTH._ASTDT
  keep: last
  derivations:
    _DEATH_ADT:
      type: date
      derivation: _A_DTH._ADT
- id: _A
  dataset: ADSYMPT
  columns:
  - _USUBJID
  - _PARAMN
