  - _IS_MAX
  - _WIN_AVISITN_SRC
  - _WIN_AVISIT_SRC
  - _WIN_AVISITN
  - _WIN_AVISIT
  derivations:
    _USUBJID:
      type: str
      derivation: ADSYMPT.USUBJID
    _PARAMN:
      type: int
      derivation: ADSYMPT.PARAMN
    _PARAMCD:
      type: str
      derivation: ADSYMPT.PARAMCD
    _PARAM:
      type: str
      derivation: ADSYMPT.PARAM
    _PARCAT1:
      type: str
      derivation: ADSYMPT.PARCAT1
    _AVAL:
      type: float
      derivation: ADSYMPT.AVAL
    _AVALC:
      type: str
      derivation: ADSYMPT.AVALC
    _VISITNUM:
      type: int
      derivation: ADSYMPT.VISITNUM
    _VISIT:
      type: str
      derivation: ADSYMPT.VISIT
    _AVISITN:
      type: int
      derivation: ADSYMPT.AVISITN
    _AVISIT:
      type: str
      derivation: ADSYMPT.AVISIT
    _ADT:
      type: date
      derivation: ADSYMPT.ADT
    _ASTDT:
      type: date
      derivation: ADSYMPT.ASTDT
    _AENDT:
      type: date
      derivation: ADSYMPT.AENDT
    _MBSPEC:
      type: str
      derivation: ADSYMPT.MBSPEC
    _C19ILHFL:
      type: str
      derivation: ADSYMPT.C19ILHFL
    _STUDYID:
      type: str
      derivation: ADSYMPT.STUDYID
    _SITEID:
      type: str
      derivation: ADSYMPT.SITEID
    _SUBJID:
      type: str
      derivation: ADSYMPT.SUBJID
    _BRTHDT:
      type: str
      derivation: _ADSL_BY_SUBJ._BRTHDT
    _AGEGR1N:
      type: int
      derivation: ADSYMPT.AGEGR1N
    _AGEGR1:
      type: str
      derivation: ADSYMPT.AGEGR1
    _SEX:
      type: str
      derivation: ADSYMPT.SEX
    _RACE:
      type: str
      derivation: ADSYMPT.RACE
    _ETHNIC:
      type: str
      derivation: ADSYMPT.ETHNIC
    _ARMCD:
      type: str
      derivation: ADSYMPT.ARMCD
    _ARM:
      type: str
      derivation: ADSYMPT.ARM
    _ACTARMCD:
      type: str
      derivation: ADSYMPT.ACTARMCD
    _ACTARM:
      type: str
      derivation: ADSYMPT.ACTARM
    _RANDDT:
      type: date
      derivation: ADSYMPT.RANDDT
    _TRTSDT:
      type: date
      derivation: ADSYMPT.TRTSDT
    _TRTEDT:
      type: date
      derivation: ADSYMPT.TRTEDT
    _VAX101DT:
      type: date
      derivation: ADSYMPT.VAX101DT
    _VAX102DT:
      type: date
      derivation: ADSYMPT.VAX102DT
    _DVSTDT:
      type: date
      derivation: _ADSL_BY_SUBJ._DVSTDT
    _UNBLNDDT:
      type: date
      derivation: _ADSL_BY_SUBJ._UNBLNDDT
    _DTHDT:
      type: date
      derivation: _ADSL_BY_SUBJ._DTHDT
    _EOTDCDT:
      type: date
      derivation: _ADSL_BY_SUBJ._EOTDCDT
    _EOSDCDT:
      type: date
      derivation: _ADSL_BY_SUBJ._EOSDCDT
    _EOSDCRS:
      type: str
      derivation: _ADSL_BY_SUBJ._EOSDCRS
    _EOTDCRS:
      type: str
      derivation: _ADSL_BY_SUBJ._EOTDCRS
    _RANDFL:
      type: str
      derivation: ADSYMPT.RANDFL
    _EVALEFFL:
      type: str
      derivation: ADSYMPT.EVALEFFL
    _AAI1EFFL:
      type: str
      derivation: ADSYMPT.AAI1EFFL
    _AAI2EFFL:
      type: str
      derivation: ADSYMPT.AAI2EFFL
    _DTHFL:
      type: str
      derivation: _ADSL_BY_SUBJ._DTHFL
    _PHASEN:
      type: int
      derivation: _ADSL_BY_SUBJ._PHASEN
    _PHASE:
      type: str
      derivation: _ADSL_BY_SUBJ._PHASE
    _RECSEQ:
      type: int
      derivation:
        row_number:
          window:
            group_by:
            - ADSYMPT.USUBJID
            order_by:
            - ADSYMPT.AVISITN
            - ADSYMPT.PARAMN
            - ADSYMPT.AVAL
            - ADSYMPT.AVALC
            - ADSYMPT.ADT
            - ADSYMPT.ASTDT
    _STDT:
      type: date
      derivation:
        case:
        - when: ADSYMPT.PARAMCD IN ('RESP', 'HR', 'OXYSAT', 'DIABP', 'SYSBP', 'PO2FIO2',
            'RTCOV2NS', 'SARSCOV2', 'C19NIG', 'PRCDTH', 'SECDTH')
          then: ADSYMPT.ADT
        - otherwise: ADSYMPT.ASTDT
    _STDT_OK:
      type: int
      derivation:
        case:
        - when: _STDT IS NULL OR _STDT <= _UNBLNDDT
          then: 1
        - otherwise: 0
    _IS_LAB:
      type: int
      derivation:
        case:
        - when: ADSYMPT.PARAMCD IN ('RTCOV2NS', 'SARSCOV2')
          then: 1
        - otherwise: 0
    _EXEMPT:
      type: int
      derivation:
        case:
        - when: ADSYMPT.AVISIT IN ('V1_DAY1_VAX1_L', 'V2_VAX2_L', 'V201_SURVEIL_CONSENT')
            OR str_contains(ADSYMPT.AVISIT, 'SSWAB_WEEK')
          then: 1
        - otherwise: 0
    _T1_IND:
      type: int
      derivation:
        case:
        - when: _IS_LAB = 0 AND _STDT_OK = 1
          then: 1
    _T2_IND:
      type: int
      derivation:
        case:
        - when: _IS_LAB = 1 AND _EXEMPT = 1 AND _STDT_OK = 1
          then: 1
    _SYMP_IND:
      type: int
      derivation:
        case:
        - when: ADSYMPT.PARAMCD IN ('CHILLS', 'DIARRHEA', 'FEVER', 'NLTSTSML', 'NCOUG',
            'NSTBRTH', 'NMUSPN', 'NSRTHROT', 'VOMIT', 'RESP', 'HR', 'OXYSAT', 'DIABP',
            'SYSBP', 'PO2FIO2', 'INTBTION', 'NIPPV', 'CPAP', 'OXYTHRP', 'MCHVENT',
            'ECMO', 'HFOXTHRP', 'VSOPRES', 'SARDFN', 'SAHDFN', 'SANDFN', 'HCUICU',
            'HCUHSP')
          then: 1
    _LAB_IND:
      type: int
      derivation:
        case:
        - when: _IS_LAB = 1 AND _STDT_OK = 1
          then: 1
    _T1_KEPT:
      type: int
      derivation:
        locf:
          source: _T1_IND
          window:
            group_by:
            - ADSYMPT.USUBJID
            - ADSYMPT.AVISITN
            - ADSYMPT.AVISIT
            order_by:
            - variable: _T1_IND
              direction: desc
            - ADSYMPT.PARAMN
    _T2_KEPT:
      type: int
      derivation:
        locf:
          source: _T2_IND
          window:
            group_by:
            - ADSYMPT.USUBJID
            - ADSYMPT.AVISITN
            - ADSYMPT.AVISIT
            order_by:
            - variable: _T2_IND
              direction: desc
            - ADSYMPT.PARAMN
    _HAS_SYMP:
      type: int
      derivation:
        locf:
          source: _SYMP_IND
          window:
            group_by:
            - ADSYMPT.USUBJID
            - ADSYMPT.AVISITN
            - ADSYMPT.AVISIT
            order_by:
            - variable: _SYMP_IND
              direction: desc
            - ADSYMPT.PARAMN
    _LAB_OK:
      type: int
      derivation:
        locf:
          source: _LAB_IND
          window:
            group_by:
            - ADSYMPT.USUBJID
            - ADSYMPT.AVISITN
            - ADSYMPT.AVISIT
            order_by:
            - variable: _LAB_IND
              direction: desc
            - ADSYMPT.PARAMN
    _KEPT:
      type: int
      derivation:
        case:
        - when: _UNBLNDDT IS NULL
          then: 1
        - when: _T1_KEPT = 1 OR _T2_KEPT = 1
          then: 1
        - when: _HAS_SYMP IS NULL AND _LAB_OK = 1
          then: 1
        - when: ADSYMPT.PARAMCD IN ('PRCDTH', 'SECDTH') AND ADSYMPT.ADT IS NOT NULL
            AND ADSYMPT.ADT < _UNBLNDDT
          then: 1
        - otherwise: 0
    _RES:
      type: str
      derivation:
        case:
        - when: ADSYMPT.PARAMCD = 'RESP' AND ADSYMPT.AVAL IS NOT NULL AND ADSYMPT.AVAL
            >= 30
          then: '''POS'''
        - when: ADSYMPT.PARAMCD = 'RESP' AND ADSYMPT.AVAL IS NOT NULL
          then: '''NEG'''
        - when: ADSYMPT.PARAMCD = 'HR' AND ADSYMPT.AVAL IS NOT NULL AND ADSYMPT.AVAL
            >= 125
          then: '''POS'''
        - when: ADSYMPT.PARAMCD = 'HR' AND ADSYMPT.AVAL IS NOT NULL
          then: '''NEG'''
        - when: ADSYMPT.PARAMCD = 'OXYSAT' AND ADSYMPT.AVAL IS NOT NULL AND ADSYMPT.AVAL
            <= 93
          then: '''POS'''
        - when: ADSYMPT.PARAMCD = 'OXYSAT' AND ADSYMPT.AVAL IS NOT NULL
          then: '''NEG'''
        - when: ADSYMPT.PARAMCD = 'DIABP' AND ADSYMPT.AVAL IS NOT NULL AND ADSYMPT.AVAL
            < 60
          then: '''POS'''
        - when: ADSYMPT.PARAMCD = 'DIABP' AND ADSYMPT.AVAL IS NOT NULL
          then: '''NEG'''
        - when: ADSYMPT.PARAMCD = 'SYSBP' AND ADSYMPT.AVAL IS NOT NULL AND ADSYMPT.AVAL
            < 90
          then: '''POS'''
        - when: ADSYMPT.PARAMCD = 'SYSBP' AND ADSYMPT.AVAL IS NOT NULL
          then: '''NEG'''
        - when: ADSYMPT.PARAMCD = 'PO2FIO2' AND ADSYMPT.AVAL IS NOT NULL AND ADSYMPT.AVAL
            < 300
          then: '''POS'''
        - when: ADSYMPT.PARAMCD = 'PO2FIO2' AND ADSYMPT.AVAL IS NOT NULL
          then: '''NEG'''
        - when: ADSYMPT.PARAMCD = 'VSOPRES' AND ADSYMPT.AVALC IS NOT NULL AND ADSYMPT.AVALC
            <> ''
          then: '''POS'''
        - when: ADSYMPT.PARAMCD = 'VSOPRES'
          then: '''NEG'''
        - otherwise: ''''''
    _STAT:
      type: int
      derivation:
        case:
        - when: (ADSYMPT.AVAL IS NULL AND (ADSYMPT.AVALC IS NULL OR ADSYMPT.AVALC
            = ''))
          then: 0
        - when: _RES = 'POS'
          then: 4
        - when: _RES = 'NEG'
          then: 2
        - when: ADSYMPT.AVALC IN ('UNK', 'UNKNOWN')
          then: 1
        - when: ADSYMPT.AVALC IN ('N', 'NEG')
          then: 2
        - when: ADSYMPT.AVALC = 'IND'
          then: 3
        - when: ADSYMPT.AVALC IN ('Y', 'POS')
          then: 4
    _GRP_A:
      type: int
      derivation:
        case:
        - when: ADSYMPT.PARAMCD IN ('CHILLS', 'DIARRHEA', 'FEVER', 'NLTSTSML', 'NCOUG',
            'NSTBRTH', 'NMUSPN', 'NSRTHROT', 'VOMIT')
          then: 1
        - when: ADSYMPT.PARAMCD IN ('FATIGUE', 'HEADACHE', 'RIHNRA', 'NAUSEA', 'NNSLCONG')
          then: 2
        - when: ADSYMPT.PARAMCD IN ('RESP', 'HR', 'OXYSAT', 'DIABP', 'SYSBP', 'PO2FIO2')
          then: 3
        - when: ADSYMPT.PARAMCD IN ('INTBTION', 'NIPPV', 'CPAP', 'OXYTHRP', 'MCHVENT',
            'ECMO', 'HFOXTHRP')
          then: 4
        - when: ADSYMPT.PARAMCD = 'VSOPRES'
          then: 5
        - when: ADSYMPT.PARAMCD IN ('SARDFN', 'SAHDFN', 'SANDFN')
          then: 6
        - when: ADSYMPT.PARAMCD = 'HCUICU'
          then: 7
        - when: ADSYMPT.PARAMCD = 'HCUHSP'
          then: 11
        - when: ADSYMPT.PARAMCD = 'C19NIG' AND ADSYMPT.AVISIT = 'V1_DAY1_VAX1_L'
          then: 21
        - when: ADSYMPT.PARAMCD = 'RTCOV2NS'
          then: 22
        - when: ADSYMPT.PARAMCD = 'SARSCOV2'
          then: 23
        - when: ADSYMPT.PARAMCD IN ('PRCDTH', 'SECDTH')
          then: 10
    _GRP_B:
      type: int
      derivation:
        case:
        - when: ADSYMPT.PARAMCD IN ('CHILLS', 'DIARRHEA', 'FEVER', 'NLTSTSML', 'NCOUG',
            'NSTBRTH', 'NMUSPN', 'NSRTHROT', 'VOMIT')
          then: 2
        - when: ADSYMPT.PARAMCD IN ('MCHVENT', 'ECMO')
          then: 12
        - when: ADSYMPT.PARAMCD = 'HCUICU'
          then: 12
        - when: ADSYMPT.PARAMCD = 'HCUHSP'
          then: 12
        - when: ADSYMPT.PARAMCD IN ('PRCDTH', 'SECDTH')
          then: 20
    _NGRP:
      type: int
      derivation:
        case:
        - when: _GRP_A IS NULL
          then: 0
        - when: _GRP_B IS NULL
          then: 1
        - otherwise: 2
    _LAST_GRP:
      type: int
      derivation:
        case:
        - when: ADSYMPT.PARAMCD = 'SARSCOV2'
          then: 23
        - when: ADSYMPT.PARAMCD = 'RTCOV2NS'
          then: 22
        - when: ADSYMPT.PARAMCD = 'C19NIG' AND ADSYMPT.AVISIT = 'V1_DAY1_VAX1_L'
          then: 21
        - when: ADSYMPT.PARAMCD IN ('MCHVENT', 'ECMO', 'HCUICU', 'HCUHSP')
          then: 12
        - when: ADSYMPT.PARAMCD IN ('SARDFN', 'SAHDFN', 'SANDFN')
          then: 6
        - when: ADSYMPT.PARAMCD = 'VSOPRES'
          then: 5
        - when: ADSYMPT.PARAMCD IN ('INTBTION', 'NIPPV', 'CPAP', 'OXYTHRP', 'MCHVENT',
            'ECMO', 'HFOXTHRP')
          then: 4
        - when: ADSYMPT.PARAMCD IN ('RESP', 'HR', 'OXYSAT', 'DIABP', 'SYSBP', 'PO2FIO2')
          then: 3
        - when: ADSYMPT.PARAMCD IN ('CHILLS', 'DIARRHEA', 'FEVER', 'NLTSTSML', 'NCOUG',
            'NSTBRTH', 'NMUSPN', 'NSRTHROT', 'VOMIT', 'FATIGUE', 'HEADACHE', 'RIHNRA',
            'NAUSEA', 'NNSLCONG')
          then: 2
        - when: ADSYMPT.PARAMCD IN ('CHILLS', 'DIARRHEA', 'FEVER', 'NLTSTSML', 'NCOUG',
            'NSTBRTH', 'NMUSPN', 'NSRTHROT', 'VOMIT')
          then: 1
    _SRTDT_ORD:
      type: date
      derivation:
        case:
        - when: _LAST_GRP IN (3, 21, 22, 23)
          then: ADSYMPT.ADT
        - otherwise: ADSYMPT.ASTDT
    _DTH_DT:
      type: date
      derivation: _DTH_BY_SUBJ._DEATH_ADT
    _ASTDT_X_A:
      type: date
      derivation:
        case:
        - when: _GRP_A = 3
          then: ADSYMPT.ADT
        - otherwise: ADSYMPT.ASTDT
    _FINALDT_A:
      type: date
      derivation:
        case:
        - when: _GRP_A IN (3, 21, 22, 23)
          then: ADSYMPT.ADT
        - when: _GRP_A < 20
          then: ADSYMPT.ASTDT
    _F_A:
      type: date
      derivation:
        case:
        - when: _KEPT = 1 AND ((_GRP_A < 20 AND _ASTDT_X_A IS NOT NULL AND _ASTDT_X_A
            <= _DTH_DT) OR (_GRP_A > 20 AND ADSYMPT.ADT IS NOT NULL AND ADSYMPT.ADT
            <= _DTH_DT))
          then: _FINALDT_A
    _ASTDT_X_B:
      type: date
      derivation:
        case:
        - when: _GRP_B = 3
          then: ADSYMPT.ADT
        - otherwise: ADSYMPT.ASTDT
    _FINALDT_B:
      type: date
      derivation:
        case:
        - when: _GRP_B IN (3, 21, 22, 23)
          then: ADSYMPT.ADT
        - when: _GRP_B < 20
          then: ADSYMPT.ASTDT
    _F_B:
      type: date
      derivation:
        case:
        - when: _KEPT = 1 AND ((_GRP_B < 20 AND _ASTDT_X_B IS NOT NULL AND _ASTDT_X_B
            <= _DTH_DT) OR (_GRP_B > 20 AND ADSYMPT.ADT IS NOT NULL AND ADSYMPT.ADT
            <= _DTH_DT))
          then: _FINALDT_B
    _F_MAX:
      type: date
      derivation:
        case:
        - when: _F_A IS NULL
          then: _F_B
        - when: _F_B IS NULL
          then: _F_A
        - when: _F_A >= _F_B
          then: _F_A
        - otherwise: _F_B
    _RN_MATCH:
      type: int
      derivation:
        row_number:
          window:
            group_by:
            - ADSYMPT.USUBJID
            order_by:
            - variable: _F_MAX
              direction: desc
            - variable: ADSYMPT.ADT
              direction: desc
            - variable: ADSYMPT.ASTDT
              direction: desc
    _IS_MAX:
      type: int
      derivation:
        case:
        - when: _RN_MATCH = 1 AND _F_MAX IS NOT NULL
          then: 1
        - otherwise: 0
    _WIN_AVISITN_SRC:
      type: int
      derivation:
        case:
        - when: _IS_MAX = 1
          then: ADSYMPT.AVISITN
    _WIN_AVISIT_SRC:
      type: str
      derivation:
        case:
        - when: _IS_MAX = 1
          then: ADSYMPT.AVISIT
    _WIN_AVISITN:
      type: int
      derivation:
        locf:
          source: _WIN_AVISITN_SRC
          window:
            group_by:
            - ADSYMPT.USUBJID
            order_by:
            - variable: _F_MAX
              direction: desc
            - variable: ADSYMPT.ADT
              direction: desc
            - variable: ADSYMPT.ASTDT
              direction: desc
    _WIN_AVISIT:
      type: str
      derivation:
        locf:
          source: _WIN_AVISIT_SRC
          window:
            group_by:
            - ADSYMPT.USUBJID
            order_by:
            - variable: _F_MAX
              direction: desc
            - variable: ADSYMPT.ADT
              direction: desc
            - variable: ADSYMPT.ASTDT
              direction: desc
