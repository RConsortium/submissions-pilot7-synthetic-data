      derivation:
        to_epoch_day:
          source: _S1._VAX102DT
    _AV_ASTDT_M4:
      type: int
      derivation: _AV_ASTDT_EPOCH - 4
    _AV_AENDT_P4:
      type: int
      derivation: _AV_AENDT_EPOCH + 4
    _V_ASTDT_M4:
      type: int
      derivation: _V_ASTDT_EPOCH - 4
    _V_AENDT_P4:
      type: int
      derivation: _V_AENDT_EPOCH + 4
    _VLD:
      type: str
      derivation:
        case:
        - when: _S1._AVISIT = 'V1_DAY1_VAX1_L' AND _ADT_EPOCH IS NOT NULL AND _VAX101_EPOCH
            IS NOT NULL AND _ADT_EPOCH <= _VAX101_EPOCH
          then: '''Y'''
        - when: _S1._AVISIT = 'V2_VAX2_L' AND _ADT_EPOCH IS NOT NULL AND _VAX102_EPOCH
            IS NOT NULL AND _ADT_EPOCH <= _VAX102_EPOCH
          then: '''Y'''
        - when: _S1._AVISIT NOT IN ('V1_DAY1_VAX1_L', 'V2_VAX2_L') AND _HAS_AV_ASTDT
            IS NOT NULL AND _HAS_AV_AENDT IS NULL AND _ADT_EPOCH IS NOT NULL AND _AV_ASTDT_M4
            <= _ADT_EPOCH
          then: '''Y'''
        - when: _S1._AVISIT NOT IN ('V1_DAY1_VAX1_L', 'V2_VAX2_L') AND _HAS_AV_ASTDT
            IS NOT NULL AND _HAS_AV_AENDT IS NOT NULL AND _ADT_EPOCH IS NOT NULL AND
            _AV_ASTDT_M4 <= _ADT_EPOCH AND _ADT_EPOCH <= _AV_AENDT_P4
          then: '''Y'''
        - when: _S1._AVISIT NOT IN ('V1_DAY1_VAX1_L', 'V2_VAX2_L') AND _HAS_AV_ASTDT
            IS NULL AND _HAS_V_ASTDT IS NOT NULL AND _HAS_V_AENDT IS NULL AND _ADT_EPOCH
            IS NOT NULL AND _V_ASTDT_M4 <= _ADT_EPOCH
          then: '''Y'''
        - when: _S1._AVISIT NOT IN ('V1_DAY1_VAX1_L', 'V2_VAX2_L') AND _HAS_AV_ASTDT
            IS NULL AND _HAS_V_ASTDT IS NOT NULL AND _HAS_V_AENDT IS NOT NULL AND
            _ADT_EPOCH IS NOT NULL AND _V_ASTDT_M4 <= _ADT_EPOCH AND _ADT_EPOCH <=
            _V_AENDT_P4
          then: '''Y'''
        - otherwise: '''N'''
    _CNCRSLFL:
      type: str
      derivation:
        case:
        - when: _S1._AVISIT NOT IN ('V1_DAY1_VAX1_L', 'V2_VAX2_L') AND _HAS_AV_ASTDT
            IS NULL AND _HAS_V_ASTDT IS NULL
          then: '''Y'''
        - when: _RUN_MIN_RECSEQ._MIN_RECSEQ = _RUN_MAX_RECSEQ._MAX_RECSEQ
          then: '''Y'''
        - when: _VLD = 'Y'
          then: '''Y'''
