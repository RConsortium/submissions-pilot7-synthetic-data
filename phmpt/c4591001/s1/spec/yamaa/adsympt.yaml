# C4591001 S1 ADSYMPT.
# Parent: ../../../spec/yamaa/base/adam-base.yaml (section 3.1 core columns).
# Derivations implement the S1 ADaM define (IG.ADSYMPT, MT.ADSYMPT.*) and
# adsympt.sas (spec/source/program/adam). ADSL columns are read from the
# SUBMITTED S1 ADSL, exactly as the SAS merges the sponsor's ADSL. BRTHDT
# reads ADSL.BRTHDT_2 (the submitted ADSL carries the define's BRTHDT under
# that name; '(b)(6)' for every subject).
# AVISITN and AVISIT come from the visit-collapse walk of the program
# (__visits_sdtm to clsp_covid_vis), built by two helper specs whose output
# this spec reads as VISMAP: helper/adsympt_visits.yaml (visit records and
# the walk, a calculated-history group over its own rows) and
# helper/adsympt_vismap.yaml (the analysis visit of each collapsed record).
# scripts/reproduce.py runs them first.
yamaa: '1.0'
type: spec
model: ADaM
parent: ../../../spec/yamaa/base/adam-base.yaml
domain: ADSYMPT
keys:
- USUBJID
- _SEQ
input:
  CE: <sdtm-dir>/ce.parquet
  CM: <sdtm-dir>/cm.parquet
  DD: <sdtm-dir>/dd.parquet
  DS: <sdtm-dir>/ds.parquet
  FA: <sdtm-dir>/face.parquet
  HO: <sdtm-dir>/ho.parquet
  IS: <sdtm-dir>/is.parquet
  LB: <sdtm-dir>/lb.parquet
  MB: <sdtm-dir>/mb.parquet
  PR: <sdtm-dir>/pr.parquet
  VS: <sdtm-dir>/vs.parquet
  SUPPHO: <sdtm-dir>/suppho.parquet
  MH: <sdtm-dir>/mh.parquet
  ADSL:
    path: <adam-dir>/adsl.parquet
    key:
    - USUBJID
  VISMAP:
    path: <work-dir>/adsympt_vismap.parquet
    schema: helper/adsympt_vismap.yaml
submission:
  label: Covid-19 Signs and Symptoms
  class: BASIC DATA STRUCTURE
  structure: One record or multiple records per subject per analysis parameter per
    analysis timepoint
  repeating: true
intermediates:
- id: _FA_N
  dataset: FA
  filter: FA.FACAT = 'EFFICACY'
  columns:
  - _STUDYID
  - _DOMAIN
  - _USUBJID
  - _FAOBJ_U
  - _FASTRESC
  - _FADTC
  - _VISITNUM
  - _VISIT
  - _FATESTCD
  - _FACAT
  derivations:
    _STUDYID:
      type: str
      derivation: FA.STUDYID
    _DOMAIN:
      type: str
      derivation: FA.DOMAIN
    _USUBJID:
      type: str
      derivation: FA.USUBJID
    _FAOBJ_U:
      type: str
      derivation:
        str_case:
          source: FA.FAOBJ
          to: upper
    _FASTRESC:
      type: str
      derivation: FA.FASTRESC
    _FADTC:
      type: str
      derivation: FA.FADTC
    _VISITNUM:
      type: int
      derivation:
        case:
        - when: FA.FACAT = 'EFFICACY'
          then: FA.VISITNUM
    _VISIT:
      type: str
      derivation: FA.VISIT
    _FATESTCD:
      type: str
      derivation: FA.FATESTCD
    _FACAT:
      type: str
      derivation: FA.FACAT
- id: _FA_DATES
  dataset: FA
  key:
    USUBJID: USUBJID
    VISITNUM: VISITNUM
    VISIT: VISIT
  filter: FA.FATESTCD IN ('FSYMDATE', 'LSYMDATE', 'SYMONGO') AND FA.FACAT = 'EFFICACY'
  pivot:
    name: FATESTCD
    value: FAORRES
    fields:
    - FSYMDATE
    - LSYMDATE
    - SYMONGO
- id: _MB_N
  dataset: MB
  columns:
  - _STUDYID
  - _DOMAIN
  - _USUBJID
  - _MBTESTCD
  - _MBTEST_U
  - _MBMETHOD
  - _MBMETHOD_U
  - _MBCAT
  - _MBLOC
  - _MBSPEC
  - _AVALC_RAW
  - _MBDTC
  - _VISITNUM
  - _VISIT
  derivations:
    _STUDYID:
      type: str
      derivation: MB.STUDYID
    _DOMAIN:
      type: str
      derivation: MB.DOMAIN
    _USUBJID:
      type: str
      derivation: MB.USUBJID
    _MBTESTCD:
      type: str
      derivation: MB.MBTESTCD
    _MBTEST_U:
      type: str
      derivation:
        str_case:
          source: MB.MBTEST
          to: upper
    _MBMETHOD:
      type: str
      derivation: MB.MBMETHOD
    # adsympt.sas compares upcase(strip(mbmethod)); the 6-month MB writes it in mixed case.
    _MBMETHOD_U:
      type: str
      derivation:
        str_case:
          source: MB.MBMETHOD
          to: upper
    _MBCAT:
      type: str
      derivation: MB.MBCAT
    _MBLOC:
      type: str
      derivation: MB.MBLOC
    _MBSPEC:
      type: str
      derivation: MB.MBSPEC
    _AVALC_RAW:
      type: str
      derivation:
        case:
        - when: _MBTEST_U = 'SEVERE ACUTE RESP SYNDROME CORONAVIRUS 2' AND (MB.SPDEVID
            IS NULL OR MB.SPDEVID NOT IN ('34', '44', '68'))
          then: "'UNKNOWN'"
        - otherwise: MB.MBORRES
    _MBDTC:
      type: str
      derivation: MB.MBDTC
    _VISITNUM:
      type: int
      derivation:
        case:
        - when: ((_MBTEST_U = 'SEVERE ACUTE RESP SYNDROME CORONAVIRUS 2' AND _MBMETHOD_U
            = 'IMMUNOCHROMATOGRAPHY') OR (_MBTEST_U IN ('CEPHEID RT-PCR ASSAY FOR
            SARS-COV-2', 'CEPHEID RT-PCR ASSAY OF SARS-COV-2') AND _MBMETHOD_U = 'REVERSE
            TRANSCRIPTASE PCR'))
          then: MB.VISITNUM
    _VISIT:
      type: str
      derivation: MB.VISIT
- id: _SUPPHO
  dataset: SUPPHO
  key:
    USUBJID: HO.USUBJID
    _HOSEQ: HO.HOSEQ
  filter: SUPPHO.QNAM IN ('HCUHSP', 'HCUICU')
  pivot:
    name: QNAM
    value: QVAL
    fields:
    - HCUHSP
    - HCUICU
  derivations:
    _HOSEQ:
      type: int
      derivation: SUPPHO.IDVARVAL
- id: _PHASE
  dataset: ADSL
  key:
    USUBJID: USUBJID
  order_by:
  - ADSL.USUBJID
  keep: first
  derivations:
    _PHASEN:
      type: int
      derivation: ADSL.PHASEN
- id: _MH_FLAG
  dataset: MH
  key:
    USUBJID: USUBJID
  filter: MH.MHDECOD IN ('Asymptomatic COVID-19', 'COVID-19', 'COVID-19 pneumonia',
    'COVID-19 treatment', 'Suspected COVID-19', 'SARS-CoV-2 antibody test positive',
    'SARS-CoV-2 carrier', 'SARS-CoV-2 sepsis', 'SARS-CoV-2 test positive', 'SARS-CoV-2
    viraemia', 'Multisystem inflammatory syndrome in children')
  order_by:
  - MH.USUBJID
  keep: first
  derivations:
    _MHDECOD:
      type: str
      derivation: MH.MHDECOD
- id: _DD_FIRST
  dataset: DD
  key:
    USUBJID: ADSL.USUBJID
  filter: DD.DDSTRESC <> ''
  order_by:
  - DD.USUBJID
  keep: first
  derivations:
    _DDTESTCD:
      type: str
      derivation: DD.DDTESTCD
- id: _HO_LEFT
  dataset: HO
  columns:
  - _USUBJID
  - _STUDYID
  - _HOCAT
  - _HODTC
  - _VISITNUM
  - _VISIT
  - _HOSEQ
  - _HCUHSP
  - _HCUICU
  derivations:
    _USUBJID:
      type: str
      derivation: HO.USUBJID
    _STUDYID:
      type: str
      derivation: HO.STUDYID
    _HOCAT:
      type: str
      derivation: HO.HOCAT
    _HODTC:
      type: str
      derivation: HO.HODTC
    _VISITNUM:
      type: int
      derivation: HO.VISITNUM
    _VISIT:
      type: str
      derivation: HO.VISIT
    _HOSEQ:
      type: int
      derivation: HO.HOSEQ
    _HCUHSP:
      type: str
      derivation: _SUPPHO.HCUHSP
    _HCUICU:
      type: str
      derivation: _SUPPHO.HCUICU
- id: _HO_HOSP
  dataset: HO
  filter: HO.HOCAT = 'HOSPITALIZATION STATUS' AND HO.HOTERM = 'HOSPITAL'
  columns:
  - _USUBJID
  - _VISITNUM
  - _VISIT
  - _HOSTDTC
  - _HOENDTC
  derivations:
    _USUBJID:
      type: str
      derivation: HO.USUBJID
    _VISITNUM:
      type: int
      derivation: HO.VISITNUM
    _VISIT:
      type: str
      derivation: HO.VISIT
    _HOSTDTC:
      type: str
      derivation: HO.HOSTDTC
    _HOENDTC:
      type: str
      derivation: HO.HOENDTC
- id: _HO_PAIRS
  dataset: _HO_LEFT
  inner_join: _HO_HOSP
  key:
  - _USUBJID
  - _VISITNUM
  - _VISIT
  derivations:
    USUBJID:
      type: str
      derivation: _HO_LEFT._USUBJID
    STUDYID:
      type: str
      derivation: _HO_LEFT._STUDYID
    HOCAT:
      type: str
      derivation: _HO_LEFT._HOCAT
    HODTC:
      type: str
      derivation: _HO_LEFT._HODTC
    VISITNUM:
      type: int
      derivation: _HO_LEFT._VISITNUM
    VISIT:
      type: str
      derivation: _HO_LEFT._VISIT
    HOSEQ:
      type: int
      derivation: _HO_LEFT._HOSEQ
    HCUHSP:
      type: str
      derivation: _HO_LEFT._HCUHSP
    HCUICU:
      type: str
      derivation: _HO_LEFT._HCUICU
    HOSTDTC:
      type: str
      derivation: _HO_HOSP._HOSTDTC
    HOENDTC:
      type: str
      derivation: _HO_HOSP._HOENDTC
- id: _HO_HOSPITAL
  dataset: HO
  key:
    USUBJID: HO.USUBJID
    VISITNUM: HO.VISITNUM
    VISIT: HO.VISIT
  filter: HO.HOCAT = 'HOSPITALIZATION STATUS' AND HO.HOTERM = 'HOSPITAL'
  order_by:
  - HO.USUBJID
  keep: first
  derivations:
    _HOSEQ:
      type: int
      derivation: HO.HOSEQ
# The analysis visit of a collapsed visit record (helper/adsympt_vismap.yaml,
# built from helper/adsympt_visits.yaml): adsympt3 joins it on the record's
# domain, subject, visit and dates, a missing date matching a missing one.
- id: _VISMAP
  dataset: VISMAP
  key:
    USUBJID: USUBJID
    DOMAIN: _VDOM
    VISITNUM: VISITNUM
    VISIT: VISIT
    ADT: ADT
    ASK: _ASK
    AEK: _AEK
  order_by: [VISMAP.RECSEQ]
  keep: first
  derivations:
    _AVISITN: {type: int, derivation: VISMAP.AVISITN}
    _AVISIT: {type: str, derivation: VISMAP.AVISIT}
rows:
- id: ce
  dataset: CE
  filter: CE.CECAT = 'SEVERE COVID-19 ILLNESS' AND CE.CESCAT IN ('SIGNIFICANT ACUTE
    RENAL DYSFUNCTION', 'SIGNIFICANT ACUTE HEPATIC DYSFUNCTION', 'SIGNIFICANT ACUTE
    NEUROLOGIC DYSFUNCTION') AND NOT (str_contains(VISIT, '(1_S|2_S|S_R|4_S|6_S|_NS|4_L|6_L|SCR)$')
    OR VISIT IN ('V3_MONTH1_POSTVAX2_L', 'V5_MONTH12_L')) AND _PHASEN > 1
  derivations:
    _VDOM: "'CE'"
    STUDYID: CE.STUDYID
    USUBJID: CE.USUBJID
    PARAMN:
      case:
      - when: CE.CESCAT = 'SIGNIFICANT ACUTE RENAL DYSFUNCTION'
        then: 25
      - when: CE.CESCAT = 'SIGNIFICANT ACUTE HEPATIC DYSFUNCTION'
        then: 30
      - when: CE.CESCAT = 'SIGNIFICANT ACUTE NEUROLOGIC DYSFUNCTION'
        then: 35
    PARAMCD:
      case:
      - when: CE.CESCAT = 'SIGNIFICANT ACUTE RENAL DYSFUNCTION'
        then: "'SARDFN'"
      - when: CE.CESCAT = 'SIGNIFICANT ACUTE HEPATIC DYSFUNCTION'
        then: "'SAHDFN'"
      - when: CE.CESCAT = 'SIGNIFICANT ACUTE NEUROLOGIC DYSFUNCTION'
        then: "'SANDFN'"
    PARAM: CE.CESCAT
    PARCAT1: CE.CECAT
    PARCAT2: null
    AVAL: null
    VISITNUM: CE.VISITNUM
    VISIT: CE.VISIT
    ADT:
      to_date:
        source: CE.CEDTC
    ASTDT:
      to_date:
        source: CE.CESTDTC
    AENDT:
      to_date:
        source: CE.CEENDTC
    ISSPEC: null
    ISMETHOD: null
    MBLOC: null
    MBSPEC: null
    MBMETHOD: null
    PRPRESP: null
    VSSTRESU: null
    _AVALC_RAW: "'Y'"
    _PHASEN: ADSL.PHASEN
    _FAOBJ_U: null
    _FATESTCD: null
    _FACAT: null
    _ISTESTCD: null
    _DSDECOD: null
    _MBTEST_U: null
    _MBMETHOD: null
    _PRTRT_U: null
- id: cm
  dataset: CM
  filter: CM.CMCAT = 'GENERAL CONCOMITANT MEDICATIONS' AND CM.CMSCAT = 'VASOPRESSORS
    AGENTS' AND CM.CMTRT <> '' AND _AVALC_RAW <> '' AND _PHASEN > 1
  derivations:
    _VDOM: "'CM'"
    STUDYID: CM.STUDYID
    USUBJID: CM.USUBJID
    PARAMN: 80
    PARAMCD: "'VSOPRES'"
    PARAM: CM.CMSCAT
    PARCAT1: CM.CMCAT
    PARCAT2: CM.CMSCAT
    AVAL: null
    VISITNUM: null
    VISIT: null
    ADT: null
    ASTDT:
      to_date:
        source: CM.CMSTDTC
    AENDT:
      to_date:
        source: CM.CMENDTC
    ISSPEC: null
    ISMETHOD: null
    MBLOC: null
    MBSPEC: null
    MBMETHOD: null
    PRPRESP: null
    VSSTRESU: null
    _AVALC_RAW:
      case:
      - when: CM.CMDECOD <> ''
        then: CM.CMDECOD
      - otherwise: CM.CMTRT
    _PHASEN: ADSL.PHASEN
    _FAOBJ_U: null
    _FATESTCD: null
    _FACAT: null
    _ISTESTCD: null
    _DSDECOD: null
    _MBTEST_U: null
    _MBMETHOD: null
    _PRTRT_U: null
- id: dd_a
  dataset: DD
  filter: DD.DDSTRESC <> '' AND _PHASEN > 1
  derivations:
    _VDOM: "'DD'"
    STUDYID: DD.STUDYID
    USUBJID: DD.USUBJID
    PARAMN:
      case:
      - when: DD.DDTESTCD = 'PRCDTH'
        then: 95
      - when: DD.DDTESTCD = 'SECDTH'
        then: 96
    PARAMCD:
      case:
      - when: DD.DDTESTCD = 'PRCDTH'
        then: "'PRCDTH'"
      - when: DD.DDTESTCD = 'SECDTH'
        then: "'SECDTH'"
      - otherwise: "''"
    PARAM: DD.DDTEST
    PARCAT1: DD.DDCAT
    PARCAT2: null
    AVAL: null
    VISITNUM: null
    VISIT: null
    ADT: ADSL.DTHDT
    ASTDT: null
    AENDT: null
    ISSPEC: null
    ISMETHOD: null
    MBLOC: null
    MBSPEC: null
    MBMETHOD: null
    PRPRESP: null
    VSSTRESU: null
    _AVALC_RAW:
      str_case:
        source: DD.DDSTRESC
        to: upper
    _PHASEN: ADSL.PHASEN
    _FAOBJ_U: null
    _FATESTCD: null
    _FACAT: null
    _ISTESTCD: null
    _DSDECOD: null
    _MBTEST_U: null
    _MBMETHOD: null
    _PRTRT_U: null
- id: dd_b
  dataset: ADSL
  filter: ADSL.DTHDT IS NOT NULL AND _DD_FIRST._DDTESTCD IS NULL AND _PHASEN > 1
  derivations:
    _VDOM: "'DD'"
    STUDYID: ADSL.STUDYID
    USUBJID: ADSL.USUBJID
    PARAMN: 95
    PARAMCD: "'PRCDTH'"
    PARAM: "'PRIMARY CAUSE OF DEATH'"
    PARCAT1: "'DEATH DETAILS CODED'"
    PARCAT2: null
    AVAL: null
    VISITNUM: null
    VISIT: null
    ADT: ADSL.DTHDT
    ASTDT: null
    AENDT: null
    ISSPEC: null
    ISMETHOD: null
    MBLOC: null
    MBSPEC: null
    MBMETHOD: null
    PRPRESP: null
    VSSTRESU: null
    _AVALC_RAW: "''"
    _PHASEN: ADSL.PHASEN
    _FAOBJ_U: null
    _FATESTCD: null
    _FACAT: null
    _ISTESTCD: null
    _DSDECOD: null
    _MBTEST_U: null
    _MBMETHOD: null
    _PRTRT_U: null
- id: ds
  dataset: DS
  group_by:
  - DS.STUDYID
  - DS.DOMAIN
  - DS.USUBJID
  - DS.DSDECOD
  - DS.DSCAT
  - DS.DSSTDTC
  filter: _DSDECOD = 'DEATH' AND _PHASEN > 1
  derivations:
    _VDOM: "'DS'"
    STUDYID: DS.STUDYID
    USUBJID: DS.USUBJID
    PARAMN: 99
    PARAMCD: "'DEATH'"
    PARAM: "'DEATH'"
    PARCAT1: DS.DSCAT
    PARCAT2: null
    AVAL: null
    VISITNUM: null
    VISIT: null
    ADT: null
    ASTDT:
      to_date:
        source: DS.DSSTDTC
    AENDT: null
    ISSPEC: null
    ISMETHOD: null
    MBLOC: null
    MBSPEC: null
    MBMETHOD: null
    PRPRESP: null
    VSSTRESU: null
    _AVALC_RAW: "'Y'"
    _PHASEN: ADSL.PHASEN
    _FAOBJ_U: null
    _FATESTCD: null
    _FACAT: null
    _ISTESTCD: null
    _DSDECOD: DS.DSDECOD
    _MBTEST_U: null
    _MBMETHOD: null
    _PRTRT_U: null
- id: fa
  dataset: _FA_N
  group_by:
  - _FA_N._STUDYID
  - _FA_N._DOMAIN
  - _FA_N._USUBJID
  - _FA_N._FAOBJ_U
  - _FA_N._FASTRESC
  - _FA_N._FADTC
  - _FA_N._VISITNUM
  - _FA_N._VISIT
  - _FA_N._FATESTCD
  - _FA_N._FACAT
  filter: _FATESTCD = 'OCCUR' AND _FACAT = 'EFFICACY' AND PARAMCD <> '' AND NOT (str_contains(VISIT,
    '(1_S|2_S|S_R|4_S|6_S|_NS|4_L|6_L|SCR)$') OR VISIT IN ('V3_MONTH1_POSTVAX2_L',
    'V5_MONTH12_L')) AND _PHASEN > 1
  derivations:
    _VDOM: "'FA'"
    STUDYID: _FA_N._STUDYID
    USUBJID: _FA_N._USUBJID
    PARAMN:
      case:
      - when: _FAOBJ_U = 'CHILLS'
        then: 1
      - when: _FAOBJ_U = 'DIARRHEA'
        then: 2
      - when: _FAOBJ_U = 'FEVER'
        then: 3
      - when: _FAOBJ_U = 'NEW LOSS OF TASTE OR SMELL'
        then: 4
      - when: _FAOBJ_U = 'NEW OR INCREASED COUGH'
        then: 5
      - when: _FAOBJ_U = 'NEW OR INCREASED MUSCLE PAIN'
        then: 6
      - when: _FAOBJ_U = 'NEW OR INCREASED SHORTNESS OF BREATH'
        then: 7
      - when: _FAOBJ_U = 'NEW OR INCREASED SORE THROAT'
        then: 8
      - when: _FAOBJ_U = 'VOMITING'
        then: 9
      - when: _FAOBJ_U = 'LOSS OF TASTE/SMELL'
        then: 10
      - when: _FAOBJ_U = 'NEW OR INCREASED NASAL CONGESTION'
        then: 11
      - when: _FAOBJ_U = 'NASAL CONGESTION'
        then: 11
      - when: _FAOBJ_U = 'NEW OR INCREASED NASAL DISCHARGE'
        then: 12
      - when: _FAOBJ_U = 'NEW OR INCREASED SPUTUM PRODUCTION'
        then: 13
      - when: _FAOBJ_U = 'NEW OR INCREASED WHEEZING'
        then: 14
      - when: _FAOBJ_U = 'WHEEZING'
        then: 14
      - when: _FAOBJ_U = 'FATIGUE'
        then: 15
      - when: _FAOBJ_U = 'HEADACHE'
        then: 16
      - when: _FAOBJ_U = 'NAUSEA'
        then: 18
      - when: str_contains(_FAOBJ_U, 'RUNNY NOSE') OR _FAOBJ_U = 'RHINORRHOEA'
        then: 17
    PARAMCD:
      case:
      - when: _FAOBJ_U = 'CHILLS'
        then: "'CHILLS'"
      - when: _FAOBJ_U = 'DIARRHEA'
        then: "'DIARRHEA'"
      - when: _FAOBJ_U = 'FEVER'
        then: "'FEVER'"
      - when: _FAOBJ_U = 'NEW LOSS OF TASTE OR SMELL'
        then: "'NLTSTSML'"
      - when: _FAOBJ_U = 'NEW OR INCREASED COUGH'
        then: "'NCOUG'"
      - when: _FAOBJ_U = 'NEW OR INCREASED MUSCLE PAIN'
        then: "'NMUSPN'"
      - when: _FAOBJ_U = 'NEW OR INCREASED SHORTNESS OF BREATH'
        then: "'NSTBRTH'"
      - when: _FAOBJ_U = 'NEW OR INCREASED SORE THROAT'
        then: "'NSRTHROT'"
      - when: _FAOBJ_U = 'VOMITING'
        then: "'VOMIT'"
      - when: _FAOBJ_U = 'LOSS OF TASTE/SMELL'
        then: "'LSTSTSML'"
      - when: _FAOBJ_U = 'NEW OR INCREASED NASAL CONGESTION'
        then: "'NNSLCONG'"
      - when: _FAOBJ_U = 'NASAL CONGESTION'
        then: "'NNSLCONG'"
      - when: _FAOBJ_U = 'NEW OR INCREASED NASAL DISCHARGE'
        then: "'NNSLDSCH'"
      - when: _FAOBJ_U = 'NEW OR INCREASED SPUTUM PRODUCTION'
        then: "'SPUTPROD'"
      - when: _FAOBJ_U = 'NEW OR INCREASED WHEEZING'
        then: "'WHEEZ'"
      - when: _FAOBJ_U = 'WHEEZING'
        then: "'WHEEZ'"
      - when: _FAOBJ_U = 'FATIGUE'
        then: "'FATIGUE'"
      - when: _FAOBJ_U = 'HEADACHE'
        then: "'HEADACHE'"
      - when: _FAOBJ_U = 'NAUSEA'
        then: "'NAUSEA'"
      - when: str_contains(_FAOBJ_U, 'RUNNY NOSE') OR _FAOBJ_U = 'RHINORRHOEA'
        then: "'RIHNRA'"
      - otherwise: "''"
    PARAM:
      case:
      - when: _FAOBJ_U = 'NEW OR INCREASED NASAL CONGESTION'
        then: "'NEW OR INCREASED NASAL CONGESTION'"
      - when: _FAOBJ_U = 'NASAL CONGESTION'
        then: "'NEW OR INCREASED NASAL CONGESTION'"
      - when: _FAOBJ_U = 'NEW OR INCREASED WHEEZING'
        then: "'NEW OR INCREASED WHEEZING'"
      - when: _FAOBJ_U = 'WHEEZING'
        then: "'NEW OR INCREASED WHEEZING'"
      - when: str_contains(_FAOBJ_U, 'RUNNY NOSE') OR _FAOBJ_U = 'RHINORRHOEA'
        then: "'RHINORRHOEA'"
      - otherwise: _FAOBJ_U
    PARCAT1: "'SIGNS AND SYMPTOMS OF DISEASE'"
    PARCAT2: "'RESPIRATORY ILLNESS'"
    AVAL: null
    VISITNUM: _FA_N._VISITNUM
    VISIT: _FA_N._VISIT
    ADT:
      to_date:
