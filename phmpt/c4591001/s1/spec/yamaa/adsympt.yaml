- id: pr
  dataset: PR
  filter: PR.PRCAT = 'GENERAL NON-DRUG TREATMENT' AND PR.PRTRT <> '' AND _AVALC_RAW
    <> '' AND NOT (str_contains(VISIT, '(1_S|2_S|S_R|4_S|6_S|_NS|4_L|6_L|SCR)$') OR
    VISIT IN ('V3_MONTH1_POSTVAX2_L', 'V5_MONTH12_L')) AND _PHASEN > 1
  derivations:
    _VDOM: "'PR'"
    STUDYID: PR.STUDYID
    USUBJID: PR.USUBJID
    PARAMN:
      case:
      - when: _PRTRT_U = 'INTUBATION'
        then: 70
      - when: _PRTRT_U = 'NON-INVASIVE POSITIVE PRESSURE VENTILATION'
        then: 71
      - when: _PRTRT_U = 'CONTINUOUS POSITIVE AIRWAY PRESSURE'
        then: 72
      - when: _PRTRT_U = 'CPAP'
        then: 72
      - when: _PRTRT_U = 'OXYGEN THERAPY'
        then: 73
      - when: _PRTRT_U = 'MECHANICAL VENTILATION'
        then: 74
      - when: _PRTRT_U = 'EXTRACORPOREAL MEMBRANE OXYGENATION'
        then: 75
      - when: _PRTRT_U = 'HIGH FLOW OXYGEN THERAPY'
        then: 76
    PARAMCD:
      case:
      - when: _PRTRT_U = 'INTUBATION'
        then: "'INTBTION'"
      - when: _PRTRT_U = 'NON-INVASIVE POSITIVE PRESSURE VENTILATION'
        then: "'NIPPV'"
      - when: _PRTRT_U = 'CONTINUOUS POSITIVE AIRWAY PRESSURE'
        then: "'CPAP'"
      - when: _PRTRT_U = 'CPAP'
        then: "'CPAP'"
      - when: _PRTRT_U = 'OXYGEN THERAPY'
        then: "'OXYTHRP'"
      - when: _PRTRT_U = 'MECHANICAL VENTILATION'
        then: "'MCHVENT'"
      - when: _PRTRT_U = 'EXTRACORPOREAL MEMBRANE OXYGENATION'
        then: "'ECMO'"
      - when: _PRTRT_U = 'HIGH FLOW OXYGEN THERAPY'
        then: "'HFOXTHRP'"
      - otherwise: "''"
    PARAM:
      case:
      - when: _PRTRT_U = 'CONTINUOUS POSITIVE AIRWAY PRESSURE'
        then: "'CONTINUOUS POSITIVE AIRWAY PRESSURE'"
      - when: _PRTRT_U = 'CPAP'
        then: "'CONTINUOUS POSITIVE AIRWAY PRESSURE'"
      - otherwise: _PRTRT_U
    PARCAT1: PR.PRCAT
    PARCAT2: "'RESPIRATORY FAILURE'"
    AVAL: null
    VISITNUM: PR.VISITNUM
    VISIT: PR.VISIT
    ADT:
      to_date:
        source: PR.PRDTC
    ASTDT:
      to_date:
        source: PR.PRSTDTC
    AENDT:
      to_date:
        source: PR.PRENDTC
    ISSPEC: null
    ISMETHOD: null
    MBLOC: null
    MBSPEC: null
    MBMETHOD: null
    PRPRESP: PR.PRPRESP
    VSSTRESU: null
    _AVALC_RAW:
      case:
      - when: PR.PRPRESP = 'Y'
        then: PR.PROCCUR
      - otherwise: "'Y'"
    _PHASEN: ADSL.PHASEN
    _FAOBJ_U: null
    _FATESTCD: null
    _FACAT: null
    _ISTESTCD: null
    _DSDECOD: null
    _MBTEST_U: null
    _MBMETHOD: null
    _PRTRT_U:
      str_case:
        source: PR.PRTRT
        to: upper
