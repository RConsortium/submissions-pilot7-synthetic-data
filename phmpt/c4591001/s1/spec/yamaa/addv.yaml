# ADDV for Pfizer/BioNTech C4591001, data cut S1 (125742).
# Parent: ../../../spec/yamaa/base/adam-base.yaml (section 3.1 core columns).
# ADSL-core columns are read from the submitted ADSL file
# (mapping input, key STUDYID/USUBJID; verify.py resolves it
# from --adam-dir). There is NO builder program in the set
# (ADRG section 7.1 lists addv-sas.txt, but no such .txt is in
# program/adam/), so the derivations implement the S1 define.xml
# (IG.ADDV) + ADRG section 5.2.6 as translated and validated in
# tools/addv_proto.py (exact match, 0 mismatched cells).
# First generated by tools/gen_addv_spec.py (retired); this file is the source.
yamaa: '1.0'
type: spec
model: ADaM
parent: ../../../spec/yamaa/base/adam-base.yaml
domain: ADDV
keys:
- STUDYID
- USUBJID
- DVSEQ
input:
  DV: <sdtm-dir>/dv.parquet
  SUPPDV: <sdtm-dir>/suppdv.parquet
  ADSL:
    path: <adam-dir>/adsl.parquet
    key:
    - STUDYID
    - USUBJID
submission:
  label: Protocol Deviations Analysis Dataset
  class: OCCURRENCE DATA STRUCTURE
  structure: One record per protocol deviation
  repeating: true
rows:
- id: deviations
  dataset: DV
intermediates:
- id: _SUPPDV
  dataset: SUPPDV
  key:
    USUBJID: DV.USUBJID
    _DVSEQ: DV.DVSEQ
  filter: SUPPDV.QNAM IN ('ACTSITE', 'CAPE', 'DESGTOR', 'DVTERM1')
  pivot:
    name: QNAM
    value: QVAL
    fields:
    - ACTSITE
    - CAPE
    - DESGTOR
    - DVTERM1
  derivations:
    _DVSEQ:
      type: int
      derivation: SUPPDV.IDVARVAL
output:
  path: <adam-dir>/addv-yamaa.parquet
  order_by:
  - USUBJID
  - DVSEQ
  columns:
  - STUDYID
  - USUBJID
  - DOMAIN
  - SUBJID
  - SITEID
  - AGE
  - SEX
  - RACE
  - TRTSDT
  - TRTEDT
  - ARM
  - ARMCD
  - ACTARM
  - ACTARMCD
  - TRT01P
  - TRT01A
  - TRT01PN
  - TRT01AN
  - AGEGR1
  - AGEGR1N
  - DVSEQ
  - DVSPID
  - DVTERM
  - DVTERM1
  - DVDECOD
  - EPOCH
  - ACTSITE
  - DESGTOR
  - CAPE
  - DVCAT
  - DVSTDTC
  - DVSTDY
  - ASTDT
  - PREFL
  - TRPFL
  - RANDFL
  - PHASE
  - PHASEN
  - COHORT
  - COHORTN
  - DOSALVL
  - DOSALVLN
  - DOSPLVL
  - DOSPLVLN
  - DS3KFL
  - AGEGR3N
  - AGEGR3
  - AGEGR4N
  - AGEGR4
  - HIVFL
  - AGETR01
  - TRTSDTM
  - TRTEDTM
  - TR01SDTM
  - TR01EDTM
  - TR02SDTM
  - TR02EDTM
  - VAX101
  - VAX102
  - VAX10U
  - VAX201
  - VAX202
  - VAX20U
  - VAX20UDT
  - UNBLNDDT
  - MULENRFL
  - RAND1FL
