- name: _FATEST_UP
  type: str
  derivation:
    str_case:
      source: FATEST
      to: upper
- name: _PARAM_RAW
  type: str
  derivation:
    case:
    - when: (_ROWKIND = 'MEDDUR')
      then: "'Medications Duration'"
    - when: (_FATEST_UP = 'DIAMETER' OR (FAEVAL = 'INVESTIGATOR' AND FATESTCD IN ('MAXDIAM',
        'MINDIAM')))
      then:
        str_template:
          template: '{FAOBJ} {FATEST} cm'
          missing: ''
    - when: (FASTRESU IS NULL)
      then:
        str_template:
          template: '{FAOBJ} {FATEST}'
          missing: ''
    - otherwise:
        str_template:
          template: '{FAOBJ} {FATEST} {FASTRESU}'
          missing: ''
- name: _CNTMISS
  type: int
  derivation:
    aggregate:
      group_by:
      - USUBJID
      - FAOBJ
      - ATPTREF
      expr: COUNT(USUBJID)
      filter: FATESTCD = 'DIAMETER' AND _AVAL_RAW IS NULL
- name: _CNTMISSZERO
  type: int
  derivation:
    aggregate:
      group_by:
      - USUBJID
      - FAOBJ
      - ATPTREF
      expr: COUNT(USUBJID)
      filter: FATESTCD = 'DIAMETER' AND (_AVAL_RAW IS NULL OR _AVAL_RAW = 0)
- name: _OVR
  type: float
  derivation:
    case:
    - when: (_CNTMISSZERO = 7)
      then: 0
    - when: (_CNTMISS = 7)
      then: null
    - otherwise: _AVAL_RAW
- name: _SEV_OVR
  type: float
  derivation:
    case:
    - when: (FASTAT IS NULL OR FASTAT <> 'NOT DONE') AND _OVR >= 0 AND _OVR < 2.5
      then: 0
    - when: (FASTAT IS NULL OR FASTAT <> 'NOT DONE') AND _OVR >= 2.5 AND _OVR <= 5
      then: 1
    - when: (FASTAT IS NULL OR FASTAT <> 'NOT DONE') AND _OVR > 5 AND _OVR <= 10
      then: 2
    - when: (FASTAT IS NULL OR FASTAT <> 'NOT DONE') AND _OVR > 10
      then: 3
- name: _MEDAVAL
  type: int
  derivation:
    diff:
      type: date
      start: _startmed
      end: _stopmed
      unit: day
- name: _CAPAVAL
  type: int
  derivation:
    diff:
      type: date
      start: _startmed
      end: ADSL.VAX102DT
      unit: day
- name: _CAP
  type: int
  derivation:
    case:
    - when: (ATPTREF = 'VACCINATION 1' AND ADSL.VAX102DT IS NOT NULL AND _ROWKIND
        = 'MEDDUR' AND _startmed IS NOT NULL AND _LASTATPTN IS NULL AND (_stopmed
        > ADSL.VAX102DT OR ((_stopmedc IS NULL OR _stopmedc = '') AND _ongo = 'Y')))
      then: 1
    - otherwise: 0
- name: _AVALC_MEDDUR
  type: str
  derivation:
