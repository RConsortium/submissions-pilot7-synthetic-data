    FAOBJ: FACE_D._FAOBJ
    _PARCAT1_RAW: FACE_D.FACAT
    PARCAT2: FACE_D.FASCAT
    FAEVAL: "''"
    AVISITN: FACE_D.VISITNUM
    _AVISIT_RAW: FACE_D.VISIT
    ATPTREF: FACE_D._ATPTREF
    EXDOSE: FACE_D._EXDOSE
    EXTRT: FACE_D._EXTRT
    EXDOSU: FACE_D._EXDOSU
    EXSTDTC: FACE_D._EXSTDTC
    EXENDTC: FACE_D._EXENDTC
    DTYPE: "'MAXIMUM'"
    FASTINT: "'P0H'"
    FAENINT: "'P7D'"
    _ATPT_RAW: "''"
    _ROWKIND: "'MAXSEV_S'"
    _AVAL_RAW: FACE_D._AVAL_SEV
- id: t_other_sys
  dataset: FACE_D
  filter: FACE_D.FASCAT = 'SYSTEMIC' AND FACE_D.FATESTCD <> 'SEV' AND FACE_D.FATESTCD
    <> 'REL' AND FACE_D._ATPTREF IS NOT NULL AND (FACE_D._DAYN IS NULL OR FACE_D._DAYN
    <= 7)
  derivations:
    STUDYID: FACE_D.STUDYID
    USUBJID: FACE_D.USUBJID
    SRCDOM: FACE_D._SRCDOM
    SRCSEQ: FACE_D._SRCSEQ
    FAGRPID: FACE_D.FAGRPID
    FALNKID: FACE_D.FALNKID
    FALNKGRP: FACE_D.FALNKGRP
    FATEST: FACE_D.FATEST
    FATESTCD: FACE_D.FATESTCD
    FAOBJ: FACE_D._FAOBJ
    _PARCAT1_RAW: FACE_D.FACAT
    PARCAT2: FACE_D.FASCAT
    FASTAT: FACE_D.FASTAT
    FAREASND: FACE_D.FAREASND
    FAEVAL: FACE_D.FAEVAL
    AVISITN: FACE_D.VISITNUM
    _AVISIT_RAW: FACE_D.VISIT
    ADT: FACE_D._ADT
    ADY: FACE_D._FADY
    ATPTREF: FACE_D._ATPTREF
    FAEVINTX: FACE_D.FAEVINTX
    EXDOSE: FACE_D._EXDOSE
    EXTRT: FACE_D._EXTRT
    EXDOSU: FACE_D._EXDOSU
    EXSTDTC: FACE_D._EXSTDTC
    EXENDTC: FACE_D._EXENDTC
    CLTYP: FACE_D._CLTYP
    CUTUNBFL: FACE_D.CUTUNBFL
    FADTC: FACE_D.FADTC
    _TOD: FACE_D._TOD
    ATPTN: FACE_D._ATPTN
    _ATPT_RAW: FACE_D._ATPT
    _AVAL_RAW: FACE_D._AVAL_RAW
    _AVALC_RAW: FACE_D._AVALC_RAW
    FASTRESU: FACE_D.FASTRESU
    _ROWKIND: "'OTHER_SYS'"
- id: t_meddurs
  dataset: FACE_D
  group_by:
  - FACE_D.USUBJID
  - FACE_D._ATPTREF
  - FACE_D._FAOBJ
  filter: _EMIT = 1
  derivations:
    _STUDYID_S:
      aggregate:
        expr: MIN(FACE_D.STUDYID)
    STUDYID: _STUDYID_S
    USUBJID: FACE_D.USUBJID
    ATPTREF: FACE_D._ATPTREF
    FAOBJ: FACE_D._FAOBJ
    FATESTCD: "''"
    _ROWKIND: "'MEDDUR'"
    _FATESTCD:
      aggregate:
        expr: MIN(FACE_D.FATESTCD)
        filter: (FACE_D._FAOBJ = 'MEDICATIONS' AND FACE_D.FATESTCD IN ('FEVMEDGI',
          'PAIMEDGI', 'MEDTRTGI', 'MEDTFVPN') AND FACE_D.FAEVAL IN ('STUDY SUBJECT',
          'CAREGIVER', 'HEALTHCARE PROFESSIONAL') AND FACE_D.FASTRESC = 'Y' AND (FACE_D.CUTUNBFL
          IS NULL OR FACE_D.CUTUNBFL <> 'Y'))
    _startmed:
      aggregate:
        expr: MIN(FACE_D._ADT)
        filter: (FACE_D._FAOBJ = 'MEDICATIONS' AND FACE_D.FATESTCD IN ('FEVMEDGI',
          'PAIMEDGI', 'MEDTRTGI', 'MEDTFVPN') AND FACE_D.FAEVAL IN ('STUDY SUBJECT',
          'CAREGIVER', 'HEALTHCARE PROFESSIONAL') AND FACE_D.FASTRESC = 'Y' AND (FACE_D.CUTUNBFL
          IS NULL OR FACE_D.CUTUNBFL <> 'Y'))
    _MAXATPTN:
      aggregate:
        expr: MAX(FACE_D._ATPTN)
        filter: (FACE_D._FAOBJ = 'MEDICATIONS' AND FACE_D.FATESTCD IN ('FEVMEDGI',
          'PAIMEDGI', 'MEDTRTGI', 'MEDTFVPN') AND FACE_D.FAEVAL IN ('STUDY SUBJECT',
          'CAREGIVER', 'HEALTHCARE PROFESSIONAL') AND FACE_D.FASTRESC = 'Y' AND (FACE_D.CUTUNBFL
          IS NULL OR FACE_D.CUTUNBFL <> 'Y'))
    _MAXADT:
      aggregate:
        expr: MAX(FACE_D._ADT)
        filter: (FACE_D._FAOBJ = 'MEDICATIONS' AND FACE_D.FATESTCD IN ('FEVMEDGI',
          'PAIMEDGI', 'MEDTRTGI', 'MEDTFVPN') AND FACE_D.FAEVAL IN ('STUDY SUBJECT',
          'CAREGIVER', 'HEALTHCARE PROFESSIONAL') AND FACE_D.FASTRESC = 'Y' AND (FACE_D.CUTUNBFL
          IS NULL OR FACE_D.CUTUNBFL <> 'Y'))
    _PARCAT1_S:
      aggregate:
        expr: MIN(FACE_D.FACAT)
        filter: (FACE_D._FAOBJ = 'MEDICATIONS' AND FACE_D.FATESTCD IN ('FEVMEDGI',
          'PAIMEDGI', 'MEDTRTGI', 'MEDTFVPN') AND FACE_D.FAEVAL IN ('STUDY SUBJECT',
          'CAREGIVER', 'HEALTHCARE PROFESSIONAL') AND FACE_D.FASTRESC = 'Y' AND (FACE_D.CUTUNBFL
          IS NULL OR FACE_D.CUTUNBFL <> 'Y'))
    _PARCAT2_S:
      aggregate:
        expr: MIN(FACE_D.FASCAT)
        filter: (FACE_D._FAOBJ = 'MEDICATIONS' AND FACE_D.FATESTCD IN ('FEVMEDGI',
          'PAIMEDGI', 'MEDTRTGI', 'MEDTFVPN') AND FACE_D.FAEVAL IN ('STUDY SUBJECT',
          'CAREGIVER', 'HEALTHCARE PROFESSIONAL') AND FACE_D.FASTRESC = 'Y' AND (FACE_D.CUTUNBFL
          IS NULL OR FACE_D.CUTUNBFL <> 'Y'))
    _AVISIT_S:
      aggregate:
        expr: MIN(FACE_D.VISIT)
        filter: (FACE_D._FAOBJ = 'MEDICATIONS' AND FACE_D.FATESTCD IN ('FEVMEDGI',
          'PAIMEDGI', 'MEDTRTGI', 'MEDTFVPN') AND FACE_D.FAEVAL IN ('STUDY SUBJECT',
          'CAREGIVER', 'HEALTHCARE PROFESSIONAL') AND FACE_D.FASTRESC = 'Y' AND (FACE_D.CUTUNBFL
          IS NULL OR FACE_D.CUTUNBFL <> 'Y'))
    _AVISITN_MIN:
      aggregate:
        expr: MIN(FACE_D.VISITNUM)
        filter: (FACE_D._FAOBJ = 'MEDICATIONS' AND FACE_D.FATESTCD IN ('FEVMEDGI',
          'PAIMEDGI', 'MEDTRTGI', 'MEDTFVPN') AND FACE_D.FAEVAL IN ('STUDY SUBJECT',
          'CAREGIVER', 'HEALTHCARE PROFESSIONAL') AND FACE_D.FASTRESC = 'Y' AND (FACE_D.CUTUNBFL
          IS NULL OR FACE_D.CUTUNBFL <> 'Y'))
    _EXDOSE_S:
      aggregate:
        expr: MIN(FACE_D._EXDOSE)
        filter: (FACE_D._FAOBJ = 'MEDICATIONS' AND FACE_D.FATESTCD IN ('FEVMEDGI',
          'PAIMEDGI', 'MEDTRTGI', 'MEDTFVPN') AND FACE_D.FAEVAL IN ('STUDY SUBJECT',
          'CAREGIVER', 'HEALTHCARE PROFESSIONAL') AND FACE_D.FASTRESC = 'Y' AND (FACE_D.CUTUNBFL
          IS NULL OR FACE_D.CUTUNBFL <> 'Y'))
    _EXTRT_S:
      aggregate:
        expr: MIN(FACE_D._EXTRT)
        filter: (FACE_D._FAOBJ = 'MEDICATIONS' AND FACE_D.FATESTCD IN ('FEVMEDGI',
          'PAIMEDGI', 'MEDTRTGI', 'MEDTFVPN') AND FACE_D.FAEVAL IN ('STUDY SUBJECT',
          'CAREGIVER', 'HEALTHCARE PROFESSIONAL') AND FACE_D.FASTRESC = 'Y' AND (FACE_D.CUTUNBFL
          IS NULL OR FACE_D.CUTUNBFL <> 'Y'))
    _EXDOSU_S:
      aggregate:
        expr: MIN(FACE_D._EXDOSU)
        filter: (FACE_D._FAOBJ = 'MEDICATIONS' AND FACE_D.FATESTCD IN ('FEVMEDGI',
          'PAIMEDGI', 'MEDTRTGI', 'MEDTFVPN') AND FACE_D.FAEVAL IN ('STUDY SUBJECT',
          'CAREGIVER', 'HEALTHCARE PROFESSIONAL') AND FACE_D.FASTRESC = 'Y' AND (FACE_D.CUTUNBFL
          IS NULL OR FACE_D.CUTUNBFL <> 'Y'))
    _EXSTDTC_S:
      aggregate:
        expr: MIN(FACE_D._EXSTDTC)
        filter: (FACE_D._FAOBJ = 'MEDICATIONS' AND FACE_D.FATESTCD IN ('FEVMEDGI',
          'PAIMEDGI', 'MEDTRTGI', 'MEDTFVPN') AND FACE_D.FAEVAL IN ('STUDY SUBJECT',
          'CAREGIVER', 'HEALTHCARE PROFESSIONAL') AND FACE_D.FASTRESC = 'Y' AND (FACE_D.CUTUNBFL
          IS NULL OR FACE_D.CUTUNBFL <> 'Y'))
    _EXENDTC_S:
      aggregate:
        expr: MIN(FACE_D._EXENDTC)
        filter: (FACE_D._FAOBJ = 'MEDICATIONS' AND FACE_D.FATESTCD IN ('FEVMEDGI',
          'PAIMEDGI', 'MEDTRTGI', 'MEDTFVPN') AND FACE_D.FAEVAL IN ('STUDY SUBJECT',
          'CAREGIVER', 'HEALTHCARE PROFESSIONAL') AND FACE_D.FASTRESC = 'Y' AND (FACE_D.CUTUNBFL
          IS NULL OR FACE_D.CUTUNBFL <> 'Y'))
    _CNT_NONCUT:
      aggregate:
        expr: COUNT(FACE_D.USUBJID)
        filter: (FACE_D._FAOBJ = 'MEDICATIONS' AND FACE_D.FATESTCD IN ('FEVMEDGI',
          'PAIMEDGI', 'MEDTRTGI', 'MEDTFVPN') AND FACE_D.FAEVAL IN ('STUDY SUBJECT',
          'CAREGIVER', 'HEALTHCARE PROFESSIONAL') AND FACE_D.FASTRESC = 'Y' AND (FACE_D.CUTUNBFL
          IS NULL OR FACE_D.CUTUNBFL <> 'Y'))
    _LASTATPTN_AGG:
      aggregate:
        expr: MAX(FACE_D._ATPTN)
        filter: (FACE_D.FATESTCD IN ('FEVMEDGI', 'PAIMEDGI', 'MEDTRTGI', 'MEDTFVPN')
          AND FACE_D.FASTAT IS NULL)
    _CNT_ENDDS:
      aggregate:
        expr: COUNT(FACE_D.USUBJID)
        filter: (FACE_D.FAEVAL = 'INVESTIGATOR' AND FACE_D.FATESTCD IN ('STPDMEDP',
          'STPDFEV', 'STPDPAIN', 'STPDMEDT') AND FACE_D.FASTAT IS NULL AND (FACE_D._DAYN
          IS NULL OR FACE_D._DAYN <= 7))
    _stopmedc:
      aggregate:
        expr: MAX(FACE_D.FASTRESC)
        filter: (FACE_D.FAEVAL = 'INVESTIGATOR' AND FACE_D.FATESTCD IN ('STPDMEDP',
          'STPDFEV', 'STPDPAIN', 'STPDMEDT') AND FACE_D.FASTAT IS NULL AND (FACE_D._DAYN
          IS NULL OR FACE_D._DAYN <= 7))
    _PARCAT1_ENDDS:
      aggregate:
        expr: MIN(FACE_D.FACAT)
        filter: (FACE_D.FAEVAL = 'INVESTIGATOR' AND FACE_D.FATESTCD IN ('STPDMEDP',
          'STPDFEV', 'STPDPAIN', 'STPDMEDT') AND FACE_D.FASTAT IS NULL AND (FACE_D._DAYN
          IS NULL OR FACE_D._DAYN <= 7))
    _PARCAT2_ENDDS:
      aggregate:
        expr: MIN(FACE_D.FASCAT)
        filter: (FACE_D.FAEVAL = 'INVESTIGATOR' AND FACE_D.FATESTCD IN ('STPDMEDP',
          'STPDFEV', 'STPDPAIN', 'STPDMEDT') AND FACE_D.FASTAT IS NULL AND (FACE_D._DAYN
          IS NULL OR FACE_D._DAYN <= 7))
    _ongo:
      aggregate:
        expr: MAX(FACE_D.FASTRESC)
        filter: (FACE_D.FAEVAL = 'INVESTIGATOR' AND FACE_D.FATESTCD = 'MEDTFVPN' AND
          FACE_D.FASTRESC = 'Y' AND (FACE_D.CUTUNBFL IS NULL OR FACE_D.CUTUNBFL <>
          'Y') AND (FACE_D._DAYN IS NULL OR FACE_D._DAYN <= 7))
    _EMIT:
      case:
      - when: (_CNT_NONCUT IS NULL OR _CNT_NONCUT = 0)
        then: 0
      - when: ((_MAXATPTN IS NULL AND _LASTATPTN_AGG IS NULL) OR (_MAXATPTN IS NOT
          NULL AND _LASTATPTN_AGG IS NOT NULL AND _MAXATPTN <= _LASTATPTN_AGG))
        then: 1
      - otherwise: 0
    _STOPMED_START:
      case:
      - when: (_MAXATPTN IS NOT NULL AND _LASTATPTN_AGG IS NOT NULL AND _MAXATPTN
          < _LASTATPTN_AGG)
        then: _MAXADT
    _HAS_ENDDS:
      case:
      - when: _CNT_ENDDS > 0
        then: 1
      - otherwise: 0
    _stopmed:
      case:
      - when: _HAS_ENDDS = 1
        then:
          to_date:
            source: _stopmedc
      - otherwise: _STOPMED_START
    _PARCAT1_RAW:
      case:
      - when: _HAS_ENDDS = 1
        then: _PARCAT1_ENDDS
      - otherwise: _PARCAT1_S
    PARCAT2:
      case:
      - when: _HAS_ENDDS = 1
        then: _PARCAT2_ENDDS
      - otherwise: _PARCAT2_S
    _LASTATPTN:
      case:
      - when: _HAS_ENDDS = 1
        then: null
      - otherwise: _LASTATPTN_AGG
    EXTRT: _EXTRT_S
    _AVISIT_RAW: _AVISIT_S
    AVISITN: _AVISITN_MIN
    EXDOSE: _EXDOSE_S
    EXDOSU: _EXDOSU_S
    EXSTDTC: _EXSTDTC_S
    EXENDTC: _EXENDTC_S
    FAEVAL: "''"
    _ATPT_RAW: "''"
intermediates:
- id: SUPPFACE_P
  dataset: SUPPFACE
  key:
    STUDYID: FACE.STUDYID
    USUBJID: FACE.USUBJID
    _FASEQ: FACE.FASEQ
  filter: SUPPFACE.QNAM = 'CLTYP' AND SUPPFACE.IDVAR = 'FASEQ'
  pivot:
    name: QNAM
    value: QVAL
    fields:
    - CLTYP
  derivations:
    _FASEQ:
      type: int
      derivation: SUPPFACE.IDVARVAL
      unconvertible: null
- id: SUPPVS_P
  dataset: SUPPVS
  key:
    STUDYID: VS.STUDYID
    USUBJID: VS.USUBJID
    _VSSEQ: VS.VSSEQ
  filter: SUPPVS.QNAM = 'CLTYP' AND SUPPVS.IDVAR = 'VSSEQ'
  pivot:
    name: QNAM
    value: QVAL
    fields:
    - CLTYP
  derivations:
    _VSSEQ:
      type: int
      derivation: SUPPVS.IDVARVAL
      unconvertible: null
- id: ADSL_R
  dataset: ADSL
  key:
    STUDYID: STUDYID
    USUBJID: USUBJID
  order_by:
  - ADSL.USUBJID
  keep: first
  derivations:
    _UNBLNDDT:
      type: date
      derivation: ADSL.UNBLNDDT
- id: EX_R
  dataset: EX
  key:
    USUBJID: USUBJID
    EXLNKGRP: _ATPTREF
  order_by:
  - EX.EXSTDTC
  keep: first
  derivations:
    _EXDOSE:
      type: float
      derivation: EX.EXDOSE
    _EXTRT:
      type: str
      derivation: EX.EXTRT
    _EXDOSU:
      type: str
      derivation: EX.EXDOSU
    _EXSTDTC:
      type: str
      derivation: EX.EXSTDTC
    _EXENDTC:
      type: str
      derivation: EX.EXENDTC
- id: FACE_DATE
  dataset: FACE
  key:
    USUBJID: USUBJID
    _DT: _VSDT
  filter: FACE.FACAT IN ('REACTOGENICITY EVENT', 'REACTOGENICITY', 'REACTOGENICITY
    - UNPLANNED ASSESSMENT') AND FACE.FADTC IS NOT NULL
  order_by:
  - variable: FACE.FATPTREF
    direction: desc
  keep: first
  derivations:
    _DT:
      type: date
      derivation:
        to_date:
          source: FACE.FADTC
- id: FACE_D
  dataset: FACE
  filter: FACE.FACAT IN ('REACTOGENICITY EVENT', 'REACTOGENICITY', 'REACTOGENICITY
    - UNPLANNED ASSESSMENT')
  derivations:
    _FAOBJ:
      type: str
      derivation:
        str_case:
          source: FACE.FAOBJ
          to: upper
    _ATPTREF:
      type: str
      derivation: FACE.FATPTREF
    _CLTYP:
      type: str
      derivation: SUPPFACE_P.CLTYP
    _EXDOSE:
      type: float
      derivation: EX_R._EXDOSE
    _EXTRT:
      type: str
      derivation: EX_R._EXTRT
    _EXDOSU:
      type: str
      derivation: EX_R._EXDOSU
    _EXSTDTC:
      type: str
      derivation: EX_R._EXSTDTC
    _EXENDTC:
      type: str
      derivation: EX_R._EXENDTC
    _EXDT:
      type: date
      derivation:
        to_date:
          source: _EXSTDTC
    _ADT:
      type: date
      derivation:
        to_date:
          source: FACE.FADTC
    _FADTM:
      type: datetime
      derivation:
        impute:
          type: datetime
          source: FACE.FADTC
          time: first
    _TOD:
      type: int
      derivation:
        time_of_day:
          source: _FADTM
    _DAYDIFF:
      type: int
      derivation:
        diff:
          type: date
          start: _EXDT
          end: _ADT
          unit: day
    _DAYN:
      type: int
      derivation:
        case:
        - when: FACE.FATPT IS NULL AND FACE.FAEVAL = 'INVESTIGATOR' AND _FAOBJ <>
            'MEDICATIONS'
          then: _DAYDIFF + 1
    _DAYN_S:
      type: str
      derivation: _DAYN
    _ATPT:
      type: str
      derivation:
        case:
        - when: _DAYN IS NOT NULL
          then:
            str_template:
              template: DAY {_DAYN_S}
              missing: ''
        - when: FACE.FATPT IS NULL AND FACE.FAEVAL = 'INVESTIGATOR' AND _FAOBJ <>
            'MEDICATIONS'
          then: "''"
        - otherwise: FACE.FATPT
    _ATPTN:
      type: int
      derivation:
        case:
        - when: _ATPT = ''
          then: null
        - otherwise:
            str_extract:
              source: _ATPT
              pattern: ^DAY ([0-9]+)$
              group: 1
      unconvertible: null
    _FADY:
      type: int
      derivation: FACE.FADY
    _AVAL_RAW:
      type: float
      derivation: FACE.FASTRESN
    _AVALC_RAW:
      type: str
      derivation:
        case:
        - when: FACE.FASTRESC = 'POTENTIALLY LIFE THREATENING'
          then: "'GRADE 4'"
        - otherwise: FACE.FASTRESC
    _AVALC_UP:
      type: str
      derivation:
        str_case:
          source: _AVALC_RAW
          to: upper
    _AVAL_SEV:
      type: float
      derivation:
        case:
        - when: _AVALC_RAW IS NULL
          then: null
        - when: _AVALC_UP = 'NONE'
          then: 0
        - when: _AVALC_UP = 'MILD'
          then: 1
        - when: _AVALC_UP = 'MODERATE'
          then: 2
        - when: _AVALC_UP = 'SEVERE'
          then: 3
        - when: _AVALC_UP = 'GRADE 4'
          then: 4
        - otherwise: _AVAL_RAW
    CUTUNBFL:
      type: str
      derivation:
        case:
        - when: (_ADT IS NOT NULL AND ADSL_R._UNBLNDDT IS NOT NULL AND _ADT >= ADSL_R._UNBLNDDT)
          then: "'Y'"
        - otherwise: "''"
    _SRCDOM:
      type: str
      derivation: FACE.DOMAIN
    _SRCSEQ:
      type: int
      derivation: FACE.FASEQ
- id: VS_D
  dataset: VS
  filter: VS.VSCAT IN ('REACTOGENICITY', 'REACTOGENICITY EVENT', 'REACTOGENICITY -
    UNPLANNED TEMPERATURE', 'UNPLANNED TEMPERATURE') AND VS.VSTESTCD = 'TEMP' AND
    (VS.VSEVAL = 'STUDY SUBJECT' OR (VS.VSEVAL = 'INVESTIGATOR' AND VS.VISIT IS NULL))
  derivations:
    _VSDT:
      type: date
      derivation:
        to_date:
          source: VS.VSDTC
    _VSDTM:
      type: datetime
      derivation:
        impute:
          type: datetime
          source: VS.VSDTC
          time: first
    _TOD:
      type: int
      derivation:
        time_of_day:
          source: _VSDTM
    _VSDTC_LEN:
      type: int
      derivation:
        str_length:
          source: VS.VSDTC
    _ATPTREF:
      type: str
      derivation:
        case:
        - when: VS.VSEVAL = 'STUDY SUBJECT'
          then: VS.VSTPTREF
        - when: VS.VSEVAL = 'INVESTIGATOR' AND _VSDTC_LEN <= 10
          then: FACE_DATE.FATPTREF
    _FALNKGRP_RAW:
      type: str
      derivation:
        case:
        - when: (VS.VSEVAL = 'INVESTIGATOR' AND _ATPTREF IS NOT NULL)
          then:
            str_template:
              template: '{_ATPTREF}-FEVER'
              missing: ''
        - otherwise: VS.VSLNKGRP
    _FALNKGRP:
      type: str
      derivation:
        str_case:
          source: _FALNKGRP_RAW
          to: upper
    _FALNKID_RAW:
      type: str
      derivation:
        case:
        - when: (VS.VSEVAL = 'INVESTIGATOR' AND _ATPTREF IS NOT NULL)
          then:
            str_template:
              template: '{_ATPTREF}-FEVER'
              missing: ''
        - otherwise: VS.VSLNKID
    _FALNKID:
      type: str
      derivation:
        str_case:
          source: _FALNKID_RAW
          to: upper
    _FAGRPID_RAW:
      type: str
      derivation:
        case:
        - when: _ATPTREF IS NOT NULL
          then:
            str_template:
              template: '{_ATPTREF}-SYSTEMIC'
              missing: ''
        - otherwise: "''"
    _FAGRPID:
      type: str
      derivation:
        str_case:
          source: _FAGRPID_RAW
          to: upper
    _FACAT:
      type: str
      derivation:
        case:
        - when: (VS.VSEVAL = 'INVESTIGATOR' AND _ATPTREF IS NOT NULL)
          then: "'REACTOGENICITY - UNPLANNED ASSESSMENT'"
        - otherwise: VS.VSCAT
    _FATPT:
      type: str
      derivation: VS.VSTPT
    _FADTC:
      type: str
      derivation: VS.VSDTC
    _FADY:
      type: int
      derivation: VS.VSDY
    _FASTAT:
      type: str
      derivation: VS.VSSTAT
    _FAREASND:
      type: str
      derivation: VS.VSREASND
    _FAEVINTX:
      type: str
      derivation: VS.VSEVINTX
    _FAEVAL:
      type: str
      derivation: VS.VSEVAL
    _FASCAT:
      type: str
      derivation: "'SYSTEMIC'"
    _FAOBJ:
      type: str
      derivation: "'FEVER'"
    _FATESTCD:
      type: str
      derivation: "'OCCUR'"
    _FATEST:
      type: str
      derivation: "'Occurrence Indicator'"
    _FASTRESC:
      type: str
      derivation:
        case:
        - when: VS.VSSTRESN IS NULL
          then: "''"
        - when: VS.VSSTRESN > 42
          then: "''"
        - when: VS.VSSTRESN < 38
          then: "'N'"
        - otherwise: "'Y'"
    _VSORRES:
      type: str
      derivation: VS.VSORRES
    _VSORRESU:
      type: str
      derivation: VS.VSORRESU
    _VSSTRESN:
      type: float
      derivation: VS.VSSTRESN
    _VSSTRESU:
      type: str
      derivation: VS.VSSTRESU
    _VSORRESN:
      type: float
      derivation: VS.VSORRES
      unconvertible: null
    _FTEMCAT_RAW:
      type: str
      derivation:
        case:
        - when: VS.VSORRESU = 'F' AND _VSORRESN < 100.4
          then: "'<38.0 C'"
        - when: VS.VSORRESU = 'F' AND _VSORRESN >= 100.4 AND _VSORRESN <= 101.1
          then: "'38.0 C to 38.4 C'"
        - when: VS.VSORRESU = 'F' AND _VSORRESN >= 101.2 AND _VSORRESN <= 102.0
          then: "'>38.4 C to 38.9 C'"
        - when: VS.VSORRESU = 'F' AND _VSORRESN >= 102.1 AND _VSORRESN <= 104.0
          then: "'>38.9 C to 40.0 C'"
        - when: VS.VSORRESU = 'F' AND _VSORRESN > 104.0
          then: "'>40.0 C'"
        - when: VS.VSORRESU = 'C' AND _VSORRESN < 38
          then: "'<38.0 C'"
        - when: VS.VSORRESU = 'C' AND _VSORRESN >= 38 AND _VSORRESN <= 38.4
          then: "'38.0 C to 38.4 C'"
        - when: VS.VSORRESU = 'C' AND _VSORRESN > 38.4 AND _VSORRESN <= 38.9
          then: "'>38.4 C to 38.9 C'"
        - when: VS.VSORRESU = 'C' AND _VSORRESN > 38.9 AND _VSORRESN <= 40
          then: "'>38.9 C to 40.0 C'"
        - when: VS.VSORRESU = 'C' AND _VSORRESN > 40
          then: "'>40.0 C'"
        - otherwise: "''"
    _FTEMCATN:
      type: int
      derivation:
        case:
        - when: VS.VSSTRESU = 'C' AND VS.VSSTRESN > 42
          then: null
        - otherwise:
            mapping:
              source: _FTEMCAT_RAW
              dict:
                <38.0 C: 0
                38.0 C to 38.4 C: 1
                '>38.4 C to 38.9 C': 2
                '>38.9 C to 40.0 C': 3
                '>40.0 C': 4
              unmapped: null
    _FTEMCAT:
      type: str
      derivation:
        case:
        - when: VS.VSSTRESN IS NULL AND VS.VSSTAT IS NULL
          then: "'Missing'"
        - when: VS.VSSTRESU = 'C' AND VS.VSSTRESN > 42
          then: "'Missing'"
        - otherwise: _FTEMCAT_RAW
    _EXDOSE:
      type: float
      derivation: EX_R._EXDOSE
    _EXTRT:
      type: str
      derivation: EX_R._EXTRT
    _EXDOSU:
      type: str
      derivation: EX_R._EXDOSU
    _EXSTDTC:
      type: str
      derivation: EX_R._EXSTDTC
    _EXENDTC:
      type: str
      derivation: EX_R._EXENDTC
    _EXDT:
      type: date
      derivation:
        to_date:
          source: _EXSTDTC
    _ADT:
      type: date
      derivation:
        to_date:
          source: _FADTC
    _DAYDIFF:
      type: int
      derivation:
        diff:
          type: date
          start: _EXDT
          end: _ADT
          unit: day
    _DAYN:
      type: int
      derivation:
        case:
        - when: _FATPT IS NULL AND _FAEVAL = 'INVESTIGATOR' AND _FAOBJ <> 'MEDICATIONS'
          then: _DAYDIFF + 1
    _DAYN_S:
      type: str
      derivation: _DAYN
    _ATPT:
      type: str
      derivation:
        case:
        - when: _DAYN IS NOT NULL
          then:
            str_template:
              template: DAY {_DAYN_S}
              missing: ''
        - when: _FATPT IS NULL AND _FAEVAL = 'INVESTIGATOR' AND _FAOBJ <> 'MEDICATIONS'
          then: "''"
        - otherwise: _FATPT
    _ATPTN:
      type: int
      derivation:
        case:
        - when: _ATPT = ''
          then: null
        - otherwise:
            str_extract:
              source: _ATPT
              pattern: ^DAY ([0-9]+)$
              group: 1
      unconvertible: null
    _AVALC_RAW:
      type: str
      derivation: _FASTRESC
    _AVALC_UP:
      type: str
      derivation:
        str_case:
          source: _AVALC_RAW
          to: upper
    CUTUNBFL:
      type: str
      derivation:
        case:
        - when: (_ADT IS NOT NULL AND ADSL_R._UNBLNDDT IS NOT NULL AND _ADT >= ADSL_R._UNBLNDDT)
          then: "'Y'"
        - otherwise: "''"
    _SRCDOM:
      type: str
      derivation: VS.DOMAIN
    _SRCSEQ:
      type: int
      derivation: VS.VSSEQ
    _CLTYP:
      type: str
      derivation: SUPPVS_P.CLTYP
- id: WIN_MAXDIAM
  dataset: FACE_D
  key:
    USUBJID: USUBJID
    FAOBJ: FAOBJ
    FATPTREF: ATPTREF
  filter: FACE_D._FAOBJ IN ('REDNESS', 'SWELLING') AND FACE_D.FATESTCD IN ('DIAMETER',
    'MAXDIAM') AND (FACE_D.FASCAT IS NULL OR FACE_D.FASCAT <> 'SYSTEMIC') AND FACE_D._AVAL_RAW
    IS NOT NULL AND (FACE_D._DAYN IS NULL OR FACE_D._DAYN <= 7)
  order_by:
  - variable: FACE_D._AVAL_RAW
    direction: desc
  - variable: FACE_D.FACAT
  keep: first
- id: WIN_MAXSEV_L
  dataset: FACE_D
  key:
    USUBJID: USUBJID
    FAOBJ: FAOBJ
    FATPTREF: ATPTREF
  filter: NOT FACE_D._FAOBJ IN ('REDNESS', 'SWELLING') AND FACE_D.FATESTCD = 'SEV'
    AND (FACE_D.FASCAT IS NULL OR FACE_D.FASCAT <> 'SYSTEMIC') AND (FACE_D.CUTUNBFL
    IS NULL OR FACE_D.CUTUNBFL <> 'Y') AND ((FACE_D._ATPTN >= 1 AND FACE_D._ATPTN
    <= 7) OR (FACE_D._ATPTN IS NULL AND FACE_D.FACAT = 'REACTOGENICITY - UNPLANNED
    ASSESSMENT')) AND FACE_D._AVAL_SEV IS NOT NULL
  order_by:
  - variable: FACE_D._AVAL_SEV
    direction: desc
  - variable: FACE_D.FACAT
  keep: first
- id: WIN_MAXTEMP
  dataset: VS_D
  key:
    USUBJID: USUBJID
    VSTPTREF: ATPTREF
  filter: VS_D._FAOBJ = 'FEVER' AND (VS_D._VSSTRESU IS NULL OR NOT (VS_D._VSSTRESU
    = 'C' AND VS_D._VSSTRESN > 42)) AND (VS_D.CUTUNBFL IS NULL OR VS_D.CUTUNBFL <>
    'Y') AND ((VS_D._ATPTN >= 1 AND VS_D._ATPTN <= 7) OR (VS_D._ATPTN IS NULL AND
    VS_D._FACAT = 'REACTOGENICITY - UNPLANNED ASSESSMENT')) AND VS_D._VSSTRESN IS
    NOT NULL
  order_by:
  - variable: VS_D._VSSTRESN
    direction: desc
  - variable: VS_D._FACAT
  keep: first
- id: WIN_MAXSEV_S
  dataset: FACE_D
  key:
    USUBJID: USUBJID
    FAOBJ: FAOBJ
    FATPTREF: ATPTREF
  filter: FACE_D.FASCAT = 'SYSTEMIC' AND FACE_D.FATESTCD = 'SEV' AND (FACE_D.CUTUNBFL
    IS NULL OR FACE_D.CUTUNBFL <> 'Y') AND ((FACE_D._ATPTN >= 1 AND FACE_D._ATPTN
    <= 7) OR (FACE_D._ATPTN IS NULL AND FACE_D.FACAT = 'REACTOGENICITY - UNPLANNED
    ASSESSMENT')) AND FACE_D._AVAL_SEV IS NOT NULL
  order_by:
  - variable: FACE_D._AVAL_SEV
    direction: desc
  - variable: FACE_D.FACAT
  keep: first
