yamaa: '1.0'
type: spec
model: ADaM
domain: ADFACEVD
keys:
- STUDYID
- USUBJID
- PARAMCD
- ATPTREF
- ATPT
- FATESTCD
- FAEVAL
- AVALC
input:
  FACE: <sdtm-dir>/face.parquet
  SUPPFACE: <sdtm-dir>/suppface.parquet
  VS: <sdtm-dir>/vs.parquet
  SUPPVS: <sdtm-dir>/suppvs.parquet
  EX: <sdtm-dir>/ex.parquet
  ADSL:
    path: <adam-dir>/adsl.parquet
    key:
    - STUDYID
    - USUBJID
rows:
- id: t_diam
  dataset: FACE_D
  filter: (FACE_D.FASCAT IS NULL OR FACE_D.FASCAT <> 'SYSTEMIC') AND FACE_D._FAOBJ
    IN ('REDNESS', 'SWELLING') AND FACE_D.FATESTCD IN ('DIAMETER', 'MAXDIAM') AND
    FACE_D._ATPTREF IS NOT NULL AND (FACE_D._DAYN IS NULL OR FACE_D._DAYN <= 7)
  derivations:
    STUDYID: FACE_D.STUDYID
    USUBJID: FACE_D.USUBJID
    SRCDOM: FACE_D._SRCDOM
    SRCSEQ: FACE_D._SRCSEQ
    FAGRPID: FACE_D.FAGRPID
    FALNKID: FACE_D.FALNKID
    FALNKGRP: FACE_D.FALNKGRP
    FATEST: FACE_D.FATEST
    FATESTCD: FACE_D.FATESTCD
    FAOBJ: FACE_D._FAOBJ
    _PARCAT1_RAW: FACE_D.FACAT
    PARCAT2: FACE_D.FASCAT
    FASTAT: FACE_D.FASTAT
    FAREASND: FACE_D.FAREASND
    FAEVAL: FACE_D.FAEVAL
    AVISITN: FACE_D.VISITNUM
    _AVISIT_RAW: FACE_D.VISIT
    ADT: FACE_D._ADT
    ADY: FACE_D._FADY
    ATPTREF: FACE_D._ATPTREF
    FAEVINTX: FACE_D.FAEVINTX
    EXDOSE: FACE_D._EXDOSE
    EXTRT: FACE_D._EXTRT
    EXDOSU: FACE_D._EXDOSU
    EXSTDTC: FACE_D._EXSTDTC
    EXENDTC: FACE_D._EXENDTC
    CLTYP: FACE_D._CLTYP
    CUTUNBFL: FACE_D.CUTUNBFL
    FADTC: FACE_D.FADTC
    _TOD: FACE_D._TOD
    ATPTN: FACE_D._ATPTN
    _ATPT_RAW: FACE_D._ATPT
    _AVAL_RAW: FACE_D._AVAL_RAW
    _AVALC_RAW: FACE_D._AVALC_RAW
    FASTRESU: FACE_D.FASTRESU
    _ROWKIND: "'DIAM'"
- id: t_maxdiam
  dataset: FACE_D
  filter: (FACE_D.FASCAT IS NULL OR FACE_D.FASCAT <> 'SYSTEMIC') AND FACE_D._FAOBJ
