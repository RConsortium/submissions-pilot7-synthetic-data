# ADCM for Pfizer/BioNTech C4591001, data cut S1 (125742).
# Parent: ../../../spec/yamaa/base/adam-base.yaml (section 3.1 core columns).
# ADSL-core columns are read from the submitted ADSL file
# (mapping input, key STUDYID/USUBJID; verify.py resolves it
# from --adam-dir). Derivations implement the submitted builder
# program adcm.sas (09Mar2021) as translated and validated in
# tools/adcm_proto.py (exact match, 0 mismatched cells, on the
# 111 non-dictionary columns). The 12 WHODRUG columns and the
# row multiplication they cause are NOT in this spec: WHO DDE
# v202003 is a licensed dictionary, not in the submission.
# First generated by tools/gen_adcm_spec.py (retired); this file is the source.
yamaa: '1.0'
type: spec
model: ADaM
parent: ../../../spec/yamaa/base/adam-base.yaml
domain: ADCM
keys:
- STUDYID
- USUBJID
- CMSEQ
input:
  CM: <sdtm-dir>/cm.parquet
  SUPPCM: <sdtm-dir>/suppcm.parquet
  ADSL:
    path: <adam-dir>/adsl.parquet
    key:
    - STUDYID
    - USUBJID
submission:
  label: Concomitant Medications Analysis Dataset
  class: OCCURRENCE DATA STRUCTURE
  structure: One record per concomitant medication record (pre-WHODRUG join; the submitted ADCM carries
    one row per WHODRUG ATC assignment, which this spec cannot reproduce -- see header)
  repeating: true
rows:
- id: base
  dataset: CM
  filter: NOT ((CM.CMTRT IS NULL OR CM.CMTRT = '') AND (CM.CMSTDTC IS NULL OR CM.CMSTDTC = ''))
intermediates:
- id: SUPPCM_P
  dataset: SUPPCM
  key:
  - STUDYID
  - USUBJID
  - CMSEQ
  filter: SUPPCM.QNAM IN ('CMCODE', 'DICTVER', 'CMCLAS1', 'CMCLAS2', 'CMCLSCD1', 'CMCLSCD2') AND SUPPCM.IDVAR
    = 'CMSEQ'
  pivot:
    name: QNAM
    value: QVAL
    fields:
    - CMCODE
    - DICTVER
    - CMCLAS1
    - CMCLAS2
    - CMCLSCD1
    - CMCLSCD2
  derivations:
    CMSEQ:
      type: int
      derivation: SUPPCM.IDVARVAL
- id: ADSL_R
  dataset: ADSL
  key:
  - STUDYID
  - USUBJID
  derivations:
    _TRTSDT:
      type: date
      derivation: ADSL.TRTSDT
    _TR01SDT:
      type: date
      derivation: ADSL.TR01SDT
    _TR01SDTM:
      type: datetime
      derivation: ADSL.TR01SDTM
    _TR01EDTM:
      type: datetime
      derivation: ADSL.TR01EDTM
    _TR02SDT:
      type: date
      derivation: ADSL.TR02SDT
    _TR02SDTM:
      type: datetime
      derivation: ADSL.TR02SDTM
    _TR02EDTM:
      type: datetime
      derivation: ADSL.TR02EDTM
    _VAX101DT:
      type: date
      derivation: ADSL.VAX101DT
    _VAX102DT:
      type: date
      derivation: ADSL.VAX102DT
    _VAX10UDT:
      type: date
      derivation: ADSL.VAX10UDT
    _VAX201DT:
      type: date
      derivation: ADSL.VAX201DT
    _VAX202DT:
      type: date
      derivation: ADSL.VAX202DT
    _V01DT:
      type: date
      derivation: ADSL.V01DT
    _V02DT:
      type: date
      derivation: ADSL.V02DT
    _V03DT:
      type: date
      derivation: ADSL.V03DT
    _V04DT:
      type: date
      derivation: ADSL.V04DT
    _UNBLNDDT:
      type: date
      derivation: ADSL.UNBLNDDT
    _AP01SDT:
      type: date
      derivation: ADSL.TR01SDT
    _AP01SDTM:
      type: datetime
      derivation: ADSL.TR01SDTM
    _TR02SDTM_M1S:
      type: datetime
      derivation:
        shift:
          type: datetime
          source: ADSL.TR02SDTM
          amount: -1
          unit: second
    _TR01EDTM_P365:
      type: datetime
      derivation:
        shift:
          type: datetime
          source: ADSL.TR01EDTM
          amount: 365
          unit: day
    _AP01EDTM:
      type: datetime
      derivation:
        case:
        - when: _TR02SDTM_M1S IS NULL
          then: _TR01EDTM_P365
        - when: _TR02SDTM_M1S <= _TR01EDTM_P365
          then: _TR02SDTM_M1S
        - otherwise: _TR01EDTM_P365
    _AP02SDT:
      type: date
      derivation: ADSL.TR02SDT
    _AP02SDTM:
      type: datetime
      derivation: ADSL.TR02SDTM
    _AP02EDTM:
      type: datetime
      derivation:
        shift:
          type: datetime
          source: ADSL.TR02EDTM
          amount: 365
          unit: day
- id: _CM
  dataset: CM
  key:
  - STUDYID
  - USUBJID
  - CMSEQ
  derivations:
    _ASTDTM0:
      type: datetime
      derivation:
        impute:
          type: datetime
          source: CM.CMSTDTC
          month: 1
          day: first
          time: first
    _ASTDT:
      type: date
      derivation:
        to_date:
          source: _ASTDTM0
    _ASTDTF:
      type: str
      derivation:
        imputation_flag:
          source: _ASTDTM0
          part: date
    _ASTDTM:
      type: datetime
      derivation:
        case:
        - when: _ASTDTF IS NULL
          then:
            impute:
              type: datetime
              source: _ASTDT
              time: last
        - otherwise:
            impute:
              type: datetime
              source: _ASTDT
              time: first
    _AENDTM0:
      type: datetime
      derivation:
        impute:
          type: datetime
          source: CM.CMENDTC
          month: 12
          day: last
          time: last
    _AENDT:
      type: date
      derivation:
        to_date:
          source: _AENDTM0
    _AENDTF:
      type: str
      derivation:
        imputation_flag:
          source: _AENDTM0
          part: date
    _PREFL:
      type: str
      derivation:
        case:
        - when: _ASTDT IS NULL AND ADSL_R._AP01SDT IS NOT NULL
          then: "'Y'"
        - when: _ASTDT < ADSL_R._AP01SDT
          then: "'Y'"
    _ONTR01FL:
      type: str
      derivation:
        case:
        - when: ADSL_R._AP01SDTM IS NOT NULL AND (((_ASTDTM <= ADSL_R._AP01EDTM) AND ((_AENDT >= ADSL_R._AP01SDT)
            OR (CM.CMENRTPT = 'ONGOING'))) OR ((_ASTDTM >= ADSL_R._AP01SDTM) AND (_ASTDTM <= ADSL_R._AP01EDTM)))
          then: "'Y'"
    _ONTR02FL:
      type: str
      derivation:
        case:
        - when: ADSL_R._AP02SDTM IS NOT NULL AND (((_ASTDTM <= ADSL_R._AP02EDTM) AND ((_AENDT >= ADSL_R._AP02SDT)
            OR (CM.CMENRTPT = 'ONGOING'))) OR ((_ASTDTM >= ADSL_R._AP02SDTM) AND (_ASTDTM <= ADSL_R._AP02EDTM)))
          then: "'Y'"
    _ASTDY:
      type: int
      derivation:
        study_day:
          source: _ASTDT
          reference: ADSL_R._TRTSDT
    _AENDY:
      type: int
      derivation:
        study_day:
          source: _AENDT
          reference: ADSL_R._TRTSDT
    _CO102:
      type: date
      derivation:
        first_available:
          sources:
          - ADSL_R._VAX102DT
          - ADSL_R._VAX10UDT
    _BRANCH_A:
      type: str
      derivation:
        case:
        - when: (_ASTDT < ADSL_R._UNBLNDDT OR ADSL_R._UNBLNDDT IS NULL) AND NOT (ADSL_R._UNBLNDDT IS NULL
            AND _ASTDT >= ADSL_R._VAX201DT AND ADSL_R._VAX201DT IS NOT NULL)
          then: "'Y'"
    _VPHASE_RAW:
      type: str
      derivation:
        case:
        - when: _BRANCH_A = 'Y' AND (((_PREFL = 'Y') AND ADSL_R._VAX101DT IS NOT NULL) OR (_ASTDT IS NOT
            NULL AND ADSL_R._VAX101DT IS NULL))
          then: "'Pre-Vaccination'"
        - when: _BRANCH_A = 'Y' AND ADSL_R._VAX101DT IS NOT NULL AND (((ADSL_R._VAX101DT <= _ASTDT) AND
            (_ASTDT <= ADSL_R._V01DT) AND _CO102 IS NULL) OR ((ADSL_R._VAX101DT <= _ASTDT) AND (_ASTDT
            < _CO102)))
          then: "'Vaccination 1'"
        - when: _BRANCH_A = 'Y' AND _CO102 IS NOT NULL AND (_CO102 <= _ASTDT) AND (_ASTDT <= ADSL_R._V01DT)
          then: "'Vaccination 2'"
        - when: _BRANCH_A = 'Y' AND ADSL_R._V01DT IS NOT NULL AND (ADSL_R._V01DT < _ASTDT) AND (_ASTDT
            <= ADSL_R._V02DT)
          then: "'Follow Up 1'"
        - when: _BRANCH_A = 'Y' AND (_ASTDT > ADSL_R._V02DT) AND ADSL_R._V02DT IS NOT NULL
          then: "'Follow Up 2'"
        - when: _BRANCH_A IS NULL AND ((_ASTDT IS NOT NULL AND ADSL_R._VAX201DT IS NULL) OR ((ADSL_R._UNBLNDDT
            <= _ASTDT) AND (_ASTDT < ADSL_R._VAX201DT)))
          then: "'After unblinding and before Vaccination 3'"
        - when: _BRANCH_A IS NULL AND ADSL_R._VAX201DT IS NOT NULL AND (((ADSL_R._VAX201DT <= _ASTDT)
            AND (_ASTDT <= ADSL_R._V03DT) AND ADSL_R._VAX202DT IS NULL) OR ((ADSL_R._VAX201DT <= _ASTDT)
            AND (_ASTDT < ADSL_R._VAX202DT)))
          then: "'Vaccination 3'"
        - when: _BRANCH_A IS NULL AND ADSL_R._VAX202DT IS NOT NULL AND (ADSL_R._VAX202DT <= _ASTDT) AND
            (_ASTDT <= ADSL_R._V03DT)
          then: "'Vaccination 4'"
        - when: _BRANCH_A IS NULL AND ADSL_R._V03DT IS NOT NULL AND (ADSL_R._V03DT < _ASTDT) AND (_ASTDT
            <= ADSL_R._V04DT)
          then: "'Follow Up 3'"
        - when: _BRANCH_A IS NULL AND (_ASTDT > ADSL_R._V04DT) AND ADSL_R._V04DT IS NOT NULL
          then: "'Follow Up 4'"
    _VPHASE:
      type: str
      derivation:
        case:
        - when: CM.CMSTDTC IS NOT NULL AND CM.CMSTDTC <> ''
          then: _VPHASE_RAW
    _VPHASEN:
      type: int
      derivation:
        mapping:
          source: _VPHASE
          dict:
            Pre-Vaccination: 0
            Vaccination 1: 1
            Vaccination 2: 2
            Follow Up 1: 3
            Follow Up 2: 99
            After unblinding and before Vaccination 3: 4
            Vaccination 3: 5
            Vaccination 4: 6
            Follow Up 3: 7
            Follow Up 4: 100
    _VAXNO:
      type: int
      derivation:
        case:
        - when: _VPHASEN IN (3, 99) AND ADSL_R._VAX102DT IS NOT NULL
          then: 2
        - when: _VPHASEN IN (3, 99) AND ADSL_R._VAX102DT IS NULL AND ADSL_R._VAX101DT IS NOT NULL
          then: 1
        - when: _VPHASEN IN (7, 100) AND ADSL_R._VAX202DT IS NOT NULL
          then: 4
        - when: _VPHASEN IN (7, 100) AND ADSL_R._VAX202DT IS NULL AND ADSL_R._VAX201DT IS NOT NULL
          then: 3
        - when: _VPHASEN = 5
          then: 3
        - when: _VPHASEN = 6
          then: 4
        - when: _VPHASEN = 1
          then: 1
        - when: _VPHASEN = 2
          then: 2
        - when: _VPHASEN = 4 AND _CO102 IS NOT NULL AND _CO102 <= _ASTDT
          then: 2
        - when: _VPHASEN = 4 AND ADSL_R._VAX101DT IS NOT NULL AND ADSL_R._VAX101DT <= _ASTDT
          then: 1
    _CLEAR1:
      type: str
      derivation:
        case:
        - when: _VPHASE = 'After unblinding and before Vaccination 3' AND ADSL_R._VAX201DT IS NOT NULL
          then: "'Y'"
    _CLEAR2:
      type: str
      derivation:
        case:
        - when: _CLEAR1 IS NULL AND _VPHASEN >= 99
          then: "'Y'"
    _ONTR01FL_FIN:
      type: str
      derivation:
        case:
        - when: _CLEAR1 IS NULL AND _CLEAR2 IS NULL
          then: _ONTR01FL
    _ONTR02FL_FIN:
      type: str
      derivation:
        case:
        - when: _CLEAR1 IS NULL AND _CLEAR2 IS NULL
          then: _ONTR02FL
    _ONPERFL_FIN:
      type: str
      derivation:
        case:
        - when: _ONTR01FL_FIN = 'Y' OR _ONTR02FL_FIN = 'Y'
          then: "'Y'"
output:
  path: <adam-dir>/adcm-yamaa.parquet
  order_by:
