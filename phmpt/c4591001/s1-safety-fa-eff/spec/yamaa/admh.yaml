- id: main
  filter: MH.MHCAT IS NOT NULL AND MH.MHTERM IS NOT NULL AND ADSL.USUBJID IS NOT NULL
intermediates:
# The EUA program names the Charlson categories as its cat= literals
# ('Any Malignancy', 'Chronic Pulmonary Disease', ...), in title case.
- id: _MH_D1
  derivations:
    _CAT1:
      type: str
      derivation:
        mapping:
          source: CCI_I._CAT1
          dict:
            AIDS/HIV: AIDS/HIV
            Any malignancy: Any Malignancy
            Cerebrovascular disease: Cerebrovascular Disease
            Chronic pulmonary disease: Chronic Pulmonary Disease
            Congestive heart failure: Congestive Heart Failure
            Dementia: Dementia
            Diabetes with chronic complication: Diabetes With Chronic Complication
            Diabetes without chronic complication: Diabetes Without Chronic Complication
            Hemiplegia or paraplegia: Hemiplegia or Paraplegia
            Leukemia: Leukemia
            Lymphoma: Lymphoma
            Metastatic solid tumor: Metastatic Solid Tumor
            Mild liver disease: Mild Liver Disease
            Moderate or severe liver disease: Moderate or Severe Liver Disease
            Myocardial infarction: Myocardial Infarction
            Peptic ulcer disease: Peptic Ulcer Disease
            Peripheral vascular disease: Peripheral Vascular Disease
            Renal disease: Renal Disease
            Rheumatic disease: Rheumatic Disease
          unmapped: null
    _CAT2:
      type: str
      derivation:
        mapping:
          source: CCI_I._CAT2
          dict:
            AIDS/HIV: AIDS/HIV
            Any malignancy: Any Malignancy
            Cerebrovascular disease: Cerebrovascular Disease
            Chronic pulmonary disease: Chronic Pulmonary Disease
            Congestive heart failure: Congestive Heart Failure
            Dementia: Dementia
            Diabetes with chronic complication: Diabetes With Chronic Complication
            Diabetes without chronic complication: Diabetes Without Chronic Complication
            Hemiplegia or paraplegia: Hemiplegia or Paraplegia
            Leukemia: Leukemia
            Lymphoma: Lymphoma
            Metastatic solid tumor: Metastatic Solid Tumor
            Mild liver disease: Mild Liver Disease
            Moderate or severe liver disease: Moderate or Severe Liver Disease
            Myocardial infarction: Myocardial Infarction
            Peptic ulcer disease: Peptic Ulcer Disease
            Peripheral vascular disease: Peripheral Vascular Disease
            Renal disease: Renal Disease
            Rheumatic disease: Rheumatic Disease
          unmapped: null
- id: _MH_D2
  derivations:
    # DDMonYYYY: two-digit day, month abbreviation, four-digit year.
    _ASTDT_YR:
      type: str
      derivation:
        str_substr:
          source: _ASTDT_ISO
          start: 1
          length: 4
    _ASTDT_D9:
      type: str
      derivation:
        str_template:
          template: '{_ASTDT_D2}{_ASTDT_MON}{_ASTDT_YR}'
          missing: null
    _AENDT_YR:
      type: str
      derivation:
        str_substr:
          source: _AENDT_ISO
          start: 1
          length: 4
    _AENDT_D9:
      type: str
      derivation:
        str_template:
          template: '{_AENDT_D2}{_AENDT_MON}{_AENDT_YR}'
          missing: null
    _ADURN_STR2:
      type: str
      derivation:
        case:
        - when: MH.MHSTDTC = '(b)(6)'
          then: '''(b)(6)'''
        - otherwise: _ADURN_STR
