# ADMH for Pfizer C4591001, EUA 27034 sequence S1 (safety and final
# efficacy analysis, data snapshot of November 2020).
# Layer over the S1 (BLA) spec, run on this cut's SDTM
# (scripts/reproduce.py verify --study c4591001 --cut s1-safety-fa-eff). The
# output keeps the EUA file's columns, in its order.
# The EUA admh.sas (06Nov2020) keeps the MH records of ADSL subjects, and its
# ADMH stores the ADSL dates, times and datetimes and ADT natively, SUBJID,
# SITEID and MHSPID as text, and ASTDT/AENDT as DDMonYYYY text (ASTDY, AENDY
# and ADURN as text, as in S1). ADURN (ADT - ASTDT) is missing, not 0,
# without ASTDT, and is redacted only with MHSTDTC.
# This cut's MH carries no MHENRTPT or MHENTPT, so both read the missing
# value.
yamaa: '1.0'
type: spec
parent: ../../../s1/spec/yamaa/admh.yaml
clear:
- columns.RANDDT.submission.length
- columns.TRTSDT.submission.length
- columns.TRTSTM.submission.length
- columns.TRTSDTM.submission.length
