- columns.SUBJID.submission.significant_digits
- columns.SITEID.submission.significant_digits
- columns.MHSPID.submission.significant_digits
- columns.RANDFL.submission
- columns.TRT02A.submission
- columns.TRT02AN.submission
- columns.TRT02P.submission
- columns.TRT02PN.submission
- columns.TR02SDT.submission
- columns.TR02STM.submission
