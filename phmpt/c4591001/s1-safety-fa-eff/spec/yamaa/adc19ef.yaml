    _SRTDT: null
    _CLSPFLG: null
    _ASTDT_RAW: null
    _AENDT_RAW: null
    _ADT_RAW: null
    _PARAMN: 107
    _PARAMCD: '''PRSVCSAD'''
    _PARAM: '''PRESENCE OF PROTOCOL DEFINED SEVERE COVID-19 SYMPTOMS AFTER DOSE'''
    _PARCAT1: '''SEVERE COVID-19 SYMPTOMS'''
    _AVAL_RAW: null
    _AVALC_RAW: '''Y'''
    _DTHDT: _A._DTHDT
    _C19ILHFL: null
    _UNBLNDDT: _A._UNBLNDDT
