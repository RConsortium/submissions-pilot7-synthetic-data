columns:
# The EUA adc19ef.sas censors at its snapshot (&cutoff = 14NOV2020):
# srvlendt = min(dcodt, withdraw_dt, dthdt) (no unblinding yet).
- name: DCODT
  derivation: DATE '2020-11-14'
- name: _DCODT
  type: date
  derivation: DATE '2020-11-14'
- name: _SRVLENDT
  derivation:
    least:
      sources: [_DCODT, _WITHDRAW_DT, _DTHDT]
# Vital-sign severe symptoms keep ADSYMPT's category (no grp-3 relabel).
- name: PARCAT1
  derivation:
    case:
    - when: _ROWKIND = 'NVA'
      then: _PARCAT1
    - when: _ROWKIND = 'ONSET'
      then: "'ILLNESS ONSET'"
    - when: _ROWKIND = 'NAAT'
      then: "'CENTRAL/LOCAL NAAT RESULTS'"
    - when: _GRP = 7
      then: "'HOSPITALIZATION STATUS'"
    - when: _GRP = 10
      then: "'DEATH STATUS'"
    - when: _GRP = 11
      then: "'HOSPITALIZATION STATUS'"
    - when: _GRP = 20.1
      then: "'SEVERE COVID-19 SYMPTOMS'"
    - when: _GRP = 20.2
      then: "'SEVERE COVID-19 SYMPTOMS'"
    - otherwise: _PARCAT1
# A subject with no ADSYMPT record at all reaches the program's last
# merge from ADSL alone (mflg=3), so its baseline flags stay blank.
- name: VRBLNGFL
  derivation:
    case:
    - when: _HAS_NVA._HAS IS NULL AND _HAS_KEPT._HAS IS NULL
      then: null
    - when: _HAS_NVA._HAS IS NULL
      then: "'N'"
    - when: _VRBLNGFL_F = 'U'
      then: null
    - otherwise: _VRBLNGFL_F
- name: CRD1NGFL
  derivation:
    case:
    - when: _HAS_NVA._HAS IS NULL AND _HAS_KEPT._HAS IS NULL
      then: null
    - when: _HAS_NVA._HAS IS NULL
      then: "'N'"
    - when: _CRD1NGFL_F = 'U'
      then: null
    - otherwise: _CRD1NGFL_F
- name: CRD2NGFL
  derivation:
    case:
    - when: _HAS_NVA._HAS IS NULL AND _HAS_KEPT._HAS IS NULL
      then: null
    - when: _HAS_NVA._HAS IS NULL
      then: "'N'"
    - when: _CRD2NGFL_F = 'U'
      then: null
    - otherwise: _CRD2NGFL_F
# The EUA program labels the severe onset parameter without "PROTOCOL
# DEFINED", and sets SEVSYMFL for any positive severe group (3 to 20) or
# a death.
- name: PARAM
  derivation:
    case:
    - when: _ROWKIND = 'NVA'
      then: _PARAM
    - when: _ROWKIND = 'ONSET' AND _GRP = 1
      then: '''PROTOCOL DEFINED COVID-19 ILLNESS ONSET'''
    - when: _ROWKIND = 'ONSET' AND _GRP = 2
      then: '''CDC DEFINED COVID-19 ILLNESS ONSET'''
    - when: _ROWKIND = 'ONSET' AND _GRP = 20.1
      then: '''SEVERE COVID-19 ILLNESS ONSET'''
    - when: _ROWKIND = 'ONSET' AND _GRP = 20.2
      then: '''CDC DEFINED SEVERE COVID-19 ILLNESS ONSET'''
    - when: _ROWKIND = 'NAAT'
      then: '''COVID-19 NAAT RESULT AFTER DOSE'''
    - when: _GRP = 1
      then: '''PRESENCE OF PROTOCOL DEFINED SYMPTOMS AFTER DOSE'''
    - when: _GRP = 2
      then: '''PRESENCE OF CDC DEFINED SYMPTOMS AFTER DOSE'''
    - when: _GRP = 3
      then: '''SEVERE COVID-19 SYMPTOMS - VITAL SIGNS'''
    - when: _GRP = 4
      then: '''SEVERE COVID-19 SYMPTOMS - RESPIRATORY FAILURE'''
    - when: _GRP = 5
      then: '''SEVERE COVID-19 SYMPTOMS - USE OF VASOPRESSORS'''
    - when: _GRP = 6
      then: '''SEVERE COVID-19 SYMPTOMS - SIGNIFICANT ACUTE RENAL, HEPATIC, OR NEUROLOGIC
        DYSFUNCTION'''
    - when: _GRP = 7
      then: '''SUBJECT IN ICU DUE TO POTENTIAL COVID-19 ILLNESS'''
    - when: _GRP = 10
      then: '''DEATH OCCURRED DUE TO COVID-19 ILLNESS?'''
    - when: _GRP = 11
      then: '''HOSPITALIZED DUE TO COVID-19 ILLNESS?'''
    - when: _GRP = 20.1
      then: '''PRESENCE OF PROTOCOL DEFINED SEVERE COVID-19 SYMPTOMS AFTER DOSE'''
    - when: _GRP = 20.2
      then: '''PRESENCE OF CDC DEFINED SEVERE COVID-19 SYMPTOMS AFTER DOSE'''
    - otherwise: _PARAM
# The EUA program blanks the severe group's end date when any member is
# not positive or has no end date (symp2, vis_endtfl); S1 exempts a
# negative member without an end date.
- name: _EF1
  derivation:
    case:
    - when: _ROWKIND IN ('SYMP', 'SYM711') AND 3 <= _GRP AND _GRP <= 10 AND (_SYMP_AENDT
        IS NULL OR _STAT <> 4)
      then: 1
    - otherwise: _EF0
- name: ASTDT
  derivation:
    case:
    - when: _ROWKIND = 'DEATH' AND _PARAMCD = 'PRSVCSAD'
      then: _DTHDT
    - when: _GRP IN (3, 10)
      then: null
    - when: _ROWKIND = 'ONSET'
      then: null
    - when: _ROWKIND = 'NAAT'
      then: null
    - when: _ROWKIND = 'DEATH'
      then: null
    - when: _ROWKIND = 'ST'
      then: _ST_ASTDT
    - when: _ROWKIND = 'SEV' AND _GRP = 20.1
      then: _VIS_ASTDT_FINAL
    - when: _ROWKIND = 'SEV' AND _GRP = 20.2
      then: _VIS_ASTDT_CDC_FINAL
    - when: _ROWKIND = 'SYMP'
      then: _GRP_STDT
    - when: _ROWKIND = 'SYM711'
      then: _ASTDT_RAW
    - when: _ROWKIND = 'NVA'
      then: _ASTDT_RAW
# NMPDOCFL goes on every onset parameter, the death onset row included.
- name: NMPDOCFL
  derivation:
    case:
    - when: (_ROWKIND = 'ONSET' OR (_ROWKIND = 'DEATH' AND _PARAMCD = 'SEVCONST'))
        AND (_DVSTDT IS NULL OR ADT < _DVSTDT)
      then: "'Y'"
    - otherwise: "''"
- name: _SEVSYMFL_
  derivation:
    case:
    - when: _ROWKIND IN ('SYMP', 'SYM711', 'SEV', 'ONSET', 'NAAT') AND _GRP >= 3
        AND _GRP <= 20.1 AND _S4_STAT = 4
      then: "'Y'"
    - otherwise: _PREV_SEVSYMFL_
- name: SEVSYMFL
