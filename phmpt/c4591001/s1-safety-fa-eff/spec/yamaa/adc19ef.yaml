# ADC19EF for Pfizer C4591001, EUA 27034 sequence S1 (safety and final
# efficacy analysis, data snapshot of November 2020).
# Layer over the 1-month spec (S1's, with the ADSL birth date named BRTHDT
# as in this cut's ADSL), run on this cut's SDTM
# (scripts/reproduce.py verify --study c4591001 --cut s1-safety-fa-eff). The
# output keeps the EUA file's columns, in its order.
yamaa: '1.0'
type: spec
parent: ../../../s211-1mth/spec/yamaa/adc19ef.yaml
# ADSL comes from helper/adsl_s1x.yaml (the S1-only ADSL columns, missing
# in this cut).
input:
  ADSL:
    path: <work-dir>/adsl_s1x.parquet
    schema: helper/adsl_s1x.yaml
    key:
    - STUDYID
    - USUBJID
  MH: <sdtm-dir>/mh.parquet
# The EUA adc19ef.sas reads C19ILHFL from its ADSYMPT, a column the
# submitted EUA ADSYMPT does not carry; it is derived here as the EUA
# adsympt.sas derives it (a COVID-19 term in MH).
intermediates:
- id: _MH_C19
  dataset: MH
  key:
    USUBJID: USUBJID
  filter: MH.MHDECOD IN ('Asymptomatic COVID-19', 'COVID-19', 'COVID-19 pneumonia',
    'COVID-19 treatment', 'Suspected COVID-19', 'SARS-CoV-2 antibody test positive',
    'SARS-CoV-2 carrier', 'SARS-CoV-2 sepsis', 'SARS-CoV-2 test positive', 'SARS-CoV-2
    viraemia', 'Multisystem inflammatory syndrome in children')
  order_by:
  - MH.USUBJID
  keep: first
  derivations:
    _MHDECOD:
      type: str
      derivation: MH.MHDECOD
# Status parameter numbers and labels of the EUA adc19ef.sas.
- id: _ST
  derivations:
    _PARAMN:
      type: int
      derivation:
        case:
        - when: _ST_IDX = 1
          then: 141
        - when: _ST_IDX = 2
          then: 142
        - when: _ST_IDX = 3
          then: 143
        - when: _ST_IDX = 4
          then: 144
        - when: _ST_IDX = 5
          then: 145
        - when: _ST_IDX = 6
          then: 151
        - when: _ST_IDX = 7
          then: 152
        - when: _ST_IDX = 8
          then: 153
        - when: _ST_IDX = 9
          then: 154
        - when: _ST_IDX = 10
          then: 155
        - when: _ST_IDX = 11
          then: 161
        - when: _ST_IDX = 12
          then: 162
        - when: _ST_IDX = 13
          then: 163
        - when: _ST_IDX = 14
          then: 164
        - when: _ST_IDX = 15
          then: 165
        - when: _ST_IDX = 21
          then: 171
        - when: _ST_IDX = 22
          then: 172
        - when: _ST_IDX = 23
          then: 173
        - when: _ST_IDX = 24
          then: 174
        - when: _ST_IDX = 25
          then: 175
    _PARAM:
      type: str
      derivation:
        case:
        - when: _ST_IDX = 1
          then: "'SUBJECT''S SURVEILLANCE TIME AFTER DOSE 1 FOR PROTOCOL DEFINED SYMPTOMS'"
        - when: _ST_IDX = 2
          then: "'SUBJECT''S SURVEILLANCE TIME 7 DAYS AFTER DOSE 1 FOR PROTOCOL DEFINED SYMPTOMS'"
        - when: _ST_IDX = 3
          then: "'SUBJECT''S SURVEILLANCE TIME AFTER DOSE 2 FOR PROTOCOL DEFINED SYMPTOMS'"
        - when: _ST_IDX = 4
          then: "'SUBJECT''S SURVEILLANCE TIME 7 DAYS AFTER DOSE 2 FOR PROTOCOL DEFINED SYMPTOMS'"
        - when: _ST_IDX = 5
          then: "'SUBJECT''S SURVEILLANCE TIME 14 DAYS AFTER DOSE 2 FOR PROTOCOL DEFINED SYMPTOMS'"
        - when: _ST_IDX = 6
          then: "'SUBJECT''S SURVEILLANCE TIME AFTER DOSE 1 FOR CDC DEFINED SYMPTOMS'"
        - when: _ST_IDX = 7
          then: "'SUBJECT''S SURVEILLANCE TIME 7 DAYS AFTER DOSE 1 FOR CDC DEFINED SYMPTOMS'"
        - when: _ST_IDX = 8
          then: "'SUBJECT''S SURVEILLANCE TIME AFTER DOSE 2 FOR CDC DEFINED SYMPTOMS'"
        - when: _ST_IDX = 9
          then: "'SUBJECT''S SURVEILLANCE TIME 7 DAYS AFTER DOSE 2 FOR CDC DEFINED SYMPTOMS'"
        - when: _ST_IDX = 10
          then: "'SUBJECT''S SURVEILLANCE TIME 14 DAYS AFTER DOSE 2 FOR CDC DEFINED SYMPTOMS'"
        - when: _ST_IDX = 11
          then: "'SUBJECT''S SURVEILLANCE TIME AFTER DOSE 1 FOR SEVERE COVID19 SYMPTOMS'"
        - when: _ST_IDX = 12
          then: "'SUBJECT''S SURVEILLANCE TIME 7 DAYS AFTER DOSE 1 FOR SEVERE COVID19 SYMPTOMS'"
        - when: _ST_IDX = 13
          then: "'SUBJECT''S SURVEILLANCE TIME AFTER DOSE 2 FOR SEVERE COVID19 SYMPTOMS'"
        - when: _ST_IDX = 14
          then: "'SUBJECT''S SURVEILLANCE TIME 7 DAYS AFTER DOSE 2 FOR SEVERE COVID19 SYMPTOMS'"
        - when: _ST_IDX = 15
          then: "'SUBJECT''S SURVEILLANCE TIME 14 DAYS AFTER DOSE 2 FOR SEVERE COVID19 SYMPTOMS'"
        - when: _ST_IDX = 21
          then: "'SUBJECT''S SURVEILLANCE TIME AFTER DOSE 1 FOR PROTOCOL DEFINED SYMPTOMS - ALL AVAILABLE'"
        - when: _ST_IDX = 22
          then: "'SUBJECT''S SURVEILLANCE TIME 7 DAYS AFTER DOSE 1 FOR PROTOCOL DEFINED SYMPTOMS - ALL AVAILABLE'"
        - when: _ST_IDX = 23
          then: "'SUBJECT''S SURVEILLANCE TIME AFTER DOSE 2 FOR PROTOCOL DEFINED SYMPTOMS - ALL AVAILABLE'"
        - when: _ST_IDX = 24
          then: "'SUBJECT''S SURVEILLANCE TIME 7 DAYS AFTER DOSE 2 FOR PROTOCOL DEFINED SYMPTOMS - ALL AVAILABLE'"
        - when: _ST_IDX = 25
          then: "'SUBJECT''S SURVEILLANCE TIME 14 DAYS AFTER DOSE 2 FOR PROTOCOL DEFINED SYMPTOMS - ALL AVAILABLE'"
- id: _S1
  derivations:
    _GRPCAT:
      type: int
      derivation:
        case:
        - when: _GRP_X IN (1, 2)
          then: 1
        - when: _GRP_X >= 3 AND _GRP_X <= 20
          then: 2
# Subjects with any kept ADSYMPT record (the program's adc19ef_1 set).
- id: _HAS_KEPT
  dataset: _S1
  key:
    _USUBJID: _USUBJID
  filter: _S1._KEPT = 1
  order_by:
  - _S1._ADT
  - _S1._RECSEQ
  keep: first
  derivations:
    _HAS:
      type: int
      derivation: 1
- id: _A
  derivations:
    _C19ILHFL:
      type: str
      derivation:
        case:
        - when: _MH_C19._MHDECOD IS NOT NULL
          then: "'Y'"
        - otherwise: "''"
# The EUA program writes 20 of S1's 42 subject status parameters (no
# STC* CDC-severe, *CDA, *SEA, *PDX or STC*SA ones).
# The EUA program has one severe category: every symptom group from 3 up
# (S1 splits off CDC-severe groups 11-20), and status rows for every dosed
# subject, Phase 1 included.
rows:
- id: main_symp
  derivations:
    _GRPCAT:
      case:
      - when: _S1._GRP_X IN (1, 2)
        then: 1
      - when: _S1._GRP_X >= 3 AND _S1._GRP_X <= 20
        then: 2
- id: main_symp711
  derivations:
    _GRPCAT:
      case:
      - when: _S1._GRP_X IN (1, 2)
        then: 1
      - when: _S1._GRP_X >= 3 AND _S1._GRP_X <= 20
        then: 2
- id: main_nva
  derivations:
    _GRPCAT:
      case:
      - when: _S1._GRP_X IN (1, 2)
        then: 1
      - when: _S1._GRP_X >= 3 AND _S1._GRP_X <= 20
        then: 2
# The EUA program writes a NAAT result row for every illness visit,
# whatever its first symptom group (S1 needs group 1 or 2).
- id: naatrad
  filter: _KEPT = 1 AND _IS_FIRST = 1 AND (_FIRST_GRP_SYMP5 IN (1, 2, 3, 4, 5, 6, 7,
    10, 11) OR _HAS_CNT = 1)
- id: st
  filter: _DOSE_DT IS NOT NULL AND _ST._PARAMCD IN ('ST1PD', 'ST17PD', 'ST1CD', 'ST17CD', 'ST1SE', 'ST17SE', 'ST1PDA', 'ST17PDA', 'ST2PD', 'ST27PD', 'ST214PD', 'ST2CD', 'ST27CD', 'ST214CD', 'ST2SE', 'ST27SE', 'ST214SE', 'ST2PDA', 'ST27PDA', 'ST214PDA')
# The EUA program writes two rows for each subject who died (program
# lines 1400-1445): severe symptoms present from the death date, and a
# negative severe onset on it. They take the death-row kind.
- id: eua_death_sev
  dataset: _A
  filter: _A._RECSEQ = 1 AND _A._DTHDT IS NOT NULL
  derivations:
    _ROWKIND: '''DEATH'''
    _USUBJID: _A._USUBJID
    _AVISITN: null
    _AVISIT: null
    _VISITNUM: null
    _VISIT: null
