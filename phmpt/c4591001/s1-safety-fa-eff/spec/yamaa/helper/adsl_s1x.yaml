# C4591001 EUA 27034 S1: this cut's submitted ADSL as the S1 ADCEVD and
# ADFACEVD specs read it. The EUA ADSL predates unblinding, the open-label
# period and the later population flags, so the S1-only columns those specs
# read (UNBLNDDT, TR02*, TRT02*, AGEGR4*, DS3KFL, PEDREAFL, RAND1FL, REACTOFL,
# SAF1FL, SAF2FL) are missing here, as in the EUA programs; VAX10U / VAX10UDT
# (S1's unplanned vaccination) are the EUA's third vaccination (VAX103*).
