intermediates:
# The immunogenicity ADSL holds the analysed subjects; IS records of other
# subjects (the Phase 2/3 N-binding results) are not in ADVA.
- id: _POP
  dataset: ADSL
  key:
  - USUBJID
  order_by:
  - ADSL.USUBJID
  keep: first
  derivations:
    _X:
      type: int
      derivation: 1
- id: _IS
  filter: IS.ISORRES <> 'NOT DONE' AND IS._INPOP = 1
  columns:
  - _USUBJID
  - _ISSEQ
  - _VISIT
  - _VISITNUM
  - _ISTSTDTL
  - _ISLLOQ
  - PARAMCD
  - _ISTEST
  - _ISMETHOD
  - _ISSTRESU
  - _AVAL_RAW
  - _AVALC_RAW
  - _ADY_RAW
  - _ISDTC
  - ADT
  - PARCAT1
  - SRCDOM
  - SRCVAR
  - _HAS_RETEST
  - _IS_RETEST
  - _ISUSE
  - _IS_COVID
  - _ATM_SEC
  - _ADT_MIDNIGHT
  - ADTM
  - PARAM
  - PARAMN
  - PARCAT1N
  - _AVISITN_MAP
  - _AVISIT_MAP
  - _EPOCH
  derivations:
    _ISTSTDTL:
      derivation: "''"
    _HAS_RETEST:
      derivation: 0
    _IS_RETEST:
      derivation: 0
    _EPOCH:
      type: str
      derivation: IS.EPOCH
    _INPOP:
      type: int
      derivation:
        case:
        - when: _POP._X IS NOT NULL
          then: 1
        - otherwise: 0
- id: _ISC
  derivations:
    EPOCH:
      type: str
      derivation: _IS._EPOCH
- id: _ADSL2
  derivations:
    _PD1POSDT:
      type: date
      derivation: ADSL.PD1POSDT
- id: _IS2
  derivations:
    TRTP:
      derivation: _TRT01P
    TRTA:
      derivation: _TRT01A
    TRTPN:
      derivation: _TRT01PN
    TRTAN:
      derivation: _TRT01AN
- id: _IS4
  derivations:
    _ANL01FL_V3:
      derivation:
        case:
        - when: _ISC._IS_COVID = 0
          then: _IS2._ANL01FL
    _EVIMMFL:
      derivation:
        case:
        - when: _ADSL2._PD1POSDT IS NOT NULL AND _ISC.ADT >= _ADSL2._PD1POSDT
          then: '''N'''
        - when: (_ADSL2._PHASEN = 1) AND (_AVISITN_V3 < 4) AND (_ADSL2._EVAL01FL = 'Y')
          then: '''Y'''
        - when: (_ADSL2._PHASEN = 1) AND (_AVISITN_V3 < 4)
          then: '''N'''
        - when: (_ADSL2._PHASEN = 1) AND (_AVISITN_V3 >= 4) AND (_ADSL2._EVAL02FL = 'Y')
          then: '''Y'''
        - when: (_ADSL2._PHASEN = 1) AND (_AVISITN_V3 >= 4)
          then: '''N'''
        - when: ((_ADSL2._PHASEN = 2) OR (_ADSL2._PHASEN = 3) OR (_ADSL2._PHASEN = 4)) AND (_ADSL2._EVAL02FL
            = 'Y')
          then: '''Y'''
        - when: ((_ADSL2._PHASEN = 2) OR (_ADSL2._PHASEN = 3) OR (_ADSL2._PHASEN = 4))
          then: '''N'''
    _ANL01FL:
      derivation:
        case:
        - when: (_ISC._ISUSE <> 'N') AND (((_AVISITN_V3 IS NULL) OR (_AVISITN_V3 < 4)) OR (_ADSL2._VAX201DT
            IS NULL) OR (_ISC.ADT <= _ADSL2._VAX201DT))
          then: _ANL01FL_C
    _AVISITN_F:
      derivation:
        case:
        - when: _ISC._ISUSE <> 'N'
          then: _AVISITN_V3
    _AVISIT_F:
      derivation:
        case:
        - when: _ISC._ISUSE <> 'N'
          then: _AVISIT_V3
    _AVISIT:
      derivation: _AVISIT_F
    _AVISITN:
      derivation: _AVISITN_F
    _ABLPBLFL:
      derivation:
        case:
        - when: (_HAS_ABL._X IS NOT NULL) AND (_HAS_APS._X IS NOT NULL)
          then: '''Y'''
        - when: _HAS_ABL._X IS NOT NULL
          then: '''N'''
- id: _SHELL4
  derivations:
    _EPOCH:
      type: str
      derivation: _ISC.EPOCH
    _ANL01FL:
      type: str
      derivation: _IS4._ANL01FL
- id: _R_RB
  dataset: _ISC
  key:
    USUBJID: _ISC.USUBJID
    VISITNUM: _ISC.VISITNUM
    ADT: _ISC.ADT
  filter: _ISC.PARAMCD = 'C19RBDIG' AND _ISC._ISUSE = 'Y'
  order_by:
  - _ISC.ISSEQ
  keep: first
  derivations:
    _AVAL_IMP:
      type: float
      derivation:
        case:
        - when: (((_ISC._AVAL_RAW < _ISC._ISLLOQ) AND (_ISC._AVAL_RAW IS NOT NULL)) OR (_ISC._AVALC_RAW
            = 'BLQ'))
          then: _ISC._ISLLOQ * 0.5
        - otherwise: _ISC._AVAL_RAW
- id: _FIRST_NT50RB
  dataset: _ISC
  key:
    USUBJID: _ISC.USUBJID
  filter: _ISC.PARAMCD = 'C2NGNT50' AND _ISC._ISUSE = 'Y' AND _ISC._RB_AVAL IS NOT NULL
  order_by:
  - _ISC.ADT
  - _ISC.VISITNUM
  keep: first
  derivations:
    _NT50_AVAL:
      type: float
      derivation:
        case:
        - when: (((_ISC._AVAL_RAW < _ISC._ISLLOQ) AND (_ISC._AVAL_RAW IS NOT NULL)) OR (_ISC._AVALC_RAW
            = 'BLQ'))
          then: _ISC._ISLLOQ * 0.5
        - otherwise: _ISC._AVAL_RAW
    _RB_AVAL:
      type: float
      derivation: _R_RB._AVAL_IMP
    _RATIO_RAW:
      type: float
      derivation: _NT50_AVAL / _RB_AVAL
    _RATIO_AVAL:
      type: float
      derivation:
        round_half_away_from_zero:
          source: _RATIO_RAW
          digits: 4
    _HAS_ABL:
      type: int
      derivation:
        case:
        - when: (_ISC.VISITNUM = _V1CELL._CELL_VISITNUM) AND (_ISC.ADT = _V1CELL._ADT)
          then: 1
        - otherwise: 0
- id: _FIRST_NT90RB
  dataset: _ISC
  key:
    USUBJID: _ISC.USUBJID
  filter: _ISC.PARAMCD = 'C2NGNT90' AND _ISC._ISUSE = 'Y' AND _ISC._RB_AVAL IS NOT NULL
  order_by:
  - _ISC.ADT
  - _ISC.VISITNUM
  keep: first
  derivations:
    _NT90_AVAL:
      type: float
      derivation:
        case:
        - when: (((_ISC._AVAL_RAW < _ISC._ISLLOQ) AND (_ISC._AVAL_RAW IS NOT NULL)) OR (_ISC._AVALC_RAW
            = 'BLQ'))
          then: _ISC._ISLLOQ * 0.5
        - otherwise: _ISC._AVAL_RAW
    _RB_AVAL:
      type: float
      derivation: _R_RB._AVAL_IMP
    _RATIO_RAW:
      type: float
      derivation: _NT90_AVAL / _RB_AVAL
    _RATIO_AVAL:
      type: float
      derivation:
        round_half_away_from_zero:
          source: _RATIO_RAW
          digits: 4
    _HAS_ABL:
      type: int
      derivation:
        case:
        - when: (_ISC.VISITNUM = _V1CELL._CELL_VISITNUM) AND (_ISC.ADT = _V1CELL._ADT)
          then: 1
        - otherwise: 0
# The ratio rows' ABLPBLFL is per subject over all four ratios: a ratio row
# whose visit shell is the baseline record, and one whose shell is not.
- id: _R_SUBJ_BASE
  dataset: _ISC
  key:
    USUBJID: _ISC.USUBJID
  filter: (_ISC.PARAMCD = 'C2NGNT50' OR _ISC.PARAMCD = 'C2NGNT90') AND _ISC._ISUSE = 'Y' AND _ISC._NT_IMP
    IS NOT NULL AND (_ISC._S1_IMP IS NOT NULL OR _ISC._RB_IMP IS NOT NULL) AND _ISC._SHELL_ABLFL = 'Y'
  order_by:
  - _ISC.ISSEQ
  keep: first
  derivations:
    _NT_IMP:
      type: float
      derivation:
        case:
        - when: (((_ISC._AVAL_RAW < _ISC._ISLLOQ) AND (_ISC._AVAL_RAW IS NOT NULL)) OR (_ISC._AVALC_RAW
            = 'BLQ'))
          then: _ISC._ISLLOQ * 0.5
        - otherwise: _ISC._AVAL_RAW
    _S1_IMP:
      type: float
      derivation: _R_S1._AVAL_IMP
    _RB_IMP:
      type: float
      derivation: _R_RB._AVAL_IMP
    _SHELL_ABLFL:
      type: str
      derivation: _SHELL4._ABLFL
    _X:
      type: int
      derivation: 1
- id: _R_SUBJ_POST
  dataset: _ISC
  key:
    USUBJID: _ISC.USUBJID
  filter: (_ISC.PARAMCD = 'C2NGNT50' OR _ISC.PARAMCD = 'C2NGNT90') AND _ISC._ISUSE = 'Y' AND _ISC._NT_IMP
    IS NOT NULL AND (_ISC._S1_IMP IS NOT NULL OR _ISC._RB_IMP IS NOT NULL) AND (_ISC._SHELL_ABLFL IS NULL
    OR _ISC._SHELL_ABLFL <> 'Y')
  order_by:
  - _ISC.ISSEQ
  keep: first
  derivations:
    _NT_IMP:
      type: float
      derivation:
        case:
        - when: (((_ISC._AVAL_RAW < _ISC._ISLLOQ) AND (_ISC._AVAL_RAW IS NOT NULL)) OR (_ISC._AVALC_RAW
            = 'BLQ'))
          then: _ISC._ISLLOQ * 0.5
        - otherwise: _ISC._AVAL_RAW
    _S1_IMP:
      type: float
      derivation: _R_S1._AVAL_IMP
    _RB_IMP:
      type: float
      derivation: _R_RB._AVAL_IMP
    _SHELL_ABLFL:
      type: str
      derivation: _SHELL4._ABLFL
    _X:
      type: int
      derivation: 1
