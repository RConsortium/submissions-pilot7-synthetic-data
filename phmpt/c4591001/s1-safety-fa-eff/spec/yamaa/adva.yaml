# ADVA for Pfizer C4591001, EUA 27034 sequence S1 (safety and final
# efficacy analysis, data snapshot of November 2020).
# Layer over the S1 (BLA) spec, run on this cut's SDTM
# (scripts/reproduce.py verify --study c4591001 --cut s1-safety-fa-eff). The
# EUA adva.sas is not released; the define (MT.ADVA.*) and the S1 program
# (spec/source/program/adam/*adva-sas.txt) describe it, and the EUA file shows
# where the two differ from S1's:
# - ADSL is the immunogenicity ADSL (datvprot, data_vai), rebuilt by
#   helper/adsl_vai.yaml: Phase 1 and Phase 2 subjects only, with the
#   immunogenicity population flags, age groups, TRTPR/TRTAR and PD1POSDT;
# - no repeat tests (this cut's IS has no ISTSTDTL), no periods (TRTP/TRTA
#   are the period-1 treatment, as in every EUA row);
# - N-binding rows keep their analysis visit and ANL01FL (S1 blanks them);
# - a convalescent result standing for the 1-month visit gets the analysis
#   visit but no ANL01FL;
# - EVIMMFL is 'N' from PD1POSDT on (S1 program, not in S1's data);
# - ABLPBLFL is missing without a baseline, and on the ratio rows it is 'Y'
#   when the subject has ratio rows at and after baseline, else missing (the
#   S1 program's final 'Y'/'N' pass is not in the EUA program);
# - the ratios to RBD IgG (NT50_RB, NT90_RB, PARAMN 13 and 14) are kept;
# - EPOCH (IS.EPOCH) is added.
# The output keeps the EUA file's columns, in its order.
yamaa: '1.0'
type: spec
parent: ../../../s1/spec/yamaa/adva.yaml
input:
  ADSL:
    path: <work-dir>/adsl_vai.parquet
    schema: helper/adsl_vai.yaml
# The S1 columns the EUA file does not carry.
clear:
- columns.APERIOD.submission
- columns.APERIODC.submission
- columns.APERSDTM.submission
- columns.APEREDTM.submission
- columns.BASE4F.submission
- columns.R2BASE4F.submission
- columns.FOLD4FL.submission
- columns.ISTSTDTL.submission
- columns.RANDFL.submission
- columns.TRT02A.submission
- columns.TRT02AN.submission
- columns.TRT02P.submission
- columns.TRT02PN.submission
- columns.TR02SDT.submission
- columns.TR02STM.submission
- columns.TR02SDTM.submission
- columns.TR02EDT.submission
- columns.TR02ETM.submission
- columns.TR02EDTM.submission
- columns.VAX10UDT.submission
- columns.VAX201DT.submission
- columns.VAX202DT.submission
- columns.AGEGR4.submission
- columns.AGEGR4N.submission
- columns.HIVFL.submission
- columns.PEDIMMFL.submission
- columns.EV1MD2FL.submission
- columns.AGETR01.submission
- columns.VAX101.submission
- columns.VAX102.submission
- columns.VAX10U.submission
- columns.VAX201.submission
- columns.VAX202.submission
- columns.VAX20U.submission
- columns.VAX20UDT.submission
- columns.UNBLNDDT.submission
- columns.MULENRFL.submission
- columns.RAND1FL.submission
- columns.TRTSDTM.submission
- columns.TRTEDTM.submission
rows:
- id: base
  derivations:
    EPOCH: _ISC.EPOCH
- id: ratio_nt50_s1
  derivations:
    EPOCH: _SHELL4._EPOCH
    ANL01FL: _SHELL4._ANL01FL
    ABLPBLFL:
      case:
      - when: _R_SUBJ_BASE._X IS NOT NULL AND _R_SUBJ_POST._X IS NOT NULL
        then: '''Y'''
- id: ratio_nt90_s1
  derivations:
    EPOCH: _SHELL4._EPOCH
    ANL01FL: _SHELL4._ANL01FL
    ABLPBLFL:
      case:
      - when: _R_SUBJ_BASE._X IS NOT NULL AND _R_SUBJ_POST._X IS NOT NULL
        then: '''Y'''
# The ratios to RBD IgG, built as the ratios to S1 IgG are (the S1 program
# writes them too and drops them at its end; the EUA program keeps them).
- id: ratio_nt50_rb
  dataset: _ISC
  group_by:
  - _ISC.USUBJID
  - _ISC.VISITNUM
  - _ISC.ADT
  filter: _EMIT = 1
  derivations:
    EPOCH: _SHELL4._EPOCH
    ANL01FL: _SHELL4._ANL01FL
    ABLPBLFL:
      case:
      - when: _R_SUBJ_BASE._X IS NOT NULL AND _R_SUBJ_POST._X IS NOT NULL
        then: '''Y'''
    _DERIVED: 1
    STUDYID: '''C4591001'''
    USUBJID: _ISC.USUBJID
    VISITNUM: _ISC.VISITNUM
    ADT: _ISC.ADT
    TRTP: _SHELL4.TRTP
    TRTA: _SHELL4.TRTA
    TRTPN: _SHELL4.TRTPN
    TRTAN: _SHELL4.TRTAN
    APERIOD: _SHELL4.APERIOD
    APERIODC: _SHELL4.APERIODC
    APERSDTM: _SHELL4.APERSDTM
    APEREDTM: _SHELL4.APEREDTM
    VISIT: _SHELL4._SHELL_VISIT
    ISDTC: _SHELL4._SHELL_ISDTC
    ADY: _SHELL4._ADY
    AVISIT: _SHELL4._AVISIT_PB
    AVISITN: _SHELL4._AVISITN_PB
    EVIMMFL: _SHELL4._EVIMMFL
    AAIMMFL: _SHELL4._AAIMMFL
    PARAMCD: '''NT50_RB'''
    PARAM: '''SARS-CoV-2 serum neutralizing titer 50 to COVID-19 RBD Ig'''
    PARAMN: 13
    PARCAT1: '''SEROLOGY'''
    PARCAT1N: 1
    SRCVAR: ''''''
    SRCDOM: ''''''
    ISTSTDTL: ''''''
    ISSTRESC: ''''''
    ANL03FL: ''''''
    ANL04FL: ''''''
    FOLD4FL: ''''''
    BSSEROC: ''''''
    ISLLOQ:
      case:
      - when: _ISC.VISITNUM = -1
        then: 0
    SRCSEQ:
      case:
      - when: _ISC.VISITNUM = -1
        then: 0
    BSSERON:
      case:
      - when: _ISC.VISITNUM = -1
        then: 0
    R2BASE4F:
      case:
      - when: _ISC.VISITNUM = -1
        then: 0
    BASE4F:
      case:
      - when: _ISC.VISITNUM = -1
        then: 0
    _RATIO_RAW: _R_NT50._AVAL_IMP / _R_RB._AVAL_IMP
    AVAL:
      round_half_away_from_zero:
        source: _RATIO_RAW
        digits: 4
    _AVAL_IMPUTED: 0
    _BASE_IMPUTED: 0
    _AVALC_BEST_RAW:
      case:
      - when: AVAL < 1
        then:
          str_decimal:
            source: AVAL
            decimals: 10
      - when: AVAL < 10
        then:
          str_decimal:
            source: AVAL
            decimals: 10
      - when: AVAL < 100
        then:
          str_decimal:
            source: AVAL
            decimals: 9
      - when: AVAL < 1000
        then:
          str_decimal:
            source: AVAL
            decimals: 8
      - when: AVAL < 10000
        then:
          str_decimal:
            source: AVAL
            decimals: 7
      - when: AVAL < 100000
        then:
          str_decimal:
            source: AVAL
            decimals: 6
      - otherwise:
          str_decimal:
            source: AVAL
            decimals: 5
    _AVALC_BEST_T1:
      str_extract:
        source: _AVALC_BEST_RAW
        pattern: ^(\d+\.\d*[1-9])0+$
        group: 1
        no_match: null
    _AVALC_BEST_T2:
      str_extract:
        source: _AVALC_BEST_RAW
        pattern: ^(\d+)\.0+$
        group: 1
        no_match: null
    _AVALC_BEST:
      case:
      - when: _AVALC_BEST_T1 IS NOT NULL
        then: _AVALC_BEST_T1
      - when: _AVALC_BEST_T2 IS NOT NULL
        then: _AVALC_BEST_T2
      - otherwise: _AVALC_BEST_RAW
    BASE:
      case:
      - when: _FIRST_NT50RB._HAS_ABL = 1
        then: _FIRST_NT50RB._RATIO_AVAL
    _BASEC_RAW: ''''''
    _BASEC_BEST_RAW:
      case:
      - when: BASE < 1
        then:
          str_decimal:
            source: BASE
            decimals: 10
      - when: BASE < 10
        then:
          str_decimal:
            source: BASE
            decimals: 10
      - when: BASE < 100
        then:
          str_decimal:
            source: BASE
            decimals: 9
      - when: BASE < 1000
        then:
          str_decimal:
            source: BASE
            decimals: 8
      - when: BASE < 10000
        then:
          str_decimal:
            source: BASE
            decimals: 7
      - when: BASE < 100000
        then:
          str_decimal:
            source: BASE
            decimals: 6
      - otherwise:
          str_decimal:
            source: BASE
            decimals: 5
    _BASEC_BEST_T1:
      str_extract:
        source: _BASEC_BEST_RAW
        pattern: ^(\d+\.\d*[1-9])0+$
        group: 1
        no_match: null
    _BASEC_BEST_T2:
      str_extract:
        source: _BASEC_BEST_RAW
        pattern: ^(\d+)\.0+$
        group: 1
        no_match: null
    _BASEC_BEST:
      case:
      - when: _BASEC_BEST_T1 IS NOT NULL
        then: _BASEC_BEST_T1
      - when: _BASEC_BEST_T2 IS NOT NULL
        then: _BASEC_BEST_T2
      - otherwise: _BASEC_BEST_RAW
    BASETYPE:
      case:
      - when: BASE IS NOT NULL
        then: '''Study (Derived)'''
    R2BASE:
      case:
      - when: (BASE > 0) AND ((ABLFL IS NULL) OR (ABLFL <> 'Y'))
        then: AVAL / BASE
    DTYPE: '''Derived'''
    ABLFL: _SHELL4._ABLFL
    APSBLFL: _SHELL4._APSBLFL
    _EMIT:
      case:
      - when: _R_NT50._AVAL_IMP IS NOT NULL AND _R_RB._AVAL_IMP IS NOT NULL
        then: 1
      - otherwise: 0
