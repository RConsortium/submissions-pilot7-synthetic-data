    # Missing without a baseline record.
    _ABLPBLFL:
      derivation:
        case:
        - when: (_HAS_ABL._X IS NOT NULL) AND (_HAS_APS._X IS NOT NULL)
          then: '''Y'''
        - when: _HAS_ABL._X IS NOT NULL
          then: '''N'''
