# ADVA for Pfizer C4591001, EUA 27034 sequence S1 (safety and final
# efficacy analysis, data snapshot of November 2020).
# Layer over the S1 (BLA) spec, run on this cut's SDTM
# (scripts/reproduce.py verify --study c4591001 --cut s1-safety-fa-eff). The
# output keeps the EUA file's columns, in its order.
#
# The EUA adva.sas is not in the release (only its output programs are), so
# this layer writes what the EUA dataset and its define say differ from the
# BLA program (spec/source/program/adam ... adva-sas.txt), a later version of
# the same program:
#   - Phase 1 and Phase 2 (360) subjects only: Phase 3 N-binding results are
#     not kept;
#   - no retests (the EUA IS has no ISTSTDTL) and no treatment periods: TRTP
#     and TRTA are the period-01 treatments, and APERIOD, the period
#     datetimes, the 4-fold-rise columns and the period-02 ADSL columns are
#     not kept;
#   - the ratio parameters to RBD IgG (NT50_RB, NT90_RB, PARAMN 13 and 14)
#     are kept, which the BLA program drops at its end;
#   - N-binding results keep their analysis visit and ANL01FL (the BLA
#     program clears them);
#   - a COVID-visit result 28 to 42 days after Dose 2 of a subject without a
#     1-month visit takes the 1-month analysis visit but no ANL01FL (it was
#     not windowed);
#   - ABLPBLFL is missing without a baseline, and on ratio records it is Y or
#     missing (no BLA final recomputation, no N);
#   - EVIMMFL is N from the post-dose positive swab date (PD1POSDT) on;
#   - EPOCH from IS, and from ADSL the reporting treatments (TRTPR, TRTAR)
#     and PD1POSDT.
# ADSL comes from helper/adsl_va.yaml: this cut's released ADSL with the
# columns adva.sas reads that the released file lacks.
yamaa: '1.0'
type: spec
parent: ../../../s1/spec/yamaa/adva.yaml
# The BLA columns the EUA dataset does not keep.
clear:
- columns.APERIOD.submission
- columns.APERIODC.submission
- columns.APERSDTM.submission
- columns.APEREDTM.submission
- columns.BASE4F.submission
- columns.R2BASE4F.submission
- columns.FOLD4FL.submission
- columns.ISTSTDTL.submission
- columns.RANDFL.submission
- columns.TRT02A.submission
- columns.TRT02AN.submission
- columns.TRT02P.submission
- columns.TRT02PN.submission
- columns.TR02SDT.submission
- columns.TR02STM.submission
- columns.TR02SDTM.submission
- columns.TR02EDT.submission
- columns.TR02ETM.submission
- columns.TR02EDTM.submission
- columns.VAX10UDT.submission
- columns.VAX201DT.submission
- columns.VAX202DT.submission
- columns.AGEGR4.submission
- columns.AGEGR4N.submission
- columns.HIVFL.submission
- columns.PEDIMMFL.submission
- columns.EV1MD2FL.submission
- columns.AGETR01.submission
- columns.VAX101.submission
- columns.VAX102.submission
- columns.VAX10U.submission
- columns.VAX201.submission
- columns.VAX202.submission
- columns.VAX20U.submission
- columns.VAX20UDT.submission
- columns.UNBLNDDT.submission
- columns.MULENRFL.submission
- columns.RAND1FL.submission
- columns.TRTSDTM.submission
- columns.TRTEDTM.submission
input:
  ADSL:
    path: <work-dir>/adsl_va.parquet
    schema: helper/adsl_va.yaml
    key:
    - STUDYID
    - USUBJID
rows:
# Phase 1 and Phase 2 subjects only.
- id: base
  filter: ADSL.PHASEN IN (1, 2)
  derivations:
    EPOCH: _ISC._EPOCH
- id: ratio_nt50_s1
  derivations:
    EPOCH: _SHELL4._SH_EPOCH
    ANL01FL: _SHELL4._SH_ANL01FL
    ABLPBLFL:
      case:
      - when: (_FIRST_NT50._HAS_ABL = 1) AND (_R_HAS_APS50._X IS NOT NULL)
        then: '''Y'''
- id: ratio_nt90_s1
  derivations:
    EPOCH: _SHELL4._SH_EPOCH
    ANL01FL: _SHELL4._SH_ANL01FL
    ABLPBLFL:
      case:
      - when: (_FIRST_NT90._HAS_ABL = 1) AND (_R_HAS_APS90._X IS NOT NULL)
        then: '''Y'''
- id: ratio_nt50_rb
  dataset: _ISC
  group_by:
  - _ISC.USUBJID
  - _ISC.VISITNUM
  - _ISC.ADT
  filter: _EMIT = 1
  derivations:
    _DERIVED: 1
    STUDYID: '''C4591001'''
    USUBJID: _ISC.USUBJID
    VISITNUM: _ISC.VISITNUM
    ADT: _ISC.ADT
    TRTP: _SHELL4.TRTP
    TRTA: _SHELL4.TRTA
    TRTPN: _SHELL4.TRTPN
    TRTAN: _SHELL4.TRTAN
    VISIT: _SHELL4._SHELL_VISIT
    ISDTC: _SHELL4._SHELL_ISDTC
    ADY: _SHELL4._ADY
    AVISIT: _SHELL4._AVISIT_PB
    AVISITN: _SHELL4._AVISITN_PB
    EVIMMFL: _SHELL4._EVIMMFL
    AAIMMFL: _SHELL4._AAIMMFL
    APERIOD: _SHELL4.APERIOD
    APERIODC: _SHELL4.APERIODC
    APERSDTM: _SHELL4.APERSDTM
    APEREDTM: _SHELL4.APEREDTM
    ISTSTDTL: ''''''
    FOLD4FL: ''''''
    R2BASE4F:
      case:
      - when: _ISC.VISITNUM = -1
        then: 0
    BASE4F:
      case:
      - when: _ISC.VISITNUM = -1
        then: 0
    EPOCH: _SHELL4._SH_EPOCH
    PARAMCD: '''NT50_RB'''
    PARAM: '''SARS-CoV-2 serum neutralizing titer 50 to COVID-19 RBD Ig'''
    PARAMN: 13
    PARCAT1: '''SEROLOGY'''
    PARCAT1N: 1
    SRCVAR: ''''''
    SRCDOM: ''''''
    ISSTRESC: ''''''
    ANL03FL: ''''''
    ANL04FL: ''''''
    BSSEROC: ''''''
    ISLLOQ:
      case:
      - when: _ISC.VISITNUM = -1
        then: 0
    SRCSEQ:
      case:
      - when: _ISC.VISITNUM = -1
        then: 0
    BSSERON:
      case:
      - when: _ISC.VISITNUM = -1
        then: 0
    _RATIO_RAW: _R_NT50._AVAL_IMP / _R_RB._AVAL_IMP
    AVAL:
      round_half_away_from_zero:
        source: _RATIO_RAW
        digits: 4
    _AVAL_IMPUTED: 0
    _BASE_IMPUTED: 0
    _AVALC_BEST_RAW:
      case:
      - when: AVAL < 1
        then:
          str_decimal:
            source: AVAL
            decimals: 10
      - when: AVAL < 10
        then:
          str_decimal:
            source: AVAL
            decimals: 10
      - when: AVAL < 100
        then:
          str_decimal:
            source: AVAL
            decimals: 9
      - when: AVAL < 1000
        then:
          str_decimal:
            source: AVAL
            decimals: 8
      - when: AVAL < 10000
        then:
          str_decimal:
            source: AVAL
            decimals: 7
      - when: AVAL < 100000
        then:
          str_decimal:
            source: AVAL
            decimals: 6
      - otherwise:
          str_decimal:
            source: AVAL
            decimals: 5
    _AVALC_BEST_T1:
      str_extract:
        source: _AVALC_BEST_RAW
        pattern: ^(\d+\.\d*[1-9])0+$
        group: 1
        no_match: null
    _AVALC_BEST_T2:
      str_extract:
        source: _AVALC_BEST_RAW
        pattern: ^(\d+)\.0+$
        group: 1
        no_match: null
    _AVALC_BEST:
      case:
      - when: _AVALC_BEST_T1 IS NOT NULL
        then: _AVALC_BEST_T1
      - when: _AVALC_BEST_T2 IS NOT NULL
        then: _AVALC_BEST_T2
      - otherwise: _AVALC_BEST_RAW
    BASE:
      case:
      - when: _FIRST_NT50_RB._HAS_ABL = 1
        then: _FIRST_NT50_RB._RATIO_AVAL
    _BASEC_RAW: ''''''
    _BASEC_BEST_RAW:
      case:
      - when: BASE < 1
        then:
          str_decimal:
            source: BASE
            decimals: 10
      - when: BASE < 10
        then:
          str_decimal:
            source: BASE
            decimals: 10
      - when: BASE < 100
        then:
          str_decimal:
            source: BASE
            decimals: 9
      - when: BASE < 1000
        then:
          str_decimal:
            source: BASE
            decimals: 8
      - when: BASE < 10000
        then:
          str_decimal:
            source: BASE
            decimals: 7
      - when: BASE < 100000
        then:
          str_decimal:
            source: BASE
            decimals: 6
      - otherwise:
          str_decimal:
            source: BASE
            decimals: 5
    _BASEC_BEST_T1:
      str_extract:
        source: _BASEC_BEST_RAW
        pattern: ^(\d+\.\d*[1-9])0+$
        group: 1
        no_match: null
    _BASEC_BEST_T2:
      str_extract:
        source: _BASEC_BEST_RAW
        pattern: ^(\d+)\.0+$
        group: 1
        no_match: null
    _BASEC_BEST:
      case:
      - when: _BASEC_BEST_T1 IS NOT NULL
        then: _BASEC_BEST_T1
      - when: _BASEC_BEST_T2 IS NOT NULL
        then: _BASEC_BEST_T2
      - otherwise: _BASEC_BEST_RAW
    BASETYPE:
      case:
      - when: BASE IS NOT NULL
        then: '''Study (Derived)'''
    R2BASE:
      case:
      - when: (BASE > 0) AND ((ABLFL IS NULL) OR (ABLFL <> 'Y'))
        then: AVAL / BASE
    DTYPE: '''Derived'''
    ABLFL: _SHELL4._ABLFL
    APSBLFL: _SHELL4._APSBLFL
    ABLPBLFL:
      case:
      - when: (_FIRST_NT50_RB._HAS_ABL = 1) AND (_R_HAS_APS50_RB._X IS NOT NULL)
        then: '''Y'''
    ANL01FL: _SHELL4._SH_ANL01FL
    _EMIT:
      case:
      - when: _R_NT50._AVAL_IMP IS NOT NULL AND _R_RB._AVAL_IMP IS NOT NULL
        then: 1
      - otherwise: 0
