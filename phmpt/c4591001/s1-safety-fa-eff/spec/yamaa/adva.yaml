intermediates:
# The EUA IS has no ISTSTDTL: no record is a retest.
- id: _RET
  filter: 'FALSE'
- id: _IS
  columns:
  - _USUBJID
  - _ISSEQ
  - _VISIT
  - _VISITNUM
  - _ISTSTDTL
  - _ISLLOQ
  - PARAMCD
  - _ISTEST
  - _ISMETHOD
  - _ISSTRESU
  - _AVAL_RAW
  - _AVALC_RAW
  - _ADY_RAW
  - _ISDTC
  - ADT
  - PARCAT1
  - SRCDOM
  - SRCVAR
  - _HAS_RETEST
  - _IS_RETEST
  - _ISUSE
  - _IS_COVID
  - _ATM_SEC
  - _ADT_MIDNIGHT
  - ADTM
  - PARAM
  - PARAMN
  - PARCAT1N
  - _AVISITN_MAP
  - _AVISIT_MAP
  - _EPOCH
  derivations:
    _ISTSTDTL:
      derivation: "''"
    _IS_RETEST:
      derivation: 0
    _EPOCH:
      type: str
      derivation: IS.EPOCH
- id: _ISC
  derivations:
    _EPOCH:
      type: str
      derivation: _IS._EPOCH
- id: _ADSL2
  derivations:
    _PD1POSDT:
      type: date
      derivation: ADSL.PD1POSDT
- id: _R_RB
  dataset: _ISC
  key:
    USUBJID: _ISC.USUBJID
    VISITNUM: _ISC.VISITNUM
    ADT: _ISC.ADT
  filter: _ISC.PARAMCD = 'C19RBDIG' AND _ISC._ISUSE = 'Y'
  order_by:
  - _ISC.ISSEQ
  keep: first
  derivations:
    _AVAL_IMP:
      type: float
      derivation:
        case:
        - when: (((_ISC._AVAL_RAW < _ISC._ISLLOQ) AND (_ISC._AVAL_RAW IS NOT NULL)) OR (_ISC._AVALC_RAW
            = 'BLQ'))
          then: _ISC._ISLLOQ * 0.5
        - otherwise: _ISC._AVAL_RAW
- id: _R_HAS_APS50_RB
  dataset: _ISC
  key:
    USUBJID: _ISC.USUBJID
  filter: _ISC.PARAMCD = 'C2NGNT50' AND _ISC._ISUSE = 'Y' AND _ISC._RB_AVAL_IMP IS NOT NULL AND _ISC._SHELL_APSBLFL
    = 'Y'
  order_by:
  - _ISC.ISSEQ
  keep: first
  derivations:
    _RB_AVAL_IMP:
      type: float
      derivation: _R_RB._AVAL_IMP
    _SHELL_APSBLFL:
      type: str
      derivation: _R_SHELL_APS._APSBLFL
    _X:
      type: int
      derivation: 1
- id: _R_HAS_APS90_RB
  dataset: _ISC
  key:
    USUBJID: _ISC.USUBJID
  filter: _ISC.PARAMCD = 'C2NGNT90' AND _ISC._ISUSE = 'Y' AND _ISC._RB_AVAL_IMP IS NOT NULL AND _ISC._SHELL_APSBLFL
    = 'Y'
  order_by:
  - _ISC.ISSEQ
  keep: first
  derivations:
    _RB_AVAL_IMP:
      type: float
      derivation: _R_RB._AVAL_IMP
    _SHELL_APSBLFL:
      type: str
      derivation: _R_SHELL_APS._APSBLFL
    _X:
      type: int
      derivation: 1
- id: _FIRST_NT50_RB
  dataset: _ISC
  key:
    USUBJID: _ISC.USUBJID
  filter: _ISC.PARAMCD = 'C2NGNT50' AND _ISC._ISUSE = 'Y' AND _ISC._RB_AVAL IS NOT NULL
  order_by:
  - _ISC.ADT
  - _ISC.VISITNUM
  keep: first
  derivations:
    _NT50_AVAL:
      type: float
      derivation:
        case:
        - when: (((_ISC._AVAL_RAW < _ISC._ISLLOQ) AND (_ISC._AVAL_RAW IS NOT NULL)) OR (_ISC._AVALC_RAW
            = 'BLQ'))
          then: _ISC._ISLLOQ * 0.5
        - otherwise: _ISC._AVAL_RAW
    _RB_AVAL:
      type: float
      derivation: _R_RB._AVAL_IMP
    _RATIO_RAW:
      type: float
      derivation: _NT50_AVAL / _RB_AVAL
    _RATIO_AVAL:
      type: float
      derivation:
        round_half_away_from_zero:
          source: _RATIO_RAW
          digits: 4
    _HAS_ABL:
      type: int
      derivation:
        case:
        - when: (_ISC.VISITNUM = _V1CELL._CELL_VISITNUM) AND (_ISC.ADT = _V1CELL._ADT)
          then: 1
        - otherwise: 0
- id: _FIRST_NT90_RB
  dataset: _ISC
  key:
    USUBJID: _ISC.USUBJID
  filter: _ISC.PARAMCD = 'C2NGNT90' AND _ISC._ISUSE = 'Y' AND _ISC._RB_AVAL IS NOT NULL
  order_by:
  - _ISC.ADT
  - _ISC.VISITNUM
  keep: first
  derivations:
    _NT90_AVAL:
      type: float
      derivation:
        case:
        - when: (((_ISC._AVAL_RAW < _ISC._ISLLOQ) AND (_ISC._AVAL_RAW IS NOT NULL)) OR (_ISC._AVALC_RAW
            = 'BLQ'))
          then: _ISC._ISLLOQ * 0.5
        - otherwise: _ISC._AVAL_RAW
    _RB_AVAL:
      type: float
      derivation: _R_RB._AVAL_IMP
    _RATIO_RAW:
      type: float
      derivation: _NT90_AVAL / _RB_AVAL
    _RATIO_AVAL:
      type: float
      derivation:
        round_half_away_from_zero:
          source: _RATIO_RAW
          digits: 4
    _HAS_ABL:
      type: int
      derivation:
        case:
        - when: (_ISC.VISITNUM = _V1CELL._CELL_VISITNUM) AND (_ISC.ADT = _V1CELL._ADT)
          then: 1
        - otherwise: 0
# Period 01 only: the treatments are TRT01P / TRT01A.
- id: _IS2
  derivations:
    TRTP:
      derivation: _TRT01P
    TRTA:
      derivation: _TRT01A
    TRTPN:
      derivation: _TRT01PN
    TRTAN:
      derivation: _TRT01AN
- id: _IS4
  derivations:
    # A COVID-visit result was not windowed: no ANL01FL.
    _ANL01FL_V3:
      derivation:
        case:
        - when: _ISC._IS_COVID = 0
          then: _IS2._ANL01FL
    _EVIMMFL:
      derivation:
        case:
        - when: (_ADSL2._PD1POSDT IS NOT NULL) AND (_ISC.ADT >= _ADSL2._PD1POSDT)
          then: '''N'''
        - when: (_ADSL2._PHASEN = 1) AND (_AVISITN_V3 < 4) AND (_ADSL2._EVAL01FL = 'Y')
          then: '''Y'''
        - when: (_ADSL2._PHASEN = 1) AND (_AVISITN_V3 < 4)
          then: '''N'''
        - when: (_ADSL2._PHASEN = 1) AND (_AVISITN_V3 >= 4) AND (_ADSL2._EVAL02FL = 'Y')
          then: '''Y'''
        - when: (_ADSL2._PHASEN = 1) AND (_AVISITN_V3 >= 4)
          then: '''N'''
        - when: ((_ADSL2._PHASEN = 2) OR (_ADSL2._PHASEN = 3) OR (_ADSL2._PHASEN = 4)) AND (_ADSL2._EVAL02FL
            = 'Y')
          then: '''Y'''
        - when: ((_ADSL2._PHASEN = 2) OR (_ADSL2._PHASEN = 3) OR (_ADSL2._PHASEN = 4))
          then: '''N'''
    # N-binding results keep their analysis visit and flag.
    _ANL01FL:
