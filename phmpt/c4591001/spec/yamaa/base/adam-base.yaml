# Parent layer for the C4591001 ADaM specifications.
#
# Declares the ADaMIG section 3.1 core columns shared by every C4591001
# ADaM dataset (type, label, core/mandatory/length) with NO derivations
# and NO origins: other datasets take these columns from ADSL, not from DM,
# so a DM-based derivation or a DM Predecessor origin in this layer would be
# wrong for them. Each dataset spec supplies its own derivations and origins,
# which merge field-by-field over this layer. Column metadata (type, length,
# label) is from the S1 ADaM define.xml (spec/define/...125742_S1...define.xml).
yamaa: '1.0'
type: spec
model: ADaM
columns:
- name: STUDYID
  type: str
  label: Study Identifier
  submission:
    core: Req
    mandatory: true
    length: 8
- name: USUBJID
  type: str
  label: Unique Subject Identifier
  submission:
    core: Req
    mandatory: true
    length: 22
- name: SUBJID
