# C4591001 S135 VS, as the S1 specs read it.
# S135's VS (SAS transport) stores VSSTRESN as text, where S1's stores a
# number; SAS reads such text as a number wherever the program compares it.
# This helper copies VS and reads VSSTRESN as a number (empty text is
# missing); the S135 ADCEVD, ADFACEVD, ADSL and ADSYMPT layers read it.
yamaa: '1.0'
type: spec
model: SDTM
domain: VSN
keys: ['USUBJID', 'VSSEQ']
input:
  SRC: <sdtm-dir>/vs.parquet
rows:
- id: records
  dataset: SRC
  derivations:
    STUDYID: SRC.STUDYID
    DOMAIN: SRC.DOMAIN
    USUBJID: SRC.USUBJID
    VSSEQ: SRC.VSSEQ
    VSREFID: SRC.VSREFID
    VSSPID: SRC.VSSPID
    VSLNKID: SRC.VSLNKID
    VSLNKGRP: SRC.VSLNKGRP
    VSTESTCD: SRC.VSTESTCD
    VSTEST: SRC.VSTEST
    VSCAT: SRC.VSCAT
    VSSCAT: SRC.VSSCAT
    VSPOS: SRC.VSPOS
    VSORRES: SRC.VSORRES
    VSORRESU: SRC.VSORRESU
    VSSTRESC: SRC.VSSTRESC
    VSSTRESN:
      value: SRC.VSSTRESN
      unconvertible: null
    VSSTRESU: SRC.VSSTRESU
    VSSTAT: SRC.VSSTAT
    VSREASND: SRC.VSREASND
    VSLOC: SRC.VSLOC
    VSBLFL: SRC.VSBLFL
    VSDRVFL: SRC.VSDRVFL
    VSEVAL: SRC.VSEVAL
    VISITNUM: SRC.VISITNUM
    VISIT: SRC.VISIT
    EPOCH: SRC.EPOCH
    VSDTC: SRC.VSDTC
    VSDY: SRC.VSDY
    VSTPT: SRC.VSTPT
    VSTPTNUM: SRC.VSTPTNUM
    VSTPTREF: SRC.VSTPTREF
    VSRFTDTC: SRC.VSRFTDTC
    VSEVLINT: SRC.VSEVLINT
    VSEVINTX: SRC.VSEVINTX
columns:
- {name: STUDYID, type: str, label: STUDYID}
- {name: DOMAIN, type: str, label: DOMAIN}
- {name: USUBJID, type: str, label: USUBJID}
- {name: VSSEQ, type: float, label: VSSEQ}
- {name: VSREFID, type: str, label: VSREFID}
- {name: VSSPID, type: str, label: VSSPID}
- {name: VSLNKID, type: str, label: VSLNKID}
- {name: VSLNKGRP, type: str, label: VSLNKGRP}
- {name: VSTESTCD, type: str, label: VSTESTCD}
- {name: VSTEST, type: str, label: VSTEST}
- {name: VSCAT, type: str, label: VSCAT}
- {name: VSSCAT, type: str, label: VSSCAT}
- {name: VSPOS, type: str, label: VSPOS}
- {name: VSORRES, type: str, label: VSORRES}
- {name: VSORRESU, type: str, label: VSORRESU}
- {name: VSSTRESC, type: str, label: VSSTRESC}
- {name: VSSTRESN, type: float, label: VSSTRESN}
- {name: VSSTRESU, type: str, label: VSSTRESU}
- {name: VSSTAT, type: str, label: VSSTAT}
- {name: VSREASND, type: str, label: VSREASND}
- {name: VSLOC, type: str, label: VSLOC}
- {name: VSBLFL, type: str, label: VSBLFL}
- {name: VSDRVFL, type: str, label: VSDRVFL}
- {name: VSEVAL, type: str, label: VSEVAL}
- {name: VISITNUM, type: float, label: VISITNUM}
- {name: VISIT, type: str, label: VISIT}
- {name: EPOCH, type: str, label: EPOCH}
- {name: VSDTC, type: str, label: VSDTC}
- {name: VSDY, type: float, label: VSDY}
- {name: VSTPT, type: str, label: VSTPT}
- {name: VSTPTNUM, type: float, label: VSTPTNUM}
- {name: VSTPTREF, type: str, label: VSTPTREF}
- {name: VSRFTDTC, type: str, label: VSRFTDTC}
- {name: VSEVLINT, type: str, label: VSEVLINT}
- {name: VSEVINTX, type: str, label: VSEVINTX}
output:
  path: <work-dir>/vs.parquet
  columns: [STUDYID, DOMAIN, USUBJID, VSSEQ, VSREFID, VSSPID, VSLNKID, VSLNKGRP, VSTESTCD, VSTEST, VSCAT, VSSCAT, VSPOS, VSORRES, VSORRESU, VSSTRESC, VSSTRESN, VSSTRESU, VSSTAT, VSREASND, VSLOC, VSBLFL, VSDRVFL, VSEVAL, VISITNUM, VISIT, EPOCH, VSDTC, VSDY, VSTPT, VSTPTNUM, VSTPTREF, VSRFTDTC, VSEVLINT, VSEVINTX]
