# ADMH for Pfizer C4591001, S135 (EUA 27034 sequence 135).
# Layer over the 1-month spec: S135 resubmits the S1 analysis data, and its
# SDTM equals S1's apart from AE and DS records and its storage, so the S1
# derivations run on this cut's SDTM
# (scripts/reproduce.py verify --study c4591001 --cut s135).
# MH comes from helper/sdtm_mh.yaml (S135's MH is a JMP table, read there as
# ISO dates); MHSTDTC and MHENDTC are copied as the JMP table writes them
# (M/D/YYYY), from MHRAW.
# This cut's submitted ADMH stores the ADSL dates as DDMonYYYY text, times as
# H:MM:SS text and datetimes as 'DDMonYYYY H:MM:SS AM' text, and SUBJID,
# SITEID and MHSPID as numbers; it carries no ADTF or VAX20U.

yamaa: '1.0'
type: spec
parent: ../../../s211-1mth/spec/yamaa/admh.yaml
input:
  MH:
    path: <work-dir>/mh.parquet
    schema: helper/sdtm_mh.yaml
  MHRAW:
    path: <sdtm-dir>/mh.parquet
    key: [USUBJID, MHSEQ]
