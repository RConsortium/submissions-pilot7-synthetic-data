# ADMH for Pfizer C4591001, S211 1-month cut (BLA 125742 sequence 45).
# Layer over ../s1/admh.yaml: this cut's submitted ADMH has the same rows as
# S1's, so the S1 derivations run on this cut's SDTM inputs, with the storage
# differences below
# (scripts/reproduce.py verify --study c4591001 --cut s211-1mth).
yamaa: '1.0'
type: spec
parent: ../../../s1/spec/yamaa/admh.yaml
# This cut's submitted ADMH is stored with typed values where S1's holds text:
# the ADSL dates, times and datetimes are dates, times and datetimes (S1:
# date9./time5./m/d/y text), SUBJID, SITEID and MHSPID are text (S1: numbers),
# ADT is a date (S1: SAS seconds), and ASTDT/AENDT read ddMONyyyy (S1:
# d-Mon-yy). It also adds two all-blank columns S1's does not carry: ADTF (no
# analysis date is imputed) and VAX20U (from ADSL).
clear:
- columns.RANDDT.submission.length
- columns.TRTSDT.submission.length
- columns.TRTEDT.submission.length
- columns.TR01SDT.submission.length
- columns.TR01EDT.submission.length
- columns.TR02SDT.submission.length
- columns.TR02EDT.submission.length
- columns.VAX101DT.submission.length
- columns.VAX102DT.submission.length
- columns.VAX10UDT.submission.length
- columns.VAX201DT.submission.length
- columns.VAX202DT.submission.length
- columns.VAX20UDT.submission.length
- columns.UNBLNDDT.submission.length
- columns.TRTSTM.submission.length
- columns.TRTETM.submission.length
- columns.TR01STM.submission.length
- columns.TR01ETM.submission.length
- columns.TR02STM.submission.length
- columns.TR02ETM.submission.length
- columns.TRTSDTM.submission.length
- columns.TRTEDTM.submission.length
- columns.TR01SDTM.submission.length
- columns.TR01EDTM.submission.length
- columns.TR02SDTM.submission.length
- columns.TR02EDTM.submission.length
- columns.SUBJID.submission.significant_digits
- columns.SITEID.submission.significant_digits
- columns.MHSPID.submission.significant_digits
- columns.ADT.submission.length
- columns.ADT.submission.significant_digits
intermediates:
- id: _MH_D2
  derivations:
    # This cut leaves ADURN blank when the start date is missing (S1: '0').
    _ADURN_STR2:
      type: str
      derivation:
        case:
        - when: MH.MHSTDTC = '(b)(6)' OR MH.MHENDTC = '(b)(6)'
          then: '''(b)(6)'''
        - when: MH.MHSTDTC IS NULL OR MH.MHSTDTC = ''
          then: "''"
        - when: _ADURN_F IS NULL
          then: '''0'''
        - otherwise: _ADURN_STR
    _ASTDT_YR:
      type: str
      derivation:
        str_substr:
          source: _ASTDT_ISO
          start: 1
          length: 4
    _ASTDT_DAY:
      type: str
      derivation: _ASTDT_D2
    _ASTDT_D9:
      type: str
      derivation:
        str_template:
          template: '{_ASTDT_DAY}{_ASTDT_MON}{_ASTDT_YR}'
          missing: null
    _AENDT_YR:
      type: str
      derivation:
        str_substr:
          source: _AENDT_ISO
          start: 1
          length: 4
    _AENDT_DAY:
      type: str
      derivation: _AENDT_D2
    _AENDT_D9:
      type: str
      derivation:
        str_template:
          template: '{_AENDT_DAY}{_AENDT_MON}{_AENDT_YR}'
          missing: null
