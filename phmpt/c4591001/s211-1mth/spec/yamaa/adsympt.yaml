# ADSYMPT for Pfizer C4591001, S211 1-month cut (BLA 125742 sequence 45).
# Layer over ../s1/adsympt.yaml: this cut's submitted ADSYMPT has the same rows as
# S1's, so the S1 derivations run unchanged on this cut's SDTM inputs
# (scripts/reproduce.py verify --study c4591001 --cut s211-1mth).
yamaa: '1.0'
type: spec
parent: ../../../s1/spec/yamaa/adsympt.yaml
# This cut's submitted ADSL names the birth-date text BRTHDT (S1's: BRTHDT_2;
# see adsl.yaml), so the ADSL lookups read BRTHDT here.
columns:
- name: BRTHDT
  derivation: ADSL.BRTHDT
  submission:
    origins:
    - type: Predecessor
      description: ADSL.BRTHDT
