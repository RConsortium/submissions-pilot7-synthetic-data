# ADC19EF for Pfizer C4591001, S211 1-month cut (BLA 125742 sequence 45).
# Layer over ../s1/adc19ef.yaml: this cut's submitted ADC19EF has the same rows as
# S1's, so the S1 derivations run unchanged on this cut's SDTM inputs
# (scripts/reproduce.py verify --study c4591001 --cut s211-1mth).
yamaa: '1.0'
type: spec
parent: ../../../s1/spec/yamaa/adc19ef.yaml
# This cut's submitted ADSL names the birth-date text BRTHDT (S1's: BRTHDT_2;
# see adsl.yaml), so the ADSL lookups read BRTHDT here.
intermediates:
- id: _ADSL_BY_SUBJ
  derivations:
    _BRTHDT:
      type: str
      derivation: ADSL.BRTHDT
- id: _SUBJ
  derivations:
    _BRTHDT:
      type: str
      derivation: ADSL.BRTHDT
columns:
- name: BRTHDT
  derivation: _ADSL_PLAIN.BRTHDT
  submission:
    origins:
    - type: Predecessor
      description: ADSL.BRTHDT
