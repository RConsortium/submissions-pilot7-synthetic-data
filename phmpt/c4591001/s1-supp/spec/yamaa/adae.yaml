# ADAE for Pfizer C4591001, BLA 125742 S1 supplementary datasets (the
# "Supp" deliverable of sequence S1). The supplement resends AE, CE, DM, EX,
# FACE, RELREC and the SUPPAE, SUPPCE, SUPPFACE, SUPPMB and SUPPVS domains;
# the others are S1's (studies.yaml sdtm_from). Layer over the S1 spec
# (scripts/reproduce.py verify --study c4591001 --cut s1-supp).
yamaa: '1.0'
type: spec
parent: ../../../s1/spec/yamaa/adae.yaml
# The supplement's SUPPAE adds the QNAMs REACCRIT and AEMOD.
intermediates:
- id: SUPPAE_P
  filter: SUPPAE.QNAM IN ('DICTVER', 'AESUBJDC', 'AECMGIV', 'AENDGIV', 'AEMERES', 'AERELTXT', 'AEMEFL',
    'AEAENO', 'REACCRIT', 'AEMOD') AND SUPPAE.IDVAR = 'AESEQ'
  pivot:
    name: QNAM
    value: QVAL
    fields: [DICTVER, AESUBJDC, AECMGIV, AENDGIV, AEMERES, AERELTXT, AEMEFL, AEAENO, REACCRIT, AEMOD]
columns:
- name: AEMOD
  type: str
  label: Modified Reported Term
  derivation: SUPPAE_P.AEMOD
  submission:
    core: Perm
    mandatory: false
    length: 200
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: REACCRIT
  type: str
  label: Reactogenicity Criteria Flag
  derivation: SUPPAE_P.REACCRIT
  submission:
    core: Perm
    mandatory: false
    length: 1
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
