# ADSYMPT for Pfizer C4591001, S211 6-month cut (BLA 125742 sequence 45),
# the 12-15-year-old cohort.
# Layer over the 1-month spec, run on this cut's SDTM
# (scripts/reproduce.py verify --study c4591001 --cut s211-6mth). The output
# keeps the 6-month file's columns, in its order; the program keeps only the
# subjects of its ADSL (one DM subject has no ADSL record).
# The 6-month adsympt.sas reads no PR or DD: both are empty tables
# (helper/no_pr.yaml, helper/no_dd.yaml), also for the visit helpers.
yamaa: '1.0'
type: spec
parent: ../../../s211-1mth/spec/yamaa/adsympt.yaml
input:
  PR:
    path: <work-dir>/pr.parquet
    schema: helper/no_pr.yaml
  DD:
    path: <work-dir>/dd.parquet
    schema: helper/no_dd.yaml
  VISMAP:
    path: <work-dir>/adsympt_vismap.parquet
    schema: helper/adsympt_vismap.yaml
clear:
- columns.PRPRESP.submission
columns:
- name: EV14EFFL
  type: str
  label: Evaluable Efficacy Popu Flag - 14 days
  derivation: ADSL.EV14EFFL
  submission:
    core: Perm
    mandatory: false
    origins:
    - type: Predecessor
      description: ADSL.EV14EFFL
output:
  columns:
  - STUDYID
  - USUBJID
  - SITEID
  - SUBJID
  - BRTHDT
  - AGEGR1N
  - AGEGR1
  - SEX
  - RACE
  - ETHNIC
  - ARMCD
  - ARM
  - ACTARMCD
  - ACTARM
  - PARAMN
  - PARAMCD
  - PARAM
  - PARCAT1
  - PARCAT2
  - AVAL
  - AVALC
  - VISITNUM
  - VISIT
  - AVISITN
  - AVISIT
  - ADT
  - ADY
  - ASTDT
  - ASTDY
  - AENDT
  - AENDY
  - ISSPEC
  - ISMETHOD
  - MBLOC
  - MBSPEC
  - MBMETHOD
  - VSSTRESU
  - RANDDT
  - TRTSDT
  - TRTEDT
  - VAX101DT
  - VAX102DT
  - ENRLFL
  - RANDFL
  - SAFFL
  - EVALEFFL
  - EV14EFFL
  - AAI1EFFL
  - AAI2EFFL
  - C19ILHFL
  - _SEQ
