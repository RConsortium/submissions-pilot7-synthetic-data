columns:
- name: SURVICDT
  type: date
  label: Asymptomatic Surveillance Consented Date
  derivation: SV_SURV._DT
  submission:
    core: Perm
    mandatory: false
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: INCL17FL
  type: str
  label: Have N-Binding result PD2
  derivation:
    case:
    - when: NB_I._CAND IS NOT NULL
      then: "'Y'"
    - otherwise: "'N'"
  submission:
    core: Perm
    mandatory: false
    length: 1
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: EXCL17FL
  type: str
  label: Exclusion Flag 17
  derivation:
    case:
    - when: INCL17FL <> 'Y' AND INCL1FL = 'Y'
      then: "'Y'"
    - otherwise: "''"
  submission:
    core: Perm
    mandatory: false
    length: 1
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: EXCRIT17
  type: str
  label: Exclusion Criterion 17
  derivation:
    case:
    - when: EXCL17FL = 'Y'
      then: "'did not have N-binding test result at a post(*ESC*){unicode 2013}Dose 2 visit'"
    - otherwise: "''"
  submission:
    core: Perm
    mandatory: false
    length: 77
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: _NB1DT
  type: date
  derivation: NB_I._CAND
- name: INCL18FL
  type: str
  label: No PD prior to 1st N-Binding test PD2
  derivation:
    case:
    - when: NOT (POP2PDDT IS NOT NULL AND _NB1DT IS NOT NULL AND POP2PDDT < _NB1DT)
      then: "'Y'"
    - otherwise: "'N'"
  submission:
    core: Perm
    mandatory: false
    length: 1
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: EXCL18FL
  type: str
  label: Exclusion Flag 18
  derivation:
    case:
    - when: INCL18FL <> 'Y' AND _NB1DT IS NOT NULL
      then: "'Y'"
    - otherwise: "''"
  submission:
    core: Perm
    mandatory: false
    length: 1
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: EXCRIT18
  type: str
  label: Exclusion Criterion 18
  derivation:
    case:
    - when: EXCL18FL = 'Y'
      then: "'had important protocol deviation(s) as determined by the clinician for Efficacy (prior to the first post(*ESC*){unicode 2013}Dose 2 N-binding antibody test) Population'"
    - otherwise: "''"
  submission:
    core: Perm
    mandatory: false
    length: 167
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: _NE
  type: int
  derivation:
    case:
    - when: RSEXSAF IS NOT NULL AND str_contains(RSEXSAF, 'Efficacy')
      then: 0
    - otherwise: 1
- name: _V10U2
  type: int
  derivation:
    diff:
      type: date
      start: VAX102DT
      end: VAX10UDT
      unit: day
- name: _UNB2
  type: int
  derivation:
    diff:
      type: date
      start: VAX102DT
      end: UNBLNDDT
      unit: day
- name: EVASEFFL
  type: str
  label: Evaluable Efficacy Pop Flag - Asympt
  derivation:
    case:
    - when: SAFFL = 'Y' AND _NE = 1 AND INCL1FL = 'Y' AND INCL7FL = 'Y' AND SURVICDT IS NOT NULL AND NOT (VAX10UDT
        IS NOT NULL AND VAX10UDT <= SURVICDT) AND NOT (POP2PDDT IS NOT NULL AND POP2PDDT <= SURVICDT)
      then: "'Y'"
    - otherwise: "'N'"
  submission:
    core: Perm
    mandatory: false
    length: 1
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: EVSCEFFL
  type: str
  label: Evaluable Efficacy Pop Flag - Seroconv
  derivation:
    case:
    - when: SAFFL = 'Y' AND _NE = 1 AND INCL1FL = 'Y' AND INCL7FL = 'Y' AND NOT (VAX10UDT IS NOT NULL AND _NB1DT
        IS NOT NULL AND VAX10UDT <= _NB1DT) AND INCL17FL = 'Y' AND INCL18FL = 'Y'
      then: "'Y'"
    - otherwise: "'N'"
  submission:
    core: Perm
    mandatory: false
    length: 1
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: EV14EFFL
  type: str
  label: Evaluable Efficacy Popu Flag - 14 days
  derivation:
    case:
    - when: RFICDT IS NOT NULL AND RANDFL = 'Y' AND (ARM IS NULL OR ARM <> 'SCREEN FAILURE') AND INCL2FL = 'Y' AND
        INCL7FL = 'Y' AND (VAX10UDT IS NULL OR (VAX102DT IS NOT NULL AND VAX10UDT > VAX102DT AND _V10U2 >= 14))
        AND VAX102DT IS NOT NULL AND (UNBLNDDT IS NULL OR _UNB2 >= 14) AND SAFFL = 'Y' AND INCL1FL = 'Y' AND
        NOT (DV_POP2._QVAL IS NOT NULL AND (POP2PDDT IS NULL OR _P2D < 14)) AND _NE = 1
      then: "'Y'"
    - otherwise: "'N'"
  submission:
    core: Perm
    mandatory: false
    length: 1
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: AAI2ASFL
  type: str
  label: Dose 2 all-available Asympt Popu Flag
  derivation:
    case:
    - when: RANDFL = 'Y' AND SAFFL = 'Y' AND VAX101DT IS NOT NULL AND VAX102DT IS NOT NULL AND _NE = 1
      then: "'Y'"
    - otherwise: "'N'"
  submission:
    core: Perm
    mandatory: false
    length: 1
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: COMPLDT
  type: date
  label: Date of Completion
  derivation: DS_COMPL._CAND
  submission:
    core: Perm
    mandatory: false
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: PD1POSDT
  type: date
  label: Post-dose Positive Swab Result Date
  derivation:
    least:
      sources: [PD1_C._DT, PD1_L._CAND]
  submission:
    core: Perm
    mandatory: false
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: TRTDELT
  type: str
  label: Adjusted Treatment for Rel. Efficacy
  derivation:
    case:
    - when: PHASEN > 1 AND UNBLNDDT IS NOT NULL AND VAX201DT IS NOT NULL AND VAX202DT IS NOT NULL AND VAX201DT
        >= UNBLNDDT
      then: "'Placebo'"
    - when: PHASEN > 1
      then: "'BNT162b2 Phase 2/3 (30 mcg)'"
  submission:
    core: Perm
    mandatory: false
    length: 27
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: TRTDELTN
  type: int
  label: Adjusted Treatment for Rel. Efficacy (N)
  derivation:
    mapping:
      source: TRTDELT
      dict:
        Placebo: 9
        BNT162b2 Phase 2/3 (30 mcg): 8
      unmapped: null
  submission:
    core: Perm
    mandatory: false
    length: 8
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: POP1PDDT
  type: date
  label: First PD date for safety
  derivation: DV_P1D._PDT
  submission:
    core: Perm
    mandatory: false
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: POP2PDDT
  type: date
  label: First PD date for efficacy
  derivation: DV_P2D._PDT
  submission:
    core: Perm
    mandatory: false
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: POP3PDDT
  type: date
  label: First PD date for immunogenicity
  derivation: DV_P3D._PDT
  submission:
    core: Perm
    mandatory: false
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
# Working columns of INCL6FL and EXCRIT6 (the 6-month adsl.sas), not output.
- name: _VIS3DT
  type: date
  derivation:
    case:
    - when: BLDV6DT IS NOT NULL
      then: BLDV6DT
    - otherwise: SV_M1._CAND
- name: _V2P42
  type: date
  derivation:
    shift:
      type: date
      source: VAX102DT
      days: 42
- name: _V2P8
  type: date
  derivation:
    shift:
      type: date
      source: VAX102DT
      days: 8
- name: _V3DATE
  type: date
  derivation:
    case:
    - when: PHASEN <> 1 AND BLDV6DT IS NOT NULL
      then: BLDV6DT
    - when: PHASEN <> 1 AND SV_V3P2._DT IS NOT NULL
      then: SV_V3P2._DT
    - when: PHASEN <> 1
      then: _V2P42
    - when: BLDV4DT IS NOT NULL
      then: BLDV4DT
    - when: SV_V5P1._CAND IS NOT NULL
      then: SV_V5P1._CAND
    - otherwise: _V2P8
- name: _P2D
  type: int
  derivation:
    diff:
      type: date
      start: VAX102DT
      end: POP2PDDT
      unit: day
- name: _P3D1
  type: int
  derivation:
    diff:
      type: date
      start: VAX101DT
      end: POP3PDDT
      unit: day
- name: _T1
  type: str
  derivation:
    case:
    - when: DV_POP1._QVAL IS NOT NULL
      then: "'Safety'"
    - otherwise: "''"
- name: _T2
  type: str
  derivation:
    case:
    - when: DV_POP2._QVAL IS NOT NULL AND _P2D IS NOT NULL AND _P2D < 7
      then: "'Efficacy (within 7 days post Dose 2)'"
    - when: DV_POP2._QVAL IS NOT NULL AND _P2D IS NOT NULL AND _P2D >= 7 AND _P2D < 14
      then: "'Efficacy (between 7-14 days post Dose 2)'"
    - when: DV_POP2._QVAL IS NOT NULL AND _P2D IS NOT NULL AND _P2D >= 14 AND _VIS3DT IS NOT NULL AND POP2PDDT
        <= _VIS3DT
      then: "'Efficacy (between 14 days - 1 month post Dose 2)'"
    - otherwise: "''"
- name: _T3
  type: str
  derivation:
    case:
    - when: DV_POP3._QVAL IS NULL
      then: "''"
    - when: POP3PDDT IS NOT NULL AND BLDV3DT IS NOT NULL AND POP3PDDT <= BLDV3DT
      then: "'Immunogenicity (on or before 3 weeks post Dose 1)'"
    - when: BLDV3DT IS NULL AND POP3PDDT IS NOT NULL AND SV_W3._CAND IS NOT NULL AND POP3PDDT <= SV_W3._CAND
      then: "'Immunogenicity (on or before 3 weeks post Dose 1)'"
    - when: BLDV3DT IS NULL AND SV_W3._CAND IS NULL AND VAX101DT IS NOT NULL AND POP3PDDT IS NOT NULL AND _P3D1
        <= 23
      then: "'Immunogenicity (on or before 3 weeks post Dose 1)'"
    - when: VAX101DT IS NULL
      then: "'Immunogenicity (on or before 3 weeks post Dose 1)'"
    - when: ((POP3PDDT IS NOT NULL AND _V3DATE IS NOT NULL AND POP3PDDT <= _V3DATE) OR (_V3DATE IS NULL AND
        DV_P3E._E = 1)) AND PHASEN <> 1
      then: "'Immunogenicity (on or before 1 month post Dose 2)'"
    - when: ((POP3PDDT IS NOT NULL AND _V3DATE IS NOT NULL AND POP3PDDT <= _V3DATE) OR (_V3DATE IS NULL AND
        DV_P3E._E = 1)) AND PHASEN = 1
      then: "'Immunogenicity (on or before 1 week post Dose 2)'"
    - otherwise: "''"
- name: _T12
  type: str
  derivation:
    case:
    - when: _T1 <> '' AND _T2 <> ''
      then:
        str_template: '{_T1}, {_T2}'
    - when: _T2 <> ''
      then: _T2
    - otherwise: _T1
- name: _T123
  type: str
  derivation:
    case:
    - when: _T12 <> '' AND _T3 <> ''
      then:
        str_template: '{_T12}, {_T3}'
    - when: _T3 <> ''
      then: _T3
    - otherwise: _T12
- name: INCL6FL
  derivation:
    case:
    - when: DV_POP1._QVAL IS NOT NULL
      then: "'N'"
    - when: DV_POP2._QVAL IS NOT NULL AND NOT (_VIS3DT IS NOT NULL AND POP2PDDT IS NOT NULL AND _VIS3DT < POP2PDDT)
        AND (VAX102DT IS NULL OR (POP2PDDT IS NOT NULL AND POP2PDDT <= VAX102DT) OR POP2PDDT IS NULL OR _P2D
        < 14 OR (_P2D >= 14 AND _VIS3DT IS NOT NULL AND POP2PDDT <= _VIS3DT))
      then: "'N'"
    - when: DV_POP3._QVAL IS NOT NULL AND TRT02P IS NOT NULL AND str_contains(TRT02P, 'Dose')
      then: "''"
    - when: DV_POP3._QVAL IS NOT NULL AND (DV_P3E._E IS NULL OR DV_P3E._E = 0)
      then: "'Y'"
    - when: DV_POP3._QVAL IS NOT NULL AND _V3DATE IS NOT NULL AND POP3PDDT IS NOT NULL AND _V3DATE < POP3PDDT
      then: "'Y'"
    - when: DV_POP3._QVAL IS NOT NULL
      then: "'N'"
    - otherwise: "'Y'"
  submission:
    method: "Withheld from publication: the received define states this text."
- name: EV1MD2FL
  derivation:
    case:
    - when: PHASEN >= 2 AND TRT01AN IN (8, 9) AND EV1_VRB._SC = 1 AND EV1_CRD1._SC = 1 AND EV1_CRD2._SC = 1
        AND V3X_I._V3DT IS NOT NULL AND (EV1_POSN._INWIN IS NULL OR EV1_POSN._INWIN <> 1) AND (EV1_EXCL._INWIN
        IS NULL OR EV1_EXCL._INWIN <> 1)
      then: "'Y'"
    - otherwise: "'N'"
  submission:
    method: "Withheld from publication: the received define states this text."
- name: INCL9FL
  label: Have valid immuno within timeframe 2
  derivation:
    case:
    - when: PHASEN <> 1 AND INCL9_I._IN = 1 AND VAX102DT IS NOT NULL
      then: "'Y'"
    - when: PHASEN = 1 AND INCL9P1_I._IN = 1 AND VAX102DT IS NOT NULL
      then: "'Y'"
    - otherwise: "'N'"
  submission:
    method: "Withheld from publication: the received define states this text."
- name: EXCRIT9
  derivation:
    case:
    - when: (((INCL1FL = 'Y' AND INCL2FL = 'Y') AND INCL9FL = 'N' AND VAX102DT IS NOT NULL) AND PHASEN
        <> 1)
      then: "'did not have at least 1 valid and determinate immunogenicity result within 28-42 days after Dose 2'"
    - when: (((INCL1FL = 'Y' AND INCL2FL = 'Y') AND INCL9FL = 'N' AND VAX102DT IS NOT NULL) AND PHASEN
        = 1)
      then: "'did not have at least 1 valid and determinate immunogenicity result within 6-8 days after Dose 2'"
    - otherwise: "''"
  submission:
    length: 98
    method: "Withheld from publication: the received define states this text."
- name: EXCRIT6
  derivation:
    case:
    - when: INCL6FL = 'N' AND _T123 <> ''
      then:
        str_template: 'had important protocol deviation(s) as determined by the clinician for {_T123} Population(s)'
    - otherwise: "''"
  submission:
    length: 172
    method: "Withheld from publication: the received define states this text."
- name: FUP2CAT2
  submission:
    length: 12
