# ADSL for Pfizer C4591001, S211 6-month cut (BLA 125742 sequence 45),
# the 12-15-year-old cohort.
# Layer over the 1-month spec, run on this cut's SDTM
# (scripts/reproduce.py verify --study c4591001 --cut s211-6mth). The output
# keeps the 6-month file's columns, in its order; the program keeps only the
# subjects of its ADSL (one DM subject has no ADSL record).
# The 6-month adsl.sas reads no PR: PR is an empty table (helper/no_pr.yaml).
yamaa: '1.0'
type: spec
parent: ../../../s211-1mth/spec/yamaa/adsl.yaml
input:
  ADSYMPT: <adam-dir>/adsympt.parquet
  PR:
    path: <work-dir>/pr.parquet
    schema: helper/no_pr.yaml
# The 6-month program censors at its snapshot, &cutoff2 = 02SEP2021.
intermediates:
- id: CUT_I
  derivations:
    _CUT:
      type: date
      derivation: DATE '2021-09-02'
# A missed 1-month (V3) or 6-month (V4) blood sample is replaced by a
# COVID, V101_VAX3 or V201_SURVEIL_CONSENT sample taken within 7 days of the
# missed visit's SV date, or within the dose window (28-42 days after Dose 2
# for V3, 175-189 for V4); the closest to the visit date, or else to Dose 2
# + 30 / + 180 days, wins (the 6-month adsl.sas rep_c / rep_d).
- id: SV_V3
  dataset: SV
  key:
  - USUBJID
  filter: SV.VISIT = 'V3_MONTH1_POSTVAX2_L' AND SV.SVSTDTC IS NOT NULL
  order_by:
  - SV.SVSTDTC
  keep: first
  derivations:
    _DT:
      type: date
      derivation:
        to_date:
          source: SV.SVSTDTC
- id: SV_V4
  dataset: SV
  key:
  - USUBJID
  filter: SV.VISIT = 'V4_MONTH6_L' AND SV.SVSTDTC IS NOT NULL
  order_by:
  - SV.SVSTDTC
  keep: first
  derivations:
    _DT:
      type: date
      derivation:
        to_date:
          source: SV.SVSTDTC
- id: CO_V3R
  dataset: CO
  key:
  - USUBJID
  filter: (str_contains(CO.VISIT, 'COVID') OR CO.VISIT = 'V101_VAX3' OR CO.VISIT = 'V201_SURVEIL_CONSENT')
    AND CO.RDOMAIN = 'IS' AND CO.COREF = 'Sample Collected' AND CO.COVAL = 'Y'
  order_by:
  - variable: CO._IN
    direction: desc
  - variable: CO._DIST
    direction: asc
    nulls: last
  keep: first
  derivations:
    _CODT:
      type: date
      derivation:
        to_date:
          source: CO.CODTC
    _D2DIFF:
      type: int
      derivation:
        diff:
          type: date
          start: D_VAX102._DT
          end: _CODT
          unit: day
    _SVDIFF:
      type: int
      derivation:
        diff:
          type: date
          start: SV_V3._DT
          end: _CODT
          unit: day
    _IN:
      type: int
      derivation:
        case:
        - when: (_SVDIFF >= -7 AND _SVDIFF <= 7) OR (_D2DIFF >= 28 AND _D2DIFF <= 42)
          then: 1
        - otherwise: 0
    _DIST:
      type: int
      derivation:
        case:
        - when: SV_V3._DT IS NOT NULL
          then: abs(_SVDIFF)
        - otherwise: abs(_D2DIFF - 30)
    _VISITNUM:
      type: float
      derivation:
        case:
        - when: _IN = 1
          then: CO.VISITNUM
    _CODTC:
      type: str
      derivation:
        case:
        - when: _IN = 1
          then: CO.CODTC
- id: CO_V4R
  dataset: CO
  key:
  - USUBJID
  filter: (str_contains(CO.VISIT, 'COVID') OR CO.VISIT = 'V101_VAX3' OR CO.VISIT = 'V201_SURVEIL_CONSENT')
    AND CO.RDOMAIN = 'IS' AND CO.COREF = 'Sample Collected' AND CO.COVAL = 'Y'
  order_by:
  - variable: CO._IN
    direction: desc
  - variable: CO._DIST
    direction: asc
    nulls: last
  keep: first
  derivations:
    _CODT:
      type: date
      derivation:
        to_date:
          source: CO.CODTC
    _D2DIFF:
      type: int
      derivation:
        diff:
          type: date
          start: D_VAX102._DT
          end: _CODT
          unit: day
    _SVDIFF:
      type: int
      derivation:
        diff:
          type: date
          start: SV_V4._DT
          end: _CODT
          unit: day
    _IN:
      type: int
      derivation:
        case:
        - when: (_SVDIFF >= -7 AND _SVDIFF <= 7) OR (_D2DIFF >= 175 AND _D2DIFF <= 189)
          then: 1
        - otherwise: 0
    _DIST:
      type: int
      derivation:
        case:
        - when: SV_V4._DT IS NOT NULL
          then: abs(_SVDIFF)
        - otherwise: abs(_D2DIFF - 180)
    _VISITNUM:
      type: float
      derivation:
        case:
        - when: _IN = 1
          then: CO.VISITNUM
    _CODTC:
      type: str
      derivation:
        case:
        - when: _IN = 1
          then: CO.CODTC
- id: SUBCOV1
  derivations:
    _COVVISNUM:
      type: float
      derivation: CO_V3R._VISITNUM
    _COVDTC:
      type: str
      derivation: CO_V3R._CODTC
- id: SUBCOV2
  derivations:
    _COVVISNUM:
      type: float
      derivation: CO_V4R._VISITNUM
    _COVDTC:
      type: str
      derivation: CO_V4R._CODTC
# The visit 3 date of EV1MD2FL (the 6-month adsl.sas dt_c19_rt_1): the V3
# SV date when ADSYMPT has a C19NIG or RTCOV2NS result at V3; else the date
# of a V201_SURVEIL_CONSENT, V101_VAX3 or convalescent (A1 .. H1) visit with
# such a result, dated 28-42 days after Dose 2 (day 1 = Dose 2) or within 7
# days of the V3 date, in that order of precedence.
- id: A_V3
  dataset: ADSYMPT
  key:
  - USUBJID
  filter: ADSYMPT.PARAMCD IN ('C19NIG', 'RTCOV2NS') AND ADSYMPT.AVALC IS NOT NULL AND ADSYMPT.AVALC <> ''
    AND (ADSYMPT.VISIT = 'V3_MONTH1_POSTVAX2_L')
  order_by:
  - ADSYMPT.ADT
  keep: first
  derivations:
    _U:
      type: str
      derivation: ADSYMPT.USUBJID
- id: A_V101
  dataset: ADSYMPT
  key:
  - USUBJID
  filter: ADSYMPT.PARAMCD IN ('C19NIG', 'RTCOV2NS') AND ADSYMPT.AVALC IS NOT NULL AND ADSYMPT.AVALC <> ''
    AND (ADSYMPT.VISIT = 'V101_VAX3')
  order_by:
  - ADSYMPT.ADT
  keep: first
  derivations:
    _U:
      type: str
      derivation: ADSYMPT.USUBJID
- id: A_V201
  dataset: ADSYMPT
  key:
  - USUBJID
  filter: ADSYMPT.PARAMCD IN ('C19NIG', 'RTCOV2NS') AND ADSYMPT.AVALC IS NOT NULL AND ADSYMPT.AVALC <> ''
    AND (ADSYMPT.VISIT = 'V201_SURVEIL_CONSENT')
  order_by:
  - ADSYMPT.ADT
  keep: first
  derivations:
    _U:
      type: str
      derivation: ADSYMPT.USUBJID
- id: A_CONV
  dataset: ADSYMPT
  key:
  - USUBJID
  filter: ADSYMPT.PARAMCD IN ('C19NIG', 'RTCOV2NS') AND ADSYMPT.AVALC IS NOT NULL AND ADSYMPT.AVALC <> ''
    AND (str_contains(ADSYMPT.VISIT, '_A1') OR str_contains(ADSYMPT.VISIT, '_B1') OR str_contains(ADSYMPT.VISIT, '_C1') OR str_contains(ADSYMPT.VISIT, '_D1') OR str_contains(ADSYMPT.VISIT, '_E1') OR str_contains(ADSYMPT.VISIT, '_F1') OR str_contains(ADSYMPT.VISIT, '_G1') OR str_contains(ADSYMPT.VISIT, '_H1'))
  order_by:
  - ADSYMPT.ADT
  keep: first
  derivations:
    _U:
      type: str
      derivation: ADSYMPT.USUBJID
- id: SV_V101
  dataset: SV
  key:
  - USUBJID
  filter: SV.SVSTDTC IS NOT NULL AND (SV.VISIT = 'V101_VAX3')
  order_by:
  - variable: SV._OK
    direction: desc
  - SV._DT
  keep: first
  derivations:
    _DT:
      type: date
      derivation:
        to_date:
          source: SV.SVSTDTC
    _DY:
      type: int
      derivation:
        diff:
          type: date
          start: D_VAX102._DT
          end: _DT
          unit: day
    _S3:
      type: int
      derivation:
        diff:
          type: date
          start: SV_V3._DT
          end: _DT
          unit: day
    _OK:
      type: int
      derivation:
        case:
        - when: (_DY >= 27 AND _DY <= 41) OR (_S3 >= -7 AND _S3 <= 7)
          then: 1
        - otherwise: 0
    _CAND:
      type: date
      derivation:
        case:
        - when: _OK = 1
          then: _DT
- id: SV_V201
  dataset: SV
  key:
  - USUBJID
  filter: SV.SVSTDTC IS NOT NULL AND (SV.VISIT = 'V201_SURVEIL_CONSENT')
  order_by:
  - variable: SV._OK
    direction: desc
  - SV._DT
  keep: first
  derivations:
    _DT:
      type: date
      derivation:
        to_date:
          source: SV.SVSTDTC
    _DY:
      type: int
      derivation:
        diff:
          type: date
          start: D_VAX102._DT
          end: _DT
          unit: day
    _S3:
      type: int
      derivation:
        diff:
          type: date
          start: SV_V3._DT
          end: _DT
          unit: day
    _OK:
      type: int
      derivation:
        case:
        - when: (_DY >= 27 AND _DY <= 41) OR (_S3 >= -7 AND _S3 <= 7)
          then: 1
        - otherwise: 0
    _CAND:
      type: date
      derivation:
        case:
        - when: _OK = 1
          then: _DT
- id: SV_CONV
  dataset: SV
  key:
  - USUBJID
  filter: SV.SVSTDTC IS NOT NULL AND (str_contains(SV.VISIT, '_A1') OR str_contains(SV.VISIT, '_B1') OR str_contains(SV.VISIT, '_C1') OR str_contains(SV.VISIT, '_D1') OR str_contains(SV.VISIT, '_E1') OR str_contains(SV.VISIT, '_F1') OR str_contains(SV.VISIT, '_G1') OR str_contains(SV.VISIT, '_H1'))
  order_by:
  - variable: SV._OK
    direction: desc
  - SV._DT
  keep: first
  derivations:
    _DT:
      type: date
      derivation:
        to_date:
          source: SV.SVSTDTC
    _DY:
      type: int
      derivation:
        diff:
          type: date
          start: D_VAX102._DT
          end: _DT
          unit: day
    _S3:
      type: int
      derivation:
        diff:
          type: date
          start: SV_V3._DT
          end: _DT
          unit: day
    _OK:
      type: int
      derivation:
        case:
        - when: (_DY >= 27 AND _DY <= 41) OR (_S3 >= -7 AND _S3 <= 7)
          then: 1
        - otherwise: 0
    _CAND:
      type: date
      derivation:
        case:
        - when: _OK = 1
          then: _DT
- id: V3X_I
  dataset: DM
  key:
  - USUBJID
  derivations:
    _V3DT:
      type: date
      derivation:
        case:
        - when: A_V3._U IS NOT NULL AND SV_V3._DT IS NOT NULL
          then: SV_V3._DT
        - when: A_V201._U IS NOT NULL AND SV_V201._CAND IS NOT NULL
          then: SV_V201._CAND
        - when: A_V101._U IS NOT NULL AND SV_V101._CAND IS NOT NULL
          then: SV_V101._CAND
        - when: A_CONV._U IS NOT NULL AND SV_CONV._CAND IS NOT NULL
          then: SV_CONV._CAND
- id: EV1_EXCL
  derivations:
    _V3DT:
      type: date
      derivation: V3X_I._V3DT
- id: EV1_POSN
  derivations:
    _V3DT:
      type: date
      derivation: V3X_I._V3DT
# Deviation dates by population (the 6-month adsl.sas dvdate_p1 .. p3): the
# earliest DVSTDTC of a deviation whose CAPE names POP1, POP2 or POP3; and
# period1_pop3, a POP3 deviation before Dose 3 (or with no Dose 3).
- id: DV_P1D
  dataset: DV
  key:
  - USUBJID
  order_by:
  - variable: DV._PDT
    direction: asc
    nulls: last
  keep: first
  derivations:
    _CAPE:
      type: str
      derivation: SUPPDV_BYSEQ.CAPE
    _DVDT:
      type: date
      derivation:
        to_date:
          source: DV.DVSTDTC
    _PDT:
      type: date
      derivation:
        case:
        - when: str_contains(_CAPE, 'POP1') AND DV.DVSTDTC IS NOT NULL AND DV.DVSTDTC <> ''
          then: _DVDT
- id: DV_P2D
  dataset: DV
  key:
  - USUBJID
  order_by:
  - variable: DV._PDT
    direction: asc
    nulls: last
  keep: first
  derivations:
    _CAPE:
      type: str
      derivation: SUPPDV_BYSEQ.CAPE
    _DVDT:
      type: date
      derivation:
        to_date:
          source: DV.DVSTDTC
    _PDT:
      type: date
      derivation:
        case:
        - when: str_contains(_CAPE, 'POP2') AND DV.DVSTDTC IS NOT NULL AND DV.DVSTDTC <> ''
          then: _DVDT
- id: DV_P3D
  dataset: DV
  key:
  - USUBJID
  order_by:
  - variable: DV._PDT
    direction: asc
    nulls: last
  keep: first
  derivations:
    _CAPE:
      type: str
      derivation: SUPPDV_BYSEQ.CAPE
    _DVDT:
      type: date
      derivation:
        to_date:
          source: DV.DVSTDTC
    _PDT:
      type: date
      derivation:
        case:
        - when: str_contains(_CAPE, 'POP3') AND DV.DVSTDTC IS NOT NULL AND DV.DVSTDTC <> ''
          then: _DVDT
- id: DV_P3E
  dataset: DV
  key:
  - USUBJID
  order_by:
  - variable: DV._E
    direction: desc
  keep: first
  derivations:
    _CAPE:
      type: str
      derivation: SUPPDV_BYSEQ.CAPE
    _DVDT:
      type: date
      derivation:
        to_date:
          source: DV.DVSTDTC
    _E:
      type: int
      derivation:
        case:
        - when: str_contains(_CAPE, 'POP3') AND DV.DVSTDTC IS NOT NULL AND DV.DVSTDTC <> '' AND (D_VAX201._DT IS
            NULL OR (_DVDT IS NOT NULL AND _DVDT < D_VAX201._DT))
          then: 1
        - otherwise: 0
# Visit dates of the deviation windows: the 1-month post Dose 2 visit
# (visit3dt), the V3 / V404 visit (v3p2), the Phase 1 week-1 post Dose 2
# visit (v5p1) and the week-3 post Dose 1 visit (w3pv1dt).
- id: SV_M1
  dataset: SV
  key:
  - USUBJID
  filter: SV.SVSTDTC IS NOT NULL
  order_by:
  - variable: SV._OK
    direction: desc
  - SV._DT
  keep: first
  derivations:
    _DT:
      type: date
      derivation:
        to_date:
          source: SV.SVSTDTC
    _OK:
      type: int
      derivation:
        case:
        - when: (str_contains(SV.VISIT, '_MONTH1_') AND NOT str_contains(SV.VISIT, 'POSTVAX3') AND NOT str_contains(SV.VISIT, 'POSTVAX4') AND NOT str_contains(SV.VISIT, 'V103_') AND (D_COHORTN._CN IS NULL OR D_COHORTN._CN <> 1.16)) OR (SV.VISIT = 'V7_MONTH1_S_R' AND D_COHORTN._CN = 1.16)
          then: 1
        - otherwise: 0
    _CAND:
      type: date
      derivation:
        case:
        - when: _OK = 1
          then: _DT
- id: SV_V3P2
  dataset: SV
  key:
  - USUBJID
  filter: SV.SVSTDTC IS NOT NULL AND (SV.VISIT IN ('V3_MONTH1_POSTVAX2_L', 'V404_MONTH1_POSTVAX2'))
  order_by:
  - SV._DT
  keep: first
  derivations:
    _DT:
      type: date
      derivation:
        to_date:
          source: SV.SVSTDTC
- id: SV_V5P1
  dataset: SV
  key:
  - USUBJID
  filter: SV.SVSTDTC IS NOT NULL
  order_by:
  - variable: SV._OK
    direction: desc
  - SV._DT
  keep: first
  derivations:
    _DT:
      type: date
      derivation:
        to_date:
          source: SV.SVSTDTC
    _OK:
      type: int
      derivation:
        case:
        - when: ((SV.VISIT = 'V5_WEEK1_POSTVAX2_S' AND (D_COHORTN._CN IS NULL OR D_COHORTN._CN <> 1.16)) OR (SV.VISIT = 'V5_WEEK1_POSTVAX2_S_R' AND D_COHORTN._CN = 1.16))
          then: 1
        - otherwise: 0
    _CAND:
      type: date
      derivation:
        case:
        - when: _OK = 1
          then: _DT
- id: SV_W3
  dataset: SV
  key:
  - USUBJID
  filter: SV.SVSTDTC IS NOT NULL
  order_by:
  - variable: SV._OK
    direction: desc
  - SV._DT
  keep: first
  derivations:
    _DT:
      type: date
      derivation:
        to_date:
          source: SV.SVSTDTC
    _OK:
      type: int
      derivation:
        case:
        - when: ((SV.VISIT = 'V4_WEEK3_VAX2_S' AND (D_COHORTN._CN IS NULL OR D_COHORTN._CN <> 1.16)) OR (SV.VISIT = 'V4_WEEK3_VAX2_S_R' AND D_COHORTN._CN = 1.16))
          then: 1
        - otherwise: 0
    _CAND:
      type: date
      derivation:
        case:
        - when: _OK = 1
          then: _DT
# INCL9FL: a valid, determinate non-N-binding IS result 28-42 days after
# Dose 2 (6-8 in Phase 1) (the 6-month adsl.sas incl9p_p2).
- id: INCL9_I
  dataset: IS
  key:
  - USUBJID
  filter: IS.ISTESTCD <> 'C19NIG' AND IS.ISORRES IS NOT NULL AND IS.ISORRES NOT IN ('', 'IND', 'QNS', 'NOT DONE')
  order_by:
  - variable: IS._IN
    direction: desc
  keep: first
  derivations:
    _ISDT:
      type: date
      derivation:
        to_date:
          source: IS.ISDTC
    _D2:
      type: int
      derivation:
        diff:
          type: date
          start: D_VAX102._DT
          end: _ISDT
          unit: day
    _IN:
      type: int
      derivation:
        case:
        - when: _D2 >= 28 AND _D2 <= 42
          then: 1
        - otherwise: 0
- id: INCL9P1_I
  dataset: IS
  key:
  - USUBJID
  filter: IS.ISTESTCD <> 'C19NIG' AND IS.ISORRES IS NOT NULL AND IS.ISORRES NOT IN ('', 'IND', 'QNS', 'NOT DONE')
  order_by:
  - variable: IS._IN
    direction: desc
  keep: first
  derivations:
    _ISDT:
      type: date
      derivation:
        to_date:
          source: IS.ISDTC
    _D2:
      type: int
      derivation:
        diff:
          type: date
          start: D_VAX102._DT
          end: _ISDT
          unit: day
    _IN:
      type: int
      derivation:
        case:
        - when: _D2 >= 6 AND _D2 <= 8
          then: 1
        - otherwise: 0
# N-binding results after Dose 2 (the 6-month adsl.sas incl17p, nbind1st):
# a C19NIG result other than blank, IND, QNS or NOT DONE, dated after Dose 2
# and not after the V301_VAX3 visit; the earliest such date.
- id: SV_V301
  dataset: SV
  key:
  - USUBJID
  filter: SV.VISIT = 'V301_VAX3' AND SV.SVSTDTC IS NOT NULL
  order_by:
  - SV.SVSTDTC
  keep: first
  derivations:
    _DT:
      type: date
      derivation:
        to_date:
          source: SV.SVSTDTC
- id: NB_I
  dataset: IS
  key:
  - USUBJID
  filter: IS.ISTESTCD = 'C19NIG' AND IS.ISORRES IS NOT NULL AND IS.ISORRES NOT IN ('', 'IND', 'QNS', 'NOT DONE')
  order_by:
  - variable: IS._OK
    direction: desc
  - variable: IS._ISDT
    direction: asc
    nulls: last
  keep: first
  derivations:
    _ISDT:
      type: date
      derivation:
        to_date:
          source: IS.ISDTC
    _OK:
      type: int
      derivation:
        case:
        - when: D_VAX102._DT IS NOT NULL AND _ISDT IS NOT NULL AND _ISDT > D_VAX102._DT AND NOT (SV_V301._DT IS
            NOT NULL AND SV_V301._DT < _ISDT)
          then: 1
        - otherwise: 0
    _CAND:
      type: date
      derivation:
        case:
        - when: _OK = 1
          then: _ISDT
- id: SV_SURV
  dataset: SV
  key:
  - USUBJID
  filter: SV.VISIT = 'V201_SURVEIL_CONSENT' AND SV.SVSTDTC IS NOT NULL
  order_by:
  - SV.SVSTDTC
  keep: first
  derivations:
    _DT:
      type: date
      derivation:
        to_date:
          source: SV.SVSTDTC
# COMPLDT: the follow-up phase COMPLETED disposition event.
- id: DS_COMPL
  dataset: DS
  key:
  - USUBJID
  filter: DS.DSCAT = 'DISPOSITION EVENT' AND DS.DSDECOD = 'COMPLETED' AND DS.DSSTDTC IS NOT NULL
  order_by:
  - variable: DS._OK
    direction: desc
  - DS.DSSTDTC
  keep: first
  derivations:
    _DT:
      type: date
      derivation:
        to_date:
          source: DS.DSSTDTC
    _OK:
      type: int
      derivation:
        case:
        - when: SUPPDS_BYSEQ.DSPHASE = 'FOLLOW-UP'
          then: 1
        - otherwise: 0
    _CAND:
      type: date
      derivation:
        case:
        - when: _OK = 1
          then: _DT
# PD1POSDT, the first positive swab after Day 1 (the 6-month adsl.sas
# pd1pos0): a central RTCOV2NS POS, or a local SARSCOV2 POS (devices 34, 44
# and 68) at a visit whose central result is missing or POS.
- id: MB_CVIS
  dataset: MB
  key:
  - USUBJID
  - VISITNUM
  - VISIT
  filter: MB.MBTESTCD = 'RTCOV2NS' AND MB.MBDY > 1
  order_by:
  - MB.MBDTC
  keep: first
  derivations:
    _C:
      type: str
      derivation: MB.MBSTRESC
- id: PD1_C
  dataset: MB
  key:
  - USUBJID
  filter: MB.MBTESTCD = 'RTCOV2NS' AND MB.MBDY > 1 AND MB.MBSTRESC = 'POS' AND MB.MBDTC IS NOT NULL
  order_by:
  - MB._DT
  keep: first
  derivations:
    _DT:
      type: date
      derivation:
        to_date:
          source: MB.MBDTC
- id: PD1_L
  dataset: MB
  key:
  - USUBJID
  filter: MB.MBTESTCD = 'SARSCOV2' AND MB.MBDY > 1 AND MB.SPDEVID IN ('34', '44', '68') AND MB.MBSTRESC = 'POS'
    AND MB.MBDTC IS NOT NULL
  order_by:
  - variable: MB._OK
    direction: desc
  - MB._DT
  keep: first
  derivations:
    _DT:
      type: date
      derivation:
        to_date:
          source: MB.MBDTC
    _OK:
      type: int
      derivation:
        case:
        - when: MB_CVIS._C IS NULL OR MB_CVIS._C = '' OR MB_CVIS._C = 'POS'
          then: 1
        - otherwise: 0
    _CAND:
      type: date
      derivation:
        case:
        - when: _OK = 1
          then: _DT
