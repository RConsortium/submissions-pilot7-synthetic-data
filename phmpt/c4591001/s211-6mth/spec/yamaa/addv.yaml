# ADDV for Pfizer C4591001, S211 6-month cut (BLA 125742 sequence 45),
# the 12-15-year-old cohort.
# Layer over the 1-month spec, run on this cut's SDTM
# (scripts/reproduce.py verify --study c4591001 --cut s211-6mth). The output
# keeps the 6-month file's columns, in its order; the program keeps only the
# subjects of its ADSL (one DM subject has no ADSL record).
yamaa: '1.0'
type: spec
parent: ../../../s211-1mth/spec/yamaa/addv.yaml
clear:
- columns.MULENRFL.submission
- columns.RAND1FL.submission
rows:
- id: deviations
  filter: ADSL.USUBJID IS NOT NULL
columns:
- name: SAFFL
  type: str
  label: Safety Population Flag
  derivation: ADSL.SAFFL
  submission:
    core: Perm
    mandatory: false
    origins:
    - type: Predecessor
      description: ADSL.SAFFL
output:
  columns:
  - STUDYID
  - USUBJID
  - DOMAIN
  - SUBJID
  - SITEID
  - AGE
  - SEX
  - RACE
  - TRTSDT
  - TRTEDT
  - ARM
  - ARMCD
  - ACTARM
  - ACTARMCD
  - TRT01P
  - TRT01A
  - TRT01PN
  - TRT01AN
  - AGEGR1
  - AGEGR1N
  - DVSEQ
  - DVSPID
  - DVTERM
  - DVTERM1
  - DVDECOD
  - EPOCH
  - ACTSITE
  - DESGTOR
  - CAPE
  - DVCAT
  - DVSTDTC
  - DVSTDY
  - ASTDT
  - PREFL
  - TRPFL
  - RANDFL
  - PHASE
  - PHASEN
  - COHORT
  - COHORTN
  - DOSALVL
  - DOSALVLN
  - DOSPLVL
  - DOSPLVLN
  - DS3KFL
  - AGEGR3N
  - AGEGR3
  - AGEGR4N
  - AGEGR4
  - HIVFL
  - AGETR01
  - TRTSDTM
  - TRTEDTM
