# ADCM for Pfizer C4591001, S211 6-month cut (BLA 125742 sequence 45),
# the 12-15-year-old cohort.
# Layer over the 1-month spec, run on this cut's SDTM
# (scripts/reproduce.py verify --study c4591001 --cut s211-6mth). The output
# keeps the 6-month file's columns, in its order; the program keeps only the
# subjects of its ADSL (one DM subject has no ADSL record).
yamaa: '1.0'
type: spec
parent: ../../../s211-1mth/spec/yamaa/adcm.yaml
clear:
- columns.CMCLAS1.submission
- columns.CMCLAS2.submission
- columns.CMCLSCD1.submission
- columns.CMCLSCD2.submission
- columns.MULENRFL.submission
- columns.RAND1FL.submission
- columns.SAF1FL.submission
- columns.SAF2FL.submission
rows:
- id: base
  filter: (NOT ((CM.CMTRT IS NULL OR CM.CMTRT = '') AND (CM.CMSTDTC IS NULL OR CM.CMSTDTC = ''))) AND ADSL.USUBJID IS NOT NULL
columns:
- name: DICTVER
  submission:
    length: 17
output:
