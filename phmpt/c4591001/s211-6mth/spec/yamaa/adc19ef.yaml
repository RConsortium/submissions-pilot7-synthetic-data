# ADC19EF for Pfizer C4591001, S211 6-month cut (BLA 125742 sequence 45),
# the 12-15-year-old cohort.
# Layer over the 1-month spec, run on this cut's SDTM
# (scripts/reproduce.py verify --study c4591001 --cut s211-6mth). The output
# keeps the 6-month file's columns, in its order; the program keeps only the
# subjects of its ADSL (one DM subject has no ADSL record).
# The 6-month adc19ef.sas sets the data cutoff to 2021-09-02 (S1: 2021-03-13).
yamaa: '1.0'
type: spec
parent: ../../../s211-1mth/spec/yamaa/adc19ef.yaml
columns:
- name: EV14EFFL
  type: str
  label: Evaluable Efficacy Popu Flag - 14 days
  derivation: ADSL.EV14EFFL
  submission:
    core: Perm
    mandatory: false
    origins:
    - type: Predecessor
      description: ADSL.EV14EFFL
- name: DCODT
  derivation: DATE '2021-09-02'
- name: _DCODT
  type: date
  derivation: DATE '2021-09-02'
- name: _COMPLDT
  type: date
  derivation: ADSL.COMPLDT
# srvlendt = min(dcodt, withdraw_dt, dthdt, unblnddt, compldt) (6-month adc19ef.sas)
- name: _SRVLENDT
  derivation:
    least:
      sources: [_DCODT, _WITHDRAW_DT, _DTHDT, _UNBLNDDT, _COMPLDT]
