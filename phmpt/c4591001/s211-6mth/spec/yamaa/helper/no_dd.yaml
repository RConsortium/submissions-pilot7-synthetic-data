# C4591001 S211 6-month cut: an empty DD domain.
# The 6-month ADSL and ADSYMPT programs read no DD (adsl.sas and
# adsympt.sas of the 6-month package), and this cut's release has none. The
# S1 specs these cuts inherit read DD, so the 6-month layers give them this
# table with DD's columns and no records: the DD-driven parts then
# contribute nothing, as in the program.
yamaa: '1.0'
type: spec
model: SDTM
domain: DDN
keys: [USUBJID]
input:
  DM: <sdtm-dir>/dm.parquet
rows:
- id: none
  dataset: DM
  filter: DM.USUBJID IS NULL
  derivations:
    USUBJID: DM.USUBJID
    STUDYID: null
    DOMAIN: null
    DDSEQ: null
    DDTESTCD: null
    DDTEST: null
    DDCAT: null
    DDORRES: null
    DDSTRESC: null
    DDEVAL: null
    EPOCH: null
    DDDTC: null
    DDDY: null
columns:
- {name: STUDYID, type: str, label: STUDYID}
- {name: DOMAIN, type: str, label: DOMAIN}
- {name: USUBJID, type: str, label: USUBJID}
- {name: DDSEQ, type: float, label: DDSEQ}
- {name: DDTESTCD, type: str, label: DDTESTCD}
- {name: DDTEST, type: str, label: DDTEST}
- {name: DDCAT, type: str, label: DDCAT}
- {name: DDORRES, type: str, label: DDORRES}
- {name: DDSTRESC, type: str, label: DDSTRESC}
- {name: DDEVAL, type: str, label: DDEVAL}
- {name: EPOCH, type: str, label: EPOCH}
- {name: DDDTC, type: str, label: DDDTC}
- {name: DDDY, type: float, label: DDDY}
output:
  path: <work-dir>/dd.parquet
  columns: [STUDYID, DOMAIN, USUBJID, DDSEQ, DDTESTCD, DDTEST, DDCAT, DDORRES, DDSTRESC, DDEVAL, EPOCH, DDDTC, DDDY]
