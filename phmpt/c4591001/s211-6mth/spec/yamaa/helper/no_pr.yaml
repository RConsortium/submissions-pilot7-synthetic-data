# C4591001 S211 6-month cut: an empty PR domain.
# The 6-month ADSL and ADSYMPT programs read no PR (adsl.sas and
# adsympt.sas of the 6-month package), and this cut's release has none. The
# S1 specs these cuts inherit read PR, so the 6-month layers give them this
# table with PR's columns and no records: the PR-driven parts then
# contribute nothing, as in the program.
yamaa: '1.0'
type: spec
model: SDTM
domain: PRN
keys: [USUBJID]
input:
  DM: <sdtm-dir>/dm.parquet
rows:
- id: none
  dataset: DM
  filter: DM.USUBJID IS NULL
  derivations:
    USUBJID: DM.USUBJID
    STUDYID: null
    DOMAIN: null
    PRSEQ: null
    PRSPID: null
    PRTRT: null
    PRDECOD: null
    PRCAT: null
    PRPRESP: null
    PROCCUR: null
    VISITNUM: null
    VISIT: null
    EPOCH: null
    PRDTC: null
    PRSTDTC: null
    PRENDTC: null
    PRDY: null
    PRSTDY: null
    PRENDY: null
    PRENRTPT: null
    PRENTPT: null
columns:
- {name: STUDYID, type: str, label: STUDYID}
- {name: DOMAIN, type: str, label: DOMAIN}
- {name: USUBJID, type: str, label: USUBJID}
- {name: PRSEQ, type: float, label: PRSEQ}
- {name: PRSPID, type: str, label: PRSPID}
- {name: PRTRT, type: str, label: PRTRT}
- {name: PRDECOD, type: str, label: PRDECOD}
- {name: PRCAT, type: str, label: PRCAT}
- {name: PRPRESP, type: str, label: PRPRESP}
- {name: PROCCUR, type: str, label: PROCCUR}
- {name: VISITNUM, type: float, label: VISITNUM}
- {name: VISIT, type: str, label: VISIT}
- {name: EPOCH, type: str, label: EPOCH}
- {name: PRDTC, type: str, label: PRDTC}
- {name: PRSTDTC, type: str, label: PRSTDTC}
- {name: PRENDTC, type: str, label: PRENDTC}
- {name: PRDY, type: float, label: PRDY}
- {name: PRSTDY, type: float, label: PRSTDY}
- {name: PRENDY, type: float, label: PRENDY}
- {name: PRENRTPT, type: str, label: PRENRTPT}
- {name: PRENTPT, type: str, label: PRENTPT}
output:
  path: <work-dir>/pr.parquet
  columns: [STUDYID, DOMAIN, USUBJID, PRSEQ, PRSPID, PRTRT, PRDECOD, PRCAT, PRPRESP, PROCCUR, VISITNUM, VISIT, EPOCH, PRDTC, PRSTDTC, PRENDTC, PRDY, PRSTDY, PRENDY, PRENRTPT, PRENTPT]
