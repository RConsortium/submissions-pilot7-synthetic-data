# C4591001 EUA 27034 S1 interim analysis: ADC19EF as adc19ef-ia.sas builds it
# before its final step, every parameter included (the CDC onset rows end
# the CDC surveillance time). Layer over the EUA final-analysis spec;
# ../adc19ef.yaml applies the final step.
yamaa: '1.0'
type: spec
parent: ../../../../s1-safety-fa-eff/spec/yamaa/adc19ef.yaml
# ADSL comes from helper/adsl_s1x.yaml: this cut's ADSL plus, as nulls,
# the final EUA and S1 ADSL columns it lacks.
input:
  ADSL:
    path: <work-dir>/adsl_s1x.parquet
    schema: adsl_s1x.yaml
    key:
    - STUDYID
    - USUBJID
intermediates:
# adc19ef-ia.sas groups nasal congestion with no symptom group (the final
# program adds it to the CDC group), and a protocol-defined symptom is not
# also a CDC symptom: the interim program has neither S1's second (CDC)
# record of each protocol symptom nor the final EUA program's symp3d-h
# step that extends or adds CDC records from the protocol-defined ones.
- id: _A
  derivations:
    _GRP_A:
      derivation:
        case:
        - when: ADSYMPT.PARAMCD IN ('CHILLS', 'DIARRHEA', 'FEVER', 'NLTSTSML', 'NCOUG',
            'NSTBRTH', 'NMUSPN', 'NSRTHROT', 'VOMIT')
          then: 1
        - when: ADSYMPT.PARAMCD IN ('FATIGUE', 'HEADACHE', 'RIHNRA', 'NAUSEA')
          then: 2
        - when: ADSYMPT.PARAMCD IN ('RESP', 'HR', 'OXYSAT', 'DIABP', 'SYSBP', 'PO2FIO2')
          then: 3
        - when: ADSYMPT.PARAMCD IN ('INTBTION', 'NIPPV', 'CPAP', 'OXYTHRP', 'MCHVENT',
            'ECMO', 'HFOXTHRP')
          then: 4
        - when: ADSYMPT.PARAMCD = 'VSOPRES'
          then: 5
        - when: ADSYMPT.PARAMCD IN ('SARDFN', 'SAHDFN', 'SANDFN')
          then: 6
        - when: ADSYMPT.PARAMCD = 'HCUICU'
          then: 7
        - when: ADSYMPT.PARAMCD = 'HCUHSP'
          then: 11
        - when: ADSYMPT.PARAMCD = 'C19NIG' AND ADSYMPT.AVISIT = 'V1_DAY1_VAX1_L'
          then: 21
        - when: ADSYMPT.PARAMCD = 'RTCOV2NS'
          then: 22
        - when: ADSYMPT.PARAMCD = 'SARSCOV2'
          then: 23
        - when: ADSYMPT.PARAMCD IN ('PRCDTH', 'SECDTH')
          then: 10
    _GRP_B:
      derivation:
        case:
        - when: ADSYMPT.PARAMCD IN ('MCHVENT', 'ECMO')
          then: 12
        - when: ADSYMPT.PARAMCD = 'HCUICU'
          then: 12
        - when: ADSYMPT.PARAMCD = 'HCUHSP'
          then: 12
        - when: ADSYMPT.PARAMCD IN ('PRCDTH', 'SECDTH')
          then: 20
# adc19ef-ia.sas checks an illness-visit NAAT result against a symptom
# window of its own (steps nva_naat1a, nva_naat1b and nva_naat2). When the
# analysis visit holds a record of another visit (vis_colsp1, clspflg = 1),
# the window is that of the NAAT record's own visit (usubjid_vis:
# symp_dates_vis_all, joined on VISITNUM alone, from the positive grp 1-2
# records when the visit has any, else from the others) and, without one,
# that of the analysis visit (usubjid_avis). Otherwise only the analysis
# visit's window counts: a NAAT result of an analysis visit without symptom
# dates is kept (cncrslfl = 'Y') but not valid (vldrslfl = 'N'). The S1
# program this layer inherits takes the analysis visit's window first and
# the visit's (all grp 1-2 records, joined on VISITNUM and VISIT) after it.
# _IA_CLSP, _IA_VPOS and _IA_V_* hold the interim window, and each S1 step
# that checks a NAAT result below reads it through its analysis-visit
# window columns, with the visit fallback emptied.
- id: _IA_CLSP
  dataset: _A
  key:
    _USUBJID: _S1._USUBJID
    _AVISITN: _S1._AVISITN
    _AVISIT: _S1._AVISIT
  filter: _A._VISITNUM <> _A._AVISITN OR _A._VISIT <> _A._AVISIT
  order_by:
  - _A._RECSEQ
  keep: first
  derivations:
    _CLSP:
      type: int
      derivation: 1
- id: _IA_VPOS
  dataset: _S1
  key:
    _USUBJID: _S1._USUBJID
    _VISITNUM: _S1._VISITNUM
  filter: _S1._GRP_X IN (1, 2) AND _S1._ASTDT_X IS NOT NULL AND _S1._STAT = 4
  order_by:
  - _S1._RECSEQ
  keep: first
  derivations:
    _ANY:
      type: int
      derivation: 1
- id: _IA_V_ASTDT
  dataset: _S1
  key:
    _USUBJID: _S1._USUBJID
    _VISITNUM: _S1._VISITNUM
  filter: _S1._GRP_X IN (1, 2) AND _S1._ASTDT_X IS NOT NULL AND _S1._IA_INSET = 1
  order_by:
  - _S1._ASTDT_X
  keep: first
  derivations:
    _IA_INSET:
      type: int
      derivation:
        case:
        - when: _IA_VPOS._ANY = 1 AND _S1._STAT = 4
          then: 1
        - when: _IA_VPOS._ANY IS NULL AND (_S1._STAT IS NULL OR _S1._STAT <> 4)
          then: 1
        - otherwise: 0
    _V_ASTDT:
      type: date
      derivation: _S1._ASTDT_X
- id: _IA_V_AENDT
  dataset: _S1
  key:
    _USUBJID: _S1._USUBJID
    _VISITNUM: _S1._VISITNUM
  filter: _S1._GRP_X IN (1, 2) AND _S1._ASTDT_X IS NOT NULL AND _S1._AENDT IS NOT NULL
    AND _S1._IA_INSET = 1
  order_by:
  - variable: _S1._AENDT
    direction: desc
  keep: first
  derivations:
    _IA_INSET:
      type: int
      derivation:
        case:
        - when: _IA_VPOS._ANY = 1 AND _S1._STAT = 4
          then: 1
        - when: _IA_VPOS._ANY IS NULL AND (_S1._STAT IS NULL OR _S1._STAT <> 4)
          then: 1
        - otherwise: 0
    _V_AENDT:
      type: date
      derivation: _S1._AENDT
- id: _NVA2
  derivations:
    _HAS_AV_ASTDT:
      derivation:
        case:
        - when: _IA_CLSP._CLSP = 1 AND _IA_V_ASTDT._V_ASTDT IS NOT NULL
          then: _IA_V_ASTDT._V_ASTDT
        - otherwise: _HAS_AV_ASTDT._HAS_AV_ASTDT
    _HAS_AV_AENDT:
      derivation:
        case:
        - when: _IA_CLSP._CLSP = 1 AND _IA_V_ASTDT._V_ASTDT IS NOT NULL
          then: _IA_V_AENDT._V_AENDT
        - otherwise: _HAS_AV_AENDT._HAS_AV_AENDT
    _HAS_V_ASTDT:
      derivation: null
    _HAS_V_AENDT:
      derivation: null
    _AV_ASTDT_EPOCH:
      derivation:
        to_epoch_day:
          source: _HAS_AV_ASTDT
    _AV_AENDT_EPOCH:
      derivation:
        to_epoch_day:
          source: _HAS_AV_AENDT
- id: _RUN_LAST_D
  derivations:
    _HAS_AV_ASTDT:
      derivation:
        case:
        - when: _IA_CLSP._CLSP = 1 AND _IA_V_ASTDT._V_ASTDT IS NOT NULL
          then: _IA_V_ASTDT._V_ASTDT
        - otherwise: _HAS_AV_ASTDT._HAS_AV_ASTDT
    _HAS_AV_AENDT:
      derivation:
        case:
        - when: _IA_CLSP._CLSP = 1 AND _IA_V_ASTDT._V_ASTDT IS NOT NULL
          then: _IA_V_AENDT._V_AENDT
        - otherwise: _HAS_AV_AENDT._HAS_AV_AENDT
    _HAS_V_ASTDT:
      derivation: null
    _HAS_V_AENDT:
      derivation: null
    _AV_ASTDT_EPOCH:
      derivation:
        to_epoch_day:
          source: _HAS_AV_ASTDT
    _AV_AENDT_EPOCH:
      derivation:
        to_epoch_day:
          source: _HAS_AV_AENDT
- id: _RUN_LAST_E
  derivations:
    _HAS_AV_ASTDT:
      derivation:
        case:
        - when: _IA_CLSP._CLSP = 1 AND _IA_V_ASTDT._V_ASTDT IS NOT NULL
          then: _IA_V_ASTDT._V_ASTDT
        - otherwise: _HAS_AV_ASTDT._HAS_AV_ASTDT
    _HAS_AV_AENDT:
      derivation:
        case:
        - when: _IA_CLSP._CLSP = 1 AND _IA_V_ASTDT._V_ASTDT IS NOT NULL
          then: _IA_V_AENDT._V_AENDT
        - otherwise: _HAS_AV_AENDT._HAS_AV_AENDT
    _HAS_V_ASTDT:
      derivation: null
    _HAS_V_AENDT:
      derivation: null
    _AV_ASTDT_EPOCH:
      derivation:
        to_epoch_day:
          source: _HAS_AV_ASTDT
    _AV_AENDT_EPOCH:
      derivation:
        to_epoch_day:
          source: _HAS_AV_AENDT
- id: _NVA4D
  derivations:
    _HAS_AV_ASTDT:
      derivation:
        case:
        - when: _IA_CLSP._CLSP = 1 AND _IA_V_ASTDT._V_ASTDT IS NOT NULL
          then: _IA_V_ASTDT._V_ASTDT
        - otherwise: _HAS_AV_ASTDT._HAS_AV_ASTDT
    _HAS_AV_AENDT:
      derivation:
        case:
        - when: _IA_CLSP._CLSP = 1 AND _IA_V_ASTDT._V_ASTDT IS NOT NULL
          then: _IA_V_AENDT._V_AENDT
        - otherwise: _HAS_AV_AENDT._HAS_AV_AENDT
    _HAS_V_ASTDT:
      derivation: null
    _HAS_V_AENDT:
      derivation: null
    _AV_ASTDT_EPOCH:
      derivation:
        to_epoch_day:
          source: _HAS_AV_ASTDT
    _AV_AENDT_EPOCH:
      derivation:
        to_epoch_day:
          source: _HAS_AV_AENDT
- id: _NVA4E
  derivations:
    _HAS_AV_ASTDT:
      derivation:
        case:
        - when: _IA_CLSP._CLSP = 1 AND _IA_V_ASTDT._V_ASTDT IS NOT NULL
          then: _IA_V_ASTDT._V_ASTDT
        - otherwise: _HAS_AV_ASTDT._HAS_AV_ASTDT
    _HAS_AV_AENDT:
      derivation:
        case:
        - when: _IA_CLSP._CLSP = 1 AND _IA_V_ASTDT._V_ASTDT IS NOT NULL
          then: _IA_V_AENDT._V_AENDT
        - otherwise: _HAS_AV_AENDT._HAS_AV_AENDT
    _HAS_V_ASTDT:
      derivation: null
    _HAS_V_AENDT:
      derivation: null
    _AV_ASTDT_EPOCH:
      derivation:
        to_epoch_day:
          source: _HAS_AV_ASTDT
    _AV_AENDT_EPOCH:
      derivation:
        to_epoch_day:
          source: _HAS_AV_AENDT
- id: _CNT_LCL1
  derivations:
    _HAS_AV_ASTDT:
      derivation:
        case:
        - when: _IA_CLSP._CLSP = 1 AND _IA_V_ASTDT._V_ASTDT IS NOT NULL
          then: _IA_V_ASTDT._V_ASTDT
        - otherwise: _HAS_AV_ASTDT._HAS_AV_ASTDT
    _HAS_AV_AENDT:
      derivation:
        case:
        - when: _IA_CLSP._CLSP = 1 AND _IA_V_ASTDT._V_ASTDT IS NOT NULL
          then: _IA_V_AENDT._V_AENDT
        - otherwise: _HAS_AV_AENDT._HAS_AV_AENDT
    _HAS_V_ASTDT:
      derivation: null
    _HAS_V_AENDT:
      derivation: null
    _AV_ASTDT_EPOCH:
      derivation:
        to_epoch_day:
          source: _HAS_AV_ASTDT
    _AV_AENDT_EPOCH:
      derivation:
        to_epoch_day:
          source: _HAS_AV_AENDT
columns:
# adc19ef-ia.sas carries COMPLDT from ADSL and ends surveillance at the
# completion date too: srvlendt = min(dcodt, dvstdt, withdraw_dt, compldt,
# dthdt), and all-available rows end at min(dcodt, withdraw_dt, compldt,
# dthdt).
- name: COMPLDT
  type: date
  label: Date of Completion
  derivation: _ADSL_PLAIN.COMPLDT
  submission:
    core: Perm
    mandatory: false
    origins:
    - type: Predecessor
      description: ADSL.COMPLDT
- name: _COMPLDT
  type: date
  derivation: _ADSL_PLAIN.COMPLDT
- name: _SRVLENDT
  derivation:
    least:
      sources: [_DCODT, _WITHDRAW_DT, _COMPLDT, _DTHDT]
# Two subjects have no ETHNIC in the interim snapshot's DM.
- name: ETHNIC
  label: Ethnicity
  submission:
    mandatory: false
# The interim program censors at its snapshot, &cutoff = 04NOV2020.
- name: DCODT
  label: Data Cutoff Date
  derivation: DATE '2020-11-04'
- name: _DCODT
  derivation: DATE '2020-11-04'
# A producer contract needs every output column labelled (INPUT-10): the
