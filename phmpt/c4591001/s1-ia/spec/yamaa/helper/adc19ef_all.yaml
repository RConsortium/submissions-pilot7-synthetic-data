# C4591001 EUA 27034 S1 interim analysis: ADC19EF as adc19ef-ia.sas builds it
# before its final step, every parameter included (the CDC onset rows end
# the CDC surveillance time). Layer over the EUA final-analysis spec;
# ../adc19ef.yaml applies the final step.
yamaa: '1.0'
type: spec
parent: ../../../../s1-safety-fa-eff/spec/yamaa/adc19ef.yaml
# ADSL comes from helper/adsl_s1x.yaml: this cut's ADSL plus, as nulls,
# the final EUA and S1 ADSL columns it lacks.
input:
  ADSL:
    path: <work-dir>/adsl_s1x.parquet
    schema: adsl_s1x.yaml
    key:
    - STUDYID
    - USUBJID
intermediates:
# adc19ef-ia.sas groups nasal congestion with no symptom group (the final
# program adds it to the CDC group), and a protocol-defined symptom is not
# also a CDC symptom: the interim program has neither S1's second (CDC)
# record of each protocol symptom nor the final EUA program's symp3d-h
# step that extends or adds CDC records from the protocol-defined ones.
- id: _A
  derivations:
    _GRP_A:
      derivation:
        case:
        - when: ADSYMPT.PARAMCD IN ('CHILLS', 'DIARRHEA', 'FEVER', 'NLTSTSML', 'NCOUG',
            'NSTBRTH', 'NMUSPN', 'NSRTHROT', 'VOMIT')
          then: 1
        - when: ADSYMPT.PARAMCD IN ('FATIGUE', 'HEADACHE', 'RIHNRA', 'NAUSEA')
          then: 2
        - when: ADSYMPT.PARAMCD IN ('RESP', 'HR', 'OXYSAT', 'DIABP', 'SYSBP', 'PO2FIO2')
          then: 3
        - when: ADSYMPT.PARAMCD IN ('INTBTION', 'NIPPV', 'CPAP', 'OXYTHRP', 'MCHVENT',
            'ECMO', 'HFOXTHRP')
          then: 4
        - when: ADSYMPT.PARAMCD = 'VSOPRES'
          then: 5
        - when: ADSYMPT.PARAMCD IN ('SARDFN', 'SAHDFN', 'SANDFN')
          then: 6
        - when: ADSYMPT.PARAMCD = 'HCUICU'
          then: 7
        - when: ADSYMPT.PARAMCD = 'HCUHSP'
          then: 11
        - when: ADSYMPT.PARAMCD = 'C19NIG' AND ADSYMPT.AVISIT = 'V1_DAY1_VAX1_L'
          then: 21
        - when: ADSYMPT.PARAMCD = 'RTCOV2NS'
          then: 22
        - when: ADSYMPT.PARAMCD = 'SARSCOV2'
          then: 23
        - when: ADSYMPT.PARAMCD IN ('PRCDTH', 'SECDTH')
          then: 10
    _GRP_B:
      derivation:
        case:
        - when: ADSYMPT.PARAMCD IN ('MCHVENT', 'ECMO')
          then: 12
        - when: ADSYMPT.PARAMCD = 'HCUICU'
          then: 12
        - when: ADSYMPT.PARAMCD = 'HCUHSP'
          then: 12
        - when: ADSYMPT.PARAMCD IN ('PRCDTH', 'SECDTH')
          then: 20
columns:
# adc19ef-ia.sas carries COMPLDT from ADSL and ends surveillance at the
# completion date too: srvlendt = min(dcodt, dvstdt, withdraw_dt, compldt,
# dthdt), and all-available rows end at min(dcodt, withdraw_dt, compldt,
# dthdt).
- name: COMPLDT
  type: date
  label: Date of Completion
  derivation: _ADSL_PLAIN.COMPLDT
  submission:
    core: Perm
    mandatory: false
    origins:
    - type: Predecessor
      description: ADSL.COMPLDT
- name: _COMPLDT
  type: date
  derivation: _ADSL_PLAIN.COMPLDT
- name: _SRVLENDT
  derivation:
    least:
      sources: [_DCODT, _WITHDRAW_DT, _COMPLDT, _DTHDT]
# Two subjects have no ETHNIC in the interim snapshot's DM.
- name: ETHNIC
  label: Ethnicity
  submission:
    mandatory: false
# The interim program censors at its snapshot, &cutoff = 04NOV2020.
- name: DCODT
  label: Data Cutoff Date
  derivation: DATE '2020-11-04'
- name: _DCODT
  derivation: DATE '2020-11-04'
