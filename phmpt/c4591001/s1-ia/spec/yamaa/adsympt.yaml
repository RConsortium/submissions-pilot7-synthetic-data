# ADSYMPT for Pfizer C4591001, EUA 27034 sequence S1, interim efficacy
# analysis (data snapshot of 04NOV2020, adsympt-ia.sas).
# Layer over the EUA final-analysis spec, run on this cut's SDTM
# (scripts/reproduce.py verify --study c4591001 --cut s1-ia). The output
# keeps the interim file's columns, in its order.
yamaa: '1.0'
type: spec
parent: ../../../s1-safety-fa-eff/spec/yamaa/adsympt.yaml
# adsympt-ia.sas has no nodup sort of adsympt1 (see _FA_N below), so a vital
# sign repeated on one date stays twice; and it joins its own illness-visit
# collapse (helper/adsympt_vismap.yaml) by subject, visit and start, the
# date for vital signs and swabs (adsympt2), in place of the final program's.
clear:
- rows.vs.group_by
- intermediates._VISMAP.key
input:
  VISMAP:
    path: <work-dir>/adsympt_vismap.parquet
    schema: helper/adsympt_vismap.yaml
intermediates:
- id: _VISMAP
  key:
    USUBJID: USUBJID
    VISITNUM: VISITNUM
    VISIT: VISIT
    ASTDT: _IADT
  filter: VISMAP.CLSPFL = 'Y'
# The interim adsympt-ia.sas counts only central swabs: it sets every local
# SARS-CoV-2 test's device to 999, so all of them are UNKNOWN.
- id: _MB_N
  derivations:
    _AVALC_RAW:
      derivation:
        case:
        - when: _MBTEST_U = 'SEVERE ACUTE RESP SYNDROME CORONAVIRUS 2'
          then: "'UNKNOWN'"
        - otherwise: MB.MBORRES
# It also has no final nodup sort (the final adsympt.sas sorts adsympt1
# with nodup), so an e-diary symptom entered twice in FA stays twice.
- id: _FA_N
  columns:
  - _STUDYID
  - _DOMAIN
  - _USUBJID
  - _FAOBJ_U
  - _FASTRESC
  - _FADTC
  - _VISITNUM
  - _VISIT
  - _FATESTCD
  - _FACAT
  - _FASEQ
  derivations:
    _FASEQ:
      type: float
      derivation: FA.FASEQ
rows:
- id: fa
  group_by:
  - _FA_N._STUDYID
  - _FA_N._DOMAIN
  - _FA_N._USUBJID
  - _FA_N._FAOBJ_U
  - _FA_N._FASTRESC
  - _FA_N._FADTC
  - _FA_N._VISITNUM
  - _FA_N._VISIT
  - _FA_N._FATESTCD
  - _FA_N._FACAT
  - _FA_N._FASEQ
columns:
- name: _IADT
  type: date
  derivation:
    case:
    - when: PARAMCD IN ('RESP', 'HR', 'OXYSAT', 'DIABP', 'SYSBP', 'SARSCOV2', 'RTCOV2NS')
      then: ADT
    - otherwise: ASTDT
# Two subjects have no ETHNIC in the interim snapshot's DM.
- name: ETHNIC
  submission:
    mandatory: false
output:
  columns:
  - STUDYID
  - USUBJID
  - SITEID
  - SUBJID
  - BRTHDT
  - AGEGR1N
  - AGEGR1
  - SEX
  - RACE
  - ETHNIC
  - ARMCD
  - ARM
  - ACTARMCD
  - ACTARM
  - PARAMN
  - PARAMCD
  - PARAM
  - PARCAT1
  - PARCAT2
  - AVAL
  - AVALC
  - VISITNUM
  - VISIT
  - AVISITN
  - AVISIT
  - ADT
  - ADY
  - ASTDT
  - ASTDY
  - AENDT
  - AENDY
  - ISSPEC
  - ISMETHOD
  - MBLOC
  - MBSPEC
  - MBMETHOD
  - PRPRESP
  - VSSTRESU
  - RANDDT
  - TRTSDT
  - TRTEDT
  - VAX101DT
  - VAX102DT
  - ENRLFL
  - RANDFL
  - SAFFL
  - EVALEFFL
  - AAI1EFFL
  - AAI2EFFL
  - _SEQ
