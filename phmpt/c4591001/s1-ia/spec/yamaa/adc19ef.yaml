# ADC19EF for Pfizer C4591001, EUA 27034 sequence S1, interim efficacy
# analysis (data snapshot of 04NOV2020, adc19ef-ia.sas).
# The program's final step: helper/adc19ef_all.yaml builds the dataset with
# every parameter (the CDC onset rows end the CDC surveillance time), and
# this spec keeps the rows the program keeps, dropping the CDC onset
# parameter and ten subject status parameters:
#   if PARAMCD not in ("CDCONST", "ST1PD", "ST17PD", "ST2PD", "ST214PD",
#     "ST214CD", "ST214SE", "ST1PDA", "ST17PDA", "ST2PDA", "ST214PDA");
# (scripts/reproduce.py verify --study c4591001 --cut s1-ia).
yamaa: '1.0'
type: spec
model: ADaM
domain: ADC19EF
submission:
  label: Covid-19 Efficacy Analysis
  class: BASIC DATA STRUCTURE
  structure: One record or multiple records per subject per analysis parameter per
    analysis timepoint
  repeating: true
# The interim release has no define (studies.yaml define: false); the
# columns carry no submission metadata.
keys:
- USUBJID
- _SEQ
input:
  ALL:
    path: <work-dir>/adc19ef_all.parquet
    schema: helper/adc19ef_all.yaml
rows:
- id: kept
  dataset: ALL
  filter: ALL.PARAMCD NOT IN ('CDCONST', 'ST1PD', 'ST17PD', 'ST2PD', 'ST214PD', 'ST214CD', 'ST214SE', 'ST1PDA', 'ST17PDA', 'ST2PDA', 'ST214PDA')
  derivations:
    STUDYID: ALL.STUDYID
    USUBJID: ALL.USUBJID
    SITEID: ALL.SITEID
    SUBJID: ALL.SUBJID
    BRTHDT: ALL.BRTHDT
    AGEGR1N: ALL.AGEGR1N
    AGEGR1: ALL.AGEGR1
    SEX: ALL.SEX
    RACE: ALL.RACE
    ETHNIC: ALL.ETHNIC
    ARMCD: ALL.ARMCD
    ARM: ALL.ARM
    ACTARMCD: ALL.ACTARMCD
    ACTARM: ALL.ACTARM
    PARAMN: ALL.PARAMN
    PARAMCD: ALL.PARAMCD
    PARAM: ALL.PARAM
    PARCAT1: ALL.PARCAT1
    AVAL: ALL.AVAL
    AVALC: ALL.AVALC
    VISITNUM: ALL.VISITNUM
    VISIT: ALL.VISIT
    AVISITN: ALL.AVISITN
    AVISIT: ALL.AVISIT
    ADT: ALL.ADT
    ADY: ALL.ADY
    ASTDT: ALL.ASTDT
    ASTDY: ALL.ASTDY
    AENDT: ALL.AENDT
    AENDY: ALL.AENDY
    DCODT: ALL.DCODT
    RANDDT: ALL.RANDDT
    TRTSDT: ALL.TRTSDT
    TRTEDT: ALL.TRTEDT
    VAX101DT: ALL.VAX101DT
    VAX102DT: ALL.VAX102DT
    DVSTDT: ALL.DVSTDT
    DTHDT: ALL.DTHDT
    EOTDCDT: ALL.EOTDCDT
    EOSDCDT: ALL.EOSDCDT
    COMPLDT: ALL.COMPLDT
    RANDFL: ALL.RANDFL
    EVALEFFL: ALL.EVALEFFL
    AAI1EFFL: ALL.AAI1EFFL
    AAI2EFFL: ALL.AAI2EFFL
    DTHFL: ALL.DTHFL
    C19ILHFL: ALL.C19ILHFL
    CNCRSLFL: ALL.CNCRSLFL
    VRBLNGFL: ALL.VRBLNGFL
    CRD1NGFL: ALL.CRD1NGFL
    CRD2NGFL: ALL.CRD2NGFL
    PDSYMFL: ALL.PDSYMFL
    PDSDMFL: ALL.PDSDMFL
    SEVSYMFL: ALL.SEVSYMFL
    ILD1FL: ALL.ILD1FL
    ILD27FL: ALL.ILD27FL
    FILOCRFL: ALL.FILOCRFL
    PDRMUFL: ALL.PDRMUFL
    PDP1FL: ALL.PDP1FL
    PDP27FL: ALL.PDP27FL
    NMPDOCFL: ALL.NMPDOCFL
    _SEQ: ALL._SEQ
columns:
- name: STUDYID
  type: str
  label: Study Identifier
- name: USUBJID
  type: str
  label: Unique Subject Identifier
- name: SITEID
  type: str
  label: Study Site Identifier
- name: SUBJID
  type: str
  label: Subject Identifier for the Study
- name: BRTHDT
  type: str
  label: Date of Birth
- name: AGEGR1N
  type: int
  label: Pooled Age Group 1 (N)
- name: AGEGR1
  type: str
  label: Pooled Age Group 1
- name: SEX
  type: str
  label: Sex
- name: RACE
  type: str
  label: Race
- name: ETHNIC
  type: str
  label: Ethnicity
- name: ARMCD
  type: str
  label: Planned Arm Code
- name: ARM
  type: str
  label: Description of Planned Arm
- name: ACTARMCD
  type: str
  label: Actual Arm Code
- name: ACTARM
  type: str
  label: Description of Actual Arm
- name: PARAMN
  type: int
  label: Parameter (N)
- name: PARAMCD
  type: str
  label: Parameter Code
- name: PARAM
  type: str
  label: Parameter
- name: PARCAT1
  type: str
  label: Parameter Category 1
- name: AVAL
  type: int
  label: Analysis Value
- name: AVALC
  type: str
  label: Analysis Value (C)
- name: VISITNUM
  type: int
  label: Visit Number
- name: VISIT
  type: str
  label: Visit Name
- name: AVISITN
  type: int
  label: Analysis Visit (N)
- name: AVISIT
  type: str
  label: Analysis Visit
- name: ADT
  type: date
  label: Analysis Date
- name: ADY
  type: int
  label: Analysis Relative Day
- name: ASTDT
  type: date
  label: Analysis Start Date
- name: ASTDY
  type: int
  label: Analysis Start Relative Day
- name: AENDT
  type: date
  label: Analysis End Date
- name: AENDY
  type: int
  label: Analysis End Relative Day
- name: DCODT
  type: date
  label: Data Cutoff Date
- name: RANDDT
  type: date
  label: Date of Randomization
- name: TRTSDT
  type: date
  label: Date of First Exposure to Treatment
- name: TRTEDT
  type: date
  label: Date of Last Exposure to Treatment
- name: VAX101DT
  type: date
  label: Vaccination Date 01
- name: VAX102DT
  type: date
  label: Vaccination Date 02
- name: DVSTDT
  type: date
  label: Start Date of Important PD
- name: DTHDT
  type: date
  label: Date of Death
- name: EOTDCDT
  type: date
  label: End Of Treatment Discontinuation Date
- name: EOSDCDT
  type: date
  label: End Of Study Discontinuation Date
- name: COMPLDT
  type: date
  label: Date of Completion
- name: RANDFL
  type: str
  label: Randomized Population Flag
- name: EVALEFFL
  type: str
  label: Evaluable Efficacy Popu Flag
- name: AAI1EFFL
  type: str
  label: Dose 1 all-available Efficacy Popu Flag
- name: AAI2EFFL
  type: str
  label: Dose 2 all-available Efficacy Popu Flag
- name: DTHFL
  type: str
  label: Subject Death Flag
- name: C19ILHFL
  type: str
  label: Prior Covid-19 Illness History Flag
- name: CNCRSLFL
  type: str
  label: Consider Result for Analysis Flag
- name: VRBLNGFL
  type: str
  label: NVA Baseline Result Negative Flag
- name: CRD1NGFL
  type: str
  label: NAAT Result At Dose 1 Negative Flag
- name: CRD2NGFL
  type: str
  label: NAAT Result At Dose 2 Negative Flag
- name: PDSYMFL
  type: str
  label: Protocol Defined SYMP Present Flag
- name: PDSDMFL
  type: str
  label: Protocol Defined SYMP Date Missing Flag
- name: SEVSYMFL
  type: str
  label: Severe Covid SYMP Present Flag
- name: ILD1FL
  type: str
  label: Illness Occur After Dose 1 Flag
- name: ILD27FL
  type: str
  label: Illness Occur 7 Days After Dose 2 Flag
- name: FILOCRFL
  type: str
  label: First Illness Occurrence Flag
- name: PDRMUFL
  type: str
  label: PD SYMP Result Missing or Unknown Flag
- name: PDP1FL
  type: str
  label: VE Prot Def Pop Incl Post D1 Flag
- name: PDP27FL
  type: str
  label: VE Prot Def Pop Incl 7D Post D2 Flag
- name: NMPDOCFL
  type: str
  label: No Major Protocol Deviation Occur Flag
- name: _SEQ
  type: int
  label: Row sequence within subject
output:
  path: <adam-dir>/adc19ef-yamaa.parquet
  columns:
  - STUDYID
  - USUBJID
  - SITEID
  - SUBJID
  - BRTHDT
  - AGEGR1N
  - AGEGR1
  - SEX
  - RACE
  - ETHNIC
  - ARMCD
  - ARM
  - ACTARMCD
  - ACTARM
  - PARAMN
  - PARAMCD
  - PARAM
  - PARCAT1
  - AVAL
  - AVALC
  - VISITNUM
  - VISIT
  - AVISITN
  - AVISIT
  - ADT
  - ADY
  - ASTDT
  - ASTDY
  - AENDT
  - AENDY
  - DCODT
  - RANDDT
  - TRTSDT
  - TRTEDT
  - VAX101DT
  - VAX102DT
  - DVSTDT
  - DTHDT
  - EOTDCDT
  - EOSDCDT
  - COMPLDT
  - RANDFL
  - EVALEFFL
  - AAI1EFFL
  - AAI2EFFL
  - DTHFL
  - C19ILHFL
  - CNCRSLFL
  - VRBLNGFL
  - CRD1NGFL
  - CRD2NGFL
  - PDSYMFL
  - PDSDMFL
  - SEVSYMFL
  - ILD1FL
  - ILD27FL
  - FILOCRFL
  - PDRMUFL
  - PDP1FL
  - PDP27FL
  - NMPDOCFL
  - _SEQ
