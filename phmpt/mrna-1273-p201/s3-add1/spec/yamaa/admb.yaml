# ADMB for Moderna mRNA-1273-P201, data cut add1.
# Parent: ../../../s3-d57/spec/yamaa/admb.yaml (which chains to ../../../spec/yamaa/base/adam-base.yaml) (section 3.1 core columns).
# Derivations implement the add1 A20ADMB program (prototype
# spec/yamaa/tools/admb_add1_proto.py matches all 86 submitted columns on
# all 41,243 rows). The add1 program is identical to the d57 program except
# for cosmetic spec-file macro references. Where the SAS code and the
# define.xml method text disagree, the code is followed (see README.md).
# Inputs: MB + SUPPMB + EX (SDTM) + ADSL (core columns). SUPPMB is pivoted
# for LOCALFL/LDTTYPE/LDTSTOTH by (USUBJID, MBSEQ); its other QNAMs
# (CNVRESC, CNVNRLO, RPTRTYP) are unused. MB has no SUBJID column in this
# SDTM extract, so ADMB.SUBJID comes from ADSL. Row accounting: MB 41,425
# rows -> filter (MBSTAT missing, MBTESTCD non-missing) 41,264 -> merge with
# ADSL on USUBJID drops 21 -> 41,243 submitted rows. Keys are
# [STUDYID, USUBJID, MBSEQ] (unique). Differences vs d57: 4 new core
# columns from the add1 ADSL (PBD209FL, PND209FL, PN2209FL, ELECSBL);
# COMPLFL is not in the add1 output (derivation null, SPEC-4). VISIT length
# is 33 (observed maximum; the Day 209 / Safety Call unscheduled visits
# reach 33 chars, ADLB add1 precedent). ELECSBL is Mandatory Yes in the
# add1 define but '' for all 600 ADSL subjects, so it is mandatory false
# (ADAE precedent, inherited from the ADEX add1 spec). MBBLFL agrees with
# the derived ABLFL on all add1 rows (d57 had exactly 1 mismatch).
# Layer over ../d57/admb.yaml: the derivations are the parent cut's, and
# this file holds only what this cut changes (written by
# scripts/specs/inherit_cut.py; its resolved specification
# equals the standalone file it replaced).
yamaa: '1.0'
type: spec
parent: ../../../s3-d57/spec/yamaa/admb.yaml
input:
  MB: <sdtm-dir>/mb.parquet
  SUPPMB: <sdtm-dir>/suppmb.parquet
  EX: <sdtm-dir>/ex.parquet
  ADSL:
    path: <adam-dir>/adsl.parquet
columns:
- name: PBD209FL
  type: str
  label: Per Protocol bAb Day 209 Flag
  derivation: ADSL.PBD209FL
  submission:
    core: Perm
    mandatory: false
    length: 1
    origins:
    - type: Predecessor
      description: ADSL.PBD209FL
- name: PND209FL
  type: str
  label: Per Protocol nAb Day 209 Flag
  derivation: ADSL.PND209FL
  submission:
    core: Perm
    mandatory: false
    length: 1
    origins:
    - type: Predecessor
      description: ADSL.PND209FL
- name: PN2209FL
  type: str
  label: Per Protocol nAb 2 Day 209 Flag
  derivation: ADSL.PN2209FL
  submission:
    core: Perm
    mandatory: false
    length: 1
    origins:
    - type: Predecessor
      description: ADSL.PN2209FL
- name: ELECSBL
  type: str
  label: Baseline Elecsys SARS CoV-2 Assay
  derivation: ADSL.ELECSBL
  submission:
    core: Perm
    mandatory: false
    length: 20
    origins:
    - type: Predecessor
      description: ADSL.ELECSBL
- name: COV19FL
  submission:
    length: 1
- name: SENTLFL
  submission:
    length: 1
- name: VISIT
  submission:
    length: 33
output:
  path: <adam-dir>/admb-add1-yamaa.parquet
  columns:
  - STUDYID
  - USUBJID
  - SUBJID
  - SITEID
  - COUNTRY
  - AGE
  - AGEU
  - AGEGR1
  - AGEGR1N
  - AGEGR2
  - AGEGR2N
  - SEX
  - RACE
  - RACESPY
  - ETHNIC
  - RANDFL
  - SAFFL
  - FASBABFL
  - FASNABFL
  - PPBABFL
  - PPNABFL
  - PPBD29FL
  - PPBD57FL
  - PBD209FL
  - PPND29FL
  - PPND57FL
  - PND209FL
  - SAR1FL
