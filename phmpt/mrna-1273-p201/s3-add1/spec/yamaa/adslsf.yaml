# ADSLSF for Moderna mRNA-1273-P201, data cut add1 (Addendum 1).
# Parent: ../../../s3-d57/spec/yamaa/adslsf.yaml (which chains to ../../../spec/yamaa/base/adam-base.yaml) (section 3.1 core columns).
# Derivations implement program/adam/A20ADSLSF (add1); where the SAS code
# and the define.xml disagree, the code is followed (see README.md).
# Population: the 490 screen failures in DM, identified by their last DS
# record being a SCREEN FAILURE disposition event (see README.md for the
# equivalence proof of the last-row formulation against the SAS two-step).
# add1 note: the SUPPRP file is the truncated `_S_supp` file
# FDA-CBER-2022-1614-3821335-3821350 (RDOMAIN='RP', 642 rows - same row
# count as d57 SUPPRP); the other two truncated `_S_supp` files are SUPPSS
# and SUPPXM, resolved by RDOMAIN.
# Layer over ../d57/adslsf.yaml: the derivations are the parent cut's, and
# this file holds only what this cut changes (written by
# scripts/specs/inherit_cut.py; its resolved specification
# equals the standalone file it replaced).
yamaa: '1.0'
type: spec
parent: ../../../s3-d57/spec/yamaa/adslsf.yaml
input:
  DM: <sdtm-dir>/dm.parquet
  DS: <sdtm-dir>/ds.parquet
  RP: <sdtm-dir>/rp.parquet
  SUPPDM: <sdtm-dir>/suppdm.parquet
  SUPPRP: <sdtm-dir>/supprp.parquet
output:
  path: <adam-dir>/adslsf-yamaa.parquet
