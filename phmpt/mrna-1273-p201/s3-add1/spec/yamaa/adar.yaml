# ADAR for Moderna mRNA-1273-P201, data cut add1 (Addendum 1).
# Parent: ../../../s3-d57/spec/yamaa/adar.yaml (which chains to ../../../spec/yamaa/base/adam-base.yaml) (section 3.1 core columns).
# Derivations implement the add1 A20ADAR program (Bates 3818618-3818630,
# recovered from spec/source/125752_S3_M5_mrna-1273-p201-add1_A_P_a20adar.pdf);
# where the SAS code and the define.xml method text disagree, the code is
# followed (see README.md). First generated by tools/gen_adar_add1_spec.py
# (retired) from the verified d57 spec; this file is the source.
# TRTA derives via %trta with ATPTREF as the dose reference (ADAR has no
# MDOSREF); the define's MT.ADXX.TRTA describes the ADTM-window variant.
# Layer over ../d57/adar.yaml: the derivations are the parent cut's, and
# this file holds only what this cut changes (written by
# scripts/specs/inherit_cut.py; its resolved specification
# equals the standalone file it replaced).
yamaa: '1.0'
type: spec
parent: ../../../s3-d57/spec/yamaa/adar.yaml
clear:
- columns.PARAMCD.derivation.mapping.dict.Lymphadenopathy
- columns.COMPLFL.submission
input:
  FACE: <sdtm-dir>/face.parquet
  SUPPFACE: <sdtm-dir>/suppface.parquet
  VS: <sdtm-dir>/vs.parquet
  SUPPVS: <sdtm-dir>/suppvs.parquet
  CO: <sdtm-dir>/co.parquet
  EX: <sdtm-dir>/ex.parquet
  ADSL:
    path: <adam-dir>/adsl.parquet
rows:
- id: fa_rows
  derivations:
    _MEDTAG:
- id: vs_rows
  derivations:
    _MEDTAG:
- id: medtakp_rows
  dataset: VS
  derivations:
    STUDYID: VS.STUDYID
    USUBJID: VS.USUBJID
    _SRC: '''VS'''
    _SEQ: VS.VSSEQ
    _FASEQ:
    _VSSEQ: VS.VSSEQ
    _DTC: VS.VSDTC
    _DY: VS.VSDY
    _TPT: VS.VSTPT
    _TPTNUM: VS.VSTPTNUM
    _TPTREF: VS.VSTPTREF
    _TESTCD: VS.VSTESTCD
    _TEST: VS.VSTEST
    _OBJ:
    _CAT: VS.VSCAT
    _SCAT: VS.VSSCAT
    _ORRES:
    _ORRESU:
    _STRESC: VS.VSSTRESC
    _STRESN: VS.VSSTRESN
    _STRESU: VS.VSSTRESU
    _STAT: VS.VSSTAT
    _EVAL:
    _LOC:
    _DOMAIN: VS.DOMAIN
    _MEDTAG: '''MEDTAKP'''
  filter: _CAT = 'REACTOGENICITY' AND _TPTNUM > 0 AND _TPTNUM <= 7 AND _MEDTAKP = 'Y' AND _ADSL IS NOT NULL
- id: medtakt_rows
  dataset: VS
  derivations:
    STUDYID: VS.STUDYID
    USUBJID: VS.USUBJID
    _SRC: '''VS'''
    _SEQ: VS.VSSEQ
    _FASEQ:
    _VSSEQ: VS.VSSEQ
    _DTC: VS.VSDTC
    _DY: VS.VSDY
    _TPT: VS.VSTPT
    _TPTNUM: VS.VSTPTNUM
    _TPTREF: VS.VSTPTREF
    _TESTCD: VS.VSTESTCD
    _TEST: VS.VSTEST
    _OBJ:
    _CAT: VS.VSCAT
    _SCAT: VS.VSSCAT
    _ORRES:
    _ORRESU:
    _STRESC: VS.VSSTRESC
    _STRESN: VS.VSSTRESN
    _STRESU: VS.VSSTRESU
    _STAT: VS.VSSTAT
    _EVAL:
    _LOC:
    _DOMAIN: VS.DOMAIN
    _MEDTAG: '''MEDTAKT'''
  filter: _CAT = 'REACTOGENICITY' AND _TPTNUM > 0 AND _TPTNUM <= 7 AND _MEDTAKT = 'Y' AND _ADSL IS NOT NULL
- id: medtak_rows
  dataset: VS
  derivations:
    STUDYID: VS.STUDYID
    USUBJID: VS.USUBJID
    _SRC: '''VS'''
    _SEQ: VS.VSSEQ
    _FASEQ:
    _VSSEQ: VS.VSSEQ
    _DTC: VS.VSDTC
    _DY: VS.VSDY
    _TPT: VS.VSTPT
    _TPTNUM: VS.VSTPTNUM
    _TPTREF: VS.VSTPTREF
    _TESTCD: VS.VSTESTCD
    _TEST: VS.VSTEST
    _OBJ:
    _CAT: VS.VSCAT
    _SCAT: VS.VSSCAT
    _ORRES:
    _ORRESU:
    _STRESC: VS.VSSTRESC
    _STRESN: VS.VSSTRESN
    _STRESU: VS.VSSTRESU
    _STAT: VS.VSSTAT
    _EVAL:
    _LOC:
    _DOMAIN: VS.DOMAIN
    _MEDTAG: '''MEDTAK'''
  filter: _CAT = 'REACTOGENICITY' AND _TPTNUM > 0 AND _TPTNUM <= 7 AND _MEDTAK = 'Y' AND _ADSL IS NOT NULL
intermediates:
- id: SUPPFACE_P
  filter: SUPPFACE.QNAM IN ('MAAEFL', 'LYMPHEVL', 'SREVL') AND SUPPFACE.IDVAR = 'FASEQ'
  pivot:
    fields:
    - MAAEFL
    - LYMPHEVL
    - SREVL
windows:
  ANL02_W1:
    group_by:
    - USUBJID
    - PARCAT1
    - PARAMCD
    - ATPTREF
    - ATPTN
    order_by:
    - variable: ATOXGRN
      direction: desc
    - _ANL01_CHK
    - _AVALC_CHK
    - ADT
    - ADTM
    filter: PARAMCD <> 'RASHOCC' AND PARAMCD <> 'LYMPHOCC' AND ATOXGRN IS NOT NULL
  ANL02_W2:
    group_by:
    - USUBJID
    - PARCAT1
    - PARAMCD
    - ATPTREF
    - ATPTN
    order_by:
    - variable: ATOXGRN
      direction: desc
    - _ANL01_CHK
    - _AVALC_CHK
    - ADT
    - ADTM
    filter: PARAMCD IN ('RASHOCC', 'LYMPHOCC')
output:
  path: <adam-dir>/adar-yamaa.parquet
  columns:
  - STUDYID
  - USUBJID
  - SUBJID
  - SITEID
  - COUNTRY
  - AGE
  - AGEU
  - AGEGR1
  - AGEGR1N
  - AGEGR2
  - AGEGR2N
  - SEX
  - RACE
  - RACESPY
  - ETHNIC
  - RANDFL
  - SAFFL
  - FASBABFL
  - FASNABFL
  - PPBABFL
  - PPNABFL
  - PPBD29FL
  - PPBD57FL
  - PBD209FL
  - PPND29FL
  - PPND57FL
  - PND209FL
  - SAR1FL
  - SAR2FL
  - SARAFL
  - FASNA2FL
  - PPNAB2FL
  - PN2D29FL
  - PN2D57FL
  - PN2209FL
  - DVBABFL
  - DVNABFL
  - DOSE1FL
  - DOSE2FL
  - DOSEROFL
  - COV19BL
  - ELECSBL
  - COV19FL
  - SENTLFL
  - D29W7DFL
  - TRT01P
  - TRT01PN
  - TRT01A
  - TRT01AN
  - TR01SDT
  - TR01SDTM
  - TR01EDT
  - TR01EDTM
  - TRTSDTM
  - TRTEDTM
  - DOSE2DT
  - DOS2DTM
  - TRTA
  - TRTAN
  - ASEQ
  - ADT
  - ATM
  - ADTM
  - ADY
  - ATPT
  - ATPTN
  - ATPTREF
  - ATPTGR1
  - ATPTGR1N
  - PARCAT1
  - PARCAT1N
  - PARAMCD
  - PARAM
  - AVAL
  - AVALC
  - ATOXGR
  - ATOXGRN
  - ANL01FL
  - ANL02FL
  - CRIT1
  - CRIT1FL
  - CRIT2
  - CRIT2FL
  - CRIT3
  - CRIT3FL
  - CRIT4
  - CRIT4FL
  - FALOC
  - FAEVAL
  - LYMPHCOM
  - LYMPHEVL
  - SRCOMM
  - SREVLFL
  - SRCDOM
  - SRCSEQ
  - SRCVAR
  - MAAEFL
columns:
- name: _MEDTAG
  type: str
- name: _MEDTAKP
  type: str
  derivation: SUPPVS_P.MEDTAKP
- name: _MEDTAKT
  type: str
  derivation: SUPPVS_P.MEDTAKT
- name: _MEDTAK
  type: str
  derivation: SUPPVS_P.MEDTAK
- name: PARAM
  derivation:
    case:
    - when: _MEDTAG = 'MEDTAKP'
      then: '''Prevent Pain or Fever from Occurring'''
    - when: _MEDTAG = 'MEDTAKT'
      then: '''Treat Pain or Fever already Occurred'''
    - when: _MEDTAG = 'MEDTAK'
      then: '''Medication Taken Today for Pain or Fever'''
    - when: _SRC = 'FA' AND _OBJ = 'Rash' AND _TESTCD <> 'SEV'
      then: '''Rash Occurrence'''
    - when: _SRC = 'FA' AND _OBJ = 'Solicited Rash'
      then: '''Rash'''
    - when: _SRC = 'FA' AND _OBJ = 'Underarm Gland Swelling or Tenderness' AND _TESTCD = 'SEV'
      then: '''Underarm Gland Swelling or Tenderness'''
    - when: _SRC = 'FA' AND _OBJ = 'Nausea/Vomiting' AND _TESTCD = 'SEV'
      then: '''Nausea/Vomiting'''
    - when: _SRC = 'FA' AND _OBJ = 'Lymphadenopathy'
      then: '''Lymphadenopathy Occurrence'''
    - when: _SRC = 'FA' AND _OBJ IN ('Erythema', 'Swelling') AND _TESTCD = 'OCCUR'
      then:
        str_template: '{_OBJ} Longest Diameter (mm)'
    - when: _SRC = 'FA' AND _OBJ IN ('Erythema', 'Swelling') AND _TESTCD = 'SEV'
      then:
        str_template: '{_OBJ} Longest Diameter (mm)'
    - when: _SRC = 'FA' AND _OBJ IN ('Erythema', 'Swelling') AND _TESTCD = 'LDIAM'
      then:
        str_template: '{_OBJ} {_TEST_P} ({_ORRESU})'
    - when: _SRC = 'FA' AND _OBJ = 'Fever'
      then: '''Fever (C)'''
    - when: _SRC = 'VS' AND _TESTCD = 'TEMP' AND _STRESU IS NULL
      then: '''Fever (C)'''
    - when: _SRC = 'VS' AND _TESTCD = 'TEMP'
      then:
        str_template: Fever ({_STRESU})
    - when: _SRC = 'VS' AND _TESTCD = 'VSALL'
      then: '''Fever (C)'''
    - otherwise: _OBJ
  submission:
    method: "Withheld from publication: the received define states this text."
- name: PARAMCD
  derivation:
    mapping:
      dict:
        Underarm Gland Swelling or Tenderness: LYMPH
        Prevent Pain or Fever from Occurring: MEDTAKP
        Treat Pain or Fever already Occurred: MEDTAKT
        Medication Taken Today for Pain or Fever: MEDTAK
- name: _ATPT_RAW
  derivation:
    case:
    - when: _SRC = 'FA' AND _EVAL = 'STUDY SUBJECT'
      then: _TPT
    - when: _SRC = 'FA' AND _EVAL = 'INVESTIGATOR'
      then: _TPT
    - when: _SRC = 'VS'
      then: _TPT
- name: ATPT
  submission:
    method: "Withheld from publication: the received define states this text."
- name: ATPTN
  derivation:
    mapping:
      dict:
        DAY 1, 30 MINS AFTER VACCINATION (AT STUDY CLINIC): 1.05
- name: ATPTREF
  derivation:
    case:
    - when: str_contains(_TPTREF, 'DOSE 1 OL')
      then: '''OL Vaccination 1'''
    - when: str_contains(_TPTREF, 'DOSE 2 OL')
      then: '''OL Vaccination 2'''
    - when: str_contains(_TPTREF, 'DOSE 1')
      then: '''Vaccination 1'''
    - when: str_contains(_TPTREF, 'DOSE 2')
      then: '''Vaccination 2'''
- name: AVAL
  derivation:
    case:
    - when: PARAMCD IN ('MEDTAKP', 'MEDTAKT', 'MEDTAK')
      then:
    - when: _SRC = 'FA' AND _OBJ IN ('Erythema', 'Swelling') AND _TESTCD = 'OCCUR' AND _ORRES = 'N'
      then: 0
    - otherwise: _STRESN
- name: AVALC
  derivation:
    case:
    - when: PARAMCD IN ('MEDTAKP', 'MEDTAKT', 'MEDTAK')
      then: '''Y'''
    - otherwise: _STRESC
- name: SRCVAR
  derivation:
    case:
    - when: PARAMCD IN ('MEDTAKP', 'MEDTAKT', 'MEDTAK')
      then:
        str_template: "SUPPVS.QVAL where QNAM='{_MEDTAG}'"
    - when: _SRC = 'FA'
      then: '''FASTRESC'''
    - otherwise: '''VSSTRESN'''
- name: _ANL02_RN1
  type: int
  derivation:
    row_number:
      window: ANL02_W1
- name: _ANL02_RN2
  type: int
  derivation:
    row_number:
      window: ANL02_W2
- name: ANL02FL
  derivation:
    case:
    - when: _ANL02_RN1 = 1 OR _ANL02_RN2 = 1
      then: '''Y'''
  submission:
    method: "Withheld from publication: the received define states this text."
- name: PBD209FL
  type: str
  label: Per Protocol bAb Day 209 Flag
  derivation: ADSL.PBD209FL
  submission:
    core: Perm
    mandatory: false
    length: 1
    origins:
    - type: Predecessor
      description: ADSL.PBD209FL
- name: PND209FL
  type: str
  label: Per Protocol nAb Day 209 Flag
  derivation: ADSL.PND209FL
  submission:
    core: Perm
    mandatory: false
    length: 1
    origins:
    - type: Predecessor
      description: ADSL.PND209FL
- name: PN2209FL
  type: str
  label: Per Protocol nAb 2 Day 209 Flag
  derivation: ADSL.PN2209FL
  submission:
    core: Perm
    mandatory: false
    length: 1
    origins:
    - type: Predecessor
      description: ADSL.PN2209FL
- name: COMPLFL
  derivation:
- name: ELECSBL
  type: str
  label: Baseline Elecsys SARS CoV-2 Assay
  derivation: ADSL.ELECSBL
  submission:
    core: Perm
    mandatory: false
    length: 20
    origins:
    - type: Predecessor
      description: ADSL.ELECSBL
