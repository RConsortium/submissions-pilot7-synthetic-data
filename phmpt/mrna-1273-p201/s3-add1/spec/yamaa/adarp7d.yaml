# ADARP7D for Moderna mRNA-1273-P201, data cut add1 (Addendum 1).
# Parent: ../../../spec/yamaa/base/adam-base.yaml (section 3.1 core columns).
# Derivations implement the add1 A20ADARP7D program (Bates 3818631-3818645),
# which is a complete rewrite of the d57 program: per-record (not grouped
# collapse), reading FACE + FAAE + VS, with MEDTAK* rows from SUPPVS.
# Where the SAS code and the define.xml method text disagree, the code is
# followed (see README.md). First generated by
# tools/gen_adarp7d_add1_spec.py (retired); this file is the source.
yamaa: '1.0'
type: spec
model: ADaM
parent: ../../../spec/yamaa/base/adam-base.yaml
domain: ADARP7D
keys:
- STUDYID
- USUBJID
- ASEQ
submission:
  label: Solicited AR post D7 Analysis Dataset
  class: BASIC DATA STRUCTURE
  structure: One or more records per subject per analysis parameter per analysis timepoint
  repeating: true
input:
  FACE: <sdtm-dir>/face.parquet
  FAAE: <sdtm-dir>/faae.parquet
  VS: <sdtm-dir>/vs.parquet
  SUPPFACE: <sdtm-dir>/suppface.parquet
  SUPPFAAE: <sdtm-dir>/suppfaae.parquet
  SUPPVS: <sdtm-dir>/suppvs.parquet
  ADSL:
    path: <adam-dir>/adsl.parquet
    key:
    - STUDYID
    - USUBJID
intermediates:
- id: SUPPFACE_P
  dataset: SUPPFACE
  key:
    STUDYID: STUDYID
    USUBJID: USUBJID
    IDVARVAL:
      str_decimal:
        source: _FASEQ
        decimals: 0
  filter: SUPPFACE.QNAM = 'MAAEFL' AND SUPPFACE.IDVAR = 'FASEQ'
  pivot:
    name: QNAM
    value: QVAL
    fields:
    - MAAEFL
- id: SUPPFAAE_P
  dataset: SUPPFAAE
  key:
    STUDYID: STUDYID
    USUBJID: USUBJID
    IDVARVAL:
      str_decimal:
        source: _FASEQ
        decimals: 0
  filter: SUPPFAAE.QNAM = 'MAAEFL' AND SUPPFAAE.IDVAR = 'FASEQ'
  pivot:
    name: QNAM
    value: QVAL
    fields:
    - MAAEFL
- id: SUPPVS_P
  dataset: SUPPVS
  key:
    STUDYID: STUDYID
    USUBJID: USUBJID
    IDVARVAL:
      str_decimal:
        source: _VSSEQ
        decimals: 0
  filter: SUPPVS.QNAM IN ('MEDTAKP', 'MEDTAKT', 'MEDTAK') AND SUPPVS.IDVAR = 'VSSEQ'
  pivot:
    name: QNAM
    value: QVAL
    fields:
    - MEDTAKP
    - MEDTAKT
    - MEDTAK
- id: FAAE_KEYS
  dataset: FAAE
  key:
  - USUBJID
  - PARAMCD1
  - ATPTREF
  derivations:
    _OBJ:
      type: str
      derivation: FAAE.FAOBJ
    _TESTCD:
      type: str
      derivation: FAAE.FATESTCD
    _TPTREF:
      type: str
      derivation: FAAE.FATPTREF
    PARAMCD1:
      type: str
      derivation:
        case:
        - when: _OBJ = 'Rash' AND _TESTCD <> 'SEV'
          then: '''RASHOCC'''
        - when: _OBJ = 'Underarm Gland Swelling or Tenderness'
          then: '''LYMPH'''
        - when: _OBJ IN ('Pyrexia', 'Fever')
          then: '''FEVER'''
        - when: _OBJ = 'Pain'
          then: '''PAIN'''
        - when: _OBJ = 'Nausea/Vomiting'
          then: '''NAUSEA'''
        - when: _OBJ = 'Erythema'
          then: '''ERYTHDIA'''
        - when: _OBJ = 'Swelling'
          then: '''SWELLDIA'''
        - when: _OBJ = 'Headache'
          then: '''HEADACHE'''
        - when: _OBJ = 'Fatigue'
          then: '''FATIGUE'''
        - when: _OBJ = 'Myalgia'
          then: '''MYALGIA'''
        - when: _OBJ = 'Arthralgia'
          then: '''ARTHRALG'''
        - when: _OBJ = 'Chills'
          then: '''CHILLS'''
    ATPTREF:
      type: str
      derivation:
        case:
        - when: str_contains(_TPTREF, 'DOSE 1 OL')
          then: '''OL Vaccination 1'''
        - when: str_contains(_TPTREF, 'DOSE 2 OL')
          then: '''OL Vaccination 2'''
        - when: str_contains(_TPTREF, 'DOSE 1')
          then: '''Vaccination 1'''
        - when: str_contains(_TPTREF, 'DOSE 2')
          then: '''Vaccination 2'''
  filter: FAAE.PARAMCD1 IS NOT NULL AND ((FAAE.FAOBJ <> 'Erythema' AND FAAE.FAOBJ <> 'Swelling') OR FAAE.FATESTCD <> 'OCCUR' OR FAAE.FAORRES IS NULL OR FAAE.FAORRES <> 'Y') AND (FAAE.FASTAT IS NULL OR FAAE.FASTAT <> 'NOT DONE') AND FAAE.FACAT = 'REACTOGENICITY' AND FAAE.FATPTREF IS NOT NULL
  order_by:
  - FAAE.FASEQ
  keep: first
- id: VS_KEYS
  dataset: VS
  key:
  - USUBJID
  - VSTESTCD
  - VSTPTREF
  filter: VS.VSTPTNUM > 7 AND VS.VSCAT = 'REACTOGENICITY' AND (VS.VSSTAT IS NULL OR VS.VSSTAT <> 'NOT DONE') AND VS.VSTPTREF IS NOT NULL AND VS.VSTESTCD = 'TEMP'
  order_by:
  - VS.VSSEQ
  keep: first
- id: VS_SUBJ
  dataset: VS
  key:
  - USUBJID
  filter: VS.VSTPTNUM > 7 AND VS.VSCAT = 'REACTOGENICITY' AND VS.VSTPTREF IS NOT NULL
  order_by:
  - VS.VSSEQ
  keep: first
- id: FACE1
  dataset: FACE
  derivations:
    _FASEQ:
      type: float
      derivation: FACE.FASEQ
    _MAAEFL:
      type: str
      derivation: SUPPFACE_P.MAAEFL
    _OBJ:
      type: str
      derivation: FACE.FAOBJ
    _TESTCD:
      type: str
      derivation: FACE.FATESTCD
    _TEST:
      type: str
      derivation: FACE.FATEST
    _ORRES:
      type: str
      derivation: FACE.FAORRES
    _STRESC:
      type: str
      derivation: FACE.FASTRESC
    _STRESN:
      type: float
      derivation: FACE.FASTRESN
    _STAT:
      type: str
      derivation: FACE.FASTAT
    _CAT:
      type: str
      derivation: FACE.FACAT
    _SCAT:
      type: str
      derivation: FACE.FASCAT
    _EVAL:
      type: str
      derivation: FACE.FAEVAL
    _TPT:
      type: str
      derivation: FACE.FATPT
    _TPTNUM:
      type: float
      derivation: FACE.FATPTNUM
    _TPTREF:
      type: str
      derivation: FACE.FATPTREF
    _DTC:
      type: str
      derivation: FACE.FADTC
    _DY:
      type: float
      derivation: FACE.FADY
    PARAMCD1:
      type: str
      derivation:
        case:
        - when: _OBJ = 'Rash' AND _TESTCD <> 'SEV'
          then: '''RASHOCC'''
        - when: _OBJ = 'Underarm Gland Swelling or Tenderness'
          then: '''LYMPH'''
        - when: _OBJ IN ('Pyrexia', 'Fever')
          then: '''FEVER'''
        - when: _OBJ = 'Pain'
          then: '''PAIN'''
        - when: _OBJ = 'Nausea/Vomiting'
          then: '''NAUSEA'''
        - when: _OBJ = 'Erythema'
          then: '''ERYTHDIA'''
        - when: _OBJ = 'Swelling'
          then: '''SWELLDIA'''
        - when: _OBJ = 'Headache'
          then: '''HEADACHE'''
        - when: _OBJ = 'Fatigue'
          then: '''FATIGUE'''
        - when: _OBJ = 'Myalgia'
          then: '''MYALGIA'''
        - when: _OBJ = 'Arthralgia'
          then: '''ARTHRALG'''
        - when: _OBJ = 'Chills'
          then: '''CHILLS'''
    ATPTREF:
      type: str
      derivation:
        case:
        - when: str_contains(_TPTREF, 'DOSE 1 OL')
          then: '''OL Vaccination 1'''
        - when: str_contains(_TPTREF, 'DOSE 2 OL')
          then: '''OL Vaccination 2'''
        - when: str_contains(_TPTREF, 'DOSE 1')
          then: '''Vaccination 1'''
        - when: str_contains(_TPTREF, 'DOSE 2')
          then: '''Vaccination 2'''
    _KEY_HIT:
      type: str
      derivation: FAAE_KEYS.PARAMCD1
    PARAMCD:
      type: str
      derivation:
        case:
        - when: _OBJ IN ('Pyrexia', 'Fever')
          then: '''FEVER'''
        - when: _OBJ = 'Rash' AND _TESTCD <> 'SEV'
          then: '''RASHOCC'''
        - when: _OBJ = 'Underarm Gland Swelling or Tenderness' AND _TESTCD = 'SEV'
          then: '''LYMPH'''
        - when: _OBJ = 'Pain'
          then: '''PAIN'''
        - when: _OBJ = 'Nausea/Vomiting' AND _TESTCD = 'SEV'
          then: '''NAUSEA'''
        - when: _OBJ = 'Erythema' AND _TESTCD = 'OCCUR' AND _ORRES IN ('N', 'NO')
          then: '''ERYTHDIA'''
        - when: _OBJ = 'Swelling' AND _TESTCD = 'OCCUR' AND _ORRES IN ('N', 'NO')
          then: '''SWELLDIA'''
        - when: _OBJ = 'Erythema' AND _TESTCD = 'SEV'
          then: '''ERYTHDIA'''
        - when: _OBJ = 'Swelling' AND _TESTCD = 'SEV'
          then: '''SWELLDIA'''
        - when: _OBJ = 'Erythema' AND _TESTCD = 'LDIAM'
          then: '''ERYTHDIA'''
        - when: _OBJ = 'Swelling' AND _TESTCD = 'LDIAM'
          then: '''SWELLDIA'''
        - when: _OBJ = 'Headache'
          then: '''HEADACHE'''
        - when: _OBJ = 'Fatigue'
          then: '''FATIGUE'''
        - when: _OBJ = 'Myalgia'
          then: '''MYALGIA'''
        - when: _OBJ = 'Arthralgia'
          then: '''ARTHRALG'''
        - when: _OBJ = 'Chills'
          then: '''CHILLS'''
    PARAM:
      type: str
      derivation:
        case:
        - when: PARAMCD = 'RASHOCC'
          then: '''Rash Occurrence'''
        - when: PARAMCD = 'LYMPH'
          then: '''Axillary Swelling or Tenderness'''
        - when: PARAMCD = 'PAIN'
          then: '''Pain'''
        - when: PARAMCD = 'ERYTHDIA'
          then: '''Erythema Longest Diameter (mm)'''
        - when: PARAMCD = 'SWELLDIA'
          then: '''Swelling Longest Diameter (mm)'''
        - when: PARAMCD = 'HEADACHE'
          then: '''Headache'''
        - when: PARAMCD = 'FATIGUE'
          then: '''Fatigue'''
        - when: PARAMCD = 'MYALGIA'
          then: '''Myalgia'''
        - when: PARAMCD = 'ARTHRALG'
          then: '''Arthralgia'''
        - when: PARAMCD = 'NAUSEA'
          then: '''Nausea/Vomiting'''
        - when: PARAMCD = 'CHILLS'
          then: '''Chills'''
        - when: PARAMCD = 'FEVER'
          then: '''Fever (C)'''
        - when: PARAMCD = 'MEDTAKP'
          then: '''Prevent Pain or Fever from Occurring'''
        - when: PARAMCD = 'MEDTAKT'
          then: '''Treat Pain or Fever already Occurred'''
        - when: PARAMCD = 'MEDTAK'
          then: '''Medication Taken Today for Pain or Fever'''
        - otherwise: _OBJ
    AVAL:
      type: float
      derivation:
        case:
        - when: _ORRES IN ('N', 'NO') AND _TEST = 'Occurrence Indicator' AND PARAMCD IN ('ERYTHDIA', 'SWELLDIA')
          then: 0
        - otherwise: _STRESN
    AVALC:
      type: str
      derivation:
        str_replace:
          source: _STRESC
          pattern: 'GRADE GRADE '
          replacement: 'GRADE '
    ATOXGRN:
      type: int
      derivation:
        case:
        - when: PARAMCD IN ('ERYTHDIA', 'SWELLDIA') AND ((AVAL > 0 AND AVAL < 25) OR str_contains(_STRESC, 'GRADE 0'))
          then: 0
        - when: PARAMCD IN ('ERYTHDIA', 'SWELLDIA') AND ((AVAL >= 25 AND AVAL <= 50) OR str_contains(_STRESC, 'GRADE 1'))
          then: 1
        - when: PARAMCD IN ('ERYTHDIA', 'SWELLDIA') AND ((AVAL > 50 AND AVAL <= 100) OR str_contains(_STRESC, 'GRADE 2'))
          then: 2
        - when: PARAMCD IN ('ERYTHDIA', 'SWELLDIA') AND ((AVAL > 100) OR str_contains(_STRESC, 'GRADE 3'))
          then: 3
        - when: PARAMCD IN ('ERYTHDIA', 'SWELLDIA') AND str_contains(_STRESC, 'GRADE 4')
          then: 4
        - when: PARAMCD = 'FEVER' AND ((AVAL > 0 AND AVAL < 38.0) OR str_contains(_STRESC, 'GRADE 0'))
          then: 0
        - when: PARAMCD = 'FEVER' AND ((AVAL >= 38.0 AND AVAL <= 38.4) OR str_contains(_STRESC, 'GRADE 1'))
          then: 1
        - when: PARAMCD = 'FEVER' AND ((AVAL > 38.4 AND AVAL <= 38.9) OR str_contains(_STRESC, 'GRADE 2'))
          then: 2
        - when: PARAMCD = 'FEVER' AND ((AVAL > 38.9 AND AVAL <= 40.0) OR str_contains(_STRESC, 'GRADE 3'))
          then: 3
        - when: PARAMCD = 'FEVER' AND ((AVAL > 40.0) OR str_contains(_STRESC, 'GRADE 4'))
          then: 4
        - when: PARAMCD IN ('PAIN', 'LYMPH', 'HEADACHE') AND (AVALC = 'NONE' OR str_contains(_STRESC, 'GRADE 0'))
          then: 0
        - when: PARAMCD IN ('PAIN', 'LYMPH', 'HEADACHE') AND (AVALC IN ('DOES NOT INTERFERE WITH ACTIVITY', 'NO INTERFERENCE WITH ACTIVITY') OR str_contains(_STRESC, 'GRADE 1'))
          then: 1
        - when: PARAMCD IN ('PAIN', 'LYMPH', 'HEADACHE') AND (str_contains(AVALC, 'REPEATED') OR str_contains(_STRESC, 'GRADE 2'))
          then: 2
        - when: PARAMCD IN ('PAIN', 'LYMPH', 'HEADACHE') AND (AVALC IN ('ANY USE OF PRESCRIPTION RELIEVER OR PREVENTS DAILY ACTIVITY', 'ANY USE OF PRESCRIPTION PAIN RELIEVER OR PREVENTS DAILY ACTIVITY') OR str_contains(_STRESC, 'GRADE 3'))
          then: 3
        - when: PARAMCD IN ('PAIN', 'LYMPH', 'HEADACHE') AND str_contains(_STRESC, 'GRADE 4')
          then: 4
        - when: PARAMCD IN ('FATIGUE', 'MYALGIA', 'ARTHRALG') AND (AVALC = 'NONE' OR str_contains(_STRESC, 'GRADE 0'))
          then: 0
        - when: PARAMCD IN ('FATIGUE', 'MYALGIA', 'ARTHRALG') AND (AVALC = 'NO INTERFERENCE WITH ACTIVITY' OR str_contains(_STRESC, 'GRADE 1'))
          then: 1
        - when: PARAMCD IN ('FATIGUE', 'MYALGIA', 'ARTHRALG') AND (AVALC = 'SOME INTERFERENCE WITH ACTIVITY' OR str_contains(_STRESC, 'GRADE 2'))
          then: 2
        - when: PARAMCD IN ('FATIGUE', 'MYALGIA', 'ARTHRALG') AND (AVALC = 'SIGNIFICANT; PREVENTS DAILY ACTIVITY' OR str_contains(_STRESC, 'GRADE 3'))
          then: 3
        - when: PARAMCD IN ('FATIGUE', 'MYALGIA', 'ARTHRALG') AND str_contains(_STRESC, 'GRADE 4')
          then: 4
        - when: PARAMCD = 'NAUSEA' AND (AVALC = 'NONE' OR str_contains(_STRESC, 'GRADE 0'))
          then: 0
        - when: PARAMCD = 'NAUSEA' AND (AVALC = 'NO INTERFERENCE WITH ACTIVITY OR 1-2 EPISODES/24 HOURS' OR str_contains(_STRESC, 'GRADE 1'))
          then: 1
        - when: PARAMCD = 'NAUSEA' AND (AVALC = 'SOME INTERFERENCE WITH ACTIVITY OR >2 EPISODES/24 HOURS' OR str_contains(_STRESC, 'GRADE 2'))
          then: 2
        - when: PARAMCD = 'NAUSEA' AND (AVALC = 'PREVENTS DAILY ACTIVITY, REQUIRES OUTPATIENT IV HYDRATION' OR str_contains(_STRESC, 'GRADE 3'))
          then: 3
        - when: PARAMCD = 'NAUSEA' AND str_contains(_STRESC, 'GRADE 4')
          then: 4
        - when: PARAMCD = 'CHILLS' AND (AVALC = 'NONE' OR str_contains(_STRESC, 'GRADE 0'))
          then: 0
        - when: PARAMCD = 'CHILLS' AND (AVALC = 'NO INTERFERENCE WITH ACTIVITY' OR str_contains(_STRESC, 'GRADE 1'))
          then: 1
        - when: PARAMCD = 'CHILLS' AND (AVALC = 'SOME INTERFERENCE WITH ACTIVITY NOT REQUIRING MEDICAL ATTENTION' OR str_contains(_STRESC, 'GRADE 2'))
          then: 2
        - when: PARAMCD = 'CHILLS' AND (AVALC = 'PREVENTS DAILY ACTIVITY AND REQUIRES MEDICAL ATTENTION' OR str_contains(_STRESC, 'GRADE 3'))
          then: 3
        - when: PARAMCD = 'CHILLS' AND str_contains(_STRESC, 'GRADE 4')
          then: 4
    ATOXGR:
      type: str
      derivation:
        case:
        - when: ATOXGRN = 0
          then: '''Grade 0'''
        - when: ATOXGRN = 1
          then: '''Grade 1'''
        - when: ATOXGRN = 2
          then: '''Grade 2'''
        - when: ATOXGRN = 3
          then: '''Grade 3'''
        - when: ATOXGRN = 4
          then: '''Grade 4'''
    PARCAT1:
      type: str
      derivation:
        case:
        - when: str_contains(_SCAT, 'ADMINIST')
          then: '''LOCAL'''
        - otherwise: _SCAT
    PARCAT1N:
      type: int
      derivation:
        mapping:
          source: PARCAT1
          dict:
            LOCAL: 1
            SYSTEMIC: 2
          unmapped: null
    ATPT:
      type: str
      derivation:
        case:
        - when: _TPT = 'DAY 1' AND _EVAL = 'INVESTIGATOR'
          then: '''DAY 1, AFTER VACCINATION (AT HOME)'''
        - otherwise: _TPT
    ATPTN:
      type: float
      derivation:
        case:
        - when: ATPT = 'DAY 1, 30 MINS AFTER VACCINATION (AT STUDY CLINIC)'
          then: 1.05
        - when: ATPT = 'DAY 1, 1 HOUR AFTER VACCINATION (AT STUDY CLINIC)'
          then: 1.1
        - when: ATPT = 'DAY 1, AFTER VACCINATION (AT HOME)'
          then: 1.2
        - otherwise: _TPTNUM
    ATPTGR1:
      type: str
      derivation:
        case:
        - when: ATPT = 'DAY 1' OR str_contains(ATPT, 'DAY 1,')
          then: '''DAY 1'''
        - otherwise: ATPT
    ATPTGR1N:
      type: int
      derivation: FLOOR(ATPTN)
    _ATPTA:
      type: int
      derivation:
        case:
        - when: ATPTGR1N IS NOT NULL
          then: 1
    ANL01FL:
      type: str
      derivation:
        case:
        - when: PARAMCD IN ('PAIN', 'ERYTHDIA', 'SWELLDIA', 'LYMPH') AND ATOXGRN > 0
          then: '''Y'''
    _FAEVAL_N:
      type: int
      derivation:
        case:
        - when: _EVAL IN ('STUDY SUBJECT', 'CAREGIVER')
          then: 1
        - when: _EVAL IS NULL
          then: 2
        - when: _EVAL = 'INVESTIGATOR'
          then: 3
    _AGFL:
      type: int
      derivation:
        case:
        - when: ATOXGRN IS NOT NULL OR (PARAMCD = 'RASHOCC' AND AVALC IS NOT NULL)
          then: 1
    _DT:
      type: date
      derivation:
        to_date:
          source: _DTC
    _DTM:
      type: datetime
      derivation:
        case:
        - when: str_contains(_DTC, 'T')
          then:
            impute:
              type: datetime
              source: _DTC
              time: first
    _TM:
      type: time
      derivation:
        to_time:
          source: _DTM
  filter: FACE._KEY_HIT IS NOT NULL AND ((FACE.FAOBJ <> 'Erythema' AND FACE.FAOBJ <> 'Swelling') OR FACE.FATESTCD <> 'OCCUR' OR FACE.FAORRES IS NULL OR FACE.FAORRES <> 'Y') AND (FACE.FASTAT IS NULL OR FACE.FASTAT <> 'NOT DONE') AND FACE.FACAT = 'REACTOGENICITY'
- id: FAAE1
  dataset: FAAE
  derivations:
    _FASEQ:
      type: float
      derivation: FAAE.FASEQ
    _MAAEFL:
      type: str
      derivation: SUPPFAAE_P.MAAEFL
    _OBJ:
      type: str
      derivation: FAAE.FAOBJ
    _TESTCD:
      type: str
      derivation: FAAE.FATESTCD
    _TEST:
      type: str
      derivation: FAAE.FATEST
    _ORRES:
      type: str
      derivation: FAAE.FAORRES
    _STRESC:
      type: str
      derivation: FAAE.FASTRESC
    _STRESN:
      type: float
      derivation: FAAE.FASTRESN
    _STAT:
      type: str
      derivation: FAAE.FASTAT
    _CAT:
      type: str
      derivation: FAAE.FACAT
    _SCAT:
      type: str
      derivation: FAAE.FASCAT
    _EVAL:
      type: str
      derivation: FAAE.FAEVAL
    _TPT:
      type: str
      derivation: FAAE.FATPT
    _TPTNUM:
      type: float
      derivation: FAAE.FATPTNUM
    _TPTREF:
      type: str
      derivation: FAAE.FATPTREF
    _DTC:
      type: str
      derivation: FAAE.FADTC
    _DY:
      type: float
      derivation: FAAE.FADY
    PARAMCD1:
      type: str
      derivation:
        case:
        - when: _OBJ = 'Rash' AND _TESTCD <> 'SEV'
          then: '''RASHOCC'''
        - when: _OBJ = 'Underarm Gland Swelling or Tenderness'
          then: '''LYMPH'''
        - when: _OBJ IN ('Pyrexia', 'Fever')
          then: '''FEVER'''
        - when: _OBJ = 'Pain'
          then: '''PAIN'''
        - when: _OBJ = 'Nausea/Vomiting'
          then: '''NAUSEA'''
        - when: _OBJ = 'Erythema'
          then: '''ERYTHDIA'''
        - when: _OBJ = 'Swelling'
          then: '''SWELLDIA'''
        - when: _OBJ = 'Headache'
          then: '''HEADACHE'''
        - when: _OBJ = 'Fatigue'
          then: '''FATIGUE'''
        - when: _OBJ = 'Myalgia'
          then: '''MYALGIA'''
        - when: _OBJ = 'Arthralgia'
          then: '''ARTHRALG'''
        - when: _OBJ = 'Chills'
          then: '''CHILLS'''
    ATPTREF:
      type: str
      derivation:
        case:
        - when: str_contains(_TPTREF, 'DOSE 1 OL')
          then: '''OL Vaccination 1'''
        - when: str_contains(_TPTREF, 'DOSE 2 OL')
          then: '''OL Vaccination 2'''
        - when: str_contains(_TPTREF, 'DOSE 1')
          then: '''Vaccination 1'''
        - when: str_contains(_TPTREF, 'DOSE 2')
          then: '''Vaccination 2'''
    _KEY_HIT:
      type: str
      derivation: FAAE_KEYS.PARAMCD1
    PARAMCD:
      type: str
      derivation:
        case:
        - when: _OBJ IN ('Pyrexia', 'Fever')
          then: '''FEVER'''
        - when: _OBJ = 'Rash' AND _TESTCD <> 'SEV'
          then: '''RASHOCC'''
        - when: _OBJ = 'Underarm Gland Swelling or Tenderness' AND _TESTCD = 'SEV'
          then: '''LYMPH'''
        - when: _OBJ = 'Pain'
          then: '''PAIN'''
        - when: _OBJ = 'Nausea/Vomiting' AND _TESTCD = 'SEV'
          then: '''NAUSEA'''
        - when: _OBJ = 'Erythema' AND _TESTCD = 'OCCUR' AND _ORRES IN ('N', 'NO')
          then: '''ERYTHDIA'''
        - when: _OBJ = 'Swelling' AND _TESTCD = 'OCCUR' AND _ORRES IN ('N', 'NO')
          then: '''SWELLDIA'''
        - when: _OBJ = 'Erythema' AND _TESTCD = 'SEV'
          then: '''ERYTHDIA'''
        - when: _OBJ = 'Swelling' AND _TESTCD = 'SEV'
          then: '''SWELLDIA'''
        - when: _OBJ = 'Erythema' AND _TESTCD = 'LDIAM'
          then: '''ERYTHDIA'''
        - when: _OBJ = 'Swelling' AND _TESTCD = 'LDIAM'
          then: '''SWELLDIA'''
        - when: _OBJ = 'Headache'
          then: '''HEADACHE'''
        - when: _OBJ = 'Fatigue'
          then: '''FATIGUE'''
        - when: _OBJ = 'Myalgia'
          then: '''MYALGIA'''
        - when: _OBJ = 'Arthralgia'
          then: '''ARTHRALG'''
        - when: _OBJ = 'Chills'
          then: '''CHILLS'''
    PARAM:
      type: str
      derivation:
        case:
        - when: PARAMCD = 'RASHOCC'
          then: '''Rash Occurrence'''
        - when: PARAMCD = 'LYMPH'
          then: '''Axillary Swelling or Tenderness'''
        - when: PARAMCD = 'PAIN'
          then: '''Pain'''
        - when: PARAMCD = 'ERYTHDIA'
          then: '''Erythema Longest Diameter (mm)'''
        - when: PARAMCD = 'SWELLDIA'
          then: '''Swelling Longest Diameter (mm)'''
        - when: PARAMCD = 'HEADACHE'
          then: '''Headache'''
        - when: PARAMCD = 'FATIGUE'
          then: '''Fatigue'''
        - when: PARAMCD = 'MYALGIA'
          then: '''Myalgia'''
        - when: PARAMCD = 'ARTHRALG'
          then: '''Arthralgia'''
        - when: PARAMCD = 'NAUSEA'
          then: '''Nausea/Vomiting'''
        - when: PARAMCD = 'CHILLS'
          then: '''Chills'''
        - when: PARAMCD = 'FEVER'
          then: '''Fever (C)'''
        - when: PARAMCD = 'MEDTAKP'
          then: '''Prevent Pain or Fever from Occurring'''
        - when: PARAMCD = 'MEDTAKT'
          then: '''Treat Pain or Fever already Occurred'''
        - when: PARAMCD = 'MEDTAK'
          then: '''Medication Taken Today for Pain or Fever'''
        - otherwise: _OBJ
    AVAL:
      type: float
      derivation:
        case:
        - when: _ORRES IN ('N', 'NO') AND _TEST = 'Occurrence Indicator' AND PARAMCD IN ('ERYTHDIA', 'SWELLDIA')
          then: 0
        - otherwise: _STRESN
    AVALC:
      type: str
      derivation:
        str_replace:
          source: _STRESC
          pattern: 'GRADE GRADE '
          replacement: 'GRADE '
    ATOXGRN:
      type: int
      derivation:
        case:
        - when: PARAMCD IN ('ERYTHDIA', 'SWELLDIA') AND ((AVAL > 0 AND AVAL < 25) OR str_contains(_STRESC, 'GRADE 0'))
          then: 0
        - when: PARAMCD IN ('ERYTHDIA', 'SWELLDIA') AND ((AVAL >= 25 AND AVAL <= 50) OR str_contains(_STRESC, 'GRADE 1'))
          then: 1
        - when: PARAMCD IN ('ERYTHDIA', 'SWELLDIA') AND ((AVAL > 50 AND AVAL <= 100) OR str_contains(_STRESC, 'GRADE 2'))
          then: 2
        - when: PARAMCD IN ('ERYTHDIA', 'SWELLDIA') AND ((AVAL > 100) OR str_contains(_STRESC, 'GRADE 3'))
          then: 3
        - when: PARAMCD IN ('ERYTHDIA', 'SWELLDIA') AND str_contains(_STRESC, 'GRADE 4')
          then: 4
        - when: PARAMCD = 'FEVER' AND ((AVAL > 0 AND AVAL < 38.0) OR str_contains(_STRESC, 'GRADE 0'))
          then: 0
        - when: PARAMCD = 'FEVER' AND ((AVAL >= 38.0 AND AVAL <= 38.4) OR str_contains(_STRESC, 'GRADE 1'))
          then: 1
        - when: PARAMCD = 'FEVER' AND ((AVAL > 38.4 AND AVAL <= 38.9) OR str_contains(_STRESC, 'GRADE 2'))
          then: 2
        - when: PARAMCD = 'FEVER' AND ((AVAL > 38.9 AND AVAL <= 40.0) OR str_contains(_STRESC, 'GRADE 3'))
          then: 3
        - when: PARAMCD = 'FEVER' AND ((AVAL > 40.0) OR str_contains(_STRESC, 'GRADE 4'))
          then: 4
        - when: PARAMCD IN ('PAIN', 'LYMPH', 'HEADACHE') AND (AVALC = 'NONE' OR str_contains(_STRESC, 'GRADE 0'))
          then: 0
        - when: PARAMCD IN ('PAIN', 'LYMPH', 'HEADACHE') AND (AVALC IN ('DOES NOT INTERFERE WITH ACTIVITY', 'NO INTERFERENCE WITH ACTIVITY') OR str_contains(_STRESC, 'GRADE 1'))
          then: 1
        - when: PARAMCD IN ('PAIN', 'LYMPH', 'HEADACHE') AND (str_contains(AVALC, 'REPEATED') OR str_contains(_STRESC, 'GRADE 2'))
          then: 2
        - when: PARAMCD IN ('PAIN', 'LYMPH', 'HEADACHE') AND (AVALC IN ('ANY USE OF PRESCRIPTION RELIEVER OR PREVENTS DAILY ACTIVITY', 'ANY USE OF PRESCRIPTION PAIN RELIEVER OR PREVENTS DAILY ACTIVITY') OR str_contains(_STRESC, 'GRADE 3'))
          then: 3
        - when: PARAMCD IN ('PAIN', 'LYMPH', 'HEADACHE') AND str_contains(_STRESC, 'GRADE 4')
          then: 4
        - when: PARAMCD IN ('FATIGUE', 'MYALGIA', 'ARTHRALG') AND (AVALC = 'NONE' OR str_contains(_STRESC, 'GRADE 0'))
          then: 0
        - when: PARAMCD IN ('FATIGUE', 'MYALGIA', 'ARTHRALG') AND (AVALC = 'NO INTERFERENCE WITH ACTIVITY' OR str_contains(_STRESC, 'GRADE 1'))
          then: 1
        - when: PARAMCD IN ('FATIGUE', 'MYALGIA', 'ARTHRALG') AND (AVALC = 'SOME INTERFERENCE WITH ACTIVITY' OR str_contains(_STRESC, 'GRADE 2'))
          then: 2
        - when: PARAMCD IN ('FATIGUE', 'MYALGIA', 'ARTHRALG') AND (AVALC = 'SIGNIFICANT; PREVENTS DAILY ACTIVITY' OR str_contains(_STRESC, 'GRADE 3'))
          then: 3
        - when: PARAMCD IN ('FATIGUE', 'MYALGIA', 'ARTHRALG') AND str_contains(_STRESC, 'GRADE 4')
          then: 4
        - when: PARAMCD = 'NAUSEA' AND (AVALC = 'NONE' OR str_contains(_STRESC, 'GRADE 0'))
          then: 0
        - when: PARAMCD = 'NAUSEA' AND (AVALC = 'NO INTERFERENCE WITH ACTIVITY OR 1-2 EPISODES/24 HOURS' OR str_contains(_STRESC, 'GRADE 1'))
          then: 1
        - when: PARAMCD = 'NAUSEA' AND (AVALC = 'SOME INTERFERENCE WITH ACTIVITY OR >2 EPISODES/24 HOURS' OR str_contains(_STRESC, 'GRADE 2'))
          then: 2
        - when: PARAMCD = 'NAUSEA' AND (AVALC = 'PREVENTS DAILY ACTIVITY, REQUIRES OUTPATIENT IV HYDRATION' OR str_contains(_STRESC, 'GRADE 3'))
          then: 3
        - when: PARAMCD = 'NAUSEA' AND str_contains(_STRESC, 'GRADE 4')
          then: 4
        - when: PARAMCD = 'CHILLS' AND (AVALC = 'NONE' OR str_contains(_STRESC, 'GRADE 0'))
          then: 0
        - when: PARAMCD = 'CHILLS' AND (AVALC = 'NO INTERFERENCE WITH ACTIVITY' OR str_contains(_STRESC, 'GRADE 1'))
          then: 1
        - when: PARAMCD = 'CHILLS' AND (AVALC = 'SOME INTERFERENCE WITH ACTIVITY NOT REQUIRING MEDICAL ATTENTION' OR str_contains(_STRESC, 'GRADE 2'))
          then: 2
        - when: PARAMCD = 'CHILLS' AND (AVALC = 'PREVENTS DAILY ACTIVITY AND REQUIRES MEDICAL ATTENTION' OR str_contains(_STRESC, 'GRADE 3'))
          then: 3
        - when: PARAMCD = 'CHILLS' AND str_contains(_STRESC, 'GRADE 4')
          then: 4
    ATOXGR:
      type: str
      derivation:
        case:
        - when: ATOXGRN = 0
          then: '''Grade 0'''
        - when: ATOXGRN = 1
          then: '''Grade 1'''
        - when: ATOXGRN = 2
          then: '''Grade 2'''
        - when: ATOXGRN = 3
          then: '''Grade 3'''
        - when: ATOXGRN = 4
          then: '''Grade 4'''
    PARCAT1:
      type: str
      derivation:
        case:
        - when: str_contains(_SCAT, 'ADMINIST')
          then: '''LOCAL'''
        - otherwise: _SCAT
    PARCAT1N:
      type: int
      derivation:
        mapping:
          source: PARCAT1
          dict:
            LOCAL: 1
            SYSTEMIC: 2
          unmapped: null
    ATPT:
      type: str
      derivation:
        case:
        - when: _TPT = 'DAY 1' AND _EVAL = 'INVESTIGATOR'
          then: '''DAY 1, AFTER VACCINATION (AT HOME)'''
        - otherwise: _TPT
    ATPTN:
      type: float
      derivation:
        case:
        - when: ATPT = 'DAY 1, 30 MINS AFTER VACCINATION (AT STUDY CLINIC)'
          then: 1.05
        - when: ATPT = 'DAY 1, 1 HOUR AFTER VACCINATION (AT STUDY CLINIC)'
          then: 1.1
        - when: ATPT = 'DAY 1, AFTER VACCINATION (AT HOME)'
          then: 1.2
        - otherwise: _TPTNUM
    ATPTGR1:
      type: str
      derivation:
        case:
        - when: ATPT = 'DAY 1' OR str_contains(ATPT, 'DAY 1,')
          then: '''DAY 1'''
        - otherwise: ATPT
    ATPTGR1N:
      type: int
      derivation: FLOOR(ATPTN)
    _ATPTA:
      type: int
      derivation:
        case:
        - when: ATPTGR1N IS NOT NULL
          then: 1
    ANL01FL:
      type: str
      derivation:
        case:
        - when: PARAMCD IN ('PAIN', 'ERYTHDIA', 'SWELLDIA', 'LYMPH') AND ATOXGRN > 0
          then: '''Y'''
    _FAEVAL_N:
      type: int
      derivation:
        case:
        - when: _EVAL IN ('STUDY SUBJECT', 'CAREGIVER')
          then: 1
        - when: _EVAL IS NULL
          then: 2
        - when: _EVAL = 'INVESTIGATOR'
          then: 3
    _AGFL:
      type: int
      derivation:
        case:
        - when: ATOXGRN IS NOT NULL OR (PARAMCD = 'RASHOCC' AND AVALC IS NOT NULL)
          then: 1
    _DT:
      type: date
      derivation:
        to_date:
          source: _DTC
    _DTM:
      type: datetime
      derivation:
        case:
        - when: str_contains(_DTC, 'T')
          then:
            impute:
              type: datetime
              source: _DTC
              time: first
    _TM:
      type: time
      derivation:
        to_time:
          source: _DTM
  filter: FAAE._KEY_HIT IS NOT NULL AND ((FAAE.FAOBJ <> 'Erythema' AND FAAE.FAOBJ <> 'Swelling') OR FAAE.FATESTCD <> 'OCCUR' OR FAAE.FAORRES IS NULL OR FAAE.FAORRES <> 'Y') AND (FAAE.FASTAT IS NULL OR FAAE.FASTAT <> 'NOT DONE') AND FAAE.FACAT = 'REACTOGENICITY'
