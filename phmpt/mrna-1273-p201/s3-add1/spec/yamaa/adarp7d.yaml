        - when: ATPT = 'DAY 1, 1 HOUR AFTER VACCINATION (AT STUDY CLINIC)'
          then: 1.1
        - when: ATPT = 'DAY 1, AFTER VACCINATION (AT HOME)'
          then: 1.2
        - otherwise: _TPTNUM
    ATPTGR1:
      type: str
      derivation:
        case:
        - when: ATPT = 'DAY 1' OR str_contains(ATPT, 'DAY 1,')
          then: '''DAY 1'''
        - otherwise: ATPT
    ATPTGR1N:
      type: int
      derivation: FLOOR(ATPTN)
    _ATPTA:
      type: int
      derivation:
        case:
        - when: ATPTGR1N IS NOT NULL
          then: 1
    _FAEVAL_N:
      type: int
      derivation: 2
    _DT:
      type: date
      derivation:
        to_date:
          source: _DTC
    _DTM:
      type: datetime
      derivation:
        case:
        - when: str_contains(_DTC, 'T')
          then:
            impute:
              type: datetime
              source: _DTC
              time: first
    _TM:
      type: time
      derivation:
        to_time:
          source: _DTM
    _MEDTAKP:
      type: str
      derivation: SUPPVS_P.MEDTAKP
    _MEDTAKT:
      type: str
      derivation: SUPPVS_P.MEDTAKT
    _MEDTAK:
      type: str
      derivation: SUPPVS_P.MEDTAK
    _EVAL:
      type: str
      derivation: null
    _MAAEFL:
      type: str
      derivation: null
    _VS_SUBJ:
      type: str
      derivation: VS_SUBJ.USUBJID
    PARAMCD:
      type: str
      derivation: '''MEDTAK'''
  filter: VS.VSTPTREF IS NOT NULL AND VS._VS_SUBJ IS NOT NULL AND VS._MEDTAK = 'Y'
  order_by:
  - variable: VS.ATPTN
    direction: desc
  keep: first
