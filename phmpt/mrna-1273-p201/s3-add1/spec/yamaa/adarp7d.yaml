- name: ANL02FL
  type: str
  label: Analysis Flag 02
  derivation:
    case:
    - when: ANL01FL = 'Y' AND _ANL02_GE8 = 1 AND _ANL02_LT8 IS NULL
      then: '''Y'''
  submission:
    core: Perm
    mandatory: false
    length: 1
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: ANL03FL
  type: str
  label: Analysis Flag 03
  derivation:
    case:
    - when: (_ANL03_RN1 = 1 AND PARAMCD <> 'RASHOCC' AND _AGFL = 1) OR (_ANL03_RN2 = 1 AND PARAMCD = 'RASHOCC' AND _AGFL = 1)
      then: '''Y'''
  submission:
    core: Perm
    mandatory: false
    length: 1
    origins:
    - type: Assigned
- name: ANL04FL
  type: str
  label: Analysis Flag 04
  derivation:
    case:
    - when: _ANL04_LT8 = 1 AND _ANL04_GE8 = 1
      then: '''Y'''
  submission:
    core: Perm
    mandatory: false
    length: 1
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: ANL05FL
  type: str
  label: Analysis Flag 05
  derivation:
    case:
    - when: PARCAT1 = 'LOCAL' AND _ANL05_7 = 1 AND _ANL05_8 = 1
      then: '''Y'''
  submission:
    core: Perm
    mandatory: false
    length: 1
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: ANL06FL
  type: str
  label: Analysis Flag 06
  derivation:
    case:
    - when: PARCAT1 = 'LOCAL' AND ANL05FL IS NULL
      then: '''Y'''
  submission:
    core: Perm
    mandatory: false
    length: 1
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
