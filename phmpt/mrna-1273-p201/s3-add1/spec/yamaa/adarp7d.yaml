        - when: PARAMCD = 'NAUSEA' AND (AVALC = 'PREVENTS DAILY ACTIVITY, REQUIRES OUTPATIENT IV HYDRATION' OR str_contains(_STRESC, 'GRADE 3'))
          then: 3
        - when: PARAMCD = 'NAUSEA' AND str_contains(_STRESC, 'GRADE 4')
          then: 4
        - when: PARAMCD = 'CHILLS' AND (AVALC = 'NONE' OR str_contains(_STRESC, 'GRADE 0'))
          then: 0
        - when: PARAMCD = 'CHILLS' AND (AVALC = 'NO INTERFERENCE WITH ACTIVITY' OR str_contains(_STRESC, 'GRADE 1'))
          then: 1
        - when: PARAMCD = 'CHILLS' AND (AVALC = 'SOME INTERFERENCE WITH ACTIVITY NOT REQUIRING MEDICAL ATTENTION' OR str_contains(_STRESC, 'GRADE 2'))
          then: 2
        - when: PARAMCD = 'CHILLS' AND (AVALC = 'PREVENTS DAILY ACTIVITY AND REQUIRES MEDICAL ATTENTION' OR str_contains(_STRESC, 'GRADE 3'))
          then: 3
        - when: PARAMCD = 'CHILLS' AND str_contains(_STRESC, 'GRADE 4')
          then: 4
    ATOXGR:
      type: str
      derivation:
        case:
        - when: ATOXGRN = 0
          then: '''Grade 0'''
        - when: ATOXGRN = 1
          then: '''Grade 1'''
        - when: ATOXGRN = 2
          then: '''Grade 2'''
        - when: ATOXGRN = 3
          then: '''Grade 3'''
        - when: ATOXGRN = 4
          then: '''Grade 4'''
    PARCAT1:
      type: str
      derivation:
        case:
        - when: str_contains(_SCAT, 'ADMINIST')
          then: '''LOCAL'''
        - otherwise: _SCAT
    PARCAT1N:
      type: int
      derivation:
        mapping:
          source: PARCAT1
          dict:
            LOCAL: 1
            SYSTEMIC: 2
          unmapped: null
    ATPT:
      type: str
      derivation:
        case:
        - when: _TPT = 'DAY 1' AND _EVAL = 'INVESTIGATOR'
          then: '''DAY 1, AFTER VACCINATION (AT HOME)'''
        - otherwise: _TPT
    ATPTN:
      type: float
      derivation:
        case:
        - when: ATPT = 'DAY 1, 30 MINS AFTER VACCINATION (AT STUDY CLINIC)'
          then: 1.05
        - when: ATPT = 'DAY 1, 1 HOUR AFTER VACCINATION (AT STUDY CLINIC)'
          then: 1.1
        - when: ATPT = 'DAY 1, AFTER VACCINATION (AT HOME)'
          then: 1.2
        - otherwise: _TPTNUM
    ATPTGR1:
      type: str
      derivation:
        case:
        - when: ATPT = 'DAY 1' OR str_contains(ATPT, 'DAY 1,')
          then: '''DAY 1'''
        - otherwise: ATPT
    ATPTGR1N:
      type: int
      derivation: FLOOR(ATPTN)
    _ATPTA:
      type: int
      derivation:
        case:
        - when: ATPTGR1N IS NOT NULL
          then: 1
    ANL01FL:
      type: str
      derivation:
        case:
        - when: PARAMCD IN ('PAIN', 'ERYTHDIA', 'SWELLDIA', 'LYMPH') AND ATOXGRN > 0
          then: '''Y'''
    _FAEVAL_N:
      type: int
      derivation:
        case:
        - when: _EVAL IN ('STUDY SUBJECT', 'CAREGIVER')
          then: 1
        - when: _EVAL IS NULL
          then: 2
        - when: _EVAL = 'INVESTIGATOR'
          then: 3
    _AGFL:
      type: int
      derivation:
        case:
        - when: ATOXGRN IS NOT NULL OR (PARAMCD = 'RASHOCC' AND AVALC IS NOT NULL)
          then: 1
    _DT:
      type: date
      derivation:
        to_date:
          source: _DTC
    _DTM:
      type: datetime
      derivation:
        case:
        - when: str_contains(_DTC, 'T')
          then:
            impute:
              type: datetime
              source: _DTC
              time: first
    _TM:
      type: time
      derivation:
        to_time:
          source: _DTM
