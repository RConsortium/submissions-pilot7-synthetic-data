# ADAE for Moderna mRNA-1273-P201, data cut add1 (Addendum 1, cutoff 2021-06-11).
# Parent: ../../../s3-d57/spec/yamaa/adae.yaml (which chains to ../../../spec/yamaa/base/adam-base.yaml) (section 3.1 core columns).
# Derivations implement the add1 A20ADAE program; where the SAS code and the
# define.xml method text disagree, the code is followed (see README.md).
# New in add1 vs d57: SMQ01-14 NAM/SC/FL, CQ01-03 NAM/FL, ARTERM, DARFL,
# ANL01-04FL, and the core columns PBD209FL, PND209FL, PN2209FL, ELECSBL.
# The import.smq / import.cmq / import.symp lookup tables are NOT in Module 5,
# so the SMQ/CQ/ARTERM tables used here were reconstructed from the submitted
# ADAE itself (each AEDECOD/AEPTCD maps to at most one value per column);
# they cover exactly the terms exercised by this study's AE data (see README.md).
# The HO join splits HOSPID on "/": four add1 HO rows are 'HO-001/002', so the
# d57 whole-HOSPID match would miss them. AENDY is computed by the SAS program
# but is in neither the define nor the submitted dataset, so it is not an
# output column. COMPLFL is not in the add1 output (derivation null).
# Layer over ../d57/adae.yaml: the derivations are the parent cut's, and
# this file holds only what this cut changes (written by
# scripts/specs/inherit_cut.py; its resolved specification
# equals the standalone file it replaced).
yamaa: '1.0'
type: spec
parent: ../../../s3-d57/spec/yamaa/adae.yaml
clear:
- columns.COMPLFL.submission
input:
  AE: <sdtm-dir>/ae.parquet
  SUPPAE: <sdtm-dir>/suppae.parquet
  DS: <sdtm-dir>/ds.parquet
  HO: <sdtm-dir>/ho.parquet
  EX: <sdtm-dir>/ex.parquet
  FACE: <sdtm-dir>/face.parquet
  FAAE: <sdtm-dir>/faae.parquet
  ADSL:
    path: <adam-dir>/adsl.parquet
intermediates:
- id: HO_HOSP1
  dataset: HO
  key:
    USUBJID: USUBJID
    _HOSPID1: _AESPID1
  derivations:
    _HOSPID1:
      str_extract:
        source: HOSPID
        pattern: '^HO-([^/]+)'
        group: 1
        no_match:
  filter: HO.HOTERM = 'HOSPITAL'
- id: HO_HOSP2
  dataset: HO
  key:
    USUBJID: USUBJID
    _HOSPID2: _AESPID1
  derivations:
    _HOSPID2:
      str_extract:
        source: HOSPID
        pattern: '/([^/]+)$'
        group: 1
        no_match:
  filter: HO.HOTERM = 'HOSPITAL'
- id: HO_ICU1
  dataset: HO
  key:
    USUBJID: USUBJID
    _HOSPID1: _AESPID1
  derivations:
    _HOSPID1:
      str_extract:
        source: HOSPID
        pattern: '^HO-([^/]+)'
        group: 1
        no_match:
  filter: HO.HOTERM = 'ADMITTED TO ICU'
- id: HO_ICU2
  dataset: HO
  key:
    USUBJID: USUBJID
    _HOSPID2: _AESPID1
  derivations:
    _HOSPID2:
      str_extract:
        source: HOSPID
        pattern: '/([^/]+)$'
        group: 1
        no_match:
  filter: HO.HOTERM = 'ADMITTED TO ICU'
- id: FACE2
  dataset: FACE
  key:
    USUBJID: USUBJID
    FATPTREF: _FATPTREF
    FAOBJ: ARTERM
  filter: FACE.FACAT = 'REACTOGENICITY' AND FACE.FATPTREF IS NOT NULL AND (FACE.FASTRESC IS NULL OR FACE.FASTRESC <> 'NONE') AND (FACE.FASTRESC IS NULL OR NOT str_contains(FACE.FASTRESC, 'GRADE 0')) AND (FACE.FASTAT IS NULL OR FACE.FASTAT <> 'NOT DONE') AND NOT (FACE.FAOBJ IN ('Erythema', 'Swelling') AND (FACE.FATESTCD = 'OCCUR' OR (FACE.FATESTCD = 'LDIAM' AND (FACE.FASTRESN IS NULL OR FACE.FASTRESN < 25))))
  order_by:
  - FACE.FASEQ
  keep: first
- id: FAAE3
  dataset: FAAE
  key:
    USUBJID: USUBJID
    FATPTREF: _FATPTREF
    FAOBJ: ARTERM
  filter: FAAE.FACAT = 'REACTOGENICITY' AND FAAE.FATPTREF IS NOT NULL AND (FAAE.FASTRESC IS NULL OR FAAE.FASTRESC <> 'NONE') AND (FAAE.FASTRESC IS NULL OR NOT str_contains(FAAE.FASTRESC, 'GRADE 0')) AND (FAAE.FASTAT IS NULL OR FAAE.FASTAT <> 'NOT DONE') AND NOT (FAAE.FAOBJ IN ('Erythema', 'Swelling') AND (FAAE.FATESTCD = 'OCCUR' OR (FAAE.FATESTCD = 'LDIAM' AND (FAAE.FASTRESN IS NULL OR FAAE.FASTRESN < 25))))
  order_by:
  - FAAE.FASEQ
  keep: first
