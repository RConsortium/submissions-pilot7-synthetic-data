# ADMH for Moderna mRNA-1273-P201, data cut add1 (Addendum 1).
# Parent: ../../../s3-d57/spec/yamaa/admh.yaml (which chains to ../../../spec/yamaa/base/adam-base.yaml) (section 3.1 core columns).
# Derivations implement the add1 A20ADMH program (Bates 3818695-3818697):
# MH inner-joined to ADSL on (STUDYID, USUBJID, SUBJID), plus the
# CQ01/SMQ01/02/06 derivations. The import.cmq / import.smq lookup
# tables are NOT in Module 5; they were reconstructed from the
# submitted ADMH (see README.md). Where the SAS code and the define
# method text disagree, the code is followed (see README.md).
# Layer over ../d57/admh.yaml: the derivations are the parent cut's, and
# this file holds only what this cut changes (written by
# scripts/specs/inherit_cut.py; its resolved specification
# equals the standalone file it replaced).
yamaa: '1.0'
type: spec
parent: ../../../s3-d57/spec/yamaa/admh.yaml
clear:
- columns.COMPLFL.submission
input:
  MH: <sdtm-dir>/mh.parquet
  ADSL:
    path: <adam-dir>/adsl.parquet
columns:
- name: _MHPTCD
  type: str
  derivation:
    str_decimal:
      source: MH.MHPTCD
      decimals: 0
- name: PBD209FL
  type: str
  label: Per Protocol bAb Day 209 Flag
  derivation: ADSL.PBD209FL
  submission:
    core: Perm
    mandatory: false
    length: 1
    origins:
    - type: Predecessor
      description: ADSL.PBD209FL
- name: PND209FL
  type: str
  label: Per Protocol nAb Day 209 Flag
  derivation: ADSL.PND209FL
  submission:
    core: Perm
    mandatory: false
    length: 1
    origins:
    - type: Predecessor
      description: ADSL.PND209FL
- name: PN2209FL
  type: str
  label: Per Protocol nAb 2 Day 209 Flag
  derivation: ADSL.PN2209FL
  submission:
    core: Perm
    mandatory: false
    length: 1
    origins:
    - type: Predecessor
      description: ADSL.PN2209FL
- name: COMPLFL
  derivation:
- name: ELECSBL
  type: str
  label: Baseline Elecsys SARS CoV-2 Assay
  derivation: ADSL.ELECSBL
  submission:
    core: Perm
    mandatory: false
    length: 20
    origins:
    - type: Predecessor
      description: ADSL.ELECSBL
- name: COV19FL
  submission:
    length: 1
- name: SENTLFL
  submission:
    length: 1
- name: CQ01NAM
  type: str
  label: Customized Query 01 Name
  derivation:
    mapping:
      source: _MHPTCD
      dict:
        '10001760': Autoimmune
        '10013687': Autoimmune
        '10018767': Autoimmune
        '10024429': Autoimmune
        '10029331': Autoimmune
        '10034620': Autoimmune
        '10036105': Autoimmune
        '10037912': Autoimmune
      unmapped:
  submission:
    core: Perm
    mandatory: false
    length: 10
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: CQ01FL
  type: str
  label: Customized Query 01 Flag
  derivation:
    flag: CQ01NAM IS NOT NULL
  submission:
    core: Perm
    mandatory: false
    length: 1
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: SMQ01NAM
  type: str
  label: SMQ 01 Name
  derivation:
    mapping:
      source: MH.MHDECOD
      dict:
        Oedema: Anaphylactic Reaction
        Rash: Anaphylactic Reaction
      unmapped:
  submission:
    core: Perm
    mandatory: false
    length: 21
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: SMQ01SC
  type: str
  label: SMQ 01 Scope
  derivation:
    mapping:
      source: MH.MHDECOD
      dict:
        Oedema: BROAD
        Rash: BROAD
      unmapped:
  submission:
    core: Perm
    mandatory: false
    length: 6
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: SMQ01FL
  type: str
  label: SMQ 01 Flag
  derivation:
    flag: SMQ01NAM IS NOT NULL
  submission:
    core: Perm
    mandatory: false
    length: 1
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: SMQ02NAM
  type: str
  label: SMQ 02 Name
  derivation:
    mapping:
      source: MH.MHDECOD
      dict:
        Drug hypersensitivity: Angioede
        Nipple swelling: Angioede
        Oedema: Angioede
        Oedema peripheral: Angioede
      unmapped:
  submission:
    core: Perm
    mandatory: false
    length: 8
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: SMQ02SC
  type: str
  label: SMQ 02 Scope
  derivation:
    mapping:
      source: MH.MHDECOD
      dict:
        Drug hypersensitivity: BROAD
        Nipple swelling: BROAD
        Oedema: BROAD
        Oedema peripheral: BROAD
      unmapped:
  submission:
    core: Perm
    mandatory: false
    length: 6
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: SMQ02FL
  type: str
  label: SMQ 02 Flag
  derivation:
    flag: SMQ02NAM IS NOT NULL AND SMQ02SC = 'NARROW'
  submission:
    core: Perm
    mandatory: false
    length: 1
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: SMQ06NAM
  type: str
  label: SMQ 06 Name
  derivation:
    mapping:
      source: MH.MHDECOD
      dict:
        Allergic sinusitis: Hypersensitivity
        Allergy to chemicals: Hypersensitivity
        Contrast media allergy: Hypersensitivity
        Dermatitis atopic: Hypersensitivity
        Dermatitis contact: Hypersensitivity
        Drug eruption: Hypersensitivity
        Drug hypersensitivity: Hypersensitivity
        Eczema: Hypersensitivity
        Iodine allergy: Hypersensitivity
        Rash: Hypersensitivity
        Rhinitis allergic: Hypersensitivity
        Seasonal allergy: Hypersensitivity
      unmapped:
  submission:
    core: Perm
    mandatory: false
    length: 16
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: SMQ06SC
  type: str
  label: SMQ 06 Scope
  derivation:
    mapping:
      source: MH.MHDECOD
      dict:
        Allergic sinusitis: NARROW
        Allergy to chemicals: BROAD
        Contrast media allergy: NARROW
        Dermatitis atopic: NARROW
        Dermatitis contact: NARROW
        Drug eruption: NARROW
        Drug hypersensitivity: NARROW
        Eczema: NARROW
        Iodine allergy: NARROW
        Rash: NARROW
        Rhinitis allergic: NARROW
        Seasonal allergy: BROAD
      unmapped:
  submission:
    core: Perm
    mandatory: false
    length: 6
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: SMQ06FL
  type: str
  label: SMQ 06 Flag
  derivation:
    flag: SMQ06NAM IS NOT NULL AND SMQ06SC = 'NARROW'
  submission:
    core: Perm
    mandatory: false
    length: 1
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
output:
