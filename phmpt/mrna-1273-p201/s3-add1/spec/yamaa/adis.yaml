    mandatory: false
    length: 20
    origins:
    - type: Predecessor
      description: ADSL.ELECSBL
- name: VISIT
  submission:
    length: 33
- name: ULOQ
  submission:
    mandatory: false
- name: LOD
  submission:
    mandatory: false
- name: PARAM
  submission:
    method: "Withheld from publication: the received define states this text."
- name: ISLLOQ
  submission:
    mandatory: false
- name: DTYPE
  submission:
    method: "Withheld from publication: the received define states this text."
- name: PARAMTYP
  submission:
    method: "Withheld from publication: the received define states this text."
- name: AVAL
  submission:
    method: "Withheld from publication: the received define states this text."
- name: AVALC
  type: str
  label: 'Analysis Value (C)'
  derivation:
    case:
    - when: PARAMCD = 'SARSCOV2'
      then: _ISSTRESC
  submission:
    core: Perm
    mandatory: false
    length: 10
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: _ELECSBL_U
  type: str
  derivation:
    str_case:
      source: ADSL.ELECSBL
      to: upper
- name: _ISSTRESC_U
  type: str
  derivation:
    str_case:
      source: _ISSTRESC
      to: upper
- name: ANL01FL
  derivation:
    case:
    - when: PARAMCD = 'SARSCOV2' AND (ABLFL = 'Y' OR (ADT IS NOT NULL AND ADSL.TR01SDT IS NOT NULL AND AVISITN IS NOT NULL AND _ISSTRESC_U IN ('NEGATIVE', 'POSITIVE') AND ADT > ADSL.TR01SDT))
      then: '''Y'''
    - when: AVAL IS NOT NULL AND ((_ANL01_RN = 1 AND AVISITN IS NOT NULL AND _POSTFL = 'Y' AND _AVALN = 1) OR ABLFL = 'Y')
      then: '''Y'''
  submission:
    method: "Withheld from publication: the received define states this text."
- name: ANL02FL
  derivation:
    case:
    - when: PARAMCD = 'SARSCOV2' AND (ABLFL = 'Y' OR (ADT IS NOT NULL AND ADSL.TR01SDT IS NOT NULL AND AVISITN IS NOT NULL AND _ISSTRESC_U IN ('NEGATIVE', 'POSITIVE') AND ADT > ADSL.TR01SDT))
      then: '''Y'''
    - when: AVAL IS NOT NULL AND _SET1 = 1 AND ((_ANL02_RN = 1 AND AVISITN IS NOT NULL AND _POSTFL = 'Y' AND _AVALN = 1) OR ABLFL = 'Y')
      then: '''Y'''
- name: _CRIT_OK
  derivation:
    case:
    - when: (DTYPE IS NULL OR DTYPE <> 'DERIVED') AND PARAMCD IN ('MN50', 'MNET')
      then: '''Y'''
- name: _CRIT_V65
  type: str
  derivation:
    case:
    - when: (DTYPE IS NULL OR DTYPE <> 'DERIVED') AND PARAMCD IN ('V65IGGS', 'V66IGGN')
      then: '''Y'''
- name: _CRIT_V65S
  type: str
  derivation:
    case:
    - when: (DTYPE IS NULL OR DTYPE <> 'DERIVED') AND PARAMCD = 'V65IGGS'
      then: '''Y'''
- name: _CRIT_LOW
  type: str
  derivation:
    case:
    - when: BASE IS NOT NULL AND AVAL IS NOT NULL AND ISLLOQ IS NOT NULL AND BASE < ISLLOQ
      then: '''Y'''
- name: _CRIT_HI
  type: str
  derivation:
    case:
    - when: BASE IS NOT NULL AND ISLLOQ IS NOT NULL AND BASE >= ISLLOQ
      then: '''Y'''
- name: CRIT1FL
  derivation:
    case:
    - when: _ISDTC IS NOT NULL AND ((_CRIT_OK = 'Y' AND _POSTFL = 'Y' AND R2BASE IS NOT NULL AND R2BASE >= 2) OR (_CRIT_V65 = 'Y' AND _CRIT_LOW = 'Y' AND AVAL >= 2 * ISLLOQ) OR (_CRIT_V65 = 'Y' AND _CRIT_HI = 'Y' AND _POSTFL = 'Y' AND R2BASE IS NOT NULL AND R2BASE >= 2))
      then: '''Y'''
  submission:
    method: "Withheld from publication: the received define states this text."
- name: CRIT2FL
  derivation:
    case:
    - when: _ISDTC IS NOT NULL AND ((_CRIT_OK = 'Y' AND _POSTFL = 'Y' AND R2BASE IS NOT NULL AND R2BASE >= 3) OR (_CRIT_V65 = 'Y' AND _CRIT_LOW = 'Y' AND AVAL >= 3 * ISLLOQ) OR (_CRIT_V65 = 'Y' AND _CRIT_HI = 'Y' AND _POSTFL = 'Y' AND R2BASE IS NOT NULL AND R2BASE >= 3))
      then: '''Y'''
  submission:
    method: "Withheld from publication: the received define states this text."
- name: CRIT3FL
  derivation:
    case:
    - when: _ISDTC IS NOT NULL AND ((_CRIT_OK = 'Y' AND _POSTFL = 'Y' AND R2BASE IS NOT NULL AND R2BASE >= 4) OR (_CRIT_V65 = 'Y' AND _CRIT_LOW = 'Y' AND AVAL >= 4 * ISLLOQ) OR (_CRIT_V65 = 'Y' AND _CRIT_HI = 'Y' AND _POSTFL = 'Y' AND R2BASE IS NOT NULL AND R2BASE >= 4))
      then: '''Y'''
  submission:
    method: "Withheld from publication: the received define states this text."
- name: CRIT4FL
  derivation:
    case:
    - when: _ISDTC IS NOT NULL AND (((_CRIT_OK = 'Y' OR _CRIT_V65S = 'Y') AND _CRIT_LOW = 'Y' AND AVAL >= ISLLOQ) OR ((_CRIT_OK = 'Y' OR _CRIT_V65S = 'Y') AND _CRIT_HI = 'Y' AND _POSTFL = 'Y' AND R2BASE IS NOT NULL AND R2BASE >= 4))
      then: '''Y'''
  submission:
    method: "Withheld from publication: the received define states this text."
- name: CRIT5FL
  type: str
  label: 'Criterion 5 Evaluation Result Flag'
  derivation:
    case:
    - when: _ISDTC IS NOT NULL AND ((_CRIT_V65S = 'Y' AND _CRIT_LOW = 'Y' AND AVAL >= ISLLOQ) OR (_CRIT_V65S = 'Y' AND _CRIT_HI = 'Y' AND _POSTFL = 'Y' AND R2BASE IS NOT NULL AND R2BASE >= 4.6))
      then: '''Y'''
  submission:
    core: Perm
    mandatory: false
    length: 1
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: CRIT6FL
  type: str
  label: 'Criterion 6 Evaluation Result Flag'
  derivation:
    case:
    - when: _ISDTC IS NOT NULL AND (DTYPE IS NULL OR DTYPE <> 'DERIVED') AND PARAMCD IN ('V66IGGN', 'SARSCOV2') AND BASE IS NOT NULL AND BASE <> 0 AND _POSTFL = 'Y' AND ((_ELECSBL_U = 'NEGATIVE' AND PARAMCD = 'SARSCOV2' AND _ISSTRESC_U = 'POSITIVE') OR (_ELECSBL_U = 'POSITIVE' AND PARAMCD = 'V66IGGN' AND R2BASE IS NOT NULL AND R2BASE >= 4))
      then: '''Y'''
  submission:
    core: Perm
    mandatory: false
    length: 1
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: CRIT5
  type: str
  label: 'Analysis Criterion 5'
  derivation:
    case:
    - when: CRIT5FL = 'Y'
      then: '''Seroresponse'''
  submission:
    core: Perm
    mandatory: false
    length: 100
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: CRIT6
  type: str
  label: 'Analysis Criterion 6'
  derivation:
    case:
    - when: CRIT6FL = 'Y'
      then: '''Seroconversion due to Infection'''
  submission:
    core: Perm
    mandatory: false
    length: 100
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: PPBABRFL
  derivation:
    case:
    - when: PARCAT1 = 'Serum SARS-CoV-2 Binding Antibodies' AND AVISIT = 'Day 29' AND ADSL.PPBD29FL = 'Y'
      then: '''Y'''
    - when: PARCAT1 = 'Serum SARS-CoV-2 Binding Antibodies' AND AVISIT = 'Day 57' AND ADSL.PPBD57FL = 'Y'
      then: '''Y'''
    - when: PARCAT1 = 'Serum SARS-CoV-2 Binding Antibodies' AND AVISIT = 'Day 209' AND ADSL.PBD209FL = 'Y'
