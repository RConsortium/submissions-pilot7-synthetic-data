# ADIS for Moderna mRNA-1273-P201, data cut add1 (Addendum 1, cutoff 2021-06-11).
# Parent: ../../../s3-d57/spec/yamaa/adis.yaml (which chains to ../../../spec/yamaa/base/adam-base.yaml) (section 3.1 core columns).
# Derivations implement the add1 A20ADIS program
# (program/adam/FDA-CBER-2022-1614-3818670-3818673_..._add1_A_P_a2.txt) plus
# the add1 _adis_vars_ include (Bates 3818723-3818733), which IS in Module 5;
# spec/yamaa/tools/adis_add1_proto.py replicates the SAS logic line by line
# and matches all 108 submitted columns on all 33,241 rows. Where the SAS code
# and the define.xml method text disagree, the code is followed (see README.md):
# DTYPE is never 'DERIVED' in the submitted data (define MT.ADIS.DTYPE says it
# is); PARAMTYP is 'DERIVED' for LV65IGGS/LV66IGGN rows too (the define's
# PARAMTYP method names only 'L10'/'LV58'); ISDTC is an ISO string in the data
# (define: datetime), typed str.
# PP COLUMNS: no PP_LIST/PP_LIST2 exists for add1, so the PP columns are derived
# from the ADSL per-visit flags + AVISIT where that mapping is exact on d57 AND
# add1 (flags Day 29/57/209 via the visit flags, Baseline via the subject flag,
# Day 15/blank blank; reasons Day 29/57/209 via the visit *ER columns used
# directly, Day 15/blank via the dosing rule only). Day 43 rows (all 5 PP
# columns) and Baseline rows (the two reason columns) are carried VERIFIED-ONLY
# from the submitted add1 ADIS (input ADIS_VO, keyed on [STUDYID, USUBJID, ISSEQ,
# PARAMCD]): the PP_LIST visit values at Baseline/Day 43 are not exactly
# derivable from the ADSL flags. The verify report shows those cells matching
# trivially because they come from the expected file; that is the documented
# limitation, not a derivation (owner decision 2026-11-22, docs/decisions.md).
# DELETE STEP: the A20ADIS delete (AVAL missing AND AVALC blank) removes 8 rows
# (ISSTRESC='NR' MN50/MNET rows); it is expressed as a base_rows filter exclusion.
# OL-D8 AVISIT blanking is NOT expressed: 0 VISIT='OL-D8' rows on add1.
# Layer over ../d57/adis.yaml: the derivations are the parent cut's, and
# this file holds only what this cut changes (written by
# scripts/specs/inherit_cut.py; its resolved specification
# equals the standalone file it replaced).
yamaa: '1.0'
type: spec
parent: ../../../s3-d57/spec/yamaa/adis.yaml
clear:
- columns.COMPLFL.submission
input:
  IS: <sdtm-dir>/is.parquet
  SUPPIS: <sdtm-dir>/suppis.parquet
  EX: <sdtm-dir>/ex.parquet
  ADSL:
    path: <adam-dir>/adsl.parquet
  ADIS_VO:
    path: <adam-dir>/adis.parquet
    key:
    - STUDYID
    - USUBJID
    - ISSEQ
    - PARAMCD
rows:
- id: base_rows
  derivations:
    _ISMETHOD: IS.ISMETHOD
    _AVAL_SRC:
      case:
      - when: _ISTESTCD IN ('V65IGGS', 'V66IGGN') AND _ISSTRESC = 'BQL'
        then: _ISLLOQ * 0.5
      - when: str_contains(_ISSTRESC, '<') OR (_LOD IS NOT NULL AND _ISSTRESN IS NOT NULL AND _ISSTRESN < _LOD) OR (_ISLLOQ IS NOT NULL AND _ISSTRESN IS NOT NULL AND _ISSTRESN < _ISLLOQ)
        then: _ISLLOQ * 0.5
      - when: str_contains(_ISSTRESC, '>') OR (_ULOQ IS NOT NULL AND _ISSTRESN IS NOT NULL AND _ISSTRESN > _ULOQ)
        then: _ULOQ
      - otherwise: _ISSTRESN
    DTYPE:
      case:
      - when: _ISTESTCD IN ('V65IGGS', 'V66IGGN') AND _ISSTRESC = 'BQL'
        then: '''HALFLLOQ'''
      - when: str_contains(_ISSTRESC, '<') OR (_LOD IS NOT NULL AND _ISSTRESN IS NOT NULL AND _ISSTRESN < _LOD) OR (_ISLLOQ IS NOT NULL AND _ISSTRESN IS NOT NULL AND _ISSTRESN < _ISLLOQ)
        then: '''HALFLLOQ'''
      - when: str_contains(_ISSTRESC, '>') OR (_ULOQ IS NOT NULL AND _ISSTRESN IS NOT NULL AND _ISSTRESN > _ULOQ)
        then: '''ULOQ'''
    PARAM:
      case:
      - when: PARAMCD = 'SARSCOV2'
        then: '''Elecsys Anti-SARS-CoV-2'''
      - when: _ISCAT = 'Serum SARS-CoV-2 Neutralizing Antibodies' AND _ISNAM IN ('PPD VACCINE', 'VRC') AND _ISMETHOD IS NOT NULL AND _ISMETHOD NOT IN ('')
        then:
          str_template: '{_ISTEST} by {_ISMETHOD}'
      - when: _ISCAT = 'Serum SARS-CoV-2 Neutralizing Antibodies'
        then: _ISTEST
      - when: _ISCAT = 'Serum SARS-CoV-2 Binding Antibodies' AND _ISSTRESU IS NOT NULL AND _ISSTRESU NOT IN ('') AND _ISNAM IN ('PPD VACCINE', 'VRC') AND _ISMETHOD IS NOT NULL AND _ISMETHOD NOT IN ('')
        then:
          str_template: '{_ISTEST} ({_ISSTRESU}) by {_ISMETHOD}'
      - when: _ISCAT = 'Serum SARS-CoV-2 Binding Antibodies' AND _ISSTRESU IS NOT NULL AND _ISSTRESU NOT IN ('')
        then:
          str_template: '{_ISTEST} ({_ISSTRESU})'
      - when: _ISNAM IN ('PPD VACCINE', 'VRC') AND _ISMETHOD IS NOT NULL AND _ISMETHOD NOT IN ('')
        then:
          str_template: '{_ISTEST} by {_ISMETHOD}'
      - otherwise: _ISTEST
  filter: (_ISSTAT IS NULL OR _ISSTAT IN ('')) AND _ISTESTCD IS NOT NULL AND _ADSL IS NOT NULL AND NOT (_AVAL_SRC IS NULL AND (PARAMCD <> 'SARSCOV2' OR _ISSTRESC IS NULL OR _ISSTRESC IN ('')))
- id: derived_rows
  derivations:
    _ISMETHOD: IS.ISMETHOD
    _AVAL_SRC:
      case:
      - when: _ISTESTCD IN ('V65IGGS', 'V66IGGN') AND _ISSTRESC = 'BQL'
        then: _ISLLOQ * 0.5
      - when: str_contains(_ISSTRESC, '<') OR (_LOD IS NOT NULL AND _ISSTRESN IS NOT NULL AND _ISSTRESN < _LOD) OR (_ISLLOQ IS NOT NULL AND _ISSTRESN IS NOT NULL AND _ISSTRESN < _ISLLOQ)
        then: _ISLLOQ * 0.5
      - when: str_contains(_ISSTRESC, '>') OR (_ULOQ IS NOT NULL AND _ISSTRESN IS NOT NULL AND _ISSTRESN > _ULOQ)
        then: _ULOQ
      - otherwise: _ISSTRESN
    DTYPE:
      case:
      - when: _ISTESTCD IN ('V65IGGS', 'V66IGGN') AND _ISSTRESC = 'BQL'
        then: '''HALFLLOQ'''
      - when: str_contains(_ISSTRESC, '<') OR (_LOD IS NOT NULL AND _ISSTRESN IS NOT NULL AND _ISSTRESN < _LOD) OR (_ISLLOQ IS NOT NULL AND _ISSTRESN IS NOT NULL AND _ISSTRESN < _ISLLOQ)
        then: '''HALFLLOQ'''
      - when: str_contains(_ISSTRESC, '>') OR (_ULOQ IS NOT NULL AND _ISSTRESN IS NOT NULL AND _ISSTRESN > _ULOQ)
        then: '''ULOQ'''
    PARAMCD:
      mapping:
        dict:
          V65IGGS: LV65IGGS
          V66IGGN: LV66IGGN
    PARAM:
      mapping:
        dict:
          LV65IGGS: 'LOG10(VAC65 Spike IgG Antibody)'
          LV66IGGN: 'LOG10(VAC66 Nucleocapsid IgG Antibody)'
  filter: (_ISSTAT IS NULL OR _ISSTAT IN ('')) AND _ISTESTCD IS NOT NULL AND _ADSL IS NOT NULL AND PARAMCD IS NOT NULL AND _AVAL_SRC IS NOT NULL AND (_ISTESTCD <> 'V58IGGEN' OR _AVAL_SRC <> 0) AND (_ISTESTCD <> 'V66IGGN' OR _AVAL_SRC <> 0)
windows:
  ANL01_W:
    order_by:
    - variable: _POSTFL
      direction: desc
    - variable: _AVALN
      direction: desc
    - _UNS
    - _AWTDIFF
    - variable: _ADTMY
      direction: desc
    - variable: ISSEQ
      direction: desc
  ANL02_W:
    order_by:
    - variable: _POSTFL
      direction: desc
    - variable: _AVALN
      direction: desc
    - _UNS
    - _AWTDIFF
    - variable: _ADTMY
      direction: desc
    - variable: ISSEQ
      direction: desc
output:
  path: <adam-dir>/adis-yamaa.parquet
  columns:
  - STUDYID
  - USUBJID
  - SUBJID
  - SITEID
  - COUNTRY
  - AGE
  - AGEU
  - AGEGR1
  - AGEGR1N
  - AGEGR2
  - AGEGR2N
  - SEX
  - RACE
  - RACESPY
  - ETHNIC
  - RANDFL
  - SAFFL
  - FASBABFL
  - FASNABFL
  - PPBABFL
  - PPNABFL
  - PPBD29FL
  - PPBD57FL
  - PBD209FL
  - PPND29FL
  - PPND57FL
  - PND209FL
  - SAR1FL
  - SAR2FL
  - SARAFL
  - FASNA2FL
  - PPNAB2FL
  - PN2D29FL
  - PN2D57FL
  - PN2209FL
  - DVBABFL
  - DVNABFL
  - DOSE1FL
  - DOSE2FL
  - DOSEROFL
  - COV19BL
  - ELECSBL
  - COV19FL
  - SENTLFL
  - D29W7DFL
  - TRT01P
  - TRT01PN
  - TRT01A
  - TRT01AN
  - TR01SDT
  - TR01SDTM
  - TR01EDT
  - TR01EDTM
  - TRTSDTM
  - TRTEDTM
  - DOSE2DT
  - DOS2DTM
  - TRTA
  - TRTAN
  - ISSEQ
  - ISDTC
  - ADT
