    - when: PARCAT1 = 'Serum SARS-CoV-2 Neutralizing Antibodies' AND AVISIT = 'Day 57' AND ADSL.PN2D57FL = 'Y'
      then: '''Y'''
    - when: PARCAT1 = 'Serum SARS-CoV-2 Neutralizing Antibodies' AND AVISIT = 'Day 209' AND ADSL.PN2209FL = 'Y'
