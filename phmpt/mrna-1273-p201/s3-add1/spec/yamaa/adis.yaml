  - ISLLOQ
  - ULOQ
  - LOD
  - ISNAM
  - ISSPEC
  - DTYPE
  - PARAMTYP
columns:
- name: _ISMETHOD
  type: str
- name: COMPLFL
  derivation:
- name: PBD209FL
  type: str
  label: 'Per Protocol bAb Day 209 Flag'
  derivation: ADSL.PBD209FL
  submission:
    core: Req
    mandatory: true
    length: 1
    origins:
    - type: Predecessor
      description: ADSL.PBD209FL
- name: PND209FL
  type: str
  label: 'Per Protocol nAb Day 209 Flag'
  derivation: ADSL.PND209FL
  submission:
    core: Req
