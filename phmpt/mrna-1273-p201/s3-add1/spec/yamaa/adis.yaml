    - when: PARCAT1 = 'Serum SARS-CoV-2 Binding Antibodies' AND (AVISIT = 'Day 15' OR AVISIT IS NULL OR AVISIT IN ('')) AND str_contains(_PPBABERS_U, 'DOSING ER')
