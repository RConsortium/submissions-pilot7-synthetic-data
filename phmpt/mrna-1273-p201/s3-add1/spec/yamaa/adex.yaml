# ADEX for Moderna mRNA-1273-P201, data cut add1 (Addendum 1).
# Parent: ../../../s3-d57/spec/yamaa/adex.yaml (which chains to ../../../spec/yamaa/base/adam-base.yaml) (section 3.1 core columns).
# Derivations implement the add1 A20ADEX program (Bates 3818667-3818669):
# EX rows plus the ECOCCUR='N' EC rows, each inner-joined to ADSL on
# USUBJID, with ASEQ assigned per subject by the SAS sort (visit,
# exseq, ecseq). The add1 program is the same shape as the d57 program.
# Where the SAS code and the define.xml method text disagree, the
# code is followed (see README.md).
# Layer over ../d57/adex.yaml: the derivations are the parent cut's, and
# this file holds only what this cut changes (written by
# scripts/specs/inherit_cut.py; its resolved specification
# equals the standalone file it replaced).
yamaa: '1.0'
type: spec
parent: ../../../s3-d57/spec/yamaa/adex.yaml
clear:
- columns.COMPLFL.submission
input:
  EX: <sdtm-dir>/ex.parquet
  EC: <sdtm-dir>/ec.parquet
  ADSL:
    path: <adam-dir>/adsl.parquet
columns:
- name: COMPLFL
  derivation:
- name: PBD209FL
  type: str
  label: Per Protocol bAb Day 209 Flag
  derivation: ADSL.PBD209FL
  submission:
    core: Perm
    mandatory: false
    length: 1
    origins:
    - type: Predecessor
      description: ADSL.PBD209FL
- name: PND209FL
  type: str
  label: Per Protocol nAb Day 209 Flag
  derivation: ADSL.PND209FL
  submission:
    core: Perm
    mandatory: false
    length: 1
    origins:
    - type: Predecessor
      description: ADSL.PND209FL
- name: PN2209FL
  type: str
  label: Per Protocol nAb 2 Day 209 Flag
  derivation: ADSL.PN2209FL
  submission:
    core: Perm
    mandatory: false
    length: 1
    origins:
    - type: Predecessor
      description: ADSL.PN2209FL
- name: ELECSBL
  type: str
  label: Baseline Elecsys SARS CoV-2 Assay
  derivation: ADSL.ELECSBL
  submission:
    core: Perm
    mandatory: false
    length: 20
    origins:
    - type: Predecessor
      description: ADSL.ELECSBL
- name: COV19FL
  submission:
    length: 1
- name: SENTLFL
  submission:
    length: 1
- name: ASTDT
  submission:
    method: "Withheld from publication: the received define states this text."
- name: AENDT
  submission:
    method: "Withheld from publication: the received define states this text."
- name: SRCDOM
  submission:
    method: "Withheld from publication: the received define states this text."
- name: SRCSEQ
  submission:
    method: "Withheld from publication: the received define states this text."
output:
  path: <adam-dir>/adex-yamaa.parquet
  columns:
  - STUDYID
  - USUBJID
  - SUBJID
  - SITEID
  - COUNTRY
  - AGE
  - AGEU
  - AGEGR1
  - AGEGR1N
  - AGEGR2
  - AGEGR2N
  - SEX
  - RACE
  - RACESPY
  - ETHNIC
  - RANDFL
  - SAFFL
  - FASBABFL
  - FASNABFL
  - PPBABFL
  - PPNABFL
  - PPBD29FL
  - PPBD57FL
  - PBD209FL
  - PPND29FL
  - PPND57FL
  - PND209FL
  - SAR1FL
  - SAR2FL
  - SARAFL
  - FASNA2FL
  - PPNAB2FL
  - PN2D29FL
  - PN2D57FL
  - PN2209FL
  - DVBABFL
  - DVNABFL
  - DOSE1FL
  - DOSE2FL
  - DOSEROFL
  - COV19BL
  - ELECSBL
  - COV19FL
  - SENTLFL
  - D29W7DFL
  - TRT01P
  - TRT01PN
  - TRT01A
  - TRT01AN
  - TR01SDT
  - TR01SDTM
  - TR01EDT
  - TR01EDTM
  - TRTSDTM
  - TRTEDTM
  - DOSE2DT
  - DOS2DTM
  - ASEQ
  - EXTRT
  - EXDOSE
  - EXDOSU
  - EXDOSTXT
  - EXDOSFRM
  - EXDOSFRQ
