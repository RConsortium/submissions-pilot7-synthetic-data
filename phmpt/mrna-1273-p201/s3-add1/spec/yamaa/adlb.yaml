# ADLB for Moderna mRNA-1273-P201, data cut add1 (Addendum 1).
# Parent: ../../../s3-d57/spec/yamaa/adlb.yaml (which chains to ../../../spec/yamaa/base/adam-base.yaml) (section 3.1 core columns).
# Derivations implement the add1 A20ADLB program (prototype
# spec/yamaa/tools/adlb_add1_proto.py matches all 112 submitted columns on
# all 37,261 rows). The add1 program is the same shape as d57 (identical
# derivations, same keep list); add1 differences are data only. Where the
# SAS code and the define.xml method text disagree, the code is followed
# (see README.md): AWRANGE/AVISITN cover only Baseline/Day 29/Day 57
# (define lists Day 1/8/15/36/43 too); PARAM HCG matches
# lbmethod=:'ELE'/'CHEM' (define method text is vaguer).
# Inputs: LB + SV + EX (SDTM) + ADSL (core columns). SUPPLB is NOT an input:
# %revsupp adds only unused QNAMs. The SUBJID join is load-bearing: 979
# filtered LB rows have a USUBJID in ADSL but a mismatched SUBJID
# (re-screened subjects) and must drop. COMPLFL is not in the add1 output
# (declared derivation null); the 4 Day 209 core columns come from the
# add1 ADSL.
# Layer over ../d57/adlb.yaml: the derivations are the parent cut's, and
# this file holds only what this cut changes (written by
# scripts/specs/inherit_cut.py; its resolved specification
# equals the standalone file it replaced).
yamaa: '1.0'
type: spec
parent: ../../../s3-d57/spec/yamaa/adlb.yaml
clear:
- columns.COMPLFL.submission
input:
  LB: <sdtm-dir>/lb.parquet
  SV: <sdtm-dir>/sv.parquet
  EX: <sdtm-dir>/ex.parquet
  ADSL:
    path: <adam-dir>/adsl.parquet
columns:
- name: COMPLFL
  derivation:
- name: PBD209FL
  type: str
  label: Per Protocol bAb Day 209 Flag
  derivation: ADSL.PBD209FL
  submission:
    core: Perm
    mandatory: false
    length: 1
    origins:
    - type: Predecessor
      description: ADSL.PBD209FL
- name: PND209FL
  type: str
  label: Per Protocol nAb Day 209 Flag
  derivation: ADSL.PND209FL
  submission:
    core: Perm
    mandatory: false
    length: 1
    origins:
    - type: Predecessor
      description: ADSL.PND209FL
- name: PN2209FL
  type: str
  label: Per Protocol nAb 2 Day 209 Flag
  derivation: ADSL.PN2209FL
  submission:
    core: Perm
    mandatory: false
    length: 1
    origins:
    - type: Predecessor
      description: ADSL.PN2209FL
- name: ELECSBL
  type: str
  label: Baseline Elecsys SARS CoV-2 Assay
  derivation: ADSL.ELECSBL
  submission:
    core: Perm
    mandatory: false
    length: 20
    origins:
    - type: Predecessor
      description: ADSL.ELECSBL
- name: COV19FL
  submission:
    length: 1
- name: SENTLFL
  submission:
    length: 1
- name: VISIT
  submission:
    length: 33
output:
  path: <adam-dir>/adlb-add1-yamaa.parquet
  columns:
  - STUDYID
  - USUBJID
  - SUBJID
  - SITEID
  - COUNTRY
