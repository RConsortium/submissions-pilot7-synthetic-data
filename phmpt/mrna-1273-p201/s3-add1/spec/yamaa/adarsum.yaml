# ADARSUM (reactogenicity summary) for Moderna mRNA-1273-P201, add1 cut.
#
# One record per subject per analysis parameter per vaccination (34 PARAMCDs).
# Derived from ADAR (grouped by subject/vaccination) with the beyond-7-day
# legs counted from FAAE and VS at column level. See the study's spec/review/README.md
# (ADARSUM add1 section) for the design and the SAS-vs-define findings.
#
# First generated by gen_adarsum_add1_spec.py (original work tree, retired); this file is the
# source.
# Layer over ../d57/adarsum.yaml: the derivations are the parent cut's, and
# this file holds only what this cut changes (written by
# scripts/specs/inherit_cut.py; its resolved specification
# equals the standalone file it replaced).
yamaa: '1.0'
type: spec
parent: ../../../s3-d57/spec/yamaa/adarsum.yaml
input:
  ADAR:
    path: <adam-dir>/adar.parquet
  ADSL:
    path: <adam-dir>/adsl.parquet
  FAAE: <sdtm-dir>/faae.parquet
  VS: <sdtm-dir>/vs.parquet
  EX: <sdtm-dir>/ex.parquet
rows:
- id: lymphdur
  derivations:
    PARAM: '''Number of Days for Underarm Gland Swelling or Tenderness'''
- id: wlymph
  derivations:
    PARAM: '''Worst Analysis Toxicity Grade for Underarm Gland Swelling or Tenderness between Day 1 and Day 7'''
output:
  path: <adam-dir>/adarsum-yamaa.parquet
  columns:
  - STUDYID
  - USUBJID
  - SUBJID
  - SITEID
  - COUNTRY
  - AGE
  - AGEU
  - AGEGR1
  - AGEGR1N
  - AGEGR2
  - AGEGR2N
  - SEX
  - RACE
  - RACESPY
  - ETHNIC
  - RANDFL
  - SAFFL
  - FASBABFL
  - FASNABFL
  - PPBABFL
  - PPNABFL
  - PPBD29FL
  - PPBD57FL
  - PBD209FL
  - PPND29FL
  - PPND57FL
  - PND209FL
  - SAR1FL
  - SAR2FL
  - SARAFL
  - FASNA2FL
  - PPNAB2FL
  - PN2D29FL
  - PN2D57FL
  - PN2209FL
  - DVBABFL
  - DVNABFL
  - DOSE1FL
  - DOSE2FL
  - DOSEROFL
  - COV19BL
  - ELECSBL
  - COV19FL
  - SENTLFL
  - D29W7DFL
  - TRT01P
  - TRT01PN
  - TRT01A
  - TRT01AN
  - TR01SDT
  - TR01SDTM
  - TR01EDT
  - TR01EDTM
  - TRTSDTM
  - TRTEDTM
  - DOSE2DT
  - DOS2DTM
  - TRTA
  - TRTAN
  - ATPTREF
  - PARCAT1
  - PARCAT1N
  - PARAMCD
  - PARAM
  - AVAL
  - AVALC
  - ATOXGR
  - ATOXGRN
  - SRCDOM
  - SRCSEQ
  - SRCVAR
columns:
- name: PBD209FL
  type: str
  label: Per Protocol bAb Day 209 Flag
  derivation: ADSL.PBD209FL
  submission:
    core: Perm
    mandatory: false
    length: 1
    origins:
    - type: Predecessor
      description: ADSL.PBD209FL
- name: PND209FL
  type: str
  label: Per Protocol nAb Day 209 Flag
  derivation: ADSL.PND209FL
  submission:
    core: Perm
    mandatory: false
    length: 1
    origins:
    - type: Predecessor
      description: ADSL.PND209FL
- name: PN2209FL
  type: str
