        expr: "MAX(FA3._STRESN)"
    _AVALC_JOIN:
      aggregate:
        filter: "(FA3._OBJ = 'Erythema' AND ((FA3._TESTCD = 'LDIAM' AND FA3._STRESN >= 25) OR (FA3._TESTCD = 'SEV' AND FA3.ATOXGR IN ('Grade 1', 'Grade 2', 'Grade 3')))) OR (FA3._OBJ = 'Swelling' AND ((FA3._TESTCD = 'LDIAM' AND FA3._STRESN >= 25) OR (FA3._TESTCD = 'SEV' AND FA3.ATOXGR IN ('Grade 1', 'Grade 2', 'Grade 3')))) OR (FA3._OBJ = 'Pain' AND FA3._STRESC NOT IN ('NONE', '')) OR (FA3._OBJ = 'Underarm Gland Swelling or Tenderness' AND FA3._STRESC NOT IN ('NONE', '')) OR (FA3._OBJ = 'Headache' AND FA3._STRESC NOT IN ('NONE', '')) OR (FA3._OBJ = 'Fatigue' AND FA3._STRESC NOT IN ('NONE', '')) OR (FA3._OBJ = 'Myalgia' AND FA3._STRESC NOT IN ('NONE', '')) OR (FA3._OBJ = 'Arthralgia' AND FA3._STRESC NOT IN ('NONE', '')) OR (FA3._OBJ = 'Nausea/Vomiting' AND FA3._STRESC NOT IN ('NONE', '')) OR (FA3._OBJ = 'Chills' AND FA3._STRESC NOT IN ('NONE', '')) OR (FA3._OBJ = 'Rash' AND FA3._STRESC NOT IN ('N', ''))"
