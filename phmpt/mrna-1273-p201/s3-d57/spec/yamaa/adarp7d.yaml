# ADARP7D for Moderna mRNA-1273-P201, data cut d57 (cutoff 2020-11-05).
# Parent: ../../../spec/yamaa/base/adam-base.yaml (section 3.1 core columns).
# Derivations implement the d57 A20ADARP7D program; where the SAS code and the
# define.xml method text disagree, the code is followed (see README.md).
# The program reads FAAE (not FACE) and VS. Rows are collapsed to one per
# (subject, parameter, evaluator, timepoint reference) by two grouped row
# templates over the FA3/VS3 driving intermediates; the SAS first/last and
# AVALC selections are reproduced with grouped-input MIN/MAX/STR_JOIN
# aggregates (see README.md). TRTA derives via %trta with ATPTREF as the
# dose reference (ADAR precedent); the define's MT.ADXX.TRTA describes the
# ADTM-window variant. AVAL is all-missing on d57 (no FASTRESN/VSSTRESN on
# any AVALC-selected row); the spec still derives it as MAX of the numeric
# result, which is null on d57.
yamaa: '1.0'
type: spec
model: ADaM
parent: ../../../spec/yamaa/base/adam-base.yaml
domain: ADARP7D
keys:
- STUDYID
- USUBJID
- ASEQ
input:
  FAAE: <sdtm-dir>/faae.parquet
  VS: <sdtm-dir>/vs.parquet
  SUPPFAAE: <sdtm-dir>/suppfaae.parquet
  EX: <sdtm-dir>/ex.parquet
  ADSL:
    path: <adam-dir>/adsl.parquet
    key:
    - STUDYID
    - USUBJID
submission:
  label: Solicited AR post D7 Analysis Dataset
  class: BASIC DATA STRUCTURE
  structure: One or more records per subject per analysis parameter per analysis timepoint
  repeating: true
rows:
- id: fa_groups
  dataset: FA3
  group_by:
  - FA3.STUDYID
  - FA3.USUBJID
  - FA3.FAOBJ
  - FA3.FAEVAL
  - FA3.FATPTREF
  filter: _ADSL IS NOT NULL AND _N_SEL > 0
  derivations:
    STUDYID: FA3.STUDYID
    USUBJID: FA3.USUBJID
    _ADSL: ADSL.USUBJID
    PARAMCD:
      mapping:
        source: FA3.FAOBJ
        dict:
          Rash: RASHOCC
          Underarm Gland Swelling or Tenderness: LYMPH
          Erythema: ERYTHDIA
          Swelling: SWELLDIA
          Pain: PAIN
          Headache: HEADACHE
          Fatigue: FATIGUE
          Myalgia: MYALGIA
          Arthralgia: ARTHRALG
          Nausea/Vomiting: NAUSEA
          Chills: CHILLS
          Fever: FEVER
        unmapped: null
    PARAM:
      case:
      - when: FA3.FAOBJ = 'Rash'
        then: '''Rash Occurrence'''
      - when: FA3.FAOBJ = 'Underarm Gland Swelling or Tenderness'
        then: '''Lymphadenopathy'''
      - when: FA3.FAOBJ IN ('Erythema', 'Swelling')
        then:
          str_template: '{FA3.FAOBJ} Longest Diameter (mm)'
      - when: FA3.FAOBJ = 'Fever'
        then: '''Fever (C)'''
      - otherwise: FA3.FAOBJ
    PARCAT1:
      aggregate: "MAX(FA3.PARCAT1)"
    PARCAT1N:
      mapping:
        source: PARCAT1
        dict:
          LOCAL: 1
          SYSTEMIC: 2
        unmapped: null
    ATPTREF:
      case:
      - when: str_contains(FA3.FATPTREF, 'DOSE 1')
        then: '''Vaccination 1'''
      - when: str_contains(FA3.FATPTREF, 'DOSE 2')
        then: '''Vaccination 2'''
    FAEVAL: FA3.FAEVAL
    ASTDT:
      aggregate:
        filter: "(FA3._OBJ = 'Erythema' AND ((FA3._TESTCD = 'LDIAM' AND FA3._STRESN >= 25) OR (FA3._TESTCD = 'SEV' AND FA3.ATOXGR IN ('Grade 1', 'Grade 2', 'Grade 3')))) OR (FA3._OBJ = 'Swelling' AND ((FA3._TESTCD = 'LDIAM' AND FA3._STRESN >= 25) OR (FA3._TESTCD = 'SEV' AND FA3.ATOXGR IN ('Grade 1', 'Grade 2', 'Grade 3')))) OR (FA3._OBJ = 'Pain' AND FA3._STRESC NOT IN ('NONE', '')) OR (FA3._OBJ = 'Underarm Gland Swelling or Tenderness' AND FA3._STRESC NOT IN ('NONE', '')) OR (FA3._OBJ = 'Headache' AND FA3._STRESC NOT IN ('NONE', '')) OR (FA3._OBJ = 'Fatigue' AND FA3._STRESC NOT IN ('NONE', '')) OR (FA3._OBJ = 'Myalgia' AND FA3._STRESC NOT IN ('NONE', '')) OR (FA3._OBJ = 'Arthralgia' AND FA3._STRESC NOT IN ('NONE', '')) OR (FA3._OBJ = 'Nausea/Vomiting' AND FA3._STRESC NOT IN ('NONE', '')) OR (FA3._OBJ = 'Chills' AND FA3._STRESC NOT IN ('NONE', '')) OR (FA3._OBJ = 'Rash' AND FA3._STRESC = 'Y')"
        expr: "MIN(FA3._DT)"
    AENDT:
      aggregate:
        filter: "(FA3._OBJ = 'Erythema' AND ((FA3._TESTCD = 'LDIAM' AND FA3._STRESN >= 25) OR (FA3._TESTCD = 'SEV' AND FA3.ATOXGR IN ('Grade 1', 'Grade 2', 'Grade 3')))) OR (FA3._OBJ = 'Swelling' AND ((FA3._TESTCD = 'LDIAM' AND FA3._STRESN >= 25) OR (FA3._TESTCD = 'SEV' AND FA3.ATOXGR IN ('Grade 1', 'Grade 2', 'Grade 3')))) OR (FA3._OBJ = 'Pain' AND FA3._STRESC NOT IN ('NONE', '')) OR (FA3._OBJ = 'Underarm Gland Swelling or Tenderness' AND FA3._STRESC NOT IN ('NONE', '')) OR (FA3._OBJ = 'Headache' AND FA3._STRESC NOT IN ('NONE', '')) OR (FA3._OBJ = 'Fatigue' AND FA3._STRESC NOT IN ('NONE', '')) OR (FA3._OBJ = 'Myalgia' AND FA3._STRESC NOT IN ('NONE', '')) OR (FA3._OBJ = 'Arthralgia' AND FA3._STRESC NOT IN ('NONE', '')) OR (FA3._OBJ = 'Nausea/Vomiting' AND FA3._STRESC NOT IN ('NONE', '')) OR (FA3._OBJ = 'Chills' AND FA3._STRESC NOT IN ('NONE', '')) OR (FA3._OBJ = 'Rash' AND FA3._STRESC = 'Y')"
        expr: "MAX(FA3._DT)"
    _FIRST_DTC_JOIN:
      aggregate:
        filter: "(FA3._OBJ = 'Erythema' AND ((FA3._TESTCD = 'LDIAM' AND FA3._STRESN >= 25) OR (FA3._TESTCD = 'SEV' AND FA3.ATOXGR IN ('Grade 1', 'Grade 2', 'Grade 3')))) OR (FA3._OBJ = 'Swelling' AND ((FA3._TESTCD = 'LDIAM' AND FA3._STRESN >= 25) OR (FA3._TESTCD = 'SEV' AND FA3.ATOXGR IN ('Grade 1', 'Grade 2', 'Grade 3')))) OR (FA3._OBJ = 'Pain' AND FA3._STRESC NOT IN ('NONE', '')) OR (FA3._OBJ = 'Underarm Gland Swelling or Tenderness' AND FA3._STRESC NOT IN ('NONE', '')) OR (FA3._OBJ = 'Headache' AND FA3._STRESC NOT IN ('NONE', '')) OR (FA3._OBJ = 'Fatigue' AND FA3._STRESC NOT IN ('NONE', '')) OR (FA3._OBJ = 'Myalgia' AND FA3._STRESC NOT IN ('NONE', '')) OR (FA3._OBJ = 'Arthralgia' AND FA3._STRESC NOT IN ('NONE', '')) OR (FA3._OBJ = 'Nausea/Vomiting' AND FA3._STRESC NOT IN ('NONE', '')) OR (FA3._OBJ = 'Chills' AND FA3._STRESC NOT IN ('NONE', '')) OR (FA3._OBJ = 'Rash' AND FA3._STRESC = 'Y')"
        expr: "STR_JOIN(FA3._DTC)"
        order_by:
        - FA3._DT
        - FA3._TM
        separator: "\x1f"
    _FIRST_TPT_JOIN:
      aggregate:
        filter: "(FA3._OBJ = 'Erythema' AND ((FA3._TESTCD = 'LDIAM' AND FA3._STRESN >= 25) OR (FA3._TESTCD = 'SEV' AND FA3.ATOXGR IN ('Grade 1', 'Grade 2', 'Grade 3')))) OR (FA3._OBJ = 'Swelling' AND ((FA3._TESTCD = 'LDIAM' AND FA3._STRESN >= 25) OR (FA3._TESTCD = 'SEV' AND FA3.ATOXGR IN ('Grade 1', 'Grade 2', 'Grade 3')))) OR (FA3._OBJ = 'Pain' AND FA3._STRESC NOT IN ('NONE', '')) OR (FA3._OBJ = 'Underarm Gland Swelling or Tenderness' AND FA3._STRESC NOT IN ('NONE', '')) OR (FA3._OBJ = 'Headache' AND FA3._STRESC NOT IN ('NONE', '')) OR (FA3._OBJ = 'Fatigue' AND FA3._STRESC NOT IN ('NONE', '')) OR (FA3._OBJ = 'Myalgia' AND FA3._STRESC NOT IN ('NONE', '')) OR (FA3._OBJ = 'Arthralgia' AND FA3._STRESC NOT IN ('NONE', '')) OR (FA3._OBJ = 'Nausea/Vomiting' AND FA3._STRESC NOT IN ('NONE', '')) OR (FA3._OBJ = 'Chills' AND FA3._STRESC NOT IN ('NONE', '')) OR (FA3._OBJ = 'Rash' AND FA3._STRESC = 'Y')"
        expr: "STR_JOIN(FA3._TPT)"
        order_by:
        - FA3._DT
        - FA3._TM
        separator: "\x1f"
    _LAST_DTC_JOIN:
      aggregate:
        filter: "(FA3._OBJ = 'Erythema' AND ((FA3._TESTCD = 'LDIAM' AND FA3._STRESN >= 25) OR (FA3._TESTCD = 'SEV' AND FA3.ATOXGR IN ('Grade 1', 'Grade 2', 'Grade 3')))) OR (FA3._OBJ = 'Swelling' AND ((FA3._TESTCD = 'LDIAM' AND FA3._STRESN >= 25) OR (FA3._TESTCD = 'SEV' AND FA3.ATOXGR IN ('Grade 1', 'Grade 2', 'Grade 3')))) OR (FA3._OBJ = 'Pain' AND FA3._STRESC NOT IN ('NONE', '')) OR (FA3._OBJ = 'Underarm Gland Swelling or Tenderness' AND FA3._STRESC NOT IN ('NONE', '')) OR (FA3._OBJ = 'Headache' AND FA3._STRESC NOT IN ('NONE', '')) OR (FA3._OBJ = 'Fatigue' AND FA3._STRESC NOT IN ('NONE', '')) OR (FA3._OBJ = 'Myalgia' AND FA3._STRESC NOT IN ('NONE', '')) OR (FA3._OBJ = 'Arthralgia' AND FA3._STRESC NOT IN ('NONE', '')) OR (FA3._OBJ = 'Nausea/Vomiting' AND FA3._STRESC NOT IN ('NONE', '')) OR (FA3._OBJ = 'Chills' AND FA3._STRESC NOT IN ('NONE', '')) OR (FA3._OBJ = 'Rash' AND FA3._STRESC = 'Y')"
        expr: "STR_JOIN(FA3._DTC)"
        order_by:
        - variable: FA3._DT
          direction: desc
        - variable: FA3._TM
          direction: desc
          nulls: last
        separator: "\x1f"
    _LAST_TPT_JOIN:
      aggregate:
        filter: "(FA3._OBJ = 'Erythema' AND ((FA3._TESTCD = 'LDIAM' AND FA3._STRESN >= 25) OR (FA3._TESTCD = 'SEV' AND FA3.ATOXGR IN ('Grade 1', 'Grade 2', 'Grade 3')))) OR (FA3._OBJ = 'Swelling' AND ((FA3._TESTCD = 'LDIAM' AND FA3._STRESN >= 25) OR (FA3._TESTCD = 'SEV' AND FA3.ATOXGR IN ('Grade 1', 'Grade 2', 'Grade 3')))) OR (FA3._OBJ = 'Pain' AND FA3._STRESC NOT IN ('NONE', '')) OR (FA3._OBJ = 'Underarm Gland Swelling or Tenderness' AND FA3._STRESC NOT IN ('NONE', '')) OR (FA3._OBJ = 'Headache' AND FA3._STRESC NOT IN ('NONE', '')) OR (FA3._OBJ = 'Fatigue' AND FA3._STRESC NOT IN ('NONE', '')) OR (FA3._OBJ = 'Myalgia' AND FA3._STRESC NOT IN ('NONE', '')) OR (FA3._OBJ = 'Arthralgia' AND FA3._STRESC NOT IN ('NONE', '')) OR (FA3._OBJ = 'Nausea/Vomiting' AND FA3._STRESC NOT IN ('NONE', '')) OR (FA3._OBJ = 'Chills' AND FA3._STRESC NOT IN ('NONE', '')) OR (FA3._OBJ = 'Rash' AND FA3._STRESC = 'Y')"
        expr: "STR_JOIN(FA3._TPT)"
        order_by:
