    AVAL:
      aggregate:
        filter: "(VS3._TESTCD = 'TEMP' AND (VS3._STRESN >= 38 OR VS3.ATOXGR IN ('Grade 1', 'Grade 2', 'Grade 3', 'Grade 4')))"
        expr: "MAX(VS3._STRESN)"
    _AVALC_JOIN:
      aggregate:
        filter: "(VS3._TESTCD = 'TEMP' AND (VS3._STRESN >= 38 OR VS3.ATOXGR IN ('Grade 1', 'Grade 2', 'Grade 3', 'Grade 4')))"
        expr: "STR_JOIN(VS3._STRESC)"
        order_by:
        - variable: VS3._NVAL
          direction: desc
          nulls: last
        - VS3._AVAL_CHK
        - VS3._CVARN
        - VS3._STRESC
        separator: "\x1f"
    AVALC:
      str_extract:
        source: _AVALC_JOIN
        pattern: '^([^\x1f]*)'
        group: 1
    _N_SEL:
      aggregate:
        filter: "(VS3._TESTCD = 'TEMP' AND (VS3._STRESN >= 38 OR VS3.ATOXGR IN ('Grade 1', 'Grade 2', 'Grade 3', 'Grade 4')))"
        expr: "COUNT(VS3.*)"
    MAAEFL:
      aggregate: "MAX(VS3._MAAEFL)"
intermediates:
- id: SUPPFAAE_P
  dataset: SUPPFAAE
  key:
    STUDYID: STUDYID
    USUBJID: USUBJID
    IDVARVAL:
      str_decimal:
        source: _FASEQ
        decimals: 0
  filter: SUPPFAAE.QNAM = 'MAAEFL' AND SUPPFAAE.IDVAR = 'FASEQ'
  pivot:
    name: QNAM
    value: QVAL
    fields:
    - MAAEFL
- id: EX_DOSE1
  dataset: EX
  key:
  - STUDYID
  - USUBJID
  filter: EX.EXSTDTC IS NOT NULL AND EX.VISITDY = 1
  order_by:
  - EX.EXSTDTC
  keep: first
- id: EX_DOSE2
  dataset: EX
  key:
  - STUDYID
  - USUBJID
  filter: EX.EXSTDTC IS NOT NULL AND EX.VISITDY = 29
  order_by:
  - EX.EXSTDTC
  keep: first
- id: FA3
  dataset: FAAE
  derivations:
    _FASEQ:
      type: float
      derivation: FAAE.FASEQ
    _MAAEFL:
      type: str
      derivation: SUPPFAAE_P.MAAEFL
    _OBJ:
      type: str
      derivation: FAAE.FAOBJ
    _TESTCD:
      type: str
      derivation: FAAE.FATESTCD
    _TEST:
      type: str
      derivation: FAAE.FATEST
    _ORRES:
      type: str
      derivation: FAAE.FAORRES
    _ORRESU:
      type: str
      derivation: FAAE.FAORRESU
    _STRESC:
      type: str
      derivation: FAAE.FASTRESC
    _STRESN:
      type: float
      derivation: FAAE.FASTRESN
    _STRESU:
      type: str
      derivation: FAAE.FASTRESU
    _STAT:
      type: str
      derivation: FAAE.FASTAT
    _CAT:
      type: str
      derivation: FAAE.FACAT
    _SCAT:
      type: str
      derivation: FAAE.FASCAT
    _EVAL:
      type: str
      derivation: FAAE.FAEVAL
    _TPT:
      type: str
      derivation: FAAE.FATPT
    _TPTREF:
      type: str
      derivation: FAAE.FATPTREF
    _DTC:
      type: str
      derivation: FAAE.FADTC
    _TEST_P:
      type: str
      derivation:
        str_case:
          source: _TEST
          to: proper
    PARAM:
      type: str
      derivation:
        case:
        - when: _OBJ = 'Rash' AND _TESTCD <> 'SEV'
          then: '''Rash Occurrence'''
        - when: _OBJ = 'Underarm Gland Swelling or Tenderness' AND _TESTCD = 'SEV'
          then: '''Lymphadenopathy'''
        - when: _OBJ = 'Nausea/Vomiting' AND _TESTCD = 'SEV'
          then: '''Nausea/Vomiting'''
        - when: _OBJ IN ('Erythema', 'Swelling') AND _TESTCD = 'OCCUR'
          then:
            str_template: '{_OBJ} Longest Diameter (mm)'
        - when: _OBJ IN ('Erythema', 'Swelling') AND _TESTCD = 'SEV'
          then:
            str_template: '{_OBJ} Longest Diameter (mm)'
        - when: _OBJ IN ('Erythema', 'Swelling') AND _TESTCD = 'LDIAM'
          then:
            str_template: '{_OBJ} {_TEST_P} ({_ORRESU})'
        - when: _OBJ = 'Fever'
          then: '''Fever (C)'''
        - otherwise: _OBJ
    PARAMCD:
      type: str
      derivation:
        mapping:
          source: PARAM
          dict:
            Rash Occurrence: RASHOCC
            Lymphadenopathy: LYMPH
            Pain: PAIN
            Erythema Longest Diameter (mm): ERYTHDIA
            Swelling Longest Diameter (mm): SWELLDIA
            Headache: HEADACHE
            Fatigue: FATIGUE
            Myalgia: MYALGIA
            Arthralgia: ARTHRALG
            Nausea/Vomiting: NAUSEA
            Chills: CHILLS
            Fever (C): FEVER
          unmapped: null
    PARCAT1:
      type: str
      derivation:
        case:
        - when: _SCAT = 'ADMINISTRATION SITE'
          then: '''LOCAL'''
        - otherwise: _SCAT
    _ATOXGR_BLK:
      type: int
      derivation:
        case:
        - when: PARAMCD IN ('ERYTHDIA', 'SWELLDIA', 'FEVER', 'PAIN', 'LYMPH', 'HEADACHE', 'FATIGUE', 'MYALGIA', 'ARTHRALG', 'NAUSEA', 'CHILLS', 'RASH')
          then: 1
        - otherwise: 0
    ATOXGR:
      type: str
      derivation:
        case:
        - when: _ATOXGR_BLK = 1 AND str_contains(_STRESC, 'GRADE 4')
          then: '''Grade 4'''
        - when: _ATOXGR_BLK = 1 AND str_contains(_STRESC, 'GRADE 3')
          then: '''Grade 3'''
        - when: _ATOXGR_BLK = 1 AND str_contains(_STRESC, 'GRADE 2')
          then: '''Grade 2'''
        - when: _ATOXGR_BLK = 1 AND str_contains(_STRESC, 'GRADE 1')
          then: '''Grade 1'''
        - when: _ATOXGR_BLK = 1 AND str_contains(_STRESC, 'GRADE 0')
          then: '''Grade 0'''
        - when: PARAMCD IN ('ERYTHDIA', 'SWELLDIA') AND _STRESN < 25
          then: '''Grade 0'''
        - when: PARAMCD IN ('ERYTHDIA', 'SWELLDIA') AND _STRESN >= 25 AND _STRESN <= 50
          then: '''Grade 1'''
        - when: PARAMCD IN ('ERYTHDIA', 'SWELLDIA') AND _STRESN >= 51 AND _STRESN <= 100
          then: '''Grade 2'''
        - when: PARAMCD IN ('ERYTHDIA', 'SWELLDIA') AND _STRESN > 100
          then: '''Grade 3'''
        - when: PARAMCD = 'FEVER' AND _STRESN < 38.0
          then: '''Grade 0'''
        - when: PARAMCD = 'FEVER' AND _STRESN >= 38.0 AND _STRESN < 38.4
          then: '''Grade 1'''
        - when: PARAMCD = 'FEVER' AND _STRESN >= 38.4 AND _STRESN <= 38.9
          then: '''Grade 2'''
        - when: PARAMCD = 'FEVER' AND _STRESN > 38.9 AND _STRESN <= 40.0
          then: '''Grade 3'''
        - when: PARAMCD = 'FEVER' AND _STRESN > 40
          then: '''Grade 4'''
        - when: PARAMCD = 'PAIN' AND _STRESC = 'NONE'
          then: '''Grade 0'''
        - when: PARAMCD = 'PAIN' AND _STRESC = 'DOES NOT INTERFERE WITH ACTIVITY'
          then: '''Grade 1'''
        - when: PARAMCD = 'PAIN' AND _STRESC = 'REPEATED USE OF OVER-THE-COUNTER PAIN RELIEVER > 24 HOURS OR INTERFERES WITH ACTIVITY'
          then: '''Grade 2'''
        - when: PARAMCD = 'PAIN' AND _STRESC = 'ANY USE OF PRESCRIPTION PAIN RELIEVER OR PREVENTS DAILY ACTIVITY'
          then: '''Grade 3'''
        - when: PARAMCD = 'LYMPH' AND _STRESC = 'NONE'
          then: '''Grade 0'''
        - when: PARAMCD = 'LYMPH' AND _STRESC = 'DOES NOT INTERFERE WITH ACTIVITY'
          then: '''Grade 1'''
        - when: PARAMCD = 'LYMPH' AND str_contains(_STRESC, 'REPEATED USE OF OVER-THE-COUNTER PAIN RELIEVER > 24 HOURS OR INTERFER')
          then: '''Grade 2'''
        - when: PARAMCD = 'LYMPH' AND _STRESC = 'ANY USE OF PRESCRIPTION PAIN RELIEVER OR PREVENTS DAILY ACTIVITY'
          then: '''Grade 3'''
        - when: PARAMCD = 'HEADACHE' AND _STRESC = 'NONE'
          then: '''Grade 0'''
        - when: PARAMCD = 'HEADACHE' AND _STRESC = 'NO INTERFERENCE WITH ACTIVITY'
          then: '''Grade 1'''
        - when: PARAMCD = 'HEADACHE' AND str_contains(_STRESC, 'REPEATED USE OF OVER-THE-COUNTER PAIN RELIEVER > 24 HOURS OR SOME INTERFER')
          then: '''Grade 2'''
        - when: PARAMCD = 'HEADACHE' AND _STRESC = 'ANY USE OF PRESCRIPTION PAIN RELIEVER OR PREVENTS DAILY ACTIVITY'
          then: '''Grade 3'''
        - when: PARAMCD IN ('FATIGUE', 'MYALGIA', 'ARTHRALG') AND _STRESC = 'NONE'
          then: '''Grade 0'''
        - when: PARAMCD IN ('FATIGUE', 'MYALGIA', 'ARTHRALG') AND _STRESC = 'NO INTERFERENCE WITH ACTIVITY'
          then: '''Grade 1'''
        - when: PARAMCD IN ('FATIGUE', 'MYALGIA', 'ARTHRALG') AND _STRESC = 'SOME INTERFERENCE WITH ACTIVITY'
          then: '''Grade 2'''
        - when: PARAMCD IN ('FATIGUE', 'MYALGIA', 'ARTHRALG') AND _STRESC = 'SIGNIFICANT; PREVENTS DAILY ACTIVITY'
          then: '''Grade 3'''
        - when: PARAMCD = 'NAUSEA' AND _STRESC = 'NONE'
          then: '''Grade 0'''
        - when: PARAMCD = 'NAUSEA' AND _STRESC = 'NO INTERFERENCE WITH ACTIVITY OR 1-2 EPISODES/24 HOURS'
          then: '''Grade 1'''
        - when: PARAMCD = 'NAUSEA' AND _STRESC = 'SOME INTERFERENCE WITH ACTIVITY OR >2 EPISODES/24 HOURS'
          then: '''Grade 2'''
        - when: PARAMCD = 'NAUSEA' AND _STRESC = 'PREVENTS DAILY ACTIVITY, REQUIRES OUTPATIENT IV HYDRATION'
          then: '''Grade 3'''
        - when: PARAMCD = 'CHILLS' AND _STRESC = 'NONE'
          then: '''Grade 0'''
        - when: PARAMCD = 'CHILLS' AND _STRESC = 'NO INTERFERENCE WITH ACTIVITY'
          then: '''Grade 1'''
        - when: PARAMCD = 'CHILLS' AND _STRESC = 'SOME INTERFERENCE WITH ACTIVITY NOT REQUIRING MEDICAL ATTENTION'
          then: '''Grade 2'''
        - when: PARAMCD = 'CHILLS' AND _STRESC = 'PREVENTS DAILY ACTIVITY AND REQUIRES MEDICAL ATTENTION'
          then: '''Grade 3'''
    ATOXGRN:
      type: int
      derivation:
        mapping:
          source: ATOXGR
          dict:
            Grade 0: 0
            Grade 1: 1
            Grade 2: 2
            Grade 3: 3
            Grade 4: 4
          unmapped: null
    _SCORE:
      type: int
      derivation:
        case:
        - when: PARAMCD IN ('ERYTHDIA', 'SWELLDIA', 'FEVER') AND ATOXGR IS NOT NULL
          then: ATOXGRN
        - when: PARAMCD = 'PAIN' AND (_STRESC = 'DOES NOT INTERFERE WITH ACTIVITY' OR ATOXGR = 'Grade 1')
          then: 1
        - when: PARAMCD = 'PAIN' AND (_STRESC = 'REPEATED USE OF OVER-THE-COUNTER PAIN RELIEVER > 24 HOURS OR INTERFERES WITH ACTIVITY' OR ATOXGR = 'Grade 2')
          then: 2
        - when: PARAMCD = 'PAIN' AND (_STRESC = 'ANY USE OF PRESCRIPTION PAIN RELIEVER OR PREVENTS DAILY ACTIVITY' OR ATOXGR = 'Grade 3')
          then: 3
        - when: PARAMCD = 'LYMPH' AND (_STRESC = 'DOES NOT INTERFERE WITH ACTIVITY' OR ATOXGR = 'Grade 1')
          then: 1
        - when: PARAMCD = 'LYMPH' AND (_STRESC = 'REPEATED USE OF OVER-THE-COUNTER PAIN RELIEVER > 24 HOURS OR INTERFERES WITH SOME ACTIVITY' OR ATOXGR = 'Grade 2')
          then: 2
        - when: PARAMCD = 'LYMPH' AND (_STRESC = 'ANY USE OF PRESCRIPTION PAIN RELIEVER OR PREVENTS DAILY ACTIVITY' OR ATOXGR = '3')
          then: 3
        - when: PARAMCD = 'HEADACHE' AND (_STRESC = 'NO INTERFERENCE WITH ACTIVITY' OR ATOXGR = 'Grade 1')
          then: 1
        - when: PARAMCD = 'HEADACHE' AND (_STRESC = 'REPEATED USE OF OVER-THE-COUNTER PAIN RELIEVER > 24 HOURS OR SOME INTERFERERENCE WITH ACTIVITY' OR ATOXGR = 'Grade 2')
          then: 2
        - when: PARAMCD = 'HEADACHE' AND (_STRESC = 'ANY USE OF PRESCRIPTION PAIN RELIEVER OR PREVENTS DAILY ACTIVITY' OR ATOXGR = 'Grade 3')
          then: 3
        - when: PARAMCD IN ('FATIGUE', 'MYALGIA', 'ARTHRALG') AND (_STRESC = 'NO INTERFERENCE WITH ACTIVITY' OR ATOXGR = 'Grade 1')
          then: 1
        - when: PARAMCD IN ('FATIGUE', 'MYALGIA', 'ARTHRALG') AND (_STRESC = 'SOME INTERFERENCE WITH ACTIVITY' OR ATOXGR = 'Grade 2')
          then: 2
        - when: PARAMCD IN ('FATIGUE', 'MYALGIA', 'ARTHRALG') AND (_STRESC = 'SIGNIFICANT; PREVENTS DAILY ACTIVITY' OR ATOXGR = 'Grade 3')
          then: 3
        - when: PARAMCD = 'NAUSEA' AND (_STRESC = 'NO INTERFERENCE WITH ACTIVITY OR 1-2 EPISODES/24 HOURS' OR ATOXGR = 'Grade 1')
          then: 1
        - when: PARAMCD = 'NAUSEA' AND (_STRESC = 'SOME INTERFERENCE WITH ACTIVITY OR >2 EPISODES/24 HOURS' OR ATOXGR = 'Grade 2')
          then: 2
        - when: PARAMCD = 'NAUSEA' AND (_STRESC = 'PREVENTS DAILY ACTIVITY, REQUIRES OUTPATIENT IV HYDRATION' OR ATOXGR = 'Grade 3')
          then: 3
        - when: PARAMCD = 'CHILLS' AND (_STRESC = 'NO INTERFERENCE WITH ACTIVITY' OR ATOXGR = 'Grade 1')
          then: 1
        - when: PARAMCD = 'CHILLS' AND (_STRESC = 'SOME INTERFERENCE WITH ACTIVITY NOT REQUIRING MEDICAL ATTENTION' OR ATOXGR = 'Grade 2')
          then: 2
        - when: PARAMCD = 'CHILLS' AND (_STRESC = 'PREVENTS DAILY ACTIVITY ADN REQUIRES MEDICAL ATTENTION' OR ATOXGR = 'Grade 3')
          then: 3
    _NVAL:
      type: float
      derivation:
        case:
        - when: PARAMCD IN ('ERYTHDIA', 'SWELLDIA', 'RASHOCC')
          then: _STRESN
        - otherwise: _SCORE
    _AVAL_CHK:
      type: int
      derivation:
        case:
        - when: _STRESN IS NOT NULL
          then: 0
        - otherwise: 1
    _CVARN:
      type: int
      derivation:
        case:
        - when: PARAMCD IN ('ERYTHDIA', 'SWELLDIA', 'FEVER') AND _TEST = 'Longest Diameter'
          then: 1
        - otherwise: 2
    _DT:
      type: date
      derivation:
        to_date:
          source: _DTC
    _DTM:
      type: datetime
      derivation:
        case:
        - when: str_contains(_DTC, 'T')
          then:
            impute:
              type: datetime
              source: _DTC
              time: first
    _TM:
      type: time
      derivation:
        to_time:
          source: _DTM
  filter: "(FAAE.FASTAT IS NULL OR FAAE.FASTAT <> 'NOT DONE') AND ((FAAE.FAOBJ <> 'Erythema' AND FAAE.FAOBJ <> 'Swelling') OR FAAE.FATESTCD <> 'OCCUR' OR FAAE.FAORRES IS NULL OR FAAE.FAORRES <> 'Y') AND FAAE.FACAT = 'REACTOGENICITY' AND FAAE.PARAMCD IS NOT NULL"
