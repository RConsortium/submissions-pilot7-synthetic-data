# ADCM for Moderna mRNA-1273-P201, data cut d57 (cutoff 2020-11-05).
# Parent: ../../../spec/yamaa/base/adam-base.yaml (section 3.1 core columns).
# Derivations implement the d57 A20ADCM program; where the SAS code and
# the define.xml method text disagree, the define is followed (see
# README.md): ONTRTFL/FUPFL use the define's +28 days (code: +27);
# AENDT has no CUTOFFDT cap (code caps at 2020-11-05); CMMOI1FL/CMMOI2FL
# use the define's drug list narrowed to the three analgesic components
# (the code's cmplx flag and pain_drugcode file do not exist in the
# filed data). CMINDC length 108 and CMROUTE length 17 correct stale
# define lengths (83 and 13) to the observed maxima.
yamaa: '1.0'
type: spec
model: ADaM
parent: ../../../spec/yamaa/base/adam-base.yaml
domain: ADCM
keys:
- STUDYID
- USUBJID
- CMSEQ
input:
  CM: <sdtm-dir>/cm.parquet
  SUPPCM: <sdtm-dir>/suppcm.parquet
  ADSL:
    path: <adam-dir>/adsl.parquet
    key:
    - STUDYID
    - USUBJID
submission:
  label: Concomitant Medication Analysis Dataset
  class: OCCURRENCE DATA STRUCTURE
  structure: One record per subject per medication
  repeating: true
rows:
- id: medications
  dataset: CM
  filter: _ADSL IS NOT NULL
intermediates:
- id: SUPP_P
  dataset: SUPPCM
  key:
    STUDYID: STUDYID
    USUBJID: USUBJID
    IDVARVAL:
      str_decimal:
        source: CMSEQ
        decimals: 0
  filter: SUPPCM.QNAM IN ('CMUOTHSP', 'CMFOTHSP', 'CMROTHSP', 'CMSOL', 'ATCLEV1T', 'ATCLEV3T', 'ATCLEV4T') AND SUPPCM.IDVAR = 'CMSEQ'
  pivot:
    name: QNAM
    value: QVAL
    fields:
    - CMUOTHSP
    - CMFOTHSP
    - CMROTHSP
    - CMSOL
    - ATCLEV1T
    - ATCLEV3T
    - ATCLEV4T
columns:
- name: _ADSL
  type: str
  derivation: ADSL.USUBJID
- name: ARM
  derivation: null
- name: ACTARM
  derivation: null
- name: _CMST_PREC
  type: str
  derivation:
    precision:
      type: date
      source: CM.CMSTDTC
      invalid: null
- name: _CMEN_PREC
  type: str
  derivation:
    precision:
      type: date
      source: CM.CMENDTC
      invalid: null
- name: _AENDT_IMP
  type: date
  derivation:
    impute:
      type: date
      source: CM.CMENDTC
      month: 12
      day: last
      invalid: null
- name: _DTHDT
  type: date
  derivation:
    impute:
      type: date
      source: ADSL.DTHDT
      invalid: null
- name: _AENDT_CAP
  type: date
  derivation:
    least:
      sources: [ADSL.EOSDT, _DTHDT]
- name: AENDT
  type: date
  label: Analysis End Date
  derivation:
    impute:
      type: date
      source: CM.CMENDTC
      month: 12
      day: last
      not_after: _AENDT_CAP
      invalid: null
  submission:
    core: Perm
    mandatory: false
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: AENDTF
  type: str
  label: Analysis End Date Imputation Flag
  derivation:
    imputation_flag:
      source: AENDT
      part: date
  submission:
    core: Perm
    mandatory: false
    length: 1
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: _END_AFTER
  type: str
  derivation:
    flag: >
      _CMEN_PREC IS NULL OR
      ((_CMEN_PREC = 'month' OR _CMEN_PREC = 'year') AND _AENDT_IMP IS NOT NULL AND _AENDT_IMP >= ADSL.TR01SDT) OR
      (_CMEN_PREC = 'day' AND _AENDT_IMP IS NOT NULL AND _AENDT_IMP > ADSL.TR01SDT)
- name: ASTDTF
  type: str
  label: Analysis Start Date Imputation Flag
  derivation:
    case:
    - when: _CMST_PREC = 'month'
      then: '''D'''
    - when: _CMST_PREC = 'year'
      then: '''M'''
  submission:
    core: Perm
    mandatory: false
    length: 1
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: _ASTDT_IMP
  type: date
  derivation:
    case:
    - when: _CMST_PREC = 'month' AND _END_AFTER = 'Y'
      then:
        impute:
          type: date
          source: CM.CMSTDTC
          day: first
          not_before: ADSL.TR01SDT
          invalid: null
    - when: _CMST_PREC = 'month'
      then:
        impute:
          type: date
          source: CM.CMSTDTC
          day: first
          invalid: null
    - when: _CMST_PREC = 'year' AND _END_AFTER = 'Y'
      then:
        impute:
          type: date
          source: CM.CMSTDTC
          month: 1
          day: 1
          not_before: ADSL.TR01SDT
          invalid: null
    - when: _CMST_PREC = 'year'
      then:
        impute:
          type: date
          source: CM.CMSTDTC
          month: 1
          day: 1
          invalid: null
    - otherwise:
        to_date:
          source: CM.CMSTDTC
- name: _ASTDT_CAP
  type: date
  derivation:
    case:
    - when: _ASTDT_IMP IS NOT NULL AND _AENDT_IMP IS NOT NULL AND _ASTDT_IMP > _AENDT_IMP
      then: _AENDT_IMP
    - otherwise: _ASTDT_IMP
- name: ASTDT
  type: date
  label: Analysis Start Date
  derivation:
    case:
    - when: _ASTDT_CAP IS NOT NULL AND AENDT IS NOT NULL AND _ASTDT_CAP > AENDT AND ASTDTF IS NOT NULL
      then: AENDT
    - otherwise: _ASTDT_CAP
  submission:
    core: Req
    mandatory: true
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: _TR01EDT28
  type: date
  derivation:
    shift:
      type: date
      source: ADSL.TR01EDT
      days: 28
