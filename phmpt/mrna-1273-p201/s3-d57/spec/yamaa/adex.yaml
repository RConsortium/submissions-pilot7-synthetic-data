# ADEX for Moderna mRNA-1273-P201, data cut d57 (cutoff 2020-11-05).
# Parent: ../../../spec/yamaa/base/adam-base.yaml (section 3.1 core columns).
# Derivations implement the d57 A20ADEX program: EX rows plus the
# ECOCCUR='N' EC rows, each inner-joined to ADSL on USUBJID, with
# ASEQ assigned per subject by the SAS sort (visit, exseq, ecseq).
# Where the SAS code and the define.xml method text disagree, the
# code is followed (see README.md).
yamaa: '1.0'
type: spec
model: ADaM
parent: ../../../spec/yamaa/base/adam-base.yaml
domain: ADEX
keys:
- STUDYID
- USUBJID
- ASEQ
input:
  EX: <sdtm-dir>/ex.parquet
  EC: <sdtm-dir>/ec.parquet
  ADSL:
    path: <adam-dir>/adsl.parquet
    key:
    - STUDYID
    - USUBJID
submission:
  label: Exposure Analysis Dataset
  class: OCCURRENCE DATA STRUCTURE
  structure: One record per subject per administration
  repeating: true
rows:
- id: ex_rows
  dataset: EX
  derivations:
    STUDYID: EX.STUDYID
    USUBJID: EX.USUBJID
    _SRC: '''EX'''
    _EXSEQ: EX.EXSEQ
    _ECSEQ: null
    _TRT: EX.EXTRT
    _DOSE: EX.EXDOSE
    _DOSU: EX.EXDOSU
    _DOSTXT: EX.EXDOSTXT
    _DOSFRM: EX.EXDOSFRM
    _DOSFRQ: EX.EXDOSFRQ
    _ROUTE: EX.EXROUTE
    _LOC: EX.EXLOC
    _LAT: EX.EXLAT
    _STDTC: EX.EXSTDTC
    _ENDTC: EX.EXENDTC
    _STDY: EX.EXSTDY
    _VISIT: EX.VISIT
    _VISITNUM: EX.VISITNUM
    _NDOSERS: null
    _SRCSEQ: EX.EXSEQ
  filter: _ADSL IS NOT NULL
- id: ec_rows
  dataset: EC
  derivations:
    STUDYID: EC.STUDYID
    USUBJID: EC.USUBJID
    _SRC: '''EC'''
    _EXSEQ: null
    _ECSEQ: EC.ECSEQ
    _TRT: null
    _DOSE: null
    _DOSU: null
    _DOSTXT: null
    _DOSFRM: null
    _DOSFRQ: null
    _ROUTE: null
    _LOC: null
    _LAT: null
    _STDTC: null
    _ENDTC: null
    _STDY: null
    _VISIT: EC.VISIT
    _VISITNUM: EC.VISITNUM
    _NDOSERS: EC.ECREASOC
    _SRCSEQ: EC.ECSEQ
  filter: EC.ECOCCUR = 'N' AND _ADSL IS NOT NULL
windows:
  ASEQ_W:
    group_by:
    - USUBJID
    order_by:
    - VISIT
    - _EXSEQ
    - _ECSEQ
columns:
- name: _ADSL
  type: str
  derivation: ADSL.USUBJID
- name: ARM
  derivation: null
- name: ACTARM
  derivation: null
- name: STUDYID
  submission:
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: USUBJID
  submission:
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: _SRC
  type: str
- name: _EXSEQ
  type: float
- name: _ECSEQ
  type: float
- name: _TRT
  type: str
- name: _DOSE
  type: float
- name: _DOSU
