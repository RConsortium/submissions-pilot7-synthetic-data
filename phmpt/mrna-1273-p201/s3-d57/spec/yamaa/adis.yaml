# ADIS for Moderna mRNA-1273-P201, data cut d57 (cutoff 2020-11-05).
# Parent: ../../../spec/yamaa/base/adam-base.yaml (section 3.1 core columns).
# Derivations implement the d57 A20ADIS program plus the _adis_vars_.sas
# include (not in Module 5; behaviour recovered from the data by
# spec/yamaa/tools/adis_proto.py, which matches all 100 submitted
# columns on all 18,776 rows). Where the SAS code and the define.xml
# method text disagree, the code is followed (see README.md): DTYPE is
# never 'DERIVED' in the submitted data (define MT.ADIS.DTYPE says it is);
# ISDTC is an ISO string in the data (define: datetime), typed str.
yamaa: '1.0'
type: spec
model: ADaM
parent: ../../../spec/yamaa/base/adam-base.yaml
domain: ADIS
keys:
- STUDYID
- USUBJID
- ISSEQ
- PARAMCD
input:
  IS: <sdtm-dir>/is.parquet
  SUPPIS: <sdtm-dir>/suppis.parquet
  EX: <sdtm-dir>/ex.parquet
  PP_LIST: <sdtm-dir>/pp_list.parquet
  PP_LIST2: <sdtm-dir>/pp_list2.parquet
  ADSL:
    path: <adam-dir>/adsl.parquet
    key:
    - STUDYID
    - USUBJID
submission:
  label: Immunogenicity Analysis Dataset
  class: BASIC DATA STRUCTURE
  structure: One or more records per subject per analysis parameter per analysis timepoint
  repeating: true
rows:
- id: base_rows
  dataset: IS
  derivations:
    STUDYID: IS.STUDYID
    USUBJID: IS.USUBJID
    _ISSEQ: IS.ISSEQ
    _DERIVED: 0
    _ISSTAT: IS.ISSTAT
    _ISTESTCD: IS.ISTESTCD
    _ISTEST: IS.ISTEST
    _ISCAT: IS.ISCAT
    _ISSTRESC: IS.ISSTRESC
    _ISSTRESN: IS.ISSTRESN
    _ISSTRESU: IS.ISSTRESU
    _ISLLOQ: IS.ISLLOQ
    _VISIT: IS.VISIT
    _VISITNUM: IS.VISITNUM
    _ISNAM: IS.ISNAM
    _ISSPEC: IS.ISSPEC
    _ISDTC: IS.ISDTC
    _LOD: SUPP_P.LOD
    _LLOQ: SUPP_P.LLOQ
    _ULOQ: SUPP_P.ULOQ
    _AVAL_SRC:
      case:
      - when: str_contains(_ISSTRESC, '<') OR (_LOD IS NOT NULL AND _ISSTRESN IS NOT NULL AND _ISSTRESN < _LOD) OR (_ISLLOQ IS NOT NULL AND _ISSTRESN IS NOT NULL AND _ISSTRESN < _ISLLOQ)
        then: _ISLLOQ * 0.5
      - when: str_contains(_ISSTRESC, '>') OR (_ULOQ IS NOT NULL AND _ISSTRESN IS NOT NULL AND _ISSTRESN > _ULOQ)
        then: _ULOQ
      - otherwise: _ISSTRESN
    DTYPE:
      case:
      - when: str_contains(_ISSTRESC, '<') OR (_LOD IS NOT NULL AND _ISSTRESN IS NOT NULL AND _ISSTRESN < _LOD) OR (_ISLLOQ IS NOT NULL AND _ISSTRESN IS NOT NULL AND _ISSTRESN < _ISLLOQ)
        then: '''HALFLLOQ'''
      - when: str_contains(_ISSTRESC, '>') OR (_ULOQ IS NOT NULL AND _ISSTRESN IS NOT NULL AND _ISSTRESN > _ULOQ)
        then: '''ULOQ'''
    PARAMCD: IS.ISTESTCD
    PARAM:
      case:
      - when: _ISCAT = 'Serum SARS-CoV-2 Neutralizing Antibodies'
        then: _ISTEST
      - when: _ISCAT = 'Serum SARS-CoV-2 Binding Antibodies' AND _ISSTRESU IS NOT NULL AND _ISSTRESU NOT IN ('')
        then:
          str_template: '{_ISTEST} ({_ISSTRESU})'
      - otherwise: _ISTEST
    ISSTRESC: IS.ISSTRESC
    ISLLOQ: IS.ISLLOQ
    PARAMTYP: null
  filter: (_ISSTAT IS NULL OR _ISSTAT IN ('')) AND _ISTESTCD IS NOT NULL AND _ADSL IS NOT NULL
- id: derived_rows
  dataset: IS
  derivations:
    STUDYID: IS.STUDYID
    USUBJID: IS.USUBJID
    _ISSEQ: IS.ISSEQ
    _DERIVED: 1
    _ISSTAT: IS.ISSTAT
    _ISTESTCD: IS.ISTESTCD
    _ISTEST: IS.ISTEST
    _ISCAT: IS.ISCAT
    _ISSTRESC: IS.ISSTRESC
    _ISSTRESN: IS.ISSTRESN
    _ISSTRESU: IS.ISSTRESU
    _ISLLOQ: IS.ISLLOQ
    _VISIT: IS.VISIT
    _VISITNUM: IS.VISITNUM
    _ISNAM: IS.ISNAM
    _ISSPEC: IS.ISSPEC
    _ISDTC: IS.ISDTC
    _LOD: SUPP_P.LOD
    _LLOQ: SUPP_P.LLOQ
    _ULOQ: SUPP_P.ULOQ
    _AVAL_SRC:
      case:
      - when: str_contains(_ISSTRESC, '<') OR (_LOD IS NOT NULL AND _ISSTRESN IS NOT NULL AND _ISSTRESN < _LOD) OR (_ISLLOQ IS NOT NULL AND _ISSTRESN IS NOT NULL AND _ISSTRESN < _ISLLOQ)
        then: _ISLLOQ * 0.5
      - when: str_contains(_ISSTRESC, '>') OR (_ULOQ IS NOT NULL AND _ISSTRESN IS NOT NULL AND _ISSTRESN > _ULOQ)
        then: _ULOQ
      - otherwise: _ISSTRESN
    DTYPE:
      case:
      - when: str_contains(_ISSTRESC, '<') OR (_LOD IS NOT NULL AND _ISSTRESN IS NOT NULL AND _ISSTRESN < _LOD) OR (_ISLLOQ IS NOT NULL AND _ISSTRESN IS NOT NULL AND _ISSTRESN < _ISLLOQ)
        then: '''HALFLLOQ'''
      - when: str_contains(_ISSTRESC, '>') OR (_ULOQ IS NOT NULL AND _ISSTRESN IS NOT NULL AND _ISSTRESN > _ULOQ)
        then: '''ULOQ'''
    PARAMCD:
      mapping:
        source: _ISTESTCD
        dict:
          MN50: L10MN50
          MNET: L10MNET
          PSVNT50: L10PVN50
          V58IGGES: LV58IGGS
          V58IGGEN: LV58IGGN
          V58IGMES: LV58IGMS
          V58IG1ES: LV58IG1S
          V58IG2ES: LV58IG2S
          V58IG3ES: LV58IG3S
          V58IG4ES: LV58IG4S
        unmapped: null
    PARAM:
      mapping:
        source: PARAMCD
        dict:
          L10MN50: 'LOG10(MN50)'
          L10MNET: 'LOG10(MN Endpoint Titer)'
          L10PVN50: 'LOG10(PsVNT50)'
          LV58IGGS: 'LOG10(VAC58 Spike IgG Antibody)'
          LV58IGGN: 'LOG10(VAC58 Nucleocapsid IgG Antibody)'
          LV58IGMS: 'LOG10(VAC58 Spike IgM Antibody)'
          LV58IG1S: 'LOG10(VAC58 Spike IgG subclass 1)'
          LV58IG2S: 'LOG10(VAC58 Spike IgG subclass 2)'
          LV58IG3S: 'LOG10(VAC58 Spike IgG subclass 3)'
          LV58IG4S: 'LOG10(VAC58 Spike IgG subclass 4)'
        unmapped: null
    ISSTRESC: null
    ISLLOQ: _LLOQ
    PARAMTYP: '''DERIVED'''
  filter: (_ISSTAT IS NULL OR _ISSTAT IN ('')) AND _ISTESTCD IS NOT NULL AND _ADSL IS NOT NULL AND PARAMCD IS NOT NULL AND _AVAL_SRC IS NOT NULL AND (_ISTESTCD <> 'V58IGGEN' OR _AVAL_SRC <> 0)
intermediates:
- id: SUPP_P
  dataset: SUPPIS
  key:
    STUDYID: STUDYID
    USUBJID: USUBJID
    IDVARVAL:
      str_decimal:
        source: _ISSEQ
        decimals: 0
  filter: SUPPIS.QNAM IN ('LOD', 'LLOQ', 'ULOQ') AND SUPPIS.IDVAR = 'ISSEQ'
  pivot:
    name: QNAM
    value: QVAL
    fields:
    - LOD
    - LLOQ
    - ULOQ
- id: EX_DOSE1
  dataset: EX
  key:
  - STUDYID
  - USUBJID
  filter: EX.EXSTDTC IS NOT NULL AND EX.VISITDY = 1
  order_by:
  - EX.EXSTDTC
  keep: first
- id: EX_DOSE2
  dataset: EX
  key:
  - STUDYID
  - USUBJID
  filter: EX.EXSTDTC IS NOT NULL AND EX.VISITDY = 29
  order_by:
  - EX.EXSTDTC
  keep: first
- id: PP
  dataset: PP_LIST
  key:
    USUBJID: USUBJID
    VISITTPT: AVISIT
- id: PP2
  dataset: PP_LIST2
  key:
    USUBJID: USUBJID
    VISITTPT: AVISIT
windows:
  ANL01_W:
    group_by:
    - STUDYID
    - USUBJID
    - PARAMCD
    - AVISITN
    order_by:
    - variable: _POSTFL
      direction: desc
    - variable: _AVALN
      direction: desc
    - _UNS
    - _AWTDIFF
    - variable: _ADTMY
      direction: desc
    filter: AVAL IS NOT NULL
  ANL02_W:
    group_by:
    - STUDYID
    - USUBJID
    - PARAMCD
    - AVISITN
    order_by:
    - variable: _POSTFL
      direction: desc
    - variable: _AVALN
      direction: desc
    - _UNS
    - _AWTDIFF
    - variable: _ADTMY
      direction: desc
    filter: AVAL IS NOT NULL AND _SET1 = 1
output:
  path: <adam-dir>/adis-yamaa.parquet
  order_by:
  - USUBJID
  - PARCAT1
  - PARAMCD
  - AVISITN
  - ISDTC
  - ISSEQ
  columns:
  - STUDYID
  - USUBJID
  - SUBJID
  - SITEID
  - COUNTRY
  - AGE
  - AGEU
  - AGEGR1
  - AGEGR1N
  - AGEGR2
  - AGEGR2N
  - SEX
  - RACE
  - RACESPY
  - ETHNIC
  - RANDFL
  - SAFFL
  - FASBABFL
  - FASNABFL
  - PPBABFL
  - PPNABFL
  - PPBD29FL
  - PPBD57FL
  - PPND29FL
  - PPND57FL
  - SAR1FL
  - SAR2FL
  - SARAFL
  - FASNA2FL
  - PPNAB2FL
  - PN2D29FL
