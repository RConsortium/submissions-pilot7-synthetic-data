- name: TRTA
  type: str
  label: Actual Treatment
  derivation:
    case:
    - when: ATPTREF = 'Vaccination 1' AND EX_DOSE1.EXTRT = 'PLACEBO'
      then: '''Placebo'''
    - when: ATPTREF = 'Vaccination 1' AND str_contains(EX_DOSE1.EXTRT, 'mRNA-1273') AND EX_DOSE1.EXDOSE > 0 AND EX_DOSE1.EXDOSE <= 75
      then: '''mRNA-1273 50 ug'''
    - when: ATPTREF = 'Vaccination 1' AND str_contains(EX_DOSE1.EXTRT, 'mRNA-1273') AND EX_DOSE1.EXDOSE > 75
      then: '''mRNA-1273 100 ug'''
    - when: ATPTREF = 'Vaccination 1' AND str_contains(EX_DOSE1.EXTRT, 'mRNA-1273') AND EX_DOSE1.EXDOSTXT IN ('>0-25', '>25-<50', '>50-75')
      then: '''mRNA-1273 50 ug'''
    - when: ATPTREF = 'Vaccination 1' AND str_contains(EX_DOSE1.EXTRT, 'mRNA-1273') AND _EX1_TXT_C IN ('>75-<100', '>75-100', '>100-125', '>125', '>125orabove')
      then: '''mRNA-1273 100 ug'''
    - when: ATPTREF = 'Vaccination 2' AND EX_DOSE2.EXTRT = 'PLACEBO'
      then: '''Placebo'''
    - when: ATPTREF = 'Vaccination 2' AND str_contains(EX_DOSE2.EXTRT, 'mRNA-1273') AND EX_DOSE2.EXDOSE > 0 AND EX_DOSE2.EXDOSE <= 75
      then: '''mRNA-1273 50 ug'''
    - when: ATPTREF = 'Vaccination 2' AND str_contains(EX_DOSE2.EXTRT, 'mRNA-1273') AND EX_DOSE2.EXDOSE > 75
      then: '''mRNA-1273 100 ug'''
    - when: ATPTREF = 'Vaccination 2' AND str_contains(EX_DOSE2.EXTRT, 'mRNA-1273') AND EX_DOSE2.EXDOSTXT IN ('>0-25', '>25-<50', '>50-75')
      then: '''mRNA-1273 50 ug'''
    - when: ATPTREF = 'Vaccination 2' AND str_contains(EX_DOSE2.EXTRT, 'mRNA-1273') AND _EX2_TXT_C IN ('>75-<100', '>75-100', '>100-125', '>125', '>125orabove')
      then: '''mRNA-1273 100 ug'''
  submission:
    core: Req
    mandatory: true
    length: 50
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
