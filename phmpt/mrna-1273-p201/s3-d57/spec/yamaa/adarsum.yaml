    PARAMCD: '''RASHOCYN'''
    PARAM: '''Rash Occurence between Day 1 and Day 7'''
    _N_ADAR: null
    _N:
      aggregate:
        filter: ADAR.PARAMCD = 'RASHOCC'
        expr: COUNT(ADAR.*)
    _ATOXGR_J:
      aggregate:
        filter: ADAR.PARAMCD = 'RASHOCC'
        order_by:
        - variable: ADAR.AVALC
          direction: desc
        - variable: ADAR.ASEQ
          direction: asc
        separator: "\x1F"
        expr: STR_JOIN(ADAR.ATOXGR)
    _AVALC_J:
      aggregate:
