# ADARSUM (reactogenicity summary) for Moderna mRNA-1273-P201, d57 cut.
#
# One record per subject per analysis parameter per vaccination (34 PARAMCDs).
# Derived from ADAR (grouped by subject/vaccination) with the beyond-7-day
# legs counted from FAAE and VS at column level. See the study's spec/review/README.md
# (ADARSUM section) for the design and the SAS-vs-define findings.
#
# First generated by gen_adarsum_spec.py (original work tree, retired); this file is
# the source.
yamaa: '1.0'
type: spec
model: ADaM
parent: ../../../spec/yamaa/base/adam-base.yaml
domain: ADARSUM
keys:
- STUDYID
- USUBJID
- ATPTREF
- PARAMCD
input:
  ADAR:
    path: <adam-dir>/adar.parquet
    key:
    - STUDYID
    - USUBJID
  ADSL:
    path: <adam-dir>/adsl.parquet
    key:
    - STUDYID
    - USUBJID
  FAAE: <sdtm-dir>/faae.parquet
  VS: <sdtm-dir>/vs.parquet
  EX: <sdtm-dir>/ex.parquet
submission:
  label: Solicited AR Summary Analysis Dataset
  class: BASIC DATA STRUCTURE
  structure: One record per subject per analysis parameter per vaccination
  repeating: true
intermediates:
- id: EX_DOSE1
  dataset: EX
  key:
  - STUDYID
  - USUBJID
  filter: EX.EXSTDTC IS NOT NULL AND EX.VISITDY = 1
  order_by:
  - EX.EXSTDTC
  keep: first
- id: EX_DOSE2
  dataset: EX
  key:
  - STUDYID
  - USUBJID
  filter: EX.EXSTDTC IS NOT NULL AND EX.VISITDY = 29
  order_by:
  - EX.EXSTDTC
  keep: first
rows:
- id: hprasdur
  dataset: ADAR
  group_by:
  - ADAR.STUDYID
  - ADAR.USUBJID
  - ADAR.ATPTREF
  filter: _N_ADAR > 0
  derivations:
    STUDYID: ADAR.STUDYID
    USUBJID: ADAR.USUBJID
    ATPTREF: ADAR.ATPTREF
    PARAMCD: '''HPRASDUR'''
    PARAM: '''Number of Days for Rash by Health Provider'''
    _N_ADAR:
      aggregate:
        filter: ADAR.PARAMCD = 'RASH' AND ADAR.ATOXGRN > 0
        distinct: true
        expr: COUNT(ADAR.ATPT)
    _N: null
    _ATOXGR_J: null
    _AVALC_J: null
    _ASEQ_J: null
- id: hplymdur
  dataset: ADAR
  group_by:
  - ADAR.STUDYID
  - ADAR.USUBJID
  - ADAR.ATPTREF
  filter: _N_ADAR > 0
  derivations:
    STUDYID: ADAR.STUDYID
    USUBJID: ADAR.USUBJID
    ATPTREF: ADAR.ATPTREF
    PARAMCD: '''HPLYMDUR'''
    PARAM: '''Number of Days for Lymphadenopathy by Health Provider'''
    _N_ADAR:
      aggregate:
        filter: ADAR.PARAMCD = 'LYMPHOCC' AND ADAR.AVALC = 'Y'
        distinct: true
        expr: COUNT(ADAR.ATPT)
    _N: null
    _ATOXGR_J: null
    _AVALC_J: null
    _ASEQ_J: null
