    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: PARAMCD
  type: str
  label: Parameter Code
  derivation:
    case:
    - when: _PARAM = 'Family member'
      then: '''EXPFAM'''
    - when: _PARAM = 'Health Care Facility'
      then: '''EXPHCF'''
    - when: _PARAM = 'Other exposure'
      then: '''EXPOTH'''
    - when: _PARAM = 'Social setting'
      then: '''EXPSOC'''
    - when: _PARAM = 'Travel'
      then: '''EXPTRAV'''
    - when: _PARAM = 'Work'
      then: '''EXPWORK'''
    - when: _PARAM = 'The participant had close contact with a person known to have SARS-CoV-2 infection or COVID-19'
      then: '''CONTACT'''
    - when: _PARAM = 'Cough'
      then: '''COUGH'''
    - when: str_contains(_PARAM, '^Shortness')
      then: '''SOB'''
    - when: _PARAM = 'Fever'
      then: '''FEVER'''
    - when: _PARAM = 'Sore Throat'
      then: '''SORETHRT'''
    - when: str_contains(_PARAM, '^Chest')
      then: '''CHESTTP'''
    - when: str_contains(_PARAM, '^Headache')
      then: '''HEADACHE'''
    - when: _PARAM = 'Lethargy'
      then: '''LETHARGY'''
    - when: _PARAM = 'Myalgia'
      then: '''MYALGIA'''
    - when: _PARAM = 'Anosmia'
      then: '''ANOSMIA'''
    - when: _PARAM = 'Dysgeusia'
      then: '''DYSGEUSI'''
    - when: _PARAM = 'Chills'
      then: '''CHILLS'''
    - when: str_contains(_PARAM, '^Repeated')
      then: '''REPTSHAK'''
    - when: _PARAM = 'Other Symptoms'
      then: '''OTHSYMPT'''
    - when: _PARAM = 'COVID-19'
      then: '''COVID'''
    - when: _PARAM = 'Exposed to COVID-19'
      then: '''EXPCOVID'''
    - when: _PARAM = 'Participant COVID-19 Symptomatic'
      then: '''COVIDSYM'''
    - when: _PARAM = 'Duration'
      then: '''DUR'''
  submission:
    core: Req
    mandatory: true
    length: 8
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: _SYMPTDTC
  type: str
  derivation:
    case:
    - when: _SRCDOM = 'FA'
      then: SUPPFAOT_P.SYMPTDTC
- name: _EXPOSEOT
  type: str
  derivation:
    case:
    - when: _SRCDOM = 'ER'
      then: SUPPER_P.EXPOSEOT
- name: ADT
  type: date
  label: Analysis Date
  derivation:
    to_date:
      source: _DTC
  submission:
    core: Perm
    mandatory: false
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: ADY
  type: int
  label: Analysis Relative Day
  derivation:
    study_day:
      source: ADT
      reference: ADSL.TR01SDT
  submission:
    core: Perm
    mandatory: false
    length: 8
    display_format: '3.'
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: _VISIT_DAY
  type: str
  derivation:
    str_extract:
      source: VISIT
      pattern: 'Day ([0-9]+)'
      group: 1
      no_match: null
- name: _AVISIT_RAW
  type: str
  derivation:
    case:
    - when: "NOT str_contains(VISIT, 'Unsched') AND _VISIT_DAY IS NOT NULL"
      then:
        str_template: 'Day {_VISIT_DAY}'
    - when: "str_contains(VISIT, 'Unsched') AND ADY IS NOT NULL AND ADY > 1 AND ADY <= 11"
      then: '''Day 8'''
    - when: "str_contains(VISIT, 'Unsched') AND ADY IS NOT NULL AND ADY >= 12 AND ADY <= 22"
      then: '''Day 15'''
    - when: "str_contains(VISIT, 'Unsched') AND ADY IS NOT NULL AND ADY >= 23 AND ADY <= 32"
      then: '''Day 29'''
    - when: "str_contains(VISIT, 'Unsched') AND ADY IS NOT NULL AND ADY >= 33 AND ADY <= 39"
      then: '''Day 36'''
    - when: "str_contains(VISIT, 'Unsched') AND ADY IS NOT NULL AND ADY >= 40 AND ADY <= 50"
      then: '''Day 43'''
    - when: "str_contains(VISIT, 'Unsched') AND ADY IS NOT NULL AND ADY >= 51 AND ADY <= 133"
      then: '''Day 57'''
    - when: "str_contains(VISIT, 'Unsched') AND ADY IS NOT NULL AND ADY >= 134 AND ADY <= 301"
      then: '''Day 209'''
    - when: "str_contains(VISIT, 'Unsched') AND ADY IS NOT NULL AND ADY >= 302"
      then: '''Day 394'''
- name: _AVISITN_RAW
  type: int
  derivation:
    mapping:
      source: _AVISIT_RAW
      dict:
        'Day 1': 2
        'Day 8': 3
        'Day 15': 4
        'Day 29': 5
        'Day 36': 6
        'Day 43': 7
        'Day 57': 8
        'Day 209': 9
        'Day 394': 10
      unmapped: null
- name: _PREV_MAXADY
  type: int
  derivation:
    row_value:
      source: _MAXADY
      offset: -1
      window: BLANK_W
- name: _MAXADY
  type: int
  derivation:
    case:
    - when: "ADY IS NOT NULL AND (_PREV_MAXADY IS NULL OR ADY > _PREV_MAXADY)"
      then: ADY
    - otherwise: _PREV_MAXADY
- name: _SETTER_AVN
  type: int
  derivation:
    case:
    - when: "ADY IS NOT NULL AND (_PREV_MAXADY IS NULL OR ADY > _PREV_MAXADY)"
      then: _AVISITN_RAW
- name: _MAXAVN
  type: int
  derivation:
    locf:
      source: _SETTER_AVN
      window: BLANK_W_LOCF
- name: _BLANK
  type: str
  derivation:
    flag: >
      str_contains(VISIT, 'Unsch') AND
      _MAXADY IS NOT NULL AND ADY IS NOT NULL AND _MAXADY >= ADY AND
      _MAXAVN IS NOT NULL AND _AVISITN_RAW IS NOT NULL AND _MAXAVN < _AVISITN_RAW
- name: AVISIT
  type: str
  label: Analysis Visit
  derivation:
    case:
    - when: _BLANK = 'Y'
      then: null
    - otherwise: _AVISIT_RAW
  submission:
    core: Req
    mandatory: false
    length: 50
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: AVISITN
  type: int
  label: Analysis Visit (N)
  derivation:
    mapping:
      source: AVISIT
      dict:
        'Day 1': 2
        'Day 8': 3
        'Day 15': 4
        'Day 29': 5
        'Day 36': 6
        'Day 43': 7
        'Day 57': 8
        'Day 209': 9
        'Day 394': 10
      unmapped: null
  submission:
    core: Req
    mandatory: false
    length: 8
    display_format: '3.'
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: AVAL
  type: int
  label: Analysis Value
  derivation:
    case:
    - when: PARAMCD = 'DUR'
      then:
        duration_value:
          source: _ERDUR
          unit: day
          invalid: null
  submission:
    core: Perm
    mandatory: false
    length: 8
    display_format: '3.'
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: AVALC
  type: str
  label: Analysis Value (C)
  derivation: _AVALC
  submission:
    core: Perm
    mandatory: false
    length: 50
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: SYMPTDT
  type: date
  label: Estimated date of first symptoms
  derivation:
    case:
    - when: PARAMCD = 'COVID' AND AVALC = 'Y'
      then:
        to_date:
          source: _SYMPTDTC
  submission:
    core: Perm
    mandatory: false
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: EXPOSEDT
  type: date
  label: Estimated start date of exposure
  derivation:
    case:
    - when: PARAMCD = 'CONTACT'
      then:
        to_date:
          source: _ERSTDTC
  submission:
    core: Perm
    mandatory: false
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: OTHSPY
  type: str
  label: Symptoms other
  derivation:
    case:
    - when: PARAMCD = 'OTHSYMPT' AND AVALC = 'Y'
      then:
        str_substr:
          source: _OTHSPY
          start: 1
          length: 200
    - when: PARAMCD = 'EXPOTH' AND AVALC = 'Y'
      then:
        str_substr:
          source: _EXPOSEOT
          start: 1
          length: 200
  submission:
    core: Perm
    mandatory: false
    length: 200
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: SRCDOM
  type: str
  label: Source Data
  derivation: _SRCDOM
  submission:
    core: Req
    mandatory: true
    length: 20
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: SRCSEQ
  type: int
  label: Source Sequence Number
  derivation: _SEQ
  submission:
    # SUB-29 (yamaa #4820): numeric widths here fit the derived values. The received
    # define's Pinnacle 21 widths stay in the reproduced define layer (define/).
    core: Req
    mandatory: true
    length: 8
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: SRCVAR
  type: str
  label: Source Variable
  derivation: _SRCVAR
  submission:
    core: Req
    mandatory: true
    length: 50
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: _RN_SYMPT
  type: int
  derivation:
    row_number:
      window: T2_SYMPT_RN
- name: _FIRST_SYMPTDT
  type: date
  derivation:
    case:
    - when: _RN_SYMPT = 1
      then: SYMPTDT
- name: _SYMPTDT_MIN
  type: date
  derivation:
    locf:
      source: _FIRST_SYMPTDT
      window: T2_SYMPT_LOCF
- name: _EXPOSEDT_LE
  type: date
  derivation:
    case:
    - when: "EXPOSEDT IS NOT NULL AND _SYMPTDT_MIN IS NOT NULL AND EXPOSEDT <= _SYMPTDT_MIN"
      then: EXPOSEDT
- name: _RN_EXPOSE
  type: int
  derivation:
    row_number:
      window: T2_EXPOSE_RN
- name: _LAST_EXPOSEDT
  type: date
  derivation:
    case:
    - when: _RN_EXPOSE = 1
      then: _EXPOSEDT_LE
- name: _EXPOSEDT_MAX
  type: date
  derivation:
    locf:
      source: _LAST_EXPOSEDT
      window: T2_EXPOSE_LOCF
- name: T2FSYMP
  type: int
  label: Time from Last Exposure to First Symptom
  derivation:
    study_day:
      source: _SYMPTDT_MIN
      reference: _EXPOSEDT_MAX
  submission:
    core: Perm
    mandatory: false
    length: 8
    display_format: '3.'
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: AWRANGE
  type: str
  label: Analysis Window Valid Relative Range
  derivation:
    mapping:
      source: AVISIT
      dict:
        'Day 1': '<=1'
        'Day 8': 'Day 2 - Day 11'
        'Day 15': 'Day 12 - Day 22'
        'Day 29': 'Day 23 - Day 32'
        'Day 36': 'Day 33 - Day 39'
        'Day 43': 'Day 40 - Day 50'
        'Day 57': 'Day 51 - Day 133'
        'Day 209': 'Day 134 - Day 301'
        'Day 394': '>= Day 302'
      unmapped: null
  submission:
    core: Req
    mandatory: false
    length: 50
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: AWTARGET
  type: int
  label: Analysis Window Target
  derivation:
    mapping:
      source: AVISIT
      dict:
        'Day 1': 1
        'Day 8': 8
        'Day 15': 15
        'Day 29': 29
        'Day 36': 36
        'Day 43': 43
        'Day 57': 57
        'Day 209': 209
        'Day 394': 394
      unmapped: null
  submission:
    core: Req
    mandatory: false
    length: 8
    display_format: '3.'
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: AWTDIFF
  type: int
  label: Analysis Window Diff from Target
  derivation:
    case:
    - when: "ADY IS NOT NULL AND AWTARGET IS NOT NULL"
      then: "ABS(ADY - AWTARGET)"
  submission:
    core: Perm
    mandatory: false
    length: 8
    display_format: '3.'
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: _ID
  type: int
  derivation:
    case:
    - when: str_contains(VISIT, ' Unsch')
      then: 2
    - otherwise: 1
- name: _RN_NY
  type: int
  derivation:
    row_number:
      window: ANL01_NY
- name: _RN_OTH
  type: int
  derivation:
    row_number:
      window: ANL01_OTH
- name: ANL01FL
  type: str
  label: Analysis Flag 01
  derivation:
    case:
    - when: _RN_NY = 1 OR _RN_OTH = 1
      then: '''Y'''
  submission:
    core: Perm
    mandatory: false
    length: 1
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
