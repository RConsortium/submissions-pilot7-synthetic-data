# ADCOV for Moderna mRNA-1273-P201, data cut d57 (cutoff 2020-11-05).
# Parent: ../../../spec/yamaa/base/adam-base.yaml (section 3.1 core columns).
# Derivations implement the d57 A20ADCOV program; where the SAS code and
# the define.xml method text disagree, the code is followed (see
# README.md): EXPOSEDT has no AVALC check in the code (the define says
# AVALC='Y'); the SAS AVISITN/AWRANGE/AWTARGET formats include Day 209/394,
# which the define comments omit (no d57 row is Day 209/394, so those values
# are untested by d57 verification); the define's AWTARGET comment says 2
# for 'Day 1' but the SAS format says 1 and the submitted data agrees.
# VISIT length 32 corrects the define's stale 28: the submitted data holds
# 'Previous Screening Unscheduled 1' (32 chars) on 12 rows.
# AVISIT is mandatory false (define says Yes, submitted data has '' on
# 1,511 rows) - ADAE precedent. Same for AVISITN, AWRANGE, AWTARGET,
# each with 1,511 gaps in the submitted data.
# FAOT rows are restricted to FACAT='COVID-19 SYMPTOMS' and ER rows to
# ERCAT='COVID-19 EXPOSURE' (SAS where= clauses); the physical-exam
# (FACAT='') and FOLLOW UP (FACAT='SAFETY') FAOT rows are excluded.
# SRCDOM is the 2-letter domain code (FA/ER/SS), not the dataset name.
# The ANL01FL final having is omitted as trivially true (the NY and OTH
# row_number selections are disjoint by PARAMCD and each selects at most one
# row per key, and the having groups are finer, adding VISIT). The OTHSYMPT
# collapse's stale-holder quirk for a leading 'N' row never fires on d57
# (all 13 rows are 'Y'); the filtered STR_JOIN is the faithful equivalent.
yamaa: '1.0'
type: spec
model: ADaM
parent: ../../../spec/yamaa/base/adam-base.yaml
domain: ADCOV
keys:
- STUDYID
- USUBJID
- PARCAT1
- PARAMCD
- VISIT
- VISITNUM
input:
  FAOT: <sdtm-dir>/faot.parquet
  SUPPFAOT: <sdtm-dir>/suppfaot.parquet
  ER: <sdtm-dir>/er.parquet
  SUPPER: <sdtm-dir>/supper.parquet
  SS: <sdtm-dir>/ss.parquet
  ADSL:
    path: <adam-dir>/adsl.parquet
    key:
    - STUDYID
    - USUBJID
submission:
  label: COVID-19 Analysis Dataset
  class: BASIC DATA STRUCTURE
  structure: One or more records per subject per analysis parameter per analysis timepoint
  repeating: true
rows:
- id: faot_rows
  dataset: FAOT
  filter: "FAOT.FACAT = 'COVID-19 SYMPTOMS' AND _ADSL IS NOT NULL AND _PARAM <> 'Other Symptoms'"
  derivations:
    STUDYID: FAOT.STUDYID
    USUBJID: FAOT.USUBJID
    _SRCDOM: '''FA'''
    _SRCVAR: '''FASTRESC'''
    _SEQ: FAOT.FASEQ
    _DTC: FAOT.FADTC
    _PARAM: FAOT.FAOBJ
    _PARCAT1: FAOT.FACAT
    _AVALC: FAOT.FASTRESC
    _VISIT: FAOT.VISIT
    _VISITNUM: FAOT.VISITNUM
    _ERSTDTC: null
    _ERDUR: null
    _OTHSPY: null
- id: er_rows
  dataset: ER
  filter: ER.ERCAT = 'COVID-19 EXPOSURE' AND _ADSL IS NOT NULL
  derivations:
    STUDYID: ER.STUDYID
    USUBJID: ER.USUBJID
    _SRCDOM: '''ER'''
    _SRCVAR: '''EROCCUR'''
    _SEQ: ER.ERSEQ
    _DTC: ER.ERDTC
    _PARAM: ER.ERTERM
    _PARCAT1: ER.ERCAT
    _AVALC: ER.EROCCUR
    _VISIT: ER.VISIT
    _VISITNUM: ER.VISITNUM
    _ERSTDTC: ER.ERSTDTC
    _ERDUR: ER.ERDUR
    _OTHSPY: null
- id: ss_rows
  dataset: SS
  filter: _ADSL IS NOT NULL
  derivations:
    STUDYID: SS.STUDYID
    USUBJID: SS.USUBJID
    _SRCDOM: '''SS'''
    _SRCVAR: '''SSSTRESC'''
    _SEQ: SS.SSSEQ
    _DTC: SS.SSDTC
    _PARAM: SS.SSTEST
    _PARCAT1:
      case:
      - when: SS.SSTESTCD = 'COVIDSYM'
        then: '''COVID-19 SYMPTOMS'''
      - when: SS.SSTESTCD = 'COVID'
        then: '''COVID-19 EXPOSURE'''
    _AVALC: SS.SSSTRESC
    _VISIT: SS.VISIT
    _VISITNUM: SS.VISITNUM
    _ERSTDTC: null
    _ERDUR: null
    _OTHSPY: null
- id: dur_rows
  dataset: ER
  group_by:
  - ER.STUDYID
  - ER.USUBJID
  - ER.VISITNUM
  filter: _ADSL IS NOT NULL AND _ERDUR IS NOT NULL AND _ERDUR <> ''
  derivations:
    STUDYID: ER.STUDYID
    USUBJID: ER.USUBJID
    _ADSL: ADSL.USUBJID
    _SRCDOM: '''ER'''
    _SRCVAR: '''ERDUR'''
    _SEQ:
      aggregate: MIN(ER.ERSEQ)
    _DTC:
      aggregate: MIN(ER.ERDTC)
    _PARAM: '''Duration'''
    _PARCAT1: '''COVID-19 EXPOSURE'''
    _AVALC:
      str_extract:
        source: _ERDUR
        pattern: '([0-9]+)'
        group: 1
        no_match: null
    _VISIT:
      aggregate: MIN(ER.VISIT)
    _VISITNUM: ER.VISITNUM
    _ERSTDTC:
      aggregate: MIN(ER.ERSTDTC)
    _ERDUR:
      aggregate:
        filter: ER.ERDUR IS NOT NULL AND ER.ERDUR <> ''
        expr: MIN(ER.ERDUR)
    _OTHSPY: null
- id: othsympt_groups
  dataset: FAOT_OTH
  group_by:
  - FAOT_OTH.STUDYID
  - FAOT_OTH.USUBJID
  - FAOT_OTH._ADT
  - FAOT_OTH.VISITNUM
  filter: _ADSL IS NOT NULL
  derivations:
    STUDYID: FAOT_OTH.STUDYID
    USUBJID: FAOT_OTH.USUBJID
    _ADSL: ADSL.USUBJID
    _SRCDOM: '''FA'''
    _SRCVAR: '''FASTRESC'''
    _SEQ:
      aggregate: MIN(FAOT_OTH._SEQ)
    _DTC:
      aggregate: MAX(FAOT_OTH._DTC)
    _PARAM: '''Other Symptoms'''
    _PARCAT1: '''COVID-19 SYMPTOMS'''
    _AVALC:
      aggregate: MAX(FAOT_OTH._AVALC)
    _OTHSPY:
      aggregate:
        filter: FAOT_OTH._AVALC = 'Y'
        expr: STR_JOIN(FAOT_OTH._SYMPOTH)
        order_by:
        - variable: FAOT_OTH._AVALC
          direction: desc
        - FAOT_OTH._SEQ
        separator: ', '
    _VISIT:
      aggregate: MAX(FAOT_OTH._VISIT)
    _VISITNUM: FAOT_OTH.VISITNUM
    _ERSTDTC: null
    _ERDUR: null
intermediates:
- id: SUPPFAOT_P
  dataset: SUPPFAOT
  key:
    STUDYID: STUDYID
    USUBJID: USUBJID
    IDVARVAL:
      str_decimal:
        source: _SEQ
        decimals: 0
  filter: SUPPFAOT.QNAM IN ('SYMPTDTC', 'SYMPOTH') AND SUPPFAOT.IDVAR = 'FASEQ'
  pivot:
    name: QNAM
    value: QVAL
    fields:
    - SYMPTDTC
    - SYMPOTH
- id: SUPPER_P
  dataset: SUPPER
  key:
    STUDYID: STUDYID
    USUBJID: USUBJID
    IDVARVAL:
      str_decimal:
        source: _SEQ
        decimals: 0
  filter: SUPPER.QNAM IN ('EXPOSEOT') AND SUPPER.IDVAR = 'ERSEQ'
  pivot:
    name: QNAM
    value: QVAL
    fields:
    - EXPOSEOT
- id: FAOT_OTH
  dataset: FAOT
  filter: FAOT.FACAT = 'COVID-19 SYMPTOMS' AND FAOT.FAOBJ = 'Other Symptoms'
  derivations:
    _SEQ:
      type: float
      derivation: FAOT.FASEQ
    _DTC:
      type: str
      derivation: FAOT.FADTC
    _ADT:
      type: date
      derivation:
        to_date:
          source: FAOT.FADTC
    _AVALC:
      type: str
      derivation: FAOT.FASTRESC
    _SYMPOTH:
      type: str
      derivation: SUPPFAOT_P.SYMPOTH
    _VISIT:
      type: str
      derivation: FAOT.VISIT
    _VISITNUM:
      type: float
      derivation: FAOT.VISITNUM
windows:
  BLANK_W:
    group_by:
    - USUBJID
    order_by:
    - _AVISITN_RAW
    - ADY
  BLANK_W_LOCF:
    group_by:
    - USUBJID
    order_by:
    - _AVISITN_RAW
    - ADY
  ANL01_NY:
    group_by:
    - USUBJID
    - PARCAT1
    - PARAMCD
    - AVISIT
    order_by:
    - variable: AVALC
      direction: desc
    - variable: _ID
      direction: asc
    - variable: VISITNUM
      direction: asc
    - variable: ADT
      direction: desc
    - variable: _SEQ
      direction: asc
    filter: AVALC IN ('Y', 'N') AND AVISIT IS NOT NULL
  ANL01_OTH:
    group_by:
    - USUBJID
    - PARCAT1
    - PARAMCD
    - AVISIT
    order_by:
    - variable: ADT
      direction: desc
    - variable: VISITNUM
      direction: asc
    - variable: _SEQ
      direction: desc
    filter: AVALC NOT IN ('Y', 'N', '') AND AVISIT IS NOT NULL
  T2_SYMPT_RN:
    group_by:
    - USUBJID
    order_by:
    - SYMPTDT
    filter: PARAMCD = 'COVID' AND AVALC = 'Y' AND SYMPTDT IS NOT NULL
  T2_SYMPT_LOCF:
    group_by:
    - USUBJID
    order_by:
    - variable: _RN_SYMPT
      direction: asc
      nulls: last
  T2_EXPOSE_RN:
    group_by:
    - USUBJID
    order_by:
    - variable: _EXPOSEDT_LE
      direction: desc
    filter: _EXPOSEDT_LE IS NOT NULL
  T2_EXPOSE_LOCF:
    group_by:
    - USUBJID
    order_by:
    - variable: _RN_EXPOSE
      direction: asc
      nulls: last
