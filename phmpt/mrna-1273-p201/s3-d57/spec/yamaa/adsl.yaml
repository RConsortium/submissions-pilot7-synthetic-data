# ADSL for Moderna mRNA-1273-P201, data cut d57 (cutoff 2020-11-05).
# Parent: ../../../spec/yamaa/base/adam-base.yaml (section 3.1 core columns).
# Derivations implement program/adam/_adsl_vars_ + A10ADSL; where the SAS
# code and the define.xml disagree, the code is followed (see README.md).
yamaa: '1.0'
type: spec
model: ADaM
parent: ../../../spec/yamaa/base/adam-base.yaml
domain: ADSL
keys:
- STUDYID
- USUBJID
input:
  DM: <sdtm-dir>/dm.parquet
  DS: <sdtm-dir>/ds.parquet
  EX: <sdtm-dir>/ex.parquet
  IS: <sdtm-dir>/is.parquet
  VS: <sdtm-dir>/vs.parquet
  MB: <sdtm-dir>/mb.parquet
  RP: <sdtm-dir>/rp.parquet
  FACE: <sdtm-dir>/face.parquet
  AE: <sdtm-dir>/ae.parquet
  SUPPDM: <sdtm-dir>/suppdm.parquet
  SUPPMB: <sdtm-dir>/suppmb.parquet
  SUPPRP: <sdtm-dir>/supprp.parquet
  TS: <sdtm-dir>/ts.parquet
  PP_LIST: <sdtm-dir>/pp_list.parquet
  PP_LIST2: <sdtm-dir>/pp_list2.parquet
submission:
  label: Subject-Level Analysis Dataset
  class: SUBJECT LEVEL ANALYSIS DATASET
  structure: One record per subject
  repeating: false
rows:
- id: subjects
  dataset: DM
  filter: _ENROL IS NOT NULL AND (_SCRN IS NULL OR _DOSE1 IS NOT NULL)
intermediates:
- id: DS_ENROL
  dataset: DS
  key:
  - STUDYID
  - USUBJID
  filter: DS.DSDECOD = 'RANDOMIZED' AND DS.DSSTDTC IS NOT NULL
  order_by:
  - DS.DSSTDTC
  keep: last
- id: DS_SCRN
  dataset: DS
  key:
  - STUDYID
  - USUBJID
  filter: DS.DSSCAT = 'SCREEN FAILURE'
  order_by:
  - DS.DSSTDTC
  keep: last
- id: DS_EOS
  dataset: DS
  key:
  - STUDYID
  - USUBJID
  filter: DS.DSSCAT = 'END OF STUDY'
  order_by:
  - DS.DSSTDTC
  keep: last
- id: DS_EOT
  dataset: DS
  key:
  - STUDYID
  - USUBJID
  filter: DS.DSSCAT = 'STUDY TREATMENT' AND DS.DSDECOD <> 'COMPLETED'
  order_by:
  - DS.DSSTDTC
  keep: last
- id: EX_LAST
  dataset: EX
  key:
  - STUDYID
  - USUBJID
  filter: EX.EXSTDTC IS NOT NULL
  order_by:
  - EX.EXSTDTC
  - EX.VISITDY
  keep: last
- id: EX_DOSE1
  dataset: EX
  key:
  - STUDYID
  - USUBJID
  filter: EX.EXSTDTC IS NOT NULL AND EX.VISITDY = 1
  order_by:
  - EX.EXSTDTC
  keep: last
- id: EX_DOSE2
  dataset: EX
  key:
  - STUDYID
  - USUBJID
  filter: EX.EXSTDTC IS NOT NULL AND EX.VISITDY = 29
  order_by:
  - EX.EXSTDTC
  keep: last
- id: SUPPDM_P
  dataset: SUPPDM
  key:
  - STUDYID
  - USUBJID
  filter: SUPPDM.QNAM IN ('COHORT', 'RACEOTH', 'MULRACE', 'PROTVER', 'SENTL', 'PREVSCR')
  pivot:
    name: QNAM
    value: QVAL
    fields:
    - COHORT
    - RACEOTH
    - MULRACE
    - PROTVER
    - SENTL
    - PREVSCR
- id: SUPPMB_L
  dataset: SUPPMB
  key:
    STUDYID: STUDYID
    USUBJID: USUBJID
    IDVARVAL:
      str_decimal:
        source: MBSEQ
        decimals: 0
  filter: SUPPMB.QNAM = 'LOCALFL' AND SUPPMB.IDVAR = 'MBSEQ'
  pivot:
    name: QNAM
    value: QVAL
    fields:
    - LOCALFL
- id: SUPPRP_CB
  dataset: SUPPRP
  key:
    STUDYID: STUDYID
    USUBJID: USUBJID
    IDVARVAL:
      str_decimal:
        source: RPSEQ
        decimals: 0
  filter: SUPPRP.QNAM = 'CBRSN' AND SUPPRP.IDVAR = 'RPSEQ'
  pivot:
    name: QNAM
    value: QVAL
    fields:
    - CBRSN
- id: MB_COV2
  dataset: MB
  key:
  - STUDYID
  - USUBJID
  filter: MB.MBTESTCD = 'SARSCOV2' AND (MB.LOCALFL IS NULL OR MB.LOCALFL <> 'Y')
  between:
    value: TR01SDT
    lower: MBDT_D
  derivations:
    MBDT_D:
      type: date
      derivation:
        to_date:
          source: MB.MBDTC
    LOCALFL:
      type: str
      derivation: SUPPMB_L.LOCALFL
  order_by:
  - MB.MBDT_D
  keep: last
- id: MB_INF
  dataset: MB
  key:
  - STUDYID
  - USUBJID
  filter: MB.MBTESTCD = 'SARSCOV2' AND MB.MBSTRESC IN ('DETECTED', 'POSITIVE')
  order_by:
  - MB.MBDTC
  keep: last
- id: AE_COV
  dataset: AE
  key:
  - STUDYID
  - USUBJID
  filter: AE.AEDECOD LIKE '%COVID-19%' OR AE.AEDECOD = 'SARS-CoV-2 test positive'
  order_by:
  - AE.AESTDTC
  keep: last
- id: RP_CHIL
  dataset: RP
  key:
  - STUDYID
  - USUBJID
  filter: RP.RPTESTCD = 'CHILDPOT' AND RP.RPDTC IS NOT NULL
  derivations:
    CBRSN:
      type: str
      derivation: SUPPRP_CB.CBRSN
  order_by:
  - RP.RPDTC
  keep: last
- id: VS_HEI
  dataset: VS
  key:
  - STUDYID
  - USUBJID
  filter: VS.VSTESTCD = 'HEIGHT' AND VS.VSBLFL = 'Y' AND VS.VSSTRESU = 'cm'
  derivations:
    VSDTM:
      type: datetime
      derivation:
        impute:
          source: VS.VSDTC
          type: datetime
          time: first
  order_by:
  - VS.VSDTC
  keep: last
- id: VS_WEI
  dataset: VS
  key:
  - STUDYID
  - USUBJID
  filter: VS.VSTESTCD = 'WEIGHT' AND VS.VSBLFL = 'Y' AND VS.VSSTRESU = 'kg'
  derivations:
    VSDTM:
      type: datetime
      derivation:
        impute:
          source: VS.VSDTC
          type: datetime
          time: first
  order_by:
  - VS.VSDTC
  keep: last
- id: VS1
  dataset: VS
  key:
  - STUDYID
  - USUBJID
  filter: VS.VSTESTCD = 'TEMP' AND VS.VSCAT = 'REACTOGENICITY' AND VS.VSTPTREF = 'DOSE 1' AND VS.VSORRES IS NOT NULL
  derivations:
    VSDTM:
      type: datetime
      derivation:
        impute:
          source: VS.VSDTC
          type: datetime
          time: first
  order_by:
  - VS.VSDTM
  keep: last
- id: VS2
  dataset: VS
  key:
  - STUDYID
  - USUBJID
  filter: VS.VSTESTCD = 'TEMP' AND VS.VSCAT = 'REACTOGENICITY' AND VS.VSTPTREF = 'DOSE 2' AND VS.VSORRES IS NOT NULL
  derivations:
    VSDTM:
      type: datetime
      derivation:
        impute:
          source: VS.VSDTC
          type: datetime
          time: first
  order_by:
  - VS.VSDTM
  keep: last
- id: FACE1
  dataset: FACE
  key:
  - STUDYID
  - USUBJID
  filter: FACE.FATPTREF = 'DOSE 1' AND FACE.FASTAT IS NULL AND FACE.FASTRESC IS NOT NULL
  derivations:
    FADTM:
      type: datetime
      derivation:
        impute:
          source: FACE.FADTC
          type: datetime
          time: first
  order_by:
  - FACE.FADTM
  keep: last
- id: FACE2
  dataset: FACE
  key:
  - STUDYID
  - USUBJID
  filter: FACE.FATPTREF = 'DOSE 2' AND FACE.FASTAT IS NULL AND FACE.FASTRESC IS NOT NULL
  derivations:
    FADTM:
      type: datetime
      derivation:
        impute:
          source: FACE.FADTC
          type: datetime
          time: first
  order_by:
  - FACE.FADTM
  keep: last
- id: TS_DCUT
  dataset: TS
  key: none
  filter: TS.TSPARMCD = 'DCUTDTC'
  order_by:
  - TS.TSVAL
  keep: first
- id: PP_D29
  dataset: PP_LIST
  key:
  - USUBJID
  filter: PP_LIST.VISITTPT = 'Day 29'
  order_by:
  - PP_LIST.VISITPTN
  keep: first
- id: PP_D57
  dataset: PP_LIST
  key:
  - USUBJID
  filter: PP_LIST.VISITTPT = 'Day 57'
  order_by:
  - PP_LIST.VISITPTN
  keep: first
- id: PP2_D29
  dataset: PP_LIST2
  key:
  - USUBJID
  filter: PP_LIST2.VISITTPT = 'Day 29'
  order_by:
  - PP_LIST2.VISITPTN
  keep: first
- id: PP2_D57
  dataset: PP_LIST2
  key:
  - USUBJID
  filter: PP_LIST2.VISITTPT = 'Day 57'
  order_by:
  - PP_LIST2.VISITPTN
  keep: first
output:
  path: <adam-dir>/adsl-yamaa.parquet
  order_by:
  - USUBJID
  columns:
  - STUDYID
  - USUBJID
  - SUBJID
  - SITEID
  - COUNTRY
  - AGE
  - AGEU
  - AGEGR1
  - AGEGR1N
  - AGEGR2
  - AGEGR2N
  - SEX
  - RACE
  - RACESPY
  - ETHNIC
  - PROTVER
  - CHILDBP
  - CBNRS
  - RANDFL
  - RANDNUM
  - SAFFL
  - FASBABFL
  - FASNABFL
  - PPBABFL
  - PPNABFL
  - PPBD29FL
  - PPBD57FL
  - PPND29FL
  - PPND57FL
  - SAR1FL
  - SAR2FL
  - SARAFL
  - FASNA2FL
  - PPNAB2FL
  - PN2D29FL
  - PN2D57FL
  - COMPLFL
  - DVBABFL
  - DVNABFL
  - DOSE1FL
  - DOSE2FL
  - DOSEROFL
  - COV19BL
  - HEIGHTBL
  - WEIGHTBL
  - BMIBL
  - COV19FL
  - SENTLFL
  - D29W7DFL
  - ARM
  - ACTARM
  - TRT01P
  - TRT01PN
  - TRT01A
  - TRT01AN
  - RFICDT
  - RANDDT
  - RFXSTDTC
  - TR01SDT
  - TR01SDTM
  - TR01EDT
  - TR01EDTM
  - TRTSDTM
  - TRTEDTM
  - DOSE2DT
  - DOS2DTM
  - EOSSTT
  - EOSDT
  - EOSDY
  - DCSREAS
  - DCSREASP
  - EOTSTT
  - EOTDT
  - EOTDY
  - DCTREAS
  - DCTREASP
  - DTHDT
  - DTHAUTOP
  - CUTOFFDT
  - SAFEREAS
  - SAR1ERS
  - SAR2ERS
  - FASBABRS
  - FASNABRS
  - PPBABERS
  - PPNABERS
  - PPBD29ER
  - PPBD57ER
  - PPND29ER
  - PPND57ER
  - PPNAB2ER
  - PN2D29ER
  - PN2D57ER
  - PREVSCR
columns:
- name: _ENROL
  type: str
  derivation: DS_ENROL.DSDECOD
- name: _SCRN
  type: str
  derivation: DS_SCRN.DSSCAT
- name: _DOSE1
  type: str
  derivation: EX_DOSE1.EXSTDTC
- name: _RFXENDTC
  type: str
  derivation: DM.RFXENDTC
- name: _RACEOTH
  type: str
  derivation: SUPPDM_P.RACEOTH
- name: _MULRACE
  type: str
  derivation: SUPPDM_P.MULRACE
- name: _IS_BIND_MIN
  type: date
  derivation:
    aggregate:
      key:
      - STUDYID
      - USUBJID
      derivations:
        ISDT_D:
          type: date
          derivation:
            to_date:
              source: IS.ISDTC
      filter: IS.ISCAT = 'Serum SARS-CoV-2 Binding Antibodies' AND IS.ISDTC IS NOT NULL AND IS.ISORRES IS NOT NULL
      expr: MIN(ISDT_D)
- name: _IS_BIND_MAX
  type: date
  derivation:
    aggregate:
      key:
      - STUDYID
      - USUBJID
      derivations:
        ISDT_D:
          type: date
          derivation:
            to_date:
              source: IS.ISDTC
      filter: IS.ISCAT = 'Serum SARS-CoV-2 Binding Antibodies' AND IS.ISDTC IS NOT NULL AND IS.ISORRES IS NOT NULL
      expr: MAX(ISDT_D)
- name: _IS_NEU_MIN
  type: date
  derivation:
    aggregate:
      key:
      - STUDYID
      - USUBJID
      derivations:
        ISDT_D:
          type: date
          derivation:
            to_date:
              source: IS.ISDTC
      filter: IS.ISCAT = 'Serum SARS-CoV-2 Neutralizing Antibodies' AND IS.ISDTC IS NOT NULL AND IS.ISORRES IS NOT NULL
      expr: MIN(ISDT_D)
- name: _IS_NEU_MAX
  type: date
  derivation:
    aggregate:
      key:
      - STUDYID
      - USUBJID
      derivations:
        ISDT_D:
          type: date
          derivation:
            to_date:
              source: IS.ISDTC
      filter: IS.ISCAT = 'Serum SARS-CoV-2 Neutralizing Antibodies' AND IS.ISDTC IS NOT NULL AND IS.ISORRES IS NOT NULL
      expr: MAX(ISDT_D)
- name: _IS_NEU_S1_MIN
  type: date
  derivation:
    aggregate:
      key:
      - STUDYID
      - USUBJID
      derivations:
        ISDT_D:
          type: date
          derivation:
            to_date:
              source: IS.ISDTC
      filter: IS.ISCAT = 'Serum SARS-CoV-2 Neutralizing Antibodies' AND IS.ISDTC IS NOT NULL AND IS.ISORRES IS NOT NULL AND NOT ((IS.ISTESTCD = 'MNET' AND IS.ISLLOQ = 160) OR (IS.ISTESTCD = 'MN50' AND IS.ISLLOQ = 318.46))
      expr: MIN(ISDT_D)
- name: _IS_NEU_S1_MAX
  type: date
  derivation:
    aggregate:
      key:
      - STUDYID
      - USUBJID
      derivations:
        ISDT_D:
          type: date
          derivation:
            to_date:
              source: IS.ISDTC
      filter: IS.ISCAT = 'Serum SARS-CoV-2 Neutralizing Antibodies' AND IS.ISDTC IS NOT NULL AND IS.ISORRES IS NOT NULL AND NOT ((IS.ISTESTCD = 'MNET' AND IS.ISLLOQ = 160) OR (IS.ISTESTCD = 'MN50' AND IS.ISLLOQ = 318.46))
      expr: MAX(ISDT_D)
- name: _PP_BAB_N
  type: int
  derivation:
    aggregate:
      key:
      - USUBJID
      filter: PP_LIST.PVSBABFL = 'Y'
      expr: COUNT(PP_LIST.USUBJID)
- name: _PP_NAB_N
  type: int
  derivation:
    aggregate:
      key:
      - USUBJID
      filter: PP_LIST.PVSNABFL = 'Y'
      expr: COUNT(PP_LIST.USUBJID)
- name: _PP2_NAB_N
  type: int
  derivation:
    aggregate:
      key:
      - USUBJID
      filter: PP_LIST2.PVSNABFL = 'Y'
      expr: COUNT(PP_LIST2.USUBJID)
- name: _PP_PDF_BAB_N
  type: int
  derivation:
    aggregate:
      key:
      - USUBJID
      filter: PP_LIST.PBABPDFL = 'Y'
      expr: COUNT(PP_LIST.USUBJID)
- name: _PP_PDF_NAB_N
  type: int
  derivation:
    aggregate:
      key:
      - USUBJID
      filter: PP_LIST.PNABPDFL = 'Y'
      expr: COUNT(PP_LIST.USUBJID)
- name: _N_PBO
  type: int
  derivation:
    aggregate:
      key:
      - STUDYID
      - USUBJID
      filter: EX.EXTRT = 'PLACEBO'
      expr: COUNT(EX.USUBJID)
- name: _N_GT025
  type: int
  derivation:
    aggregate:
      key:
      - STUDYID
      - USUBJID
      filter: EX.EXDOSTXT LIKE '%>0-25%'
      expr: COUNT(EX.USUBJID)
- name: _N_GT2550
  type: int
  derivation:
    aggregate:
      key:
      - STUDYID
      - USUBJID
      filter: EX.EXDOSTXT LIKE '%>25-<50%'
      expr: COUNT(EX.USUBJID)
- name: _N_GT5075
  type: int
  derivation:
    aggregate:
      key:
      - STUDYID
      - USUBJID
      filter: EX.EXDOSTXT LIKE '%>50-75%'
      expr: COUNT(EX.USUBJID)
- name: _N_GT75100
  type: int
  derivation:
    aggregate:
      key:
      - STUDYID
      - USUBJID
      filter: EX.EXDOSTXT LIKE '%>75-<100%'
      expr: COUNT(EX.USUBJID)
- name: _N_GT100125
  type: int
  derivation:
    aggregate:
      key:
      - STUDYID
      - USUBJID
      filter: EX.EXDOSTXT LIKE '%>100-125%'
      expr: COUNT(EX.USUBJID)
- name: _N_GT125
  type: int
  derivation:
    aggregate:
      key:
      - STUDYID
      - USUBJID
      filter: EX.EXDOSTXT LIKE '%>125%'
      expr: COUNT(EX.USUBJID)
- name: _N_TREAT_PBO
  type: int
  derivation:
    aggregate:
      key:
      - STUDYID
      - USUBJID
      derivations:
        TREAT:
          type: str
          derivation:
            case:
            - when: EX.EXTRT = 'PLACEBO'
              then: '''Placebo'''
            - when: EX.EXDOSE = 50
              then: '''mRNA-1273 50 ug'''
            - when: EX.EXDOSE = 100
              then: '''mRNA-1273 100 ug'''
            - when: EX.EXDOSTXT LIKE '%>0-25%' OR EX.EXDOSTXT LIKE '%>25-<50%' OR EX.EXDOSTXT LIKE '%>50-75%'
              then: '''mRNA-1273 50 ug'''
            - when: EX.EXDOSTXT LIKE '%>75-<100%' OR EX.EXDOSTXT LIKE '%>100-125%' OR EX.EXDOSTXT LIKE '%>125%'
              then: '''mRNA-1273 100 ug'''
      filter: TREAT = 'Placebo'
      expr: COUNT(EX.USUBJID)
- name: _N_TREAT_50
  type: int
  derivation:
    aggregate:
      key:
      - STUDYID
      - USUBJID
      derivations:
        TREAT:
          type: str
          derivation:
            case:
            - when: EX.EXTRT = 'PLACEBO'
              then: '''Placebo'''
            - when: EX.EXDOSE = 50
              then: '''mRNA-1273 50 ug'''
            - when: EX.EXDOSE = 100
              then: '''mRNA-1273 100 ug'''
            - when: EX.EXDOSTXT LIKE '%>0-25%' OR EX.EXDOSTXT LIKE '%>25-<50%' OR EX.EXDOSTXT LIKE '%>50-75%'
              then: '''mRNA-1273 50 ug'''
            - when: EX.EXDOSTXT LIKE '%>75-<100%' OR EX.EXDOSTXT LIKE '%>100-125%' OR EX.EXDOSTXT LIKE '%>125%'
              then: '''mRNA-1273 100 ug'''
      filter: TREAT = 'mRNA-1273 50 ug'
      expr: COUNT(EX.USUBJID)
- name: _N_TREAT_100
  type: int
  derivation:
    aggregate:
      key:
      - STUDYID
      - USUBJID
      derivations:
        TREAT:
          type: str
          derivation:
            case:
            - when: EX.EXTRT = 'PLACEBO'
              then: '''Placebo'''
            - when: EX.EXDOSE = 50
              then: '''mRNA-1273 50 ug'''
            - when: EX.EXDOSE = 100
              then: '''mRNA-1273 100 ug'''
            - when: EX.EXDOSTXT LIKE '%>0-25%' OR EX.EXDOSTXT LIKE '%>25-<50%' OR EX.EXDOSTXT LIKE '%>50-75%'
              then: '''mRNA-1273 50 ug'''
            - when: EX.EXDOSTXT LIKE '%>75-<100%' OR EX.EXDOSTXT LIKE '%>100-125%' OR EX.EXDOSTXT LIKE '%>125%'
              then: '''mRNA-1273 100 ug'''
      filter: TREAT = 'mRNA-1273 100 ug'
      expr: COUNT(EX.USUBJID)
- name: _N_DOSTXT
  type: int
  derivation:
    aggregate:
      key:
      - STUDYID
      - USUBJID
      filter: EX.EXDOSTXT IS NOT NULL
      expr: COUNT(EX.USUBJID)
- name: _DOSECOMPFL
  type: str
  derivation:
    case:
    - when: ACTARM <> ARM
      then: '''Y'''
    - when: ARM = 'mRNA-1273 50 ug' AND (_N_PBO > 0 OR _N_GT025 > 0 OR _N_GT75100 > 0 OR _N_GT100125 > 0 OR _N_GT125 > 0)
      then: '''Y'''
    - when: ARM = 'mRNA-1273 100 ug' AND (_N_PBO > 0 OR _N_GT025 > 0 OR _N_GT2550 > 0 OR _N_GT5075 > 0 OR _N_GT125 > 0)
      then: '''Y'''
    - otherwise: '''N'''
- name: _D29_GAP
  type: int
  derivation:
    study_day:
      source: DOSE2DT
      reference: TR01SDT
- name: _EOS_TERM_UP
  type: str
  derivation:
    str_case:
      source: DS_EOS.DSTERM
      to: upper
- name: _EOS_TERM_PROP
  type: str
  derivation:
    str_case:
      source: DS_EOS.DSTERM
      to: proper
- name: _EOS_DEC_PROP
  type: str
  derivation:
    str_case:
      source: DS_EOS.DSDECOD
      to: proper
- name: _DCS_RAW
  type: str
  derivation:
    case:
    - when: DS_EOS.DSDECOD = _EOS_TERM_UP
      then: _EOS_TERM_PROP
    - when: DS_EOS.DSDECOD IN ('PHYSICIAN DESICION', 'PROTOCOL DEVIATION', 'OTHER')
      then: _EOS_DEC_PROP
    - when: DS_EOS.DSDECOD = 'ADVERSE EVENT'
      then: '''Adverse Event (Other)'''
    - when: DS_EOS.DSDECOD = 'AE COVID'
      then: '''Adverse Event (COVID-19 Infection)'''
    - when: DS_EOS.DSDECOD = 'WITHDRAWAL BY SUBJECT (OTHER)'
      then: '''Withdrawal of Consent (Other)'''
    - when: DS_EOS.DSDECOD IN ('WITHDRAWAL BY SUBJECT (COVID-19 NON-INFECTION RELATED)', 'WITHDRAWAL COVID')
      then: '''Withdrawal of Consent (COVID-19 Non-Infection Related)'''
- name: _EOT_TERM_UP
  type: str
  derivation:
    str_case:
      source: DS_EOT.DSTERM
      to: upper
- name: _EOT_TERM_PROP
  type: str
  derivation:
    str_case:
      source: DS_EOT.DSTERM
      to: proper
- name: _EOT_DEC_PROP
  type: str
  derivation:
    str_case:
      source: DS_EOT.DSDECOD
      to: proper
- name: _DCT_RAW
  type: str
  derivation:
    case:
    - when: DS_EOT.DSDECOD = _EOT_TERM_UP
      then: _EOT_TERM_PROP
    - when: DS_EOT.DSDECOD IN ('PHYSICIAN DESICION', 'PROTOCOL DEVIATION', 'OTHER', 'LOST TO FOLLOW-UP')
