    - when: str_contains(_VSDTC, 'T')
      then:
        impute:
          type: datetime
          source: _VSDTC
          time: first
  submission:
    core: Perm
    mandatory: false
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
