# ADVS for Moderna mRNA-1273-P201, data cut d57 (cutoff 2020-11-05).
# Parent: ../../../spec/yamaa/base/adam-base.yaml (section 3.1 core columns).
# Derivations implement the d57 A20ADVS program (prototype
# advs_proto.py (original work tree) matches all 99 submitted columns on all
# 38,439 rows). Where the SAS code and the define.xml method text disagree,
# the code is followed (see README.md).
# Inputs: VS + SUPPVS + SV + EX (SDTM) + ADSL (core columns). SUPPVS is
# pivoted for VSLOCSP by (USUBJID, VSSEQ); it has no VSLOCSP rows on d57, so
# VSLOCSP is '' on all submitted rows. SV supplies the Visit 7 Day 57 and
# Visit 4 Day 29 dates for ASTAGE. EX enters only via %trta (dose 1/2 rows).
# Row accounting: VS 49,763 rows -> filter (VSCAT missing or not
# 'REACTOGENICITY', VSSTAT missing or not 'NOT DONE') 40,150 -> ADSL merge on
# (STUDYID, USUBJID, SUBJID) drops 1,711 -> 38,439 submitted rows (the SUBJID
# join is load-bearing: 12 subjects are re-screened). Keys are
# [STUDYID, USUBJID, VSSEQ] (unique).
yamaa: '1.0'
type: spec
model: ADaM
parent: ../../../spec/yamaa/base/adam-base.yaml
domain: ADVS
keys:
- STUDYID
- USUBJID
- VSSEQ
input:
  VS: <sdtm-dir>/vs.parquet
  SUPPVS: <sdtm-dir>/suppvs.parquet
  SV: <sdtm-dir>/sv.parquet
  EX: <sdtm-dir>/ex.parquet
  ADSL:
    path: <adam-dir>/adsl.parquet
    key:
    - STUDYID
    - USUBJID
    - SUBJID
submission:
  label: Vital Signs Analysis Dataset
  class: BASIC DATA STRUCTURE
  structure: One or more records per subject per analysis parameter per analysis timepoint
  repeating: true
rows:
- id: vs_rows
  dataset: VS
  derivations:
    STUDYID: VS.STUDYID
    USUBJID: VS.USUBJID
    _VSSEQ: VS.VSSEQ
    _VSCAT: VS.VSCAT
    _VSSTAT: VS.VSSTAT
    _VSTESTCD: VS.VSTESTCD
    _VSTEST: VS.VSTEST
    _VSSTRESU: VS.VSSTRESU
    _VSSTRESN: VS.VSSTRESN
    _VSSTRESC: VS.VSSTRESC
    _VSDTC: VS.VSDTC
    _VISIT: VS.VISIT
    _VISITNUM: VS.VISITNUM
    _VSTPT: VS.VSTPT
    _VSTPTNUM: VS.VSTPTNUM
    _VSLOC: VS.VSLOC
    _VSLOCSP: SUPP_P.VSLOCSP
    _SUBJID: VS.SUBJID
  filter: (_VSCAT IS NULL OR _VSCAT <> 'REACTOGENICITY') AND (_VSSTAT IS NULL OR _VSSTAT <> 'NOT DONE') AND _ADSL IS NOT NULL
intermediates:
- id: SUPP_P
  dataset: SUPPVS
  key:
    STUDYID: STUDYID
    USUBJID: USUBJID
    IDVARVAL:
      str_decimal:
        source: _VSSEQ
        decimals: 0
  filter: SUPPVS.QNAM IN ('VSLOCSP') AND SUPPVS.IDVAR = 'VSSEQ'
  pivot:
    name: QNAM
    value: QVAL
    fields:
    - VSLOCSP
- id: SV_V7
  dataset: SV
  key:
  - STUDYID
  - USUBJID
  filter: SV.VISIT = 'Visit 7 Day 57'
  order_by:
  - SV.SVSTDTC
  keep: first
- id: SV_V4
  dataset: SV
  key:
  - STUDYID
  - USUBJID
  filter: SV.VISIT = 'Visit 4 Day 29'
  order_by:
  - SV.SVSTDTC
  keep: first
- id: EX_DOSE1
  dataset: EX
  key:
  - STUDYID
  - USUBJID
  filter: EX.EXSTDTC IS NOT NULL AND str_contains(EX.VISIT, 'Day 1')
  order_by:
  - EX.EXSTDTC
  keep: first
- id: EX_DOSE2
  dataset: EX
  key:
  - STUDYID
  - USUBJID
  filter: EX.EXSTDTC IS NOT NULL AND str_contains(EX.VISIT, 'Day 29')
  order_by:
  - EX.EXSTDTC
  keep: first
windows:
  BASE_W:
    group_by:
    - STUDYID
    - USUBJID
    - PARAMCD
    order_by:
    - variable: _CAND
      direction: desc
    - variable: ADT
      direction: desc
    - variable: ADTM
      direction: desc
    - VISITNUM
    - VSSEQ
  CHK_W:
    group_by:
    - STUDYID
    - USUBJID
    order_by:
    - _AVISITN_RAW
    - ADY
    - VSSEQ
  ANL01_W:
    group_by:
    - STUDYID
    - USUBJID
    - PARAMCD
    - AVISIT
    - AVISITN
    - _VSTPTNUM
    order_by:
    - variable: _ANL01_CAND
      direction: desc
    - _ID
    - ADT
    - variable: VSSEQ
      direction: desc
  ANL02_W:
    group_by:
    - STUDYID
    - USUBJID
    - PARAMCD
    - AVISIT
    - AVISITN
    - _VSTPTNUM
    order_by:
    - variable: _ANL02_CAND
      direction: desc
    - variable: ATOXGRLN
      direction: desc
    - ADT
    - ATM
    - VSSEQ
  ANL03_W:
    group_by:
    - STUDYID
    - USUBJID
    - PARAMCD
    - AVISIT
    - AVISITN
    - _VSTPTNUM
    order_by:
    - variable: _ANL03_CAND
      direction: desc
    - variable: ATOXGRHN
      direction: desc
    - ADT
    - ATM
    - VSSEQ
