      source: ADT
      reference: TR01SDT
  submission:
    core: Perm
    mandatory: false
    length: 8
    display_format: '3.'
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: _VISIT_DAY
  type: str
  derivation:
    case:
    - when: str_contains(_VISIT, 'Day')
      then:
        str_extract:
          source: _VISIT
          pattern: Day ([0-9]+)
          group: 1
- name: _IS_UNSCHED
  type: int
  derivation:
    case:
    - when: str_contains(_VISIT, 'Unsch')
      then: 1
    - otherwise: 0
- name: _V7DT
  type: date
  derivation:
    to_date:
      source: SV_V7.SVSTDTC
- name: _V7DTM
  type: datetime
  derivation:
