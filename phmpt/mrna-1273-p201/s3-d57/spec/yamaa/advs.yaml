  type: time
  label: Analysis Time
  derivation:
    to_time:
      source: ADTM
  submission:
    core: Perm
    mandatory: false
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: ADY
  type: int
  label: Analysis Relative Day
  derivation:
