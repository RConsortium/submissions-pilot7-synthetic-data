      time: first
- name: _EOSDT
  type: date
  derivation: ADSL.EOSDT
- name: _DTHDT
  type: date
  derivation: ADSL.DTHDT
- name: _ENDDATE2
  type: date
  derivation:
    least:
      sources:
      - _EOSDT
      - _DTHDT
      - _V7DT
- name: _ENDDATE1
  type: date
  derivation:
    least:
      sources:
      - _EOSDT
      - _DTHDT
      - _V4DT
- name: ASTAGE
  type: str
  label: Stage
  derivation:
    case:
    - when: DOSE1FL = 'Y' AND DOSE2FL = 'Y' AND TR01SDTM IS NOT NULL AND ADTM IS NOT NULL AND _ENDDATE2 IS NOT NULL AND TR01SDTM <= ADTM AND ADT <= _ENDDATE2
      then: '''Vaccination stage'''
    - when: DOSE1FL = 'Y' AND DOSE2FL = 'Y' AND TR01SDT IS NOT NULL AND ADT IS NOT NULL AND _ENDDATE2 IS NOT NULL AND TR01SDT <= ADT AND ADT <= _ENDDATE2 AND ADTM IS NULL
      then: '''Vaccination stage'''
    - when: DOSE1FL = 'Y' AND DOSE2FL = 'Y' AND _ENDDATE2 IS NULL AND TR01SDTM IS NOT NULL AND ADTM IS NOT NULL AND TR01SDTM <= ADTM
      then: '''Vaccination stage'''
    - when: DOSE1FL = 'Y' AND DOSE2FL = 'Y' AND _ENDDATE2 IS NULL AND TR01SDTM IS NOT NULL AND ADTM IS NULL AND TR01SDT IS NOT NULL AND ADT IS NOT NULL AND TR01SDT <= ADT
      then: '''Vaccination stage'''
    - when: DOSE1FL = 'Y' AND DOSE2FL = 'Y' AND _V7DTM IS NOT NULL AND ADTM IS NOT NULL AND ADTM > _V7DTM
      then: '''Follow up stage'''
    - when: DOSE1FL = 'Y' AND DOSE2FL = 'Y' AND _V7DT IS NOT NULL AND ADT IS NOT NULL AND ADT > _V7DT
      then: '''Follow up stage'''
    - when: DOSE1FL = 'Y' AND (DOSE2FL IS NULL OR DOSE2FL <> 'Y') AND TR01SDTM IS NOT NULL AND ADTM IS NOT NULL AND _ENDDATE1 IS NOT NULL AND TR01SDTM <= ADTM AND ADT <= _ENDDATE1
      then: '''Vaccination stage'''
    - when: DOSE1FL = 'Y' AND (DOSE2FL IS NULL OR DOSE2FL <> 'Y') AND _ENDDATE1 IS NULL AND TR01SDTM IS NOT NULL AND ADTM IS NOT NULL AND TR01SDTM <= ADTM
      then: '''Vaccination stage'''
    - when: DOSE1FL = 'Y' AND (DOSE2FL IS NULL OR DOSE2FL <> 'Y') AND _ENDDATE1 IS NULL AND TR01SDTM IS NOT NULL AND ADTM IS NULL AND TR01SDT IS NOT NULL AND ADT IS NOT NULL AND TR01SDT <= ADT
      then: '''Vaccination stage'''
    - when: DOSE1FL = 'Y' AND (DOSE2FL IS NULL OR DOSE2FL <> 'Y') AND _V4DTM IS NOT NULL AND ADTM IS NOT NULL AND ADTM > _V4DTM
      then: '''Follow up stage'''
    - when: DOSE1FL = 'Y' AND (DOSE2FL IS NULL OR DOSE2FL <> 'Y') AND _V4DT IS NOT NULL AND ADT IS NOT NULL AND ADT > _V4DT
      then: '''Follow up stage'''
  submission:
    core: Perm
    mandatory: false
    length: 30
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: ASTAGEN
  type: int
  label: Stage (N)
  derivation:
    mapping:
      source: ASTAGE
      dict:
        Vaccination stage: 1
        Follow up stage: 2
      unmapped: null
  submission:
    core: Perm
    mandatory: false
    length: 8
    display_format: '3.'
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: MDOSREF
  type: str
  label: Most Recent Dose Reference
  derivation:
    case:
    - when: ADTM IS NOT NULL AND DOS2DTM IS NOT NULL AND ADTM >= DOS2DTM
      then: '''Vaccination 2'''
    - when: (ADTM IS NULL OR DOS2DTM IS NULL) AND ADT IS NOT NULL AND DOSE2DT IS NOT NULL AND ADT >= DOSE2DT
      then: '''Vaccination 2'''
