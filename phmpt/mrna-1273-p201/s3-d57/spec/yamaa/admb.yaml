      source: _MBDTC
  submission:
    core: Perm
    mandatory: false
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: ADTM
  type: datetime
  label: Analysis Datetime
  derivation:
    case:
    - when: str_contains(_MBDTC, 'T')
      then:
        impute:
          type: datetime
          source: _MBDTC
          time: first
  submission:
    core: Perm
    mandatory: false
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: ATM
  type: time
  label: Analysis Time
  derivation:
    to_time:
      source: ADTM
  submission:
    core: Perm
    mandatory: false
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: ADY
  type: int
  label: Analysis Relative Day
  derivation:
    study_day:
      source: ADT
      reference: TR01SDT
  submission:
    core: Perm
    mandatory: false
    length: 8
    display_format: '3.'
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: _DAYDIFF
  type: int
  derivation:
    diff:
      type: date
      start: TR01SDT
      end: ADT
      unit: day
- name: _ADTMY_S
  type: int
  derivation:
    case:
    - when: ADTM IS NOT NULL AND TR01SDTM IS NOT NULL
      then:
        diff:
          type: datetime
          start: TR01SDTM
          end: ADTM
          unit: second
    - when: ADT IS NOT NULL AND TR01SDT IS NOT NULL
      then: _DAYDIFF * 86400 - 86340
    - otherwise: 99999999
- name: _ADTMY
  type: int
  derivation: ABS(_ADTMY_S)
- name: _PREFL
  type: str
  derivation:
    case:
    - when: _ADTMY_S <= 0 AND TR01SDT IS NOT NULL
      then: '''Y'''
    - when: ADY = 1 AND TR01SDT IS NOT NULL AND TR01SDT = ADT
      then: '''Y'''
- name: _POSTFL
  type: str
  derivation:
    case:
    - when: _ADTMY_S > 0 AND TR01SDT IS NOT NULL AND _PREFL IS NULL
      then: '''Y'''
- name: _AVALN
  type: int
  derivation:
    case:
    - when: _MBSTRESC IS NOT NULL AND _MBSTRESC NOT IN ('')
      then: 1
    - otherwise: 0
- name: _UNS
  type: int
  derivation:
    case:
    - when: _POSTFL = 'Y' AND (str_contains(_VISIT, 'Uns') OR _VISIT IS NULL OR _VISIT IN ('') OR _VISITNUM IS NULL OR _VISITNUM NOT IN (5, 8))
      then: 1
    - otherwise: 0
- name: _VISIT_DAY
  type: str
  derivation:
    str_extract:
      source: _VISIT
      pattern: Day ([0-9]+)
      group: 1
      no_match: null
- name: VISIT
  type: str
  label: Visit Name
  derivation: MB.VISIT
  submission:
    core: Perm
    mandatory: false
    length: 28
    origins:
    - type: Predecessor
      description: MB.VISIT
- name: VISITNUM
