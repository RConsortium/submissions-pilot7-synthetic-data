  derivation: _MBTEST
  submission:
    core: Req
    mandatory: true
    length: 50
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: _AVALC_PROP
  type: str
  derivation:
    str_case:
      source: _MBSTRESC
      to: proper
- name: AVALC
  type: str
  label: Analysis Value (C)
  derivation:
    case:
    - when: _MBSTRESC IN ('NOT DETECTED', 'NOTDETECTED')
      then: '''Not Detected'''
    - otherwise: _AVALC_PROP
  submission:
    core: Perm
    mandatory: false
    length: 50
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: LOCALFL
  type: str
  label: Local Labs Flag
  derivation: _LOCALFL
  submission:
    core: Perm
    mandatory: false
    length: 1
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: LDTTYPE
  type: str
  label: Type of Diagnostic Test
  derivation: _LDTTYPE
  submission:
    core: Perm
    mandatory: false
    length: 200
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: LDTSTOTH
  type: str
  label: Diagnostic Test Other, Specify
  derivation: _LDTSTOTH
  submission:
    core: Perm
    mandatory: false
    length: 200
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: _BASE_RN
  type: int
  derivation:
    row_number:
      window: BASE_W
- name: ABLFL
  type: str
  label: Baseline Record Flag
  derivation:
    case:
    - when: _BASE_RN = 1 AND _AVALN = 1 AND _PREFL = 'Y' AND (LOCALFL IS NULL OR LOCALFL <> 'Y')
      then: '''Y'''
  submission:
    core: Perm
    mandatory: false
    length: 1
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: BASEC
  type: str
  label: Baseline Value (C)
  derivation:
    aggregate:
      filter: ABLFL = 'Y'
      group_by:
      - STUDYID
      - USUBJID
      - PARAMCD
      expr: ONLY(AVALC)
  submission:
    core: Perm
    mandatory: false
    length: 50
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: AVISIT
  type: str
  label: Analysis Visit
  derivation:
    case:
    - when: ABLFL = 'Y'
      then: '''Baseline'''
    - when: _UNS = 1 AND ADY IS NOT NULL AND ADY > 2 AND ADY <= 43
      then: '''Day 29'''
    - when: _UNS = 1 AND ADY IS NOT NULL AND ADY > 43 AND ADY <= 70
      then: '''Day 57'''
    - when: _UNS = 1 AND ADY IS NOT NULL AND ADY > 70
      then: '''Day 71 or Beyond'''
    - when: _POSTFL = 'Y' AND _UNS = 0 AND ADY IS NOT NULL AND ADY > 1 AND _VISIT_DAY IS NOT NULL
      then:
        str_template: Day {_VISIT_DAY}
    - when: _POSTFL = 'Y' AND _UNS = 0 AND ADY IS NOT NULL AND ADY > 1
      then: '''Day '''
  submission:
    core: Perm
    mandatory: false
    length: 50
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: AVISITN
  type: int
  label: Analysis Visit (N)
  derivation:
    mapping:
      source: AVISIT
      dict:
        Baseline: 1
        Day 15: 4
        Day 29: 5
        Day 43: 7
        Day 57: 8
        Day 71 or Beyond: 99
      unmapped: null
  submission:
    core: Perm
    mandatory: false
    length: 8
    display_format: '3.'
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: AWRANGE
  type: str
  label: Analysis Window Valid Relative Range
  derivation:
    mapping:
      source: AVISIT
      dict:
        Baseline: <=1 Pre-dose
        Day 29: Day 2 - Day 43
        Day 57: Day 44 - Day 70
        Day 71 or Beyond: '>= Day 71'
      unmapped: null
  submission:
    core: Perm
    mandatory: false
    length: 20
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: AWTARGET
  type: int
  label: Analysis Window Target
  derivation:
    mapping:
      source: AVISIT
      dict:
        Baseline: 1
        Day 15: 15
        Day 29: 29
        Day 57: 57
        Day 71 or Beyond: 71
      unmapped: null
  submission:
    core: Perm
    mandatory: false
    length: 8
    display_format: '3.'
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: AWTDIFF
  type: int
  label: Analysis Window Diff from Target
  derivation:
    case:
    - when: AWTARGET IS NOT NULL AND ADY IS NOT NULL
      then: ABS(ADY - AWTARGET)
  submission:
    core: Perm
    mandatory: false
    length: 8
    display_format: '3.'
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: _AWTDIFF
  type: int
  derivation:
    case:
    - when: _POSTFL = 'Y' AND _UNS = 1
      then: AWTDIFF
    - when: _POSTFL = 'Y'
      then: 0
    - otherwise: 99999999
- name: _ANL01_RN
  type: int
  derivation:
    row_number:
      window: ANL01_W
- name: ANL01FL
  type: str
  label: Analysis Flag 01
  derivation:
    case:
    - when: (_ANL01_RN = 1 AND AVISITN IS NOT NULL AND _POSTFL = 'Y' AND _AVALN = 1 AND (LOCALFL IS NULL OR LOCALFL <> 'Y')) OR ABLFL = 'Y'
      then: '''Y'''
  submission:
    core: Perm
    mandatory: false
    length: 1
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: _DOSE
  type: str
  derivation:
    case:
    - when: ADTM IS NOT NULL AND DOS2DTM IS NOT NULL AND ADTM >= DOS2DTM
      then: '''Vaccination 2'''
    - when: (ADTM IS NULL OR DOS2DTM IS NULL) AND ADT IS NOT NULL AND DOSE2DT IS NOT NULL AND ADT >= DOSE2DT
      then: '''Vaccination 2'''
    - when: TR01SDTM IS NOT NULL AND ADTM IS NOT NULL AND DOS2DTM IS NOT NULL AND TR01SDTM <= ADTM AND ADTM < DOS2DTM
      then: '''Vaccination 1'''
    - when: TR01SDTM IS NOT NULL AND ADTM IS NOT NULL AND DOS2DTM IS NULL AND TR01SDTM <= ADTM
      then: '''Vaccination 1'''
    - when: (TR01SDTM IS NULL OR ADTM IS NULL) AND TR01SDT IS NOT NULL AND ADT IS NOT NULL AND DOSE2DT IS NOT NULL AND TR01SDT <= ADT AND ADT < DOSE2DT
      then: '''Vaccination 1'''
    - when: (TR01SDTM IS NULL OR ADTM IS NULL) AND TR01SDT IS NOT NULL AND ADT IS NOT NULL AND DOSE2DT IS NULL AND TR01SDT <= ADT
      then: '''Vaccination 1'''
- name: _EX1_TXT_C
  type: str
  derivation:
    str_replace:
      source: EX_DOSE1.EXDOSTXT
      pattern: ' '
      replacement: ''
- name: _EX2_TXT_C
  type: str
  derivation:
    str_replace:
      source: EX_DOSE2.EXDOSTXT
      pattern: ' '
      replacement: ''
- name: TRTA
  type: str
  label: Actual Treatment
  derivation:
    case:
    - when: _DOSE = 'Vaccination 1' AND EX_DOSE1.EXTRT = 'PLACEBO'
      then: '''Placebo'''
    - when: _DOSE = 'Vaccination 1' AND str_contains(EX_DOSE1.EXTRT, 'mRNA-1273') AND EX_DOSE1.EXDOSE IS NOT NULL AND 0 < EX_DOSE1.EXDOSE AND EX_DOSE1.EXDOSE <= 75
      then: '''mRNA-1273 50 ug'''
    - when: _DOSE = 'Vaccination 1' AND str_contains(EX_DOSE1.EXTRT, 'mRNA-1273') AND EX_DOSE1.EXDOSE IS NOT NULL AND EX_DOSE1.EXDOSE > 75
      then: '''mRNA-1273 100 ug'''
    - when: _DOSE = 'Vaccination 1' AND str_contains(EX_DOSE1.EXTRT, 'mRNA-1273') AND EX_DOSE1.EXDOSTXT IN ('>0-25', '>25-<50', '>50-75')
      then: '''mRNA-1273 50 ug'''
    - when: _DOSE = 'Vaccination 1' AND str_contains(EX_DOSE1.EXTRT, 'mRNA-1273') AND _EX1_TXT_C IN ('>75-<100', '>75-100', '>100-125', '>125', '>125orabove')
      then: '''mRNA-1273 100 ug'''
    - when: _DOSE = 'Vaccination 2' AND EX_DOSE2.EXTRT = 'PLACEBO'
      then: '''Placebo'''
    - when: _DOSE = 'Vaccination 2' AND str_contains(EX_DOSE2.EXTRT, 'mRNA-1273') AND EX_DOSE2.EXDOSE IS NOT NULL AND 0 < EX_DOSE2.EXDOSE AND EX_DOSE2.EXDOSE <= 75
      then: '''mRNA-1273 50 ug'''
    - when: _DOSE = 'Vaccination 2' AND str_contains(EX_DOSE2.EXTRT, 'mRNA-1273') AND EX_DOSE2.EXDOSE IS NOT NULL AND EX_DOSE2.EXDOSE > 75
      then: '''mRNA-1273 100 ug'''
    - when: _DOSE = 'Vaccination 2' AND str_contains(EX_DOSE2.EXTRT, 'mRNA-1273') AND EX_DOSE2.EXDOSTXT IN ('>0-25', '>25-<50', '>50-75')
      then: '''mRNA-1273 50 ug'''
    - when: _DOSE = 'Vaccination 2' AND str_contains(EX_DOSE2.EXTRT, 'mRNA-1273') AND _EX2_TXT_C IN ('>75-<100', '>75-100', '>100-125', '>125', '>125orabove')
      then: '''mRNA-1273 100 ug'''
  submission:
    core: Perm
    mandatory: false
    length: 50
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: TRTAN
  type: int
  label: Actual Treatment (N)
  derivation:
    mapping:
      source: TRTA
      dict:
        Placebo: 1
        mRNA-1273 50 ug: 2
        mRNA-1273 100 ug: 3
      unmapped: null
  submission:
    core: Perm
    mandatory: false
    length: 8
    display_format: '3.'
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
