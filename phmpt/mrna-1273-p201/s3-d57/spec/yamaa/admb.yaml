# ADMB for Moderna mRNA-1273-P201, data cut d57 (cutoff 2020-11-05).
# Parent: ../../../spec/yamaa/base/adam-base.yaml (section 3.1 core columns).
# Derivations implement the d57 A20ADMB program (prototype
# spec/yamaa/tools/admb_proto.py matches all 83 submitted columns on all
# 37,626 rows). Where the SAS code and the define.xml method text disagree,
# the code is followed (see README.md).
# Inputs: MB + SUPPMB + EX (SDTM) + ADSL (core columns). SUPPMB is pivoted
# for LOCALFL/LDTTYPE/LDTSTOTH by (USUBJID, MBSEQ); its other QNAMs
# (CNVRESC, CNVNRLO, RPTRTYP) are unused. MB has no SUBJID column in this
# SDTM extract, so ADMB.SUBJID comes from ADSL. Row accounting: MB 37,763
# rows -> filter (MBSTAT missing, MBTESTCD non-missing) 37,647 -> merge with
# ADSL on USUBJID drops 21 -> 37,626 submitted rows. Keys are
# [STUDYID, USUBJID, MBSEQ] (unique).
yamaa: '1.0'
type: spec
model: ADaM
parent: ../../../spec/yamaa/base/adam-base.yaml
domain: ADMB
keys:
- STUDYID
- USUBJID
- MBSEQ
input:
  MB: <sdtm-dir>/mb.parquet
  SUPPMB: <sdtm-dir>/suppmb.parquet
  EX: <sdtm-dir>/ex.parquet
  ADSL:
    path: <adam-dir>/adsl.parquet
    key:
    - STUDYID
    - USUBJID
submission:
  label: Microbiology Analysis Dataset
  class: BASIC DATA STRUCTURE
  structure: One or more records per subject per analysis parameter per analysis timepoint
  repeating: true
rows:
- id: mb_rows
  dataset: MB
  derivations:
    STUDYID: MB.STUDYID
    USUBJID: MB.USUBJID
    _MBSEQ: MB.MBSEQ
    _MBSTAT: MB.MBSTAT
    _MBTESTCD: MB.MBTESTCD
    _MBCAT: MB.MBCAT
    _MBTEST: MB.MBTEST
    _MBSCAT: MB.MBSCAT
    _MBNAM: MB.MBNAM
    _MBSPEC: MB.MBSPEC
    _MBMETHOD: MB.MBMETHOD
    _MBSTRESC: MB.MBSTRESC
    _MBDTC: MB.MBDTC
    _VISIT: MB.VISIT
    _VISITNUM: MB.VISITNUM
    _LOCALFL: SUPP_P.LOCALFL
    _LDTTYPE: SUPP_P.LDTTYPE
    _LDTSTOTH: SUPP_P.LDTSTOTH
  filter: (_MBSTAT IS NULL OR _MBSTAT IN ('')) AND _MBTESTCD IS NOT NULL AND _MBTESTCD NOT IN ('') AND _ADSL IS NOT NULL
intermediates:
- id: SUPP_P
  dataset: SUPPMB
  key:
    STUDYID: STUDYID
    USUBJID: USUBJID
    IDVARVAL:
      str_decimal:
        source: _MBSEQ
        decimals: 0
  filter: SUPPMB.QNAM IN ('LOCALFL', 'LDTTYPE', 'LDTSTOTH') AND SUPPMB.IDVAR = 'MBSEQ'
  pivot:
    name: QNAM
    value: QVAL
    fields:
    - LOCALFL
    - LDTTYPE
    - LDTSTOTH
- id: EX_DOSE1
  dataset: EX
  key:
  - STUDYID
  - USUBJID
  filter: EX.EXSTDTC IS NOT NULL AND EX.VISITDY = 1
  order_by:
  - EX.EXSTDTC
  keep: first
- id: EX_DOSE2
  dataset: EX
  key:
  - STUDYID
  - USUBJID
  filter: EX.EXSTDTC IS NOT NULL AND EX.VISITDY = 29
  order_by:
  - EX.EXSTDTC
  keep: first
windows:
  BASE_W:
    group_by:
    - STUDYID
    - USUBJID
    - PARAMCD
    order_by:
    - variable: _AVALN
      direction: desc
    - LOCALFL
    - _POSTFL
    - variable: ADY
      direction: desc
    - variable: MBSEQ
      direction: desc
  ANL01_W:
    group_by:
    - STUDYID
    - USUBJID
    - PARAMCD
    - AVISITN
    order_by:
    - variable: _POSTFL
      direction: desc
    - variable: _AVALN
      direction: desc
    - LOCALFL
    - _UNS
    - _AWTDIFF
    - variable: ADY
      direction: desc
    - variable: _ADTMY
      direction: desc
    - variable: MBSEQ
      direction: desc
columns:
- name: _ADSL
  type: str
  derivation: ADSL.USUBJID
- name: ARM
  derivation: null
- name: ACTARM
  derivation: null
- name: STUDYID
  submission:
    origins:
    - type: Predecessor
      description: MB.STUDYID
- name: USUBJID
  submission:
    origins:
    - type: Predecessor
