- name: PPBD29FL
  type: str
  label: Per Protocol bAb Day 29 Flag
  derivation: ADSL.PPBD29FL
  submission:
    core: Req
    mandatory: true
    length: 1
    origins:
    - type: Predecessor
      description: ADSL.PPBD29FL
- name: PPBD57FL
  type: str
  label: Per Protocol bAb Day 57 Flag
  derivation: ADSL.PPBD57FL
  submission:
    core: Req
