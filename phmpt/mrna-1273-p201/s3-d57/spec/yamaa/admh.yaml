- name: PPND57FL
  type: str
  label: Per Protocol nAb Day 57 Flag
  derivation: ADSL.PPND57FL
  submission:
    core: Req
    mandatory: true
    length: 1
    origins:
    - type: Predecessor
      description: ADSL.PPND57FL
- name: SAR1FL
  derivation: ADSL.SAR1FL
  submission:
    origins:
    - type: Predecessor
      description: ADSL.SAR1FL
- name: SAR2FL
  derivation: ADSL.SAR2FL
  submission:
    origins:
    - type: Predecessor
      description: ADSL.SAR2FL
- name: SARAFL
  derivation: ADSL.SARAFL
  submission:
    origins:
    - type: Predecessor
      description: ADSL.SARAFL
- name: FASNA2FL
  derivation: ADSL.FASNA2FL
