# ADMH for Moderna mRNA-1273-P201, data cut d57 (cutoff 2020-11-05).
# Parent: ../../../spec/yamaa/base/adam-base.yaml (section 3.1 core columns).
# Derivations implement the d57 A20ADMH program; the row rule is the
# (STUDYID, USUBJID, SUBJID) ADSL join (see README.md): re-screened
# subjects' previous-screening MH rows carry the old SUBJID and drop out.
# MHSTDY is a string and MHENDY a float in the submitted data despite
# integer define types; lengths match the observed maxima (see README.md).
yamaa: '1.0'
type: spec
model: ADaM
parent: ../../../spec/yamaa/base/adam-base.yaml
domain: ADMH
keys:
- STUDYID
- USUBJID
- MHSEQ
input:
  MH: <sdtm-dir>/mh.parquet
  ADSL:
    path: <adam-dir>/adsl.parquet
    key:
    - STUDYID
    - USUBJID
    - SUBJID
submission:
  label: Medical Hisotry Analysis Dataset
  class: OCCURRENCE DATA STRUCTURE
  structure: One record per subject per medical history
  repeating: true
rows:
- id: events
  dataset: MH
  filter: _ADSL IS NOT NULL
columns:
- name: _ADSL
  type: str
  derivation: ADSL.USUBJID
- name: ARM
  derivation: null
- name: ACTARM
  derivation: null
- name: STUDYID
  derivation: MH.STUDYID
  submission:
    origins:
    - type: Predecessor
      description: MH.STUDYID
- name: USUBJID
  derivation: MH.USUBJID
  submission:
    origins:
    - type: Predecessor
      description: MH.USUBJID
- name: SUBJID
  derivation: MH.SUBJID
  submission:
    origins:
    - type: Predecessor
      description: MH.SUBJID
- name: SITEID
  derivation: ADSL.SITEID
  submission:
    origins:
    - type: Predecessor
      description: ADSL.SITEID
- name: COUNTRY
  derivation: ADSL.COUNTRY
  submission:
    origins:
    - type: Predecessor
      description: ADSL.COUNTRY
- name: AGE
  derivation: ADSL.AGE
  submission:
    origins:
    - type: Predecessor
      description: ADSL.AGE
- name: AGEU
  derivation: ADSL.AGEU
  submission:
    origins:
    - type: Predecessor
      description: ADSL.AGEU
- name: AGEGR1
  type: str
  label: Pooled Age Group 1
  derivation: ADSL.AGEGR1
  submission:
    core: Req
    mandatory: true
    length: 30
    origins:
    - type: Predecessor
      description: ADSL.AGEGR1
- name: AGEGR1N
  type: int
  label: Pooled Age Group 1 (N)
  derivation: ADSL.AGEGR1N
  submission:
    core: Req
    mandatory: true
    length: 8
    display_format: '3.'
    origins:
    - type: Predecessor
      description: ADSL.AGEGR1N
- name: AGEGR2
  type: str
  label: Pooled Age Group 2
  derivation: ADSL.AGEGR2
  submission:
    core: Req
    mandatory: true
    length: 19
    origins:
    - type: Predecessor
      description: ADSL.AGEGR2
- name: AGEGR2N
  type: int
  label: Pooled Age Group 2 (N)
  derivation: ADSL.AGEGR2N
  submission:
    core: Req
    mandatory: true
    length: 8
    display_format: '3.'
    origins:
    - type: Predecessor
      description: ADSL.AGEGR2N
- name: SEX
  derivation: ADSL.SEX
  submission:
    origins:
    - type: Predecessor
      description: ADSL.SEX
- name: RACE
  derivation: ADSL.RACE
  submission:
    origins:
    - type: Predecessor
      description: ADSL.RACE
- name: RACESPY
  type: str
  label: Race Specify
  derivation: ADSL.RACESPY
  submission:
    core: Perm
    mandatory: false
    length: 200
    origins:
    - type: Predecessor
      description: ADSL.RACESPY
- name: ETHNIC
  derivation: ADSL.ETHNIC
  submission:
    origins:
    - type: Predecessor
      description: ADSL.ETHNIC
- name: RANDFL
  derivation: ADSL.RANDFL
  submission:
    origins:
    - type: Predecessor
      description: ADSL.RANDFL
- name: SAFFL
  derivation: ADSL.SAFFL
