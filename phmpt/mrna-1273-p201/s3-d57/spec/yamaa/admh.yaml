      description: MH.MHSEQ
- name: MHCAT
  type: str
  label: Category for Medical History
  derivation: MH.MHCAT
  submission:
    core: Perm
    mandatory: true
    length: 7
    origins:
    - type: Predecessor
      description: MH.MHCAT
- name: MHTERM
  type: str
  label: Reported Term for the Medical History
  derivation: MH.MHTERM
  submission:
    core: Req
    mandatory: true
    length: 74
    origins:
    - type: Predecessor
      description: MH.MHTERM
- name: MHBODSYS
  type: str
  label: Body System or Organ Class
  derivation: MH.MHBODSYS
  submission:
    core: Perm
    mandatory: true
    length: 67
    origins:
    - type: Predecessor
      description: MH.MHBODSYS
- name: MHDECOD
  type: str
  label: Dictionary-Derived Term
  derivation: MH.MHDECOD
  submission:
    core: Perm
    mandatory: true
    length: 40
    origins:
    - type: Predecessor
      description: MH.MHDECOD
- name: MHSTDTC
  type: str
  label: Start Date/Time of Medical History Event
  derivation: MH.MHSTDTC
  submission:
    core: Req
    mandatory: false
