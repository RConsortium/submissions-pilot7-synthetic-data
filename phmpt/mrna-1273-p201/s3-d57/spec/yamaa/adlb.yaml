# ADLB for Moderna mRNA-1273-P201, data cut d57 (cutoff 2020-11-05).
# Parent: ../../../spec/yamaa/base/adam-base.yaml (section 3.1 core columns).
# Derivations implement the d57 A20ADLB program (prototype
# spec/yamaa/tools/adlb_proto.py matches all 109 submitted columns on all
# 36,791 rows). Where the SAS code and the define.xml method text disagree,
# the code is followed (see README.md): AWRANGE/AVISITN cover only
# Baseline/Day 29/Day 57 (define lists Day 1/8/15/36/43 too); PARAM HCG
# matches lbmethod=:'ELE'/'CHEM' (define method text is vaguer).
# Inputs: LB + SV + EX (SDTM) + ADSL (core columns). SUPPLB is NOT an input:
# %revsupp adds only unused QNAMs. The SUBJID join is load-bearing: 979
# filtered LB rows have a USUBJID in ADSL but a mismatched SUBJID
# (re-screened subjects) and must drop.
yamaa: '1.0'
type: spec
model: ADaM
parent: ../../../spec/yamaa/base/adam-base.yaml
domain: ADLB
keys:
- STUDYID
- USUBJID
- LBSEQ
input:
  LB: <sdtm-dir>/lb.parquet
  SV: <sdtm-dir>/sv.parquet
  EX: <sdtm-dir>/ex.parquet
  ADSL:
    path: <adam-dir>/adsl.parquet
    key:
    - STUDYID
    - USUBJID
    - SUBJID
submission:
  label: Laboratory Analysis Dataset
  class: BASIC DATA STRUCTURE
  structure: One or more records per subject per analysis parameter per analysis timepoint
  repeating: true
rows:
- id: lb_rows
  dataset: LB
  derivations:
    STUDYID: LB.STUDYID
    USUBJID: LB.USUBJID
    _SUBJID: LB.SUBJID
    _LBSEQ: LB.LBSEQ
    _LBSTAT: LB.LBSTAT
    _LBTESTCD: LB.LBTESTCD
    _LBCAT: LB.LBCAT
    _LBTEST: LB.LBTEST
    _LBMETHOD: LB.LBMETHOD
    _LBSTRESU: LB.LBSTRESU
    _LBSTRESC: LB.LBSTRESC
    _LBSTRESN: LB.LBSTRESN
    _LBNRIND: LB.LBNRIND
    _LBSTNRLO: LB.LBSTNRLO
    _LBSTNRHI: LB.LBSTNRHI
    _LBORRES: LB.LBORRES
    _LBORRESU: LB.LBORRESU
    _LBORNRLO: LB.LBORNRLO
    _LBORNRHI: LB.LBORNRHI
    _LBTOXGR: LB.LBTOXGR
    _LBDTC: LB.LBDTC
    _VISIT: LB.VISIT
    _VISITNUM: LB.VISITNUM
    _SVSTDTC4: SV4.SVSTDTC
    _SVSTDTC7: SV7.SVSTDTC
  filter: (_LBSTAT IS NULL OR _LBSTAT IN ('')) AND _LBTESTCD IS NOT NULL AND _LBTESTCD NOT IN ('') AND _ADSL IS NOT NULL
intermediates:
- id: SV4
  dataset: SV
  key:
    STUDYID: STUDYID
    USUBJID: USUBJID
    SUBJID: _SUBJID
  filter: str_contains(SV.VISIT, 'Visit 4') AND SV.SVSTDTC IS NOT NULL AND SV.SVSTDTC NOT IN ('') AND SV.VISITDY IS NOT NULL
  order_by:
  - SV.SVSTDTC
  keep: first
- id: SV7
  dataset: SV
  key:
    STUDYID: STUDYID
    USUBJID: USUBJID
    SUBJID: _SUBJID
  filter: str_contains(SV.VISIT, 'Visit 7 ') AND SV.SVSTDTC IS NOT NULL AND SV.SVSTDTC NOT IN ('') AND SV.VISITDY IS NOT NULL
  order_by:
  - SV.SVSTDTC
  keep: first
- id: EX_DOSE1
  dataset: EX
  key:
  - STUDYID
  - USUBJID
  filter: EX.EXSTDTC IS NOT NULL AND EX.VISITDY = 1
  order_by:
  - EX.EXSTDTC
  keep: first
- id: EX_DOSE2
  dataset: EX
  key:
  - STUDYID
  - USUBJID
  filter: EX.EXSTDTC IS NOT NULL AND EX.VISITDY = 29
  order_by:
  - EX.EXSTDTC
  keep: first
windows:
  ANL01_W:
    group_by:
    - STUDYID
    - USUBJID
    - PARAMCD
    - AVISITN
    order_by:
    - variable: _POSTFL
      direction: desc
    - variable: _AVALN
      direction: desc
    - _UNS
    - _AWTDIFF
    - variable: _ADTMY
      direction: desc
    - variable: LBSEQ
      direction: desc
  ANL02_W:
    group_by:
    - STUDYID
    - USUBJID
    - PARAMCD
    order_by:
    - variable: _POSTFL
      direction: desc
    - ASTAGEN
    - variable: ATOXGRLN
      direction: desc
    - AVISITN
    - VISITNUM
    - ADT
    - ADTM
    - _ADTMY
    - LBSEQ
  ANL03_W:
    group_by:
    - STUDYID
    - USUBJID
    - PARAMCD
    order_by:
    - variable: _POSTFL
      direction: desc
    - ASTAGEN
    - variable: ATOXGRHN
      direction: desc
    - AVISITN
    - VISITNUM
    - ADT
    - ADTM
    - _ADTMY
    - LBSEQ
