- name: AWRANGE
  type: str
  label: Analysis Window Valid Relative Range
  derivation:
    mapping:
      source: AVISIT
      dict:
        Baseline: <=1 Pre-dose
        Day 29: Day 2 - Day 43
        Day 57: '>= Day 44'
      unmapped: null
  submission:
