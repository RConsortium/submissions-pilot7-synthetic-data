- name: _EX1_TXT_C
  type: str
  derivation:
    str_replace:
      source: EX_DOSE1.EXDOSTXT
      pattern: ' '
      replacement: ''
- name: _EX2_TXT_C
  type: str
  derivation:
    str_replace:
      source: EX_DOSE2.EXDOSTXT
      pattern: ' '
      replacement: ''
- name: TRTA
  type: str
  label: Actual Treatment
  derivation:
    case:
    - when: MDOSREF = 'Vaccination 1' AND EX_DOSE1.EXTRT = 'PLACEBO'
      then: '''Placebo'''
    - when: MDOSREF = 'Vaccination 1' AND str_contains(EX_DOSE1.EXTRT, 'mRNA-1273') AND EX_DOSE1.EXDOSE IS NOT NULL AND 0 < EX_DOSE1.EXDOSE AND EX_DOSE1.EXDOSE <= 75
      then: '''mRNA-1273 50 ug'''
    - when: MDOSREF = 'Vaccination 1' AND str_contains(EX_DOSE1.EXTRT, 'mRNA-1273') AND EX_DOSE1.EXDOSE IS NOT NULL AND EX_DOSE1.EXDOSE > 75
      then: '''mRNA-1273 100 ug'''
    - when: MDOSREF = 'Vaccination 1' AND str_contains(EX_DOSE1.EXTRT, 'mRNA-1273') AND EX_DOSE1.EXDOSTXT IN ('50 ug', '50ug', '50 ug (2 doses of 25 ug)')
      then: '''mRNA-1273 50 ug'''
    - when: MDOSREF = 'Vaccination 1' AND str_contains(EX_DOSE1.EXTRT, 'mRNA-1273') AND _EX1_TXT_C IN ('100ug', '100ug(2dosesof50ug)')
      then: '''mRNA-1273 100 ug'''
    - when: MDOSREF = 'Vaccination 2' AND EX_DOSE2.EXTRT = 'PLACEBO'
      then: '''Placebo'''
    - when: MDOSREF = 'Vaccination 2' AND str_contains(EX_DOSE2.EXTRT, 'mRNA-1273') AND EX_DOSE2.EXDOSE IS NOT NULL AND 0 < EX_DOSE2.EXDOSE AND EX_DOSE2.EXDOSE <= 75
      then: '''mRNA-1273 50 ug'''
    - when: MDOSREF = 'Vaccination 2' AND str_contains(EX_DOSE2.EXTRT, 'mRNA-1273') AND EX_DOSE2.EXDOSE IS NOT NULL AND EX_DOSE2.EXDOSE > 75
      then: '''mRNA-1273 100 ug'''
    - when: MDOSREF = 'Vaccination 2' AND str_contains(EX_DOSE2.EXTRT, 'mRNA-1273') AND EX_DOSE2.EXDOSTXT IN ('50 ug', '50ug', '50 ug (2 doses of 25 ug)')
      then: '''mRNA-1273 50 ug'''
    - when: MDOSREF = 'Vaccination 2' AND str_contains(EX_DOSE2.EXTRT, 'mRNA-1273') AND _EX2_TXT_C IN ('100ug', '100ug(2dosesof50ug)')
      then: '''mRNA-1273 100 ug'''
  submission:
    core: Perm
    mandatory: false
    length: 50
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: TRTAN
  type: int
  label: Actual Treatment (N)
  derivation:
    mapping:
      source: TRTA
      dict:
        Placebo: 1
        mRNA-1273 50 ug: 2
        mRNA-1273 100 ug: 3
      unmapped: null
  submission:
    core: Perm
    mandatory: false
    length: 8
    display_format: '3.'
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
