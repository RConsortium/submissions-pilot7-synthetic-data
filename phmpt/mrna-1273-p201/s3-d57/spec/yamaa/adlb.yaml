      source: _LBDTC
  submission:
    core: Req
    mandatory: true
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: ADTM
  type: datetime
  label: Analysis Datetime
  derivation:
    case:
    - when: str_contains(_LBDTC, 'T')
      then:
        impute:
          type: datetime
          source: _LBDTC
          time: first
  submission:
    core: Perm
    mandatory: false
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: ATM
  type: time
  label: Analysis Time
  derivation:
    to_time:
      source: ADTM
  submission:
    core: Perm
    mandatory: false
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: ADY
  type: int
  label: Analysis Relative Day
  derivation:
    study_day:
      source: ADT
      reference: TR01SDT
  submission:
    core: Req
    mandatory: true
    length: 8
    display_format: '3.'
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: _DAYDIFF
  type: int
  derivation:
    diff:
      type: date
      start: TR01SDT
      end: ADT
      unit: day
- name: _ADTMY_S
  type: int
  derivation:
    case:
    - when: ADTM IS NOT NULL AND TR01SDTM IS NOT NULL
      then:
        diff:
          type: datetime
          start: TR01SDTM
          end: ADTM
          unit: second
    - when: ADT IS NOT NULL AND TR01SDT IS NOT NULL
      then: _DAYDIFF * 86400 - 86340
    - otherwise: 99999999
- name: _ADTMY
  type: int
  derivation: ABS(_ADTMY_S)
- name: _PREFL
  type: str
  derivation:
    case:
    - when: _ADTMY_S <= 0 AND TR01SDT IS NOT NULL
      then: '''Y'''
- name: _POSTFL
  type: str
  derivation:
    case:
    - when: _ADTMY_S > 0 AND TR01SDT IS NOT NULL
      then: '''Y'''
- name: MDOSREF
  type: str
  label: Most Recent Dose Reference
  derivation:
    case:
    - when: TR01SDTM IS NOT NULL AND ADTM IS NOT NULL AND DOS2DTM IS NOT NULL AND TR01SDTM <= ADTM AND ADTM <= DOS2DTM
      then: '''Vaccination 1'''
    - when: DOSE2DT IS NULL AND TR01SDTM IS NOT NULL AND ADTM IS NOT NULL AND TR01SDTM <= ADTM
      then: '''Vaccination 1'''
    - when: (TR01SDTM IS NULL OR ADTM IS NULL) AND TR01SDT IS NOT NULL AND ADT IS NOT NULL AND DOSE2DT IS NOT NULL AND TR01SDT <= ADT AND ADT <= DOSE2DT
      then: '''Vaccination 1'''
    - when: (TR01SDTM IS NULL OR ADTM IS NULL) AND DOSE2DT IS NULL AND TR01SDT IS NOT NULL AND ADT IS NOT NULL AND TR01SDT <= ADT
      then: '''Vaccination 1'''
    - when: (DOS2DTM IS NOT NULL AND ADTM IS NOT NULL AND DOS2DTM < ADTM) OR (ADTM IS NULL AND DOSE2DT IS NOT NULL AND ADT IS NOT NULL AND DOSE2DT < ADT)
      then: '''Vaccination 2'''
  submission:
    core: Perm
    mandatory: false
    length: 25
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: MRDDY
  type: int
  label: Relative Day from Most Recent Dose
  derivation:
    case:
    - when: MDOSREF = 'Vaccination 1'
      then: ADY
    - when: MDOSREF = 'Vaccination 2'
      then:
        study_day:
          source: ADT
          reference: DOSE2DT
  submission:
    core: Perm
    mandatory: false
    length: 8
    display_format: '3.'
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: VISIT
  type: str
  label: Visit Name
  derivation: LB.VISIT
  submission:
    core: Perm
    mandatory: false
    length: 28
    origins:
    - type: Predecessor
      description: LB.VISIT
- name: VISITNUM
  type: float
  label: Visit Number
  derivation: LB.VISITNUM
  submission:
    core: Perm
    mandatory: false
    length: 8
    significant_digits: 15
    origins:
    - type: Predecessor
      description: LB.VISITNUM
- name: PARCAT1
  type: str
  label: Parameter Category 1
  derivation: _LBCAT
  submission:
    core: Req
    mandatory: true
    length: 50
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: PARAMCD
  type: str
  label: Parameter Code
  derivation:
    case:
    - when: _LBCAT = 'CHEMISTRY' AND _LBTESTCD = 'HCG' AND str_contains(_LBMETHOD, '^ELE')
      then: '''ECLIAHCG'''
    - when: _LBCAT = 'CHEMISTRY' AND _LBTESTCD = 'HCG' AND str_contains(_LBMETHOD, '^CHEM')
      then: '''CHEMIHCG'''
    - when: _LBCAT = 'URINALYSIS'
      then:
        str_template: U{_LBTESTCD}
    - otherwise: _LBTESTCD
  submission:
    core: Req
    mandatory: true
    length: 8
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: PARAM
  type: str
  label: Parameter
  derivation:
    case:
    - when: _LBCAT = 'CHEMISTRY' AND _LBTESTCD = 'HCG' AND _LBSTRESU IS NOT NULL AND _LBSTRESU NOT IN ('')
      then:
        str_template: '{_LBMETHOD} {_LBTEST} ({_LBSTRESU})'
    - when: _LBCAT = 'CHEMISTRY' AND _LBTESTCD = 'HCG'
      then:
        str_template: '{_LBMETHOD} {_LBTEST}'
    - when: _LBCAT = 'URINALYSIS' AND _LBSTRESU IS NOT NULL AND _LBSTRESU NOT IN ('')
      then:
        str_template: Urinary {_LBTEST} ({_LBSTRESU})
    - when: _LBCAT = 'URINALYSIS'
      then:
        str_template: Urinary {_LBTEST}
    - when: _LBSTRESU IS NOT NULL AND _LBSTRESU NOT IN ('')
