- name: CRIT1FL
  type: str
  label: Criterion 1 Evaluation Result Flag
  derivation:
    case:
    - when: PARAMCD = 'ALP' AND AVAL IS NOT NULL AND ANRHI IS NOT NULL AND ANRHI <> 0 AND AVAL / ANRHI < 2
      then: '''Y'''
    - when: PARAMCD = 'BILI' AND AVAL IS NOT NULL AND ANRHI IS NOT NULL AND ANRHI <> 0 AND AVAL / ANRHI >= 2
      then: '''Y'''
    - when: PARAMCD IN ('ALT', 'AST') AND AVAL IS NOT NULL AND ANRHI IS NOT NULL AND ANRHI <> 0 AND AVAL / ANRHI > 3
      then: '''Y'''
  submission:
    core: Perm
    mandatory: false
    length: 1
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: CRIT1
  type: str
  label: Analysis Criterion 1
  derivation:
    case:
    - when: PARAMCD = 'ALP' AND AVAL IS NOT NULL AND ANRHI IS NOT NULL AND ANRHI <> 0 AND AVAL / ANRHI < 2
      then: '''ALP <2 x ULN'''
    - when: PARAMCD = 'BILI' AND AVAL IS NOT NULL AND ANRHI IS NOT NULL AND ANRHI <> 0 AND AVAL / ANRHI >= 2
      then: '''BILI >=2 x ULN'''
    - when: PARAMCD = 'ALT' AND AVAL IS NOT NULL AND ANRHI IS NOT NULL AND ANRHI <> 0 AND AVAL / ANRHI > 3
      then: '''ALT >3 x ULN'''
    - when: PARAMCD = 'AST' AND AVAL IS NOT NULL AND ANRHI IS NOT NULL AND ANRHI <> 0 AND AVAL / ANRHI > 3
      then: '''AST >3 x ULN'''
  submission:
