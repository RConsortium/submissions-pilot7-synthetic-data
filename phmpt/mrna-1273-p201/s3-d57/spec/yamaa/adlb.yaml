- name: _SV4D
  type: date
  derivation:
    to_date:
      source: _SVSTDTC4
- name: _SV7D
  type: date
  derivation:
    to_date:
      source: _SVSTDTC7
- name: _ASTAGE_GATE
  type: str
  derivation:
    case:
    - when: RANDFL = 'Y' AND ADT IS NOT NULL AND TR01SDTM IS NOT NULL AND ADT >= TR01SDT
      then: '''Y'''
- name: _ENDDATE
  type: date
  derivation:
    case:
    - when: DOSE1FL = 'Y' AND DOSE2FL = 'Y' AND _EOSDT IS NOT NULL AND _SV7D IS NOT NULL AND _DTHDT IS NOT NULL
      then:
        least:
          sources:
          - _EOSDT
          - _SV7D
          - _DTHDT
    - when: DOSE1FL = 'Y' AND DOSE2FL = 'Y' AND _EOSDT IS NOT NULL AND _SV7D IS NOT NULL AND _DTHDT IS NULL
      then:
        least:
          sources:
          - _EOSDT
          - _SV7D
    - when: DOSE1FL = 'Y' AND DOSE2FL = 'Y' AND _EOSDT IS NOT NULL AND _SV7D IS NULL AND _DTHDT IS NULL
      then: _EOSDT
    - when: DOSE1FL = 'Y' AND DOSE2FL = 'Y' AND _EOSDT IS NULL AND _SV7D IS NOT NULL AND _DTHDT IS NULL
      then: _SV7D
    - when: DOSE1FL = 'Y' AND (DOSE2FL IS NULL OR DOSE2FL <> 'Y') AND _EOSDT IS NOT NULL AND _SV4D IS NOT NULL AND _DTHDT IS NOT NULL
      then:
        least:
          sources:
          - _EOSDT
          - _SV4D
          - _DTHDT
    - when: DOSE1FL = 'Y' AND (DOSE2FL IS NULL OR DOSE2FL <> 'Y') AND _EOSDT IS NOT NULL AND _SV4D IS NOT NULL AND _DTHDT IS NULL
      then:
        least:
          sources:
          - _EOSDT
          - _SV4D
    - when: DOSE1FL = 'Y' AND (DOSE2FL IS NULL OR DOSE2FL <> 'Y') AND _EOSDT IS NOT NULL AND _SV4D IS NULL AND _DTHDT IS NULL
      then: _EOSDT
    - when: DOSE1FL = 'Y' AND (DOSE2FL IS NULL OR DOSE2FL <> 'Y') AND _EOSDT IS NULL AND _SV4D IS NOT NULL AND _DTHDT IS NULL
      then: _SV4D
- name: ASTAGE
  type: str
  label: Stage
  derivation:
    case:
    - when: _ASTAGE_GATE = 'Y' AND DOSE1FL = 'Y' AND DOSE2FL = 'Y' AND _ENDDATE IS NULL AND _POSTFL = 'Y'
      then: '''Vaccination stage'''
    - when: _ASTAGE_GATE = 'Y' AND DOSE1FL = 'Y' AND DOSE2FL = 'Y' AND _SV7D IS NOT NULL AND ADT > _SV7D
      then: '''Follow up stage'''
    - when: _ASTAGE_GATE = 'Y' AND DOSE1FL = 'Y' AND DOSE2FL = 'Y' AND TR01SDT IS NOT NULL AND ADT >= TR01SDT AND _ENDDATE IS NOT NULL AND ADT <= _ENDDATE
      then: '''Vaccination stage'''
    - when: _ASTAGE_GATE = 'Y' AND DOSE1FL = 'Y' AND DOSE2FL = 'Y' AND DOSE2DT IS NOT NULL AND ADT >= DOSE2DT AND _ENDDATE IS NULL AND _SVSTDTC4 IS NOT NULL AND _SVSTDTC4 NOT IN ('')
      then: '''Vaccination stage'''
    - when: _ASTAGE_GATE = 'Y' AND DOSE1FL = 'Y' AND (DOSE2FL IS NULL OR DOSE2FL <> 'Y') AND _ENDDATE IS NULL AND _POSTFL = 'Y'
      then: '''Vaccination stage'''
    - when: _ASTAGE_GATE = 'Y' AND DOSE1FL = 'Y' AND (DOSE2FL IS NULL OR DOSE2FL <> 'Y') AND _SV4D IS NOT NULL AND ADT > _SV4D
      then: '''Follow up stage'''
    - when: _ASTAGE_GATE = 'Y' AND DOSE1FL = 'Y' AND (DOSE2FL IS NULL OR DOSE2FL <> 'Y') AND TR01SDT IS NOT NULL AND ADT >= TR01SDT AND _ENDDATE IS NOT NULL AND ADT <= _ENDDATE
      then: '''Vaccination stage'''
    - when: _ASTAGE_GATE = 'Y' AND DOSE1FL = 'Y' AND (DOSE2FL IS NULL OR DOSE2FL <> 'Y') AND TR01SDT IS NOT NULL AND ADT >= TR01SDT AND _ENDDATE IS NULL
      then: '''Vaccination stage'''
  submission:
    core: Perm
    mandatory: false
    length: 30
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: ASTAGEN
  type: int
  label: Stage (N)
  derivation:
    mapping:
      source: ASTAGE
      dict:
        Vaccination stage: 1
        Follow up stage: 2
      unmapped: null
  submission:
    core: Perm
    mandatory: false
    length: 8
    display_format: '3.'
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: _UNS
  type: int
  derivation:
    case:
    - when: _POSTFL = 'Y' AND (str_contains(_VISIT, 'Uns') OR _VISIT IS NULL OR _VISIT IN (''))
      then: 1
    - when: _POSTFL = 'Y'
      then: 0
- name: _AWTDIFF
  type: int
  derivation:
    case:
    - when: _POSTFL = 'Y' AND _UNS = 1
      then: AWTDIFF
    - when: _POSTFL = 'Y'
      then: 0
    - otherwise: 99999999
