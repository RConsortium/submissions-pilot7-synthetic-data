    - when: _POSTFL = 'Y' AND BTOXGRL IS NULL AND ATOXGRL IS NOT NULL
      then:
        str_template: UNK to {ATOXGRL}
    - when: _POSTFL = 'Y' AND BTOXGRL IS NOT NULL AND ATOXGRL IS NULL
