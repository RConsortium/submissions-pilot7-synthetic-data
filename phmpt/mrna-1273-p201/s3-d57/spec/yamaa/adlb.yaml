      pattern: Day ([0-9]+)
      group: 1
      no_match: null
- name: AVISIT
  type: str
  label: Analysis Visit
  derivation:
    case:
    - when: ABLFL = 'Y'
      then: '''Baseline'''
    - when: _POSTFL = 'Y' AND (str_contains(_VISIT, 'Uns') OR _VISIT IS NULL OR _VISIT IN ('')) AND ADY IS NOT NULL AND ADY > 1 AND ADY <= 43
      then: '''Day 29'''
    - when: _POSTFL = 'Y' AND (str_contains(_VISIT, 'Uns') OR _VISIT IS NULL OR _VISIT IN ('')) AND ADY IS NOT NULL AND ADY >= 44
      then: '''Day 57'''
    - when: _POSTFL = 'Y' AND ADY IS NOT NULL AND ADY > 1 AND _VISIT_DAY IS NOT NULL
      then:
        str_template: Day {_VISIT_DAY}
    - when: _POSTFL = 'Y' AND ADY IS NOT NULL AND ADY > 1
      then: '''Day '''
  submission:
    core: Perm
    mandatory: false
    length: 50
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: AVISITN
  type: int
