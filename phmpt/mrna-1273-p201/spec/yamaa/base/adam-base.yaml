# Parent layer for the P201 ADaM specifications.
#
# Declares the section 3.1 core columns shared by every P201 ADaM dataset
# (type, label, core/mandatory/length) with NO derivations and NO origins:
# other datasets take these columns from ADSL, not from DM, so a DM-based
# derivation or a DM Predecessor origin in this layer would be wrong for
# them. Each dataset spec supplies its own derivations and origins, which
# merge field-by-field over this layer. See the study's spec/review/README.md.
yamaa: '1.0'
type: spec
model: ADaM
columns:
- name: STUDYID
  type: str
  label: Study Identifier
  submission:
    core: Req
    mandatory: true
    length: 14
- name: USUBJID
  type: str
  label: Unique Subject Identifier
  submission:
    core: Req
    mandatory: true
    length: 25
- name: SUBJID
  type: str
  label: Subject Identifier for the Study
  submission:
    core: Req
    mandatory: true
    length: 9
- name: SITEID
  type: str
  label: Study Site Identifier
  submission:
    core: Req
    mandatory: true
    length: 5
- name: COUNTRY
  type: str
  label: Country
  submission:
    core: Req
    mandatory: true
    length: 3
- name: AGE
  type: int
  label: Age
  submission:
    core: Req
    mandatory: true
    length: 8
    display_format: '3.'
- name: AGEU
  type: str
  label: Age Units
  submission:
    core: Req
    mandatory: true
    length: 5
- name: SEX
  type: str
  label: Sex
  submission:
    core: Req
    mandatory: true
    length: 1
- name: RACE
  type: str
  label: Race
  submission:
    core: Req
    mandatory: true
    length: 41
- name: ETHNIC
  type: str
  label: Ethnicity
  submission:
    core: Req
    mandatory: true
    length: 22
- name: ARM
  type: str
  label: Description of Planned Arm
  submission:
    core: Req
    mandatory: true
    length: 16
- name: ACTARM
  type: str
  label: Description of Actual Arm
  submission:
    core: Req
    mandatory: true
    length: 16
- name: TRT01P
  type: str
  label: Planned Treatment for Period 01
  submission:
    core: Req
    mandatory: true
    length: 25
- name: TRT01PN
  type: int
  label: Planned Treatment for Period 01 (N)
  submission:
    core: Req
    mandatory: true
    length: 8
    display_format: '3.'
- name: TRT01A
  type: str
  label: Actual Treatment for Period 01
  submission:
    core: Req
    mandatory: true
    length: 25
- name: TRT01AN
  type: int
  label: Actual Treatment for Period 01 (N)
  submission:
    core: Req
    mandatory: true
    length: 8
    display_format: '3.'
- name: TR01SDT
  type: date
  label: Date of First Exposure in Period 01
  submission:
    core: Req
    mandatory: true
- name: TR01SDTM
  type: datetime
  label: Datetime of First Exposure in Period 01
  submission:
    core: Req
    mandatory: true
- name: TR01EDT
  type: date
  label: Date of Last Exposure in Period 01
  submission:
    core: Req
    mandatory: true
- name: TR01EDTM
  type: datetime
  label: Datetime of Last Exposure in Period 01
  submission:
    core: Req
    mandatory: true
- name: TRTSDTM
  type: datetime
  label: Datetime of First Exposure to Treatment
  submission:
    core: Req
    mandatory: true
- name: TRTEDTM
  type: datetime
  label: Datetime of Last Exposure to Treatment
  submission:
    core: Req
    mandatory: true
- name: RANDFL
  type: str
  label: Randomized Population Flag
  submission:
    core: Req
    mandatory: true
