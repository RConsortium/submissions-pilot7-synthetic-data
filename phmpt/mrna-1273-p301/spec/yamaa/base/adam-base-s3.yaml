# STUDDUR4/5/6, EOT01/02 + DCT01/02, DTHCAUS/DSDTHSP, TTDTH1/2, UICDT/
# UBLDDT, PDVDT, IRTVISDT, EUAVACDT, EXTDT, etc. (SURVEY.md Sec. 3; the
# survey's "58" was a miscount -- the defines give 59.) Taken mechanically
# from the S3 ADaM define.xml IG.ADSL. NO derivations, NO origins.
# Generated 2026-11-22 (scoping pass).
