# P301 IA-only ADSL layer (6 columns) -- layer over base/adam-base.yaml
# for S80/S5 specs only. Columns in the IA ADSLs (92 vars) that the S3
# ADSL does not have: EOTSTT/EOTDT/EOTDY + DCTREAS/DCTREASP (single-period
# end-of-treatment block) and RFXSTDTC. Taken mechanically from the S80
# ADaM define.xml IG.ADSL (S80 and S5 ADSL sets are identical).
# NO derivations, NO origins. Generated 2026-11-22 (scoping pass).
#
# NOTE -- mandatory differs between cuts on 15 shared columns (S3 is
# stricter on all 15: STRATAR, STRATARN, AGEGR1, AGEGR1N, AGEGR2,
# AGEGR2N, ETHNIC, PROTVER, RANDNUM, TRT01PN, RFICDT, RANDDT, EFFCODT,
# RACEGR1, RACEGR1N). The shared base records the S3 (BLA) value. IA
# specs that need the IA value must override `submission.mandatory`
# (and `core`) for the affected column in their own spec layer.
# NOTE -- label wording differs in IA on 3 shared columns (S3 wording is
# in the shared base): DOSE2DT 'Date of Dose 2' (S3: 'Date of Dose 2 in
# Blinded Phase'), DOS2DTM 'Datetime of Dose 2' (S3: '... in Blinded
# Phase'), EFFCODT 'Efficacy Data Cutoff Date' (S3: 'Efficacy Date
# Cutoff Date').
yamaa: '1.0'
type: spec
model: ADaM
parent: adam-base.yaml
columns:
- name: RFXSTDTC
  type: datetime
  label: 'Date/Time of First Study Treatment'
  submission:
    core: Perm
    mandatory: false
- name: EOTSTT
  type: str
  label: 'End of Treatment Status'
  submission:
    core: Perm
    mandatory: false
    length: 20
- name: EOTDT
  type: date
  label: 'End of Treatment Date'
  submission:
    core: Perm
    mandatory: false
- name: EOTDY
  type: int
  label: 'End of Treatment Relative Day'
  submission:
    core: Perm
    mandatory: false
    length: 8
- name: DCTREAS
  type: str
  label: 'Reason for Discontinuation of Treatment'
  submission:
    core: Perm
    mandatory: false
    length: 100
- name: DCTREASP
  type: str
  label: 'Reason Specify for Discont of Treatment'
  submission:
    core: Perm
    mandatory: false
    length: 200
