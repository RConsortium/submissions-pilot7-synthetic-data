# Parent layer for the P301 ADaM specifications -- SHARED CORE (86 columns).
#
# Columns present in the ADSL of ALL THREE cuts (S3 145, S80/S5 92 each),
# taken mechanically from the submitted ADaM define.xml IG.ADSL
# (S3 define is the authority for type/length/label; S80/S5 agree on
# type and length for every shared column -- only 3 labels differ in
# wording, see base-ia notes). NO derivations and NO origins, exactly as
# in P201's base/adam-base.yaml: other datasets take these columns from
# ADSL, not from DM, so a DM-based derivation or a DM Predecessor origin
# in this layer would be wrong for them. Each dataset spec supplies its
# own derivations and origins, which merge field-by-field over this layer.
# S3 specs layer base/adam-base.yaml + base/adam-base-s3.yaml (59 S3-only
# columns); S80/S5 specs layer base/adam-base.yaml + base/adam-base-ia.yaml
# (6 IA-only columns). Generated 2026-11-22 from spec/define/*_A_define.xml
# (scoping pass); column order follows the S3 define IG.ADSL ItemRef order.
