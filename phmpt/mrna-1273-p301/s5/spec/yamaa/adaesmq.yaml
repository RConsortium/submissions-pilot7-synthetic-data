# ADAESMQ for Moderna mRNA-1273-P301, cut S5 (First Interim
# Analysis IA1b, cutoff 2020-11-25). Parent: ../../../spec/yamaa/base/adam-base-ia.yaml
# (which chains to ../../../spec/yamaa/base/adam-base.yaml; 86 shared + 6 IA-only
# ADSL columns). Session-37 REPAIR of the session-35 spec: derived
# from the VERIFIED S5 ADAE spec (adae/spec-s5.yaml, 16,059x135,
# single full run, DONE-WITH-GAP) by documented surgical edits (see
# the generator header). The session-35 spec carried 857 extra rows
# because it believed S5 has no SUPPAE file; session 34 proved S5
# DOES have SUPPAE (truncated file name, RDOMAIN='AE', 104,196
# rows), and this spec uses its real REMOVEFL pivot: AE 16,942 ->
# ADAESMQ 16,059 = 857 REMOVEFL='Y' + 17 empty-AETERM + 9 non-ADSL,
# zero overlaps; kept keys equal the target keys exactly. The
# separate S5 ADAESMQ program (Bates 5657855-5657858) left-joins the
# 7 SMQ import tables onto adb.adae, drops ADURN, and recomputes
# ADURN with the widened _flagfl (any of SMQ01FL-SMQ08FL / ANL01FL
# = 'Y'). One row per AE, inner-joined to the verified ADSL on
# USUBJID. The IA program reads NO FACE/FAAE. No S27 file is read.
# SAP v1 vs v3 CLOSED as no-impact (2026-11-24) -- the IA
# program's own definitions are followed.
# AEOUTSP / AEHSTDTC / AEHENDTC are now derivable from the SUPPAE
# file (SUPPAE AEOUTSP / AEHOSPST / AEHOSPEN QVAL pivots -- the
# ADAE spec's derivations, 0 mismatches there; the ADAESMQ target
# carries identical values on all 16,059 shared keys). AECVDIAG
# (SUPPAE AECVDIAG pivot), AESOFL (SUPPAE AESOFL pivot, exact incl.
# the 6 blanks) and AEMAFL (SUPPAE MAAEFL pivot, exact incl. the 11
# blanks) likewise; the AECAT/AESCAT correlates (AESOFL='Y' iff
# REACTOGENICITY, AEMAFL='Y' iff PIMMC) were verified exact as
# biconditionals but NOT adopted as derivations, since a Y/N rule
# would mismatch the blank rows. ICUAD/ICUDAY use the ADAE spec's
# per-part HOSPIDX rule (max HODUR, then max HOOCCUR), 0 mismatches
# on all 16,059 rows.
# Honest gaps: RACESPY, 446 cells (354 OTHER + 92 MULTIPLE+RACE6=
# 'OTHER' -- the RACEOTH tail is redacted to '(b)(6)' in SDTM
# SUPPDM and survives only in the submitted ADAESMQ; the SUPPDM
# reconstruction is exact for MULTIPLE subjects without RACE6 and
# for every non-MULTIPLE, non-OTHER row); ASTTM, 2,028 cells, and
# AENTM, 1,239 cells: the submitted target stores both as
# duration[us]; yamaa 0.8.0 has no duration type, so the spec types
# them as time (to_time of ASTDTM/AENDTM); the values are correct
# (all non-null target values equal the time-of-day part of the
# exactly-matching ASTDTM/AENDTM) but datetime.time never compares
# equal to Timedelta under the harness. AETERM, 4 space-only cells
# (NBSP cells where the faithful CLN step leaves two spaces and
# the submitted value has one).
# SMQ01FL (12 terms) / CMQ01FL (38 terms) / SMQ02FL-SMQ08FL are
# term lists reconstructed from the submitted data (the import
# tables are not in Module 5). ADURN is the union length of the
# group's widened-flag-row intervals (see the generator header);
# the running maximum E is carried by a WINDOW-12 feedback group.
# Verification (single full verify.py run, 2026-11-23 03:49 UTC /
# 04:49 CET, ~12 s, yamaa 0.8.0 @135082c1f): DONE-WITH-GAP.
# 16,059x142, 139 non-key columns: 136 exact, 0 within tolerance,
# 4 space-only (AETERM). Only the three honest gaps mismatch:
# RACESPY 446, ASTTM 2,028, AENTM 1,239 (3,713 cells). Keys
# unique, 0 nulls, 0 full-row dups; key sets equal. Row
# reconciliation: AE 16,942 -> ADAESMQ 16,059 = 857 REMOVEFL + 17
# empty-AETERM + 9 non-ADSL, no overlaps. Report:
# adaesmq/verify_report_s5.json (original work tree).
yamaa: '1.0'
type: spec
model: ADaM
parent: ../../../spec/yamaa/base/adam-base-ia.yaml
domain: ADAESMQ
keys:
- STUDYID
- USUBJID
- AESEQ
input:
  AE: <sdtm-dir>/ae.parquet
  SUPPAE: <sdtm-dir>/suppae.parquet
  DS: <sdtm-dir>/ds.parquet
  SUPPDS: <sdtm-dir>/suppds.parquet
  HO: <sdtm-dir>/ho.parquet
  EX: <sdtm-dir>/ex.parquet
  SUPPDM: <sdtm-dir>/suppdm.parquet
  ADSL:
    path: <adam-dir>/adsl.parquet
    key:
    - STUDYID
    - USUBJID
submission:
  label: Adverse Event SMQ Analysis Dataset
  class: OCCURRENCE DATA STRUCTURE
  structure: One record per subject per adverse event
  repeating: true
rows:
- id: events
  dataset: AE
  filter: (_REMOVEFL IS NULL OR _REMOVEFL <> 'Y') AND _AETERM IS NOT NULL AND _ADSL IS NOT NULL
intermediates:
- id: SUPP_P
  dataset: SUPPAE
  key:
    STUDYID: STUDYID
    USUBJID: USUBJID
    IDVARVAL:
      str_decimal:
        source: AESEQ
        decimals: 0
  filter: SUPPAE.QNAM IN ('REMOVEFL', 'MAAEFL', 'AESOFL', 'HOSPIDX', 'AEOUTSP', 'AECVDIAG', 'AEHOSPST', 'AEHOSPEN') AND SUPPAE.IDVAR = 'AESEQ'
  pivot:
    name: QNAM
    value: QVAL
    fields:
    - REMOVEFL
    - MAAEFL
    - AESOFL
    - HOSPIDX
    - AEOUTSP
    - AECVDIAG
    - AEHOSPST
    - AEHOSPEN
- id: HO_ICU1
  dataset: HO
  key:
    USUBJID: USUBJID
    _HOSPID1: _HOSPIDX_1
  derivations:
    _HOSPID1:
      str_extract:
        source: HO.HOSPID
        pattern: '^(?:HO-)?([^/]+)'
        group: 1
        no_match: null
  filter: HO.HODECOD = 'ICU' AND HO.HOCAT = 'ADVERSE EVENTS' AND HO.HOSPID IS NOT NULL
  order_by:
  - variable: HO.HODUR
    direction: desc
  - variable: HO.HOOCCUR
    direction: desc
  keep: first
- id: HO_ICU2
  dataset: HO
  key:
    USUBJID: USUBJID
    _HOSPID2: _HOSPIDX_2
  derivations:
    _HOSPID2:
      str_extract:
        source: HO.HOSPID
        pattern: '^(?:HO-)?([^/]+)'
        group: 1
        no_match: null
  filter: HO.HODECOD = 'ICU' AND HO.HOCAT = 'ADVERSE EVENTS' AND HO.HOSPID IS NOT NULL
  order_by:
  - variable: HO.HODUR
    direction: desc
  - variable: HO.HOOCCUR
    direction: desc
  keep: first
- id: HO_ICU3
  dataset: HO
  key:
    USUBJID: USUBJID
    _HOSPID3: _HOSPIDX_3
  derivations:
    _HOSPID3:
      str_extract:
        source: HO.HOSPID
        pattern: '^(?:HO-)?([^/]+)'
        group: 1
        no_match: null
  filter: HO.HODECOD = 'ICU' AND HO.HOCAT = 'ADVERSE EVENTS' AND HO.HOSPID IS NOT NULL
  order_by:
  - variable: HO.HODUR
    direction: desc
  - variable: HO.HOOCCUR
    direction: desc
  keep: first
- id: HO_ICU4
  dataset: HO
  key:
    USUBJID: USUBJID
    _HOSPID4: _HOSPIDX_4
  derivations:
    _HOSPID4:
      str_extract:
        source: HO.HOSPID
        pattern: '^(?:HO-)?([^/]+)'
        group: 1
        no_match: null
  filter: HO.HODECOD = 'ICU' AND HO.HOCAT = 'ADVERSE EVENTS' AND HO.HOSPID IS NOT NULL
  order_by:
  - variable: HO.HODUR
    direction: desc
  - variable: HO.HOOCCUR
    direction: desc
  keep: first
- id: HO_ICU5
  dataset: HO
  key:
    USUBJID: USUBJID
    _HOSPID5: _HOSPIDX_5
  derivations:
    _HOSPID5:
      str_extract:
        source: HO.HOSPID
        pattern: '^(?:HO-)?([^/]+)'
        group: 1
        no_match: null
  filter: HO.HODECOD = 'ICU' AND HO.HOCAT = 'ADVERSE EVENTS' AND HO.HOSPID IS NOT NULL
  order_by:
  - variable: HO.HODUR
    direction: desc
  - variable: HO.HOOCCUR
    direction: desc
  keep: first
- id: HO_ICU6
  dataset: HO
  key:
    USUBJID: USUBJID
    _HOSPID6: _HOSPIDX_6
  derivations:
    _HOSPID6:
      str_extract:
        source: HO.HOSPID
        pattern: '^(?:HO-)?([^/]+)'
        group: 1
        no_match: null
  filter: HO.HODECOD = 'ICU' AND HO.HOCAT = 'ADVERSE EVENTS' AND HO.HOSPID IS NOT NULL
  order_by:
  - variable: HO.HODUR
    direction: desc
  - variable: HO.HOOCCUR
    direction: desc
  keep: first
- id: HO_ICU7
  dataset: HO
  key:
    USUBJID: USUBJID
    _HOSPID7: _HOSPIDX_7
  derivations:
    _HOSPID7:
      str_extract:
        source: HO.HOSPID
        pattern: '^(?:HO-)?([^/]+)'
        group: 1
        no_match: null
  filter: HO.HODECOD = 'ICU' AND HO.HOCAT = 'ADVERSE EVENTS' AND HO.HOSPID IS NOT NULL
  order_by:
  - variable: HO.HODUR
    direction: desc
  - variable: HO.HOOCCUR
    direction: desc
  keep: first
- id: HO_ICU8
  dataset: HO
  key:
    USUBJID: USUBJID
    _HOSPID8: _HOSPIDX_8
  derivations:
    _HOSPID8:
      str_extract:
        source: HO.HOSPID
        pattern: '^(?:HO-)?([^/]+)'
        group: 1
        no_match: null
  filter: HO.HODECOD = 'ICU' AND HO.HOCAT = 'ADVERSE EVENTS' AND HO.HOSPID IS NOT NULL
  order_by:
  - variable: HO.HODUR
    direction: desc
  - variable: HO.HOOCCUR
    direction: desc
  keep: first
- id: HO_ICU9
  dataset: HO
  key:
    USUBJID: USUBJID
    _HOSPID9: _HOSPIDX_9
  derivations:
    _HOSPID9:
      str_extract:
        source: HO.HOSPID
        pattern: '^(?:HO-)?([^/]+)'
        group: 1
        no_match: null
  filter: HO.HODECOD = 'ICU' AND HO.HOCAT = 'ADVERSE EVENTS' AND HO.HOSPID IS NOT NULL
  order_by:
  - variable: HO.HODUR
    direction: desc
  - variable: HO.HOOCCUR
    direction: desc
  keep: first
- id: SUPP_AESPIDX
  dataset: SUPPDS
  key:
    STUDYID: STUDYID
    USUBJID: USUBJID
    IDVARVAL: _DSSEQ_STR
  filter: SUPPDS.QNAM = 'AESPIDX' AND SUPPDS.IDVAR = 'DSSEQ'
  order_by:
  - SUPPDS.QVAL
  keep: first
- id: EX_DOSE1
  dataset: EX
  key:
  - STUDYID
  - USUBJID
  filter: str_contains(EX.VISIT, '[Dd][Aa][Yy] 1( |$)')
  order_by:
  - EX.EXSTDTC
  keep: first
- id: EX_DOSE2
  dataset: EX
  key:
  - STUDYID
  - USUBJID
  filter: str_contains(EX.VISIT, '[Dd][Aa][Yy] 29( |$)')
  order_by:
  - EX.EXSTDTC
  keep: first
- id: SUPP_DM
  dataset: SUPPDM
  key:
  - STUDYID
  - USUBJID
  filter: SUPPDM.QNAM IN ('RACE1', 'RACE2', 'RACE3', 'RACE4', 'RACE5', 'RACE6', 'RACEOTH')
  pivot:
    name: QNAM
    value: QVAL
    fields:
    - RACE1
    - RACE2
    - RACE3
    - RACE4
    - RACE5
    - RACE6
    - RACEOTH
windows:
  W_ADURN:
    group_by:
    - USUBJID
    - SUBJID
    - MDOSREF
    - AEDECOD
    order_by:
    - ADURSDT
    - ADUREDT
    - AESEQ
columns:
- name: _ADSL
  type: str
  derivation: ADSL.USUBJID
- name: _REMOVEFL
  type: str
  derivation: SUPP_P.REMOVEFL
- name: _AETERM_1
  type: str
  derivation:
    str_replace:
      source: AE.AETERM
      pattern: '[ \t]{2,}'
      replacement: ' '
- name: _AETERM_2
  type: str
  derivation:
    str_replace:
      source: _AETERM_1
      pattern: '^[\t ]+|[\t ]+$'
      replacement: ''
- name: _AETERM_3
  type: str
  derivation:
    str_replace:
      source: _AETERM_2
      pattern: '\u00a0'
      replacement: ' '
- name: _AETERM_M2
  type: str
  derivation:
    str_replace:
      source: _AETERM_3
      pattern: '\u201c'
      replacement: "\u00e2\u20ac\u0153"
- name: _AETERM
  type: str
  derivation:
    str_replace:
      source: _AETERM_M2
      pattern: '\u201d'
      replacement: "\u00e2\u20ac\ufffd"
- name: _HOSPIDX
  type: str
  derivation: SUPP_P.HOSPIDX
- name: _HOSPIDX_1
  type: str
  derivation:
    str_extract:
      source: _HOSPIDX
      pattern: '^(?:[^/]+/){0}(?:HO-)?([^/]+)'
      group: 1
      no_match: null
- name: _HOSPIDX_2
  type: str
  derivation:
    str_extract:
      source: _HOSPIDX
      pattern: '^(?:[^/]+/){1}(?:HO-)?([^/]+)'
      group: 1
      no_match: null
- name: _HOSPIDX_3
  type: str
  derivation:
    str_extract:
      source: _HOSPIDX
      pattern: '^(?:[^/]+/){2}(?:HO-)?([^/]+)'
      group: 1
      no_match: null
- name: _HOSPIDX_4
  type: str
  derivation:
    str_extract:
      source: _HOSPIDX
      pattern: '^(?:[^/]+/){3}(?:HO-)?([^/]+)'
      group: 1
      no_match: null
- name: _HOSPIDX_5
  type: str
  derivation:
    str_extract:
      source: _HOSPIDX
      pattern: '^(?:[^/]+/){4}(?:HO-)?([^/]+)'
      group: 1
      no_match: null
- name: _HOSPIDX_6
  type: str
  derivation:
    str_extract:
      source: _HOSPIDX
      pattern: '^(?:[^/]+/){5}(?:HO-)?([^/]+)'
      group: 1
      no_match: null
- name: _HOSPIDX_7
  type: str
  derivation:
    str_extract:
      source: _HOSPIDX
      pattern: '^(?:[^/]+/){6}(?:HO-)?([^/]+)'
      group: 1
      no_match: null
- name: _HOSPIDX_8
  type: str
  derivation:
    str_extract:
      source: _HOSPIDX
      pattern: '^(?:[^/]+/){7}(?:HO-)?([^/]+)'
      group: 1
      no_match: null
- name: _HOSPIDX_9
  type: str
  derivation:
    str_extract:
      source: _HOSPIDX
      pattern: '^(?:[^/]+/){8}(?:HO-)?([^/]+)'
      group: 1
      no_match: null
- name: _AEGRPID
  type: str
  derivation: AE.AEGRPID
- name: _AE_GRP
  type: str
  derivation:
    str_template:
      template: 'AE-{_AEGRPID}'
- name: _AEST_PREC
  type: str
  derivation:
    precision:
      type: date
      source: AE.AESTDTC
      invalid: null
- name: _AEOUTSP_C
  type: str
  derivation:
    str_replace:
      source: SUPP_P.AEOUTSP
      pattern: '\u00a0'
      replacement: ' '
- name: _AESPIDX_1
  type: str
  derivation:
    str_extract:
      source: SUPP_AESPIDX.QVAL
      pattern: '^([^, ]+)'
      group: 1
      no_match: null
- name: _AESPIDX_2
  type: str
  derivation:
    str_extract:
      source: SUPP_AESPIDX.QVAL
      pattern: '^[^,]+, *([^, ]+)'
      group: 1
      no_match: null
- name: _HODUR
  type: str
  derivation:
    first_available:
      sources: [HO_ICU1.HODUR, HO_ICU2.HODUR, HO_ICU3.HODUR, HO_ICU4.HODUR, HO_ICU5.HODUR, HO_ICU6.HODUR, HO_ICU7.HODUR, HO_ICU8.HODUR, HO_ICU9.HODUR]
- name: _EXTRT1_UP
  type: str
  derivation:
    str_case:
      source: EX_DOSE1.EXTRT
      to: upper
- name: _EXTRT2_UP
  type: str
  derivation:
    str_case:
      source: EX_DOSE2.EXTRT
      to: upper
- name: _AETOXGR
  type: str
  derivation: AE.AETOXGR
- name: _AESEV_PC
  type: str
  derivation:
    mapping:
      source: AE.AESEV
      dict:
        MILD: Mild
        MODERATE: Moderate
        SEVERE: Severe
      unmapped: null
- name: STUDYID
  derivation: AE.STUDYID
  submission:
    origins:
    - type: Predecessor
      description: AE.STUDYID
- name: USUBJID
  derivation: AE.USUBJID
  submission:
    origins:
    - type: Predecessor
      description: AE.USUBJID
- name: SUBJID
  derivation: ADSL.SUBJID
  submission:
    origins:
    - type: Assigned
- name: SITEID
  derivation: ADSL.SITEID
  submission:
    origins:
    - type: Predecessor
      description: ADSL.SITEID
- name: COUNTRY
  derivation: ADSL.COUNTRY
  submission:
    origins:
    - type: Predecessor
      description: ADSL.COUNTRY
- name: AGE
  derivation: ADSL.AGE
  submission:
    origins:
    - type: Predecessor
      description: ADSL.AGE
- name: AGEU
  derivation: ADSL.AGEU
  submission:
    origins:
    - type: Predecessor
      description: ADSL.AGEU
- name: STRATAR
  derivation: ADSL.STRATAR
  submission:
    origins:
    - type: Predecessor
      description: ADSL.STRATAR
- name: STRATARN
  derivation: ADSL.STRATARN
  submission:
    origins:
    - type: Predecessor
      description: ADSL.STRATARN
- name: AGEGR1
  derivation: ADSL.AGEGR1
  submission:
    origins:
    - type: Predecessor
      description: ADSL.AGEGR1
- name: AGEGR1N
  derivation: ADSL.AGEGR1N
  submission:
    origins:
    - type: Predecessor
      description: ADSL.AGEGR1N
- name: AGEGR2
  derivation: ADSL.AGEGR2
  submission:
    origins:
    - type: Predecessor
      description: ADSL.AGEGR2
- name: AGEGR2N
  derivation: ADSL.AGEGR2N
  submission:
    origins:
    - type: Predecessor
      description: ADSL.AGEGR2N
- name: SEX
  derivation: ADSL.SEX
  submission:
    origins:
    - type: Predecessor
      description: ADSL.SEX
- name: RACE
  derivation: ADSL.RACE
  submission:
    origins:
    - type: Predecessor
      description: ADSL.RACE
- name: _RACE1
  type: str
  derivation: SUPP_DM.RACE1
- name: _RACE2
  type: str
  derivation: SUPP_DM.RACE2
- name: _RACE3
  type: str
  derivation: SUPP_DM.RACE3
- name: _RACE4
  type: str
  derivation: SUPP_DM.RACE4
- name: _RACE5
  type: str
  derivation: SUPP_DM.RACE5
- name: _RACE6
  type: str
  derivation: SUPP_DM.RACE6
- name: _RACEOTH
  type: str
  derivation: SUPP_DM.RACEOTH
- name: _RACE1M
  type: str
  derivation:
    case:
    - when: _RACE1 = 'WHITE'
      then: '''White'''
- name: _RACE2M
  type: str
  derivation:
    case:
    - when: _RACE2 = 'BLACK OR AFRICAN AMERICAN'
      then: '''Black or African American'''
- name: _RACE3M
  type: str
  derivation:
    case:
    - when: _RACE3 = 'ASIAN'
      then: '''Asian'''
- name: _RACE4M
  type: str
  derivation:
    case:
    - when: _RACE4 = 'AMERICAN INDIAN OR ALASKA NATIVE'
      then: '''American Indian or Alaska Native'''
- name: _RACE5M
  type: str
  derivation:
    case:
    - when: _RACE5 = 'NATIVE HAWAIIAN OR OTHER PACIFIC ISLANDER'
      then: '''Native Hawaiian or other Pacific Islander'''
- name: _RACE6M
  type: str
  derivation:
    case:
    - when: _RACE6 = 'OTHER' AND _RACEOTH IS NOT NULL AND _RACEOTH NOT IN ('')
      then:
        str_template:
          template: 'Other: {_RACEOTH}'
          missing: ''
    - when: _RACE6 = 'OTHER'
      then: '''Other'''
- name: _S1
  type: str
  derivation:
    _RACE1M
- name: _S2
  type: str
  derivation:
    case:
    - when: _S1 IS NOT NULL AND _S1 NOT IN ('') AND _RACE2M IS NOT NULL AND _RACE2M NOT IN ('')
      then:
        str_template:
          template: '{_S1}, {_RACE2M}'
          missing: ''
    - when: _S1 IS NOT NULL AND _S1 NOT IN ('')
      then: _S1
    - when: _RACE2M IS NOT NULL AND _RACE2M NOT IN ('')
      then: _RACE2M
- name: _S3
  type: str
  derivation:
    case:
    - when: _S2 IS NOT NULL AND _S2 NOT IN ('') AND _RACE3M IS NOT NULL AND _RACE3M NOT IN ('')
      then:
        str_template:
          template: '{_S2}, {_RACE3M}'
          missing: ''
    - when: _S2 IS NOT NULL AND _S2 NOT IN ('')
      then: _S2
    - when: _RACE3M IS NOT NULL AND _RACE3M NOT IN ('')
      then: _RACE3M
- name: _S4
  type: str
  derivation:
    case:
    - when: _S3 IS NOT NULL AND _S3 NOT IN ('') AND _RACE4M IS NOT NULL AND _RACE4M NOT IN ('')
      then:
        str_template:
          template: '{_S3}, {_RACE4M}'
          missing: ''
    - when: _S3 IS NOT NULL AND _S3 NOT IN ('')
      then: _S3
    - when: _RACE4M IS NOT NULL AND _RACE4M NOT IN ('')
      then: _RACE4M
- name: _S5
  type: str
  derivation:
    case:
    - when: _S4 IS NOT NULL AND _S4 NOT IN ('') AND _RACE5M IS NOT NULL AND _RACE5M NOT IN ('')
      then:
        str_template:
          template: '{_S4}, {_RACE5M}'
          missing: ''
    - when: _S4 IS NOT NULL AND _S4 NOT IN ('')
      then: _S4
    - when: _RACE5M IS NOT NULL AND _RACE5M NOT IN ('')
      then: _RACE5M
- name: _S
  type: str
  derivation:
    case:
    - when: _S5 IS NOT NULL AND _S5 NOT IN ('') AND _RACE6M IS NOT NULL AND _RACE6M NOT IN ('')
      then:
        str_template:
          template: '{_S5}, {_RACE6M}'
          missing: ''
    - when: _S5 IS NOT NULL AND _S5 NOT IN ('')
      then: _S5
