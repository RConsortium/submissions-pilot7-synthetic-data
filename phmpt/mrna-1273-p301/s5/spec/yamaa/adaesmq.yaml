    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: CMQ01FL
  type: str
  label: CMQ 01 Flag
  derivation:
    mapping:
      source: AE.AEDECOD
      dict:
        Induration: Y
        Injection site bruising: Y
        Injection site discolouration: Y
        Injection site discomfort: Y
        Injection site erythema: Y
        Injection site haematoma: Y
        Injection site haemorrhage: Y
        Injection site hypoaesthesia: Y
        Injection site induration: Y
        Injection site irritation: Y
        Injection site joint pain: Y
        Injection site lymphadenopathy: Y
        Injection site macule: Y
        Injection site mass: Y
        Injection site nodule: Y
        Injection site pain: Y
        Injection site papule: Y
        Injection site paraesthesia: Y
        Injection site pruritus: Y
        Injection site rash: Y
        Injection site reaction: Y
        Injection site scab: Y
        Injection site swelling: Y
        Injection site urticaria: Y
        Injection site warmth: Y
        Peripheral swelling: Y
        Skin mass: Y
        Vaccination site bruising: Y
        Vaccination site erythema: Y
        Vaccination site induration: Y
        Vaccination site inflammation: Y
        Vaccination site lymphadenopathy: Y
        Vaccination site nodule: Y
        Vaccination site pain: Y
        Vaccination site pruritus: Y
        Vaccination site rash: Y
        Vaccination site swelling: Y
        Vascular access site swelling: Y
      unmapped: null
  submission:
    core: Perm
    mandatory: false
    length: 1
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: _AEONSTDY_D
  type: int
  derivation:
    diff:
      type: date
      start: ADSL.DOSE2DT
      end: ASTDT
      unit: day
- name: AEONSTDY
  type: int
  label: AE Onset Day
  derivation:
    case:
    - when: MDOSREF = 'Vaccination 1'
      then: ASTDY
    - when: MDOSREF = 'Vaccination 2'
      then: _AEONSTDY_D + 1
  submission:
    core: Perm
    mandatory: false
    length: 8
    display_format: '3.'
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: ANL01FL
  type: str
  label: Analysis Flag 01
  derivation:
    flag: CMQ01FL = 'Y' AND AEONSTDY >= 8
  submission:
    core: Perm
    mandatory: false
    length: 1
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: _FLAGN
  type: int
  derivation:
    case:
    - when: SMQ01FL = 'Y' OR SMQ02FL = 'Y' OR SMQ03FL = 'Y' OR SMQ04FL = 'Y' OR SMQ05FL = 'Y' OR SMQ06FL = 'Y' OR SMQ07FL = 'Y' OR SMQ08FL = 'Y' OR ANL01FL = 'Y'
      then: 1
    - otherwise: 0
- name: _MAXE_INC
  type: date
  derivation:
    case:
    - when: _FLAGN = 0
      then: _MAXE_PREV
    - when: _MAXE_PREV IS NULL
      then: ADUREDT
    - when: ADUREDT > _MAXE_PREV
      then: ADUREDT
    - otherwise: _MAXE_PREV
- name: _MAXE_PREV
  type: date
  derivation:
    row_value:
      source: _MAXE_INC
      offset: -1
      window: W_ADURN
- name: _GAPDAYS
  type: int
  derivation:
    diff:
      type: date
      start: _MAXE_PREV
      end: ADURSDT
      unit: day
- name: _GAP
  type: int
  derivation:
    case:
    - when: _FLAGN = 0
      then: 0
    - when: _MAXE_PREV IS NULL
      then: 0
    - when: _GAPDAYS > 1
      then: _GAPDAYS - 1
    - otherwise: 0
- name: _ADURN_MAXE
  type: date
  derivation:
    aggregate:
      group_by:
      - USUBJID
      - SUBJID
      - MDOSREF
      - AEDECOD
      filter: _FLAGN = 1
      expr: MAX(ADUREDT)
- name: _ADURN_MINS
  type: date
  derivation:
    aggregate:
      group_by:
      - USUBJID
      - SUBJID
      - MDOSREF
      - AEDECOD
      filter: _FLAGN = 1
      expr: MIN(ADURSDT)
- name: _ADURN_SUMGAP
  type: int
  derivation:
    aggregate:
      group_by:
      - USUBJID
      - SUBJID
      - MDOSREF
      - AEDECOD
      filter: _FLAGN = 1
      expr: SUM(_GAP)
- name: _ADURN_SPAN
  type: int
  derivation:
    diff:
      type: date
      start: _ADURN_MINS
      end: _ADURN_MAXE
      unit: day
- name: ADURN
  type: int
  label: Analysis Duration (N)
  derivation:
    case:
    - when: _FLAGN = 1 AND MDOSREF IS NOT NULL
      then: _ADURN_SPAN + 1 - _ADURN_SUMGAP
  submission:
    core: Perm
    mandatory: false
    length: 8
    display_format: '3.'
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
