# ADTTE for Moderna mRNA-1273-P301, cut S5 (First Interim Analysis
# IA1b, extract 25 Nov 2020, efficacy cutoff 2020-11-21). Parent:
# ../../../spec/yamaa/base/adam-base-ia.yaml (which chains to ../../../spec/yamaa/base/adam-base.yaml;
# 86 shared + 6 IA-only ADSL columns). Derivations implement the S5
# ADTTE program (Bates 5657937-5657941, 215 lines; byte-identical to
# the S80 A50ADTTE program): one row per FAS subject per PARAMCD (31
# PARAMCDs), from the submitted ADEFF (first event per subject per
# PARAMCD) and the verified ADSL. Where the SAS code and the define.xml
# method text disagree, the code is followed (see README.md). SAP note
# (closed 2026-11-24, no-impact): the file labelled "SAP v3"
# (19745_S68_M5_sap-v3.pdf) is the P201 SAP v3.0 (27 Oct 2020), not a
# P301 SAP version; the only P301 SAP in the set is v1.0 (10 Sep 2020).
# The case definitions below are the program's own, so the spec follows
# the program, not a SAP version.
# IA-vs-S3 differences (see the generator header): no MB/IS
# prior-infection censoring, no aperiod-2 rows, no inwin/cutoff gate,
# no ADT clamp, simple TTDEATH. The ungated form is OBSERVABLY
# confirmed on S5: subject US329-2412 has COVID/COVIDSD/INFECT event
# dates after EOSDT 2020-09-25 and the target keeps them as events.
# Program-vs-data note: the program calls %dev_tte for DEATHCVD, and
# the submitted S5 ADEFF has exactly one DEATHCVD row (subject
# US303-2204, ADT 2020-11-16), so the S5 ADTTE has exactly 5 TTDTHCV
# event rows and 151,750 censored TTDTHCV rows; the define's own
# CL.ADTTE.PARAMCD codelist lists exactly the 31 PARAMCDs present in
# the data. S5-vs-S80 differences: the S5 target adds RTPCRBL (54th
# carried ADSL column); EFFCODT is uniformly 2020-11-21 and CUTOFFDT
# uniformly 2020-11-25 (S80: 2020-11-07 / 2020-11-11); RACEGR1/RACEGR1N
# mandatory:false overrides carry 8,742 gaps each (S80: 8,866);
# TRT01A/TRT01AN have 0 gaps on S5 (S80: 31). KEYS: unlike ADEFF,
# ADTTE HAS a usable key: (STUDYID, USUBJID, PARAMCD) is unique and
# non-missing on the submitted target, and there is no ASEQ column.
# Honest gaps: none expected. The S80 spec verified EXACT MATCH strict
# via a single full verify.py run, and this S5 spec is the same
# derivation re-pointed at the S5 inputs; if the full verify.py run
# OOMs in this 6 GB cell (940,881 rows), verification falls back to
# pruned dependency-closure groups with a single full-spec re-run in
# a roomier cell still owed (see adtte/verify_report_s5.json, original work tree).
yamaa: '1.0'
type: spec
model: ADaM
parent: ../../../spec/yamaa/base/adam-base-ia.yaml
domain: ADTTE
keys:
- STUDYID
- USUBJID
- PARAMCD
input:
  ADEFF:
    path: <adam-dir>/adeff.parquet
    key:
    - STUDYID
    - USUBJID
  ADSL:
    path: <adam-dir>/adsl.parquet
    key:
    - STUDYID
    - USUBJID
submission:
  label: Time to Event Analysis Dataset
  class: BASIC DATA STRUCTURE
  structure: One record per subject per parameter
  repeating: true
rows:
- id: ttcvd1_rows
  dataset: ADSL
  derivations:
    STUDYID: ADSL.STUDYID
    USUBJID: ADSL.USUBJID
    PARAMCD: '''TTCVD1'''
    _EVENT_DT: EV_COVID._ADT
    _EVENT_EPOCH:
      to_epoch_day:
        source: _EVENT_DT
    _COVID_DT: null
    _DOSE2_EPOCH:
      to_epoch_day:
        source: ADSL.DOSE2DT
    _TR01_EPOCH:
      to_epoch_day:
        source: ADSL.TR01SDT
    _RAND_EPOCH:
      to_epoch_day:
        source: ADSL.RANDDT
    _CENSDT:
      least: {sources: [ADSL.DTHDT, ADSL.EOSDT, ADSL.CUTOFFDT, ADSL.EFFCODT]}
    _ADT_RAW:
      case:
      - when: _EVENT_DT IS NOT NULL AND _DOSE2_EPOCH IS NOT NULL AND _DOSE2_EPOCH + 14 <= _EVENT_EPOCH
        then: _EVENT_DT
      - when: _EVENT_DT IS NOT NULL AND (_DOSE2_EPOCH IS NULL OR _DOSE2_EPOCH + 14 > _EVENT_EPOCH)
        then: _EVENT_DT
      - otherwise: _CENSDT
    _CNSR_RAW:
      case:
      - when: _EVENT_DT IS NOT NULL AND _DOSE2_EPOCH IS NOT NULL AND _DOSE2_EPOCH + 14 <= _EVENT_EPOCH
        then: 0
      - when: _EVENT_DT IS NOT NULL AND (_DOSE2_EPOCH IS NULL OR _DOSE2_EPOCH + 14 > _EVENT_EPOCH)
        then: 1
      - otherwise: 1
    _EVNTDESC_RAW:
      case:
      - when: _EVENT_DT IS NOT NULL AND _DOSE2_EPOCH IS NOT NULL AND _DOSE2_EPOCH + 14 <= _EVENT_EPOCH
        then: '''COVID-19'''
      - when: _EVENT_DT IS NOT NULL AND (_DOSE2_EPOCH IS NULL OR _DOSE2_EPOCH + 14 > _EVENT_EPOCH)
        then: '''Early COVID-19'''
      - otherwise: '''No COVID-19'''
  filter: ADSL.FASFL = 'Y'
