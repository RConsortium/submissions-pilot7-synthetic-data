columns:
- name: _COHORT
  type: str
  derivation: SUPPDM_P.COHORT
- name: _RACE1
  type: str
  derivation: SUPPDM_P.RACE1
- name: _RACE2
  type: str
  derivation: SUPPDM_P.RACE2
- name: _RACE3
  type: str
  derivation: SUPPDM_P.RACE3
- name: _RACE4
  type: str
  derivation: SUPPDM_P.RACE4
- name: _RACE5
  type: str
  derivation: SUPPDM_P.RACE5
- name: _RACE6
  type: str
  derivation: SUPPDM_P.RACE6
- name: _RACE7
  type: str
  derivation: SUPPDM_P.RACE7
- name: _RACE8
  type: str
  derivation: SUPPDM_P.RACE8
- name: _RACEOTH
  type: str
  derivation: SUPPDM_P.RACEOTH
- name: _PREVSCR
  type: str
  derivation: SUPPDM_P.PREVSCR
- name: _COHORT_L
  type: str
  derivation:
    str_case:
      source: _COHORT
      to: lower
- name: _ENRN
  type: int
  derivation:
    case:
    - when: ENROL._ISF = 1 AND ENROL._ENRN = 1
      then: 1
    - otherwise: 0
- name: _SCRN
  type: float
  derivation: DS_SCRN.DSSEQ
- name: _RANDDTC
  type: str
  derivation: DS_RAND.DSSTDTC
- name: _EOS
  type: float
  derivation: DS_EOS.DSSEQ
- name: _EOT
  type: float
  derivation: DS_EOT.DSSEQ
- name: _EOS_MAP
  type: str
  derivation:
    mapping:
      source: DS_EOS.DSDECOD
      dict:
        ADVERSE EVENT: Adverse Event
        SAE: Serious Adverse Event
        SERIOUS ADVERSE EVENT: Serious Adverse Event
        DEATH: Death
        LOST TO FOLLOW-UP: Lost to Follow-Up
        PHYSICIAN DECISION: Physician Decision
        PREGNANCY: Pregnancy
        PROTOCOL DEVIATION: Protocol Deviation
        Study Terminated By Sponsor: Study Terminated by Sponsor
        WITHDRAWAL BY SUBJECT: Withdrawal of Consent by Participant
        COVID: Due to SARS-CoV-2
        OTHER: Other
      unmapped: null
- name: _EOS_REASON
  type: str
  derivation:
    first_available:
      sources:
      - _EOS_MAP
      - DS_EOS.DSDECOD
- name: _EOS_TERM0
  type: str
  derivation: DS_EOS.DSTERM
- name: _EOS_TERM
  type: str
  derivation:
    str_replace:
      source: _EOS_TERM0
      pattern: '[\r\n\f\u00c2\u00a0]'
      replacement: ' '
- name: _EOS_RU
  type: str
  derivation:
    str_case:
      source: _EOS_REASON
      to: upper
- name: _EOS_TU
  type: str
  derivation:
    str_case:
      source: _EOS_TERM
      to: upper
- name: _EOS_SPY
  type: str
  derivation:
    case:
    - when: (_EOS_RU IS NULL AND _EOS_TU IS NOT NULL OR _EOS_RU IS NOT NULL AND _EOS_TU IS NULL OR _EOS_RU <> _EOS_TU)
        AND (_EOS_TU IS NULL OR _EOS_TU <> 'COVID') AND (_EOS_RU IS NULL OR _EOS_RU <> 'DEATH')
      then: _EOS_TERM
- name: _EOT_MAP
  type: str
  derivation:
    mapping:
      source: DS_EOT.DSDECOD
      dict:
        ADVERSE EVENT: Adverse Event
        SAE: Serious Adverse Event
        SERIOUS ADVERSE EVENT: Serious Adverse Event
        DEATH: Death
        LOST TO FOLLOW-UP: Lost to Follow-Up
        PHYSICIAN DECISION: Physician Decision
        PREGNANCY: Pregnancy
        PROTOCOL DEVIATION: Protocol Deviation
        Study Terminated By Sponsor: Study Terminated by Sponsor
        WITHDRAWAL BY SUBJECT: Withdrawal of Consent by Participant
        COVID: Due to SARS-CoV-2
        OTHER: Other
      unmapped: null
- name: _EOT_REASON
  type: str
  derivation:
    first_available:
      sources:
      - _EOT_MAP
      - DS_EOT.DSDECOD
- name: _EOT_TERM0
  type: str
  derivation: DS_EOT.DSTERM
- name: _EOT_TERM
  type: str
  derivation:
    str_replace:
      source: _EOT_TERM0
      pattern: '[\r\n\f\u00c2\u00a0]'
      replacement: ' '
- name: _EOT_RU
  type: str
  derivation:
    str_case:
      source: _EOT_REASON
      to: upper
- name: _EOT_TU
  type: str
  derivation:
    str_case:
      source: _EOT_TERM
      to: upper
- name: _EOT_SPY
  type: str
  derivation:
    case:
    - when: (_EOT_RU IS NULL AND _EOT_TU IS NOT NULL OR _EOT_RU IS NOT NULL AND _EOT_TU IS NULL OR _EOT_RU <> _EOT_TU)
        AND (_EOT_TU IS NULL OR _EOT_TU <> 'COVID') AND (_EOT_RU IS NULL OR _EOT_RU <> 'DEATH')
      then: _EOT_TERM
- name: _DOSE2
  type: str
  derivation: EX_D2._TRTN
- name: _DOSE2DTC
  type: str
  derivation: EX_D2._EXST
- name: _EXSTC
  type: str
  derivation: EX_LAST._EXST
- name: _RANDDT_E
  type: int
  derivation:
    to_epoch_day:
      source: RANDDT
- name: _TR01SDT_E
  type: int
  derivation:
    to_epoch_day:
      source: TR01SDT
- name: _DOSE2DT_E
  type: int
  derivation:
    to_epoch_day:
      source: DOSE2DT
- name: _EOSDT_E
  type: int
  derivation:
    to_epoch_day:
      source: EOSDT
- name: _CUTOFFDT_E
  type: int
  derivation:
    to_epoch_day:
      source: CUTOFFDT
- name: _EFFCODT_E
  type: int
  derivation:
    to_epoch_day:
      source: EFFCODT
- name: _EOTDT_E
  type: int
  derivation:
    to_epoch_day:
      source: EOTDT
- name: _SEV1
  type: int
  derivation:
    case:
    - when: DV1._SEQ IS NOT NULL
      then: 1
    - otherwise: 0
- name: _SEV2
  type: int
  derivation:
    case:
    - when: DV2._SEQ IS NOT NULL
      then: 1
    - otherwise: 0
- name: _SEV3
  type: int
  derivation:
    case:
    - when: DV3._SEQ IS NOT NULL
      then: 1
    - otherwise: 0
- name: _SEV8
  type: int
  derivation:
    case:
    - when: DV8._SEQ IS NOT NULL
      then: 1
    - otherwise: 0
- name: _RANDOK
  type: int
  derivation:
    case:
    - when: _RANDDTC IS NOT NULL AND _SEV1 = 0
      then: 1
    - otherwise: 0
- name: _EOTFL
  type: str
  derivation:
    case:
    - when: DOSE2DT IS NOT NULL
      then: '''Y'''
    - when: _EOT IS NOT NULL AND (_EOT_REASON IS NULL OR _EOT_REASON <> 'COMPLETED')
      then: '''N'''
- name: _D2MD1
  type: int
  derivation: _DOSE2DT_E - _TR01SDT_E
- name: _EFFMD1
  type: int
  derivation: _EFFCODT_E - _TR01SDT_E
- name: _RSKN
  type: int
  derivation:
    case:
    - when: RSKF1 IS NULL AND RSKF2 IS NULL AND RSKF3 IS NULL AND RSKF4 IS NULL AND RSKF5 IS NULL AND RSKF6 IS NULL
      then: 0
    - otherwise: 1
- name: _SCOV2BL_L
  type: str
  derivation:
    str_case:
      source: SCOV2BL
      to: lower
- name: _SAFE1
  type: str
  derivation:
    case:
    - when: RANDFL = 'Y' AND SAFFL = 'N'
      then: '''Did not receive any vaccination'''
- name: _FASE2
  type: str
  derivation:
    case:
    - when: RANDFL = 'Y' AND (_SEV1 = 1 OR _SEV2 = 1 OR _SEV8 = 1)
      then: '''Had major protocol deviations'''
- name: _SAFE2
  type: str
  derivation:
    case:
    - when: RANDFL = 'Y' AND (_SEV1 = 1 OR _SEV8 = 1)
      then: '''Had major protocol deviations'''
- name: _SAR1E3
  type: str
  derivation:
    case:
    - when: RANDFL = 'Y' AND SAFFL = 'Y' AND SAR1FL = 'N'
      then: '''Did not contribute any solicited AR data for Vaccination #1'''
- name: _SAR2E3
  type: str
  derivation:
    case:
    - when: RANDFL = 'Y' AND SAFFL = 'Y' AND DOSE2FL = 'N'
      then: '''Did not receive Vaccination #2'''
- name: _SAR2E4
  type: str
  derivation:
    case:
    - when: RANDFL = 'Y' AND SAFFL = 'Y' AND DOSE2FL = 'Y' AND SAR2FL = 'N'
      then: '''Did not contribute any solicited AR data for Vaccination #2'''
- name: _MITT3
  type: str
  derivation:
    case:
    - when: RANDFL = 'Y' AND _SCOV2BL_L = 'positive'
      then: '''PCR and/or serology positive at baseline'''
- name: _MITT4
  type: str
  derivation:
    case:
    - when: RANDFL = 'Y' AND SCOV2BL IS NULL
      then: '''PCR and/or serology missing at baseline'''
- name: _PPE1
  type: str
  derivation:
    case:
    - when: PPROTFL = 'N' AND RANDFL = 'Y' AND MITTFL = 'N'
      then: '''Excluded from mITT population'''
- name: _PPE2
  type: str
  derivation:
    case:
    - when: PPROTFL = 'N' AND RANDFL = 'Y' AND DOSE2FL = 'N' AND (_EFFMD1 >= 42 OR (EOTSTT = 'DISCONTINUED' AND
        _EOTDT_E IS NOT NULL AND _EOTDT_E <= _EFFCODT_E) OR (EOSSTT = 'DISCONTINUED' AND _EOSDT_E IS NOT NULL AND
        _EOSDT_E <= _EFFCODT_E))
      then: '''Did not receive Vaccination #2 per schedule'''
- name: _PPE3
  type: str
  derivation:
    case:
    - when: PPROTFL = 'N' AND RANDFL = 'Y' AND (_SEV1 = 1 OR _SEV2 = 1 OR _SEV3 = 1 OR _SEV8 = 1)
      then: '''Had major protocol deviations'''
- name: _PPE4
  type: str
  derivation:
    case:
    - when: PPROTFL = 'N' AND ((RANDFL = 'Y' AND (TRT01A IS NOT NULL AND (TRT01P IS NULL OR TRT01A <> TRT01P)))
        OR (_DOSE2 IS NOT NULL AND (TRT01P IS NULL OR _DOSE2 <> TRT01P)))
      then: '''Received incorrect vaccination'''
- name: _PPE5
  type: str
  derivation:
    case:
    - when: PPROTFL = 'N' AND SAFFL = 'Y' AND DOSE2FL = 'Y' AND ((_D2MD1 IS NOT NULL AND _D2MD1 < 21) OR _D2MD1
        > 42)
      then: '''Received Vaccination #2 out of window'''
- name: _FASE_ACC2
  type: str
  derivation:
    case:
    - when: _SAFE1 IS NULL
      then: _FASE2
    - when: _FASE2 IS NULL
      then: _SAFE1
    - otherwise:
        str_template: '{_SAFE1}, {_FASE2}'
- name: _SAFE_ACC2
  type: str
  derivation:
    case:
    - when: _SAFE1 IS NULL
      then: _SAFE2
    - when: _SAFE2 IS NULL
      then: _SAFE1
    - otherwise:
        str_template: '{_SAFE1}, {_SAFE2}'
- name: _SAR1E_ACC2
  type: str
  derivation:
    case:
    - when: _SAFE1 IS NULL
      then: _SAFE2
    - when: _SAFE2 IS NULL
      then: _SAFE1
    - otherwise:
        str_template: '{_SAFE1}, {_SAFE2}'
- name: _SAR1E_ACC3
  type: str
  derivation:
    case:
    - when: _SAR1E_ACC2 IS NULL
      then: _SAR1E3
    - when: _SAR1E3 IS NULL
      then: _SAR1E_ACC2
    - otherwise:
        str_template: '{_SAR1E_ACC2}, {_SAR1E3}'
- name: _SAR2E_ACC2
  type: str
  derivation:
    case:
    - when: _SAFE1 IS NULL
      then: _SAFE2
    - when: _SAFE2 IS NULL
      then: _SAFE1
    - otherwise:
        str_template: '{_SAFE1}, {_SAFE2}'
- name: _SAR2E_ACC3
  type: str
  derivation:
    case:
    - when: _SAR2E_ACC2 IS NULL
      then: _SAR2E3
    - when: _SAR2E3 IS NULL
      then: _SAR2E_ACC2
    - otherwise:
        str_template: '{_SAR2E_ACC2}, {_SAR2E3}'
- name: _SAR2E_ACC4
  type: str
  derivation:
    case:
    - when: _SAR2E_ACC3 IS NULL
      then: _SAR2E4
    - when: _SAR2E4 IS NULL
      then: _SAR2E_ACC3
    - otherwise:
        str_template: '{_SAR2E_ACC3}, {_SAR2E4}'
- name: _MITT_ACC2
  type: str
  derivation:
    case:
    - when: _SAFE1 IS NULL
      then: _SAFE2
    - when: _SAFE2 IS NULL
      then: _SAFE1
    - otherwise:
        str_template: '{_SAFE1}, {_SAFE2}'
- name: _MITT_ACC3
  type: str
  derivation:
    case:
    - when: _MITT_ACC2 IS NULL
      then: _MITT3
    - when: _MITT3 IS NULL
      then: _MITT_ACC2
    - otherwise:
        str_template: '{_MITT_ACC2}, {_MITT3}'
- name: _MITT_ACC4
  type: str
  derivation:
    case:
    - when: _MITT_ACC3 IS NULL
      then: _MITT4
    - when: _MITT4 IS NULL
      then: _MITT_ACC3
    - otherwise:
        str_template: '{_MITT_ACC3}, {_MITT4}'
- name: _PPE_ACC2
  type: str
  derivation:
    case:
    - when: _PPE1 IS NULL
      then: _PPE2
    - when: _PPE2 IS NULL
      then: _PPE1
    - otherwise:
        str_template: '{_PPE1}, {_PPE2}'
- name: _PPE_ACC3
  type: str
  derivation:
    case:
    - when: _PPE_ACC2 IS NULL
      then: _PPE3
    - when: _PPE3 IS NULL
      then: _PPE_ACC2
    - otherwise:
        str_template: '{_PPE_ACC2}, {_PPE3}'
- name: _PPE_ACC4
  type: str
  derivation:
    case:
    - when: _PPE_ACC3 IS NULL
      then: _PPE4
    - when: _PPE4 IS NULL
      then: _PPE_ACC3
    - otherwise:
        str_template: '{_PPE_ACC3}, {_PPE4}'
- name: _PPE_ACC5
  type: str
  derivation:
    case:
    - when: _PPE_ACC4 IS NULL
      then: _PPE5
    - when: _PPE5 IS NULL
      then: _PPE_ACC4
    - otherwise:
        str_template: '{_PPE_ACC4}, {_PPE5}'
- name: _RS1
  type: str
  derivation:
    case:
    - when: _RACE1 IS NOT NULL
      then: '''White'''
- name: _RS2
  type: str
  derivation:
    case:
    - when: _RACE2 IS NOT NULL
      then: '''Black or African American'''
- name: _RS3
  type: str
  derivation:
    case:
    - when: _RACE3 IS NOT NULL
      then: '''Asian'''
- name: _RS4
  type: str
  derivation:
    case:
    - when: _RACE4 IS NOT NULL
      then: '''American Indian or Alaska Native'''
- name: _RS5
  type: str
  derivation:
    case:
    - when: _RACE5 IS NOT NULL
      then: '''Native Hawaiian or other Pacific Islander'''
- name: _RS6
  type: str
  derivation:
    case:
    - when: _RACE6 IS NOT NULL AND _RACEOTH IS NOT NULL
      then:
        str_template: 'Other: {_RACEOTH}'
    - when: _RACE6 IS NOT NULL
      then: '''Other'''
- name: _RS7
  type: str
  derivation:
    case:
    - when: _RACE7 IS NOT NULL
      then: '''Unknown'''
- name: _RS8
  type: str
  derivation:
    case:
    - when: _RACE8 IS NOT NULL
      then: '''Not reported'''
- name: _RSC1
  type: int
  derivation:
    case:
    - when: _RS1 IS NOT NULL
      then: 1
    - otherwise: 0
- name: _RSC2
  type: int
  derivation:
    case:
    - when: _RS2 IS NOT NULL
      then: 1
    - otherwise: 0
- name: _RSC3
  type: int
  derivation:
    case:
    - when: _RS3 IS NOT NULL
      then: 1
    - otherwise: 0
- name: _RSC4
  type: int
  derivation:
    case:
    - when: _RS4 IS NOT NULL
      then: 1
    - otherwise: 0
- name: _RSC5
  type: int
  derivation:
    case:
    - when: _RS5 IS NOT NULL
      then: 1
    - otherwise: 0
- name: _RSC6
  type: int
  derivation:
    case:
    - when: _RS6 IS NOT NULL
      then: 1
    - otherwise: 0
- name: _RSC7
  type: int
  derivation:
    case:
    - when: _RS7 IS NOT NULL
      then: 1
    - otherwise: 0
- name: _RSC8
  type: int
  derivation:
    case:
    - when: _RS8 IS NOT NULL
      then: 1
    - otherwise: 0
- name: _RSN
  type: int
  derivation: _RSC1 + _RSC2 + _RSC3 + _RSC4 + _RSC5 + _RSC6 + _RSC7 + _RSC8
- name: _RSP_ACC2
  type: str
  derivation:
    case:
    - when: _RS1 IS NULL
      then: _RS2
    - when: _RS2 IS NULL
      then: _RS1
    - otherwise:
        str_template: '{_RS1}, {_RS2}'
- name: _RSP_ACC3
  type: str
  derivation:
    case:
    - when: _RSP_ACC2 IS NULL
      then: _RS3
    - when: _RS3 IS NULL
      then: _RSP_ACC2
    - otherwise:
        str_template: '{_RSP_ACC2}, {_RS3}'
- name: _RSP_ACC4
  type: str
  derivation:
    case:
    - when: _RSP_ACC3 IS NULL
      then: _RS4
    - when: _RS4 IS NULL
      then: _RSP_ACC3
    - otherwise:
        str_template: '{_RSP_ACC3}, {_RS4}'
- name: _RSP_ACC5
  type: str
  derivation:
    case:
    - when: _RSP_ACC4 IS NULL
      then: _RS5
    - when: _RS5 IS NULL
      then: _RSP_ACC4
    - otherwise:
        str_template: '{_RSP_ACC4}, {_RS5}'
- name: _RSP_ACC6
  type: str
  derivation:
    case:
    - when: _RSP_ACC5 IS NULL
      then: _RS6
    - when: _RS6 IS NULL
      then: _RSP_ACC5
    - otherwise:
        str_template: '{_RSP_ACC5}, {_RS6}'
- name: _RSP_ACC7
  type: str
  derivation:
    case:
    - when: _RSP_ACC6 IS NULL
      then: _RS7
    - when: _RS7 IS NULL
      then: _RSP_ACC6
    - otherwise:
        str_template: '{_RSP_ACC6}, {_RS7}'
- name: _RSP_ACC8
  type: str
  derivation:
    case:
    - when: _RSP_ACC7 IS NULL
      then: _RS8
    - when: _RS8 IS NULL
      then: _RSP_ACC7
    - otherwise:
        str_template: '{_RSP_ACC7}, {_RS8}'
- name: _HEIGHTBL
  type: float
  derivation:
    case:
    - when: HW_HEIGHT.VSSTRESU = 'cm' AND NOT HW_HEIGHT.VSSTRESN LIKE '(%'
      then: HW_HEIGHT.VSSTRESN
- name: _WEIGHTBL
  type: float
  derivation:
    case:
    - when: HW_WEIGHT.VSSTRESU = 'kg' AND NOT HW_WEIGHT.VSSTRESN LIKE '(%'
      then: HW_WEIGHT.VSSTRESN
- name: _BMIBL
  type: float
  derivation:
    case:
    - when: _HEIGHTBL IS NOT NULL AND _WEIGHTBL IS NOT NULL
      then: _WEIGHTBL / ((_HEIGHTBL / 100) * (_HEIGHTBL / 100))
- name: _BMIBL_TT1
  type: str
  derivation:
    str_decimal:
      source: _BMIBL
      decimals: 16
- name: _BMIBL_TK1
  type: float
  derivation:
    str_substr:
      source: _BMIBL_TT1
      start: 1
      length: 16
- name: _BMIBL_TC1
  type: int
  derivation:
    str_substr:
      source: _BMIBL_TT1
      start: 17
      length: 2
- name: _BMIBL_TV1
