# ADSL for Moderna mRNA-1273-P301, cut S5 (EUA 27073 S5, interim analysis
# IA1b, data cutoff 2020-11-25, efficacy cutoff 2020-11-21). Parent:
# ../../../spec/yamaa/base/adam-base-ia.yaml (86 shared + 6 IA-only ADSL
# columns). Derivations port the S5 program adsl.sas
# (spec/source/program/adam/...5657916-5657931_27073_S5_..._A_P_adsl.txt).
# The S80 program differs in three places only (no fatal-AE fallback for
# DTHDT, any treatment disposition ends treatment, other cutoffs) besides
# a log message, so the S80 spec is a layer over this one.
#
# One row per DM subject, less the program's delete rule (ARMCD
# SCRNFAIL/blank with a SCREEN FAILURE disposition, or ENROLYN 'N' in the
# latest first-of-group disposition record and no randomization).
# ds_all keeps only the first record of each (DSREFID, DSCAT, DSSCAT) group
# by (DSSTDTC, DSDECOD, DSTERM); every DS merge reads those records:
# DS_GF finds the first record of a group, and the disposition lookups are
# ordered by the same keys.
#
# Inputs the release lacks:
#   * The S5 release carries no FACE (only SUPPFACE), so the FACE records
#     behind SAR1FL and SAR2FL are read from the S3 release, a later
#     snapshot of the same study, as the S5 ADAR spec does.
#   * Macro values: &cutext 25NOV2020 (CUTOFFDT) and &cut_effi 21NOV2020
#     (EFFCODT, and the upper bound of the protocol deviations counted).
# HEIGHTBL and BMIBL are text and PROTVER and RANDNUM numbers in the
# submitted file (the JMP conversion), so they are written that way:
# HEIGHTBL is the VS VSSTRESN text and BMIBL is written with 15 significant
# digits, whose last digit differs from the submitted text in about 540
# values (within the comparison tolerance).
yamaa: '1.0'
type: spec
model: ADaM
parent: ../../../spec/yamaa/base/adam-base-ia.yaml
domain: ADSL
keys:
- STUDYID
- USUBJID
input:
  DM: <sdtm-dir>/dm.parquet
  SUPPDM: <sdtm-dir>/suppdm.parquet
  DS: <sdtm-dir>/ds.parquet
  SUPPDS: <sdtm-dir>/suppds.parquet
  EX: <sdtm-dir>/ex.parquet
  VS: <sdtm-dir>/vs.parquet
  FACE: <study-dir>/s3/data/sdtm/face.parquet
  MH: <sdtm-dir>/mh.parquet
  MB: <sdtm-dir>/mb.parquet
  SUPPMB: <sdtm-dir>/suppmb.parquet
  IS: <sdtm-dir>/is.parquet
  RP: <sdtm-dir>/rp.parquet
  SUPPRP: <sdtm-dir>/supprp.parquet
  DD: <sdtm-dir>/dd.parquet
  AE: <sdtm-dir>/ae.parquet
  DV: <sdtm-dir>/dv.parquet
  SUPPDV: <sdtm-dir>/suppdv.parquet
submission:
  label: Subject-Level Analysis Dataset
  class: SUBJECT LEVEL ANALYSIS DATASET
  structure: One record per subject
  repeating: false
rows:
- id: subjects
  dataset: DM
  filter: NOT ((DM.ARMCD IS NULL OR DM.ARMCD = 'SCRNFAIL') AND _SCRN IS NOT NULL) AND NOT (_ENRN = 1 AND RANDNUM
    IS NULL)
intermediates:
- id: SUPPDM_P
  dataset: SUPPDM
  key:
  - STUDYID
  - USUBJID
  filter: SUPPDM.QNAM IN ('COHORT', 'RACE1', 'RACE2', 'RACE3', 'RACE4', 'RACE5', 'RACE6', 'RACE7', 'RACE8', 'RACEOTH',
    'PROTVER', 'PREVSCR')
  pivot:
    name: QNAM
    value: QVAL
    fields:
    - COHORT
    - RACE1
    - RACE2
    - RACE3
    - RACE4
    - RACE5
    - RACE6
    - RACE7
    - RACE8
    - RACEOTH
    - PROTVER
    - PREVSCR
- id: SUPPDS_P
  dataset: SUPPDS
  key:
    STUDYID: STUDYID
    USUBJID: USUBJID
    IDVARVAL:
      str_decimal:
        source: DSSEQ
        decimals: 0
  filter: SUPPDS.QNAM = 'ENROLYN' AND SUPPDS.IDVAR = 'DSSEQ'
  pivot:
    name: QNAM
    value: QVAL
    fields:
    - ENROLYN
- id: DS_GF
  dataset: DS
  key:
  - STUDYID
  - USUBJID
  - _GK
  filter: NOT (DS.DSTERM = 'RANDOMIZED' AND DS.DSSPID IS NULL AND DS.DSSTDTC IS NULL AND DS._ENR IS NULL)
  derivations:
    _ENR:
      type: str
      derivation: SUPPDS_P.ENROLYN
    _R:
      type: str
      derivation:
        case:
        - when: DS.DSREFID IS NULL
          then: '''~'''
        - otherwise: DS.DSREFID
    _C:
      type: str
      derivation:
        case:
        - when: DS.DSCAT IS NULL
          then: '''~'''
        - otherwise: DS.DSCAT
    _S:
      type: str
      derivation:
        case:
        - when: DS.DSSCAT IS NULL
          then: '''~'''
        - otherwise: DS.DSSCAT
    _GK:
      type: str
      derivation:
        str_template: '{_R}|{_C}|{_S}'
  order_by:
  - DS.DSSTDTC
  - DS.DSDECOD
  - DS.DSTERM
  keep: first
- id: ENROL
  dataset: DS
  key:
  - STUDYID
  - USUBJID
  filter: NOT (DS.DSTERM = 'RANDOMIZED' AND DS.DSSPID IS NULL AND DS.DSSTDTC IS NULL AND DS._ENR IS NULL)
  derivations:
    _ENR:
      type: str
      derivation: SUPPDS_P.ENROLYN
    _R:
      type: str
      derivation:
        case:
        - when: DS.DSREFID IS NULL
          then: '''~'''
        - otherwise: DS.DSREFID
    _C:
      type: str
      derivation:
        case:
        - when: DS.DSCAT IS NULL
          then: '''~'''
        - otherwise: DS.DSCAT
    _S:
      type: str
      derivation:
        case:
        - when: DS.DSSCAT IS NULL
          then: '''~'''
        - otherwise: DS.DSSCAT
    _GK:
      type: str
      derivation:
        str_template: '{_R}|{_C}|{_S}'
    _GFSEQ:
      type: float
      derivation: DS_GF.DSSEQ
    _ISF:
      type: int
      derivation:
        case:
        - when: _GFSEQ = DS.DSSEQ
          then: 1
        - otherwise: 0
    _ENRN:
      type: int
      derivation:
        case:
        - when: _ENR = 'N'
          then: 1
        - otherwise: 0
  order_by:
  - DS._ISF
  - DS.DSSTDTC
  - DS.DSREFID
  - DS._ENRN
  keep: last
- id: DS_RAND
  dataset: DS
  key:
  - STUDYID
  - USUBJID
  filter: NOT (DS.DSTERM = 'RANDOMIZED' AND DS.DSSPID IS NULL AND DS.DSSTDTC IS NULL AND DS._ENR IS NULL) AND DS.DSDECOD
    = 'RANDOMIZED' AND DS.DSSTDTC IS NOT NULL AND DS.DSREFID IS NOT NULL
  derivations:
    _ENR:
      type: str
      derivation: SUPPDS_P.ENROLYN
  order_by:
  - DS.DSREFID
  - DS.DSCAT
  - DS.DSSCAT
  - DS.DSSTDTC
  - DS.DSDECOD
  - DS.DSTERM
  keep: first
- id: DS_SCRN
  dataset: DS
  key:
  - STUDYID
  - USUBJID
  filter: NOT (DS.DSTERM = 'RANDOMIZED' AND DS.DSSPID IS NULL AND DS.DSSTDTC IS NULL AND DS._ENR IS NULL) AND DS.DSSCAT
    = 'SCREEN FAILURE'
  derivations:
    _ENR:
      type: str
      derivation: SUPPDS_P.ENROLYN
  order_by:
  - DS.DSREFID
  - DS.DSCAT
  - DS.DSSCAT
  - DS.DSSTDTC
  - DS.DSDECOD
  - DS.DSTERM
  keep: first
- id: DS_EOS
  dataset: DS
  key:
  - STUDYID
  - USUBJID
  filter: NOT (DS.DSTERM = 'RANDOMIZED' AND DS.DSSPID IS NULL AND DS.DSSTDTC IS NULL AND DS._ENR IS NULL) AND DS.DSSCAT
    = 'END OF STUDY'
  derivations:
    _ENR:
      type: str
      derivation: SUPPDS_P.ENROLYN
  order_by:
  - DS.DSREFID
  - DS.DSCAT
  - DS.DSSCAT
  - DS.DSSTDTC
  - DS.DSDECOD
  - DS.DSTERM
  keep: first
- id: DS_EOT
  dataset: DS
  key:
  - STUDYID
  - USUBJID
  filter: NOT (DS.DSTERM = 'RANDOMIZED' AND DS.DSSPID IS NULL AND DS.DSSTDTC IS NULL AND DS._ENR IS NULL) AND DS.DSSCAT
    = 'STUDY TREATMENT'
  derivations:
    _ENR:
      type: str
      derivation: SUPPDS_P.ENROLYN
  order_by:
  - DS.DSREFID
  - DS.DSCAT
  - DS.DSSCAT
  - DS.DSSTDTC
  - DS.DSDECOD
  - DS.DSTERM
  keep: first
- id: EX_LAST
  dataset: EX
  key:
  - STUDYID
  - USUBJID
  filter: EX._EXST IS NOT NULL
  derivations:
    _EXST:
      type: str
      derivation:
        first_available:
          sources:
          - EX.EXSTDTC
          - EX.EXENDTC
    _EXMAX:
      type: str
      derivation:
        case:
        - when: EX.EXSTDTC IS NOT NULL AND (EX.EXENDTC IS NULL OR EX.EXSTDTC > EX.EXENDTC)
          then: EX.EXSTDTC
        - otherwise: EX.EXENDTC
    _TRTN:
      type: str
      derivation:
        case:
        - when: EX.EXTRT = 'PLACEBO'
          then: '''Placebo'''
        - otherwise: EX.EXTRT
  order_by:
  - EX._EXST
  - EX._EXMAX
  - EX.VISITDY
  keep: last
- id: EX_D1
  dataset: EX
  key:
  - STUDYID
  - USUBJID
  filter: EX._EXST IS NOT NULL AND EX.VISITDY = 1
  derivations:
    _EXST:
      type: str
      derivation:
        first_available:
          sources:
          - EX.EXSTDTC
          - EX.EXENDTC
    _EXMAX:
      type: str
      derivation:
        case:
        - when: EX.EXSTDTC IS NOT NULL AND (EX.EXENDTC IS NULL OR EX.EXSTDTC > EX.EXENDTC)
          then: EX.EXSTDTC
        - otherwise: EX.EXENDTC
    _TRTN:
      type: str
      derivation:
        case:
        - when: EX.EXTRT = 'PLACEBO'
          then: '''Placebo'''
        - otherwise: EX.EXTRT
  order_by:
  - EX._EXST
  - EX._EXMAX
  - EX.VISITDY
  keep: last
- id: EX_D2
  dataset: EX
  key:
  - STUDYID
  - USUBJID
  filter: EX._EXST IS NOT NULL AND EX.VISITDY = 29
  derivations:
    _EXST:
      type: str
      derivation:
        first_available:
          sources:
          - EX.EXSTDTC
          - EX.EXENDTC
    _EXMAX:
      type: str
      derivation:
        case:
        - when: EX.EXSTDTC IS NOT NULL AND (EX.EXENDTC IS NULL OR EX.EXSTDTC > EX.EXENDTC)
          then: EX.EXSTDTC
        - otherwise: EX.EXENDTC
    _TRTN:
      type: str
      derivation:
        case:
        - when: EX.EXTRT = 'PLACEBO'
          then: '''Placebo'''
        - otherwise: EX.EXTRT
  order_by:
  - EX._EXST
  - EX._EXMAX
  - EX.VISITDY
  keep: last
- id: VS_SAR1
  dataset: VS
  key:
  - STUDYID
  - USUBJID
  filter: VS.VSCAT = 'REACTOGENICITY' AND VS.VSTESTCD = 'TEMP' AND VS.VSORRES IS NOT NULL AND VS.VSDTC IS NOT NULL
    AND str_contains(VS._TPR, 'DOSE1')
  derivations:
    _TPR:
      type: str
      derivation:
        str_replace:
          source: VS.VSTPTREF
          pattern: ' '
          replacement: ''
  order_by:
  - VS.VSDTC
  keep: last
- id: VS_SAR2
  dataset: VS
  key:
  - STUDYID
  - USUBJID
  filter: VS.VSCAT = 'REACTOGENICITY' AND VS.VSTESTCD = 'TEMP' AND VS.VSORRES IS NOT NULL AND VS.VSDTC IS NOT NULL
    AND str_contains(VS._TPR, 'DOSE2')
  derivations:
    _TPR:
      type: str
      derivation:
        str_replace:
          source: VS.VSTPTREF
          pattern: ' '
          replacement: ''
  order_by:
  - VS.VSDTC
  keep: last
- id: HW_HEIGHT
  dataset: VS
  key:
  - STUDYID
  - USUBJID
  filter: VS.VSTESTCD = 'HEIGHT' AND VS.VSSTRESC IS NOT NULL AND VS.VSORRES IS NOT NULL AND VS.VSDTC IS NOT NULL
    AND NOT (VS.VSDTC = DM.RFXSTDTC AND VS._POST = 1) AND ((VS._HT = 1 AND DM.RFXSTDTC LIKE '%T%' AND VS.VSDTC <=
    DM.RFXSTDTC) OR ((VS._HT = 0 OR NOT DM.RFXSTDTC LIKE '%T%') AND DM.RFXSTDTC IS NOT NULL AND VS._D10 <= DM.RFXSTDTC
    AND VS._POST = 0))
  derivations:
    _POST:
      type: int
      derivation:
        case:
        - when: VS.VSTPT IS NOT NULL AND str_contains(VS.VSTPT, 'POST')
          then: 1
        - otherwise: 0
    _HT:
      type: int
      derivation:
        case:
        - when: VS.VSDTC LIKE '%T%'
          then: 1
        - otherwise: 0
    _D10:
      type: str
      derivation:
        str_substr:
          source: VS.VSDTC
          start: 1
          length: 10
  order_by:
  - VS.VSDTC
  - VS.VISITNUM
  - variable: VS.VSSEQ
    direction: desc
  keep: last
- id: HW_WEIGHT
  dataset: VS
  key:
  - STUDYID
  - USUBJID
  filter: VS.VSTESTCD = 'WEIGHT' AND VS.VSSTRESC IS NOT NULL AND VS.VSORRES IS NOT NULL AND VS.VSDTC IS NOT NULL
    AND NOT (VS.VSDTC = DM.RFXSTDTC AND VS._POST = 1) AND ((VS._HT = 1 AND DM.RFXSTDTC LIKE '%T%' AND VS.VSDTC <=
    DM.RFXSTDTC) OR ((VS._HT = 0 OR NOT DM.RFXSTDTC LIKE '%T%') AND DM.RFXSTDTC IS NOT NULL AND VS._D10 <= DM.RFXSTDTC
    AND VS._POST = 0))
  derivations:
    _POST:
      type: int
      derivation:
        case:
        - when: VS.VSTPT IS NOT NULL AND str_contains(VS.VSTPT, 'POST')
          then: 1
        - otherwise: 0
    _HT:
      type: int
      derivation:
        case:
        - when: VS.VSDTC LIKE '%T%'
          then: 1
        - otherwise: 0
    _D10:
      type: str
      derivation:
        str_substr:
          source: VS.VSDTC
          start: 1
          length: 10
  order_by:
  - VS.VSDTC
  - VS.VISITNUM
  - variable: VS.VSSEQ
    direction: desc
  keep: last
- id: FACE_SAR1
  dataset: FACE
  key:
  - STUDYID
  - USUBJID
  filter: FACE.FASTAT IS NULL AND FACE.FASTRESC IS NOT NULL AND FACE.FATPTREF = 'DOSE 1'
  order_by:
  - FACE.FASEQ
  keep: last
- id: FACE_SAR2
  dataset: FACE
  key:
  - STUDYID
  - USUBJID
  filter: FACE.FASTAT IS NULL AND FACE.FASTRESC IS NOT NULL AND FACE.FATPTREF = 'DOSE 2'
  order_by:
  - FACE.FASEQ
  keep: last
- id: MH_RSK1
  dataset: MH
  key:
  - STUDYID
  - USUBJID
  filter: MH.MHTERM = 'LUNG DISEASE' AND MH.MHOCCUR = 'Y' AND MH.MHCAT = 'RISK FACTOR FOR COVID-19'
  order_by:
  - MH.MHSEQ
  keep: first
- id: MH_RSK2
  dataset: MH
  key:
  - STUDYID
  - USUBJID
  filter: MH.MHTERM = 'CARDIAC DISEASE' AND MH.MHOCCUR = 'Y' AND MH.MHCAT = 'RISK FACTOR FOR COVID-19'
  order_by:
  - MH.MHSEQ
  keep: first
- id: MH_RSK3
  dataset: MH
  key:
  - STUDYID
  - USUBJID
  filter: MH.MHTERM = 'SEVERE OBESITY' AND MH.MHOCCUR = 'Y' AND MH.MHCAT = 'RISK FACTOR FOR COVID-19'
  order_by:
  - MH.MHSEQ
  keep: first
- id: MH_RSK4
  dataset: MH
  key:
  - STUDYID
  - USUBJID
  filter: MH.MHTERM = 'DIABETES' AND MH.MHOCCUR = 'Y' AND MH.MHCAT = 'RISK FACTOR FOR COVID-19'
  order_by:
  - MH.MHSEQ
  keep: first
- id: MH_RSK5
  dataset: MH
  key:
  - STUDYID
  - USUBJID
  filter: MH.MHTERM = 'LIVER DISEASE' AND MH.MHOCCUR = 'Y' AND MH.MHCAT = 'RISK FACTOR FOR COVID-19'
  order_by:
  - MH.MHSEQ
  keep: first
- id: MH_RSK6
  dataset: MH
  key:
  - STUDYID
  - USUBJID
  filter: MH.MHTERM = 'HIV' AND MH.MHOCCUR = 'Y' AND MH.MHCAT = 'RISK FACTOR FOR COVID-19'
  order_by:
  - MH.MHSEQ
  keep: first
- id: SUPPMB_L
  dataset: SUPPMB
  key:
    STUDYID: STUDYID
    USUBJID: USUBJID
    IDVARVAL:
      str_decimal:
        source: MBSEQ
        decimals: 0
  filter: SUPPMB.QNAM = 'LOCALFL' AND SUPPMB.IDVAR = 'MBSEQ'
  pivot:
    name: QNAM
    value: QVAL
    fields:
    - LOCALFL
- id: MB_BL
  dataset: MB
  key:
  - STUDYID
  - USUBJID
  filter: MB.MBTESTCD = 'SARSCOV2' AND MB.MBSTRESC IS NOT NULL AND NOT str_contains(MB._LST, 'comment') AND MB._LOC
    IS NULL AND MB.MBDTC IS NOT NULL AND DM.RFXSTDTC IS NOT NULL AND MB._D10 <= DM.RFXSTDTC
  derivations:
    _LST:
      type: str
      derivation:
        str_case:
          source: MB.MBSTRESC
          to: lower
    _LOC:
      type: str
      derivation: SUPPMB_L.LOCALFL
    _D10:
      type: str
      derivation:
        str_substr:
          source: MB.MBDTC
          start: 1
          length: 10
  order_by:
  - MB.MBDTC
  - variable: MB.MBSTRESC
    direction: desc
  keep: last
- id: IS_BL
  dataset: IS
  key:
  - STUDYID
  - USUBJID
  filter: IS.ISORRES IS NOT NULL AND IS.ISDTC IS NOT NULL AND DM.RFXSTDTC IS NOT NULL AND IS._D10 <= DM.RFXSTDTC
  derivations:
    _D10:
      type: str
      derivation:
        str_substr:
          source: IS.ISDTC
          start: 1
          length: 10
  order_by:
  - IS.ISDTC
  - IS.ISSTRESC
  keep: last
- id: RP_CHIL
  dataset: RP
  key:
  - STUDYID
  - USUBJID
  filter: RP.RPTESTCD = 'CHILDPOT'
  order_by:
  - RP.RPSEQ
  keep: first
- id: SUPPRP_CB
  dataset: SUPPRP
  key:
    STUDYID: STUDYID
    USUBJID: USUBJID
    IDVARVAL:
      str_decimal:
        source: RPSEQ
        decimals: 0
  filter: SUPPRP.QNAM = 'CBRSN' AND SUPPRP.IDVAR = 'RPSEQ'
  pivot:
    name: QNAM
    value: QVAL
    fields:
    - CBRSN
- id: RP_CB
  dataset: RP
  key:
  - STUDYID
  - USUBJID
  filter: RP._CB IS NOT NULL
  derivations:
    _CB:
      type: str
      derivation: SUPPRP_CB.CBRSN
    _RSTN:
      type: int
      derivation:
        mapping:
          source: RP.RPTESTCD
          dict:
            CHILDPOT: 0
            SURSTL: 1
            PM: 2
            PARTSTL: 3
            PREMENAR: 4
            OTHSYS: 5
          unmapped: 9
          missing: 9
  order_by:
  - RP._RSTN
  - RP.RPSEQ
  keep: first
- id: DD_DTH
  dataset: DD
  key:
  - STUDYID
  - USUBJID
  filter: DD.DDTESTCD = 'DTHCAUS'
  order_by:
  - DD.DDSEQ
  keep: first
- id: DD_AUT
  dataset: DD
  key:
  - STUDYID
  - USUBJID
  filter: DD.DDTESTCD = 'AUTOPERF'
  order_by:
  - DD.DDSEQ
  keep: first
- id: AE_DTH
  dataset: AE
  key:
  - STUDYID
  - USUBJID
  filter: AE.AESDTH = 'Y'
  order_by:
  - variable: AE.AEENDTC
    nulls: first
  keep: last
- id: DV_BYSEQ
  dataset: DV
  key:
    STUDYID: STUDYID
    USUBJID: USUBJID
    DVSEQ: _SEQ
  order_by:
  - DV.DVSEQ
  keep: first
- id: DV1
  dataset: SUPPDV
  key:
  - STUDYID
  - USUBJID
  filter: SUPPDV.QNAM = 'SEVDES' AND SUPPDV.IDVAR = 'DVSEQ' AND str_contains(SUPPDV._C, '1-') AND SUPPDV._DT IS
    NOT NULL AND SUPPDV._DT <= ADSL.EFFCODT
  derivations:
    _C:
      type: str
      derivation:
        str_replace:
          source: SUPPDV.QVAL
          pattern: ' '
          replacement: ''
    _SEQ:
      type: int
      derivation: SUPPDV.IDVARVAL
    _DTC:
      type: str
      derivation: DV_BYSEQ.DVSTDTC
    _DT:
      type: date
      derivation:
        case:
        - when: _DTC LIKE '____-__-__%'
          then:
            to_date:
              source: _DTC
  order_by:
  - SUPPDV._SEQ
  keep: first
- id: DV2
  dataset: SUPPDV
  key:
  - STUDYID
  - USUBJID
  filter: SUPPDV.QNAM = 'SEVDES' AND SUPPDV.IDVAR = 'DVSEQ' AND str_contains(SUPPDV._C, '2-') AND SUPPDV._DT IS
    NOT NULL AND SUPPDV._DT <= ADSL.EFFCODT
  derivations:
    _C:
      type: str
      derivation:
        str_replace:
          source: SUPPDV.QVAL
          pattern: ' '
          replacement: ''
    _SEQ:
      type: int
      derivation: SUPPDV.IDVARVAL
    _DTC:
      type: str
      derivation: DV_BYSEQ.DVSTDTC
    _DT:
      type: date
      derivation:
        case:
        - when: _DTC LIKE '____-__-__%'
          then:
            to_date:
              source: _DTC
  order_by:
  - SUPPDV._SEQ
  keep: first
- id: DV3
  dataset: SUPPDV
  key:
  - STUDYID
  - USUBJID
  filter: SUPPDV.QNAM = 'SEVDES' AND SUPPDV.IDVAR = 'DVSEQ' AND str_contains(SUPPDV._C, '3-') AND SUPPDV._DT IS
    NOT NULL AND SUPPDV._DT <= ADSL.EFFCODT
  derivations:
    _C:
      type: str
      derivation:
        str_replace:
          source: SUPPDV.QVAL
          pattern: ' '
          replacement: ''
    _SEQ:
      type: int
      derivation: SUPPDV.IDVARVAL
    _DTC:
      type: str
      derivation: DV_BYSEQ.DVSTDTC
    _DT:
      type: date
      derivation:
        case:
        - when: _DTC LIKE '____-__-__%'
          then:
            to_date:
              source: _DTC
  order_by:
  - SUPPDV._SEQ
  keep: first
- id: DV8
  dataset: SUPPDV
  key:
  - STUDYID
  - USUBJID
  filter: SUPPDV.QNAM = 'SEVDES' AND SUPPDV.IDVAR = 'DVSEQ' AND str_contains(SUPPDV._C, '8-') AND SUPPDV._DT IS
    NOT NULL AND SUPPDV._DT <= ADSL.EFFCODT
  derivations:
    _C:
      type: str
      derivation:
        str_replace:
          source: SUPPDV.QVAL
          pattern: ' '
          replacement: ''
    _SEQ:
      type: int
      derivation: SUPPDV.IDVARVAL
    _DTC:
      type: str
      derivation: DV_BYSEQ.DVSTDTC
    _DT:
      type: date
      derivation:
        case:
        - when: _DTC LIKE '____-__-__%'
          then:
            to_date:
              source: _DTC
  order_by:
  - SUPPDV._SEQ
  keep: first
