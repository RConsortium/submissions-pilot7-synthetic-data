- name: _PARAM_RAW
  type: str
  derivation:
    case:
    - when: SC.SCTEST <> 'Other'
      then: SC.SCTEST
    - when: SC.SCSCAT = 'OCCUPATIONAL RISK'
      then: '''Other Occupational Risk'''
    - otherwise: '''Other Location And Living Circumstances Risk'''
- name: _PARAM_UP
  type: str
  derivation:
    str_case:
      source: _PARAM_RAW
      to: upper
