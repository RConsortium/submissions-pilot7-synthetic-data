    - when: SC.SCSTRESC IS NULL OR SC.SCSTRESC IN ('')
      then:
        str_replace:
          source: SC.SCORRES
          pattern: ' *[\u{00C2}\u{00A0}]+ *'
          replacement: ' '
  submission:
