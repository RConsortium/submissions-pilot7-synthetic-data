# ADRISK for Moderna mRNA-1273-P301, cut S5 (First Interim
# Analysis IA1b, cutoff 2020-11-25). Parent: ../../../spec/yamaa/base/adam-base-ia.yaml
# (which chains to ../../../spec/yamaa/base/adam-base.yaml; 86 shared + 6 IA-only
# ADSL columns). Derivations implement the S5 IA ADRISK program: one
# row per SC record for ADSL subjects, except the duplicate-administration
# dedupe below (SC 578,209 -> ADRISK 576,266). SCCAT is 'COVID-19
# EXPOSURE' on every SC row, so the program's SCCAT filter drops nothing.
# DEDUPE: 3 subjects carry two complete 19-test SC administrations (38
# rows each); ADRISK keeps the LAST row in SC file order per (USUBJID,
# PARAMCD) -- last-in-file-order reproduces all 576,266 keys, 0 missing,
# first-in-file-order misses 57. Implemented with a keep: last lookup
# (SC_LAST, keyed on STUDYID/USUBJID/SCTEST/SCSCAT, ordered by the
# constant SC.STUDYID so LOOKUP-10's tie rule picks the later stored
# record); the rows filter keeps a row iff its SCSEQ equals the chosen
# record's SCSEQ. A rows filter cannot read a window, so the dedupe is
# a lookup, not a row_number window. Row reconciliation: SC 578,209 -
# 1,886 non-ADSL rows - 57 duplicate administrations = 576,266. NOTE: the
# batch-2 doc's 'SC rows - ADRISK rows = non-ADSL rows (1,943)' is wrong
# for S5 by exactly those 57 rows (1,943 = 1,886 + 57).
# PARAMCD/PARAM follow the program's $ramcd./$ram. formats, not the define
# method (wrong for PASTWRKR 'or', PCIHS 'In-Home', WHSSHIP 'and').
# AVALC is 'Y' whenever SCSTRESC is blank (the program's ^missing(scorres)
# guard never fires differently in S5 data: the 8 blank-SCORRES rows also
# carry 'Y'). OTHSPY is the mojibake-cleaned SCORRES when SCSTRESC is
# blank; OTHSPY1 is SUPPSC SCORRS1 on the same gate (exactly 6 rows).
# OTHSPY2/OTHSPY3 are not in the submitted file (no SCORRS2/3 QNAM exists);
# the spec follows the data and declares neither. SUPPSC exists as a
# properly named file (RDOMAIN='SC'); no other S5 SUPP file carries
# RDOMAIN='SC' (checked by content). The S5 program is NOT byte-identical
# to the S3 program (S5 adds rfxstdtc, AVALC $50, IA AVALC/OTHSPY rules).
# No S27 file is read. SAP v1 vs v3 CLOSED as no-impact
# (2026-11-24) -- the S5 program's own definitions are followed.
# Honest gap: OTHSPY, 5 cells -- the submitted ADRISK free text differs
# from the submitted SC SCORRES on 5 rows, unrecoverably from the allowed
# inputs: 3 rows end '...' in SC but with a single ellipsis char in ADRISK,
# 2 rows gain a word in ADRISK ('VOLUNTEERS FOR (b)(6)', 'IN 6 MONTHS IN
# (b)(6) OF MEDICAL SCHOOL'). No RACESPY NUL-tail gap (0 rows) and no
# duration[us] time columns in the target. Verification: single full
# verify.py run 2026-11-23 04:43:47-04:46:36 UTC (05:43:47-05:46:36 CET,
# ~169 s), yamaa 0.8.0 @135082c1f: 576,266 rows x 64 cols, 61 columns
# compared (3 key columns excluded), 5 mismatches, all OTHSPY (see
# adrisk/verify_report_s5.json, original work tree). The shipped spec differs from
# the verified spec only in this run-record comment.
yamaa: '1.0'
type: spec
model: ADaM
parent: ../../../spec/yamaa/base/adam-base-ia.yaml
domain: ADRISK
keys:
- STUDYID
- USUBJID
- ASEQ
input:
  SC: <sdtm-dir>/sc.parquet
  SUPPSC: <sdtm-dir>/suppsc.parquet
  ADSL:
    path: <adam-dir>/adsl.parquet
    key:
    - STUDYID
    - USUBJID
submission:
  label: Risk of Exposure Analysis Dataset
  class: BASIC DATA STRUCTURE
  structure: One record per subject, per parameter
  repeating: true
rows:
- id: risk
  dataset: SC
  derivations:
    _SCTEST: SC.SCTEST
    _SCSCAT: SC.SCSCAT
    _SCSEQ: SC.SCSEQ
  filter: _ADSL IS NOT NULL AND _SCSEQ = SC_LAST.SCSEQ
intermediates:
- id: SC_LAST
  dataset: SC
  key:
    STUDYID: STUDYID
    USUBJID: USUBJID
    SCTEST: _SCTEST
    SCSCAT: _SCSCAT
  order_by: [SC.STUDYID]
  keep: last
- id: SUPP_P
  dataset: SUPPSC
  key:
    STUDYID: STUDYID
    USUBJID: USUBJID
    IDVARVAL:
      str_decimal:
        source: ASEQ
        decimals: 0
  filter: SUPPSC.QNAM = 'SCORRS1' AND SUPPSC.IDVAR = 'SCSEQ'
  pivot:
    name: QNAM
    value: QVAL
    fields:
    - SCORRS1
columns:
