# ADDV for Moderna mRNA-1273-P301, cut S5 (First Interim
# Analysis IA1b, cutoff 2020-11-25). Parent: ../../../spec/yamaa/base/adam-base-ia.yaml
# (which chains to ../../../spec/yamaa/base/adam-base.yaml; 86 shared + 6 IA-only
# ADSL columns). Derivations implement the S5 IA ADDV program: one
# row per DV record, inner-joined to the verified ADSL on USUBJID
# (DV 8,773 -> ADDV 8,735: the 38 dropped rows are exactly the DV
# rows for the 37 subjects not in ADSL; no REMOVEFL-style filter).
# SUPPDV is the verified batch-2 file (RDOMAIN='DV' only, IDVAR
# always DVSEQ, no QEVAL); it is the ONLY S5 SUPP file carrying
# RDOMAIN='DV' (checked by content over all S5 SUPP files). The
# spec pivots only DVSIG from SUPPDV (SUPPDV DVSIG matches the
# target on all 8,735 in-target keys, 0 mismatches). DVTERM1 is
# BLANK on every submitted row: the program's DESCRIP2 (define:
# SUPPDV QNAM='DESCRIP2') does not exist in the submitted S5
# SUPPDV, so %revsupp yields no DESCRIP2 and the SAS array
# creates it all-missing; the spec emits a blank constant. No
# S27 file is read. SAP v1 vs v3 CLOSED as no-impact (2026-11-24)
# -- the S5 program's own definitions are followed.
# Honest gaps: none known -- DVTERM1 blank is a reproduced
# property of the submitted data, not a gap (see above). No
# RACESPY NUL-tail gap (0 rows) and no duration[us] time columns
# in the target (ADSL datetimes are native timestamp[us]).
# DVSTDTC is date-only on every row and the target carries no
# ADT/ADTM columns, so the ADVS date-only traps do not bite.
# Verification: single full verify.py run 2026-11-23 04:58:49-04:58:52
# UTC, yamaa 0.8.0 @135082c1f: 8,735x64, EXACT MATCH (strict), 0
# mismatches, 0 within-tolerance, 0 space-only; 64/64 columns exact.
# Report: addv/verify_report_s5.json (original work tree).
yamaa: '1.0'
type: spec
model: ADaM
parent: ../../../spec/yamaa/base/adam-base-ia.yaml
domain: ADDV
keys:
- STUDYID
- USUBJID
- DVSEQ
input:
  DV: <sdtm-dir>/dv.parquet
  SUPPDV: <sdtm-dir>/suppdv.parquet
  ADSL:
    path: <adam-dir>/adsl.parquet
    key:
    - STUDYID
    - USUBJID
submission:
  label: Deviation Analysis Dataset
  class: OCCURRENCE DATA STRUCTURE
  structure: One record per subject per deviation
  repeating: true
rows:
- id: devs
  dataset: DV
  filter: _ADSL IS NOT NULL
intermediates:
- id: SUPP_P
  dataset: SUPPDV
  key:
    STUDYID: STUDYID
    USUBJID: USUBJID
    IDVARVAL:
      str_decimal:
        source: DVSEQ
        decimals: 0
  filter: SUPPDV.QNAM IN ('DVSIG') AND SUPPDV.IDVAR = 'DVSEQ'
  pivot:
    name: QNAM
    value: QVAL
    fields:
    - DVSIG
