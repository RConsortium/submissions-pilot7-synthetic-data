# ADEX for Moderna mRNA-1273-P301, cut S5 (First Interim Analysis
# IA1b, cutoff 2020-11-25). Parent: ../../../spec/yamaa/base/adam-base-ia.yaml (which
# chains to ../../../spec/yamaa/base/adam-base.yaml; 86 shared + 6 IA-only ADSL
# columns). Derivations implement the S5 ADEX program (Bates
# 5657901-5657903): EX rows plus the ECOCCUR='N' EC rows, each
# inner-joined to the verified ADSL on USUBJID, with ASEQ assigned
# per subject by ascending SRCDOM, VISITNUM, EXSEQ, ECSEQ -- the
# submitted ASEQ follows that order, not the program's stated
# sort (USUBJID VISIT exseq ecseq); see the generator header.
# NDOSERS is EC.ECREASOC (S5 SUPPEC carries no ECREASOC QNAM);
# NDOSRSP comes from the SUPPEC pivot (EXREASSP only). NDOSRSP1/2
# are in the define but absent from the submitted data and are not
# declared. No APERIOD in this cut. Honest gaps: NDOSRSP, 1 cell
# (US348-2315); NDOSERS, 1 space-only cell (US380-2176) -- see the
# generator header.
yamaa: '1.0'
type: spec
model: ADaM
parent: ../../../spec/yamaa/base/adam-base-ia.yaml
domain: ADEX
keys:
- STUDYID
- USUBJID
- ASEQ
input:
  EX: <sdtm-dir>/ex.parquet
  EC: <sdtm-dir>/ec.parquet
  SUPPEC: <sdtm-dir>/suppec.parquet
  ADSL:
    path: <adam-dir>/adsl.parquet
    key:
    - STUDYID
    - USUBJID
submission:
  label: Treatment Exposure Analysis Dataset
  class: OCCURRENCE DATA STRUCTURE
  structure: One record per subject per administration
  repeating: true
rows:
- id: ex_rows
  dataset: EX
  derivations:
    STUDYID: EX.STUDYID
    USUBJID: EX.USUBJID
    _SRC: '''EX'''
    _EXSEQ: EX.EXSEQ
    _ECSEQ: null
    _TRT: EX.EXTRT
    _DOSE: EX.EXDOSE
    _DOSU: EX.EXDOSU
    _DOSFRM: EX.EXDOSFRM
    _DOSFRQ: EX.EXDOSFRQ
    _ROUTE: EX.EXROUTE
    _LOC: EX.EXLOC
    _LAT: EX.EXLAT
    _STDTC: EX.EXSTDTC
    _ENDTC: EX.EXENDTC
    _STDY: EX.EXSTDY
    _VISIT: EX.VISIT
    _VISITNUM: EX.VISITNUM
    _NDOSERS: null
    _NDOSRSP: null
    _SRCSEQ: EX.EXSEQ
  filter: _ADSL IS NOT NULL
- id: ec_rows
  dataset: EC
  derivations:
    STUDYID: EC.STUDYID
    USUBJID: EC.USUBJID
    _SRC: '''EC'''
    _EXSEQ: null
    _ECSEQ: EC.ECSEQ
    _TRT: null
    _DOSE: null
    _DOSU: null
    _DOSFRM: null
    _DOSFRQ: null
    _ROUTE: null
    _LOC: null
    _LAT: null
    _STDTC: null
    _ENDTC: null
    _STDY: null
    _VISIT: EC.VISIT
    _VISITNUM: EC.VISITNUM
    _NDOSERS: EC.ECREASOC
    _NDOSRSP: SUPP_P.EXREASSP
    _SRCSEQ: EC.ECSEQ
  filter: EC.ECOCCUR = 'N' AND _ADSL IS NOT NULL
intermediates:
- id: SUPP_P
  dataset: SUPPEC
  key:
    STUDYID: STUDYID
    USUBJID: USUBJID
    IDVARVAL:
      str_decimal:
        source: _ECSEQ
        decimals: 0
  filter: SUPPEC.QNAM IN ('EXREASSP') AND SUPPEC.IDVAR = 'ECSEQ'
  pivot:
    name: QNAM
    value: QVAL
    fields:
    - EXREASSP
windows:
  ASEQ_W:
    group_by:
    - USUBJID
    order_by:
    - _SRC
    - VISITNUM
    - _EXSEQ
    - _ECSEQ
columns:
