# ADTTEA for Moderna mRNA-1273-P301, cut S5 (First Interim Analysis
# IA1b, extract 25 Nov 2020, efficacy cutoff 2020-11-21). Parent:
# ../../../spec/yamaa/base/adam-base-ia.yaml (which chains to ../../../spec/yamaa/base/adam-base.yaml;
# 86 shared + 6 IA-only ADSL columns). Derivations implement the S5
# A50ADTT program (Bates 5657942-5657946, 233 lines; byte-identical
# to the S80 program): one row per FAS subject per PARAMCD (16
# PARAMCDs), from the submitted ADEFF (first event per subject per
# PARAMCD) and the verified ADSL. Where the SAS code and the define.xml
# method text disagree, the code is followed (see README.md). SAP note
# (closed 2026-11-24, no-impact): the file labelled "SAP v3"
# (19745_S68_M5_sap-v3.pdf) is the P201 SAP v3.0 (27 Oct 2020), not a
# P301 SAP version; the only P301 SAP in the set is v1.0 (10 Sep 2020).
# The case definitions below are the program's own, so the spec follows
# the program, not a SAP version.
# IA-vs-S3 differences (see the generator header): no MB/IS
# prior-infection censoring, no aperiod-2 rows, no inwin/cutoff gate
# (unobservable on S5 ADTTEA data; observably confirmed on S5 ADTTE
# via the SAP PARAMCDs), no ADT clamp, censor list without AP01EDT
# (the S5 ADSL has no AP01EDT column), TTCVD1B censor adds CVD53DT.
# CVD53DT is 2020-10-26 in S5 (196 candidates; the fallback never
# fires). The S5 define carries CL.ADTTEA.PARAMCD listing exactly the
# 16 PARAMCDs. The S5 target adds RTPCRBL (the whole 64 -> 65 column
# difference); no CDCCD/LGROUP/LINEAGES, no XQ-derived column. The
# S5 ADEFF has one DEATHCVD row but the ADTTEA program calls %dev_tte
# for no death PARAMCD, so there are no TTDTHCV rows. KEYS: unlike
# ADEFF, ADTTEA HAS a usable key: (STUDYID, USUBJID, PARAMCD) is
# unique and non-missing on the submitted target, and there is no
# ASEQ column. Honest gaps: none expected. The S80 spec verified
# EXACT MATCH strict via a single full verify.py run, and this S5
# spec is the same derivation re-pointed at the S5 inputs; if the
# full verify.py run OOMs in this 6 GB cell (485,616 rows),
# verification falls back to pruned dependency-closure groups with
# a single full-spec re-run in a roomier cell still owed (see
# adttea/verify_report_s5.json, original work tree).
yamaa: '1.0'
type: spec
model: ADaM
parent: ../../../spec/yamaa/base/adam-base-ia.yaml
domain: ADTTEA
keys:
- STUDYID
- USUBJID
- PARAMCD
input:
  ADEFF:
    path: <adam-dir>/adeff.parquet
    key:
    - STUDYID
    - USUBJID
  ADSL:
    path: <adam-dir>/adsl.parquet
    key:
    - STUDYID
    - USUBJID
submission:
  label: Time to Event per AC Analysis Dataset
  class: BASIC DATA STRUCTURE
  structure: One record per subject per parameter
  repeating: true
rows:
- id: ttcvd1_rows
  dataset: ADSL
  derivations:
    STUDYID: ADSL.STUDYID
    USUBJID: ADSL.USUBJID
    PARAMCD: '''TTCVD1'''
    _EVENT_DT: EV_COVIDA._ADT
    _EVENT_EPOCH:
      to_epoch_day:
        source: _EVENT_DT
    _COVID_DT: null
    _CVD53DT: DATE '2020-10-26'
    _DOSE2_EPOCH:
      to_epoch_day:
        source: ADSL.DOSE2DT
    _TR01_EPOCH:
      to_epoch_day:
        source: ADSL.TR01SDT
    _RAND_EPOCH:
      to_epoch_day:
        source: ADSL.RANDDT
    _CENSDT:
      least: {sources: [ADSL.DTHDT, ADSL.EOSDT, ADSL.CUTOFFDT, ADSL.EFFCODT]}
    _ADT_RAW:
      case:
      - when: _EVENT_DT IS NOT NULL AND _DOSE2_EPOCH IS NOT NULL AND _DOSE2_EPOCH + 14 <= _EVENT_EPOCH
        then: _EVENT_DT
      - when: _EVENT_DT IS NOT NULL AND (_DOSE2_EPOCH IS NULL OR _DOSE2_EPOCH + 14 > _EVENT_EPOCH)
        then: _EVENT_DT
      - otherwise: _CENSDT
    _CNSR_RAW:
      case:
      - when: _EVENT_DT IS NOT NULL AND _DOSE2_EPOCH IS NOT NULL AND _DOSE2_EPOCH + 14 <= _EVENT_EPOCH
        then: 0
      - when: _EVENT_DT IS NOT NULL AND (_DOSE2_EPOCH IS NULL OR _DOSE2_EPOCH + 14 > _EVENT_EPOCH)
        then: 1
      - otherwise: 1
    _EVNTDESC_RAW:
      case:
      - when: _EVENT_DT IS NOT NULL AND _DOSE2_EPOCH IS NOT NULL AND _DOSE2_EPOCH + 14 <= _EVENT_EPOCH
        then: '''COVID-19'''
      - when: _EVENT_DT IS NOT NULL AND (_DOSE2_EPOCH IS NULL OR _DOSE2_EPOCH + 14 > _EVENT_EPOCH)
        then: '''Early COVID-19'''
      - otherwise: '''No COVID-19'''
  filter: ADSL.FASFL = 'Y'
