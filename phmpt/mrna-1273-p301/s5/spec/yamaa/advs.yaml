# ADVS for Moderna mRNA-1273-P301, cut S5 (First Interim Analysis,
# IA1b, extract 2020-11-25). Parent: ../../../spec/yamaa/base/adam-base-ia.yaml (which
# chains to ../../../spec/yamaa/base/adam-base.yaml; 86 shared + 6 IA-only ADSL
# columns). Derivations implement the S5 IA A20ADVS program: VS rows
# (VSSTAT missing, VSCAT not REACTOGENICITY/EFFICACY) inner-joined
# to the verified ADSL on (USUBJID, SUBJID), with the %ablfl visit
# windowing (sort-1/2, pre_, sort-4/5, ANL01FL, atoxgr), the %xxdoserf
# 2-dose chain, %trta with _DOSE = MDOSREF, and the ASTAGE stage
# derivation (no SYSDATE in the IA macro). Where the SAS code and the
# define.xml method text disagree, the code is followed (see the
# generator header). Honest gaps: 5 rows graded 4 in the submitted
# data only via the external import.vsgrade4 file (see the
# generator header); ATOXGRH/ATOXGRHN differ on 5 cells and
# SHIFT2 on 5 cells; CHG/PCHG differ by 1 ulp in the last digit
# on 2,213 + 12,841 cells (all within 1e-10 tolerance) because the
# Parquet VSSTRESN strings do not round-trip the SAS doubles.
# Split verification (session 59, 2026-11-23): the full spec was run per
# 4-way SEX x AGE (<=55/>55) subject partition via the join-aid spec
# (spec-s5-join-aid.yaml; the unchanged spec is refused at OUTPUT-3) and
# reproduced the session-31 baseline exactly (827,208x102, 15,063 cells
# per the columns table / 15,069 all-rows, 0 within-tolerance, 0
# space-only, zero new mismatches; report advs/verify_report_s5_split.json).
# The roomier-cell full-spec re-run is no longer owed -- the split
# verification is the full-spec proof.
yamaa: '1.0'
type: spec
model: ADaM
parent: ../../../spec/yamaa/base/adam-base-ia.yaml
domain: ADVS
# Keys: the submitted ADVS has no unique key (VSDTC and VISITNUM are empty
# on some rows, and the natural key repeats), which OUTPUT-3 refuses. As in
# ADEFF, the spec derives the row identity ASEQ (row number within subject,
# by VS sequence); verify.py sets it aside and compares rows as a multiset,
# pairing unmatched rows by subject.
keys:
- STUDYID
- USUBJID
- ASEQ
- ANL03FL
input:
  VS: <sdtm-dir>/vs.parquet
  SUPPVS: <sdtm-dir>/suppvs.parquet
  EX: <sdtm-dir>/ex.parquet
  SV: <sdtm-dir>/sv.parquet
  ADSL:
    path: <adam-dir>/adsl.parquet
    key:
    - STUDYID
    - USUBJID
    - SUBJID
submission:
  label: Vital Signs Analysis Dataset
  class: BASIC DATA STRUCTURE
  structure: One or more records per subject per analysis parameter per analysis timepoint
  repeating: true
rows:
- id: vs_rows
  dataset: VS
  derivations:
    STUDYID: VS.STUDYID
    USUBJID: VS.USUBJID
    SUBJID: VS.SUBJID
    _VSSEQ: VS.VSSEQ
    _VSSTAT: VS.VSSTAT
    _VSTESTCD: VS.VSTESTCD
    _VSTEST: VS.VSTEST
    _UNIT:
      mapping:
        source: _VSTESTCD
        dict:
          BMI: 'kg/m2'
          DIABP: 'mmHg'
          HEIGHT: 'cm'
          PULSE: 'beats/min'
          RESP: 'breaths/min'
          SYSBP: 'mmHg'
          TEMP: 'C'
          WEIGHT: 'kg'
        unmapped: null
    _VSCAT: VS.VSCAT
    _VSSTRESC:
      str_replace:
        source: VS.VSSTRESC
        pattern: '[\x00-\x1f].*'
        replacement: ''
    _VSSTRESN: VS.VSSTRESN
    _VSSTRESU: VS.VSSTRESU
    _VSDTC: VS.VSDTC
    _VISITNUM: VS.VISITNUM
    _VSLOC: VS.VSLOC
    _VSTPT: VS.VSTPT
    _VSTPTNUM: VS.VSTPTNUM
    _ORI_VISIT: VS.VISIT
    _VISIT:
      case:
      - when: str_contains(_ORI_VISIT, '^Illness Visit Day 3 - Day 21 Uns')
        then: '''Illness Visit Day 3 Unscheduled 1'''
      - otherwise: _ORI_VISIT
    # VSSTRESN is text in the released VS; parse it, a non-number (such as
    # (b)(6)) giving a missing value (COLUMN-13). This replaces a dictionary
    # that listed every observed value (issue #6).
    _AVALN_NUM:
      value: VS.VSSTRESN
      unconvertible: null
    PARAMCD: VS.VSTESTCD
    PARAM:
      str_template:
        template: '{_VSTEST} ({_UNIT})'
        missing: ''
    AVAL: VS.VSSTRESN
    VSSTRESC: _VSSTRESC
    VSLOC: VS.VSLOC
    VSLOCSP: SUPP_P.VSLOCSP
  filter: (_VSSTAT IS NULL OR _VSSTAT IN ('')) AND (_VSCAT IS NULL OR _VSCAT IN ('') OR _VSCAT NOT IN ('REACTOGENICITY', 'EFFICACY')) AND _ADSL IS NOT NULL
intermediates:
- id: SUPP_P
  dataset: SUPPVS
  key:
    STUDYID: STUDYID
    USUBJID: USUBJID
    IDVARVAL:
      str_decimal:
        source: _VSSEQ
        decimals: 0
  filter: SUPPVS.QNAM = 'VSLOCSP' AND SUPPVS.IDVAR = 'VSSEQ'
  pivot:
    name: QNAM
    value: QVAL
    fields:
    - VSLOCSP
- id: SV_V29
  dataset: SV
  key: [STUDYID, USUBJID]
  filter: str_contains(SV.VISIT, 'Day 29') AND SV.SVSTDTC IS NOT NULL AND SV.SVSTDTC NOT IN ('') AND SV.VISITDY IS NOT NULL
  order_by: [SV.SVSTDTC]
  keep: first
- id: SV_V57
  dataset: SV
  key: [STUDYID, USUBJID]
  filter: str_contains(SV.VISIT, 'Day 57') AND SV.SVSTDTC IS NOT NULL AND SV.SVSTDTC NOT IN ('') AND SV.VISITDY IS NOT NULL
  order_by: [SV.SVSTDTC]
  keep: first
- id: EX_DOSE1
  dataset: EX
  key: [STUDYID, USUBJID]
  filter: EX.EXSTDTC IS NOT NULL AND str_contains(EX.VISIT, '[Dd][Aa][Yy] 1( |$)')
  order_by: [EX.EXSTDTC]
  keep: first
- id: EX_DOSE2
  dataset: EX
  key: [STUDYID, USUBJID]
  filter: EX.EXSTDTC IS NOT NULL AND str_contains(EX.VISIT, '[Dd][Aa][Yy] 29')
  order_by: [EX.EXSTDTC]
  keep: first
windows:
  SORT2_W:
    group_by: [STUDYID, USUBJID, PARAMCD]
    order_by:
    - variable: _AVALN
      direction: desc
    - _POSTFL
    - variable: _PREFL_ADT
      direction: desc
    - variable: _PREFL_ADTM
      direction: desc
    - ADT
    - _ADDSORTN
    - _ILLUNS
    - _ADTMY
    - _ISSTRESN_
    - variable: VSTPT
      direction: desc
    - _ADTMY_NUM
    - variable: _VSTPTNUM
      direction: desc
    - variable: _VSSEQ
      direction: desc
  BASELINE_W:
    group_by: [STUDYID, USUBJID, PARAMCD]
    order_by:
    - ADT
    - _ADTM
    - variable: _ADDSORTN
      direction: desc
    - variable: _ILLUNS
      direction: desc
    - variable: _ADTMY
      direction: desc
    - variable: _ISSTRESN_
      direction: desc
    - VSTPT
    - variable: _ADTMY_NUM
      direction: desc
    - _VSTPTNUM
    - _VSSEQ
  FIRST_ADT_W:
    group_by: [STUDYID, USUBJID, PARAMCD, _AVALN, _POSTFL, _PREFL_ADT, _PREFL_ADTM, ADT]
    order_by:
    - _ADDSORTN
    - _ILLUNS
    - _ADTMY
    - _ISSTRESN_
    - variable: VSTPT
      direction: desc
    - _ADTMY_NUM
    - variable: _VSTPTNUM
      direction: desc
    - variable: _VSSEQ
      direction: desc
  SORT4_W:
    group_by: [STUDYID, USUBJID, PARAMCD]
    order_by:
    - variable: _AVALN
      direction: desc
    - _POSTFL2
    - ADT
    - variable: _ILL_ADY
      direction: desc
  SORT5_W:
    group_by: [STUDYID, USUBJID, PARAMCD]
    order_by:
    - _AVISITN_P4
    - ADY
    - _UNS
  ANL01_W:
    group_by: [STUDYID, USUBJID, PARAMCD, _AVISITN_F, _ATPTN_F]
    order_by:
    - variable: _POSTFL2
      direction: desc
    - variable: _AVALN2
      direction: desc
    - _UNS
    - _AWTDIFF_P2
    - variable: ADT
      direction: desc
    - variable: _VSSEQ
      direction: desc
  ANL02_W:
    group_by: [STUDYID, USUBJID, PARAMCD, _AVISITN_F, _ATPTN_F]
    order_by:
    - variable: _POSTFL2
      direction: desc
    - variable: _ATOXGRLN
      direction: desc
    - ADT
    - _VSSEQ
  ANL03_W:
    group_by: [STUDYID, USUBJID, PARAMCD, _AVISITN_F, _ATPTN_F]
    order_by:
    - variable: _POSTFL2
      direction: desc
    - variable: _ATOXGRHN
      direction: desc
    - ADT
    - _VSSEQ
columns:
- name: _ADSL
  type: str
  derivation: ADSL.USUBJID
- name: STUDYID
  submission:
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: USUBJID
  submission:
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: SUBJID
  submission:
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: _VSSEQ
  type: float
- name: _VSSTAT
  type: str
- name: _VSTESTCD
  type: str
- name: _VSTEST
  type: str
- name: _UNIT
  type: str
- name: _VSCAT
  type: str
- name: _VSSTRESC
  type: str
- name: _VSSTRESN
  type: str
- name: _VSSTRESU
  type: str
- name: _VSDTC
  type: str
- name: _VISITNUM
  type: float
- name: _VSLOC
  type: str
- name: _VSTPT
  type: str
- name: _VSTPTNUM
  type: float
- name: _ORI_VISIT
  type: str
- name: _VISIT
  type: str
- name: _AVALN_NUM
  type: float
- name: _ADT_TXT
  type: str
  derivation: ADT
- name: _HH
  type: str
  derivation:
    str_extract:
      source: _VSDTC
      pattern: 'T(\d{2}):(\d{2})(?::\d{2})?$'
      group: 1
      no_match: ''
- name: _MM
  type: str
  derivation:
    str_extract:
      source: _VSDTC
      pattern: 'T(\d{2}):(\d{2})(?::\d{2})?$'
      group: 2
      no_match: ''
- name: _VSDTC_YYYY
  type: str
  derivation:
    str_extract:
      source: _VSDTC
      pattern: '^(\d{4})-(\d{2})-(\d{2})$'
      group: 1
      no_match: ''
- name: _VSDTC_MO
  type: str
  derivation:
    str_extract:
      source: _VSDTC
      pattern: '^(\d{4})-(\d{2})-(\d{2})$'
      group: 2
      no_match: ''
- name: _VSDTC_DD
  type: str
  derivation:
    str_extract:
      source: _VSDTC
      pattern: '^(\d{4})-(\d{2})-(\d{2})$'
      group: 3
      no_match: ''
- name: _Y2000
  type: str
  derivation: "'2000'"
- name: _M01
  type: str
  derivation: "'01'"
- name: _D01
  type: str
  derivation: "'01'"
- name: _ATM_DT
  type: datetime
  derivation:
    case:
    - when: _HH IS NOT NULL AND _HH NOT IN ('') AND _MM IS NOT NULL AND _MM NOT IN ('')
      then:
        dtc:
          year: _Y2000
          month: _M01
          day: _D01
          hour: _HH
          minute: _MM
- name: _ORI_ADTM_RAW
  type: datetime
  derivation:
    impute:
      type: datetime
      source: _VSDTC
      time: first
- name: _ORI_ADTM
  type: datetime
  derivation:
    case:
    - when: _VSDTC IS NOT NULL AND NOT str_contains(_VSDTC, 'T')
      then: null
    - when: _VSDTC IS NOT NULL AND str_contains(_VSDTC, 'T') AND (_HH IS NULL OR _HH IN (''))
      then: null
    - otherwise: _ORI_ADTM_RAW
- name: _ADTM
  type: datetime
  derivation:
    case:
    - when: str_contains(_VSDTC, 'T00:00')
      then: null
    - otherwise: _ORI_ADTM
- name: _VISIT2A
  type: str
  derivation:
    str_replace:
      source: _VISIT
      pattern: 'Convalescence'
      replacement: 'Illness'
- name: _VISIT2
  type: str
  derivation:
    case:
    - when: _VISIT2A IS NULL OR _VISIT2A IN ('') OR str_contains(_VISIT2A, 'Saf')
      then:
        str_template:
          template: 'Unsched {_VISIT2A}'
          missing: ''
    - otherwise: _VISIT2A
- name: _VISIT2_UP
  type: str
  derivation:
    str_case:
      source: _VISIT2
      to: upper
- name: _ADDSORTN
  type: str
  derivation:
    case:
    - when: str_contains(_VISIT, '^Visit') AND NOT str_contains(_VISIT, 'Uns')
      then: "''"
    - when: str_contains(_VISIT, '^Visit') AND ADT IS NOT NULL AND TR01SDT IS NOT NULL AND ADT > TR01SDT
      then:
        str_template:
          template: '{_ADT_TXT} - 998'
          missing: ''
    - when: (_VISIT IS NULL OR _VISIT IN ('')) AND ADT IS NOT NULL
      then:
        str_template:
          template: '{_ADT_TXT} - 999'
          missing: ''
    - when: str_contains(_ORI_VISIT, '^Illness Visit Day 3 - Day 21') AND str_contains(_VISIT, 'Uns') AND ADT IS NOT NULL
      then:
        str_template:
          template: '{_ADT_TXT} - 998'
          missing: ''
    - when: str_contains(_ORI_VISIT, '^Illness Visit Day 3 - Day 21') AND str_contains(_VISIT, 'Uns')
      then: '''          - 998'''
    - when: ADT IS NOT NULL AND TR01SDT IS NOT NULL AND ADT > TR01SDT AND str_contains(_VISIT, 'Uns')
      then:
        str_template:
          template: '{_ADT_TXT} - 999'
          missing: ''
    - when: (str_contains(_VISIT, '^Ill') OR str_contains(_VISIT, '^Conva')) AND ADT IS NOT NULL AND TR01SDT IS NOT NULL AND ADT > TR01SDT
      then: _ADT_TXT
    - when: (str_contains(_VISIT, '^Ill') OR str_contains(_VISIT, '^Conva')) AND (_VSDTC IS NULL OR _VSDTC IN (''))
      then: '''0000'''
    - otherwise: "''"
- name: _DAYDIFF
  type: int
  derivation:
    diff:
      type: date
      start: TR01SDT
      end: ADT
      unit: day
- name: _ADTMY_S
  type: float
  derivation:
    case:
    - when: _ADTM IS NOT NULL AND TR01SDTM IS NOT NULL AND _ADTM > TR01SDTM
      then:
        diff:
          type: datetime
          start: TR01SDTM
          end: _ADTM
          unit: second
    - when: ADT IS NOT NULL AND TR01SDT IS NOT NULL
      then: _DAYDIFF * 86400
    - when: NOT str_contains(_VISIT2_UP, 'ILLNESS')
      then: 99999999
- name: _ADTMY_ABS
  type: float
  derivation: ABS(_ADTMY_S)
- name: _POSTDOSE
  type: int
  derivation:
    case:
    - when: ADT IS NOT NULL AND TR01SDT IS NOT NULL AND ADT > TR01SDT
      then: 1
- name: _ADTMY_NUM
  type: float
  derivation:
    case:
    - when: VISITNUM IS NOT NULL
      then: _ADTMY_ABS + VISITNUM
    - otherwise: _ADTMY_ABS
- name: _ADTMY
  type: float
  derivation: _ADTMY_ABS
- name: _PREFL
  type: str
  derivation:
    case:
    - when: _ADTMY_S <= 0 AND TR01SDT IS NOT NULL AND NOT ((_VSTPT IS NOT NULL AND str_contains(_VSTPT, 'POST')) AND ADT IS NOT NULL AND TR01SDT IS NOT NULL AND ADT = TR01SDT)
      then: '''Y'''
- name: _POSTFL
  type: str
  derivation:
    case:
    - when: (_VSTPT IS NOT NULL AND str_contains(_VSTPT, 'POST')) AND ADT IS NOT NULL AND TR01SDT IS NOT NULL AND ADT = TR01SDT
      then: '''Y'''
    - when: _ADTMY_S > 0 AND TR01SDT IS NOT NULL AND ADT IS NOT NULL
      then: '''Y'''
- name: _PREFL_ADT
  type: date
  derivation:
    case:
    - when: _PREFL = 'Y'
      then: ADT
- name: _PREFL_ADTM
  type: datetime
  derivation:
    case:
    - when: _PREFL = 'Y'
      then: _ADTM
- name: _AVALN
  type: int
  derivation:
    case:
    - when: _VSSTRESC IS NOT NULL AND _VSSTRESC NOT IN ('')
      then: 1
    - when: (str_contains(_VISIT2_UP, 'ILLNESS') OR str_contains(_VISIT2, 'Uns')) AND (_POSTDOSE = 1 OR ADT IS NULL)
      then: 1
- name: _AVALN2
  type: int
  derivation:
    case:
    - when: _VSSTRESC IS NOT NULL AND _VSSTRESC NOT IN ('')
      then: 1
- name: _ILLUNS
  type: int
  derivation:
    case:
    - when: str_contains(_VISIT2, 'Uns')
      then: 1
    - when: str_contains(_VISIT2_UP, 'ILLNESS')
      then: 2
    - otherwise: 0
- name: _VSSTRESC_UP
  type: str
  derivation:
    str_case:
      source: _VSSTRESC
      to: upper
- name: _ISSTRESN_
  type: int
  derivation:
    case:
    - when: _PREFL = 'Y' AND NOT str_contains(_VISIT2_UP, 'ILLNESS') AND _VSSTRESC_UP = 'POSITIVE'
      then: 1
    - when: _PREFL = 'Y' AND NOT str_contains(_VISIT2_UP, 'ILLNESS') AND _VSSTRESC_UP = 'NEGATIVE'
      then: 2
    - otherwise: 9
- name: _SORT2_RN
  type: int
  derivation:
    row_number:
      window: SORT2_W
- name: _FIRST_ADT
  type: int
  derivation:
    row_number:
      window: FIRST_ADT_W
- name: _VISIT_PREV
  type: str
  derivation:
    row_value:
      source: _VISIT2
      offset: -1
      window: SORT2_W
- name: _SCHEILL_DAY1_SRC
  type: str
  derivation:
    case:
    - when: _VISIT2 = 'Illness Visit Day 1'
      then: '''Illness Visit Day 1'''
- name: _SCHEILL_DAY1
  type: str
  derivation:
    locf:
      source: _SCHEILL_DAY1_SRC
      window: SORT2_W
- name: _SCHEILL_DATE_SRC
  type: date
  derivation:
    case:
    - when: _VISIT2 = 'Illness Visit Day 1'
      then: ADT
- name: _SCHEILL_DATE
  type: date
  derivation:
    locf:
      source: _SCHEILL_DATE_SRC
      window: SORT2_W
- name: _SCHEILL_UPDATE
  type: str
  derivation:
    case:
    - when: NOT str_contains(_VISIT2, 'Uns') AND NOT str_contains(_VISIT2, 'Ill')
      then: "''"
    - otherwise: _SCHEILL_DAY1
- name: _ILL_SET_PREV
  type: int
  derivation:
    row_value:
      source: _ILL_SET
      offset: -1
      window: SORT2_W
- name: _ILL_DAT_PREV
  type: date
  derivation:
    row_value:
      source: _ILL_DAT
      offset: -1
      window: SORT2_W
- name: _ILL_ADY_PREV
  type: float
  derivation:
    row_value:
      source: _ILL_ADY
      offset: -1
      window: SORT2_W
- name: _ILL_SET
  type: int
  derivation:
    case:
    - when: (_FIRST_ADT = 1 AND str_contains(_VISIT2_UP, 'ILLNESS') AND _ORI_VISIT <> 'Illness Visit Day 3 - Day 21' AND str_contains(_VISIT2_UP, 'DAY 1') AND NOT str_contains(_VISIT2_UP, 'DAY 1[0-9]') AND NOT str_contains(_VISIT2, 'Uns')) OR (_FIRST_ADT <> 1 AND _VISIT2 = 'Illness Visit Day 1' AND _VISIT2 <> _VISIT_PREV)
      then:
        case:
        - when: ((_SCHEILL_DAY1 IS NULL) OR (ADT IS NOT NULL AND _SCHEILL_DATE IS NOT NULL AND ADT < _SCHEILL_DATE) OR (str_contains(_VISIT2, 'Illness Visit Day 1 Unscheduled') AND _ILL_SET_PREV >= 1)) AND str_contains(_VISIT2_UP, 'ILLNESS') AND _SORT2_RN = 1
          then: 0
        - when: ((_SCHEILL_DAY1 IS NULL) OR (ADT IS NOT NULL AND _SCHEILL_DATE IS NOT NULL AND ADT < _SCHEILL_DATE) OR (str_contains(_VISIT2, 'Illness Visit Day 1 Unscheduled') AND _ILL_SET_PREV >= 1)) AND str_contains(_VISIT2_UP, 'ILLNESS')
          then: _ILL_SET_PREV
        - when: _SORT2_RN = 1
          then: 1
        - otherwise: _ILL_SET_PREV + 1
    - when: _SORT2_RN = 1
      then: 0
    - otherwise: _ILL_SET_PREV
- name: _ILL_DAT
  type: date
  derivation:
    case:
    - when: (_FIRST_ADT = 1 AND str_contains(_VISIT2_UP, 'ILLNESS') AND _ORI_VISIT <> 'Illness Visit Day 3 - Day 21' AND str_contains(_VISIT2_UP, 'DAY 1') AND NOT str_contains(_VISIT2_UP, 'DAY 1[0-9]') AND NOT str_contains(_VISIT2, 'Uns')) OR (_FIRST_ADT <> 1 AND _VISIT2 = 'Illness Visit Day 1' AND _VISIT2 <> _VISIT_PREV)
      then: ADT
    - otherwise: _ILL_DAT_PREV
- name: _ILL_ADY
  type: float
  derivation:
    case:
    - when: (_FIRST_ADT = 1 AND str_contains(_VISIT2_UP, 'ILLNESS') AND _ORI_VISIT <> 'Illness Visit Day 3 - Day 21' AND str_contains(_VISIT2_UP, 'DAY 1') AND NOT str_contains(_VISIT2_UP, 'DAY 1[0-9]') AND NOT str_contains(_VISIT2, 'Uns')) OR (_FIRST_ADT <> 1 AND _VISIT2 = 'Illness Visit Day 1' AND _VISIT2 <> _VISIT_PREV)
      then: ADY
    - otherwise: _ILL_ADY_PREV
- name: _BASELINE_SRC
  type: int
  derivation:
    case:
    - when: _AVALN = 1 AND _PREFL = 'Y'
      then: 1
- name: _BASELINE
  type: str
  derivation:
    baseline_flag:
      date: ADT
      reference: TR01SDT
      source: _BASELINE_SRC
      window:
        group_by: [STUDYID, USUBJID, PARAMCD]
        order_by:
        - ADT
        - _ADTM
        - variable: _ADDSORTN
          direction: desc
        - variable: _ILLUNS
          direction: desc
        - variable: _ADTMY
          direction: desc
        - variable: _ISSTRESN_
          direction: desc
        - VSTPT
        - variable: _ADTMY_NUM
          direction: desc
        - _VSTPTNUM
        - _VSSEQ
- name: _BASELINE_ADT
  type: date
  derivation:
    aggregate:
      filter: _BASELINE = 'Y'
      group_by: [STUDYID, USUBJID, PARAMCD]
      expr: ONLY(ADT)
- name: _BASELINE_ADTM
  type: datetime
  derivation:
    aggregate:
      filter: _BASELINE = 'Y'
      group_by: [STUDYID, USUBJID, PARAMCD]
      expr: ONLY(_ADTM)
- name: _POSTFL2
  type: str
  derivation:
    case:
    - when: _ADTM IS NOT NULL AND TR01SDTM IS NOT NULL AND _ADTM < TR01SDTM
      then: "''"
    - otherwise: _POSTFL
- name: _BASE
  type: str
  derivation:
    aggregate:
      filter: _BASELINE = 'Y'
      group_by: [STUDYID, USUBJID, PARAMCD]
      expr: ONLY(AVAL)
- name: _BASE_N
  type: float
  derivation:
    aggregate:
      filter: _BASELINE = 'Y'
      group_by: [STUDYID, USUBJID, PARAMCD]
      expr: ONLY(_AVALN_NUM)
- name: _BASE_N_SAFE
  type: float
  derivation:
    case:
    - when: _BASE_N = 0
      then: null
    - otherwise: _BASE_N
- name: _CHG_N
  type: float
  derivation:
    case:
    - when: _POSTFL2 = 'Y' AND _AVALN_NUM IS NOT NULL AND _BASE_N IS NOT NULL
      then: _AVALN_NUM - _BASE_N
- name: _PCHG_N
  type: float
  derivation:
    case:
    - when: _POSTFL2 = 'Y' AND _CHG_N IS NOT NULL AND _BASE_N_SAFE IS NOT NULL
      then: _CHG_N / _BASE_N_SAFE * 100
- name: _D_ILL
  type: int
  derivation:
    diff:
      type: date
      start: _ILL_DAT
      end: ADT
      unit: day
- name: _V_SCAN4
  type: str
  derivation:
    str_extract:
      source: _VISIT2
      pattern: '^(?:\S+\s+){3}(\S+)'
      group: 1
      no_match: ''
- name: _AVISIT_PRE
  type: str
  derivation:
    case:
    - when: _BASELINE = 'Y'
      then: '''Baseline'''
    - when: _VISIT2_UP = 'VISIT 1 DAY 1' AND (_VSTPT IS NOT NULL AND str_contains(_VSTPT, 'POST'))
      then: '''Day 1'''
    - when: _VISIT2 = 'Illness Visit Day 1'
      then: '''Illness Visit Day 1'''
    - when: str_contains(_VISIT2_UP, 'ILLNESS') AND NOT str_contains(_VISIT2, 'Uns')
      then:
        str_template:
          template: 'Illness Visit Day {_V_SCAN4}'
          missing: ''
    - when: (str_contains(_VISIT2_UP, 'ILLNESS') OR str_contains(_VISIT2, 'Uns')) AND _D_ILL >= 2 AND _D_ILL <= 34 AND ADT IS NOT NULL
      then: '''Illness Visit Day 28'''
    - when: _POSTFL2 = 'Y' AND (str_contains(_VISIT2, 'Uns') OR str_contains(_VISIT2, 'Safe') OR str_contains(_VISIT2_UP, 'ILLNESS')) AND (ADY >= 1 AND ADY <= 15)
      then: '''Day 1'''
    - when: _POSTFL2 = 'Y' AND (str_contains(_VISIT2, 'Uns') OR str_contains(_VISIT2, 'Safe') OR str_contains(_VISIT2_UP, 'ILLNESS')) AND ADY > 15 AND ADY <= 43
      then: '''Day 29'''
    - when: _POSTFL2 = 'Y' AND (str_contains(_VISIT2, 'Uns') OR str_contains(_VISIT2, 'Safe') OR str_contains(_VISIT2_UP, 'ILLNESS')) AND ADY > 43 AND ADY <= 88
      then: '''Day 57'''
    - when: _POSTFL2 = 'Y' AND (str_contains(_VISIT2, 'Uns') OR str_contains(_VISIT2, 'Safe') OR str_contains(_VISIT2_UP, 'ILLNESS')) AND ADY > 88 AND ADY <= 164
      then: '''Day 119'''
    - when: _POSTFL2 = 'Y' AND (str_contains(_VISIT2, 'Uns') OR str_contains(_VISIT2, 'Safe') OR str_contains(_VISIT2_UP, 'ILLNESS')) AND ADY > 164 AND ADY <= 301
      then: '''Day 209'''
    - when: _POSTFL2 = 'Y' AND (str_contains(_VISIT2, 'Uns') OR str_contains(_VISIT2, 'Safe') OR str_contains(_VISIT2_UP, 'ILLNESS')) AND ADY > 301 AND ADY <= 576
      then: '''Day 394'''
    - when: _POSTFL2 = 'Y' AND (str_contains(_VISIT2, 'Uns') OR str_contains(_VISIT2, 'Safe') OR str_contains(_VISIT2_UP, 'ILLNESS')) AND ADY > 576 AND ADY <= 773
      then: '''Day 759'''
    - when: ADY IS NOT NULL AND ADY > 1 AND _POSTFL2 = 'Y' AND str_contains(_VISIT2_UP, 'DAY')
      then:
        str_template:
          template: 'Day {_V_SCAN4}'
          missing: ''
    - otherwise: "''"
