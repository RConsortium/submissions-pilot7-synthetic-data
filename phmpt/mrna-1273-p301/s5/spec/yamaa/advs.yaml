- name: _MRDDY
  type: int
  derivation:
    case:
    - when: (_ASTAGE IS NOT NULL AND _ASTAGE NOT IN ('')) AND (TR01SDT IS NOT NULL) AND (((TR01SDTM IS NOT NULL AND _ORI_ADTM IS NOT NULL AND TR01SDTM <= _ORI_ADTM) AND (_ORI_ADTM IS NOT NULL AND DOS2DTM IS NOT NULL AND _ORI_ADTM < DOS2DTM)) OR ((DOSE2DT IS NULL) AND (TR01SDTM IS NOT NULL AND _ORI_ADTM IS NOT NULL AND TR01SDTM <= _ORI_ADTM)) OR ((TR01SDTM IS NOT NULL AND _ORI_ADTM IS NOT NULL AND TR01SDTM <= _ORI_ADTM) AND (ADT IS NOT NULL AND DOSE2DT IS NOT NULL AND ADT < DOSE2DT)) OR ((((_ORI_ADTM IS NULL) OR (TR01SDTM IS NULL)) AND (DOSE2DT IS NULL) AND (TR01SDT IS NOT NULL AND ADT IS NOT NULL AND TR01SDT <= ADT))) OR ((((_ORI_ADTM IS NULL) OR (TR01SDTM IS NULL)) AND (TR01SDT IS NOT NULL AND ADT IS NOT NULL AND TR01SDT <= ADT) AND (ADT IS NOT NULL AND DOSE2DT IS NOT NULL AND ADT < DOSE2DT))))
      then: _RDDY1 + 1
    - when: (_ASTAGE IS NOT NULL AND _ASTAGE NOT IN ('')) AND (TR01SDT IS NOT NULL) AND (((DOS2DTM IS NOT NULL AND _ORI_ADTM IS NOT NULL AND DOS2DTM <= _ORI_ADTM)) OR ((((_ORI_ADTM IS NULL) OR (DOS2DTM IS NULL)) AND (DOSE2DT IS NOT NULL AND ADT IS NOT NULL AND DOSE2DT <= ADT))))
      then: _RDDY2 + 1
