    - when: str_contains(_AWRANGE_T3, 'Illness') AND str_contains(_AWRANGE_T3, 'Day 3') AND _RETAIN_ILL_ADY IS NOT NULL
      then: _RETAIN_ILL_ADY + 27
    - when: _AVISIT_P4 = 'Baseline'
