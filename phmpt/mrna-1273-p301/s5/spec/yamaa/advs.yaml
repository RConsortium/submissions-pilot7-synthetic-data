    - when: DOSE1FL = 'Y' AND _POSTFL2 = 'Y' AND ADT IS NOT NULL AND DOSE2FL = 'Y' AND _SV7 IS NULL AND _EOS IS NULL AND _DTH IS NULL
      then: '''Vaccination stage'''
    - when: DOSE1FL = 'Y' AND _POSTFL2 = 'Y' AND ADT IS NOT NULL AND DOSE2FL = 'Y' AND ((ADT <= _M7 AND _M7 IS NOT NULL) OR (_M7 IS NULL AND ADT <= _EOSDTHDT AND _EOSDTHDT IS NOT NULL)) AND DOSE2DT IS NOT NULL AND ADT >= DOSE2DT
      then: '''Vaccination stage'''
    - when: DOSE1FL = 'Y' AND _POSTFL2 = 'Y' AND ADT IS NOT NULL AND DOSE2FL = 'Y' AND ADT <= DOSE2DT AND _SV4 IS NOT NULL AND _M7 IS NULL
      then: '''Vaccination stage'''
    - when: DOSE1FL = 'Y' AND _POSTFL2 = 'Y' AND ADT IS NOT NULL AND DOSE2FL = 'Y' AND TR01SDT IS NOT NULL AND ADT >= TR01SDT AND ((ADT <= _M7 AND _M7 IS NOT NULL) OR (_ADTM <= _SV7TM AND _ADTM IS NOT NULL AND _SV7TM IS NOT NULL))
      then: '''Vaccination stage'''
    - when: DOSE1FL = 'Y' AND _POSTFL2 = 'Y' AND ADT IS NOT NULL AND DOSE2FL = 'Y' AND _M7 IS NOT NULL AND ADT > _M7
      then: '''Follow-Up Analysis Period'''
    - when: DOSE1FL = 'Y' AND _POSTFL2 = 'Y' AND ADT IS NOT NULL AND (DOSE2FL IS NULL OR DOSE2FL <> 'Y') AND _SV4 IS NULL AND _EOS IS NULL AND _DTH IS NULL
      then: '''Vaccination stage'''
    - when: DOSE1FL = 'Y' AND _POSTFL2 = 'Y' AND ADT IS NOT NULL AND (DOSE2FL IS NULL OR DOSE2FL <> 'Y') AND _SV4 IS NOT NULL AND ADT > _SV4
      then: '''Follow-Up Analysis Period'''
    - when: DOSE1FL = 'Y' AND _POSTFL2 = 'Y' AND ADT IS NOT NULL AND (DOSE2FL IS NULL OR DOSE2FL <> 'Y') AND TR01SDT IS NOT NULL AND ADT >= TR01SDT AND ((ADT <= _SV4 AND _SV4 IS NOT NULL) OR (_ADTM <= _SV4TM AND _ADTM IS NOT NULL AND _SV4TM IS NOT NULL))
      then: '''Vaccination stage'''
    - when: DOSE1FL = 'Y' AND _POSTFL2 = 'Y' AND ADT IS NOT NULL AND (DOSE2FL IS NULL OR DOSE2FL <> 'Y') AND _ADTM IS NOT NULL AND TR01SDTM IS NOT NULL AND _ADTM >= TR01SDTM AND _SV4 IS NULL AND _M7 IS NULL AND _EOS IS NOT NULL AND ADT <= _EOS
      then: '''Vaccination stage'''
    - otherwise: "''"
