# ADARP7D for Moderna mRNA-1273-P301, cut S5 (First Interim Analysis IA1b,
# extract 2020-11-25).
# Layer over the S3 spec: the S5 program (A_P_adar with %let dsetname =
# adarp7d, Bates 5657866-5657875) is the S3 A20ADARP7D program (Bates
# 3820372-3820385) with these changes, each ported below where it lands:
#  - no MEDTAK/MEDTAKP/MEDTAKT records from SUPPVS, LYMPH = Lymphadenopathy;
#  - the FAAE/FACE selections keep grade-0 and 'NONE' records and drop
#    erythema/swelling occurrence records only when FAORRES = 'Y';
#  - no AVAL-threshold deletes (S3 'if .<AVAL<25 then delete'), no
#    day 7 / day 8 flags and no whole-group delete when no record is past
#    day 7 (S3's witness intermediates);
#  - grade 0 is graded, AVAL is 0 for a non-occurring erythema/swelling;
#  - flags: ANL01FL = local parameter with ATOXGRN > 0; ANL02FL, ANL03FL
#    and ANL04FL are S3's ANL04FL, ANL05FL and ANL06FL, computed the same
#    way on the S5 record set; S3's ANL02FL/ANL03FL/ANL05FL/ANL06FL are
#    not produced.
# (scripts/reproduce.py verify --study mrna-1273-p301 --cut s5)
#
# Input: the S5 release carries no FACE (only SUPPFACE), so FACE and its
# SUPPFACE are read from the S3 release (BLA 125752 S3), a later snapshot;
# subjects whose S3 FACE records differ from the S5 snapshot do not match
# (data/differences.yaml, missing_input). FAAE, VS and their SUPP domains
# are this cut's.
#
# ADSL: the IA ADSL has none of S3's own ADSL columns, so their
# derivations are nulled and their submission metadata cleared.
yamaa: '1.0'
type: spec
parent: ../../../s3/spec/yamaa/adarp7d.yaml
input:
  FACE: <study-dir>/s3/data/sdtm/face.parquet
  SUPPFACE: <study-dir>/s3/data/sdtm/suppface.parquet
clear:
- columns.AGEGR3.submission
- columns.AGEGR3N.submission
- columns.AGEGR4.submission
- columns.AGEGR4N.submission
- columns.RANDIGFL.submission
- columns.PPSIFL.submission
- columns.CCIASFL.submission
- columns.OLDOS1FL.submission
- columns.OLDOS2FL.submission
- columns.TRT02P.submission
- columns.TRT02PN.submission
- columns.TRT02A.submission
- columns.TRT02AN.submission
- columns.TRTSEQP.submission
- columns.TRTSEQPN.submission
- columns.TRTSEQA.submission
- columns.TRTSEQAN.submission
- columns.TRTSDT.submission
- columns.TRTEDT.submission
- columns.TR02SDT.submission
- columns.TR02SDTM.submission
- columns.TR02EDT.submission
- columns.TR02EDTM.submission
- columns.OLDOS2DT.submission
- columns.OLDO2DTM.submission
- columns.EUAVACDT.submission
- columns.EFFCODT.submission
- columns.AP01SDT.submission
- columns.AP01EDT.submission
- columns.AP02SDT.submission
- columns.AP02EDT.submission
- columns.AP01SSDT.submission
- columns.AP01SEDT.submission
- columns.AP02SSDT.submission
- columns.AP02SEDT.submission
- columns.STUDDUR3.submission
- columns.COVIDAFL.submission
- columns.CVDSVAFL.submission
- columns.ANL05FL.submission
- columns.ANL06FL.submission
intermediates:
# data FAAE_subjid / FAAE_fv_subjid: faae_all where not ((erythema or
# swelling) and fatest='Occurrence Indicator' and FAORRES='Y') and
# fastat ^= 'NOT DONE' and ^missing(faTPTREF) -- no FASTRESC condition
# (S3 also required a graded, non-'NONE' FASTRESC).
- id: K_FAAE_FA
  filter: NOT((FAAE.FAOBJ IN ('Erythema', 'Swelling') AND FAAE.FATEST = 'Occurrence Indicator' AND FAAE.FAORRES = 'Y') OR (FAAE.FASTAT IS NOT NULL AND FAAE.FASTAT = 'NOT DONE')) AND FAAE.FATPTREF IS NOT NULL AND FAAE.FATPTREF NOT IN ('')
- id: K_VS_FAAE
  filter: NOT((FAAE.FAOBJ IN ('Erythema', 'Swelling') AND FAAE.FATEST = 'Occurrence Indicator' AND FAAE.FAORRES = 'Y') OR (FAAE.FASTAT IS NOT NULL AND FAAE.FASTAT = 'NOT DONE')) AND FAAE.FATPTREF IS NOT NULL AND FAAE.FATPTREF NOT IN ('') AND FAAE._PCD_E = 'FEVER'
rows:
# data combine: FAAE1 where not ((erythema or swelling) and fatest=
# 'Occurrence Indicator' and FAORRES='Y') and fastat ^= 'NOT DONE' and
# upcase(facat) = 'REACTOGENICITY'; FAAE1 is faae_all merged with
# _FAAE_subjid by (usubjid, PARAMCD, FATPTREF). Then the ADSL inner join and
# the dose-2 drop (adsl dropfl step). No AVAL-threshold or witness filter.
- id: faae_rows
  filter: ((_K_FAAE_FA IS NOT NULL OR _K_FAAE_VS IS NOT NULL) AND NOT((_FAOBJ IN ('Erythema', 'Swelling') AND _FATEST = 'Occurrence Indicator' AND _FAORRES = 'Y') OR (_FASTAT IS NOT NULL AND _FASTAT = 'NOT DONE') OR _FACAT IS NULL OR _FACAT <> 'REACTOGENICITY') AND NOT(_ATPTREF = 'Vaccination 2' AND _DOSE2FL = 'N') AND _ADSL IS NOT NULL)
# data combine: vs1 where vscat='REACTOGENICITY' and vsstat ^= 'NOT DONE';
# vs1 is vs_all merged with _VS_subjid by (usubjid, VSTESTCD, vstptref),
# every timepoint of the selected keys (no AVAL >= 38 condition).
- id: vs_rows
  filter: ((_K_VS_VS IS NOT NULL OR _K_VS_FAAE IS NOT NULL) AND _VSCAT = 'REACTOGENICITY' AND (_VSSTAT IS NULL OR _VSSTAT <> 'NOT DONE') AND NOT(_ATPTREF = 'Vaccination 2' AND _DOSE2FL = 'N') AND _ADSL IS NOT NULL)
# data combine: FACE1, with the FAAE1 selection.
- id: face_rows
  filter: ((_K_FAAE_FA IS NOT NULL OR _K_FAAE_VS IS NOT NULL) AND NOT((_FAOBJ IN ('Erythema', 'Swelling') AND _FATEST = 'Occurrence Indicator' AND _FAORRES = 'Y') OR (_FASTAT IS NOT NULL AND _FASTAT = 'NOT DONE') OR _FACAT IS NULL OR _FACAT <> 'REACTOGENICITY') AND NOT(_ATPTREF = 'Vaccination 2' AND _DOSE2FL = 'N') AND _ADSL IS NOT NULL)
# The S5 program has no data vs_all step outputting one record per SUPPVS
# MEDTAK/MEDTAKP/MEDTAKT = 'Y': the S3 templates select nothing.
- id: vs_medtak_rows
  filter: 1 = 0
- id: vs_medtakp_rows
  filter: 1 = 0
- id: vs_medtakt_rows
  filter: 1 = 0
windows:
# ***ANL03FL***: last record per (usubjid, param, atptref, atpt) in the
# sort _agfl atoxgrn descending adt descending _faeval descending srcseq
# (S3's ANL05FL), with _agfl from the S5 grade.
  ANL05_ORD:
    group_by: [USUBJID, PARAM, ATPTREF, ATPT]
    order_by:
    - _AGFL_S5
    - ATOXGRN
    - variable: ADT
      direction: desc
    - variable: _FAEVAL_NUM
      direction: desc
    - variable: SRCSEQ
      direction: desc
