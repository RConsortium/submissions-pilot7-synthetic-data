# data combine_final: if ^missing(_atm) then ATM = input(_atm,time5.);
# kept in S5's output (S3 drops it).
- name: ATM
  type: time
  label: 'Analysis Time'
  derivation:
    to_time:
      source: _ORI_ADTM
  submission:
    core: Perm
    mandatory: false
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
# proc format $param: LYMPH = 'Lymphadenopathy'; MEDATTEN and MEDTA* are
# not in the S5 format.
- name: PARAM
  derivation:
    case:
    - when: PARAMCD = 'LYMPH'
      then: '''Lymphadenopathy'''
    - when: PARAMCD = 'PAIN'
      then: '''Pain'''
    - when: PARAMCD = 'ERYTHDIA'
      then: '''Erythema Longest Diameter (mm)'''
    - when: PARAMCD = 'SWELLDIA'
      then: '''Swelling Longest Diameter (mm)'''
    - when: PARAMCD = 'HEADACHE'
      then: '''Headache'''
    - when: PARAMCD = 'FATIGUE'
      then: '''Fatigue'''
    - when: PARAMCD = 'MYALGIA'
      then: '''Myalgia'''
    - when: PARAMCD = 'ARTHRALG'
      then: '''Arthralgia'''
    - when: PARAMCD = 'NAUSEA'
      then: '''Nausea/Vomiting'''
    - when: PARAMCD = 'CHILLS'
      then: '''Chills'''
    - when: PARAMCD = 'FEVER'
      then: '''Fever (C)'''
    - otherwise: _FAOBJ
  submission:
    method: "Withheld from publication: the received define states this text."
# AVAL (combine_final step): 0 for an erythema or swelling occurrence
# record whose result is no (the S3 program has this rule commented out);
# otherwise VSSTRESN or FASTRESN.
- name: AVAL
  derivation:
    case:
    - when: _FAORRES_UP IN ('N', 'NO') AND _FATEST = 'Occurrence Indicator' AND _PARAMCD IN ('ERYTHDIA', 'SWELLDIA')
      then: 0.0
    - otherwise: _AVAL_NUM
  submission:
    method: "Withheld from publication: the received define states this text."
# data combine_final, Analysis Toxicity Grade: the S5 chains grade 0
# (S3 deleted or skipped grade-0 records).
- name: ATOXGRN
  derivation:
    case:
    - when: _PARAMCD IN ('ERYTHDIA', 'SWELLDIA') AND ((AVAL IS NOT NULL AND AVAL < 25) OR (_FASTRESC IS NOT NULL AND str_contains(_FASTRESC, 'GRADE 0')))
      then: 0
    - when: _PARAMCD IN ('ERYTHDIA', 'SWELLDIA') AND ((AVAL >= 25 AND AVAL <= 50) OR (_FASTRESC IS NOT NULL AND str_contains(_FASTRESC, 'GRADE 1')))
      then: 1
    - when: _PARAMCD IN ('ERYTHDIA', 'SWELLDIA') AND ((AVAL > 50 AND AVAL <= 100) OR (_FASTRESC IS NOT NULL AND str_contains(_FASTRESC, 'GRADE 2')))
      then: 2
    - when: _PARAMCD IN ('ERYTHDIA', 'SWELLDIA') AND (AVAL > 100 OR (_FASTRESC IS NOT NULL AND str_contains(_FASTRESC, 'GRADE 3')))
      then: 3
    - when: _PARAMCD IN ('ERYTHDIA', 'SWELLDIA') AND (_FASTRESC IS NOT NULL AND str_contains(_FASTRESC, 'GRADE 4'))
      then: 4
    - when: _PARAMCD = 'FEVER' AND ((AVAL IS NOT NULL AND AVAL < 38) OR (_FASTRESC IS NOT NULL AND str_contains(_FASTRESC, 'GRADE 0')))
      then: 0
    - when: _PARAMCD = 'FEVER' AND ((AVAL >= 38 AND AVAL <= 38.4) OR (_FASTRESC IS NOT NULL AND str_contains(_FASTRESC, 'GRADE 1')))
      then: 1
    - when: _PARAMCD = 'FEVER' AND ((AVAL > 38.4 AND AVAL <= 38.9) OR (_FASTRESC IS NOT NULL AND str_contains(_FASTRESC, 'GRADE 2')))
      then: 2
    - when: _PARAMCD = 'FEVER' AND ((AVAL > 38.9 AND AVAL <= 40) OR (_FASTRESC IS NOT NULL AND str_contains(_FASTRESC, 'GRADE 3')))
      then: 3
    - when: _PARAMCD = 'FEVER' AND (AVAL > 40 OR (_FASTRESC IS NOT NULL AND str_contains(_FASTRESC, 'GRADE 4')))
      then: 4
    - when: _PARAMCD IN ('PAIN', 'LYMPH', 'HEADACHE') AND (_AVALC_UP = 'NONE' OR (_FASTRESC IS NOT NULL AND str_contains(_FASTRESC, 'GRADE 0')))
      then: 0
    - when: _PARAMCD IN ('PAIN', 'LYMPH', 'HEADACHE') AND (_AVALC_UP IN ('DOES NOT INTERFERE WITH ACTIVITY', 'NO INTERFERENCE WITH ACTIVITY') OR (_FASTRESC IS NOT NULL AND str_contains(_FASTRESC, 'GRADE 1')))
      then: 1
    - when: _PARAMCD IN ('PAIN', 'LYMPH', 'HEADACHE') AND ((_AVALC_UP IS NOT NULL AND str_contains(_AVALC_UP, 'REPEATED')) OR (_FASTRESC IS NOT NULL AND str_contains(_FASTRESC, 'GRADE 2')))
      then: 2
    - when: _PARAMCD IN ('PAIN', 'LYMPH', 'HEADACHE') AND (_AVALC_UP IN ('ANY USE OF PRESCRIPTION RELIEVER OR PREVENTS DAILY ACTIVITY', 'ANY USE OF PRESCRIPTION PAIN RELIEVER OR PREVENTS DAILY ACTIVITY') OR (_FASTRESC IS NOT NULL AND str_contains(_FASTRESC, 'GRADE 3')))
      then: 3
    - when: _PARAMCD IN ('PAIN', 'LYMPH', 'HEADACHE') AND (_FASTRESC IS NOT NULL AND str_contains(_FASTRESC, 'GRADE 4'))
      then: 4
    - when: _PARAMCD IN ('FATIGUE', 'MYALGIA', 'ARTHRALG') AND (_AVALC_UP = 'NONE' OR (_FASTRESC IS NOT NULL AND str_contains(_FASTRESC, 'GRADE 0')))
      then: 0
    - when: _PARAMCD IN ('FATIGUE', 'MYALGIA', 'ARTHRALG') AND (_AVALC_UP = 'NO INTERFERENCE WITH ACTIVITY' OR (_FASTRESC IS NOT NULL AND str_contains(_FASTRESC, 'GRADE 1')))
      then: 1
    - when: _PARAMCD IN ('FATIGUE', 'MYALGIA', 'ARTHRALG') AND (_AVALC_UP = 'SOME INTERFERENCE WITH ACTIVITY' OR (_FASTRESC IS NOT NULL AND str_contains(_FASTRESC, 'GRADE 2')))
      then: 2
    - when: _PARAMCD IN ('FATIGUE', 'MYALGIA', 'ARTHRALG') AND (_AVALC_UP = 'SIGNIFICANT; PREVENTS DAILY ACTIVITY' OR (_FASTRESC IS NOT NULL AND str_contains(_FASTRESC, 'GRADE 3')))
      then: 3
    - when: _PARAMCD IN ('FATIGUE', 'MYALGIA', 'ARTHRALG') AND (_FASTRESC IS NOT NULL AND str_contains(_FASTRESC, 'GRADE 4'))
      then: 4
    - when: _PARAMCD = 'NAUSEA' AND (_AVALC_UP = 'NONE' OR (_FASTRESC IS NOT NULL AND str_contains(_FASTRESC, 'GRADE 0')))
      then: 0
    - when: _PARAMCD = 'NAUSEA' AND (_AVALC_UP = 'NO INTERFERENCE WITH ACTIVITY OR 1-2 EPISODES/24 HOURS' OR (_FASTRESC IS NOT NULL AND str_contains(_FASTRESC, 'GRADE 1')))
      then: 1
    - when: _PARAMCD = 'NAUSEA' AND (_AVALC_UP = 'SOME INTERFERENCE WITH ACTIVITY OR >2 EPISODES/24 HOURS' OR (_FASTRESC IS NOT NULL AND str_contains(_FASTRESC, 'GRADE 2')))
      then: 2
    - when: _PARAMCD = 'NAUSEA' AND (_AVALC_UP = 'PREVENTS DAILY ACTIVITY, REQUIRES OUTPATIENT IV HYDRATION' OR (_FASTRESC IS NOT NULL AND str_contains(_FASTRESC, 'GRADE 3')))
      then: 3
    - when: _PARAMCD = 'NAUSEA' AND (_FASTRESC IS NOT NULL AND str_contains(_FASTRESC, 'GRADE 4'))
      then: 4
    - when: _PARAMCD = 'CHILLS' AND (_AVALC_UP = 'NONE' OR (_FASTRESC IS NOT NULL AND str_contains(_FASTRESC, 'GRADE 0')))
      then: 0
    - when: _PARAMCD = 'CHILLS' AND (_AVALC_UP = 'NO INTERFERENCE WITH ACTIVITY' OR (_FASTRESC IS NOT NULL AND str_contains(_FASTRESC, 'GRADE 1')))
      then: 1
    - when: _PARAMCD = 'CHILLS' AND (_AVALC_UP = 'SOME INTERFERENCE WITH ACTIVITY NOT REQUIRING MEDICAL ATTENTION' OR (_FASTRESC IS NOT NULL AND str_contains(_FASTRESC, 'GRADE 2')))
      then: 2
    - when: _PARAMCD = 'CHILLS' AND (_AVALC_UP = 'PREVENTS DAILY ACTIVITY AND REQUIRES MEDICAL ATTENTION' OR (_FASTRESC IS NOT NULL AND str_contains(_FASTRESC, 'GRADE 3')))
      then: 3
    - when: _PARAMCD = 'CHILLS' AND (_FASTRESC IS NOT NULL AND str_contains(_FASTRESC, 'GRADE 4'))
      then: 4
    - otherwise: null
  submission:
    method: "Withheld from publication: the received define states this text."
- name: ATOXGR
  derivation:
    case:
    - when: ATOXGRN = 0
      then: '''Grade 0'''
    - when: ATOXGRN = 1
      then: '''Grade 1'''
    - when: ATOXGRN = 2
      then: '''Grade 2'''
    - when: ATOXGRN = 3
      then: '''Grade 3'''
    - when: ATOXGRN = 4
      then: '''Grade 4'''
    - otherwise: "''"
  submission:
    method: "Withheld from publication: the received define states this text."
# data combine_final: if atoxgrn~=. then _agfl=1 (from the S5 grade).
- name: _AGFL_S5
  type: int
  derivation:
    case:
    - when: ATOXGRN IS NOT NULL
      then: 1
    - otherwise: null
# ANL01FL (combine_final step): Y for the three local parameters (pain,
# erythema, swelling) with a grade above 0 (S3: the four local parameters,
# any grade).
- name: ANL01FL
  derivation:
    case:
    - when: PARAMCD IN ('PAIN', 'ERYTHDIA', 'SWELLDIA') AND ATOXGRN > 0
      then: '''Y'''
    - otherwise: "''"
  submission:
    method: "Withheld from publication: the received define states this text."
# ***ANL02FL***: first.ATPTREF in the sort USUBJID PARAMCD descending
# anl01fl ATPTREF descending _atpta ATPTGR1N adt atm, with atptgr1n>=8,
# _atpta=1 and anl01fl='Y', merged back onto the (USUBJID, PARAMCD,
# anl01fl, ATPTREF) group -- S3's ANL04FL.
- name: ANL02FL
  derivation:
    case:
    - when: _ANL04_MAX = 1
      then: '''Y'''
    - otherwise: "''"
  submission:
    method: "Withheld from publication: the received define states this text."
# ***ANL03FL***: if last.atpt and _agfl=1 -- S3's ANL05FL.
- name: ANL03FL
  derivation:
    case:
    - when: _ANL05_RN = _ANL05_CNT AND _AGFL_S5 = 1
      then: '''Y'''
    - otherwise: "''"
  submission:
    method: "Withheld from publication: the received define states this text."
# proc sql __anl04fl: per (USUBJID, PARAMCD, ATPTREF), among ATOXGRN>0
# records, .<min(ATPTGR1N)<8 and max(ATPTGR1N)>=8, merged onto every
# record of the group -- S3's ANL06FL.
- name: ANL04FL
  derivation:
    case:
    - when: _ANL06_MIN < 8 AND _ANL06_MAX >= 8
      then: '''Y'''
    - otherwise: "''"
  submission:
    method: "Withheld from publication: the received define states this text."
