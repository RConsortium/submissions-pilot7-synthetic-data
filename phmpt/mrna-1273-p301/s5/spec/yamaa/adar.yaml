# ADAR for Moderna mRNA-1273-P301, cut S5 (First Interim Analysis IA1b,
# extract 2020-11-25).
# Layer over the S3 spec: the S5 ADAR program (A_P_adar, Bates
# 5657859-5657865) is the S3 A20ADAR program (Bates 3820363-3820371)
# without the MEDTAK/MEDTAKP/MEDTAKT parameters, with S5's LYMPH label,
# _faeval ordering and SUPPVS columns. Each override below names the
# program step it ports (scripts/reproduce.py verify --study mrna-1273-p301
# --cut s5).
#
# Input: the S5 release carries no FACE (only SUPPFACE), so FACE and its
# SUPPFACE are read from the S3 release (BLA 125752 S3), a later snapshot
# of the same study: the program runs on it unchanged. The S3 FACE adds
# later diary records (mostly INVESTIGATOR re-assessments) and renumbers
# FASEQ for some subjects, so those subjects' rows, SRCSEQ and ASEQ do
# not match the S5 snapshot (data/differences.yaml, missing_input).
#
# ADSL: the IA ADSL has none of S3's own ADSL columns, so their
# derivations are nulled here and their submission metadata cleared; the
# %xxdoserf chain then reads TR02SDT/TR02SDTM/OLDOS2DT/OLDO2DTM as missing,
# as the S5 program does (its adslvar list merges only tr01sdt tr01sdtm
# rfxstdtc tr01edt tr01edtm dose2dt dos2dtm).
yamaa: '1.0'
type: spec
parent: ../../../s3/spec/yamaa/adar.yaml
input:
  FACE: <study-dir>/s3/data/sdtm/face.parquet
  SUPPFACE: <study-dir>/s3/data/sdtm/suppface.parquet
clear:
- columns.AGEGR3.submission
- columns.AGEGR3N.submission
- columns.AGEGR4.submission
- columns.AGEGR4N.submission
- columns.RANDIGFL.submission
- columns.PPSIFL.submission
- columns.CCIASFL.submission
- columns.OLDOS1FL.submission
- columns.OLDOS2FL.submission
- columns.TRT02P.submission
- columns.TRT02PN.submission
- columns.TRT02A.submission
- columns.TRT02AN.submission
- columns.TRTSEQP.submission
- columns.TRTSEQPN.submission
- columns.TRTSEQA.submission
- columns.TRTSEQAN.submission
- columns.TRTSDT.submission
- columns.TRTEDT.submission
- columns.TR02SDT.submission
- columns.TR02SDTM.submission
- columns.TR02EDT.submission
- columns.TR02EDTM.submission
- columns.OLDOS2DT.submission
- columns.OLDO2DTM.submission
- columns.EUAVACDT.submission
- columns.EFFCODT.submission
- columns.AP01SDT.submission
- columns.AP01EDT.submission
- columns.AP02SDT.submission
- columns.AP02EDT.submission
- columns.AP01SSDT.submission
- columns.AP01SEDT.submission
- columns.AP02SSDT.submission
- columns.AP02SEDT.submission
- columns.STUDDUR3.submission
- columns.COVIDAFL.submission
- columns.CVDSVAFL.submission
rows:
# A_P_adar data face_vs: the VS set is vscat='REACTOGENICITY' and
# vstptnum<=7 and missing(vsstat) and ^missing(VSTPTREF) (S3 also kept
# MEDTA* rows with a VSSTAT).
- id: vs_rows
  filter: VS.VSCAT = 'REACTOGENICITY' AND VS.VSTPTNUM <= 7 AND (VS.VSSTAT IS NULL OR VS.VSSTAT IN ('')) AND (VS.VSTPTREF IS NOT NULL AND VS.VSTPTREF NOT IN ('')) AND _ADSL IS NOT NULL AND NOT ((ADSL.DOSE2FL IS NOT NULL AND ADSL.DOSE2FL = 'N') AND (_TPTREF IS NOT NULL AND str_contains(_TPTREF, '2')) AND NOT (_TPTREF IS NOT NULL AND str_contains(_TPTREF, '1')))
# A_P_adar has no data vs_all step that outputs one VS record per SUPPVS
# MEDTAK/MEDTAKP/MEDTAKT = 'Y' (S3 A20ADAR does): the S3 templates select
# nothing here.
- id: medtak_rows
  filter: 1 = 0
- id: medtakp_rows
  filter: 1 = 0
- id: medtakt_rows
  filter: 1 = 0
columns:
# ADSL columns the IA ADSL does not carry (see the header).
- name: AGEGR3
  derivation: null
- name: AGEGR3N
  derivation: null
- name: AGEGR4
  derivation: null
- name: AGEGR4N
  derivation: null
