- name: AP02SEDT
  derivation: null
- name: COVIDAFL
  derivation: null
- name: CVDSVAFL
  derivation: null
# Some IA ADSL subjects have no RACE (as in the other S5 datasets).
- name: RACE
  submission:
    mandatory: false
- name: COMPLFL
  derivation: ADSL.COMPLFL
  submission:
    origins:
    - type: Predecessor
      description: ADSL.COMPLFL
# A_P_adar data face_date: _faeval is 1 for STUDY SUBJECT, 2 for a blank
# FAEVAL, 3 for INVESTIGATOR (S3: 1 for STUDY SUBJECT or a blank-FAEVAL
# FEVER record, else 2). It orders the ANL01FL and ANL03FL sorts.
- name: _FAEVAL
  derivation:
    case:
    - when: _EVAL = 'STUDY SUBJECT'
      then: 1
    - when: _EVAL IS NULL OR _EVAL IN ('')
      then: 2
    - when: _EVAL = 'INVESTIGATOR'
      then: 3
    - otherwise: null
# A_P_adar proc format $param: LYMPH = 'Lymphadenopathy'; no MEDTA* labels.
- name: PARAM
  derivation:
    case:
    - when: PARAMCD = 'FEVER'
      then: '''Fever (C)'''
    - when: PARAMCD = 'LYMPH'
      then: '''Lymphadenopathy'''
    - when: PARAMCD = 'PAIN'
      then: '''Pain'''
    - when: PARAMCD = 'NAUSEA'
      then: '''Nausea/Vomiting'''
    - when: PARAMCD = 'ERYTHDIA'
      then: '''Erythema Longest Diameter (mm)'''
    - when: PARAMCD = 'SWELLDIA'
      then: '''Swelling Longest Diameter (mm)'''
    - when: PARAMCD = 'HEADACHE'
      then: '''Headache'''
    - when: PARAMCD = 'FATIGUE'
      then: '''Fatigue'''
    - when: PARAMCD = 'MYALGIA'
      then: '''Myalgia'''
    - when: PARAMCD = 'ARTHRALG'
      then: '''Arthralgia'''
    - when: PARAMCD = 'CHILLS'
      then: '''Chills'''
    - otherwise: _OBJ
  submission:
    method: "Withheld from publication: the received define states this text."
# A_P_adar data face_date: if ^missing(_atm) then ATM = input(_atm,time5.);
# kept in S5's output (S3 drops it).
- name: ATM
  type: time
  label: 'Analysis Time'
  derivation:
    to_time:
      source: _ORI_ADTM
  submission:
    core: Perm
    mandatory: false
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
# A_P_adar %revsupp(ds=vs, supp=suppvs) merges the SUPPVS QNAMs onto the
# VS records; the program keeps them, so VS rows carry MEDTAKP, MEDTAKT and
# MEDTAK and FACE rows leave them blank.
- name: MEDTAKP
  type: str
  label: 'Prevent pain or fever'
  derivation: SUPP_P_VS.MEDTAKP
  submission:
    core: Perm
    mandatory: false
    length: 1
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: MEDTAKT
  type: str
  label: 'Treat Pain or Fever'
  derivation: SUPP_P_VS.MEDTAKT
  submission:
    core: Perm
    mandatory: false
    length: 1
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: MEDTAK
  type: str
  label: 'Medication taken today for pain or fever'
  derivation: SUPP_P_VS.MEDTAK
  submission:
    core: Perm
    mandatory: false
    length: 1
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
