- name: TRTEDT
  derivation: null
- name: TR02SDT
  derivation: null
- name: TR02SDTM
  derivation: null
- name: TR02EDT
  derivation: null
- name: TR02EDTM
  derivation: null
- name: OLDOS2DT
  derivation: null
- name: OLDO2DTM
  derivation: null
- name: EUAVACDT
  derivation: null
- name: AP01SDT
  derivation: null
- name: AP01EDT
  derivation: null
- name: AP02SDT
  derivation: null
- name: AP02EDT
  derivation: null
- name: AP01SSDT
  derivation: null
