# ADSYMP for Moderna mRNA-1273-P301, cut S5 (First Interim Analysis
# IA1b, efficacy cutoff 2020-11-21). Parent: ../../../spec/yamaa/base/adam-base-ia.yaml (which
# chains to ../../../spec/yamaa/base/adam-base.yaml; 86 shared + 6 IA-only ADSL
# columns). Derivations implement the S5 A20ADSY program (Bates
# 5657932-5657936, dsetname=adsymp; byte-identical to the S80 program): VS rows
# (OXYSAT<=93 / TEMP>=38C), FAEF rows (FACAT EFFICACY), PR rows
# (PRCAT EFFICACY, PROCCUR present), HO rows (ICU admissions), each
# inner-joined to the verified ADSL on USUBJID, with ASEQ assigned
# per subject by the SAS sort (parcat1, paramcd, avisitn, adt, srcseq).
# Each source block filters on its date <= the efficacy cutoff 2020-11-21
# (&cut_effi., inferred from the S5 ADSL EFFCODT, uniformly 2020-11-21,
# and the exact row-count reconciliation; a missing cutoff date passes
# the filter in SAS, so the clause is (_CUTDT IS NULL OR _CUTDT <=
# DATE '2020-11-21')). No APERIOD / EUAVACFL in this cut, no tranwrd
# step (PARAM keeps '<=93%' with no space), no PR renames. Where the SAS
# code and the define.xml method text disagree, the code is followed
# (see README.md). SAP note (closed 2026-11-24, no-impact): the file
# labelled "SAP v3" (19745_S68_M5_sap-v3.pdf) is the P201 SAP v3.0
# (27 Oct 2020), not a P301 SAP version; the only P301 SAP in the set
# is v1.0 (10 Sep 2020). This spec follows the IA program's own
# definitions. Honest gaps: none. The spec verifies EXACT MATCH in a
# single full verify.py run against unpruned inputs: 0 mismatches, 0
# within-tolerance cells, 0 space-only cells on all 72 non-key columns
# (see verify_report.json). No pruned groups were needed at 324,428
# rows, unlike the S3 ADSYMP spec.
yamaa: '1.0'
type: spec
model: ADaM
parent: ../../../spec/yamaa/base/adam-base-ia.yaml
domain: ADSYMP
keys:
- STUDYID
- USUBJID
- ASEQ
input:
  VS: <sdtm-dir>/vs.parquet
  FAEF: <sdtm-dir>/faef.parquet
  SUPPFAEF: <sdtm-dir>/suppfaef.parquet
  PR: <sdtm-dir>/pr.parquet
  HO: <sdtm-dir>/ho.parquet
  ADSL:
    path: <adam-dir>/adsl.parquet
    key:
    - STUDYID
    - USUBJID
submission:
  label: COVID-19 Symptom Analysis Dataset
  class: BASIC DATA STRUCTURE
  structure: One record per subject, per parameter, per analysis timepoint
  repeating: true
rows:
- id: vs_rows
  dataset: VS
  derivations:
    STUDYID: VS.STUDYID
    USUBJID: VS.USUBJID
    _ADTC: VS.VSDTC
    _ASTDTC: null
    _AENDTC: null
    _PARAM_RAW:
      case:
      - when: VS.VSTESTCD = 'OXYSAT'
        then: '''O2 Saturation <=93%'''
      - when: VS.VSTESTCD = 'TEMP'
        then: '''Fever'''
    _AVALC: '''Y'''
    _SEV: null
    _PARCAT1_RAW: VS.VSSCAT
    _ATPT: VS.VSTPT
    _LNKID: VS.VSSPID
    _SRCSEQ: VS.VSSEQ
    _SRC: '''VS'''
    _FASEQ: null
    _CUTDTC: VS.VSDTC
    _STRESN:
      value: VS.VSSTRESN
      unconvertible: null
  filter: VS.VSSCAT = 'COVID-19' AND VS.VSTESTCD IN ('OXYSAT', 'TEMP') AND (VS.VSSTAT IS NULL OR VS.VSSTAT <> 'NOT DONE') AND ((VS.VSTESTCD = 'OXYSAT' AND _STRESN IS NOT NULL AND _STRESN <= 93) OR (VS.VSTESTCD = 'TEMP' AND _STRESN IS NOT NULL AND _STRESN >= 38 AND VS.VSSTRESU = 'C')) AND (_CUTDT IS NULL OR _CUTDT <= DATE '2020-11-21') AND _ADSL IS NOT NULL
- id: faef_rows
  dataset: FAEF
  derivations:
    STUDYID: FAEF.STUDYID
    USUBJID: FAEF.USUBJID
    _ADTC: FAEF.FADTC
    _ASTDTC: SUPP_P.FAEVDTC
    _AENDTC: FAEF.FAENDTC
    _PARAM_RAW:
      case:
      - when: FAEF.FAOBJ = 'Evidence of Shock Requires Vasopressors'
        then: '''Vasopressors Required'''
      - when: FAEF.FAOBJ = 'Myalgia'
        then: '''Muscle Aches (Myalgia)'''
      - when: FAEF.FAOBJ = 'Rhinorrhea'
        then: '''Runny Nose (Rhinorrhea)'''
      - otherwise: FAEF.FAOBJ
    _AVALC:
      case:
      - when: FAEF.FASCAT = 'COVID-19' AND FAEF.FASTRESC IN ('MILD', 'MODERATE', 'SEVERE')
        then: '''Y'''
      - when: FAEF.FASCAT = 'COVID-19' AND FAEF.FASTRESC = 'NONE'
        then: '''N'''
      - otherwise: FAEF.FASTRESC
    _SEV:
      case:
      - when: FAEF.FASCAT = 'COVID-19' AND FAEF.FASTRESC IN ('MILD', 'MODERATE', 'SEVERE')
        then: FAEF.FASTRESC
    _PARCAT1_RAW: FAEF.FASCAT
    _ATPT: FAEF.FATPT
    _LNKID: FAEF.FASPID
    _SRCSEQ: FAEF.FASEQ
    _SRC: '''FA'''
    _FASEQ: FAEF.FASEQ
    _CUTDTC:
      case:
      - when: SUPP_P.FAEVDTC IS NOT NULL AND SUPP_P.FAEVDTC NOT IN ('')
        then: SUPP_P.FAEVDTC
      - otherwise: FAEF.FADTC
    _STRESN: null
  filter: FAEF.FACAT = 'EFFICACY' AND (FAEF.FASTAT IS NULL OR FAEF.FASTAT <> 'NOT DONE') AND (_CUTDT IS NULL OR _CUTDT <= DATE '2020-11-21') AND _ADSL IS NOT NULL
- id: pr_rows
  dataset: PR
  derivations:
    STUDYID: PR.STUDYID
    USUBJID: PR.USUBJID
    _ADTC: null
    _ASTDTC: PR.PRSTDTC
    _AENDTC: PR.PRENDTC
    _PARAM_RAW: PR.PRTRT
    _AVALC: PR.PROCCUR
    _SEV: null
    _PARCAT1_RAW: PR.PRSCAT
    _ATPT: null
    _LNKID: PR.PRLNKID
    _SRCSEQ: PR.PRSEQ
    _SRC: '''PR'''
    _FASEQ: null
    _CUTDTC: PR.PRSTDTC
    _STRESN: null
  filter: PR.PRCAT = 'EFFICACY' AND (PR.PRSTAT IS NULL OR PR.PRSTAT <> 'NOT DONE') AND PR.PROCCUR IS NOT NULL AND PR.PROCCUR NOT IN ('') AND (_CUTDT IS NULL OR _CUTDT <= DATE '2020-11-21') AND _ADSL IS NOT NULL
- id: ho_rows
  dataset: HO
  derivations:
    STUDYID: HO.STUDYID
    USUBJID: HO.USUBJID
    _ADTC: HO.HODTC
    _ASTDTC: HO.HOSTDTC
    _AENDTC: HO.HOENDTC
    _PARAM_RAW: '''Admission to an intensive care unit due to SARS-CoV-2'''
    _AVALC: HO.HOOCCUR
    _SEV: null
    _PARCAT1_RAW: '''COVID-19 SEVERITY'''
    _ATPT: null
    _LNKID: HO.HOSPID
    _SRCSEQ: HO.HOSEQ
    _SRC: '''HO'''
    _FASEQ: null
    _CUTDTC:
      case:
      - when: HO.HOSTDTC IS NOT NULL AND HO.HOSTDTC NOT IN ('')
        then: HO.HOSTDTC
      - otherwise: HO.HODTC
    _STRESN: null
  filter: HO.HOCAT = 'EFFICACY' AND HO.HOTERM = 'ADMITTED TO ICU' AND HO.HOOCCUR IS NOT NULL AND HO.HOOCCUR NOT IN ('') AND (_CUTDT IS NULL OR _CUTDT <= DATE '2020-11-21') AND _ADSL IS NOT NULL
intermediates:
- id: SUPP_P
  dataset: SUPPFAEF
  key:
    STUDYID: STUDYID
    USUBJID: USUBJID
    IDVARVAL:
      str_decimal:
        source: _FASEQ
        decimals: 0
  filter: SUPPFAEF.QNAM = 'FAEVDTC' AND SUPPFAEF.IDVAR = 'FASEQ'
  pivot:
    name: QNAM
    value: QVAL
    fields:
    - FAEVDTC
windows:
  NUM_W:
    group_by:
    - USUBJID
    - PARAMCD
    - ATPT
    order_by:
    - variable: ADT
      nulls: first
    - SRCSEQ
  ASEQ_W:
    group_by:
    - USUBJID
    order_by:
    - PARCAT1
    - PARAMCD
    - variable: AVISITN
      nulls: first
    - variable: ADT
      nulls: first
    - SRCSEQ
