- name: SRCDOM
  type: str
  label: Source Data
  derivation: _SRC
  submission:
    core: Req
    mandatory: true
    length: 20
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: SRCSEQ
  type: int
  label: Source Sequence Number
  derivation: _SRCSEQ
  submission:
    # SUB-29 (yamaa #4820): numeric widths here fit the derived values. The received
    # define's Pinnacle 21 widths stay in the reproduced define layer (define/).
    core: Req
    mandatory: true
    length: 8
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: SRCVAR
  type: str
  label: Source Variable
  derivation:
    case:
    - when: _SRC = 'VS'
      then: '''VSSTRESN'''
    - when: _SRC = 'FA'
      then: '''FASTRESC'''
    - when: _SRC = 'PR'
      then: '''PROCCUR'''
    - when: _SRC = 'HO'
      then: '''HOOCCUR'''
  submission:
    core: Req
    mandatory: true
    length: 50
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: PARAM
  type: str
  label: Parameter
  derivation: _PARAM_RAW
  submission:
    core: Req
    mandatory: true
    length: 200
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: PARAMCD
  type: str
  label: Parameter Code
  derivation:
    mapping:
      source: PARAM
      dict:
        Acute Renal Dysfunction: ARDYSF
        Acute Respiratory Distress Syndrome (ARDS): ARDS
        Admission to an intensive care unit due to SARS-CoV-2: ICU
        Body Aches: BODYACHE
        Chills: CHILLS
        Clinical Evidence of Pneumonia: CEPNEU
        Cough: COUGH
        Diarrhea: DIARRHEA
        Difficulty Breathing: DIBREATH
        ECMO: ECMO
        Fatigue: FATIGUE
        Fever: FEVER
        Headache: HEADACHE
        Heart Rate >= 125 per Minute: HR125
        Hepatic Dysfunction: HEPDYSF
        High-Flow Oxygen: HFOXYGEN
        Mechanical Ventilation: MVENT
        Muscle Aches (Myalgia): MYALGIA
        Nasal Congestion: NASALCON
        Nausea: NAUSEA
        Neurologic Dysfunction: NEURDYSF
        New Loss of Smell: NLSMELL
        New Loss of Taste: NLTASTE
        Non-Invasive Ventilation: NIVENT
        O2 Saturation <=93%: O2SAT93
        Oxygen Saturation of SpO2 <=93% on room air at sea level: OXYGEN93
        PaO2/FIO2 Ratio < 300 mmHg: PAO2F300
        Radiographical Evidence of Pneumonia: REPNEU
        Respiratory Failure: RF
        Respiratory Rates >= 30 per Minute: RR30
        Runny Nose (Rhinorrhea): RUNNOSE
        Shortness of Breath: SHBREATH
        Sore Throat: STHROAT
        Systolic Blood Pressure < 90 mmHg, Diastolic Blood Pressure < 60 mmHg: S90D60
        Vasopressors Required: VASOPRES
        Vomiting: VOMIT
      unmapped: null
  submission:
    core: Req
    mandatory: true
    length: 8
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: _NUM
  type: int
  derivation:
    row_number:
      window: NUM_W
- name: _NUM_STR
  type: str
  derivation:
    str_decimal:
      source: _NUM
      decimals: 0
- name: ASEQ
  type: int
  label: Analysis Sequence Number
  derivation:
    row_number:
      window: ASEQ_W
  submission:
    # SUB-29 (yamaa #4820): numeric widths here fit the derived values. The received
    # define's Pinnacle 21 widths stay in the reproduced define layer (define/).
    core: Req
    mandatory: true
    length: 8
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
