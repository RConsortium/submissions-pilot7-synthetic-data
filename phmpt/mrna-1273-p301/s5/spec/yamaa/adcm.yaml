      source: _CMEN_D2
      pattern: '^0'
      replacement: ''
- name: _ASTDY_INT
  type: int
  derivation:
    study_day:
      source: _ASTDT
      reference: ADSL.TR01SDT
- name: _AENDY_INT
  type: int
  derivation:
