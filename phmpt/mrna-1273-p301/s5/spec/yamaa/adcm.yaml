- name: MDOSREF
  type: str
  label: Most Recent Dose Reference
  derivation:
    case:
    - when: ADSL.TR01SDT IS NOT NULL AND _ASTDT IS NOT NULL AND ADSL.TR01SDT <= _ASTDT AND (ADSL.DOSE2DT IS NULL OR _ASTDT < ADSL.DOSE2DT)
      then: '''Vaccination 1'''
    - when: ADSL.DOSE2DT IS NOT NULL AND _ASTDT IS NOT NULL AND ADSL.DOSE2DT <= _ASTDT
      then: '''Vaccination 2'''
