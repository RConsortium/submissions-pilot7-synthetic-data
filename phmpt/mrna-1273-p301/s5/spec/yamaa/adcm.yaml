# ADCM for Moderna mRNA-1273-P301, cut S5 (First Interim
# Analysis IA1b, cutoff 2020-11-25). Parent: ../../../spec/yamaa/base/adam-base-ia.yaml
# (which chains to ../../../spec/yamaa/base/adam-base.yaml; 86 shared + 6 IA-only
# ADSL columns). Derivations implement the S5 IA ADCM program: one
# row per CM record, inner-joined to the verified ADSL on USUBJID
# (CM 157,516 -> ADCM 157,516: all 27,249 CM subjects are in ADSL,
# so the join drops nothing; no REMOVEFL-style filter, no
# empty-CMTRT filter -- the 8 blank-CMTRT rows are kept). SUPPCM
# EXISTS for S5 as a properly named file (RDOMAIN='CM'); no other
# S5 SUPP file carries RDOMAIN='CM' (checked by content). The S5
# program is BYTE-IDENTICAL to the S80 program. The extra 95th
# column vs S80's 94 is RTPCRBL (after DOSE2FL), from ADSL.
# No S27 file is read. SAP v1 vs v3 CLOSED as no-impact
# (2026-11-24) -- the IA program's own definitions are followed.
# Honest gaps: the (b)(6) redaction -- 20 CMSTDTC values and 3
# CMENDTC values are literally '(b)(6)' in the S5 sources, and the
# target carries '(b)(6)' for ASTDT/ASTDY (20 rows) and AENDT/AENDY
# (3 rows); the spec passes the token through. The imputation flags
# for those rows are unrecoverable (the S80 CM carries the identical
# 20 redactions): ASTDTF='D' for all 20 redacted starts (12 D / 3 M
# / 5 blank in the target -- 8 cells mismatch); AENDTF='D' for all 3
# redacted ends (all 3 are D -- 0 cells mismatch). A redacted CMENDTC
# is present-but-unknown, not missing, so the missing-end-date
# branches of ONTRTFL/FUPFL do not fire on those 3 rows. No RACESPY
# NUL-tail gap (0 rows) and no duration[us] time columns in the
# target. Verification: single full verify.py run 2026-11-23
# 04:22:49-04:24:22 UTC, yamaa 0.8.0 @135082c1f: 157,516x95,
# 8 mismatches, all ASTDTF on redacted-start rows (spec 'D'
# vs target 3x'M' + 5x''); 0 within-tolerance, 0 space-only.
# Report: adcm/verify_report_s5.json (original work tree).
yamaa: '1.0'
type: spec
model: ADaM
parent: ../../../spec/yamaa/base/adam-base-ia.yaml
domain: ADCM
keys:
- STUDYID
- USUBJID
- CMSEQ
input:
  CM: <sdtm-dir>/cm.parquet
  SUPPCM: <sdtm-dir>/suppcm.parquet
  ADSL:
    path: <adam-dir>/adsl.parquet
    key:
    - STUDYID
    - USUBJID
submission:
  label: Concomitant Medication Analysis Dataset
  class: OCCURRENCE DATA STRUCTURE
  structure: One record per subject per medication
  repeating: true
rows:
- id: meds
  dataset: CM
  filter: _ADSL IS NOT NULL
intermediates:
- id: SUPP_P
  dataset: SUPPCM
  key:
    STUDYID: STUDYID
    USUBJID: USUBJID
    IDVARVAL:
      str_decimal:
        source: CMSEQ
        decimals: 0
  filter: SUPPCM.QNAM IN ('CMUOTHSP', 'CMFOTHSP', 'CMROTHSP', 'CMSOL', 'CMPLX', 'ATCLEV1T', 'ATCLEV3T', 'ATCLEV4T', 'CMDECOD1', 'CMDECOD2', 'CMDECOD3') AND SUPPCM.IDVAR = 'CMSEQ'
  pivot:
    name: QNAM
    value: QVAL
    fields:
    - CMUOTHSP
    - CMFOTHSP
    - CMROTHSP
    - CMSOL
    - CMPLX
    - ATCLEV1T
    - ATCLEV3T
    - ATCLEV4T
    - CMDECOD1
    - CMDECOD2
    - CMDECOD3
columns:
- name: _ADSL
  type: str
  derivation: ADSL.USUBJID
- name: _CMST_PREC
  type: str
  derivation:
    precision:
      type: date
      source: CM.CMSTDTC
      invalid: null
- name: _CMEN_PREC
  type: str
  derivation:
    precision:
      type: date
      source: CM.CMENDTC
      invalid: null
- name: _TR01_TXT
  type: str
  derivation: ADSL.TR01SDT
- name: _TR01_Y4
  type: str
  derivation:
    str_substr:
      source: _TR01_TXT
      start: 1
      length: 4
- name: _TR01_YM7
  type: str
  derivation:
    str_substr:
      source: _TR01_TXT
      start: 1
      length: 7
- name: _CMST_Y4
  type: str
  derivation:
    str_substr:
      source: CM.CMSTDTC
      start: 1
      length: 4
- name: _CMST_YM7
  type: str
  derivation:
    str_substr:
      source: CM.CMSTDTC
      start: 1
      length: 7
- name: _ASTDT_IMP
  type: date
  derivation:
    impute:
      type: date
      source: CM.CMSTDTC
      month: 1
      day: first
      invalid: null
- name: _AENDT_IMP
  type: date
  derivation:
    impute:
      type: date
      source: CM.CMENDTC
      month: 12
      day: last
      invalid: null
- name: _ASTDT
  type: date
  derivation:
    case:
    - when: _CMST_PREC = 'year' AND _CMST_Y4 = _TR01_Y4 AND ((CM.CMENDTC IS NULL OR CM.CMENDTC IN ('')) OR ((_CMEN_PREC = 'day' AND CM.CMENDTC > _TR01_TXT) OR (_CMEN_PREC = 'month' AND CM.CMENDTC >= _TR01_YM7) OR (_CMEN_PREC = 'year' AND CM.CMENDTC >= _TR01_Y4)))
      then: ADSL.TR01SDT
    - when: _CMST_PREC = 'month' AND _CMST_YM7 = _TR01_YM7 AND ((CM.CMENDTC IS NULL OR CM.CMENDTC IN ('')) OR ((_CMEN_PREC = 'day' AND CM.CMENDTC > _TR01_TXT) OR (_CMEN_PREC = 'month' AND CM.CMENDTC >= _TR01_YM7) OR (_CMEN_PREC = 'year' AND CM.CMENDTC >= _TR01_Y4)))
      then: ADSL.TR01SDT
    - otherwise: _ASTDT_IMP
- name: _AENDT
  type: date
  derivation:
    case:
    - when: _CMEN_PREC = 'year' OR _CMEN_PREC = 'month'
      then:
        least:
          sources: [_AENDT_IMP, ADSL.EOSDT, ADSL.DTHDT]
    - otherwise: _AENDT_IMP
- name: _TR01EDT28
  type: date
  derivation:
    shift:
      type: date
      source: ADSL.TR01EDT
      days: 28
- name: _PCT_NUM
  type: float
  derivation:
    case:
    - when: str_contains(SUPP_P.CMUOTHSP, '^\.?[0-9]+(\.[0-9]+)? *%$')
      then:
        str_replace:
          source: SUPP_P.CMUOTHSP
          pattern: '[ %]'
          replacement: ''
    - otherwise: '0'
- name: _PCT_FMT
  type: str
  derivation:
    case:
    - when: _PCT_NUM = FLOOR(_PCT_NUM)
      then:
        str_decimal:
          source: _PCT_NUM
          decimals: 0
    - otherwise:
        str_decimal:
          source: _PCT_NUM
          decimals: 2
- name: _CMFOTHSP_CLEAN
  type: str
  derivation:
    str_replace:
      source: SUPP_P.CMFOTHSP
      pattern: ' *[\u{00C2}\u{00A0}]+ *'
      replacement: ' '
- name: _ASTDT_TXT
  type: str
  derivation: _ASTDT
- name: _ASTDT_DD
  type: str
  derivation:
    str_substr:
      source: _ASTDT_TXT
      start: 9
      length: 2
- name: _ASTDT_MM
  type: str
  derivation:
    str_substr:
      source: _ASTDT_TXT
      start: 6
      length: 2
- name: _ASTDT_YYYY
  type: str
  derivation:
    str_substr:
      source: _ASTDT_TXT
      start: 1
      length: 4
- name: _ASTDT_MON
  type: str
  derivation:
    mapping:
      source: _ASTDT_MM
      dict:
        '01': 'Jan'
        '02': 'Feb'
        '03': 'Mar'
        '04': 'Apr'
        '05': 'May'
        '06': 'Jun'
        '07': 'Jul'
        '08': 'Aug'
        '09': 'Sep'
        '10': 'Oct'
        '11': 'Nov'
        '12': 'Dec'
      unmapped: null
- name: _AENDT_TXT
  type: str
  derivation: _AENDT
- name: _AENDT_DD
  type: str
  derivation:
    str_substr:
      source: _AENDT_TXT
      start: 9
      length: 2
- name: _AENDT_MM
  type: str
