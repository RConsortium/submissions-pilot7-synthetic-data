# ADVS for Moderna mRNA-1273-P301, cut S80 (First Interim Analysis IA1a,
# extract 2020-11-11). Parent: ../../../spec/yamaa/base/adam-base-ia.yaml (which
# chains to ../../../spec/yamaa/base/adam-base.yaml; 86 shared + 6 IA-only ADSL
# columns). Derivations implement the S80 IA A20ADVS program: VS rows
# (VSSTAT missing, VSCAT not REACTOGENICITY/EFFICACY) inner-joined
# to the verified ADSL on (USUBJID, SUBJID), with the %ablfl visit
# windowing (sort-2, pre_, sort-4/5, ANL01FL, atoxgr), the %xxdoserf
# 2-dose chain (gated on ASTAGE), %trta with _DOSE = MDOSREF, and the
# %astage macro (SV Day-29/Day-57 visits, no SYSDATE). Where the SAS
# code and the define.xml method text disagree, the code is followed
# (see the generator header). Remaining gap (2026-11-25): 5 grade-4 rows
# (15 cells: ATOXGRH/ATOXGRHN/SHIFT2) from the external import.vsgrade4
# file, which is not in the release. The 678 date-only VSDTC cells follow
# S5's MM/DD/YYYY rule, and CHG/PCHG compare within the numeric tolerance.
# Split verification (session 58, 2026-11-23): the full spec re-verified
# per 4-way SEX x AGE subject partition with the join-aid spec
# (advs/verify_report_s80_split.json) -- baseline reproduced exactly,
# zero new mismatches; no roomier-cell re-run is owed.
# Layer over ../s5/advs.yaml: the derivations are the parent cut's, and
# this file holds only what this cut changes (written by
# scripts/specs/inherit_cut.py; its resolved specification
# equals the standalone file it replaced).
yamaa: '1.0'
type: spec
parent: ../../../s5/spec/yamaa/advs.yaml
clear:
- columns.RTPCRBL.submission
input:
  VS: <sdtm-dir>/vs.parquet
  SUPPVS: <sdtm-dir>/suppvs.parquet
  EX: <sdtm-dir>/ex.parquet
  SV: <sdtm-dir>/sv.parquet
  ADSL:
    path: <adam-dir>/adsl.parquet
rows:
- id: vs_rows
  derivations:
    _VSSTRESC:
      str_replace:
        pattern: '\x00[0-9]'
    _VISIT:
      case:
      - when: _ORI_VISIT = 'Illness Visit Day 3 - Day 21'
        then: "''"
      - when: str_contains(_ORI_VISIT, 'Uns')
        then: "''"
      - otherwise: _ORI_VISIT
intermediates:
- id: SV_V29
  key: [STUDYID, USUBJID, SUBJID]
  order_by: [SV.VISIT, SV.SVSTDTC]
- id: SV_V57
  key: [STUDYID, USUBJID, SUBJID]
  order_by: [SV.VISIT, SV.SVSTDTC]
windows:
  SORT4_W:
    order_by:
    - variable: _AVALN
      direction: desc
    - _POSTFL2
columns:
- name: _VSDTC_Y4
  type: str
  derivation:
    str_substr:
      source: _VSDTC
      start: 7
      length: 4
- name: _VSDTC_M2
  type: str
  derivation:
    str_substr:
      source: _VSDTC
      start: 1
      length: 2
- name: _VSDTC_D2
  type: str
  derivation:
    str_substr:
      source: _VSDTC
      start: 4
      length: 2
- name: _VSDTC_DATE
  type: str
  derivation:
    case:
    - when: str_contains(_VSDTC, '/')
      then:
        str_template:
          template: '{_VSDTC_Y4}-{_VSDTC_M2}-{_VSDTC_D2}'
          missing: ''
    - otherwise:
        str_substr:
          source: _VSDTC
          start: 1
          length: 10
- name: _ORI_TIME
  type: str
  derivation:
    str_extract:
      source: _VSDTC
      pattern: 'T([0-9]{2}:[0-9]{2})'
      group: 1
      no_match: ''
- name: _VSDTC_DT
  type: str
  derivation:
    case:
    - when: _ORI_TIME IS NOT NULL AND _ORI_TIME NOT IN ('')
      then:
        str_template:
          template: '{_VSDTC_DATE}T{_ORI_TIME}'
          missing: ''
    - otherwise: _VSDTC_DATE
- name: _ORI_ADTM_RAW
  derivation:
    impute:
      source: _VSDTC_DT
- name: _ORI_ADTM
  derivation:
    case:
    - when: _ORI_TIME IS NULL OR _ORI_TIME IN ('')
      then:
    - otherwise: _ORI_ADTM_RAW
- name: _VISIT2
  derivation:
    case:
    - when: _VISIT2A IS NULL OR _VISIT2A IN ('') OR str_contains(_VISIT2A, 'Saf')
      then: '''Unsched'''
    - otherwise: _VISIT2A
- name: _VSTPTNUM_INT
  type: str
  derivation:
    str_decimal:
      source: _VSTPTNUM
      decimals: 0
- name: _VSTPTNUM_Z3
  type: str
  derivation:
    case:
    - when: _VSTPTNUM IS NULL
      then:
    - when: _VSTPTNUM < 10
      then:
        str_template:
          template: '00{_VSTPTNUM_INT}'
          missing: ''
    - when: _VSTPTNUM < 100
      then:
        str_template:
          template: '0{_VSTPTNUM_INT}'
          missing: ''
    - otherwise: _VSTPTNUM_INT
- name: _ADDSORTN
  derivation:
    case:
    - when: (_VISIT IS NULL OR _VISIT IN ('')) AND ADT IS NOT NULL
      then:
        str_template:
          template: '{_ADT_TXT} - 999'
          missing: ''
    - when: (str_contains(_VISIT, '^Ill') OR str_contains(_VISIT, '^Conva')) AND ADT IS NOT NULL AND TR01SDT IS NOT NULL AND ADT > TR01SDT AND _VSTPTNUM IS NOT NULL
      then:
        str_template:
          template: '{_ADT_TXT} - {_VSTPTNUM_Z3}'
          missing: ''
    - when: (str_contains(_VISIT, '^Ill') OR str_contains(_VISIT, '^Conva')) AND ADT IS NOT NULL AND TR01SDT IS NOT NULL AND ADT > TR01SDT
      then: _ADT_TXT
    - when: (str_contains(_VISIT, '^Ill') OR str_contains(_VISIT, '^Conva') OR _VISIT IS NULL OR _VISIT IN ('')) AND (_VSDTC IS NULL OR _VSDTC IN (''))
      then: '''0000'''
    - otherwise:
        case:
        - when: ADT IS NOT NULL
          then: _ADT_TXT
        - otherwise: "''"
- name: _ADTMY_S
  derivation:
    case:
    - when: _ADTM IS NOT NULL AND TR01SDTM IS NOT NULL
      then:
        diff:
          type: datetime
          start: TR01SDTM
          end: _ADTM
          unit: second
    - when: ADT IS NOT NULL AND TR01SDT IS NOT NULL
      then: _DAYDIFF * 86400 - 86340
    - when: NOT str_contains(_VISIT2_UP, 'ILLNESS')
      then: 99999999
- name: _ADTMY
  derivation: ABS(_ADTMY_S)
- name: _ADTMY_NUM
  derivation:
    case:
    - when: VISITNUM IS NOT NULL
      then: _ADTMY + VISITNUM
    - otherwise: _ADTMY
- name: _PREFL
  derivation:
    case:
    - when: _ADTMY_S <= 0 AND TR01SDT IS NOT NULL AND NOT ((_VSTPT IS NOT NULL AND str_contains(_VSTPT, 'POST')) AND ADT IS NOT NULL AND TR01SDT IS NOT NULL AND ADT = TR01SDT) AND NOT str_contains(_VISIT2_UP, 'ILLNESS')
      then: '''Y'''
- name: _POSTFL
  derivation:
    case:
    - when: (_VSTPT IS NOT NULL AND str_contains(_VSTPT, 'POST')) AND ADT IS NOT NULL AND TR01SDT IS NOT NULL AND ADT = TR01SDT
      then: '''Y'''
    - when: _ADTMY_S > 0 AND TR01SDT IS NOT NULL AND ADT IS NOT NULL
      then: '''Y'''
    - when: str_contains(_VISIT2_UP, 'ILLNESS')
      then: '''Y'''
- name: _ILLUNS
  derivation:
    case:
    - when: str_contains(_VISIT2_UP, 'ILLNESS') AND str_contains(_VISIT2, 'Uns')
      then: 1
    - otherwise: 0
- name: _ILL_SET
  derivation:
    case:
    - when: (_FIRST_ADT = 1 AND str_contains(_VISIT2_UP, 'ILLNESS') AND str_contains(_VISIT2_UP, 'DAY 1') AND NOT str_contains(_VISIT2_UP, 'DAY 1[0-9]')) OR (_FIRST_ADT <> 1 AND _VISIT2 = 'Illness Visit Day 1' AND _VISIT2 <> _VISIT_PREV)
      then:
        case:
        - when: ((_SCHEILL_DAY1 IS NULL) AND str_contains(_VISIT2_UP, 'ILLNESS')) AND _SORT2_RN = 1
          then: 0
        - when: ((_SCHEILL_DAY1 IS NULL) AND str_contains(_VISIT2_UP, 'ILLNESS'))
          then: _ILL_SET_PREV
        - when: _SORT2_RN = 1
          then: 1
        - otherwise: _ILL_SET_PREV + 1
    - when: _SORT2_RN = 1
      then: 0
    - otherwise: _ILL_SET_PREV
- name: _ILL_DAT
  derivation:
    case:
    - when: ((_FIRST_ADT = 1 AND str_contains(_VISIT2_UP, 'ILLNESS') AND str_contains(_VISIT2_UP, 'DAY 1') AND NOT str_contains(_VISIT2_UP, 'DAY 1[0-9]')) OR (_FIRST_ADT <> 1 AND _VISIT2 = 'Illness Visit Day 1' AND _VISIT2 <> _VISIT_PREV)) AND NOT (((_SCHEILL_DAY1 IS NULL) AND str_contains(_VISIT2_UP, 'ILLNESS')))
      then: ADT
    - when: ((_FIRST_ADT = 1 AND str_contains(_VISIT2_UP, 'ILLNESS') AND str_contains(_VISIT2_UP, 'DAY 1') AND NOT str_contains(_VISIT2_UP, 'DAY 1[0-9]')) OR (_FIRST_ADT <> 1 AND _VISIT2 = 'Illness Visit Day 1' AND _VISIT2 <> _VISIT_PREV)) AND (((_SCHEILL_DAY1 IS NULL) AND str_contains(_VISIT2_UP, 'ILLNESS')))
      then:
    - otherwise: _ILL_DAT_PREV
- name: _ILL_ADY
  derivation:
    case:
    - when: ((_FIRST_ADT = 1 AND str_contains(_VISIT2_UP, 'ILLNESS') AND str_contains(_VISIT2_UP, 'DAY 1') AND NOT str_contains(_VISIT2_UP, 'DAY 1[0-9]')) OR (_FIRST_ADT <> 1 AND _VISIT2 = 'Illness Visit Day 1' AND _VISIT2 <> _VISIT_PREV)) AND NOT (((_SCHEILL_DAY1 IS NULL) AND str_contains(_VISIT2_UP, 'ILLNESS')))
      then: ADY
    - when: ((_FIRST_ADT = 1 AND str_contains(_VISIT2_UP, 'ILLNESS') AND str_contains(_VISIT2_UP, 'DAY 1') AND NOT str_contains(_VISIT2_UP, 'DAY 1[0-9]')) OR (_FIRST_ADT <> 1 AND _VISIT2 = 'Illness Visit Day 1' AND _VISIT2 <> _VISIT_PREV)) AND (((_SCHEILL_DAY1 IS NULL) AND str_contains(_VISIT2_UP, 'ILLNESS')))
      then:
    - otherwise: _ILL_ADY_PREV
- name: _BASELINE_SRC
  derivation:
    case:
    - when: _AVALN = 1 AND _PREFL = 'Y' AND NOT str_contains(_VISIT2_UP, 'ILLNESS')
      then: 1
- name: _AVISIT_PRE
  derivation:
    case:
    - when: _BASELINE = 'Y'
      then: '''Baseline'''
    - when: _VISIT2_UP = 'VISIT 1 DAY 1' AND (_VSTPT IS NOT NULL AND str_contains(_VSTPT, 'POST'))
      then: '''Day 1'''
    - when: _VISIT2 = 'Illness Visit Day 1'
      then: '''Illness Visit Day 1'''
    - when: str_contains(_VISIT2_UP, 'ILLNESS') AND NOT str_contains(_VISIT2, 'Uns')
      then:
        str_template:
          template: 'Illness Visit Day {_V_SCAN4}'
          missing: ''
    - when: (str_contains(_VISIT2_UP, 'ILLNESS') OR str_contains(_VISIT2, 'Uns')) AND _D_ILL >= 2 AND _D_ILL <= 34 AND ADT IS NOT NULL
      then: '''Illness Visit Day 28'''
    - when: ADT IS NOT NULL AND _ILL_DAT IS NOT NULL AND ADT = _ILL_DAT AND str_contains(_ORI_VISIT, 'Illness')
      then:
        str_template:
          template: 'Illness Visit Day {_V_SCAN4}'
          missing: ''
    - when: _POSTFL2 = 'Y' AND (str_contains(_VISIT2, 'Uns') OR str_contains(_VISIT2, 'Safe') OR str_contains(_VISIT2_UP, 'ILLNESS')) AND ADY >= 1 AND ADY <= 15
      then: '''Day 1'''
    - when: _POSTFL2 = 'Y' AND (str_contains(_VISIT2, 'Uns') OR str_contains(_VISIT2, 'Safe') OR str_contains(_VISIT2_UP, 'ILLNESS')) AND ADY > 15 AND ADY <= 43
      then: '''Day 29'''
    - when: _POSTFL2 = 'Y' AND (str_contains(_VISIT2, 'Uns') OR str_contains(_VISIT2, 'Safe') OR str_contains(_VISIT2_UP, 'ILLNESS')) AND ADY > 43 AND ADY <= 88
      then: '''Day 57'''
    - when: _POSTFL2 = 'Y' AND (str_contains(_VISIT2, 'Uns') OR str_contains(_VISIT2, 'Safe') OR str_contains(_VISIT2_UP, 'ILLNESS')) AND ADY > 88 AND ADY <= 164
      then: '''Day 119'''
    - when: _POSTFL2 = 'Y' AND (str_contains(_VISIT2, 'Uns') OR str_contains(_VISIT2, 'Safe') OR str_contains(_VISIT2_UP, 'ILLNESS')) AND ADY > 164 AND ADY <= 301
      then: '''Day 209'''
    - when: _POSTFL2 = 'Y' AND (str_contains(_VISIT2, 'Uns') OR str_contains(_VISIT2, 'Safe') OR str_contains(_VISIT2_UP, 'ILLNESS')) AND ADY > 301 AND ADY <= 576
      then: '''Day 394'''
    - when: _POSTFL2 = 'Y' AND (str_contains(_VISIT2, 'Uns') OR str_contains(_VISIT2, 'Safe') OR str_contains(_VISIT2_UP, 'ILLNESS')) AND ADY > 576 AND ADY <= 773
      then: '''Day 759'''
    - when: ADY IS NOT NULL AND ADY > 1 AND _POSTFL2 = 'Y' AND str_contains(_VISIT2_UP, 'DAY')
      then:
        str_template:
          template: 'Day {_V_SCAN4}'
          missing: ''
    - otherwise: "''"
- name: _AVISIT_P1
  derivation:
    case:
    - when: ADT IS NOT NULL AND _ILL_DAT IS NOT NULL AND ADT = _ILL_DAT AND _SCHEILL_UPDATE IS NOT NULL AND _SCHEILL_UPDATE NOT IN ('')
      then: '''Illness Visit Day 1'''
    - otherwise: _AVISIT_PRE
- name: _SECOND_PASS
  derivation:
    case:
    - when: _AVISIT_P1 = '' AND _POSTFL2 = 'Y' AND (str_contains(_VISIT2, 'Uns') OR _VISIT2 IS NULL OR _VISIT2 IN ('') OR str_contains(_VISIT2, 'Safe')) AND ADY >= 1 AND ADY <= 15
      then: '''Day 1'''
    - when: _AVISIT_P1 = '' AND _POSTFL2 = 'Y' AND (str_contains(_VISIT2, 'Uns') OR _VISIT2 IS NULL OR _VISIT2 IN ('') OR str_contains(_VISIT2, 'Safe')) AND ADY > 15 AND ADY <= 43
      then: '''Day 29'''
    - when: _AVISIT_P1 = '' AND _POSTFL2 = 'Y' AND (str_contains(_VISIT2, 'Uns') OR _VISIT2 IS NULL OR _VISIT2 IN ('') OR str_contains(_VISIT2, 'Safe')) AND ADY > 43 AND ADY <= 88
      then: '''Day 57'''
    - when: _AVISIT_P1 = '' AND _POSTFL2 = 'Y' AND (str_contains(_VISIT2, 'Uns') OR _VISIT2 IS NULL OR _VISIT2 IN ('') OR str_contains(_VISIT2, 'Safe')) AND ADY > 88 AND ADY <= 164
      then: '''Day 119'''
    - when: _AVISIT_P1 = '' AND _POSTFL2 = 'Y' AND (str_contains(_VISIT2, 'Uns') OR _VISIT2 IS NULL OR _VISIT2 IN ('') OR str_contains(_VISIT2, 'Safe')) AND ADY > 164 AND ADY <= 301
      then: '''Day 209'''
    - when: _AVISIT_P1 = '' AND _POSTFL2 = 'Y' AND (str_contains(_VISIT2, 'Uns') OR _VISIT2 IS NULL OR _VISIT2 IN ('') OR str_contains(_VISIT2, 'Safe')) AND ADY > 301 AND ADY <= 576
      then: '''Day 394'''
    - when: _AVISIT_P1 = '' AND _POSTFL2 = 'Y' AND (str_contains(_VISIT2, 'Uns') OR _VISIT2 IS NULL OR _VISIT2 IN ('') OR str_contains(_VISIT2, 'Safe')) AND ADY > 576 AND ADY <= 773
      then: '''Day 759'''
- name: _AVISIT_F
  derivation: _AVISIT_P6
- name: _AVISITN_F
  derivation: _AVISITN_P6
- name: _ATPT_F
  derivation: _ATPT_RAW
- name: _SV4_TC
  type: str
  derivation: SV_V29.SVSTDTC
- name: _SV7_TC
  type: str
  derivation: SV_V57.SVSTDTC
- name: _SV4_DATE
  type: str
  derivation:
    str_substr:
      source: _SV4_TC
      start: 1
      length: 10
- name: _SV7_DATE
  type: str
  derivation:
    str_substr:
      source: _SV7_TC
      start: 1
      length: 10
- name: _SV4
  derivation:
    to_date:
      source: _SV4_DATE
- name: _SV7
  derivation:
    to_date:
      source: _SV7_DATE
- name: _SV4_TIME
  type: str
  derivation:
    str_extract:
      source: _SV4_TC
      pattern: 'T([0-9]{2}:[0-9]{2})'
      group: 1
      no_match: ''
- name: _SV7_TIME
  type: str
  derivation:
    str_extract:
      source: _SV7_TC
      pattern: 'T([0-9]{2}:[0-9]{2})'
      group: 1
      no_match: ''
- name: _SV4_DT
  type: str
  derivation:
    case:
    - when: _SV4_TIME IS NOT NULL AND _SV4_TIME NOT IN ('')
      then:
        str_template:
          template: '{_SV4_DATE}T{_SV4_TIME}'
          missing: ''
    - otherwise: _SV4_DATE
- name: _SV7_DT
  type: str
  derivation:
    case:
    - when: _SV7_TIME IS NOT NULL AND _SV7_TIME NOT IN ('')
      then:
        str_template:
          template: '{_SV7_DATE}T{_SV7_TIME}'
          missing: ''
    - otherwise: _SV7_DATE
- name: _SVDTM4_RAW
  type: datetime
  derivation:
    impute:
      type: datetime
      source: _SV4_DT
      time: first
- name: _SVDTM7_RAW
  type: datetime
  derivation:
    impute:
      type: datetime
      source: _SV7_DT
      time: first
- name: _SVDTM4
  type: datetime
  derivation:
    case:
    - when: _SV4_TIME IS NULL OR _SV4_TIME IN ('')
      then:
    - otherwise: _SVDTM4_RAW
- name: _SVDTM7
  type: datetime
  derivation:
    case:
    - when: _SV7_TIME IS NULL OR _SV7_TIME IN ('')
      then:
    - otherwise: _SVDTM7_RAW
- name: _EOS_DT
  type: date
  derivation: ADSL.EOSDT
- name: _DTH_DT
  type: date
  derivation: ADSL.DTHDT
- name: _MAX7
  type: date
  derivation:
    case:
    - when: _SV7 IS NOT NULL AND (_EOS_DT IS NULL OR _SV7 >= _EOS_DT) AND (_DTH_DT IS NULL OR _SV7 >= _DTH_DT)
      then: _SV7
    - when: _EOS_DT IS NOT NULL AND (_DTH_DT IS NULL OR _EOS_DT >= _DTH_DT)
      then: _EOS_DT
    - otherwise: _DTH_DT
- name: _ASTAGE
  derivation:
    case:
    - when: DOSE1FL = 'Y' AND _POSTFL2 = 'Y' AND ADT IS NOT NULL AND DOSE2FL = 'Y' AND _SV7 IS NULL AND _EOS_DT IS NULL AND _DTH_DT IS NULL
      then: '''Vaccination stage'''
    - when: DOSE1FL = 'Y' AND _POSTFL2 = 'Y' AND ADT IS NOT NULL AND DOSE2FL = 'Y' AND _MAX7 IS NOT NULL AND ADT <= _MAX7 AND ADT >= DOSE2DT
      then: '''Vaccination stage'''
    - when: DOSE1FL = 'Y' AND _POSTFL2 = 'Y' AND ADT IS NOT NULL AND DOSE2FL = 'Y' AND ADT <= DOSE2DT AND _SV4_TC IS NOT NULL AND _SV4_TC NOT IN ('') AND _SV7 IS NULL
      then: '''Vaccination stage'''
    - when: DOSE1FL = 'Y' AND _POSTFL2 = 'Y' AND ADT IS NOT NULL AND DOSE2FL = 'Y' AND ADT >= TR01SDT AND (ADT <= _SV7 OR _ADTM <= _SVDTM7)
      then: '''Vaccination stage'''
    - when: DOSE1FL = 'Y' AND _POSTFL2 = 'Y' AND ADT IS NOT NULL AND DOSE2FL = 'Y' AND ADT > _SV7
      then: '''Follow-Up Analysis Period'''
    - when: DOSE1FL = 'Y' AND _POSTFL2 = 'Y' AND ADT IS NOT NULL AND NOT (DOSE2FL = 'Y') AND _SV4 IS NULL AND _EOS_DT IS NULL AND _DTH_DT IS NULL
      then: '''Vaccination stage'''
    - when: DOSE1FL = 'Y' AND _POSTFL2 = 'Y' AND ADT IS NOT NULL AND NOT (DOSE2FL = 'Y') AND ADT > _SV4
      then: '''Follow-Up Analysis Period'''
    - when: DOSE1FL = 'Y' AND _POSTFL2 = 'Y' AND ADT IS NOT NULL AND NOT (DOSE2FL = 'Y') AND ADT >= TR01SDT AND (ADT <= _SV4 OR _ADTM <= _SVDTM4)
      then: '''Vaccination stage'''
    - when: DOSE1FL = 'Y' AND _POSTFL2 = 'Y' AND ADT IS NOT NULL AND NOT (DOSE2FL = 'Y') AND _ADTM >= TR01SDTM AND _SV4 IS NULL AND _SV7 IS NULL AND ADT <= _EOS_DT
      then: '''Vaccination stage'''
    - otherwise: "''"
- name: _MDOSREF
  derivation:
    case:
    - when: (TR01SDT IS NOT NULL) AND (_ASTAGE IS NOT NULL AND _ASTAGE NOT IN ('')) AND (((TR01SDTM IS NOT NULL AND _ORI_ADTM IS NOT NULL AND TR01SDTM <= _ORI_ADTM) AND (_ORI_ADTM IS NOT NULL AND DOS2DTM IS NOT NULL AND _ORI_ADTM < DOS2DTM)) OR ((DOSE2DT IS NULL) AND (TR01SDTM IS NOT NULL AND _ORI_ADTM IS NOT NULL AND TR01SDTM <= _ORI_ADTM)) OR ((TR01SDTM IS NOT NULL AND _ORI_ADTM IS NOT NULL AND TR01SDTM <= _ORI_ADTM) AND (ADT IS NOT NULL AND DOSE2DT IS NOT NULL AND ADT < DOSE2DT)) OR ((((TR01SDTM IS NULL) OR (_ORI_ADTM IS NULL)) AND (DOSE2DT IS NULL) AND (TR01SDT IS NOT NULL AND ADT IS NOT NULL AND TR01SDT <= ADT))) OR ((((TR01SDTM IS NULL) OR (_ORI_ADTM IS NULL)) AND (TR01SDT IS NOT NULL AND ADT IS NOT NULL AND TR01SDT <= ADT) AND (ADT IS NOT NULL AND DOSE2DT IS NOT NULL AND ADT < DOSE2DT))))
      then: '''Vaccination 1'''
    - when: (TR01SDT IS NOT NULL) AND (_ASTAGE IS NOT NULL AND _ASTAGE NOT IN ('')) AND (((DOS2DTM IS NOT NULL AND _ORI_ADTM IS NOT NULL AND DOS2DTM <= _ORI_ADTM)) OR ((((_ORI_ADTM IS NULL) OR (DOS2DTM IS NULL)) AND (DOSE2DT IS NOT NULL AND ADT IS NOT NULL AND DOSE2DT <= ADT))))
      then: '''Vaccination 2'''
    - otherwise: "''"
- name: _MRDDY
  derivation:
    case:
    - when: (TR01SDT IS NOT NULL) AND (_ASTAGE IS NOT NULL AND _ASTAGE NOT IN ('')) AND (((TR01SDTM IS NOT NULL AND _ORI_ADTM IS NOT NULL AND TR01SDTM <= _ORI_ADTM) AND (_ORI_ADTM IS NOT NULL AND DOS2DTM IS NOT NULL AND _ORI_ADTM < DOS2DTM)) OR ((DOSE2DT IS NULL) AND (TR01SDTM IS NOT NULL AND _ORI_ADTM IS NOT NULL AND TR01SDTM <= _ORI_ADTM)) OR ((TR01SDTM IS NOT NULL AND _ORI_ADTM IS NOT NULL AND TR01SDTM <= _ORI_ADTM) AND (ADT IS NOT NULL AND DOSE2DT IS NOT NULL AND ADT < DOSE2DT)) OR ((((TR01SDTM IS NULL) OR (_ORI_ADTM IS NULL)) AND (DOSE2DT IS NULL) AND (TR01SDT IS NOT NULL AND ADT IS NOT NULL AND TR01SDT <= ADT))) OR ((((TR01SDTM IS NULL) OR (_ORI_ADTM IS NULL)) AND (TR01SDT IS NOT NULL AND ADT IS NOT NULL AND TR01SDT <= ADT) AND (ADT IS NOT NULL AND DOSE2DT IS NOT NULL AND ADT < DOSE2DT))))
      then: _RDDY1 + 1
    - when: (TR01SDT IS NOT NULL) AND (_ASTAGE IS NOT NULL AND _ASTAGE NOT IN ('')) AND (((DOS2DTM IS NOT NULL AND _ORI_ADTM IS NOT NULL AND DOS2DTM <= _ORI_ADTM)) OR ((((_ORI_ADTM IS NULL) OR (DOS2DTM IS NULL)) AND (DOSE2DT IS NOT NULL AND ADT IS NOT NULL AND DOSE2DT <= ADT))))
      then: _RDDY2 + 1
- name: _CHG_FMT
  derivation:
    case:
    - when: _CHG_N >= 1 AND _CHG_N < 10
      then:
        str_decimal:
          source: _CHG_N
          decimals: 14
    - when: _CHG_N >= 10 AND _CHG_N < 100
      then:
        str_decimal:
          source: _CHG_N
          decimals: 13
    - when: _CHG_N >= 100 AND _CHG_N < 1000
      then:
        str_decimal:
          source: _CHG_N
          decimals: 12
    - when: _CHG_N >= 1000 AND _CHG_N < 10000
      then:
        str_decimal:
