      type: date
      source: _END_ISO
      day: last
      invalid: null
- name: _AENDT_DATE
  type: date
  derivation:
    case:
    - when: _END_IS_Y = 1
      then:
        least:
          sources: [_END_DEC31, ADSL.EOSDT, ADSL.DTHDT]
    - when: _END_IS_YM = 1
      then:
        least:
          sources: [_END_LASTDAY, ADSL.EOSDT, ADSL.DTHDT]
    - when: _END_IS_ISO = 1
      then: _END_FIRST
- name: _ASTDT_ISO
  type: str
  derivation: _ASTDT_DATE
- name: _AENDT_ISO
  type: str
  derivation: _AENDT_DATE
- name: _AST_DY
