# ADCM for Moderna mRNA-1273-P301, cut S80 (First Interim Analysis
# IA1a, cutoff 2020-11-11). Parent: ../../../spec/yamaa/base/adam-base-ia.yaml (which
# chains to ../../../spec/yamaa/base/adam-base.yaml; 86 shared + 6 IA-only ADSL
# columns). Derivations implement the S80 ADCM program (Bates
# 5653977-5653981, %let dsetname = adcm; byte-identical to the S5
# ADCM program). One row template drives on SDTM CM, inner-joined
# to the verified ADSL on (STUDYID, USUBJID), no row filter:
# 150,445 CM rows -> 150,445 submitted rows (0 drops). The S80
# program reads NO S27 file and NO FACE/FAAE/DS/HO/EX. Honest gaps:
# 25 cells on '(b)(6)'-redacted dates (ASTDTF 16, AENDTF 3,
# ONTRTFL 3, FUPFL 3) -- the originals are not guessed; the
# program-faithful values are emitted (see the generator header).
# See the generator header for the full design notes.
yamaa: '1.0'
type: spec
model: ADaM
parent: ../../../spec/yamaa/base/adam-base-ia.yaml
domain: ADCM
keys:
- STUDYID
- USUBJID
- CMSEQ
input:
  CM: <sdtm-dir>/cm.parquet
  SUPPCM: <sdtm-dir>/suppcm.parquet
  ADSL:
    path: <adam-dir>/adsl.parquet
    key:
    - STUDYID
    - USUBJID
submission:
  label: Concomitant Medication Analysis Dataset
  class: OCCURRENCE DATA STRUCTURE
  structure: One record per subject per medication
  repeating: true
rows:
- id: cm_rows
  dataset: CM
  derivations:
    STUDYID: CM.STUDYID
    USUBJID: CM.USUBJID
    _CMSEQ: CM.CMSEQ
  filter: _ADSL IS NOT NULL
intermediates:
- id: SUPP_CM
  dataset: SUPPCM
  key:
    STUDYID: STUDYID
    USUBJID: USUBJID
    IDVARVAL:
      str_decimal:
        source: _CMSEQ
        decimals: 0
  filter: SUPPCM.QNAM IN ('CMDECOD1', 'CMDECOD2', 'CMDECOD3', 'CMUOTHSP', 'CMFOTHSP', 'CMROTHSP', 'CMSOL', 'CMPLX', 'ATCLEV1T', 'ATCLEV3T', 'ATCLEV4T') AND SUPPCM.IDVAR = 'CMSEQ'
  pivot:
    name: QNAM
    value: QVAL
    fields:
    - CMDECOD1
    - CMDECOD2
    - CMDECOD3
    - CMUOTHSP
    - CMFOTHSP
    - CMROTHSP
    - CMSOL
    - CMPLX
    - ATCLEV1T
    - ATCLEV3T
    - ATCLEV4T
columns:
- name: _ADSL
  type: str
  derivation: ADSL.USUBJID
- name: STUDYID
  submission:
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: USUBJID
  submission:
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: _CMSEQ
  type: float
- name: _TR01_TXT
  type: str
  derivation: ADSL.TR01SDT
- name: _TR01_YR
  type: str
  derivation:
    str_substr:
      source: _TR01_TXT
      start: 1
      length: 4
- name: _TR01_YM
  type: str
  derivation:
    str_substr:
      source: _TR01_TXT
      start: 1
      length: 7
- name: _TR01_Y1
  type: date
  derivation:
    impute:
      type: date
      source: _TR01_YR
      month: 1
      day: first
      invalid: null
- name: _TR01_M1
  type: date
  derivation:
    impute:
      type: date
      source: _TR01_YM
      day: first
      invalid: null
- name: _STD_MO
  type: str
  derivation:
    str_extract:
      source: CM.CMSTDTC
      pattern: '^(\d{1,2})/'
      group: 1
      no_match: ''
- name: _STD_DY
  type: str
  derivation:
    str_extract:
      source: CM.CMSTDTC
      pattern: '/(\d{1,2})/'
      group: 1
      no_match: ''
- name: _STD_YR
  type: str
  derivation:
    str_extract:
      source: CM.CMSTDTC
      pattern: '/(\d{4})$'
      group: 1
      no_match: ''
- name: _STD_MO2
  type: str
  derivation:
    case:
    - when: _STD_MO = '1'
      then: '''01'''
    - when: _STD_MO = '2'
      then: '''02'''
    - when: _STD_MO = '3'
      then: '''03'''
    - when: _STD_MO = '4'
      then: '''04'''
    - when: _STD_MO = '5'
      then: '''05'''
    - when: _STD_MO = '6'
      then: '''06'''
    - when: _STD_MO = '7'
      then: '''07'''
    - when: _STD_MO = '8'
      then: '''08'''
    - when: _STD_MO = '9'
      then: '''09'''
    - otherwise: _STD_MO
- name: _STD_DY2
  type: str
  derivation:
    case:
    - when: _STD_DY = '1'
      then: '''01'''
    - when: _STD_DY = '2'
      then: '''02'''
    - when: _STD_DY = '3'
      then: '''03'''
    - when: _STD_DY = '4'
      then: '''04'''
    - when: _STD_DY = '5'
      then: '''05'''
    - when: _STD_DY = '6'
      then: '''06'''
    - when: _STD_DY = '7'
      then: '''07'''
    - when: _STD_DY = '8'
      then: '''08'''
    - when: _STD_DY = '9'
      then: '''09'''
    - otherwise: _STD_DY
- name: _STD_ISO
  type: str
  derivation:
    case:
    - when: CM.CMSTDTC IS NOT NULL AND str_contains(CM.CMSTDTC, '^[0-9]{1,2}/[0-9]{1,2}/[0-9]{4}$')
      then:
        str_template:
          template: '{_STD_YR}-{_STD_MO2}-{_STD_DY2}'
          missing: ''
    - otherwise: CM.CMSTDTC
- name: _STD_IS_Y
  type: int
  derivation:
    case:
    - when: _STD_ISO IS NOT NULL AND str_contains(_STD_ISO, '^[0-9]{4}$')
      then: 1
    - otherwise: 0
- name: _STD_IS_YM
  type: int
  derivation:
    case:
    - when: _STD_ISO IS NOT NULL AND str_contains(_STD_ISO, '^[0-9]{4}-[0-9]{2}$')
      then: 1
    - otherwise: 0
- name: _STD_IS_ISO
  type: int
  derivation:
    case:
    - when: _STD_ISO IS NOT NULL AND str_contains(_STD_ISO, '^[0-9]{4}-[0-9]{2}-[0-9]{2}$')
      then: 1
    - otherwise: 0
- name: _STD_FIRST
  type: date
  derivation:
    impute:
      type: date
      source: _STD_ISO
      month: 1
      day: first
      invalid: null
- name: _END_MO
  type: str
  derivation:
    str_extract:
      source: CM.CMENDTC
      pattern: '^(\d{1,2})/'
      group: 1
      no_match: ''
- name: _END_DY
