    case:
    - when: ADSL.TR01SDT IS NOT NULL AND _ASTDT_DATE IS NOT NULL AND ADSL.TR01SDT <= _ASTDT_DATE AND (ADSL.DOSE2DT IS NULL OR _ASTDT_DATE < ADSL.DOSE2DT)
      then: '''Vaccination 1'''
    - when: ADSL.DOSE2DT IS NOT NULL AND _ASTDT_DATE IS NOT NULL AND ADSL.DOSE2DT <= _ASTDT_DATE
      then: '''Vaccination 2'''
