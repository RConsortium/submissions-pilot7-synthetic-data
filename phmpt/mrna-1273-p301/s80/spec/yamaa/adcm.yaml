- name: _END_MO2
  type: str
  derivation:
    case:
    - when: _END_MO = '1'
      then: '''01'''
    - when: _END_MO = '2'
      then: '''02'''
    - when: _END_MO = '3'
      then: '''03'''
    - when: _END_MO = '4'
      then: '''04'''
    - when: _END_MO = '5'
      then: '''05'''
    - when: _END_MO = '6'
      then: '''06'''
    - when: _END_MO = '7'
      then: '''07'''
    - when: _END_MO = '8'
      then: '''08'''
    - when: _END_MO = '9'
      then: '''09'''
    - otherwise: _END_MO
- name: _END_DY2
  type: str
  derivation:
    case:
    - when: _END_DY = '1'
      then: '''01'''
    - when: _END_DY = '2'
      then: '''02'''
    - when: _END_DY = '3'
      then: '''03'''
    - when: _END_DY = '4'
      then: '''04'''
    - when: _END_DY = '5'
      then: '''05'''
    - when: _END_DY = '6'
      then: '''06'''
    - when: _END_DY = '7'
      then: '''07'''
    - when: _END_DY = '8'
      then: '''08'''
    - when: _END_DY = '9'
      then: '''09'''
    - otherwise: _END_DY
- name: _END_ISO
  type: str
  derivation:
    case:
    - when: CM.CMENDTC IS NOT NULL AND str_contains(CM.CMENDTC, '^[0-9]{1,2}/[0-9]{1,2}/[0-9]{4}$')
      then:
        str_template:
          template: '{_END_YR}-{_END_MO2}-{_END_DY2}'
          missing: ''
    - otherwise: CM.CMENDTC
- name: _END_IS_Y
  type: int
  derivation:
    case:
    - when: _END_ISO IS NOT NULL AND str_contains(_END_ISO, '^[0-9]{4}$')
      then: 1
    - otherwise: 0
- name: _END_IS_YM
  type: int
  derivation:
    case:
    - when: _END_ISO IS NOT NULL AND str_contains(_END_ISO, '^[0-9]{4}-[0-9]{2}$')
      then: 1
    - otherwise: 0
- name: _END_IS_ISO
  type: int
  derivation:
    case:
    - when: _END_ISO IS NOT NULL AND str_contains(_END_ISO, '^[0-9]{4}-[0-9]{2}-[0-9]{2}$')
      then: 1
    - otherwise: 0
- name: _END_FIRST
  type: date
  derivation:
    impute:
      type: date
      source: _END_ISO
      month: 1
      day: first
      invalid: null
- name: _ASTDT_DATE
  type: date
  derivation:
    case:
    - when: _STD_IS_Y = 1 AND _STD_FIRST = _TR01_Y1 AND (_END_FIRST > ADSL.TR01SDT OR _END_ISO IS NULL)
      then: ADSL.TR01SDT
    - when: _STD_IS_Y = 1 AND _STD_FIRST = _TR01_Y1 AND _END_IS_YM = 1 AND (_END_FIRST >= _TR01_M1 OR _END_ISO IS NULL)
      then: ADSL.TR01SDT
    - when: _STD_IS_Y = 1 AND _STD_FIRST = _TR01_Y1 AND _END_IS_Y = 1 AND (_END_FIRST >= _TR01_Y1 OR _END_ISO IS NULL)
      then: ADSL.TR01SDT
    - when: _STD_IS_Y = 1
      then: _STD_FIRST
    - when: _STD_IS_YM = 1 AND _STD_FIRST = _TR01_M1 AND (_END_FIRST > ADSL.TR01SDT OR _END_ISO IS NULL)
      then: ADSL.TR01SDT
    - when: _STD_IS_YM = 1 AND _STD_FIRST = _TR01_M1 AND _END_IS_YM = 1 AND (_END_FIRST >= _TR01_M1 OR _END_ISO IS NULL)
      then: ADSL.TR01SDT
    - when: _STD_IS_YM = 1 AND _STD_FIRST = _TR01_M1 AND _END_IS_Y = 1 AND (_END_FIRST >= _TR01_Y1 OR _END_ISO IS NULL)
      then: ADSL.TR01SDT
    - when: _STD_IS_YM = 1
      then: _STD_FIRST
    - when: _STD_IS_ISO = 1
      then: _STD_FIRST
- name: _END_DEC31
  type: date
  derivation:
    impute:
      type: date
      source: _END_ISO
      month: 12
      day: last
      invalid: null
- name: _END_LASTDAY
  type: date
  derivation:
