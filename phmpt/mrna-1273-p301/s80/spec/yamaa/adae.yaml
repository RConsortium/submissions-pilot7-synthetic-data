- name: TRTA
  type: str
  label: 'Actual Treatment'
  derivation:
    case:
    - when: MDOSREF = 'Vaccination 1' AND _EXTRT1_UP = 'PLACEBO'
      then: '''Placebo'''
    - when: MDOSREF = 'Vaccination 1' AND _EXTRT1_UP IS NOT NULL AND str_contains(_EXTRT1_UP, 'MRNA') AND EX_DOSE1.EXDOSE IS NOT NULL AND EX_DOSE1.EXDOSE > 0
      then: '''mRNA-1273'''
    - when: MDOSREF = 'Vaccination 2' AND _EXTRT2_UP = 'PLACEBO'
      then: '''Placebo'''
    - when: MDOSREF = 'Vaccination 2' AND _EXTRT2_UP IS NOT NULL AND str_contains(_EXTRT2_UP, 'MRNA') AND EX_DOSE2.EXDOSE IS NOT NULL AND EX_DOSE2.EXDOSE > 0
      then: '''mRNA-1273'''
  submission:
