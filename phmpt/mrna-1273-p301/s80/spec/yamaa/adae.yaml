  derivation:
    case:
    - when: NOT ((AENDTM IS NOT NULL AND ADSL.TR01SDTM IS NOT NULL AND AENDTM < ADSL.TR01SDTM) OR (AENDT IS NOT NULL AND ADSL.TR01SDT IS NOT NULL AND AENDT < ADSL.TR01SDT)) AND ((ADSL.TR01SDTM IS NOT NULL AND ASTDTM IS NOT NULL AND ADSL.TR01SDTM <= ASTDTM) OR (ASTDT IS NULL AND AENDT IS NULL) OR (ASTDT IS NULL AND ADSL.TR01SDTM IS NOT NULL AND AENDTM IS NOT NULL AND ADSL.TR01SDTM <= AENDTM))
      then: '''Y'''
    - when: NOT ((AENDTM IS NOT NULL AND ADSL.TR01SDTM IS NOT NULL AND AENDTM < ADSL.TR01SDTM) OR (AENDT IS NOT NULL AND ADSL.TR01SDT IS NOT NULL AND AENDT < ADSL.TR01SDT)) AND (ASTDT IS NULL AND ADSL.TR01SDT IS NOT NULL AND AENDT IS NOT NULL AND ADSL.TR01SDT < AENDT AND AENDTM IS NULL)
      then: '''Y'''
    - when: NOT ((AENDTM IS NOT NULL AND ADSL.TR01SDTM IS NOT NULL AND AENDTM < ADSL.TR01SDTM) OR (AENDT IS NOT NULL AND ADSL.TR01SDT IS NOT NULL AND AENDT < ADSL.TR01SDT)) AND ((ADSL.TR01SDTM IS NULL OR ASTDTM IS NULL) AND ADSL.TR01SDT IS NOT NULL AND ASTDT IS NOT NULL AND ADSL.TR01SDT <= ASTDT)
      then: '''Y'''
  submission:
    core: Req
    mandatory: false
    length: 1
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
