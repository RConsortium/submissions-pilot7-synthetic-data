# ADAE for Moderna mRNA-1273-P301, cut S80 (First Interim Analysis
# IA1a, cutoff 2020-11-11). Parent: ../../../spec/yamaa/base/adam-base-ia.yaml (which
# chains to ../../../spec/yamaa/base/adam-base.yaml; 86 shared + 6 IA-only ADSL
# columns). Derivations implement the S80 A20ADAE program (Bates
# 5653940-5653948). One row template drives on SDTM AE, inner-joined
# to the verified ADSL on (USUBJID, SUBJID), filtered to AETERM
# present and REMOVEFL <> 'Y' (SUPPAE pivot): 14,479 AE rows ->
# 13,359 submitted rows (1,081 REMOVEFL='Y' + 29 empty AETERM +
# 10 non-ADSL subjects). IA ADAE reads NO FACE/FAAE and NO S27 file.
# Honest gaps: RACESPY, 391 rows (the RACEOTH tail is redacted to
# '(b)(6)' in SDTM and survives only in the submitted ADAE -- the
# originals are not guessed; the NUL carries through end-to-end,
# 0 MULTIPLE-without-RACE6 mismatches); AETERM, 3 space-only NBSP
# cells (the faithful CLN step leaves two spaces where the submitted
# value has one); ASTTM/AENTM, 3,052 cells value-correct as times
# of day (0 time-of-day mismatches) but reported as mismatches
# because the target stores them as timedelta64 while yamaa's time
# type yields datetime.time -- a representation gap, not a spec
# error (see the generator header). TRTEMFL, 160 rows where the
# program sets SAS ' ' and the submitted file carries '' (emitted
# as missing, equal under the configured comparison). AEDISFL is
# all blank (the rule never fires on 3 DS EOS rows / 7 SUPPDS rows
# for different subjects).
# See the generator header for the full design notes.
yamaa: '1.0'
type: spec
model: ADaM
parent: ../../../spec/yamaa/base/adam-base-ia.yaml
domain: ADAE
keys:
- STUDYID
- USUBJID
- AESEQ
input:
  AE: <sdtm-dir>/ae.parquet
  SUPPAE: <sdtm-dir>/suppae.parquet
  HO: <sdtm-dir>/ho.parquet
  SUPPHO: <sdtm-dir>/suppho.parquet
  DS: <sdtm-dir>/ds.parquet
  SUPPDS: <sdtm-dir>/suppds.parquet
  EX: <sdtm-dir>/ex.parquet
  SUPPDM: <sdtm-dir>/suppdm.parquet
  ADSL:
    path: <adam-dir>/adsl.parquet
    key:
    - STUDYID
    - USUBJID
submission:
  label: Adverse Event Analysis Dataset
  class: OCCURRENCE DATA STRUCTURE
  structure: One record per subject per adverse event
  repeating: true
rows:
- id: ae_rows
  dataset: AE
  derivations:
    STUDYID: AE.STUDYID
    USUBJID: AE.USUBJID
    _AESEQ: AE.AESEQ
    _AESOFL: SUPP_AE.AESOFL
    _MAAEFL: SUPP_AE.MAAEFL
    _AECVDIAG: SUPP_AE.AECVDIAG
    _AEHOSPST: SUPP_AE.AEHOSPST
    _AEHOSPEN: SUPP_AE.AEHOSPEN
    _AEOUTSP: SUPP_AE.AEOUTSP
    _REMOVEFL: SUPP_AE.REMOVEFL
    _HOSPIDX: SUPP_AE.HOSPIDX
    _AEGRPID: AE.AEGRPID
  filter: _ADSL IS NOT NULL AND AE.AETERM IS NOT NULL AND AE.AETERM NOT IN ('') AND (_REMOVEFL IS NULL OR _REMOVEFL NOT IN ('Y'))
intermediates:
- id: SUPP_AE
  dataset: SUPPAE
  key:
    STUDYID: STUDYID
    USUBJID: USUBJID
    IDVARVAL:
      str_decimal:
        source: _AESEQ
        decimals: 0
  filter: SUPPAE.QNAM IN ('AESOFL', 'MAAEFL', 'AECVDIAG', 'AEHOSPST', 'AEHOSPEN', 'AEOUTSP', 'REMOVEFL', 'HOSPIDX') AND SUPPAE.IDVAR = 'AESEQ'
  pivot:
    name: QNAM
    value: QVAL
    fields:
    - AESOFL
    - MAAEFL
    - AECVDIAG
    - AEHOSPST
    - AEHOSPEN
    - AEOUTSP
    - REMOVEFL
    - HOSPIDX
- id: SUPP_HO
  dataset: SUPPHO
  key:
    STUDYID: HO.STUDYID
    USUBJID: HO.USUBJID
    IDVARVAL:
      str_decimal:
        source: HO.HOSEQ
        decimals: 0
  filter: SUPPHO.QNAM = 'HOSPIDX' AND SUPPHO.IDVAR = 'HOSEQ'
  pivot:
    name: QNAM
    value: QVAL
    fields:
    - HOSPIDX
- id: HO_ICU
  dataset: HO
  key:
    STUDYID: STUDYID
    USUBJID: USUBJID
    SUBJID: SUBJID
    HOSPIDX: _HOSPIDX
  filter: HO.HODECOD = 'ICU' AND HO.HOOCCUR = 'Y'
  order_by:
  - variable: HO.HODUR
    direction: desc
  - variable: HO.HOOCCUR
    direction: desc
  - variable: HO.HODECOD
    direction: desc
  keep: first
  derivations:
    HOSPIDX: SUPP_HO.HOSPIDX
- id: SUPP_DS
  dataset: SUPPDS
  key:
    STUDYID: DS.STUDYID
    USUBJID: DS.USUBJID
    IDVARVAL:
      str_decimal:
        source: DS.DSSEQ
        decimals: 0
  filter: SUPPDS.QNAM = 'AESPIDX' AND SUPPDS.IDVAR = 'DSSEQ'
  pivot:
    name: QNAM
    value: QVAL
    fields:
    - AESPIDX
- id: DS_EOS
  dataset: DS
  key:
  - STUDYID
  - USUBJID
  - SUBJID
  filter: DS.DSDECOD IN ('SAE', 'AE', 'ADVERSE EVENT', 'SERIOUS ADVERSE EVENT') AND DS.DSSCAT = 'END OF STUDY'
  derivations:
    AESPIDX: SUPP_DS.AESPIDX
- id: EX_DOSE1
  dataset: EX
  key:
  - STUDYID
  - USUBJID
  filter: EX.VISIT IS NOT NULL AND str_contains(EX.VISIT, '[Dd][Aa][Yy] 1( |$)')
  order_by: [EX.EXSTDTC]
  keep: first
- id: EX_DOSE2
  dataset: EX
  key:
  - STUDYID
  - USUBJID
  filter: EX.VISIT IS NOT NULL AND str_contains(EX.VISIT, '[Dd][Aa][Yy] 29')
  order_by: [EX.EXSTDTC]
  keep: first
- id: SUPP_DM
  dataset: SUPPDM
  key:
  - STUDYID
  - USUBJID
  filter: SUPPDM.QNAM IN ('RACE1', 'RACE2', 'RACE3', 'RACE4', 'RACE5', 'RACE6', 'RACEOTH')
  pivot:
    name: QNAM
    value: QVAL
    fields:
    - RACE1
    - RACE2
    - RACE3
    - RACE4
    - RACE5
    - RACE6
    - RACEOTH
windows:
  ADURN_W:
    group_by: [USUBJID, SUBJID, MDOSREF, _FLAGFL, AEDECOD]
    order_by:
    - ADURSDT
    - ADUREDT
columns:
- name: _ADSL
  type: str
  derivation: ADSL.USUBJID
- name: STUDYID
  submission:
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: USUBJID
  submission:
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: _AESEQ
  type: float
- name: _AESOFL
  type: str
- name: _MAAEFL
  type: str
- name: _AECVDIAG
  type: str
- name: _AEHOSPST
  type: str
- name: _AEHOSPEN
  type: str
- name: _AEOUTSP
  type: str
- name: _REMOVEFL
  type: str
- name: _HOSPIDX
  type: str
- name: _AEGRPID
  type: str
- name: _AST_TIME
  type: str
  derivation:
    str_extract:
      source: AE.AESTDTC
      pattern: 'T([0-9]{2}:[0-9]{2})'
      group: 1
      no_match: ''
- name: _AST_DATE
  type: str
  derivation:
    str_substr:
      source: AE.AESTDTC
      start: 1
      length: 10
- name: _ASTDT_TXT
  type: str
  derivation:
    case:
    - when: _AST_TIME IS NOT NULL AND _AST_TIME NOT IN ('')
      then:
        str_template:
          template: '{_AST_DATE}T{_AST_TIME}'
          missing: ''
    - otherwise: _AST_DATE
- name: _AEN_TIME
  type: str
  derivation:
    str_extract:
      source: AE.AEENDTC
      pattern: 'T([0-9]{2}:[0-9]{2})'
      group: 1
      no_match: ''
- name: _AEN_DATE
  type: str
  derivation:
    str_substr:
      source: AE.AEENDTC
      start: 1
      length: 10
- name: _AENDT_TXT
  type: str
  derivation:
    case:
    - when: _AEN_TIME IS NOT NULL AND _AEN_TIME NOT IN ('')
      then:
        str_template:
          template: '{_AEN_DATE}T{_AEN_TIME}'
          missing: ''
    - otherwise: _AEN_DATE
- name: _TR01EDT_P27
  type: date
  derivation:
    shift:
      type: date
      source: ADSL.TR01EDT
      days: 27
- name: _END_OK
  type: int
  derivation:
    case:
    - when: (AENDT IS NULL OR (ADSL.TR01SDTM IS NOT NULL AND AENDTM IS NOT NULL AND ADSL.TR01SDTM <= AENDTM) OR (ADSL.TR01SDT IS NOT NULL AND AENDT IS NOT NULL AND ADSL.TR01SDT < AENDT) OR (AENDTM IS NULL AND ADSL.TR01SDT IS NOT NULL AND AENDT IS NOT NULL AND ADSL.TR01SDT = AENDT))
      then: 1
    - otherwise: 0
- name: _S_D1
  type: float
  derivation:
    diff:
      type: datetime
      start: ADSL.TR01SDTM
      end: ASTDTM
      unit: day
- name: _S_D2
  type: float
  derivation:
    diff:
      type: datetime
      start: ADSL.DOS2DTM
      end: ASTDTM
      unit: day
- name: _S_DT1
  type: int
  derivation:
    diff:
      type: date
      start: ADSL.TR01SDT
      end: ASTDT
      unit: day
- name: _S_DT2
  type: int
  derivation:
    diff:
      type: date
      start: ADSL.DOSE2DT
      end: ASTDT
      unit: day
- name: _E_D1
  type: float
  derivation:
    diff:
      type: datetime
      start: ADSL.TR01SDTM
      end: AENDTM
      unit: day
- name: _E_D2
  type: float
  derivation:
    diff:
      type: datetime
      start: ADSL.DOS2DTM
      end: AENDTM
      unit: day
- name: _E_DT1
  type: int
  derivation:
    diff:
      type: date
      start: ADSL.TR01SDT
      end: AENDT
      unit: day
- name: _E_DT2
  type: int
  derivation:
    diff:
      type: date
      start: ADSL.DOSE2DT
      end: AENDT
      unit: day
- name: _MDOSREF_RAW
  type: str
  derivation:
    case:
    - when: ADSL.TR01SDTM IS NOT NULL AND ASTDTM IS NOT NULL AND ADSL.TR01SDTM <= ASTDTM AND ((ADSL.DOS2DTM IS NOT NULL AND ASTDTM < ADSL.DOS2DTM) OR ADSL.DOSE2DT IS NULL OR (ASTDT IS NOT NULL AND ADSL.DOSE2DT IS NOT NULL AND ASTDT < ADSL.DOSE2DT))
      then: '''Vaccination 1'''
    - when: (ADSL.TR01SDTM IS NULL OR ASTDTM IS NULL) AND ((ADSL.DOSE2DT IS NULL AND ADSL.TR01SDT IS NOT NULL AND ASTDT IS NOT NULL AND ADSL.TR01SDT <= ASTDT) OR (ADSL.TR01SDT IS NOT NULL AND ASTDT IS NOT NULL AND ADSL.TR01SDT <= ASTDT AND ADSL.DOSE2DT IS NOT NULL AND ASTDT < ADSL.DOSE2DT))
      then: '''Vaccination 1'''
    - when: ADSL.DOS2DTM IS NOT NULL AND ASTDTM IS NOT NULL AND ADSL.DOS2DTM <= ASTDTM
      then: '''Vaccination 2'''
    - when: (ASTDTM IS NULL OR ADSL.DOS2DTM IS NULL) AND ADSL.DOSE2DT IS NOT NULL AND ASTDT IS NOT NULL AND ADSL.DOSE2DT <= ASTDT
      then: '''Vaccination 2'''
- name: _MRDSTDY_RAW
  type: int
  derivation:
    case:
    - when: ADSL.TR01SDTM IS NOT NULL AND ASTDTM IS NOT NULL AND ADSL.TR01SDTM <= ASTDTM AND ((ADSL.DOS2DTM IS NOT NULL AND ASTDTM < ADSL.DOS2DTM) OR ADSL.DOSE2DT IS NULL OR (ASTDT IS NOT NULL AND ADSL.DOSE2DT IS NOT NULL AND ASTDT < ADSL.DOSE2DT))
      then: FLOOR(_S_D1 + 1)
    - when: (ADSL.TR01SDTM IS NULL OR ASTDTM IS NULL) AND ((ADSL.DOSE2DT IS NULL AND ADSL.TR01SDT IS NOT NULL AND ASTDT IS NOT NULL AND ADSL.TR01SDT <= ASTDT) OR (ADSL.TR01SDT IS NOT NULL AND ASTDT IS NOT NULL AND ADSL.TR01SDT <= ASTDT AND ADSL.DOSE2DT IS NOT NULL AND ASTDT < ADSL.DOSE2DT))
      then: _S_DT1 + 1
    - when: ADSL.DOS2DTM IS NOT NULL AND ASTDTM IS NOT NULL AND ADSL.DOS2DTM <= ASTDTM
      then: FLOOR(_S_D2 + 1)
    - when: (ASTDTM IS NULL OR ADSL.DOS2DTM IS NULL) AND ADSL.DOSE2DT IS NOT NULL AND ASTDT IS NOT NULL AND ADSL.DOSE2DT <= ASTDT
      then: _S_DT2 + 1
- name: _MRDENDY_RAW
  type: int
  derivation:
    case:
    - when: ADSL.TR01SDTM IS NOT NULL AND AENDTM IS NOT NULL AND ADSL.TR01SDTM <= AENDTM AND ((ADSL.DOS2DTM IS NOT NULL AND AENDTM < ADSL.DOS2DTM) OR ADSL.DOSE2DT IS NULL OR (AENDT IS NOT NULL AND ADSL.DOSE2DT IS NOT NULL AND AENDT < ADSL.DOSE2DT))
      then: FLOOR(_E_D1 + 1)
    - when: (ADSL.TR01SDTM IS NULL OR AENDTM IS NULL) AND ((ADSL.DOSE2DT IS NULL AND ADSL.TR01SDT IS NOT NULL AND AENDT IS NOT NULL AND ADSL.TR01SDT <= AENDT) OR (ADSL.TR01SDT IS NOT NULL AND AENDT IS NOT NULL AND ADSL.TR01SDT <= AENDT AND ADSL.DOSE2DT IS NOT NULL AND AENDT < ADSL.DOSE2DT))
      then: _E_DT1 + 1
    - when: MDOSREF = 'Vaccination 1' AND ADSL.TR01SDTM IS NOT NULL AND AENDTM IS NOT NULL AND ADSL.TR01SDTM <= AENDTM
      then: FLOOR(_E_D1 + 1)
    - when: MDOSREF = 'Vaccination 1' AND ADSL.TR01SDT IS NOT NULL AND AENDT IS NOT NULL AND ADSL.TR01SDT <= AENDT AND AENDTM IS NULL
      then: _E_DT1 + 1
    - when: ADSL.DOS2DTM IS NOT NULL AND AENDTM IS NOT NULL AND ADSL.DOS2DTM <= AENDTM
      then: FLOOR(_E_D2 + 1)
    - when: (AENDTM IS NULL OR ADSL.DOS2DTM IS NULL) AND ADSL.DOSE2DT IS NOT NULL AND AENDT IS NOT NULL AND ADSL.DOSE2DT <= AENDT
      then: _E_DT2 + 1
- name: _EXTRT1_UP
  type: str
  derivation:
    str_case:
      source: EX_DOSE1.EXTRT
      to: upper
- name: _EXTRT2_UP
  type: str
  derivation:
    str_case:
      source: EX_DOSE2.EXTRT
      to: upper
- name: _ASEV_PROP
  type: str
  derivation:
    str_case:
      source: AE.AESEV
      to: title
- name: _AE_GRP
  type: str
  derivation:
    str_template:
      template: 'AE-{_AEGRPID}'
      missing: ''
- name: _AESPIDX1
  type: str
  derivation:
    str_extract:
      source: DS_EOS.AESPIDX
      pattern: '^([^,]*)'
      group: 1
      no_match: ''
- name: _AESPIDX2
  type: str
  derivation:
    str_extract:
      source: DS_EOS.AESPIDX
      pattern: '^[^,]*,([^,]*)'
      group: 1
      no_match: ''
- name: _RACE1
  type: str
  derivation: SUPP_DM.RACE1
- name: _RACE2
  type: str
  derivation: SUPP_DM.RACE2
- name: _RACE3
  type: str
  derivation: SUPP_DM.RACE3
- name: _RACE4
  type: str
  derivation: SUPP_DM.RACE4
- name: _RACE5
  type: str
  derivation: SUPP_DM.RACE5
- name: _RACE6
  type: str
  derivation: SUPP_DM.RACE6
- name: _RACEOTH
  type: str
  derivation: SUPP_DM.RACEOTH
- name: _RACE1M
  type: str
  derivation:
    case:
    - when: _RACE1 = 'WHITE'
      then: '''White'''
- name: _RACE2M
  type: str
  derivation:
    case:
    - when: _RACE2 = 'BLACK OR AFRICAN AMERICAN'
      then: '''Black or African American'''
- name: _RACE3M
  type: str
  derivation:
    case:
    - when: _RACE3 = 'ASIAN'
      then: '''Asian'''
- name: _RACE4M
  type: str
  derivation:
    case:
    - when: _RACE4 = 'AMERICAN INDIAN OR ALASKA NATIVE'
      then: '''American Indian or Alaska Native'''
- name: _RACE5M
  type: str
  derivation:
    case:
    - when: _RACE5 = 'NATIVE HAWAIIAN OR OTHER PACIFIC ISLANDER'
      then: '''Native Hawaiian or other Pacific Islander'''
- name: _RACE6M
  type: str
  derivation:
    case:
    - when: _RACE6 = 'OTHER' AND _RACEOTH IS NOT NULL AND _RACEOTH NOT IN ('')
      then:
        str_template:
          template: 'Other: {_RACEOTH}'
          missing: ''
    - when: _RACE6 = 'OTHER'
      then: '''Other'''
- name: _S1
  type: str
  derivation:
    _RACE1M
- name: _S2
  type: str
  derivation:
    case:
    - when: _S1 IS NOT NULL AND _S1 NOT IN ('') AND _RACE2M IS NOT NULL AND _RACE2M NOT IN ('')
      then:
        str_template:
          template: '{_S1}, {_RACE2M}'
          missing: ''
    - when: _S1 IS NOT NULL AND _S1 NOT IN ('')
      then: _S1
    - when: _RACE2M IS NOT NULL AND _RACE2M NOT IN ('')
      then: _RACE2M
- name: _S3
  type: str
  derivation:
    case:
    - when: _S2 IS NOT NULL AND _S2 NOT IN ('') AND _RACE3M IS NOT NULL AND _RACE3M NOT IN ('')
      then:
        str_template:
          template: '{_S2}, {_RACE3M}'
          missing: ''
    - when: _S2 IS NOT NULL AND _S2 NOT IN ('')
      then: _S2
    - when: _RACE3M IS NOT NULL AND _RACE3M NOT IN ('')
      then: _RACE3M
- name: _S4
  type: str
  derivation:
    case:
    - when: _S3 IS NOT NULL AND _S3 NOT IN ('') AND _RACE4M IS NOT NULL AND _RACE4M NOT IN ('')
      then:
        str_template:
          template: '{_S3}, {_RACE4M}'
          missing: ''
    - when: _S3 IS NOT NULL AND _S3 NOT IN ('')
      then: _S3
    - when: _RACE4M IS NOT NULL AND _RACE4M NOT IN ('')
      then: _RACE4M
- name: _S5
  type: str
  derivation:
    case:
    - when: _S4 IS NOT NULL AND _S4 NOT IN ('') AND _RACE5M IS NOT NULL AND _RACE5M NOT IN ('')
      then:
        str_template:
          template: '{_S4}, {_RACE5M}'
          missing: ''
    - when: _S4 IS NOT NULL AND _S4 NOT IN ('')
      then: _S4
    - when: _RACE5M IS NOT NULL AND _RACE5M NOT IN ('')
      then: _RACE5M
- name: _S
  type: str
  derivation:
    case:
    - when: _S5 IS NOT NULL AND _S5 NOT IN ('') AND _RACE6M IS NOT NULL AND _RACE6M NOT IN ('')
      then:
        str_template:
          template: '{_S5}, {_RACE6M}'
          missing: ''
    - when: _S5 IS NOT NULL AND _S5 NOT IN ('')
      then: _S5
    - when: _RACE6M IS NOT NULL AND _RACE6M NOT IN ('')
      then: _RACE6M
- name: _RACESPY_TAIL
  type: str
  derivation:
    str_substr:
      source: _S
      start: 8
- name: _FLAGFL
  type: str
  derivation:
    case:
    - when: SMQ01FL = 'Y' OR ANL01FL = 'Y'
      then: '''Y'''
    - otherwise: '''N'''
- name: _DUR_OK
  type: int
  derivation:
    case:
    - when: ADURSDT IS NOT NULL
      then: 1
    - otherwise: 0
- name: _RN
  type: int
  derivation:
    row_number:
      window: ADURN_W
- name: _RETAINSDT_PREV
  type: date
  derivation:
    row_value:
      source: _RETAINSDT
      offset: -1
      window: ADURN_W
- name: _RETAINEDT_PREV
  type: date
  derivation:
    row_value:
      source: _RETAINEDT
      offset: -1
      window: ADURN_W
- name: _DELDY_PREV
  type: int
  derivation:
    row_value:
      source: _DELDY
      offset: -1
      window: ADURN_W
- name: _ADURSDT_PREV
  type: date
  derivation:
    row_value:
      source: ADURSDT
      offset: -1
      window: ADURN_W
- name: _ADUREDT_PREV
  type: date
  derivation:
    row_value:
      source: ADUREDT
      offset: -1
      window: ADURN_W
- name: _RETAINSDT
  type: date
  derivation:
    case:
    - when: _RN = 1 AND _FLAGFL = 'Y'
      then: ADURSDT
    - when: _RETAINSDT_PREV IS NOT NULL
      then: _RETAINSDT_PREV
- name: _RETAINEDT
  type: date
  derivation:
    case:
    - when: _RN = 1 AND _FLAGFL = 'Y'
      then: ADUREDT
    - when: ADUREDT IS NOT NULL AND _RETAINEDT_PREV IS NOT NULL AND ADUREDT > _RETAINEDT_PREV
      then: ADUREDT
    - when: _RETAINEDT_PREV IS NOT NULL
      then: _RETAINEDT_PREV
- name: _GAP_DAYS
  type: int
  derivation:
    diff:
      type: date
      start: _RETAINEDT_PREV
      end: ADURSDT
      unit: day
- name: _DELDY
  type: int
  derivation:
    case:
    - when: _RN = 1
      then: 0
    - when: _DELDY_PREV IS NOT NULL AND _GAP_DAYS IS NOT NULL AND _GAP_DAYS > 1 AND NOT (_ADURSDT_PREV IS NOT NULL AND _ADUREDT_PREV IS NOT NULL AND ADURSDT IS NOT NULL AND ADURSDT >= _ADURSDT_PREV AND ADURSDT <= _ADUREDT_PREV)
      then: _DELDY_PREV + _GAP_DAYS - 1
    - when: _DELDY_PREV IS NOT NULL
      then: _DELDY_PREV
- name: _SPAN_DAYS
  type: int
  derivation:
    diff:
      type: date
      start: _RETAINSDT
      end: _RETAINEDT
      unit: day
      closed: both
- name: _ADURN_INT
  type: int
  derivation:
    case:
    - when: _SPAN_DAYS IS NOT NULL AND _DELDY IS NOT NULL
      then: _SPAN_DAYS - _DELDY
- name: _RETAIN_ADURN
  type: int
  derivation:
    aggregate:
      group_by: [USUBJID, SUBJID, MDOSREF, AEDECOD]
      expr: MAX(_ADURN_INT)
- name: _ALL_PRESENT
  type: int
  derivation:
    aggregate:
      group_by: [USUBJID, SUBJID, MDOSREF, AEDECOD]
      expr: MIN(_DUR_OK)
- name: SUBJID
  derivation: ADSL.SUBJID
  submission:
    origins:
    - type: Predecessor
      description: ADSL.SUBJID
- name: SITEID
  derivation: ADSL.SITEID
  submission:
    origins:
    - type: Predecessor
      description: ADSL.SITEID
- name: COUNTRY
  derivation: ADSL.COUNTRY
  submission:
    origins:
    - type: Predecessor
