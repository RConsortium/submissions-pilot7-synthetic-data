- name: _AETERM_1
  type: str
  derivation:
    str_replace:
      source: AE.AETERM
      pattern: '\t '
      replacement: '  '
- name: _AETERM_2
  type: str
  derivation:
    str_replace:
      source: _AETERM_1
      pattern: '^\s+|\s+$'
      replacement: ''
- name: _AETERM_3
  type: str
  derivation:
    str_replace:
      source: _AETERM_2
      pattern: '[\r\n\x0c\u00c2\u00b0\u00a0]'
      replacement: ' '
- name: _AETERM_4
  type: str
  derivation:
    str_replace:
