    - when: AE.AEDECOD IN ('Accelerated hypertension', 'Blood pressure diastolic increased', 'Blood pressure increased', 'Blood pressure systolic increased', 'Diastolic hypertension', 'Essential hypertension', 'Hypertension', 'Hypertensive emergency', 'Hypertensive urgency', 'Labile hypertension', 'Systolic hypertension')
