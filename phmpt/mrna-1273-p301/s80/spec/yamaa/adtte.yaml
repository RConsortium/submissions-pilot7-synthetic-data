# ADTTE for Moderna mRNA-1273-P301, cut S80 (First Interim Analysis
# IA1a, extract 11 Nov 2020, efficacy cutoff 2020-11-07). Parent:
# ../../../spec/yamaa/base/adam-base-ia.yaml (which chains to ../../../spec/yamaa/base/adam-base.yaml;
# 86 shared + 6 IA-only ADSL columns). Derivations implement the S80
# A50ADTTE program (Bates 5654028-5654032): one row per FAS subject
# per PARAMCD (31 PARAMCDs), from the submitted ADEFF (first event
# per subject per PARAMCD) and the verified ADSL. Where the SAS code
# and the define.xml method text disagree, the code is followed (see
# README.md). SAP note (closed 2026-11-24, no-impact): the file
# labelled "SAP v3" (19745_S68_M5_sap-v3.pdf) is the P201 SAP v3.0
# (27 Oct 2020), not a P301 SAP version; the only P301 SAP in the set
# is v1.0 (10 Sep 2020). The case definitions below are the program's
# own, so the spec follows the program, not a SAP version. IA-vs-S3
# differences (see the generator
# header): no MB/IS prior-infection censoring, no aperiod-2 rows, no
# inwin/cutoff gate, no ADT clamp, simple TTDEATH. Program-vs-data
# note: the program calls %dev_tte for DEATHCVD, but the submitted
# S80 ADEFF has zero DEATHCVD rows, so all 151,750 TTDTHCV rows are
# censored; the define's own CL.ADTTE.PARAMCD codelist lists exactly
# the 31 PARAMCDs present in the data. KEYS: unlike ADEFF, ADTTE HAS
# a usable key: (STUDYID, USUBJID, PARAMCD) is unique and non-missing
# on the submitted target, and there is no ASEQ column. Honest gaps:
# none. A pandas prototype reproduces the submitted target exactly on
# all 63 columns (0 mismatches), and the yamaa spec is expected to
# verify EXACT MATCH the same way; if the full verify.py run OOMs in
# this 6 GB cell (940,850 rows), verification falls back to pruned
# dependency-closure groups with a single full-spec re-run in a
# roomier cell still owed (see adtte/verify_report_s80.json, original work tree).
# Layer over ../s5/adtte.yaml: the derivations are the parent cut's, and
# this file holds only what this cut changes (written by
# scripts/specs/inherit_cut.py; its resolved specification
# equals the standalone file it replaced).
yamaa: '1.0'
type: spec
parent: ../../../s5/spec/yamaa/adtte.yaml
clear:
- columns.RTPCRBL.submission
input:
  ADEFF:
    path: <adam-dir>/adeff.parquet
  ADSL:
    path: <adam-dir>/adsl.parquet
columns:
- name: RTPCRBL
  derivation:
output:
  path: <adam-dir>/adtte-yamaa.parquet
  columns:
  - STUDYID
  - USUBJID
  - SUBJID
  - SITEID
  - COUNTRY
  - AGE
  - AGEU
  - STRATAR
  - STRATARN
  - AGEGR1
  - AGEGR1N
  - AGEGR2
  - AGEGR2N
  - SEX
  - RACE
  - RACESPY
  - ETHNIC
  - RANDFL
  - FASFL
  - SAFFL
  - SAR1FL
