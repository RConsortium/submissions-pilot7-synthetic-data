# ADAR1 for mRNA-1273-P301, IND 19745 S80.
# The submitted ADAR1 and ADAR2 split ADAR by PARCAT1 (ADAR1 the LOCAL
# reactions, ADAR2 the SYSTEMIC ones; together exactly ADAR's rows and
# columns). No program or define entry for them is in the release; this
# spec keeps the LOCAL rows of the ADAR this cut's adar.yaml derives
# (helper/adar_all.yaml).
yamaa: '1.0'
type: spec
model: ADaM
domain: ADAR1
submission:
  label: Solicited AR Analysis Dataset - Local
  class: BASIC DATA STRUCTURE
  structure: One record per subject, per parameter, per analysis timepoint
  repeating: true
# No define describes this dataset; the columns carry no submission metadata.
keys: [STUDYID, USUBJID, ASEQ]
input:
  ALL:
    path: <work-dir>/adar_all.parquet
    schema: helper/adar_all.yaml
rows:
- id: kept
  dataset: ALL
  filter: ALL.PARCAT1 = 'LOCAL'
  derivations:
    STUDYID: ALL.STUDYID
    USUBJID: ALL.USUBJID
    SUBJID: ALL.SUBJID
    SITEID: ALL.SITEID
    COUNTRY: ALL.COUNTRY
    AGE: ALL.AGE
    AGEU: ALL.AGEU
    STRATAR: ALL.STRATAR
    STRATARN: ALL.STRATARN
    AGEGR1: ALL.AGEGR1
    AGEGR1N: ALL.AGEGR1N
    AGEGR2: ALL.AGEGR2
    AGEGR2N: ALL.AGEGR2N
    SEX: ALL.SEX
    RACE: ALL.RACE
    RACESPY: ALL.RACESPY
    ETHNIC: ALL.ETHNIC
    RANDFL: ALL.RANDFL
    FASFL: ALL.FASFL
    SAFFL: ALL.SAFFL
    SAR1FL: ALL.SAR1FL
    SAR2FL: ALL.SAR2FL
    SARAFL: ALL.SARAFL
    MITTFL: ALL.MITTFL
    PPROTFL: ALL.PPROTFL
    COMPLFL: ALL.COMPLFL
    DOSE1FL: ALL.DOSE1FL
    DOSE2FL: ALL.DOSE2FL
    ELECSBL: ALL.ELECSBL
    SCOV2BL: ALL.SCOV2BL
    TRT01P: ALL.TRT01P
    TRT01PN: ALL.TRT01PN
    TRT01A: ALL.TRT01A
    TRT01AN: ALL.TRT01AN
    TR01SDT: ALL.TR01SDT
    TR01SDTM: ALL.TR01SDTM
    TR01EDT: ALL.TR01EDT
    TR01EDTM: ALL.TR01EDTM
    DOSE2DT: ALL.DOSE2DT
    DOS2DTM: ALL.DOS2DTM
    RSKF1: ALL.RSKF1
    RSKF2: ALL.RSKF2
    RSKF3: ALL.RSKF3
    RSKF4: ALL.RSKF4
    RSKF5: ALL.RSKF5
    RSKF6: ALL.RSKF6
    STRATAV: ALL.STRATAV
    STRATAVN: ALL.STRATAVN
    MINORITY: ALL.MINORITY
    RACEGR1: ALL.RACEGR1
    RACEGR1N: ALL.RACEGR1N
    RISKGR1: ALL.RISKGR1
    RISKGR1N: ALL.RISKGR1N
    RETHGR1: ALL.RETHGR1
    RETHGR1N: ALL.RETHGR1N
    ASEQ: ALL.ASEQ
    ADT: ALL.ADT
    ATM: ALL.ATM
    ADTM: ALL.ADTM
    ADY: ALL.ADY
    ATPT: ALL.ATPT
    ATPTN: ALL.ATPTN
    ATPTREF: ALL.ATPTREF
    ATPTGR1: ALL.ATPTGR1
    ATPTGR1N: ALL.ATPTGR1N
    PARCAT1: ALL.PARCAT1
    PARCAT1N: ALL.PARCAT1N
    PARAMCD: ALL.PARAMCD
    PARAM: ALL.PARAM
    AVAL: ALL.AVAL
    AVALC: ALL.AVALC
    ATOXGR: ALL.ATOXGR
    ATOXGRN: ALL.ATOXGRN
    ANL01FL: ALL.ANL01FL
    ANL02FL: ALL.ANL02FL
    ANL03FL: ALL.ANL03FL
    CRIT1: ALL.CRIT1
    CRIT1FL: ALL.CRIT1FL
    CRIT2: ALL.CRIT2
    CRIT2FL: ALL.CRIT2FL
    CRIT3: ALL.CRIT3
    CRIT3FL: ALL.CRIT3FL
    CRIT4: ALL.CRIT4
