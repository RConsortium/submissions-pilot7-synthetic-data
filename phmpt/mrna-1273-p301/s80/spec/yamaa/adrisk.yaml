# ADRISK for Moderna mRNA-1273-P301, cut S80 (First Interim Analysis
# IA1a, cutoff 2020-11-11). Parent: ../../../spec/yamaa/base/adam-base-ia.yaml (which
# chains to ../../../spec/yamaa/base/adam-base.yaml; 86 shared + 6 IA-only ADSL
# columns). Derivations implement the S80 ADRISK program (Bates
# 5654004-5654006, %let dsetname = adrisk; byte-identical to the S5
# ADRISK program). One row template drives on SDTM SC, inner-joined
# to the verified ADSL on (STUDYID, USUBJID) with the program's
# (USUBJID, SUBJID) merge reproduced by the row-template filter:
# 577,569 SC rows -> 575,645 submitted rows (1,924 drops: 1,867
# non-ADSL rows + 57 SUBJID-mismatch rows from 3 duplicate-
# enrollment subjects). The S80 program reads NO S27 file and NO
# FACE/FAAE/DS/HO/EX/CM/MH/VS. Honest gap: OTHSPY 7 cells (6 genuine
# text diffs + 1 space-only leading-space cell). AVALC: the 8 OTHERLOC
# ASEQ-12 rows with blank SCORRES and SCSTRESC carry 'Y' in the submitted
# data; the spec sets 'Y' whenever SCSTRESC is blank (the S5/S3 reading,
# session 48, 2026-11-23), so the former 8-cell AVALC gap is closed and
# all three cuts now agree on AVALC.
# No time columns exist in the target and RACESPY has no NUL tails,
# so the ADAE time-representation and RACESPY gaps do not apply.
# SAP v1 vs v3 CLOSED as no-impact (2026-11-24) -- the program's
# own definitions are followed. See the generator header for the full
# design notes.
yamaa: '1.0'
type: spec
model: ADaM
parent: ../../../spec/yamaa/base/adam-base-ia.yaml
domain: ADRISK
keys:
- STUDYID
- USUBJID
- ASEQ
input:
  SC: <sdtm-dir>/sc.parquet
  SUPPSC: <sdtm-dir>/suppsc.parquet
  ADSL:
    path: <adam-dir>/adsl.parquet
    key:
    - STUDYID
    - USUBJID
submission:
  label: Risk of Exposure Analysis Dataset
  class: BASIC DATA STRUCTURE
  structure: One record per subject per parameter
  repeating: true
rows:
- id: sc_rows
  dataset: SC
  derivations:
    STUDYID: SC.STUDYID
    USUBJID: SC.USUBJID
    _SCSEQ: SC.SCSEQ
    _OTHSPY2: null
  filter: _ADSL IS NOT NULL AND SC.SUBJID = ADSL.SUBJID
intermediates:
- id: SUPP_SC
  dataset: SUPPSC
  key:
    STUDYID: STUDYID
    USUBJID: USUBJID
    IDVARVAL:
      str_decimal:
        source: _SCSEQ
        decimals: 0
  filter: SUPPSC.QNAM IN ('SCORRS1') AND SUPPSC.IDVAR = 'SCSEQ'
  pivot:
    name: QNAM
    value: QVAL
    fields:
    - SCORRS1
columns:
- name: _ADSL
  type: str
  derivation: ADSL.USUBJID
- name: STUDYID
  submission:
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: USUBJID
  submission:
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: _SCSEQ
  type: float
- name: _OTHSPY2
  type: str
- name: _PARAM_RAW
  type: str
  derivation:
    case:
    - when: SC.SCTEST <> 'Other'
      then: SC.SCTEST
    - when: SC.SCSCAT = 'OCCUPATIONAL RISK'
      then: '''Other Occupational Risk'''
    - when: SC.SCSCAT = 'LOCATION AND LIVING CIRCUMSTANCES RISK'
      then: '''Other Location And Living Circumstances Risk'''
- name: _OTHSPY_1
  type: str
  derivation:
    str_replace:
      source: SC.SCORRES
      pattern: " *\u00c2\u00a0 *|\\s*\u00a0\\s*|\u00c2"
      replacement: ' '
- name: _OTHSPY_2
  type: str
  derivation:
    str_replace:
      source: _OTHSPY_1
      pattern: "\u00b0"
      replacement: ''
