# ADEX for Moderna mRNA-1273-P301, cut S80 (First Interim Analysis
# IA1a, cutoff 2020-11-11). Parent: ../../../spec/yamaa/base/adam-base-ia.yaml (which
# chains to ../../../spec/yamaa/base/adam-base.yaml; 86 shared + 6 IA-only ADSL
# columns). Derivations implement the S80 A20ADEX program (Bates
# 5653993-5653995): EX rows plus the ECOCCUR='N' EC rows, each
# inner-joined to the verified ADSL on USUBJID, with ASEQ assigned
# per subject by ascending SRCDOM, VISITNUM, EXSEQ, ECSEQ -- the
# submitted ASEQ follows that order, not the program's stated
# sort (USUBJID VISIT exseq ecseq); see the generator header.
# NDOSERS is EC.ECREASOC (S80 SUPPEC carries no ECREASOC QNAM);
# NDOSRSP comes from the SUPPEC pivot (EXREASSP only). No APERIOD
# in this cut. Honest gaps: NDOSRSP, 1 cell (US348-2315); NDOSERS,
# 1 space-only cell (US380-2176) -- see the generator header.
# Layer over ../s5/adex.yaml: the derivations are the parent cut's, and
# this file holds only what this cut changes (written by
# scripts/specs/inherit_cut.py; its resolved specification
# equals the standalone file it replaced).
yamaa: '1.0'
type: spec
parent: ../../../s5/spec/yamaa/adex.yaml
clear:
- columns.RTPCRBL.submission
input:
  EX: <sdtm-dir>/ex.parquet
  EC: <sdtm-dir>/ec.parquet
  SUPPEC: <sdtm-dir>/suppec.parquet
  ADSL:
    path: <adam-dir>/adsl.parquet
rows:
- id: ex_rows
  derivations:
    _NDOSRSP1:
    _NDOSRSP2:
- id: ec_rows
  derivations:
    _NDOSRSP1: SUPP_P.EXREASP1
    _NDOSRSP2: SUPP_P.EXREASP2
intermediates:
- id: SUPP_P
  filter: SUPPEC.QNAM IN ('EXREASSP', 'EXREASP1', 'EXREASP2') AND SUPPEC.IDVAR = 'ECSEQ'
  pivot:
    fields:
    - EXREASSP
    - EXREASP1
    - EXREASP2
columns:
- name: _NDOSRSP1
  type: str
- name: _NDOSRSP2
  type: str
- name: RTPCRBL
  derivation:
- name: ASTDTM
  submission:
    method: "Withheld from publication: the received define states this text."
- name: NDOSRSP1
  type: str
  label: Reason Study Trt not Given Specify 1
  derivation: _NDOSRSP1
  submission:
    core: Perm
    mandatory: false
    length: 200
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: NDOSRSP2
  type: str
  label: Reason Study Trt not Given Specify 2
  derivation: _NDOSRSP2
  submission:
    core: Perm
    mandatory: false
    length: 200
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: ASEQ
  submission:
    method: "Withheld from publication: the received define states this text."
output:
  path: <adam-dir>/adex-yamaa.parquet
  columns:
  - STUDYID
  - USUBJID
  - ASEQ
  - SUBJID
  - SITEID
  - COUNTRY
  - AGE
  - AGEU
  - STRATAR
  - STRATARN
  - AGEGR1
  - AGEGR1N
  - AGEGR2
  - AGEGR2N
  - SEX
  - RACE
  - RACESPY
  - ETHNIC
  - RANDFL
  - FASFL
  - SAFFL
  - SAR1FL
  - SAR2FL
  - SARAFL
  - MITTFL
  - PPROTFL
  - COMPLFL
  - DOSE1FL
  - DOSE2FL
  - ELECSBL
  - SCOV2BL
  - TRT01P
  - TRT01PN
  - TRT01A
  - TRT01AN
  - TR01SDT
  - TR01SDTM
  - TR01EDT
  - TR01EDTM
  - DOSE2DT
  - DOS2DTM
  - RSKF1
  - RSKF2
  - RSKF3
  - RSKF4
  - RSKF5
  - RSKF6
  - STRATAV
  - STRATAVN
  - MINORITY
  - RACEGR1
