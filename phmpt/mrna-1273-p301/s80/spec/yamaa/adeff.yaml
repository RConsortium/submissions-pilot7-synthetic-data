      derivation: ADSYMP.AENDT
    _ADT2:
      type: date
      derivation:
        case:
        - when: _ASTDT IS NOT NULL
          then: _ASTDT
        - when: _ADT IS NOT NULL
          then: _ADT
        - otherwise: _AENDT
    _ADT2_EPOCH:
      type: int
      derivation:
        to_epoch_day:
          source: _ADT2
    _ASTDT_EPOCH:
      type: int
      derivation:
        to_epoch_day:
          source: _ASTDT
    _AENDT_EPOCH:
      type: int
      derivation:
        to_epoch_day:
          source: _AENDT
