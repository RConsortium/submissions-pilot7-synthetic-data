- name: PARAM
  type: str
  label: Parameter
  derivation:
    mapping:
      source: PARAMCD
      dict:
        ASYMPINA: 'Asymptomatic SARS-CoV-2 Infection per Adjudication'
        ASYMPINF: 'Asymptomatic SARS-CoV-2 Infection'
        COVID: 'COVID-19'
        COVIDA: 'COVID-19 per Adjudication'
        COVIDSD: 'COVID-19 (Secondary Definition)'
        COVIDSEV: 'Severe COVID-19'
        COVIDSVA: 'Severe COVID-19 per Adjudication'
        DEATHCVD: 'Death Caused by COVID-19'
        INFECT: 'SARS-CoV-2 Infection Regardless of Symptomatology or Severity'
