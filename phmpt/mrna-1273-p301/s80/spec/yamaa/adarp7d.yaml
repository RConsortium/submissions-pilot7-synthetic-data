# ADARP7D for Moderna mRNA-1273-P301, cut S80 (First Interim Analysis IA1a,
# extract 2020-11-11).
# Layer over the S5 spec: the S80 program (Bates 5653958-5653967,
# %let dsetname = adarp7d) is identical to the S5 one, run on this cut's VS,
# SUPPVS, FAAE, SUPPFAAE and ADSL
# (scripts/reproduce.py verify --study mrna-1273-p301 --cut s80).
# The S80 release has no FACE either, so FACE and SUPPFACE stay the S3
# release's (see the S5 spec); the S3 FACE is a later snapshot than this
# cut's, so subjects whose FACE records changed do not match
# (data/differences.yaml, missing_input). The output keeps this cut's
# columns: S80's ADARP7D has no RTPCRBL.
yamaa: '1.0'
type: spec
parent: ../../../s5/spec/yamaa/adarp7d.yaml
clear:
- columns.RTPCRBL.submission
