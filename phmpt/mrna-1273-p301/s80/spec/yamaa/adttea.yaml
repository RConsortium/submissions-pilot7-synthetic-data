# ADTTEA for Moderna mRNA-1273-P301, cut S80 (First Interim Analysis
# IA1a, extract 11 Nov 2020, efficacy cutoff 2020-11-07). Parent:
# ../../../spec/yamaa/base/adam-base-ia.yaml (which chains to ../../../spec/yamaa/base/adam-base.yaml;
# 86 shared + 6 IA-only ADSL columns). Derivations implement the S80
# A50ADTT program (Bates 5654033-5654037, 233 lines): one row per FAS
# subject per PARAMCD (16 PARAMCDs), from the submitted ADEFF (first
# event per subject per PARAMCD) and the verified ADSL. Where the SAS
# code and the define.xml method text disagree, the code is followed
# (see README.md). SAP note (closed 2026-11-24, no-impact): the file
# labelled "SAP v3" (19745_S68_M5_sap-v3.pdf) is the P201 SAP v3.0
# (27 Oct 2020), not a P301 SAP version; the only P301 SAP in the set
# is v1.0 (10 Sep 2020). The case definitions below are the program's
# own, so the spec follows the program, not a SAP version. IA-vs-S3
# differences (see the generator
# header): no MB/IS prior-infection censoring, no aperiod-2 rows, no
# inwin/cutoff gate, no ADT clamp, censor list without AP01EDT (the
# S80 ADSL has no AP01EDT column), TTCVD1B censor adds CVD53DT.
# CVD53DT is 2020-10-27 in S80 (95 candidates; the fallback never
# fires). The S80 define carries no CL.ADTTEA.PARAMCD codelist, so
# the PARAMCD set is grounded in the program calls + the data. XQ:
# the S3 CDCCD/LGROUP/LINEAGES source does not exist at this cut --
# no XQ file among the S80 SDTM files, and the S80 ADTTEA target has
# no CDCCD/LGROUP/LINEAGES columns. KEYS: unlike ADEFF, ADTTEA HAS
# a usable key: (STUDYID, USUBJID, PARAMCD) is unique and non-missing
# on the submitted target, and there is no ASEQ column. Honest gaps:
# none. A pandas prototype reproduces the submitted target exactly on
# all 64 columns (0 mismatches), and the yamaa spec is expected to
# verify EXACT MATCH the same way; if the full verify.py run OOMs in
# this 6 GB cell (485,600 rows), verification falls back to pruned
# dependency-closure groups with a single full-spec re-run in a
# roomier cell still owed (see adttea/verify_report_s80.json, original work tree).
# Layer over ../s5/adttea.yaml: the derivations are the parent cut's, and
# this file holds only what this cut changes (written by
# scripts/specs/inherit_cut.py; its resolved specification
# equals the standalone file it replaced).
yamaa: '1.0'
type: spec
parent: ../../../s5/spec/yamaa/adttea.yaml
clear:
- columns.RTPCRBL.submission
input:
  ADEFF:
    path: <adam-dir>/adeff.parquet
  ADSL:
    path: <adam-dir>/adsl.parquet
rows:
- id: ttcvd1_rows
  derivations:
    _CVD53DT: DATE '2020-10-27'
- id: ttcvd2_rows
  derivations:
    _CVD53DT: DATE '2020-10-27'
- id: ttcvd3_rows
  derivations:
    _CVD53DT: DATE '2020-10-27'
