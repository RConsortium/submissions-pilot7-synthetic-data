- id: ttcvdse1_rows
  derivations:
    _CVD53DT: DATE '2020-10-27'
- id: ttcvdse2_rows
  derivations:
    _CVD53DT: DATE '2020-10-27'
- id: ttcvdse3_rows
  derivations:
    _CVD53DT: DATE '2020-10-27'
- id: ttcvdse4_rows
  derivations:
    _CVD53DT: DATE '2020-10-27'
- id: ttcvdse5_rows
  derivations:
