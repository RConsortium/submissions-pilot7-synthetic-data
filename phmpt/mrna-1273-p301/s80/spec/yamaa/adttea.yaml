- id: ttasymp3_rows
  derivations:
    _CVD53DT: DATE '2020-10-27'
- id: ttasymp4_rows
  derivations:
    _CVD53DT: DATE '2020-10-27'
- id: ttasymp5_rows
  derivations:
    _CVD53DT: DATE '2020-10-27'
- id: ttcvd1b_rows
  derivations:
    _CVD53DT: DATE '2020-10-27'
intermediates:
- id: EV_COVIDA_53
  filter: ADEFF.PARAMCD = 'COVIDA' AND ADEFF.PARCAT1 = 'DERIVED PER ADJUDICATION' AND ADEFF.ANL01FL = 'Y' AND ADEFF.ADT IS NOT NULL AND ADEFF.ADT <= DATE '2020-10-27'
columns:
- name: RTPCRBL
  derivation:
- name: CVD53DT
  derivation: DATE '2020-10-27'
