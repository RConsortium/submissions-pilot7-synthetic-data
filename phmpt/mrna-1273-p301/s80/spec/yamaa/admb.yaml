# ADMB for Moderna mRNA-1273-P301, cut S80 (First Interim Analysis IA1a,
# eCTD sequence 80 of IND 19745, cutoff 2020-11-11). Parent:
# ../../../spec/yamaa/base/adam-base-ia.yaml (which chains to ../../../spec/yamaa/base/adam-base.yaml;
# 86 shared + 6 IA-only ADSL columns).
# Derivations implement the S80 ADMB program (prototype
# admb_proto_s80.py (original work tree) matches all 85 submitted
# columns on all 96,077 rows). Where the SAS code and the define.xml
# method text disagree, the code is followed (see README.md).
# Inputs: MB + SUPPMB (SDTM) + verified ADSL. SUPPMB is pivoted for
# LOCALFL/LDTCLIA/LDTTESTO by (USUBJID, MBSEQ). Row accounting: MB 156,000
# rows -> MBSTAT='' 96,112 -> inner join to ADSL on (USUBJID, SUBJID)
# drops 35 -> 96,077 submitted rows. Keys are [STUDYID, USUBJID, MBSEQ]
# (unique).
# MBSTAT is ABSENT from the submitted S80 ADMB (85 cols vs 86 in the
# define); it is not declared as an output column, but the MB input does
# carry it, so the row-template filter still uses the internal _MBSTAT.
# MBNAM (MB.MBNAM) and LDTTESTO (SUPPMB QNAM='LDTTESTO') are output
# columns new vs S3; APERIOD / EUAVACFL do not exist in this cut.
# The %ablfl step is the P201-era macro (avisit_type=3, uns_blank=N, no
# illtpt parameter): _adtmy is (ADT-TR01SDT)*86400 - 86340 with no
# 999/visitnum reassignment; illness visits are forced post-dose; _illuns
# is 1 only for illness AND Uns; the baseline sort has no VISITNUM and no
# _PREFL_ADTM term. _ILL_SET / _ILL_DAT / _ILL_ADY use the S80 ADIS
# row_value/locf encoding over the baseline sort; the macro's scheill_day1
# has no per-group reset, but group-local locf is output-equivalent on
# this data (prototype: global and local scheill both exact). The
# uns_blank retain step does not run (uns_blank=N). The _ILL_DAT/_ILL_ADY
# dec branches parenthesise _COND_ILL: it is an OR, and AND binds tighter
# than OR in yamaa expressions, so an unparenthesised "COND_ILL AND DEC"
# would clear _ILL_DAT/_ILL_ADY on every condA row. retain_ill_ady uses
# the macro's second-data-step sort order (SORT4_W), not the ADIS form
# (_AVALN desc, _POSTFL, ADT, _ILL_ADY desc), which reorders within
# (_AVALN, _POSTFL, ADT) groups and gives the wrong retain here.
# The S80 program has no base_chg2 step: ATPT/ATPTN come straight from
# the pre-collapse AVISIT with no blanking, and ANL01FL's sort uses the
# raw %ablfl _uns. ANL01FL requires postfl='Y' and breaks ties on MBSEQ
# ASCENDING (7 tie groups: sizes 2: 6, 3: 1; MBSEQ DESC flips 14 cells).
# The Step C Day-29 branch is an elif with an INNER if on the ADY range
# (ADY 2..36 only): its then is a nested case, so an outer match with ADY
# outside [2, 36] yields '' and blocks the 'Day N' branch. The Step D fix
# uses 2<ADY<=36 (strict). The Day-1 override is a separate step after the
# chain and fires when ADT=_ILL_DAT and scheill_update is non-empty, with
# no ABLFL condition and no Uns condition.
# Validation notes (what check()/run() required, beyond the prototype):
# - Empty-string literals use lit('') (a bare '' is an empty expression).
# - _ADTMY/_ADTMY_NUM are float (VISITNUM carries 2.01-style values).
# - Specific mandatory:false overrides (define-mandatory with gaps in the
#   submitted data): ADT, ADY, MBDTC, MBTPT, VISIT, VISITNUM.
yamaa: '1.0'
type: spec
model: ADaM
parent: ../../../spec/yamaa/base/adam-base-ia.yaml
domain: ADMB
keys:
- STUDYID
- USUBJID
- MBSEQ
input:
  MB: <sdtm-dir>/mb.parquet
  SUPPMB: <sdtm-dir>/suppmb.parquet
  ADSL:
    path: <adam-dir>/adsl.parquet
    key:
    - STUDYID
    - USUBJID
submission:
  label: Microbiology Analysis Dataset
  class: BASIC DATA STRUCTURE
  structure: One or more records per subject per analysis parameter per analysis timepoint
  repeating: true
rows:
- id: mb_rows
  dataset: MB
  derivations:
    STUDYID: MB.STUDYID
    USUBJID: MB.USUBJID
    _MBSEQ: MB.MBSEQ
    _MBSTAT: MB.MBSTAT
    _MBTESTCD: MB.MBTESTCD
    _MBTEST: MB.MBTEST
    _MBCAT: MB.MBCAT
    _MBSCAT: MB.MBSCAT
    _MBSPEC: MB.MBSPEC
    _MBMETHOD: MB.MBMETHOD
    _MBSTRESC: MB.MBSTRESC
    _MBDTC: MB.MBDTC
    _VISIT: MB.VISIT
    _VISITNUM: MB.VISITNUM
    _MBTPT: MB.MBTPT
    _MBTPTNUM: MB.MBTPTNUM
    _LOCALFL: SUPP_P.LOCALFL
    _LDTCLIA: SUPP_P.LDTCLIA
    _LDTTESTO: SUPP_P.LDTTESTO
  filter: (_MBSTAT IS NULL OR _MBSTAT IN ('')) AND _MBTESTCD IS NOT NULL AND _MBTESTCD NOT IN ('') AND _ADSL IS NOT NULL
intermediates:
- id: SUPP_P
  dataset: SUPPMB
  key:
    STUDYID: STUDYID
    USUBJID: USUBJID
    IDVARVAL:
      str_decimal:
        source: _MBSEQ
        decimals: 0
  filter: SUPPMB.QNAM IN ('LOCALFL', 'LDTCLIA', 'LDTTESTO') AND SUPPMB.IDVAR = 'MBSEQ'
  pivot:
    name: QNAM
    value: QVAL
    fields:
    - LOCALFL
    - LDTCLIA
    - LDTTESTO
windows:
  BASE_W:
    group_by:
    - STUDYID
    - USUBJID
    - PARAMCD
    order_by:
    - variable: _AVALN
      direction: desc
    - _POSTFL
    - variable: _PREFL_ADT
      direction: desc
    - ADT
    - _ADDSORTN
    - _ILLUNS
    - _ADTMY
    - _ISSTRESN
    - variable: _ADTMY_NUM
      direction: desc
    - variable: MBSEQ
      direction: desc
  SORT2_W:
    group_by:
    - STUDYID
    - USUBJID
    - PARAMCD
    order_by:
    - variable: _AVALN
      direction: desc
    - _POSTFL
    - variable: _PREFL_ADT
      direction: desc
    - ADT
    - _ADDSORTN
    - _ILLUNS
    - _ADTMY
    - _ISSTRESN
    - variable: _ADTMY_NUM
      direction: desc
    - variable: MBSEQ
      direction: desc
  FIRST_ADT_W:
    group_by:
    - STUDYID
    - USUBJID
    - PARAMCD
    - _AVALN
    - _POSTFL
    - _PREFL_ADT
    - ADT
    order_by:
    - _ADDSORTN
    - _ILLUNS
    - _ADTMY
    - _ISSTRESN
    - variable: _ADTMY_NUM
      direction: desc
    - variable: MBSEQ
      direction: desc
  SORT4_W:
    group_by:
    - STUDYID
    - USUBJID
    - PARAMCD
    order_by:
    - variable: _AVALN
      direction: desc
    - _POSTFL
    - ADT
    - _ADDSORTN
    - _ADTMY
    - variable: _ADTMY_NUM
      direction: desc
    - _ISSTRESN
    - variable: MBSEQ
      direction: desc
  ANL01_W:
    group_by:
    - STUDYID
    - USUBJID
    - PARAMCD
    - AVISITN
    order_by:
    - variable: _POSTFL
      direction: desc
    - variable: _AVALN2
      direction: desc
    - _UNS
    - variable: _SORT_AVALC
      direction: desc
    - ADT
    - _MBTPTNUM
    - MBSEQ
