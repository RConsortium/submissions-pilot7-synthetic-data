- name: _VISIT_T
  type: str
  derivation:
    case:
    - when: _VISIT = 'Illness Visit Day 3 - Day 21'
      then: ''''''
    - when: str_contains(_VISIT, 'Uns')
      then: ''''''
    - otherwise: _VISIT
- name: _VISIT_T2
  type: str
  derivation:
    str_replace:
      source: _VISIT_T
      pattern: Convalescence
      replacement: Illness
- name: _VISIT_W
  type: str
  derivation:
    case:
    - when: (_VISIT_T2 IS NULL OR _VISIT_T2 IN ('') OR str_contains(_VISIT_T2, 'Saf'))
      then: '''Unsched'''
    - otherwise: _VISIT_T2
- name: _VISIT_WU
  type: str
  derivation:
    str_case:
      source: _VISIT_W
      to: upper
- name: _DAY_TXT
  type: str
  derivation:
    str_extract:
      source: _VISIT_W
      pattern: Day ([0-9]+)
      group: 1
      no_match: ''
- name: _DATE_TXT
  type: str
  derivation:
    case:
    - when: _MBDTC IS NULL OR _MBDTC IN ('')
      then: ''''''
    - otherwise:
        str_substr:
          source: _MBDTC
          start: 1
          length: 10
- name: _MBTPTNUM_TXT
  type: str
  derivation:
    str_decimal:
      source: _MBTPTNUM
      decimals: 0
      width: 3
- name: _ADDSORTN
  type: str
  derivation:
    case:
    - when: str_contains(_VISIT_T, '^Visit')
      then: ''''''
    - when: (_VISIT_T IS NULL OR _VISIT_T IN ('')) AND ADT IS NOT NULL
      then:
        str_template: '{_DATE_TXT} - 999'
    - when: (str_contains(_VISIT_T, '^Ill') OR str_contains(_VISIT_T, '^Conva')) AND ADT IS NOT NULL AND TR01SDT IS NOT NULL AND ADT > TR01SDT AND _MBTPTNUM IS NOT NULL
      then:
        str_template: '{_DATE_TXT} - {_MBTPTNUM_TXT}'
    - when: (str_contains(_VISIT_T, '^Ill') OR str_contains(_VISIT_T, '^Conva')) AND ADT IS NOT NULL AND TR01SDT IS NOT NULL AND ADT > TR01SDT AND _MBTPTNUM IS NULL
      then: _DATE_TXT
    - when: (str_contains(_VISIT_T, '^Ill') OR str_contains(_VISIT_T, '^Conva')) AND (_MBDTC IS NULL OR _MBDTC IN (''))
      then: '''0000'''
    - otherwise: ''''''
- name: _MBSTRESC2
  type: str
  derivation:
    case:
    - when: str_contains(_MBSTRESC, '^See')
      then: ''''''
    - otherwise: _MBSTRESC
- name: AVALC
  type: str
  label: Analysis Value (C)
  derivation:
    case:
    - when: str_contains(_MBSTRESC, '^N')
      then: '''Negative'''
    - when: str_contains(_MBSTRESC, '^[DPY]')
      then: '''Positive'''
    - otherwise: _MBSTRESC
  submission:
    core: Perm
    mandatory: false
    length: 50
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: _SORT_AVALC
  type: int
  derivation:
    case:
    - when: AVALC = 'Positive'
      then: 3
    - when: AVALC = 'Negative'
      then: 2
    - otherwise: 1
- name: ADT
  type: date
  label: Analysis Date
  derivation:
    to_date:
      source: _MBDTC
  submission:
    core: Req
    mandatory: false
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: ADTM
  type: datetime
  label: Analysis Datetime
  derivation:
    case:
    - when: str_contains(_MBDTC, 'T')
      then:
        impute:
          type: datetime
          source: _MBDTC
          time: first
  submission:
    core: Perm
    mandatory: false
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: ATM
  type: time
  label: Analysis Time
  derivation:
    to_time:
      source: ADTM
  submission:
    core: Perm
    mandatory: false
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: ADY
  type: int
  label: Analysis Relative Day
  derivation:
    study_day:
      source: ADT
      reference: TR01SDT
  submission:
    core: Req
    mandatory: false
    length: 8
    display_format: '3.'
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: _DAYDIFF
  type: int
  derivation:
    diff:
      type: date
      start: TR01SDT
      end: ADT
      unit: day
- name: _ADTMY_S
  type: int
  derivation:
    case:
    - when: ADT IS NOT NULL AND TR01SDT IS NOT NULL
      then: _DAYDIFF * 86400 - 86340
    - when: NOT str_contains(_VISIT_WU, 'ILLNESS')
      then: 99999999
- name: _ADTMY
  type: float
  derivation: ABS(_ADTMY_S)
- name: _ADTMY_NUM
  type: float
  derivation:
    case:
    - when: _VISITNUM IS NOT NULL
      then: ABS(_ADTMY_S) + _VISITNUM
    - otherwise: ABS(_ADTMY_S)
- name: _PREFL
  type: str
  derivation:
    case:
    - when: NOT str_contains(_VISIT_WU, 'ILLNESS') AND _ADTMY_S <= 0 AND TR01SDT IS NOT NULL
      then: '''Y'''
- name: _POSTFL
  type: str
  derivation:
    case:
    - when: str_contains(_VISIT_WU, 'ILLNESS')
      then: '''Y'''
    - when: _ADTMY_S > 0 AND TR01SDT IS NOT NULL AND ADT IS NOT NULL
      then: '''Y'''
- name: _PREFL_ADT
  type: date
  derivation:
    case:
    - when: _PREFL = 'Y'
      then: ADT
- name: _AVALN
  type: int
  derivation:
    case:
    - when: _MBSTRESC2 IS NOT NULL AND _MBSTRESC2 NOT IN ('')
      then: 1
    - when: (str_contains(_VISIT_WU, 'ILLNESS') OR str_contains(_VISIT_W, 'Uns')) AND (ADT IS NULL OR (TR01SDT IS NOT NULL AND ADT > TR01SDT))
      then: 1
    - otherwise: 0
- name: _AVALN2
  type: int
  derivation:
    case:
    - when: _MBSTRESC2 IS NOT NULL AND _MBSTRESC2 NOT IN ('')
      then: 1
    - otherwise: 0
- name: _ILLUNS
  type: int
  derivation:
    case:
    - when: str_contains(_VISIT_WU, 'ILLNESS') AND str_contains(_VISIT_W, 'Uns')
      then: 1
    - otherwise: 0
- name: _ISSTRESN
  type: int
  derivation:
    case:
    - when: _PREFL = 'Y' AND NOT str_contains(_VISIT_WU, 'ILLNESS') AND AVALC = 'Positive'
      then: 1
    - when: _PREFL = 'Y' AND NOT str_contains(_VISIT_WU, 'ILLNESS') AND AVALC = 'Negative'
      then: 2
    - otherwise: 9
- name: _UNS
  type: int
  derivation:
    case:
    - when: _POSTFL = 'Y' AND (str_contains(_VISIT_W, 'Uns') OR _VISIT_W IS NULL OR _VISIT_W IN ('') OR str_contains(_VISIT_W, 'Safe'))
      then: 1
    - when: _POSTFL = 'Y'
      then: 0
- name: _BASE_RN
  type: int
  derivation:
    row_number:
      window: BASE_W
- name: ABLFL
  type: str
  label: Baseline Record Flag
  derivation:
    case:
    - when: _BASE_RN = 1 AND _AVALN = 1 AND _PREFL = 'Y' AND TR01SDT IS NOT NULL
      then: '''Y'''
  submission:
    core: Perm
    mandatory: false
    length: 1
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: BASEC
  type: str
  label: Baseline Value (C)
  derivation:
    aggregate:
      filter: ABLFL = 'Y'
      group_by:
      - STUDYID
      - USUBJID
      - PARAMCD
      expr: ONLY(AVALC)
  submission:
    core: Perm
    mandatory: false
    length: 50
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: _SORT2_RN
  type: int
  derivation:
    row_number:
      window: SORT2_W
- name: _FIRST_ADT
  type: int
  derivation:
    row_number:
      window: FIRST_ADT_W
- name: _VISIT_PREV
  type: str
  derivation:
    row_value:
      source: _VISIT_W
      offset: -1
      window: SORT2_W
- name: _SCHEILL_DAY1_SRC
  type: str
  derivation:
    case:
    - when: _VISIT_W = 'Illness Visit Day 1'
      then: '''Illness Visit Day 1'''
- name: _SCHEILL_DAY1
  type: str
  derivation:
    locf:
      source: _SCHEILL_DAY1_SRC
      window: SORT2_W
- name: _SCHEILL_UPDATE
  type: str
  derivation:
    case:
    - when: NOT str_contains(_VISIT_W, 'Uns') AND NOT str_contains(_VISIT_W, 'Ill')
      then: ''''''
    - otherwise: _SCHEILL_DAY1
- name: _ILL_SET_PREV
  type: int
  derivation:
    row_value:
      source: _ILL_SET
      offset: -1
      window: SORT2_W
- name: _ILL_DAT_PREV
  type: date
  derivation:
    row_value:
      source: _ILL_DAT
      offset: -1
      window: SORT2_W
- name: _ILL_ADY_PREV
  type: int
  derivation:
    row_value:
      source: _ILL_ADY
      offset: -1
      window: SORT2_W
- name: _ILL_SET
  type: int
  derivation:
    case:
    - when: (_FIRST_ADT = 1 AND str_contains(_VISIT_WU, 'ILLNESS') AND str_contains(_VISIT_WU, 'DAY 1( |$)')) OR (_FIRST_ADT <> 1 AND _VISIT_W = 'Illness Visit Day 1' AND _VISIT_W <> _VISIT_PREV)
      then:
        case:
        - when: (_SCHEILL_DAY1 IS NULL) AND str_contains(_VISIT_WU, 'ILLNESS') AND _SORT2_RN = 1
          then: 0
        - when: (_SCHEILL_DAY1 IS NULL) AND str_contains(_VISIT_WU, 'ILLNESS')
          then: _ILL_SET_PREV
        - when: _SORT2_RN = 1
          then: 1
        - otherwise: _ILL_SET_PREV + 1
    - when: _SORT2_RN = 1
      then: 0
    - otherwise: _ILL_SET_PREV
- name: _ILL_DAT
  type: date
  derivation:
    case:
    - when: ((_FIRST_ADT = 1 AND str_contains(_VISIT_WU, 'ILLNESS') AND str_contains(_VISIT_WU, 'DAY 1( |$)')) OR (_FIRST_ADT <> 1 AND _VISIT_W = 'Illness Visit Day 1' AND _VISIT_W <> _VISIT_PREV)) AND ((_SCHEILL_DAY1 IS NULL) AND str_contains(_VISIT_WU, 'ILLNESS'))
      then: null
    - when: (_FIRST_ADT = 1 AND str_contains(_VISIT_WU, 'ILLNESS') AND str_contains(_VISIT_WU, 'DAY 1( |$)')) OR (_FIRST_ADT <> 1 AND _VISIT_W = 'Illness Visit Day 1' AND _VISIT_W <> _VISIT_PREV)
      then: ADT
    - otherwise: _ILL_DAT_PREV
- name: _ILL_ADY
  type: int
  derivation:
    case:
    - when: ((_FIRST_ADT = 1 AND str_contains(_VISIT_WU, 'ILLNESS') AND str_contains(_VISIT_WU, 'DAY 1( |$)')) OR (_FIRST_ADT <> 1 AND _VISIT_W = 'Illness Visit Day 1' AND _VISIT_W <> _VISIT_PREV)) AND ((_SCHEILL_DAY1 IS NULL) AND str_contains(_VISIT_WU, 'ILLNESS'))
      then: null
    - when: (_FIRST_ADT = 1 AND str_contains(_VISIT_WU, 'ILLNESS') AND str_contains(_VISIT_WU, 'DAY 1( |$)')) OR (_FIRST_ADT <> 1 AND _VISIT_W = 'Illness Visit Day 1' AND _VISIT_W <> _VISIT_PREV)
      then: ADY
    - otherwise: _ILL_ADY_PREV
- name: _ILL_DIFF
  type: int
  derivation:
    diff:
      type: date
      start: _ILL_DAT
      end: ADT
      unit: day
- name: _RETAIN_ILL_ADY
  type: int
  derivation:
    locf:
      source: _ILL_ADY
      window: SORT4_W
- name: _AVISIT_C
  type: str
  derivation:
    case:
    - when: ABLFL = 'Y'
      then: '''Baseline'''
    - when: _VISIT_WU = 'VISIT 1 DAY 1'
      then: '''Day 1'''
    - when: _VISIT_W = 'Illness Visit Day 1'
      then: '''Illness Visit Day 1'''
    - when: str_contains(_VISIT_WU, 'ILLNESS') AND NOT str_contains(_VISIT_W, 'Uns')
      then:
        str_template: Illness Visit Day {_DAY_TXT}
    - when: ADT IS NOT NULL AND (str_contains(_VISIT_WU, 'ILLNESS') OR str_contains(_VISIT_W, 'Uns')) AND _ILL_DIFF IS NOT NULL AND _ILL_DIFF >= 1 AND _ILL_DIFF <= 2
      then: '''Illness Visit Day 3'''
    - when: ADT IS NOT NULL AND (str_contains(_VISIT_WU, 'ILLNESS') OR str_contains(_VISIT_W, 'Uns')) AND _ILL_DIFF IS NOT NULL AND _ILL_DIFF >= 3 AND _ILL_DIFF <= 4
      then: '''Illness Visit Day 5'''
    - when: ADT IS NOT NULL AND (str_contains(_VISIT_WU, 'ILLNESS') OR str_contains(_VISIT_W, 'Uns')) AND _ILL_DIFF IS NOT NULL AND _ILL_DIFF >= 5 AND _ILL_DIFF <= 6
      then: '''Illness Visit Day 7'''
    - when: ADT IS NOT NULL AND (str_contains(_VISIT_WU, 'ILLNESS') OR str_contains(_VISIT_W, 'Uns')) AND _ILL_DIFF IS NOT NULL AND _ILL_DIFF >= 7 AND _ILL_DIFF <= 10
      then: '''Illness Visit Day 9'''
    - when: ADT IS NOT NULL AND (str_contains(_VISIT_WU, 'ILLNESS') OR str_contains(_VISIT_W, 'Uns')) AND _ILL_DIFF IS NOT NULL AND _ILL_DIFF >= 11 AND _ILL_DIFF <= 16
      then: '''Illness Visit Day 14'''
    - when: ADT IS NOT NULL AND (str_contains(_VISIT_WU, 'ILLNESS') OR str_contains(_VISIT_W, 'Uns')) AND _ILL_DIFF IS NOT NULL AND _ILL_DIFF >= 17 AND _ILL_DIFF <= 23
      then: '''Illness Visit Day 21'''
    - when: ADT IS NOT NULL AND (str_contains(_VISIT_WU, 'ILLNESS') OR str_contains(_VISIT_W, 'Uns')) AND _ILL_DIFF IS NOT NULL AND _ILL_DIFF >= 24 AND _ILL_DIFF <= 34
      then: '''Illness Visit Day 28'''
    - when: ADT IS NOT NULL AND _ILL_DAT IS NOT NULL AND ADT = _ILL_DAT AND str_contains(_VISIT, 'Illness')
      then:
        str_template: Illness Visit Day {_DAY_TXT}
    - when: ADT IS NOT NULL AND _POSTFL = 'Y' AND (str_contains(_VISIT_W, 'Uns') OR str_contains(_VISIT_W, 'Safe') OR str_contains(_VISIT_WU, 'ILLNESS'))
      then:
        case:
        - when: ADY IS NOT NULL AND ADY >= 2 AND ADY <= 36
          then: '''Day 29'''
        - otherwise: ''''''
    - when: ADT IS NOT NULL AND ADY IS NOT NULL AND ADY > 1 AND _POSTFL = 'Y' AND str_contains(_VISIT_WU, 'DAY')
      then:
        str_template: Day {_DAY_TXT}
- name: _AVISIT_C2
  type: str
  derivation:
    case:
    - when: ADT IS NOT NULL AND _ILL_DAT IS NOT NULL AND ADT = _ILL_DAT AND _SCHEILL_UPDATE IS NOT NULL AND _SCHEILL_UPDATE NOT IN ('')
      then: '''Illness Visit Day 1'''
    - otherwise: _AVISIT_C
- name: _AVISIT_D
  type: str
  derivation:
    case:
    - when: (_AVISIT_C2 IS NULL OR _AVISIT_C2 IN ('')) AND _POSTFL = 'Y' AND (str_contains(_VISIT_W, 'Uns') OR _VISIT_W IS NULL OR _VISIT_W IN ('') OR str_contains(_VISIT_W, 'Safe')) AND ADY IS NOT NULL AND ADY > 2 AND ADY <= 36
      then: '''Day 29'''
    - otherwise: _AVISIT_C2
- name: _AVISITN_D
  type: int
  derivation:
    case:
    - when: _AVISIT_D = 'Illness Visit Day 1'
      then: 101
    - when: _AVISIT_D = 'Illness Visit Day 3'
      then: 103
    - when: _AVISIT_D = 'Illness Visit Day 5'
      then: 105
    - when: _AVISIT_D = 'Illness Visit Day 7'
      then: 107
    - when: _AVISIT_D = 'Illness Visit Day 9'
      then: 109
    - when: _AVISIT_D = 'Illness Visit Day 14'
      then: 114
    - when: _AVISIT_D = 'Illness Visit Day 21'
      then: 121
    - when: _AVISIT_D = 'Illness Visit Day 28'
      then: 128
    - when: str_contains(_AVISIT_D, 'Illness')
      then: 100 * _ILL_SET + 1
    - when: _AVISIT_D = 'Baseline'
      then: 1
    - when: _AVISIT_D = 'Day 1'
      then: 2
    - when: _AVISIT_D = 'Day 29'
      then: 3
    - when: _AVISIT_D = 'Day 57'
      then: 4
    - when: _AVISIT_D = 'Day 119'
      then: 5
    - when: _AVISIT_D = 'Day 209'
      then: 6
    - when: _AVISIT_D = 'Day 394'
      then: 7
    - when: _AVISIT_D = 'Day 759'
      then: 8
- name: _AVISIT_D2
  type: str
  derivation:
    case:
    - when: _AVISITN_D IS NOT NULL AND _AVISITN_D NOT IN (1, 3) AND _AVISITN_D < 100
      then: null
    - otherwise: _AVISIT_D
- name: _AVISITN_D2
  type: int
  derivation:
    case:
    - when: _AVISITN_D IS NOT NULL AND _AVISITN_D NOT IN (1, 3) AND _AVISITN_D < 100
      then: null
    - otherwise: _AVISITN_D
- name: _ILL_SET_TXT
  type: str
  derivation:
    str_decimal:
      source: _ILL_SET
      decimals: 0
- name: _DAY_NUM_E
  type: str
  derivation:
    str_extract:
      source: _AVISIT_D2
      pattern: Day ([0-9]+)
      group: 1
      no_match: ''
- name: _SCAN3_E
  type: str
  derivation:
    str_extract:
      source: _AVISIT_D2
      pattern: ^(?:\S+\s+){2}(\S+)
      group: 1
      no_match: ''
- name: _AVISIT_E
  type: str
  derivation:
    case:
    - when: _ILL_SET > 1 AND str_contains(_AVISIT_D2, 'Illness') AND _SCAN3_E = 'Day' AND _SCHEILL_DAY1 IS NOT NULL
      then:
        str_template: Illness Visit {_ILL_SET_TXT} Day {_DAY_NUM_E}
    - otherwise: _AVISIT_D2
- name: _AVISITN_E
  type: int
  derivation:
    case:
    - when: _ILL_SET > 1 AND str_contains(_AVISIT_D2, 'Illness') AND _SCAN3_E = 'Day' AND _SCHEILL_DAY1 IS NOT NULL
      then: 100 * (_ILL_SET - 1) + _AVISITN_D2
    - otherwise: _AVISITN_D2
- name: _PREFIX
  type: str
  derivation:
    str_extract:
      source: _AVISIT_E
      pattern: ^(.*).{2}$
      group: 1
      no_match: ''
- name: _AVISIT_E_SP
  type: str
  derivation:
    str_template:
      template: '{_AVISIT_E} '
      missing: ' '
- name: _AWRANGE_E
  type: str
  derivation:
    case:
    - when: str_contains(_AVISIT_E, 'Illness') AND str_contains(_AVISIT_E_SP, 'Day 1 ')
      then: _AVISIT_E
    - when: str_contains(_AVISIT_E, 'Illness') AND str_contains(_AVISIT_E_SP, 'Day 3 ')
      then:
        str_template: '{_PREFIX} 2 - {_PREFIX} 3'
    - when: str_contains(_AVISIT_E, 'Illness') AND str_contains(_AVISIT_E_SP, 'Day 5 ')
      then:
        str_template: '{_PREFIX} 4 - {_PREFIX} 5'
    - when: str_contains(_AVISIT_E, 'Illness') AND str_contains(_AVISIT_E_SP, 'Day 7 ')
      then:
        str_template: '{_PREFIX} 6 - {_PREFIX} 7'
    - when: str_contains(_AVISIT_E, 'Illness') AND str_contains(_AVISIT_E_SP, 'Day 9 ')
      then:
        str_template: '{_PREFIX} 8 - {_PREFIX}11'
    - when: str_contains(_AVISIT_E, 'Illness') AND str_contains(_AVISIT_E_SP, 'Day 14 ')
      then:
        str_template: '{_PREFIX}12 - {_PREFIX}17'
    - when: str_contains(_AVISIT_E, 'Illness') AND str_contains(_AVISIT_E_SP, 'Day 21 ')
      then:
        str_template: '{_PREFIX}18 - {_PREFIX}24'
    - when: str_contains(_AVISIT_E, 'Illness') AND str_contains(_AVISIT_E_SP, 'Day 28 ')
      then:
        str_template: '{_PREFIX}25 - {_PREFIX}35'
    - when: _AVISIT_E = 'Baseline'
      then: '''<=1 Pre-dose'''
    - when: _AVISIT_E = 'Day 29'
      then: '''Day 2 - Day 36'''
- name: _AWRANGE_T1
  type: str
  derivation:
    str_replace:
      source: _AWRANGE_E
      pattern: Day1
      replacement: Day 1
- name: _AWRANGE_T2
  type: str
  derivation:
    str_replace:
      source: _AWRANGE_T1
      pattern: Day2
      replacement: Day 2
- name: _AWRANGE_T3
  type: str
  derivation:
    str_replace:
      source: _AWRANGE_T2
      pattern: Day3
      replacement: Day 3
- name: _AWTARGET_E
  type: int
  derivation:
    case:
    - when: _AVISITN_E = 101 AND _ILL_ADY IS NOT NULL
      then: _ILL_ADY
    - when: str_contains(_AWRANGE_E, 'Illness') AND str_contains(_AVISIT_E_SP, 'Day 1 ') AND _ILL_ADY IS NOT NULL
      then: _ILL_ADY
    - when: str_contains(_AWRANGE_E, 'Illness') AND str_contains(_AVISIT_E_SP, 'Day 3 ') AND _RETAIN_ILL_ADY IS NOT NULL
      then: _RETAIN_ILL_ADY + 2
    - when: str_contains(_AWRANGE_E, 'Illness') AND str_contains(_AVISIT_E_SP, 'Day 5 ') AND _RETAIN_ILL_ADY IS NOT NULL
      then: _RETAIN_ILL_ADY + 4
    - when: str_contains(_AWRANGE_E, 'Illness') AND str_contains(_AVISIT_E_SP, 'Day 7 ') AND _RETAIN_ILL_ADY IS NOT NULL
      then: _RETAIN_ILL_ADY + 6
    - when: str_contains(_AWRANGE_E, 'Illness') AND str_contains(_AVISIT_E_SP, 'Day 9 ') AND _RETAIN_ILL_ADY IS NOT NULL
      then: _RETAIN_ILL_ADY + 8
    - when: str_contains(_AWRANGE_E, 'Illness') AND str_contains(_AVISIT_E_SP, 'Day 14 ') AND _RETAIN_ILL_ADY IS NOT NULL
      then: _RETAIN_ILL_ADY + 13
    - when: str_contains(_AWRANGE_E, 'Illness') AND str_contains(_AVISIT_E_SP, 'Day 21 ') AND _RETAIN_ILL_ADY IS NOT NULL
      then: _RETAIN_ILL_ADY + 20
    - when: str_contains(_AWRANGE_E, 'Illness') AND str_contains(_AVISIT_E_SP, 'Day 28 ') AND _RETAIN_ILL_ADY IS NOT NULL
      then: _RETAIN_ILL_ADY + 27
    - when: _AVISIT_E = 'Baseline'
      then: 1
    - when: _AVISIT_E = 'Day 1'
      then: 1
    - when: _AVISIT_E = 'Day 29'
      then: 29
    - when: _AVISIT_E = 'Day 57'
      then: 57
    - when: _AVISIT_E = 'Day 119'
      then: 119
    - when: _AVISIT_E = 'Day 209'
      then: 209
    - when: _AVISIT_E = 'Day 394'
      then: 394
    - when: _AVISIT_E = 'Day 759'
      then: 759
- name: _AWTDIFF_E
  type: int
  derivation:
    case:
    - when: _AWTARGET_E IS NOT NULL AND ADY IS NOT NULL
      then: ABS(ADY - _AWTARGET_E)
- name: _AVISIT_F
  type: str
  derivation:
    case:
    - when: str_contains(_AVISIT_E, 'Illness') AND _AVISITN_E IS NOT NULL AND _AVISITN_E >= 100 AND _AVISITN_E < 200
      then: '''Illness Visit'''
    - when: str_contains(_AVISIT_E, 'Illness') AND _AVISITN_E IS NOT NULL AND _AVISITN_E > 200
      then:
        str_template: Illness Visit {_ILL_SET_TXT}
    - otherwise: _AVISIT_E
- name: _AVISITN_F
  type: int
  derivation:
    case:
    - when: str_contains(_AVISIT_E, 'Illness') AND _AVISITN_E IS NOT NULL AND _AVISITN_E >= 100 AND _AVISITN_E < 200
      then: 100
    - when: str_contains(_AVISIT_E, 'Illness') AND _AVISITN_E IS NOT NULL AND _AVISITN_E > 200
      then: 100 * _ILL_SET
    - otherwise: _AVISITN_E
- name: _DAY_NUM_H
  type: str
  derivation:
    str_extract:
      source: _AVISIT_E
      pattern: Day ([0-9]+)
      group: 1
      no_match: ''
- name: _ATPT_RAW
  type: str
  derivation:
    case:
    - when: str_contains(_AVISIT_F, 'Ill')
      then:
        str_template: Day {_DAY_NUM_H}
    - otherwise: ''''''
- name: ATPT
