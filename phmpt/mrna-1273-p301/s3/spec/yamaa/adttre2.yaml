# ADTTRE2 for Moderna mRNA-1273-P301, cut S3 (BLA Interim Analysis,
# cutoff 2021-03-26). Parent: ../../../spec/yamaa/base/adam-base-s3.yaml (which
# chains to ../../../spec/yamaa/base/adam-base.yaml; 86 shared + 59 S3-only ADSL
# columns). Derivations implement the S3 A60ADTTRE2 program (PDF,
# Bates 3820498-3820503): one row template per EVENTSEQ (1-4) over
# the per-subject ADEFF3 intermediate FILT (ANL01FL='Y', PARCAT1N=1,
# FASFL='Y'), grouped by (STUDYID, USUBJID); per-subject SUM over
# PPROTFL='Y' rows. Every subject with a SUM gets EVENTSEQ 1; higher
# sequences are added by SUM threshold (ES2 at Q1, ES3 at Median, ES4
# at Q3), and EVNTDESC is the subject's SUM-band label on every row.
# computed by the generator from the same ADEFF3 input; yamaa type 7
# would give Q3 77.75, bands identical for integer sums). Where the
# SAS code and the define disagree, the code is followed (see
# README.md). File order is authoritative over define order: the
# submitted file puts TRTSEQP/TRTSEQPN/TRTSEQA/TRTSEQAN/TRTSDT/TRTEDT
# before TR01SDT/TR01SDTM, while the define lists TR01SDT/TR01SDTM
# first; output columns follow the file.
# SAP note (closed 2026-11-24, no-impact): the file labelled "SAP v3"
# (19745_S68_M5_sap-v3.pdf) is the P201 SAP v3.0 (27 Oct 2020), not a
# P301 SAP version; the only P301 SAP in the set is v1.0 (10 Sep 2020).
# The case definitions below are the program's own, so the spec follows
# the program, not a SAP version.
# Keys: ADTTRE2 HAS a usable key: (STUDYID, USUBJID, PARAMCD, EVENTSEQ)
# is unique and non-missing on the submitted target, so verify.py can
# align this spec end to end; a single full run is attempted first
# (1,973 output rows, small inputs).
# Retain reading, resolved by the data: a PPROTFL='N' subject has no SUM
# row, so no EVENTSEQ branch fires and it produces no output rows; the
# target has exactly the 782 PPROTFL='Y' subjects, not ~868. The
# FASYMPFL='Y' guards on STARTVAL/AVAL never bite in this data (no
# sum>0 subject lacks a 'Y' first row, no sum=0 subject has one).
# MethodDef notes: the EVENTSEQ method omits the program's FASFL='Y'
# filter; the AVAL method says '0 < SUM <= Q1' for the EVENTSEQ 1 band
# while the program and the EVENTSEQ method say '< Q1' (program reading
# is data-proven: SUM=19 lands in [Q1, Median)); the STARTVAL method
# does not condition EVENTSEQ 2-4 on FASYMPFL='Y' (program does).
# STARTVAL is declared integer in the define but carries 1e-10 offsets,
# so it is typed float; AVAL/STARTVAL significant_digits 15, not the
# define's 10 / absent (data carry up to 13 significant digits).
# Honest gaps: none in the derivation.
yamaa: '1.0'
type: spec
model: ADaM
parent: ../../../spec/yamaa/base/adam-base-s3.yaml
domain: ADTTRE2
keys:
- STUDYID
- USUBJID
- PARAMCD
- EVENTSEQ
input:
  ADEFF3:
    path: <adam-dir>/adeff3.parquet
    key:
    - STUDYID
    - USUBJID
  ADSL:
    path: <adam-dir>/adsl.parquet
    key:
    - STUDYID
    - USUBJID
submission:
  label: Recurrent of Symptom Analysis Dataset
  class: BASIC DATA STRUCTURE
  structure: One record per subject per parameter per event occurrence
  repeating: true
rows:
- id: es1_rows
  dataset: FILT
  group_by: [FILT.STUDYID, FILT.USUBJID]
  derivations:
    STUDYID: FILT.STUDYID
    USUBJID: FILT.USUBJID
    PARAM: '''Total COVID-19 Symptoms Score'''
    PARAMCD: '''TOTSCORE'''
    _SUM:
      aggregate:
        filter: FILT.PPROTFL = 'Y'
        expr: SUM(FILT.AVAL)
    _ADT_Y:
      aggregate:
        filter: FILT.FASYMPFL = 'Y' AND FILT.ADT IS NOT NULL
        expr: MIN(FILT.ADT)
    _ADT_ALL:
      aggregate:
        filter: FILT.ADT IS NOT NULL
        expr: MIN(FILT.ADT)
    _FIRST_ADT:
      first_available: {sources: [_ADT_Y, _ADT_ALL]}
    _TR01SDT: ADSL_LK.TR01SDT
    _DTHDT: ADSL_LK.DTHDT
    _EOSDT: ADSL_LK.EOSDT
    _CUTOFFDT: ADSL_LK.CUTOFFDT
    _FIRST_EPOCH:
      to_epoch_day:
        source: _FIRST_ADT
    _TR01_EPOCH:
      to_epoch_day:
        source: _TR01SDT
    _DTHDT_EPOCH:
      to_epoch_day:
        source: _DTHDT
    _EOSDT_EPOCH:
      to_epoch_day:
        source: _EOSDT
    _CUTOFFDT_EPOCH:
      to_epoch_day:
        source: _CUTOFFDT
    _DAYS: _FIRST_EPOCH - _TR01_EPOCH
    _MIND_EPOCH:
      least: {sources: [_DTHDT_EPOCH, _EOSDT_EPOCH, _CUTOFFDT_EPOCH]}
    _Q1: 19.0
    _MED: 36.0
    _Q3: 78.0
    EVENTSEQ: 1
    CNSR:
      case:
      - when: _SUM = 0
        then: 1
      - otherwise: 0
    EVNTDESC:
      case:
      - when: _SUM = 0
        then: '''No symptom'''
      - when: 0 < _SUM AND _SUM < _Q1
        then: '''0 < Total COVID-19 Symptoms Score < Q1'''
      - when: _Q1 <= _SUM AND _SUM < _MED
        then: '''Q1 <= Total COVID-19 Symptoms Score < Median'''
      - when: _MED <= _SUM AND _SUM < _Q3
        then: '''Median <= Total COVID-19 Symptoms Score < Q3'''
      - otherwise: '''Q3 <= Total COVID-19 Symptoms Score'''
    STARTVAL: 0.0
    AVAL:
      case:
      - when: _SUM = 0
        then: _MIND_EPOCH - _TR01_EPOCH
      - when: _ADT_Y IS NOT NULL
        then: _DAYS
  filter: _SUM IS NOT NULL
