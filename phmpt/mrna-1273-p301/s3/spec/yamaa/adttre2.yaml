    _TR01SDT: ADSL_LK.TR01SDT
    _DTHDT: ADSL_LK.DTHDT
    _EOSDT: ADSL_LK.EOSDT
    _CUTOFFDT: ADSL_LK.CUTOFFDT
    _FIRST_EPOCH:
      to_epoch_day:
        source: _FIRST_ADT
    _TR01_EPOCH:
      to_epoch_day:
        source: _TR01SDT
    _DTHDT_EPOCH:
      to_epoch_day:
        source: _DTHDT
    _EOSDT_EPOCH:
      to_epoch_day:
        source: _EOSDT
    _CUTOFFDT_EPOCH:
      to_epoch_day:
        source: _CUTOFFDT
    _DAYS: _FIRST_EPOCH - _TR01_EPOCH
    _MIND_EPOCH:
      least: {sources: [_DTHDT_EPOCH, _EOSDT_EPOCH, _CUTOFFDT_EPOCH]}
    _Q1: 19.0
    _MED: 36.0
    _Q3: 78.0
    EVENTSEQ: 2
    CNSR: 0
    EVNTDESC:
      case:
      - when: _SUM = 0
        then: '''No symptom'''
      - when: 0 < _SUM AND _SUM < _Q1
        then: '''0 < Total COVID-19 Symptoms Score < Q1'''
      - when: _Q1 <= _SUM AND _SUM < _MED
        then: '''Q1 <= Total COVID-19 Symptoms Score < Median'''
      - when: _MED <= _SUM AND _SUM < _Q3
        then: '''Median <= Total COVID-19 Symptoms Score < Q3'''
      - otherwise: '''Q3 <= Total COVID-19 Symptoms Score'''
    STARTVAL:
      case:
      - when: _ADT_Y IS NOT NULL
        then: _DAYS
    AVAL:
      case:
      - when: _ADT_Y IS NOT NULL
        then: _DAYS + 0.0000000001
  filter: _SUM IS NOT NULL AND _Q1 <= _SUM
