intermediates:
- id: FAAE_F
  dataset: FAAE
  columns: [_STUDY, _USUBJID, _REF, _TP, _DUR]
  filter: FAAE.FATPTREF IS NOT NULL AND FAAE.FATPTREF NOT IN ('')
  derivations:
    _STUDY:
      type: str
      derivation: FAAE.STUDYID
    _USUBJID:
      type: str
      derivation: FAAE.USUBJID
    _REF:
      type: str
      derivation:
        case:
        - when: (FAAE.FATPTREF IS NOT NULL AND str_contains(FAAE.FATPTREF, 'DOSE 1'))
          then: '''Vaccination 1'''
        - otherwise: '''Vaccination 2'''
    _TP:
      type: str
      derivation: FAAE.FATPT
    _DUR:
      type: str
      derivation:
        case:
        - when: FAAE.FAOBJ = 'Underarm Gland Swelling or Tenderness' AND FAAE.FASTRESC IS NOT NULL AND FAAE.FASTRESC NOT IN ('NONE', '')
          then: '''LYMPHDUR'''
        - when: FAAE.FAOBJ = 'Pain' AND FAAE.FASTRESC IS NOT NULL AND FAAE.FASTRESC NOT IN ('NONE', '')
          then: '''PAINDUR'''
        - when: FAAE.FAOBJ = 'Headache' AND FAAE.FASTRESC IS NOT NULL AND FAAE.FASTRESC NOT IN ('NONE', '')
          then: '''HEADADUR'''
        - when: FAAE.FAOBJ = 'Fatigue' AND FAAE.FASTRESC IS NOT NULL AND FAAE.FASTRESC NOT IN ('NONE', '')
          then: '''FATIGDUR'''
        - when: FAAE.FAOBJ = 'Myalgia' AND FAAE.FASTRESC IS NOT NULL AND FAAE.FASTRESC NOT IN ('NONE', '')
          then: '''MYALGDUR'''
        - when: FAAE.FAOBJ = 'Arthralgia' AND FAAE.FASTRESC IS NOT NULL AND FAAE.FASTRESC NOT IN ('NONE', '')
          then: '''ARTHRDUR'''
        - when: FAAE.FAOBJ = 'Nausea/Vomiting' AND FAAE.FASTRESC IS NOT NULL AND FAAE.FASTRESC NOT IN ('NONE', '')
          then: '''NAUSEDUR'''
        - when: FAAE.FAOBJ = 'Chills' AND FAAE.FASTRESC IS NOT NULL AND FAAE.FASTRESC NOT IN ('NONE', '')
          then: '''CHILLDUR'''
        - when: FAAE.FAOBJ = 'Erythema' AND ((FAAE.FATEST = 'Longest Diameter' AND FAAE.FASTRESN >= 25) OR ((FAAE.FATEST IS NOT NULL AND str_contains(FAAE.FATEST, 'Intensity')) AND (FAAE.FASTRESC IS NOT NULL AND (str_contains(FAAE.FASTRESC, 'GRADE 1') OR str_contains(FAAE.FASTRESC, 'GRADE 2') OR str_contains(FAAE.FASTRESC, 'GRADE 3')))))
          then: '''ERYTHDUR'''
        - when: FAAE.FAOBJ = 'Swelling' AND ((FAAE.FATEST = 'Longest Diameter' AND FAAE.FASTRESN >= 25) OR ((FAAE.FATEST IS NOT NULL AND str_contains(FAAE.FATEST, 'Intensity')) AND (FAAE.FASTRESC IS NOT NULL AND (str_contains(FAAE.FASTRESC, 'GRADE 1') OR str_contains(FAAE.FASTRESC, 'GRADE 2') OR str_contains(FAAE.FASTRESC, 'GRADE 3')))))
          then: '''SWELLDUR'''
        - when: FAAE.FAOBJ IN ('Fever', 'Pyrexia') AND FAAE.FASTRESC IS NOT NULL AND (str_contains(FAAE.FASTRESC, 'GRADE 1') OR str_contains(FAAE.FASTRESC, 'GRADE 2') OR str_contains(FAAE.FASTRESC, 'GRADE 3') OR str_contains(FAAE.FASTRESC, 'GRADE 4'))
          then: '''FEVERDUR'''
        - otherwise: null
