# ADARSUM for Moderna mRNA-1273-P301, cut S3 (BLA Interim Analysis,
# cutoff 2021-03-26). Parent: ../../../spec/yamaa/base/adam-base-s3.yaml (which
# chains to ../../../spec/yamaa/base/adam-base.yaml; 86 shared + 59 S3-only ADSL
# columns). Derivations implement the S3 A30ADAR program: 28 grouped
# row templates over ADAR (11 symptom DURs, ANY/LOC/SYS, 11 symptom
# W picks, WSAR/WSLAR/WSSAR) plus 2 supplementary templates for the
# 4 dev2-only keys (1 SWELLDUR key from FAAE, 3 FEVERDUR keys from
# VS). DUR AVAL is the distinct-timepoint count with ATOXGRN>0 over
# ADAR (DAY 1-7) plus the dev2 sources (FAAE/VS DAY 8+, ADARP7D with
# ANL06FL='Y' and ATPTN>=8 for ANY/LOC/SYS); the dev1/dev2 sets are
# disjoint except FEVERDUR, where the FAAE and VS fever sets share 2
# timepoints, subtracted exactly via the FAF x VSF pair relation.
# W rows carry MAX(ATOXGRN) and the STR_JOIN worst AVALC pick; AVAL
# is null on all W rows and AVALC is '' on WSAR/WSLAR/WSSAR (ARDUR2).
# ANL01FL/ANL02FL are MIN(ATPTGR1N) aggregates over ADARP7D. The
# DOSE2FL filter drops 0 rows on S3 data (prototype-verified) and is
# kept for fidelity. Where the SAS code and the define.xml method
# text disagree, the code is followed (see the generator header). No
# honest gaps: the pandas prototype reproduced the submitted data
# exactly (0 mismatched cells) on all 1,068,202 rows. SAP v1 vs v3
# CLOSED as no-impact (2026-11-24); no S27-sequence file is read.
yamaa: '1.0'
type: spec
model: ADaM
parent: ../../../spec/yamaa/base/adam-base-s3.yaml
domain: ADARSUM
keys:
- STUDYID
- USUBJID
- ATPTREF
- PARAMCD
input:
  ADAR:
    path: <adam-dir>/adar.parquet
    key:
    - STUDYID
    - USUBJID
  ADARP7D:
    path: <adam-dir>/adarp7d.parquet
    key:
    - STUDYID
    - USUBJID
  FAAE: <sdtm-dir>/faae.parquet
  VS: <sdtm-dir>/vs.parquet
  ADSL:
    path: <adam-dir>/adsl.parquet
    key:
    - STUDYID
    - USUBJID
submission:
  label: Solicited AR Summary Analysis Dataset
  class: BASIC DATA STRUCTURE
  structure: One record per subject, per parameter, per analysis timepoint
  repeating: true
rows:
- id: dur_lymph
  dataset: ADAR
  group_by: [ADAR.STUDYID, ADAR.USUBJID, ADAR.ATPTREF, ADAR.PARAMCD]
  derivations:
    STUDYID: ADAR.STUDYID
    USUBJID: ADAR.USUBJID
    ATPTREF: ADAR.ATPTREF
    PARAMCD: '''LYMPHDUR'''
    _PCD: ADAR.PARAMCD
    _D: ADSL.DOSE2FL
    _ADSL: ADSL.USUBJID
    _C1:
      aggregate:
        filter: ADAR.ATOXGRN > 0
        expr: COUNT(ADAR.ATPTGR1)
        distinct: true
    _MAXGR: null
    _JOIN: null
    _ADAR_HIT: null
    _C2F_R: null
    _C2V_R: null
  filter: _PCD = 'LYMPH' AND _C1 IS NOT NULL AND _ADSL IS NOT NULL AND NOT ((_D IS NOT NULL AND _D = 'N') AND ATPTREF = 'Vaccination 2')
