- name: ATPTREF
  type: str
  label: 'Analysis Timepoint Reference'
  submission:
    core: Req
    mandatory: true
    length: 50
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: PARCAT1
  type: str
  label: 'Parameter Category 1'
  derivation:
    case:
    - when: PARAMCD IN ('LYMPHDUR', 'PAINDUR', 'ERYTHDUR', 'SWELLDUR', 'WLYMPH', 'WPAIN', 'WERYTH', 'WSWELL', 'WSLAR')
      then: '''LOCAL'''
    - when: PARAMCD IN ('HEADADUR', 'FATIGDUR', 'MYALGDUR', 'ARTHRDUR', 'NAUSEDUR', 'CHILLDUR', 'FEVERDUR', 'WHEAD', 'WFATIGUE', 'WMYALGIA', 'WARTHR', 'WNAUSEA', 'WCHILLS', 'WFEVER', 'WSSAR')
      then: '''SYSTEMIC'''
    - otherwise: "''"
  submission:
    core: Req
    mandatory: false
    length: 50
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: PARCAT1N
  type: float
  label: 'Parameter Category 1 (N)'
  derivation:
    case:
    - when: PARCAT1 = 'LOCAL'
      then: 1
    - when: PARCAT1 = 'SYSTEMIC'
      then: 2
    - otherwise: null
  submission:
    core: Req
    mandatory: false
    length: 8
    significant_digits: 15
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: PARAMCD
  type: str
  label: 'Parameter Code'
  submission:
    core: Req
    mandatory: true
    length: 8
    origins:
    - type: Assigned
    method: "Withheld from publication: the received define states this text."
- name: PARAM
  type: str
  label: 'Parameter'
  derivation:
    case:
    - when: PARAMCD = 'LYMPHDUR'
      then: '''Number of Days for Underarm Gland Swelling or Tenderness'''
    - when: PARAMCD = 'PAINDUR'
      then: '''Number of Days for Pain'''
    - when: PARAMCD = 'ERYTHDUR'
      then: '''Number of Days for Erythema'''
    - when: PARAMCD = 'SWELLDUR'
      then: '''Number of Days for Swelling'''
    - when: PARAMCD = 'HEADADUR'
      then: '''Number of Days for Headache'''
    - when: PARAMCD = 'FATIGDUR'
      then: '''Number of Days for Fatigue'''
    - when: PARAMCD = 'MYALGDUR'
      then: '''Number of Days for Myalgia'''
    - when: PARAMCD = 'ARTHRDUR'
      then: '''Number of Days for Arthralgia'''
    - when: PARAMCD = 'NAUSEDUR'
      then: '''Number of Days for Nausea'''
    - when: PARAMCD = 'CHILLDUR'
      then: '''Number of Days for Chills'''
    - when: PARAMCD = 'FEVERDUR'
      then: '''Number of Days for Fever'''
    - when: PARAMCD = 'ANYDUR'
      then: '''Number of Days for Any Solicited AR'''
    - when: PARAMCD = 'LOCDUR'
      then: '''Number of Days for Local Solicited AR'''
    - when: PARAMCD = 'SYSDUR'
      then: '''Number of Days for Systemic Solicited AR'''
    - when: PARAMCD = 'WLYMPH'
      then: '''Worst Analysis Toxicity Grade for Underarm Gland Swelling or Tenderness between Day 1 and Day 7'''
    - when: PARAMCD = 'WPAIN'
      then: '''Worst Analysis Toxicity Grade for Pain between Day 1 and Day 7'''
    - when: PARAMCD = 'WERYTH'
      then: '''Worst Analysis Toxicity Grade for Erythema between Day 1 and Day 7'''
    - when: PARAMCD = 'WSWELL'
      then: '''Worst Analysis Toxicity Grade for Swelling between Day 1 and Day 7'''
    - when: PARAMCD = 'WHEAD'
      then: '''Worst Analysis Toxicity Grade for Headache between Day 1 and Day 7'''
    - when: PARAMCD = 'WFATIGUE'
      then: '''Worst Analysis Toxicity Grade for Fatigue between Day 1 and Day 7'''
    - when: PARAMCD = 'WMYALGIA'
      then: '''Worst Analysis Toxicity Grade for Myalgia between Day 1 and Day 7'''
    - when: PARAMCD = 'WARTHR'
      then: '''Worst Analysis Toxicity Grade for Arthralgia between Day 1 and Day 7'''
    - when: PARAMCD = 'WNAUSEA'
      then: '''Worst Analysis Toxicity Grade for Nausea between Day 1 and Day 7'''
    - when: PARAMCD = 'WCHILLS'
      then: '''Worst Analysis Toxicity Grade for Chills between Day 1 and Day 7'''
    - when: PARAMCD = 'WFEVER'
      then: '''Worst Analysis Toxicity Grade for Fever between Day 1 and Day 7'''
    - when: PARAMCD = 'WSAR'
      then: '''Worst Analysis Toxicity Grade for Any Solicited AR between Day 1 and Day 7'''
    - when: PARAMCD = 'WSLAR'
      then: '''Worst Analysis Toxicity Grade for Any Solicited Local AR between Day 1 and Day 7'''
    - when: PARAMCD = 'WSSAR'
      then: '''Worst Analysis Toxicity Grade for Any Solicited Systemic AR between Day 1 and Day 7'''
    - otherwise: null
  submission:
    core: Req
    mandatory: true
    length: 200
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: AVAL
  type: float
  label: 'Analysis Value'
  derivation:
    case:
    - when: PARAMCD IN ('WLYMPH', 'WPAIN', 'WERYTH', 'WSWELL', 'WHEAD', 'WFATIGUE', 'WMYALGIA', 'WARTHR', 'WNAUSEA', 'WCHILLS', 'WFEVER', 'WSAR', 'WSLAR', 'WSSAR')
      then: null
    - when: PARAMCD = 'FEVERDUR'
      then: _C1N + _C2F_FEVER_N + _C2VN - _OVN
    - when: PARAMCD = 'ANYDUR'
      then: _C1N + _C2P7D_ANY_N
    - when: PARAMCD = 'LOCDUR'
      then: _C1N + _C2P7D_LOC_N
    - when: PARAMCD = 'SYSDUR'
      then: _C1N + _C2P7D_SYS_N
    - when: PARAMCD IN ('ERYTHDUR', 'SWELLDUR')
      then: _C1N + _C2F_DIAM_N
    - otherwise: _C1N + _C2F_PLAIN_N
  submission:
    core: Req
    mandatory: false
    length: 8
    significant_digits: 15
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: AVALC
  type: str
  label: 'Analysis Value (C)'
  derivation:
