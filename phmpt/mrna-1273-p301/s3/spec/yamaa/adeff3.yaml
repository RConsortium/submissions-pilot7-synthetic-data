# ADEFF3 for Moderna mRNA-1273-P301, cut S3 (BLA Interim Analysis,
# cutoff 2021-03-26). Parent: ../../../spec/yamaa/base/adam-base-s3.yaml (which
# chains to ../../../spec/yamaa/base/adam-base.yaml; 86 shared + 59 S3-only ADSL
# columns). Derivations implement the S3 A50ADEFF3 program: VS rows
# (VSSCAT COVID-19, OXYSAT/TEMP) and FAEF rows (FACAT EFFICACY,
# FASCAT COVID-19) on or after the subject's COVIDADT (first
# ADEFF COVIDA ADT, APERIOD 1, ADT <= EFFCODT), with HOSPFL,
# AGAPFL, ANL01FL and FASYMPFL per the define's per-subject rules.
# SAP note (closed 2026-11-24, no-impact): the file labelled "SAP v3"
# (19745_S68_M5_sap-v3.pdf) is the P201 SAP v3.0 (27 Oct 2020), not a
# P301 SAP version; the only P301 SAP in the set is v1.0 (10 Sep 2020).
# The case definitions below are the program's own, so the spec follows
# the program, not a SAP version. Keys: ADEFF3 HAS a usable non-missing unique key
# (STUDYID, USUBJID, PARAMCD, ADT, SRCSEQ), unique on all 307,100
# rows, so verify.py can align this spec end to end (unlike ADEFF).
# HOSPFL/AGAPFL: the spec implements the define's per-subject rules,
# not a literal retain reading of the program (a literal reading
# leaks across subjects: HOSPFL Y for 3,736 subjects vs 47 in the
# target, AGAPFL Y for 16,055 pairs vs 538; the per-subject readings
# match the target exactly). Honest gaps: none in the derivation.
# The single blank-FADTC FAEF row drops under both readings (its
# stale ADT 2020-11-06 precedes its subject's COVIDADT), so
# to_date-null is exactly equivalent here. SRCDOM is 'FA' for FAEF
# rows (program sets DOMAIN; the define method text says 'FAEF').
# Split verification (session 56, 2026-11-23): the UNCHANGED spec was run
# end to end in 4 SEX x AGE (<=55/>55) partitions via verify.py -- EXACT
# MATCH (strict, 307,100x114, 0 mismatches), identical to the pruned-group
# baseline (see verify_report_s3_split.json). The roomier-cell full-spec
# re-run is no longer owed -- the split verification is the full-spec proof
# (same spec, same engine, same comparison rules, every row verified in
# exactly one partition).
yamaa: '1.0'
type: spec
model: ADaM
parent: ../../../spec/yamaa/base/adam-base-s3.yaml
domain: ADEFF3
keys:
- STUDYID
- USUBJID
- PARAMCD
- ADT
- SRCSEQ
input:
  VS: <sdtm-dir>/vs.parquet
  FAEF: <sdtm-dir>/faef.parquet
  HO: <sdtm-dir>/ho.parquet
  ADEFF:
    path: <adam-dir>/adeff.parquet
    key:
    - STUDYID
    - USUBJID
    - SUBJID
  ADSL:
    path: <adam-dir>/adsl.parquet
    key:
    - STUDYID
    - USUBJID
submission:
  label: Symptom Score Analysis Dataset
  class: BASIC DATA STRUCTURE
  structure: One record per subject, per parameter, per analysis date
  repeating: true
rows:
- id: vs_rows
  dataset: VS
  derivations:
    STUDYID: VS.STUDYID
    USUBJID: VS.USUBJID
    _USUBJID: USUBJID
    _DTC: VS.VSDTC
    _PARAM_RAW:
      str_template:
        template: '{VS.VSTEST} ({VS.VSSTRESU})'
        missing: ''
    _SRCSEQ: VS.VSSEQ
    _SRC: '''VS'''
    _SRCVAR: '''VSSTRESN'''
    _ADT:
      to_date:
        source: _DTC
    _ADT_EPOCH:
      to_epoch_day:
        source: _ADT
    _COVIDADT: COVIDADT_LK._COVIDADT
    _COVIDADT_EPOCH:
      to_epoch_day:
        source: _COVIDADT
    _ARELTPTN: _ADT_EPOCH - _COVIDADT_EPOCH + 1
    _STRESN:
      value: VS.VSSTRESN
      unconvertible: null
    _AVALC_T: "''"
    _AVAL_T: _STRESN
  filter: VS.VSSCAT = 'COVID-19' AND VS.VSTESTCD IN ('OXYSAT', 'TEMP') AND (VS.VSSTAT IS NULL OR VS.VSSTAT <> 'NOT DONE') AND _ADSL IS NOT NULL AND _ARELTPTN IS NOT NULL AND _ARELTPTN >= 1
- id: faef_rows
  dataset: FAEF
  derivations:
    STUDYID: FAEF.STUDYID
    USUBJID: FAEF.USUBJID
    _USUBJID: USUBJID
    _DTC: FAEF.FADTC
    _PARAM_RAW:
      case:
      - when: FAEF.FAOBJ = 'Myalgia'
        then: '''Muscle Aches (Myalgia)'''
      - when: FAEF.FAOBJ = 'Rhinorrhea'
        then: '''Runny Nose (Rhinorrhea)'''
      - otherwise: FAEF.FAOBJ
    _SRCSEQ: FAEF.FASEQ
    _SRC: '''FA'''
    _SRCVAR: '''FASTRESC'''
    _ADT:
      to_date:
        source: _DTC
    _ADT_EPOCH:
      to_epoch_day:
        source: _ADT
    _COVIDADT: COVIDADT_LK._COVIDADT
    _COVIDADT_EPOCH:
      to_epoch_day:
        source: _COVIDADT
    _ARELTPTN: _ADT_EPOCH - _COVIDADT_EPOCH + 1
    _STRESN: null
    _AVALC_T: FAEF.FASTRESC
    _AVAL_T:
      case:
      - when: FAEF.FASTRESC = 'NONE'
        then: 0.0
      - when: FAEF.FASTRESC = 'MILD'
        then: 1.0
      - when: FAEF.FASTRESC = 'MODERATE'
        then: 2.0
      - when: FAEF.FASTRESC = 'SEVERE'
        then: 3.0
  filter: FAEF.FACAT = 'EFFICACY' AND FAEF.FASCAT = 'COVID-19' AND FAEF.FAOBJ IN ('Body Aches', 'Chills', 'Cough', 'Diarrhea', 'Difficulty Breathing', 'Fatigue', 'Headache', 'Myalgia', 'Nasal Congestion', 'Nausea', 'New Loss of Smell', 'New Loss of Taste', 'Rhinorrhea', 'Shortness of Breath', 'Sore Throat', 'Vomiting') AND (FAEF.FASTAT IS NULL OR FAEF.FASTAT <> 'NOT DONE') AND _ADSL IS NOT NULL AND _ARELTPTN IS NOT NULL AND _ARELTPTN >= 1
intermediates:
- id: COVIDADT_LK
  dataset: ADEFF
  key:
  - USUBJID
  filter: ADEFF.PARAMCD = 'COVIDA' AND ADEFF.APERIOD = 1 AND ADEFF.ADT IS NOT NULL AND ADEFF.ADT <= ADEFF.EFFCODT
  order_by:
  - ADEFF.ADT
  - ADEFF.ADY
  keep: first
  derivations:
    _COVIDADT:
      type: date
      derivation: ADEFF.ADT
- id: HO_CAND
  dataset: HO
  filter: HO.HOOCCUR = 'Y' AND HO.HOTERM IN ('HOSPITAL', 'ADMITTED TO ICU') AND HO.HOSTDTC IS NOT NULL AND HO.HOSTDTC NOT IN ('')
  columns:
  - _USUBJID
  - _HOSTDT
  - _HOSTDT_EPOCH
  - _COVIDADT_EPOCH
  - _QUAL
  derivations:
    _USUBJID:
      type: str
      derivation:
        str_template:
          template: '{HO.USUBJID}'
          missing: ''
    _HOSTDT:
      type: date
      derivation:
        to_date:
          source: HO.HOSTDTC
    _HOSTDT_EPOCH:
      type: int
      derivation:
        to_epoch_day:
          source: _HOSTDT
    _COVIDADT_EPOCH:
      type: int
      derivation:
        to_epoch_day:
          source: COVIDADT_LK._COVIDADT
    _QUAL:
      type: int
      derivation:
        case:
        - when: _COVIDADT_EPOCH IS NOT NULL AND _COVIDADT_EPOCH <= _HOSTDT_EPOCH
          then: 1
        - otherwise: 0
- id: HO_LK
  dataset: HO_CAND
  key:
  - _USUBJID
  filter: HO_CAND._QUAL = 1
  order_by:
  - HO_CAND._HOSTDT
  keep: first
  derivations:
    _HOSPFL:
      type: str
      derivation: '''Y'''
- id: FIRST_SYMP
  dataset: SELF
  key:
  - USUBJID
  filter: SELF.PARAMCD NOT IN ('TEMP', 'OXYSAT') AND SELF.AVAL > 0
  order_by:
  - SELF.ADT
  keep: first
  derivations:
    _FIRST_ADT:
      type: date
      derivation: SELF.ADT
windows:
  GAP_W:
    group_by:
    - USUBJID
    order_by:
    - ADT
    - PARAMCD
    - SRCSEQ
