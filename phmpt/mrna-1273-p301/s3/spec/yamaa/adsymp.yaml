- name: APERIOD
  type: int
  label: Period
  derivation:
    case:
    - when: ADSL.AP02SDT IS NOT NULL AND ((ASTDT IS NOT NULL AND ADSL.AP02SDT <= ASTDT) OR (ASTDT IS NULL AND ADSL.AP02SDT <= ADT))
      then: 2
    - otherwise: 1
  submission:
    core: Perm
    mandatory: false
    length: 8
    display_format: '3.'
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: AVISIT
  type: str
  label: Analysis Visit
  derivation:
    case:
    - when: ATPT IS NOT NULL AND _NUM = 1
      then: '''Illness Visit'''
    - when: ATPT IS NOT NULL
      then:
        str_template:
          template: 'Illness Visit {_NUM_STR}'
          missing: ''
    - otherwise: "''"
  submission:
    core: Perm
    mandatory: false
    length: 50
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: AVISITN
