# ADSYMP for Moderna mRNA-1273-P301, cut S3 (BLA Interim Analysis,
# cutoff 2021-03-26). Parent: ../../../spec/yamaa/base/adam-base-s3.yaml (which
# chains to ../../../spec/yamaa/base/adam-base.yaml; 86 shared + 59 S3-only ADSL
# columns). Derivations implement the S3 A20ADSY program: VS rows
# (OXYSAT<=93 / TEMP>=38C), FAEF rows (FACAT EFFICACY), PR rows
# (PRCAT EFFICACY, PROCCUR present), HO rows (ICU admissions), each
# inner-joined to the verified ADSL on USUBJID, with ASEQ assigned
# per subject by the SAS sort (parcat1, paramcd, avisitn, adt, srcseq).
# Where the SAS code and the define.xml method text disagree, the
# code is followed (see README.md). Honest gaps: none. The spec
# verifies EXACT MATCH in four pruned dependency-closure groups
# (G1-G3 ADSL chunks, G4 derived columns): 0 mismatches, 0
# within-tolerance cells, 0 space-only cells on all 111 non-key
# columns; the full verify.py run OOMs in this 6 GB cell. Split-by-
# subject full-spec verification (session 50, 2026-11-23): 4-way
# SEX x age (<=55/>55), unchanged spec, EXACT MATCH strict,
# 0 mismatches on all 111 non-key columns, per-column identical
# to the pruned-group baseline (see verify_report_s3_split.json);
# the roomier-cell full-spec re-run is no longer owed.
yamaa: '1.0'
type: spec
model: ADaM
parent: ../../../spec/yamaa/base/adam-base-s3.yaml
domain: ADSYMP
keys:
- STUDYID
- USUBJID
- ASEQ
input:
  VS: <sdtm-dir>/vs.parquet
  FAEF: <sdtm-dir>/faef.parquet
  SUPPFAEF: <sdtm-dir>/suppfaef.parquet
  PR: <sdtm-dir>/pr.parquet
  HO: <sdtm-dir>/ho.parquet
  ADSL:
    path: <adam-dir>/adsl.parquet
    key:
    - STUDYID
    - USUBJID
submission:
  label: COVID-19 Symptom Analysis Dataset
  class: BASIC DATA STRUCTURE
  structure: One record per subject, per parameter, per analysis timepoint
  repeating: true
rows:
- id: vs_rows
  dataset: VS
  derivations:
    STUDYID: VS.STUDYID
    USUBJID: VS.USUBJID
    _ADTC: VS.VSDTC
    _ASTDTC: null
    _AENDTC: null
    _PARAM_RAW:
      case:
      - when: VS.VSTESTCD = 'OXYSAT'
        then: '''O2 Saturation <=93%'''
      - when: VS.VSTESTCD = 'TEMP'
        then: '''Fever'''
    _AVALC: '''Y'''
    _SEV: null
    _PARCAT1_RAW: VS.VSSCAT
    _ATPT: VS.VSTPT
    _LNKID: VS.VSSPID
    _SRCSEQ: VS.VSSEQ
    _SRC: '''VS'''
    _FASEQ: null
    _STRESN:
      value: VS.VSSTRESN
      unconvertible: null
  filter: VS.VSSCAT = 'COVID-19' AND VS.VSTESTCD IN ('OXYSAT', 'TEMP') AND (VS.VSSTAT IS NULL OR VS.VSSTAT <> 'NOT DONE') AND ((VS.VSTESTCD = 'OXYSAT' AND _STRESN IS NOT NULL AND _STRESN <= 93) OR (VS.VSTESTCD = 'TEMP' AND _STRESN IS NOT NULL AND _STRESN >= 38 AND VS.VSSTRESU = 'C')) AND _ADSL IS NOT NULL
- id: faef_rows
  dataset: FAEF
  derivations:
    STUDYID: FAEF.STUDYID
    USUBJID: FAEF.USUBJID
    _ADTC: FAEF.FADTC
    _ASTDTC: SUPP_P.FAEVDTC
    _AENDTC: FAEF.FAENDTC
    _PARAM_RAW:
      case:
      - when: FAEF.FAOBJ = 'Evidence of Shock Requires Vasopressors'
        then: '''Vasopressors Required'''
      - when: FAEF.FAOBJ = 'Myalgia'
        then: '''Muscle Aches (Myalgia)'''
      - when: FAEF.FAOBJ = 'Rhinorrhea'
        then: '''Runny Nose (Rhinorrhea)'''
      - otherwise: FAEF.FAOBJ
    _AVALC:
      case:
      - when: FAEF.FASCAT = 'COVID-19' AND FAEF.FASTRESC IN ('MILD', 'MODERATE', 'SEVERE')
        then: '''Y'''
      - when: FAEF.FASCAT = 'COVID-19' AND FAEF.FASTRESC = 'NONE'
        then: '''N'''
      - otherwise: FAEF.FASTRESC
    _SEV:
      case:
      - when: FAEF.FASCAT = 'COVID-19' AND FAEF.FASTRESC IN ('MILD', 'MODERATE', 'SEVERE')
        then: FAEF.FASTRESC
    _PARCAT1_RAW: FAEF.FASCAT
    _ATPT: FAEF.FATPT
    _LNKID: FAEF.FASPID
    _SRCSEQ: FAEF.FASEQ
    _SRC: '''FA'''
    _FASEQ: FAEF.FASEQ
    _STRESN: null
  filter: FAEF.FACAT = 'EFFICACY' AND (FAEF.FASTAT IS NULL OR FAEF.FASTAT <> 'NOT DONE') AND _ADSL IS NOT NULL
- id: pr_rows
  dataset: PR
  derivations:
    STUDYID: PR.STUDYID
    USUBJID: PR.USUBJID
    _ADTC: null
    _ASTDTC: PR.PRSTDTC
    _AENDTC: PR.PRENDTC
    _PARAM_RAW:
      case:
      - when: PR.PRTRT = 'HIGH-FLOW OXYGEN'
        then: '''High-Flow Oxygen'''
      - when: PR.PRTRT = 'MECHANICAL VENTILATION'
        then: '''Mechanical Ventilation'''
      - when: PR.PRTRT = 'NON-INVASIVE VENTILATION'
        then: '''Non-Invasive Ventilation'''
      - otherwise: PR.PRTRT
    _AVALC: PR.PROCCUR
    _SEV: null
    _PARCAT1_RAW: PR.PRSCAT
    _ATPT: null
    _LNKID: PR.PRLNKID
    _SRCSEQ: PR.PRSEQ
    _SRC: '''PR'''
    _FASEQ: null
    _STRESN: null
  filter: PR.PRCAT = 'EFFICACY' AND (PR.PRSTAT IS NULL OR PR.PRSTAT <> 'NOT DONE') AND PR.PROCCUR IS NOT NULL AND PR.PROCCUR NOT IN ('') AND _ADSL IS NOT NULL
- id: ho_rows
  dataset: HO
  derivations:
    STUDYID: HO.STUDYID
    USUBJID: HO.USUBJID
    _ADTC: HO.HODTC
    _ASTDTC: HO.HOSTDTC
    _AENDTC: HO.HOENDTC
    _PARAM_RAW: '''Admission to an intensive care unit due to SARS-CoV-2'''
    _AVALC: HO.HOOCCUR
    _SEV: null
    _PARCAT1_RAW: '''COVID-19 SEVERITY'''
    _ATPT: null
    _LNKID: HO.HOSPID
    _SRCSEQ: HO.HOSEQ
    _SRC: '''HO'''
    _FASEQ: null
    _STRESN: null
  filter: HO.HOCAT = 'EFFICACY' AND HO.HOTERM = 'ADMITTED TO ICU' AND HO.HOOCCUR IS NOT NULL AND HO.HOOCCUR NOT IN ('') AND _ADSL IS NOT NULL
intermediates:
- id: SUPP_P
  dataset: SUPPFAEF
  key:
    STUDYID: STUDYID
    USUBJID: USUBJID
    IDVARVAL:
      str_decimal:
        source: _FASEQ
        decimals: 0
  filter: SUPPFAEF.QNAM = 'FAEVDTC' AND SUPPFAEF.IDVAR = 'FASEQ'
  pivot:
    name: QNAM
    value: QVAL
    fields:
    - FAEVDTC
windows:
  NUM_W:
    group_by:
    - USUBJID
    - PARAMCD
    - ATPT
    order_by:
    - variable: ADT
      nulls: first
    - SRCSEQ
  ASEQ_W:
    group_by:
    - USUBJID
    order_by:
    - PARCAT1
    - PARAMCD
    - variable: AVISITN
      nulls: first
    - variable: ADT
      nulls: first
    - SRCSEQ
