    length: 100
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: ATOXGR
  type: str
  label: 'Analysis Toxicity Grade'
  derivation:
    case:
    - when: ATOXGRN = 0
      then: '''Grade 0'''
    - when: ATOXGRN = 1
      then: '''Grade 1'''
    - when: ATOXGRN = 2
      then: '''Grade 2'''
    - when: ATOXGRN = 3
      then: '''Grade 3'''
    - when: ATOXGRN = 4
      then: '''Grade 4'''
    - otherwise: "''"
  submission:
    core: Perm
    mandatory: false
    length: 20
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: ATOXGRN
  type: int
  label: 'Analysis Toxicity Grade (N)'
  derivation:
    case:
    - when: PARAMCD IN ('ERYTHDIA', 'SWELLDIA') AND ((AVAL IS NOT NULL AND AVAL < 25) OR (_STRESC IS NOT NULL AND str_contains(_STRESC, 'GRADE 0')))
      then: 0
    - when: PARAMCD IN ('ERYTHDIA', 'SWELLDIA') AND ((AVAL >= 25 AND AVAL <= 50) OR (_STRESC IS NOT NULL AND str_contains(_STRESC, 'GRADE 1')))
      then: 1
    - when: PARAMCD IN ('ERYTHDIA', 'SWELLDIA') AND ((AVAL > 50 AND AVAL <= 100) OR (_STRESC IS NOT NULL AND str_contains(_STRESC, 'GRADE 2')))
      then: 2
    - when: PARAMCD IN ('ERYTHDIA', 'SWELLDIA') AND ((AVAL > 100) OR (_STRESC IS NOT NULL AND str_contains(_STRESC, 'GRADE 3')))
      then: 3
    - when: PARAMCD IN ('ERYTHDIA', 'SWELLDIA') AND (_STRESC IS NOT NULL AND str_contains(_STRESC, 'GRADE 4'))
      then: 4
    - when: PARAMCD IN ('FEVER') AND ((AVAL IS NOT NULL AND AVAL < 38) OR (_STRESC IS NOT NULL AND str_contains(_STRESC, 'GRADE 0')))
      then: 0
    - when: PARAMCD IN ('FEVER') AND ((AVAL >= 38 AND AVAL <= 38.4) OR (_STRESC IS NOT NULL AND str_contains(_STRESC, 'GRADE 1')))
      then: 1
    - when: PARAMCD IN ('FEVER') AND ((AVAL > 38.4 AND AVAL <= 38.9) OR (_STRESC IS NOT NULL AND str_contains(_STRESC, 'GRADE 2')))
      then: 2
    - when: PARAMCD IN ('FEVER') AND ((AVAL > 38.9 AND AVAL <= 40) OR (_STRESC IS NOT NULL AND str_contains(_STRESC, 'GRADE 3')))
      then: 3
    - when: PARAMCD IN ('FEVER') AND ((AVAL > 40) OR (_STRESC IS NOT NULL AND str_contains(_STRESC, 'GRADE 4')))
      then: 4
    - when: PARAMCD IN ('PAIN', 'LYMPH', 'HEADACHE') AND (_STRESC_U = 'NONE' OR (_STRESC IS NOT NULL AND str_contains(_STRESC, 'GRADE 0')))
      then: 0
    - when: PARAMCD IN ('PAIN', 'LYMPH', 'HEADACHE') AND (_STRESC_U IN ('DOES NOT INTERFERE WITH ACTIVITY', 'NO INTERFERENCE WITH ACTIVITY') OR (_STRESC IS NOT NULL AND str_contains(_STRESC, 'GRADE 1')))
      then: 1
    - when: PARAMCD IN ('PAIN', 'LYMPH', 'HEADACHE') AND ((_STRESC_U IS NOT NULL AND str_contains(_STRESC_U, 'REPEATED')) OR (_STRESC IS NOT NULL AND str_contains(_STRESC, 'GRADE 2')))
      then: 2
    - when: PARAMCD IN ('PAIN', 'LYMPH', 'HEADACHE') AND (_STRESC_U IN ('ANY USE OF PRESCRIPTION RELIEVER OR PREVENTS DAILY ACTIVITY', 'ANY USE OF PRESCRIPTION PAIN RELIEVER OR PREVENTS DAILY ACTIVITY') OR (_STRESC IS NOT NULL AND str_contains(_STRESC, 'GRADE 3')))
      then: 3
    - when: PARAMCD IN ('PAIN', 'LYMPH', 'HEADACHE') AND (_STRESC IS NOT NULL AND str_contains(_STRESC, 'GRADE 4'))
      then: 4
    - when: PARAMCD IN ('FATIGUE', 'MYALGIA', 'ARTHRALG') AND (_STRESC_U = 'NONE' OR (_STRESC IS NOT NULL AND str_contains(_STRESC, 'GRADE 0')))
      then: 0
    - when: PARAMCD IN ('FATIGUE', 'MYALGIA', 'ARTHRALG') AND (_STRESC_U = 'NO INTERFERENCE WITH ACTIVITY' OR (_STRESC IS NOT NULL AND str_contains(_STRESC, 'GRADE 1')))
      then: 1
    - when: PARAMCD IN ('FATIGUE', 'MYALGIA', 'ARTHRALG') AND (_STRESC_U = 'SOME INTERFERENCE WITH ACTIVITY' OR (_STRESC IS NOT NULL AND str_contains(_STRESC, 'GRADE 2')))
      then: 2
    - when: PARAMCD IN ('FATIGUE', 'MYALGIA', 'ARTHRALG') AND (_STRESC_U = 'SIGNIFICANT; PREVENTS DAILY ACTIVITY' OR (_STRESC IS NOT NULL AND str_contains(_STRESC, 'GRADE 3')))
      then: 3
    - when: PARAMCD IN ('FATIGUE', 'MYALGIA', 'ARTHRALG') AND (_STRESC IS NOT NULL AND str_contains(_STRESC, 'GRADE 4'))
      then: 4
    - when: PARAMCD IN ('NAUSEA') AND (_STRESC_U = 'NONE' OR (_STRESC IS NOT NULL AND str_contains(_STRESC, 'GRADE 0')))
      then: 0
    - when: PARAMCD IN ('NAUSEA') AND (_STRESC_U = 'NO INTERFERENCE WITH ACTIVITY OR 1-2 EPISODES/24 HOURS' OR (_STRESC IS NOT NULL AND str_contains(_STRESC, 'GRADE 1')))
      then: 1
    - when: PARAMCD IN ('NAUSEA') AND (_STRESC_U = 'SOME INTERFERENCE WITH ACTIVITY OR >2 EPISODES/24 HOURS' OR (_STRESC IS NOT NULL AND str_contains(_STRESC, 'GRADE 2')))
      then: 2
    - when: PARAMCD IN ('NAUSEA') AND (_STRESC_U = 'PREVENTS DAILY ACTIVITY, REQUIRES OUTPATIENT IV HYDRATION' OR (_STRESC IS NOT NULL AND str_contains(_STRESC, 'GRADE 3')))
      then: 3
    - when: PARAMCD IN ('NAUSEA') AND (_STRESC IS NOT NULL AND str_contains(_STRESC, 'GRADE 4'))
      then: 4
    - when: PARAMCD IN ('CHILLS') AND (_STRESC_U = 'NONE' OR (_STRESC IS NOT NULL AND str_contains(_STRESC, 'GRADE 0')))
      then: 0
    - when: PARAMCD IN ('CHILLS') AND (_STRESC_U = 'NO INTERFERENCE WITH ACTIVITY' OR (_STRESC IS NOT NULL AND str_contains(_STRESC, 'GRADE 1')))
      then: 1
    - when: PARAMCD IN ('CHILLS') AND (_STRESC_U = 'SOME INTERFERENCE WITH ACTIVITY NOT REQUIRING MEDICAL ATTENTION' OR (_STRESC IS NOT NULL AND str_contains(_STRESC, 'GRADE 2')))
      then: 2
    - when: PARAMCD IN ('CHILLS') AND (_STRESC_U = 'PREVENTS DAILY ACTIVITY AND REQUIRES MEDICAL ATTENTION' OR (_STRESC IS NOT NULL AND str_contains(_STRESC, 'GRADE 3')))
      then: 3
    - when: PARAMCD IN ('CHILLS') AND (_STRESC IS NOT NULL AND str_contains(_STRESC, 'GRADE 4'))
      then: 4
  submission:
    core: Perm
    mandatory: false
    length: 8
    display_format: '3.'
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
