- name: ATPT
  type: str
  label: 'Analysis Timepoint'
  derivation:
    case:
    - when: _TPT = 'DAY 1' AND _EVAL = 'INVESTIGATOR'
      then: '''DAY 1, AFTER VACCINATION (AT HOME)'''
    - otherwise: _TPT
  submission:
    core: Req
    mandatory: true
    length: 100
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: ATPTN
  type: float
  label: 'Analysis Timepoint (N)'
  derivation:
    case:
    - when: ATPT = 'DAY 1, 30 MINUTES AFTER VACCINATION (AT STUDY CLINIC)'
      then: 1.1
    - when: ATPT = 'DAY 1, AFTER VACCINATION (AT HOME)'
      then: 1.2
    - when: ATPT = 'DAY 1'
      then: 1.0
    - when: ATPT = 'DAY 2'
      then: 2.0
    - when: ATPT = 'DAY 3'
      then: 3.0
    - when: ATPT = 'DAY 4'
      then: 4.0
    - when: ATPT = 'DAY 5'
      then: 5.0
    - when: ATPT = 'DAY 6'
      then: 6.0
    - when: ATPT = 'DAY 7'
      then: 7.0
  submission:
    core: Req
    mandatory: true
    length: 8
    significant_digits: 15
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
