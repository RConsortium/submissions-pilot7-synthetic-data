# ADAR for Moderna mRNA-1273-P301, cut S3 (BLA Interim Analysis,
# cutoff 2021-03-26). Parent: ../../../spec/yamaa/base/adam-base-s3.yaml (which
# chains to ../../../spec/yamaa/base/adam-base.yaml; 86 shared + 59 S3-only ADSL
# columns). Derivations implement the S3 A20ADAR program: FACE rows
# plus VS reactogenicity rows (original TEMP rows and one synthetic
# row per SUPPVS MEDTAK/MEDTAKP/MEDTAKT QVAL 'Y'), each inner-joined
# to the verified ADSL on USUBJID, with the %xxdoserf 4-dose chain,
# the ANL01FL/ANL03FL flag sorts and ASEQ, and the final dose2fl
# filter (DOSE2FL='N' AND ATPTREF='Vaccination 2', stated on the
# template var _TPTREF since ATPTREF is derived and unreadable in
# a row filter under ROW-6; the %xxdoserf fallback never decides
# ATPTREF on a DOSE2FL='N' row here). Where the SAS code and the
# define.xml method text disagree, the code is followed (see the
# generator header). No honest gaps: the pandas prototype reproduced
# the submitted data exactly (0 mismatched cells) on a 300-subject
# sample (49,973 rows) and a 2,000-subject sample (333,058 rows).
# Split verification (session 52, 2026-11-23): the UNCHANGED spec re-run
# per 8-way SEX x AGE (<=55/>55, each group split in halves by sorted
# USUBJID) partition -- EXACT MATCH, 5,062,955x126, 0 mismatched cells,
# AVAL 107,417 within-tolerance cells (max abs diff 7.1e-15), identical
# to the session-45 baseline on all 123 non-key columns (see
# verify_report_s3_split.json). The roomier-cell single full-spec re-run
# is therefore discharged (split-by-subject is the full-spec proof,
# owner decision 2026-11-23, docs/decisions.md).
yamaa: '1.0'
type: spec
model: ADaM
parent: ../../../spec/yamaa/base/adam-base-s3.yaml
domain: ADAR
keys:
- STUDYID
- USUBJID
- ASEQ
input:
  FACE: <sdtm-dir>/face.parquet
  VS: <sdtm-dir>/vs.parquet
  SUPPFACE: <sdtm-dir>/suppface.parquet
  SUPPVS: <sdtm-dir>/suppvs.parquet
  ADSL:
    path: <adam-dir>/adsl.parquet
    key:
    - STUDYID
    - USUBJID
submission:
  label: Solicited AR Analysis Dataset
  class: BASIC DATA STRUCTURE
  structure: One record per subject, per parameter, per analysis timepoint
  repeating: true
