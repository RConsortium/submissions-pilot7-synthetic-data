  filter: (FACE.FACAT IS NULL OR FACE.FACAT NOT IN ('EFFICACY')) AND NOT (FACE.FATESTCD = 'OCCUR' AND FACE.FAOBJ IN ('Erythema', 'Swelling') AND FACE.FAORRES IN ('Y', 'YES')) AND (FACE.FASTAT IS NULL OR FACE.FASTAT IN ('')) AND (FACE.FATPTREF IS NOT NULL AND FACE.FATPTREF NOT IN ('')) AND _ADSL IS NOT NULL AND NOT ((ADSL.DOSE2FL IS NOT NULL AND ADSL.DOSE2FL = 'N') AND (_TPTREF IS NOT NULL AND str_contains(_TPTREF, '2')) AND NOT (_TPTREF IS NOT NULL AND str_contains(_TPTREF, '1')))
