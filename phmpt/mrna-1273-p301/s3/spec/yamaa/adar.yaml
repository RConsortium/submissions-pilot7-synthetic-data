- name: PARAMCD
  type: str
  label: 'Parameter Code'
  derivation:
    case:
    - when: (_TESTCD IN ('TEMP', 'VSALL') OR _OBJ IN ('Pyrexia', 'Fever'))
      then: '''FEVER'''
    - when: _OBJ = 'Underarm Gland Swelling or Tenderness' AND _TESTCD = 'SEV'
      then: '''LYMPH'''
    - when: _OBJ = 'Pain'
      then: '''PAIN'''
    - when: _OBJ = 'Nausea/Vomiting' AND _TESTCD = 'SEV'
      then: '''NAUSEA'''
    - when: _OBJ = 'Erythema' AND (_TEST_U IS NOT NULL AND str_contains(_TEST_U, 'OCCURRENCE')) AND _ORRES_U IN ('N', 'NO')
      then: '''ERYTHDIA'''
    - when: _OBJ = 'Swelling' AND (_TEST_U IS NOT NULL AND str_contains(_TEST_U, 'OCCURRENCE')) AND _ORRES_U IN ('N', 'NO')
      then: '''SWELLDIA'''
    - when: _OBJ = 'Erythema' AND (_TEST_U IS NOT NULL AND str_contains(_TEST_U, 'INTENSITY'))
      then: '''ERYTHDIA'''
    - when: _OBJ = 'Swelling' AND (_TEST_U IS NOT NULL AND str_contains(_TEST_U, 'INTENSITY'))
      then: '''SWELLDIA'''
    - when: _OBJ = 'Erythema' AND _TEST = 'Longest Diameter'
      then: '''ERYTHDIA'''
    - when: _OBJ = 'Swelling' AND _TEST = 'Longest Diameter'
      then: '''SWELLDIA'''
    - when: _OBJ = 'Headache'
      then: '''HEADACHE'''
    - when: _OBJ = 'Fatigue'
      then: '''FATIGUE'''
    - when: _OBJ = 'Myalgia'
      then: '''MYALGIA'''
    - when: _OBJ = 'Arthralgia'
      then: '''ARTHRALG'''
    - when: _OBJ = 'Chills'
      then: '''CHILLS'''
    - when: (_TESTCD IS NOT NULL AND str_contains(_TESTCD, '^MEDTA'))
      then: _TESTCD
  submission:
    core: Req
    mandatory: true
    length: 8
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: PARAM
  type: str
  label: 'Parameter'
  derivation:
    case:
    - when: PARAMCD = 'FEVER'
      then: '''Fever (C)'''
    - when: PARAMCD = 'LYMPH'
      then: '''Underarm Gland Swelling or Tenderness'''
    - when: PARAMCD = 'PAIN'
      then: '''Pain'''
    - when: PARAMCD = 'NAUSEA'
      then: '''Nausea/Vomiting'''
    - when: PARAMCD = 'ERYTHDIA'
      then: '''Erythema Longest Diameter (mm)'''
    - when: PARAMCD = 'SWELLDIA'
      then: '''Swelling Longest Diameter (mm)'''
    - when: PARAMCD = 'HEADACHE'
      then: '''Headache'''
    - when: PARAMCD = 'FATIGUE'
      then: '''Fatigue'''
    - when: PARAMCD = 'MYALGIA'
      then: '''Myalgia'''
    - when: PARAMCD = 'ARTHRALG'
      then: '''Arthralgia'''
    - when: PARAMCD = 'CHILLS'
      then: '''Chills'''
    - when: PARAMCD = 'MEDTAK'
      then: '''Medication Taken Today for Pain or Fever'''
    - when: PARAMCD = 'MEDTAKP'
      then: '''Prevent Pain or Fever from Occurring'''
    - when: PARAMCD = 'MEDTAKT'
      then: '''Treat Pain or Fever already Occurred'''
    - otherwise: _OBJ
  submission:
    core: Req
    mandatory: true
    length: 200
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: AVAL
  type: float
  label: 'Analysis Value'
  derivation:
    case:
    - when: _ORRES_U IN ('N', 'NO') AND _TEST = 'Occurrence Indicator' AND PARAMCD IN ('ERYTHDIA', 'SWELLDIA')
      then: 0.0
    - otherwise: _AVALN
  submission:
    core: Perm
    mandatory: false
    length: 20
    significant_digits: 15
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: AVALC
  type: str
  label: 'Analysis Value (C)'
  derivation: _STRESC
  submission:
