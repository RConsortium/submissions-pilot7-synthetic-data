# ADAE for Moderna mRNA-1273-P301, cut S3 (BLA Interim Analysis,
# cutoff 2021-03-26). Parent: ../../../spec/yamaa/base/adam-base-s3.yaml (which
# chains to ../../../spec/yamaa/base/adam-base.yaml; 86 shared + 59 S3-only ADSL
# columns). Derivations implement the S3 A20ADAE program: one
# row per AE, inner-joined to the verified ADSL on USUBJID,
# with REMOVEFL='Y' (+ symp match), empty-AETERM, and non-ADSL
# rows dropped (AE 39,215 -> ADAE 37,756). The S3 program reads
# FACE + FAAE for ANL02FL/ANL03FL/ANL04FL only. No S27 file is
# read. SAP v1 vs v3 CLOSED as no-impact (2026-11-24) -- the S3
# program's own definitions are followed. RSTFRD (minutes from the
# most-recent-dose start to AE start, program lines 211-214) is
# the 222nd column; it is not in the define (batch-2 warning W9).
# Honest gaps: RACESPY, 1,861 cells (submitted values embed the
# original text after a NUL byte, e.g. '(b)(6)\\x00Other: PUERTO
# RICAN'; the verified ADSL holds only '(b)(6)', and the tail
# text appears nowhere unredacted in the allowed inputs -- the
# spec copies ADSL.RACESPY); AETERM curly-quote mojibake, 5 cells
# (UTF-8 curly quotes mis-decoded as CP1252-with-replacement in
# the submitted file; reproduced faithfully with str_replace);
# AETERM, 5 space-only cells (compbl behaviour). AENTM, 2,856
# cells: the submitted target stores AENTM as duration[us];
# yamaa 0.8.0 has no duration type, so the spec types it as
# time (to_time of AENDTM); the values are correct (all 2,856
# non-null target values equal the time-of-day part of the
# exactly-matching AENDTM) but datetime.time never compares
# equal to Timedelta under the harness. Verification 2026-11-23
# (yamaa 0.8.0 @135082c1f): DONE-WITH-GAP -- 37,756 x 222; 219
# non-key columns compared: 216 exact, 0 within tolerance, 5
# space-only (AETERM); mismatches 4,717 = RACESPY 1,861 +
# AENTM 2,856 (the gaps above). Verified in 9 pruned
# dependency-closure groups (G1-G5, G6a, G6b, G7, G8); the full
# verify.py run OOMs in this 6 GB cell, and G6a/G6b ran in 4
# subject chunks each (full FACE input OOMs the engine even
# pruned). Split-by-subject full-spec re-verification 2026-11-23
# (session 57): the UNCHANGED spec run per 4-way SEX x AGE
# (<=55/>55) partition reproduces the baseline exactly --
# 37,756 rows, 4,717 mismatched cells, 0 within-tolerance, 5
# space-only, zero new mismatches (b0/b1 via verify.py, b2/b3
# via the lean Arrow driver after verify.py OOM'd on b2); see
# spec/yamaa/adae/verify_report_s3_split.json. The split
# verification is the full-spec re-run, so no roomier-cell
# re-run is owed.
# SMQ/CQ/symp
# lookups were reconstructed from the submitted ADAE (the
# import tables are not in Module 5) and cover exactly the terms
# exercised by S3 AE data. APL categories come from a solver over
# the close-pair constraints (see the generator header). ADURN is
# the union length of the group's flag-row intervals (see the
# generator header); the running maximum E is carried by a
# WINDOW-12 feedback group.
yamaa: '1.0'
type: spec
model: ADaM
parent: ../../../spec/yamaa/base/adam-base-s3.yaml
domain: ADAE
keys:
- STUDYID
- USUBJID
- AESEQ
input:
  AE: <sdtm-dir>/ae.parquet
  SUPPAE: <sdtm-dir>/suppae.parquet
  DS: <sdtm-dir>/ds.parquet
  SUPPDS: <sdtm-dir>/suppds.parquet
  HO: <sdtm-dir>/ho.parquet
  EX: <sdtm-dir>/ex.parquet
  FACE: <sdtm-dir>/face.parquet
  FAAE: <sdtm-dir>/faae.parquet
  ADSL:
    path: <adam-dir>/adsl.parquet
    key:
    - STUDYID
    - USUBJID
submission:
  label: Adverse Event Analysis Dataset
  class: OCCURRENCE DATA STRUCTURE
  structure: One record per adverse event
  repeating: true
rows:
- id: events
  dataset: AE
  filter: (_REMOVEFL IS NULL OR _REMOVEFL <> 'Y') AND _AETERM IS NOT NULL AND _ADSL IS NOT NULL
intermediates:
- id: SUPP_P
  dataset: SUPPAE
  key:
    STUDYID: STUDYID
    USUBJID: USUBJID
    IDVARVAL:
      str_decimal:
        source: AESEQ
        decimals: 0
  filter: SUPPAE.QNAM IN ('REMOVEFL', 'MAAEFL', 'AEOUTSP', 'AECVDIAG', 'AEHOSPST', 'AEHOSPEN') AND SUPPAE.IDVAR = 'AESEQ'
  pivot:
    name: QNAM
    value: QVAL
    fields:
    - REMOVEFL
    - MAAEFL
    - AEOUTSP
    - AECVDIAG
    - AEHOSPST
    - AEHOSPEN
- id: HO_ICU1
  dataset: HO
  key:
    USUBJID: USUBJID
    _HOSPID1: _AESPID
  derivations:
    _HOSPID1:
      str_extract:
        source: HO.HOSPID
        pattern: '^(?:[^/]+/){0}(?:HO-)?([^/]+)'
        group: 1
        no_match: null
  filter: HO.HODECOD = 'ICU' AND HO.HOCAT = 'ADVERSE EVENTS' AND HO.HOSPID IS NOT NULL
  order_by:
  - variable: HO.HODUR
    direction: desc
  - variable: HO.HOOCCUR
    direction: desc
  keep: first
- id: HO_ICU2
  dataset: HO
  key:
    USUBJID: USUBJID
    _HOSPID2: _AESPID
  derivations:
    _HOSPID2:
      str_extract:
        source: HO.HOSPID
        pattern: '^(?:[^/]+/){1}(?:HO-)?([^/]+)'
        group: 1
        no_match: null
  filter: HO.HODECOD = 'ICU' AND HO.HOCAT = 'ADVERSE EVENTS' AND HO.HOSPID IS NOT NULL
  order_by:
  - variable: HO.HODUR
    direction: desc
  - variable: HO.HOOCCUR
    direction: desc
  keep: first
- id: HO_ICU3
  dataset: HO
  key:
    USUBJID: USUBJID
    _HOSPID3: _AESPID
  derivations:
    _HOSPID3:
      str_extract:
        source: HO.HOSPID
        pattern: '^(?:[^/]+/){2}(?:HO-)?([^/]+)'
        group: 1
        no_match: null
  filter: HO.HODECOD = 'ICU' AND HO.HOCAT = 'ADVERSE EVENTS' AND HO.HOSPID IS NOT NULL
  order_by:
  - variable: HO.HODUR
    direction: desc
  - variable: HO.HOOCCUR
    direction: desc
  keep: first
- id: HO_ICU4
  dataset: HO
  key:
    USUBJID: USUBJID
    _HOSPID4: _AESPID
  derivations:
    _HOSPID4:
      str_extract:
        source: HO.HOSPID
        pattern: '^(?:[^/]+/){3}(?:HO-)?([^/]+)'
        group: 1
        no_match: null
  filter: HO.HODECOD = 'ICU' AND HO.HOCAT = 'ADVERSE EVENTS' AND HO.HOSPID IS NOT NULL
  order_by:
  - variable: HO.HODUR
    direction: desc
  - variable: HO.HOOCCUR
    direction: desc
  keep: first
- id: HO_ICU5
  dataset: HO
  key:
    USUBJID: USUBJID
    _HOSPID5: _AESPID
  derivations:
    _HOSPID5:
      str_extract:
        source: HO.HOSPID
        pattern: '^(?:[^/]+/){4}(?:HO-)?([^/]+)'
        group: 1
        no_match: null
  filter: HO.HODECOD = 'ICU' AND HO.HOCAT = 'ADVERSE EVENTS' AND HO.HOSPID IS NOT NULL
  order_by:
  - variable: HO.HODUR
    direction: desc
  - variable: HO.HOOCCUR
    direction: desc
  keep: first
- id: HO_ICU6
  dataset: HO
  key:
    USUBJID: USUBJID
    _HOSPID6: _AESPID
  derivations:
    _HOSPID6:
      str_extract:
        source: HO.HOSPID
        pattern: '^(?:[^/]+/){5}(?:HO-)?([^/]+)'
        group: 1
        no_match: null
  filter: HO.HODECOD = 'ICU' AND HO.HOCAT = 'ADVERSE EVENTS' AND HO.HOSPID IS NOT NULL
  order_by:
  - variable: HO.HODUR
    direction: desc
  - variable: HO.HOOCCUR
    direction: desc
  keep: first
- id: HO_ICU7
  dataset: HO
  key:
    USUBJID: USUBJID
    _HOSPID7: _AESPID
  derivations:
    _HOSPID7:
      str_extract:
        source: HO.HOSPID
        pattern: '^(?:[^/]+/){6}(?:HO-)?([^/]+)'
        group: 1
        no_match: null
  filter: HO.HODECOD = 'ICU' AND HO.HOCAT = 'ADVERSE EVENTS' AND HO.HOSPID IS NOT NULL
  order_by:
  - variable: HO.HODUR
    direction: desc
  - variable: HO.HOOCCUR
    direction: desc
  keep: first
- id: HO_ICU8
  dataset: HO
  key:
    USUBJID: USUBJID
    _HOSPID8: _AESPID
  derivations:
    _HOSPID8:
      str_extract:
        source: HO.HOSPID
        pattern: '^(?:[^/]+/){7}(?:HO-)?([^/]+)'
        group: 1
        no_match: null
  filter: HO.HODECOD = 'ICU' AND HO.HOCAT = 'ADVERSE EVENTS' AND HO.HOSPID IS NOT NULL
  order_by:
  - variable: HO.HODUR
    direction: desc
  - variable: HO.HOOCCUR
    direction: desc
  keep: first
- id: HO_ICU9
  dataset: HO
  key:
    USUBJID: USUBJID
    _HOSPID9: _AESPID
  derivations:
    _HOSPID9:
      str_extract:
        source: HO.HOSPID
        pattern: '^(?:[^/]+/){8}(?:HO-)?([^/]+)'
        group: 1
        no_match: null
  filter: HO.HODECOD = 'ICU' AND HO.HOCAT = 'ADVERSE EVENTS' AND HO.HOSPID IS NOT NULL
  order_by:
  - variable: HO.HODUR
    direction: desc
  - variable: HO.HOOCCUR
    direction: desc
  keep: first
- id: HO_ICU10
  dataset: HO
  key:
    USUBJID: USUBJID
    _HOSPID10: _AESPID
  derivations:
    _HOSPID10:
      str_extract:
        source: HO.HOSPID
        pattern: '^(?:[^/]+/){9}(?:HO-)?([^/]+)'
        group: 1
        no_match: null
  filter: HO.HODECOD = 'ICU' AND HO.HOCAT = 'ADVERSE EVENTS' AND HO.HOSPID IS NOT NULL
  order_by:
  - variable: HO.HODUR
    direction: desc
  - variable: HO.HOOCCUR
    direction: desc
  keep: first
- id: SUPP_AESPIDX
  dataset: SUPPDS
  key:
    STUDYID: STUDYID
    USUBJID: USUBJID
    IDVARVAL: _DSSEQ_STR
  filter: SUPPDS.QNAM = 'AESPIDX' AND SUPPDS.IDVAR = 'DSSEQ'
  order_by:
  - SUPPDS.QVAL
  keep: first
- id: FACE_7
  dataset: FACE
  key:
    USUBJID: USUBJID
    FATPTREF: _FATPTREF
    FAOBJ: ARTERM
  filter: FACE.FACAT = 'REACTOGENICITY' AND FACE.FATPTREF IS NOT NULL AND (FACE.FASTRESC IS NULL OR FACE.FASTRESC <> 'NONE') AND (FACE.FASTRESC IS NULL OR NOT str_contains(FACE.FASTRESC, 'GRADE 0')) AND FACE.FASTAT IS NULL AND NOT (FACE.FAOBJ IS NOT NULL AND FACE.FAOBJ IN ('Erythema', 'Swelling') AND FACE.FATESTCD IS NOT NULL AND (FACE.FATESTCD = 'OCCUR' OR (FACE.FATESTCD = 'LDIAM' AND FACE.FASTRESU IS NOT NULL AND FACE.FASTRESU = 'mm' AND (FACE.FASTRESN IS NULL OR FACE.FASTRESN < 25)))) AND FACE.FATPTNUM = 7
  order_by:
  - FACE.FASEQ
  keep: first
- id: FAAE3
  dataset: FAAE
  key:
    USUBJID: USUBJID
    FATPTREF: _FATPTREF
    FAOBJ: ARTERM
  filter: FAAE.FACAT = 'REACTOGENICITY' AND FAAE.FATPTREF IS NOT NULL AND (FAAE.FASTRESC IS NULL OR FAAE.FASTRESC <> 'NONE') AND (FAAE.FASTRESC IS NULL OR NOT str_contains(FAAE.FASTRESC, 'GRADE 0')) AND FAAE.FASTAT IS NULL AND NOT (FAAE.FAOBJ IS NOT NULL AND FAAE.FAOBJ IN ('Erythema', 'Swelling') AND FAAE.FATESTCD IS NOT NULL AND (FAAE.FATESTCD = 'OCCUR' OR (FAAE.FATESTCD = 'LDIAM' AND FAAE.FASTRESU IS NOT NULL AND FAAE.FASTRESU = 'mm' AND (FAAE.FASTRESN IS NULL OR FAAE.FASTRESN < 25))))
  order_by:
  - FAAE.FASEQ
  keep: first
- id: EX_DOSE1
  dataset: EX
  key:
  - STUDYID
  - USUBJID
  filter: str_contains(EX.VISIT, '[Dd][Aa][Yy] 1( |$)')
  order_by:
  - EX.EXSTDTC
  keep: first
- id: EX_DOSE2
  dataset: EX
  key:
  - STUDYID
  - USUBJID
  filter: str_contains(EX.VISIT, '[Dd][Aa][Yy] 29( |$)')
  order_by:
  - EX.EXSTDTC
  keep: first
- id: EX_DOSE3
  dataset: EX
  key:
  - STUDYID
  - USUBJID
  filter: str_contains(EX.VISIT, '[Oo][Ll]-[Dd]1( |$)')
  order_by:
  - EX.EXSTDTC
  keep: first
- id: EX_DOSE4
  dataset: EX
  key:
  - STUDYID
  - USUBJID
  filter: str_contains(EX.VISIT, '[Oo][Ll]-[Dd]29( |$)')
  order_by:
  - EX.EXSTDTC
  keep: first
windows:
  W_ADURN:
    group_by:
    - USUBJID
    - SUBJID
    - MDOSREF
    - AEDECOD
    order_by:
    - ADURSDT
    - ADUREDT
    - AESEQ
  W_APL_BC:
    group_by:
    - USUBJID
    order_by:
    - _APL_BCFLN
    - AESTDTC
    - ASTDTM
    - AESEQ
  W_APL_D:
    group_by:
    - USUBJID
    order_by:
    - _APL_BCDFLN
    - AESTDTC
    - ASTDTM
    - AESEQ
columns:
- name: _ADSL
  type: str
  derivation: ADSL.USUBJID
- name: _REMOVEFL
  type: str
  derivation: SUPP_P.REMOVEFL
- name: _AETERM_1
  type: str
  derivation:
    str_replace:
      source: AE.AETERM
      pattern: ' {2,}'
      replacement: ' '
- name: _AETERM_2
  type: str
  derivation:
    str_replace:
      source: _AETERM_1
      pattern: '^ +| +$'
      replacement: ''
- name: _AETERM_3
  type: str
  derivation:
    str_replace:
      source: _AETERM_2
      pattern: '\u00a0'
      replacement: ' '
- name: _AETERM_M1
  type: str
  derivation:
    str_replace:
      source: _AETERM_3
      pattern: '\u2019'
      replacement: "\u00e2\u20ac\u2122"
- name: _AETERM_M2
  type: str
  derivation:
    str_replace:
      source: _AETERM_M1
      pattern: '\u201c'
      replacement: "\u00e2\u20ac\u0153"
- name: _AETERM
  type: str
  derivation:
    str_replace:
      source: _AETERM_M2
      pattern: '\u201d'
      replacement: "\u00e2\u20ac\ufffd"
- name: _AESPID
  type: str
  derivation: AE.AESPID
- name: _AECD
  type: str
  derivation:
    str_decimal:
      source: AE.AEPTCD
      decimals: 0
- name: _AELLT_UP
  type: str
  derivation:
    str_case:
      source: AE.AELLT
      to: upper
- name: _AEOUT_UP
  type: str
  derivation:
    str_case:
      source: AE.AEOUT
      to: upper
- name: _AETERM_UP
  type: str
  derivation:
    str_case:
      source: _AETERM
      to: upper
- name: _AEGRPID
  type: str
  derivation: AE.AEGRPID
- name: _AE_GRP
  type: str
  derivation:
    str_template:
      template: 'AE-{_AEGRPID}'
- name: _AEST_PREC
  type: str
  derivation:
    precision:
      type: date
      source: AE.AESTDTC
      invalid: null
- name: _ASTTM
  type: str
  derivation:
    case:
    - when: str_contains(AE.AESTDTC, 'T')
      then:
        str_extract:
          source: AE.AESTDTC
          pattern: 'T([0-9:]+)'
          group: 1
          no_match: null
- name: _AEOUTSP_C
  type: str
  derivation:
    str_replace:
      source: SUPP_P.AEOUTSP
      pattern: '\u00a0'
      replacement: ' '
- name: _AESPIDX_1
  type: str
  derivation:
    str_extract:
      source: SUPP_AESPIDX.QVAL
      pattern: '^([^, ]+)'
      group: 1
      no_match: null
- name: _AESPIDX_2
  type: str
  derivation:
    str_extract:
      source: SUPP_AESPIDX.QVAL
      pattern: '^[^,]+, *([^, ]+)'
      group: 1
      no_match: null
- name: _AESPIDX_3
  type: str
  derivation:
    str_extract:
      source: SUPP_AESPIDX.QVAL
      pattern: '^[^,]+,[^,]+, *([^, ]+)'
      group: 1
      no_match: null
- name: _HODUR
  type: str
  derivation:
    first_available:
      sources: [HO_ICU1.HODUR, HO_ICU2.HODUR, HO_ICU3.HODUR, HO_ICU4.HODUR, HO_ICU5.HODUR, HO_ICU6.HODUR, HO_ICU7.HODUR, HO_ICU8.HODUR, HO_ICU9.HODUR, HO_ICU10.HODUR]
- name: _EXTRT1_UP
  type: str
  derivation:
    str_case:
      source: EX_DOSE1.EXTRT
      to: upper
- name: _EXTRT2_UP
  type: str
  derivation:
    str_case:
      source: EX_DOSE2.EXTRT
      to: upper
- name: _EXTRT3_UP
  type: str
  derivation:
    str_case:
      source: EX_DOSE3.EXTRT
      to: upper
- name: _EXTRT4_UP
  type: str
  derivation:
    str_case:
      source: EX_DOSE4.EXTRT
      to: upper
- name: _AETOXGR
  type: str
  derivation: AE.AETOXGR
- name: _AESEV_PC
  type: str
  derivation:
    mapping:
      source: AE.AESEV
      dict:
        MILD: Mild
        MODERATE: Moderate
        SEVERE: Severe
      unmapped: null
- name: STUDYID
  derivation: AE.STUDYID
  submission:
    origins:
    - type: Predecessor
      description: AE.STUDYID
- name: USUBJID
  derivation: AE.USUBJID
  submission:
    origins:
    - type: Predecessor
      description: AE.USUBJID
- name: SUBJID
  derivation: ADSL.SUBJID
  submission:
    origins:
    - type: Assigned
- name: SITEID
  derivation: ADSL.SITEID
  submission:
    origins:
    - type: Predecessor
      description: ADSL.SITEID
- name: COUNTRY
  derivation: ADSL.COUNTRY
  submission:
    origins:
    - type: Predecessor
      description: ADSL.COUNTRY
- name: AGE
  derivation: ADSL.AGE
  submission:
    origins:
    - type: Predecessor
      description: ADSL.AGE
- name: AGEU
  derivation: ADSL.AGEU
  submission:
    origins:
    - type: Predecessor
      description: ADSL.AGEU
- name: STRATAR
  derivation: ADSL.STRATAR
  submission:
    origins:
    - type: Predecessor
      description: ADSL.STRATAR
- name: STRATARN
  derivation: ADSL.STRATARN
  submission:
    origins:
    - type: Predecessor
      description: ADSL.STRATARN
- name: AGEGR1
  derivation: ADSL.AGEGR1
  submission:
    origins:
    - type: Predecessor
      description: ADSL.AGEGR1
- name: AGEGR1N
  derivation: ADSL.AGEGR1N
  submission:
    origins:
    - type: Predecessor
      description: ADSL.AGEGR1N
- name: AGEGR2
  derivation: ADSL.AGEGR2
  submission:
    origins:
    - type: Predecessor
      description: ADSL.AGEGR2
- name: AGEGR2N
  derivation: ADSL.AGEGR2N
  submission:
    origins:
    - type: Predecessor
      description: ADSL.AGEGR2N
- name: AGEGR3
  derivation: ADSL.AGEGR3
  submission:
    origins:
    - type: Predecessor
      description: ADSL.AGEGR3
- name: AGEGR3N
  derivation: ADSL.AGEGR3N
  submission:
    origins:
    - type: Predecessor
      description: ADSL.AGEGR3N
- name: AGEGR4
  derivation: ADSL.AGEGR4
  submission:
    mandatory: false
    origins:
    - type: Predecessor
      description: ADSL.AGEGR4
- name: AGEGR4N
  derivation: ADSL.AGEGR4N
  submission:
    mandatory: false
    origins:
    - type: Predecessor
      description: ADSL.AGEGR4N
- name: SEX
  derivation: ADSL.SEX
  submission:
    origins:
    - type: Predecessor
      description: ADSL.SEX
- name: RACE
  derivation: ADSL.RACE
  submission:
    origins:
    - type: Predecessor
      description: ADSL.RACE
- name: RACESPY
  derivation: ADSL.RACESPY
  submission:
    origins:
    - type: Predecessor
      description: ADSL.RACESPY
- name: ETHNIC
  derivation: ADSL.ETHNIC
  submission:
    origins:
    - type: Predecessor
      description: ADSL.ETHNIC
- name: RANDFL
  derivation: ADSL.RANDFL
  submission:
    origins:
    - type: Predecessor
      description: ADSL.RANDFL
- name: FASFL
  derivation: ADSL.FASFL
  submission:
    origins:
    - type: Predecessor
      description: ADSL.FASFL
- name: SAFFL
  derivation: ADSL.SAFFL
  submission:
    origins:
    - type: Predecessor
      description: ADSL.SAFFL
- name: SAR1FL
  derivation: ADSL.SAR1FL
  submission:
    origins:
    - type: Predecessor
      description: ADSL.SAR1FL
- name: SAR2FL
  derivation: ADSL.SAR2FL
  submission:
    origins:
    - type: Predecessor
      description: ADSL.SAR2FL
- name: SARAFL
  derivation: ADSL.SARAFL
  submission:
    origins:
    - type: Predecessor
      description: ADSL.SARAFL
- name: MITTFL
  derivation: ADSL.MITTFL
  submission:
    origins:
    - type: Predecessor
      description: ADSL.MITTFL
- name: PPROTFL
  derivation: ADSL.PPROTFL
  submission:
    origins:
    - type: Predecessor
      description: ADSL.PPROTFL
- name: RANDIGFL
  derivation: ADSL.RANDIGFL
  submission:
    origins:
    - type: Predecessor
      description: ADSL.RANDIGFL
- name: PPSIFL
  derivation: ADSL.PPSIFL
  submission:
    origins:
    - type: Predecessor
      description: ADSL.PPSIFL
- name: CCIASFL
  derivation: ADSL.CCIASFL
  submission:
    origins:
