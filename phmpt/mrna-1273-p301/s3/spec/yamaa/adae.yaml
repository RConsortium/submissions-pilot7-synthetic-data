        Sinus headache: Headache
        Swelling: Swelling
        Tension headache: Headache
        Vaccination site erythema: Erythema
        Vaccination site lymphadenopathy: Underarm Gland Swelling or Tenderness
        Vaccination site pain: Pain
        Vaccination site swelling: Swelling
        Vomiting: Nausea/Vomiting
      unmapped: null
  submission:
    core: Perm
    mandatory: false
    length: 40
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: AESOFL
  type: str
  label: "Solicited Adverse Reaction?"
  derivation:
    flag: ARTERM IS NOT NULL
  submission:
    core: Perm
    mandatory: false
    length: 1
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: _FACE_MAX
  type: float
  derivation:
    aggregate:
      key:
        USUBJID: USUBJID
        FATPTREF: _FATPTREF
        FAOBJ: ARTERM
      filter: FACE.FACAT = 'REACTOGENICITY' AND FACE.FATPTREF IS NOT NULL AND (FACE.FASTRESC IS NULL OR FACE.FASTRESC <> 'NONE') AND (FACE.FASTRESC IS NULL OR NOT str_contains(FACE.FASTRESC, 'GRADE 0')) AND FACE.FASTAT IS NULL AND NOT (FACE.FAOBJ IS NOT NULL AND FACE.FAOBJ IN ('Erythema', 'Swelling') AND FACE.FATESTCD IS NOT NULL AND (FACE.FATESTCD = 'OCCUR' OR (FACE.FATESTCD = 'LDIAM' AND FACE.FASTRESU IS NOT NULL AND FACE.FASTRESU = 'mm' AND (FACE.FASTRESN IS NULL OR FACE.FASTRESN < 25))))
      expr: MAX(FACE.FATPTNUM)
- name: _FLAGN
  type: int
  derivation:
    case:
    - when: SMQ01FL = 'Y' OR SMQ02FL = 'Y' OR SMQ03FL = 'Y' OR SMQ04FL = 'Y' OR SMQ05FL = 'Y' OR SMQ06FL = 'Y' OR SMQ07FL = 'Y' OR SMQ08FL = 'Y' OR SMQ09FL = 'Y' OR SMQ10FL = 'Y' OR SMQ11FL = 'Y' OR SMQ12FL = 'Y' OR SMQ13FL = 'Y' OR SMQ14FL = 'Y' OR ARTERM IS NOT NULL
      then: 1
    - otherwise: 0
- name: _MAXE_INC
  type: date
  derivation:
    case:
    - when: _FLAGN = 0
      then: _MAXE_PREV
    - when: _MAXE_PREV IS NULL
      then: ADUREDT
    - when: ADUREDT > _MAXE_PREV
      then: ADUREDT
    - otherwise: _MAXE_PREV
- name: _MAXE_PREV
  type: date
  derivation:
    row_value:
      source: _MAXE_INC
      offset: -1
      window: W_ADURN
- name: _GAPDAYS
  type: int
  derivation:
    diff:
      type: date
      start: _MAXE_PREV
      end: ADURSDT
      unit: day
- name: _GAP
  type: int
  derivation:
    case:
    - when: _FLAGN = 0
      then: 0
    - when: _MAXE_PREV IS NULL
      then: 0
    - when: _GAPDAYS > 1
      then: _GAPDAYS - 1
    - otherwise: 0
- name: _ADURN_MAXE
  type: date
  derivation:
    aggregate:
      group_by:
      - USUBJID
      - SUBJID
      - MDOSREF
      - AEDECOD
      filter: _FLAGN = 1
      expr: MAX(ADUREDT)
- name: _ADURN_MINS
  type: date
  derivation:
    aggregate:
      group_by:
      - USUBJID
      - SUBJID
      - MDOSREF
      - AEDECOD
      filter: _FLAGN = 1
      expr: MIN(ADURSDT)
- name: _ADURN_SUMGAP
  type: int
  derivation:
    aggregate:
      group_by:
      - USUBJID
      - SUBJID
      - MDOSREF
      - AEDECOD
      filter: _FLAGN = 1
      expr: SUM(_GAP)
- name: _ADURN_SPAN
  type: int
  derivation:
    diff:
      type: date
      start: _ADURN_MINS
      end: _ADURN_MAXE
      unit: day
- name: ADURN
  type: int
  label: Analysis Duration (N)
  derivation:
    case:
    - when: _FLAGN = 1 AND MDOSREF IS NOT NULL
      then: _ADURN_SPAN + 1 - _ADURN_SUMGAP
  submission:
    core: Perm
    mandatory: false
    length: 8
    display_format: '3.'
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: _APL_CAT
  type: str
  derivation:
    mapping:
      source: AE.AEDECOD
      dict:
        Anaphylactic reaction: A
        Asthma: C
        Chest discomfort: C
        Cough: C
        Dyspnoea: C
        Erythema: B
        Eye pruritus: B
        Flushing: B
        Hypotension: D
        Injection site urticaria: B
        Lip swelling: B
        Ocular hyperaemia: B
        Periorbital swelling: B
        Pruritus: B
        Rash: B
        Rash pruritic: B
        Sneezing: C
        Swelling face: B
        Tachypnoea: C
        Urticaria: B
        Wheezing: C
      unmapped: null
- name: _APL_NA
  type: int
  derivation:
    case:
    - when: SMQ01SC = 'NARROW' OR _APL_CAT = 'A'
      then: 1
    - otherwise: 0
- name: _APL_BCFLN
  type: int
  derivation:
    case:
    - when: _APL_CAT IN ('B', 'C')
      then: 1
    - otherwise: 0
- name: _APL_BCDFLN
  type: int
  derivation:
    case:
    - when: _APL_CAT IN ('B', 'C', 'D')
      then: 1
    - otherwise: 0
- name: _APL_LAG_CAT_BC
  type: str
  derivation:
    row_value:
      source: _APL_CAT
      offset: -1
      window: W_APL_BC
- name: _APL_LAG_DTM_BC
  type: datetime
  derivation:
    row_value:
      source: ASTDTM
      offset: -1
      window: W_APL_BC
- name: _APL_LAG_D_BC
  type: date
  derivation:
    row_value:
      source: ASTDT
      offset: -1
      window: W_APL_BC
- name: _APL_DSEC_BC
  type: int
  derivation:
    diff:
      type: datetime
      start: _APL_LAG_DTM_BC
      end: ASTDTM
      unit: second
- name: _APL_DDAY_BC
  type: int
  derivation:
    diff:
      type: date
      start: _APL_LAG_D_BC
      end: ASTDT
      unit: day
- name: _APL_CLOSE_BC
  type: int
  derivation:
    case:
    - when: ASTDTM IS NOT NULL AND _APL_LAG_DTM_BC IS NOT NULL AND ABS(_APL_DSEC_BC) <= 60
      then: 1
    - when: _APL_LAG_D_BC IS NOT NULL AND ASTDT IS NOT NULL AND ABS(_APL_DDAY_BC) <= 1
      then: 1
    - otherwise: 0
- name: _APL_LAG_CAT_D
  type: str
  derivation:
    row_value:
      source: _APL_CAT
      offset: -1
      window: W_APL_D
- name: _APL_LAG_DTM_D
  type: datetime
  derivation:
    row_value:
      source: ASTDTM
      offset: -1
      window: W_APL_D
- name: _APL_LAG_D_D
  type: date
  derivation:
    row_value:
      source: ASTDT
      offset: -1
      window: W_APL_D
- name: _APL_DSEC_D
  type: int
  derivation:
    diff:
      type: datetime
      start: _APL_LAG_DTM_D
      end: ASTDTM
      unit: second
- name: _APL_DDAY_D
  type: int
  derivation:
    diff:
      type: date
      start: _APL_LAG_D_D
      end: ASTDT
      unit: day
- name: _APL_CLOSE_D
  type: int
  derivation:
    case:
    - when: ASTDTM IS NOT NULL AND _APL_LAG_DTM_D IS NOT NULL AND ABS(_APL_DSEC_D) <= 60
      then: 1
    - when: _APL_LAG_D_D IS NOT NULL AND ASTDT IS NOT NULL AND ABS(_APL_DDAY_D) <= 1
      then: 1
    - otherwise: 0
- name: _APL_BC_PAIR
  type: int
  derivation:
    case:
    - when: _APL_BCFLN = 1 AND _APL_CLOSE_BC = 1 AND ((_APL_CAT = 'B' AND _APL_LAG_CAT_BC = 'C') OR (_APL_CAT = 'C' AND _APL_LAG_CAT_BC = 'B'))
      then: 1
    - otherwise: 0
- name: _APL_DBC_PAIR
  type: int
  derivation:
    case:
    - when: _APL_BCDFLN = 1 AND _APL_CLOSE_D = 1 AND ((_APL_CAT = 'D' AND _APL_LAG_CAT_D IN ('B', 'C')) OR (_APL_CAT IN ('B', 'C') AND _APL_LAG_CAT_D = 'D'))
      then: 1
    - otherwise: 0
- name: _APL_MAX_BC
  type: int
  derivation:
    aggregate:
      group_by:
      - USUBJID
      expr: MAX(_APL_BC_PAIR)
- name: _APL_MAX_DBC
  type: int
  derivation:
    aggregate:
      group_by:
      - USUBJID
      expr: MAX(_APL_DBC_PAIR)
- name: _APL_HAS_NA
  type: int
  derivation:
    aggregate:
      group_by:
      - USUBJID
      expr: MAX(_APL_NA)
- name: _APL_REAS1
  type: str
  derivation:
    case:
    - when: _APL_HAS_NA = 1
      then: '''A narrow term or a term from Category A'''
- name: _APL_REAS2
  type: str
  derivation:
    case:
    - when: _APL_MAX_BC = 1
      then: '''A term from Category B AND a term from Category C'''
- name: _APL_REAS3
  type: str
  derivation:
    case:
    - when: _APL_MAX_DBC = 1
      then: '''A term from Category D AND [a term from Category B OR a term from Category C]'''
- name: APLREAS
  type: str
  label: Reason for Anaphylaxis
  derivation:
    case:
    - when: _APL_REAS1 IS NOT NULL AND _APL_REAS2 IS NOT NULL AND _APL_REAS3 IS NOT NULL
      then: '''A narrow term or a term from Category A; A term from Category B AND a term from Category C; A term from Category D AND [a term from Category B OR a term from Category C]'''
    - when: _APL_REAS1 IS NOT NULL AND _APL_REAS2 IS NOT NULL AND _APL_REAS3 IS NULL
      then: '''A narrow term or a term from Category A; A term from Category B AND a term from Category C'''
    - when: _APL_REAS1 IS NOT NULL AND _APL_REAS2 IS NULL AND _APL_REAS3 IS NOT NULL
      then: '''A narrow term or a term from Category A; A term from Category D AND [a term from Category B OR a term from Category C]'''
    - when: _APL_REAS1 IS NULL AND _APL_REAS2 IS NOT NULL AND _APL_REAS3 IS NOT NULL
      then: '''A term from Category B AND a term from Category C; A term from Category D AND [a term from Category B OR a term from Category C]'''
    - when: _APL_REAS1 IS NOT NULL AND _APL_REAS2 IS NULL AND _APL_REAS3 IS NULL
      then: '''A narrow term or a term from Category A'''
    - when: _APL_REAS1 IS NULL AND _APL_REAS2 IS NOT NULL AND _APL_REAS3 IS NULL
      then: '''A term from Category B AND a term from Category C'''
    - when: _APL_REAS1 IS NULL AND _APL_REAS2 IS NULL AND _APL_REAS3 IS NOT NULL
      then: '''A term from Category D AND [a term from Category B OR a term from Category C]'''
  submission:
    core: Perm
    mandatory: false
    length: 200
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: APLFL
  type: str
  label: Anaphylaxis Flag
  derivation:
    flag: APLREAS IS NOT NULL
  submission:
    core: Perm
    mandatory: false
    length: 1
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: ANL01FL
  type: str
  label: Analysis Flag 01
  derivation:
    flag: ARTERM IN ('Pain', 'Erythema', 'Swelling', 'Underarm Gland Swelling or Tenderness') AND MRDSTDY >= 8
  submission:
    core: Perm
    mandatory: false
    length: 1
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: ANL02FL
  type: str
  label: Analysis Flag 02
  derivation:
    case:
    - when: ANL01FL = 'Y' AND MRDSTDY = 8 AND FACE_7.USUBJID IS NOT NULL
      then: '''Y'''
  submission:
    core: Perm
    mandatory: false
    length: 1
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: ANL03FL
  type: str
  label: Analysis Flag 03
  derivation:
    case:
    - when: ANL01FL = 'Y' AND _FACE_MAX IS NOT NULL AND (MRDSTDY <> 8 OR _FACE_MAX < 7) AND FAAE3.USUBJID IS NULL
      then: '''Y'''
  submission:
    core: Perm
    mandatory: false
    length: 1
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: ANL04FL
  type: str
  label: Analysis Flag 04
  derivation:
    flag: ANL01FL = 'Y' AND _FACE_MAX IS NULL
  submission:
    core: Perm
    mandatory: false
    length: 1
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
