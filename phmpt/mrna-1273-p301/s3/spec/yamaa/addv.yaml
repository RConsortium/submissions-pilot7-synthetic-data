- name: APERIOD
  type: int
  label: 'Period'
  derivation:
    case:
    - when: AP02SSDT IS NOT NULL AND _ADT IS NOT NULL AND AP02SSDT <= _ADT
      then: 2
    - otherwise: 1
  submission:
    core: Perm
    mandatory: false
    length: 8
    display_format: '3.'
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
