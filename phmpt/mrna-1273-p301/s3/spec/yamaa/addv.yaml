# ADDV for Moderna mRNA-1273-P301, cut S3 (BLA Interim
# Analysis, cutoff 2021-03-26). Parent:
# ../../../spec/yamaa/base/adam-base-s3.yaml (which chains to
# ../../../spec/yamaa/base/adam-base.yaml; 86 shared + 59 S3-only ADSL
# columns). Derivations implement the S3 ADDV program
# (Bates 3820391-3820392, %let dsetname = addv). One row
# template drives on SDTM DV, inner-joined to the verified
# ADSL on (STUDYID, USUBJID): 82,100 DV rows -> 82,039
# submitted rows (61 drops are DV rows for 58 subjects not
# in ADSL). DVTERM1/DVSIG come from the verified SUPPDV
# pivot (%revsupp, RDOMAIN='DV'); the other SUPPDV QNAMs
# (DECSRTNL, SEVDES, DECSRTN1/2/3) contribute no surviving
# column. APERIOD follows the define method (2 iff
# non-missing AP02SSDT <= DVSTDTC, else 1) via _ADT =
# to_date(DV.DVSTDTC), guarded for the 28 blank DVSTDTC
# rows. The program reads NO S27 file. Unlike the S3 ADMH
# JMP file, the S3 ADDV target is XPT-derived Parquet and
# stores the ADSL date/datetime columns natively, so no
# DATE9/datetime character rendering is needed. File order
# is authoritative over define order (the 8-column
# TRTSEQP/TRTSDT rotation at positions 48-55, as in ADMH
# W10). No gaps are known: every column was prototyped
# against the submitted data and matched exactly. See the
# generator header for the full design notes.
yamaa: '1.0'
type: spec
model: ADaM
parent: ../../../spec/yamaa/base/adam-base-s3.yaml
domain: ADDV
keys:
- STUDYID
- USUBJID
- DVSEQ
input:
  DV: <sdtm-dir>/dv.parquet
  SUPPDV: <sdtm-dir>/suppdv.parquet
  ADSL:
    path: <adam-dir>/adsl.parquet
    key:
    - STUDYID
    - USUBJID
submission:
  label: Deviation Analysis Dataset
  class: OCCURRENCE DATA STRUCTURE
  structure: One record per subject per deviation
  repeating: true
rows:
- id: dv_rows
  dataset: DV
  derivations:
    STUDYID: DV.STUDYID
    USUBJID: DV.USUBJID
    _DVSEQ: DV.DVSEQ
  filter: _ADSL IS NOT NULL
intermediates:
- id: SUPP_P
  dataset: SUPPDV
  key:
    STUDYID: STUDYID
    USUBJID: USUBJID
    IDVARVAL:
      str_decimal:
        source: _DVSEQ
        decimals: 0
  filter: SUPPDV.QNAM IN ('DVTERM1', 'DVSIG') AND SUPPDV.IDVAR = 'DVSEQ'
  pivot:
    name: QNAM
    value: QVAL
    fields:
    - DVTERM1
    - DVSIG
columns:
- name: _ADSL
  type: str
  derivation: ADSL.USUBJID
- name: _DVSEQ
  type: float
- name: _ADT
  type: date
  derivation:
    case:
    - when: DV.DVSTDTC IS NOT NULL AND DV.DVSTDTC NOT IN ('')
      then:
        to_date:
          source: DV.DVSTDTC
    - otherwise: null
- name: STUDYID
  submission:
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
