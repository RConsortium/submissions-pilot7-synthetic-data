- name: PARCAT1N
  type: int
  label: 'Parameter Category 1 (N)'
  derivation:
    case:
    - when: SC.SCSCAT = 'OCCUPATIONAL RISK'
      then: 1
    - when: SC.SCSCAT = 'LOCATION AND LIVING CIRCUMSTANCES RISK'
      then: 2
  submission:
    core: Req
    mandatory: true
    length: 8
    display_format: '3.'
    origins:
    - type: Assigned
    method: "Withheld from publication: the received define states this text."
- name: PARAMCD
  type: str
  label: 'Parameter Code'
  derivation:
    case:
    - when: _PARAMCD_MAP IS NOT NULL
      then: _PARAMCD_MAP
    - when: SC.SCSCAT = 'OCCUPATIONAL RISK'
      then: '''OTHEROCC'''
    - when: SC.SCSCAT = 'LOCATION AND LIVING CIRCUMSTANCES RISK'
      then: '''OTHERLOC'''
  submission:
    core: Req
    mandatory: true
    length: 8
    origins:
    - type: Assigned
    method: "Withheld from publication: the received define states this text."
- name: PARAM
  type: str
  label: 'Parameter'
  derivation:
    mapping:
      source: PARAMCD
      dict:
        'EDUSTDT': 'Educators and Students'
        'EMERGRES': 'Emergency Response'
        'HIGHDEN': 'Resides in High Density Housing'
        'HLTHWRKR': 'Healthcare Workers'
        'HPTLTY': 'Hospitality and Tourism Workers'
        'LOWDEN': 'Resides in Low Density, Multi-Family Setting'
        'MFGOP': 'Manufacturing and Production Operations'
        'MILITARY': 'Border Protection and Military Personnel'
        'MULTIFAM': 'Resides in Multi-Family Dwelling'
        'NORISK': 'No Risk Identified'
        'NURSHOM': 'Resides in Nursing Home or Assisted Living Facility'
        'OTHERLOC': 'Other Location And Living Circumstances Risk'
        'OTHEROCC': 'Other Occupational Risk'
        'PASTWRKR': 'Pastoral, Social or Public Health Workers'
        'PCIHS': 'Personal Care and In-Home Services'
        'RETAIL': 'Retail or Restaurant Operations'
        'SINFAM': 'Resides in a Single Family Home'
        'TRANS': 'Transportation and Delivery Services'
        'WHSSHIP': 'Warehouse Shipping and Fulfillment Centers'
      unmapped: null
  submission:
    core: Req
    mandatory: true
    length: 200
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: AVALC
  type: str
  label: 'Analysis Value (C)'
  derivation:
    case:
    - when: PARAMCD IN ('OTHERLOC', 'OTHEROCC') AND SC.SCSTRESC = 'N'
      then: '''N'''
    - when: PARAMCD IN ('OTHERLOC', 'OTHEROCC')
      then: '''Y'''
    - otherwise: SC.SCSTRESC
  submission:
    core: Perm
    mandatory: false
    length: 50
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: OTHSPY
  type: str
  label: 'Other Specify'
  derivation:
    case:
    - when: PARAMCD IN ('OTHEROCC', 'OTHERLOC')
      then: _OTHSPY_CLN
  submission:
    core: Perm
    mandatory: false
    length: 202
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
