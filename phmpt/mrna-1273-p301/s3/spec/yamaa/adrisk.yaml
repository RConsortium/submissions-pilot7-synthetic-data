# ADRISK for Moderna mRNA-1273-P301, cut S3 (BLA Interim
# Analysis, cutoff 2021-03-26). Parent:
# ../../../spec/yamaa/base/adam-base-s3.yaml (which chains to
# ../../../spec/yamaa/base/adam-base.yaml; 86 shared + 59 S3-only ADSL
# columns). Derivations implement the S3 ADRISK program
# (Bates 3820414-3820417, %let dsetname = adrisk). One row
# template drives on SDTM SC, filtered to
# SCCAT='COVID-19 EXPOSURE' and inner-joined to the
# verified ADSL on (STUDYID, USUBJID): 578,180 SC rows ->
# 577,703 submitted rows (477 drops are subjects not in
# ADSL). The program reads NO S27 file. SUPPSC carries
# only QNAM SCORRS1 (6 rows), which the S3 program never
# references, so no SUPP pivot is declared. The 21 ADSL
# date/datetime columns the S3 ADRISK JMP file stores as
# DATE9 / datetime character text are formatted from the
# ADSL values; EFFCODT, AP01SDT and AP01SSDT are native
# dates in the target and are plain ADSL copies. Two
# program-vs-data deviations are followed as submitted
# (see the generator header): AVALC='Y' on the 8
# blank-SCSTRESC OTHER rows, and the %CLN_CARRIAGE
# mojibake cleanup on OTHSPY (1 row). No gaps are known
# beyond those two: every column was prototyped against
# the submitted data and matched exactly. SAP v1 vs v3 CLOSED
# as no-impact (2026-11-24); the S3 program's own definitions
# are followed. See the generator header for the full
# design notes.
yamaa: '1.0'
type: spec
model: ADaM
parent: ../../../spec/yamaa/base/adam-base-s3.yaml
domain: ADRISK
keys:
- STUDYID
- USUBJID
- ASEQ
input:
  SC: <sdtm-dir>/sc.parquet
  ADSL:
    path: <adam-dir>/adsl.parquet
    key:
    - STUDYID
    - USUBJID
submission:
  label: Risk of Exposure Analysis Dataset
  class: BASIC DATA STRUCTURE
  structure: One record per subject per parameter
  repeating: true
rows:
- id: sc_rows
  dataset: SC
  derivations:
    STUDYID: SC.STUDYID
    USUBJID: SC.USUBJID
  filter: SC.SCCAT = 'COVID-19 EXPOSURE' AND _ADSL IS NOT NULL
columns:
- name: _ADSL
  type: str
  derivation: ADSL.USUBJID
- name: STUDYID
  submission:
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: USUBJID
  submission:
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
