# ADCM for Moderna mRNA-1273-P301, cut S3 (BLA Interim Analysis,
# cutoff 2021-03-26). Parent: ../../../spec/yamaa/base/adam-base-s3.yaml
# (which chains to ../../../spec/yamaa/base/adam-base.yaml). Derivations
# implement the S3 A20ADCM program (Bates 3820386-3820390) with the
# madam macros it calls (%imp_atdt, %xxdoserf, %trta's %CLN_CARRIAGE;
# Bates 3820504-3820522): one row per CM record inner-joined to the
# submitted S3 ADSL on (STUDYID, USUBJID) -- 195,063 CM rows, all of
# whose subjects are in ADSL.
#
# The released S3 CM is a JMP conversion with 11 of its 24 variables
# (STUDYID, DOMAIN, USUBJID, SUBJID, CMTRT, CMSTDTC, CMENDTC, CMSTDY,
# CMENDY, CMENRTPT, CMENTPT). Without CMSEQ no CM record can be joined
# to its SUPPCM records, so the program's SUPPCM columns cannot be
# derived either. Missing input, left underived (not in the output):
# CMSEQ, CMCAT, CMDECOD, CMINDC, CMDOSE, CMDOSU, CMDOSFRQ, CMROUTE,
# ATCLEV2T (CMCLAS), CMMOI2FL (CMPROTCD + import.pain_drugcode, not
# submitted), and the SUPPCM columns CMTRTO1, CMDECOD1-3, CMUOTHSP,
# CMFOTHSP, CMROTHSP, CMSOLFL, CMMOI1FL (CMPLX), CMMOI3FL (ATCLEV4T),
# ATCLEV1T, ATCLEV3T, ATCLEV4T and CMPROTCD (data/differences.yaml).
#
# CMSEQ cannot be derived from the released CM. Its rows are not in the
# sponsor's (USUBJID, CMSEQ) order: the JMP table is sorted by CMSTDTC
# (blank, then (b)(6), then complete dates by month, day and year, then
# partial dates as text), then USUBJID; only rows tied on both keep the
# sponsor's order (CMSEQ ascending in every one of the 31,760 tied
# groups). Numbering a subject's rows in file order gives the submitted
# CMSEQ on 14% of rows, in start-date order on 42%. CMSEQ is not a
# function of the released variables (it follows entry order, not dates
# or names), and no SDTM convention or program text says how it was
# assigned. The row identity is therefore CMRECNO,
# the record's number within the subject in a declared order of the
# released variables: a key only, which verify sets aside.
#
# The ADSL columns, and their DATE9 / datetime text renderings, are those
# of the S3 ADMH spec (same 93 columns, same JMP storage). CMSTDTC /
# CMENDTC are carried as the released CM holds them (complete dates as
# M/D/YYYY, the JMP rendering, as in the submitted ADCM); the program's
# ISO text is rebuilt from them for the imputations. A start or end
# redacted to (b)(6) keeps the S5 spec's convention: the date and day
# carry the token, the imputation flag is D, a redacted start reads as
# missing and a redacted end as present-but-unknown.
yamaa: '1.0'
type: spec
model: ADaM
parent: ../../../spec/yamaa/base/adam-base-s3.yaml
domain: ADCM
keys:
- STUDYID
- USUBJID
- CMRECNO
input:
  CM: <sdtm-dir>/cm.parquet
  ADSL:
    path: <adam-dir>/adsl.parquet
    key:
    - STUDYID
    - USUBJID
submission:
  label: Concomitant Medication Analysis Dataset
  class: OCCURRENCE DATA STRUCTURE
  structure: One record per subject per medication
  repeating: true
rows:
- id: meds
  dataset: CM
  derivations:
    STUDYID: CM.STUDYID
    USUBJID: CM.USUBJID
  filter: _ADSL IS NOT NULL
windows:
  CMREC_W:
    group_by: [STUDYID, USUBJID]
    order_by:
    - CMTRT
    - CMSTDTC
    - CMENDTC
    - CMSTDY
    - CMENDY
columns:
- name: _ADSL
  type: str
  derivation: ADSL.USUBJID
- name: STUDYID
  submission:
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: USUBJID
  submission:
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: _TRTSDT_ISO
  type: str
  derivation: ADSL.TRTSDT
- name: _TRTSDT_DY
  type: str
