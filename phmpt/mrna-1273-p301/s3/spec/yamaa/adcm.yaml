    str_substr:
      source: _TRTSDT_ISO
      start: 9
      length: 2
- name: _TRTSDT_MN
  type: str
  derivation:
    str_substr:
      source: _TRTSDT_ISO
      start: 6
      length: 2
- name: _TRTSDT_YR
  type: str
  derivation:
    str_substr:
      source: _TRTSDT_ISO
      start: 1
      length: 4
- name: _TRTSDT_MON
  type: str
  derivation:
    mapping:
      source: _TRTSDT_MN
      dict:
        '01': Jan
        '02': Feb
        '03': Mar
        '04': Apr
        '05': May
        '06': Jun
        '07': Jul
        '08': Aug
