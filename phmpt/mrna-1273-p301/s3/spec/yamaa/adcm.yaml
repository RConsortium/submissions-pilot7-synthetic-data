      length: 2
# %imp_atdt(sten=en, dendtc=oriendtc=CUTOFFDT): a partial end completes to
# the last day of its year or month and is capped at CUTOFFDT.
- name: _AEN_IMP0
  type: date
  derivation:
    impute:
      type: date
      source: _CMEN_ISO
      month: 12
      day: last
      invalid: null
- name: _AEN_IMP
  type: date
  derivation:
    case:
    - when: _CMEN_PREC IN ('year', 'month') AND ADSL.CUTOFFDT IS NOT NULL AND _AEN_IMP0 > ADSL.CUTOFFDT
      then: ADSL.CUTOFFDT
    - otherwise: _AEN_IMP0
- name: _AEN_IMP_TXT
  type: str
  derivation: _AEN_IMP
- name: _AEN_IMP_MN
  type: str
  derivation:
    str_substr:
      source: _AEN_IMP_TXT
      start: 6
      length: 2
# The program's re-derived end: an imputed end is the earliest of itself,
# EOSDT, DTHDT and CUTOFFDT.
- name: _AENDT
  type: date
  derivation:
    case:
    - when: _CMEN_PREC IN ('year', 'month')
      then:
        least:
          sources: [_AEN_IMP, ADSL.EOSDT, ADSL.DTHDT, ADSL.CUTOFFDT]
    - otherwise: _AEN_IMP
# %imp_atdt(sten=st, trtsdtc=TRTSDT, dendtc=the imputed end before its
# re-derivation, oriendtc=CMENDTC): the end-date condition under which a
# partial start in the month or year of TRTSDT moves to TRTSDT.
- name: _END_AFTER
  type: str
  derivation:
    case:
    - when: _CMEN_PREC IN ('year', 'month') AND _AEN_IMP >= ADSL.TRTSDT
      then: '''Y'''
    - when: _CMEN_PREC = 'day' AND _AEN_IMP > ADSL.TRTSDT
      then: '''Y'''
    - when: _CMEN_MISS = 'Y'
      then: '''Y'''
- name: _AST_IMP0
  type: date
  derivation:
    case:
    - when: _CMST_PREC = 'year' AND _CMST_Y4 = _TRTS_Y4 AND _END_AFTER = 'Y'
      then: ADSL.TRTSDT
    - when: _CMST_PREC = 'month' AND _CMST_YM7 = _TRTS_YM7 AND _END_AFTER = 'Y'
      then: ADSL.TRTSDT
    - otherwise:
        impute:
          type: date
          source: _CMST_ISO
          month: 1
          day: first
          invalid: null
- name: _AST_IMP
  type: date
  derivation:
    case:
    - when: _CMST_PREC IN ('year', 'month') AND _AEN_IMP IS NOT NULL AND _AST_IMP0 > _AEN_IMP
      then: _AEN_IMP
    - otherwise: _AST_IMP0
- name: _AST_IMP_TXT
  type: str
  derivation: _AST_IMP
- name: _AST_IMP_MN
  type: str
  derivation:
    str_substr:
      source: _AST_IMP_TXT
      start: 6
      length: 2
# A partial start after the final end moves to the end (program: if
# ASTDT>AENDT>. and ASTDTF^='' then ASTDT = AENDT).
- name: _ASTDT
  type: date
  derivation:
    case:
    - when: _CMST_PREC IN ('year', 'month') AND _AENDT IS NOT NULL AND _AST_IMP > _AENDT
      then: _AENDT
    - otherwise: _AST_IMP
- name: _ASTDT_TXT
  type: str
  derivation: _ASTDT
- name: _ASTDT_DD
  type: str
  derivation:
    str_substr:
      source: _ASTDT_TXT
      start: 9
      length: 2
- name: _ASTDT_MM
  type: str
  derivation:
    str_substr:
      source: _ASTDT_TXT
      start: 6
      length: 2
- name: _ASTDT_YYYY
  type: str
  derivation:
    str_substr:
      source: _ASTDT_TXT
      start: 1
      length: 4
- name: _ASTDT_MON
  type: str
  derivation:
    mapping:
      source: _ASTDT_MM
      dict:
        '01': Jan
        '02': Feb
        '03': Mar
        '04': Apr
        '05': May
        '06': Jun
        '07': Jul
        '08': Aug
        '09': Sep
        '10': Oct
        '11': Nov
        '12': Dec
      unmapped: null
- name: _AENDT_TXT
  type: str
  derivation: _AENDT
- name: _AENDT_DD
  type: str
  derivation:
    str_substr:
      source: _AENDT_TXT
      start: 9
      length: 2
- name: _AENDT_MM
  type: str
  derivation:
    str_substr:
      source: _AENDT_TXT
      start: 6
      length: 2
- name: _AENDT_YYYY
  type: str
  derivation:
    str_substr:
      source: _AENDT_TXT
      start: 1
      length: 4
- name: _AENDT_MON
  type: str
  derivation:
    mapping:
      source: _AENDT_MM
      dict:
        '01': Jan
        '02': Feb
        '03': Mar
        '04': Apr
        '05': May
        '06': Jun
        '07': Jul
        '08': Aug
        '09': Sep
        '10': Oct
        '11': Nov
        '12': Dec
      unmapped: null
- name: _ASTDY_INT
  type: int
  derivation:
    study_day:
      source: _ASTDT
      reference: ADSL.TR01SDT
- name: _AENDY_INT
  type: int
  derivation:
    study_day:
      source: _AENDT
      reference: ADSL.TR01SDT
- name: _TR01EDT27
  type: date
  derivation:
    shift:
      type: date
      source: ADSL.TR01EDT
      days: 27
- name: _TR02EDT27
  type: date
  derivation:
    shift:
      type: date
      source: ADSL.TR02EDT
      days: 27
- name: _MRD_V1
  type: int
  derivation:
    diff:
      type: date
      start: ADSL.TR01SDT
      end: _ASTDT
      unit: day
- name: _MRD_V2
  type: int
  derivation:
    diff:
      type: date
      start: ADSL.DOSE2DT
      end: _ASTDT
      unit: day
- name: _MRD_OL1
  type: int
  derivation:
    diff:
      type: date
      start: ADSL.TR02SDT
      end: _ASTDT
      unit: day
- name: _MRD_OL2
  type: int
  derivation:
    diff:
      type: date
      start: ADSL.OLDOS2DT
      end: _ASTDT
      unit: day
- name: CMRECNO
  type: int
  label: Record Number within Subject
  derivation:
    row_number:
      window: CMREC_W
  submission:
    core: Perm
    mandatory: true
    length: 8
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: CMTRT
  type: str
  label: "Reported Name of Drug, Med, or Therapy"
  derivation:
    str_replace:
      source: _CMTRT_2
      pattern: '^ +| +$'
      replacement: ''
  submission:
    core: Req
    mandatory: false
    length: 200
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: CMSTDTC
  type: str
  label: Start Date/Time of Medication
  derivation: CM.CMSTDTC
  submission:
    core: Perm
    mandatory: false
    length: 20
    origins:
    - type: Predecessor
      description: CM.CMSTDTC
- name: CMENDTC
  type: str
  label: End Date/Time of Medication
  derivation: CM.CMENDTC
  submission:
    core: Perm
    mandatory: false
    length: 20
    origins:
    - type: Predecessor
      description: CM.CMENDTC
- name: CMSTDY
  type: str
  label: Study Day of Start of Medication
  derivation: CM.CMSTDY
  submission:
    core: Perm
    mandatory: false
    length: 8
    origins:
    - type: Predecessor
      description: CM.CMSTDY
- name: CMENDY
  type: float
  label: Study Day of End of Medication
  derivation: CM.CMENDY
  submission:
    core: Perm
    mandatory: false
    length: 8
    significant_digits: 15
    origins:
    - type: Predecessor
      description: CM.CMENDY
- name: CMENRF
  type: str
  label: End Relative to Reference Period
  derivation: CM.CMENRTPT
  submission:
    core: Perm
    mandatory: false
    length: 200
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: ASTDT
  type: str
  label: Analysis Start Date
  derivation:
    case:
    - when: CM.CMSTDTC = '(b)(6)'
      then: '''(b)(6)'''
    - when: _ASTDT IS NOT NULL
      then:
        str_template:
          template: '{_ASTDT_DD}{_ASTDT_MON}{_ASTDT_YYYY}'
  submission:
    core: Perm
    mandatory: false
    length: 9
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: ASTDTF
  type: str
  label: Analysis Start Date Imputation Flag
  derivation:
    case:
    - when: CM.CMSTDTC = '(b)(6)'
      then: '''D'''
    - when: _CMST_PREC = 'year'
      then: '''M'''
    - when: _CMST_PREC = 'month' AND _AST_IMP_MN = _CMST_MN
      then: '''D'''
    - when: _CMST_PREC = 'month'
      then: '''M'''
  submission:
    core: Perm
    mandatory: false
    length: 1
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: ASTDY
  type: str
  label: Analysis Start Relative Day
  derivation:
    case:
    - when: CM.CMSTDTC = '(b)(6)'
      then: '''(b)(6)'''
    - when: _ASTDY_INT IS NOT NULL
      then:
        str_decimal:
          source: _ASTDY_INT
          decimals: 0
  submission:
    core: Perm
    mandatory: false
    length: 8
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: AENDT
  type: str
  label: Analysis End Date
  derivation:
    case:
    - when: CM.CMENDTC = '(b)(6)'
      then: '''(b)(6)'''
    - when: _AENDT IS NOT NULL
      then:
        str_template:
          template: '{_AENDT_DD}{_AENDT_MON}{_AENDT_YYYY}'
  submission:
    core: Perm
    mandatory: false
    length: 9
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: AENDTF
  type: str
  label: Analysis End Date Imputation Flag
  derivation:
    case:
    - when: CM.CMENDTC = '(b)(6)'
      then: '''D'''
    - when: _CMEN_PREC = 'year'
      then: '''M'''
    - when: _CMEN_PREC = 'month' AND _AEN_IMP_MN = _CMEN_MN
      then: '''D'''
    - when: _CMEN_PREC = 'month'
      then: '''M'''
  submission:
    core: Perm
    mandatory: false
    length: 1
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: AENDY
  type: str
  label: Analysis End Relative Day
  derivation:
    case:
    - when: CM.CMENDTC = '(b)(6)'
      then: '''(b)(6)'''
    - when: _AENDY_INT IS NOT NULL
      then:
        str_decimal:
          source: _AENDY_INT
          decimals: 0
  submission:
    core: Perm
    mandatory: false
    length: 8
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: APERIOD
  type: float
  label: Period
  derivation:
    case:
    - when: ADSL.AP02SSDT IS NOT NULL AND ADSL.AP02SSDT <= _ASTDT
      then: 2
    - otherwise: 1
  submission:
    core: Perm
    mandatory: false
    length: 8
    significant_digits: 15
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: MDOSREF
  type: str
  label: Most Recent Dose Reference
  derivation:
    case:
    - when: ADSL.TR01SDT IS NOT NULL AND ADSL.TR01SDT <= _ASTDT AND (_ASTDT < ADSL.DOSE2DT OR (ADSL.DOSE2DT IS NULL AND (ADSL.TR02SDT IS NULL OR _ASTDT < ADSL.TR02SDT)))
      then: '''Vaccination 1'''
    - when: ADSL.TR01SDT IS NOT NULL AND ADSL.DOSE2DT <= _ASTDT AND (ADSL.TR02SDT IS NULL OR _ASTDT < ADSL.TR02SDT)
      then: '''Vaccination 2'''
    - when: ADSL.TR01SDT IS NOT NULL AND ADSL.TR02SDT <= _ASTDT AND (ADSL.OLDOS2DT IS NULL OR _ASTDT < ADSL.OLDOS2DT)
      then: '''OL Vaccination 1'''
    - when: ADSL.TR01SDT IS NOT NULL AND ADSL.OLDOS2DT <= _ASTDT
      then: '''OL Vaccination 2'''
  submission:
    core: Perm
    mandatory: false
    length: 50
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: MRDSTDY
  type: float
  label: Relative Start Day from Most Recent Dose
  derivation:
    case:
    - when: MDOSREF = 'Vaccination 1'
      then: _MRD_V1 + 1
    - when: MDOSREF = 'Vaccination 2'
      then: _MRD_V2 + 1
    - when: MDOSREF = 'OL Vaccination 1'
      then: _MRD_OL1 + 1
    - when: MDOSREF = 'OL Vaccination 2'
      then: _MRD_OL2 + 1
  submission:
    core: Perm
    mandatory: false
    length: 8
    significant_digits: 15
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: PREFL
  type: str
  label: Pre-treatment Flag
  derivation:
    case:
    - when: _ASTDT IS NULL OR _ASTDT < ADSL.TR01SDT
      then: '''Y'''
  submission:
    core: Perm
    mandatory: false
    length: 1
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: ONTRTFL
  type: str
  label: On Treatment Record Flag
  derivation:
    case:
    - when: APERIOD = 1 AND _ASTDT IS NOT NULL AND ADSL.TR01EDT IS NOT NULL AND _ASTDT <= _TR01EDT27 AND ((ADSL.TR01SDT IS NOT NULL AND _AENDT >= ADSL.TR01SDT) OR _CMEN_MISS = 'Y')
      then: '''Y'''
    - when: _ASTDT IS NULL AND ((ADSL.TR01SDT IS NOT NULL AND _AENDT >= ADSL.TR01SDT) OR _CMEN_MISS = 'Y')
      then: '''Y'''
    - when: APERIOD = 2 AND _ASTDT IS NOT NULL AND ADSL.TR02EDT IS NOT NULL AND _ASTDT <= _TR02EDT27 AND ((ADSL.TR02SDT IS NOT NULL AND _AENDT >= ADSL.TR02SDT) OR _CMEN_MISS = 'Y')
      then: '''Y'''
    - when: _ASTDT IS NULL AND ADSL.TR02SDT IS NOT NULL AND _AENDT >= ADSL.TR02SDT
      then: '''Y'''
  submission:
    core: Perm
    mandatory: false
    length: 1
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: FUPFL
  type: str
  label: Follow-up Flag
  derivation:
    case:
    - when: APERIOD = 1 AND ((_AENDT IS NOT NULL AND ADSL.TR01EDT IS NOT NULL AND _AENDT > _TR01EDT27) OR _CMEN_MISS = 'Y')
      then: '''Y'''
    - when: APERIOD = 2 AND ((_AENDT IS NOT NULL AND ADSL.TR02EDT IS NOT NULL AND _AENDT > _TR02EDT27) OR _CMEN_MISS = 'Y')
      then: '''Y'''
  submission:
    core: Perm
    mandatory: false
    length: 1
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
