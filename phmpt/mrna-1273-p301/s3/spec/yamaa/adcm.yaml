- name: _CMTRT_1
  type: str
  derivation:
    str_replace:
      source: CM.CMTRT
      pattern: '[\t\r\n\f\u{00C2}\u{00B0}\u{00A0}]'
      replacement: ' '
- name: _CMTRT_2
  type: str
  derivation:
    str_replace:
      source: _CMTRT_1
      pattern: ' {2,}'
      replacement: ' '
# CMSTDTC / CMENDTC as the released CM holds them: a complete date as
# M/D/YYYY (the JMP rendering), a partial date as ISO 8601 text, or
# '(b)(6)'. The program reads the ISO text, so a complete date is
# written back as YYYY-MM-DD.
- name: _ST_M
  type: str
  derivation:
    str_extract:
      source: CM.CMSTDTC
      pattern: '^([0-9]{1,2})/([0-9]{1,2})/([0-9]{4})$'
      group: 1
      no_match: null
- name: _ST_D
  type: str
  derivation:
    str_extract:
      source: CM.CMSTDTC
      pattern: '^([0-9]{1,2})/([0-9]{1,2})/([0-9]{4})$'
      group: 2
      no_match: null
- name: _ST_Y
  type: str
  derivation:
    str_extract:
      source: CM.CMSTDTC
      pattern: '^([0-9]{1,2})/([0-9]{1,2})/([0-9]{4})$'
      group: 3
      no_match: null
- name: _ST_MM
  type: str
  derivation:
    case:
    - when: str_contains(_ST_M, '^[0-9]$')
      then:
        str_template:
          template: '0{_ST_M}'
    - otherwise: _ST_M
- name: _ST_DD
  type: str
  derivation:
    case:
    - when: str_contains(_ST_D, '^[0-9]$')
      then:
        str_template:
          template: '0{_ST_D}'
    - otherwise: _ST_D
- name: _CMST_ISO
  type: str
  derivation:
    case:
    - when: _ST_Y IS NOT NULL
      then:
        str_template:
          template: '{_ST_Y}-{_ST_MM}-{_ST_DD}'
    - when: str_contains(CM.CMSTDTC, '^[0-9]{4}(-[0-9]{2})?$')
      then: CM.CMSTDTC
- name: _EN_M
  type: str
  derivation:
    str_extract:
      source: CM.CMENDTC
      pattern: '^([0-9]{1,2})/([0-9]{1,2})/([0-9]{4})$'
      group: 1
      no_match: null
- name: _EN_D
  type: str
  derivation:
    str_extract:
      source: CM.CMENDTC
      pattern: '^([0-9]{1,2})/([0-9]{1,2})/([0-9]{4})$'
      group: 2
      no_match: null
- name: _EN_Y
  type: str
  derivation:
    str_extract:
      source: CM.CMENDTC
      pattern: '^([0-9]{1,2})/([0-9]{1,2})/([0-9]{4})$'
      group: 3
      no_match: null
- name: _EN_MM
  type: str
  derivation:
    case:
    - when: str_contains(_EN_M, '^[0-9]$')
      then:
        str_template:
          template: '0{_EN_M}'
    - otherwise: _EN_M
- name: _EN_DD
  type: str
  derivation:
    case:
    - when: str_contains(_EN_D, '^[0-9]$')
      then:
        str_template:
          template: '0{_EN_D}'
    - otherwise: _EN_D
- name: _CMEN_ISO
  type: str
  derivation:
    case:
    - when: _EN_Y IS NOT NULL
      then:
        str_template:
          template: '{_EN_Y}-{_EN_MM}-{_EN_DD}'
    - when: str_contains(CM.CMENDTC, '^[0-9]{4}(-[0-9]{2})?$')
      then: CM.CMENDTC
- name: _CMST_PREC
  type: str
  derivation:
    precision:
      type: date
      source: _CMST_ISO
      invalid: null
- name: _CMEN_PREC
  type: str
  derivation:
    precision:
      type: date
      source: _CMEN_ISO
      invalid: null
- name: _CMEN_MISS
  type: str
  derivation:
    case:
    - when: CM.CMENDTC IS NULL OR CM.CMENDTC = ''
      then: '''Y'''
