# ADTTRE for Moderna mRNA-1273-P301, cut S3 (BLA Interim Analysis,
# cutoff 2021-03-26). Parent: ../../../spec/yamaa/base/adam-base-s3.yaml (which
# chains to ../../../spec/yamaa/base/adam-base.yaml; 86 shared + 59 S3-only ADSL
# columns). Derivations implement the S3 A60ADTTRE program: one
# row template per (PARAMCD, EVENTSEQ) over the per-subject ADEFF2
# intermediate SRC (9 templates: BOD ES1-3, BOI ES1-6), expanding
# ADEFF2 ANL01FL='Y' rows (BOD28D/BOI28D) by their score. Where the
# SAS code and the define disagree, the code is followed (see
# README.md). The define carries exactly one MethodDef (PARAM,
# agreeing with the program); EVENTSEQ/CNSR/EVNTDESC/STARTVAL/AVAL
# have an empty define Origin, so the program is the sole authority
# for them. File order is authoritative over define order: the
# submitted file puts TRTSEQP/TRTSEQPN/TRTSEQA/TRTSEQAN/TRTSDT/TRTEDT
# before TR01SDT/TR01SDTM, while the define lists TR01SDT/TR01SDTM
# first; output columns follow the file.
# SAP note (closed 2026-11-24, no-impact): the file labelled "SAP v3"
# (19745_S68_M5_sap-v3.pdf) is the P201 SAP v3.0 (27 Oct 2020), not a
# P301 SAP version; the only P301 SAP in the set is v1.0 (10 Sep 2020).
# The case definitions below are the program's own, so the spec follows
# the program, not a SAP version.
# Keys: unlike ADEFF, ADTTRE HAS a usable key: (STUDYID, USUBJID,
# PARAMCD, EVENTSEQ) is unique and non-missing on the submitted
# target, so verify.py can align this spec end to end; a single full
# run is attempted first (61,716 output rows, small inputs).
# Honest gaps: none in the derivation (see the generator header for
# the STARTVAL float typing, the 1e-10 offset form, and the
# unexercised missing-ADT edge).
yamaa: '1.0'
type: spec
model: ADaM
parent: ../../../spec/yamaa/base/adam-base-s3.yaml
domain: ADTTRE
keys:
- STUDYID
- USUBJID
- PARAMCD
- EVENTSEQ
input:
  ADEFF2:
    path: <adam-dir>/adeff2.parquet
    key:
    - STUDYID
    - USUBJID
  ADSL:
    path: <adam-dir>/adsl.parquet
    key:
    - STUDYID
    - USUBJID
submission:
  label: Recurrent of BOD/BOI Analysis Dataset
  class: BASIC DATA STRUCTURE
  structure: One record per subject per parameter per event sequence
  repeating: true
rows:
- id: bod_es1_rows
  dataset: SRC
  derivations:
    STUDYID: SRC._STUDYID
    USUBJID: SRC._USUBJID
    PARAMCD: SRC._PARAMCD
    EVENTSEQ: 1
    CNSR:
      case:
      - when: SRC._AVAL0 = 0
        then: 1
      - otherwise: 0
    EVNTDESC:
      case:
      - when: SRC._AVAL0 = 0.0
        then: '''Without COVID-19'''
      - when: SRC._AVAL0 = 1.0
        then: '''COVID-19 without hospitalization'''
      - when: SRC._AVAL0 = 2.0
        then: '''COVID-19 with hospitalization'''
      - otherwise: '''Death'''
    STARTVAL: 0.0
    AVAL:
      case:
      - when: SRC._AVAL0 = 0
        then: SRC._MIN_MINUS_RAND
      - otherwise: SRC._ADT_MINUS_RAND
  filter: SRC._PARAMCD = 'BOD' AND SRC._AVAL0 IN (0.0, 1.0, 2.0, 3.0)
- id: bod_es2_rows
  dataset: SRC
  derivations:
    STUDYID: SRC._STUDYID
    USUBJID: SRC._USUBJID
    PARAMCD: SRC._PARAMCD
    EVENTSEQ: 2
    CNSR: 0
    EVNTDESC:
      case:
      - when: SRC._AVAL0 = 2.0
        then: '''COVID-19 with hospitalization'''
      - otherwise: '''Death'''
    STARTVAL: SRC._ADT_MINUS_RAND
    AVAL: SRC._ADT_MINUS_RAND + 0.0000000001
  filter: SRC._PARAMCD = 'BOD' AND SRC._AVAL0 IN (2.0, 3.0)
- id: bod_es3_rows
  dataset: SRC
  derivations:
    STUDYID: SRC._STUDYID
    USUBJID: SRC._USUBJID
    PARAMCD: SRC._PARAMCD
    EVENTSEQ: 3
    CNSR: 0
    EVNTDESC: '''Death'''
    STARTVAL: SRC._ADT_MINUS_RAND + 0.0000000001
    AVAL: SRC._ADT_MINUS_RAND + 2 * 0.0000000001
  filter: SRC._PARAMCD = 'BOD' AND SRC._AVAL0 IN (3.0)
- id: boi_es1_rows
  dataset: SRC
  derivations:
    STUDYID: SRC._STUDYID
    USUBJID: SRC._USUBJID
