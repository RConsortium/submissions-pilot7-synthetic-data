- id: SRC
  dataset: ADEFF2
  filter: ADEFF2.ANL01FL = 'Y' AND ADEFF2.FASFL = 'Y'
  columns: [_STUDYID, _USUBJID, _PARAMCD, _PARAM, _ADT, _AVAL0, _RANDDT, _TR01SDT, _EFFCODT, _AP01EDT, _DTHDT, _EOSDT, _CUTOFFDT, _MINVALUE, _ADT_EPOCH, _RANDDT_EPOCH, _TR01SDT_EPOCH, _MINVALUE_EPOCH, _ADT_MINUS_RAND, _ADT_MINUS_TR01, _MIN_MINUS_RAND, _MIN_MINUS_TR01]
  derivations:
    _STUDYID:
      type: str
      derivation:
        str_template:
          template: '{ADEFF2.STUDYID}'
          missing: ''
    _USUBJID:
      type: str
      derivation:
        str_template:
          template: '{ADEFF2.USUBJID}'
          missing: ''
    _PARAMCD:
      type: str
      derivation:
        mapping:
          source: ADEFF2.PARAMCD
          dict:
            BOD28D: 'BOD'
            BOD7D: 'BOD'
            BOI28D: 'BOI'
            BOI7D: 'BOI'
          unmapped: null
    _PARAM:
      type: str
      derivation:
        mapping:
          source: _PARAMCD
          dict:
            BOD: 'Burden of Disease Score'
            BOI: 'Burden of Infection Score'
          unmapped: null
    _ADT:
      type: date
      derivation: ADEFF2.ADT
    _AVAL0:
      type: float
      derivation: ADEFF2.AVAL
    _RANDDT:
      type: date
      derivation: ADEFF2.RANDDT
    _TR01SDT:
      type: date
      derivation: ADEFF2.TR01SDT
    _EFFCODT:
      type: date
      derivation: ADEFF2.EFFCODT
    _AP01EDT:
      type: date
      derivation: ADEFF2.AP01EDT
    _DTHDT:
      type: date
      derivation: ADSL_LK.DTHDT
    _EOSDT:
      type: date
      derivation: ADSL_LK.EOSDT
    _CUTOFFDT:
      type: date
      derivation: ADSL_LK.CUTOFFDT
    _MINVALUE:
      type: date
      derivation:
        least: {sources: [_DTHDT, _EOSDT, _CUTOFFDT, _EFFCODT, _AP01EDT]}
    _ADT_EPOCH:
      type: int
      derivation:
        to_epoch_day:
          source: _ADT
    _RANDDT_EPOCH:
      type: int
      derivation:
        to_epoch_day:
          source: _RANDDT
    _TR01SDT_EPOCH:
      type: int
      derivation:
        to_epoch_day:
          source: _TR01SDT
    _MINVALUE_EPOCH:
      type: int
      derivation:
        to_epoch_day:
          source: _MINVALUE
    _ADT_MINUS_RAND:
      type: int
      derivation: _ADT_EPOCH - _RANDDT_EPOCH
    _ADT_MINUS_TR01:
      type: int
      derivation: _ADT_EPOCH - _TR01SDT_EPOCH
    _MIN_MINUS_RAND:
      type: int
      derivation: _MINVALUE_EPOCH - _RANDDT_EPOCH
    _MIN_MINUS_TR01:
      type: int
      derivation: _MINVALUE_EPOCH - _TR01SDT_EPOCH
