      - otherwise: '''Death'''
    STARTVAL: SRC._ADT_MINUS_TR01 + 0.0000000001
    AVAL: SRC._ADT_MINUS_TR01 + 2 * 0.0000000001
  filter: SRC._PARAMCD = 'BOI' AND SRC._AVAL0 IN (2.0, 3.0)
- id: boi_es4_rows
  dataset: SRC
  derivations:
    STUDYID: SRC._STUDYID
    USUBJID: SRC._USUBJID
    PARAMCD: SRC._PARAMCD
    EVENTSEQ: 4
    CNSR: 0
    EVNTDESC:
      case:
      - when: SRC._AVAL0 = 2.0
