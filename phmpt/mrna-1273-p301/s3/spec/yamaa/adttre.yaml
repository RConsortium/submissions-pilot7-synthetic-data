    CNSR: 0
    EVNTDESC:
      case:
      - when: SRC._AVAL0 = 1.0
        then: '''COVID-19 without hospitalization'''
      - when: SRC._AVAL0 = 2.0
        then: '''COVID-19 with hospitalization'''
      - otherwise: '''Death'''
    STARTVAL: SRC._ADT_MINUS_TR01
    AVAL: SRC._ADT_MINUS_TR01 + 0.0000000001
  filter: SRC._PARAMCD = 'BOI' AND SRC._AVAL0 IN (1.0, 2.0, 3.0)
- id: boi_es3_rows
  dataset: SRC
  derivations:
    STUDYID: SRC._STUDYID
    USUBJID: SRC._USUBJID
    PARAMCD: SRC._PARAMCD
