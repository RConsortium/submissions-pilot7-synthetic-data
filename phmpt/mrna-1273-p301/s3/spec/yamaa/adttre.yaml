      - when: SRC._AVAL0 = 0.0
        then: '''No infection'''
      - when: SRC._AVAL0 = 0.5
        then: '''Asymptomatic infection'''
      - when: SRC._AVAL0 = 1.0
        then: '''COVID-19 without hospitalization'''
      - when: SRC._AVAL0 = 2.0
        then: '''COVID-19 with hospitalization'''
      - otherwise: '''Death'''
    STARTVAL: 0.0
    AVAL:
      case:
      - when: SRC._AVAL0 = 0
        then: SRC._MIN_MINUS_TR01
      - otherwise: SRC._ADT_MINUS_TR01
  filter: SRC._PARAMCD = 'BOI' AND SRC._AVAL0 IN (0.0, 0.5, 1.0, 2.0, 3.0)
- id: boi_es2_rows
  dataset: SRC
  derivations:
    STUDYID: SRC._STUDYID
    USUBJID: SRC._USUBJID
    PARAMCD: SRC._PARAMCD
