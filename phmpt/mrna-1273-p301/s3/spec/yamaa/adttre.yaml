      - otherwise: '''Death'''
    STARTVAL: SRC._ADT_MINUS_TR01 + 2 * 0.0000000001
    AVAL: SRC._ADT_MINUS_TR01 + 3 * 0.0000000001
  filter: SRC._PARAMCD = 'BOI' AND SRC._AVAL0 IN (2.0, 3.0)
- id: boi_es5_rows
  dataset: SRC
  derivations:
    STUDYID: SRC._STUDYID
    USUBJID: SRC._USUBJID
    PARAMCD: SRC._PARAMCD
    EVENTSEQ: 5
    CNSR: 0
    EVNTDESC: '''Death'''
    STARTVAL: SRC._ADT_MINUS_TR01 + 3 * 0.0000000001
    AVAL: SRC._ADT_MINUS_TR01 + 4 * 0.0000000001
  filter: SRC._PARAMCD = 'BOI' AND SRC._AVAL0 IN (3.0)
- id: boi_es6_rows
  dataset: SRC
