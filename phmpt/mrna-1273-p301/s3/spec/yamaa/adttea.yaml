        TCVDSVC2: Time to Severe COVID-19 (Prior Infection Censoring) after Dose 2 (Days)
        TCVDSVC3: Time to Severe COVID-19 (Prior Infection Censoring) 14 Days after Dose 1 (Days)
        TCVDSVC4: Time to Severe COVID-19 (Prior Infection Censoring) after Dose 1 (Days)
        TCVDSVC5: Time to Severe COVID-19 (Prior Infection Censoring) after Randomization (Days)
        TCVDSVC6: Time to Severe COVID-19 (Prior Infection Censoring) 35 Days after Dose 2 (Days)
        TCVDSVC9: Time to Severe COVID-19 (Prior Infection Censoring) in Open Label Phase (Days)
        TTCVDC1: Time to COVID-19 (Prior Infection Censoring) 14 Days after Dose 2 (Days)
        TTCVDC2: Time to COVID-19 (Prior Infection Censoring) after Dose 2 (Days)
        TTCVDC3: Time to COVID-19 (Prior Infection Censoring) 14 Days after Dose 1 (Days)
        TTCVDC4: Time to COVID-19 (Prior Infection Censoring) after Dose 1 (Days)
        TTCVDC5: Time to COVID-19 (Prior Infection Censoring) after Randomization (Days)
        TTCVDC6: Time to COVID-19 (Prior Infection Censoring) 35 Days after Dose 2 (Days)
        TTCVDC9: Time to COVID-19 (Prior Infection Censoring) in Open Label Phase (Days)
      unmapped: null
  submission:
    core: Req
    mandatory: true
    length: 200
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: PARAMCD
  type: str
  label: Parameter Code
  submission:
    core: Req
    mandatory: true
    length: 8
    origins:
    - type: Assigned
- name: STARTDT
  type: date
  label: Time-to-Event Origin Date for Subject
  derivation:
    case:
    - when: PARAMCD IN ('TTCVDC9', 'TCVDSVC9')
      then: ADSL.AP02SDT
    - otherwise: ADSL.RANDDT
  submission:
    core: Req
    mandatory: true
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: CVD53DT
  type: date
  label: Date of 53rd COVID-19 Case
  derivation: DATE '2020-10-26'
  submission:
    core: Req
    mandatory: true
    origins:
    - type: Assigned
- name: ADT
  type: date
  label: Analysis Date
  derivation:
    case:
    - when: _ADT_RAW IS NOT NULL AND STARTDT IS NOT NULL AND _ADT_RAW < STARTDT
      then: STARTDT
    - otherwise: _ADT_RAW
  submission:
    core: Req
    mandatory: true
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: APERIOD
  type: int
  label: Period
  derivation:
    case:
    - when: ADSL.AP02SDT IS NOT NULL AND ADSL.AP02SDT <= ADT
      then: 2
    - otherwise: 1
  submission:
    core: Perm
    mandatory: false
    length: 8
    display_format: '3.'
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: AVAL
