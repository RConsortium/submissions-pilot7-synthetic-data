# ADTTEA for Moderna mRNA-1273-P301, cut S3 (BLA Interim Analysis,
# cutoff 2021-03-26). Parent: ../../../spec/yamaa/base/adam-base-s3.yaml (which
# chains to ../../../spec/yamaa/base/adam-base.yaml; 86 shared + 59 S3-only ADSL
# columns). Derivations implement the S3 A50ADTT program: one row
# per FAS subject per PARAMCD (14 PARAMCDs), from the submitted
# ADEFF (adjudicated rows: first event per subject per PARAMCD),
# the verified ADSL, first positive MB / IS dates for the
# prior-infection rule, and SDTM XQ for CDCCD / LGROUP / LINEAGES.
# Where the SAS code and the define.xml method text disagree, the
# code is followed (see README.md), except for CDCCD / LGROUP /
# LINEAGES, which the program never reads and the define methods
# source from SDTM XQ (confirmed row-for-row against the data).
# SAP note (closed 2026-11-24, no-impact): the file labelled "SAP v3"
# (19745_S68_M5_sap-v3.pdf) is the P201 SAP v3.0 (27 Oct 2020), not a
# P301 SAP version; the only P301 SAP in the set is v1.0 (10 Sep 2020).
# The case definitions below are the program's own, so the spec follows
# the program, not a SAP version.
# Program-vs-data note: the program also calls %dev_tte for TTCVD /
# TTCVDSE / TTASYMP / TTCVD1B, but the submitted ADTTEA has zero rows
# for those 26 PARAMCDs and the define's own CL.ADTTEA.PARAMCD
# codelist lists exactly the 14 PARAMCDs present in the data, so the
# spec emits only those 14. KEYS: unlike ADEFF, ADTTEA HAS a usable
# key: (STUDYID, USUBJID, PARAMCD) is unique and non-missing on the
# submitted target, and there is no ASEQ column.
# Honest gaps: none. A pandas prototype reproduces the submitted
# target exactly on all 106 columns (0 mismatches), and the yamaa
# spec is expected to verify EXACT MATCH the same way; the full
# verify.py run OOMs in this 6 GB cell (417,706 rows), so verification
# fell back to pruned dependency-closure groups (see
# adttea/verify_report.json, original work tree) and was then re-verified in
# full by split-by-subject runs of the UNCHANGED spec in 4 SEX x AGE
# partitions (session 54, 2026-11-23; see verify_report_s3_split.json)
# - EXACT MATCH strict, 0 mismatches, identical to the pruned-group
# baseline; no roomier-cell re-run is owed.
yamaa: '1.0'
type: spec
model: ADaM
parent: ../../../spec/yamaa/base/adam-base-s3.yaml
domain: ADTTEA
keys:
- STUDYID
- USUBJID
- PARAMCD
input:
  MB: <sdtm-dir>/mb.parquet
  IS: <sdtm-dir>/is.parquet
  XQ: <sdtm-dir>/xq.parquet
  ADEFF:
    path: <adam-dir>/adeff.parquet
    key:
    - STUDYID
    - USUBJID
  ADSL:
    path: <adam-dir>/adsl.parquet
    key:
    - STUDYID
    - USUBJID
submission:
  label: Time to Event per AC Analysis Dataset
  class: BASIC DATA STRUCTURE
  structure: One record per subject per parameter
  repeating: true
rows:
- id: ttcvdc1_rows
  dataset: ADSL
  derivations:
    STUDYID: ADSL.STUDYID
    USUBJID: ADSL.USUBJID
    PARAMCD: '''TTCVDC1'''
    _EVENT_DT: EV_COVIDA_1._ADT
    _EVENT_EPOCH:
      to_epoch_day:
        source: _EVENT_DT
    _PCRDT_E: EV_COVIDA_1._PCRDT
    _PCRDT_EPOCH:
      to_epoch_day:
        source: _PCRDT_E
    _APERIOD_E: EV_COVIDA_1._APERIOD
    _PCR_POS_DT:
      case:
      - when: EXCL_PCRD29._FLAG IS NOT NULL
        then: null
      - otherwise: PCR_POS_1._DT
    _PCR_POS_EPOCH:
      to_epoch_day:
        source: _PCR_POS_DT
    _ELEC_POS_DT: ELEC_POS_1._DT
    _ELEC_POS_EPOCH:
      to_epoch_day:
        source: _ELEC_POS_DT
    _EARLY: SUBJ_EARLY._ADT
    _DOSE2_EPOCH:
      to_epoch_day:
        source: ADSL.DOSE2DT
    _TR01_EPOCH:
      to_epoch_day:
        source: ADSL.TR01SDT
    _RAND_EPOCH:
      to_epoch_day:
        source: ADSL.RANDDT
    _DTHDT_EPOCH:
      to_epoch_day:
        source: ADSL.DTHDT
    _EOSDT_EPOCH:
      to_epoch_day:
        source: ADSL.EOSDT
    _CUTOFFDT_EPOCH:
      to_epoch_day:
        source: ADSL.CUTOFFDT
    _EFFCODT_EPOCH:
      to_epoch_day:
        source: ADSL.EFFCODT
    _AP01EDT_EPOCH:
      to_epoch_day:
        source: ADSL.AP01EDT
    _MINDT_EPOCH:
      least: {sources: [_DTHDT_EPOCH, _EOSDT_EPOCH, _CUTOFFDT_EPOCH, _EFFCODT_EPOCH]}
    _INWIN:
      case:
      - when: _EVENT_DT IS NOT NULL AND _EVENT_EPOCH <= _MINDT_EPOCH
        then: 1
      - otherwise: 0
    _CENSDT:
      least: {sources: [ADSL.DTHDT, ADSL.EOSDT, ADSL.EFFCODT, ADSL.AP01EDT]}
    _CENSDT_EPOCH:
      to_epoch_day:
        source: _CENSDT
    _ADT_TPT:
      case:
      - when: _INWIN = 1 AND _DOSE2_EPOCH IS NOT NULL AND _DOSE2_EPOCH + 14 <= _EVENT_EPOCH
        then: _EVENT_DT
      - when: _INWIN = 1 AND (_DOSE2_EPOCH IS NULL OR _DOSE2_EPOCH + 14 > _EVENT_EPOCH)
        then: _EVENT_DT
      - otherwise: null
    _ADT_TPT_EPOCH:
      to_epoch_day:
        source: _ADT_TPT
    _CNSR_TPT:
      case:
      - when: _INWIN = 1 AND _DOSE2_EPOCH IS NOT NULL AND _DOSE2_EPOCH + 14 <= _EVENT_EPOCH
        then: 0
      - when: _INWIN = 1 AND (_DOSE2_EPOCH IS NULL OR _DOSE2_EPOCH + 14 > _EVENT_EPOCH)
        then: 1
      - otherwise: null
    _DESC_TPT:
      case:
      - when: _INWIN = 1 AND _DOSE2_EPOCH IS NOT NULL AND _DOSE2_EPOCH + 14 <= _EVENT_EPOCH
        then: '''COVID-19 (Prior Infection Censoring)'''
      - when: _INWIN = 1 AND (_DOSE2_EPOCH IS NULL OR _DOSE2_EPOCH + 14 > _EVENT_EPOCH)
        then: '''Early COVID-19 (Prior Infection Censoring)'''
      - otherwise: null
    _ADT_RAW:
      case:
      - when: ((_PCR_POS_EPOCH IS NOT NULL AND _PCR_POS_EPOCH < _ADT_TPT_EPOCH) OR (_ELEC_POS_EPOCH IS NOT NULL AND _ELEC_POS_EPOCH < _ADT_TPT_EPOCH))
        then:
          least: {sources: [_PCR_POS_DT, _ELEC_POS_DT]}
      - when: _ADT_TPT IS NOT NULL
        then: _ADT_TPT
      - otherwise: _CENSDT
    _CNSR_RAW:
      case:
      - when: ((_PCR_POS_EPOCH IS NOT NULL AND _PCR_POS_EPOCH < _ADT_TPT_EPOCH) OR (_ELEC_POS_EPOCH IS NOT NULL AND _ELEC_POS_EPOCH < _ADT_TPT_EPOCH))
        then: 1
      - when: _ADT_TPT IS NOT NULL
        then: _CNSR_TPT
      - otherwise: 1
    _EVNTDESC_RAW:
      case:
      - when: ((_PCR_POS_EPOCH IS NOT NULL AND _PCR_POS_EPOCH < _ADT_TPT_EPOCH) OR (_ELEC_POS_EPOCH IS NOT NULL AND _ELEC_POS_EPOCH < _ADT_TPT_EPOCH))
        then: '''Infection Prior to COVID-19 (Prior Infection Censoring)'''
      - when: _ADT_TPT IS NOT NULL
        then: _DESC_TPT
      - otherwise: '''No COVID-19 (Prior Infection Censoring)'''
  filter: ADSL.FASFL = 'Y'
