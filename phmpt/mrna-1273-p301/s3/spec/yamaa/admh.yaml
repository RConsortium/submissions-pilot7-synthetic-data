# ADMH for Moderna mRNA-1273-P301, cut S3 (BLA Interim
# Analysis, cutoff 2021-03-26). Parent:
# ../../../spec/yamaa/base/adam-base-s3.yaml (which chains to
# ../../../spec/yamaa/base/adam-base.yaml; 86 shared + 59 S3-only ADSL
# columns). Derivations implement the S3 ADMH program
# (Bates 3820410-3820413, %let dsetname = admh). One row
# template drives on SDTM MH, filtered to MHCAT='GENERAL'
# and inner-joined to the verified ADSL on (STUDYID,
# USUBJID): 367,030 MH rows -> 176,643 GENERAL -> 176,585
# submitted rows (58 drops are subjects not in ADSL). The
# program reads NO S27 file; ADMH is S3-only (no IA ADMH
# program exists). SMQ/CQ term lists are reconstructed
# from the submitted ADMH (import.smq / import.cmq are not
# in Module 5). The 21 ADSL date/datetime columns the S3
# ADMH JMP file stores as DATE9 / datetime character text
# are formatted from the ADSL values; EFFCODT, AP01SDT
# and AP01SSDT are native dates in the target and are plain
# ADSL copies. No gaps are known: every column was
# prototyped against the submitted data and matched exactly.
# See the generator header for the full design notes.
yamaa: '1.0'
type: spec
model: ADaM
parent: ../../../spec/yamaa/base/adam-base-s3.yaml
domain: ADMH
keys:
- STUDYID
- USUBJID
- MHSEQ
input:
  MH: <sdtm-dir>/mh.parquet
  ADSL:
    path: <adam-dir>/adsl.parquet
    key:
    - STUDYID
    - USUBJID
submission:
  label: Medical History Analysis Dataset
  class: OCCURRENCE DATA STRUCTURE
  structure: One record per subject per medical history
  repeating: true
rows:
- id: mh_rows
  dataset: MH
  derivations:
    STUDYID: MH.STUDYID
    USUBJID: MH.USUBJID
  filter: MH.MHCAT = 'GENERAL' AND _ADSL IS NOT NULL
columns:
- name: _ADSL
  type: str
  derivation: ADSL.USUBJID
- name: STUDYID
  submission:
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: USUBJID
  submission:
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
