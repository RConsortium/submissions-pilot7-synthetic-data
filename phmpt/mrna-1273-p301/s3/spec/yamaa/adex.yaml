# ADEX for Moderna mRNA-1273-P301, cut S3 (BLA Interim Analysis,
# cutoff 2021-03-26). Parent: ../../../spec/yamaa/base/adam-base-s3.yaml (which
# chains to ../../../spec/yamaa/base/adam-base.yaml; 86 shared + 59 S3-only ADSL
# columns). Derivations implement the S3 A20ADEX program: EX rows
# plus the ECOCCUR='N' EC rows (SUPPEC pivoted in), each
# inner-joined to the verified ADSL on USUBJID, with ASEQ assigned
# per subject by the SAS sort (visitnum, exseq, ecseq, desc srcdom).
# Where the SAS code and the define.xml method text disagree, the
# code is followed (see README.md). Honest gaps: NDOSRSP, 2 cells
# (see the generator header).
yamaa: '1.0'
type: spec
model: ADaM
parent: ../../../spec/yamaa/base/adam-base-s3.yaml
domain: ADEX
keys:
- STUDYID
- USUBJID
- ASEQ
input:
  EX: <sdtm-dir>/ex.parquet
  EC: <sdtm-dir>/ec.parquet
  SUPPEC: <sdtm-dir>/suppec.parquet
  ADSL:
    path: <adam-dir>/adsl.parquet
    key:
    - STUDYID
    - USUBJID
submission:
  label: Treatment Exposure Analysis Dataset
  class: OCCURRENCE DATA STRUCTURE
  structure: One record per subject per administration
  repeating: true
rows:
- id: ex_rows
  dataset: EX
  derivations:
    STUDYID: EX.STUDYID
    USUBJID: EX.USUBJID
    _SRC: '''EX'''
    _EXSEQ: EX.EXSEQ
    _ECSEQ: null
    _TRT: EX.EXTRT
    _DOSE: EX.EXDOSE
    _DOSU: EX.EXDOSU
    _DOSFRM: EX.EXDOSFRM
    _DOSFRQ: EX.EXDOSFRQ
    _ROUTE: EX.EXROUTE
    _LOC: EX.EXLOC
    _LAT: EX.EXLAT
    _STDTC: EX.EXSTDTC
    _ENDTC: EX.EXENDTC
    _STDY: EX.EXSTDY
    _VISIT: EX.VISIT
    _VISITNUM: EX.VISITNUM
    _NDOSERS: null
    _NDOSRSP: null
    _NDOSRSP1: null
    _NDOSRSP2: null
    _SRCSEQ: EX.EXSEQ
  filter: _ADSL IS NOT NULL
- id: ec_rows
  dataset: EC
  derivations:
    STUDYID: EC.STUDYID
    USUBJID: EC.USUBJID
    _SRC: '''EC'''
    _EXSEQ: null
    _ECSEQ: EC.ECSEQ
    _TRT: null
    _DOSE: null
    _DOSU: null
    _DOSFRM: null
    _DOSFRQ: null
    _ROUTE: null
    _LOC: null
    _LAT: null
    _STDTC: null
    _ENDTC: null
    _STDY: null
    _VISIT: EC.VISIT
    _VISITNUM: EC.VISITNUM
    _NDOSERS: SUPP_P.ECREASOC
    _NDOSRSP: SUPP_P.EXREASSP
    _NDOSRSP1: SUPP_P.EXREASP1
    _NDOSRSP2: SUPP_P.EXREASP2
    _SRCSEQ: EC.ECSEQ
  filter: EC.ECOCCUR = 'N' AND _ADSL IS NOT NULL
intermediates:
- id: SUPP_P
  dataset: SUPPEC
  key:
    STUDYID: STUDYID
    USUBJID: USUBJID
    IDVARVAL:
      str_decimal:
        source: _ECSEQ
        decimals: 0
  filter: SUPPEC.QNAM IN ('ECREASOC', 'EXREASSP', 'EXREASP1', 'EXREASP2') AND SUPPEC.IDVAR = 'ECSEQ'
  pivot:
    name: QNAM
    value: QVAL
    fields:
    - ECREASOC
    - EXREASSP
    - EXREASP1
    - EXREASP2
windows:
  ASEQ_W:
    group_by:
    - USUBJID
    order_by:
    - VISITNUM
    - _EXSEQ
    - _ECSEQ
    - variable: _SRC
      direction: desc
