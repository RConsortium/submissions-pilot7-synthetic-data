# ADEFF2 for Moderna mRNA-1273-P301, cut S3 (BLA Interim Analysis,
# cutoff 2021-03-26). Parent: ../../../spec/yamaa/base/adam-base-s3.yaml (which
# chains to ../../../spec/yamaa/base/adam-base.yaml; 86 shared + 59 S3-only ADSL
# columns). Derivations implement the S3 A50ADEFF2 program, one
# row template per (PARAMCD, AWRANGEN) over the per-subject ALL
# intermediate (18 templates: BOD7D/BOD28D x awrangen 1-4,
# BOI7D/BOI28D x awrangen 1-5). Where the SAS code and the define
# disagree, the code is followed (see README.md). The define
# carries no MethodDefs for ADEFF2, so the program is the sole
# derivation authority. File order is authoritative over define
# order: the submitted file puts TRTSEQP/TRTSEQPN/TRTSEQA/TRTSEQAN/
# TRTSDT/TRTEDT before TR01SDT/TR01SDTM, while the define lists
# TR01SDT/TR01SDTM first; output columns follow the file.
# SAP note (closed 2026-11-24, no-impact): the file labelled "SAP v3"
# (19745_S68_M5_sap-v3.pdf) is the P201 SAP v3.0 (27 Oct 2020), not a
# P301 SAP version; the only P301 SAP in the set is v1.0 (10 Sep 2020).
# The case definitions below are the program's own, so the spec follows
# the program, not a SAP version.
# Keys: unlike ADEFF, ADEFF2 HAS a usable key: (STUDYID, USUBJID,
# PARAMCD, AWRANGEN) is unique and non-missing on the submitted
# target, so verify.py can align this spec end to end. The full
# run may still OOM in this 6 GB cell (536,274 output rows);
# verification then falls back to 4 pruned dependency-closure
# groups (one per PARAMCD), recorded honestly in
# adeff2/verify_report.json (original work tree), with a single full-spec
# re-run in a roomier cell owed.
# Honest gaps: none in the derivation (see the generator header for
# the HOSTDTC datetime form, the exact-threshold note, and the
# unexercised missing-EVENTMO edge).
yamaa: '1.0'
type: spec
model: ADaM
parent: ../../../spec/yamaa/base/adam-base-s3.yaml
domain: ADEFF2
keys:
- STUDYID
- USUBJID
- PARAMCD
- AWRANGEN
input:
  ADEFF:
    path: <adam-dir>/adeff.parquet
    key:
    - STUDYID
    - USUBJID
  ADSL:
    path: <adam-dir>/adsl.parquet
    key:
    - STUDYID
    - USUBJID
  HO: <sdtm-dir>/ho.parquet
submission:
  label: BOD/BOI Score Analysis Dataset
  class: BASIC DATA STRUCTURE
  structure: One record per subject per BOD/BOI parameter per analysis window
  repeating: true
