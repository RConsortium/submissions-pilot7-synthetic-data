- id: EFF1
  dataset: ADEFF
  key:
  - USUBJID
  filter: ADEFF.PARAMCD = 'COVIDA' AND ADEFF.APERIOD = 1 AND ADEFF.ADT IS NOT NULL AND ADEFF.ADT <= ADEFF.EFFCODT
  order_by:
  - ADEFF.ADT
  keep: first
  columns: [_ADT1, _AVALC1]
  derivations:
    _ADT1:
      type: date
      derivation: ADEFF.ADT
    _AVALC1:
      type: str
      derivation: ADEFF.AVALC
- id: EFF2
  dataset: ADEFF
  key:
  - USUBJID
  filter: ADEFF.PARAMCD = 'ASYMPINF' AND ADEFF.APERIOD = 1 AND ADEFF.ADT IS NOT NULL AND ADEFF.ADT <= ADEFF.EFFCODT
  order_by:
  - ADEFF.ADT
  keep: first
  columns: [_ADT2, _AVALC2]
  derivations:
    _ADT2:
      type: date
      derivation: ADEFF.ADT
    _AVALC2:
      type: str
      derivation: ADEFF.AVALC
- id: HO1
  dataset: HO
  key:
  - USUBJID
  filter: HO.HOOCCUR = 'Y' AND HO.HOSTDTC IS NOT NULL AND HO.HOSTDTC NOT IN ('') AND (HO.HOTERM IS NULL OR HO.HOTERM <> 'MEDICALLY ATTENDED') AND HO._HOSTDT IS NOT NULL AND HO._ADT1 IS NOT NULL AND HO._HOSTDT >= HO._ADT1
  order_by:
  - HO._HODY1
  keep: first
  columns: [_HODY1]
  derivations:
    _HOSTDT:
      type: date
      derivation:
        to_date:
          source: HO.HOSTDTC
    _HOSTDT_EPOCH:
      type: int
      derivation:
        to_epoch_day:
          source: _HOSTDT
    _ADT1:
      type: date
      derivation: EFF1._ADT1
    _ADT1_EPOCH:
      type: int
      derivation:
        to_epoch_day:
          source: _ADT1
    _HODY1:
      type: int
      derivation: _HOSTDT_EPOCH - _ADT1_EPOCH + 1
- id: HO2
  dataset: HO
  key:
  - USUBJID
  filter: HO.HOOCCUR = 'Y' AND HO.HOSTDTC IS NOT NULL AND HO.HOSTDTC NOT IN ('') AND (HO.HOTERM IS NULL OR HO.HOTERM <> 'MEDICALLY ATTENDED') AND HO._HODY2 IS NOT NULL AND HO._HODY2 >= 1
  order_by:
  - HO._HODY2
  keep: first
  columns: [_HODY2]
  derivations:
    _HOSTDT:
      type: date
      derivation:
        to_date:
          source: HO.HOSTDTC
    _HOSTDT_EPOCH:
      type: int
      derivation:
        to_epoch_day:
          source: _HOSTDT
    _ADT1:
      type: date
      derivation: EFF1._ADT1
    _ADT2:
      type: date
      derivation: EFF2._ADT2
    _ADT_CO:
      type: date
      derivation:
        first_available: {sources: [_ADT1, _ADT2]}
    _ADT_CO_EPOCH:
      type: int
      derivation:
        to_epoch_day:
          source: _ADT_CO
    _HODY2:
      type: int
      derivation: _HOSTDT_EPOCH - _ADT_CO_EPOCH + 1
- id: ALL
  dataset: ADSL
  filter: ADSL.RANDFL = 'Y'
  columns: [_STUDYID, _USUBJID, _RANDDT, _DTHDT, _TR01SDT, _ADT1, _AVALC1, _ADT2, _AVALC2, _HODY1, _HODY2, _ADT_BOI, _AVALCT, _ADT1_EPOCH, _ADT_BOI_EPOCH, _RANDDT_EPOCH, _TR01SDT_EPOCH, _DTHDT_EPOCH, _EVENTMO1, _EVENTMO2, _DTHDY1, _DTHDY2, _BOD7D_AVAL_1, _BOD7D_AVAL_2, _BOD7D_AVAL_3, _BOD7D_AVAL_4, _BOD28D_AVAL_1, _BOD28D_AVAL_2, _BOD28D_AVAL_3, _BOD28D_AVAL_4, _BOI7D_AVAL_1, _BOI7D_AVAL_2, _BOI7D_AVAL_3, _BOI7D_AVAL_4, _BOI7D_AVAL_5, _BOI28D_AVAL_1, _BOI28D_AVAL_2, _BOI28D_AVAL_3, _BOI28D_AVAL_4, _BOI28D_AVAL_5, _MAXAVAL_BOD7D, _MAXAWR_BOD7D, _MAXAVAL_BOD28D, _MAXAWR_BOD28D, _MAXAVAL_BOI7D, _MAXAWR_BOI7D, _MAXAVAL_BOI28D, _MAXAWR_BOI28D]
  derivations:
    _STUDYID:
      type: str
      derivation:
        str_template:
          template: '{ADSL.STUDYID}'
          missing: ''
    _USUBJID:
      type: str
      derivation:
        str_template:
          template: '{ADSL.USUBJID}'
          missing: ''
    _RANDDT:
      type: date
      derivation: ADSL_LK.RANDDT
    _DTHDT:
      type: date
      derivation: ADSL_LK.DTHDT
    _TR01SDT:
      type: date
      derivation: ADSL_LK.TR01SDT
    _ADT1:
      type: date
      derivation: EFF1._ADT1
    _AVALC1:
      type: str
      derivation: EFF1._AVALC1
    _ADT2:
      type: date
      derivation: EFF2._ADT2
    _AVALC2:
      type: str
      derivation: EFF2._AVALC2
    _HODY1:
      type: int
      derivation: HO1._HODY1
    _HODY2:
      type: int
      derivation: HO2._HODY2
    _ADT_BOI:
      type: date
      derivation:
        first_available: {sources: [_ADT1, _ADT2]}
    _AVALCT:
      type: str
      derivation:
        first_available: {sources: [_AVALC1, _AVALC2]}
    _ADT1_EPOCH:
      type: int
      derivation:
        to_epoch_day:
          source: _ADT1
    _ADT_BOI_EPOCH:
      type: int
      derivation:
        to_epoch_day:
          source: _ADT_BOI
    _RANDDT_EPOCH:
      type: int
      derivation:
        to_epoch_day:
          source: _RANDDT
    _TR01SDT_EPOCH:
      type: int
      derivation:
        to_epoch_day:
          source: _TR01SDT
    _DTHDT_EPOCH:
      type: int
      derivation:
        to_epoch_day:
          source: _DTHDT
    _EVENTMO1:
      type: float
      derivation: (_ADT1_EPOCH - _RANDDT_EPOCH + 1) / 30.4375
    _EVENTMO2:
      type: float
      derivation: (_ADT_BOI_EPOCH - _TR01SDT_EPOCH + 1) / 30.4375
    _DTHDY1:
      type: int
      derivation: _DTHDT_EPOCH - _ADT1_EPOCH + 1
    _DTHDY2:
      type: int
      derivation: _DTHDT_EPOCH - _ADT_BOI_EPOCH + 1
    _BOD7D_AVAL_1:
      type: float
      derivation:
        case:
        - when: (_AVALC1 IS NULL OR NOT (_AVALC1 LIKE 'Y%')) OR (_EVENTMO1 IS NOT NULL AND _EVENTMO1 > 6)
          then: 0.0
        - when: _EVENTMO1 IS NOT NULL AND 0 < _EVENTMO1 AND _EVENTMO1 <= 6 AND _AVALC1 LIKE 'Y%' AND _DTHDY1 IS NOT NULL AND _DTHDY1 <= 7
          then: 3.0
        - when: _EVENTMO1 IS NOT NULL AND 0 < _EVENTMO1 AND _EVENTMO1 <= 6 AND _AVALC1 LIKE 'Y%' AND _HODY1 IS NOT NULL AND 1 <= _HODY1 AND _HODY1 <= 7
          then: 2.0
        - when: _EVENTMO1 IS NOT NULL AND 0 < _EVENTMO1 AND _EVENTMO1 <= 6 AND _AVALC1 LIKE 'Y%'
          then: 1.0
    _BOD7D_AVAL_2:
      type: float
      derivation:
        case:
        - when: (_AVALC1 IS NULL OR NOT (_AVALC1 LIKE 'Y%')) OR (_EVENTMO1 IS NOT NULL AND _EVENTMO1 > 12)
          then: 0.0
        - when: _EVENTMO1 IS NOT NULL AND 6 < _EVENTMO1 AND _EVENTMO1 <= 12 AND _AVALC1 LIKE 'Y%' AND _DTHDY1 IS NOT NULL AND _DTHDY1 <= 7
          then: 3.0
        - when: _EVENTMO1 IS NOT NULL AND 6 < _EVENTMO1 AND _EVENTMO1 <= 12 AND _AVALC1 LIKE 'Y%' AND _HODY1 IS NOT NULL AND 1 <= _HODY1 AND _HODY1 <= 7
          then: 2.0
        - when: _EVENTMO1 IS NOT NULL AND 6 < _EVENTMO1 AND _EVENTMO1 <= 12 AND _AVALC1 LIKE 'Y%'
          then: 1.0
    _BOD7D_AVAL_3:
      type: float
      derivation:
        case:
