  type: int
  label: Period
  derivation:
    case:
    - when: ADSL.AP02SDT IS NOT NULL AND ADSL.AP02SDT <= ADT
      then: 2
    - otherwise: 1
  submission:
    core: Perm
    mandatory: false
    length: 8
    display_format: '3.'
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
