- name: _VISIT_T
  type: str
  derivation:
    case:
    - when: str_contains(_VISIT, 'Illness Visit Day 3 - Day 21') AND (_MBTPT IS NULL OR _MBTPT IN ('') OR str_contains(_MBTPT, 'Uns'))
      then:
        str_template: '{_VISIT} Unscheduled 1'
    - when: _VISIT = 'Illness Visit Day 3 - Day 21'
      then:
        str_template: Illness Visit {_MBTPT}
    - when: str_contains(_VISIT, '^Illness Visit Day 3 - Day 21')
      then:
        str_template: Illness Visit {_MBTPT} Unscheduled 1
    - when: (_VISIT IS NULL OR _VISIT IN ('')) AND _LOCALFL = 'Y'
      then: '''Illness Visit Day 999 Unscheduled 1'''
    - otherwise: _VISIT
- name: _VISIT_T2
  type: str
  derivation:
    str_replace:
      source: _VISIT_T
      pattern: Convalescence
      replacement: Illness
- name: _VISIT_W
  type: str
  derivation:
    case:
    - when: (_VISIT_T2 IS NULL OR _VISIT_T2 IN ('') OR str_contains(_VISIT_T2, 'Saf') OR str_contains(_VISIT_T2, 'COV'))
      then:
        str_template:
          template: Unsched {_VISIT_T2}
          missing: 'Unsched '
    - otherwise: _VISIT_T2
- name: _VISIT_WU
  type: str
  derivation:
    str_case:
      source: _VISIT_W
      to: upper
- name: _DAY_TXT
  type: str
  derivation:
    str_extract:
      source: _VISIT_W
      pattern: Day ([0-9]+)
      group: 1
      no_match: ''
- name: _DATE_TXT
  type: str
  derivation:
    case:
    - when: _MBDTC IS NULL OR _MBDTC IN ('')
      then: ''''''
    - otherwise:
        str_substr:
          source: _MBDTC
          start: 1
          length: 10
- name: _MBTPTNUM_TXT
  type: str
  derivation:
    str_decimal:
      source: _MBTPTNUM
      decimals: 0
      width: 3
- name: _ADDSORTN
  type: str
  derivation:
    case:
    - when: str_contains(_VISIT_T, '^Visit') AND NOT str_contains(_VISIT_T, 'Uns')
      then: ''''''
    - when: (_VISIT_T IS NULL OR _VISIT_T IN ('') OR str_contains(_VISIT_T, 'Uns')) AND ADT IS NOT NULL
      then:
        str_template: '{_DATE_TXT} - 999'
    - when: str_contains(_VISIT, '^Illness Visit Day 3 - Day 21') AND str_contains(_VISIT_T, 'Uns') AND _MBTPTNUM IS NOT NULL
      then:
        str_template: '{_DATE_TXT} - 998'
    - when: (str_contains(_VISIT_T, '^Ill') OR str_contains(_VISIT_T, '^Conva') OR str_contains(_VISIT_T, 'OL-D')) AND ADT IS NOT NULL AND TR01SDT IS NOT NULL AND ADT > TR01SDT AND _MBTPTNUM IS NOT NULL
      then:
        str_template: '{_DATE_TXT} - {_MBTPTNUM_TXT}'
    - when: (str_contains(_VISIT_T, '^Ill') OR str_contains(_VISIT_T, '^Conva') OR str_contains(_VISIT_T, 'OL-D')) AND ADT IS NOT NULL AND TR01SDT IS NOT NULL AND ADT > TR01SDT AND _MBTPTNUM IS NULL AND str_contains(_VISIT_T, 'Uns')
      then:
        str_template: '{_DATE_TXT} - 999'
    - when: (str_contains(_VISIT_T, '^Ill') OR str_contains(_VISIT_T, '^Conva') OR str_contains(_VISIT_T, 'OL-D')) AND ADT IS NOT NULL AND TR01SDT IS NOT NULL AND ADT > TR01SDT AND _MBTPTNUM IS NULL
      then: _DATE_TXT
    - when: (str_contains(_VISIT_T, '^Ill') OR str_contains(_VISIT_T, '^Conva') OR str_contains(_VISIT_T, 'OL-D')) AND (_MBDTC IS NULL OR _MBDTC IN (''))
      then: '''0000'''
    - otherwise: ''''''
- name: _MBSTRESC2
  type: str
  derivation:
    case:
    - when: str_contains(_MBSTRESC, '^See')
