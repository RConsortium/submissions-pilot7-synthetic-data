  type: str
  label: Post-EUA Off-Study Vaccine Flag
  derivation:
    case:
    - when: EUAVACDT IS NOT NULL AND ADT IS NOT NULL AND EUAVACDT < ADT
      then: '''Y'''
  submission:
    core: Perm
    mandatory: false
    length: 1
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: _DAYDIFF
  type: int
  derivation:
    diff:
      type: date
      start: TR01SDT
      end: ADT
      unit: day
- name: _ADTMY_S
  type: int
  derivation:
    case:
    - when: ADT IS NOT NULL AND TR01SDT IS NOT NULL
      then: _DAYDIFF * 86400
    - when: NOT str_contains(_VISIT_WU, 'ILLNESS')
      then: 99999999
- name: _ADTMY
  type: float
  derivation:
    case:
    - when: ADT IS NOT NULL AND TR01SDT IS NOT NULL AND ADT > TR01SDT AND str_contains(_VISIT_W, 'Uns') AND _VISITNUM IS NULL
      then: 999
    - when: ADT IS NOT NULL AND TR01SDT IS NOT NULL AND ADT > TR01SDT
      then: _VISITNUM
    - otherwise: ABS(_ADTMY_S)
- name: _ADTMY_NUM
  type: float
  derivation:
    case:
    - when: _VISITNUM IS NOT NULL AND _ADTMY_S IS NOT NULL AND ABS(_ADTMY_S) > 0
      then: ABS(_ADTMY_S) + _VISITNUM
    - when: _ADTMY_S IS NOT NULL
      then: ABS(_ADTMY_S)
- name: _PREFL
  type: str
  derivation:
    case:
    - when: TR01SDT IS NOT NULL AND _ADTMY_S IS NOT NULL AND _ADTMY_S <= 0
      then: '''Y'''
- name: _POSTFL
  type: str
  derivation:
    case:
    - when: TR01SDT IS NOT NULL AND ADT IS NOT NULL AND _ADTMY_S IS NOT NULL AND _ADTMY_S > 0
      then: '''Y'''
- name: _PREFL_ADT
  type: date
  derivation:
    case:
    - when: _PREFL = 'Y'
      then: ADT
- name: _AVALN
  type: int
  derivation:
    case:
    - when: _MBSTRESC2 IS NOT NULL AND _MBSTRESC2 NOT IN ('')
      then: 1
    - when: (str_contains(_VISIT_WU, 'ILLNESS') OR str_contains(_VISIT_W, 'Uns')) AND (ADT IS NULL OR (TR01SDT IS NOT NULL AND ADT > TR01SDT))
      then: 1
    - otherwise: 0
- name: _AVALN2
  type: int
  derivation:
    case:
    - when: _MBSTRESC2 IS NOT NULL AND _MBSTRESC2 NOT IN ('')
      then: 1
    - otherwise: 0
- name: _ILLUNS
  type: int
  derivation:
    case:
    - when: str_contains(_VISIT_W, 'Uns')
      then: 1
    - when: str_contains(_VISIT_WU, 'ILLNESS') OR str_contains(_VISIT_W, 'OL-D')
      then: 2
    - otherwise: 0
- name: _ISSTRESN
  type: int
  derivation:
    case:
    - when: _PREFL = 'Y' AND NOT str_contains(_VISIT_WU, 'ILLNESS') AND AVALC = 'Positive'
      then: 1
    - when: _PREFL = 'Y' AND NOT str_contains(_VISIT_WU, 'ILLNESS') AND AVALC = 'Negative'
      then: 2
    - otherwise: 9
- name: _UNS
  type: int
  derivation:
    case:
    - when: _POSTFL = 'Y' AND (str_contains(_VISIT_W, 'Uns') OR _VISIT_W IS NULL OR _VISIT_W IN ('') OR str_contains(_VISIT_W, 'Safe'))
      then: 1
    - when: _POSTFL = 'Y'
      then: 0
- name: _BASE_RN
  type: int
  derivation:
    row_number:
      window: BASE_W
- name: ABLFL
  type: str
  label: Baseline Record Flag
  derivation:
    case:
    - when: _BASE_RN = 1 AND _AVALN = 1 AND _PREFL = 'Y' AND TR01SDT IS NOT NULL
      then: '''Y'''
  submission:
    core: Perm
    mandatory: false
    length: 1
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: BASEC
  type: str
  label: Baseline Value (C)
  derivation:
    aggregate:
      filter: ABLFL = 'Y'
      group_by:
      - STUDYID
      - USUBJID
      - PARAMCD
      expr: ONLY(AVALC)
  submission:
    core: Perm
    mandatory: false
    length: 50
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: _ILL_DAT
  type: date
  derivation:
    aggregate:
      key:
        STUDYID: STUDYID
        USUBJID: USUBJID
        MBTESTCD: PARAMCD
      filter: MB.VISIT = 'Illness Visit Day 1' OR MB.VISIT = 'Convalescence Visit Day 1'
      derivations:
        EP_ADT:
          type: date
          derivation:
            to_date:
              source: MB.MBDTC
      between:
        value: ADT
        lower: EP_ADT
      expr: MAX(EP_ADT)
- name: _ILL_SET_RAW
  type: int
  derivation:
    aggregate:
      key:
        STUDYID: STUDYID
        USUBJID: USUBJID
        MBTESTCD: PARAMCD
      filter: MB.VISIT = 'Illness Visit Day 1' OR MB.VISIT = 'Convalescence Visit Day 1'
      derivations:
        EP_ADT:
          type: date
          derivation:
            to_date:
              source: MB.MBDTC
      between:
        value: _ILL_DAT
        lower: EP_ADT
      expr: COUNT(EP_ADT)
      distinct: true
- name: _ILL_SET
  type: int
  derivation:
    case:
    - when: _ILL_SET_RAW IS NULL
      then: 0
    - otherwise: _ILL_SET_RAW
- name: _SCHEILL_DATE
  type: date
  derivation:
    aggregate:
      key:
        STUDYID: STUDYID
        USUBJID: USUBJID
        MBTESTCD: PARAMCD
      filter: (MB.VISIT = 'Illness Visit Day 1' OR (MB.VISIT = 'Illness Visit Day 3 - Day 21' AND MB.MBTPT = 'Day 1') OR MB.VISIT = 'Convalescence Visit Day 1')
      derivations:
        EP_ADT:
          type: date
          derivation:
            to_date:
              source: MB.MBDTC
      between:
        value: ADT
        lower: EP_ADT
      expr: MAX(EP_ADT)
- name: _ILL_ADY
  type: int
  derivation:
    study_day:
      source: _ILL_DAT
      reference: TR01SDT
- name: _OPEND1_ADY
  type: int
  derivation:
    aggregate:
      filter: _VISIT_W = 'Participant Decision Visit / OL-D1'
      group_by:
      - STUDYID
      - USUBJID
      - PARAMCD
      expr: MAX(ADY)
- name: _ILL_DIFF
  type: int
  derivation:
    diff:
      type: date
      start: _ILL_DAT
      end: ADT
      unit: day
- name: _AVISIT_C
  type: str
  derivation:
    case:
    - when: ABLFL = 'Y'
      then: '''Baseline'''
    - when: ADT IS NOT NULL AND _VISIT_WU = 'VISIT 1 DAY 1'
      then: '''Day 1'''
    - when: ADT IS NOT NULL AND _VISIT_W = 'Illness Visit Day 1'
      then: '''Illness Visit Day 1'''
    - when: ADT IS NOT NULL AND ADY IS NOT NULL AND ADY > 1 AND str_contains(_VISIT_WU, 'ILLNESS') AND NOT str_contains(_VISIT_W, 'Uns')
      then:
        str_template: Illness Visit Day {_DAY_TXT}
    - when: ADT IS NOT NULL AND ADY IS NOT NULL AND ADY > 1 AND str_contains(_VISIT_WU, 'OL-D1') AND NOT str_contains(_VISIT_W, 'Uns') AND NOT str_contains(_VISIT_W, 'Ill')
      then: '''Participant Decision Visit / OL-D1'''
    - when: ADT IS NOT NULL AND ADY IS NOT NULL AND ADY > 1 AND str_contains(_VISIT_WU, 'OL-D29') AND NOT str_contains(_VISIT_W, 'Uns') AND NOT str_contains(_VISIT_W, 'Ill')
      then: '''Open Label Day 29'''
    - when: ADT IS NOT NULL AND ADY IS NOT NULL AND ADY > 1 AND str_contains(_VISIT_WU, 'OL-D57') AND NOT str_contains(_VISIT_W, 'Uns') AND NOT str_contains(_VISIT_W, 'Ill')
      then: '''Open Label Day 57'''
    - when: ADT IS NOT NULL AND (str_contains(_VISIT_WU, 'ILLNESS') OR (str_contains(_VISIT_W, 'Uns') AND NOT str_contains(_VISIT_W, 'Ill'))) AND _ILL_DIFF IS NOT NULL AND _ILL_DIFF >= 1 AND _ILL_DIFF <= 2
      then: '''Illness Visit Day 3'''
    - when: ADT IS NOT NULL AND (str_contains(_VISIT_WU, 'ILLNESS') OR (str_contains(_VISIT_W, 'Uns') AND NOT str_contains(_VISIT_W, 'Ill'))) AND _ILL_DIFF IS NOT NULL AND _ILL_DIFF >= 3 AND _ILL_DIFF <= 4
      then: '''Illness Visit Day 5'''
    - when: ADT IS NOT NULL AND (str_contains(_VISIT_WU, 'ILLNESS') OR (str_contains(_VISIT_W, 'Uns') AND NOT str_contains(_VISIT_W, 'Ill'))) AND _ILL_DIFF IS NOT NULL AND _ILL_DIFF >= 5 AND _ILL_DIFF <= 6
      then: '''Illness Visit Day 7'''
    - when: ADT IS NOT NULL AND (str_contains(_VISIT_WU, 'ILLNESS') OR (str_contains(_VISIT_W, 'Uns') AND NOT str_contains(_VISIT_W, 'Ill'))) AND _ILL_DIFF IS NOT NULL AND _ILL_DIFF >= 7 AND _ILL_DIFF <= 10
      then: '''Illness Visit Day 9'''
    - when: ADT IS NOT NULL AND (str_contains(_VISIT_WU, 'ILLNESS') OR (str_contains(_VISIT_W, 'Uns') AND NOT str_contains(_VISIT_W, 'Ill'))) AND _ILL_DIFF IS NOT NULL AND _ILL_DIFF >= 11 AND _ILL_DIFF <= 16
      then: '''Illness Visit Day 14'''
    - when: ADT IS NOT NULL AND (str_contains(_VISIT_WU, 'ILLNESS') OR (str_contains(_VISIT_W, 'Uns') AND NOT str_contains(_VISIT_W, 'Ill'))) AND _ILL_DIFF IS NOT NULL AND _ILL_DIFF >= 17 AND _ILL_DIFF <= 23
      then: '''Illness Visit Day 21'''
    - when: ADT IS NOT NULL AND (str_contains(_VISIT_WU, 'ILLNESS') OR (str_contains(_VISIT_W, 'Uns') AND NOT str_contains(_VISIT_W, 'Ill'))) AND _ILL_DIFF IS NOT NULL AND _ILL_DIFF >= 24 AND _ILL_DIFF <= 34
      then: '''Illness Visit Day 28'''
    - when: ADT IS NOT NULL AND str_contains(_VISIT_WU, 'ILLNESS') AND str_contains(_VISIT_W, 'Uns') AND _SCHEILL_DATE IS NULL AND str_contains(_MBTPT, 'Day')
      then:
        str_template: Illness Visit {_MBTPT}
    - when: ADT IS NOT NULL AND ADY IS NOT NULL AND ADY > 1 AND _VISIT = 'Illness Visit Day 3 - Day 21' AND _ILL_DAT IS NULL
      then: '''Illness Visit'''
    - when: ADT IS NOT NULL AND ADY IS NOT NULL AND ADY > 1 AND str_contains(_VISIT_W, 'Illness')
      then:
        str_template: Illness Visit Day {_DAY_TXT}
    - when: ADT IS NOT NULL AND _POSTFL = 'Y' AND (str_contains(_VISIT_W, 'Uns') OR str_contains(_VISIT_W, 'Safe') OR str_contains(_VISIT_WU, 'ILLNESS'))
      then:
        case:
        - when: ADY IS NOT NULL AND ADY >= 2 AND ADY <= 36
          then: '''Day 29'''
        - otherwise: ''''''
    - when: ADT IS NOT NULL AND ADY IS NOT NULL AND ADY > 1 AND _POSTFL = 'Y' AND str_contains(_VISIT_WU, 'DAY')
      then:
        str_template: Day {_DAY_TXT}
- name: _AVISIT_C2
  type: str
  derivation:
    case:
    - when: (ABLFL IS NULL OR ABLFL <> 'Y') AND ADT IS NOT NULL AND _ILL_DAT IS NOT NULL AND ADT = _ILL_DAT AND _SCHEILL_DATE IS NOT NULL AND str_contains(_VISIT_W, 'Uns')
      then: '''Illness Visit Day 1'''
    - otherwise: _AVISIT_C
- name: _AVISIT_D
  type: str
  derivation:
    case:
    - when: (_AVISIT_C2 IS NULL OR _AVISIT_C2 IN ('')) AND _POSTFL = 'Y' AND (str_contains(_VISIT_W, 'Uns') OR _VISIT_W IS NULL OR _VISIT_W IN ('') OR str_contains(_VISIT_W, 'Safe')) AND ADY IS NOT NULL AND ADY >= 2 AND ADY <= 36
      then: '''Day 29'''
    - otherwise: _AVISIT_C2
- name: _AVISITN_D
  type: int
  derivation:
    case:
    - when: _AVISIT_D = 'Illness Visit Day 1'
      then: 101
    - when: _AVISIT_D = 'Illness Visit Day 3'
      then: 103
    - when: _AVISIT_D = 'Illness Visit Day 5'
      then: 105
    - when: _AVISIT_D = 'Illness Visit Day 7'
      then: 107
    - when: _AVISIT_D = 'Illness Visit Day 9'
      then: 109
    - when: _AVISIT_D = 'Illness Visit Day 14'
      then: 114
    - when: _AVISIT_D = 'Illness Visit Day 21'
      then: 121
    - when: _AVISIT_D = 'Illness Visit Day 28'
      then: 128
    - when: str_contains(_AVISIT_D, 'Illness')
      then: 100 * _ILL_SET + 1
    - when: _AVISIT_D = 'Baseline'
      then: 1
    - when: _AVISIT_D = 'Day 1'
      then: 2
    - when: _AVISIT_D = 'Day 29'
      then: 3
    - when: _AVISIT_D = 'Day 57'
      then: 4
    - when: _AVISIT_D = 'Day 209'
      then: 6
    - when: _AVISIT_D = 'Day 394'
      then: 7
    - when: _AVISIT_D = 'Day 759'
      then: 8
    - when: _AVISIT_D = 'Participant Decision Visit / OL-D1'
      then: 10
    - when: _AVISIT_D = 'Open Label Day 29'
      then: 11
    - when: _AVISIT_D = 'Open Label Day 57'
      then: 12
- name: _AVISIT_D2
  type: str
  derivation:
    case:
    - when: _AVISITN_D IS NOT NULL AND _AVISITN_D NOT IN (1, 3, 10) AND _AVISITN_D < 100
      then: null
    - otherwise: _AVISIT_D
- name: _AVISITN_D2
  type: int
  derivation:
    case:
    - when: _AVISITN_D IS NOT NULL AND _AVISITN_D NOT IN (1, 3, 10) AND _AVISITN_D < 100
      then: null
    - otherwise: _AVISITN_D
- name: _ILL_SET_TXT
  type: str
  derivation:
    str_decimal:
      source: _ILL_SET
      decimals: 0
- name: _DAY_NUM_E
  type: str
  derivation:
    str_extract:
      source: _AVISIT_D2
      pattern: Day ([0-9]+)
      group: 1
      no_match: ''
- name: _AVISIT_E
  type: str
  derivation:
    case:
    - when: _ILL_SET > 1 AND str_contains(_AVISIT_D2, 'Illness') AND str_contains(_AVISIT_D2, '^Illness Visit Day ') AND _SCHEILL_DATE IS NOT NULL
      then:
        str_template: Illness Visit {_ILL_SET_TXT} Day {_DAY_NUM_E}
    - otherwise: _AVISIT_D2
- name: _AVISITN_E
  type: int
  derivation:
    case:
    - when: _ILL_SET > 1 AND str_contains(_AVISIT_D2, 'Illness') AND str_contains(_AVISIT_D2, '^Illness Visit Day ') AND _SCHEILL_DATE IS NOT NULL
      then: 100 * (_ILL_SET - 1) + _AVISITN_D2
    - otherwise: _AVISITN_D2
- name: _PREFIX
  type: str
  derivation:
    str_extract:
      source: _AVISIT_E
      pattern: ^(.*).{2}$
      group: 1
      no_match: ''
- name: _AVISIT_E_SP
  type: str
  derivation:
    str_template:
      template: '{_AVISIT_E} '
      missing: ' '
- name: _AWRANGE_E
  type: str
  derivation:
    case:
    - when: str_contains(_AVISIT_E, 'Illness') AND str_contains(_AVISIT_E_SP, 'Day 1 ')
      then: _AVISIT_E
    - when: str_contains(_AVISIT_E, 'Illness') AND str_contains(_AVISIT_E_SP, 'Day 3 ')
      then:
        str_template: '{_PREFIX} 2 - {_PREFIX} 3'
    - when: str_contains(_AVISIT_E, 'Illness') AND str_contains(_AVISIT_E_SP, 'Day 5 ')
      then:
        str_template: '{_PREFIX} 4 - {_PREFIX} 5'
    - when: str_contains(_AVISIT_E, 'Illness') AND str_contains(_AVISIT_E_SP, 'Day 7 ')
      then:
        str_template: '{_PREFIX} 6 - {_PREFIX} 7'
    - when: str_contains(_AVISIT_E, 'Illness') AND str_contains(_AVISIT_E_SP, 'Day 9 ')
      then:
        str_template: '{_PREFIX} 8 - {_PREFIX}11'
    - when: str_contains(_AVISIT_E, 'Illness') AND str_contains(_AVISIT_E_SP, 'Day 14 ')
      then:
        str_template: '{_PREFIX}12 - {_PREFIX}17'
    - when: str_contains(_AVISIT_E, 'Illness') AND str_contains(_AVISIT_E_SP, 'Day 21 ')
      then:
        str_template: '{_PREFIX}18 - {_PREFIX}24'
    - when: str_contains(_AVISIT_E, 'Illness') AND str_contains(_AVISIT_E_SP, 'Day 28 ')
      then:
        str_template: '{_PREFIX}25 - {_PREFIX}35'
    - when: _AVISIT_E = 'Baseline'
      then: '''<=1 Pre-dose'''
    - when: _AVISIT_E = 'Day 29'
      then: '''Day 2 - Day 36'''
    - when: _AVISITN_E = 10
      then: '''Participant Decision Visit / OL-D1'''
- name: _AWTARGET_E
  type: int
  derivation:
    case:
    - when: _AVISITN_E = 101 AND _ILL_ADY IS NOT NULL
      then: _ILL_ADY
    - when: str_contains(_AWRANGE_E, 'Illness') AND str_contains(_AVISIT_E_SP, 'Day 1 ') AND _ILL_ADY IS NOT NULL
      then: _ILL_ADY
    - when: str_contains(_AWRANGE_E, 'Illness') AND str_contains(_AVISIT_E_SP, 'Day 3 ') AND _ILL_ADY IS NOT NULL
      then: _ILL_ADY + 2
    - when: str_contains(_AWRANGE_E, 'Illness') AND str_contains(_AVISIT_E_SP, 'Day 5 ') AND _ILL_ADY IS NOT NULL
      then: _ILL_ADY + 4
    - when: str_contains(_AWRANGE_E, 'Illness') AND str_contains(_AVISIT_E_SP, 'Day 7 ') AND _ILL_ADY IS NOT NULL
      then: _ILL_ADY + 6
    - when: str_contains(_AWRANGE_E, 'Illness') AND str_contains(_AVISIT_E_SP, 'Day 9 ') AND _ILL_ADY IS NOT NULL
      then: _ILL_ADY + 8
    - when: str_contains(_AWRANGE_E, 'Illness') AND str_contains(_AVISIT_E_SP, 'Day 14 ') AND _ILL_ADY IS NOT NULL
      then: _ILL_ADY + 13
    - when: str_contains(_AWRANGE_E, 'Illness') AND str_contains(_AVISIT_E_SP, 'Day 21 ') AND _ILL_ADY IS NOT NULL
      then: _ILL_ADY + 20
    - when: str_contains(_AWRANGE_E, 'Illness') AND str_contains(_AVISIT_E_SP, 'Day 28 ') AND _ILL_ADY IS NOT NULL
      then: _ILL_ADY + 27
    - when: _AVISIT_E = 'Baseline'
      then: 1
    - when: _AVISIT_E = 'Day 1'
      then: 1
    - when: _AVISIT_E = 'Day 29'
      then: 29
    - when: _AVISIT_E = 'Day 57'
      then: 57
    - when: _AVISIT_E = 'Day 119'
      then: 119
    - when: _AVISIT_E = 'Day 209'
      then: 209
    - when: _AVISIT_E = 'Day 394'
      then: 394
    - when: _AVISIT_E = 'Day 759'
      then: 759
    - when: _AVISITN_E = 10
      then: _OPEND1_ADY
    - when: _AVISITN_E = 11 AND _OPEND1_ADY IS NOT NULL
      then: _OPEND1_ADY + 28
    - when: _AVISITN_E = 12 AND _OPEND1_ADY IS NOT NULL
      then: _OPEND1_ADY + 56
- name: _AWTDIFF_E
  type: int
  derivation:
    case:
    - when: _AWTARGET_E IS NOT NULL AND ADY IS NOT NULL
      then: ABS(ADY - _AWTARGET_E)
- name: _AVISIT_F
  type: str
  derivation:
    case:
    - when: str_contains(_AVISIT_E, 'Illness') AND _AVISITN_E IS NOT NULL AND _AVISITN_E >= 100 AND _AVISITN_E < 200
      then: '''Illness Visit'''
    - when: str_contains(_AVISIT_E, 'Illness') AND _AVISITN_E IS NOT NULL AND _AVISITN_E > 200
      then:
        str_template: Illness Visit {_ILL_SET_TXT}
    - otherwise: _AVISIT_E
- name: _AVISITN_F
  type: int
  derivation:
    case:
    - when: str_contains(_AVISIT_E, 'Illness') AND _AVISITN_E IS NOT NULL AND _AVISITN_E >= 100 AND _AVISITN_E < 200
      then: 100
    - when: str_contains(_AVISIT_E, 'Illness') AND _AVISITN_E IS NOT NULL AND _AVISITN_E > 200
      then: 100 * _ILL_SET
    - otherwise: _AVISITN_E
- name: _FIRST_MBTPT_RN
  type: int
  derivation:
    row_number:
      window: _FIRST_MBTPT_W
- name: _DAY_NUM_H
  type: str
  derivation:
    str_extract:
      source: _AVISIT_E
      pattern: Day ([0-9]+)
      group: 1
      no_match: ''
- name: _ATPT_RAW
  type: str
  derivation:
    case:
    - when: str_contains(_AVISIT_F, 'Ill')
      then:
        str_template: Day {_DAY_NUM_H}
    - otherwise: ''''''
- name: _ATPT_C
  type: str
  derivation:
    str_replace:
      source: _ATPT_RAW
      pattern: ' '
      replacement: ''
- name: _BLANK1
  type: int
  derivation:
    case:
    - when: str_contains(_AVISIT_F, 'Ill') AND _SCHEILL_DATE IS NULL AND (_MBTPT IS NULL OR _MBTPT IN ('')) AND (str_contains(_VISIT, 'Uns') OR _VISIT IS NULL OR _VISIT IN (''))
      then: 1
    - otherwise: 0
- name: _IS999
  type: int
  derivation:
    case:
    - when: _ATPT_RAW = 'Day 999'
      then: 1
    - otherwise: 0
- name: _BLANK3
  type: int
  derivation:
    case:
    - when: _BLANK1 = 0 AND _IS999 = 0 AND _ATPT_C IN ('Unscheduled', 'Day', 'DayUnscheduled')
      then: 1
    - otherwise: 0
- name: _BLANK4
  type: int
  derivation:
    case:
    - when: str_contains(_AVISIT_F, 'Ill') AND ((str_contains(_VISIT, 'Uns') AND _ILL_DIFF IS NOT NULL AND _ILL_DIFF > 34) OR (str_contains(_VISIT, 'Uns') AND _MBTPT = 'Day 1' AND _ILL_DAT IS NULL AND _FIRST_MBTPT_RN = 1) OR (str_contains(_VISIT, 'Uns') AND (_MBTPT IS NULL OR _MBTPT <> 'Day 1') AND _ILL_DAT IS NULL) OR (_VISIT = 'Illness Visit Day 3 - Day 21' AND (_MBTPT IS NULL OR _MBTPT IN ('')) AND _ILL_DAT IS NULL))
      then: 1
    - otherwise: 0
- name: _AVISITN_B3
  type: int
  derivation:
    case:
    - when: _ILL_SET = 0
      then: 100
    - otherwise: 100 * _ILL_SET
- name: ATPT
  type: str
  label: Analysis Timepoint
  derivation:
    case:
    - when: _BLANK1 = 1
      then: ''''''
    - when: _IS999 = 1
      then: ''''''
    - when: _BLANK3 = 1
      then: ''''''
    - when: _BLANK4 = 1
      then: ''''''
    - otherwise: _ATPT_RAW
  submission:
    core: Perm
    mandatory: false
    length: 20
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: _AVISIT_TMP
  type: str
  derivation:
    str_replace:
      source: _AVISIT_F
      pattern: Day Unscheduled
      replacement: ''
- name: AVISIT
  type: str
  label: Analysis Visit
  derivation:
    case:
    - when: _IS999 = 1
      then: ''''''
    - when: _BLANK3 = 1
      then:
        str_replace:
          source: _AVISIT_TMP
          pattern: Day
          replacement: ''
    - otherwise: _AVISIT_F
  submission:
    core: Perm
    mandatory: false
    length: 50
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: AVISITN
  type: int
  label: Analysis Visit (N)
  derivation:
    case:
    - when: _IS999 = 1
      then: null
    - when: _BLANK3 = 1
      then: _AVISITN_B3
    - otherwise: _AVISITN_F
  submission:
    core: Perm
    mandatory: false
    length: 8
    display_format: '3.'
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: AWRANGE
  type: str
  label: Analysis Window Valid Relative Range
  derivation:
    case:
    - when: _BLANK1 = 1
      then: ''''''
    - when: _IS999 = 1
      then: ''''''
    - when: _BLANK3 = 1
      then: ''''''
    - when: _BLANK4 = 1
      then: ''''''
    - otherwise: _AWRANGE_E
  submission:
    core: Perm
    mandatory: false
    length: 50
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: AWTARGET
  type: int
  label: Analysis Window Target
  derivation:
    case:
    - when: _BLANK1 = 1
      then: null
    - when: _IS999 = 1
      then: null
    - when: _BLANK3 = 1
      then: null
    - when: _BLANK4 = 1
      then: null
    - otherwise: _AWTARGET_E
  submission:
    core: Perm
    mandatory: false
    length: 8
    display_format: '3.'
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: AWTDIFF
  type: int
  label: Analysis Window Diff from Target
  derivation:
    case:
    - when: _BLANK1 = 1
      then: null
    - when: _IS999 = 1
      then: null
    - when: _BLANK3 = 1
      then: null
    - when: _BLANK4 = 1
      then: null
    - otherwise: _AWTDIFF_E
  submission:
    core: Perm
    mandatory: false
    length: 8
    display_format: '3.'
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: ATPTN
  type: int
  label: Analysis Timepoint (N)
  derivation:
    str_extract:
      source: ATPT
      pattern: Day ([0-9]+)
      group: 1
      no_match: null
  submission:
    core: Perm
    mandatory: false
    length: 8
    display_format: '3.'
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: _UNS_ANL
  type: int
  derivation:
    case:
    - when: AVISITN IS NOT NULL AND AVISITN >= 100
      then: 0
    - otherwise: _UNS
- name: _ANL01_RN
  type: int
  derivation:
    row_number:
      window: ANL01_W
- name: ANL01FL
  type: str
  label: Analysis Flag 01
  derivation:
    case:
    - when: (_ANL01_RN = 1 AND _AVALN2 = 1 AND AVISITN IS NOT NULL) OR ABLFL = 'Y'
      then: '''Y'''
  submission:
    core: Perm
    mandatory: false
    length: 1
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
