# ADMB for Moderna mRNA-1273-P301, cut S3 (BLA Interim Analysis,
# cutoff 2021-03-26). Parent: ../../../spec/yamaa/base/adam-base-s3.yaml (which chains to
# ../../../spec/yamaa/base/adam-base.yaml; 86 shared + 59 S3-only ADSL columns).
# Derivations implement the S3 A20ADMB program (prototype
# admb_proto.py (original work tree) matches all 124 submitted
# columns on all 211,582 rows). Where the SAS code and the define.xml
# method text disagree, the code is followed (see README.md).
# Inputs: MB + SUPPMB (SDTM) + verified ADSL. SUPPMB is pivoted for
# LOCALFL/LDTCLIA by (USUBJID, MBSEQ). Row accounting: MB 292,291 rows ->
# MBSTAT='' 211,615 -> inner join to ADSL on (USUBJID, SUBJID) drops 33 ->
# 211,582 submitted rows. Keys are [STUDYID, USUBJID, MBSEQ] (unique).
# The %ablfl retain machinery is expressed as aggregates over the EP
# intermediate; the uns_blank step is omitted (it blanks 0 rows here).
# A qualified aggregate's filter reads the donor record only (LOOKUP-8),
# so the Day-1 condition in the _ILL_DAT/_ILL_SET/_SCHEILL_DATE aggregates
# is written on the raw MB fields (MB.VISIT/MB.MBTPT), not on EP's derived
# _VISIT_W, and the ori-block exclusion is done by dropping the middle
# disjunct (ori 'Illness Visit Day 3 - Day 21' + MBTPT 'Day 1'): the 3
# ori-blocked ADTs each have exactly one Day-1 row, the ori-blocked row
# itself, so that disjunct is exactly the ori-blocked set.
# ANL01FL uses MBSEQ ASCENDING as its tie-break (165 tie groups on P301).
# Validation notes (what check()/run() required, beyond the prototype):
# - A qualified aggregate's key columns resolve against the relation's
#   dataset (MB), so the key matches MBTESTCD (not EP's derived _PARAMCD);
#   run() rejects the derived form even though check() passes it.
# - A qualified aggregate's filter reads the donor record only (LOOKUP-8).
# - COUNT over a group with no record is missing (FORMULA-24), so _ILL_SET
#   defaults the missing count to 0 via _ILL_SET_RAW (the prototype's
#   _ill_set is 0 when _ill_dat is missing).
# - The Step C Day-29 branch is an elif with an INNER if on the ADY range:
#   its then is a nested case, so an outer match with ADY outside [2, 36]
#   yields '' and blocks the 'Day N' branch 18.
# - _ADTMY/_ADTMY_NUM are float (VISITNUM carries 34.01-style values).
# - Empty-string literals use lit('') (a bare '' is an empty expression).
# - Specific mandatory:false overrides (define-mandatory with gaps in the
#   submitted data): ADT, ADY, MBDTC, MBTPT, VISIT, VISITNUM.
yamaa: '1.0'
type: spec
model: ADaM
parent: ../../../spec/yamaa/base/adam-base-s3.yaml
domain: ADMB
keys:
- STUDYID
- USUBJID
- MBSEQ
input:
  MB: <sdtm-dir>/mb.parquet
  SUPPMB: <sdtm-dir>/suppmb.parquet
  ADSL:
    path: <adam-dir>/adsl.parquet
    key:
    - STUDYID
    - USUBJID
submission:
  label: Microbiology Analysis Dataset
  class: BASIC DATA STRUCTURE
  structure: One or more records per subject per analysis parameter per analysis timepoint
  repeating: true
rows:
- id: mb_rows
  dataset: MB
  derivations:
    STUDYID: MB.STUDYID
    USUBJID: MB.USUBJID
    _MBSEQ: MB.MBSEQ
    _MBSTAT: MB.MBSTAT
    _MBTESTCD: MB.MBTESTCD
    _MBTEST: MB.MBTEST
    _MBCAT: MB.MBCAT
    _MBSCAT: MB.MBSCAT
    _MBSPEC: MB.MBSPEC
    _MBMETHOD: MB.MBMETHOD
    _MBSTRESC: MB.MBSTRESC
    _MBDTC: MB.MBDTC
    _VISIT: MB.VISIT
    _VISITNUM: MB.VISITNUM
    _MBTPT: MB.MBTPT
    _MBTPTNUM: MB.MBTPTNUM
    _LOCALFL: SUPP_P.LOCALFL
    _LDTCLIA: SUPP_P.LDTCLIA
  filter: (_MBSTAT IS NULL OR _MBSTAT IN ('')) AND _MBTESTCD IS NOT NULL AND _MBTESTCD NOT IN ('') AND _ADSL IS NOT NULL
intermediates:
- id: SUPP_P
  dataset: SUPPMB
  key:
    STUDYID: STUDYID
    USUBJID: USUBJID
    IDVARVAL:
      str_decimal:
        source: _MBSEQ
        decimals: 0
  filter: SUPPMB.QNAM IN ('LOCALFL', 'LDTCLIA') AND SUPPMB.IDVAR = 'MBSEQ'
  pivot:
    name: QNAM
    value: QVAL
    fields:
    - LOCALFL
    - LDTCLIA
- id: DAY1_FIRST
  dataset: MB
  key:
    STUDYID: STUDYID
    USUBJID: USUBJID
    _PARAMCD: _PARAMCD
    _ADT: _ADT
  filter: (MB.MBSTAT IS NULL OR MB.MBSTAT IN ('')) AND (MB.VISIT = 'Illness Visit Day 1' OR (MB.VISIT = 'Illness Visit Day 3 - Day 21' AND MB.MBTPT = 'Day 1') OR MB.VISIT = 'Convalescence Visit Day 1')
  order_by:
  - MB.MBSEQ
  keep: last
  derivations:
    _PARAMCD: MB.MBTESTCD
    _ADT:
      to_date:
        source: MB.MBDTC
    _ORI: MB.VISIT
- id: EP
  dataset: MB
  key:
    STUDYID: STUDYID
    USUBJID: USUBJID
    MBTESTCD: PARAMCD
  filter: MB.MBSTAT IS NULL OR MB.MBSTAT IN ('')
  derivations:
    _MBSEQ: MB.MBSEQ
    _PARAMCD: MB.MBTESTCD
    _ADT:
      to_date:
        source: MB.MBDTC
    _LOCALFL: SUPP_P.LOCALFL
    _VISIT_T:
      case:
      - when: str_contains(MB.VISIT, 'Illness Visit Day 3 - Day 21') AND (MB.MBTPT IS NULL OR MB.MBTPT IN ('') OR str_contains(MB.MBTPT, 'Uns'))
        then:
          str_template: '{MB.VISIT} Unscheduled 1'
      - when: MB.VISIT = 'Illness Visit Day 3 - Day 21'
        then:
          str_template: Illness Visit {MB.MBTPT}
      - when: str_contains(MB.VISIT, '^Illness Visit Day 3 - Day 21')
        then:
          str_template: Illness Visit {MB.MBTPT} Unscheduled 1
      - when: (MB.VISIT IS NULL OR MB.VISIT IN ('')) AND _LOCALFL = 'Y'
        then: '''Illness Visit Day 999 Unscheduled 1'''
      - otherwise: MB.VISIT
    _VISIT_T2:
      str_replace:
        source: _VISIT_T
        pattern: Convalescence
        replacement: Illness
    _VISIT_W:
      case:
      - when: (_VISIT_T2 IS NULL OR _VISIT_T2 IN ('') OR str_contains(_VISIT_T2, 'Saf') OR str_contains(_VISIT_T2, 'COV'))
        then:
          str_template:
            template: Unsched {_VISIT_T2}
            missing: 'Unsched '
      - otherwise: _VISIT_T2
    _ORI: MB.VISIT
    _FIRST_ORI: DAY1_FIRST._ORI
windows:
  BASE_W:
    group_by:
    - STUDYID
    - USUBJID
    - PARAMCD
    order_by:
    - variable: _AVALN
      direction: desc
    - _POSTFL
    - variable: _PREFL_ADT
      direction: desc
    - ADT
    - _ADDSORTN
    - _ILLUNS
    - _ADTMY
    - _ISSTRESN
    - variable: _ADTMY_NUM
      direction: desc
    - variable: _VISITNUM
      direction: desc
    - variable: MBSEQ
      direction: desc
  ANL01_W:
    group_by:
    - STUDYID
    - USUBJID
    - PARAMCD
    - AVISITN
    order_by:
    - variable: _AVALN2
      direction: desc
    - _UNS_ANL
    - variable: _SORT_AVALC
      direction: desc
    - ADT
    - _MBTPTNUM
    - MBSEQ
  _FIRST_MBTPT_W:
    group_by:
    - USUBJID
    - PARAMCD
    - _MBDTC
    - _AVISIT_F
    - _MBTPT
    order_by:
    - _UNS
    - variable: _AVALN
      direction: desc
    - variable: _ILL_ADY
      direction: desc
    - _ADDSORTN
    - _ADTMY
    - variable: _ADTMY_NUM
      direction: desc
    - _ISSTRESN
    - variable: _PREFL_ADT
      direction: desc
    - _ILLUNS
    - variable: _VISITNUM
      direction: desc
    - variable: MBSEQ
      direction: desc
