      - when: ((_FAEVAL IS NULL OR _FAEVAL IN ('')))
        then: 2
      - when: (_FAEVAL = 'INVESTIGATOR')
        then: 3
      - otherwise: null
    _AGFL:
      case:
      - when: (_ATOXGRN IS NOT NULL)
        then: 1
      - otherwise: null
