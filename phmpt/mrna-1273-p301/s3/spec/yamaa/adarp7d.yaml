  type: int
  derivation:
    row_number:
      window: ANL04_ORD
- name: _ANL04_CAND
  type: int
  derivation:
    case:
    - when: (_ANL04_RN = 1 AND ATPTGR1N >= 8 AND _ATPTA = 1 AND ANL01FL = 'Y')
      then: 1
    - otherwise: 0
- name: _ANL04_MAX
  type: int
  derivation:
    aggregate:
      group_by: [USUBJID, PARAMCD, ANL01FL, ATPTREF]
      expr: MAX(_ANL04_CAND)
- name: _ANL05_RN
  type: int
  derivation:
    row_number:
      window: ANL05_ORD
- name: _ANL05_CNT
  type: int
  derivation:
    aggregate:
      group_by: [USUBJID, PARAM, ATPTREF, ATPT]
      expr: COUNT(_ANL05_RN)
- name: _ATPTN7
  type: int
  derivation:
    case:
    - when: (ATPTN = 7)
      then: 1
    - otherwise: 0
- name: _ATPTN8
  type: int
  derivation:
    case:
    - when: (ATPTN = 8)
      then: 1
    - otherwise: 0
- name: _HAS7
  type: int
  derivation:
    aggregate:
      group_by: [USUBJID, PARAMCD, ATPTREF]
      expr: MAX(_ATPTN7)
- name: _HAS8
  type: int
  derivation:
    aggregate:
      group_by: [USUBJID, PARAMCD, ATPTREF]
      expr: MAX(_ATPTN8)
- name: _ANL02_NUM
  type: int
  derivation:
    case:
    - when: (_PARAMCD IN ('ERYTHDIA', 'LYMPH', 'PAIN', 'SWELLDIA') AND _HAS7 = 1 AND _HAS8 = 1)
      then: 1
    - otherwise: 0
- name: _ANL02_MAX
  type: int
  derivation:
    aggregate:
      group_by: [USUBJID, PARAMCD, ATPTREF]
      expr: MAX(_ANL02_NUM)
- name: _ANL03FL
  type: str
  derivation:
    case:
    - when: (_PARAMCD IN ('ERYTHDIA', 'LYMPH', 'PAIN', 'SWELLDIA') AND NOT(_HAS7 = 1 AND _HAS8 = 1) AND ATPTN <= 7)
      then: '''Y'''
    - otherwise: "''"
- name: _ANL03_RN
  type: int
  derivation:
    row_number:
      window: ANL03_GRP
- name: _ANL03_SRC
  type: str
  derivation:
    case:
    - when: (_ANL03_RN = 1 AND ATPTN > 0 AND ATPTN <= 7)
      then: _ANL03FL
    - otherwise: null
- name: _ANL03_LOCF
  type: str
  derivation:
    locf:
      source: _ANL03_SRC
      window: ANL03_GLOBAL
- name: _ANL06_MIN
  type: int
  derivation:
    aggregate:
      filter: ATOXGRN > 0
      group_by: [USUBJID, PARAMCD, ATPTREF]
      expr: MIN(ATPTGR1N)
- name: _ANL06_MAX
  type: int
  derivation:
    aggregate:
      filter: ATOXGRN > 0
      group_by: [USUBJID, PARAMCD, ATPTREF]
      expr: MAX(ATPTGR1N)
