# ADARP7D for Moderna mRNA-1273-P301, cut S3 (BLA Interim Analysis, cutoff 2021-03-26).
# Parent: ../../../spec/yamaa/base/adam-base-s3.yaml (chains to ../../../spec/yamaa/base/adam-base.yaml).
# Derivations implement the S3 A20ADARP7D program (Bates 3820372-3820385,
# %let dsetname = adarp7d) and the %trta / %xxdoserf macros in madam.sas.
# Ground truth: the submitted S3 ADARP7D Parquet (126,750 x 121) and the
# S3 ADaM define (tools/adarp7d_define_s3.json). A pandas prototype
# reproduced the target EXACTLY (0 mismatched cells) before generation.
#
# Key findings (see the generator header for the full account):
# - AVAL for TEMP rows with VSORRESU='F' is the full-precision F->C
#   conversion (F-32)*0.5555555555555556, not VSSTRESN (9-dp rounded).
# - ANL03FL replicates the program's cross-group retain leak via locf
#   over a global window (181 rows in leaked groups).
# - The atptn whole-group deletion is encoded as witness intermediates.
# - Seven base-mandatory ADSL columns have gaps in the target, so the
#   spec overrides mandatory to false on each (ADSYMP does the same):
#   RACEGR1 (3,117 blanks) / RACEGR1N (3,117 nulls), AGEGR4 (71,763
#   blanks) / AGEGR4N (71,763 nulls), EUAVACDT (124,967 nulls), AP01EDT
#   (1,452 nulls), AP01SEDT (1,452 nulls). Blanks read as missing.
# - SAP v1 vs v3 CLOSED as no-impact (2026-11-24): the 'SAP v3' file
#   is the P201 SAP v3.0, not a P301 SAP version; the spec follows the
#   S3 program.
# - No evidence the program read an S27-sequence file.
yamaa: '1.0'
type: spec
model: ADaM
parent: ../../../spec/yamaa/base/adam-base-s3.yaml
domain: ADARP7D
keys: [STUDYID, USUBJID, ASEQ]
input:
  FACE: <sdtm-dir>/face.parquet
  FAAE: <sdtm-dir>/faae.parquet
  VS: <sdtm-dir>/vs.parquet
  SUPPFACE: <sdtm-dir>/suppface.parquet
  SUPPFAAE: <sdtm-dir>/suppfaae.parquet
  SUPPVS: <sdtm-dir>/suppvs.parquet
  ADSL:
    path: <adam-dir>/adsl.parquet
    key: [STUDYID, USUBJID]
submission:
  label: Solicited AR post D7 Analysis Dataset
  class: BASIC DATA STRUCTURE
  structure: One record per subject, per parameter, per analysis timepoint
  repeating: true
rows:
- id: faae_rows
  dataset: FAAE
  derivations:
    STUDYID: FAAE.STUDYID
    USUBJID: FAAE.USUBJID
    _DOMAIN: '''FA'''
    _DTC: FAAE.FADTC
    _FADY: FAAE.FADY
    _VSDY: null
    _FATPTREF: FAAE.FATPTREF
    _VSTPTREF: null
    _FATPT: FAAE.FATPT
    _VSTPT: null
    _FAOBJ: FAAE.FAOBJ
    _FATEST: FAAE.FATEST
    _FATESTCD: FAAE.FATESTCD
    _FAORRES: FAAE.FAORRES
    _FASTRESC: FAAE.FASTRESC
    _FASTRESN: FAAE.FASTRESN
    _FASTAT: FAAE.FASTAT
    _FASCAT: FAAE.FASCAT
    _FACAT: FAAE.FACAT
    _FAEVAL: FAAE.FAEVAL
    _FATEST_UP:
      str_case:
        source: _FATEST
        to: upper
    _FAORRES_UP:
      str_case:
        source: _FAORRES
        to: upper
    _FASEQ: FAAE.FASEQ
    _VSTESTCD: null
    _VSCAT: null
    _VSSCAT: null
    _VSSTRESC: null
    _VSORRESU: null
    _VSSTAT: null
    _VSTPTNUM: null
    _VSSEQ: null
    _STRESN_NUM: null
    _ORRES_NUM: null
    _MAAEFL: SUPP_P_FAAE.MAAEFL
    _MEDTAK: null
    _MEDTAKP: null
    _MEDTAKT: null
    _PCD_E:
      case:
      - when: (_FAOBJ = 'Underarm Gland Swelling or Tenderness')
        then: '''LYMPH'''
      - when: (_FAOBJ = 'Pain')
        then: '''PAIN'''
      - when: (_FAOBJ = 'Erythema')
        then: '''ERYTHDIA'''
      - when: (_FAOBJ = 'Swelling')
        then: '''SWELLDIA'''
      - when: (_FAOBJ = 'Headache')
        then: '''HEADACHE'''
      - when: (_FAOBJ = 'Fatigue')
        then: '''FATIGUE'''
      - when: (_FAOBJ = 'Myalgia')
        then: '''MYALGIA'''
      - when: (_FAOBJ = 'Arthralgia')
        then: '''ARTHRALG'''
      - when: (_FAOBJ = 'Nausea/Vomiting')
        then: '''NAUSEA'''
      - when: (_FAOBJ = 'Chills')
        then: '''CHILLS'''
      - when: (_FAOBJ = 'Receive Medical Attention?')
        then: '''MEDATTEN'''
      - when: (_FAOBJ IN ('Pyrexia', 'Fever'))
        then: '''FEVER'''
      - otherwise: null
    _PARAMCD:
      case:
      - when: (_VSTESTCD IN ('TEMP', 'VSALL') OR _FAOBJ IN ('Pyrexia', 'Fever'))
        then: '''FEVER'''
      - when: (_FAOBJ = 'Underarm Gland Swelling or Tenderness' AND _FATESTCD = 'SEV')
        then: '''LYMPH'''
      - when: (_FAOBJ = 'Pain')
        then: '''PAIN'''
      - when: (_FAOBJ = 'Nausea/Vomiting' AND _FATESTCD = 'SEV')
        then: '''NAUSEA'''
      - when: (_FAOBJ = 'Erythema' AND (_FATEST_UP IS NOT NULL AND str_contains(_FATEST_UP, 'OCCURRENCE')) AND _FAORRES_UP IN ('N', 'NO'))
        then: '''ERYTHDIA'''
      - when: (_FAOBJ = 'Swelling' AND (_FATEST_UP IS NOT NULL AND str_contains(_FATEST_UP, 'OCCURRENCE')) AND _FAORRES_UP IN ('N', 'NO'))
        then: '''SWELLDIA'''
      - when: (_FAOBJ = 'Erythema' AND (_FATEST_UP IS NOT NULL AND str_contains(_FATEST_UP, 'INTENSITY')))
        then: '''ERYTHDIA'''
      - when: (_FAOBJ = 'Swelling' AND (_FATEST_UP IS NOT NULL AND str_contains(_FATEST_UP, 'INTENSITY')))
        then: '''SWELLDIA'''
      - when: (_FAOBJ = 'Erythema' AND _FATEST = 'Longest Diameter')
        then: '''ERYTHDIA'''
      - when: (_FAOBJ = 'Swelling' AND _FATEST = 'Longest Diameter')
        then: '''SWELLDIA'''
      - when: (_FAOBJ = 'Headache')
        then: '''HEADACHE'''
      - when: (_FAOBJ = 'Fatigue')
        then: '''FATIGUE'''
      - when: (_FAOBJ = 'Myalgia')
        then: '''MYALGIA'''
      - when: (_FAOBJ = 'Arthralgia')
        then: '''ARTHRALG'''
      - when: (_FAOBJ = 'Chills')
        then: '''CHILLS'''
      - when: (_FAOBJ = 'Receive Medical Attention?')
        then: '''MEDATTEN'''
      - when: ((_VSTESTCD IS NOT NULL AND str_contains(_VSTESTCD, '^MEDTA')))
        then: _VSTESTCD
      - otherwise: null
    _PARAM:
      case:
      - when: (_PARAMCD = 'LYMPH')
        then: '''Underarm Gland Swelling or Tenderness'''
      - when: (_PARAMCD = 'PAIN')
        then: '''Pain'''
      - when: (_PARAMCD = 'ERYTHDIA')
        then: '''Erythema Longest Diameter (mm)'''
      - when: (_PARAMCD = 'SWELLDIA')
        then: '''Swelling Longest Diameter (mm)'''
      - when: (_PARAMCD = 'HEADACHE')
        then: '''Headache'''
      - when: (_PARAMCD = 'FATIGUE')
        then: '''Fatigue'''
      - when: (_PARAMCD = 'MYALGIA')
        then: '''Myalgia'''
      - when: (_PARAMCD = 'ARTHRALG')
        then: '''Arthralgia'''
      - when: (_PARAMCD = 'NAUSEA')
        then: '''Nausea/Vomiting'''
      - when: (_PARAMCD = 'CHILLS')
        then: '''Chills'''
      - when: (_PARAMCD = 'MEDATTEN')
        then: '''Receive Medical Attention?'''
      - when: (_PARAMCD = 'FEVER')
        then: '''Fever (C)'''
      - when: (_PARAMCD = 'MEDTAKP')
        then: '''Prevent Pain or Fever from Occurring'''
      - when: (_PARAMCD = 'MEDTAKT')
        then: '''Treat Pain or Fever already Occurred'''
      - when: (_PARAMCD = 'MEDTAK')
        then: '''Medication Taken Today for Pain or Fever'''
      - otherwise: _FAOBJ
    _PTREF:
      case:
      - when: (_DOMAIN = 'FA')
        then: _FATPTREF
      - otherwise: _VSTPTREF
    _PTREF_NB:
      str_replace:
        source: _PTREF
        pattern: ' '
        replacement: ''
    _ATPTREF:
      case:
      - when: (_PTREF_NB = 'DOSE1')
        then: '''Vaccination 1'''
      - when: (_PTREF_NB = 'DOSE2')
        then: '''Vaccination 2'''
      - otherwise: null
    _ATPT:
      case:
      - when: (_DOMAIN = 'FA' AND _FATPT = 'DAY 1' AND _FAEVAL = 'INVESTIGATOR')
        then: '''DAY 1, AFTER VACCINATION (AT HOME)'''
      - when: (_DOMAIN = 'VS')
        then: _VSTPT
      - otherwise: _FATPT
    _ATPTGR1_TOK:
      str_extract:
        source: _ATPT
        pattern: '^([^,]*)'
        group: 1
        no_match: ''
    _ATPTGR1:
      case:
      - when: (_ATPTGR1_TOK = 'DAY 1')
        then: '''DAY 1'''
      - otherwise: _ATPT
    _PARCAT1:
      case:
      - when: (_DOMAIN = 'FA' AND _FASCAT = 'ADMINISTRATION SITE')
        then: '''LOCAL'''
      - when: (_DOMAIN = 'FA')
        then: _FASCAT
      - otherwise: _VSSCAT
    _PARCAT1N:
      case:
      - when: (_PARCAT1 = 'LOCAL')
        then: 1
      - when: (_PARCAT1 = 'SYSTEMIC')
        then: 2
      - otherwise: null
    _AVAL_NUM: _FASTRESN
    _AVALC: _FASTRESC
    _AVALC_UP:
      str_case:
        source: _AVALC
        to: upper
    _ATOXGRN:
      case:
      - when: (_PARAMCD IN ('ERYTHDIA', 'SWELLDIA') AND ((_AVAL_NUM >= 25 AND _AVAL_NUM <= 50) OR (_FASTRESC IS NOT NULL AND str_contains(_FASTRESC, 'GRADE 1'))))
        then: 1
      - when: (_PARAMCD IN ('ERYTHDIA', 'SWELLDIA') AND ((_AVAL_NUM > 50 AND _AVAL_NUM <= 100) OR (_FASTRESC IS NOT NULL AND str_contains(_FASTRESC, 'GRADE 2'))))
        then: 2
      - when: (_PARAMCD IN ('ERYTHDIA', 'SWELLDIA') AND (_AVAL_NUM > 100 OR (_FASTRESC IS NOT NULL AND str_contains(_FASTRESC, 'GRADE 3'))))
        then: 3
      - when: (_PARAMCD IN ('ERYTHDIA', 'SWELLDIA') AND (_FASTRESC IS NOT NULL AND str_contains(_FASTRESC, 'GRADE 4')))
        then: 4
      - when: (_PARAMCD = 'FEVER' AND ((_AVAL_NUM >= 38 AND _AVAL_NUM <= 38.4) OR (_FASTRESC IS NOT NULL AND str_contains(_FASTRESC, 'GRADE 1'))))
        then: 1
      - when: (_PARAMCD = 'FEVER' AND ((_AVAL_NUM > 38.4 AND _AVAL_NUM <= 38.9) OR (_FASTRESC IS NOT NULL AND str_contains(_FASTRESC, 'GRADE 2'))))
        then: 2
      - when: (_PARAMCD = 'FEVER' AND ((_AVAL_NUM > 38.9 AND _AVAL_NUM <= 40) OR (_FASTRESC IS NOT NULL AND str_contains(_FASTRESC, 'GRADE 3'))))
        then: 3
      - when: (_PARAMCD = 'FEVER' AND (_AVAL_NUM > 40 OR (_FASTRESC IS NOT NULL AND str_contains(_FASTRESC, 'GRADE 4'))))
        then: 4
      - when: (_PARAMCD IN ('PAIN', 'LYMPH', 'HEADACHE') AND (_AVALC_UP = 'DOES NOT INTERFERE WITH ACTIVITY' OR _AVALC_UP = 'NO INTERFERENCE WITH ACTIVITY' OR (_FASTRESC IS NOT NULL AND str_contains(_FASTRESC, 'GRADE 1'))))
        then: 1
      - when: (_PARAMCD IN ('PAIN', 'LYMPH', 'HEADACHE') AND ((_AVALC_UP IS NOT NULL AND str_contains(_AVALC_UP, 'REPEATED')) OR (_FASTRESC IS NOT NULL AND str_contains(_FASTRESC, 'GRADE 2'))))
        then: 2
      - when: (_PARAMCD IN ('PAIN', 'LYMPH', 'HEADACHE') AND (_AVALC_UP = 'ANY USE OF PRESCRIPTION RELIEVER OR PREVENTS DAILY ACTIVITY' OR _AVALC_UP = 'ANY USE OF PRESCRIPTION PAIN RELIEVER OR PREVENTS DAILY ACTIVITY' OR (_FASTRESC IS NOT NULL AND str_contains(_FASTRESC, 'GRADE 3'))))
        then: 3
      - when: (_PARAMCD IN ('PAIN', 'LYMPH', 'HEADACHE') AND (_FASTRESC IS NOT NULL AND str_contains(_FASTRESC, 'GRADE 4')))
        then: 4
      - when: (_PARAMCD IN ('FATIGUE', 'MYALGIA', 'ARTHRALG') AND (_AVALC_UP = 'NO INTERFERENCE WITH ACTIVITY' OR (_FASTRESC IS NOT NULL AND str_contains(_FASTRESC, 'GRADE 1'))))
        then: 1
      - when: (_PARAMCD IN ('FATIGUE', 'MYALGIA', 'ARTHRALG') AND (_AVALC_UP = 'SOME INTERFERENCE WITH ACTIVITY' OR (_FASTRESC IS NOT NULL AND str_contains(_FASTRESC, 'GRADE 2'))))
        then: 2
      - when: (_PARAMCD IN ('FATIGUE', 'MYALGIA', 'ARTHRALG') AND (_AVALC_UP = 'SIGNIFICANT; PREVENTS DAILY ACTIVITY' OR (_FASTRESC IS NOT NULL AND str_contains(_FASTRESC, 'GRADE 3'))))
        then: 3
      - when: (_PARAMCD IN ('FATIGUE', 'MYALGIA', 'ARTHRALG') AND (_FASTRESC IS NOT NULL AND str_contains(_FASTRESC, 'GRADE 4')))
        then: 4
      - when: (_PARAMCD = 'NAUSEA' AND (_AVALC_UP = 'NO INTERFERENCE WITH ACTIVITY OR 1-2 EPISODES/24 HOURS' OR (_FASTRESC IS NOT NULL AND str_contains(_FASTRESC, 'GRADE 1'))))
        then: 1
      - when: (_PARAMCD = 'NAUSEA' AND (_AVALC_UP = 'SOME INTERFERENCE WITH ACTIVITY OR >2 EPISODES/24 HOURS' OR (_FASTRESC IS NOT NULL AND str_contains(_FASTRESC, 'GRADE 2'))))
        then: 2
      - when: (_PARAMCD = 'NAUSEA' AND (_AVALC_UP = 'PREVENTS DAILY ACTIVITY, REQUIRES OUTPATIENT IV HYDRATION' OR (_FASTRESC IS NOT NULL AND str_contains(_FASTRESC, 'GRADE 3'))))
        then: 3
      - when: (_PARAMCD = 'NAUSEA' AND (_FASTRESC IS NOT NULL AND str_contains(_FASTRESC, 'GRADE 4')))
        then: 4
      - when: (_PARAMCD = 'CHILLS' AND (_AVALC_UP = 'NO INTERFERENCE WITH ACTIVITY' OR (_FASTRESC IS NOT NULL AND str_contains(_FASTRESC, 'GRADE 1'))))
        then: 1
      - when: (_PARAMCD = 'CHILLS' AND (_AVALC_UP = 'SOME INTERFERENCE WITH ACTIVITY NOT REQUIRING MEDICAL ATTENTION' OR (_FASTRESC IS NOT NULL AND str_contains(_FASTRESC, 'GRADE 2'))))
        then: 2
      - when: (_PARAMCD = 'CHILLS' AND (_AVALC_UP = 'PREVENTS DAILY ACTIVITY AND REQUIRES MEDICAL ATTENTION' OR (_FASTRESC IS NOT NULL AND str_contains(_FASTRESC, 'GRADE 3'))))
        then: 3
      - when: (_PARAMCD = 'CHILLS' AND (_FASTRESC IS NOT NULL AND str_contains(_FASTRESC, 'GRADE 4')))
        then: 4
      - otherwise: null
    _ATOXGR:
      case:
      - when: (_ATOXGRN = 1)
        then: '''Grade 1'''
      - when: (_ATOXGRN = 2)
        then: '''Grade 2'''
      - when: (_ATOXGRN = 3)
        then: '''Grade 3'''
      - when: (_ATOXGRN = 4)
        then: '''Grade 4'''
      - otherwise: "''"
    _ANL01FL:
      case:
      - when: (_PARAMCD IN ('PAIN', 'ERYTHDIA', 'SWELLDIA', 'LYMPH'))
        then: '''Y'''
      - otherwise: "''"
    _FAEVAL_NUM:
      case:
      - when: (_FAEVAL = 'STUDY SUBJECT')
        then: 1
      - when: ((_FAEVAL IS NULL OR _FAEVAL IN ('')))
        then: 2
      - when: (_FAEVAL = 'INVESTIGATOR')
        then: 3
      - otherwise: null
    _AGFL:
      case:
      - when: (_ATOXGRN IS NOT NULL)
        then: 1
      - otherwise: null
    _K_FAAE_FA: K_FAAE_FA._HIT
    _K_FAAE_VS: K_FAAE_VS._HIT
    _K_VS_VS: null
    _K_VS_FAAE: null
    _WIT_FAAE: K_WIT_FAAE._HIT
    _WIT_TEMP: K_WIT_TEMP._HIT
    _WIT_MEDTAK: K_WIT_MEDTAK._HIT
    _WIT_MEDTAKP: K_WIT_MEDTAKP._HIT
    _WIT_MEDTAKT: K_WIT_MEDTAKT._HIT
  filter: ((_K_FAAE_FA IS NOT NULL OR _K_FAAE_VS IS NOT NULL) AND NOT((_FAOBJ IN ('Erythema', 'Swelling') AND _FATEST = 'Occurrence Indicator') OR (_FASTAT IS NOT NULL AND _FASTAT = 'NOT DONE') OR (_FACAT IS NULL OR _FACAT <> 'REACTOGENICITY') OR _FASTRESC IN ('NONE', '') OR (_FASTRESC IS NOT NULL AND str_contains(_FASTRESC, 'GRADE 0')) OR _FASTRESC IS NULL) AND ((_PARAMCD IN ('ERYTHDIA', 'SWELLDIA') AND (_AVAL_NUM IS NULL OR _AVAL_NUM >= 25)) OR (_PARAMCD = 'FEVER' AND (_AVAL_NUM IS NULL OR _AVAL_NUM >= 38)) OR (_PARAMCD NOT IN ('ERYTHDIA', 'SWELLDIA', 'FEVER')) OR _PARAMCD IS NULL) AND NOT(_ATPTREF = 'Vaccination 2' AND _DOSE2FL = 'N') AND (_WIT_FAAE IS NOT NULL OR _WIT_TEMP IS NOT NULL OR _WIT_MEDTAK IS NOT NULL OR _WIT_MEDTAKP IS NOT NULL OR _WIT_MEDTAKT IS NOT NULL) AND _ADSL IS NOT NULL)
- id: vs_rows
  dataset: VS
  derivations:
    STUDYID: VS.STUDYID
    USUBJID: VS.USUBJID
    _DOMAIN: '''VS'''
    _DTC: VS.VSDTC
    _FADY: null
    _VSDY: VS.VSDY
    _FATPTREF: null
    _VSTPTREF: VS.VSTPTREF
    _FATPT: null
    _VSTPT: VS.VSTPT
    _FAOBJ: null
    _FATEST: null
    _FATESTCD: null
    _FAORRES: null
    _FASTRESC: null
    _FASTRESN: null
    _FASTAT: null
    _FASCAT: null
    _FACAT: null
    _FAEVAL: "''"
    _FATEST_UP:
      str_case:
        source: _FATEST
        to: upper
    _FAORRES_UP:
      str_case:
        source: _FAORRES
        to: upper
    _FASEQ: null
    _VSTESTCD: VS.VSTESTCD
    _VSCAT: VS.VSCAT
    _VSSCAT: VS.VSSCAT
    _VSSTRESC: VS.VSSTRESC
    _VSORRESU: VS.VSORRESU
    _VSSTAT: VS.VSSTAT
    _VSTPTNUM: VS.VSTPTNUM
    _VSSEQ: VS.VSSEQ
    _STRESN_NUM:
      value: VS.VSSTRESN
      unconvertible: null
    _ORRES_NUM:
      value: VS.VSORRES
      unconvertible: null
    _MAAEFL: null
    _MEDTAK: SUPP_P_VS.MEDTAK
    _MEDTAKP: SUPP_P_VS.MEDTAKP
    _MEDTAKT: SUPP_P_VS.MEDTAKT
    _PCD_E: null
    _PARAMCD:
      case:
      - when: (_VSTESTCD IN ('TEMP', 'VSALL') OR _FAOBJ IN ('Pyrexia', 'Fever'))
        then: '''FEVER'''
      - when: (_FAOBJ = 'Underarm Gland Swelling or Tenderness' AND _FATESTCD = 'SEV')
        then: '''LYMPH'''
      - when: (_FAOBJ = 'Pain')
        then: '''PAIN'''
      - when: (_FAOBJ = 'Nausea/Vomiting' AND _FATESTCD = 'SEV')
        then: '''NAUSEA'''
      - when: (_FAOBJ = 'Erythema' AND (_FATEST_UP IS NOT NULL AND str_contains(_FATEST_UP, 'OCCURRENCE')) AND _FAORRES_UP IN ('N', 'NO'))
        then: '''ERYTHDIA'''
      - when: (_FAOBJ = 'Swelling' AND (_FATEST_UP IS NOT NULL AND str_contains(_FATEST_UP, 'OCCURRENCE')) AND _FAORRES_UP IN ('N', 'NO'))
        then: '''SWELLDIA'''
      - when: (_FAOBJ = 'Erythema' AND (_FATEST_UP IS NOT NULL AND str_contains(_FATEST_UP, 'INTENSITY')))
        then: '''ERYTHDIA'''
      - when: (_FAOBJ = 'Swelling' AND (_FATEST_UP IS NOT NULL AND str_contains(_FATEST_UP, 'INTENSITY')))
        then: '''SWELLDIA'''
      - when: (_FAOBJ = 'Erythema' AND _FATEST = 'Longest Diameter')
        then: '''ERYTHDIA'''
      - when: (_FAOBJ = 'Swelling' AND _FATEST = 'Longest Diameter')
        then: '''SWELLDIA'''
      - when: (_FAOBJ = 'Headache')
        then: '''HEADACHE'''
      - when: (_FAOBJ = 'Fatigue')
        then: '''FATIGUE'''
      - when: (_FAOBJ = 'Myalgia')
        then: '''MYALGIA'''
      - when: (_FAOBJ = 'Arthralgia')
        then: '''ARTHRALG'''
      - when: (_FAOBJ = 'Chills')
        then: '''CHILLS'''
      - when: (_FAOBJ = 'Receive Medical Attention?')
        then: '''MEDATTEN'''
      - when: ((_VSTESTCD IS NOT NULL AND str_contains(_VSTESTCD, '^MEDTA')))
        then: _VSTESTCD
      - otherwise: null
    _PARAM:
      case:
      - when: (_PARAMCD = 'LYMPH')
        then: '''Underarm Gland Swelling or Tenderness'''
      - when: (_PARAMCD = 'PAIN')
        then: '''Pain'''
      - when: (_PARAMCD = 'ERYTHDIA')
        then: '''Erythema Longest Diameter (mm)'''
      - when: (_PARAMCD = 'SWELLDIA')
        then: '''Swelling Longest Diameter (mm)'''
      - when: (_PARAMCD = 'HEADACHE')
        then: '''Headache'''
      - when: (_PARAMCD = 'FATIGUE')
        then: '''Fatigue'''
      - when: (_PARAMCD = 'MYALGIA')
        then: '''Myalgia'''
      - when: (_PARAMCD = 'ARTHRALG')
        then: '''Arthralgia'''
      - when: (_PARAMCD = 'NAUSEA')
        then: '''Nausea/Vomiting'''
      - when: (_PARAMCD = 'CHILLS')
        then: '''Chills'''
      - when: (_PARAMCD = 'MEDATTEN')
        then: '''Receive Medical Attention?'''
      - when: (_PARAMCD = 'FEVER')
        then: '''Fever (C)'''
      - when: (_PARAMCD = 'MEDTAKP')
        then: '''Prevent Pain or Fever from Occurring'''
      - when: (_PARAMCD = 'MEDTAKT')
        then: '''Treat Pain or Fever already Occurred'''
      - when: (_PARAMCD = 'MEDTAK')
        then: '''Medication Taken Today for Pain or Fever'''
      - otherwise: _FAOBJ
    _PTREF:
      case:
      - when: (_DOMAIN = 'FA')
        then: _FATPTREF
      - otherwise: _VSTPTREF
    _PTREF_NB:
      str_replace:
        source: _PTREF
        pattern: ' '
        replacement: ''
    _ATPTREF:
      case:
      - when: (_PTREF_NB = 'DOSE1')
        then: '''Vaccination 1'''
      - when: (_PTREF_NB = 'DOSE2')
        then: '''Vaccination 2'''
      - otherwise: null
    _ATPT:
      case:
      - when: (_DOMAIN = 'FA' AND _FATPT = 'DAY 1' AND _FAEVAL = 'INVESTIGATOR')
        then: '''DAY 1, AFTER VACCINATION (AT HOME)'''
      - when: (_DOMAIN = 'VS')
        then: _VSTPT
      - otherwise: _FATPT
    _ATPTGR1_TOK:
      str_extract:
        source: _ATPT
        pattern: '^([^,]*)'
        group: 1
        no_match: ''
    _ATPTGR1:
      case:
      - when: (_ATPTGR1_TOK = 'DAY 1')
        then: '''DAY 1'''
      - otherwise: _ATPT
    _PARCAT1:
      case:
      - when: (_DOMAIN = 'FA' AND _FASCAT = 'ADMINISTRATION SITE')
        then: '''LOCAL'''
      - when: (_DOMAIN = 'FA')
        then: _FASCAT
      - otherwise: _VSSCAT
    _PARCAT1N:
      case:
      - when: (_PARCAT1 = 'LOCAL')
        then: 1
      - when: (_PARCAT1 = 'SYSTEMIC')
        then: 2
      - otherwise: null
    _AVAL_NUM:
      case:
      - when: (_VSORRESU = 'F')
        then: (_ORRES_NUM - 32) * 0.5555555555555556
      - otherwise: _STRESN_NUM
    _AVALC: _VSSTRESC
    _AVALC_UP:
      str_case:
        source: _AVALC
        to: upper
    _ATOXGRN:
      case:
