    _ATPT:
      case:
      - when: (_DOMAIN = 'FA' AND _FATPT = 'DAY 1' AND _FAEVAL = 'INVESTIGATOR')
        then: '''DAY 1, AFTER VACCINATION (AT HOME)'''
      - when: (_DOMAIN = 'VS')
        then: _VSTPT
      - otherwise: _FATPT
    _ATPTN:
      type: int
      derivation:
        str_extract:
          source: _ATPT
          pattern: 'DAY ([0-9]+)'
          group: 1
          no_match: ''
      unconvertible: null
    _HIT: 1
  order_by:
  - VS.VSSEQ
  keep: first
- id: K_WIT_MEDTAKT
  dataset: VS
  key:
    USUBJID: USUBJID
    _PCD: _PARAMCD
    _ATPTREF: _ATPTREF
  filter: VS._MEDTAKT = 'Y' AND VS._ATPTREF IS NOT NULL AND VS._ATPTN > 7
  derivations:
    _VSSEQ: VS.VSSEQ
    _MEDTAKT: SUPP_P_VS.MEDTAKT
    _VSTPTREF: VS.VSTPTREF
    _VSTPT: VS.VSTPT
    _PCD: '''MEDTAKT'''
    _FATPTREF: null
    _DOMAIN: '''VS'''
    _PTREF:
      case:
      - when: (_DOMAIN = 'FA')
        then: _FATPTREF
      - otherwise: _VSTPTREF
    _PTREF_NB:
      str_replace:
        source: _PTREF
        pattern: ' '
        replacement: ''
    _ATPTREF:
      case:
      - when: (_PTREF_NB = 'DOSE1')
        then: '''Vaccination 1'''
      - when: (_PTREF_NB = 'DOSE2')
        then: '''Vaccination 2'''
      - otherwise: null
    _FATPT: null
    _FAEVAL: "''"
    _ATPT:
      case:
      - when: (_DOMAIN = 'FA' AND _FATPT = 'DAY 1' AND _FAEVAL = 'INVESTIGATOR')
        then: '''DAY 1, AFTER VACCINATION (AT HOME)'''
      - when: (_DOMAIN = 'VS')
        then: _VSTPT
      - otherwise: _FATPT
    _ATPTN:
      type: int
      derivation:
        str_extract:
          source: _ATPT
          pattern: 'DAY ([0-9]+)'
          group: 1
          no_match: ''
      unconvertible: null
    _HIT: 1
  order_by:
  - VS.VSSEQ
  keep: first
windows:
  ANL04_ORD:
    group_by: [USUBJID, PARAMCD, ANL01FL, ATPTREF]
    order_by:
    - variable: _ATPTA
      direction: desc
    - ATPTGR1N
    - ADT
    - _ORI_ADTM
  ANL05_ORD:
    group_by: [USUBJID, PARAM, ATPTREF, ATPT]
    order_by:
    - _AGFL
    - ATOXGRN
    - variable: ADT
      direction: desc
    - variable: _FAEVAL_NUM
      direction: desc
    - variable: SRCSEQ
      direction: desc
  ANL03_GRP:
    group_by: [USUBJID, PARAMCD, ATPTREF]
    order_by:
    - variable: _ANL03FL
      direction: desc
    - ATPTN
  ANL03_GLOBAL:
    order_by:
    - USUBJID
    - PARAMCD
    - ATPTREF
    - variable: _ANL03FL
      direction: desc
    - ATPTN
  ASEQ_W:
    group_by: [USUBJID]
    order_by:
    - PARCAT1
    - PARAMCD
    - ATPTREF
    - ADT
    - _ORI_ADTM
    - SRCSEQ
