      - when: (_DOMAIN = 'FA' AND _FASCAT = 'ADMINISTRATION SITE')
        then: '''LOCAL'''
      - when: (_DOMAIN = 'FA')
        then: _FASCAT
      - otherwise: _VSSCAT
    _PARCAT1N:
      case:
      - when: (_PARCAT1 = 'LOCAL')
