- name: TRTA
  type: str
  label: Actual Treatment
  derivation:
    case:
    - when: _DOSE = 'Vaccination 1' AND str_contains(EX_DOSE1.EXTRT, '[Pp][Ll][Aa][Cc][Ee][Bb][Oo]')
      then: '''Placebo'''
    - when: _DOSE = 'Vaccination 1' AND str_contains(EX_DOSE1.EXTRT, '[Mm][Rr][Nn][Aa]') AND EX_DOSE1.EXDOSE > 0
      then: '''mRNA-1273'''
    - when: _DOSE = 'Vaccination 2' AND str_contains(EX_DOSE2.EXTRT, '[Pp][Ll][Aa][Cc][Ee][Bb][Oo]')
      then: '''Placebo'''
    - when: _DOSE = 'Vaccination 2' AND str_contains(EX_DOSE2.EXTRT, '[Mm][Rr][Nn][Aa]') AND EX_DOSE2.EXDOSE > 0
      then: '''mRNA-1273'''
    - when: _DOSE = 'OL Vaccination 1' AND str_contains(EX_DOSE3.EXTRT, '[Pp][Ll][Aa][Cc][Ee][Bb][Oo]')
      then: '''Placebo'''
    - when: _DOSE = 'OL Vaccination 1' AND str_contains(EX_DOSE3.EXTRT, '[Mm][Rr][Nn][Aa]') AND EX_DOSE3.EXDOSE > 0
      then: '''mRNA-1273'''
    - when: _DOSE = 'OL Vaccination 2' AND str_contains(EX_DOSE4.EXTRT, '[Pp][Ll][Aa][Cc][Ee][Bb][Oo]')
      then: '''Placebo'''
    - when: _DOSE = 'OL Vaccination 2' AND str_contains(EX_DOSE4.EXTRT, '[Mm][Rr][Nn][Aa]') AND EX_DOSE4.EXDOSE > 0
      then: '''mRNA-1273'''
    - otherwise: "''"
  submission:
    core: Perm
    mandatory: false
    length: 50
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
