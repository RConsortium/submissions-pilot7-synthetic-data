# ADIS for Moderna mRNA-1273-P301, cut S3 (BLA Interim Analysis,
# cutoff 2021-03-26). Parent: ../../../spec/yamaa/base/adam-base-s3.yaml (which
# chains to ../../../spec/yamaa/base/adam-base.yaml; 86 shared + 59 S3-only ADSL
# columns). Derivations implement the S3 A20ADIS program: IS rows
# plus the %newparamcd LOG10 rows (SUPPIS pivoted in), each
# inner-joined to the verified ADSL on USUBJID, with the %ablfl
# visit windowing (sort-1/2/3/4/5, ANL01FL, adis_atpt) and the
# %trta treatment assignment. Where the SAS code and the
# define.xml method text disagree, the code is followed (see the
# generator header). Honest gap: LOG10 1-ulp cells on derived
# rows only (104 cells within tolerance, max 8.88e-16; see the
# generator header).
yamaa: '1.0'
type: spec
model: ADaM
parent: ../../../spec/yamaa/base/adam-base-s3.yaml
domain: ADIS
keys:
- STUDYID
- USUBJID
- ISSEQ
- PARAMCD
input:
  IS: <sdtm-dir>/is.parquet
  SUPPIS: <sdtm-dir>/suppis.parquet
  EX: <sdtm-dir>/ex.parquet
  ADSL:
    path: <adam-dir>/adsl.parquet
    key:
    - STUDYID
    - USUBJID
submission:
  label: Immunogenicity Analysis Dataset
  class: BASIC DATA STRUCTURE
  structure: One or more records per subject per analysis parameter per analysis timepoint
  repeating: true
rows:
- id: base_rows
  dataset: IS
  derivations:
    STUDYID: IS.STUDYID
    USUBJID: IS.USUBJID
    SUBJID: IS.SUBJID
    _ISSEQ: IS.ISSEQ
    _ISSTAT: IS.ISSTAT
    _ISTESTCD: IS.ISTESTCD
    _ISTEST: IS.ISTEST
    _ISCAT: IS.ISCAT
    _ISSTRESC: IS.ISSTRESC
    _ISSTRESN: IS.ISSTRESN
    _ISSTRESU: IS.ISSTRESU
    _ISORRESU: IS.ISORRESU
    _ISLLOQ: IS.ISLLOQ
    _ISULOQ: SUPP_P.ISULOQ
    _ISLOD: SUPP_P.ISLOD
    _ISNAM: IS.ISNAM
    _ISSPEC: IS.ISSPEC
    _ISMETHOD: IS.ISMETHOD
    _ISDTC: IS.ISDTC
    _VISITNUM: IS.VISITNUM
    _ISORNRLO: IS.ISORNRLO
    _ISORNRHI: IS.ISORNRHI
    _ORI_VISIT: IS.VISIT
    _VISIT:
      case:
      - when: str_contains(_ORI_VISIT, '^Illness Visit Day 3 - Day 21')
        then: '''Illness Visit Day 3 Unscheduled 1'''
      - otherwise: _ORI_VISIT
    _HALF:
      case:
      - when: str_contains(_ISSTRESC, '<') OR str_contains(_ISSTRESC, '[Bb][Qq][Ll]') OR (_ISLLOQ IS NOT NULL AND _ISSTRESN IS NOT NULL AND _ISSTRESN < _ISLLOQ)
        then: 1
    _AVAL_SRC:
      case:
      - when: _HALF = 1
        then: _ISLLOQ * 0.5
      - when: str_contains(_ISSTRESC, '>')
        then: _ISULOQ
      - otherwise: _ISSTRESN
    DTYPE:
      case:
      - when: _HALF = 1
        then: '''HALFLLOQ'''
      - when: str_contains(_ISSTRESC, '>')
        then: '''ULOQ'''
      - otherwise: "''"
    ISLLOQ: IS.ISLLOQ
    ISSTRESC: IS.ISSTRESC
    ISSTRESN: IS.ISSTRESN
    ISORNRLO: IS.ISORNRLO
    ISORNRHI: IS.ISORNRHI
    PARAMCD: IS.ISTESTCD
    PARAM:
      case:
      - when: _ISTEST = 'PsVNT50'
        then: '''Pseudovirus Neutralizing Antibody ID50 Titers'''
      - when: _ISTEST = 'PsVNT80'
        then: '''Pseudovirus Neutralizing Antibody ID80 Titers'''
      - when: _ISTESTCD = 'MN50'
        then: '''Wild Type Live Virus nAb Microneutralization 50%'''
      - when: _ISTESTCD = 'SARSCOV2'
        then: '''Elecsys Anti-SARS-CoV-2'''
      - when: _ISCAT = 'Serum SARS-CoV-2 Neutralizing Antibodies'
        then: _ISTEST
      - when: (str_contains(_ISNAM, 'PPD Vaccine') OR str_contains(_ISNAM, 'VRC')) AND _ISMETHOD IS NOT NULL AND _ISMETHOD NOT IN ('') AND _ISSTRESU IS NOT NULL AND _ISSTRESU NOT IN ('')
        then:
          str_template:
            template: '{_ISTEST} ({_ISSTRESU}) by {_ISMETHOD}'
            missing: ''
      - when: str_contains(_ISNAM, 'PPD Vaccine') AND _ISSTRESU IS NOT NULL AND _ISSTRESU NOT IN ('')
        then:
          str_template:
            template: '{_ISTEST} ({_ISSTRESU}) by ELISA'
            missing: ''
      - when: str_contains(_ISNAM, 'VRC') AND _ISSTRESU IS NOT NULL AND _ISSTRESU NOT IN ('')
        then:
          str_template:
            template: '{_ISTEST} ({_ISSTRESU}) by MSD MULTIPLEX'
            missing: ''
      - otherwise: _ISTEST
    PARAMTYP: "''"
    _DERIVED: 0
  filter: (_ISSTAT IS NULL OR _ISSTAT IN ('')) AND _ISTESTCD IS NOT NULL AND _ISCAT IN ('Serum SARS-CoV-2 Neutralizing Antibodies', 'Serum SARS-CoV-2 Binding Antibodies') AND _ADSL IS NOT NULL
- id: derived_rows
  dataset: IS
  derivations:
    STUDYID: IS.STUDYID
    USUBJID: IS.USUBJID
    SUBJID: IS.SUBJID
    _ISSEQ: IS.ISSEQ
    _ISSTAT: IS.ISSTAT
    _ISTESTCD: IS.ISTESTCD
    _ISTEST: IS.ISTEST
    _ISCAT: IS.ISCAT
    _ISSTRESC: IS.ISSTRESC
    _ISSTRESN: IS.ISSTRESN
    _ISSTRESU: IS.ISSTRESU
    _ISORRESU: IS.ISORRESU
    _ISLLOQ: IS.ISLLOQ
    _ISULOQ: SUPP_P.ISULOQ
    _ISLOD: SUPP_P.ISLOD
    _ISNAM: IS.ISNAM
    _ISSPEC: IS.ISSPEC
    _ISMETHOD: IS.ISMETHOD
    _ISDTC: IS.ISDTC
    _VISITNUM: IS.VISITNUM
    _ISORNRLO: IS.ISORNRLO
    _ISORNRHI: IS.ISORNRHI
    _ORI_VISIT: IS.VISIT
    _VISIT:
      case:
      - when: str_contains(_ORI_VISIT, '^Illness Visit Day 3 - Day 21')
        then: '''Illness Visit Day 3 Unscheduled 1'''
      - otherwise: _ORI_VISIT
    _HALF:
      case:
      - when: str_contains(_ISSTRESC, '<') OR str_contains(_ISSTRESC, '[Bb][Qq][Ll]') OR (_ISLLOQ IS NOT NULL AND _ISSTRESN IS NOT NULL AND _ISSTRESN < _ISLLOQ)
        then: 1
    _AVAL_SRC:
      case:
      - when: _HALF = 1
        then: _ISLLOQ * 0.5
      - when: str_contains(_ISSTRESC, '>')
        then: _ISULOQ
      - otherwise: _ISSTRESN
    DTYPE:
      case:
      - when: _HALF = 1
        then: '''HALFLLOQ'''
      - when: str_contains(_ISSTRESC, '>')
        then: '''ULOQ'''
      - otherwise: "''"
    ISLLOQ: IS.ISLLOQ
    ISSTRESC: "''"
    ISSTRESN: null
    ISORNRLO: "''"
    ISORNRHI: "''"
    PARAMCD:
      mapping:
        source: _ISTESTCD
        dict:
          V65IGGS: LV65IGGS
          V66IGGN: LV66IGGN
          NPIGG: LNPIGG
          RBDIGG: LRBDIGG
          S2PIGG: LS2PIGG
          PSVNT50: L10PVN50
          PSVNT80: L10PVN80
        unmapped: null
    PARAM:
      mapping:
        source: PARAMCD
        dict:
          LV65IGGS: 'LOG10(VAC65 Spike IgG Antibody)'
          LV66IGGN: 'LOG10(VAC66 Nucleocapsid IgG Antibody)'
          LNPIGG: 'LOG10(SARSCOV2NP IgG Antibody)'
          LRBDIGG: 'LOG10(SARSCOV2RBD IgG Antibody)'
          LS2PIGG: 'LOG10(SARSCOV2S2P IgG Antibody)'
          L10PVN50: 'LOG10(PsVNT50)'
          L10PVN80: 'LOG10(PsVNT80)'
        unmapped: null
    PARAMTYP: '''DERIVED'''
    _DERIVED: 1
  filter: (_ISSTAT IS NULL OR _ISSTAT IN ('')) AND _ISTESTCD IS NOT NULL AND _ISCAT IN ('Serum SARS-CoV-2 Neutralizing Antibodies', 'Serum SARS-CoV-2 Binding Antibodies') AND _ADSL IS NOT NULL AND PARAMCD IS NOT NULL AND _AVAL_SRC IS NOT NULL AND _AVAL_SRC <> 0
intermediates:
- id: SUPP_P
  dataset: SUPPIS
  key:
    STUDYID: STUDYID
    USUBJID: USUBJID
    IDVARVAL:
      str_decimal:
        source: _ISSEQ
        decimals: 0
  filter: SUPPIS.QNAM IN ('ISULOQ', 'ISLOD') AND SUPPIS.IDVAR = 'ISSEQ'
  pivot:
    name: QNAM
    value: QVAL
    fields:
    - ISULOQ
    - ISLOD
- id: EX_DOSE1
  dataset: EX
  key: [STUDYID, USUBJID]
  filter: EX.EXSTDTC IS NOT NULL AND str_contains(EX.VISIT, '[Dd][Aa][Yy] 1( |$)')
  order_by: [EX.EXSTDTC]
  keep: first
- id: EX_DOSE2
  dataset: EX
  key: [STUDYID, USUBJID]
  filter: EX.EXSTDTC IS NOT NULL AND str_contains(EX.VISIT, '[Dd][Aa][Yy] 29')
  order_by: [EX.EXSTDTC]
  keep: first
- id: EX_DOSE3
  dataset: EX
  key: [STUDYID, USUBJID]
  filter: EX.EXSTDTC IS NOT NULL AND str_contains(EX.VISIT, '[Oo][Ll]-[Dd]1')
  order_by: [EX.EXSTDTC]
  keep: first
- id: EX_DOSE4
  dataset: EX
  key: [STUDYID, USUBJID]
  filter: EX.EXSTDTC IS NOT NULL AND str_contains(EX.VISIT, '[Oo][Ll]-[Dd]29')
  order_by: [EX.EXSTDTC]
  keep: first
windows:
  SORT1_W:
    group_by: [STUDYID, USUBJID, PARAMCD]
    order_by:
    - variable: _AVALN
      direction: desc
    - _POSTFL
    - variable: _PREFL_ADT
      direction: desc
    - variable: _PRE_AVAL
      direction: desc
    - variable: _ILLUNS
      direction: desc
    - VISITNUM
  SORT2_W:
    group_by: [STUDYID, USUBJID, PARAMCD]
    order_by:
    - variable: _AVALN
      direction: desc
    - _POSTFL
    - variable: _PREFL_ADT
      direction: desc
    - ADT
    - _ADDSORTN
    - _ILLUNS
    - _ADTMY
    - _ISSTRESN_
    - variable: _POST01SDT_ADT1
      direction: desc
    - _ADTMY_NUM
    - variable: _POST01SDT_ADT
      direction: desc
    - variable: VISITNUM
      direction: desc
    - variable: ISSEQ
      direction: desc
  BASELINE_W:
    group_by: [STUDYID, USUBJID, PARAMCD]
    order_by:
    - ADT
    - AVAL
    - ADTM
    - variable: _ADDSORTN
      direction: desc
    - variable: _ILLUNS
      direction: desc
    - variable: _ADTMY
      direction: desc
    - variable: _ISSTRESN_
      direction: desc
    - _POST01SDT_ADT1
    - variable: _ADTMY_NUM
      direction: desc
    - _POST01SDT_ADT
    - VISITNUM
    - ISSEQ
  FIRST_ADT_W:
    group_by: [STUDYID, USUBJID, PARAMCD, _AVALN, _POSTFL, _PREFL_ADT, ADT]
    order_by:
    - _ADDSORTN
    - _ILLUNS
    - _ADTMY
    - _ISSTRESN_
    - variable: _POST01SDT_ADT1
      direction: desc
    - _ADTMY_NUM
    - variable: _POST01SDT_ADT
      direction: desc
    - variable: VISITNUM
      direction: desc
    - variable: ISSEQ
      direction: desc
  SORT4_W:
    group_by: [STUDYID, USUBJID, PARAMCD]
    order_by:
    - variable: _AVALN
      direction: desc
    - _POSTFL
    - ADT
    - variable: _ILL_ADY
      direction: desc
  SORT5_W:
    group_by: [STUDYID, USUBJID, PARAMCD]
    order_by:
    - _AVISITN_P4
    - ADY
    - _UNS
  ANL01_W:
    group_by: [STUDYID, USUBJID, PARAMCD, _AVISITN_P6]
    order_by:
    - variable: _POSTFL
      direction: desc
    - variable: _AVALN_P2
      direction: desc
    - variable: _AVALN2
      direction: desc
    - _UNS
    - _AWTDIFF_P2
    - AVAL
    - variable: ISSEQ
      direction: desc
columns:
- name: _ADSL
  type: str
  derivation: ADSL.USUBJID
- name: STUDYID
  submission:
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: USUBJID
  submission:
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: SUBJID
  submission:
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: _ISSEQ
  type: float
- name: _ISSTAT
  type: str
- name: _ISTESTCD
  type: str
- name: _ISTEST
  type: str
- name: _ISCAT
  type: str
- name: _ISSTRESC
  type: str
- name: _ISSTRESN
  type: float
- name: _ISSTRESU
  type: str
- name: _ISORRESU
  type: str
- name: _ISLLOQ
  type: float
- name: _ISULOQ
  type: float
- name: _ISLOD
  type: float
- name: _ISNAM
  type: str
- name: _ISSPEC
  type: str
- name: _ISMETHOD
  type: str
- name: _ISDTC
  type: str
- name: _VISITNUM
  type: float
- name: _ISORNRLO
  type: str
- name: _ISORNRHI
  type: str
- name: _ORI_VISIT
  type: str
- name: _VISIT
  type: str
- name: _HALF
  type: int
- name: _AVAL_SRC
  type: float
- name: _DERIVED
  type: int
- name: _ADT_TXT
  type: str
  derivation: ADT
- name: _ADDSORTN
  type: str
  derivation:
    case:
    - when: (_VISIT IS NULL OR _VISIT IN ('') OR str_contains(_VISIT, 'Uns')) AND ADT IS NOT NULL
      then:
        str_template:
          template: '{_ADT_TXT} - 999'
          missing: ''
    - when: str_contains(_ORI_VISIT, '^Illness Visit Day 3 - Day 21') AND str_contains(_VISIT, 'Uns')
      then: '''          - 998'''
    - when: (str_contains(_VISIT, '^Ill') OR str_contains(_VISIT, '^Conva') OR str_contains(_VISIT, 'OL-D')) AND ADT IS NOT NULL AND TR01SDT IS NOT NULL AND ADT > TR01SDT
      then: _ADT_TXT
    - when: (str_contains(_VISIT, '^Ill') OR str_contains(_VISIT, '^Conva') OR str_contains(_VISIT, 'OL-D')) AND (_ISDTC IS NULL OR _ISDTC IN (''))
      then: '''0000'''
    - otherwise: "''"
- name: _VISIT2A
  type: str
  derivation:
    str_replace:
      source: _VISIT
      pattern: 'Convalescence'
      replacement: 'Illness'
- name: _VISIT2
  type: str
  derivation:
    case:
    - when: _VISIT2A IS NULL OR _VISIT2A IN ('') OR str_contains(_VISIT2A, 'Saf') OR str_contains(_VISIT2A, 'COV')
      then:
        str_template:
          template: 'Unsched {_VISIT2A}'
          missing: ''
    - otherwise: _VISIT2A
- name: _VISIT2_UP
  type: str
  derivation:
    str_case:
      source: _VISIT2
      to: upper
- name: _DAYDIFF
  type: int
  derivation:
    diff:
      type: date
      start: TR01SDT
      end: ADT
      unit: day
- name: _ADTMY_S
  type: float
  derivation:
    case:
    - when: ADT IS NOT NULL AND TR01SDT IS NOT NULL
      then: _DAYDIFF * 86400
    - when: NOT str_contains(_VISIT2_UP, 'ILLNESS')
      then: 99999999
- name: _ADTMY_ABS
  type: float
  derivation: ABS(_ADTMY_S)
- name: _POSTDOSE
  type: int
  derivation:
    case:
    - when: ADT IS NOT NULL AND TR01SDT IS NOT NULL AND ADT > TR01SDT
      then: 1
- name: _ADTMY_NUM
  type: float
  derivation:
    case:
    - when: VISITNUM IS NOT NULL AND _ADTMY_ABS > 0
      then: _ADTMY_ABS + VISITNUM
    - otherwise: _ADTMY_ABS
- name: _ADTMY
  type: float
  derivation:
    case:
    - when: _POSTDOSE = 1 AND str_contains(_VISIT2, 'Uns') AND VISITNUM IS NULL
      then: 999
    - when: _POSTDOSE = 1
      then: VISITNUM
    - otherwise: _ADTMY_ABS
- name: _PREFL
  type: str
  derivation:
    case:
    - when: _ADTMY_S <= 0 AND TR01SDT IS NOT NULL
      then: '''Y'''
- name: _POSTFL
  type: str
  derivation:
    case:
    - when: _ADTMY_S > 0 AND TR01SDT IS NOT NULL AND ADT IS NOT NULL
      then: '''Y'''
- name: _PREFL_ADT
  type: date
  derivation:
    case:
    - when: _PREFL = 'Y'
      then: ADT
- name: _PRE_AVAL
  type: float
  derivation:
    case:
    - when: _PREFL = 'Y'
      then: AVAL
- name: _ISSTRESC_C
  type: str
  derivation:
    case:
    - when: AVAL IS NOT NULL
      then: '''Results'''
    - when: PARAMCD = 'SARSCOV2'
      then: _ISSTRESC
    - otherwise: "''"
- name: _AVALN
  type: int
  derivation:
    case:
    - when: _ISSTRESC_C IS NOT NULL AND _ISSTRESC_C NOT IN ('')
      then: 1
    - when: (str_contains(_VISIT2_UP, 'ILLNESS') OR str_contains(_VISIT2, 'Uns')) AND (_POSTDOSE = 1 OR ADT IS NULL)
      then: 1
- name: _AVALN2
  type: int
  derivation:
    case:
    - when: _ISSTRESC_C IS NOT NULL AND _ISSTRESC_C NOT IN ('')
      then: 1
- name: _ILLUNS
  type: int
  derivation:
    case:
    - when: str_contains(_VISIT2, 'Uns')
      then: 1
    - when: str_contains(_VISIT2_UP, 'ILLNESS') OR str_contains(_VISIT2, 'OL-D')
      then: 2
    - otherwise: 0
- name: _ISSTRESC_UP
  type: str
  derivation:
    str_case:
      source: _ISSTRESC
      to: upper
- name: _ISSTRESN_
  type: int
  derivation:
    case:
    - when: _PREFL = 'Y' AND NOT str_contains(_VISIT2_UP, 'ILLNESS') AND _ISSTRESC_UP = 'POSITIVE'
      then: 1
    - when: _PREFL = 'Y' AND NOT str_contains(_VISIT2_UP, 'ILLNESS') AND _ISSTRESC_UP = 'NEGATIVE'
      then: 2
    - otherwise: 9
- name: _VISITNUM_INV
  type: float
  derivation: 10000 - VISITNUM
- name: _POST01_8
  type: str
  derivation:
    str_decimal:
      source: _VISITNUM_INV
      decimals: 0
      width: 8
      missing: '        '
- name: _POST01SDT_ADT
  type: str
  derivation:
    case:
    - when: ADT IS NOT NULL AND TR01SDT IS NOT NULL AND ADT > TR01SDT
      then: _POST01_8
    - otherwise: _ISDTC
- name: _VISITNUM_52
  type: str
  derivation:
    str_decimal:
      source: VISITNUM
      decimals: 2
      width: 5
      missing: '     '
- name: _POST01SDT_ADT1
  type: str
  derivation:
    case:
    - when: ADT IS NOT NULL AND TR01SDT IS NOT NULL AND ADT > TR01SDT
      then: _POST01_8
    - otherwise:
        str_template:
          template: '{_ISDTC}{_VISITNUM_52}'
          missing: ''
- name: _OPEND1_SRC
  type: float
  derivation:
    case:
    - when: str_contains(_VISIT2_UP, 'OL-D1') AND NOT str_contains(_VISIT2, 'Uns')
      then: ADY
- name: _OPENDT_SRC
  type: date
  derivation:
    case:
    - when: str_contains(_VISIT2_UP, 'OL-D1') AND NOT str_contains(_VISIT2, 'Uns')
      then: ADT
- name: _RETAIN_OPEND1
  type: float
  derivation:
    locf:
      source: _OPEND1_SRC
      window: SORT1_W
- name: _RETAIN_OPENDT
  type: date
  derivation:
    locf:
      source: _OPENDT_SRC
      window: SORT1_W
- name: _SORT2_RN
  type: int
  derivation:
    row_number:
      window: SORT2_W
- name: _FIRST_ADT
  type: int
  derivation:
    row_number:
      window: FIRST_ADT_W
- name: _VISIT_PREV
  type: str
  derivation:
    row_value:
      source: _VISIT2
      offset: -1
      window: SORT2_W
- name: _SCHEILL_DAY1_SRC
  type: str
  derivation:
    case:
    - when: _VISIT2 = 'Illness Visit Day 1'
      then: '''Illness Visit Day 1'''
- name: _SCHEILL_DAY1
  type: str
  derivation:
    locf:
      source: _SCHEILL_DAY1_SRC
      window: SORT2_W
- name: _SCHEILL_DATE_SRC
  type: date
  derivation:
    case:
    - when: _VISIT2 = 'Illness Visit Day 1'
      then: ADT
- name: _SCHEILL_DATE
  type: date
  derivation:
    locf:
      source: _SCHEILL_DATE_SRC
      window: SORT2_W
- name: _SCHEILL_UPDATE
  type: str
  derivation:
    case:
    - when: NOT str_contains(_VISIT2, 'Uns') AND NOT str_contains(_VISIT2, 'Ill')
      then: "''"
    - otherwise: _SCHEILL_DAY1
- name: _ILL_SET_PREV
  type: int
  derivation:
    row_value:
      source: _ILL_SET
      offset: -1
      window: SORT2_W
- name: _ILL_DAT_PREV
  type: date
  derivation:
    row_value:
      source: _ILL_DAT
      offset: -1
      window: SORT2_W
- name: _ILL_ADY_PREV
  type: float
  derivation:
    row_value:
      source: _ILL_ADY
      offset: -1
      window: SORT2_W
- name: _ILL_SET
  type: int
  derivation:
    case:
    - when: (_FIRST_ADT = 1 AND str_contains(_VISIT2_UP, 'ILLNESS') AND _ORI_VISIT <> 'Illness Visit Day 3 - Day 21' AND str_contains(_VISIT2_UP, 'DAY 1') AND NOT str_contains(_VISIT2_UP, 'DAY 1[0-9]') AND NOT str_contains(_VISIT2, 'Uns')) OR (_FIRST_ADT <> 1 AND _VISIT2 = 'Illness Visit Day 1' AND _VISIT2 <> _VISIT_PREV)
      then:
        case:
        - when: ((_SCHEILL_DAY1 IS NULL) OR (ADT IS NOT NULL AND _SCHEILL_DATE IS NOT NULL AND ADT < _SCHEILL_DATE) OR (str_contains(_VISIT2, 'Illness Visit Day 1 Unscheduled') AND _ILL_SET_PREV >= 1)) AND str_contains(_VISIT2_UP, 'ILLNESS') AND _SORT2_RN = 1
          then: 0
        - when: ((_SCHEILL_DAY1 IS NULL) OR (ADT IS NOT NULL AND _SCHEILL_DATE IS NOT NULL AND ADT < _SCHEILL_DATE) OR (str_contains(_VISIT2, 'Illness Visit Day 1 Unscheduled') AND _ILL_SET_PREV >= 1)) AND str_contains(_VISIT2_UP, 'ILLNESS')
          then: _ILL_SET_PREV
        - when: _SORT2_RN = 1
          then: 1
        - otherwise: _ILL_SET_PREV + 1
    - when: _SORT2_RN = 1
      then: 0
    - otherwise: _ILL_SET_PREV
- name: _ILL_DAT
  type: date
  derivation:
    case:
    - when: (_FIRST_ADT = 1 AND str_contains(_VISIT2_UP, 'ILLNESS') AND _ORI_VISIT <> 'Illness Visit Day 3 - Day 21' AND str_contains(_VISIT2_UP, 'DAY 1') AND NOT str_contains(_VISIT2_UP, 'DAY 1[0-9]') AND NOT str_contains(_VISIT2, 'Uns')) OR (_FIRST_ADT <> 1 AND _VISIT2 = 'Illness Visit Day 1' AND _VISIT2 <> _VISIT_PREV)
      then: ADT
    - otherwise: _ILL_DAT_PREV
- name: _ILL_ADY
  type: float
  derivation:
    case:
    - when: (_FIRST_ADT = 1 AND str_contains(_VISIT2_UP, 'ILLNESS') AND _ORI_VISIT <> 'Illness Visit Day 3 - Day 21' AND str_contains(_VISIT2_UP, 'DAY 1') AND NOT str_contains(_VISIT2_UP, 'DAY 1[0-9]') AND NOT str_contains(_VISIT2, 'Uns')) OR (_FIRST_ADT <> 1 AND _VISIT2 = 'Illness Visit Day 1' AND _VISIT2 <> _VISIT_PREV)
      then: ADY
    - otherwise: _ILL_ADY_PREV
- name: _BASELINE_SRC
  type: int
  derivation:
    case:
    - when: _AVALN = 1 AND _PREFL = 'Y'
      then: 1
- name: _BASELINE
  type: str
  derivation:
    baseline_flag:
      date: ADT
      reference: TR01SDT
      source: _BASELINE_SRC
      window:
        group_by: [STUDYID, USUBJID, PARAMCD]
        order_by:
        - ADT
        - AVAL
        - ADTM
        - variable: _ADDSORTN
          direction: desc
        - variable: _ILLUNS
          direction: desc
        - variable: _ADTMY
          direction: desc
        - variable: _ISSTRESN_
          direction: desc
        - _POST01SDT_ADT1
        - variable: _ADTMY_NUM
          direction: desc
        - _POST01SDT_ADT
        - VISITNUM
        - ISSEQ
- name: _BASEC
  type: str
  derivation:
    aggregate:
      filter: _BASELINE = 'Y'
      group_by: [STUDYID, USUBJID, PARAMCD]
      expr: ONLY(_ISSTRESC)
- name: _BASELLOQ
  type: float
  derivation:
    aggregate:
      filter: _BASELINE = 'Y'
      group_by: [STUDYID, USUBJID, PARAMCD]
      expr: ONLY(_ISLLOQ)
- name: _BQL_ROW
  type: str
  derivation:
    case:
    - when: str_contains(_ISSTRESC, '<') OR str_contains(_ISSTRESC, '[Bb][Qq][Ll]') OR (_ISLLOQ IS NOT NULL AND _ISSTRESN IS NOT NULL AND _ISSTRESN < _ISLLOQ)
      then: '''Y'''
- name: _ABLFL_BQL
  type: str
  derivation:
    aggregate:
      filter: _BASELINE = 'Y'
      group_by: [STUDYID, USUBJID, PARAMCD]
      expr: ONLY(_BQL_ROW)
- name: _D_ILL
  type: int
  derivation:
    diff:
      type: date
      start: _ILL_DAT
      end: ADT
      unit: day
- name: _D_OPEN
  type: int
  derivation:
    diff:
      type: date
      start: _RETAIN_OPENDT
      end: ADT
      unit: day
- name: _V_SCAN4
  type: str
  derivation:
    str_extract:
      source: _VISIT2
      pattern: '^(?:\S+\s+){3}(\S+)'
      group: 1
      no_match: ''
- name: _AVISIT_PRE
  type: str
  derivation:
    case:
    - when: _BASELINE = 'Y'
      then: '''Baseline'''
    - when: _BASELINE IS NULL AND ADT IS NOT NULL AND _ILL_DAT IS NOT NULL AND ADT = _ILL_DAT AND _SCHEILL_UPDATE IS NOT NULL AND _SCHEILL_UPDATE NOT IN ('') AND str_contains(_VISIT2, 'Uns')
      then: '''Illness Visit Day 1'''
    - when: _VISIT2_UP = 'VISIT 1 DAY 1' AND ADT IS NOT NULL
      then: "''"
    - when: _VISIT2 = 'Illness Visit Day 1' AND ADT IS NOT NULL
      then: '''Illness Visit Day 1'''
    - when: ADY IS NOT NULL AND ADY > 1 AND str_contains(_VISIT2_UP, 'ILLNESS') AND NOT str_contains(_VISIT2, 'Uns')
      then:
        str_template:
          template: 'Illness Visit Day {_V_SCAN4}'
          missing: ''
    - when: ADY IS NOT NULL AND ADY > 1 AND str_contains(_VISIT2_UP, 'OL-D1') AND NOT str_contains(_VISIT2, 'Uns') AND NOT str_contains(_VISIT2, 'Ill')
      then: '''Participant Decision Visit / OL-D1'''
    - when: ADY IS NOT NULL AND ADY > 1 AND str_contains(_VISIT2_UP, 'OL-D29') AND NOT str_contains(_VISIT2, 'Uns') AND NOT str_contains(_VISIT2, 'Ill')
      then: '''Open Label Day 29'''
    - when: ADY IS NOT NULL AND ADY > 1 AND str_contains(_VISIT2_UP, 'OL-D57') AND NOT str_contains(_VISIT2, 'Uns') AND NOT str_contains(_VISIT2, 'Ill')
      then: '''Open Label Day 57'''
    - when: (str_contains(_VISIT2_UP, 'ILLNESS') OR str_contains(_VISIT2, 'Uns')) AND _D_ILL >= 2 AND _D_ILL <= 34
      then: '''Illness Visit Day 28'''
    - when: TR02SDT IS NOT NULL AND _RETAIN_OPENDT IS NOT NULL AND _RETAIN_OPENDT = ADT AND str_contains(_VISIT2, 'Uns')
      then: '''Participant Decision Visit / OL-D1'''
    - when: TR02SDT IS NOT NULL AND OLDOS2DT IS NULL AND str_contains(_VISIT2, 'Uns') AND NOT str_contains(_VISIT2, 'Ill') AND _RETAIN_OPENDT IS NOT NULL AND _D_OPEN >= 1 AND _D_OPEN <= 42
      then: '''Open Label Day 29'''
    - when: TR02SDT IS NOT NULL AND OLDOS2DT IS NOT NULL AND str_contains(_VISIT2, 'Uns') AND NOT str_contains(_VISIT2, 'Ill') AND _RETAIN_OPEND1 IS NOT NULL AND _RETAIN_OPENDT IS NOT NULL AND _D_OPEN >= 1 AND _D_OPEN <= 70
      then: '''Open Label Day 57'''
    - when: ADY IS NOT NULL AND ADY > 1 AND _ORI_VISIT = 'Illness Visit Day 3 - Day 21' AND _ILL_DAT IS NULL
      then: '''Illness Visit'''
    - when: ADY IS NOT NULL AND ADY > 1 AND str_contains(_VISIT2, 'Illness')
      then:
        str_template:
          template: 'Illness Visit Day {_V_SCAN4}'
          missing: ''
    - when: _POSTFL = 'Y' AND (str_contains(_VISIT2, 'Uns') OR str_contains(_VISIT2, 'Safe') OR str_contains(_VISIT2_UP, 'ILLNESS')) AND ADY >= 2 AND ADY <= 43
      then: '''Day 29'''
    - when: _POSTFL = 'Y' AND (str_contains(_VISIT2, 'Uns') OR str_contains(_VISIT2, 'Safe') OR str_contains(_VISIT2_UP, 'ILLNESS')) AND ADY > 43 AND ADY <= 133
      then: '''Day 57'''
    - when: _POSTFL = 'Y' AND (str_contains(_VISIT2, 'Uns') OR str_contains(_VISIT2, 'Safe') OR str_contains(_VISIT2_UP, 'ILLNESS')) AND ADY > 133 AND ADY <= 301
      then: '''Day 209'''
    - when: _POSTFL = 'Y' AND (str_contains(_VISIT2, 'Uns') OR str_contains(_VISIT2, 'Safe') OR str_contains(_VISIT2_UP, 'ILLNESS')) AND ADY > 301 AND ADY <= 576
      then: '''Day 394'''
    - when: _POSTFL = 'Y' AND (str_contains(_VISIT2, 'Uns') OR str_contains(_VISIT2, 'Safe') OR str_contains(_VISIT2_UP, 'ILLNESS')) AND ADY > 576 AND ADY <= 773
      then: '''Day 759'''
    - when: ADY IS NOT NULL AND ADY > 1 AND _POSTFL = 'Y' AND str_contains(_VISIT2_UP, 'DAY')
      then:
        str_template:
          template: 'Day {_V_SCAN4}'
          missing: ''
    - otherwise: "''"
- name: _TYPE2_DAY
  type: str
  derivation:
    case:
    - when: _AVISIT_PRE = '' AND _POSTFL = 'Y' AND (str_contains(_VISIT2, 'Uns') OR _VISIT2 IS NULL OR _VISIT2 IN ('') OR str_contains(_VISIT2, 'Safe')) AND ADY >= 2 AND ADY <= 43
      then: '''Day 29'''
    - when: _AVISIT_PRE = '' AND _POSTFL = 'Y' AND (str_contains(_VISIT2, 'Uns') OR _VISIT2 IS NULL OR _VISIT2 IN ('') OR str_contains(_VISIT2, 'Safe')) AND ADY > 44 AND ADY <= 133
      then: '''Day 57'''
    - when: _AVISIT_PRE = '' AND _POSTFL = 'Y' AND (str_contains(_VISIT2, 'Uns') OR _VISIT2 IS NULL OR _VISIT2 IN ('') OR str_contains(_VISIT2, 'Safe')) AND ADY > 133 AND ADY <= 301
      then: '''Day 209'''
    - when: _AVISIT_PRE = '' AND _POSTFL = 'Y' AND (str_contains(_VISIT2, 'Uns') OR _VISIT2 IS NULL OR _VISIT2 IN ('') OR str_contains(_VISIT2, 'Safe')) AND ADY > 301 AND ADY <= 576
      then: '''Day 394'''
    - when: _AVISIT_PRE = '' AND _POSTFL = 'Y' AND (str_contains(_VISIT2, 'Uns') OR _VISIT2 IS NULL OR _VISIT2 IN ('') OR str_contains(_VISIT2, 'Safe')) AND ADY > 576 AND ADY <= 773
      then: '''Day 759'''
- name: _AVISIT_P2
  type: str
  derivation:
    case:
    - when: _TYPE2_DAY IS NOT NULL
      then: _TYPE2_DAY
    - otherwise: _AVISIT_PRE
- name: _AVISITN_PRE
  type: int
  derivation:
    case:
    - when: _AVISIT_P2 = 'Illness Visit Day 1'
      then: 101
    - when: _AVISIT_P2 = 'Illness Visit Day 3'
      then: 103
    - when: _AVISIT_P2 = 'Illness Visit Day 5'
      then: 105
    - when: _AVISIT_P2 = 'Illness Visit Day 7'
      then: 107
    - when: _AVISIT_P2 = 'Illness Visit Day 9'
      then: 109
    - when: _AVISIT_P2 = 'Illness Visit Day 14'
      then: 114
    - when: _AVISIT_P2 = 'Illness Visit Day 21'
      then: 121
    - when: _AVISIT_P2 = 'Illness Visit Day 28'
      then: 128
    - when: str_contains(_AVISIT_P2, 'Illness')
      then: 100 * _ILL_SET + 1
    - when: _AVISIT_P2 = 'Baseline'
      then: 1
    - when: _AVISIT_P2 = 'Day 1'
      then: 2
    - when: _AVISIT_P2 = 'Day 29'
      then: 3
    - when: _AVISIT_P2 = 'Day 57'
      then: 4
    - when: _AVISIT_P2 = 'Day 209'
      then: 6
    - when: _AVISIT_P2 = 'Day 394'
      then: 7
    - when: _AVISIT_P2 = 'Day 759'
      then: 8
    - when: _AVISIT_P2 = 'Participant Decision Visit / OL-D1'
      then: 10
    - when: _AVISIT_P2 = 'Open Label Day 29'
      then: 11
    - when: _AVISIT_P2 = 'Open Label Day 57'
      then: 12
- name: _AVISIT_P3
  type: str
  derivation:
    case:
    - when: _AVISITN_PRE IS NULL OR _AVISITN_PRE IN (1, 3, 4, 6, 7, 8, 10, 11, 12, 101, 128) OR _AVISITN_PRE >= 100
      then: _AVISIT_P2
    - otherwise: "''"
- name: _AVISITN_P3
  type: int
  derivation:
    case:
    - when: _AVISITN_PRE IS NULL OR _AVISITN_PRE IN (1, 3, 4, 6, 7, 8, 10, 11, 12, 101, 128) OR _AVISITN_PRE >= 100
      then: _AVISITN_PRE
- name: _RETAIN_ILL_ADY
  type: float
  derivation:
    locf:
      source: _ILL_ADY
      window: SORT4_W
- name: _AVISITN_P3_N0
  type: int
  derivation:
    case:
    - when: _AVISITN_P3 IS NOT NULL
      then: _AVISITN_P3
    - otherwise: 0
- name: _V_SCAN3_P3
  type: str
  derivation:
    str_extract:
      source: _AVISIT_P3
      pattern: '^(?:\S+\s+){2}(\S+)'
      group: 1
      no_match: ''
- name: _V_SCAN4_P3
  type: str
  derivation:
    str_extract:
      source: _AVISIT_P3
      pattern: '^(?:\S+\s+){3}(\S+)'
      group: 1
      no_match: ''
- name: _ILL_SET_TXT
  type: str
  derivation: _ILL_SET
- name: _AVISIT_P4
  type: str
  derivation:
    case:
    - when: _ILL_SET > 1 AND str_contains(_AVISIT_P3, 'Illness') AND _V_SCAN3_P3 = 'Day' AND _SCHEILL_DAY1 IS NOT NULL
      then:
        str_template:
          template: 'Illness Visit {_ILL_SET_TXT} Day {_V_SCAN4_P3}'
          missing: ''
    - otherwise: _AVISIT_P3
- name: _AVISITN_P4
  type: int
  derivation:
    case:
    - when: _ILL_SET > 1 AND str_contains(_AVISIT_P3, 'Illness') AND _V_SCAN3_P3 = 'Day' AND _SCHEILL_DAY1 IS NOT NULL
      then: 100 * (_ILL_SET - 1) + _AVISITN_P3_N0
    - otherwise: _AVISITN_P3
- name: _AVISIT_MINUS2
  type: str
  derivation:
    str_replace:
      source: _AVISIT_P4
      pattern: '..$'
      replacement: ''
- name: _AVISIT_P4_PAD
  type: str
  derivation:
    str_template:
      template: '{_AVISIT_P4} '
      missing: ''
- name: _AWRANGE_P4
  type: str
  derivation:
    case:
    - when: str_contains(_AVISIT_P4, 'Illness') AND str_contains(_AVISIT_P4_PAD, 'Day 1 ')
      then: _AVISIT_P4
    - when: str_contains(_AVISIT_P4, 'Illness')
      then:
        str_template:
          template: '{_AVISIT_MINUS2}3 - {_AVISIT_MINUS2}35'
          missing: ''
    - when: _AVISIT_P4 = 'Baseline'
      then: '''<=1 Pre-dose'''
    - when: _AVISIT_P4 = 'Day 29'
      then: '''Day 2 - Day 43 Pre-second-dose'''
    - when: _AVISIT_P4 = 'Day 57'
      then: '''Day 44 - Day 133'''
    - when: _AVISIT_P4 = 'Day 209'
      then: '''Day 134 - Day 301'''
    - when: _AVISIT_P4 = 'Day 394'
      then: '''Day 302 - Day 576'''
    - when: _AVISIT_P4 = 'Day 759'
      then: '''Day 577 - Day 773'''
    - when: _AVISITN_P4 = 10
      then: '''Participant Decision Visit / OL-D1'''
    - when: _AVISITN_P4 = 11
      then: '''Day 2 - Day 43 Relative to Participant Decision Visit / OL-D1'''
    - when: _AVISITN_P4 = 12
      then: '''Day 2 - Day 71 Relative to Participant Decision Visit / OL-D1'''
    - otherwise: "''"
- name: _AWTARGET_P4
  type: int
  derivation:
    case:
    - when: _AVISITN_P4 = 101 AND _RETAIN_ILL_ADY IS NOT NULL
      then: _RETAIN_ILL_ADY
    - when: str_contains(_AWRANGE_P4, 'Illness') AND str_contains(_AVISIT_P4_PAD, 'Day 1 ')
      then: _RETAIN_ILL_ADY
    - when: str_contains(_AWRANGE_P4, 'Illness') AND str_contains(_AWRANGE_P4, 'Day 3') AND _RETAIN_ILL_ADY IS NOT NULL
      then: _RETAIN_ILL_ADY + 27
    - when: _AVISIT_P4 = 'Baseline'
      then: 1
    - when: _AVISIT_P4 = 'Day 1'
      then: 1
    - when: _AVISIT_P4 = 'Day 29'
      then: 29
    - when: _AVISIT_P4 = 'Day 57'
      then: 57
    - when: _AVISIT_P4 = 'Day 119'
      then: 119
    - when: _AVISIT_P4 = 'Day 209'
      then: 209
    - when: _AVISIT_P4 = 'Day 394'
      then: 394
    - when: _AVISIT_P4 = 'Day 759'
      then: 759
    - when: _AVISITN_P4 = 10
      then: _RETAIN_OPEND1
    - when: _AVISITN_P4 = 11 AND _RETAIN_OPEND1 IS NOT NULL
      then: _RETAIN_OPEND1 + 28
    - when: _AVISITN_P4 = 12 AND _RETAIN_OPEND1 IS NOT NULL
      then: _RETAIN_OPEND1 + 56
- name: _AWTDIFF_P4
  type: int
  derivation: ABS(ADY - _AWTARGET_P4)
- name: _UNS
  type: int
  derivation:
    case:
    - when: _POSTFL = 'Y' AND (str_contains(_VISIT2, 'Uns') OR _VISIT2 IS NULL OR _VISIT2 IN ('') OR str_contains(_VISIT2, 'Safe'))
      then: 1
    - when: _POSTFL = 'Y'
      then: 0
- name: _AWTDIFF
  type: int
  derivation:
    case:
    - when: _POSTFL = 'Y' AND _UNS = 1
      then: _AWTDIFF_P4
    - when: _POSTFL = 'Y'
      then: 0
    - otherwise: 99999999
- name: _SORT5_RN
  type: int
  derivation:
    row_number:
      window: SORT5_W
- name: _RETAIN_ADY_SRC
  type: float
  derivation:
    case:
    - when: _UNS = 0 OR (_SORT5_RN = 1 AND NOT str_contains(_VISIT2, '999'))
      then: ADY
- name: _RETAIN_ADY
  type: float
  derivation:
    locf:
      source: _RETAIN_ADY_SRC
      window: SORT5_W
- name: _RETAIN_AVISITN_SRC
  type: int
  derivation:
    case:
    - when: _UNS = 0 OR (_SORT5_RN = 1 AND NOT str_contains(_VISIT2, '999'))
      then: _AVISITN_P4
- name: _RETAIN_AVISITN
  type: int
  derivation:
    locf:
      source: _RETAIN_AVISITN_SRC
      window: SORT5_W
- name: _UNS_BLANK
  type: int
  derivation:
    case:
    - when: _UNS = 1 AND _RETAIN_ADY IS NOT NULL AND _RETAIN_ADY >= ADY AND _AVISITN_P4 IS NOT NULL AND _AVISITN_P4 < 100 AND _AVISITN_P4 > _RETAIN_AVISITN AND _RETAIN_AVISITN IS NOT NULL
      then: 1
- name: _AVISIT_P5
  type: str
  derivation:
    case:
    - when: _UNS_BLANK = 1
      then: "''"
    - otherwise: _AVISIT_P4
- name: _AVISITN_P5
  type: int
  derivation:
    case:
    - when: _UNS_BLANK = 1
      then: null
    - otherwise: _AVISITN_P4
- name: _AWRANGE_P5
  type: str
  derivation:
    case:
    - when: _UNS_BLANK = 1
      then: "''"
    - otherwise: _AWRANGE_P4
- name: _AWTARGET_P5
  type: int
  derivation:
    case:
    - when: _UNS_BLANK = 1
      then: null
    - otherwise: _AWTARGET_P4
- name: _AWTDIFF_P5
  type: int
  derivation:
    case:
    - when: _UNS_BLANK = 1
      then: null
    - otherwise: _AWTDIFF_P4
- name: _AVALN_P2
  type: int
  derivation:
    case:
    - when: _UNS_BLANK = 1
      then: 0
    - otherwise: _AVALN
- name: _AWTDIFF_P2
  type: int
  derivation:
    case:
    - when: _UNS_BLANK = 1
      then: 99999999
    - otherwise: _AWTDIFF
- name: _DERIVED_AVISIT
  type: str
  derivation: _AVISIT_P5
- name: _AVISIT_P6
  type: str
  derivation:
    case:
    - when: str_contains(_AVISIT_P5, 'Illness') AND _AVISITN_P5 IS NOT NULL AND _AVISITN_P5 >= 100 AND _AVISITN_P5 < 200
      then: '''Illness Visit'''
    - when: str_contains(_AVISIT_P5, 'Illness') AND _AVISITN_P5 IS NOT NULL AND _AVISITN_P5 > 200
      then:
        str_template:
          template: 'Illness Visit {_ILL_SET_TXT}'
          missing: ''
    - otherwise: _AVISIT_P5
- name: _AVISITN_P6
  type: int
  derivation:
    case:
    - when: str_contains(_AVISIT_P5, 'Illness') AND _AVISITN_P5 IS NOT NULL AND _AVISITN_P5 >= 100 AND _AVISITN_P5 < 200
      then: 100
    - when: str_contains(_AVISIT_P5, 'Illness') AND _AVISITN_P5 IS NOT NULL AND _AVISITN_P5 > 200
      then: 100 * _ILL_SET
    - otherwise: _AVISITN_P5
- name: _ANL01_RN
  type: int
  derivation:
    row_number:
      window: ANL01_W
- name: _ATPT_NUM
  type: str
  derivation:
    str_extract:
      source: _DERIVED_AVISIT
      pattern: 'Day ([0-9]+)'
      group: 1
      no_match: ''
- name: _ATPT_RAW
  type: str
  derivation:
    case:
    - when: str_contains(_AVISIT_P6, 'Ill')
      then:
        str_template:
          template: 'Day {_ATPT_NUM}'
          missing: ''
- name: _ATPT_A
  type: str
  derivation:
    case:
    - when: str_contains(_AVISIT_P6, 'Ill') AND (_SCHEILL_UPDATE IS NULL OR _SCHEILL_UPDATE IN ('')) AND (_ORI_VISIT IS NULL OR _ORI_VISIT IN ('') OR str_contains(_ORI_VISIT, 'Uns'))
      then: "''"
    - otherwise: _ATPT_RAW
- name: _ATPT_COMPRESS_SRC
  type: str
  derivation:
    str_replace:
      source: _ATPT_A
      pattern: ' '
      replacement: ''
- name: _COMPRESS
  type: int
  derivation:
    case:
    - when: str_contains(_AVISIT_P6, 'Ill') AND _ATPT_COMPRESS_SRC IN ('Unscheduled', 'Day', 'DayUnscheduled')
      then: 1
- name: _ATPT_BLANK
  type: int
  derivation:
    case:
    - when: str_contains(_AVISIT_P6, 'Ill') AND ((_SCHEILL_UPDATE IS NULL OR _SCHEILL_UPDATE IN ('')) AND (_ORI_VISIT IS NULL OR _ORI_VISIT IN ('') OR str_contains(_ORI_VISIT, 'Uns')) OR _COMPRESS = 1 OR (str_contains(_ORI_VISIT, 'Uns') AND _ILL_DAT IS NOT NULL AND ADT IS NOT NULL AND _D_ILL > 34) OR (str_contains(_ORI_VISIT, 'Uns') AND _ILL_DAT IS NULL) OR (_ORI_VISIT = 'Illness Visit Day 3 - Day 21' AND _ILL_DAT IS NULL))
      then: 1
- name: _AVIS_TMP1
  type: str
  derivation:
    str_replace:
      source: _AVISIT_P6
      pattern: 'Day Unscheduled'
      replacement: ''
- name: _AVIS_TMP2
  type: str
  derivation:
    str_replace:
      source: _AVIS_TMP1
      pattern: 'Day'
      replacement: ''
- name: _AVISITN_COMPRESS
  type: int
  derivation:
    case:
    - when: _ILL_SET = 0
      then: 100
    - otherwise: 100 * _ILL_SET
- name: _ATPTN_STR
  type: str
  derivation:
    str_extract:
      source: ATPT
      pattern: 'Day ([0-9]+)'
      group: 1
      no_match: ''
- name: _DOSE
  type: str
  derivation:
    case:
    - when: EX_DOSE4.EXTRT IS NOT NULL AND EX_DOSE4.EXTRT NOT IN ('') AND ((TR02SDTM IS NOT NULL AND OLDO2DTM IS NOT NULL AND ADTM IS NOT NULL AND TR02SDTM <= OLDO2DTM AND OLDO2DTM <= ADTM) OR (TR02SDT IS NOT NULL AND OLDOS2DT IS NOT NULL AND ADT IS NOT NULL AND TR02SDT <= OLDOS2DT AND OLDOS2DT <= ADT AND (OLDO2DTM IS NULL OR ADTM IS NULL)))
      then: '''OL Vaccination 2'''
    - when: EX_DOSE3.EXTRT IS NOT NULL AND EX_DOSE3.EXTRT NOT IN ('') AND ((TR02SDTM IS NOT NULL AND ADTM IS NOT NULL AND TR02SDTM <= ADTM AND OLDO2DTM IS NOT NULL AND ADTM < OLDO2DTM) OR (TR02SDTM IS NOT NULL AND ADTM IS NOT NULL AND TR02SDTM <= ADTM AND OLDOS2DT IS NULL) OR (TR02SDTM IS NOT NULL AND ADTM IS NOT NULL AND TR02SDTM <= ADTM AND OLDO2DTM IS NULL AND ADT IS NOT NULL AND OLDOS2DT IS NOT NULL AND ADT < OLDOS2DT) OR (TR02SDT IS NOT NULL AND ADT IS NOT NULL AND TR02SDT <= ADT AND OLDOS2DT IS NOT NULL AND ADT < OLDOS2DT AND (TR02SDTM IS NULL OR ADTM IS NULL)) OR (TR02SDT IS NOT NULL AND ADT IS NOT NULL AND TR02SDT <= ADT AND OLDOS2DT IS NULL AND (TR02SDTM IS NULL OR ADTM IS NULL)))
      then: '''OL Vaccination 1'''
    - when: (TR01SDTM IS NOT NULL AND ADTM IS NOT NULL AND DOS2DTM IS NOT NULL AND TR01SDTM <= ADTM AND ADTM < DOS2DTM) OR (TR01SDTM IS NOT NULL AND ADTM IS NOT NULL AND TR01SDTM <= ADTM AND DOS2DTM IS NULL AND (TR02SDTM IS NULL OR ADTM < TR02SDTM)) OR ((TR01SDTM IS NULL OR ADTM IS NULL) AND TR01SDT IS NOT NULL AND ADT IS NOT NULL AND DOSE2DT IS NOT NULL AND TR01SDT <= ADT AND ADT < DOSE2DT) OR ((TR01SDTM IS NULL OR ADTM IS NULL) AND TR01SDT IS NOT NULL AND ADT IS NOT NULL AND TR01SDT <= ADT AND DOSE2DT IS NULL AND (TR02SDT IS NULL OR ADT < TR02SDT))
      then: '''Vaccination 1'''
    - when: (DOS2DTM IS NOT NULL AND ADTM IS NOT NULL AND DOS2DTM <= ADTM AND TR02SDTM IS NOT NULL AND ADTM < TR02SDTM) OR (DOS2DTM IS NOT NULL AND ADTM IS NOT NULL AND DOS2DTM <= ADTM AND TR02SDT IS NULL) OR (DOS2DTM IS NOT NULL AND ADTM IS NOT NULL AND DOS2DTM <= ADTM AND TR02SDTM IS NULL AND ADT IS NOT NULL AND TR02SDT IS NOT NULL AND ADT < TR02SDT) OR (DOSE2DT IS NOT NULL AND ADT IS NOT NULL AND DOSE2DT <= ADT AND TR02SDT IS NOT NULL AND ADT < TR02SDT AND (DOS2DTM IS NULL OR ADTM IS NULL)) OR (DOSE2DT IS NOT NULL AND ADT IS NOT NULL AND DOSE2DT <= ADT AND TR02SDT IS NULL AND (DOS2DTM IS NULL OR ADTM IS NULL))
      then: '''Vaccination 2'''
    - otherwise: "''"
- name: _BQL_BASE
  type: int
  derivation:
    case:
    - when: str_contains(_BASEC, '<') OR str_contains(_ISSTRESC_UP, 'BQL') OR (BASE IS NOT NULL AND ISLLOQ IS NOT NULL AND BASE < ISLLOQ)
      then: 1
- name: _NOT_CHAIN
  type: int
  derivation:
    case:
    - when: BASE IS NULL OR (ISLLOQ IS NOT NULL AND BASE >= ISLLOQ)
      then: 1
- name: _NOT6
  type: int
  derivation:
    case:
    - when: BASE IS NULL OR ISLLOQ IS NULL OR BASE >= ISLLOQ
      then: 1
- name: _LT_BASEC
  type: int
  derivation:
    case:
    - when: _BASEC IS NULL OR NOT str_contains(_BASEC, '<')
      then: 1
- name: _NO_BQL
  type: int
  derivation:
    case:
    - when: _ISSTRESC IS NULL OR NOT str_contains(_ISSTRESC_UP, 'BQL')
      then: 1
- name: _CRIT_ACTIVE
  type: int
  derivation:
    case:
    - when: PARAMTYP <> 'DERIVED' AND ADT IS NOT NULL
      then: 1
- name: _CRIT_X
  type: float
  derivation:
    case:
    - when: PARAMCD = 'PSVNT50'
      then: 3.3
    - when: PARAMCD = 'PSVNT80'
      then: 2.3
    - when: PARAMCD = 'V65IGGS'
      then: 4.6
    - when: PARAMCD = 'S2PIGG'
      then: 1.9
    - otherwise: 4
- name: _ORI_ADTM
  type: datetime
  derivation:
    case:
    - when: str_contains(_ISDTC, 'T')
      then:
        impute:
          type: datetime
          source: _ISDTC
          time: first
