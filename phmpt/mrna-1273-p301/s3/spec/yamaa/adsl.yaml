- name: _HEIGHTBL
  type: float
  derivation:
    case:
    - when: HW_HEIGHT.VSSTRESU = 'cm' AND NOT HW_HEIGHT.VSSTRESN LIKE '(%'
      then: HW_HEIGHT.VSSTRESN
- name: _WEIGHTBL
  type: float
  derivation:
    case:
    - when: HW_WEIGHT.VSSTRESU = 'kg' AND NOT HW_WEIGHT.VSSTRESN LIKE '(%'
      then: HW_WEIGHT.VSSTRESN
- name: _BMIBL
  type: float
  derivation:
    case:
    - when: _HEIGHTBL IS NOT NULL AND _WEIGHTBL IS NOT NULL
      then: _WEIGHTBL / ((_HEIGHTBL / 100) * (_HEIGHTBL / 100))
- name: _BMIBL_TT1
  type: str
  derivation:
    str_decimal:
      source: _BMIBL
      decimals: 16
- name: _BMIBL_TK1
  type: float
  derivation:
    str_substr:
      source: _BMIBL_TT1
      start: 1
      length: 12
- name: _BMIBL_TC1
  type: int
  derivation:
    str_substr:
      source: _BMIBL_TT1
      start: 13
      length: 6
- name: _BMIBL_TV1
  type: float
  derivation:
    case:
    - when: _BMIBL_TC1 >= 499995
      then: _BMIBL_TK1 + 0.0000000001
    - otherwise: _BMIBL_TK1
- name: _BMIBL_T1
  type: str
  derivation:
    str_decimal:
      source: _BMIBL_TV1
      decimals: 10
- name: _BMIBL_TT2
