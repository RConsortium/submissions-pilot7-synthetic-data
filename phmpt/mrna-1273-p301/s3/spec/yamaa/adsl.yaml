- id: CM_VAC
  dataset: CMA
  key:
  - STUDYID
  - USUBJID
  filter: (str_contains(CMA.CMTRT, 'COVID') OR str_contains(CMA.CMINDC, 'COVID') OR str_contains(CMA.CMTRT, 'CORONAVIRUS')
    OR str_contains(CMA.CMINDC, 'CORONAVIRUS')) AND str_contains(CMA.ATCLEV3T, 'VACCINE')
  derivations:
    _M:
      type: str
      derivation:
        str_extract:
          source: CMA.CMSTDTC
          pattern: ^([0-9]+)/
          group: 1
          no_match: null
    _D:
      type: str
      derivation:
        str_extract:
          source: CMA.CMSTDTC
          pattern: ^[0-9]+/([0-9]+)/
          group: 1
          no_match: null
    _Y:
      type: str
      derivation:
        str_extract:
          source: CMA.CMSTDTC
          pattern: /([0-9]{4})$
          group: 1
          no_match: null
    _M2:
      type: str
      derivation:
        case:
        - when: _M LIKE '_'
          then:
            str_template: 0{_M}
        - otherwise: _M
    _D2:
      type: str
      derivation:
        case:
        - when: _D LIKE '_'
          then:
            str_template: 0{_D}
        - otherwise: _D
    _ISO:
      type: str
      derivation:
        case:
        - when: CMA.CMSTDTC LIKE '%/%/%' AND _Y IS NOT NULL AND _M IS NOT NULL AND _D IS NOT NULL
          then:
            str_template: '{_Y}-{_M2}-{_D2}'
        - otherwise: CMA.CMSTDTC
    _LEN:
      type: int
      derivation:
        str_length:
          source: _ISO
    _DER:
      type: int
      derivation:
        case:
        - when: _ISO IS NULL OR _LEN = 4 OR _LEN = 7
          then: 1
        - otherwise: 0
    _ST1:
      type: str
      derivation:
        case:
        - when: _ISO IS NULL
          then: '''2020-12-11'''
        - when: _LEN = 4
          then:
            str_template: '{_ISO}-01-01'
        - when: _LEN = 7
          then:
            str_template: '{_ISO}-01'
        - otherwise: _ISO
    _ST2:
      type: str
      derivation:
        case:
        - when: _DER = 1 AND _ST1 < '2020-12-11'
          then: '''2020-12-11'''
        - otherwise: _ST1
    _FIN:
      type: str
      derivation:
        str_substr:
          source: _ST2
          start: 1
          length: 10
  order_by:
  - CMA._FIN
  - CMA.CMSEQ
  keep: first
