    - otherwise: _BMIBL_TK3
- name: _BMIBL_T3
  type: str
  derivation:
    str_decimal:
      source: _BMIBL_TV3
      decimals: 8
- name: _BMIBL_TR
  type: str
  derivation:
    case:
    - when: _BMIBL IS NULL
      then: null
    - when: _BMIBL < 10
      then: _BMIBL_T1
    - when: _BMIBL < 100
      then: _BMIBL_T2
    - otherwise: _BMIBL_T3
