# ADSL for Moderna mRNA-1273-P301, cut S3 (BLA 125752 S3, data cutoff
# 2021-03-26, extraction 2021-05-04). Parent:
# ../../../spec/yamaa/base/adam-base-s3.yaml (86 shared + 59 S3-only
# ADSL columns). Derivations port the S3 program a10adsl.sas
# (spec/source/program/adam/...3820304-3820339_..._A_P_a10adsl.txt) on
# its non-DSMB branch (the BLA run): hei_wei, the RT-PCR baseline from MB
# and TR01SDT from DM.RFXSTDTC; the closing DSMB block does not run.
# One row per DM subject, less the program's delete rule (ARMCD
# SCRNFAIL/blank with a SCREEN FAILURE disposition, or ENROLLYN 'N' in
# the latest first-of-group disposition record and no randomization).
#
# Inputs the release lacks or carries in another form:
#   * The S3 CM (a JMP conversion) has no CMSEQ and no CMINDC, so SUPPCM
#     cannot be linked to it. The COVID-19 vaccine records behind
#     EUAVACDT are read from the submitted S3 ADCM instead, which carries
#     every CM record with CMSEQ, CMTRT, CMINDC, CMSTDTC and SUPPCM
#     ATCLEV3T. JMP wrote complete CMSTDTC dates as M/D/YYYY; they are
#     turned back into ISO 8601 before the program's imputation.
#   * RANDIGFL, CCIASFL, PPSIFL and PPSIEREA read the sponsor's files
#     here.ccias_unblinded and here.random_list, which are not in the
#     release; the spec derives them as the program does with those files
#     empty (data/differences.yaml, missing_input).
#   * Macro values: &cutext 26MAR2021 (CUTOFFDT), &g_extract 04MAY2021
#     (EXTDT). &SYSDATE9+1, the program's "no date" sentinel, is written as
#     the open end of each comparison.
#
# Program steps that select "first of a sort group" are lookups ordered
# by the program's sort keys: ds_blinded (first.dsscat) is DS_GF; the
# RANDOMIZED, END OF STUDY and STUDY TREATMENT merges each take the first
# record of their DSSCAT by (DSREFID, DSCAT, EPOCH, DSSEQ). The program's
# date comparisons on ISO text (<=: and the DV date windows) are written
# as date or string comparisons; the S3 dates involved are complete.
# HEIGHTBL and BMIBL are text in the submitted file (the JMP conversion;
# a few are redacted to (b)(6)): HEIGHTBL is the VS VSSTRESN text, and
# BMIBL is written as SAS writes BEST12. (17 significant digits rounded
# half up to 16, then half up to the width).
yamaa: '1.0'
type: spec
model: ADaM
parent: ../../../spec/yamaa/base/adam-base-s3.yaml
domain: ADSL
keys:
- STUDYID
- USUBJID
input:
  DM: <sdtm-dir>/dm.parquet
  SUPPDM: <sdtm-dir>/suppdm.parquet
  DS: <sdtm-dir>/ds.parquet
  SUPPDS: <sdtm-dir>/suppds.parquet
  EX: <sdtm-dir>/ex.parquet
  VS: <sdtm-dir>/vs.parquet
  FACE: <sdtm-dir>/face.parquet
  MH: <sdtm-dir>/mh.parquet
  MB: <sdtm-dir>/mb.parquet
  SUPPMB: <sdtm-dir>/suppmb.parquet
  IS: <sdtm-dir>/is.parquet
  RP: <sdtm-dir>/rp.parquet
  SUPPRP: <sdtm-dir>/supprp.parquet
  SV: <sdtm-dir>/sv.parquet
  DD: <sdtm-dir>/dd.parquet
  AE: <sdtm-dir>/ae.parquet
  CE: <sdtm-dir>/ce.parquet
  SUPPCE: <sdtm-dir>/suppce.parquet
  DV: <sdtm-dir>/dv.parquet
  SUPPDV: <sdtm-dir>/suppdv.parquet
  CMA: <adam-dir>/adcm.parquet
submission:
  label: Subject-Level Analysis Dataset
  class: SUBJECT LEVEL ANALYSIS DATASET
  structure: One record per subject
  repeating: false
rows:
- id: subjects
  dataset: DM
  filter: NOT ((DM.ARMCD IS NULL OR DM.ARMCD = 'SCRNFAIL') AND _SCRN IS NOT NULL) AND NOT (_ENRN = 1 AND RANDNUM
    IS NULL)
intermediates:
- id: SUPPDM_P
  dataset: SUPPDM
  key:
  - STUDYID
  - USUBJID
  filter: SUPPDM.QNAM IN ('COHORT', 'RACE1', 'RACE2', 'RACE3', 'RACE4', 'RACE5', 'RACE6', 'RACE7', 'RACE8', 'RACEOTH',
    'PROTVER', 'PREVSCR', 'UNBLMRNA')
  pivot:
    name: QNAM
    value: QVAL
    fields:
    - COHORT
    - RACE1
    - RACE2
    - RACE3
    - RACE4
    - RACE5
    - RACE6
    - RACE7
    - RACE8
    - RACEOTH
    - PROTVER
    - PREVSCR
    - UNBLMRNA
- id: SUPPDS_P
  dataset: SUPPDS
  key:
    STUDYID: STUDYID
    USUBJID: USUBJID
    IDVARVAL:
      str_decimal:
        source: DSSEQ
        decimals: 0
  filter: SUPPDS.QNAM = 'ENROLLYN' AND SUPPDS.IDVAR = 'DSSEQ'
  pivot:
    name: QNAM
    value: QVAL
    fields:
    - ENROLLYN
- id: DS_IRT
  dataset: SUPPDS
  key:
  - STUDYID
  - USUBJID
  filter: SUPPDS.QNAM = 'IRTVISDT' AND SUPPDS.QVAL IS NOT NULL
  order_by:
  - SUPPDS.QVAL
  keep: first
- id: DS_GF
  dataset: DS
  key:
  - STUDYID
  - USUBJID
  - _GK
  filter: (DS.DSSCAT IS NULL OR DS.DSSCAT <> 'OPEN LABEL') AND NOT (DS.DSTERM = 'RANDOMIZED' AND DS.DSSPID IS NULL
    AND DS.DSSTDTC IS NULL AND DS._ENR IS NULL)
  derivations:
    _ENR:
      type: str
      derivation: SUPPDS_P.ENROLLYN
    _R:
      type: str
      derivation:
        case:
        - when: DS.DSREFID IS NULL
          then: '''~'''
        - otherwise: DS.DSREFID
    _C:
      type: str
      derivation:
        case:
        - when: DS.DSCAT IS NULL
          then: '''~'''
        - otherwise: DS.DSCAT
    _S:
      type: str
      derivation:
        case:
        - when: DS.DSSCAT IS NULL
          then: '''~'''
        - otherwise: DS.DSSCAT
    _GK:
      type: str
      derivation:
        str_template: '{_R}|{_C}|{_S}'
  order_by:
  - DS.EPOCH
  - DS.DSSEQ
  keep: first
- id: ENROL
  dataset: DS
  key:
  - STUDYID
  - USUBJID
  filter: (DS.DSSCAT IS NULL OR DS.DSSCAT <> 'OPEN LABEL') AND NOT (DS.DSTERM = 'RANDOMIZED' AND DS.DSSPID IS NULL
    AND DS.DSSTDTC IS NULL AND DS._ENR IS NULL)
  derivations:
    _ENR:
      type: str
      derivation: SUPPDS_P.ENROLLYN
    _R:
      type: str
      derivation:
        case:
        - when: DS.DSREFID IS NULL
          then: '''~'''
        - otherwise: DS.DSREFID
    _C:
      type: str
      derivation:
        case:
        - when: DS.DSCAT IS NULL
          then: '''~'''
        - otherwise: DS.DSCAT
    _S:
      type: str
      derivation:
        case:
        - when: DS.DSSCAT IS NULL
          then: '''~'''
        - otherwise: DS.DSSCAT
    _GK:
      type: str
      derivation:
        str_template: '{_R}|{_C}|{_S}'
    _GFSEQ:
      type: float
      derivation: DS_GF.DSSEQ
    _ISF:
      type: int
      derivation:
        case:
        - when: _GFSEQ = DS.DSSEQ
          then: 1
        - otherwise: 0
    _ENRN:
      type: int
      derivation:
        case:
        - when: _ENR = 'N'
          then: 1
        - otherwise: 0
  order_by:
  - DS._ISF
  - DS.DSSTDTC
  - DS.DSREFID
  - DS._ENRN
  keep: last
- id: DS_RAND
  dataset: DS
  key:
  - STUDYID
  - USUBJID
  filter: (DS.DSSCAT IS NULL OR DS.DSSCAT <> 'OPEN LABEL') AND NOT (DS.DSTERM = 'RANDOMIZED' AND DS.DSSPID IS NULL
    AND DS.DSSTDTC IS NULL AND DS._ENR IS NULL) AND DS.DSDECOD = 'RANDOMIZED' AND DS.DSSTDTC IS NOT NULL AND DS.DSREFID
    IS NOT NULL
  derivations:
    _ENR:
      type: str
      derivation: SUPPDS_P.ENROLLYN
  order_by:
  - DS.DSREFID
  - DS.DSCAT
  - DS.DSSCAT
  - DS.EPOCH
  - DS.DSSEQ
  keep: first
- id: DS_SCRN
  dataset: DS
  key:
  - STUDYID
  - USUBJID
  filter: (DS.DSSCAT IS NULL OR DS.DSSCAT <> 'OPEN LABEL') AND NOT (DS.DSTERM = 'RANDOMIZED' AND DS.DSSPID IS NULL
    AND DS.DSSTDTC IS NULL AND DS._ENR IS NULL) AND DS.DSSCAT = 'SCREEN FAILURE'
  derivations:
    _ENR:
      type: str
      derivation: SUPPDS_P.ENROLLYN
  order_by:
  - DS.DSREFID
  - DS.DSCAT
  - DS.DSSCAT
  - DS.EPOCH
  - DS.DSSEQ
  keep: first
- id: DS_EOS
  dataset: DS
  key:
  - STUDYID
  - USUBJID
  filter: (DS.DSSCAT IS NULL OR DS.DSSCAT <> 'OPEN LABEL') AND NOT (DS.DSTERM = 'RANDOMIZED' AND DS.DSSPID IS NULL
    AND DS.DSSTDTC IS NULL AND DS._ENR IS NULL) AND DS.DSSCAT = 'END OF STUDY'
  derivations:
    _ENR:
      type: str
      derivation: SUPPDS_P.ENROLLYN
  order_by:
  - DS.DSREFID
  - DS.DSCAT
  - DS.DSSCAT
  - DS.EPOCH
  - DS.DSSEQ
  keep: first
- id: DS_EOT
  dataset: DS
  key:
  - STUDYID
  - USUBJID
  filter: (DS.DSSCAT IS NULL OR DS.DSSCAT <> 'OPEN LABEL') AND NOT (DS.DSTERM = 'RANDOMIZED' AND DS.DSSPID IS NULL
    AND DS.DSSTDTC IS NULL AND DS._ENR IS NULL) AND DS.DSSCAT = 'STUDY TREATMENT'
  derivations:
    _ENR:
      type: str
      derivation: SUPPDS_P.ENROLLYN
  order_by:
  - DS.DSREFID
  - DS.DSCAT
  - DS.DSSCAT
  - DS.EPOCH
  - DS.DSSEQ
  keep: first
- id: DS_BEOT
  dataset: DS
  key:
  - STUDYID
  - USUBJID
  filter: (DS.DSSCAT IS NULL OR DS.DSSCAT <> 'OPEN LABEL') AND NOT (DS.DSTERM = 'RANDOMIZED' AND DS.DSSPID IS NULL
    AND DS.DSSTDTC IS NULL AND DS._ENR IS NULL) AND DS.DSSCAT = 'STUDY TREATMENT' AND DS.EPOCH LIKE '%BLINDED%'
  derivations:
    _ENR:
      type: str
      derivation: SUPPDS_P.ENROLLYN
  order_by:
  - DS.DSREFID
  - DS.DSCAT
  - DS.DSSCAT
  - DS.EPOCH
  - DS.DSSEQ
  keep: first
- id: DS_LEOT
  dataset: DS
  key:
  - STUDYID
  - USUBJID
  filter: (DS.DSSCAT IS NULL OR DS.DSSCAT <> 'OPEN LABEL') AND NOT (DS.DSTERM = 'RANDOMIZED' AND DS.DSSPID IS NULL
    AND DS.DSSTDTC IS NULL AND DS._ENR IS NULL) AND DS.DSSCAT = 'STUDY TREATMENT' AND DS.EPOCH LIKE '%OPEN%'
  derivations:
    _ENR:
      type: str
      derivation: SUPPDS_P.ENROLLYN
  order_by:
  - DS.DSREFID
  - DS.DSCAT
  - DS.DSSCAT
  - DS.EPOCH
  - DS.DSSEQ
  keep: first
- id: DS_OPEN
  dataset: DS
  key:
  - STUDYID
  - USUBJID
  filter: DS.DSSCAT = 'OPEN LABEL' AND DS.DSDECOD = 'INFORMED CONSENT OBTAINED'
  order_by:
  - DS.DSREFID
  - DS.DSCAT
  - DS.DSSCAT
  - DS.EPOCH
  - DS.DSSEQ
  keep: first
- id: DS_UBL
  dataset: DS
  key:
  - STUDYID
  - USUBJID
  filter: DS.DSDECOD = 'TREATMENT UNBLINDED'
  order_by:
  - DS.DSREFID
  - DS.DSCAT
  - DS.DSSCAT
  - DS.EPOCH
  - DS.DSSEQ
  keep: first
- id: EX_FIRST
  dataset: EX
  key:
  - STUDYID
  - USUBJID
  filter: EX._EXST IS NOT NULL AND NOT str_contains(EX._EXST, '-----') AND (EX.VISIT IS NULL OR NOT str_contains(EX.VISIT,
    'Uns'))
  derivations:
    _EXST:
      type: str
      derivation:
        first_available:
          sources:
          - EX.EXSTDTC
          - EX.EXENDTC
    _EXMAX:
      type: str
      derivation:
        case:
        - when: EX.EXSTDTC IS NOT NULL AND (EX.EXENDTC IS NULL OR EX.EXSTDTC > EX.EXENDTC)
          then: EX.EXSTDTC
        - otherwise: EX.EXENDTC
    _UP:
      type: str
      derivation:
        str_case:
          source: EX.EXTRT
          to: upper
    _TRTN:
      type: str
      derivation:
        case:
        - when: _UP = 'PLACEBO'
          then: '''Placebo'''
        - when: _UP = 'MRNA-1273'
          then: '''mRNA-1273'''
        - otherwise: EX.EXTRT
  order_by:
  - EX._EXST
  - EX._EXMAX
  - EX.VISITNUM
  keep: first
- id: EX_D1
  dataset: EX
  key:
  - STUDYID
  - USUBJID
  filter: EX._EXST IS NOT NULL AND NOT str_contains(EX._EXST, '-----') AND (EX.VISIT IS NULL OR NOT str_contains(EX.VISIT,
    'Uns')) AND EX.VISITNUM = 2
  derivations:
    _EXST:
      type: str
      derivation:
        first_available:
          sources:
          - EX.EXSTDTC
          - EX.EXENDTC
    _EXMAX:
      type: str
      derivation:
        case:
        - when: EX.EXSTDTC IS NOT NULL AND (EX.EXENDTC IS NULL OR EX.EXSTDTC > EX.EXENDTC)
          then: EX.EXSTDTC
        - otherwise: EX.EXENDTC
    _UP:
      type: str
      derivation:
        str_case:
          source: EX.EXTRT
          to: upper
    _TRTN:
      type: str
      derivation:
        case:
        - when: _UP = 'PLACEBO'
          then: '''Placebo'''
        - when: _UP = 'MRNA-1273'
          then: '''mRNA-1273'''
        - otherwise: EX.EXTRT
  order_by:
  - EX._EXST
  - EX._EXMAX
  - EX.VISITNUM
  keep: last
- id: EX_D2
  dataset: EX
  key:
  - STUDYID
  - USUBJID
  filter: EX._EXST IS NOT NULL AND NOT str_contains(EX._EXST, '-----') AND (EX.VISIT IS NULL OR NOT str_contains(EX.VISIT,
    'Uns')) AND EX.VISITNUM = 6
  derivations:
    _EXST:
      type: str
      derivation:
        first_available:
          sources:
          - EX.EXSTDTC
          - EX.EXENDTC
    _EXMAX:
      type: str
      derivation:
        case:
        - when: EX.EXSTDTC IS NOT NULL AND (EX.EXENDTC IS NULL OR EX.EXSTDTC > EX.EXENDTC)
          then: EX.EXSTDTC
        - otherwise: EX.EXENDTC
    _UP:
      type: str
      derivation:
        str_case:
          source: EX.EXTRT
          to: upper
    _TRTN:
      type: str
      derivation:
        case:
        - when: _UP = 'PLACEBO'
          then: '''Placebo'''
        - when: _UP = 'MRNA-1273'
          then: '''mRNA-1273'''
        - otherwise: EX.EXTRT
  order_by:
  - EX._EXST
  - EX._EXMAX
  - EX.VISITNUM
  keep: last
- id: EX_O1
  dataset: EX
  key:
  - STUDYID
  - USUBJID
  filter: EX._EXST IS NOT NULL AND NOT str_contains(EX._EXST, '-----') AND (EX.VISIT IS NULL OR NOT str_contains(EX.VISIT,
    'Uns')) AND EX.VISITNUM = 36
  derivations:
    _EXST:
      type: str
      derivation:
        first_available:
          sources:
          - EX.EXSTDTC
          - EX.EXENDTC
    _EXMAX:
      type: str
      derivation:
        case:
        - when: EX.EXSTDTC IS NOT NULL AND (EX.EXENDTC IS NULL OR EX.EXSTDTC > EX.EXENDTC)
          then: EX.EXSTDTC
        - otherwise: EX.EXENDTC
    _UP:
      type: str
      derivation:
        str_case:
          source: EX.EXTRT
          to: upper
    _TRTN:
      type: str
      derivation:
        case:
        - when: _UP = 'PLACEBO'
          then: '''Placebo'''
        - when: _UP = 'MRNA-1273'
          then: '''mRNA-1273'''
        - otherwise: EX.EXTRT
  order_by:
  - EX._EXST
  - EX._EXMAX
  - EX.VISITNUM
  keep: first
- id: EX_O2
  dataset: EX
  key:
  - STUDYID
  - USUBJID
  filter: EX._EXST IS NOT NULL AND NOT str_contains(EX._EXST, '-----') AND (EX.VISIT IS NULL OR NOT str_contains(EX.VISIT,
    'Uns')) AND EX.VISITNUM = 38
  derivations:
    _EXST:
      type: str
      derivation:
        first_available:
          sources:
          - EX.EXSTDTC
          - EX.EXENDTC
    _EXMAX:
      type: str
      derivation:
        case:
        - when: EX.EXSTDTC IS NOT NULL AND (EX.EXENDTC IS NULL OR EX.EXSTDTC > EX.EXENDTC)
          then: EX.EXSTDTC
        - otherwise: EX.EXENDTC
    _UP:
      type: str
      derivation:
        str_case:
          source: EX.EXTRT
          to: upper
    _TRTN:
      type: str
      derivation:
        case:
        - when: _UP = 'PLACEBO'
          then: '''Placebo'''
        - when: _UP = 'MRNA-1273'
          then: '''mRNA-1273'''
        - otherwise: EX.EXTRT
  order_by:
  - EX._EXST
  - EX._EXMAX
  - EX.VISITNUM
  keep: first
- id: VS_SAR1
  dataset: VS
  key:
  - STUDYID
  - USUBJID
  filter: VS.VSCAT = 'REACTOGENICITY' AND VS.VSTESTCD = 'TEMP' AND VS.VSORRES IS NOT NULL AND VS.VSDTC IS NOT NULL
    AND str_contains(VS._TPR, 'DOSE1')
  derivations:
    _TPR:
      type: str
      derivation:
        str_replace:
          source: VS.VSTPTREF
          pattern: ' '
          replacement: ''
  order_by:
  - VS.VSDTC
  keep: last
- id: VS_SAR2
  dataset: VS
  key:
  - STUDYID
  - USUBJID
  filter: VS.VSCAT = 'REACTOGENICITY' AND VS.VSTESTCD = 'TEMP' AND VS.VSORRES IS NOT NULL AND VS.VSDTC IS NOT NULL
    AND str_contains(VS._TPR, 'DOSE2')
  derivations:
    _TPR:
      type: str
      derivation:
        str_replace:
          source: VS.VSTPTREF
          pattern: ' '
          replacement: ''
  order_by:
  - VS.VSDTC
  keep: last
- id: HW_HEIGHT
  dataset: VS
  key:
  - STUDYID
  - USUBJID
  filter: VS.VSTESTCD = 'HEIGHT' AND VS.VSSTRESC IS NOT NULL AND VS.VSORRES IS NOT NULL AND VS.VSDTC IS NOT NULL
    AND NOT (VS.VSDTC = DM.RFXSTDTC AND VS._POST = 1) AND ((VS._HT = 1 AND DM.RFXSTDTC LIKE '%T%' AND VS.VSDTC <=
    DM.RFXSTDTC) OR ((VS._HT = 0 OR NOT DM.RFXSTDTC LIKE '%T%') AND DM.RFXSTDTC IS NOT NULL AND VS.VSDTC <= DM.RFXSTDTC
    AND VS._POST = 0))
  derivations:
    _POST:
      type: int
      derivation:
        case:
        - when: VS.VSTPT IS NOT NULL AND str_contains(VS.VSTPT, 'POST')
          then: 1
        - otherwise: 0
    _HT:
      type: int
      derivation:
        case:
        - when: VS.VSDTC LIKE '%T%'
          then: 1
        - otherwise: 0
  order_by:
  - VS.VSDTC
  - VS.VISITNUM
  - variable: VS.VSSEQ
    direction: desc
  keep: last
- id: HW_WEIGHT
  dataset: VS
  key:
  - STUDYID
  - USUBJID
  filter: VS.VSTESTCD = 'WEIGHT' AND VS.VSSTRESC IS NOT NULL AND VS.VSORRES IS NOT NULL AND VS.VSDTC IS NOT NULL
    AND NOT (VS.VSDTC = DM.RFXSTDTC AND VS._POST = 1) AND ((VS._HT = 1 AND DM.RFXSTDTC LIKE '%T%' AND VS.VSDTC <=
    DM.RFXSTDTC) OR ((VS._HT = 0 OR NOT DM.RFXSTDTC LIKE '%T%') AND DM.RFXSTDTC IS NOT NULL AND VS.VSDTC <= DM.RFXSTDTC
    AND VS._POST = 0))
  derivations:
    _POST:
      type: int
      derivation:
        case:
        - when: VS.VSTPT IS NOT NULL AND str_contains(VS.VSTPT, 'POST')
          then: 1
        - otherwise: 0
    _HT:
      type: int
      derivation:
        case:
        - when: VS.VSDTC LIKE '%T%'
          then: 1
        - otherwise: 0
  order_by:
  - VS.VSDTC
  - VS.VISITNUM
  - variable: VS.VSSEQ
    direction: desc
  keep: last
- id: FACE_SAR1
  dataset: FACE
  key:
  - STUDYID
  - USUBJID
  filter: FACE.FASTAT IS NULL AND FACE.FASTRESC IS NOT NULL AND FACE.FATPTREF = 'DOSE 1'
  order_by:
  - FACE.FASEQ
  keep: last
- id: FACE_SAR2
  dataset: FACE
  key:
  - STUDYID
  - USUBJID
  filter: FACE.FASTAT IS NULL AND FACE.FASTRESC IS NOT NULL AND FACE.FATPTREF = 'DOSE 2'
  order_by:
