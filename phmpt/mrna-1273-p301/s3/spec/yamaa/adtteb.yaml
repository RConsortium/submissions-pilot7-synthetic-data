# ADTTEB for Moderna mRNA-1273-P301, cut S3 (BLA Interim Analysis,
# cutoff 2021-03-26). Parent: ../../../spec/yamaa/base/adam-base-s3.yaml (which
# chains to ../../../spec/yamaa/base/adam-base.yaml; 86 shared + 59 S3-only ADSL
# columns). There is NO SAS program for ADTTEB anywhere in the
# set; derivations implement the S3 ADaM define.xml MethodDefs
# plus the Additional ADaM Variable Definition Doc
# (spec/source/125752_S3_M5_mrna-1273-p301_A_D_adam-variable-definition.pdf,
# Bates 3820153-3820156, sections ADTTEB.ADT / ADTTEB.CNSR /
# ADTTEB.EVNTDESC), cross-checked against the submitted data and
# the sibling A50ADTTE / A50ADTT programs: one row per FAS subject
# per PARAMCD (10 PARAMCDs: TASYCRB1-5, TTINFB1-5), from the
# submitted ADTTE (sibling rows), the submitted ADEFF (first
# COVIDS/COVIDSDS event), the submitted ADIS (CRIT5FL at the
# Participant Decision Visit), first positive MB RT-PCR at that
# visit, and the verified ADSL. SAP note (closed 2026-11-24,
# no-impact): the file labelled "SAP v3" (19745_S68_M5_sap-v3.pdf)
# is the P201 SAP v3.0 (27 Oct 2020), not a P301 SAP version; the
# only P301 SAP in the set is v1.0 (10 Sep 2020). The case
# definitions below are the vardef doc's own, so the spec follows
# the vardef doc, not a SAP version. S27 duplicates: none
# of the inputs (ADTTE, ADEFF, ADIS, MB, ADSL) is among the eight
# S27 duplicate SDTM files, and no program/define evidence shows
# an S27 file was read. KEYS: like ADTTE/ADTTEA, ADTTEB HAS a
# usable key: (STUDYID, USUBJID, PARAMCD) is unique and
# non-missing on the submitted target, and there is no ASEQ column.
# MethodDef ambiguities, flagged (see the generator header for the
# evidence): (A) vardef ADT step 1 names TTASYCR5/TTINF5 while the
# CNSR/EVNTDESC steps name TTASYCRX/TTINFX (X=1..5) -- implemented
# sibling-X (the data cannot distinguish the two readings for ADT);
# (B) vardef ADT step 1 reads (CNSR=0 or CNSR=2) only, but early
# siblings (CNSR=1, Early desc) also supply ADT -- implemented the
# CNSR-section condition; (C) prior COVID-19 symptoms is undefined
# in the vardef -- implemented as first COVIDS/COVIDSDS ADEFF event
# on/before the PDV date; (D) no else branch is stated for the X=5
# threshold -- implemented the Early else (never fires). Honest
# gaps: none. A pandas prototype reproduces the submitted target
# exactly on all 102 columns (0 mismatches), and the yamaa spec is
# expected to verify EXACT MATCH the same way. The full verify.py run
# OOMs in this 6 GB cell (killed ~29 s in, session 16), so the spec was
# verified via 2 pruned dependency-closure groups (session 16) and then
# by split-by-subject full-spec verification (session 55): the UNCHANGED
# spec run via verify.py in 4 SEX x AGE (<=55/>55) partitions, inputs
# pruned to the spec read set as in session 16 -- EXACT MATCH strict,
# 303,460x102, 0 mismatches, identical to the pruned-group baseline on
# all 99 non-key columns; no roomier-cell re-run is owed
# (see adtteb/verify_report_s3_split.json, original work tree).
yamaa: '1.0'
type: spec
model: ADaM
parent: ../../../spec/yamaa/base/adam-base-s3.yaml
domain: ADTTEB
keys:
- STUDYID
- USUBJID
- PARAMCD
input:
  MB: <sdtm-dir>/mb.parquet
  ADTTE:
    path: <adam-dir>/adtte.parquet
    key:
    - STUDYID
    - USUBJID
  ADEFF:
    path: <adam-dir>/adeff.parquet
    key:
    - STUDYID
    - USUBJID
  ADIS:
    path: <adam-dir>/adis.parquet
    key:
    - STUDYID
    - USUBJID
  ADSL:
    path: <adam-dir>/adsl.parquet
    key:
    - STUDYID
    - USUBJID
submission:
  label: Time to Event up to PDV Analysis Dataset
  class: BASIC DATA STRUCTURE
  structure: One record per subject per parameter
  repeating: true
rows:
- id: tasycrb1_rows
  dataset: ADSL
  derivations:
    STUDYID: ADSL.STUDYID
    USUBJID: ADSL.USUBJID
    PARAMCD: '''TASYCRB1'''
    _SIB_ADT: SIB_TTASYCR_1._ADT
    _SIB_CNSR: SIB_TTASYCR_1._CNSR
    _SIB_DESC: SIB_TTASYCR_1._DESC
    _PDV_DT:
      least: {sources: [PDV_MB._DT, PDV_ADIS._DT]}
    _PDV_EPOCH:
      to_epoch_day:
        source: _PDV_DT
    _COVID_DT: COVID_1._ADT
    _COVID_EPOCH:
      to_epoch_day:
        source: _COVID_DT
    _DOSE2_EPOCH:
      to_epoch_day:
        source: ADSL.DOSE2DT
    _TR01_EPOCH:
      to_epoch_day:
        source: ADSL.TR01SDT
    _RAND_EPOCH:
      to_epoch_day:
        source: ADSL.RANDDT
    _DTHDT_EPOCH:
      to_epoch_day:
        source: ADSL.DTHDT
    _EOSDT_EPOCH:
      to_epoch_day:
        source: ADSL.EOSDT
    _EFFCODT_EPOCH:
      to_epoch_day:
        source: ADSL.EFFCODT
    _MIND_EPOCH:
      least: {sources: [_DTHDT_EPOCH, _EOSDT_EPOCH, _EFFCODT_EPOCH]}
    _CENS4:
      least: {sources: [ADSL.DTHDT, ADSL.EOSDT, ADSL.EFFCODT, ADSL.AP02SDT]}
    _STEP1:
      case:
      - when: (_SIB_CNSR = 0 OR (_SIB_CNSR <> 0 AND _SIB_DESC IN ('Early Asymptomatic SARS-CoV-2 Infection', 'COVID-19 or Second Definition of COVID-19')))
        then: 1
      - otherwise: 0
    _INWIN:
      case:
      - when: _PDV_DT IS NOT NULL AND _PDV_EPOCH <= _MIND_EPOCH
        then: 1
      - otherwise: 0
    _PRIOR:
      case:
      - when: _INWIN = 1 AND _COVID_DT IS NOT NULL AND _COVID_EPOCH <= _PDV_EPOCH
        then: 1
      - otherwise: 0
    _ATPDV:
      case:
      - when: _PDV_EPOCH >= _DOSE2_EPOCH + 14
        then: 1
      - otherwise: 0
    _ADT_RAW:
      case:
      - when: _STEP1 = 1
        then: _SIB_ADT
      - when: _INWIN = 1 AND _PRIOR = 0
        then: _PDV_DT
      - when: _INWIN = 1 AND _PRIOR = 1
        then: _COVID_DT
      - otherwise: _CENS4
    _CNSR_RAW:
      case:
      - when: _STEP1 = 1
        then: _SIB_CNSR
      - when: _INWIN = 1 AND _PRIOR = 0 AND _ATPDV = 1
        then: 0
      - when: _INWIN = 1 AND _PRIOR = 0 AND _ATPDV = 0
        then: 1
      - when: _INWIN = 1 AND _PRIOR = 1
        then: 2
      - otherwise: _SIB_CNSR
    _EVNTDESC_RAW:
      case:
      - when: _STEP1 = 1 AND _SIB_CNSR = 0
        then: '''Asymptomatic SARS-CoV-2 Infection in Blinded Phase'''
      - when: _STEP1 = 1
        then: _SIB_DESC
      - when: _INWIN = 1 AND _PRIOR = 0 AND _ATPDV = 1
        then: '''Asymptomatic SARS-CoV-2 Infection at PDV'''
      - when: _INWIN = 1 AND _PRIOR = 0 AND _ATPDV = 0
        then: '''Early Asymptomatic SARS-CoV-2 Infection'''
      - when: _INWIN = 1 AND _PRIOR = 1
        then: '''COVID-19 or Second Definition of COVID-19'''
      - otherwise: _SIB_DESC
  filter: ADSL.FASFL = 'Y'
