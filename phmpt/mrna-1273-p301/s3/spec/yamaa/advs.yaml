    - when: DOSE1FL = 'Y' AND DOSE2FL = 'Y' AND APERIOD = 1 AND ADT IS NOT NULL AND _SV7 IS NOT NULL AND ADT > _SV7
      then: '''Follow up stage'''
    - when: DOSE1FL = 'Y' AND DOSE2FL = 'Y' AND APERIOD = 1 AND _M7 > DATE '2021-07-28' AND (((_VSTPT IS NOT NULL AND str_contains(_VSTPT, 'POST')) OR (_ORI_ADTM IS NOT NULL AND TR01SDTM IS NOT NULL AND _ORI_ADTM > TR01SDTM) OR ((_ORI_ADTM IS NULL OR TR01SDTM IS NULL) AND ADT IS NOT NULL AND TR01SDT IS NOT NULL AND ADT > TR01SDT)) AND NOT (_ORI_ADTM IS NOT NULL AND TR01SDTM IS NOT NULL AND _ORI_ADTM < TR01SDTM))
      then: '''2Vaccination stage'''
    - when: DOSE1FL = 'Y' AND NOT (DOSE2FL = 'Y') AND APERIOD = 1 AND ((TR01SDTM IS NOT NULL AND _ORI_ADTM IS NOT NULL AND TR01SDTM <= _ORI_ADTM) OR (TR01SDT IS NOT NULL AND ADT IS NOT NULL AND TR01SDT <= ADT AND (TR01SDTM IS NULL OR _ORI_ADTM IS NULL))) AND ADT IS NOT NULL AND ADT <= _M4 AND _M4 < DATE '2021-07-28'
      then: '''3Vaccination stage'''
    - when: DOSE1FL = 'Y' AND NOT (DOSE2FL = 'Y') AND APERIOD = 1 AND ADT IS NOT NULL AND _SV4 IS NOT NULL AND ADT > _SV4
      then: '''Follow up stage'''
    - when: DOSE1FL = 'Y' AND NOT (DOSE2FL = 'Y') AND APERIOD = 1 AND _M4 > DATE '2021-07-28' AND (((_VSTPT IS NOT NULL AND str_contains(_VSTPT, 'POST')) OR (_ORI_ADTM IS NOT NULL AND TR01SDTM IS NOT NULL AND _ORI_ADTM > TR01SDTM) OR ((_ORI_ADTM IS NULL OR TR01SDTM IS NULL) AND ADT IS NOT NULL AND TR01SDT IS NOT NULL AND ADT > TR01SDT)) AND NOT (_ORI_ADTM IS NOT NULL AND TR01SDTM IS NOT NULL AND _ORI_ADTM < TR01SDTM))
      then: '''4Vaccination stage'''
    - when: OLDOS1FL = 'Y' AND OLDOS2FL = 'Y' AND APERIOD = 2 AND ((TR02SDTM IS NOT NULL AND _ORI_ADTM IS NOT NULL AND TR02SDTM <= _ORI_ADTM) OR (TR02SDT IS NOT NULL AND ADT IS NOT NULL AND TR02SDT <= ADT AND (TR02SDTM IS NULL OR _ORI_ADTM IS NULL))) AND ADT IS NOT NULL AND ADT <= _M57 AND _M57 < DATE '2021-07-28'
      then: '''5Vaccination stage'''
    - when: OLDOS1FL = 'Y' AND OLDOS2FL = 'Y' AND APERIOD = 2 AND ADT IS NOT NULL AND _SV57 IS NOT NULL AND ADT > _SV57
      then: '''Follow up stage'''
    - when: OLDOS1FL = 'Y' AND OLDOS2FL = 'Y' AND APERIOD = 2 AND _M57 > DATE '2021-07-28' AND (((_VSTPT IS NOT NULL AND str_contains(_VSTPT, 'POST')) OR (_ORI_ADTM IS NOT NULL AND TR02SDTM IS NOT NULL AND _ORI_ADTM > TR02SDTM) OR ((_ORI_ADTM IS NULL OR TR02SDTM IS NULL) AND ADT IS NOT NULL AND TR02SDT IS NOT NULL AND ADT > TR02SDT)) AND NOT (_ORI_ADTM IS NOT NULL AND TR02SDTM IS NOT NULL AND _ORI_ADTM < TR02SDTM))
      then: '''6Vaccination stage'''
    - when: OLDOS1FL = 'Y' AND NOT (OLDOS2FL = 'Y') AND APERIOD = 2 AND ((TR02SDTM IS NOT NULL AND _ORI_ADTM IS NOT NULL AND TR02SDTM <= _ORI_ADTM) OR (TR02SDT IS NOT NULL AND ADT IS NOT NULL AND TR02SDT <= ADT AND (TR02SDTM IS NULL OR _ORI_ADTM IS NULL))) AND ADT IS NOT NULL AND ADT <= _M29 AND _M29 < DATE '2021-07-28'
      then: '''7Vaccination stage'''
    - when: OLDOS1FL = 'Y' AND NOT (OLDOS2FL = 'Y') AND APERIOD = 2 AND ADT IS NOT NULL AND _SV29 IS NOT NULL AND ADT > _SV29
      then: '''Follow up stage'''
    - when: OLDOS1FL = 'Y' AND NOT (OLDOS2FL = 'Y') AND APERIOD = 2 AND _M29 > DATE '2021-07-28' AND (((_VSTPT IS NOT NULL AND str_contains(_VSTPT, 'POST')) OR (_ORI_ADTM IS NOT NULL AND TR02SDTM IS NOT NULL AND _ORI_ADTM > TR02SDTM) OR ((_ORI_ADTM IS NULL OR TR02SDTM IS NULL) AND ADT IS NOT NULL AND TR02SDT IS NOT NULL AND ADT > TR02SDT)) AND NOT (_ORI_ADTM IS NOT NULL AND TR02SDTM IS NOT NULL AND _ORI_ADTM < TR02SDTM))
      then: '''8Vaccination stage'''
    - otherwise: "''"
