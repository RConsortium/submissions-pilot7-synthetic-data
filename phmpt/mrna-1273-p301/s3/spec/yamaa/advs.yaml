# ADVS for Moderna mRNA-1273-P301, cut S3 (BLA Interim Analysis,
# cutoff 2021-03-26). Parent: ../../../spec/yamaa/base/adam-base-s3.yaml (which
# chains to ../../../spec/yamaa/base/adam-base.yaml; 86 shared + 59 S3-only ADSL
# columns). Derivations implement the S3 A20ADVS program: VS rows
# (VSSTAT missing, VSCAT not REACTOGENICITY/EFFICACY) inner-joined
# to the verified ADSL on USUBJID, with the %ablfl visit windowing
# (sort-1/2, pre_, sort-4/5, ANL01FL, atoxgr), the %xxdoserf
# 4-dose chain, %trta with _DOSE = MDOSREF, and the ASTAGE stage
# derivation (SYSDATE 2021-07-28). Where the SAS code and the
# define.xml method text disagree, the code is followed (see the
# generator header). Honest gap: 7 rows graded 4 in the submitted
# data only via the external import.vsgrade4 file (see the
# generator header); ATOXGRH/ATOXGRHN differ on 7 cells and
# SHIFT2 on 7 cells.
# Split verification (session 53, 2026-11-23): full-spec run reproduced
# the pruned-group baseline EXACTLY (1,200,159x139, same 21 gap cells,
# 0 within-tolerance, 0 space-only, zero new mismatches) via
# spec-s3-join-aid.yaml in 5 subject partitions (see
# advs/verify_report_s3_split.json). The literal unchanged spec cannot
# run: the engine refuses this file at OUTPUT-3 (9-column key missing
# / duplicate); the join-aid variant differs only in keys, the
# appended VSSEQ output column, the VSSEQ def, and VSDTC/VISITNUM
# mandatory true->false. The "re-run owed" is discharged by the split
# run; no roomier-cell re-run is needed.
yamaa: '1.0'
type: spec
model: ADaM
parent: ../../../spec/yamaa/base/adam-base-s3.yaml
domain: ADVS
# Keys: the submitted ADVS has no unique key (VSDTC and VISITNUM are empty
# on some rows, and the natural key repeats), which OUTPUT-3 refuses. As in
# ADEFF, the spec derives the row identity ASEQ (row number within subject,
# by VS sequence); verify.py sets it aside and compares rows as a multiset,
# pairing unmatched rows by subject.
keys:
- STUDYID
- USUBJID
- ASEQ
- ANL03FL
input:
  VS: <sdtm-dir>/vs.parquet
  SUPPVS: <sdtm-dir>/suppvs.parquet
  EX: <sdtm-dir>/ex.parquet
  SV: <sdtm-dir>/sv.parquet
  ADSL:
    path: <adam-dir>/adsl.parquet
    key:
    - STUDYID
    - USUBJID
submission:
  label: Vital Signs Analysis Dataset
  class: BASIC DATA STRUCTURE
  structure: One or more records per subject per analysis parameter per analysis timepoint
  repeating: true
rows:
- id: vs_rows
  dataset: VS
  derivations:
    STUDYID: VS.STUDYID
    USUBJID: VS.USUBJID
    SUBJID: VS.SUBJID
    _VSSEQ: VS.VSSEQ
    _VSSTAT: VS.VSSTAT
    _VSTESTCD: VS.VSTESTCD
    _VSTEST: VS.VSTEST
    _UNIT:
      mapping:
        source: _VSTESTCD
        dict:
          BMI: 'kg/m2'
          DIABP: 'mmHg'
          HEIGHT: 'cm'
          PULSE: 'beats/min'
          RESP: 'breaths/min'
          SYSBP: 'mmHg'
          TEMP: 'C'
          WEIGHT: 'kg'
        unmapped: null
    _VSCAT: VS.VSCAT
    _VSSTRESC: VS.VSSTRESC
    _VSSTRESN: VS.VSSTRESN
    _VSSTRESU: VS.VSSTRESU
    _VSDTC: VS.VSDTC
    _VISITNUM: VS.VISITNUM
    _VSLOC: VS.VSLOC
    _VSTPT: VS.VSTPT
    _VSTPTNUM: VS.VSTPTNUM
    _ORI_VISIT: VS.VISIT
    _VISIT:
      case:
      - when: str_contains(_ORI_VISIT, '^Illness Visit Day 3 - Day 21')
        then: '''Illness Visit Day 3 Unscheduled 1'''
      - otherwise: _ORI_VISIT
    # VSSTRESN is text in the released VS; parse it, a non-number (such as
    # (b)(6)) giving a missing value (COLUMN-13). This replaces a dictionary
    # that listed every observed value (issue #6).
    _AVALN_NUM:
      value: VS.VSSTRESN
      unconvertible: null
    PARAMCD: VS.VSTESTCD
    PARAM:
      str_template:
        template: '{_VSTEST} ({_UNIT})'
        missing: ''
    AVAL: VS.VSSTRESN
    VSSTRESC: VS.VSSTRESC
    VSLOC: VS.VSLOC
    VSLOCSP: SUPP_P.VSLOCSP
  filter: (_VSSTAT IS NULL OR _VSSTAT IN ('')) AND (_VSCAT IS NULL OR _VSCAT IN ('') OR _VSCAT NOT IN ('REACTOGENICITY', 'EFFICACY')) AND _ADSL IS NOT NULL
intermediates:
- id: SUPP_P
  dataset: SUPPVS
  key:
    STUDYID: STUDYID
    USUBJID: USUBJID
    IDVARVAL:
      str_decimal:
        source: _VSSEQ
        decimals: 0
  filter: SUPPVS.QNAM = 'VSLOCSP' AND SUPPVS.IDVAR = 'VSSEQ'
  pivot:
    name: QNAM
    value: QVAL
    fields:
    - VSLOCSP
- id: SV_V29
  dataset: SV
  key: [STUDYID, USUBJID]
  filter: SV.VISITNUM = 6 AND SV.SVSTDTC IS NOT NULL AND SV.SVSTDTC NOT IN ('')
  order_by: [SV.SVSTDTC]
  keep: first
- id: SV_V57
  dataset: SV
  key: [STUDYID, USUBJID]
  filter: SV.VISITNUM = 10 AND SV.SVSTDTC IS NOT NULL AND SV.SVSTDTC NOT IN ('')
  order_by: [SV.SVSTDTC]
  keep: first
- id: SV_OL29
  dataset: SV
  key: [STUDYID, USUBJID]
  filter: SV.VISITNUM = 38 AND SV.SVSTDTC IS NOT NULL AND SV.SVSTDTC NOT IN ('')
  order_by: [SV.SVSTDTC]
  keep: first
- id: SV_OL57
  dataset: SV
  key: [STUDYID, USUBJID]
  filter: SV.VISITNUM = 40 AND SV.SVSTDTC IS NOT NULL AND SV.SVSTDTC NOT IN ('')
  order_by: [SV.SVSTDTC]
  keep: first
- id: EX_DOSE1
  dataset: EX
  key: [STUDYID, USUBJID]
  filter: EX.EXSTDTC IS NOT NULL AND str_contains(EX.VISIT, '[Dd][Aa][Yy] 1( |$)')
  order_by: [EX.EXSTDTC]
  keep: first
- id: EX_DOSE2
  dataset: EX
  key: [STUDYID, USUBJID]
  filter: EX.EXSTDTC IS NOT NULL AND str_contains(EX.VISIT, '[Dd][Aa][Yy] 29')
  order_by: [EX.EXSTDTC]
  keep: first
- id: EX_DOSE3
  dataset: EX
  key: [STUDYID, USUBJID]
  filter: EX.EXSTDTC IS NOT NULL AND str_contains(EX.VISIT, '[Oo][Ll]-[Dd]1')
  order_by: [EX.EXSTDTC]
  keep: first
- id: EX_DOSE4
  dataset: EX
  key: [STUDYID, USUBJID]
  filter: EX.EXSTDTC IS NOT NULL AND str_contains(EX.VISIT, '[Oo][Ll]-[Dd]29')
  order_by: [EX.EXSTDTC]
  keep: first
windows:
  SORT1_W:
    group_by: [STUDYID, USUBJID, PARAMCD]
    order_by:
    - variable: _AVALN
      direction: desc
    - _POSTFL
    - variable: _PREFL_ADT
      direction: desc
    - variable: _PREFL_ADTM
      direction: desc
    - variable: _ILLUNS
      direction: desc
    - VISITNUM
  SORT2_W:
    group_by: [STUDYID, USUBJID, PARAMCD]
    order_by:
    - variable: _AVALN
      direction: desc
    - _POSTFL
    - variable: _PREFL_ADT
      direction: desc
    - variable: _PREFL_ADTM
      direction: desc
    - ADT
    - _ADDSORTN
    - _ILLUNS
    - _ADTMY
    - _ISSTRESN_
    - variable: VSTPT
      direction: desc
    - _ADTMY_NUM
    - variable: _VSTPTNUM
      direction: desc
    - variable: VISITNUM
      direction: desc
    - variable: _VSSEQ
      direction: desc
  BASELINE_W:
    group_by: [STUDYID, USUBJID, PARAMCD]
    order_by:
    - ADT
    - _ADTM
    - variable: _ADDSORTN
      direction: desc
    - variable: _ILLUNS
      direction: desc
    - variable: _ADTMY
      direction: desc
    - variable: _ISSTRESN_
      direction: desc
    - VSTPT
    - variable: _ADTMY_NUM
      direction: desc
    - _VSTPTNUM
    - VISITNUM
    - _VSSEQ
  FIRST_ADT_W:
    group_by: [STUDYID, USUBJID, PARAMCD, _AVALN, _POSTFL, _PREFL_ADT, _PREFL_ADTM, ADT]
    order_by:
    - _ADDSORTN
    - _ILLUNS
    - _ADTMY
    - _ISSTRESN_
    - variable: VSTPT
      direction: desc
    - _ADTMY_NUM
    - variable: _VSTPTNUM
      direction: desc
    - variable: VISITNUM
      direction: desc
    - variable: _VSSEQ
      direction: desc
  SORT4_W:
    group_by: [STUDYID, USUBJID, PARAMCD]
    order_by:
    - variable: _AVALN
      direction: desc
    - _POSTFL2
    - ADT
    - variable: _ILL_ADY
      direction: desc
  SORT5_W:
    group_by: [STUDYID, USUBJID, PARAMCD]
    order_by:
    - _AVISITN_P4
    - ADY
    - _UNS
  ANL01_W:
    group_by: [STUDYID, USUBJID, PARAMCD, _AVISITN_F, _ATPTN_F]
    order_by:
    - variable: _POSTFL2
      direction: desc
    - variable: _AVALN2
      direction: desc
    - _UNS
    - _AWTDIFF_P2
    - variable: ADT
      direction: desc
    - variable: _VSSEQ
      direction: desc
  ANL02_W:
    group_by: [STUDYID, USUBJID, PARAMCD, _AVISITN_F, _ATPTN_F]
    order_by:
    - variable: _POSTFL2
      direction: desc
    - variable: _ATOXGRLN
      direction: desc
    - ADT
    - _VSSEQ
  ANL03_W:
    group_by: [STUDYID, USUBJID, PARAMCD, _AVISITN_F, _ATPTN_F]
    order_by:
    - variable: _POSTFL2
      direction: desc
    - variable: _ATOXGRHN
      direction: desc
    - ADT
    - _VSSEQ
columns:
- name: _ADSL
  type: str
  derivation: ADSL.USUBJID
- name: STUDYID
  submission:
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: USUBJID
  submission:
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: SUBJID
  submission:
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: _VSSEQ
  type: float
- name: _VSSTAT
  type: str
- name: _VSTESTCD
  type: str
- name: _VSTEST
  type: str
- name: _UNIT
  type: str
- name: _VSCAT
  type: str
- name: _VSSTRESC
  type: str
- name: _VSSTRESN
  type: str
- name: _VSSTRESU
  type: str
- name: _VSDTC
  type: str
- name: _VISITNUM
  type: float
- name: _VSLOC
  type: str
- name: _VSTPT
  type: str
- name: _VSTPTNUM
  type: float
- name: _ORI_VISIT
  type: str
- name: _VISIT
  type: str
- name: _AVALN_NUM
  type: float
- name: _ADT_TXT
  type: str
  derivation: ADT
- name: _ORI_ADTM_RAW
  type: datetime
  derivation:
    impute:
      type: datetime
      source: _VSDTC
      time: first
- name: _ORI_ADTM
  type: datetime
  derivation:
    case:
    - when: _VSDTC IS NOT NULL AND NOT str_contains(_VSDTC, 'T')
      then: null
    - otherwise: _ORI_ADTM_RAW
- name: _ADTM
  type: datetime
  derivation:
    case:
    - when: str_contains(_VSDTC, 'T00:00')
      then: null
    - otherwise: _ORI_ADTM
- name: _VISIT2A
  type: str
  derivation:
    str_replace:
      source: _VISIT
      pattern: 'Convalescence'
      replacement: 'Illness'
- name: _VISIT2
  type: str
  derivation:
    case:
    - when: _VISIT2A IS NULL OR _VISIT2A IN ('') OR str_contains(_VISIT2A, 'Saf') OR str_contains(_VISIT2A, 'COV')
      then:
        str_template:
          template: 'Unsched {_VISIT2A}'
          missing: ''
    - otherwise: _VISIT2A
- name: _VISIT2_UP
  type: str
  derivation:
    str_case:
      source: _VISIT2
      to: upper
- name: _ADDSORTN
  type: str
  derivation:
    case:
    - when: (_VISIT IS NULL OR _VISIT IN ('') OR str_contains(_VISIT, 'Uns')) AND ADT IS NOT NULL
      then:
        str_template:
          template: '{_ADT_TXT} - 999'
          missing: ''
    - when: str_contains(_ORI_VISIT, '^Illness Visit Day 3 - Day 21') AND str_contains(_VISIT, 'Uns')
      then: '''          - 998'''
    - when: (str_contains(_VISIT, '^Ill') OR str_contains(_VISIT, '^Conva') OR str_contains(_VISIT, 'OL-D')) AND ADT IS NOT NULL AND TR01SDT IS NOT NULL AND ADT > TR01SDT
      then: _ADT_TXT
    - when: (str_contains(_VISIT, '^Ill') OR str_contains(_VISIT, '^Conva') OR str_contains(_VISIT, 'OL-D')) AND (_VSDTC IS NULL OR _VSDTC IN (''))
      then: '''0000'''
    - otherwise: "''"
- name: _DAYDIFF
  type: int
  derivation:
    diff:
      type: date
      start: TR01SDT
      end: ADT
      unit: day
- name: _ADTMY_S
  type: float
  derivation:
    case:
    - when: _ADTM IS NOT NULL AND TR01SDTM IS NOT NULL AND _ADTM > TR01SDTM
      then:
        diff:
          type: datetime
          start: TR01SDTM
          end: _ADTM
          unit: second
    - when: ADT IS NOT NULL AND TR01SDT IS NOT NULL
      then: _DAYDIFF * 86400
    - when: NOT str_contains(_VISIT2_UP, 'ILLNESS')
      then: 99999999
- name: _ADTMY_ABS
  type: float
  derivation: ABS(_ADTMY_S)
- name: _POSTDOSE
  type: int
  derivation:
    case:
    - when: ADT IS NOT NULL AND TR01SDT IS NOT NULL AND ADT > TR01SDT
      then: 1
- name: _ADTMY_NUM
  type: float
  derivation:
    case:
    - when: VISITNUM IS NOT NULL AND _ADTMY_ABS > 0
      then: _ADTMY_ABS + VISITNUM
    - otherwise: _ADTMY_ABS
- name: _ADTMY
  type: float
  derivation:
    case:
    - when: _POSTDOSE = 1 AND str_contains(_VISIT2, 'Uns') AND VISITNUM IS NULL
      then: 999
    - when: _POSTDOSE = 1
      then: VISITNUM
    - otherwise: _ADTMY_ABS
- name: _PREFL
  type: str
  derivation:
    case:
    - when: _ADTMY_S <= 0 AND TR01SDT IS NOT NULL AND NOT ((_VSTPT IS NOT NULL AND str_contains(_VSTPT, 'POST')) AND ADT IS NOT NULL AND TR01SDT IS NOT NULL AND ADT = TR01SDT)
      then: '''Y'''
- name: _POSTFL
  type: str
  derivation:
    case:
    - when: (_VSTPT IS NOT NULL AND str_contains(_VSTPT, 'POST')) AND ADT IS NOT NULL AND TR01SDT IS NOT NULL AND ADT = TR01SDT
      then: '''Y'''
    - when: _ADTMY_S > 0 AND TR01SDT IS NOT NULL AND ADT IS NOT NULL
      then: '''Y'''
- name: _PREFL_ADT
  type: date
  derivation:
    case:
    - when: _PREFL = 'Y'
      then: ADT
- name: _PREFL_ADTM
  type: datetime
  derivation:
    case:
    - when: _PREFL = 'Y'
      then: _ADTM
- name: _AVALN
  type: int
  derivation:
    case:
    - when: _VSSTRESC IS NOT NULL AND _VSSTRESC NOT IN ('')
      then: 1
    - when: (str_contains(_VISIT2_UP, 'ILLNESS') OR str_contains(_VISIT2, 'Uns')) AND (_POSTDOSE = 1 OR ADT IS NULL)
      then: 1
- name: _AVALN2
  type: int
  derivation:
    case:
    - when: _VSSTRESC IS NOT NULL AND _VSSTRESC NOT IN ('')
      then: 1
- name: _ILLUNS
  type: int
  derivation:
    case:
    - when: str_contains(_VISIT2, 'Uns')
      then: 1
    - when: str_contains(_VISIT2_UP, 'ILLNESS') OR str_contains(_VISIT2, 'OL-D')
      then: 2
    - otherwise: 0
- name: _VSSTRESC_UP
  type: str
  derivation:
    str_case:
      source: _VSSTRESC
      to: upper
- name: _ISSTRESN_
  type: int
  derivation:
    case:
    - when: _PREFL = 'Y' AND NOT str_contains(_VISIT2_UP, 'ILLNESS') AND _VSSTRESC_UP = 'POSITIVE'
      then: 1
    - when: _PREFL = 'Y' AND NOT str_contains(_VISIT2_UP, 'ILLNESS') AND _VSSTRESC_UP = 'NEGATIVE'
      then: 2
    - otherwise: 9
- name: _OPEND1_SRC
  type: float
  derivation:
    case:
    - when: str_contains(_VISIT2_UP, 'OL-D1') AND NOT str_contains(_VISIT2, 'Uns')
      then: ADY
- name: _OPENDT_SRC
  type: date
  derivation:
    case:
    - when: str_contains(_VISIT2_UP, 'OL-D1') AND NOT str_contains(_VISIT2, 'Uns')
      then: ADT
- name: _RETAIN_OPEND1
  type: float
  derivation:
    locf:
      source: _OPEND1_SRC
      window: SORT1_W
- name: _RETAIN_OPENDT
  type: date
  derivation:
    locf:
      source: _OPENDT_SRC
      window: SORT1_W
- name: _SORT2_RN
  type: int
  derivation:
    row_number:
      window: SORT2_W
- name: _FIRST_ADT
  type: int
  derivation:
    row_number:
      window: FIRST_ADT_W
- name: _VISIT_PREV
  type: str
  derivation:
    row_value:
      source: _VISIT2
      offset: -1
      window: SORT2_W
- name: _SCHEILL_DAY1_SRC
  type: str
  derivation:
    case:
    - when: _VISIT2 = 'Illness Visit Day 1'
      then: '''Illness Visit Day 1'''
- name: _SCHEILL_DAY1
  type: str
  derivation:
    locf:
      source: _SCHEILL_DAY1_SRC
      window: SORT2_W
- name: _SCHEILL_DATE_SRC
  type: date
  derivation:
    case:
    - when: _VISIT2 = 'Illness Visit Day 1'
      then: ADT
- name: _SCHEILL_DATE
  type: date
  derivation:
    locf:
      source: _SCHEILL_DATE_SRC
      window: SORT2_W
- name: _SCHEILL_UPDATE
  type: str
  derivation:
    case:
    - when: NOT str_contains(_VISIT2, 'Uns') AND NOT str_contains(_VISIT2, 'Ill')
      then: "''"
    - otherwise: _SCHEILL_DAY1
- name: _ILL_SET_PREV
  type: int
  derivation:
    row_value:
      source: _ILL_SET
      offset: -1
      window: SORT2_W
- name: _ILL_DAT_PREV
  type: date
  derivation:
    row_value:
      source: _ILL_DAT
      offset: -1
      window: SORT2_W
- name: _ILL_ADY_PREV
  type: float
  derivation:
    row_value:
      source: _ILL_ADY
      offset: -1
      window: SORT2_W
- name: _ILL_SET
  type: int
  derivation:
    case:
    - when: (_FIRST_ADT = 1 AND str_contains(_VISIT2_UP, 'ILLNESS') AND _ORI_VISIT <> 'Illness Visit Day 3 - Day 21' AND str_contains(_VISIT2_UP, 'DAY 1') AND NOT str_contains(_VISIT2_UP, 'DAY 1[0-9]') AND NOT str_contains(_VISIT2, 'Uns')) OR (_FIRST_ADT <> 1 AND _VISIT2 = 'Illness Visit Day 1' AND _VISIT2 <> _VISIT_PREV)
      then:
        case:
        - when: ((_SCHEILL_DAY1 IS NULL) OR (ADT IS NOT NULL AND _SCHEILL_DATE IS NOT NULL AND ADT < _SCHEILL_DATE) OR (str_contains(_VISIT2, 'Illness Visit Day 1 Unscheduled') AND _ILL_SET_PREV >= 1)) AND str_contains(_VISIT2_UP, 'ILLNESS') AND _SORT2_RN = 1
          then: 0
        - when: ((_SCHEILL_DAY1 IS NULL) OR (ADT IS NOT NULL AND _SCHEILL_DATE IS NOT NULL AND ADT < _SCHEILL_DATE) OR (str_contains(_VISIT2, 'Illness Visit Day 1 Unscheduled') AND _ILL_SET_PREV >= 1)) AND str_contains(_VISIT2_UP, 'ILLNESS')
          then: _ILL_SET_PREV
        - when: _SORT2_RN = 1
          then: 1
        - otherwise: _ILL_SET_PREV + 1
    - when: _SORT2_RN = 1
      then: 0
    - otherwise: _ILL_SET_PREV
- name: _ILL_DAT
  type: date
  derivation:
    case:
    - when: (_FIRST_ADT = 1 AND str_contains(_VISIT2_UP, 'ILLNESS') AND _ORI_VISIT <> 'Illness Visit Day 3 - Day 21' AND str_contains(_VISIT2_UP, 'DAY 1') AND NOT str_contains(_VISIT2_UP, 'DAY 1[0-9]') AND NOT str_contains(_VISIT2, 'Uns')) OR (_FIRST_ADT <> 1 AND _VISIT2 = 'Illness Visit Day 1' AND _VISIT2 <> _VISIT_PREV)
      then: ADT
    - otherwise: _ILL_DAT_PREV
- name: _ILL_ADY
  type: float
  derivation:
    case:
    - when: (_FIRST_ADT = 1 AND str_contains(_VISIT2_UP, 'ILLNESS') AND _ORI_VISIT <> 'Illness Visit Day 3 - Day 21' AND str_contains(_VISIT2_UP, 'DAY 1') AND NOT str_contains(_VISIT2_UP, 'DAY 1[0-9]') AND NOT str_contains(_VISIT2, 'Uns')) OR (_FIRST_ADT <> 1 AND _VISIT2 = 'Illness Visit Day 1' AND _VISIT2 <> _VISIT_PREV)
      then: ADY
    - otherwise: _ILL_ADY_PREV
- name: _BASELINE_SRC
  type: int
  derivation:
    case:
    - when: _AVALN = 1 AND _PREFL = 'Y'
      then: 1
- name: _BASELINE
  type: str
  derivation:
    baseline_flag:
      date: ADT
      reference: TR01SDT
      source: _BASELINE_SRC
      window:
        group_by: [STUDYID, USUBJID, PARAMCD]
        order_by:
        - ADT
        - _ADTM
        - variable: _ADDSORTN
          direction: desc
        - variable: _ILLUNS
          direction: desc
        - variable: _ADTMY
          direction: desc
        - variable: _ISSTRESN_
          direction: desc
        - VSTPT
        - variable: _ADTMY_NUM
          direction: desc
        - _VSTPTNUM
        - VISITNUM
        - _VSSEQ
- name: _BASELINE_ADT
  type: date
  derivation:
    aggregate:
      filter: _BASELINE = 'Y'
      group_by: [STUDYID, USUBJID, PARAMCD]
      expr: ONLY(ADT)
- name: _BASELINE_ADTM
  type: datetime
  derivation:
    aggregate:
      filter: _BASELINE = 'Y'
      group_by: [STUDYID, USUBJID, PARAMCD]
      expr: ONLY(_ADTM)
- name: _POSTFL2
  type: str
  derivation:
    case:
    - when: _ADTM IS NOT NULL AND TR01SDTM IS NOT NULL AND _ADTM < TR01SDTM
      then: "''"
    - otherwise: _POSTFL
- name: _BASE
  type: str
  derivation:
    aggregate:
      filter: _BASELINE = 'Y'
      group_by: [STUDYID, USUBJID, PARAMCD]
      expr: ONLY(AVAL)
- name: _BASE_N
  type: float
  derivation:
    aggregate:
      filter: _BASELINE = 'Y'
      group_by: [STUDYID, USUBJID, PARAMCD]
      expr: ONLY(_AVALN_NUM)
- name: _BASE_N_SAFE
  type: float
  derivation:
    case:
    - when: _BASE_N = 0
      then: null
    - otherwise: _BASE_N
- name: _CHG_N
  type: float
  derivation:
    case:
    - when: _POSTFL2 = 'Y' AND _AVALN_NUM IS NOT NULL AND _BASE_N IS NOT NULL
      then: _AVALN_NUM - _BASE_N
- name: _PCHG_N
  type: float
  derivation:
    case:
    - when: _POSTFL2 = 'Y' AND _CHG_N IS NOT NULL AND _BASE_N_SAFE IS NOT NULL
      then: _CHG_N / _BASE_N_SAFE * 100
- name: _D_ILL
  type: int
  derivation:
    diff:
      type: date
      start: _ILL_DAT
      end: ADT
      unit: day
- name: _D_OPEN
  type: int
  derivation:
    diff:
      type: date
      start: _RETAIN_OPENDT
      end: ADT
      unit: day
- name: _V_SCAN4
  type: str
  derivation:
    str_extract:
      source: _VISIT2
      pattern: '^(?:\S+\s+){3}(\S+)'
      group: 1
      no_match: ''
- name: _AVISIT_PRE
  type: str
  derivation:
    case:
    - when: _BASELINE = 'Y'
      then: '''Baseline'''
    - when: _VISIT2_UP = 'VISIT 1 DAY 1' AND (_VSTPT IS NOT NULL AND str_contains(_VSTPT, 'POST')) AND ADT IS NOT NULL
      then: '''Day 1'''
    - when: _VISIT2 = 'Illness Visit Day 1' AND ADT IS NOT NULL
      then: '''Illness Visit Day 1'''
    - when: ADY IS NOT NULL AND ADY > 1 AND str_contains(_VISIT2_UP, 'ILLNESS') AND NOT str_contains(_VISIT2, 'Uns')
      then:
        str_template:
          template: 'Illness Visit Day {_V_SCAN4}'
          missing: ''
    - when: ADY IS NOT NULL AND ADY > 1 AND str_contains(_VISIT2_UP, 'OL-D1') AND NOT str_contains(_VISIT2, 'Uns') AND NOT str_contains(_VISIT2, 'Ill')
      then: '''Participant Decision Visit / OL-D1'''
    - when: ADY IS NOT NULL AND ADY > 1 AND str_contains(_VISIT2_UP, 'OL-D29') AND NOT str_contains(_VISIT2, 'Uns') AND NOT str_contains(_VISIT2, 'Ill')
      then: '''Open Label Day 29'''
    - when: ADY IS NOT NULL AND ADY > 1 AND str_contains(_VISIT2_UP, 'OL-D57') AND NOT str_contains(_VISIT2, 'Uns') AND NOT str_contains(_VISIT2, 'Ill')
      then: '''Open Label Day 57'''
    - when: (str_contains(_VISIT2_UP, 'ILLNESS') OR str_contains(_VISIT2, 'Uns')) AND _D_ILL >= 2 AND _D_ILL <= 34 AND ADT IS NOT NULL
      then: '''Illness Visit Day 28'''
    - when: TR02SDT IS NOT NULL AND _RETAIN_OPENDT IS NOT NULL AND _RETAIN_OPENDT = ADT AND str_contains(_VISIT2, 'Uns')
      then: '''Participant Decision Visit / OL-D1'''
    - when: TR02SDT IS NOT NULL AND OLDOS2DT IS NULL AND str_contains(_VISIT2, 'Uns') AND NOT str_contains(_VISIT2, 'Ill') AND _RETAIN_OPENDT IS NOT NULL AND _D_OPEN >= 1 AND _D_OPEN <= 42
      then: '''Open Label Day 29'''
    - when: TR02SDT IS NOT NULL AND OLDOS2DT IS NOT NULL AND str_contains(_VISIT2, 'Uns') AND NOT str_contains(_VISIT2, 'Ill') AND _RETAIN_OPEND1 IS NOT NULL AND _RETAIN_OPENDT IS NOT NULL AND _D_OPEN >= 1 AND _D_OPEN <= 42
      then: '''Open Label Day 29'''
    - when: TR02SDT IS NOT NULL AND OLDOS2DT IS NOT NULL AND str_contains(_VISIT2, 'Uns') AND NOT str_contains(_VISIT2, 'Ill') AND _RETAIN_OPEND1 IS NOT NULL AND _RETAIN_OPENDT IS NOT NULL AND _D_OPEN > 42 AND _D_OPEN <= 70
      then: '''Open Label Day 57'''
    - when: ADY IS NOT NULL AND ADY > 1 AND _ORI_VISIT = 'Illness Visit Day 3 - Day 21' AND _ILL_DAT IS NULL
      then: '''Illness Visit'''
    - when: ADY IS NOT NULL AND ADY > 1 AND str_contains(_VISIT2, 'Illness')
      then:
        str_template:
          template: 'Illness Visit Day {_V_SCAN4}'
          missing: ''
    - when: _POSTFL2 = 'Y' AND (str_contains(_VISIT2, 'Uns') OR str_contains(_VISIT2, 'Safe') OR str_contains(_VISIT2_UP, 'ILLNESS')) AND (ADY = 1 AND _BASELINE_ADT IS NOT NULL AND (ADT > _BASELINE_ADT OR (ADT = _BASELINE_ADT AND (_ADTM > _BASELINE_ADTM OR _ADTM IS NULL OR _BASELINE_ADTM IS NULL))))
      then: '''Day 1'''
    - when: _POSTFL2 = 'Y' AND (str_contains(_VISIT2, 'Uns') OR str_contains(_VISIT2, 'Safe') OR str_contains(_VISIT2_UP, 'ILLNESS')) AND ADY >= 2 AND ADY <= 43
      then: '''Day 29'''
    - when: _POSTFL2 = 'Y' AND (str_contains(_VISIT2, 'Uns') OR str_contains(_VISIT2, 'Safe') OR str_contains(_VISIT2_UP, 'ILLNESS')) AND ADY > 43 AND ADY <= 133
      then: '''Day 57'''
    - when: _POSTFL2 = 'Y' AND (str_contains(_VISIT2, 'Uns') OR str_contains(_VISIT2, 'Safe') OR str_contains(_VISIT2_UP, 'ILLNESS')) AND ADY > 133 AND ADY <= 301
      then: '''Day 209'''
    - when: _POSTFL2 = 'Y' AND (str_contains(_VISIT2, 'Uns') OR str_contains(_VISIT2, 'Safe') OR str_contains(_VISIT2_UP, 'ILLNESS')) AND ADY > 301 AND ADY <= 576
      then: '''Day 394'''
    - when: _POSTFL2 = 'Y' AND (str_contains(_VISIT2, 'Uns') OR str_contains(_VISIT2, 'Safe') OR str_contains(_VISIT2_UP, 'ILLNESS')) AND ADY > 576 AND ADY <= 773
      then: '''Day 759'''
    - when: ADY IS NOT NULL AND ADY > 1 AND _POSTFL2 = 'Y' AND str_contains(_VISIT2_UP, 'DAY')
      then:
        str_template:
          template: 'Day {_V_SCAN4}'
          missing: ''
    - otherwise: "''"
- name: _AVISIT_P1
  type: str
  derivation:
    case:
    - when: _BASELINE IS NULL AND ADT IS NOT NULL AND _ILL_DAT IS NOT NULL AND ADT = _ILL_DAT AND _SCHEILL_UPDATE IS NOT NULL AND _SCHEILL_UPDATE NOT IN ('') AND str_contains(_VISIT2, 'Uns')
      then: '''Illness Visit Day 1'''
    - otherwise: _AVISIT_PRE
- name: _SECOND_PASS
  type: str
  derivation:
    case:
    - when: _AVISIT_P1 = '' AND _POSTFL2 = 'Y' AND (str_contains(_VISIT2, 'Uns') OR _VISIT2 IS NULL OR _VISIT2 IN ('') OR str_contains(_VISIT2, 'Safe')) AND (ADY = 1 AND _BASELINE_ADT IS NOT NULL AND (ADT > _BASELINE_ADT OR (ADT = _BASELINE_ADT AND (_ADTM > _BASELINE_ADTM OR _ADTM IS NULL OR _BASELINE_ADTM IS NULL))))
      then: '''Day 1'''
    - when: _AVISIT_P1 = '' AND _POSTFL2 = 'Y' AND (str_contains(_VISIT2, 'Uns') OR _VISIT2 IS NULL OR _VISIT2 IN ('') OR str_contains(_VISIT2, 'Safe')) AND ADY >= 2 AND ADY <= 43
      then: '''Day 29'''
    - when: _AVISIT_P1 = '' AND _POSTFL2 = 'Y' AND (str_contains(_VISIT2, 'Uns') OR _VISIT2 IS NULL OR _VISIT2 IN ('') OR str_contains(_VISIT2, 'Safe')) AND ADY > 43 AND ADY <= 133
      then: '''Day 57'''
    - when: _AVISIT_P1 = '' AND _POSTFL2 = 'Y' AND (str_contains(_VISIT2, 'Uns') OR _VISIT2 IS NULL OR _VISIT2 IN ('') OR str_contains(_VISIT2, 'Safe')) AND ADY > 133 AND ADY <= 301
      then: '''Day 209'''
    - when: _AVISIT_P1 = '' AND _POSTFL2 = 'Y' AND (str_contains(_VISIT2, 'Uns') OR _VISIT2 IS NULL OR _VISIT2 IN ('') OR str_contains(_VISIT2, 'Safe')) AND ADY > 301 AND ADY <= 576
      then: '''Day 394'''
    - when: _AVISIT_P1 = '' AND _POSTFL2 = 'Y' AND (str_contains(_VISIT2, 'Uns') OR _VISIT2 IS NULL OR _VISIT2 IN ('') OR str_contains(_VISIT2, 'Safe')) AND ADY > 576 AND ADY <= 773
      then: '''Day 759'''
- name: _AVISIT_P2
  type: str
  derivation:
    case:
    - when: _SECOND_PASS IS NOT NULL
      then: _SECOND_PASS
    - otherwise: _AVISIT_P1
- name: _AVISITN_PRE
  type: int
  derivation:
    case:
    - when: _AVISIT_P2 = 'Illness Visit Day 1'
      then: 101
    - when: _AVISIT_P2 = 'Illness Visit Day 3'
      then: 103
    - when: _AVISIT_P2 = 'Illness Visit Day 5'
      then: 105
    - when: _AVISIT_P2 = 'Illness Visit Day 7'
      then: 107
    - when: _AVISIT_P2 = 'Illness Visit Day 9'
      then: 109
    - when: _AVISIT_P2 = 'Illness Visit Day 14'
      then: 114
    - when: _AVISIT_P2 = 'Illness Visit Day 21'
      then: 121
    - when: _AVISIT_P2 = 'Illness Visit Day 28'
      then: 128
    - when: str_contains(_AVISIT_P2, 'Illness')
      then: 100 * _ILL_SET + 1
    - when: _AVISIT_P2 = 'Baseline'
      then: 1
    - when: _AVISIT_P2 = 'Day 1'
      then: 2
    - when: _AVISIT_P2 = 'Day 29'
      then: 3
    - when: _AVISIT_P2 = 'Day 57'
      then: 4
    - when: _AVISIT_P2 = 'Day 209'
      then: 6
    - when: _AVISIT_P2 = 'Day 394'
      then: 7
    - when: _AVISIT_P2 = 'Day 759'
      then: 8
    - when: _AVISIT_P2 = 'Participant Decision Visit / OL-D1'
      then: 10
    - when: _AVISIT_P2 = 'Open Label Day 29'
      then: 11
    - when: _AVISIT_P2 = 'Open Label Day 57'
      then: 12
- name: _AVISIT_P3
  type: str
  derivation:
    case:
    - when: _AVISITN_PRE IS NULL OR _AVISITN_PRE IN (1, 2, 3, 4, 5, 6, 7, 8, 10, 11, 12, 101, 128) OR _AVISITN_PRE >= 100
      then: _AVISIT_P2
    - otherwise: "''"
- name: _AVISITN_P3
  type: int
  derivation:
    case:
    - when: _AVISITN_PRE IS NULL OR _AVISITN_PRE IN (1, 2, 3, 4, 5, 6, 7, 8, 10, 11, 12, 101, 128) OR _AVISITN_PRE >= 100
      then: _AVISITN_PRE
- name: _RETAIN_ILL_ADY
  type: float
  derivation:
    locf:
      source: _ILL_ADY
      window: SORT4_W
- name: _AVISITN_P3_N0
  type: int
  derivation:
    case:
    - when: _AVISITN_P3 IS NOT NULL
      then: _AVISITN_P3
    - otherwise: 0
- name: _V_SCAN3_P3
  type: str
  derivation:
    str_extract:
      source: _AVISIT_P3
      pattern: '^(?:\S+\s+){2}(\S+)'
      group: 1
      no_match: ''
- name: _V_SCAN4_P3
  type: str
  derivation:
    str_extract:
      source: _AVISIT_P3
      pattern: '^(?:\S+\s+){3}(\S+)'
      group: 1
      no_match: ''
- name: _ILL_SET_TXT
  type: str
  derivation: _ILL_SET
- name: _AVISIT_P4
  type: str
  derivation:
    case:
    - when: _ILL_SET > 1 AND str_contains(_AVISIT_P3, 'Illness') AND _V_SCAN3_P3 = 'Day' AND _SCHEILL_DAY1 IS NOT NULL
      then:
        str_template:
          template: 'Illness Visit {_ILL_SET_TXT} Day {_V_SCAN4_P3}'
          missing: ''
    - otherwise: _AVISIT_P3
- name: _AVISITN_P4
  type: int
  derivation:
    case:
    - when: _ILL_SET > 1 AND str_contains(_AVISIT_P3, 'Illness') AND _V_SCAN3_P3 = 'Day' AND _SCHEILL_DAY1 IS NOT NULL
      then: 100 * (_ILL_SET - 1) + _AVISITN_P3_N0
    - otherwise: _AVISITN_P3
- name: _AVISIT_MINUS2
  type: str
  derivation:
    str_replace:
      source: _AVISIT_P4
      pattern: '..$'
      replacement: ''
- name: _AVISIT_P4_PAD
  type: str
  derivation:
    str_template:
      template: '{_AVISIT_P4} '
      missing: ''
- name: _AWRANGE_P4
  type: str
  derivation:
    case:
    - when: str_contains(_AVISIT_P4, 'Illness') AND str_contains(_AVISIT_P4_PAD, 'Day 1 ')
      then: _AVISIT_P4
    - when: str_contains(_AVISIT_P4, 'Illness')
      then:
        str_template:
          template: '{_AVISIT_MINUS2}2 - {_AVISIT_MINUS2}35'
          missing: ''
    - when: _AVISIT_P4 = 'Baseline'
      then: '''<=1 Pre-dose'''
    - when: _AVISIT_P4 = 'Day 1'
      then: '''Day 1 Post-dose'''
    - when: _AVISIT_P4 = 'Day 29'
      then: '''Day 2 - Day 43'''
    - when: _AVISIT_P4 = 'Day 57'
      then: '''Day 44 - Day 133'''
    - when: _AVISIT_P4 = 'Day 209'
      then: '''Day 134 - Day 301'''
    - when: _AVISIT_P4 = 'Day 394'
      then: '''Day 302 - Day 576'''
    - when: _AVISIT_P4 = 'Day 759'
      then: '''Day 577 - Day 773'''
    - when: _AVISITN_P4 = 10
      then: '''Participant Decision Visit / OL-D1'''
    - when: _AVISITN_P4 = 11
      then: '''Day 2 - Day 43 Relative to Participant Decision Visit / OL-D1'''
    - when: _AVISITN_P4 = 12
      then: '''Day 2 - Day 71 Relative to Participant Decision Visit / OL-D1'''
    - otherwise: "''"
- name: _AWRANGE_T1
  type: str
  derivation:
    str_replace:
      source: _AWRANGE_P4
      pattern: 'Day1'
      replacement: 'Day 1'
- name: _AWRANGE_T2
  type: str
  derivation:
    str_replace:
      source: _AWRANGE_T1
      pattern: 'Day2'
      replacement: 'Day 2'
- name: _AWRANGE_T3
  type: str
  derivation:
    str_replace:
      source: _AWRANGE_T2
      pattern: 'Day3'
      replacement: 'Day 3'
- name: _AWTARGET_P4
  type: int
  derivation:
    case:
    - when: _AVISITN_P4 = 101 AND _RETAIN_ILL_ADY IS NOT NULL
      then: _RETAIN_ILL_ADY
    - when: str_contains(_AWRANGE_T3, 'Illness') AND str_contains(_AVISIT_P4_PAD, 'Day 1 ')
      then: _RETAIN_ILL_ADY
    - when: str_contains(_AWRANGE_T3, 'Illness') AND str_contains(_AWRANGE_T3, 'Day 3') AND _RETAIN_ILL_ADY IS NOT NULL
      then: _RETAIN_ILL_ADY + 27
    - when: _AVISIT_P4 = 'Baseline'
      then: 1
    - when: _AVISIT_P4 = 'Day 1'
      then: 1
    - when: _AVISIT_P4 = 'Day 29'
      then: 29
    - when: _AVISIT_P4 = 'Day 57'
      then: 57
    - when: _AVISIT_P4 = 'Day 119'
      then: 119
    - when: _AVISIT_P4 = 'Day 209'
      then: 209
    - when: _AVISIT_P4 = 'Day 394'
      then: 394
    - when: _AVISIT_P4 = 'Day 759'
      then: 759
    - when: _AVISITN_P4 = 10
      then: _RETAIN_OPEND1
    - when: _AVISITN_P4 = 11 AND _RETAIN_OPEND1 IS NOT NULL
      then: _RETAIN_OPEND1 + 28
    - when: _AVISITN_P4 = 12 AND _RETAIN_OPEND1 IS NOT NULL
      then: _RETAIN_OPEND1 + 56
- name: _AWTDIFF_P4
  type: int
  derivation: ABS(ADY - _AWTARGET_P4)
- name: _UNS
  type: int
  derivation:
    case:
    - when: _POSTFL2 = 'Y' AND (str_contains(_VISIT2, 'Uns') OR _VISIT2 IS NULL OR _VISIT2 IN ('') OR str_contains(_VISIT2, 'Safe'))
      then: 1
    - when: _POSTFL2 = 'Y'
      then: 0
- name: _AWTDIFF
  type: int
  derivation:
    case:
    - when: _POSTFL2 = 'Y' AND _UNS = 1
      then: _AWTDIFF_P4
    - when: _POSTFL2 = 'Y'
      then: 0
    - otherwise: 99999999
- name: _SORT5_RN
  type: int
  derivation:
    row_number:
      window: SORT5_W
- name: _RETAIN_ADY_SRC
  type: float
  derivation:
    case:
    - when: _UNS = 0 OR (_SORT5_RN = 1 AND NOT str_contains(_VISIT2, '999'))
      then: ADY
- name: _RETAIN_ADY
  type: float
  derivation:
    locf:
      source: _RETAIN_ADY_SRC
      window: SORT5_W
- name: _RETAIN_AVISITN_SRC
  type: int
  derivation:
    case:
    - when: _UNS = 0 OR (_SORT5_RN = 1 AND NOT str_contains(_VISIT2, '999'))
      then: _AVISITN_P4
- name: _RETAIN_AVISITN
  type: int
  derivation:
    locf:
      source: _RETAIN_AVISITN_SRC
      window: SORT5_W
- name: _UNS_BLANK
  type: int
  derivation:
    case:
    - when: _UNS = 1 AND _RETAIN_ADY IS NOT NULL AND _RETAIN_ADY >= ADY AND _AVISITN_P4 IS NOT NULL AND _AVISITN_P4 < 100 AND _AVISITN_P4 > _RETAIN_AVISITN AND _RETAIN_AVISITN IS NOT NULL
      then: 1
- name: _AVISIT_P5
  type: str
  derivation:
    case:
    - when: _UNS_BLANK = 1
      then: "''"
    - otherwise: _AVISIT_P4
- name: _AVISITN_P5
  type: int
  derivation:
    case:
    - when: _UNS_BLANK = 1
      then: null
    - otherwise: _AVISITN_P4
- name: _AWRANGE_P5
  type: str
  derivation:
    case:
    - when: _UNS_BLANK = 1
      then: "''"
    - otherwise: _AWRANGE_T3
- name: _AWTARGET_P5
  type: int
  derivation:
    case:
    - when: _UNS_BLANK = 1
      then: null
    - otherwise: _AWTARGET_P4
- name: _AWTDIFF_P5
  type: int
  derivation:
    case:
    - when: _UNS_BLANK = 1
      then: null
    - otherwise: _AWTDIFF_P4
- name: _AVALN_P2
  type: int
  derivation:
    case:
    - when: _UNS_BLANK = 1
      then: 0
    - otherwise: _AVALN
- name: _AWTDIFF_P2
  type: int
  derivation:
    case:
    - when: _UNS_BLANK = 1
      then: 99999999
    - otherwise: _AWTDIFF
- name: _DERIVED_AVISIT
  type: str
  derivation: _AVISIT_P5
- name: _W1
  type: str
  derivation:
    str_extract:
      source: _AVISIT_P5
      pattern: '^(\S+)'
      group: 1
      no_match: ''
- name: _W2
  type: str
  derivation:
    str_extract:
      source: _AVISIT_P5
      pattern: '^(?:\S+\s+)(\S+)'
      group: 1
      no_match: ''
- name: _W3
  type: str
  derivation:
    str_extract:
      source: _AVISIT_P5
      pattern: '^(?:\S+\s+){2}(\S+)'
      group: 1
      no_match: ''
- name: _AVISIT_P6
  type: str
  derivation:
    case:
    - when: str_contains(_AVISIT_P5, 'Illness') AND _AVISITN_P5 IS NOT NULL AND _AVISITN_P5 >= 100 AND _AVISITN_P5 < 200
      then:
        str_template:
          template: '{_W1} {_W2}'
          missing: ''
    - when: str_contains(_AVISIT_P5, 'Illness') AND _AVISITN_P5 IS NOT NULL AND _AVISITN_P5 > 200
      then:
        str_template:
          template: '{_W1} {_W2} {_W3}'
          missing: ''
    - otherwise: _AVISIT_P5
- name: _AVISITN_P6
  type: int
  derivation:
    case:
    - when: str_contains(_AVISIT_P5, 'Illness') AND _AVISITN_P5 IS NOT NULL AND _AVISITN_P5 >= 100 AND _AVISITN_P5 < 200
      then: 100
    - when: str_contains(_AVISIT_P5, 'Illness') AND _AVISITN_P5 IS NOT NULL AND _AVISITN_P5 > 200
      then: 100 * _ILL_SET
    - otherwise: _AVISITN_P5
- name: _ATPT_NUM
  type: str
  derivation:
    str_extract:
      source: _DERIVED_AVISIT
      pattern: 'Day ([0-9]+)'
      group: 1
      no_match: ''
- name: _ATPT_RAW
  type: str
  derivation:
    case:
    - when: str_contains(_AVISIT_P6, 'Ill')
      then:
        str_template:
          template: 'Day {_ATPT_NUM}'
          missing: ''
- name: _ATPT_A
  type: str
  derivation:
    case:
    - when: str_contains(_AVISIT_P6, 'Ill') AND (_SCHEILL_UPDATE IS NULL OR _SCHEILL_UPDATE IN ('')) AND (_ORI_VISIT IS NULL OR _ORI_VISIT IN ('') OR str_contains(_ORI_VISIT, 'Uns'))
      then: "''"
    - otherwise: _ATPT_RAW
- name: _ATPT_COMPRESS_SRC
  type: str
  derivation:
    str_replace:
      source: _ATPT_A
      pattern: ' '
      replacement: ''
- name: _COMPRESS
  type: int
  derivation:
    case:
    - when: str_contains(_AVISIT_P6, 'Ill') AND _ATPT_COMPRESS_SRC IN ('Unscheduled', 'Day', 'DayUnscheduled')
      then: 1
- name: _ATPT_BLANK
  type: int
  derivation:
    case:
    - when: str_contains(_AVISIT_P6, 'Ill') AND ((_SCHEILL_UPDATE IS NULL OR _SCHEILL_UPDATE IN ('')) AND (_ORI_VISIT IS NULL OR _ORI_VISIT IN ('') OR str_contains(_ORI_VISIT, 'Uns')) OR _COMPRESS = 1 OR (str_contains(_ORI_VISIT, 'Uns') AND _ILL_DAT IS NOT NULL AND ADT IS NOT NULL AND _D_ILL > 34) OR (str_contains(_ORI_VISIT, 'Uns') AND _ILL_DAT IS NULL) OR (_ORI_VISIT = 'Illness Visit Day 3 - Day 21' AND _ILL_DAT IS NULL))
      then: 1
- name: _AVIS_TMP1
  type: str
  derivation:
    str_replace:
      source: _AVISIT_P6
      pattern: 'Day Unscheduled'
      replacement: ''
- name: _AVIS_TMP2
  type: str
  derivation:
    str_replace:
      source: _AVIS_TMP1
      pattern: 'Day'
      replacement: ''
- name: _AVISITN_COMPRESS
  type: int
  derivation:
    case:
    - when: _ILL_SET = 0
      then: 100
    - otherwise: 100 * _ILL_SET
- name: _AVISIT_F
  type: str
  derivation:
    case:
    - when: _COMPRESS = 1
      then: _AVIS_TMP2
    - otherwise: _AVISIT_P6
- name: _AVISITN_F
  type: int
  derivation:
    case:
    - when: _COMPRESS = 1
      then: _AVISITN_COMPRESS
    - otherwise: _AVISITN_P6
- name: _ATPT_F
  type: str
  derivation:
    case:
    - when: _ATPT_BLANK = 1
      then: "''"
    - otherwise: _ATPT_RAW
- name: _ATPTN_STR
  type: str
  derivation:
    str_extract:
      source: _ATPT_F
      pattern: 'Day ([0-9]+)'
      group: 1
      no_match: ''
- name: _ATPTN_F
  type: float
  derivation:
    case:
    - when: _ATPT_F IS NOT NULL AND _ATPT_F NOT IN ('')
      then: _ATPTN_STR
- name: _SV29_RAW
  type: date
  derivation:
    to_date:
      source: SV_OL29.SVSTDTC
- name: _SV4_RAW
  type: date
