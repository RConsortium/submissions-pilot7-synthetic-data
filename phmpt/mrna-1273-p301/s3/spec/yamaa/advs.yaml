- name: _MRDDY
  type: int
  derivation:
    case:
    - when: (TR01SDT IS NOT NULL) AND (((TR01SDTM IS NOT NULL AND _ORI_ADTM IS NOT NULL AND TR01SDTM <= _ORI_ADTM) AND (_ORI_ADTM IS NOT NULL AND DOS2DTM IS NOT NULL AND _ORI_ADTM < DOS2DTM)) OR ((((TR01SDTM IS NOT NULL AND _ORI_ADTM IS NOT NULL AND TR01SDTM <= _ORI_ADTM) AND (DOSE2DT IS NULL)) OR ((TR01SDTM IS NOT NULL AND _ORI_ADTM IS NOT NULL AND TR01SDTM <= _ORI_ADTM) AND (DOS2DTM IS NULL) AND (ADT IS NOT NULL AND DOSE2DT IS NOT NULL AND ADT < DOSE2DT))) AND ((TR02SDT IS NULL) OR (_ORI_ADTM IS NOT NULL AND TR02SDTM IS NOT NULL AND _ORI_ADTM < TR02SDTM) OR (((_ORI_ADTM IS NULL) OR (TR02SDTM IS NULL)) AND (ADT IS NOT NULL AND TR02SDT IS NOT NULL AND ADT < TR02SDT)))) OR ((TR01SDT IS NOT NULL AND ADT IS NOT NULL AND TR01SDT <= ADT) AND (ADT IS NOT NULL AND DOSE2DT IS NOT NULL AND ADT < DOSE2DT) AND ((_ORI_ADTM IS NULL) OR (TR01SDTM IS NULL))) OR ((((TR01SDT IS NOT NULL AND ADT IS NOT NULL AND TR01SDT <= ADT) AND ((_ORI_ADTM IS NULL) OR (TR01SDTM IS NULL)) AND (DOSE2DT IS NULL)) OR ((TR01SDT IS NOT NULL AND ADT IS NOT NULL AND TR01SDT <= ADT) AND ((_ORI_ADTM IS NULL) OR (TR01SDTM IS NULL)) AND (ADT IS NOT NULL AND DOSE2DT IS NOT NULL AND ADT < DOSE2DT))) AND ((TR02SDT IS NULL) OR (_ORI_ADTM IS NOT NULL AND TR02SDTM IS NOT NULL AND _ORI_ADTM < TR02SDTM) OR (((_ORI_ADTM IS NULL) OR (TR02SDTM IS NULL)) AND (ADT IS NOT NULL AND TR02SDT IS NOT NULL AND ADT < TR02SDT)))))
      then: _RDDY1 + 1
    - when: (TR01SDT IS NOT NULL) AND (((DOS2DTM IS NOT NULL AND _ORI_ADTM IS NOT NULL AND DOS2DTM <= _ORI_ADTM) AND (_ORI_ADTM IS NOT NULL AND TR02SDTM IS NOT NULL AND _ORI_ADTM < TR02SDTM)) OR ((DOS2DTM IS NOT NULL AND _ORI_ADTM IS NOT NULL AND DOS2DTM <= _ORI_ADTM) AND (TR02SDT IS NULL)) OR ((DOS2DTM IS NOT NULL AND _ORI_ADTM IS NOT NULL AND DOS2DTM <= _ORI_ADTM) AND (TR02SDTM IS NULL) AND (ADT IS NOT NULL AND TR02SDT IS NOT NULL AND ADT < TR02SDT)) OR ((DOSE2DT IS NOT NULL AND ADT IS NOT NULL AND DOSE2DT <= ADT) AND (ADT IS NOT NULL AND TR02SDT IS NOT NULL AND ADT < TR02SDT) AND ((DOS2DTM IS NULL) OR (_ORI_ADTM IS NULL))) OR ((DOSE2DT IS NOT NULL AND ADT IS NOT NULL AND DOSE2DT <= ADT) AND ((DOS2DTM IS NULL) OR (_ORI_ADTM IS NULL)) AND (TR02SDT IS NULL)) OR ((DOSE2DT IS NOT NULL AND ADT IS NOT NULL AND DOSE2DT <= ADT) AND ((DOS2DTM IS NULL) OR (_ORI_ADTM IS NULL)) AND (TR02SDTM IS NULL) AND (ADT IS NOT NULL AND TR02SDT IS NOT NULL AND ADT < TR02SDT)))
      then: _RDDY2 + 1
    - when: (TR01SDT IS NOT NULL) AND (((TR02SDTM IS NOT NULL AND _ORI_ADTM IS NOT NULL AND TR02SDTM <= _ORI_ADTM) AND (_ORI_ADTM IS NOT NULL AND OLDO2DTM IS NOT NULL AND _ORI_ADTM < OLDO2DTM)) OR ((TR02SDTM IS NOT NULL AND _ORI_ADTM IS NOT NULL AND TR02SDTM <= _ORI_ADTM) AND (OLDOS2DT IS NULL)) OR ((TR02SDTM IS NOT NULL AND _ORI_ADTM IS NOT NULL AND TR02SDTM <= _ORI_ADTM) AND (OLDO2DTM IS NULL) AND (ADT IS NOT NULL AND OLDOS2DT IS NOT NULL AND ADT < OLDOS2DT)) OR ((TR02SDT IS NOT NULL AND ADT IS NOT NULL AND TR02SDT <= ADT) AND (ADT IS NOT NULL AND OLDOS2DT IS NOT NULL AND ADT < OLDOS2DT) AND ((TR02SDTM IS NULL) OR (_ORI_ADTM IS NULL))) OR ((TR02SDT IS NOT NULL AND ADT IS NOT NULL AND TR02SDT <= ADT) AND ((TR02SDTM IS NULL) OR (_ORI_ADTM IS NULL)) AND (_ORI_ADTM IS NOT NULL AND OLDO2DTM IS NOT NULL AND _ORI_ADTM < OLDO2DTM)) OR ((TR02SDT IS NOT NULL AND ADT IS NOT NULL AND TR02SDT <= ADT) AND ((TR02SDTM IS NULL) OR (_ORI_ADTM IS NULL)) AND (OLDOS2DT IS NULL)))
      then: _RDDY3 + 1
    - when: (TR01SDT IS NOT NULL) AND ((OLDO2DTM IS NOT NULL AND _ORI_ADTM IS NOT NULL AND OLDO2DTM <= _ORI_ADTM) OR ((OLDOS2DT IS NOT NULL AND ADT IS NOT NULL AND OLDOS2DT <= ADT) AND ((OLDO2DTM IS NULL) OR (_ORI_ADTM IS NULL))))
      then: _RDDY4 + 1
