# ADEFF for Moderna mRNA-1273-P301, cut S3 (BLA Interim Analysis,
# cutoff 2021-03-26). Parent: ../../../spec/yamaa/base/adam-base-s3.yaml (which
# chains to ../../../spec/yamaa/base/adam-base.yaml; 86 shared + 59 S3-only ADSL
# columns). Derivations implement the S3 A40ADEFF program, one
# row template per PARAMCD family in program order (COVID, COVIDS,
# COVIDSD, COVIDSDS, INFECT, COVIDSEV, COVIDSVS, DEATHCVD, COVIDA,
# COVIDSVA, ASYMPINF, ASYMPINA). Where the SAS code and the define
# method text disagree, the code is followed (see README.md).
# SAP note (closed 2026-11-24, no-impact): the file labelled "SAP v3"
# (19745_S68_M5_sap-v3.pdf) is the P201 SAP v3.0 (27 Oct 2020), not a
# P301 SAP version; the only P301 SAP in the set is v1.0 (10 Sep 2020).
# The case definitions below are the program's own, so the spec follows
# the program, not a SAP version.
# Keys (resolved 2026-11-23, yamaa#4771 closed by PR #4775): ADEFF has
# no submitted ASEQ and its natural key (STUDYID, USUBJID, PARAMCD,
# ADT, PCRDT) is nullable (PCRDT null on 2,519 rows); no non-missing
# unique key exists among the received columns. Per the merged rule
# the spec derives the row identity as ASEQ (row_number over (STUDYID,
# USUBJID), ordered by PARAMCD, ADT, PCRDT nulls first) and declares
# keys [STUDYID, USUBJID, PARAMCD, ADT, ASEQ]; PCRDT mandatory is
# false. ASEQ is internal row identity, not a submitted column --
# verify.py sets it aside and aligns on the received natural key.
# Re-verification (session 60, 2026-11-23, engine yamaa 0.8.0 built
# from origin/main @87930dbf1): end to end, EXACT MATCH strict,
# 18,102 rows x 107 cols, 0 mismatched cells, identical to the
# pruned-group baseline (see adeff/verify_report_s3_e2e.json, original work tree).
# The single full run OOMs in this 6 GB cell (killed ~57 s in), so the
# run is split by subject, ~81-way (SEX x AGE cells in chunks of at
# most ~27 subjects); the engine's memory is superlinear in the
# subject set (a 53-subject partition OOMs past 6 GB while its
# ~27-subject halves run at 1.5-2.4 GB peak). The pruned-group
# baseline is preserved as verify_report.json.
# Honest gaps: none in the derivation (see the generator header for
# the tie, the dead AE merge, the unexercised severe pcrdt-14
# fallback, and the FIRST_SEV filter-precedence fix).
yamaa: '1.0'
type: spec
model: ADaM
parent: ../../../spec/yamaa/base/adam-base-s3.yaml
domain: ADEFF
keys:
- STUDYID
- USUBJID
- PARAMCD
- ADT
- ASEQ
input:
  MB: <sdtm-dir>/mb.parquet
  CE: <sdtm-dir>/ce.parquet
  AE: <sdtm-dir>/ae.parquet
  SUPPCE: <sdtm-dir>/suppce.parquet
  SUPPAE: <sdtm-dir>/suppae.parquet
  ADSYMP:
    path: <adam-dir>/adsymp.parquet
    key:
    - STUDYID
    - USUBJID
    - SUBJID
  ADIS:
    path: <adam-dir>/adis.parquet
    key:
    - STUDYID
    - USUBJID
    - SUBJID
  ADSL:
    path: <adam-dir>/adsl.parquet
    key:
    - STUDYID
    - USUBJID
submission:
  label: Efficacy Analysis Dataset
  class: BASIC DATA STRUCTURE
  structure: One record per subject per efficacy parameter per analysis date
  repeating: true
rows:
- id: covid_rows
  dataset: PAIR_CO
  group_by: [PAIR_CO.STUDYID, PAIR_CO.USUBJID, PAIR_CO.SUBJID, PAIR_CO._MBDTN_EPOCH]
  derivations:
    STUDYID: PAIR_CO.STUDYID
    USUBJID: PAIR_CO.USUBJID
    PARAMCD: '''COVID'''
    _PCRDT:
      aggregate:
        filter: PAIR_CO._MBDTN IS NOT NULL AND PAIR_CO._RANDFL = 'Y' AND (PAIR_CO._TR01SDT IS NULL OR PAIR_CO._MBDTN > PAIR_CO._TR01SDT)
        expr: MAX(PAIR_CO._MBDTN)
    _A_CHILLS:
      aggregate:
        filter: PAIR_CO._PCD = 'CHILLS' AND PAIR_CO._IS_EXCL = 0 AND PAIR_CO._RANDFL = 'Y' AND (PAIR_CO._TR01SDT IS NULL OR PAIR_CO._MBDTN > PAIR_CO._TR01SDT)
        expr: MIN(PAIR_CO._ADT)
    _A0_CHILLS:
      aggregate:
        filter: PAIR_CO._PCD = 'CHILLS' AND PAIR_CO._IS_EXCL = 0 AND PAIR_CO._REV0 = 1 AND PAIR_CO._RANDFL = 'Y' AND (PAIR_CO._TR01SDT IS NULL OR PAIR_CO._MBDTN > PAIR_CO._TR01SDT)
        expr: MIN(PAIR_CO._ADT)
    _A_FEVER:
      aggregate:
        filter: PAIR_CO._PCD = 'FEVER' AND PAIR_CO._IS_EXCL = 0 AND PAIR_CO._RANDFL = 'Y' AND (PAIR_CO._TR01SDT IS NULL OR PAIR_CO._MBDTN > PAIR_CO._TR01SDT)
        expr: MIN(PAIR_CO._ADT)
    _A0_FEVER:
      aggregate:
        filter: PAIR_CO._PCD = 'FEVER' AND PAIR_CO._IS_EXCL = 0 AND PAIR_CO._REV0 = 1 AND PAIR_CO._RANDFL = 'Y' AND (PAIR_CO._TR01SDT IS NULL OR PAIR_CO._MBDTN > PAIR_CO._TR01SDT)
        expr: MIN(PAIR_CO._ADT)
    _A_HEADACHE:
      aggregate:
        filter: PAIR_CO._PCD = 'HEADACHE' AND PAIR_CO._IS_EXCL = 0 AND PAIR_CO._RANDFL = 'Y' AND (PAIR_CO._TR01SDT IS NULL OR PAIR_CO._MBDTN > PAIR_CO._TR01SDT)
        expr: MIN(PAIR_CO._ADT)
    _A0_HEADACHE:
      aggregate:
        filter: PAIR_CO._PCD = 'HEADACHE' AND PAIR_CO._IS_EXCL = 0 AND PAIR_CO._REV0 = 1 AND PAIR_CO._RANDFL = 'Y' AND (PAIR_CO._TR01SDT IS NULL OR PAIR_CO._MBDTN > PAIR_CO._TR01SDT)
        expr: MIN(PAIR_CO._ADT)
    _A_MYALGIA:
      aggregate:
        filter: PAIR_CO._PCD = 'MYALGIA' AND PAIR_CO._IS_EXCL = 0 AND PAIR_CO._RANDFL = 'Y' AND (PAIR_CO._TR01SDT IS NULL OR PAIR_CO._MBDTN > PAIR_CO._TR01SDT)
        expr: MIN(PAIR_CO._ADT)
    _A0_MYALGIA:
      aggregate:
        filter: PAIR_CO._PCD = 'MYALGIA' AND PAIR_CO._IS_EXCL = 0 AND PAIR_CO._REV0 = 1 AND PAIR_CO._RANDFL = 'Y' AND (PAIR_CO._TR01SDT IS NULL OR PAIR_CO._MBDTN > PAIR_CO._TR01SDT)
        expr: MIN(PAIR_CO._ADT)
    _A_NLTASTE:
      aggregate:
        filter: PAIR_CO._PCD = 'NLTASTE' AND PAIR_CO._IS_EXCL = 0 AND PAIR_CO._RANDFL = 'Y' AND (PAIR_CO._TR01SDT IS NULL OR PAIR_CO._MBDTN > PAIR_CO._TR01SDT)
        expr: MIN(PAIR_CO._ADT)
    _A0_NLTASTE:
      aggregate:
        filter: PAIR_CO._PCD = 'NLTASTE' AND PAIR_CO._IS_EXCL = 0 AND PAIR_CO._REV0 = 1 AND PAIR_CO._RANDFL = 'Y' AND (PAIR_CO._TR01SDT IS NULL OR PAIR_CO._MBDTN > PAIR_CO._TR01SDT)
        expr: MIN(PAIR_CO._ADT)
    _A_STHROAT:
      aggregate:
        filter: PAIR_CO._PCD = 'STHROAT' AND PAIR_CO._IS_EXCL = 0 AND PAIR_CO._RANDFL = 'Y' AND (PAIR_CO._TR01SDT IS NULL OR PAIR_CO._MBDTN > PAIR_CO._TR01SDT)
        expr: MIN(PAIR_CO._ADT)
    _A0_STHROAT:
      aggregate:
        filter: PAIR_CO._PCD = 'STHROAT' AND PAIR_CO._IS_EXCL = 0 AND PAIR_CO._REV0 = 1 AND PAIR_CO._RANDFL = 'Y' AND (PAIR_CO._TR01SDT IS NULL OR PAIR_CO._MBDTN > PAIR_CO._TR01SDT)
        expr: MIN(PAIR_CO._ADT)
    _MIN1:
      least: {sources: [_A_CHILLS, _A_FEVER, _A_HEADACHE, _A_MYALGIA, _A_NLTASTE, _A_STHROAT]}
    _EQ_CHILLS:
      case:
      - when: _A_CHILLS = _MIN1
        then: 1
      - otherwise: 0
    _EQ_FEVER:
      case:
      - when: _A_FEVER = _MIN1
        then: 1
      - otherwise: 0
    _EQ_HEADACHE:
      case:
      - when: _A_HEADACHE = _MIN1
        then: 1
      - otherwise: 0
    _EQ_MYALGIA:
      case:
      - when: _A_MYALGIA = _MIN1
        then: 1
      - otherwise: 0
    _EQ_NLTASTE:
      case:
      - when: _A_NLTASTE = _MIN1
        then: 1
      - otherwise: 0
    _EQ_STHROAT:
      case:
      - when: _A_STHROAT = _MIN1
        then: 1
      - otherwise: 0
    _N1: _EQ_CHILLS + _EQ_FEVER + _EQ_HEADACHE + _EQ_MYALGIA + _EQ_NLTASTE + _EQ_STHROAT
    _ABOVE_CHILLS:
      case:
      - when: _A_CHILLS > _MIN1
        then: _A_CHILLS
    _ABOVE_FEVER:
      case:
      - when: _A_FEVER > _MIN1
        then: _A_FEVER
    _ABOVE_HEADACHE:
      case:
      - when: _A_HEADACHE > _MIN1
        then: _A_HEADACHE
    _ABOVE_MYALGIA:
      case:
      - when: _A_MYALGIA > _MIN1
        then: _A_MYALGIA
    _ABOVE_NLTASTE:
      case:
      - when: _A_NLTASTE > _MIN1
        then: _A_NLTASTE
    _ABOVE_STHROAT:
      case:
      - when: _A_STHROAT > _MIN1
        then: _A_STHROAT
    _ABOVE_LEAST:
      least: {sources: [_ABOVE_CHILLS, _ABOVE_FEVER, _ABOVE_HEADACHE, _ABOVE_MYALGIA, _ABOVE_NLTASTE, _ABOVE_STHROAT]}
    _ONSET1:
      case:
      - when: _N1 >= 2
        then: _MIN1
      - otherwise: _ABOVE_LEAST
    _CUM_CHILLS: _EQ_CHILLS
    _CUM_FEVER: _EQ_CHILLS + _EQ_FEVER
    _CUM_HEADACHE: _EQ_CHILLS + _EQ_FEVER + _EQ_HEADACHE
    _CUM_MYALGIA: _EQ_CHILLS + _EQ_FEVER + _EQ_HEADACHE + _EQ_MYALGIA
    _CUM_NLTASTE: _EQ_CHILLS + _EQ_FEVER + _EQ_HEADACHE + _EQ_MYALGIA + _EQ_NLTASTE
    _CUM_STHROAT: _EQ_CHILLS + _EQ_FEVER + _EQ_HEADACHE + _EQ_MYALGIA + _EQ_NLTASTE + _EQ_STHROAT
    _F_CHILLS:
      case:
      - when: _A0_CHILLS = _A_CHILLS
        then: 1
      - otherwise: 0
    _F_FEVER:
      case:
      - when: _A0_FEVER = _A_FEVER
        then: 1
      - otherwise: 0
    _F_HEADACHE:
      case:
      - when: _A0_HEADACHE = _A_HEADACHE
        then: 1
      - otherwise: 0
    _F_MYALGIA:
      case:
      - when: _A0_MYALGIA = _A_MYALGIA
        then: 1
      - otherwise: 0
    _F_NLTASTE:
      case:
      - when: _A0_NLTASTE = _A_NLTASTE
        then: 1
      - otherwise: 0
    _F_STHROAT:
      case:
      - when: _A0_STHROAT = _A_STHROAT
        then: 1
      - otherwise: 0
    _EQAB_CHILLS:
      case:
      - when: _A_CHILLS = _ABOVE_LEAST
        then: 1
      - otherwise: 0
    _EQAB_FEVER:
      case:
      - when: _A_FEVER = _ABOVE_LEAST
        then: 1
      - otherwise: 0
    _EQAB_HEADACHE:
      case:
      - when: _A_HEADACHE = _ABOVE_LEAST
        then: 1
      - otherwise: 0
    _EQAB_MYALGIA:
      case:
      - when: _A_MYALGIA = _ABOVE_LEAST
        then: 1
      - otherwise: 0
    _EQAB_NLTASTE:
      case:
      - when: _A_NLTASTE = _ABOVE_LEAST
        then: 1
      - otherwise: 0
    _EQAB_STHROAT:
      case:
      - when: _A_STHROAT = _ABOVE_LEAST
        then: 1
      - otherwise: 0
    _CUMAB_CHILLS: _EQAB_CHILLS
    _CUMAB_FEVER: _EQAB_CHILLS + _EQAB_FEVER
    _CUMAB_HEADACHE: _EQAB_CHILLS + _EQAB_FEVER + _EQAB_HEADACHE
    _CUMAB_MYALGIA: _EQAB_CHILLS + _EQAB_FEVER + _EQAB_HEADACHE + _EQAB_MYALGIA
    _CUMAB_NLTASTE: _EQAB_CHILLS + _EQAB_FEVER + _EQAB_HEADACHE + _EQAB_MYALGIA + _EQAB_NLTASTE
    _CUMAB_STHROAT: _EQAB_CHILLS + _EQAB_FEVER + _EQAB_HEADACHE + _EQAB_MYALGIA + _EQAB_NLTASTE + _EQAB_STHROAT
    _REV0_1:
      case:
      - when: _N1 >= 2 AND _CUM_CHILLS = 2
        then: _F_CHILLS
      - when: _N1 >= 2 AND _CUM_FEVER = 2
        then: _F_FEVER
      - when: _N1 >= 2 AND _CUM_HEADACHE = 2
        then: _F_HEADACHE
      - when: _N1 >= 2 AND _CUM_MYALGIA = 2
        then: _F_MYALGIA
      - when: _N1 >= 2 AND _CUM_NLTASTE = 2
        then: _F_NLTASTE
      - when: _N1 >= 2 AND _CUM_STHROAT = 2
        then: _F_STHROAT
      - when: _N1 = 1 AND _CUMAB_CHILLS = 1
        then: _F_CHILLS
      - when: _N1 = 1 AND _CUMAB_FEVER = 1
        then: _F_FEVER
      - when: _N1 = 1 AND _CUMAB_HEADACHE = 1
        then: _F_HEADACHE
      - when: _N1 = 1 AND _CUMAB_MYALGIA = 1
        then: _F_MYALGIA
      - when: _N1 = 1 AND _CUMAB_NLTASTE = 1
        then: _F_NLTASTE
      - when: _N1 = 1 AND _CUMAB_STHROAT = 1
        then: _F_STHROAT
      - otherwise: 0
    _B_CEPNEU:
      aggregate:
        filter: PAIR_CO._PCD = 'CEPNEU' AND PAIR_CO._IS_EXCL = 0 AND PAIR_CO._RANDFL = 'Y' AND (PAIR_CO._TR01SDT IS NULL OR PAIR_CO._MBDTN > PAIR_CO._TR01SDT)
        expr: MIN(PAIR_CO._ADT)
    _B0_CEPNEU:
      aggregate:
        filter: PAIR_CO._PCD = 'CEPNEU' AND PAIR_CO._IS_EXCL = 0 AND PAIR_CO._REV0 = 1 AND PAIR_CO._RANDFL = 'Y' AND (PAIR_CO._TR01SDT IS NULL OR PAIR_CO._MBDTN > PAIR_CO._TR01SDT)
        expr: MIN(PAIR_CO._ADT)
    _B_COUGH:
      aggregate:
        filter: PAIR_CO._PCD = 'COUGH' AND PAIR_CO._IS_EXCL = 0 AND PAIR_CO._RANDFL = 'Y' AND (PAIR_CO._TR01SDT IS NULL OR PAIR_CO._MBDTN > PAIR_CO._TR01SDT)
        expr: MIN(PAIR_CO._ADT)
    _B0_COUGH:
      aggregate:
        filter: PAIR_CO._PCD = 'COUGH' AND PAIR_CO._IS_EXCL = 0 AND PAIR_CO._REV0 = 1 AND PAIR_CO._RANDFL = 'Y' AND (PAIR_CO._TR01SDT IS NULL OR PAIR_CO._MBDTN > PAIR_CO._TR01SDT)
        expr: MIN(PAIR_CO._ADT)
    _B_DIBREATH:
      aggregate:
        filter: PAIR_CO._PCD = 'DIBREATH' AND PAIR_CO._IS_EXCL = 0 AND PAIR_CO._RANDFL = 'Y' AND (PAIR_CO._TR01SDT IS NULL OR PAIR_CO._MBDTN > PAIR_CO._TR01SDT)
        expr: MIN(PAIR_CO._ADT)
    _B0_DIBREATH:
      aggregate:
        filter: PAIR_CO._PCD = 'DIBREATH' AND PAIR_CO._IS_EXCL = 0 AND PAIR_CO._REV0 = 1 AND PAIR_CO._RANDFL = 'Y' AND (PAIR_CO._TR01SDT IS NULL OR PAIR_CO._MBDTN > PAIR_CO._TR01SDT)
        expr: MIN(PAIR_CO._ADT)
    _B_REPNEU:
      aggregate:
        filter: PAIR_CO._PCD = 'REPNEU' AND PAIR_CO._IS_EXCL = 0 AND PAIR_CO._RANDFL = 'Y' AND (PAIR_CO._TR01SDT IS NULL OR PAIR_CO._MBDTN > PAIR_CO._TR01SDT)
        expr: MIN(PAIR_CO._ADT)
    _B0_REPNEU:
      aggregate:
        filter: PAIR_CO._PCD = 'REPNEU' AND PAIR_CO._IS_EXCL = 0 AND PAIR_CO._REV0 = 1 AND PAIR_CO._RANDFL = 'Y' AND (PAIR_CO._TR01SDT IS NULL OR PAIR_CO._MBDTN > PAIR_CO._TR01SDT)
        expr: MIN(PAIR_CO._ADT)
    _B_SHBREATH:
      aggregate:
        filter: PAIR_CO._PCD = 'SHBREATH' AND PAIR_CO._IS_EXCL = 0 AND PAIR_CO._RANDFL = 'Y' AND (PAIR_CO._TR01SDT IS NULL OR PAIR_CO._MBDTN > PAIR_CO._TR01SDT)
        expr: MIN(PAIR_CO._ADT)
    _B0_SHBREATH:
      aggregate:
        filter: PAIR_CO._PCD = 'SHBREATH' AND PAIR_CO._IS_EXCL = 0 AND PAIR_CO._REV0 = 1 AND PAIR_CO._RANDFL = 'Y' AND (PAIR_CO._TR01SDT IS NULL OR PAIR_CO._MBDTN > PAIR_CO._TR01SDT)
        expr: MIN(PAIR_CO._ADT)
    _MIN2:
      least: {sources: [_B_CEPNEU, _B_COUGH, _B_DIBREATH, _B_REPNEU, _B_SHBREATH]}
    _G_CEPNEU:
      case:
      - when: _B0_CEPNEU = _B_CEPNEU
        then: 1
      - otherwise: 0
    _G_COUGH:
      case:
      - when: _B0_COUGH = _B_COUGH
        then: 1
      - otherwise: 0
    _G_DIBREATH:
      case:
      - when: _B0_DIBREATH = _B_DIBREATH
        then: 1
      - otherwise: 0
    _G_REPNEU:
      case:
      - when: _B0_REPNEU = _B_REPNEU
        then: 1
      - otherwise: 0
    _G_SHBREATH:
      case:
      - when: _B0_SHBREATH = _B_SHBREATH
        then: 1
      - otherwise: 0
    _EQB_CEPNEU:
      case:
      - when: _B_CEPNEU = _MIN2
        then: 1
      - otherwise: 0
    _EQB_COUGH:
      case:
      - when: _B_COUGH = _MIN2
        then: 1
      - otherwise: 0
    _EQB_DIBREATH:
      case:
      - when: _B_DIBREATH = _MIN2
        then: 1
      - otherwise: 0
    _EQB_REPNEU:
      case:
      - when: _B_REPNEU = _MIN2
        then: 1
      - otherwise: 0
    _EQB_SHBREATH:
      case:
      - when: _B_SHBREATH = _MIN2
        then: 1
      - otherwise: 0
    _CUMB_CEPNEU: _EQB_CEPNEU
    _CUMB_COUGH: _EQB_CEPNEU + _EQB_COUGH
    _CUMB_DIBREATH: _EQB_CEPNEU + _EQB_COUGH + _EQB_DIBREATH
    _CUMB_REPNEU: _EQB_CEPNEU + _EQB_COUGH + _EQB_DIBREATH + _EQB_REPNEU
    _CUMB_SHBREATH: _EQB_CEPNEU + _EQB_COUGH + _EQB_DIBREATH + _EQB_REPNEU + _EQB_SHBREATH
    _REV0_2:
      case:
      - when: _CUMB_CEPNEU = 1
        then: _G_CEPNEU
      - when: _CUMB_COUGH = 1
        then: _G_COUGH
      - when: _CUMB_DIBREATH = 1
        then: _G_DIBREATH
      - when: _CUMB_REPNEU = 1
        then: _G_REPNEU
      - when: _CUMB_SHBREATH = 1
        then: _G_SHBREATH
      - otherwise: 0
    _ONSET:
      least: {sources: [_ONSET1, _MIN2]}
    _REV0:
      case:
      - when: _ONSET1 IS NOT NULL AND (_MIN2 IS NULL OR _ONSET1 < _MIN2)
        then: _REV0_1
      - otherwise: _REV0_2
    ADT:
      greatest: {sources: [_ONSET, _PCRDT]}
    PCRDT: _PCRDT
    PCRD29FL:
      case:
      - when: _REV0 = 1
        then: '''Y'''
      - otherwise: "''"
    AVISIT: "''"
    AVISITN: null
    EVIDINF: "''"
    _ADT_EPOCH:
      to_epoch_day:
        source: ADT
    _PCRDT_EPOCH:
      to_epoch_day:
        source: PCRDT
    _ONSET_SD: null
    _MIN0_SD: null
    _REV0_SD: null
    _MIN_ADIS_ADT: null
    _MIN_MBDTN: null
    _MIN_MB_D29: null
    _COVID_ADT: null
    _SEV_ADT_DATE: null
    _HAS_AENDT: null
    _SEV_ADT_FINAL: null
    _MAXDT: null
    _PCRDT_DT: null
    _DTHDT: null
    _TR01SDT: null
    _TR01SDT_EPOCH: null
    _PCRDT_DT_EPOCH: null
    _HAS_AE: null
    _CESTDTC: null
    _MIN_CRIT5_ADT: null
    _MIN_MB_AT: null
    _MIN_ADT_V3: null
    _MIN_ADT_V4: null
    _MIN_ADT_V6: null
    _MIN_ADT_V10: null
    _MIN_ADT_V11: null
    _MIN_ADT_V12: null
    _MIN_COV_ADT: null
    _MINADT: null
    _HAS_MB: null
    _HAS_COMP: null
    _RANDFL: null
  filter: _ONSET IS NOT NULL
- id: covids_rows
  dataset: PAIR_CO
  group_by: [PAIR_CO.STUDYID, PAIR_CO.USUBJID, PAIR_CO.SUBJID, PAIR_CO._MBDTN_EPOCH]
  derivations:
    STUDYID: PAIR_CO.STUDYID
    USUBJID: PAIR_CO.USUBJID
    PARAMCD: '''COVIDS'''
    _PCRDT:
      aggregate:
        filter: PAIR_CO._MBDTN IS NOT NULL AND PAIR_CO._RANDFL = 'Y' AND (PAIR_CO._TR01SDT IS NULL OR PAIR_CO._MBDTN > PAIR_CO._TR01SDT)
        expr: MAX(PAIR_CO._MBDTN)
    _A_CHILLS:
      aggregate:
        filter: PAIR_CO._PCD = 'CHILLS' AND PAIR_CO._RANDFL = 'Y' AND (PAIR_CO._TR01SDT IS NULL OR PAIR_CO._MBDTN > PAIR_CO._TR01SDT)
        expr: MIN(PAIR_CO._ADT)
    _A0_CHILLS:
      aggregate:
        filter: PAIR_CO._PCD = 'CHILLS' AND PAIR_CO._REV0 = 1 AND PAIR_CO._RANDFL = 'Y' AND (PAIR_CO._TR01SDT IS NULL OR PAIR_CO._MBDTN > PAIR_CO._TR01SDT)
        expr: MIN(PAIR_CO._ADT)
    _A_FEVER:
      aggregate:
        filter: PAIR_CO._PCD = 'FEVER' AND PAIR_CO._RANDFL = 'Y' AND (PAIR_CO._TR01SDT IS NULL OR PAIR_CO._MBDTN > PAIR_CO._TR01SDT)
        expr: MIN(PAIR_CO._ADT)
    _A0_FEVER:
      aggregate:
        filter: PAIR_CO._PCD = 'FEVER' AND PAIR_CO._REV0 = 1 AND PAIR_CO._RANDFL = 'Y' AND (PAIR_CO._TR01SDT IS NULL OR PAIR_CO._MBDTN > PAIR_CO._TR01SDT)
        expr: MIN(PAIR_CO._ADT)
