- id: SY
  dataset: ADSYMP
  filter: ADSYMP.AVALC IN ('Y', 'YES') AND ADSYMP.PARAMCD IN ('BODYACHE', 'CEPNEU', 'CHILLS', 'COUGH', 'DIARRHEA', 'DIBREATH', 'FATIGUE', 'FEVER', 'HEADACHE', 'MYALGIA', 'NASALCON', 'NAUSEA', 'NLSMELL', 'NLTASTE', 'REPNEU', 'RUNNOSE', 'SHBREATH', 'STHROAT', 'VOMIT')
  columns:
  - _USUBJID
  - _SUBJID
  - _PCD
  - _PCD_RAW
  - _ADT
  - _ADT_RAW
  - _ADT_EPOCH
  - _ADT_RAW_EPOCH
  derivations:
    _USUBJID:
      type: str
      derivation:
        str_template:
          template: '{ADSYMP.USUBJID}'
          missing: ''
    _SUBJID:
      type: str
      derivation:
        str_template:
          template: '{ADSYMP.SUBJID}'
          missing: ''
    _PCD:
      type: str
      derivation:
        case:
        - when: ADSYMP.PARAMCD = 'NLSMELL'
          then: '''NLTASTE'''
        - when: ADSYMP.PARAMCD = 'BODYACHE'
          then: '''MYALGIA'''
        - otherwise: ADSYMP.PARAMCD
    _PCD_RAW:
      type: str
      derivation: ADSYMP.PARAMCD
    _ADT:
      type: date
      derivation:
        case:
        - when: ADSYMP.PARAMCD IN ('CEPNEU', 'REPNEU') AND ADSYMP.ASTDT IS NOT NULL
          then: ADSYMP.ASTDT
        - otherwise: ADSYMP.ADT
    _ADT_RAW:
      type: date
      derivation: ADSYMP.ADT
    _ADT_EPOCH:
      type: int
      derivation:
        to_epoch_day:
          source: _ADT
    _ADT_RAW_EPOCH:
      type: int
      derivation:
        to_epoch_day:
          source: _ADT_RAW
