- id: asympinf_rows
  dataset: ADSL
  group_by: [ADSL.USUBJID]
  derivations:
    STUDYID: ADSL_LK.STUDYID
    USUBJID: ADSL.USUBJID
    PARAMCD: '''ASYMPINF'''
    _RANDFL: ADSL_LK.RANDFL
    _MIN_CRIT5_ADT: FIRST_ADIS_A._ADT
    _MIN_MB_AT: FIRST_MB_AT._MBDTN
    _MIN_MB_D29: FIRST_MB_D29._MBDTN
    _MIN_ADT_V3: FIRST_ADIS_V3._ADT
    _MIN_ADT_V4: FIRST_ADIS_V4._ADT
    _MIN_ADT_V6: FIRST_ADIS_V6._ADT
    _MIN_ADT_V10: FIRST_ADIS_V10._ADT
    _MIN_ADT_V11: FIRST_ADIS_V11._ADT
    _MIN_ADT_V12: FIRST_ADIS_V12._ADT
    _MIN_COV_ADT: FIRST_COV.ADT
    _MINADT:
      least: {sources: [_MIN_CRIT5_ADT, _MIN_MB_AT]}
    _HAS_MB:
      case:
      - when: _MIN_MB_AT = _MINADT
        then: 1
      - otherwise: 0
    _HAS_COMP:
      case:
      - when: _MIN_COV_ADT IS NOT NULL AND _MIN_COV_ADT <= _MINADT
        then: 1
      - otherwise: 0
    ADT: _MINADT
    PCRDT:
      case:
      - when: (_MIN_CRIT5_ADT IS NULL OR _MIN_CRIT5_ADT <> _MINADT) OR _MIN_MB_AT = _MINADT
        then: _MINADT
    PCRD29FL:
      case:
      - when: PCRDT IS NOT NULL AND _MIN_MB_D29 = _MINADT
        then: '''Y'''
      - otherwise: "''"
    EVIDINF:
      case:
      - when: _HAS_MB = 1 AND _MIN_CRIT5_ADT = _MINADT
        then: '''Virology and Serology'''
      - when: _HAS_MB = 1
        then: '''Virology'''
      - when: _MIN_CRIT5_ADT = _MINADT
        then: '''Serology'''
      - otherwise: "''"
    AVISITN:
      case:
      - when: _HAS_MB = 1 AND _MIN_MB_D29 = _MINADT
        then: 3
      - when: _HAS_MB = 1
        then: 10
      - when: _MIN_ADT_V3 = _MINADT
        then: 3
      - when: _MIN_ADT_V4 = _MINADT
        then: 4
      - when: _MIN_ADT_V6 = _MINADT
        then: 6
      - when: _MIN_ADT_V10 = _MINADT
        then: 10
      - when: _MIN_ADT_V11 = _MINADT
        then: 11
      - when: _MIN_ADT_V12 = _MINADT
        then: 12
    AVISIT:
      case:
      - when: AVISITN = 3
        then: '''Day 29'''
      - when: AVISITN = 4
        then: '''Day 57'''
      - when: AVISITN = 6
        then: '''Day 209'''
      - when: AVISITN = 10
        then: '''Participant Decision Visit / OL-D1'''
      - when: AVISITN = 11
        then: '''Open Label Day 29'''
      - when: AVISITN = 12
        then: '''Open Label Day 57'''
      - otherwise: "''"
    _ADT_EPOCH:
      to_epoch_day:
        source: ADT
    _PCRDT_EPOCH:
      to_epoch_day:
        source: PCRDT
