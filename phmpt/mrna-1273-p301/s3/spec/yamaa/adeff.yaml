  - variable: ADSYMP._SEV_CAND_DATE
    nulls: last
  keep: first
  columns: [_SEV_CAND_DATE]
  derivations:
    _ADT:
      type: date
      derivation: ADSYMP.ADT
    _ADT_EPOCH:
      type: int
      derivation:
        to_epoch_day:
          source: _ADT
    _ASTDT:
      type: date
      derivation: ADSYMP.ASTDT
    _AENDT:
      type: date
      derivation: ADSYMP.AENDT
    _ASTDT2:
      type: date
      derivation:
        case:
        - when: ADSYMP.PARAMCD = 'O2SAT93'
          then: _ADT
        - when: _ASTDT IS NULL AND _AENDT IS NULL
          then: _ADT
        - otherwise: _ASTDT
    _ASTDT2_EPOCH:
      type: int
      derivation:
        to_epoch_day:
          source: _ASTDT2
    _AENDT_EPOCH:
      type: int
      derivation:
        to_epoch_day:
          source: _AENDT
    _SEV_CAND_DATE:
      type: date
      derivation:
        case:
        - when: _ASTDT2_EPOCH IS NOT NULL AND _ASTDT2_EPOCH < PAIR_CO._MBDTN_EPOCH - 14 AND _AENDT_EPOCH > PAIR_CO._MBDTN_EPOCH + 28
          then: _ASTDT2
        - when: PAIR_CO._MBDTN_EPOCH - 14 <= _ASTDT2_EPOCH AND _ASTDT2_EPOCH <= PAIR_CO._MBDTN_EPOCH + 28
          then: _ASTDT2
        - otherwise: _ADT
