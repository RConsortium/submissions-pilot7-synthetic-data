- name: PARCAT1
  type: str
  label: Parameter Category 1
  derivation:
    case:
    - when: PARAMCD IN ('COVIDA', 'COVIDSVA', 'ASYMPINA')
      then: '''DERIVED PER ADJUDICATION'''
    - otherwise: '''DERIVED PER SAP'''
  submission:
    core: Req
    mandatory: true
    length: 50
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: PARAMCD
  type: str
  label: Parameter Code
  submission:
    core: Req
    mandatory: true
    length: 8
    origins:
    - type: Assigned
    method: "Withheld from publication: the received define states this text."
- name: PARAM
  type: str
  label: Parameter
  derivation:
    mapping:
      source: PARAMCD
      dict:
        ASYMPINA: 'Asymptomatic SARS-CoV-2 Infection per Adjudication'
        ASYMPINF: 'Asymptomatic SARS-CoV-2 Infection'
        COVID: 'COVID-19'
        COVIDA: 'COVID-19 per Adjudication'
        COVIDS: 'COVID-19 (Considering Scheduled RT-PCR)'
        COVIDSD: 'COVID-19 (Secondary Definition)'
        COVIDSDS: 'COVID-19 (Secondary Definition and Considering Scheduled RT-PCR)'
        COVIDSEV: 'Severe COVID-19'
        COVIDSVA: 'Severe COVID-19 per Adjudication'
        COVIDSVS: 'Severe COVID-19 (Considering Scheduled RT-PCR)'
        DEATHCVD: 'Death Caused by COVID-19'
        INFECT: 'SARS-CoV-2 Infection Regardless of Symptomatology or Severity'
      unmapped: null
  submission:
    core: Req
    mandatory: true
    length: 200
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
