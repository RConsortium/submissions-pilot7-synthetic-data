        TTASYMP6: Time to Asymptomatic SARS-CoV-2 Infection 35 Days after Dose 2 (Days)
        TTASYMP9: Time to Asymptomatic SARS-CoV-2 Infection in Open Label Phase (Days)
        TTCVDC1: Time to COVID-19 (Considering Scheduled RT-PCR and Prior Infection Censoring) 14 Days after Dose 2 (Days)
        TTCVDC2: Time to COVID-19 (Considering Scheduled RT-PCR and Prior Infection Censoring) after Dose 2 (Days)
        TTCVDC3: Time to COVID-19 (Considering Scheduled RT-PCR and Prior Infection Censoring) 14 Days after Dose 1 (Days)
        TTCVDC4: Time to COVID-19 (Considering Scheduled RT-PCR and Prior Infection Censoring) after Dose 1 (Days)
        TTCVDC5: Time to COVID-19 (Considering Scheduled RT-PCR and Prior Infection Censoring) after Randomization (Days)
        TTCVDC6: Time to COVID-19 (Considering Scheduled RT-PCR and Prior Infection Censoring) 35 Days after Dose 2 (Days)
        TTCVDC9: Time to COVID-19 (Considering Scheduled RT-PCR and Prior Infection Censoring) in Open Label Phase (Days)
        TTDEATH: Time to All-Cause Death after Randomization (Days)
        TTDEATH9: Time to All-Cause Death in Open Label Phase (Days)
        TTDTHCV1: Time to Death Caused by COVID-19 14 Days after Dose 2 (Days)
        TTDTHCV2: Time to Death Caused by COVID-19 after Dose 2 (Days)
        TTDTHCV3: Time to Death Caused by COVID-19 14 Days after Dose 1 (Days)
        TTDTHCV4: Time to Death Caused by COVID-19 after Dose 1 (Days)
        TTDTHCV5: Time to Death Caused by COVID-19 after Randomization (Days)
        TTDTHCV6: Time to Death Caused by COVID-19 35 Days after Dose 2 (Days)
        TTDTHCV9: Time to Death Caused by COVID-19 in Open Label Phase (Days)
        TTINF1: Time to SARS-CoV-2 Infection Regardless of Symptomatology or Severity 14 Days after Dose 2 (Days)
        TTINF2: Time to SARS-CoV-2 Infection Regardless of Symptomatology or Severity after Dose 2 (Days)
        TTINF3: Time to SARS-CoV-2 Infection Regardless of Symptomatology or Severity 14 Days after Dose 1 (Days)
        TTINF4: Time to SARS-CoV-2 Infection Regardless of Symptomatology or Severity after Dose 1 (Days)
        TTINF5: Time to SARS-CoV-2 Infection Regardless of Symptomatology or Severity after Randomization (Days)
        TTINF6: Time to SARS-CoV-2 Infection Regardless of Symptomatology or Severity 35 Days after Dose 2 (Days)
        TTINF9: Time to SARS-CoV-2 Infection Regardless of Symptomatology or Severity in Open Label Phase (Days)
      unmapped: null
  submission:
    core: Req
    mandatory: true
    length: 200
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: PARAMCD
  type: str
  label: Parameter Code
  submission:
    core: Req
    mandatory: true
    length: 8
    origins:
    - type: Assigned
- name: STARTDT
  type: date
  label: Time-to-Event Origin Date for Subject
  derivation:
    case:
    - when: PARAMCD IN ('TTCVDC9', 'TCVDSVC9', 'TCVDSDC9', 'TTASYMP9', 'TTASYCR9', 'TTINF9', 'TTDTHCV9', 'TTDEATH9')
      then: ADSL.AP02SDT
    - otherwise: ADSL.RANDDT
  submission:
    core: Req
    mandatory: true
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: ADT
  type: date
  label: Analysis Date
  derivation:
    case:
    - when: _ADT_RAW IS NOT NULL AND STARTDT IS NOT NULL AND _ADT_RAW < STARTDT
      then: STARTDT
    - otherwise: _ADT_RAW
  submission:
    core: Req
    mandatory: true
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: APERIOD
  type: int
  label: Period
  derivation:
    case:
    - when: ADSL.AP02SDT IS NOT NULL AND ADSL.AP02SDT <= ADT
      then: 2
    - otherwise: 1
  submission:
    core: Perm
    mandatory: false
    length: 8
    display_format: '3.'
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: AVAL
  type: int
  label: Analysis Value
  derivation:
    study_day:
      source: ADT
      reference: STARTDT
  submission:
    core: Req
    mandatory: true
    length: 8
    display_format: '3.'
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: CNSR
  type: int
  label: Censor
  derivation: _CNSR_RAW
  submission:
    core: Req
    mandatory: true
    length: 8
    display_format: '3.'
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: EVNTDESC
  type: str
  label: Event or Censoring Description
  derivation: _EVNTDESC_RAW
  submission:
    core: Req
    mandatory: true
    length: 200
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
