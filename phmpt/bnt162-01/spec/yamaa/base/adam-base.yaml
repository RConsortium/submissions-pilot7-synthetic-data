# Parent layer for the BNT162-01 ADaM specifications.
#
# Declares the section 3.1 core columns shared by every BNT162-01 ADaM
# dataset (type, label, core/mandatory/length) with NO derivations and NO
# origins: other datasets take these columns from ADSL, not from DM, so a
# DM-based derivation or a DM Predecessor origin in this layer would be
# wrong for them. Each dataset spec supplies its own derivations and
# origins, which merge field-by-field over this layer. Lengths are the
# 27034-cut values; the 125742 cut lengthens ARM/ACTARM to 24 and TRT01P/
# TRT01A to 13, which that cut's spec declares. See the study's spec/review/README.md.
yamaa: '1.0'
type: spec
model: ADaM
columns:
- name: STUDYID
  type: str
  label: Study Identifier
  submission:
    core: Req
    mandatory: true
    length: 9
- name: USUBJID
  type: str
  label: Unique Subject Identifier
  submission:
    core: Req
    mandatory: true
    length: 21
- name: SUBJID
  type: str
  label: Subject Identifier for the Study
  submission:
    core: Req
    mandatory: true
    length: 5
- name: SITEID
  type: str
  label: Study Site Identifier
  submission:
    core: Req
    mandatory: true
    length: 12
- name: AGE
  type: int
  label: Age
  submission:
    core: Req
    mandatory: true
    length: 8
    display_format: '3.'
- name: AGEU
  type: str
  label: Age Units
  submission:
    core: Req
    mandatory: true
    length: 5
- name: SEX
  type: str
  label: Sex
  submission:
    core: Req
    mandatory: true
    length: 1
- name: RACE
  type: str
  label: Race
  submission:
    core: Req
    mandatory: true
    length: 25
- name: ETHNIC
  type: str
  label: Ethnicity
  submission:
    core: Req
    mandatory: true
    length: 22
- name: ARM
  type: str
  label: Description of Planned Arm
  submission:
    core: Req
    mandatory: true
    length: 14
- name: ACTARM
  type: str
  label: Description of Actual Arm
  submission:
    core: Req
    mandatory: true
    length: 14
- name: TRT01P
  type: str
  label: Planned Treatment for Period 01
  submission:
    core: Req
    mandatory: true
    length: 5
- name: TRT01PN
  type: int
  label: Planned Treatment for Period 01 (N)
  submission:
    core: Req
    mandatory: true
    length: 8
- name: TRT01A
  type: str
  label: Actual Treatment for Period 01
  submission:
    core: Req
    mandatory: true
    length: 5
- name: TRT01AN
  type: int
  label: Actual Treatment for Period 01 (N)
  submission:
    core: Req
    mandatory: true
    length: 8
