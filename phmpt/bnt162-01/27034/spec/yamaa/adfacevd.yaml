    _VS_EXISTS: VS_FIRST.VSSEQ
    _FA_ADY: AGG_FIRST.FADY
    _VS_ADY: VS_FIRST.VSDY
    _USE_VS:
      case:
      - when: _VS_ADY IS NULL
        then: 0
      - when: _FA_ADY IS NULL
        then: 1
      - when: _VS_ADY < _FA_ADY
        then: 1
      - otherwise: 0
    _FA_ADY_L: AGG_LAST.FADY
    _VS_ADY_L: VS_LAST.VSDY
