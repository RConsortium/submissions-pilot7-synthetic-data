          of the Observation' AND FACE.FASTRESC = 'Y' AND FACE.FADY IS NOT NULL AND FACE.FADTC <> ''
        expr: COUNT(FACE.FASEQ)
    _PARAMCD: "'TTEFAR'"
    _PARAM: "'Time to first local or systemic reaction'"
    _PARAMN: 1
    _PARCAT1: null
