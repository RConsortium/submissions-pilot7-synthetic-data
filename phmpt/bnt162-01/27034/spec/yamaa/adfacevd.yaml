rows:
- id: fa_oc
  dataset: FACE
  derivations:
    STUDYID: FACE.STUDYID
    USUBJID: FACE.USUBJID
    _ADSL: ADSL.USUBJID
    _REF: FACE.FATPTREF
    _PARAMCD:
      mapping:
        source: FACE.FAOBJ
        dict:
          Injection site reaction - Pain: OCPIS
          Injection site reaction - Tenderness: OCTIS
          Injection site reaction - Erythema/Redness: OCISR
          Injection site reaction - Induration/Swelling: OCINS
          Nausea: OCNAUS
          Vomiting: OCVOMI
          Diarrhea: OCDIAR
          Headache: OCHEAD
          Fatigue: OCFATIG
          Myalgia: OCMYALG
          Arthralgia: OCARTHR
          Chills: OCCHILLS
          Loss of Appetite: OCLOA
          Malaise: OCMALAI
        unmapped: null
    _PARAM:
      mapping:
        source: FACE.FAOBJ
        dict:
          Injection site reaction - Pain: Pain at injection site occurrence indicator
          Injection site reaction - Tenderness: Tenderness at injection site occurrence indicator
          Injection site reaction - Erythema/Redness: Redness occurrence indicator
          Injection site reaction - Induration/Swelling: Swelling occurrence indicator
          Nausea: Nausea occurrence indicator
          Vomiting: Vomiting occurrence indicator
          Diarrhea: Diarrhea occurrence indicator
          Headache: Headache occurrence indicator
          Fatigue: Fatigue occurrence indicator
          Myalgia: Myalgia occurrence indicator
          Arthralgia: Arthralgia occurrence indicator
          Chills: Chills occurrence indicator
          Loss of Appetite: Loss of Appetite occurrence indicator
          Malaise: Malaise occurrence indicator
        unmapped: null
    _PARAMN:
      mapping:
        source: FACE.FAOBJ
        dict:
          Injection site reaction - Pain: 100
          Injection site reaction - Tenderness: 105
          Injection site reaction - Erythema/Redness: 110
          Injection site reaction - Induration/Swelling: 115
          Nausea: 200
          Vomiting: 205
          Diarrhea: 210
          Headache: 215
          Fatigue: 220
          Myalgia: 225
          Arthralgia: 230
          Chills: 235
          Loss of Appetite: 240
          Malaise: 245
        unmapped: null
    _ATPTREF:
      case:
      - when: FACE.FATPTREF = 'PRIME VACCINATION'
        then: "'Prime'"
      - when: FACE.FATPTREF = 'BOOST VACCINATION'
        then: "'Boost'"
      - otherwise: null
    _ATPTN:
      case:
      - when: str_contains(FACE.FATPT, 'DAY')
        then: FACE.FATPTNUM
      - otherwise: null
    _ATPT:
      case:
      - when: _ATPTN IS NULL
        then: null
      - otherwise:
          str_template: Day {_ATPTN_STR}
    _ADT:
      to_date:
        source: FACE.FADTC
    _ADTM:
      case:
      - when: str_contains(FACE.FADTC, 'T')
        then:
          impute:
            type: datetime
            source: FACE.FADTC
            time: first
    _ADY: FACE.FADY
    _AVAL: null
    _AVALC: FACE.FASTRESC
