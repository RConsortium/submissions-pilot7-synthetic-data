- id: dur_fsr3
  dataset: FACE
  group_by:
  - FACE.STUDYID
  - FACE.USUBJID
  derivations:
    STUDYID: FACE.STUDYID
    USUBJID: FACE.USUBJID
    _ADSL: ADSL.USUBJID
    _N_3:
      aggregate:
        filter: FACE.FATESTCD = 'SEV' AND FACE.FAEVAL = 'STUDY SUBJECT' AND FACE.FAOBJ <> 'All Objects
          of the Observation' AND FACE.FASTRESC = 'SEVERE' AND FACE.FADY IS NOT NULL AND FACE.FADTC <>
          '' AND FACE.FAOBJ IN ('Nausea', 'Vomiting', 'Diarrhea', 'Headache', 'Fatigue', 'Myalgia', 'Arthralgia',
          'Chills', 'Loss of Appetite', 'Malaise')
        expr: COUNT(FACE.FASEQ)
    _PARAMCD: "'DURSR3'"
    _PARAM: "'Time from first to last systemic reaction with grade >= 3'"
    _PARAMN: 24
    _PARCAT1: "'systemic'"
    _AVALCAT1: "'grade >= 3'"
    _VS_EXISTS_3: VS_SEV3_FIRST.VSSEQ
    _FA_ADY: AGG_SEV3_SYS_FIRST.FADY
    _VS_ADY: VS_SEV3_FIRST.VSDY
    _USE_VS:
      case:
      - when: _VS_ADY IS NULL
        then: 0
      - when: _FA_ADY IS NULL
        then: 1
      - when: _VS_ADY < _FA_ADY
        then: 1
      - otherwise: 0
    _FA_ADY_L: AGG_SEV3_SYS_LAST.FADY
    _VS_ADY_L: VS_SEV3_LAST.VSDY
    _USE_VS_LAST:
      case:
      - when: _VS_ADY_L IS NULL
        then: 0
      - when: _FA_ADY_L IS NULL
        then: 1
      - when: _VS_ADY_L >= _FA_ADY_L
        then: 1
      - otherwise: 0
    _ATPTREF: null
    _REFDT:
      case:
      - when: _ATPTREF = 'Prime'
        then: ADSL.PRIMDT
      - when: _ATPTREF = 'Boost'
        then: ADSL.BOIMDT
      - otherwise: null
    _REFDTM:
      case:
      - when: _ATPTREF = 'Prime'
        then: ADSL.PRIMDTM
      - when: _ATPTREF = 'Boost'
        then: ADSL.BOIMDTM
      - otherwise: null
    _FADTC:
      case:
      - when: _USE_VS_LAST = 1
        then: null
      - otherwise: AGG_SEV3_SYS_LAST.FADTC
    _VSDTC:
      case:
      - when: _USE_VS_LAST = 1
        then: VS_SEV3_LAST.VSDTC
      - otherwise: null
    _ASTDT_FA:
      to_date:
        source: AGG_SEV3_SYS_FIRST.FADTC
    _ASTDT_VS:
      to_date:
        source: VS_SEV3_FIRST.VSDTC
    _AENDT_FA:
      to_date:
        source: AGG_SEV3_SYS_LAST.FADTC
    _AENDT_VS:
      to_date:
        source: VS_SEV3_LAST.VSDTC
    _ASTDT:
      least:
        sources:
        - _ASTDT_FA
        - _ASTDT_VS
    _AENDT:
      greatest:
        sources:
        - _AENDT_FA
        - _AENDT_VS
    _ASTDY:
      case:
      - when: _USE_VS = 1
        then: _VS_ADY
      - otherwise: _FA_ADY
    _AENDY:
      case:
      - when: _USE_VS_LAST = 1
        then: _VS_ADY_L
      - otherwise: _FA_ADY_L
    _AVAL: _AENDY - _ASTDY + 1
    _SRCDOM:
      case:
      - when: _USE_VS_LAST = 1
        then: "'VS'"
      - otherwise: "'FA'"
    _FAOBJ:
      case:
      - when: _USE_VS_LAST = 1
        then: null
      - otherwise: AGG_SEV3_SYS_LAST.FAOBJ
    _FATEST:
      case:
      - when: _USE_VS_LAST = 1
        then: null
      - otherwise: AGG_SEV3_SYS_LAST.FATEST
    _FATESTCD:
      case:
      - when: _USE_VS_LAST = 1
        then: null
      - otherwise: AGG_SEV3_SYS_LAST.FATESTCD
    _FASCAT:
      case:
      - when: _USE_VS_LAST = 1
        then: null
      - otherwise: AGG_SEV3_SYS_LAST.FASCAT
    _FASTRESC:
      case:
      - when: _USE_VS_LAST = 1
        then: null
      - otherwise: AGG_SEV3_SYS_LAST.FASTRESC
    _VSSTRESN:
      case:
      - when: _USE_VS_LAST = 1
        then: VS_SEV3_LAST.VSSTRESN
      - otherwise: null
    _VSTEST:
      case:
      - when: _USE_VS_LAST = 1
        then: VS_SEV3_LAST.VSTEST
      - otherwise: null
    _VSTESTCD:
      case:
      - when: _USE_VS_LAST = 1
