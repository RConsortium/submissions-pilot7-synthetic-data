# ADFACEVD for Pfizer/BioNTech BNT162-01, data cut 27034 (cutoff 2020-08-13).
# Parent: ../../../spec/yamaa/base/adam-base.yaml (section 3.1 core columns).
# No SAS programs were submitted; derivations implement define.xml
# MethodDefs, the ADRG Appendix IV parameter catalogue and the SAP,
# recovered against the submitted data (see the study's spec/review/README.md
# for the recovered rules and the open gaps).
# First generated by tools/gen_adfacevd_spec.py (retired); this file is the source.
yamaa: '1.0'
type: spec
model: ADaM
parent: ../../../spec/yamaa/base/adam-base.yaml
domain: ADFACEVD
keys:
- STUDYID
- USUBJID
- PARAMCD
- FADTC
- VSDTC
submission:
  label: Reactogenicity Findings Analysis Dataset
  class: BASIC DATA STRUCTURE
  structure: One record per subject per analysis parameter per analysis timepoint
  repeating: true
input:
  FACE: <sdtm-dir>/face.parquet
  VS: <sdtm-dir>/vs.parquet
  ADSL:
    path: <adam-dir>/adsl.parquet
    key:
    - STUDYID
    - USUBJID
intermediates:
- id: FA_OC
  dataset: FACE
  key:
    STUDYID: STUDYID
    USUBJID: USUBJID
    FAOBJ: FACE.FAOBJ
    FADTC: FACE.FADTC
  filter: FACE.FATESTCD = 'OCCUR' AND FACE.FAEVAL = 'STUDY SUBJECT' AND FACE.FAOBJ <> 'All Objects of
    the Observation'
- id: AGG_FIRST
  dataset: FACE
  key:
    STUDYID: STUDYID
    USUBJID: USUBJID
  filter: FACE.FATESTCD = 'OCCUR' AND FACE.FAEVAL = 'STUDY SUBJECT' AND FACE.FAOBJ <> 'All Objects of
    the Observation' AND FACE.FASTRESC = 'Y' AND FACE.FADY IS NOT NULL AND FACE.FADTC <> ''
  order_by:
  - FACE.FADY
  - FACE._PARAMN
  - FACE.FADTC
  - FACE.FASEQ
  keep: first
  derivations:
    _PARAMN:
      mapping:
        source: FACE.FAOBJ
        dict:
          Injection site reaction - Pain: 100
          Injection site reaction - Tenderness: 105
          Injection site reaction - Erythema/Redness: 110
          Injection site reaction - Induration/Swelling: 115
          Nausea: 200
          Vomiting: 205
          Diarrhea: 210
          Headache: 215
          Fatigue: 220
          Myalgia: 225
          Arthralgia: 230
