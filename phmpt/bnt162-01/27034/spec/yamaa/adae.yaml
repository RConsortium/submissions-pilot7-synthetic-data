# ADAE for Pfizer/BioNTech BNT162-01, data cut 27034 (cutoff 2020-08-13).
# Parent: ../../../spec/yamaa/base/adam-base.yaml (section 3.1 core columns).
# ADSL-core columns are read from the submitted ADSL file
# (mapping input, key STUDYID/USUBJID; verify.py resolves it
# from --adam-dir). No SAS programs were submitted; derivations
# implement define.xml MethodDefs + ADRG Appendix III, recovered
# against the submitted data (see tools/gen_adae_spec.py).
# First generated by tools/gen_adae_spec.py (retired); this file is the source.
yamaa: '1.0'
type: spec
model: ADaM
parent: ../../../spec/yamaa/base/adam-base.yaml
domain: ADAE
keys:
- STUDYID
- USUBJID
- AESEQ
input:
  AE: <sdtm-dir>/ae.parquet
  SUPPAE: <sdtm-dir>/suppae.parquet
  ADSL:
    path: <adam-dir>/adsl.parquet
    key:
    - STUDYID
    - USUBJID
submission:
  label: Adverse Events Analysis Dataset
  class: OCCURRENCE DATA STRUCTURE
  structure: One record per adverse event
  repeating: true
rows:
- id: events
  dataset: AE
intermediates:
- id: SUPPAE_P
  dataset: SUPPAE
  key:
  - STUDYID
  - USUBJID
  - AESEQ
  filter: SUPPAE.QNAM IN ('AETRTEM', 'AE_DLT', 'AEEPRELI') AND SUPPAE.IDVAR = 'AESEQ'
  pivot:
    name: QNAM
    value: QVAL
    fields:
    - AETRTEM
    - AE_DLT
    - AEEPRELI
  derivations:
    AESEQ:
      type: int
      derivation: SUPPAE.IDVARVAL
output:
  path: <adam-dir>/adae-yamaa.parquet
  order_by:
  - USUBJID
  - AESEQ
  columns:
  - STUDYID
  - USUBJID
  - SUBJID
  - SUBJIDN
  - COHORT
  - COHORTN
  - GROUP
  - GROUPN
  - TRTP
  - TRTPN
  - TRTA
  - TRTAN
  - AESEQ
  - AEGRPID
  - AESPID
  - AETERM
  - AEMODIFY
  - AELLT
