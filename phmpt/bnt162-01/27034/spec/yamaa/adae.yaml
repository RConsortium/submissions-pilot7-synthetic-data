columns:
- name: _AST_PRIM_DAYS
  type: int
  derivation:
    diff:
      type: date
      start: PRIMDT
      end: ASTDT
      unit: day
- name: _AST_BOIM_DAYS
  type: int
  derivation:
    diff:
      type: date
      start: BOIMDT
      end: ASTDT
      unit: day
- name: _AST_LAST_DAYS
  type: int
  derivation:
    diff:
      type: date
      start: TRTEDT
      end: ASTDT
      unit: day
- name: _AEND_PRIM_DAYS
  type: int
  derivation:
    diff:
      type: date
      start: PRIMDT
      end: AENDT
      unit: day
- name: _BOIM_PRIM_DAYS
  type: int
  derivation:
    diff:
      type: date
      start: PRIMDT
      end: BOIMDT
      unit: day
- name: _DUR2
  type: int
  derivation:
    case:
    - when: BOIMDT IS NULL
      then: 28
    - when: _BOIM_PRIM_DAYS < 28
      then: _BOIM_PRIM_DAYS
    - otherwise: 28
- name: _AE_DUR_DAYS
  type: int
  derivation:
    diff:
      type: date
      start: ASTDT
      end: AENDT
      unit: day
- name: _AE_DUR1
  type: int
  derivation: _AE_DUR_DAYS + 1
- name: _DUR_SEC
  type: int
  derivation:
    diff:
      type: datetime
      start: ASTDTM
      end: AENDTM
      unit: second
