# ADLB for Pfizer/BioNTech BNT162-01, data cut 27034 (cutoff 2020-08-13).
# Parent: ../../../spec/yamaa/base/adam-base.yaml (section 3.1 core columns).
# No SAS programs were submitted; derivations implement define.xml
# MethodDefs, recovered against the submitted data (see
# the study's spec/review/README.md for the recovered rules and the open gaps).
# First generated by tools/gen_adlb_spec.py (retired); this file is the source.
yamaa: '1.0'
type: spec
model: ADaM
parent: ../../../spec/yamaa/base/adam-base.yaml
domain: ADLB
keys:
- STUDYID
- USUBJID
- LBSEQ
- DTYPE
input:
  LB: <sdtm-dir>/lb.parquet
  SUPPLB: <sdtm-dir>/supplb.parquet
  CO: <sdtm-dir>/co.parquet
  ADSL:
    path: <adam-dir>/adsl.parquet
    key:
    - STUDYID
    - USUBJID
submission:
  label: Laboratory Analysis Dataset
  class: BASIC DATA STRUCTURE
  structure: One or more records per subject per analysis parameter per analysis timepoint
  repeating: true
rows:
- id: lb_rows
  dataset: LB
  filter: _ADSL IS NOT NULL
  derivations:
    STUDYID: LB.STUDYID
    USUBJID: LB.USUBJID
    _LBSEQ: LB.LBSEQ
    _LBTESTCD: LB.LBTESTCD
    _LBCAT: LB.LBCAT
    _LBSCAT: LB.LBSCAT
    _LBSPEC: LB.LBSPEC
    _LBMETHOD: LB.LBMETHOD
    _LBSTRESC: LB.LBSTRESC
    _LBSTRESN: LB.LBSTRESN
    _LBNRIND: LB.LBNRIND
    _LBSTNRLO: LB.LBSTNRLO
    _LBSTNRHI: LB.LBSTNRHI
    _LBORRES: LB.LBORRES
    _LBORNRLO: LB.LBORNRLO
    _LBORNRHI: LB.LBORNRHI
    _LBDTC: LB.LBDTC
    _VISIT: LB.VISIT
    _VISITNUM: LB.VISITNUM
    _EPOCH: LB.EPOCH
    _LBNAM: LB.LBNAM
    _LBFAST: LB.LBFAST
    _LBSTAT: LB.LBSTAT
    _LBREASND: LB.LBREASND
    _ADSL: ADSL.USUBJID
    _TRTSDT: ADSL.TRTSDT
    _IS_HALF: 0
- id: half_rows
  dataset: LB
  filter: _ADSL IS NOT NULL AND LB.LBSTRESN IS NULL AND str_contains(LB.LBSTRESC, '<')
  derivations:
    STUDYID: LB.STUDYID
    USUBJID: LB.USUBJID
    _LBSEQ: LB.LBSEQ
    _LBTESTCD: LB.LBTESTCD
    _LBCAT: LB.LBCAT
    _LBSCAT: LB.LBSCAT
    _LBSPEC: LB.LBSPEC
    _LBMETHOD: LB.LBMETHOD
    _LBSTRESC: LB.LBSTRESC
    _LBSTRESN: LB.LBSTRESN
    _LBNRIND: LB.LBNRIND
    _LBSTNRLO: LB.LBSTNRLO
    _LBSTNRHI: LB.LBSTNRHI
    _LBORRES: LB.LBORRES
    _LBORNRLO: LB.LBORNRLO
    _LBORNRHI: LB.LBORNRHI
    _LBDTC: LB.LBDTC
    _VISIT: LB.VISIT
    _VISITNUM: LB.VISITNUM
    _EPOCH: LB.EPOCH
    _LBNAM: LB.LBNAM
    _LBFAST: LB.LBFAST
    _LBSTAT: LB.LBSTAT
    _LBREASND: LB.LBREASND
    _ADSL: ADSL.USUBJID
    _TRTSDT: ADSL.TRTSDT
    _IS_HALF: 1
intermediates:
- id: SUPPLB_P
  dataset: SUPPLB
  key:
  - STUDYID
  - USUBJID
  - LBSEQ
  filter: SUPPLB.QNAM IN ('LBCLSIG', 'RBB', 'RBB2', 'LBORRES1', 'LBORRES2', 'LBLOINC1', 'LBLOINC2')
  pivot:
    name: QNAM
    value: QVAL
    fields:
    - LBCLSIG
    - RBB
    - RBB2
    - LBORRES1
    - LBORRES2
    - LBLOINC1
    - LBLOINC2
  derivations:
    LBSEQ:
      type: int
      derivation: SUPPLB.IDVARVAL
- id: CO1
  dataset: CO
  key:
  - STUDYID
  - USUBJID
  - LBSEQ
  filter: CO.IDVAR = 'LBSEQ'
  order_by:
  - CO.COSEQ
  keep: first
  derivations:
    LBSEQ:
      type: int
      derivation: CO.IDVARVAL
- id: CO2
  dataset: CO
  key:
  - STUDYID
  - USUBJID
  - LBSEQ
  filter: CO.IDVAR = 'LBSEQ'
  order_by:
  - CO.COSEQ
  keep: last
  derivations:
    LBSEQ:
      type: int
      derivation: CO.IDVARVAL
windows:
  BL_W:
    group_by:
    - STUDYID
    - USUBJID
    - PARAMCD
    order_by:
    - variable: _BL_CAND
      direction: desc
    - variable: ADT
      direction: desc
    - variable: ADTM
      direction: desc
    - variable: LBSEQ
      direction: desc
    - variable: DTYPE
      direction: desc
