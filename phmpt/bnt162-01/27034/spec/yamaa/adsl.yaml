# ADSL for Pfizer/BioNTech BNT162-01, data cut 27034 (cutoff 2020-08-13).
# Parent: ../../../spec/yamaa/base/adam-base.yaml (section 3.1 core columns).
# No SAS programs were submitted; derivations implement define.xml
# MethodDefs, recovered against the submitted data (see
# the study's spec/review/README.md for the recovered rules and the open gaps).
# First generated by tools/gen_adsl_spec.py (retired); this file is the source.
yamaa: '1.0'
type: spec
model: ADaM
parent: ../../../spec/yamaa/base/adam-base.yaml
domain: ADSL
keys:
- STUDYID
- USUBJID
input:
  DM: <sdtm-dir>/dm.parquet
  DS: <sdtm-dir>/ds.parquet
  EC: <sdtm-dir>/ec.parquet
  VS: <sdtm-dir>/vs.parquet
  IS: <sdtm-dir>/is.parquet
  DV: <sdtm-dir>/dv.parquet
  SUPPDM: <sdtm-dir>/suppdm.parquet
  SUPPDS: <sdtm-dir>/suppds.parquet
  TS: <sdtm-dir>/ts.parquet
submission:
  label: Subject-Level Analysis Dataset
  class: SUBJECT LEVEL ANALYSIS DATASET
  structure: One record per subject
  repeating: false
rows:
- id: subjects
  dataset: DM
intermediates:
- id: SUPPDM_P
  dataset: SUPPDM
  key:
  - STUDYID
  - USUBJID
  filter: SUPPDM.QNAM IN ('AGE_M', 'RACEOTH', 'RACE1', 'RACE2')
  pivot:
    name: QNAM
    value: QVAL
    fields:
    - AGE_M
    - RACEOTH
    - RACE1
    - RACE2
- id: SUPPDS_BYSEQ
  dataset: SUPPDS
  key:
  - STUDYID
  - USUBJID
  - DSSEQ
  filter: SUPPDS.QNAM IN ('COHORT', 'GROUP', 'DSEPRELI', 'LASTCONT', 'PREV_TSN', 'PROTVERS')
  pivot:
    name: QNAM
    value: QVAL
    fields:
    - COHORT
    - GROUP
    - DSEPRELI
    - LASTCONT
    - PREV_TSN
    - PROTVERS
  derivations:
    DSSEQ:
      type: int
      derivation: SUPPDS.IDVARVAL
- id: DS_ALLOC
  dataset: DS
  key:
  - STUDYID
  - USUBJID
  filter: DS.DSDECOD = 'ALLOCATED'
  order_by:
  - DS.DSSTDTC
  keep: first
  derivations:
    _COHORT:
      type: str
      derivation: SUPPDS_BYSEQ.COHORT
    _GROUP:
      type: str
      derivation: SUPPDS_BYSEQ.GROUP
- id: DS_EOT
  dataset: DS
  key:
  - STUDYID
  - USUBJID
  filter: DS.DSSCAT = 'END OF TRIAL'
  order_by:
  - DS.DSSTDTC
  keep: first
  derivations:
    _DSEPRELI:
      type: str
      derivation: SUPPDS_BYSEQ.DSEPRELI
    _LASTCONT:
      type: str
      derivation: SUPPDS_BYSEQ.LASTCONT
- id: DS_EOFU
  dataset: DS
  key:
  - STUDYID
  - USUBJID
  filter: DS.DSSCAT = 'END OF FOLLOW-UP'
  order_by:
  - DS.DSSTDTC
  keep: first
- id: DS_FIRIC
  dataset: DS
  key:
  - STUDYID
  - USUBJID
  filter: DS.DSDECOD = 'FIRST INFORMED CONSENT OBTAINED'
  order_by:
  - DS.DSSTDTC
  keep: first
  derivations:
    _PREV_TSN:
      type: str
      derivation: SUPPDS_BYSEQ.PREV_TSN
- id: DS_CONS0
  dataset: DS
  key:
  - STUDYID
  - USUBJID
  filter: DS.DSDECOD = 'INFORMED CONSENT OBTAINED'
  order_by:
  - DS.DSSTDTC
  keep: first
  derivations:
    _PROTVERS:
      type: str
      derivation: SUPPDS_BYSEQ.PROTVERS
- id: DS_ICR1
  dataset: DS
  key:
  - STUDYID
  - USUBJID
  filter: DS.DSDECOD = 'INFORMED CONSENT RECONSENTED'
  order_by:
  - DS.DSSTDTC
  keep: first
  derivations:
    _D:
      type: date
      derivation:
        to_date:
          source: DS.DSSTDTC
    _PROTVERS:
      type: str
      derivation: SUPPDS_BYSEQ.PROTVERS
- id: EC_PRIM
  dataset: EC
  key:
  - STUDYID
  - USUBJID
  filter: EC.ECOCCUR = 'Y' AND EC.VISITNUM = 2
  order_by:
  - EC.ECSTDTC
  keep: first
- id: EC_BOOST
  dataset: EC
  key:
  - STUDYID
  - USUBJID
  filter: EC.ECOCCUR = 'Y' AND EC.VISITNUM = 6
  order_by:
  - EC.ECSTDTC
  keep: first
- id: VS_HT
  dataset: VS
  key:
  - STUDYID
  - USUBJID
  filter: VS.VSTESTCD = 'HEIGHT' AND VS.VSBLFL = 'Y'
  order_by:
  - VS.VSDTC
  keep: first
- id: VS_WT
  dataset: VS
  key:
  - STUDYID
  - USUBJID
  filter: VS.VSTESTCD = 'WEIGHT' AND VS.VSBLFL = 'Y'
  order_by:
  - VS.VSDTC
  keep: first
- id: VS_BMI
  dataset: VS
  key:
  - STUDYID
  - USUBJID
  filter: VS.VSTESTCD = 'BMI' AND VS.VSBLFL = 'Y'
  order_by:
  - VS.VSDTC
  keep: first
- id: IS_IMM
  dataset: IS
  key:
  - STUDYID
  - USUBJID
  filter: IS.VISITNUM > 2 AND IS.ISTESTCD IN ('C2NGNT50', 'C2NGNT90') AND IS.ISORRES IS NOT NULL AND IS.ISORRES
    <> ''
  order_by:
  - IS.ISDTC
  keep: first
- id: DV_ANY
  dataset: DV
  key:
  - STUDYID
  - USUBJID
  order_by:
  - DV.DVSEQ
  keep: first
- id: TS_DCUT
  dataset: TS
  key: none
  filter: TS.TSPARMCD = 'DCUTDTC'
  order_by:
  - TS.TSVAL
  keep: first
- id: DS_ICR2
  dataset: DS
  key:
  - STUDYID
  - USUBJID
  filter: DS.DSDECOD = 'INFORMED CONSENT RECONSENTED'
  nearest:
    source: _D
    to: ICR2DT
    unit: day
  derivations:
    _D:
      type: date
      derivation:
        to_date:
          source: DS.DSSTDTC
    _PROTVERS:
      type: str
      derivation: SUPPDS_BYSEQ.PROTVERS
- id: DS_ICR3
  dataset: DS
  key:
  - STUDYID
  - USUBJID
  filter: DS.DSDECOD = 'INFORMED CONSENT RECONSENTED'
  nearest:
    source: _D
    to: ICR3DT
    unit: day
  derivations:
    _D:
      type: date
      derivation:
        to_date:
          source: DS.DSSTDTC
    _PROTVERS:
      type: str
      derivation: SUPPDS_BYSEQ.PROTVERS
output:
  path: <adam-dir>/adsl-yamaa.parquet
  order_by:
  - USUBJID
  columns:
  - STUDYID
  - USUBJID
  - SUBJID
  - SUBJIDN
  - SITEID
  - INVID
  - INVNAM
  - AGE
  - AGEU
  - AGE_M
  - AAGE
  - SEX
  - SEXN
  - RACE
  - RACEN
  - RACEOTH
  - RACE1
  - RACE2
  - ETHNIC
  - ETHNICN
  - HEIGHT
  - WEIGHT
  - BMI
  - SCRFL
  - SCRFN
  - EXSCR1
  - SAFFL
  - SAFFN
  - EXSAF1
  - SAFBFL
  - SAFBFN
  - EXSAFB1
  - IMMFL
  - IMMFN
  - EXIMM1
  - PPROTFL
  - PPROTFN
  - EXPPROT1
  - CP7FL
  - CP7FN
  - CPBP28FL
  - CPBP28FN
  - CB7FL
  - CB7FN
  - CB28FL
  - CB28FN
  - CPB28FL
  - CPB28FN
  - COMPLFL
  - COMPLFN
  - COHORT
  - COHORTN
  - GROUP
  - GROUPN
  - ARM
  - ACTARM
  - TRT01P
  - TRT01PN
  - TRT01A
  - TRT01AN
  - TRTSDT
  - TRTSTM
  - TRTSDTM
  - TRTEDT
  - TRTETM
  - TRTEDTM
  - RFICDT
  - RFICTM
  - RFICDTM
  - SCRDT
  - ALLOCDT
  - ALLOCTM
  - ALLOCDTM
  - LVDT
  - EOSSTT
  - EOSDT
  - EOFUDT
  - DCSREAS
  - DCSREASP
  - DTHFL
  - DTHDT
  - PRIMDT
  - PRIMTM
  - PRIMDTM
  - BOIMDT
  - BOIMTM
  - BOIMDTM
  - DSEPRELI
  - PREV_TSN
  - FIRICDT
  - ICR1DT
  - ICR1TM
  - ICR1DTM
  - ICR2DT
  - ICR2TM
  - ICR2DTM
  - ICR3DT
  - ICR3TM
  - ICR3DTM
  - PROTVER1
  - PROTVER2
  - PROTVER3
  - PROTVER4
columns:
- name: _DOSE_STR
  type: str
  derivation:
    str_extract:
      source: DM.ARM
      pattern: ' (\d+) ug$'
      group: 1
- name: _ADOSE_STR
  type: str
  derivation:
    str_extract:
      source: DM.ACTARM
      pattern: ' (\d+) ug$'
      group: 1
- name: _DOSE_NUM
  type: int
  derivation: _DOSE_STR
- name: _ADOSE_NUM
  type: int
  derivation: _ADOSE_STR
- name: _CUTOFFDT
  type: date
  derivation:
    to_date:
      source: TS_DCUT.TSVAL
- name: _PRIM_EOS_DAYS
  type: int
  derivation:
    diff:
      type: date
      start: PRIMDT
      end: EOSDT
      unit: day
- name: _PRIM_CUT_DAYS
  type: int
  derivation:
    diff:
      type: date
      start: PRIMDT
      end: _CUTOFFDT
      unit: day
- name: _BOIM_EOS_DAYS
  type: int
  derivation:
    diff:
      type: date
      start: BOIMDT
      end: EOSDT
      unit: day
- name: _BOIM_CUT_DAYS
  type: int
  derivation:
    diff:
      type: date
      start: BOIMDT
      end: _CUTOFFDT
      unit: day
- name: _ICR_DTC_JOIN
  type: str
  derivation:
    aggregate:
      key:
      - STUDYID
      - USUBJID
      derivations:
        _D:
          type: date
          derivation:
            to_date:
              source: DS.DSSTDTC
      filter: DS.DSDECOD = 'INFORMED CONSENT RECONSENTED'
      expr: STR_JOIN(DS.DSSTDTC)
      order_by:
      - _D
      separator: "\x1F"
- name: _ICR_DTC2
  type: str
  derivation:
    str_extract:
      source: _ICR_DTC_JOIN
      pattern: ^(?:[^\x1f]*\x1f){1}([^\x1f]*)
      group: 1
      no_match: null
- name: _ICR_DTC3
  type: str
  derivation:
    str_extract:
      source: _ICR_DTC_JOIN
      pattern: ^(?:[^\x1f]*\x1f){2}([^\x1f]*)
      group: 1
      no_match: null
- name: _AGE_M_NUM
  type: float
  derivation:
    case:
    - when: SUPPDM_P.AGE_M = '(b)(6)'
      then: null
    - otherwise: SUPPDM_P.AGE_M
- name: _AAGE_RAW
  type: float
  derivation: AGE + _AGE_M_NUM / 12
- name: STUDYID
  type: str
  label: Study Identifier
  derivation: DM.STUDYID
  submission:
    core: Req
    mandatory: true
    length: 9
    origins:
    - type: Predecessor
      description: DM.STUDYID
- name: USUBJID
  type: str
  label: Unique Subject Identifier
  derivation: DM.USUBJID
  submission:
    core: Req
    mandatory: true
    length: 21
    origins:
    - type: Predecessor
      description: DM.USUBJID
- name: SUBJID
  type: str
  label: Subject Identifier for the Study
  derivation: DM.SUBJID
  submission:
    core: Req
    mandatory: true
    length: 5
    origins:
    - type: Predecessor
      description: DM.SUBJID
- name: SUBJIDN
  type: int
  label: Subject Identifier for the Study (N)
  derivation: DM.SUBJID
  submission:
    core: Req
    mandatory: true
    length: 8
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: SITEID
  type: str
  label: Study Site Identifier
  derivation: DM.SITEID
  submission:
    core: Req
    mandatory: true
    length: 12
    origins:
    - type: Predecessor
      description: DM.SITEID
- name: INVID
  type: str
  label: Investigator Identifier
  derivation: DM.INVID
  submission:
    core: Req
    mandatory: true
    length: 2
    origins:
    - type: Predecessor
      description: DM.INVID
- name: INVNAM
  type: str
  label: Investigator Name
  derivation: DM.INVNAM
  submission:
    core: Req
    mandatory: true
    length: 13
    origins:
    - type: Predecessor
      description: DM.INVNAM
- name: AGE
  type: int
  label: Age
  derivation: DM.AGE
  submission:
    core: Req
    mandatory: true
    length: 8
    origins:
    - type: Predecessor
      description: DM.AGE
- name: AGEU
  type: str
  label: Age Units
  derivation: DM.AGEU
  submission:
    core: Req
    mandatory: true
    length: 5
    origins:
    - type: Predecessor
      description: DM.AGEU
- name: AGE_M
  type: str
  label: Add. Months to Age in years (months)
  derivation: SUPPDM_P.AGE_M
  submission:
    core: Req
    mandatory: true
    length: 8
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: AAGE
  type: float
  label: Analysis Age
  derivation:
    case:
    - when: _AGE_M_NUM IS NULL
      then: AGE
    - otherwise:
        round_half_away_from_zero:
          source: _AAGE_RAW
          digits: 2
  submission:
    core: Req
    mandatory: true
    length: 8
    significant_digits: 2
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: SEX
  type: str
  label: Sex
  derivation: DM.SEX
  submission:
    core: Req
    mandatory: true
    length: 1
    origins:
    - type: Predecessor
      description: DM.SEX
- name: SEXN
  type: int
  label: Sex (N)
  derivation:
    mapping:
      source: SEX
      dict:
        M: 1
        F: 2
      unmapped: null
  submission:
    core: Req
    mandatory: true
    length: 8
    origins:
    - type: Assigned
      description: "Withheld from publication: the received define states this text."
- name: RACE
  type: str
  label: Race
  derivation: DM.RACE
  submission:
    core: Req
    mandatory: true
    length: 25
    origins:
    - type: Predecessor
      description: DM.RACE
- name: RACEN
  type: int
  label: Race (N)
  derivation:
    mapping:
      source: RACE
      dict:
        AMERICAN INDIAN OR ALASKA NATIVE: 1
        ASIAN: 2
        BLACK OR AFRICAN AMERICAN: 3
        NATIVE HAWAIIAN OR OTHER PACIFIC ISLANDER: 4
        WHITE: 5
        NOT REPORTED: 6
        UNKNOWN: 7
        OTHER: 8
        MULTIPLE: 9
      unmapped: null
  submission:
    core: Req
    mandatory: true
    length: 8
    origins:
    - type: Assigned
      description: "Withheld from publication: the received define states this text."
- name: RACEOTH
  type: str
  label: Race Other
  derivation: SUPPDM_P.RACEOTH
  submission:
    core: Perm
    mandatory: false
    length: 1
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: RACE1
  type: str
  label: Race 1
  derivation: SUPPDM_P.RACE1
  submission:
    core: Perm
    mandatory: false
    length: 1
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: RACE2
  type: str
  label: Race 2
  derivation: SUPPDM_P.RACE2
  submission:
    core: Perm
    mandatory: false
    length: 1
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: ETHNIC
  type: str
  label: Ethnicity
  derivation: DM.ETHNIC
  submission:
    core: Req
    mandatory: true
    length: 22
    origins:
    - type: Predecessor
      description: DM.ETHNIC
- name: ETHNICN
  type: int
  label: Ethnicity (N)
  derivation:
    mapping:
      source: ETHNIC
      dict:
        HISPANIC OR LATINO: 1
        NOT HISPANIC OR LATINO: 2
        NOT REPORTED: 3
        UNKNOWN: 4
      unmapped: null
  submission:
    core: Req
    mandatory: true
    length: 8
    origins:
    - type: Assigned
      description: "Withheld from publication: the received define states this text."
- name: HEIGHT
  type: float
  label: Height [cm]
  derivation: VS_HT.VSSTRESN
  submission:
    core: Req
    mandatory: true
    length: 8
    significant_digits: 3
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: WEIGHT
  type: float
  label: Weight [kg]
  derivation: VS_WT.VSSTRESN
  submission:
    core: Req
    mandatory: true
    length: 8
    significant_digits: 2
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: BMI
  type: float
  label: BMI [kg/m2]
  derivation: VS_BMI.VSSTRESN
  submission:
    core: Req
    mandatory: true
    length: 8
    significant_digits: 2
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: SCRFL
  type: str
  label: Screened Population Flag
  derivation:
    case:
    - when: RFICDTM IS NOT NULL
      then: "'Y'"
    - otherwise: "'N'"
  submission:
    core: Req
    mandatory: true
    length: 1
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: SCRFN
  type: int
  label: Screened Population Flag (N)
  derivation:
    mapping:
      source: SCRFL
      dict:
        Y: 1
        N: 0
      unmapped: null
  submission:
    core: Req
    mandatory: true
    length: 8
    origins:
    - type: Assigned
      description: "Withheld from publication: the received define states this text."
- name: EXSCR1
  type: str
  label: Reason 1 for Exclusion Screened Set
  derivation: null
  submission:
    core: Perm
    mandatory: false
    length: 1
    origins:
    - type: Other
      description: "Withheld from publication: the received define states this text."
    method: "Withheld from publication: the received define states this text."
- name: SAFFL
  type: str
  label: Safety Population Flag
  derivation:
    case:
    - when: EC_PRIM.USUBJID IS NOT NULL
      then: "'Y'"
    - otherwise: "'N'"
  submission:
    core: Req
    mandatory: true
    length: 1
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: SAFFN
  type: int
  label: Safety Population Flag (N)
  derivation:
    mapping:
      source: SAFFL
      dict:
        Y: 1
        N: 0
      unmapped: null
  submission:
    core: Req
    mandatory: true
    length: 8
    origins:
    - type: Assigned
      description: "Withheld from publication: the received define states this text."
- name: EXSAF1
  type: str
  label: Reason 1 for Exclusion Safety Set
  derivation: null
  submission:
    core: Perm
    mandatory: false
    length: 1
    origins:
    - type: Other
      description: "Withheld from publication: the received define states this text."
    method: "Withheld from publication: the received define states this text."
- name: SAFBFL
  type: str
  label: Safety Boost Population Flag
  derivation:
    case:
    - when: EC_BOOST.USUBJID IS NOT NULL
      then: "'Y'"
    - otherwise: "'N'"
  submission:
    core: Req
    mandatory: true
    length: 1
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: SAFBFN
  type: int
  label: Safety Boost Population Flag (N)
  derivation:
    mapping:
      source: SAFBFL
      dict:
        Y: 1
        N: 0
      unmapped: null
  submission:
    core: Req
    mandatory: true
    length: 8
    origins:
    - type: Assigned
      description: "Withheld from publication: the received define states this text."
- name: EXSAFB1
  type: str
  label: Reason 1 for Exclusion Safety Boost Set
  derivation:
    case:
    - when: SAFBFL = 'N'
      then: "'Subject did not receive two doses of IMP'"
  submission:
    core: Perm
    mandatory: false
    length: 40
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: IMMFL
  type: str
  label: Immunogenicity Population Flag
  derivation:
    case:
    - when: SAFFL = 'Y' AND IS_IMM.USUBJID IS NOT NULL
      then: "'Y'"
    - otherwise: "'N'"
  submission:
    core: Req
    mandatory: true
    length: 1
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: IMMFN
  type: int
  label: Immunogenicity Population Flag (N)
  derivation:
    mapping:
      source: IMMFL
      dict:
        Y: 1
        N: 0
      unmapped: null
  submission:
    core: Req
    mandatory: true
    length: 8
    origins:
    - type: Assigned
      description: "Withheld from publication: the received define states this text."
- name: EXIMM1
  type: str
  label: Reason for Exclusion Immunogenicity Set
  derivation:
    case:
    - when: IMMFL = 'N'
      then: "'Subject did not receive one dose of IMP or did not have one post-baseline immunogenicity\
        \ assessment'"
  submission:
    core: Perm
    mandatory: false
    length: 99
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: PPROTFL
  type: str
  label: Per-Protocol Population Flag
  derivation:
    case:
    - when: IMMFL = 'Y' AND DV_ANY.USUBJID IS NULL
      then: "'Y'"
    - otherwise: "'N'"
  submission:
    core: Req
    mandatory: true
    length: 1
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: PPROTFN
  type: int
  label: Per-Protocol Population Flag (N)
  derivation:
    mapping:
      source: PPROTFL
      dict:
        Y: 1
        N: 0
      unmapped: null
  submission:
