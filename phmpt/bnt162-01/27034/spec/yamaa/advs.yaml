  derivation:
    case:
    - when: AVAL IS NOT NULL AND _LO IS NOT NULL AND AVAL < _LO
      then: "'Abnormal'"
    - when: AVAL IS NOT NULL AND _HI IS NOT NULL AND AVAL > _HI
