# Parent: ../../../spec/yamaa/base/adam-base.yaml (section 3.1 core columns).
# No SAS programs were submitted; derivations implement define.xml
# MethodDefs, recovered against the submitted data (see
# the study's spec/review/README.md for the recovered rules).
# First generated by tools/gen_advs_spec.py (retired); this file is the source.
yamaa: '1.0'
type: spec
model: ADaM
parent: ../../../spec/yamaa/base/adam-base.yaml
domain: ADVS
keys:
- STUDYID
- USUBJID
- VSSEQ
input:
  VS: <sdtm-dir>/vs.parquet
  SUPPVS: <sdtm-dir>/suppvs.parquet
  ADSL:
    path: <adam-dir>/adsl.parquet
    key:
    - STUDYID
    - USUBJID
submission:
  label: Vital Signs Analysis Dataset
  class: BASIC DATA STRUCTURE
  structure: One or more records per subject per analysis parameter per analysis timepoint
  repeating: true
rows:
- id: vs
  dataset: VS
  filter: _ADSL IS NOT NULL
intermediates:
- id: SUPP_P
  dataset: SUPPVS
  key:
    STUDYID: STUDYID
    USUBJID: USUBJID
    IDVARVAL:
      str_decimal:
        source: _VSSEQ
        decimals: 0
  filter: SUPPVS.QNAM IN ('VSCLSIG') AND SUPPVS.IDVAR = 'VSSEQ'
  pivot:
    name: QNAM
    value: QVAL
    fields:
    - VSCLSIG
windows:
  ABL_W:
    group_by:
    - STUDYID
    - USUBJID
    - PARAMCD
    order_by:
    - variable: _ISBL
      direction: desc
    - variable: ADTM
      direction: desc
    - variable: VSSEQ
      direction: desc
  ASEQ_W:
    group_by:
    - STUDYID
    - USUBJID
    order_by:
    - PARAMN
    - AVISITN
    - ADTM
    - VSSEQ
output:
  path: <adam-dir>/advs-yamaa.parquet
  order_by:
