# ADVA for Pfizer/BioNTech BNT162-01, data cut 27034 (cutoff 2020-08-13).
# Parent: ../../../spec/yamaa/base/adam-base.yaml (section 3.1 core columns).
# No SAS programs were submitted; derivations implement define.xml
# MethodDefs, recovered against the submitted data (see
# the study's spec/review/README.md for the recovered rules and the open gaps).
# Core columns are copied from the submitted ADSL (mapping input,
# key STUDYID/USUBJID); IS is the only SDTM input.
# First generated by tools/gen_adva_spec.py (retired); this file is the source.
yamaa: '1.0'
type: spec
model: ADaM
parent: ../../../spec/yamaa/base/adam-base.yaml
domain: ADVA
keys:
- STUDYID
- USUBJID
- PARAMCD
- AVISIT
input:
  IS: <sdtm-dir>/is.parquet
  ADSL:
    path: <adam-dir>/adsl.parquet
    key:
    - STUDYID
    - USUBJID
submission:
  label: Immunogenicity Analysis Dataset
  class: BASIC DATA STRUCTURE
  structure: One or more records per subject per analysis parameter per analysis timepoint
  repeating: true
rows:
- id: base_rows
  dataset: IS
  derivations:
    STUDYID: IS.STUDYID
    USUBJID: IS.USUBJID
    _DERIVED: 0
    _ISSEQ: IS.ISSEQ
    _ISSTAT: IS.ISSTAT
    _ISTESTCD: IS.ISTESTCD
    _ISSTRESC: IS.ISSTRESC
    _ISSTRESN: IS.ISSTRESN
    _ISLLOQ: IS.ISLLOQ
    _VISIT: IS.VISIT
    _VISITNUM: IS.VISITNUM
    _ISDTC: IS.ISDTC
    _AVAL_SRC:
      case:
      - when: _ISSTRESC = 'BLQ'
        then: _ISLLOQ * 0.5
      - otherwise: _ISSTRESN
    PARAMCD: IS.ISTESTCD
    PARAM:
      mapping:
        source: _ISTESTCD
        dict:
          C19RBDIG: COVID-19 RBD IgG (U/mL)
          C19S1IGG: COVID-19 S1 IgG (U/mL)
          C2NGNT50: SARS-CoV-2 Serum Neutralizing Titer 50
          C2NGNT90: SARS-CoV-2 Serum Neutralizing Titer 90
        unmapped: null
    PARAMN:
      mapping:
        source: _ISTESTCD
        dict:
          C19RBDIG: 1
          C19S1IGG: 2
          C2NGNT50: 3
          C2NGNT90: 4
        unmapped: null
    PARCAT1: "'IMMUNOGENICITY'"
    _BASE_PARAMCD: IS.ISTESTCD
    AVISIT: IS.VISIT
    AVISITN: IS.VISITNUM
  filter: (_ISSTAT IS NULL OR _ISSTAT IN ('')) AND _ISTESTCD IN ('C19RBDIG', 'C19S1IGG', 'C2NGNT50', 'C2NGNT90')
- id: derived_rows
  dataset: IS
  derivations:
    STUDYID: IS.STUDYID
    USUBJID: IS.USUBJID
    _DERIVED: 1
    _ISSEQ: IS.ISSEQ
    _ISSTAT: IS.ISSTAT
    _ISTESTCD: IS.ISTESTCD
    _ISSTRESC: IS.ISSTRESC
    _ISSTRESN: IS.ISSTRESN
    _ISLLOQ: IS.ISLLOQ
    _VISIT: IS.VISIT
    _VISITNUM: IS.VISITNUM
    _ISDTC: IS.ISDTC
    _AVAL_SRC:
      case:
      - when: _ISSTRESC = 'BLQ'
        then: _ISLLOQ * 0.5
      - otherwise: _ISSTRESN
    PARAMCD:
      mapping:
        source: _ISTESTCD
        dict:
          C19RBDIG: FRC19RBD
          C19S1IGG: FRC19S1I
          C2NGNT50: FRC2NT50
          C2NGNT90: FRC2NT90
        unmapped: null
    PARAM:
      mapping:
        source: _ISTESTCD
        dict:
          C19RBDIG: COVID-19 RBD IgG Fold Rise
          C19S1IGG: COVID-19 S1 IgG Fold Rise
          C2NGNT50: SARS-CoV-2 Serum Neutralizing Titer 50 Fold Rise
          C2NGNT90: SARS-CoV-2 Serum Neutralizing Titer 90 Fold Rise
        unmapped: null
    PARAMN:
      mapping:
        source: _ISTESTCD
        dict:
          C19RBDIG: 5
          C19S1IGG: 6
          C2NGNT50: 7
          C2NGNT90: 8
        unmapped: null
    PARCAT1: "'IMMUNOGENICITY'"
    _BASE_PARAMCD: IS.ISTESTCD
    AVISIT: IS.VISIT
    AVISITN: IS.VISITNUM
  filter: (_ISSTAT IS NULL OR _ISSTAT IN ('')) AND _ISTESTCD IN ('C19RBDIG', 'C19S1IGG', 'C2NGNT50', 'C2NGNT90')
    AND _VISITNUM > 2 AND _AVAL_SRC IS NOT NULL
output:
  path: <adam-dir>/adva-yamaa.parquet
  order_by:
  - USUBJID
  - AVISITN
  - PARAMN
  columns:
  - STUDYID
  - USUBJID
  - SUBJID
  - SITEID
  - TRTP
  - TRTPN
  - TRTA
  - TRTAN
  - ADT
  - ADTM
  - ATM
  - ADY
  - AVISIT
  - AVISITN
  - PARAM
  - PARAMCD
  - PARAMN
  - PARCAT1
  - AVAL
  - AVALC
  - BASE
  - CHG
  - PCHG
  - CRIT1
  - CRIT1FL
  - CRIT1FN
  - DTYPE
  - ABLFL
  - ISLLOQ
  - SAFFL
  - SAFFN
  - IMMFL
  - IMMFN
  - EXIMM1
  - PPROTFL
  - PPROTFN
  - EXPPROT1
  - COHORT
  - COHORTN
  - GROUP
  - GROUPN
  - SRCDOM
  - SRCVAR
  - SRCSEQ
  - AGE
  - AGEU
  - AGEGR1
  - AGEGR1N
  - SEX
  - SEXN
  - TRTEDT
  - TRTEDTM
  - TRTSDT
  - TRTSDTM
  - ARM
  - ACTARM
  - BOIMDT
  - BOIMDTM
  - BOIMTM
  - PRIMDT
  - PRIMDTM
  - PRIMTM
