    - when: str_contains(_ISDTC, 'T')
      then:
        impute:
          type: datetime
          source: _ISDTC
          time: first
  submission:
    core: Perm
    mandatory: false
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: ATM
  type: time
