- name: AVISITN
  type: float
  label: Analysis Visit (N)
  submission:
    core: Req
    mandatory: true
    length: 8
    significant_digits: 15
    origins:
    - type: Assigned
      description: "Withheld from publication: the received define states this text."
- name: PARAM
  type: str
  label: Parameter
  submission:
    core: Req
    mandatory: true
    length: 48
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: PARAMCD
  type: str
  label: Parameter Code
  submission:
    core: Req
    mandatory: true
    length: 8
    origins:
    - type: Assigned
      description: "Withheld from publication: the received define states this text."
- name: PARAMN
  type: int
  label: Parameter (N)
  submission:
    core: Req
    mandatory: true
    length: 8
    origins:
    - type: Assigned
      description: "Withheld from publication: the received define states this text."
- name: PARCAT1
  type: str
  label: Parameter Category 1
  submission:
    core: Req
    mandatory: true
    length: 14
    origins:
    - type: Assigned
      description: "Withheld from publication: the received define states this text."
- name: ABLFL
  type: str
  label: Baseline Record Flag
  derivation:
    baseline_flag:
      date: ADT
      reference: TRTSDT
      source: _AVALN
      window:
        group_by:
        - STUDYID
        - USUBJID
        - PARAMCD
        order_by:
        - ADT
        - ADTM
        - _ISSEQ
  submission:
    core: Perm
    mandatory: false
    length: 1
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: _BASE_ORIG
  type: float
  derivation:
    aggregate:
      filter: ABLFL = 'Y'
      group_by:
      - STUDYID
      - USUBJID
      - _BASE_PARAMCD
      expr: ONLY(_AVAL_BASE)
- name: AVAL
  type: float
  label: Analysis Value
  derivation:
    case:
    - when: _DERIVED = 1
      then: _AVAL_BASE / _BASE_ORIG
    - otherwise: _AVAL_BASE
  submission:
    # SUB-29 (yamaa #4820): numeric widths here fit the derived values. The received
    # define's Pinnacle 21 widths stay in the reproduced define layer (define/).
    core: Perm
    mandatory: false
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
    length: 20
    significant_digits: 19
- name: BASE
  type: float
  label: Baseline Value
  derivation:
    case:
    - when: _DERIVED = 0
      then: _BASE_ORIG
  submission:
    core: Perm
    mandatory: false
    length: 8
    significant_digits: 15
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: CHG
  type: float
  label: Change from Baseline
  derivation:
    case:
    - when: _DERIVED = 0 AND AVAL IS NOT NULL AND BASE IS NOT NULL
      then: AVAL - BASE
  submission:
    # SUB-29 (yamaa #4820): numeric widths here fit the derived values. The received
    # define's Pinnacle 21 widths stay in the reproduced define layer (define/).
    core: Perm
    mandatory: false
    length: 20
    significant_digits: 18
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: PCHG
  type: float
  label: Percent Change from Baseline
  derivation:
    case:
    - when: _DERIVED = 0 AND AVAL IS NOT NULL AND BASE IS NOT NULL AND BASE <> 0
      then: CHG / BASE * 100
  submission:
    # SUB-29 (yamaa #4820): numeric widths here fit the derived values. The received
    # define's Pinnacle 21 widths stay in the reproduced define layer (define/).
    core: Perm
    mandatory: false
    length: 19
    significant_digits: 17
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: CRIT1
  type: str
  label: Analysis Criterion 1
  derivation:
    case:
    - when: _DERIVED = 0 AND ADT > TRTSDT AND BASE IS NOT NULL
      then: "'Seroconversion'"
  submission:
    core: Perm
    mandatory: false
    length: 14
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: CRIT1FL
  type: str
  label: Criterion 1 Evaluation Result Flag
  derivation:
    case:
    - when: _DERIVED = 0 AND ADT > TRTSDT AND BASE IS NOT NULL AND BASE <> 0 AND AVAL / BASE >= 4
      then: "'Y'"
    - when: _DERIVED = 0 AND ADT > TRTSDT AND BASE IS NOT NULL AND BASE <> 0 AND AVAL / BASE < 4
      then: "'N'"
  submission:
    core: Perm
    mandatory: false
    length: 1
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: CRIT1FN
  type: int
  label: Criterion 1 Evaluation Result Flag (N)
  derivation:
    mapping:
      source: CRIT1FL
      dict:
        Y: 1
        N: 0
      unmapped: null
  submission:
    core: Perm
    mandatory: false
    length: 8
    origins:
    - type: Assigned
      description: "Withheld from publication: the received define states this text."
- name: _AVALC_RAW
  type: str
  derivation:
    case:
    - when: AVAL < 1
      then:
        str_decimal:
          source: AVAL
          decimals: 10
    - when: AVAL < 10
      then:
        str_decimal:
          source: AVAL
          decimals: 10
    - when: AVAL < 100
      then:
        str_decimal:
          source: AVAL
          decimals: 9
    - when: AVAL < 1000
      then:
        str_decimal:
          source: AVAL
          decimals: 8
    - when: AVAL < 10000
      then:
        str_decimal:
          source: AVAL
          decimals: 7
    - when: AVAL < 100000
      then:
        str_decimal:
          source: AVAL
          decimals: 6
