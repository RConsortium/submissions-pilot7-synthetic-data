# ADVA for Pfizer/BioNTech BNT162-01, data cut 125742 (cutoff 2020-10-23).
# Parent: ../../../27034/spec/yamaa/adva.yaml (which chains to ../../../spec/yamaa/base/adam-base.yaml) (section 3.1 core columns).
# No SAS programs were submitted; derivations implement define.xml
# MethodDefs, recovered against the submitted data (see
# the study's spec/review/README.md for the recovered rules and the open gaps).
# Core columns are copied from the submitted ADSL (mapping input,
# key STUDYID/USUBJID); IS is the only SDTM input.
# First generated by tools/gen_adva_spec.py (retired); this file is the source.
# Layer over ../27034/adva.yaml: the derivations are the parent cut's, and
# this file holds only what this cut changes (written by
# scripts/specs/inherit_cut.py; its resolved specification
# equals the standalone file it replaced).
yamaa: '1.0'
type: spec
parent: ../../../27034/spec/yamaa/adva.yaml
clear:
- columns.AGEGR1.submission.method
- columns.AGEGR1N.submission.method
input:
  IS: <sdtm-dir>/is.parquet
  ADSL:
    path: <adam-dir>/adsl.parquet
rows:
- id: base_rows
  derivations:
    PARCAT1: "'Immunogenicity'"
- id: derived_rows
  derivations:
    PARCAT1: "'Immunogenicity'"
output:
  path: <adam-dir>/adva-yamaa.parquet
  columns:
  - STUDYID
  - USUBJID
  - SUBJID
  - SITEID
  - TRTP
  - TRTPN
  - TRTA
  - TRTAN
  - ADT
  - ADTM
  - ATM
  - ADY
  - AVISIT
  - AVISITN
  - PARAM
  - PARAMCD
  - PARAMN
  - PARCAT1
  - AVAL
  - AVALC
  - BASE
  - CHG
  - PCHG
  - CRIT1
  - CRIT1FL
  - CRIT1FN
  - DTYPE
  - ABLFL
  - ISLLOQ
  - SAFFL
  - SAFFN
  - IMMFL
  - IMMFN
  - EXIMM1
  - PPROTFL
  - PPROTFN
  - EXPPROT1
  - COHORT
  - COHORTN
  - COHCAT1
  - COHCAT1N
  - COHCAT2
  - COHCAT2N
  - GROUP
  - GROUPN
  - SRCDOM
  - SRCVAR
  - SRCSEQ
  - AGE
  - AGEU
  - AGEGR1
  - AGEGR1N
  - SEX
  - SEXN
  - TRTEDT
  - TRTEDTM
  - TRTSDT
  - TRTSDTM
  - ARM
  - ACTARM
  - BOIMDT
  - BOIMDTM
  - BOIMTM
  - PRIMDT
  - PRIMDTM
  - PRIMTM
columns:
- name: TRTP
  submission:
    length: 13
- name: TRTA
  submission:
    length: 13
- name: COHCAT1
  type: str
  label: Cohort Category 1
  derivation: ADSL.COHCAT1
  submission:
    core: Req
    mandatory: true
    length: 20
    origins:
    - type: Predecessor
      description: ADSL.COHCAT1
- name: COHCAT1N
  type: int
  label: Cohort Category 1 (N)
  derivation: ADSL.COHCAT1N
  submission:
    core: Req
    mandatory: true
    length: 8
    origins:
    - type: Predecessor
      description: ADSL.COHCAT1N
- name: COHCAT2
  type: str
  label: Cohort Category 2
  derivation: ADSL.COHCAT2
  submission:
    core: Req
    mandatory: true
    length: 28
    origins:
    - type: Predecessor
      description: ADSL.COHCAT2
- name: COHCAT2N
  type: int
  label: Cohort Category 2 (N)
  derivation: ADSL.COHCAT2N
  submission:
    core: Req
    mandatory: true
    length: 8
    origins:
    - type: Predecessor
      description: ADSL.COHCAT2N
- name: AGEGR1
  derivation: ADSL.AGEGR1
  submission:
    origins:
    - type: Predecessor
      description: ADSL.AGEGR1
- name: AGEGR1N
  derivation: ADSL.AGEGR1N
  submission:
    origins:
    - type: Predecessor
      description: ADSL.AGEGR1N
- name: ARM
  submission:
    length: 24
- name: ACTARM
  submission:
    length: 24
- name: PARCAT1
  submission:
    origins:
    - type: Assigned
      description: "Withheld from publication: the received define states this text."
- name: AVAL
  submission:
    # SUB-29 (yamaa #4820): numeric widths here fit the derived values. The received
    # define's Pinnacle 21 widths stay in the reproduced define layer (define/).
    length: 20
- name: DTYPE
  derivation:
    case:
    - when: _DERIVED = 0 AND _ISSTRESC = 'BLQ'
      then: "'HALFLLOQ'"
  submission:
    length: 8
    method: "Withheld from publication: the received define states this text."
