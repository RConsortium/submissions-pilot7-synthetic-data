      source: _ATPTN
      decimals: 0
- name: COHORT
  submission:
    length: 9
- name: COHCAT1
  type: str
  label: Cohort Category 1
  derivation: ADSL.COHCAT1
  submission:
    core: Req
    mandatory: true
    length: 20
