# Parent: ../../../27034/spec/yamaa/adfacevd.yaml (which chains to ../../../spec/yamaa/base/adam-base.yaml) (section 3.1 core columns).
# No SAS programs were submitted; derivations implement define.xml
# MethodDefs, the ADRG Appendix IV parameter catalogue and the SAP,
# recovered against the submitted data (see the study's spec/review/README.md
# for the recovered rules and the open gaps).
# First generated by tools/gen_adfacevd_spec.py (retired); this file is the source.
# Layer over ../27034/adfacevd.yaml: the derivations are the parent cut's, and
# this file holds only what this cut changes (written by
