  filter: FACE.FATESTCD = 'OCCUR' AND FACE.FAEVAL = 'STUDY SUBJECT' AND FACE.FAOBJ <> 'All Objects of the Observation' AND FACE.FASTRESC = 'Y' AND FACE.FADY IS NOT NULL AND FACE.FADTC <> ''
  order_by:
  - FACE.FADY
  - FACE.FADTC
  - FACE.FASEQ
  keep: first
  derivations:
    _ATPTN:
      type: int
      derivation:
        case:
        - when: str_contains(FACE.FATPT, 'DAY')
          then: FACE.FATPTNUM - 1
        - otherwise:
