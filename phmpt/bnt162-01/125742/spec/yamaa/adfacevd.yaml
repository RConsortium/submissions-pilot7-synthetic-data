- id: tte_pis
  dataset: FACE
  group_by:
  - FACE.STUDYID
  - FACE.USUBJID
  - FACE.FATPTREF
  - FACE.FAOBJ
  derivations:
    STUDYID: FACE.STUDYID
    USUBJID: FACE.USUBJID
    _ADSL: ADSL.USUBJID
    _REF: FACE.FATPTREF
    _N_Y:
      aggregate:
        filter: FACE.FATESTCD = 'OCCUR' AND FACE.FAEVAL = 'STUDY SUBJECT' AND FACE.FAOBJ <> 'All Objects of the Observation' AND FACE.FASTRESC = 'Y' AND FACE.FADY IS NOT NULL AND FACE.FADTC <> ''
        expr: COUNT(FACE.FASEQ)
    _ATPTREF:
      case:
      - when: FACE.FATPTREF = 'PRIME VACCINATION'
        then: "'Prime'"
      - when: FACE.FATPTREF = 'BOOST VACCINATION'
        then: "'Boost'"
      - otherwise:
    _REFDT:
      case:
      - when: _ATPTREF = 'Prime'
        then: ADSL.PRIMDT
      - when: _ATPTREF = 'Boost'
        then: ADSL.BOIMDT
      - otherwise:
    _REFDTM:
      case:
      - when: _ATPTREF = 'Prime'
        then: ADSL.PRIMDTM
      - when: _ATPTREF = 'Boost'
        then: ADSL.BOIMDTM
      - otherwise:
    _OBJ: FACE.FAOBJ
    _PARAMCD: "'TTEPIS'"
    _PARAM: "'Time to first pain at injection site'"
    _PARAMN: 1001
    _PARCAT1: "'local'"
    _AVALCAT1:
    _PARCAT2: "'time to first'"
    _ANL01FL:
      case:
      - when: _ADTM IS NOT NULL AND _ADTM < _REFDTM
        then:
      - otherwise: "'Y'"
    _SRCDOM: "'FA'"
    _FADTC: OC_FIRST.FADTC
    _ADT:
      to_date:
        source: _FADTC
    _ADTM:
      case:
      - when: str_contains(_FADTC, 'T')
        then:
          impute:
            type: datetime
            source: _FADTC
            time: first
    _ADY: OC_FIRST.FADY
    _REL_DAYS:
      diff:
        type: date
        start: _REFDT
        end: _ADT
        unit: day
    _AVAL: _REL_DAYS + 1
    _ATPTN: OC_FIRST._ATPTN
    _ATPT:
      case:
      - when: _ATPTN IS NULL
        then:
      - otherwise:
          str_template: Day {_ATPTN_STR}
    _FATPT: OC_FIRST.FATPT
    _FATPTREF: OC_FIRST.FATPTREF
    _FAOBJ: OC_FIRST.FAOBJ
    _FATEST: OC_FIRST.FATEST
    _FATESTCD: OC_FIRST.FATESTCD
    _FASCAT: OC_FIRST.FASCAT
    _FASTRESC: OC_FIRST.FASTRESC
    _SEQ: OC_FIRST.FASEQ
    _FALNKID: OC_FIRST.FALNKID
    _FALNKGRP: OC_FIRST.FALNKGRP
    _ATPTN_STR:
      str_decimal:
        source: _ATPTN
        decimals: 0
    _ASTDT:
    _ASTDY:
    _AENDT:
    _AENDY:
    _AVALC:
    _VSDTC:
    _VSTPT:
    _VSTPTREF:
    _VSSTRESN:
    _VSTEST:
    _VSTESTCD:
    _SRCVAR:
    _VSLNKID:
    _VSLNKGRP:
    _N_3:
    _REL_AST:
    _REL_END:
    _VS_EXISTS:
    _VS_EXISTS_3:
    _FA_ADY:
    _VS_ADY:
    _USE_VS:
    _DTC:
    _ASTDT_FA:
    _ASTDT_VS:
    _AENDT_FA:
    _AENDT_VS:
    _FA_ADY_L:
    _VS_ADY_L:
    _USE_VS_LAST:
  filter: _N_Y > 0 AND _ADSL IS NOT NULL AND _OBJ = 'Injection site reaction - Pain'
