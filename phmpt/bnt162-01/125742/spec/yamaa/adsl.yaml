# ADSL for Pfizer/BioNTech BNT162-01, data cut 125742 (cutoff 2020-10-23).
# Parent: ../../../27034/spec/yamaa/adsl.yaml (which chains to ../../../spec/yamaa/base/adam-base.yaml) (section 3.1 core columns).
# No SAS programs were submitted; derivations implement define.xml
# MethodDefs, recovered against the submitted data (see
# the study's spec/review/README.md for the recovered rules and the open gaps).
# First generated by tools/gen_adsl_spec.py (retired); this file is the source.
# Layer over ../27034/adsl.yaml: the derivations are the parent cut's, and
# this file holds only what this cut changes (written by
# scripts/specs/inherit_cut.py; its resolved specification
# equals the standalone file it replaced).
yamaa: '1.0'
type: spec
parent: ../../../27034/spec/yamaa/adsl.yaml
clear:
- columns.HEIGHT.submission.significant_digits
input:
  DM: <sdtm-dir>/dm.parquet
  DS: <sdtm-dir>/ds.parquet
  EC: <sdtm-dir>/ec.parquet
  VS: <sdtm-dir>/vs.parquet
  IS: <sdtm-dir>/is.parquet
  DV: <sdtm-dir>/dv.parquet
  SUPPDM: <sdtm-dir>/suppdm.parquet
  SUPPDS: <sdtm-dir>/suppds.parquet
  TS: <sdtm-dir>/ts.parquet
intermediates:
- id: DS_ICR4
  dataset: DS
  key:
  - STUDYID
  - USUBJID
  filter: DS.DSDECOD = 'INFORMED CONSENT RECONSENTED'
  nearest:
    source: _D
    to: ICR4DT
    unit: day
  derivations:
    _D:
      type: date
      derivation:
        to_date:
          source: DS.DSSTDTC
    _PROTVERS:
      type: str
      derivation: SUPPDS_BYSEQ.PROTVERS
output:
  path: <adam-dir>/adsl-yamaa.parquet
  columns:
  - STUDYID
  - USUBJID
  - SUBJID
  - SUBJIDN
  - SITEID
  - INVID
  - INVNAM
  - AGE
  - AGEU
  - AGE_M
  - AAGE
  - AGEGR1
  - AGEGR1N
  - SEX
  - SEXN
  - RACE
  - RACEN
  - RACEOTH
  - RACE1
  - RACE2
  - ETHNIC
  - ETHNICN
  - HEIGHT
  - WEIGHT
  - BMI
  - SCRFL
  - SCRFN
  - EXSCR1
  - SAFFL
  - SAFFN
  - EXSAF1
  - SAFBFL
  - SAFBFN
  - EXSAFB1
  - IMMFL
  - IMMFN
  - EXIMM1
  - PPROTFL
  - PPROTFN
  - EXPPROT1
  - CP7FL
  - CP7FN
  - CPBP28FL
  - CPBP28FN
  - CB7FL
  - CB7FN
  - CB28FL
  - CB28FN
  - CPB28FL
  - CPB28FN
  - COMPLFL
  - COMPLFN
  - COHORT
  - COHORTN
  - COHCAT1
  - COHCAT1N
  - COHCAT2
  - COHCAT2N
  - GROUP
  - GROUPN
  - ARM
  - ACTARM
  - TRT01P
  - TRT01PN
  - TRT01A
  - TRT01AN
  - TRTSDT
  - TRTSTM
  - TRTSDTM
  - TRTEDT
  - TRTETM
  - TRTEDTM
  - RFICDT
  - RFICTM
  - RFICDTM
  - SCRDT
  - ALLOCDT
  - ALLOCTM
  - ALLOCDTM
  - LVDT
  - EOSSTT
  - EOSDT
  - EOFUDT
  - DCSREAS
  - DCSREASP
  - DTHFL
  - DTHDT
  - PRIMDT
  - PRIMTM
  - PRIMDTM
  - BOIMDT
  - BOIMTM
  - BOIMDTM
  - DSEPRELI
  - PREV_TSN
  - FIRICDT
  - ICR1DT
  - ICR1TM
  - ICR1DTM
  - ICR2DT
  - ICR2TM
  - ICR2DTM
  - ICR3DT
  - ICR3TM
  - ICR3DTM
  - ICR4DT
  - ICR4TM
  - ICR4DTM
  - PROTVER1
  - PROTVER2
  - PROTVER3
  - PROTVER4
  - PROTVER5
columns:
- name: _ICR_DTC4
  type: str
  derivation:
    str_extract:
      source: _ICR_DTC_JOIN
      pattern: ^(?:[^\x1f]*\x1f){3}([^\x1f]*)
      group: 1
      no_match:
- name: _SUFFIX
  type: str
  derivation:
    case:
    - when: COHORTN >= 8
      then: "' Older'"
    - otherwise: "' Younger'"
- name: _OLDER_ADD
  type: int
  derivation:
    case:
    - when: COHORTN >= 8
      then: 100000
    - otherwise: 0
- name: AGEGR1
  type: str
  label: Pooled Age Group 1
  derivation:
    case:
    - when: AGE <= 55
      then: "'18 - 55 Yrs'"
    - otherwise: "'> 55 Yrs'"
  submission:
    core: Req
    mandatory: true
    length: 11
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: AGEGR1N
  type: int
  label: Pooled Age Group 1 (N)
  derivation:
    mapping:
      source: AGEGR1
      dict:
        18 - 55 Yrs: 1
        '> 55 Yrs': 2
      unmapped:
  submission:
    core: Req
    mandatory: true
    length: 8
    origins:
    - type: Assigned
      description: "Withheld from publication: the received define states this text."
- name: HEIGHT
  type: int
- name: WEIGHT
  submission:
    significant_digits: 1
- name: BMI
  submission:
    significant_digits: 1
- name: CP7FL
  submission:
    method: "Withheld from publication: the received define states this text."
- name: CPBP28FL
  submission:
    method: "Withheld from publication: the received define states this text."
- name: CB7FL
  submission:
    method: "Withheld from publication: the received define states this text."
- name: CB28FL
  submission:
    method: "Withheld from publication: the received define states this text."
- name: COHORT
  submission:
    length: 9
- name: COHCAT1
  type: str
  label: Cohort Category 1
  derivation:
    case:
    - when: COHORTN <= 10
      then: "'Dose ranging cohorts'"
  submission:
    core: Req
    mandatory: true
    length: 20
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: COHCAT1N
  type: int
  label: Cohort Category 1 (N)
  derivation:
    mapping:
      source: COHCAT1
      dict:
        Dose ranging cohorts: 1
      unmapped:
  submission:
    core: Req
    mandatory: true
    length: 8
    origins:
    - type: Assigned
      description: "Withheld from publication: the received define states this text."
- name: COHCAT2
  type: str
  label: Cohort Category 2
  derivation:
    case:
    - when: COHORTN < 8
      then: "'Younger dose ranging cohorts'"
    - otherwise: "'Older dose ranging cohorts'"
  submission:
    core: Req
    mandatory: true
    length: 28
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: COHCAT2N
  type: int
  label: Cohort Category 2 (N)
  derivation:
    mapping:
      source: COHCAT2
      dict:
        Younger dose ranging cohorts: 1
        Older dose ranging cohorts: 2
      unmapped:
  submission:
    core: Req
    mandatory: true
    length: 8
    origins:
    - type: Assigned
      description: "Withheld from publication: the received define states this text."
- name: ARM
  submission:
    length: 24
- name: ACTARM
  submission:
    length: 24
- name: TRT01P
  derivation:
    str_template: "{_DOSE_STR} \xB5g{_SUFFIX}"
  submission:
    length: 13
    method: "Withheld from publication: the received define states this text."
- name: TRT01PN
  derivation: _DOSE_NUM * 100 + _OLDER_ADD
  submission:
    method: "Withheld from publication: the received define states this text."
- name: TRT01A
  derivation:
    str_template: "{_ADOSE_STR} \xB5g{_SUFFIX}"
  submission:
    length: 13
    method: "Withheld from publication: the received define states this text."
- name: TRT01AN
  derivation: _ADOSE_NUM * 100 + _OLDER_ADD
  submission:
    method: "Withheld from publication: the received define states this text."
- name: ICR4DT
  type: date
  label: Date of Informed Consent Reconsented 4
  derivation:
    to_date:
      source: _ICR_DTC4
  submission:
    core: Perm
    mandatory: false
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: ICR4TM
  type: time
  label: Time of Informed Consent Reconsented 4
  derivation:
    to_time:
      source: ICR4DTM
  submission:
    core: Perm
    mandatory: false
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: ICR4DTM
  type: datetime
  label: Datetime of Informed Consent Recons. 4
  derivation:
    case:
    - when: str_contains(_ICR_DTC4, 'T')
      then:
        impute:
          type: datetime
          source: _ICR_DTC4
          time: first
  submission:
    core: Perm
    mandatory: false
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
- name: PROTVER5
  type: str
  label: Fifth Protocol Version signed
  derivation: DS_ICR4._PROTVERS
  submission:
    core: Perm
    mandatory: false
    length: 16
    origins:
    - type: Derived
    method: "Withheld from publication: the received define states this text."
