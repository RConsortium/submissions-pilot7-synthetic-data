# ADVS for Pfizer/BioNTech BNT162-01, data cut 125742 (cutoff 2020-10-23).
# Parent: ../../../27034/spec/yamaa/advs.yaml (which chains to ../../../spec/yamaa/base/adam-base.yaml) (section 3.1 core columns).
# No SAS programs were submitted; derivations implement define.xml
# MethodDefs, recovered against the submitted data (see
# the study's spec/review/README.md for the recovered rules).
# First generated by tools/gen_advs_spec.py (retired); this file is the source.
# Layer over ../27034/advs.yaml: the derivations are the parent cut's, and
# this file holds only what this cut changes (written by
# scripts/specs/inherit_cut.py; its resolved specification
# equals the standalone file it replaced).
yamaa: '1.0'
type: spec
parent: ../../../27034/spec/yamaa/advs.yaml
clear:
- columns.VSTPT.submission.method
- columns.VSTPTNUM.submission.method
input:
  VS: <sdtm-dir>/vs.parquet
  SUPPVS: <sdtm-dir>/suppvs.parquet
  ADSL:
    path: <adam-dir>/adsl.parquet
windows:
  ASEQ_W:
    order_by:
    - PARAMN
    - AVISITN
    - ADT
    - ADTM
    - VSSEQ
output:
  path: <adam-dir>/advs-yamaa.parquet
  columns:
  - STUDYID
  - USUBJID
  - SUBJID
  - SUBJIDN
  - COHORT
  - COHORTN
  - GROUP
  - GROUPN
  - TRTP
  - TRTPN
  - TRTA
  - TRTAN
  - VSSEQ
  - ASEQ
  - PARAM
  - PARAMCD
  - PARAMN
  - PARCAT1
  - PARCAT1N
  - PARCAT2
  - PARCAT2N
  - VSPOS
  - AVAL
  - AVALC
  - VSCLSIG
  - VSCLSIGN
  - ABLFL
  - BASE
  - BASEC
  - CHG
  - PCHG
  - ANRIND
  - BNRIND
  - ANRLO
  - ANRHI
  - NABCS
  - NABCSN
  - ANL01FL
  - ANL02FL
  - UNSVFL
  - POBLFL
  - VSLOC
  - VSLAT
  - VSDTC
  - ADT
  - ATM
  - ADTM
  - VSDY
  - ADY
  - VSTPT
  - VSTPTNUM
  - ATPT
  - ATPTN
  - VSTPTREF
  - ATPTREF
  - VSRFTDTC
  - AVISIT
  - AVISITN
  - VISIT
  - VISITNUM
  - EPOCH
  - AGE
  - AGEU
  - SEX
  - SEXN
  - RACE
  - RACEN
  - SCRFL
  - SCRFN
  - SAFFL
  - SAFFN
  - SAFBFL
  - SAFBFN
  - IMMFL
  - IMMFN
  - COHCAT1
  - COHCAT1N
  - COHCAT2
  - COHCAT2N
  - CP7FL
  - CP7FN
  - CPBP28FL
  - CPBP28FN
  - CB7FL
  - CB7FN
  - CB28FL
  - CB28FN
  - CPB28FL
  - CPB28FN
  - COMPLFL
  - COMPLFN
  - TRTSDT
  - TRTSTM
  - TRTSDTM
  - TRTEDT
  - TRTETM
  - TRTEDTM
  - ALLOCDT
  - ALLOCTM
  - ALLOCDTM
  - SRCDOM
  - SRCVAR
  - SRCSEQ
columns:
- name: COHORT
  submission:
    length: 9
- name: TRTP
  submission:
    length: 13
- name: TRTA
  submission:
    length: 13
- name: PARAM
  derivation:
    case:
    - when: VS.VSTESTCD = 'BMI'
      then: "'Body Mass Index [kg/m2]'"
    - when: VS.VSTESTCD = 'DIABP'
      then: "'Diastolic Blood Pressure [mmHg]'"
    - when: VS.VSTESTCD = 'HEIGHT'
      then: "'Height [cm]'"
    - when: VS.VSTESTCD = 'PULSE'
      then: "'Pulse Rate [beats/min]'"
    - when: VS.VSTESTCD = 'RESP'
      then: "'Respiratory Rate [breaths/min]'"
    - when: VS.VSTESTCD = 'SYSBP'
      then: "'Systolic Blood Pressure [mmHg]'"
    - when: VS.VSTESTCD = 'WEIGHT'
      then: "'Weight [kg]'"
    - when: VS.VSTESTCD = 'TEMP' AND VS.VSCAT = 'REACTOGENICITY'
      then: "'Temperature (Reactogenicity) [\xB0C]'"
    - when: VS.VSTESTCD = 'TEMP'
      then: "'Temperature [\xB0C]'"
  submission:
    length: 33
- name: AVAL
  submission:
    significant_digits: 1
- name: BASE
  submission:
    significant_digits: 1
- name: BASEC
  submission:
    length: 1
- name: CHG
  submission:
    # SUB-29 (yamaa #4820): numeric widths here fit the derived values. The received
    # define's Pinnacle 21 widths stay in the reproduced define layer (define/).
    significant_digits: 17
- name: ANRLO
  submission:
    significant_digits: 1
- name: ANRHI
  submission:
    significant_digits: 1
- name: POBLFL
  submission:
    method: "Withheld from publication: the received define states this text."
- name: VSTPT
  derivation: VS.VSTPT
  submission:
    origins:
    - type: Predecessor
      description: VS.VSTPT
- name: VSTPTNUM
  derivation: VS.VSTPTNUM
  submission:
    origins:
    - type: Predecessor
      description: VS.VSTPTNUM
- name: ATPTN
  derivation: VS.VSTPTNUM
- name: AVISIT
  submission:
    method: "Withheld from publication: the received define states this text."
- name: AVISITN
  submission:
    method: "Withheld from publication: the received define states this text."
- name: EPOCH
  submission:
    core: Perm
    mandatory: false
- name: COHCAT1
  type: str
  label: Cohort Category 1
  derivation: ADSL.COHCAT1
  submission:
    core: Req
    mandatory: true
    length: 20
    origins:
    - type: Predecessor
      description: ADSL.COHCAT1
- name: COHCAT1N
  type: int
  label: Cohort Category 1 (N)
  derivation: ADSL.COHCAT1N
  submission:
    core: Req
    mandatory: true
    length: 8
    origins:
    - type: Predecessor
      description: ADSL.COHCAT1N
- name: COHCAT2
  type: str
  label: Cohort Category 2
  derivation: ADSL.COHCAT2
  submission:
    core: Req
    mandatory: true
    length: 28
    origins:
    - type: Predecessor
      description: ADSL.COHCAT2
- name: COHCAT2N
  type: int
  label: Cohort Category 2 (N)
  derivation: ADSL.COHCAT2N
  submission:
    core: Req
    mandatory: true
    length: 8
    origins:
    - type: Predecessor
      description: ADSL.COHCAT2N
