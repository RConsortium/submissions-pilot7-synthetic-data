yamaa: '1.0'
type: spec
model: SDTM
domain: EX
keys:
- STUDYID
- USUBJID
- EXSEQ
input:
  RAW:
    path: ../../../data/odm/extracted/ex.csv
    types:
      SRCSEQ: int
      VISITNUM: int
  DM:
    path: ../../../data/sdtm/dm-yamaa.parquet
    schema: ../sdtm/dm.yaml
    key:
    - STUDYID
    - USUBJID
output:
  path: ../../../data/sdtm/ex-yamaa.parquet
  columns:
  - DOMAIN
  - STUDYID
  - USUBJID
  - EXSEQ
  - EXSPID
  - EXREFID
  - EXTRT
  - EXDOSE
  - EXDOSU
  - EXROUTE
  - EXSTDTC
  - EXADJ
  - VISIT
  - VISITNUM
  - EXDY
  report: ../../../data/sdtm/ex-report.parquet
  order_by:
  - STUDYID
  - USUBJID
  - EXSEQ
columns:
- name: DOMAIN
  type: str
  label: DOMAIN
  derivation: '''EX'''
  submission:
    mandatory: true
    origins:
    - type: Assigned
      source: Sponsor
    method: 'Executable derivation in the retained yamaa specification: ''''''EX'''''''
    length: 2
    core: Req
    role: Identifier
- name: STUDYID
  type: str
  label: Study Identifier
  derivation: RAW.STUDYID
  submission:
    mandatory: true
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.STUDYID

      ...'
    length: 12
    core: Req
    role: Identifier
- name: USUBJID
  type: str
  label: Unique Subject Identifier
  derivation: RAW.USUBJID
  submission:
    mandatory: true
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.USUBJID

      ...'
    length: 40
    core: Req
    role: Identifier
- name: EXSEQ
  type: int
  label: Sequence Number
  derivation: RAW.SRCSEQ
  submission:
    mandatory: true
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.SRCSEQ

      ...'
    length: 8
    core: Req
    role: Identifier
- name: EXSPID
  type: str
  label: Source Group Identifier
  derivation: RAW.GROUPOID
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.GROUPOID

      ...'
    length: 100
    core: Perm
    role: Record Qualifier
- name: EXREFID
  type: str
  label: Source Group Repeat Identifier
  derivation: RAW.GROUPREP
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.GROUPREP

      ...'
    length: 100
    core: Perm
    role: Record Qualifier
- name: EXTRT
  type: str
  label: Name of Treatment
  derivation: RAW.EXTRT
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.EXTRT

      ...'
    length: 100
    core: Perm
    role: Topic
- name: EXDOSE
  type: float
  label: Dose
  derivation: RAW.EXDOSE
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.EXDOSE

      ...'
    length: 8
    significant_digits: 8
    core: Perm
    role: Record Qualifier
- name: EXDOSU
  type: str
  label: Dose Units
  derivation: RAW.EXDOSU
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.EXDOSU

      ...'
    length: 100
    core: Perm
    role: Record Qualifier
- name: EXROUTE
  type: str
  label: Route of Administration
  derivation: RAW.EXROUTE
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.EXROUTE

      ...'
    length: 100
    core: Perm
    role: Record Qualifier
- name: EXSTDTC
  type: str
  label: Start Date/Time of Treatment
  derivation: RAW.EXDTC
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.EXDTC

      ...'
    length: 10
    core: Perm
    role: Timing
- name: EXADJ
  type: str
  label: Reason for Dose Adjustment
  derivation: RAW.EXADJ
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.EXADJ

      ...'
    length: 100
    core: Perm
    role: Record Qualifier
- name: VISIT
  type: str
  label: Visit Name
  derivation: RAW.VISIT
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.VISIT

      ...'
    length: 100
    core: Perm
    role: Timing
- name: VISITNUM
  type: int
  label: Source Visit Order
  derivation: RAW.VISITNUM
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.VISITNUM

      ...'
    length: 8
    core: Perm
    role: Timing
- name: _RDATE
  type: date
  label: Internal Collection Date
  derivation:
    to_date:
      source: EXSTDTC
- name: _REFDT
  type: date
  label: Internal Reference Date
  derivation:
    to_date:
      source: DM.RFSTDTC
- name: EXDY
  type: int
  label: Study Day
  derivation:
    study_day:
      source: _RDATE
      reference: _REFDT
  submission:
    mandatory: false
    origins:
    - type: Derived
      source: Sponsor
    method: "Executable derivation in the retained yamaa specification: study_day:\n  reference: _REFDT\n  source:\
      \ _RDATE"
    length: 8
    core: Perm
    role: Timing
submission:
  label: Exposure
  class: INTERVENTIONS
  structure: One record per subject and declared keys
  repeating: true
  comment: Synthetic development output. Review findings before analysis use.
base: RAW
