yamaa: '1.0'
type: spec
model: SDTM
domain: MH
keys:
- STUDYID
- USUBJID
- MHSEQ
input:
  RAW:
    path: ../../../data/odm/extracted/mh.csv
    types:
      SRCSEQ: int
      VISITNUM: int
  DM:
    path: ../../../data/sdtm/dm-yamaa.parquet
    schema: ../sdtm/dm.yaml
    key:
    - STUDYID
    - USUBJID
output:
  path: ../../../data/sdtm/mh-yamaa.parquet
  columns:
  - DOMAIN
  - STUDYID
  - USUBJID
  - MHSEQ
  - MHSPID
  - MHREFID
  - MHTERM
  - MHDECOD
  - MHBODSYS
  - MHDTC
  - VISIT
  - VISITNUM
  - MHDY
  report: ../../../data/sdtm/mh-report.parquet
  order_by:
  - STUDYID
  - USUBJID
  - MHSEQ
columns:
- name: DOMAIN
  type: str
  label: DOMAIN
  derivation: '''MH'''
  submission:
    mandatory: true
    origins:
    - type: Assigned
      source: Sponsor
    method: 'Executable derivation in the retained yamaa specification: ''''''MH'''''''
    length: 2
    core: Req
    role: Identifier
- name: STUDYID
  type: str
  label: Study Identifier
  derivation: RAW.STUDYID
  submission:
    mandatory: true
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.STUDYID

      ...'
    length: 12
    core: Req
    role: Identifier
- name: USUBJID
  type: str
  label: Unique Subject Identifier
  derivation: RAW.USUBJID
  submission:
    mandatory: true
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.USUBJID

      ...'
    length: 40
    core: Req
    role: Identifier
- name: MHSEQ
  type: int
  label: Sequence Number
  derivation: RAW.SRCSEQ
  submission:
    mandatory: true
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.SRCSEQ

      ...'
    length: 8
    core: Req
    role: Identifier
- name: MHSPID
  type: str
  label: Source Group Identifier
  derivation: RAW.GROUPOID
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.GROUPOID

      ...'
    length: 100
    core: Perm
    role: Record Qualifier
- name: MHREFID
  type: str
  label: Source Group Repeat Identifier
  derivation: RAW.GROUPREP
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.GROUPREP

      ...'
    length: 100
    core: Perm
    role: Record Qualifier
- name: MHTERM
  type: str
  label: Reported Term for the Medical History
  derivation: RAW.MHTERM
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.MHTERM

      ...'
    length: 100
    core: Perm
    role: Topic
- name: MHDECOD
  type: str
  label: Source Coded Medical History Term
  derivation: RAW.MHDECOD
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.MHDECOD

      ...'
    length: 100
    core: Perm
    role: Record Qualifier
- name: MHBODSYS
  type: str
  label: Body System or Organ Class
  derivation: RAW.MHBODSYS
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.MHBODSYS

      ...'
    length: 100
    core: Perm
    role: Record Qualifier
- name: MHDTC
  type: str
  label: Date/Time of Collection
  derivation: RAW.MHDTC
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.MHDTC

      ...'
    length: 10
    core: Perm
    role: Timing
- name: VISIT
  type: str
  label: Visit Name
  derivation: RAW.VISIT
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.VISIT

      ...'
    length: 100
    core: Perm
    role: Timing
- name: VISITNUM
  type: int
  label: Source Visit Order
  derivation: RAW.VISITNUM
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.VISITNUM

      ...'
    length: 8
    core: Perm
    role: Timing
- name: _RDATE
  type: date
  label: Internal Collection Date
  derivation:
    to_date:
      source: MHDTC
- name: _REFDT
  type: date
  label: Internal Reference Date
  derivation:
    to_date:
      source: DM.RFSTDTC
- name: MHDY
  type: int
  label: Study Day
  derivation:
    study_day:
      source: _RDATE
      reference: _REFDT
  submission:
    mandatory: false
    origins:
    - type: Derived
      source: Sponsor
    method: "Executable derivation in the retained yamaa specification: study_day:\n  reference: _REFDT\n  source:\
      \ _RDATE"
    length: 8
    core: Perm
    role: Timing
submission:
  label: Medical History
  class: EVENTS
  structure: One record per subject and declared keys
  repeating: true
  comment: Synthetic development output. Review findings before analysis use.
base: RAW
