yamaa: '1.0'
type: spec
model: SDTM
domain: DM
keys:
- STUDYID
- USUBJID
input:
  RAW:
    path: ../../../data/odm/extracted/dm.csv
    types:
      SRCSEQ: int
      VISITNUM: int
  DSRAW:
    path: ../../../data/odm/extracted/ds.csv
    types:
      SRCSEQ: int
      VISITNUM: int
output:
  path: ../../../data/sdtm/dm-yamaa.parquet
  columns:
  - DOMAIN
  - STUDYID
  - USUBJID
  - SUBJID
  - SITEID
  - RFSTDTC
  - AGE
  - AGEU
  - SEX
  - RACE
  - ETHNIC
  - COUNTRY
  - ARMCD
  - ARM
  report: ../../../data/sdtm/dm-report.parquet
  order_by:
  - STUDYID
  - USUBJID
columns:
- name: DOMAIN
  type: str
  label: DOMAIN
  derivation: '''DM'''
  submission:
    mandatory: true
    origins:
    - type: Assigned
      source: Sponsor
    method: 'Executable derivation in the retained yamaa specification: ''''''DM'''''''
    length: 2
    core: Req
    role: Identifier
- name: STUDYID
  type: str
  label: Study Identifier
  derivation: RAW.STUDYID
  submission:
    mandatory: true
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.STUDYID

      ...'
    length: 12
    core: Req
    role: Identifier
- name: USUBJID
  type: str
  label: Unique Subject Identifier
  derivation: RAW.USUBJID
  submission:
    mandatory: true
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.USUBJID

      ...'
    length: 40
    core: Req
    role: Identifier
- name: SUBJID
  type: str
  label: Subject Identifier for the Study
  derivation:
    str_extract:
      source: RAW.USUBJID
      pattern: ([0-9]+)$
      group: 1
  submission:
    mandatory: false
    origins:
    - type: Derived
      source: Sponsor
    method: "Executable derivation in the retained yamaa specification: str_extract:\n  group: 1\n  pattern: ([0-9]+)$\n\
      \  source: RAW.USUBJID"
    length: 12
    core: Perm
    role: Record Qualifier
- name: SITEID
  type: str
  label: Study Site Identifier
  derivation: RAW.SITEID
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.SITEID

      ...'
    length: 12
    core: Perm
    role: Record Qualifier
- name: RFSTDTC
  type: str
  label: Subject Reference Start Date/Time
  derivation: RAND.DSSTDTC
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAND.DSSTDTC

      ...'
    length: 10
    core: Perm
    role: Timing
- name: AGE
  type: int
  label: Age
  derivation: RAW.AGE
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.AGE

      ...'
    length: 8
    core: Perm
    role: Record Qualifier
- name: AGEU
  type: str
  label: Age Units
  derivation: '''YEARS'''
  submission:
    mandatory: false
    origins:
    - type: Assigned
      source: Sponsor
    method: 'Executable derivation in the retained yamaa specification: ''''''YEARS'''''''
    length: 100
    core: Perm
    role: Record Qualifier
- name: SEX
  type: str
  label: Sex
  derivation: RAW.SEX
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.SEX

      ...'
    length: 1
    core: Perm
    role: Record Qualifier
- name: RACE
  type: str
  label: Race
  derivation:
    case:
    - when: RAW.RACE = 'BLACK'
      then: '''BLACK OR AFRICAN AMERICAN'''
    - otherwise: RAW.RACE
  submission:
    mandatory: false
    origins:
    - type: Derived
      source: Sponsor
    method: "Executable derivation in the retained yamaa specification: case:\n- then: '''BLACK OR AFRICAN AMERICAN'''\n\
      \  when: RAW.RACE = 'BLACK'\n- otherwise: RAW.RACE"
    length: 100
    core: Perm
    role: Record Qualifier
- name: ETHNIC
  type: str
  label: Ethnicity
  derivation: RAW.ETHNIC
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.ETHNIC

      ...'
    length: 100
    core: Perm
    role: Record Qualifier
- name: COUNTRY
  type: str
  label: Country
  derivation: RAW.COUNTRY
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.COUNTRY

      ...'
    length: 3
    core: Perm
    role: Record Qualifier
- name: ARMCD
  type: str
  label: Planned Arm Code
  derivation: RAW.ARMCD
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.ARMCD

      ...'
    length: 8
    core: Perm
    role: Record Qualifier
- name: ARM
  type: str
  label: Description of Planned Arm
  derivation: RAW.ARM
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.ARM

      ...'
    length: 80
    core: Perm
    role: Record Qualifier
submission:
  label: Demographics
  class: SPECIAL PURPOSE
  structure: One record per subject
  repeating: false
  comment: Synthetic development output. Review findings before analysis use.
base: RAW
intermediates:
- id: RAND
  dataset: DSRAW
  key:
  - STUDYID
  - USUBJID
  filter: DSRAW.DSDECOD = 'RANDOMIZED'
  require_match: true
