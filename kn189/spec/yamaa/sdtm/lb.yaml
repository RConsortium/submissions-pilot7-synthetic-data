yamaa: '1.0'
type: spec
model: SDTM
domain: LB
keys:
- STUDYID
- USUBJID
- LBSEQ
input:
  DM:
    path: ../../../data/sdtm/dm-yamaa.parquet
    schema: ../sdtm/dm.yaml
    key:
    - STUDYID
    - USUBJID
  LBCHEMRAW:
    path: ../../../data/odm/extracted/lb_chem.csv
    types:
      SRCSEQ: int
      VISITNUM: int
  LBHEMRAW:
    path: ../../../data/odm/extracted/lb_hem.csv
    types:
      SRCSEQ: int
      VISITNUM: int
  LBTHYRAW:
    path: ../../../data/odm/extracted/lb_thy.csv
    types:
      SRCSEQ: int
      VISITNUM: int
  LBCOAGRAW:
    path: ../../../data/odm/extracted/lb_coag.csv
    types:
      SRCSEQ: int
      VISITNUM: int
  LBUARAW:
    path: ../../../data/odm/extracted/lb_ua.csv
    types:
      SRCSEQ: int
      VISITNUM: int
output:
  path: ../../../data/sdtm/lb-yamaa.parquet
  columns:
  - DOMAIN
  - STUDYID
  - USUBJID
  - LBSPID
  - LBREFID
  - LBTESTCD
  - LBTEST
  - LBCAT
  - LBORRES
  - LBORRESU
  - LBSTRESC
  - LBSTRESN
  - LBSTRESU
  - LBDTC
  - VISIT
  - VISITNUM
  - LBDY
  - LBSEQ
  report: ../../../data/sdtm/lb-report.parquet
  order_by:
  - STUDYID
  - USUBJID
  - LBSEQ
columns:
- name: DOMAIN
  type: str
  label: DOMAIN
  derivation: '''LB'''
  submission:
    mandatory: true
    origins:
    - type: Assigned
      source: Sponsor
    method: 'Executable derivation in the retained yamaa specification: ''''''LB'''''''
    length: 2
    core: Req
    role: Identifier
- name: STUDYID
  type: str
  label: STUDYID
  derivation: null
  submission:
    mandatory: true
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: null

      ...'
    length: 12
    core: Req
    role: Identifier
- name: USUBJID
  type: str
  label: USUBJID
  derivation: null
  submission:
    mandatory: true
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: null

      ...'
    length: 40
    core: Req
    role: Identifier
- name: LBSPID
  type: str
  label: Source Group and Record Identifier
  derivation: null
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: null

      ...'
    length: 100
    core: Perm
    role: Record Qualifier
- name: LBREFID
  type: str
  label: Source Item OID
  derivation: null
  submission:
    mandatory: false
    origins:
    - type: Assigned
      source: Sponsor
    method: 'Executable derivation in the retained yamaa specification: null

      ...'
    length: 100
    core: Perm
    role: Record Qualifier
- name: LBTESTCD
  type: str
  label: Test Short Name
  derivation: null
  submission:
    mandatory: false
    origins:
    - type: Assigned
      source: Sponsor
    method: 'Executable derivation in the retained yamaa specification: null

      ...'
    length: 100
    core: Perm
    role: Topic
- name: LBTEST
  type: str
  label: Test Name
  derivation: null
  submission:
    mandatory: false
    origins:
    - type: Assigned
      source: Sponsor
    method: 'Executable derivation in the retained yamaa specification: null

      ...'
    length: 100
    core: Perm
    role: Record Qualifier
- name: LBCAT
  type: str
  label: Category
  derivation: null
  submission:
    mandatory: false
    origins:
    - type: Assigned
      source: Sponsor
    method: 'Executable derivation in the retained yamaa specification: null

      ...'
    length: 100
    core: Perm
    role: Record Qualifier
- name: LBORRES
  type: str
  label: Result in Original Units
  derivation: null
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: null

      ...'
    length: 100
    core: Perm
    role: Record Qualifier
- name: LBORRESU
  type: str
  label: Original Units
  derivation: null
  submission:
    mandatory: false
    origins:
    - type: Other
      source: Sponsor
      description: Not collected or not established from these synthetic sources.
    method: 'Executable derivation in the retained yamaa specification: null

      ...'
    length: 100
    core: Perm
    role: Record Qualifier
- name: LBSTRESC
  type: str
  label: Character Result in Std Format
  derivation: LBORRES
  submission:
    mandatory: false
    origins:
    - type: Derived
      source: Sponsor
    method: 'Executable derivation in the retained yamaa specification: LBORRES

      ...'
    length: 100
    core: Perm
    role: Record Qualifier
- name: LBSTRESN
  type: float
  label: Numeric Result in Std Format
  derivation:
    value: LBORRES
    unconvertible: null
  submission:
    mandatory: false
    origins:
    - type: Derived
      source: Sponsor
    method: 'Executable derivation in the retained yamaa specification: unconvertible: null

      value: LBORRES'
    length: 8
    significant_digits: 8
    core: Perm
    role: Record Qualifier
- name: LBSTRESU
  type: str
  label: Standard Units
  derivation: LBORRESU
  submission:
    mandatory: false
    origins:
    - type: Derived
      source: Sponsor
    method: 'Executable derivation in the retained yamaa specification: LBORRESU

      ...'
    length: 100
    core: Perm
    role: Record Qualifier
- name: LBDTC
  type: str
  label: Date/Time of Collection
  derivation: null
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: null

      ...'
    length: 10
    core: Perm
    role: Timing
- name: VISIT
  type: str
  label: Visit Name
  derivation: null
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: null

      ...'
    length: 100
    core: Perm
    role: Timing
- name: VISITNUM
  type: int
  label: Source Visit Order
  derivation: null
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: null

      ...'
    length: 8
    core: Perm
    role: Timing
- name: _RDATE
  type: date
  label: Internal Collection Date
  derivation:
    to_date:
      source: LBDTC
- name: _REFDT
  type: date
  label: Internal Reference Date
  derivation:
    to_date:
      source: DM.RFSTDTC
- name: LBDY
  type: int
  label: Study Day
  derivation:
    study_day:
      source: _RDATE
      reference: _REFDT
  submission:
    mandatory: false
    origins:
    - type: Derived
      source: Sponsor
    method: "Executable derivation in the retained yamaa specification: study_day:\n  reference: _REFDT\n  source:\
      \ _RDATE"
    length: 8
    core: Perm
    role: Timing
- name: LBSEQ
  type: int
  label: Sequence Number
  derivation:
    row_number:
      window:
        group_by:
        - STUDYID
        - USUBJID
        order_by:
        - VISITNUM
        - LBSPID
        - LBREFID
        - LBTESTCD
  submission:
    mandatory: true
    origins:
    - type: Derived
      source: Sponsor
    method: "Executable derivation in the retained yamaa specification: row_number:\n  window:\n    group_by:\n\
      \    - STUDYID\n    - USUBJID\n    order_by:\n    - VISITNUM\n    - LBSPID\n    - LBREFID\n    - LBTESTCD"
    length: 8
    core: Req
    role: Identifier
submission:
  label: Laboratory Test Results
  class: FINDINGS
  structure: One record per subject and declared keys
  repeating: true
  comment: Collected values retained. Units remain missing unless explicitly supplied by source metadata. See spec/review/findings.json
    for coding, baseline, and analysis restrictions.
