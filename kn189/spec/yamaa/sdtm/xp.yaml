yamaa: '1.0'
type: spec
model: SDTM
domain: XP
keys:
- STUDYID
- USUBJID
- XPSEQ
input:
  RAW:
    path: ../../../data/odm/extracted/tt.csv
    types:
      SRCSEQ: int
      VISITNUM: int
output:
  path: ../../../data/sdtm/xp-yamaa.parquet
  columns:
  - DOMAIN
  - STUDYID
  - USUBJID
  - XPSEQ
  - XPTRT
  - XPCAT
  - XPSTDTC
  report: ../../../data/sdtm/xp-report.parquet
  order_by:
  - STUDYID
  - USUBJID
  - XPSEQ
columns:
- name: DOMAIN
  type: str
  label: DOMAIN
  derivation: '''XP'''
  submission:
    mandatory: true
    origins:
    - type: Assigned
      source: Sponsor
    method: 'Executable derivation in the retained yamaa specification: ''''''CM'''''''
    length: 2
    core: Req
    role: Identifier
- name: STUDYID
  type: str
  label: Study Identifier
  derivation: RAW.STUDYID
  submission:
    mandatory: true
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.STUDYID

      ...'
    length: 12
    core: Req
    role: Identifier
- name: USUBJID
  type: str
  label: Unique Subject Identifier
  derivation: RAW.USUBJID
  submission:
    mandatory: true
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.USUBJID

      ...'
    length: 40
    core: Req
    role: Identifier
- name: XPSEQ
  type: int
  label: Sequence Number
  derivation: RAW.SRCSEQ
  submission:
    mandatory: true
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.SRCSEQ

      ...'
    length: 8
    core: Req
    role: Identifier
- name: XPTRT
  type: str
  label: Poststudy Anticancer Therapy
  derivation: RAW.TTTRT
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.TTTRT

      ...'
    length: 100
    core: Perm
    role: Record Qualifier
- name: XPCAT
  type: str
  label: Category
  derivation: '''POSTSTUDY ANTICANCER'''
  submission:
    mandatory: false
    origins:
    - type: Assigned
      source: Sponsor
    method: 'Executable derivation in the retained yamaa specification: ''''''POSTSTUDY ANTICANCER'''''''
    length: 100
    core: Perm
    role: Record Qualifier
- name: XPSTDTC
  type: str
  label: Start Date/Time of Medication
  derivation: RAW.TTSTDTC
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: RAW.TTSTDTC

      ...'
    length: 10
    core: Perm
    role: Timing
submission:
  label: Subsequent Anticancer Therapy - Custom
  class: INTERVENTIONS
  structure: One record per subject and declared keys
  repeating: true
  comment: Synthetic development output. Review findings before analysis use.
base: RAW
