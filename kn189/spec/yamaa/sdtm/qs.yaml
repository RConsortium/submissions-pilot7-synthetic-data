  derivations:
    STUDYID: QSRAW.STUDYID
    USUBJID: QSRAW.USUBJID
    QSSPID: QSRAW.SRCSEQ
    QSREFID: '''IT.NCT02578680.QS.QLQLC13_DYSP'''
    QSTESTCD: '''LC13DYS'''
    QSTEST: '''EORTC QLQ-LC13 Dyspnea'''
    QSCAT: '''EORTC QLQ-LC13'''
