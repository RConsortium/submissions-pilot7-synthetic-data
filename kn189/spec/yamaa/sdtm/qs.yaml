yamaa: '1.0'
type: spec
model: SDTM
domain: QS
keys:
- STUDYID
- USUBJID
- QSSEQ
input:
  DM:
    path: ../../../data/sdtm/dm-yamaa.parquet
    schema: ../sdtm/dm.yaml
    key:
    - STUDYID
    - USUBJID
  QSRAW:
    path: ../../../data/odm/extracted/qs.csv
    types:
      SRCSEQ: int
      VISITNUM: int
output:
  path: ../../../data/sdtm/qs-yamaa.parquet
  columns:
  - DOMAIN
  - STUDYID
  - USUBJID
  - QSSPID
  - QSREFID
  - QSTESTCD
  - QSTEST
  - QSCAT
  - QSORRES
  - QSORRESU
  - QSSTRESC
  - QSSTRESN
  - QSSTRESU
  - QSDTC
  - VISIT
  - VISITNUM
  - QSDY
  - QSSEQ
  report: ../../../data/sdtm/qs-report.parquet
  order_by:
  - STUDYID
  - USUBJID
  - QSSEQ
columns:
- name: DOMAIN
  type: str
  label: DOMAIN
  derivation: '''QS'''
  submission:
    mandatory: true
    origins:
    - type: Assigned
      source: Sponsor
    method: 'Executable derivation in the retained yamaa specification: ''''''QS'''''''
    length: 2
    core: Req
    role: Identifier
- name: STUDYID
  type: str
  label: STUDYID
  derivation: null
  submission:
    mandatory: true
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: null

      ...'
    length: 12
    core: Req
    role: Identifier
- name: USUBJID
  type: str
  label: USUBJID
  derivation: null
  submission:
    mandatory: true
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: null

      ...'
    length: 40
    core: Req
    role: Identifier
- name: QSSPID
  type: str
  label: Source Group and Record Identifier
  derivation: null
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: null

      ...'
    length: 100
    core: Perm
    role: Record Qualifier
- name: QSREFID
  type: str
  label: Source Item OID
  derivation: null
  submission:
    mandatory: false
    origins:
    - type: Assigned
      source: Sponsor
    method: 'Executable derivation in the retained yamaa specification: null

      ...'
    length: 100
    core: Perm
    role: Record Qualifier
- name: QSTESTCD
  type: str
  label: Test Short Name
  derivation: null
  submission:
    mandatory: false
    origins:
    - type: Assigned
      source: Sponsor
    method: 'Executable derivation in the retained yamaa specification: null

      ...'
    length: 100
    core: Perm
    role: Topic
- name: QSTEST
  type: str
  label: Test Name
  derivation: null
  submission:
    mandatory: false
    origins:
    - type: Assigned
      source: Sponsor
    method: 'Executable derivation in the retained yamaa specification: null

      ...'
    length: 100
    core: Perm
    role: Record Qualifier
- name: QSCAT
  type: str
  label: Category
  derivation: null
  submission:
    mandatory: false
    origins:
    - type: Assigned
      source: Sponsor
    method: 'Executable derivation in the retained yamaa specification: null

      ...'
    length: 100
    core: Perm
    role: Record Qualifier
- name: QSORRES
  type: str
  label: Result in Original Units
  derivation: null
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: null

      ...'
    length: 100
    core: Perm
    role: Record Qualifier
- name: QSORRESU
  type: str
  label: Original Units
  derivation: null
  submission:
    mandatory: false
    origins:
    - type: Other
      source: Sponsor
      description: Not collected or not established from these synthetic sources.
    method: 'Executable derivation in the retained yamaa specification: null

      ...'
    length: 100
    core: Perm
    role: Record Qualifier
- name: QSSTRESC
  type: str
  label: Character Result in Std Format
  derivation: QSORRES
  submission:
    mandatory: false
    origins:
    - type: Derived
      source: Sponsor
    method: 'Executable derivation in the retained yamaa specification: QSORRES

      ...'
    length: 100
    core: Perm
    role: Record Qualifier
- name: QSSTRESN
  type: float
  label: Numeric Result in Std Format
  derivation:
    value: QSORRES
    unconvertible: null
  submission:
    mandatory: false
    origins:
    - type: Derived
      source: Sponsor
    method: 'Executable derivation in the retained yamaa specification: unconvertible: null

      value: QSORRES'
    length: 8
    significant_digits: 8
    core: Perm
    role: Record Qualifier
- name: QSSTRESU
  type: str
  label: Standard Units
  derivation: QSORRESU
  submission:
    mandatory: false
    origins:
    - type: Derived
      source: Sponsor
    method: 'Executable derivation in the retained yamaa specification: QSORRESU

      ...'
    length: 100
    core: Perm
    role: Record Qualifier
- name: QSDTC
  type: str
  label: Date/Time of Collection
  derivation: null
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: null

      ...'
    length: 10
    core: Perm
    role: Timing
- name: VISIT
  type: str
  label: Visit Name
  derivation: null
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: null

      ...'
    length: 100
    core: Perm
    role: Timing
- name: VISITNUM
  type: int
  label: Source Visit Order
  derivation: null
  submission:
    mandatory: false
    origins:
    - type: Collected
      source: Vendor
    method: 'Executable derivation in the retained yamaa specification: null

      ...'
    length: 8
    core: Perm
    role: Timing
- name: _RDATE
  type: date
  label: Internal Collection Date
  derivation:
    to_date:
      source: QSDTC
- name: _REFDT
  type: date
  label: Internal Reference Date
  derivation:
    to_date:
      source: DM.RFSTDTC
- name: QSDY
  type: int
  label: Study Day
  derivation:
    study_day:
      source: _RDATE
      reference: _REFDT
  submission:
    mandatory: false
    origins:
    - type: Derived
      source: Sponsor
    method: "Executable derivation in the retained yamaa specification: study_day:\n  reference: _REFDT\n  source:\
      \ _RDATE"
    length: 8
    core: Perm
    role: Timing
- name: QSSEQ
  type: int
  label: Sequence Number
  derivation:
    row_number:
      window:
        group_by:
        - STUDYID
        - USUBJID
        order_by:
        - VISITNUM
        - QSSPID
        - QSREFID
        - QSTESTCD
  submission:
    mandatory: true
    origins:
    - type: Derived
      source: Sponsor
    method: "Executable derivation in the retained yamaa specification: row_number:\n  window:\n    group_by:\n\
      \    - STUDYID\n    - USUBJID\n    order_by:\n    - VISITNUM\n    - QSSPID\n    - QSREFID\n    - QSTESTCD"
    length: 8
    core: Req
    role: Identifier
submission:
  label: Questionnaires - Collected Scores
  class: FINDINGS
  structure: One record per subject and declared keys
  repeating: true
  comment: Collected values retained. Units remain missing unless explicitly supplied by source metadata. See spec/review/findings.json
    for coding, baseline, and analysis restrictions.
rows:
- id: qs_qlqc30_ghs
  dataset: QSRAW
  filter: QSRAW.QLQC30_GHS IS NOT NULL
  derivations:
    STUDYID: QSRAW.STUDYID
    USUBJID: QSRAW.USUBJID
    QSSPID: QSRAW.SRCSEQ
