yamaa: '1.0'
type: spec
model: ADaM
domain: ADCM
keys:
- STUDYID
- USUBJID
- ASEQ
input:
  CM:
    path: ../../../../data/sdtm/cm-yamaa.parquet
    relative_to: declaring
    schema: ../sdtm/cm.yaml
    empty_string: missing
  ADSL:
    path: ../../../../data/adam/adsl-yamaa.parquet
    relative_to: declaring
    schema: adsl.yaml
    empty_string: missing
    key:
    - STUDYID
    - USUBJID
base: CM
output:
  path: ../../../../data/adam/adcm-yamaa.parquet
  relative_to: declaring
  columns:
  - STUDYID
  - USUBJID
  - ASEQ
  - CMTRT
  - CMCAT
  - ASTDT
  - TRT01A
  - SRCDOM
  - SRCSEQ
  report: ../../../../data/adam/adcm-report.parquet
  order_by:
  - variable: STUDYID
    direction: asc
  - variable: USUBJID
    direction: asc
  - variable: ASEQ
    direction: asc
columns:
- name: STUDYID
  type: str
  label: Study Identifier
  derivation: CM.STUDYID
  submission:
    core: Req
    mandatory: true
    length: 12
    origins:
    - type: Derived
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: CM.STUDYID

        ...'
- name: USUBJID
  type: str
  label: Unique Subject Identifier
  derivation: CM.USUBJID
  submission:
    core: Req
    mandatory: true
    length: 40
    origins:
    - type: Derived
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: CM.USUBJID

        ...'
- name: ASEQ
  type: int
  label: Analysis Sequence
  derivation: CM.CMSEQ
  submission:
    core: Req
    mandatory: true
    length: 8
    origins:
    - type: Derived
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: CM.CMSEQ

        ...'
- name: CMTRT
  type: str
  label: Medication / Therapy
  derivation: CM.CMTRT
  submission:
    core: Perm
    mandatory: false
    length: 100
    origins:
    - type: Derived
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: CM.CMTRT

        ...'
- name: CMCAT
  type: str
  label: Medication Category
  derivation: CM.CMCAT
  submission:
    core: Perm
    mandatory: false
    length: 100
    origins:
    - type: Derived
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: CM.CMCAT

        ...'
- name: ASTDT
  type: date
  label: Analysis Start Date
  derivation:
    to_date:
      source: CM.CMSTDTC
  submission:
    core: Perm
    mandatory: false
    origins:
    - type: Derived
    method:
      type: Computation
      description: "Executable derivation in the retained yamaa specification: to_date:\n\
        \  source: CM.CMSTDTC"
- name: TRT01A
  type: str
  label: Actual Treatment
  derivation: ADSL.TRT01A
  submission:
    core: Perm
    mandatory: false
    length: 80
    origins:
    - type: Derived
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: ADSL.TRT01A

        ...'
- name: SRCDOM
  type: str
  label: Source Domain
  derivation: '''CM'''
  submission:
    core: Perm
    mandatory: false
    length: 8
    origins:
    - type: Assigned
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: ''''''CM'''''''
- name: SRCSEQ
  type: int
  label: Source Sequence
  derivation: CM.CMSEQ
  submission:
    core: Perm
    mandatory: false
    length: 8
    origins:
    - type: Derived
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: CM.CMSEQ

        ...'
submission:
  has_no_data: false
  label: Medication Analysis
  class: OCCURRENCE DATA STRUCTURE
  structure: One record per subject and declared keys
  repeating: true
  reference_data: false
  non_standard: false
  comment: Synthetic development output. Review findings before analysis use.
