yamaa: '1.0'
type: spec
model: ADaM
domain: ADAE
keys:
- STUDYID
- USUBJID
- AESEQ
input:
  AE:
    path: ../../../../data/sdtm/ae-yamaa.parquet
    relative_to: declaring
    schema: ../sdtm/ae.yaml
    empty_string: missing
  ADSL:
    path: ../../../../data/adam/adsl-yamaa.parquet
    relative_to: declaring
    schema: adsl.yaml
    empty_string: missing
    key:
    - STUDYID
    - USUBJID
base: AE
output:
  path: ../../../../data/adam/adae-yamaa.parquet
  relative_to: declaring
  columns:
  - STUDYID
  - USUBJID
  - AESEQ
  - AEDECOD
  - AETERM
  - AEBODSYS
  - AESER
  - AEREL
  - AEACN
  - AEOUT
  - AETOXGR
  - ASTDT
  - AENDT
  - TRTSDT
  - TRTEDT
  - TRT01A
  - TRT01AN
  - SAFFL
  - ASTDY
  - AETOXGRN
  - RELFL
  - SAFENDT
  - TRTEMFL
  - ANL01FL
  - APPRFL
  - SRCDOM
  - SRCSEQ
  report: ../../../../data/adam/adae-report.parquet
  order_by:
  - variable: STUDYID
    direction: asc
  - variable: USUBJID
    direction: asc
  - variable: AESEQ
    direction: asc
columns:
- name: STUDYID
  type: str
  label: Study Identifier
  derivation: AE.STUDYID
  submission:
    core: Req
    mandatory: true
    length: 12
    origins:
    - type: Derived
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: AE.STUDYID

        ...'
- name: USUBJID
  type: str
  label: Unique Subject Identifier
  derivation: AE.USUBJID
  submission:
    core: Req
    mandatory: true
    length: 40
    origins:
    - type: Derived
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: AE.USUBJID

        ...'
- name: AESEQ
  type: int
  label: Source AE Sequence
  derivation: AE.AESEQ
  submission:
    core: Req
    mandatory: true
    length: 8
    origins:
    - type: Derived
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: AE.AESEQ

        ...'
- name: AEDECOD
  type: str
  label: Source Coded Adverse Event Term
  derivation: AE.AEDECOD
  submission:
    core: Perm
    mandatory: false
    length: 100
    origins:
    - type: Derived
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: AE.AEDECOD

        ...'
- name: AETERM
  type: str
  label: Reported Adverse Event Term
  derivation: AE.AETERM
  submission:
    core: Perm
    mandatory: false
    length: 100
    origins:
    - type: Derived
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: AE.AETERM

        ...'
- name: AEBODSYS
  type: str
  label: System Organ Class
  derivation: AE.AEBODSYS
  submission:
    core: Perm
    mandatory: false
    length: 100
    origins:
    - type: Derived
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: AE.AEBODSYS

        ...'
- name: AESER
  type: str
  label: Serious Event
  derivation: AE.AESER
  submission:
    core: Perm
    mandatory: false
    length: 100
    origins:
    - type: Derived
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: AE.AESER

        ...'
- name: AEREL
  type: str
  label: Causality
  derivation: AE.AEREL
  submission:
    core: Perm
    mandatory: false
    length: 100
    origins:
    - type: Derived
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: AE.AEREL

        ...'
- name: AEACN
  type: str
  label: Action Taken
  derivation: AE.AEACN
  submission:
    core: Perm
    mandatory: false
    length: 100
    origins:
    - type: Derived
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: AE.AEACN

        ...'
- name: AEOUT
  type: str
  label: Outcome
  derivation: AE.AEOUT
  submission:
    core: Perm
    mandatory: false
    length: 100
    origins:
    - type: Derived
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: AE.AEOUT

        ...'
- name: AETOXGR
  type: str
  label: Source Toxicity Grade
  derivation: AE.AETOXGR
  submission:
    core: Perm
    mandatory: false
    length: 100
    origins:
    - type: Derived
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: AE.AETOXGR

        ...'
- name: ASTDT
  type: date
  label: Analysis Start Date
  derivation:
    to_date:
      source: AE.AESTDTC
  submission:
    core: Perm
    mandatory: false
    origins:
    - type: Derived
    method:
      type: Computation
      description: "Executable derivation in the retained yamaa specification: to_date:\n\
        \  source: AE.AESTDTC"
- name: AENDT
  type: date
  label: Analysis End Date
  derivation:
    to_date:
      source: AE.AEENDTC
  submission:
    core: Perm
    mandatory: false
    origins:
    - type: Derived
    method:
      type: Computation
      description: "Executable derivation in the retained yamaa specification: to_date:\n\
        \  source: AE.AEENDTC"
- name: TRTSDT
  type: date
  label: First Treatment Date
  derivation: ADSL.TRTSDT
  submission:
    core: Perm
    mandatory: false
    origins:
    - type: Derived
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: ADSL.TRTSDT

        ...'
- name: TRTEDT
  type: date
  label: Last Recorded Study Dose
  derivation: ADSL.TRTEDT
  submission:
    core: Perm
    mandatory: false
    origins:
    - type: Derived
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: ADSL.TRTEDT

        ...'
- name: TRT01A
  type: str
  label: Actual Treatment
  derivation: ADSL.TRT01A
  submission:
    core: Perm
    mandatory: false
    length: 80
    origins:
    - type: Derived
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: ADSL.TRT01A

        ...'
- name: TRT01AN
  type: int
  label: Actual Treatment Code
  derivation: ADSL.TRT01AN
  submission:
    core: Perm
    mandatory: false
    length: 8
    origins:
    - type: Derived
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: ADSL.TRT01AN

        ...'
- name: SAFFL
  type: str
  label: Safety Population Flag
  derivation: ADSL.SAFFL
  submission:
    core: Perm
    mandatory: false
    length: 1
    origins:
    - type: Derived
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: ADSL.SAFFL

        ...'
- name: ASTDY
  type: int
  label: Analysis Start Relative Day
  derivation:
    study_day:
      source: ASTDT
      reference: TRTSDT
  submission:
    core: Perm
    mandatory: false
    length: 8
    origins:
    - type: Derived
    method:
      type: Computation
      description: "Executable derivation in the retained yamaa specification: study_day:\n\
        \  reference: TRTSDT\n  source: ASTDT"
- name: AETOXGRN
  type: int
  label: Numeric Toxicity Grade
  derivation: AE.AETOXGR
  submission:
    core: Perm
    mandatory: false
    length: 8
    origins:
    - type: Derived
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: AE.AETOXGR

        ...'
- name: RELFL
  type: str
  label: Related Event Flag
  derivation:
    case:
    - when: AE.AEREL IN ('RELATED','POSSIBLY RELATED')
      then: '''Y'''
    - otherwise: '''N'''
  submission:
    core: Perm
    mandatory: false
    length: 1
    origins:
    - type: Assigned
    method:
      type: Computation
      description: "Executable derivation in the retained yamaa specification: case:\n\
        - then: '''Y'''\n  when: AE.AEREL IN ('RELATED','POSSIBLY RELATED')\n- otherwise:\
        \ '''N'''"
- name: _FU30
  type: date
  label: Internal 30-Day Safety End
  derivation:
    shift:
      type: date
      source: TRTEDT
      days: 30
- name: _FU90
  type: date
  label: Internal 90-Day Safety End
  derivation:
    shift:
      type: date
      source: TRTEDT
      days: 90
- name: SAFENDT
  type: date
  label: Safety Collection Window End
  derivation:
    case:
    - when: AESER = 'Y' AND (ADSL.NXTTRDT IS NULL OR ADSL.NXTTRDT > _FU90)
      then: _FU90
    - otherwise: _FU30
  submission:
    core: Perm
    mandatory: false
    origins:
    - type: Derived
    method:
      type: Computation
      description: "Executable derivation in the retained yamaa specification: case:\n\
        - then: _FU90\n  when: AESER = 'Y' AND (ADSL.NXTTRDT IS NULL OR ADSL.NXTTRDT\
        \ > _FU90)\n- otherwise: _FU30"
- name: TRTEMFL
  type: str
  label: Treatment Emergent Analysis Flag
  derivation:
    case:
    - when: SAFFL = 'Y' AND ASTDT >= TRTSDT AND ASTDT <= SAFENDT
      then: '''Y'''
    - otherwise: '''N'''
  submission:
    core: Perm
    mandatory: false
    length: 1
    origins:
    - type: Assigned
    method:
      type: Computation
      description: "Executable derivation in the retained yamaa specification: case:\n\
        - then: '''Y'''\n  when: SAFFL = 'Y' AND ASTDT >= TRTSDT AND ASTDT <= SAFENDT\n\
        - otherwise: '''N'''"
- name: ANL01FL
  type: str
  label: Selected Treatment Emergent Record
  derivation:
    case:
    - when: TRTEMFL = 'Y'
      then: '''Y'''
    - otherwise: null
  submission:
    core: Perm
    mandatory: false
    length: 1
    origins:
    - type: Assigned
    method:
      type: Computation
      description: "Executable derivation in the retained yamaa specification: case:\n\
        - then: '''Y'''\n  when: TRTEMFL = 'Y'\n- otherwise: null"
- name: APPRFL
  type: str
  label: Human Analysis Approval Flag
  derivation: '''N'''
  submission:
    core: Perm
    mandatory: false
    length: 1
    origins:
    - type: Assigned
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: ''''''N'''''''
- name: SRCDOM
  type: str
  label: Source Domain
  derivation: '''AE'''
  submission:
    core: Perm
    mandatory: false
    length: 8
    origins:
    - type: Assigned
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: ''''''AE'''''''
- name: SRCSEQ
  type: int
  label: Source Sequence
  derivation: AE.AESEQ
  submission:
    core: Perm
    mandatory: false
    length: 8
    origins:
    - type: Derived
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: AE.AESEQ

        ...'
submission:
  has_no_data: false
  label: Adverse Event Analysis
  class: OCCURRENCE DATA STRUCTURE
  structure: One record per subject and declared keys
  repeating: true
  reference_data: false
  non_standard: false
  comment: Synthetic development output. Review findings before analysis use.
