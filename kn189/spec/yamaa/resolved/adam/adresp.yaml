yamaa: '1.0'
type: spec
model: ADaM
domain: ADRESP
keys:
- STUDYID
- USUBJID
- PARAMCD
input:
  ZX:
    path: ../../../../data/sdtm/zx-yamaa.parquet
    relative_to: declaring
    schema: ../sdtm/zx.yaml
    empty_string: missing
  ADSL:
    path: ../../../../data/adam/adsl-yamaa.parquet
    relative_to: declaring
    schema: adsl.yaml
    empty_string: missing
    key:
    - STUDYID
    - USUBJID
output:
  path: ../../../../data/adam/adresp-yamaa.parquet
  relative_to: declaring
  columns:
  - STUDYID
  - USUBJID
  - PARAMCD
  - PARAM
  - AVAL
  - AVALC
  - DTYPE
  - TRT01P
  - ITTFL
  - ANL01FL
  - ANL02FL
  - APPRFL
  - SRCDOM
  - SRCVAR
  - SRCSEQ
  report: ../../../../data/adam/adresp-report.parquet
  order_by:
  - variable: STUDYID
    direction: asc
  - variable: USUBJID
    direction: asc
  - variable: PARAMCD
    direction: asc
columns:
- name: STUDYID
  type: str
  label: Study Identifier
  derivation: ZX.STUDYID
  submission:
    core: Req
    mandatory: true
    length: 12
    origins:
    - type: Derived
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: ZX.STUDYID

        ...'
- name: USUBJID
  type: str
  label: Unique Subject Identifier
  derivation: ZX.USUBJID
  submission:
    core: Req
    mandatory: true
    length: 40
    origins:
    - type: Derived
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: ZX.USUBJID

        ...'
- name: PARAMCD
  type: str
  label: Parameter Code
  derivation: null
  submission:
    core: Req
    mandatory: true
    length: 8
    origins:
    - type: Assigned
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: null

        ...'
- name: PARAM
  type: str
  label: Parameter
  derivation: null
  submission:
    core: Perm
    mandatory: false
    length: 80
    origins:
    - type: Assigned
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: null

        ...'
- name: AVAL
  type: float
  label: Source Analysis Value
  derivation: ZX.ZXSTRESN
  submission:
    core: Perm
    mandatory: false
    length: 8
    significant_digits: 8
    origins:
    - type: Derived
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: ZX.ZXSTRESN

        ...'
- name: AVALC
  type: str
  label: Source Analysis Value Character
  derivation: ZX.ZXSTRESC
  submission:
    core: Perm
    mandatory: false
    length: 100
    origins:
    - type: Derived
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: ZX.ZXSTRESC

        ...'
- name: DTYPE
  type: str
  label: Derivation Type
  derivation: '''SOURCE SUMMARY'''
  submission:
    core: Perm
    mandatory: false
    length: 24
    origins:
    - type: Assigned
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: ''''''SOURCE
        SUMMARY'''''''
- name: TRT01P
  type: str
  label: Planned Treatment
  derivation: ADSL.TRT01P
  submission:
    core: Perm
    mandatory: false
    length: 80
    origins:
    - type: Derived
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: ADSL.TRT01P

        ...'
- name: ITTFL
  type: str
  label: ITT Population Flag
  derivation: ADSL.ITTFL
  submission:
    core: Perm
    mandatory: false
    length: 1
    origins:
    - type: Derived
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: ADSL.ITTFL

        ...'
- name: ANL01FL
  type: str
  label: Approved Primary Analysis Record
  derivation: null
  submission:
    core: Perm
    mandatory: false
    length: 1
    origins:
    - type: Other
      description: Not collected or not established from these synthetic sources.
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: null

        ...'
- name: ANL02FL
  type: str
  label: Development / Descriptive Record
  derivation: '''Y'''
  submission:
    core: Perm
    mandatory: false
    length: 1
    origins:
    - type: Assigned
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: ''''''Y'''''''
- name: APPRFL
  type: str
  label: Human Analysis Approval Flag
  derivation: '''N'''
  submission:
    core: Perm
    mandatory: false
    length: 1
    origins:
    - type: Assigned
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: ''''''N'''''''
- name: SRCDOM
  type: str
  label: Source Domain
  derivation: '''ZX'''
  submission:
    core: Perm
    mandatory: false
    length: 8
    origins:
    - type: Assigned
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: ''''''ZX'''''''
- name: SRCVAR
  type: str
  label: Source Variable
  derivation: '''ZXSTRESC'''
  submission:
    core: Perm
    mandatory: false
    length: 12
    origins:
    - type: Assigned
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: ''''''ZXSTRESC'''''''
- name: SRCSEQ
  type: int
  label: Source Sequence
  derivation: ZX.ZXSEQ
  submission:
    core: Perm
    mandatory: false
    length: 8
    origins:
    - type: Derived
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: ZX.ZXSEQ

        ...'
rows:
- id: bor
  dataset: ZX
  filter: ZX.ZXTESTCD = 'BESTRESP'
  derivations:
    PARAMCD: '''BOR'''
    PARAM: '''Source Best Overall Response'''
- id: cbor
  dataset: ZX
  filter: ZX.ZXTESTCD = 'CNFRSP'
  derivations:
    PARAMCD: '''CBOR'''
    PARAM: '''Source Confirmed Response'''
- id: orr
  dataset: ZX
  filter: ZX.ZXTESTCD = 'ORR'
  derivations:
    PARAMCD: '''ORR'''
    PARAM: '''Source Objective Response Indicator'''
- id: dor
  dataset: ZX
  filter: ZX.ZXTESTCD = 'DORDAY'
  derivations:
    PARAMCD: '''DOR'''
    PARAM: '''Source Duration of Response (Days)'''
submission:
  has_no_data: false
  label: Source Response Summary Analysis
  class: BASIC DATA STRUCTURE
  structure: One record per subject and declared keys
  repeating: true
  reference_data: false
  non_standard: false
  comment: Synthetic development output. Review findings before analysis use.
