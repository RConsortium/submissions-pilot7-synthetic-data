yamaa: '1.0'
type: spec
model: ADaM
domain: ADEX
keys:
- STUDYID
- USUBJID
- ASEQ
input:
  EX:
    path: ../../../../data/sdtm/ex-yamaa.parquet
    relative_to: declaring
    schema: ../sdtm/ex.yaml
    empty_string: missing
  ADSL:
    path: ../../../../data/adam/adsl-yamaa.parquet
    relative_to: declaring
    schema: adsl.yaml
    empty_string: missing
    key:
    - STUDYID
    - USUBJID
base: EX
output:
  path: ../../../../data/adam/adex-yamaa.parquet
  relative_to: declaring
  columns:
  - STUDYID
  - USUBJID
  - ASEQ
  - PARAMCD
  - PARAM
  - ADT
  - AVAL
  - AVALU
  - EXADJ
  - TRT01A
  - SAFFL
  - SRCDOM
  - SRCSEQ
  - APPRFL
  report: ../../../../data/adam/adex-report.parquet
  order_by:
  - variable: STUDYID
    direction: asc
  - variable: USUBJID
    direction: asc
  - variable: ASEQ
    direction: asc
columns:
- name: STUDYID
  type: str
  label: Study Identifier
  derivation: EX.STUDYID
  submission:
    core: Req
    mandatory: true
    length: 12
    origins:
    - type: Derived
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: EX.STUDYID

        ...'
- name: USUBJID
  type: str
  label: Unique Subject Identifier
  derivation: EX.USUBJID
  submission:
    core: Req
    mandatory: true
    length: 40
    origins:
    - type: Derived
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: EX.USUBJID

        ...'
- name: ASEQ
  type: int
  label: Analysis Sequence
  derivation: EX.EXSEQ
  submission:
    core: Req
    mandatory: true
    length: 8
    origins:
    - type: Derived
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: EX.EXSEQ

        ...'
- name: PARAMCD
  type: str
  label: Parameter Code
  derivation: '''DOSE'''
  submission:
    core: Perm
    mandatory: false
    length: 8
    origins:
    - type: Assigned
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: ''''''DOSE'''''''
- name: PARAM
  type: str
  label: Study Treatment
  derivation: EX.EXTRT
  submission:
    core: Perm
    mandatory: false
    length: 80
    origins:
    - type: Derived
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: EX.EXTRT

        ...'
- name: ADT
  type: date
  label: Administration Date
  derivation:
    to_date:
      source: EX.EXSTDTC
  submission:
    core: Perm
    mandatory: false
    origins:
    - type: Derived
    method:
      type: Computation
      description: "Executable derivation in the retained yamaa specification: to_date:\n\
        \  source: EX.EXSTDTC"
- name: AVAL
  type: float
  label: Recorded Dose
  derivation: EX.EXDOSE
  submission:
    core: Perm
    mandatory: false
    length: 8
    significant_digits: 8
    origins:
    - type: Derived
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: EX.EXDOSE

        ...'
- name: AVALU
  type: str
  label: Recorded Dose Unit
  derivation: EX.EXDOSU
  submission:
    core: Perm
    mandatory: false
    length: 100
    origins:
    - type: Derived
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: EX.EXDOSU

        ...'
- name: EXADJ
  type: str
  label: Recorded Dose Adjustment
  derivation: EX.EXADJ
  submission:
    core: Perm
    mandatory: false
    length: 100
    origins:
    - type: Derived
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: EX.EXADJ

        ...'
- name: TRT01A
  type: str
  label: Actual Treatment
  derivation: ADSL.TRT01A
  submission:
    core: Perm
    mandatory: false
    length: 80
    origins:
    - type: Derived
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: ADSL.TRT01A

        ...'
- name: SAFFL
  type: str
  label: Safety Population Flag
  derivation: ADSL.SAFFL
  submission:
    core: Perm
    mandatory: false
    length: 1
    origins:
    - type: Derived
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: ADSL.SAFFL

        ...'
- name: SRCDOM
  type: str
  label: Source Domain
  derivation: '''EX'''
  submission:
    core: Perm
    mandatory: false
    length: 8
    origins:
    - type: Assigned
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: ''''''EX'''''''
- name: SRCSEQ
  type: int
  label: Source Sequence
  derivation: EX.EXSEQ
  submission:
    core: Perm
    mandatory: false
    length: 8
    origins:
    - type: Derived
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: EX.EXSEQ

        ...'
- name: APPRFL
  type: str
  label: Human Analysis Approval Flag
  derivation: '''N'''
  submission:
    core: Perm
    mandatory: false
    length: 1
    origins:
    - type: Assigned
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: ''''''N'''''''
submission:
  has_no_data: false
  label: Exposure Analysis
  class: BASIC DATA STRUCTURE
  structure: One record per subject and declared keys
  repeating: true
  reference_data: false
  non_standard: false
  comment: Synthetic development output. Review findings before analysis use.
