yamaa: '1.0'
type: spec
model: ADaM
domain: ADEG
keys:
- STUDYID
- USUBJID
- ASEQ
input:
  EG:
    path: ../../../../data/sdtm/eg-yamaa.parquet
    relative_to: declaring
    schema: ../sdtm/eg.yaml
    empty_string: missing
  ADSL:
    path: ../../../../data/adam/adsl-yamaa.parquet
    relative_to: declaring
    schema: adsl.yaml
    empty_string: missing
    key:
    - STUDYID
    - USUBJID
base: EG
output:
  path: ../../../../data/adam/adeg-yamaa.parquet
  relative_to: declaring
  columns:
  - STUDYID
  - USUBJID
  - PARAMCD
  - PARAM
  - PARCAT1
  - ADT
  - AVAL
  - AVALC
  - AVALU
  - AVISIT
  - AVISITN
  - TRTSDT
  - TRT01P
  - TRT01A
  - ITTFL
  - SAFFL
  - ADY
  - ASEQ
  - SRCDOM
  - SRCVAR
  - SRCSEQ
  - APPRFL
  - ABLFL
  - BASETYPE
  - BASE
  - CHG
  - PCHG
  - ANL01FL
  report: ../../../../data/adam/adeg-report.parquet
  order_by:
  - variable: STUDYID
    direction: asc
  - variable: USUBJID
    direction: asc
  - variable: ASEQ
    direction: asc
columns:
- name: STUDYID
  type: str
  label: Study Identifier
  derivation: EG.STUDYID
  submission:
    core: Req
    mandatory: true
    length: 12
    origins:
    - type: Derived
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: EG.STUDYID

        ...'
- name: USUBJID
  type: str
  label: Unique Subject Identifier
  derivation: EG.USUBJID
  submission:
    core: Req
    mandatory: true
    length: 40
    origins:
    - type: Derived
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: EG.USUBJID

        ...'
- name: PARAMCD
  type: str
  label: Parameter Code
  derivation: EG.EGTESTCD
  submission:
    core: Perm
    mandatory: false
    length: 8
    origins:
    - type: Derived
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: EG.EGTESTCD

        ...'
- name: PARAM
  type: str
  label: Parameter
  derivation: EG.EGTEST
  submission:
    core: Perm
    mandatory: false
    length: 80
    origins:
    - type: Derived
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: EG.EGTEST

        ...'
- name: PARCAT1
  type: str
  label: Parameter Category
  derivation: EG.EGCAT
  submission:
    core: Perm
    mandatory: false
    length: 100
    origins:
    - type: Derived
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: EG.EGCAT

        ...'
- name: ADT
  type: date
  label: Analysis Date
  derivation:
    to_date:
      source: EG.EGDTC
  submission:
    core: Perm
    mandatory: false
    origins:
    - type: Derived
    method:
      type: Computation
      description: "Executable derivation in the retained yamaa specification: to_date:\n\
        \  source: EG.EGDTC"
- name: AVAL
  type: float
  label: Analysis Value
  derivation: EG.EGSTRESN
  submission:
    core: Perm
    mandatory: false
    length: 8
    significant_digits: 8
    origins:
    - type: Derived
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: EG.EGSTRESN

        ...'
- name: AVALC
  type: str
  label: Analysis Value Character
  derivation: EG.EGSTRESC
  submission:
    core: Perm
    mandatory: false
    length: 100
    origins:
    - type: Derived
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: EG.EGSTRESC

        ...'
- name: AVALU
  type: str
  label: Analysis Value Unit
  derivation: EG.EGSTRESU
  submission:
    core: Perm
    mandatory: false
    length: 100
    origins:
    - type: Derived
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: EG.EGSTRESU

        ...'
- name: AVISIT
  type: str
  label: Source Visit
  derivation: EG.VISIT
  submission:
    core: Perm
    mandatory: false
    length: 100
    origins:
    - type: Derived
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: EG.VISIT

        ...'
- name: AVISITN
  type: int
  label: Source Visit Order
  derivation: EG.VISITNUM
  submission:
    core: Perm
    mandatory: false
    length: 8
    origins:
    - type: Derived
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: EG.VISITNUM

        ...'
- name: TRTSDT
  type: date
  label: First Treatment Date
  derivation: ADSL.TRTSDT
  submission:
    core: Perm
    mandatory: false
    origins:
    - type: Derived
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: ADSL.TRTSDT

        ...'
- name: TRT01P
  type: str
  label: Planned Treatment
  derivation: ADSL.TRT01P
  submission:
    core: Perm
    mandatory: false
    length: 80
    origins:
    - type: Derived
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: ADSL.TRT01P

        ...'
- name: TRT01A
  type: str
  label: Actual Treatment
  derivation: ADSL.TRT01A
  submission:
    core: Perm
    mandatory: false
    length: 80
    origins:
    - type: Derived
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: ADSL.TRT01A

        ...'
- name: ITTFL
  type: str
  label: ITT Population Flag
  derivation: ADSL.ITTFL
  submission:
    core: Perm
    mandatory: false
    length: 1
    origins:
    - type: Derived
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: ADSL.ITTFL

        ...'
- name: SAFFL
  type: str
  label: Safety Population Flag
  derivation: ADSL.SAFFL
  submission:
    core: Perm
    mandatory: false
    length: 1
    origins:
    - type: Derived
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: ADSL.SAFFL

        ...'
- name: ADY
  type: int
  label: Analysis Relative Day
  derivation:
    study_day:
      source: ADT
      reference: TRTSDT
  submission:
    core: Perm
    mandatory: false
    length: 8
    origins:
    - type: Derived
    method:
      type: Computation
      description: "Executable derivation in the retained yamaa specification: study_day:\n\
        \  reference: TRTSDT\n  source: ADT"
- name: ASEQ
  type: int
  label: Analysis Sequence
  derivation: EG.EGSEQ
  submission:
    core: Req
    mandatory: true
    length: 8
    origins:
    - type: Derived
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: EG.EGSEQ

        ...'
- name: SRCDOM
  type: str
  label: Source Domain
  derivation: '''EG'''
  submission:
    core: Perm
    mandatory: false
    length: 8
    origins:
    - type: Assigned
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: ''''''EG'''''''
- name: SRCVAR
  type: str
  label: Source Variable
  derivation: '''EGSTRESC'''
  submission:
    core: Perm
    mandatory: false
    length: 12
    origins:
    - type: Assigned
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: ''''''EGSTRESC'''''''
- name: SRCSEQ
  type: int
  label: Source Sequence
  derivation: EG.EGSEQ
  submission:
    core: Perm
    mandatory: false
    length: 8
    origins:
    - type: Derived
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: EG.EGSEQ

        ...'
- name: APPRFL
  type: str
  label: Human Analysis Approval Flag
  derivation: '''N'''
  submission:
    core: Perm
    mandatory: false
    length: 1
    origins:
    - type: Assigned
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: ''''''N'''''''
- name: ABLFL
  type: str
  label: Candidate Baseline Record Flag
  derivation:
    baseline_flag:
      date: ADT
      reference: TRTSDT
      source: AVAL
      inclusive: true
      window:
        group_by:
        - STUDYID
        - USUBJID
        - PARAMCD
        order_by:
        - variable: ADT
          direction: asc
        - variable: AVISITN
          direction: asc
        - variable: ASEQ
          direction: asc
        filter: AVISITN <= 2
  submission:
    core: Perm
    mandatory: false
    length: 1
    origins:
    - type: Derived
    method:
      type: Computation
      description: "Executable derivation in the retained yamaa specification: baseline_flag:\n\
        \  date: ADT\n  reference: TRTSDT\n  source: AVAL\n  window:\n    filter:\
        \ AVISITN <= 2\n    group_by:\n    - STUDYID\n    - USUBJID\n    - PARAMCD\n\
        \    order_by:\n    - ADT\n    - AVISITN\n    - ASEQ"
- name: BASETYPE
  type: str
  label: Baseline Definition
  derivation: '''DATE-ONLY CANDIDATE'''
  submission:
    core: Perm
    mandatory: false
    length: 32
    origins:
    - type: Assigned
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: ''''''DATE-ONLY
        CANDIDATE'''''''
- name: BASE
  type: float
  label: Baseline Value
  derivation:
    aggregate:
      filter: ABLFL = 'Y'
      group_by:
      - STUDYID
      - USUBJID
      - PARAMCD
      expr: ONLY(AVAL)
  submission:
    core: Perm
    mandatory: false
    length: 8
    significant_digits: 8
    origins:
    - type: Derived
    method:
      type: Computation
      description: "Executable derivation in the retained yamaa specification: aggregate:\n\
        \  expr: ONLY(AVAL)\n  filter: ABLFL = 'Y'\n  group_by:\n  - STUDYID\n  -\
        \ USUBJID\n  - PARAMCD"
- name: CHG
  type: float
  label: Change from Baseline
  derivation: AVAL - BASE
  submission:
    core: Perm
    mandatory: false
    length: 8
    significant_digits: 8
    origins:
    - type: Derived
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: AVAL
        - BASE

        ...'
- name: PCHG
  type: float
  label: Percent Change from Baseline
  derivation: 100 * CHG / NULLIF(BASE, 0)
  submission:
    core: Perm
    mandatory: false
    length: 8
    significant_digits: 8
    origins:
    - type: Derived
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: 100
        * CHG / NULLIF(BASE, 0)

        ...'
- name: ANL01FL
  type: str
  label: Postdose Analysis Record Flag
  derivation:
    case:
    - when: SAFFL = 'Y' AND AVAL IS NOT NULL AND ADT > TRTSDT
      then: '''Y'''
    - otherwise: null
  submission:
    core: Perm
    mandatory: false
    length: 1
    origins:
    - type: Assigned
    method:
      type: Computation
      description: "Executable derivation in the retained yamaa specification: case:\n\
        - then: '''Y'''\n  when: SAFFL = 'Y' AND AVAL IS NOT NULL AND ADT > TRTSDT\n\
        - otherwise: null"
submission:
  has_no_data: false
  label: ECG Analysis
  class: BASIC DATA STRUCTURE
  structure: One record per subject and declared keys
  repeating: true
  reference_data: false
  non_standard: false
  comment: Synthetic development output. Review findings before analysis use.
