yamaa: '1.0'
type: spec
model: SDTM
domain: CM
keys:
- STUDYID
- USUBJID
- CMSEQ
input:
  RAW:
    path: ../../../../data/odm/extracted/cm.csv
    relative_to: declaring
    types:
      SRCSEQ: int
      VISITNUM: int
    empty_string: missing
  DM:
    path: ../../../../data/sdtm/dm-yamaa.parquet
    relative_to: declaring
    schema: dm.yaml
    empty_string: missing
    key:
    - STUDYID
    - USUBJID
base: RAW
output:
  path: ../../../../data/sdtm/cm-yamaa.parquet
  relative_to: declaring
  columns:
  - DOMAIN
  - STUDYID
  - USUBJID
  - CMSEQ
  - CMSPID
  - CMREFID
  - CMTRT
  - CMCAT
  - CMINDC
  - CMSTDTC
  - CMDECOD
  - VISIT
  - VISITNUM
  - CMDY
  report: ../../../../data/sdtm/cm-report.parquet
  order_by:
  - variable: STUDYID
    direction: asc
  - variable: USUBJID
    direction: asc
  - variable: CMSEQ
    direction: asc
columns:
- name: DOMAIN
  type: str
  label: DOMAIN
  derivation: '''CM'''
  submission:
    core: Req
    mandatory: true
    role: Identifier
    length: 2
    origins:
    - type: Assigned
      source: Sponsor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: ''''''CM'''''''
- name: STUDYID
  type: str
  label: Study Identifier
  derivation: RAW.STUDYID
  submission:
    core: Req
    mandatory: true
    role: Identifier
    length: 12
    origins:
    - type: Collected
      source: Vendor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: RAW.STUDYID

        ...'
- name: USUBJID
  type: str
  label: Unique Subject Identifier
  derivation: RAW.USUBJID
  submission:
    core: Req
    mandatory: true
    role: Identifier
    length: 40
    origins:
    - type: Collected
      source: Vendor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: RAW.USUBJID

        ...'
- name: CMSEQ
  type: int
  label: Sequence Number
  derivation: RAW.SRCSEQ
  submission:
    core: Req
    mandatory: true
    role: Identifier
    length: 8
    origins:
    - type: Collected
      source: Vendor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: RAW.SRCSEQ

        ...'
- name: CMSPID
  type: str
  label: Source Group Identifier
  derivation: RAW.GROUPOID
  submission:
    core: Perm
    mandatory: false
    role: Record Qualifier
    length: 100
    origins:
    - type: Collected
      source: Vendor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: RAW.GROUPOID

        ...'
- name: CMREFID
  type: str
  label: Source Group Repeat Identifier
  derivation: RAW.GROUPREP
  submission:
    core: Perm
    mandatory: false
    role: Record Qualifier
    length: 100
    origins:
    - type: Collected
      source: Vendor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: RAW.GROUPREP

        ...'
- name: CMTRT
  type: str
  label: Reported Name of Drug, Med, or Therapy
  derivation: RAW.CMTRT
  submission:
    core: Perm
    mandatory: false
    role: Topic
    length: 100
    origins:
    - type: Collected
      source: Vendor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: RAW.CMTRT

        ...'
- name: CMCAT
  type: str
  label: Category for Medication
  derivation: RAW.CMCAT
  submission:
    core: Perm
    mandatory: false
    role: Record Qualifier
    length: 100
    origins:
    - type: Collected
      source: Vendor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: RAW.CMCAT

        ...'
- name: CMINDC
  type: str
  label: Indication
  derivation: RAW.CMINDC
  submission:
    core: Perm
    mandatory: false
    role: Record Qualifier
    length: 100
    origins:
    - type: Collected
      source: Vendor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: RAW.CMINDC

        ...'
- name: CMSTDTC
  type: str
  label: Start Date/Time of Medication
  derivation: RAW.CMSTDTC
  submission:
    core: Perm
    mandatory: false
    role: Timing
    length: 10
    origins:
    - type: Collected
      source: Vendor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: RAW.CMSTDTC

        ...'
- name: CMDECOD
  type: str
  label: Source Coded Medication Name
  derivation: RAW.CMDECOD
  submission:
    core: Perm
    mandatory: false
    role: Record Qualifier
    length: 100
    origins:
    - type: Collected
      source: Vendor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: RAW.CMDECOD

        ...'
- name: VISIT
  type: str
  label: Visit Name
  derivation: RAW.VISIT
  submission:
    core: Perm
    mandatory: false
    role: Timing
    length: 100
    origins:
    - type: Collected
      source: Vendor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: RAW.VISIT

        ...'
- name: VISITNUM
  type: int
  label: Source Visit Order
  derivation: RAW.VISITNUM
  submission:
    core: Perm
    mandatory: false
    role: Timing
    length: 8
    origins:
    - type: Collected
      source: Vendor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: RAW.VISITNUM

        ...'
- name: _RDATE
  type: date
  label: Internal Collection Date
  derivation:
    to_date:
      source: CMSTDTC
- name: _REFDT
  type: date
  label: Internal Reference Date
  derivation:
    to_date:
      source: DM.RFSTDTC
- name: CMDY
  type: int
  label: Study Day
  derivation:
    study_day:
      source: _RDATE
      reference: _REFDT
  submission:
    core: Perm
    mandatory: false
    role: Timing
    length: 8
    origins:
    - type: Derived
      source: Sponsor
    method:
      type: Computation
      description: "Executable derivation in the retained yamaa specification: study_day:\n\
        \  reference: _REFDT\n  source: _RDATE"
submission:
  has_no_data: false
  label: Concomitant Medications
  class: INTERVENTIONS
  structure: One record per subject and declared keys
  repeating: true
  reference_data: false
  non_standard: false
  comment: Synthetic development output. Review findings before analysis use.
