yamaa: '1.0'
type: spec
model: SDTM
domain: XP
keys:
- STUDYID
- USUBJID
- XPSEQ
input:
  RAW:
    path: ../../../../data/odm/extracted/tt.csv
    relative_to: declaring
    types:
      SRCSEQ: int
      VISITNUM: int
    empty_string: missing
base: RAW
output:
  path: ../../../../data/sdtm/xp-yamaa.parquet
  relative_to: declaring
  columns:
  - DOMAIN
  - STUDYID
  - USUBJID
  - XPSEQ
  - XPTRT
  - XPCAT
  - XPSTDTC
  report: ../../../../data/sdtm/xp-report.parquet
  order_by:
  - variable: STUDYID
    direction: asc
  - variable: USUBJID
    direction: asc
  - variable: XPSEQ
    direction: asc
columns:
- name: DOMAIN
  type: str
  label: DOMAIN
  derivation: '''XP'''
  submission:
    core: Req
    mandatory: true
    role: Identifier
    length: 2
    origins:
    - type: Assigned
      source: Sponsor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: ''''''CM'''''''
- name: STUDYID
  type: str
  label: Study Identifier
  derivation: RAW.STUDYID
  submission:
    core: Req
    mandatory: true
    role: Identifier
    length: 12
    origins:
    - type: Collected
      source: Vendor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: RAW.STUDYID

        ...'
- name: USUBJID
  type: str
  label: Unique Subject Identifier
  derivation: RAW.USUBJID
  submission:
    core: Req
    mandatory: true
    role: Identifier
    length: 40
    origins:
    - type: Collected
      source: Vendor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: RAW.USUBJID

        ...'
- name: XPSEQ
  type: int
  label: Sequence Number
  derivation: RAW.SRCSEQ
  submission:
    core: Req
    mandatory: true
    role: Identifier
    length: 8
    origins:
    - type: Collected
      source: Vendor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: RAW.SRCSEQ

        ...'
- name: XPTRT
  type: str
  label: Poststudy Anticancer Therapy
  derivation: RAW.TTTRT
  submission:
    core: Perm
    mandatory: false
    role: Record Qualifier
    length: 100
    origins:
    - type: Collected
      source: Vendor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: RAW.TTTRT

        ...'
- name: XPCAT
  type: str
  label: Category
  derivation: '''POSTSTUDY ANTICANCER'''
  submission:
    core: Perm
    mandatory: false
    role: Record Qualifier
    length: 100
    origins:
    - type: Assigned
      source: Sponsor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: ''''''POSTSTUDY
        ANTICANCER'''''''
- name: XPSTDTC
  type: str
  label: Start Date/Time of Medication
  derivation: RAW.TTSTDTC
  submission:
    core: Perm
    mandatory: false
    role: Timing
    length: 10
    origins:
    - type: Collected
      source: Vendor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: RAW.TTSTDTC

        ...'
submission:
  has_no_data: false
  label: Subsequent Anticancer Therapy - Custom
  class: INTERVENTIONS
  structure: One record per subject and declared keys
  repeating: true
  reference_data: false
  non_standard: false
  comment: Synthetic development output. Review findings before analysis use.
