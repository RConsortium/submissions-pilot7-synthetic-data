yamaa: '1.0'
type: spec
model: SDTM
domain: QS
keys:
- STUDYID
- USUBJID
- QSSEQ
input:
  DM:
    path: ../../../../data/sdtm/dm-yamaa.parquet
    relative_to: declaring
    schema: dm.yaml
    empty_string: missing
    key:
    - STUDYID
    - USUBJID
  QSRAW:
    path: ../../../../data/odm/extracted/qs.csv
    relative_to: declaring
    types:
      SRCSEQ: int
      VISITNUM: int
    empty_string: missing
output:
  path: ../../../../data/sdtm/qs-yamaa.parquet
  relative_to: declaring
  columns:
  - DOMAIN
  - STUDYID
  - USUBJID
  - QSSPID
  - QSREFID
  - QSTESTCD
  - QSTEST
  - QSCAT
  - QSORRES
  - QSORRESU
  - QSSTRESC
  - QSSTRESN
  - QSSTRESU
  - QSDTC
  - VISIT
  - VISITNUM
  - QSDY
  - QSSEQ
  report: ../../../../data/sdtm/qs-report.parquet
  order_by:
  - variable: STUDYID
    direction: asc
  - variable: USUBJID
    direction: asc
  - variable: QSSEQ
    direction: asc
columns:
- name: DOMAIN
  type: str
  label: DOMAIN
  derivation: '''QS'''
  submission:
    core: Req
    mandatory: true
    role: Identifier
    length: 2
    origins:
    - type: Assigned
      source: Sponsor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: ''''''QS'''''''
- name: STUDYID
  type: str
  label: STUDYID
  derivation: null
  submission:
    core: Req
    mandatory: true
    role: Identifier
    length: 12
    origins:
    - type: Collected
      source: Vendor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: null

        ...'
- name: USUBJID
  type: str
  label: USUBJID
  derivation: null
  submission:
    core: Req
    mandatory: true
    role: Identifier
    length: 40
    origins:
    - type: Collected
      source: Vendor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: null

        ...'
- name: QSSPID
  type: str
  label: Source Group and Record Identifier
  derivation: null
  submission:
    core: Perm
    mandatory: false
    role: Record Qualifier
    length: 100
    origins:
    - type: Collected
      source: Vendor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: null

        ...'
- name: QSREFID
  type: str
