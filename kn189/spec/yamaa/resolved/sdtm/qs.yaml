submission:
  has_no_data: false
  label: Questionnaires - Collected Scores
  class: FINDINGS
  structure: One record per subject and declared keys
  repeating: true
  reference_data: false
  non_standard: false
  comment: Collected values retained. Units remain missing unless explicitly supplied
    by source metadata. See spec/review/findings.json for coding, baseline, and analysis
