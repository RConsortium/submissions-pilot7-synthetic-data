    role: Record Qualifier
    length: 100
    origins:
    - type: Assigned
      source: Sponsor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: null

        ...'
- name: QSTESTCD
  type: str
  label: Test Short Name
  derivation: null
  submission:
    core: Perm
    mandatory: false
    role: Topic
    length: 100
    origins:
    - type: Assigned
      source: Sponsor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: null

        ...'
- name: QSTEST
  type: str
  label: Test Name
  derivation: null
  submission:
    core: Perm
    mandatory: false
    role: Record Qualifier
    length: 100
    origins:
    - type: Assigned
      source: Sponsor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: null

        ...'
- name: QSCAT
  type: str
  label: Category
  derivation: null
  submission:
    core: Perm
    mandatory: false
    role: Record Qualifier
    length: 100
    origins:
    - type: Assigned
      source: Sponsor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: null

        ...'
- name: QSORRES
  type: str
  label: Result in Original Units
  derivation: null
  submission:
    core: Perm
    mandatory: false
    role: Record Qualifier
    length: 100
    origins:
    - type: Collected
      source: Vendor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: null

        ...'
- name: QSORRESU
  type: str
  label: Original Units
  derivation: null
  submission:
    core: Perm
    mandatory: false
    role: Record Qualifier
    length: 100
    origins:
    - type: Other
      source: Sponsor
      description: Not collected or not established from these synthetic sources.
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: null

        ...'
- name: QSSTRESC
  type: str
  label: Character Result in Std Format
  derivation: QSORRES
  submission:
    core: Perm
    mandatory: false
    role: Record Qualifier
    length: 100
    origins:
    - type: Derived
      source: Sponsor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: QSORRES

        ...'
- name: QSSTRESN
  type: float
  label: Numeric Result in Std Format
  derivation:
    value: QSORRES
    unconvertible: null
  submission:
    core: Perm
    mandatory: false
    role: Record Qualifier
    length: 8
    significant_digits: 8
    origins:
    - type: Derived
      source: Sponsor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: unconvertible:
        null

        value: QSORRES'
- name: QSSTRESU
  type: str
  label: Standard Units
  derivation: QSORRESU
  submission:
    core: Perm
    mandatory: false
    role: Record Qualifier
    length: 100
    origins:
    - type: Derived
      source: Sponsor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: QSORRESU

        ...'
- name: QSDTC
  type: str
  label: Date/Time of Collection
  derivation: null
  submission:
    core: Perm
    mandatory: false
    role: Timing
    length: 10
    origins:
    - type: Collected
      source: Vendor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: null

        ...'
- name: VISIT
  type: str
  label: Visit Name
  derivation: null
  submission:
    core: Perm
    mandatory: false
    role: Timing
    length: 100
    origins:
    - type: Collected
      source: Vendor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: null

        ...'
- name: VISITNUM
  type: int
  label: Source Visit Order
  derivation: null
  submission:
    core: Perm
    mandatory: false
    role: Timing
    length: 8
    origins:
    - type: Collected
      source: Vendor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: null

        ...'
- name: _RDATE
  type: date
  label: Internal Collection Date
  derivation:
    to_date:
      source: QSDTC
- name: _REFDT
  type: date
  label: Internal Reference Date
  derivation:
    to_date:
      source: DM.RFSTDTC
- name: QSDY
  type: int
  label: Study Day
  derivation:
    study_day:
      source: _RDATE
      reference: _REFDT
  submission:
    core: Perm
    mandatory: false
    role: Timing
    length: 8
    origins:
    - type: Derived
      source: Sponsor
    method:
      type: Computation
      description: "Executable derivation in the retained yamaa specification: study_day:\n\
        \  reference: _REFDT\n  source: _RDATE"
- name: QSSEQ
  type: int
  label: Sequence Number
  derivation:
    row_number:
      window:
        group_by:
        - STUDYID
        - USUBJID
        order_by:
        - variable: VISITNUM
          direction: asc
        - variable: QSSPID
          direction: asc
        - variable: QSREFID
          direction: asc
        - variable: QSTESTCD
          direction: asc
  submission:
    core: Req
    mandatory: true
    role: Identifier
    length: 8
    origins:
    - type: Derived
      source: Sponsor
    method:
      type: Computation
      description: "Executable derivation in the retained yamaa specification: row_number:\n\
        \  window:\n    group_by:\n    - STUDYID\n    - USUBJID\n    order_by:\n \
        \   - VISITNUM\n    - QSSPID\n    - QSREFID\n    - QSTESTCD"
rows:
- id: qs_qlqc30_ghs
  dataset: QSRAW
  filter: QSRAW.QLQC30_GHS IS NOT NULL
  derivations:
    STUDYID: QSRAW.STUDYID
    USUBJID: QSRAW.USUBJID
