yamaa: '1.0'
type: spec
model: SDTM
domain: EX
keys:
- STUDYID
- USUBJID
- EXSEQ
input:
  RAW:
    path: ../../../../data/odm/extracted/ex.csv
    relative_to: declaring
    types:
      SRCSEQ: int
      VISITNUM: int
    empty_string: missing
  DM:
    path: ../../../../data/sdtm/dm-yamaa.parquet
    relative_to: declaring
    schema: dm.yaml
    empty_string: missing
    key:
    - STUDYID
    - USUBJID
base: RAW
output:
  path: ../../../../data/sdtm/ex-yamaa.parquet
  relative_to: declaring
  columns:
  - DOMAIN
  - STUDYID
  - USUBJID
  - EXSEQ
  - EXSPID
  - EXREFID
  - EXTRT
  - EXDOSE
  - EXDOSU
  - EXROUTE
  - EXSTDTC
  - EXADJ
  - VISIT
  - VISITNUM
  - EXDY
  report: ../../../../data/sdtm/ex-report.parquet
  order_by:
  - variable: STUDYID
    direction: asc
  - variable: USUBJID
    direction: asc
  - variable: EXSEQ
    direction: asc
columns:
- name: DOMAIN
  type: str
  label: DOMAIN
  derivation: '''EX'''
  submission:
    core: Req
    mandatory: true
    role: Identifier
    length: 2
    origins:
    - type: Assigned
      source: Sponsor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: ''''''EX'''''''
- name: STUDYID
  type: str
  label: Study Identifier
  derivation: RAW.STUDYID
  submission:
    core: Req
    mandatory: true
    role: Identifier
    length: 12
    origins:
    - type: Collected
      source: Vendor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: RAW.STUDYID

        ...'
- name: USUBJID
  type: str
  label: Unique Subject Identifier
  derivation: RAW.USUBJID
  submission:
    core: Req
    mandatory: true
    role: Identifier
    length: 40
    origins:
    - type: Collected
      source: Vendor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: RAW.USUBJID

        ...'
- name: EXSEQ
  type: int
  label: Sequence Number
  derivation: RAW.SRCSEQ
  submission:
    core: Req
    mandatory: true
    role: Identifier
    length: 8
    origins:
    - type: Collected
      source: Vendor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: RAW.SRCSEQ

        ...'
- name: EXSPID
  type: str
  label: Source Group Identifier
  derivation: RAW.GROUPOID
  submission:
    core: Perm
    mandatory: false
    role: Record Qualifier
    length: 100
    origins:
    - type: Collected
      source: Vendor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: RAW.GROUPOID

        ...'
- name: EXREFID
  type: str
  label: Source Group Repeat Identifier
  derivation: RAW.GROUPREP
  submission:
    core: Perm
    mandatory: false
    role: Record Qualifier
    length: 100
    origins:
    - type: Collected
      source: Vendor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: RAW.GROUPREP

        ...'
- name: EXTRT
  type: str
  label: Name of Treatment
  derivation: RAW.EXTRT
  submission:
    core: Perm
    mandatory: false
    role: Topic
    length: 100
    origins:
    - type: Collected
      source: Vendor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: RAW.EXTRT

        ...'
- name: EXDOSE
  type: float
  label: Dose
  derivation: RAW.EXDOSE
  submission:
    core: Perm
    mandatory: false
    role: Record Qualifier
    length: 8
    significant_digits: 8
    origins:
    - type: Collected
      source: Vendor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: RAW.EXDOSE

        ...'
- name: EXDOSU
  type: str
  label: Dose Units
  derivation: RAW.EXDOSU
  submission:
    core: Perm
    mandatory: false
    role: Record Qualifier
    length: 100
    origins:
    - type: Collected
      source: Vendor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: RAW.EXDOSU

        ...'
- name: EXROUTE
  type: str
  label: Route of Administration
  derivation: RAW.EXROUTE
  submission:
    core: Perm
    mandatory: false
    role: Record Qualifier
    length: 100
    origins:
    - type: Collected
      source: Vendor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: RAW.EXROUTE

        ...'
- name: EXSTDTC
  type: str
  label: Start Date/Time of Treatment
  derivation: RAW.EXDTC
  submission:
    core: Perm
    mandatory: false
    role: Timing
    length: 10
    origins:
    - type: Collected
      source: Vendor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: RAW.EXDTC

        ...'
- name: EXADJ
  type: str
  label: Reason for Dose Adjustment
  derivation: RAW.EXADJ
  submission:
    core: Perm
    mandatory: false
    role: Record Qualifier
    length: 100
    origins:
    - type: Collected
      source: Vendor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: RAW.EXADJ

        ...'
- name: VISIT
  type: str
  label: Visit Name
  derivation: RAW.VISIT
  submission:
    core: Perm
    mandatory: false
    role: Timing
    length: 100
    origins:
    - type: Collected
      source: Vendor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: RAW.VISIT

        ...'
- name: VISITNUM
  type: int
  label: Source Visit Order
  derivation: RAW.VISITNUM
  submission:
    core: Perm
    mandatory: false
    role: Timing
    length: 8
    origins:
    - type: Collected
      source: Vendor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: RAW.VISITNUM

        ...'
- name: _RDATE
  type: date
  label: Internal Collection Date
  derivation:
    to_date:
      source: EXSTDTC
- name: _REFDT
  type: date
  label: Internal Reference Date
  derivation:
    to_date:
      source: DM.RFSTDTC
- name: EXDY
  type: int
  label: Study Day
  derivation:
    study_day:
      source: _RDATE
      reference: _REFDT
  submission:
    core: Perm
    mandatory: false
    role: Timing
    length: 8
    origins:
    - type: Derived
      source: Sponsor
    method:
      type: Computation
      description: "Executable derivation in the retained yamaa specification: study_day:\n\
        \  reference: _REFDT\n  source: _RDATE"
submission:
  has_no_data: false
  label: Exposure
  class: INTERVENTIONS
  structure: One record per subject and declared keys
  repeating: true
  reference_data: false
  non_standard: false
  comment: Synthetic development output. Review findings before analysis use.
