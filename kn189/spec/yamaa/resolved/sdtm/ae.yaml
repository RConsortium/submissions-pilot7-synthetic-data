yamaa: '1.0'
type: spec
model: SDTM
domain: AE
keys:
- STUDYID
- USUBJID
- AESEQ
input:
  RAW:
    path: ../../../../data/odm/extracted/ae.csv
    relative_to: declaring
    types:
      SRCSEQ: int
      VISITNUM: int
    empty_string: missing
  DM:
    path: ../../../../data/sdtm/dm-yamaa.parquet
    relative_to: declaring
    schema: dm.yaml
    empty_string: missing
    key:
    - STUDYID
    - USUBJID
base: RAW
output:
  path: ../../../../data/sdtm/ae-yamaa.parquet
  relative_to: declaring
  columns:
  - DOMAIN
  - STUDYID
  - USUBJID
  - AESEQ
  - AESPID
  - AEREFID
  - AETERM
  - AEDECOD
  - AEBODSYS
  - AESTDTC
  - AEENDTC
  - AESEV
  - AETOXGR
  - AESER
  - AEREL
  - AEACN
  - AEOUT
  - VISIT
  - VISITNUM
  - AEDY
  report: ../../../../data/sdtm/ae-report.parquet
  order_by:
  - variable: STUDYID
    direction: asc
  - variable: USUBJID
    direction: asc
  - variable: AESEQ
    direction: asc
columns:
- name: DOMAIN
  type: str
  label: DOMAIN
  derivation: '''AE'''
  submission:
    core: Req
    mandatory: true
    role: Identifier
    length: 2
    origins:
    - type: Assigned
      source: Sponsor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: ''''''AE'''''''
- name: STUDYID
  type: str
  label: Study Identifier
  derivation: RAW.STUDYID
  submission:
    core: Req
    mandatory: true
    role: Identifier
    length: 12
    origins:
    - type: Collected
      source: Vendor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: RAW.STUDYID

        ...'
- name: USUBJID
  type: str
  label: Unique Subject Identifier
  derivation: RAW.USUBJID
  submission:
    core: Req
    mandatory: true
    role: Identifier
    length: 40
    origins:
    - type: Collected
      source: Vendor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: RAW.USUBJID

        ...'
- name: AESEQ
  type: int
  label: Sequence Number
  derivation: RAW.SRCSEQ
  submission:
    core: Req
    mandatory: true
    role: Identifier
    length: 8
    origins:
    - type: Collected
      source: Vendor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: RAW.SRCSEQ

        ...'
- name: AESPID
  type: str
  label: Source Group Identifier
  derivation: RAW.GROUPOID
  submission:
    core: Perm
    mandatory: false
    role: Record Qualifier
    length: 100
    origins:
    - type: Collected
      source: Vendor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: RAW.GROUPOID

        ...'
- name: AEREFID
  type: str
  label: Source Group Repeat Identifier
  derivation: RAW.GROUPREP
  submission:
    core: Perm
    mandatory: false
    role: Record Qualifier
    length: 100
    origins:
    - type: Collected
      source: Vendor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: RAW.GROUPREP

        ...'
- name: AETERM
  type: str
  label: Reported Term for the Adverse Event
  derivation: RAW.AETERM
  submission:
    core: Perm
    mandatory: false
    role: Topic
    length: 100
    origins:
    - type: Collected
      source: Vendor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: RAW.AETERM

        ...'
- name: AEDECOD
  type: str
  label: Source Coded Adverse Event Term
  derivation: RAW.AEDECOD
  submission:
    core: Perm
    mandatory: false
    role: Record Qualifier
    length: 100
    origins:
    - type: Collected
      source: Vendor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: RAW.AEDECOD

        ...'
- name: AEBODSYS
  type: str
  label: Body System or Organ Class
  derivation: RAW.AEBODSYS
  submission:
    core: Perm
    mandatory: false
    role: Record Qualifier
    length: 100
    origins:
    - type: Collected
      source: Vendor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: RAW.AEBODSYS

        ...'
- name: AESTDTC
  type: str
  label: Start Date/Time of Adverse Event
  derivation: RAW.AESTDTC
  submission:
    core: Perm
    mandatory: false
    role: Timing
    length: 10
    origins:
    - type: Collected
      source: Vendor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: RAW.AESTDTC

        ...'
- name: AEENDTC
  type: str
  label: End Date/Time of Adverse Event
  derivation: RAW.AEENDTC
  submission:
    core: Perm
    mandatory: false
    role: Timing
    length: 10
    origins:
    - type: Collected
      source: Vendor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: RAW.AEENDTC

        ...'
- name: AESEV
  type: str
  label: Severity/Intensity
  derivation:
    case:
    - when: RAW.AESEV = 'LIFE-THREATENING'
      then: '''SEVERE'''
    - otherwise: RAW.AESEV
  submission:
    core: Perm
    mandatory: false
    role: Record Qualifier
    length: 100
    origins:
    - type: Derived
      source: Sponsor
    method:
      type: Computation
      description: "Executable derivation in the retained yamaa specification: case:\n\
        - then: '''SEVERE'''\n  when: RAW.AESEV = 'LIFE-THREATENING'\n- otherwise:\
        \ RAW.AESEV"
- name: AETOXGR
  type: str
  label: Standard Toxicity Grade
  derivation: RAW.AETOXGR
  submission:
    core: Perm
    mandatory: false
    role: Record Qualifier
    length: 100
    origins:
    - type: Collected
      source: Vendor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: RAW.AETOXGR

        ...'
- name: AESER
  type: str
  label: Serious Event
  derivation: RAW.AESER
  submission:
    core: Perm
    mandatory: false
    role: Record Qualifier
    length: 100
    origins:
    - type: Collected
      source: Vendor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: RAW.AESER

        ...'
- name: AEREL
  type: str
  label: Causality
  derivation: RAW.AEREL
  submission:
    core: Perm
    mandatory: false
    role: Record Qualifier
    length: 100
    origins:
    - type: Collected
      source: Vendor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: RAW.AEREL

        ...'
- name: AEACN
  type: str
  label: Action Taken with Study Treatment
  derivation: RAW.AEACN
  submission:
    core: Perm
    mandatory: false
    role: Record Qualifier
    length: 100
    origins:
    - type: Collected
      source: Vendor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: RAW.AEACN

        ...'
- name: AEOUT
  type: str
  label: Outcome of Adverse Event
  derivation: RAW.AEOUT
  submission:
    core: Perm
    mandatory: false
    role: Record Qualifier
    length: 100
    origins:
    - type: Collected
      source: Vendor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: RAW.AEOUT

        ...'
- name: VISIT
  type: str
  label: Visit Name
  derivation: RAW.VISIT
  submission:
    core: Perm
    mandatory: false
    role: Timing
    length: 100
    origins:
    - type: Collected
      source: Vendor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: RAW.VISIT

        ...'
- name: VISITNUM
  type: int
  label: Source Visit Order
  derivation: RAW.VISITNUM
  submission:
    core: Perm
    mandatory: false
    role: Timing
    length: 8
    origins:
    - type: Collected
      source: Vendor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: RAW.VISITNUM

        ...'
- name: _RDATE
  type: date
  label: Internal Collection Date
  derivation:
    to_date:
      source: AESTDTC
- name: _REFDT
  type: date
  label: Internal Reference Date
  derivation:
    to_date:
      source: DM.RFSTDTC
- name: AEDY
  type: int
  label: Study Day
  derivation:
    study_day:
      source: _RDATE
      reference: _REFDT
  submission:
    core: Perm
    mandatory: false
    role: Timing
    length: 8
    origins:
    - type: Derived
      source: Sponsor
    method:
      type: Computation
      description: "Executable derivation in the retained yamaa specification: study_day:\n\
        \  reference: _REFDT\n  source: _RDATE"
submission:
  has_no_data: false
  label: Adverse Events
  class: EVENTS
  structure: One record per subject and declared keys
  repeating: true
  reference_data: false
  non_standard: false
  comment: Synthetic development output. Review findings before analysis use.
