yamaa: '1.0'
type: spec
model: SDTM
domain: SUPPDM
keys:
- STUDYID
- USUBJID
- QNAM
input:
  RAW:
    path: ../../../../data/odm/extracted/dm.csv
    relative_to: declaring
    types:
      SRCSEQ: int
      VISITNUM: int
    empty_string: missing
output:
  path: ../../../../data/sdtm/suppdm-yamaa.parquet
  relative_to: declaring
  columns:
  - STUDYID
  - USUBJID
  - RDOMAIN
  - IDVAR
  - IDVARVAL
  - QNAM
  - QLABEL
  - QVAL
  - QORIG
  - QEVAL
  report: ../../../../data/sdtm/suppdm-report.parquet
  order_by:
  - variable: STUDYID
    direction: asc
  - variable: USUBJID
    direction: asc
  - variable: QNAM
    direction: asc
columns:
- name: STUDYID
  type: str
  label: Study Identifier
  derivation: RAW.STUDYID
  submission:
    core: Req
    mandatory: true
    role: Identifier
    length: 12
    origins:
    - type: Collected
      source: Vendor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: RAW.STUDYID

        ...'
- name: USUBJID
  type: str
  label: Unique Subject Identifier
  derivation: RAW.USUBJID
  submission:
    core: Req
    mandatory: true
    role: Identifier
    length: 40
    origins:
    - type: Collected
      source: Vendor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: RAW.USUBJID

        ...'
- name: RDOMAIN
  type: str
  label: Related Domain Abbreviation
  derivation: '''DM'''
  submission:
    core: Perm
    mandatory: false
    role: Record Qualifier
    length: 100
    origins:
    - type: Assigned
      source: Sponsor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: ''''''DM'''''''
- name: IDVAR
  type: str
  label: Identifying Variable
  derivation: null
  submission:
    core: Perm
    mandatory: false
    role: Record Qualifier
    length: 100
    origins:
    - type: Other
      source: Sponsor
      description: Not collected or not established from these synthetic sources.
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: null

        ...'
- name: IDVARVAL
  type: str
  label: Identifying Variable Value
  derivation: null
  submission:
    core: Perm
    mandatory: false
    role: Record Qualifier
    length: 100
    origins:
    - type: Other
      source: Sponsor
      description: Not collected or not established from these synthetic sources.
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: null

        ...'
- name: QNAM
  type: str
  label: Qualifier Variable Name
  derivation: null
  submission:
    core: Req
    mandatory: true
    role: Record Qualifier
    length: 100
    origins:
    - type: Assigned
      source: Sponsor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: null

        ...'
- name: QLABEL
  type: str
  label: Qualifier Variable Label
  derivation: null
  submission:
    core: Perm
    mandatory: false
    role: Record Qualifier
    length: 100
    origins:
    - type: Assigned
      source: Sponsor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: null

        ...'
- name: QVAL
  type: str
  label: Data Value
  derivation: null
  submission:
    core: Perm
    mandatory: false
    role: Record Qualifier
    length: 100
    origins:
    - type: Collected
      source: Vendor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: null

        ...'
- name: QORIG
  type: str
  label: Origin
  derivation: '''CRF'''
  submission:
    core: Perm
    mandatory: false
    role: Record Qualifier
    length: 100
    origins:
    - type: Assigned
      source: Sponsor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: ''''''CRF'''''''
- name: QEVAL
  type: str
  label: Evaluator
  derivation: '''SPONSOR'''
  submission:
    core: Perm
    mandatory: false
    role: Record Qualifier
    length: 100
    origins:
    - type: Assigned
      source: Sponsor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: ''''''SPONSOR'''''''
rows:
- id: race
  dataset: RAW
  filter: RAW.RACE IS NOT NULL
  derivations:
    QNAM: '''ORIGRACE'''
    QLABEL: '''Original collected RACE'''
    QVAL: RAW.RACE
- id: country
  dataset: RAW
  filter: RAW.COUNTRY IS NOT NULL
  derivations:
    QNAM: '''ORIGCTRY'''
    QLABEL: '''Original collected COUNTRY'''
    QVAL: RAW.COUNTRY
submission:
  has_no_data: false
  label: Supplemental DM Qualifiers
  class: FINDINGS
  structure: One record per subject and declared keys
  repeating: true
  reference_data: false
  non_standard: false
  comment: Synthetic development output. Review findings before analysis use.
