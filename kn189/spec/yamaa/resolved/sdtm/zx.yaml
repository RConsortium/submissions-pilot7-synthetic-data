yamaa: '1.0'
type: spec
model: SDTM
domain: ZX
keys:
- STUDYID
- USUBJID
- ZXSEQ
input:
  DM:
    path: ../../../../data/sdtm/dm-yamaa.parquet
    relative_to: declaring
    schema: dm.yaml
    empty_string: missing
    key:
    - STUDYID
    - USUBJID
  RERAW:
    path: ../../../../data/odm/extracted/re.csv
    relative_to: declaring
    types:
      SRCSEQ: int
      VISITNUM: int
    empty_string: missing
output:
  path: ../../../../data/sdtm/zx-yamaa.parquet
  relative_to: declaring
  columns:
  - DOMAIN
  - STUDYID
  - USUBJID
  - ZXSPID
  - ZXREFID
  - ZXTESTCD
  - ZXTEST
  - ZXCAT
  - ZXORRES
  - ZXORRESU
  - ZXSTRESC
  - ZXSTRESN
  - ZXSTRESU
  - ZXDTC
  - VISIT
  - VISITNUM
  - ZXDY
  - ZXSEQ
  report: ../../../../data/sdtm/zx-report.parquet
  order_by:
  - variable: STUDYID
    direction: asc
  - variable: USUBJID
    direction: asc
  - variable: ZXSEQ
    direction: asc
columns:
- name: DOMAIN
  type: str
  label: DOMAIN
  derivation: '''ZX'''
  submission:
    core: Req
    mandatory: true
    role: Identifier
    length: 2
    origins:
    - type: Assigned
      source: Sponsor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: ''''''ZX'''''''
- name: STUDYID
  type: str
  label: STUDYID
  derivation: null
  submission:
    core: Req
    mandatory: true
    role: Identifier
    length: 12
    origins:
    - type: Collected
      source: Vendor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: null

        ...'
- name: USUBJID
  type: str
  label: USUBJID
  derivation: null
  submission:
    core: Req
    mandatory: true
    role: Identifier
    length: 40
    origins:
    - type: Collected
      source: Vendor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: null

        ...'
- name: ZXSPID
  type: str
  label: Source Group and Record Identifier
  derivation: null
  submission:
    core: Perm
    mandatory: false
    role: Record Qualifier
    length: 100
    origins:
    - type: Collected
      source: Vendor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: null

        ...'
- name: ZXREFID
  type: str
  label: Source Item OID
  derivation: null
  submission:
    core: Perm
    mandatory: false
    role: Record Qualifier
    length: 100
    origins:
    - type: Assigned
      source: Sponsor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: null

        ...'
- name: ZXTESTCD
  type: str
  label: Test Short Name
  derivation: null
  submission:
    core: Perm
    mandatory: false
    role: Topic
    length: 100
    origins:
    - type: Assigned
      source: Sponsor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: null

        ...'
- name: ZXTEST
  type: str
  label: Test Name
  derivation: null
  submission:
    core: Perm
    mandatory: false
    role: Record Qualifier
    length: 100
    origins:
    - type: Assigned
      source: Sponsor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: null

        ...'
- name: ZXCAT
  type: str
  label: Category
  derivation: null
  submission:
    core: Perm
    mandatory: false
    role: Record Qualifier
    length: 100
    origins:
    - type: Assigned
      source: Sponsor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: null

        ...'
- name: ZXORRES
  type: str
  label: Result in Original Units
  derivation: null
  submission:
    core: Perm
    mandatory: false
    role: Record Qualifier
    length: 100
    origins:
    - type: Collected
      source: Vendor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: null

        ...'
- name: ZXORRESU
  type: str
  label: Original Units
  derivation: null
  submission:
    core: Perm
    mandatory: false
    role: Record Qualifier
    length: 100
    origins:
    - type: Other
      source: Sponsor
      description: Not collected or not established from these synthetic sources.
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: null

        ...'
- name: ZXSTRESC
  type: str
  label: Character Result in Std Format
  derivation: ZXORRES
  submission:
    core: Perm
    mandatory: false
    role: Record Qualifier
    length: 100
    origins:
    - type: Derived
      source: Sponsor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: ZXORRES

        ...'
- name: ZXSTRESN
  type: float
  label: Numeric Result in Std Format
  derivation:
    value: ZXORRES
    unconvertible: null
  submission:
    core: Perm
    mandatory: false
    role: Record Qualifier
    length: 8
    significant_digits: 8
    origins:
    - type: Derived
      source: Sponsor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: unconvertible:
        null

        value: ZXORRES'
- name: ZXSTRESU
  type: str
  label: Standard Units
  derivation: ZXORRESU
  submission:
    core: Perm
    mandatory: false
    role: Record Qualifier
    length: 100
    origins:
    - type: Derived
      source: Sponsor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: ZXORRESU

        ...'
- name: ZXDTC
  type: str
  label: Date/Time of Collection
  derivation: null
  submission:
    core: Perm
    mandatory: false
    role: Timing
    length: 10
    origins:
    - type: Other
      source: Sponsor
      description: Not collected or not established from these synthetic sources.
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: null

        ...'
- name: VISIT
  type: str
  label: Visit Name
  derivation: null
  submission:
    core: Perm
    mandatory: false
    role: Timing
    length: 100
    origins:
    - type: Collected
      source: Vendor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: null

        ...'
- name: VISITNUM
  type: int
  label: Source Visit Order
  derivation: null
  submission:
    core: Perm
    mandatory: false
    role: Timing
    length: 8
    origins:
    - type: Collected
      source: Vendor
    method:
      type: Computation
      description: 'Executable derivation in the retained yamaa specification: null

        ...'
- name: _RDATE
  type: date
  label: Internal Collection Date
  derivation:
    to_date:
      source: ZXDTC
- name: _REFDT
  type: date
  label: Internal Reference Date
  derivation:
    to_date:
      source: DM.RFSTDTC
- name: ZXDY
  type: int
  label: Study Day
  derivation:
    study_day:
      source: _RDATE
      reference: _REFDT
  submission:
    core: Perm
    mandatory: false
    role: Timing
    length: 8
    origins:
    - type: Derived
      source: Sponsor
    method:
      type: Computation
      description: "Executable derivation in the retained yamaa specification: study_day:\n\
        \  reference: _REFDT\n  source: _RDATE"
- name: ZXSEQ
  type: int
  label: Sequence Number
  derivation:
    row_number:
      window:
        group_by:
        - STUDYID
        - USUBJID
        order_by:
        - variable: VISITNUM
          direction: asc
        - variable: ZXSPID
          direction: asc
        - variable: ZXREFID
          direction: asc
        - variable: ZXTESTCD
          direction: asc
  submission:
    core: Req
    mandatory: true
    role: Identifier
    length: 8
    origins:
    - type: Derived
      source: Sponsor
    method:
      type: Computation
      description: "Executable derivation in the retained yamaa specification: row_number:\n\
        \  window:\n    group_by:\n    - STUDYID\n    - USUBJID\n    order_by:\n \
        \   - VISITNUM\n    - ZXSPID\n    - ZXREFID\n    - ZXTESTCD"
rows:
- id: re_pfs_day
  dataset: RERAW
  filter: RERAW.PFS_DAY IS NOT NULL
  derivations:
    STUDYID: RERAW.STUDYID
    USUBJID: RERAW.USUBJID
    ZXSPID: RERAW.SRCSEQ
    ZXREFID: '''IT.NCT02578680.RE.PFS_DAY'''
    ZXTESTCD: '''PFSDAY'''
    ZXTEST: '''PFS_DAY'''
    ZXCAT: '''SOURCE DERIVED EFFICACY'''
