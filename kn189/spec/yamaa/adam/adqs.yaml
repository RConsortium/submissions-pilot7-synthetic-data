yamaa: '1.0'
type: spec
model: ADaM
domain: ADQS
keys:
- STUDYID
- USUBJID
- ASEQ
input:
  QS:
    path: ../../../data/sdtm/qs-yamaa.parquet
    schema: ../sdtm/qs.yaml
  ADSL:
    path: ../../../data/adam/adsl-yamaa.parquet
    schema: ../adam/adsl.yaml
    key:
    - STUDYID
    - USUBJID
output:
  path: ../../../data/adam/adqs-yamaa.parquet
  columns:
  - STUDYID
  - USUBJID
  - PARAMCD
  - PARAM
  - PARCAT1
  - ADT
  - AVAL
  - AVALC
  - AVALU
  - AVISIT
  - AVISITN
  - TRTSDT
  - TRT01P
  - TRT01A
  - ITTFL
  - SAFFL
  - ADY
  - ASEQ
  - SRCDOM
  - SRCVAR
  - SRCSEQ
  - APPRFL
  - ABLFL
  - BASETYPE
  - BASE
  - CHG
  - PCHG
  - ANL01FL
  report: ../../../data/adam/adqs-report.parquet
  order_by:
  - STUDYID
  - USUBJID
  - ASEQ
columns:
- name: STUDYID
  type: str
  label: Study Identifier
  derivation: QS.STUDYID
  submission:
    mandatory: true
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: QS.STUDYID

      ...'
    length: 12
    core: Req
- name: USUBJID
  type: str
  label: Unique Subject Identifier
  derivation: QS.USUBJID
  submission:
    mandatory: true
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: QS.USUBJID

      ...'
    length: 40
    core: Req
- name: PARAMCD
  type: str
  label: Parameter Code
  derivation: QS.QSTESTCD
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: QS.QSTESTCD

      ...'
    length: 8
    core: Perm
- name: PARAM
  type: str
  label: Parameter
  derivation: QS.QSTEST
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: QS.QSTEST

      ...'
    length: 80
    core: Perm
- name: PARCAT1
  type: str
  label: Parameter Category
  derivation: QS.QSCAT
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: QS.QSCAT

      ...'
    length: 100
    core: Perm
- name: ADT
  type: date
  label: Analysis Date
  derivation:
    to_date:
      source: QS.QSDTC
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: "Executable derivation in the retained yamaa specification: to_date:\n  source: QS.QSDTC"
    core: Perm
- name: AVAL
  type: float
  label: Analysis Value
  derivation: QS.QSSTRESN
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: QS.QSSTRESN

      ...'
    length: 8
    significant_digits: 8
    core: Perm
- name: AVALC
  type: str
  label: Analysis Value Character
  derivation: QS.QSSTRESC
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: QS.QSSTRESC

      ...'
    length: 100
    core: Perm
- name: AVALU
  type: str
  label: Analysis Value Unit
  derivation: QS.QSSTRESU
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: QS.QSSTRESU

      ...'
    length: 100
    core: Perm
- name: AVISIT
  type: str
  label: Source Visit
  derivation: QS.VISIT
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: QS.VISIT

      ...'
    length: 100
    core: Perm
- name: AVISITN
  type: int
  label: Source Visit Order
  derivation: QS.VISITNUM
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: QS.VISITNUM

      ...'
    length: 8
    core: Perm
- name: TRTSDT
  type: date
  label: First Treatment Date
  derivation: ADSL.TRTSDT
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: ADSL.TRTSDT

      ...'
    core: Perm
- name: TRT01P
  type: str
  label: Planned Treatment
  derivation: ADSL.TRT01P
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: ADSL.TRT01P

      ...'
    length: 80
    core: Perm
- name: TRT01A
  type: str
  label: Actual Treatment
  derivation: ADSL.TRT01A
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: ADSL.TRT01A

      ...'
    length: 80
    core: Perm
- name: ITTFL
  type: str
  label: ITT Population Flag
  derivation: ADSL.ITTFL
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: ADSL.ITTFL

      ...'
    length: 1
    core: Perm
- name: SAFFL
  type: str
  label: Safety Population Flag
  derivation: ADSL.SAFFL
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: ADSL.SAFFL

      ...'
    length: 1
    core: Perm
- name: ADY
  type: int
  label: Analysis Relative Day
  derivation:
    study_day:
      source: ADT
      reference: TRTSDT
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: "Executable derivation in the retained yamaa specification: study_day:\n  reference: TRTSDT\n  source:\
      \ ADT"
    length: 8
    core: Perm
- name: ASEQ
  type: int
  label: Analysis Sequence
  derivation: QS.QSSEQ
  submission:
    mandatory: true
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: QS.QSSEQ

      ...'
    length: 8
    core: Req
- name: SRCDOM
  type: str
  label: Source Domain
  derivation: '''QS'''
  submission:
    mandatory: false
    origins:
    - type: Assigned
    method: 'Executable derivation in the retained yamaa specification: ''''''QS'''''''
    length: 8
    core: Perm
- name: SRCVAR
  type: str
  label: Source Variable
  derivation: '''QSSTRESC'''
  submission:
    mandatory: false
    origins:
    - type: Assigned
    method: 'Executable derivation in the retained yamaa specification: ''''''QSSTRESC'''''''
    length: 12
    core: Perm
- name: SRCSEQ
  type: int
  label: Source Sequence
  derivation: QS.QSSEQ
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: QS.QSSEQ

      ...'
    length: 8
    core: Perm
- name: APPRFL
  type: str
  label: Human Analysis Approval Flag
  derivation: '''N'''
  submission:
    mandatory: false
    origins:
    - type: Assigned
    method: 'Executable derivation in the retained yamaa specification: ''''''N'''''''
    length: 1
    core: Perm
- name: ABLFL
  type: str
  label: Candidate Baseline Record Flag
  derivation:
    baseline_flag:
      window:
        group_by:
        - STUDYID
        - USUBJID
        - PARAMCD
        filter: AVISITN <= 2
        order_by:
        - ADT
        - AVISITN
        - ASEQ
      date: ADT
      reference: TRTSDT
      source: AVAL
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: "Executable derivation in the retained yamaa specification: baseline_flag:\n  date: ADT\n  reference:\
      \ TRTSDT\n  source: AVAL\n  window:\n    filter: AVISITN <= 2\n    group_by:\n    - STUDYID\n    - USUBJID\n\
      \    - PARAMCD\n    order_by:\n    - ADT\n    - AVISITN\n    - ASEQ"
    length: 1
    core: Perm
- name: BASETYPE
  type: str
  label: Baseline Definition
  derivation: '''DATE-ONLY CANDIDATE'''
  submission:
    mandatory: false
    origins:
    - type: Assigned
    method: 'Executable derivation in the retained yamaa specification: ''''''DATE-ONLY CANDIDATE'''''''
    length: 32
    core: Perm
- name: BASE
  type: float
  label: Baseline Value
  derivation:
    aggregate:
      filter: ABLFL = 'Y'
      group_by:
      - STUDYID
      - USUBJID
      - PARAMCD
      expr: ONLY(AVAL)
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: "Executable derivation in the retained yamaa specification: aggregate:\n  expr: ONLY(AVAL)\n  filter:\
      \ ABLFL = 'Y'\n  group_by:\n  - STUDYID\n  - USUBJID\n  - PARAMCD"
    length: 8
    significant_digits: 8
    core: Perm
- name: CHG
  type: float
  label: Change from Baseline
  derivation: AVAL - BASE
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: AVAL - BASE

      ...'
    length: 8
    significant_digits: 8
    core: Perm
- name: PCHG
  type: float
  label: Percent Change from Baseline
  derivation: 100 * CHG / NULLIF(BASE, 0)
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: 100 * CHG / NULLIF(BASE, 0)

      ...'
    length: 8
    significant_digits: 8
    core: Perm
- name: ANL01FL
  type: str
  label: Postdose Analysis Record Flag
  derivation:
    case:
    - when: SAFFL = 'Y' AND AVAL IS NOT NULL AND ADT > TRTSDT
      then: '''Y'''
    - otherwise: null
  submission:
    mandatory: false
    origins:
    - type: Assigned
    method: "Executable derivation in the retained yamaa specification: case:\n- then: '''Y'''\n  when: SAFFL =\
      \ 'Y' AND AVAL IS NOT NULL AND ADT > TRTSDT\n- otherwise: null"
    length: 1
    core: Perm
submission:
  label: Questionnaire Score Analysis
  class: BASIC DATA STRUCTURE
  structure: One record per subject and declared keys
  repeating: true
  comment: Synthetic development output. Review findings before analysis use.
base: QS
