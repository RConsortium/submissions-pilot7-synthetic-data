yamaa: '1.0'
type: spec
model: ADaM
domain: ADRESP
keys:
- STUDYID
- USUBJID
- PARAMCD
input:
  ZX:
    path: ../../../data/sdtm/zx-yamaa.parquet
    schema: ../sdtm/zx.yaml
  ADSL:
    path: ../../../data/adam/adsl-yamaa.parquet
    schema: ../adam/adsl.yaml
    key:
    - STUDYID
    - USUBJID
output:
  path: ../../../data/adam/adresp-yamaa.parquet
  columns:
  - STUDYID
  - USUBJID
  - PARAMCD
  - PARAM
  - AVAL
  - AVALC
  - DTYPE
  - TRT01P
  - ITTFL
  - ANL01FL
  - ANL02FL
  - APPRFL
  - SRCDOM
  - SRCVAR
  - SRCSEQ
  report: ../../../data/adam/adresp-report.parquet
  order_by:
  - STUDYID
  - USUBJID
  - PARAMCD
columns:
- name: STUDYID
  type: str
  label: Study Identifier
  derivation: ZX.STUDYID
  submission:
    mandatory: true
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: ZX.STUDYID

      ...'
    length: 12
    core: Req
- name: USUBJID
  type: str
  label: Unique Subject Identifier
  derivation: ZX.USUBJID
  submission:
    mandatory: true
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: ZX.USUBJID

      ...'
    length: 40
    core: Req
- name: PARAMCD
  type: str
  label: Parameter Code
  derivation: null
  submission:
    mandatory: true
    origins:
    - type: Assigned
    method: 'Executable derivation in the retained yamaa specification: null

      ...'
    length: 8
    core: Req
- name: PARAM
  type: str
  label: Parameter
  derivation: null
  submission:
    mandatory: false
    origins:
    - type: Assigned
    method: 'Executable derivation in the retained yamaa specification: null

      ...'
    length: 80
    core: Perm
- name: AVAL
  type: float
  label: Source Analysis Value
  derivation: ZX.ZXSTRESN
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: ZX.ZXSTRESN

      ...'
    length: 8
    significant_digits: 8
    core: Perm
- name: AVALC
  type: str
  label: Source Analysis Value Character
  derivation: ZX.ZXSTRESC
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: ZX.ZXSTRESC

      ...'
    length: 100
    core: Perm
- name: DTYPE
  type: str
  label: Derivation Type
  derivation: '''SOURCE SUMMARY'''
  submission:
    mandatory: false
    origins:
    - type: Assigned
    method: 'Executable derivation in the retained yamaa specification: ''''''SOURCE SUMMARY'''''''
    length: 24
    core: Perm
- name: TRT01P
  type: str
  label: Planned Treatment
  derivation: ADSL.TRT01P
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: ADSL.TRT01P

      ...'
    length: 80
    core: Perm
- name: ITTFL
  type: str
  label: ITT Population Flag
  derivation: ADSL.ITTFL
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: ADSL.ITTFL

      ...'
    length: 1
    core: Perm
- name: ANL01FL
  type: str
  label: Approved Primary Analysis Record
  derivation: null
  submission:
    mandatory: false
    origins:
    - type: Other
      description: Not collected or not established from these synthetic sources.
    method: 'Executable derivation in the retained yamaa specification: null

      ...'
    length: 1
    core: Perm
- name: ANL02FL
  type: str
  label: Development / Descriptive Record
  derivation: '''Y'''
  submission:
    mandatory: false
    origins:
    - type: Assigned
    method: 'Executable derivation in the retained yamaa specification: ''''''Y'''''''
    length: 1
    core: Perm
- name: APPRFL
  type: str
  label: Human Analysis Approval Flag
  derivation: '''N'''
  submission:
    mandatory: false
    origins:
    - type: Assigned
    method: 'Executable derivation in the retained yamaa specification: ''''''N'''''''
    length: 1
    core: Perm
- name: SRCDOM
  type: str
  label: Source Domain
  derivation: '''ZX'''
  submission:
    mandatory: false
    origins:
    - type: Assigned
    method: 'Executable derivation in the retained yamaa specification: ''''''ZX'''''''
    length: 8
    core: Perm
- name: SRCVAR
  type: str
  label: Source Variable
  derivation: '''ZXSTRESC'''
  submission:
    mandatory: false
    origins:
    - type: Assigned
    method: 'Executable derivation in the retained yamaa specification: ''''''ZXSTRESC'''''''
    length: 12
    core: Perm
- name: SRCSEQ
  type: int
  label: Source Sequence
  derivation: ZX.ZXSEQ
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: ZX.ZXSEQ

      ...'
    length: 8
    core: Perm
submission:
  label: Source Response Summary Analysis
  class: BASIC DATA STRUCTURE
  structure: One record per subject and declared keys
  repeating: true
  comment: Synthetic development output. Review findings before analysis use.
rows:
- id: bor
  dataset: ZX
  filter: ZX.ZXTESTCD = 'BESTRESP'
  derivations:
    PARAMCD: '''BOR'''
    PARAM: '''Source Best Overall Response'''
- id: cbor
  dataset: ZX
  filter: ZX.ZXTESTCD = 'CNFRSP'
  derivations:
    PARAMCD: '''CBOR'''
    PARAM: '''Source Confirmed Response'''
- id: orr
  dataset: ZX
  filter: ZX.ZXTESTCD = 'ORR'
  derivations:
    PARAMCD: '''ORR'''
    PARAM: '''Source Objective Response Indicator'''
- id: dor
  dataset: ZX
  filter: ZX.ZXTESTCD = 'DORDAY'
  derivations:
    PARAMCD: '''DOR'''
    PARAM: '''Source Duration of Response (Days)'''
