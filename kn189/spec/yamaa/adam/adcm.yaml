yamaa: '1.0'
type: spec
model: ADaM
domain: ADCM
keys:
- STUDYID
- USUBJID
- ASEQ
input:
  CM:
    path: ../../../data/sdtm/cm-yamaa.parquet
    schema: ../sdtm/cm.yaml
  ADSL:
    path: ../../../data/adam/adsl-yamaa.parquet
    schema: ../adam/adsl.yaml
    key:
    - STUDYID
    - USUBJID
output:
  path: ../../../data/adam/adcm-yamaa.parquet
  columns:
  - STUDYID
  - USUBJID
  - ASEQ
  - CMTRT
  - CMCAT
  - ASTDT
  - TRT01A
  - SRCDOM
  - SRCSEQ
  report: ../../../data/adam/adcm-report.parquet
  order_by:
  - STUDYID
  - USUBJID
  - ASEQ
columns:
- name: STUDYID
  type: str
  label: Study Identifier
  derivation: CM.STUDYID
  submission:
    mandatory: true
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: CM.STUDYID

      ...'
    length: 12
    core: Req
- name: USUBJID
  type: str
  label: Unique Subject Identifier
  derivation: CM.USUBJID
  submission:
    mandatory: true
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: CM.USUBJID

      ...'
    length: 40
    core: Req
- name: ASEQ
  type: int
  label: Analysis Sequence
  derivation: CM.CMSEQ
  submission:
    mandatory: true
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: CM.CMSEQ

      ...'
    length: 8
    core: Req
- name: CMTRT
  type: str
  label: Medication / Therapy
  derivation: CM.CMTRT
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: CM.CMTRT

      ...'
    length: 100
    core: Perm
- name: CMCAT
  type: str
  label: Medication Category
  derivation: CM.CMCAT
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: CM.CMCAT

      ...'
    length: 100
    core: Perm
- name: ASTDT
  type: date
  label: Analysis Start Date
  derivation:
    to_date:
      source: CM.CMSTDTC
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: "Executable derivation in the retained yamaa specification: to_date:\n  source: CM.CMSTDTC"
    core: Perm
- name: TRT01A
  type: str
  label: Actual Treatment
  derivation: ADSL.TRT01A
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: ADSL.TRT01A

      ...'
    length: 80
    core: Perm
- name: SRCDOM
  type: str
  label: Source Domain
  derivation: '''CM'''
  submission:
    mandatory: false
    origins:
    - type: Assigned
    method: 'Executable derivation in the retained yamaa specification: ''''''CM'''''''
    length: 8
    core: Perm
- name: SRCSEQ
  type: int
  label: Source Sequence
  derivation: CM.CMSEQ
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: CM.CMSEQ

      ...'
    length: 8
    core: Perm
submission:
  label: Medication Analysis
  class: OCCURRENCE DATA STRUCTURE
  structure: One record per subject and declared keys
  repeating: true
  comment: Synthetic development output. Review findings before analysis use.
base: CM
