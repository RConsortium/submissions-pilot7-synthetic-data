yamaa: '1.0'
type: spec
model: ADaM
domain: ADAE
keys:
- STUDYID
- USUBJID
- AESEQ
input:
  AE:
    path: ../../../data/sdtm/ae-yamaa.parquet
    schema: ../sdtm/ae.yaml
  ADSL:
    path: ../../../data/adam/adsl-yamaa.parquet
    schema: ../adam/adsl.yaml
    key:
    - STUDYID
    - USUBJID
output:
  path: ../../../data/adam/adae-yamaa.parquet
  columns:
  - STUDYID
  - USUBJID
  - AESEQ
  - AEDECOD
  - AETERM
  - AEBODSYS
  - AESER
  - AEREL
  - AEACN
  - AEOUT
  - AETOXGR
  - ASTDT
  - AENDT
  - TRTSDT
  - TRTEDT
  - TRT01A
  - TRT01AN
  - SAFFL
  - ASTDY
  - AETOXGRN
  - RELFL
  - SAFENDT
  - TRTEMFL
  - ANL01FL
  - APPRFL
  - SRCDOM
  - SRCSEQ
  report: ../../../data/adam/adae-report.parquet
  order_by:
  - STUDYID
  - USUBJID
  - AESEQ
columns:
- name: STUDYID
  type: str
  label: Study Identifier
  derivation: AE.STUDYID
  submission:
    mandatory: true
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: AE.STUDYID

      ...'
    length: 12
    core: Req
- name: USUBJID
  type: str
  label: Unique Subject Identifier
  derivation: AE.USUBJID
  submission:
    mandatory: true
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: AE.USUBJID

      ...'
    length: 40
    core: Req
- name: AESEQ
  type: int
  label: Source AE Sequence
  derivation: AE.AESEQ
  submission:
    mandatory: true
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: AE.AESEQ

      ...'
    length: 8
    core: Req
- name: AEDECOD
  type: str
  label: Source Coded Adverse Event Term
  derivation: AE.AEDECOD
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: AE.AEDECOD

      ...'
    length: 100
    core: Perm
- name: AETERM
  type: str
  label: Reported Adverse Event Term
  derivation: AE.AETERM
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: AE.AETERM

      ...'
    length: 100
    core: Perm
- name: AEBODSYS
  type: str
  label: System Organ Class
  derivation: AE.AEBODSYS
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: AE.AEBODSYS

      ...'
    length: 100
    core: Perm
- name: AESER
  type: str
  label: Serious Event
  derivation: AE.AESER
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: AE.AESER

      ...'
    length: 100
    core: Perm
- name: AEREL
  type: str
  label: Causality
  derivation: AE.AEREL
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: AE.AEREL

      ...'
    length: 100
    core: Perm
- name: AEACN
  type: str
  label: Action Taken
  derivation: AE.AEACN
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: AE.AEACN

      ...'
    length: 100
    core: Perm
- name: AEOUT
  type: str
  label: Outcome
  derivation: AE.AEOUT
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: AE.AEOUT

      ...'
    length: 100
    core: Perm
- name: AETOXGR
  type: str
  label: Source Toxicity Grade
  derivation: AE.AETOXGR
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: AE.AETOXGR

      ...'
    length: 100
    core: Perm
- name: ASTDT
  type: date
  label: Analysis Start Date
  derivation:
    to_date:
      source: AE.AESTDTC
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: "Executable derivation in the retained yamaa specification: to_date:\n  source: AE.AESTDTC"
    core: Perm
- name: AENDT
  type: date
  label: Analysis End Date
  derivation:
    to_date:
      source: AE.AEENDTC
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: "Executable derivation in the retained yamaa specification: to_date:\n  source: AE.AEENDTC"
    core: Perm
- name: TRTSDT
  type: date
  label: First Treatment Date
  derivation: ADSL.TRTSDT
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: ADSL.TRTSDT

      ...'
    core: Perm
- name: TRTEDT
  type: date
  label: Last Recorded Study Dose
  derivation: ADSL.TRTEDT
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: ADSL.TRTEDT

      ...'
    core: Perm
- name: TRT01A
  type: str
  label: Actual Treatment
  derivation: ADSL.TRT01A
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: ADSL.TRT01A

      ...'
    length: 80
    core: Perm
- name: TRT01AN
  type: int
  label: Actual Treatment Code
  derivation: ADSL.TRT01AN
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: ADSL.TRT01AN

      ...'
    length: 8
    core: Perm
- name: SAFFL
  type: str
  label: Safety Population Flag
  derivation: ADSL.SAFFL
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: ADSL.SAFFL

      ...'
    length: 1
    core: Perm
- name: ASTDY
  type: int
  label: Analysis Start Relative Day
  derivation:
    study_day:
      source: ASTDT
      reference: TRTSDT
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: "Executable derivation in the retained yamaa specification: study_day:\n  reference: TRTSDT\n  source:\
      \ ASTDT"
    length: 8
    core: Perm
- name: AETOXGRN
  type: int
  label: Numeric Toxicity Grade
  derivation: AE.AETOXGR
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: AE.AETOXGR

      ...'
    length: 8
    core: Perm
- name: RELFL
  type: str
  label: Related Event Flag
  derivation:
    case:
    - when: AE.AEREL IN ('RELATED','POSSIBLY RELATED')
      then: '''Y'''
    - otherwise: '''N'''
  submission:
    mandatory: false
    origins:
    - type: Assigned
    method: "Executable derivation in the retained yamaa specification: case:\n- then: '''Y'''\n  when: AE.AEREL\
      \ IN ('RELATED','POSSIBLY RELATED')\n- otherwise: '''N'''"
    length: 1
    core: Perm
- name: _FU30
  type: date
  label: Internal 30-Day Safety End
  derivation:
    shift:
      type: date
      source: TRTEDT
      days: 30
- name: _FU90
  type: date
  label: Internal 90-Day Safety End
  derivation:
    shift:
      type: date
      source: TRTEDT
      days: 90
- name: SAFENDT
  type: date
  label: Safety Collection Window End
  derivation:
    case:
    - when: AESER = 'Y' AND (ADSL.NXTTRDT IS NULL OR ADSL.NXTTRDT > _FU90)
      then: _FU90
    - otherwise: _FU30
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: "Executable derivation in the retained yamaa specification: case:\n- then: _FU90\n  when: AESER = 'Y'\
      \ AND (ADSL.NXTTRDT IS NULL OR ADSL.NXTTRDT > _FU90)\n- otherwise: _FU30"
    core: Perm
- name: TRTEMFL
  type: str
  label: Treatment Emergent Analysis Flag
  derivation:
    case:
    - when: SAFFL = 'Y' AND ASTDT >= TRTSDT AND ASTDT <= SAFENDT
      then: '''Y'''
    - otherwise: '''N'''
  submission:
    mandatory: false
    origins:
    - type: Assigned
    method: "Executable derivation in the retained yamaa specification: case:\n- then: '''Y'''\n  when: SAFFL =\
      \ 'Y' AND ASTDT >= TRTSDT AND ASTDT <= SAFENDT\n- otherwise: '''N'''"
    length: 1
    core: Perm
- name: ANL01FL
  type: str
  label: Selected Treatment Emergent Record
  derivation:
    case:
    - when: TRTEMFL = 'Y'
      then: '''Y'''
    - otherwise: null
  submission:
    mandatory: false
    origins:
    - type: Assigned
    method: "Executable derivation in the retained yamaa specification: case:\n- then: '''Y'''\n  when: TRTEMFL\
      \ = 'Y'\n- otherwise: null"
    length: 1
    core: Perm
- name: APPRFL
  type: str
  label: Human Analysis Approval Flag
  derivation: '''N'''
  submission:
    mandatory: false
    origins:
    - type: Assigned
    method: 'Executable derivation in the retained yamaa specification: ''''''N'''''''
    length: 1
    core: Perm
- name: SRCDOM
  type: str
  label: Source Domain
  derivation: '''AE'''
  submission:
    mandatory: false
    origins:
    - type: Assigned
    method: 'Executable derivation in the retained yamaa specification: ''''''AE'''''''
    length: 8
    core: Perm
- name: SRCSEQ
  type: int
  label: Source Sequence
  derivation: AE.AESEQ
  submission:
    mandatory: false
    origins:
    - type: Derived
    method: 'Executable derivation in the retained yamaa specification: AE.AESEQ

      ...'
    length: 8
    core: Perm
submission:
  label: Adverse Event Analysis
  class: OCCURRENCE DATA STRUCTURE
  structure: One record per subject and declared keys
  repeating: true
  comment: Synthetic development output. Review findings before analysis use.
base: AE
