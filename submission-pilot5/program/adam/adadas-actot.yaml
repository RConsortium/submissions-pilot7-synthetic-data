schema_version: "1.0"
domain: ADADAS
keys: [STUDYID, USUBJID, AVISITN]
input:
  OBS: adadas-obs.parquet
base: OBS

output:
  path: adadas-actot.parquet
  columns: [STUDYID, USUBJID, PARAMCD, ANL01FL, AVISITN, QSSEQ, AVAL, ADY, ADT,
    VISIT, VISITNUM]

columns:
  - name: STUDYID
    type: str
  - name: USUBJID
    type: str
  - name: PARAMCD
    type: str
  - name: ANL01FL
    type: str
  - name: AVISITN
    type: float
  - name: QSSEQ
    type: float
  - name: AVAL
    type: float
  - name: ADY
    type: float
  - name: ADT
    type: date
  - name: VISIT
    type: str
  - name: VISITNUM
    type: float

rows:
  - id: actot
    dataset: OBS
    filter: "OBS.PARAMCD = 'ACTOT' AND OBS.ANL01FL = 'Y'"
    derivations:
      STUDYID: OBS.STUDYID
      USUBJID: OBS.USUBJID
      PARAMCD: OBS.PARAMCD
      ANL01FL: OBS.ANL01FL
      AVISITN: OBS.AVISITN
      QSSEQ: OBS.QSSEQ
      AVAL: OBS.AVAL
      ADY: OBS.ADY
      ADT: OBS.ADT
      VISIT: OBS.VISIT
      VISITNUM: OBS.VISITNUM
