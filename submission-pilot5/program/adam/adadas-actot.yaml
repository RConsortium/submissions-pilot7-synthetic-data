schema_version: "1.0"
domain: ADADAS
keys: [STUDYID, USUBJID, AVISITN]
input:
  OBS: adadas-obs.parquet
base: OBS
filter: "OBS.PARAMCD = 'ACTOT' AND OBS.ANL01FL = 'Y'"

output:
  path: adadas-actot.parquet
  columns: [STUDYID, USUBJID, PARAMCD, ANL01FL, AVISITN, QSSEQ, AVAL, ADY, ADT,
    VISIT, VISITNUM]

columns:
  - name: STUDYID
    type: str
    derivation: OBS.STUDYID
  - name: USUBJID
    type: str
    derivation: OBS.USUBJID
  - name: PARAMCD
    type: str
    derivation: OBS.PARAMCD
  - name: ANL01FL
    type: str
    derivation: OBS.ANL01FL
  - name: AVISITN
    type: float
    derivation: OBS.AVISITN
  - name: QSSEQ
    type: float
    derivation: OBS.QSSEQ
  - name: AVAL
    type: float
    derivation: OBS.AVAL
  - name: ADY
    type: float
    derivation: OBS.ADY
  - name: ADT
    type: date
    derivation: OBS.ADT
  - name: VISIT
    type: str
    derivation: OBS.VISIT
  - name: VISITNUM
    type: float
    derivation: OBS.VISITNUM
