schema_version: "1.0"
domain: ADADAS
keys: [STUDYID, USUBJID, PARAMCD, AVISITN, QSSEQ]
input:
  QS: sdtm/qs.parquet
  ADSL: sdtm/adsl.parquet
base: QS

output:
  path: adadas-obs.parquet
  columns: [STUDYID, SITEID, SITEGR1, USUBJID, TRTSDT, TRTEDT, TRTP, TRTPN,
    AGE, AGEGR1, AGEGR1N, RACE, RACEN, SEX, ITTFL, EFFFL, COMP24FL, AVISIT,
    AVISITN, VISIT, VISITNUM, ADY, ADT, PARAM, PARAMCD, PARAMN, AVAL,
    ABLFL, ANL01FL, AWRANGE, AWTARGET, AWTDIFF, AWLO, AWHI, AWU, QSSEQ]

columns:
  # --- ADSL carry block (#673) ---
  - name: STUDYID
    type: str
    label: Study Identifier
  - name: SITEID
    type: str
    label: Study Site Identifier
  - name: SITEGR1
    type: str
    label: Site Group 1
  - name: USUBJID
    type: str
    label: Unique Subject Identifier
  - name: TRTSDT
    type: date
    label: Date of First Exposure to Treatment
  - name: TRTEDT
    type: date
    label: Date of Last Exposure to Treatment
  - name: TRTP
    type: str
    label: Planned Treatment
  - name: TRTPN
    type: float
    label: Planned Treatment (N)
  - name: AGE
    type: float
    label: Age
  - name: AGEGR1
    type: str
    label: Age Group 1
  - name: AGEGR1N
    type: float
    label: Age Group 1 (N)
  - name: RACE
    type: str
    label: Race
  - name: RACEN
    type: float
    label: Race (N)
  - name: SEX
    type: str
    label: Sex
  - name: ITTFL
    type: str
    label: Intent-To-Treat Population Flag
  - name: EFFFL
    type: str
    label: Efficacy Population Flag
  - name: COMP24FL
    type: str
    label: Completers of Week 24 Population Flag

  # --- Analysis visits ---
  - name: AVISIT
    type: str
    label: Analysis Visit
  - name: AVISITN
    type: float
    label: Analysis Visit (N)
  - name: VISIT
    type: str
    label: Visit Name
  - name: VISITNUM
    type: float
    label: Visit Number

  # --- Dates ---
  - name: ADT
    type: date
    label: Analysis Date
  - name: ADY
    type: float
    label: Analysis Relative Day

  # --- Parameter ---
  - name: PARAM
    type: str
    label: Parameter
  - name: PARAMCD
    type: str
    label: Parameter Code
  - name: PARAMN
    type: float
    label: Parameter (N)
  - name: AVAL
    type: float
    label: Analysis Value
  - name: ABLFL
    type: str
    label: Baseline Record Flag

  # --- Window metadata (uniform from AVISIT) ---
  - name: AWRANGE
    type: str
    label: Analysis Window Valid Relative Range
  - name: AWTARGET
    type: float
    label: Analysis Window Target
  - name: AWLO
    type: float
    label: Analysis Window Low Range
  - name: AWHI
    type: float
    label: Analysis Window High Range
  - name: AWU
    type: str
    label: Analysis Window Unit
  - name: AWTDIFF
    type: float
    label: Analysis Window Difference
  - name: _DIFF
    type: float
    label: signed AWTARGET-ADY (internal)

  # --- Extreme flag ---
  - name: _RN_ANL
    type: float
    label: rank by window closeness within subject-param-visit (internal)
    derivation:
      row_number:
        window:
          group_by: [STUDYID, USUBJID, PARAMCD, AVISIT]
          order_by:
            - variable: AWTDIFF
              direction: asc
            - variable: _DIFF
              direction: asc
  - name: _WINQS
    type: float
    label: winning QSSEQ per subject-param-visit (internal)
    derivation:
      aggregate:
        filter: "_RN_ANL = 1"
        group_by: [STUDYID, USUBJID, PARAMCD, AVISIT]
        expr: "ONLY(QSSEQ)"
  - name: ANL01FL
    type: str
    label: Analysis Record Flag 01
    derivation:
      case:
        - when: "QSSEQ = _WINQS"
          then:
            literal: "Y"

  - name: QSSEQ
    type: float
    label: Sequence Number

rows:
  - id: obs
    dataset: QS
    filter: "QS.QSTESTCD IN ('ACITM01','ACITM02','ACITM03','ACITM04','ACITM05','ACITM06','ACITM07','ACITM08','ACITM09','ACITM10','ACITM11','ACITM12','ACITM13','ACITM14','ACTOT')"
    derivations:
      STUDYID: QS.STUDYID
      SITEID: ADSL.SITEID
      SITEGR1: ADSL.SITEGR1
      USUBJID: QS.USUBJID
      TRTSDT: ADSL.TRTSDT
      TRTEDT: ADSL.TRTEDT
      TRTP: ADSL.TRT01P
      TRTPN: ADSL.TRT01PN
      AGE: ADSL.AGE
      AGEGR1: ADSL.AGEGR1
      AGEGR1N: ADSL.AGEGR1N
      RACE: ADSL.RACE
      RACEN: ADSL.RACEN
      SEX: ADSL.SEX
      ITTFL: ADSL.ITTFL
      EFFFL: ADSL.EFFFL
      COMP24FL: ADSL.COMP24FL
      QSSEQ: QS.QSSEQ
      PARAMCD: QS.QSTESTCD
      ADT:
        date_impute:
          source: QS.QSDTC
          month: 1
          day: 1
          minimum_source_precision: month
          missing: null
      ADY:
        study_day:
          date: ADT
          reference: TRTSDT
      AVISIT:
        case:
          - when: "ADY <= 1"
            then:
              literal: "Baseline"
          - when: "ADY >= 2 AND ADY <= 84"
            then:
              literal: "Week 8"
          - when: "ADY >= 85 AND ADY <= 140"
            then:
              literal: "Week 16"
          - otherwise:
              literal: "Week 24"
      AVISITN:
        mapping:
          source: AVISIT
          missing: null
          dict:
            "Baseline": 0.0
            "Week 8": 8.0
            "Week 16": 16.0
            "Week 24": 24.0
      AVAL: QS.QSSTRESN
      PARAM:
        mapping:
          source: PARAMCD
          missing: null
          dict:
            "ACITM01": "Word Recall Task"
            "ACITM02": "Naming Objects And Fingers (Refer To 5 C"
            "ACITM03": "Delayed Word Recall"
            "ACITM04": "Commands"
            "ACITM05": "Constructional Praxis"
            "ACITM06": "Ideational Praxis"
            "ACITM07": "Orientation"
            "ACITM08": "Word Recognition"
            "ACITM09": "Attention/Visual Search Task"
            "ACITM10": "Maze Solution"
            "ACITM11": "Spoken Language Ability"
            "ACITM12": "Comprehension Of Spoken Language"
            "ACITM13": "Word Finding Difficulty In Spontaneous S"
            "ACITM14": "Recall Of Test Instructions"
            "ACTOT": "Adas-Cog(11) Subscore"
      PARAMN:
        mapping:
          source: PARAMCD
          missing: null
          dict:
            "ACITM01": 1.0
            "ACITM02": 2.0
            "ACITM03": 3.0
            "ACITM04": 4.0
            "ACITM05": 5.0
            "ACITM06": 6.0
            "ACITM07": 7.0
            "ACITM08": 8.0
            "ACITM09": 9.0
            "ACITM10": 10.0
            "ACITM11": 11.0
            "ACITM12": 12.0
            "ACITM13": 13.0
            "ACITM14": 14.0
            "ACTOT": 15.0
      VISIT: QS.VISIT
      VISITNUM: QS.VISITNUM
      AWRANGE:
        mapping:
          source: AVISIT
          missing: null
          dict:
            "Baseline": "<=1"
            "Week 8": "2-84"
            "Week 16": "85-140"
            "Week 24": ">140"
      AWTARGET:
        mapping:
          source: AVISIT
          missing: null
          dict:
            "Baseline": 1.0
            "Week 8": 56.0
            "Week 16": 112.0
            "Week 24": 168.0
      AWLO:
        mapping:
          source: AVISIT
          missing: null
          dict:
            "Baseline": null
            "Week 8": 2.0
            "Week 16": 85.0
            "Week 24": 141.0
      AWHI:
        mapping:
          source: AVISIT
          missing: null
          dict:
            "Baseline": 1.0
            "Week 8": 84.0
            "Week 16": 140.0
            "Week 24": null
      AWU:
        literal: "DAYS"
      AWTDIFF:
        compute:
          expr: "ABS(AWTARGET - ADY)"
      _DIFF:
        compute:
          expr: "AWTARGET - ADY"
      ABLFL:
        case:
          - when: "QS.QSBLFL = 'Y'"
            then:
              literal: "Y"
