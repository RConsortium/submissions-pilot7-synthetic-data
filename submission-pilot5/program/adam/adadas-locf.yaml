          order_by:
            - variable: SLIM.AVISITN
              direction: desc
          keep: first
          value: VISITNUM
          missing: null
      STUDYID: OBS.STUDYID
      SITEID: OBS.SITEID
      SITEGR1: OBS.SITEGR1
      USUBJID: OBS.USUBJID
      TRTSDT: OBS.TRTSDT
      TRTEDT: OBS.TRTEDT
      TRTP: OBS.TRTP
      TRTPN: OBS.TRTPN
      AGE: OBS.AGE
      AGEGR1: OBS.AGEGR1
      AGEGR1N: OBS.AGEGR1N
      RACE: OBS.RACE
      RACEN: OBS.RACEN
      SEX: OBS.SEX
      ITTFL: OBS.ITTFL
      EFFFL: OBS.EFFFL
      COMP24FL: OBS.COMP24FL
      AVISIT:
        literal: "Week 8"
      AVISITN:
        literal: 8.0
      VISIT: _SRC_VISIT
      VISITNUM: _SRC_VISITNUM
      ADY: _SRC_ADY
      ADT: _SRC_ADT
      PARAM:
        literal: "Adas-Cog(11) Subscore"
      PARAMCD:
        literal: "ACTOT"
      PARAMN:
        literal: 15.0
      AVAL: _SRC_AVAL
      ABLFL:
        literal: null
      ANL01FL:
        literal: "Y"
      DTYPE:
        literal: "LOCF"
      QSSEQ: _SRC_QSSEQ

