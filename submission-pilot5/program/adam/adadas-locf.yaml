          filter: "SLIM.PARAMCD = 'ACTOT' AND SLIM.ANL01FL = 'Y' AND SLIM.AVISITN < 8"
          order_by:
            - variable: SLIM.AVISITN
              direction: desc
          keep: first
          value: QSSEQ
          missing: null
      _SRC_AVAL:
