      OBS.RACE, OBS.RACEN, OBS.SEX, OBS.ITTFL, OBS.EFFFL, OBS.COMP24FL]
    filter: "_HIT IS NULL AND _SRC_QSSEQ IS NOT NULL"
    derivations:
      _HIT:
        lookup:
          dataset: SLIM
          key_base: [OBS.STUDYID, OBS.USUBJID]
          key: [STUDYID, USUBJID]
          filter: "SLIM.PARAMCD = 'ACTOT' AND SLIM.ANL01FL = 'Y' AND SLIM.AVISITN = 8"
