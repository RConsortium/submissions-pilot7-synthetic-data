      USUBJID: OBS.USUBJID
      TRTSDT: OBS.TRTSDT
      TRTEDT: OBS.TRTEDT
      TRTP: OBS.TRTP
      TRTPN: OBS.TRTPN
      AGE: OBS.AGE
