      AVISITN:
        literal: 16.0
      VISIT: _SRC_VISIT
      VISITNUM: _SRC_VISITNUM
      ADY: _SRC_ADY
      ADT: _SRC_ADT
      PARAM:
        literal: "Adas-Cog(11) Subscore"
      PARAMCD:
        literal: "ACTOT"
