schema_version: "1.0"
domain: ADADAS
keys: [STUDYID, USUBJID, PARAMCD, AVISITN, QSSEQ]
input:
  OBS: adadas-obs.parquet
  SLIM: adadas-actot.parquet
base: OBS

# One donor selection per LOCF visit: the latest observed ACTOT analysis
# record at or before the visit (replaces 21 inline lookups - seven per
# visit, one per carried field - that all selected this same record).
# _HIT tests whether the donor IS the visit (observed: no LOCF row);
# otherwise the donor's fields are carried forward.
intermediates:
  - id: DONOR8
    dataset: SLIM
    key_base: [OBS.STUDYID, OBS.USUBJID]
    key: [STUDYID, USUBJID]
    filter: "SLIM.PARAMCD = 'ACTOT' AND SLIM.ANL01FL = 'Y' AND SLIM.AVISITN <= 8"
    order_by:
      - variable: SLIM.AVISITN
        direction: desc
    keep: first
    missing: null
  - id: DONOR16
    dataset: SLIM
    key_base: [OBS.STUDYID, OBS.USUBJID]
    key: [STUDYID, USUBJID]
    filter: "SLIM.PARAMCD = 'ACTOT' AND SLIM.ANL01FL = 'Y' AND SLIM.AVISITN <= 16"
    order_by:
      - variable: SLIM.AVISITN
        direction: desc
    keep: first
    missing: null
  - id: DONOR24
    dataset: SLIM
    key_base: [OBS.STUDYID, OBS.USUBJID]
    key: [STUDYID, USUBJID]
    filter: "SLIM.PARAMCD = 'ACTOT' AND SLIM.ANL01FL = 'Y' AND SLIM.AVISITN <= 24"
    order_by:
      - variable: SLIM.AVISITN
        direction: desc
    keep: first
    missing: null

output:
  path: adadas-out.parquet
  columns: [STUDYID, SITEID, SITEGR1, USUBJID, TRTSDT, TRTEDT, TRTP, TRTPN,
    AGE, AGEGR1, AGEGR1N, RACE, RACEN, SEX, ITTFL, EFFFL, COMP24FL, AVISIT,
    AVISITN, VISIT, VISITNUM, ADY, ADT, PARAM, PARAMCD, PARAMN, AVAL,
    BASE, CHG, PCHG, ABLFL, ANL01FL, DTYPE, AWRANGE, AWTARGET, AWTDIFF,
    AWLO, AWHI, AWU, QSSEQ]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: OBS.STUDYID
  - name: SITEID
    type: str
    label: Study Site Identifier
    derivation: OBS.SITEID
  - name: SITEGR1
    type: str
    label: Site Group 1
    derivation: OBS.SITEGR1
  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: OBS.USUBJID
  - name: TRTSDT
    type: date
    label: Date of First Exposure to Treatment
    derivation: OBS.TRTSDT
  - name: TRTEDT
    type: date
    label: Date of Last Exposure to Treatment
    derivation: OBS.TRTEDT
  - name: TRTP
    type: str
    label: Planned Treatment
    derivation: OBS.TRTP
  - name: TRTPN
    type: float
    label: Planned Treatment (N)
    derivation: OBS.TRTPN
  - name: AGE
    type: float
    label: Age
    derivation: OBS.AGE
  - name: AGEGR1
    type: str
    label: Age Group 1
    derivation: OBS.AGEGR1
  - name: AGEGR1N
    type: float
    label: Age Group 1 (N)
    derivation: OBS.AGEGR1N
  - name: RACE
    type: str
    label: Race
    derivation: OBS.RACE
  - name: RACEN
    type: float
    label: Race (N)
    derivation: OBS.RACEN
  - name: SEX
    type: str
    label: Sex
    derivation: OBS.SEX
  - name: ITTFL
    type: str
    label: Intent-To-Treat Population Flag
    derivation: OBS.ITTFL
  - name: EFFFL
    type: str
    label: Efficacy Population Flag
    derivation: OBS.EFFFL
  - name: COMP24FL
    type: str
    label: Completers of Week 24 Population Flag
    derivation: OBS.COMP24FL
  - name: AVISIT
    type: str
    label: Analysis Visit
  - name: AVISITN
    type: float
    label: Analysis Visit (N)
  - name: VISIT
    type: str
    label: Visit Name
  - name: VISITNUM
    type: float
    label: Visit Number
  - name: ADY
    type: float
    label: Analysis Relative Day
  - name: ADT
    type: date
    label: Analysis Date
  - name: PARAM
    type: str
    label: Parameter
  - name: PARAMCD
    type: str
    label: Parameter Code
  - name: PARAMN
    type: float
    label: Parameter (N)
  - name: AVAL
    type: float
    label: Analysis Value
  - name: ABLFL
    type: str
    label: Baseline Record Flag
  - name: _HIT
    type: float
    label: QSSEQ of an observed ANL01FL record at the LOCF visit, if any (internal)
  - name: _SRC_QSSEQ
    type: float
    label: carried QSSEQ (internal)
  - name: _SRC_AVAL
    type: float
    label: carried AVAL (internal)
  - name: _SRC_ADY
    type: float
    label: carried ADY (internal)
  - name: _SRC_ADT
    type: date
    label: carried ADT (internal)
  - name: _SRC_VISIT
    type: str
    label: carried VISIT (internal)
  - name: _SRC_VISITNUM
    type: float
    label: carried VISITNUM (internal)
  - name: ANL01FL
    type: str
    label: Analysis Record Flag 01
  - name: DTYPE
    type: str
    label: Derivation Type
  - name: QSSEQ
    type: float
    label: Sequence Number

  # --- Window metadata: uniform from AVISIT, so LOCF rows re-derive it ---
  - name: AWRANGE
    type: str
    label: Analysis Window Valid Relative Range
    derivation:
      mapping:
        source: AVISIT
        missing: null
        dict:
          "Baseline": "<=1"
          "Week 8": "2-84"
          "Week 16": "85-140"
          "Week 24": ">140"
  - name: AWTARGET
    type: float
    label: Analysis Window Target
    derivation:
      mapping:
        source: AVISIT
        missing: null
        dict:
          "Baseline": 1.0
          "Week 8": 56.0
          "Week 16": 112.0
          "Week 24": 168.0
  - name: AWLO
    type: float
    label: Analysis Window Low Range
    derivation:
      mapping:
        source: AVISIT
        missing: null
        dict:
          "Week 8": 2.0
          "Week 16": 85.0
          "Week 24": 141.0
  - name: AWHI
    type: float
    label: Analysis Window High Range
    derivation:
      mapping:
        source: AVISIT
        missing: null
        dict:
          "Baseline": 1.0
          "Week 8": 84.0
          "Week 16": 140.0
  - name: AWU
    type: str
    label: Analysis Window Unit
    derivation:
      literal: "DAYS"
  - name: AWTDIFF
    type: float
    label: Analysis Window Difference
    derivation:
      compute:
        expr: "ABS(AWTARGET - ADY)"

  # --- Baseline / change: uniform over observed + LOCF rows ---
  - name: BASE
    type: float
    label: Baseline Value
    derivation:
      aggregate:
        filter: "ABLFL = 'Y'"
        group_by: [STUDYID, USUBJID, PARAMCD]
        expr: "ONLY(AVAL)"
  - name: CHG
    type: float
    label: Change from Baseline
    derivation:
      case:
        - when: "ABLFL IS NULL"
          then:
            compute:
              expr: "AVAL - BASE"
  - name: PCHG
    type: float
    label: Percent Change from Baseline
    derivation:
      case:
        # admiral returns NA when the baseline denominator is zero; the
        # engine raises division_by_zero instead, so guard it explicitly.
        - when: "ABLFL IS NULL AND BASE <> 0"
          then:
            compute:
              expr: "100 * (AVAL - BASE) / BASE"

rows:
  - id: base
    dataset: OBS
    derivations:
      AVISIT: OBS.AVISIT
      AVISITN: OBS.AVISITN
      VISIT: OBS.VISIT
      VISITNUM: OBS.VISITNUM
      ADY: OBS.ADY
      ADT: OBS.ADT
      PARAM: OBS.PARAM
      PARAMCD: OBS.PARAMCD
      PARAMN: OBS.PARAMN
      AVAL: OBS.AVAL
      ABLFL: OBS.ABLFL
      ANL01FL: OBS.ANL01FL
      DTYPE:
        literal: null
      QSSEQ: OBS.QSSEQ
      _HIT:
        literal: null
      _SRC_QSSEQ:
        literal: null
      _SRC_AVAL:
        literal: null
      _SRC_ADY:
        literal: null
      _SRC_ADT:
        literal: null
      _SRC_VISIT:
        literal: null
      _SRC_VISITNUM:
        literal: null

  - id: locf8
    dataset: OBS
    group_by: [OBS.STUDYID, OBS.SITEID, OBS.SITEGR1, OBS.USUBJID, OBS.TRTSDT,
      OBS.TRTEDT, OBS.TRTP, OBS.TRTPN, OBS.AGE, OBS.AGEGR1, OBS.AGEGR1N,
      OBS.RACE, OBS.RACEN, OBS.SEX, OBS.ITTFL, OBS.EFFFL, OBS.COMP24FL]
    filter: "_HIT IS NULL AND _SRC_QSSEQ IS NOT NULL"
    derivations:
      _HIT:
        case:
          - when: "DONOR8.AVISITN = 8"
            then:
              source: DONOR8.QSSEQ
      _SRC_QSSEQ: DONOR8.QSSEQ
      _SRC_AVAL: DONOR8.AVAL
      _SRC_ADY: DONOR8.ADY
      _SRC_ADT: DONOR8.ADT
      _SRC_VISIT: DONOR8.VISIT
      _SRC_VISITNUM: DONOR8.VISITNUM
      AVISIT:
        literal: "Week 8"
      AVISITN:
        literal: 8.0
      VISIT: _SRC_VISIT
      VISITNUM: _SRC_VISITNUM
      ADY: _SRC_ADY
      ADT: _SRC_ADT
      PARAM:
        literal: "Adas-Cog(11) Subscore"
      PARAMCD:
        literal: "ACTOT"
      PARAMN:
        literal: 15.0
      AVAL: _SRC_AVAL
      ABLFL:
        literal: null
      ANL01FL:
        literal: "Y"
      DTYPE:
        literal: "LOCF"
      QSSEQ: _SRC_QSSEQ

  - id: locf16
    dataset: OBS
    group_by: [OBS.STUDYID, OBS.SITEID, OBS.SITEGR1, OBS.USUBJID, OBS.TRTSDT,
      OBS.TRTEDT, OBS.TRTP, OBS.TRTPN, OBS.AGE, OBS.AGEGR1, OBS.AGEGR1N,
      OBS.RACE, OBS.RACEN, OBS.SEX, OBS.ITTFL, OBS.EFFFL, OBS.COMP24FL]
    filter: "_HIT IS NULL AND _SRC_QSSEQ IS NOT NULL"
    derivations:
      _HIT:
        case:
          - when: "DONOR16.AVISITN = 16"
            then:
              source: DONOR16.QSSEQ
      _SRC_QSSEQ: DONOR16.QSSEQ
      _SRC_AVAL: DONOR16.AVAL
      _SRC_ADY: DONOR16.ADY
      _SRC_ADT: DONOR16.ADT
      _SRC_VISIT: DONOR16.VISIT
      _SRC_VISITNUM: DONOR16.VISITNUM
      AVISIT:
        literal: "Week 16"
      AVISITN:
        literal: 16.0
      VISIT: _SRC_VISIT
      VISITNUM: _SRC_VISITNUM
      ADY: _SRC_ADY
      ADT: _SRC_ADT
      PARAM:
        literal: "Adas-Cog(11) Subscore"
      PARAMCD:
        literal: "ACTOT"
      PARAMN:
        literal: 15.0
      AVAL: _SRC_AVAL
      ABLFL:
        literal: null
      ANL01FL:
        literal: "Y"
      DTYPE:
        literal: "LOCF"
      QSSEQ: _SRC_QSSEQ

  - id: locf24
    dataset: OBS
    group_by: [OBS.STUDYID, OBS.SITEID, OBS.SITEGR1, OBS.USUBJID, OBS.TRTSDT,
      OBS.TRTEDT, OBS.TRTP, OBS.TRTPN, OBS.AGE, OBS.AGEGR1, OBS.AGEGR1N,
      OBS.RACE, OBS.RACEN, OBS.SEX, OBS.ITTFL, OBS.EFFFL, OBS.COMP24FL]
    filter: "_HIT IS NULL AND _SRC_QSSEQ IS NOT NULL"
    derivations:
      _HIT:
        case:
          - when: "DONOR24.AVISITN = 24"
            then:
              source: DONOR24.QSSEQ
      _SRC_QSSEQ: DONOR24.QSSEQ
      _SRC_AVAL: DONOR24.AVAL
      _SRC_ADY: DONOR24.ADY
      _SRC_ADT: DONOR24.ADT
      _SRC_VISIT: DONOR24.VISIT
      _SRC_VISITNUM: DONOR24.VISITNUM
      AVISIT:
        literal: "Week 24"
      AVISITN:
        literal: 24.0
      VISIT: _SRC_VISIT
      VISITNUM: _SRC_VISITNUM
      ADY: _SRC_ADY
      ADT: _SRC_ADT
      PARAM:
        literal: "Adas-Cog(11) Subscore"
      PARAMCD:
        literal: "ACTOT"
      PARAMN:
        literal: 15.0
      AVAL: _SRC_AVAL
      ABLFL:
        literal: null
      ANL01FL:
        literal: "Y"
      DTYPE:
        literal: "LOCF"
      QSSEQ: _SRC_QSSEQ
