      AGEGR1N: OBS.AGEGR1N
      RACE: OBS.RACE
      RACEN: OBS.RACEN
      SEX: OBS.SEX
      ITTFL: OBS.ITTFL
      EFFFL: OBS.EFFFL
      COMP24FL: OBS.COMP24FL
      AVISIT:
