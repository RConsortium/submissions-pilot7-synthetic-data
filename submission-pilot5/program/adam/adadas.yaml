schema_version: "1.0"
domain: ADADAS
keys: [STUDYID, USUBJID, PARAMCD, AVISITN, QSSEQ]
input:
  QS: sdtm/qs.parquet
  ADSL: sdtm/adsl.parquet
base: QS

# LOCF donors read this spec's own observed rows (SELF): the latest
# observed ACTOT analysis record at or before each visit. ANL01FL is a
# row-phase flag (exactly one 'Y' per subject/visit), so the filter plus
# AVISITN desc selects that visit's analysis record directly. A locf row
# emitted by an earlier template may enter the pool, but it only ever
# carries the observed donor's values forward, and an observed record at
# the visit itself always outranks it, so _HIT stays exact.
intermediates:
  - id: DONOR8
    dataset: SELF
    key: [STUDYID, USUBJID]
    key_base: [QS.STUDYID, QS.USUBJID]
    filter: "PARAMCD = 'ACTOT' AND ANL01FL = 'Y' AND AVISITN <= 8"
    order_by:
      - variable: AVISITN
        direction: desc
    keep: first
    missing: null
    columns: [QSSEQ, AVAL, ADY, ADT, VISIT, VISITNUM, AVISITN]
  - id: DONOR16
    dataset: SELF
    key: [STUDYID, USUBJID]
    key_base: [QS.STUDYID, QS.USUBJID]
    filter: "PARAMCD = 'ACTOT' AND ANL01FL = 'Y' AND AVISITN <= 16"
    order_by:
      - variable: AVISITN
        direction: desc
    keep: first
    missing: null
    columns: [QSSEQ, AVAL, ADY, ADT, VISIT, VISITNUM, AVISITN]
  - id: DONOR24
    dataset: SELF
    key: [STUDYID, USUBJID]
    key_base: [QS.STUDYID, QS.USUBJID]
    filter: "PARAMCD = 'ACTOT' AND ANL01FL = 'Y' AND AVISITN <= 24"
    order_by:
      - variable: AVISITN
        direction: desc
    keep: first
    missing: null
    columns: [QSSEQ, AVAL, ADY, ADT, VISIT, VISITNUM, AVISITN]

output:
  path: adadas-out.parquet
  columns: [STUDYID, SITEID, SITEGR1, USUBJID, TRTSDT, TRTEDT, TRTP, TRTPN,
    AGE, AGEGR1, AGEGR1N, RACE, RACEN, SEX, ITTFL, EFFFL, COMP24FL, AVISIT,
    AVISITN, VISIT, VISITNUM, ADY, ADT, PARAM, PARAMCD, PARAMN, AVAL,
    BASE, CHG, PCHG, ABLFL, ANL01FL, DTYPE, AWRANGE, AWTARGET, AWTDIFF,
    AWLO, AWHI, AWU, QSSEQ]

columns:
  # --- Subject / record fields: template-derived in every template, so
  # the SELF donors above can read them from completed observed rows ---
  - name: STUDYID
    type: str
    label: Study Identifier
  - name: SITEID
    type: str
    label: Study Site Identifier
  - name: SITEGR1
    type: str
    label: Site Group 1
  - name: USUBJID
    type: str
    label: Unique Subject Identifier
  - name: TRTSDT
    type: date
    label: Date of First Exposure to Treatment
  - name: TRTEDT
    type: date
    label: Date of Last Exposure to Treatment
  - name: TRTP
    type: str
    label: Planned Treatment
  - name: TRTPN
    type: float
    label: Planned Treatment (N)
  - name: AGE
    type: float
    label: Age
  - name: AGEGR1
    type: str
    label: Age Group 1
  - name: AGEGR1N
    type: float
    label: Age Group 1 (N)
  - name: RACE
    type: str
    label: Race
  - name: RACEN
    type: float
    label: Race (N)
  - name: SEX
    type: str
    label: Sex
  - name: ITTFL
    type: str
    label: Intent-To-Treat Population Flag
  - name: EFFFL
    type: str
    label: Efficacy Population Flag
  - name: COMP24FL
    type: str
    label: Completers of Week 24 Population Flag
  - name: AVISIT
    type: str
    label: Analysis Visit
  - name: AVISITN
    type: float
    label: Analysis Visit (N)
  - name: VISIT
    type: str
    label: Visit Name
  - name: VISITNUM
    type: float
    label: Visit Number
  - name: ADY
    type: float
    label: Analysis Relative Day
  - name: ADT
    type: date
    label: Analysis Date
  - name: PARAM
    type: str
    label: Parameter
  - name: PARAMCD
    type: str
    label: Parameter Code
  - name: PARAMN
    type: float
    label: Parameter (N)
  - name: AVAL
    type: float
    label: Analysis Value
  - name: ABLFL
    type: str
    label: Baseline Record Flag
  - name: ANL01FL
    type: str
    label: Analysis Record Flag 01
  - name: DTYPE
    type: str
    label: Derivation Type
  - name: AWTARGET
    type: float
    label: Analysis Window Target
  - name: AWTDIFF
    type: float
    label: Analysis Window Difference
  - name: _DIFF
    type: float
    label: signed AWTARGET-ADY (internal)
  - name: _RN_ANL
    type: float
    label: rank by window closeness within subject-param-visit (internal)
  - name: _HIT
    type: float
    label: QSSEQ of an observed ANL01FL record at the LOCF visit, if any (internal)
  - name: _SRC_QSSEQ
    type: float
    label: carried QSSEQ (internal)
  - name: _SRC_AVAL
    type: float
    label: carried AVAL (internal)
  - name: _SRC_ADY
    type: float
    label: carried ADY (internal)
  - name: _SRC_ADT
    type: date
    label: carried ADT (internal)
  - name: _SRC_VISIT
    type: str
    label: carried VISIT (internal)
  - name: _SRC_VISITNUM
    type: float
    label: carried VISITNUM (internal)
  - name: QSSEQ
    type: float
    label: Sequence Number

  # --- Window metadata: uniform from AVISIT ---
  - name: AWRANGE
    type: str
    label: Analysis Window Valid Relative Range
    derivation:
      mapping:
        source: AVISIT
        missing: null
        dict:
          "Baseline": "<=1"
          "Week 8": "2-84"
          "Week 16": "85-140"
          "Week 24": ">140"
  - name: AWLO
    type: float
    label: Analysis Window Low Range
    derivation:
      mapping:
        source: AVISIT
        missing: null
        dict:
          "Baseline": null
          "Week 8": 2.0
          "Week 16": 85.0
          "Week 24": 141.0
  - name: AWHI
    type: float
    label: Analysis Window High Range
    derivation:
      mapping:
        source: AVISIT
        missing: null
        dict:
          "Baseline": 1.0
          "Week 8": 84.0
          "Week 16": 140.0
          "Week 24": null
  - name: AWU
    type: str
    label: Analysis Window Unit
    derivation:
      literal: "DAYS"

  # --- Baseline / change: uniform over observed + LOCF rows ---
  - name: BASE
    type: float
    label: Baseline Value
    derivation:
      aggregate:
        filter: "ABLFL = 'Y'"
        group_by: [STUDYID, USUBJID, PARAMCD]
        expr: "ONLY(AVAL)"
  - name: CHG
    type: float
    label: Change from Baseline
    derivation:
      case:
        - when: "ABLFL IS NULL"
          then:
            compute:
              expr: "AVAL - BASE"
  - name: PCHG
    type: float
    label: Percent Change from Baseline
    derivation:
      case:
        # admiral returns NA when the baseline denominator is zero; the
        # engine raises division_by_zero instead, so guard it explicitly.
        - when: "ABLFL IS NULL AND BASE <> 0"
          then:
            compute:
              expr: "100 * (AVAL - BASE) / BASE"

rows:
  - id: obs
    dataset: QS
    filter: "QS.QSTESTCD IN ('ACITM01','ACITM02','ACITM03','ACITM04','ACITM05','ACITM06','ACITM07','ACITM08','ACITM09','ACITM10','ACITM11','ACITM12','ACITM13','ACITM14','ACTOT')"
    derivations:
      STUDYID: QS.STUDYID
      SITEID: ADSL.SITEID
      SITEGR1: ADSL.SITEGR1
      USUBJID: QS.USUBJID
      TRTSDT: ADSL.TRTSDT
      TRTEDT: ADSL.TRTEDT
      TRTP: ADSL.TRT01P
      TRTPN: ADSL.TRT01PN
      AGE: ADSL.AGE
      AGEGR1: ADSL.AGEGR1
      AGEGR1N: ADSL.AGEGR1N
      RACE: ADSL.RACE
      RACEN: ADSL.RACEN
      SEX: ADSL.SEX
      ITTFL: ADSL.ITTFL
      EFFFL: ADSL.EFFFL
      COMP24FL: ADSL.COMP24FL
      QSSEQ: QS.QSSEQ
      PARAMCD: QS.QSTESTCD
      ADT:
        date_impute:
          source: QS.QSDTC
          day: 1
          minimum_source_precision: month
          missing: null
      ADY:
        study_day:
          date: ADT
          reference: TRTSDT
      AVISIT:
        case:
          - when: "ADY <= 1"
            then:
              literal: "Baseline"
          - when: "ADY >= 2 AND ADY <= 84"
            then:
              literal: "Week 8"
          - when: "ADY >= 85 AND ADY <= 140"
            then:
              literal: "Week 16"
          - otherwise:
              literal: "Week 24"
      AVISITN:
        mapping:
          source: AVISIT
          missing: null
          dict:
            "Baseline": 0.0
            "Week 8": 8.0
            "Week 16": 16.0
            "Week 24": 24.0
      AVAL: QS.QSSTRESN
      PARAM:
        mapping:
          source: PARAMCD
          missing: null
          dict:
            "ACITM01": "Word Recall Task"
            "ACITM02": "Naming Objects And Fingers (Refer To 5 C"
            "ACITM03": "Delayed Word Recall"
            "ACITM04": "Commands"
            "ACITM05": "Constructional Praxis"
            "ACITM06": "Ideational Praxis"
            "ACITM07": "Orientation"
            "ACITM08": "Word Recognition"
            "ACITM09": "Attention/Visual Search Task"
            "ACITM10": "Maze Solution"
            "ACITM11": "Spoken Language Ability"
            "ACITM12": "Comprehension Of Spoken Language"
            "ACITM13": "Word Finding Difficulty In Spontaneous S"
            "ACITM14": "Recall Of Test Instructions"
            "ACTOT": "Adas-Cog(11) Subscore"
      PARAMN:
        mapping:
          source: PARAMCD
          missing: null
          dict:
            "ACITM01": 1.0
            "ACITM02": 2.0
            "ACITM03": 3.0
            "ACITM04": 4.0
            "ACITM05": 5.0
            "ACITM06": 6.0
            "ACITM07": 7.0
            "ACITM08": 8.0
            "ACITM09": 9.0
            "ACITM10": 10.0
            "ACITM11": 11.0
            "ACITM12": 12.0
            "ACITM13": 13.0
            "ACITM14": 14.0
            "ACTOT": 15.0
      VISIT: QS.VISIT
      VISITNUM: QS.VISITNUM
      AWTARGET:
        mapping:
          source: AVISIT
          missing: null
          dict:
            "Baseline": 1.0
            "Week 8": 56.0
            "Week 16": 112.0
            "Week 24": 168.0
      AWTDIFF:
        compute:
          expr: "ABS(AWTARGET - ADY)"
      _DIFF:
        compute:
          expr: "AWTARGET - ADY"
      _RN_ANL:
        row_number:
          window:
            group_by: [STUDYID, USUBJID, PARAMCD, AVISIT]
            order_by:
              - variable: AWTDIFF
                direction: asc
              - variable: _DIFF
                direction: asc
      ABLFL:
        case:
          - when: "QS.QSBLFL = 'Y'"
            then:
              literal: "Y"
      ANL01FL:
        case:
          - when: "_RN_ANL = 1"
            then:
              literal: "Y"
      DTYPE:
        literal: null
      _HIT:
        literal: null
      _SRC_QSSEQ:
        literal: null
      _SRC_AVAL:
        literal: null
      _SRC_ADY:
        literal: null
      _SRC_ADT:
        literal: null
      _SRC_VISIT:
        literal: null
      _SRC_VISITNUM:
        literal: null

  - id: locf8
    dataset: QS
    group_by: [QS.STUDYID, QS.USUBJID]
    filter: "_HIT IS NULL AND _SRC_QSSEQ IS NOT NULL"
    derivations:
      STUDYID: QS.STUDYID
      USUBJID: QS.USUBJID
      SITEID: ADSL.SITEID
      SITEGR1: ADSL.SITEGR1
      TRTSDT: ADSL.TRTSDT
      TRTEDT: ADSL.TRTEDT
      TRTP: ADSL.TRT01P
      TRTPN: ADSL.TRT01PN
      AGE: ADSL.AGE
      AGEGR1: ADSL.AGEGR1
      AGEGR1N: ADSL.AGEGR1N
      RACE: ADSL.RACE
      RACEN: ADSL.RACEN
      SEX: ADSL.SEX
      ITTFL: ADSL.ITTFL
      EFFFL: ADSL.EFFFL
      COMP24FL: ADSL.COMP24FL
      _HIT:
        case:
          - when: "DONOR8.AVISITN = 8"
            then:
              source: DONOR8.QSSEQ
      _SRC_QSSEQ: DONOR8.QSSEQ
      _SRC_AVAL: DONOR8.AVAL
      _SRC_ADY: DONOR8.ADY
      _SRC_ADT: DONOR8.ADT
      _SRC_VISIT: DONOR8.VISIT
      _SRC_VISITNUM: DONOR8.VISITNUM
      AVISIT:
        literal: "Week 8"
      AVISITN:
        literal: 8.0
      AWTARGET:
        literal: 56.0
      AWTDIFF:
        compute:
          expr: "ABS(AWTARGET - ADY)"
      _DIFF:
        compute:
          expr: "AWTARGET - ADY"
      _RN_ANL:
        literal: 1.0
      VISIT: _SRC_VISIT
      VISITNUM: _SRC_VISITNUM
      ADY: _SRC_ADY
      ADT: _SRC_ADT
      PARAM:
        literal: "Adas-Cog(11) Subscore"
      PARAMCD:
        literal: "ACTOT"
      PARAMN:
        literal: 15.0
      AVAL: _SRC_AVAL
      ABLFL:
        literal: null
      ANL01FL:
        literal: "Y"
      DTYPE:
        literal: "LOCF"
      QSSEQ: _SRC_QSSEQ

  - id: locf16
    dataset: QS
    group_by: [QS.STUDYID, QS.USUBJID]
    filter: "_HIT IS NULL AND _SRC_QSSEQ IS NOT NULL"
    derivations:
      STUDYID: QS.STUDYID
      USUBJID: QS.USUBJID
      SITEID: ADSL.SITEID
      SITEGR1: ADSL.SITEGR1
      TRTSDT: ADSL.TRTSDT
      TRTEDT: ADSL.TRTEDT
      TRTP: ADSL.TRT01P
      TRTPN: ADSL.TRT01PN
      AGE: ADSL.AGE
      AGEGR1: ADSL.AGEGR1
      AGEGR1N: ADSL.AGEGR1N
      RACE: ADSL.RACE
      RACEN: ADSL.RACEN
      SEX: ADSL.SEX
      ITTFL: ADSL.ITTFL
      EFFFL: ADSL.EFFFL
      COMP24FL: ADSL.COMP24FL
      _HIT:
        case:
          - when: "DONOR16.AVISITN = 16"
            then:
              source: DONOR16.QSSEQ
      _SRC_QSSEQ: DONOR16.QSSEQ
      _SRC_AVAL: DONOR16.AVAL
      _SRC_ADY: DONOR16.ADY
      _SRC_ADT: DONOR16.ADT
      _SRC_VISIT: DONOR16.VISIT
      _SRC_VISITNUM: DONOR16.VISITNUM
      AVISIT:
        literal: "Week 16"
      AVISITN:
        literal: 16.0
      AWTARGET:
        literal: 112.0
      AWTDIFF:
        compute:
          expr: "ABS(AWTARGET - ADY)"
      _DIFF:
        compute:
          expr: "AWTARGET - ADY"
      _RN_ANL:
        literal: 1.0
      VISIT: _SRC_VISIT
      VISITNUM: _SRC_VISITNUM
      ADY: _SRC_ADY
      ADT: _SRC_ADT
      PARAM:
        literal: "Adas-Cog(11) Subscore"
      PARAMCD:
        literal: "ACTOT"
      PARAMN:
        literal: 15.0
      AVAL: _SRC_AVAL
      ABLFL:
        literal: null
      ANL01FL:
        literal: "Y"
      DTYPE:
        literal: "LOCF"
      QSSEQ: _SRC_QSSEQ

  - id: locf24
    dataset: QS
    group_by: [QS.STUDYID, QS.USUBJID]
    filter: "_HIT IS NULL AND _SRC_QSSEQ IS NOT NULL"
    derivations:
      STUDYID: QS.STUDYID
      USUBJID: QS.USUBJID
      SITEID: ADSL.SITEID
      SITEGR1: ADSL.SITEGR1
      TRTSDT: ADSL.TRTSDT
      TRTEDT: ADSL.TRTEDT
      TRTP: ADSL.TRT01P
      TRTPN: ADSL.TRT01PN
      AGE: ADSL.AGE
      AGEGR1: ADSL.AGEGR1
      AGEGR1N: ADSL.AGEGR1N
      RACE: ADSL.RACE
      RACEN: ADSL.RACEN
      SEX: ADSL.SEX
      ITTFL: ADSL.ITTFL
      EFFFL: ADSL.EFFFL
      COMP24FL: ADSL.COMP24FL
      _HIT:
        case:
          - when: "DONOR24.AVISITN = 24"
            then:
              source: DONOR24.QSSEQ
      _SRC_QSSEQ: DONOR24.QSSEQ
      _SRC_AVAL: DONOR24.AVAL
      _SRC_ADY: DONOR24.ADY
      _SRC_ADT: DONOR24.ADT
      _SRC_VISIT: DONOR24.VISIT
      _SRC_VISITNUM: DONOR24.VISITNUM
      AVISIT:
        literal: "Week 24"
      AVISITN:
        literal: 24.0
      AWTARGET:
        literal: 168.0
      AWTDIFF:
        compute:
          expr: "ABS(AWTARGET - ADY)"
      _DIFF:
        compute:
          expr: "AWTARGET - ADY"
      _RN_ANL:
        literal: 1.0
      VISIT: _SRC_VISIT
      VISITNUM: _SRC_VISITNUM
      ADY: _SRC_ADY
      ADT: _SRC_ADT
      PARAM:
        literal: "Adas-Cog(11) Subscore"
      PARAMCD:
        literal: "ACTOT"
      PARAMN:
        literal: 15.0
      AVAL: _SRC_AVAL
      ABLFL:
        literal: null
      ANL01FL:
        literal: "Y"
      DTYPE:
        literal: "LOCF"
      QSSEQ: _SRC_QSSEQ
