schema_version: "1.0"
domain: ADAE
keys: [STUDYID, USUBJID, AESEQ]
input:
  AE: sdtm/ae.parquet
  ADSL: sdtm/adsl.parquet
base: AE

output:
  path: adae-dryrun.parquet
  columns: [STUDYID, SITEID, USUBJID, TRTA, TRTAN, AGE, AGEGR1, AGEGR1N,
    RACE, RACEN, SEX, SAFFL, TRTSDT, TRTEDT, ASTDT, ASTDTF, ASTDY,
    AENDT, AENDY, ADURN, ADURU, AETERM, AELLT, AELLTCD,
    AEDECOD, AEPTCD, AEHLT, AEHLTCD, AEHLGT, AEHLGTCD, AEBODSYS, AESOC,
    AESOCCD, AESEV, AESER, AESCAN, AESCONG, AESDISAB, AESDTH, AESHOSP,
    AESLIFE, AESOD, AEREL, AEACN, AEOUT, AESEQ,
    TRTEMFL, AOCCFL, AOCCSFL, AOCCPFL, AOCC02FL, AOCC03FL, AOCC04FL,
    CQ01NAM, AOCC01FL]

columns:
  # --- ADSL carry block (#729: bulk-carry rejected, specs stay self-contained) ---
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: AE.STUDYID
  - name: SITEID
    type: str
    label: Study Site Identifier
    derivation: ADSL.SITEID
  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: AE.USUBJID
  - name: TRTA
    type: str
    label: Actual Treatment
    derivation: ADSL.TRT01A
  - name: TRTAN
    type: float
    label: Actual Treatment (N)
    derivation: ADSL.TRT01AN
  - name: AGE
    type: float
    label: Age
    derivation: ADSL.AGE
  - name: AGEGR1
    type: str
    label: Age Group 1
    derivation: ADSL.AGEGR1
  - name: AGEGR1N
    type: float
    label: Age Group 1 (N)
    derivation: ADSL.AGEGR1N
  - name: RACE
    type: str
    label: Race
    derivation: ADSL.RACE
  - name: RACEN
    type: float
    label: Race (N)
    derivation: ADSL.RACEN
  - name: SEX
    type: str
    label: Sex
    derivation: ADSL.SEX
  - name: SAFFL
    type: str
    label: Safety Population Flag
    derivation: ADSL.SAFFL
  - name: TRTSDT
    type: date
    label: Date of First Exposure to Treatment
    derivation: ADSL.TRTSDT
  - name: TRTEDT
    type: date
    label: Date of Last Exposure to Treatment
    derivation: ADSL.TRTEDT

  # --- MedDRA / AE verbatim copies ---
  - name: AETERM
    type: str
    label: Reported Term for the Adverse Event
    derivation: AE.AETERM
  - name: AELLT
    type: str
    label: Lowest Level Term
    derivation: AE.AELLT
  - name: AELLTCD
    type: float
    label: Lowest Level Term Code
    derivation: AE.AELLTCD
  - name: AEDECOD
    type: str
    label: Dictionary-Derived Term
    derivation: AE.AEDECOD
  - name: AEPTCD
    type: float
    label: Preferred Term Code
    derivation: AE.AEPTCD
  - name: AEHLT
    type: str
    label: High Level Term
    derivation: AE.AEHLT
  - name: AEHLTCD
    type: float
    label: High Level Term Code
    derivation: AE.AEHLTCD
  - name: AEHLGT
    type: str
    label: High Level Group Term
    derivation: AE.AEHLGT
  - name: AEHLGTCD
    type: float
    label: High Level Group Term Code
    derivation: AE.AEHLGTCD
  - name: AEBODSYS
    type: str
    label: Body System or Organ Class
    derivation: AE.AEBODSYS
  - name: AESOC
    type: str
    label: Primary System Organ Class
    derivation: AE.AESOC
  - name: AESOCCD
    type: float
    label: Primary System Organ Class Code
    derivation: AE.AESOCCD
  - name: AESEV
    type: str
    label: Severity/Intensity
    derivation: AE.AESEV
  - name: AESER
    type: str
    label: Serious Event
    derivation: AE.AESER
  - name: AESCAN
    type: str
    label: Involves Cancer
    derivation: AE.AESCAN
  - name: AESCONG
    type: str
    label: Congenital Anomaly or Birth Defect
    derivation: AE.AESCONG
  - name: AESDISAB
    type: str
    label: Persist or Significant Disability/Incapacity
    derivation: AE.AESDISAB
  - name: AESDTH
    type: str
    label: Results in Death
    derivation: AE.AESDTH
  - name: AESHOSP
    type: str
    label: Requires or Prolongs Hospitalization
    derivation: AE.AESHOSP
  - name: AESLIFE
    type: str
    label: Is Life Threatening
    derivation: AE.AESLIFE
  - name: AESOD
    type: str
    label: Occurred with Overdose
    derivation: AE.AESOD
  - name: AEREL
    type: str
    label: Causality
    derivation: AE.AEREL
  - name: AEACN
    type: str
    label: Action Taken with Study Treatment
    derivation: AE.AEACN
  - name: AEOUT
    type: str
    label: Outcome of Adverse Event
    derivation: AE.AEOUT
  - name: AESEQ
    type: float
    label: Sequence Number
    derivation: AE.AESEQ

  # --- Dates ---
  - name: ASTDT
    type: date
    label: Analysis Start Date
    derivation:
      date_impute:
        source: AE.AESTDTC
        day: 1
        minimum_source_precision: month
        missing: null
  - name: ASTDTPR
    type: str
    label: Analysis Start Date Precision
    derivation:
      date_precision:
        source: ASTDT
        missing: null
  - name: ASTDTF
    type: str
    label: Analysis Start Date Imputation Flag
    derivation:
      case:
        - when: "ASTDT IS NOT NULL AND ASTDTPR = 'M'"
          then:
            literal: "D"
  - name: ASTDY
    type: float
    label: Analysis Start Relative Day
    derivation:
      study_day:
        date: ASTDT
        reference: TRTSDT
  - name: AENDT
    type: date
    label: Analysis End Date
    derivation:
      date_impute:
        source: AE.AEENDTC
        day: 1
        minimum_source_precision: month
        missing: null
  - name: AENDY
    type: float
    label: Analysis End Relative Day
    derivation:
      study_day:
        date: AENDT
        reference: TRTSDT
  - name: ADURN
    type: float
    label: Analysis Duration (Days)
    derivation:
      date_diff:
        start: ASTDT
        end: AENDT
        unit: day
        bounds: inclusive
  - name: ADURU
    type: str
    label: Analysis Duration Units
    derivation:
      case:
        - when: "ADURN IS NOT NULL"
          then:
            literal: "DAYS"

  # --- Flags ---
  - name: TRTEMFL
    type: str
    label: Treatment Emergent Analysis Flag
    derivation:
      case:
        - when: "ASTDT IS NOT NULL AND ASTDT >= TRTSDT"
          then:
            literal: "Y"

  - name: _DERM_MATCH
    type: str
    label: Dermatologic term match (internal)
    derivation:
      str_extract:
        source: AE.AEDECOD
        pattern: "APPLICATION|DERMATITIS|ERYTHEMA|BLISTER"
        no_match: null
  - name: _DERM_EXCL
    type: str
    label: Dermatologic exclusion match (internal)
    derivation:
      str_extract:
        source: AE.AEDECOD
        pattern: "COLD SWEAT|HYPERHIDROSIS|ALOPECIA"
        no_match: null
  - name: CQ01NAM
    type: str
    label: Customized Query 01 Name
    derivation:
      case:
        - when: "_DERM_MATCH IS NOT NULL"
          then:
            literal: "DERMATOLOGIC EVENTS"
        - when: "AEBODSYS = 'SKIN AND SUBCUTANEOUS TISSUE DISORDERS' AND _DERM_EXCL IS NULL"
          then:
            literal: "DERMATOLOGIC EVENTS"

  # --- Occurrence flags: the cohort x level grid (#730: existing approach works) ---
  - name: _AOCCSEQ
    type: float
    label: Subject occurrence sequence (internal)
    derivation:
      row_number:
        window:
          group_by: [STUDYID, USUBJID]
          order_by: [ASTDT, AESEQ]
          filter: "TRTEMFL = 'Y'"
  - name: AOCCFL
    type: str
    label: First Occurrence Within Subject Flag
    derivation:
      case:
        - when: "_AOCCSEQ = 1"
          then:
            literal: "Y"
  - name: _AOCCSSEQ
    type: float
    label: SOC occurrence sequence (internal)
    derivation:
      row_number:
        window:
          group_by: [STUDYID, USUBJID, AEBODSYS]
          order_by: [ASTDT, AESEQ]
          filter: "TRTEMFL = 'Y'"
  - name: AOCCSFL
    type: str
    label: First Occurrence of Body System Flag
    derivation:
      case:
        - when: "_AOCCSSEQ = 1"
          then:
            literal: "Y"
  - name: _AOCCPSEQ
    type: float
    label: PT occurrence sequence (internal)
    derivation:
      row_number:
        window:
          group_by: [STUDYID, USUBJID, AEBODSYS, AEDECOD]
          order_by: [ASTDT, AESEQ]
          filter: "TRTEMFL = 'Y'"
  - name: AOCCPFL
    type: str
    label: First Occurrence of Preferred Term Flag
    derivation:
      case:
        - when: "_AOCCPSEQ = 1"
          then:
            literal: "Y"
  - name: _AOCC02SEQ
    type: float
    label: Serious subject occurrence sequence (internal)
    derivation:
      row_number:
        window:
          group_by: [STUDYID, USUBJID]
          order_by: [ASTDT, AESEQ]
          filter: "TRTEMFL = 'Y' AND AESER = 'Y'"
  - name: AOCC02FL
    type: str
    label: Serious First Occurrence Within Subject Flag
    derivation:
      case:
        - when: "_AOCC02SEQ = 1"
          then:
            literal: "Y"
  - name: _AOCC03SEQ
    type: float
    label: Serious SOC occurrence sequence (internal)
    derivation:
      row_number:
        window:
          group_by: [STUDYID, USUBJID, AEBODSYS]
          order_by: [ASTDT, AESEQ]
          filter: "TRTEMFL = 'Y' AND AESER = 'Y'"
  - name: AOCC03FL
    type: str
    label: Serious First Occurrence of Body System Flag
    derivation:
      case:
        - when: "_AOCC03SEQ = 1"
          then:
            literal: "Y"
  - name: _AOCC04SEQ
    type: float
    label: Serious PT occurrence sequence (internal)
    derivation:
      row_number:
        window:
          group_by: [STUDYID, USUBJID, AEBODSYS, AEDECOD]
          order_by: [ASTDT, AESEQ]
          filter: "TRTEMFL = 'Y' AND AESER = 'Y'"
  - name: AOCC04FL
    type: str
    label: Serious First Occurrence of Preferred Term Flag
    derivation:
      case:
        - when: "_AOCC04SEQ = 1"
          then:
            literal: "Y"
  - name: _AOCC01SEQ
    type: float
    label: Dermatologic occurrence sequence (internal)
    derivation:
      row_number:
        window:
          group_by: [STUDYID, USUBJID]
          order_by: [ASTDT, AESEQ]
          filter: "TRTEMFL = 'Y' AND CQ01NAM = 'DERMATOLOGIC EVENTS'"
  - name: AOCC01FL
    type: str
    label: Dermatologic First Occurrence Flag
    derivation:
      case:
        - when: "_AOCC01SEQ = 1"
          then:
            literal: "Y"
