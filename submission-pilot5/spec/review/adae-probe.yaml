yamaa: '1.0'
type: spec
model: ADaM
domain: ADAE
keys:
- STUDYID
- USUBJID
- AESEQ
input:
  ADAE_REF:
    path: ../../data/adam/adae.parquet
    empty_string: present
  AE:
    path: ../../data/sdtm/ae.parquet
    empty_string: present
base: ADAE_REF
output:
  path: ../../../.build/verification/submission-pilot5/adae-probe.parquet
  columns:
  - STUDYID
  - USUBJID
  - AESEQ
  - ASTDT
  - ASTDTF
  - ASTDTF__PARQUET_NULL
  - ASTDY
  - AENDT
  - AENDY
  - ADURN
  - ADURU
  - ADURU__PARQUET_NULL
  - TRTEMFL
  - CQ01NAM
  - CQ01NAM__PARQUET_NULL
  - CQ01NAM__JOINED_SOC_TEXT
  - CQ01NAM__JOINED_SOC_TEXT__PARQUET_NULL
  - AOCCFL
  - AOCCFL__PARQUET_NULL
  - AOCCFL__QUESTION_MARK_TOKEN
  - AOCCFL__MISSING_LAST
  - AOCCSFL
  - AOCCSFL__PARQUET_NULL
  - AOCCSFL__QUESTION_MARK_TOKEN
  - AOCCSFL__MISSING_LAST
  - AOCCPFL
  - AOCCPFL__PARQUET_NULL
  - AOCCPFL__QUESTION_MARK_TOKEN
  - AOCCPFL__MISSING_LAST
  - AOCC02FL
  - AOCC02FL__PARQUET_NULL
  - AOCC02FL__QUESTION_MARK_TOKEN
  - AOCC02FL__MISSING_LAST
  - AOCC03FL
  - AOCC03FL__PARQUET_NULL
  - AOCC03FL__QUESTION_MARK_TOKEN
  - AOCC03FL__MISSING_LAST
  - AOCC04FL
  - AOCC04FL__PARQUET_NULL
  - AOCC04FL__QUESTION_MARK_TOKEN
  - AOCC04FL__MISSING_LAST
  - AOCC01FL
  - AOCC01FL__PARQUET_NULL
  - AOCC01FL__QUESTION_MARK_TOKEN
  - AOCC01FL__MISSING_LAST
intermediates:
- id: REF
  dataset: ADAE_REF
  key:
    STUDYID: ADAE_REF.STUDYID
    USUBJID: ADAE_REF.USUBJID
    AESEQ: ADAE_REF.AESEQ
  order_by:
  - variable: ADAE_REF.AESEQ
    nulls: last
  keep: first
  require_match: true
- id: _P1_AE
  dataset: AE
  key:
    STUDYID: ADAE_REF.STUDYID
    USUBJID: ADAE_REF.USUBJID
    AESEQ: ADAE_REF.AESEQ
  order_by:
  - variable: AE.AESEQ
    nulls: last
  keep: first
  require_match: true
columns:
- name: STUDYID
  type: str
  label: STUDYID
  derivation: ADAE_REF.STUDYID
- name: USUBJID
  type: str
  label: USUBJID
  derivation: ADAE_REF.USUBJID
- name: AESEQ
  type: float
  label: AESEQ
  derivation: ADAE_REF.AESEQ
- name: ASTDT
  type: date
  label: ASTDT
  derivation:
    impute:
      type: date
      source: _P1_AE.AESTDTC
      day: 1
      invalid: null
- name: _P1_AEST_PRECISION
  type: str
  label: _P1_AEST_PRECISION
  derivation:
    precision:
      type: date
      source: _P1_AE.AESTDTC
      invalid: null
- name: ASTDTF
  type: str
  label: ASTDTF
  derivation:
    flag:
      condition: REF.ASTDT IS NOT NULL AND _P1_AEST_PRECISION = 'month'
      true_value: D
      false_value: ''
      missing: ''
- name: ASTDTF__PARQUET_NULL
  type: str
  label: ASTDTF__PARQUET_NULL
  derivation:
    flag:
      condition: REF.ASTDT IS NOT NULL AND _P1_AEST_PRECISION = 'month'
      true_value: D
      false_value: null
      missing: null
- name: ASTDY
  type: float
  label: ASTDY
  derivation:
    study_day:
      source: REF.ASTDT
      reference: REF.TRTSDT
- name: AENDT
  type: date
  label: AENDT
  derivation:
    impute:
      type: date
      source: _P1_AE.AEENDTC
      invalid: null
- name: AENDY
  type: float
  label: AENDY
  derivation:
    study_day:
      source: REF.AENDT
      reference: REF.TRTSDT
- name: _P1_DURATION_DIFFERENCE
  type: float
  label: _P1_DURATION_DIFFERENCE
  derivation:
    diff:
      type: date
      start: REF.ASTDT
      end: REF.AENDT
      unit: day
      closed: right
- name: ADURN
  type: float
  label: ADURN
  derivation: _P1_DURATION_DIFFERENCE + 1
- name: ADURU
  type: str
  label: ADURU
  derivation:
    flag:
      condition: REF.ADURN IS NOT NULL
      true_value: DAYS
      false_value: ''
      missing: ''
- name: ADURU__PARQUET_NULL
  type: str
  label: ADURU__PARQUET_NULL
  derivation:
    flag:
      condition: REF.ADURN IS NOT NULL
      true_value: DAYS
      false_value: null
      missing: null
- name: TRTEMFL
  type: str
  label: TRTEMFL
  derivation:
    flag:
      condition: REF.ASTDT IS NOT NULL AND REF.TRTSDT IS NOT NULL AND REF.ASTDT >= REF.TRTSDT
      true_value: Y
      false_value: N
      missing: N
- name: _P2_USUBJID
  type: str
  label: _P2_USUBJID
  derivation: REF.USUBJID
- name: _P2_AEBODSYS
  type: str
  label: _P2_AEBODSYS
  derivation: REF.AEBODSYS
- name: _P2_AEDECOD
  type: str
  label: _P2_AEDECOD
  derivation: REF.AEDECOD
- name: _P2_ASTDT
  type: date
  label: _P2_ASTDT
  derivation: REF.ASTDT
- name: _P2_AESEQ
  type: float
  label: _P2_AESEQ
  derivation: REF.AESEQ
- name: _P2_TRTEMFL
  type: str
  label: _P2_TRTEMFL
  derivation: REF.TRTEMFL
- name: _P2_AESER
  type: str
  label: _P2_AESER
  derivation: REF.AESER
- name: _P2_CQ01NAM
  type: str
  label: _P2_CQ01NAM
  derivation: REF.CQ01NAM
- name: _P2_DERM_MATCH
  type: str
  label: _P2_DERM_MATCH
  derivation:
    str_extract:
      source: _P2_AEDECOD
      pattern: APPLICATION|DERMATITIS|ERYTHEMA|BLISTER
      no_match: null
- name: CQ01NAM
  type: str
  label: CQ01NAM
  derivation:
    flag:
      condition: _P2_DERM_MATCH IS NOT NULL OR (_P2_AEBODSYS = 'SKIN AND SUBC UTANEOUS TISSUE DISORDERS'
        AND (_P2_AEDECOD IS NULL OR _P2_AEDECOD NOT IN ('COLD SWEAT', 'HYPERHIDROSIS', 'ALOPECIA')))
      true_value: DERMATOLOGIC EVENTS
      false_value: ''
      missing: ''
- name: CQ01NAM__PARQUET_NULL
  type: str
  label: CQ01NAM__PARQUET_NULL
  derivation:
    flag:
      condition: _P2_DERM_MATCH IS NOT NULL OR (_P2_AEBODSYS = 'SKIN AND SUBC UTANEOUS TISSUE DISORDERS'
        AND (_P2_AEDECOD IS NULL OR _P2_AEDECOD NOT IN ('COLD SWEAT', 'HYPERHIDROSIS', 'ALOPECIA')))
      true_value: DERMATOLOGIC EVENTS
      false_value: null
      missing: null
- name: CQ01NAM__JOINED_SOC_TEXT
  type: str
  label: CQ01NAM__JOINED_SOC_TEXT
  derivation:
    flag:
      condition: _P2_DERM_MATCH IS NOT NULL OR (_P2_AEBODSYS = 'SKIN AND SUBCUTANEOUS TISSUE DISORDERS'
        AND (_P2_AEDECOD IS NULL OR _P2_AEDECOD NOT IN ('COLD SWEAT', 'HYPERHIDROSIS', 'ALOPECIA')))
      true_value: DERMATOLOGIC EVENTS
      false_value: ''
      missing: ''
- name: CQ01NAM__JOINED_SOC_TEXT__PARQUET_NULL
  type: str
  label: CQ01NAM__JOINED_SOC_TEXT__PARQUET_NULL
  derivation:
    flag:
      condition: _P2_DERM_MATCH IS NOT NULL OR (_P2_AEBODSYS = 'SKIN AND SUBCUTANEOUS TISSUE DISORDERS'
        AND (_P2_AEDECOD IS NULL OR _P2_AEDECOD NOT IN ('COLD SWEAT', 'HYPERHIDROSIS', 'ALOPECIA')))
      true_value: DERMATOLOGIC EVENTS
      false_value: null
      missing: null
- name: _P2_AOCCFL_SEQ
  type: float
  label: _P2_AOCCFL_SEQ
  derivation:
    row_number:
      window:
        group_by:
        - _P2_USUBJID
        order_by:
        - variable: _P2_ASTDT
          direction: asc
          nulls: first
        - variable: _P2_AESEQ
          direction: asc
          nulls: first
        filter: _P2_TRTEMFL = 'Y'
- name: AOCCFL
  type: str
  label: AOCCFL
  derivation:
    flag:
      condition: _P2_AOCCFL_SEQ = 1
      true_value: Y
      false_value: ''
      missing: ''
- name: AOCCFL__PARQUET_NULL
  type: str
  label: AOCCFL__PARQUET_NULL
  derivation:
    flag:
      condition: _P2_AOCCFL_SEQ = 1
      true_value: Y
      false_value: null
      missing: null
- name: AOCCFL__QUESTION_MARK_TOKEN
  type: str
  label: AOCCFL__QUESTION_MARK_TOKEN
