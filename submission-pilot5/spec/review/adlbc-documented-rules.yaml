yamaa: '1.0'
type: spec
model: ADaM
domain: ADLBC
keys:
- STUDYID
- USUBJID
- PARAMCD
- AVISIT
- LBSEQ
input:
  ADLBC_REF:
    path: ../../data/adam/adlbc.parquet
    empty_string: present
  LB:
    path: ../../data/sdtm/lb.parquet
    empty_string: present
  ADSL_REF:
    path: ../../data/adam/adsl.parquet
    empty_string: present
base: ADLBC_REF
output:
  path: ../../../.build/verification/submission-pilot5/adlbc-documented-rules.parquet
  columns:
  - STUDYID
  - USUBJID
  - PARAMCD
  - AVISIT
  - LBSEQ
  - PARAM
  - PARAM__CODELIST_SPACING
  - PARAMN
  - CHG
  - CHG__UNROUNDED
  - R2A1LO
  - R2A1LO__UNROUNDED
  - R2A1HI
  - R2A1HI__UNROUNDED
  - BR2A1LO
  - BR2A1LO__UNROUNDED
  - BR2A1LO__CURRENT_LIMIT
  - BR2A1LO__CURRENT_LIMIT_UNROUNDED
  - BR2A1HI
  - BR2A1HI__UNROUNDED
  - BR2A1HI__CURRENT_LIMIT
  - BR2A1HI__CURRENT_LIMIT_UNROUNDED
  - ANL01FL
  - ANL01FL__SUBJECT_PARAMETER
  - ALBTRVAL
  - ALBTRVAL__UNROUNDED
  - AENTMTFL
  - AVISITN
  - PARCAT1
  - ADT
intermediates:
- id: REF
  dataset: ADLBC_REF
  key:
    STUDYID: ADLBC_REF.STUDYID
    USUBJID: ADLBC_REF.USUBJID
    PARAMCD: ADLBC_REF.PARAMCD
    AVISIT: ADLBC_REF.AVISIT
    LBSEQ: ADLBC_REF.LBSEQ
  order_by:
  - variable: ADLBC_REF.LBSEQ
    nulls: last
  keep: first
- id: LBROW
  dataset: LB
  key:
    STUDYID: ADLBC_REF.STUDYID
    USUBJID: ADLBC_REF.USUBJID
    LBSEQ: ADLBC_REF.LBSEQ
  order_by:
  - variable: LB.LBSEQ
    nulls: last
  keep: first
- id: P2_ADSL
  dataset: ADSL_REF
  key:
    STUDYID: ADLBC_REF.STUDYID
    USUBJID: ADLBC_REF.USUBJID
  order_by:
  - variable: ADSL_REF.USUBJID
    nulls: last
  keep: first
columns:
- name: STUDYID
  type: str
  label: STUDYID
  derivation: ADLBC_REF.STUDYID
- name: USUBJID
  type: str
  label: USUBJID
  derivation: ADLBC_REF.USUBJID
- name: PARAMCD
  type: str
  label: PARAMCD
  derivation: ADLBC_REF.PARAMCD
- name: AVISIT
  type: str
  label: AVISIT
  derivation: ADLBC_REF.AVISIT
- name: LBSEQ
  type: float
  label: LBSEQ
  derivation: ADLBC_REF.LBSEQ
- name: _ABLFL_REF
  type: str
  label: ' ABLFL REF'
  derivation: REF.ABLFL
- name: PARAM
  type: str
  label: PARAM
  derivation:
    str_template: '{LBROW.LBTEST}({LBROW.LBSTRESU})'
- name: PARAM__CODELIST_SPACING
  type: str
  label: PARAM  CODELIST SPACING
  derivation:
    str_template: '{LBROW.LBTEST} ({LBROW.LBSTRESU})'
- name: PARAMN
  type: float
  label: PARAMN
  derivation:
    mapping:
      source: REF.PARAM
      dict:
        Sodium (mmol/L): 18
        Potassium (mmol/L): 19
        Chloride (mmol/L): 20
        Bilirubin (umol/L): 21
        Alkaline Phosphatase (U/L): 22
        Gamma Glutamyl Transferase (U/L): 23
        Alanine Aminotransferase (U/L): 24
        Aspartate Aminotransferase (U/L): 25
        Blood Urea Nitrogen (mmol/L): 26
        Creatinine (umol/L): 27
        Urate (umol/L): 28
        Phosphate (mmol/L): 29
        Calcium (mmol/L): 30
        Glucose (mmol/L): 31
        Protein (g/L): 32
        Albumin (g/L): 33
        Cholesterol (mmol/L): 34
        Creatine Kinase (U/L): 35
        Sodium (mmol/L) change from previous visit, relative to normal range: 118
        Potassium (mmol/L) change from previous visit, relative to normal range: 119
        Chloride (mmol/L) change from previous visit, relative to normal range: 120
        Bilirubin (umol/L) change from previous visit, relative to normal range: 121
        Alkaline Phosphatase (U/L) change from previous visit, relative to normal range: 122
        Gamma Glutamyl Transferase (U/L) change from previous visit, relative to normal range: 123
        Alanine Aminotransferase (U/L) change from previous visit, relative to normal range: 124
        Aspartate Aminotransferase (U/L) change from previous visit, relative to normal range: 125
        Blood Urea Nitrogen (mmol/L) change from previous visit, relative to normal range: 126
        Creatinine (umol/L) change from previous visit, relative to normal range: 127
        Urate (umol/L) change from previous visit, relative to normal range: 128
        Phosphate (mmol/L) change from previous visit, relative to normal range: 129
        Calcium (mmol/L) change from previous visit, relative to normal range: 130
        Glucose (mmol/L) change from previous visit, relative to normal range: 131
        Protein (g/L) change from previous visit, relative to normal range: 132
        Albumin (g/L) change from previous visit, relative to normal range: 133
        Cholesterol (mmol/L) change from previous visit, relative to normal range: 134
        Creatine Kinase (U/L) change from previous visit, relative to normal range: 135
- name: _CHG_RAW
  type: float
  label: ' CHG RAW'
  derivation: REF.AVAL - REF.BASE
- name: CHG
  type: float
  label: CHG
  derivation:
    round_half_away_from_zero:
      source: _CHG_RAW
      digits: 5
- name: CHG__UNROUNDED
  type: float
  label: CHG  UNROUNDED
  derivation: REF.AVAL - REF.BASE
- name: _R2A1LO_RAW
  type: float
  label: ' R2A1LO RAW'
  derivation: REF.AVAL / REF.A1LO
- name: R2A1LO
  type: float
  label: R2A1LO
  derivation:
    round_half_away_from_zero:
      source: _R2A1LO_RAW
      digits: 1
- name: R2A1LO__UNROUNDED
  type: float
  label: R2A1LO  UNROUNDED
  derivation: REF.AVAL / REF.A1LO
- name: _R2A1HI_RAW
  type: float
  label: ' R2A1HI RAW'
  derivation: REF.AVAL / REF.A1HI
- name: R2A1HI
  type: float
  label: R2A1HI
  derivation:
    round_half_away_from_zero:
      source: _R2A1HI_RAW
      digits: 1
- name: R2A1HI__UNROUNDED
  type: float
  label: R2A1HI  UNROUNDED
  derivation: REF.AVAL / REF.A1HI
- name: _BASE_A1LO_RATIO
  type: float
  label: ' BASE A1LO RATIO'
  derivation: REF.AVAL / REF.A1LO
- name: _BR2A1LO_BASELINE
  type: float
  label: ' BR2A1LO BASELINE'
  derivation:
    aggregate:
      filter: _ABLFL_REF = 'Y'
      group_by:
      - STUDYID
      - USUBJID
      - PARAMCD
      expr: ONLY(_BASE_A1LO_RATIO)
- name: BR2A1LO
  type: float
  label: BR2A1LO
  derivation:
    round_half_away_from_zero:
      source: _BR2A1LO_BASELINE
      digits: 1
- name: BR2A1LO__UNROUNDED
  type: float
  label: BR2A1LO  UNROUNDED
  derivation: _BR2A1LO_BASELINE
- name: _BR2A1LO_CURRENT
  type: float
  label: ' BR2A1LO CURRENT'
  derivation: REF.BASE / REF.A1LO
- name: BR2A1LO__CURRENT_LIMIT
  type: float
  label: BR2A1LO  CURRENT LIMIT
  derivation:
    round_half_away_from_zero:
      source: _BR2A1LO_CURRENT
      digits: 1
- name: BR2A1LO__CURRENT_LIMIT_UNROUNDED
  type: float
  label: BR2A1LO  CURRENT LIMIT UNROUNDED
  derivation: REF.BASE / REF.A1LO
- name: _BASE_A1HI_RATIO
  type: float
  label: ' BASE A1HI RATIO'
  derivation: REF.AVAL / REF.A1HI
- name: _BR2A1HI_BASELINE
  type: float
  label: ' BR2A1HI BASELINE'
  derivation:
    aggregate:
      filter: _ABLFL_REF = 'Y'
      group_by:
      - STUDYID
      - USUBJID
      - PARAMCD
      expr: ONLY(_BASE_A1HI_RATIO)
- name: BR2A1HI
  type: float
  label: BR2A1HI
  derivation:
    round_half_away_from_zero:
      source: _BR2A1HI_BASELINE
      digits: 1
- name: BR2A1HI__UNROUNDED
  type: float
  label: BR2A1HI  UNROUNDED
  derivation: _BR2A1HI_BASELINE
- name: _BR2A1HI_CURRENT
  type: float
  label: ' BR2A1HI CURRENT'
  derivation: REF.BASE / REF.A1HI
- name: BR2A1HI__CURRENT_LIMIT
  type: float
  label: BR2A1HI  CURRENT LIMIT
  derivation:
    round_half_away_from_zero:
      source: _BR2A1HI_CURRENT
      digits: 1
- name: BR2A1HI__CURRENT_LIMIT_UNROUNDED
  type: float
  label: BR2A1HI  CURRENT LIMIT UNROUNDED
  derivation: REF.BASE / REF.A1HI
- name: _ANL_ALBTRVAL
  type: float
  label: _ANL_ALBTRVAL
  derivation: REF.ALBTRVAL
- name: _ANL_GLOBAL_SCOPE
  type: float
  label: _ANL_GLOBAL_SCOPE
  derivation: 1
- name: _ANL_GLOBAL_MAX
  type: float
  label: _ANL_GLOBAL_MAX
  derivation:
    aggregate:
      group_by:
      - _ANL_GLOBAL_SCOPE
      expr: MAX(_ANL_ALBTRVAL)
- name: ANL01FL
  type: str
  label: ANL01FL
  derivation:
    flag:
      condition: REF.ALBTRVAL = _ANL_GLOBAL_MAX
      false_value: ''
      missing: ''
- name: _ANL_SUBJECT_PARAM_MAX
  type: float
  label: _ANL_SUBJECT_PARAM_MAX
  derivation:
    aggregate:
      group_by:
      - STUDYID
      - USUBJID
      - PARAMCD
      expr: MAX(_ANL_ALBTRVAL)
- name: ANL01FL__SUBJECT_PARAMETER
  type: str
  label: ANL01FL__SUBJECT_PARAMETER
  derivation:
    flag:
      condition: REF.ALBTRVAL = _ANL_SUBJECT_PARAM_MAX
      false_value: ''
      missing: ''
- name: _ALB_SIGNED_UPPER
  type: float
  label: _ALB_SIGNED_UPPER
  derivation: REF.LBSTRESN - 1.5 * REF.A1HI
- name: _ALB_SIGNED_LOWER
  type: float
  label: _ALB_SIGNED_LOWER
  derivation: 0.5 * REF.A1LO - REF.LBSTRESN
- name: _ALB_LITERAL_RAW
  type: float
  label: _ALB_LITERAL_RAW
  derivation:
    greatest:
      sources:
      - _ALB_SIGNED_UPPER
      - _ALB_SIGNED_LOWER
- name: ALBTRVAL
  type: float
  label: ALBTRVAL
  derivation:
    round_half_away_from_zero:
      source: _ALB_LITERAL_RAW
      digits: 3
- name: ALBTRVAL__UNROUNDED
  type: float
  label: ALBTRVAL__UNROUNDED
  derivation: _ALB_LITERAL_RAW
- name: _AENT_ADT_REF
  type: date
  label: _AENT_ADT_REF
  derivation: REF.ADT
- name: _AENT_IN_TREATMENT
  type: float
  label: _AENT_IN_TREATMENT
  derivation:
    case:
    - when: REF.ADT >= REF.TRTSDT AND REF.ADT <= REF.TRTEDT
      then: 1
    - otherwise: 0
- name: _AENT_LAST_TRTDT
  type: date
  label: _AENT_LAST_TRTDT
  derivation:
    aggregate:
      group_by:
      - STUDYID
      - USUBJID
      - PARAMCD
      filter: _AENT_IN_TREATMENT = 1
      expr: MAX(_AENT_ADT_REF)
- name: AENTMTFL
  type: str
  label: AENTMTFL
  derivation:
    flag:
      condition: REF.VISITNUM = 12 OR (P2_ADSL.DISCONFL = 'Y' AND P2_ADSL.VISNUMEN < 12 AND _AENT_IN_TREATMENT
        = 1 AND REF.ADT = _AENT_LAST_TRTDT)
      false_value: ''
      missing: ''
- name: AVISITN
  type: float
  label: Analysis Visit (N)
  derivation:
    mapping:
      source: REF.AVISIT
      unmapped: null
      dict:
        Baseline: 0.0
        Week 2: 2.0
        Week 4: 4.0
        Week 6: 6.0
        Week 8: 8.0
        Week 10: 10.0
        Week 12: 12.0
        Week 14: 14.0
        Week 16: 16.0
        Week 18: 18.0
        Week 20: 20.0
        Week 22: 22.0
        Week 24: 24.0
        Week 26: 26.0
        Weeks 4-24: 98.0
        End of Treatment: 99.0
- name: PARCAT1
  type: str
  label: Parameter Category 1
  derivation: '''CHEM'''
- name: ADT
  type: date
  label: Analysis Date
  derivation:
    to_date:
      source: LBROW.LBDTC
