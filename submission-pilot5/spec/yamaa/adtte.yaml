yamaa: "1.0"
type: spec
model: ADaM
domain: ADTTE
keys:
  - STUDYID
  - USUBJID
  - PARAMCD
input:
  ADSL:
    path: ../../data/adam/adsl-yamaa.parquet
    schema: adsl.yaml
  ADAE:
    path: ../../data/adam/adae-yamaa.parquet
    schema: adae.yaml
  DS: ../../data/sdtm/ds.parquet
base: ADSL

output:
  path: ../../data/adam/adtte-yamaa.parquet
  columns:
    - STUDYID
    - SITEID
    - USUBJID
    - AGE
    - AGEGR1
    - AGEGR1N
    - RACE
    - RACEN
    - SEX
    - TRTSDT
    - TRTEDT
    - TRTDUR
    - TRTP
    - TRTA
    - TRTAN
    - PARAM
    - PARAMCD
    - AVAL
    - STARTDT
    - ADT
    - CNSR
    - EVNTDESC
    - SRCDOM
    - SRCVAR
    - SRCSEQ
    - SAFFL

intermediates:
  # First dermatologic event per subject: the earliest ADAE record flagged as
  # the first dermatologic occurrence. `keep: first` by ASTDT makes the
  # "first" robust when a subject has several qualifying events.
  - id: DERM_EV
    dataset: ADAE
    key:
      - STUDYID
      - USUBJID
    filter: "ADAE.AOCC01FL = 'Y' AND ADAE.CQ01NAM = 'DERMATOLOGIC
      EVENTS' AND ADAE.SAFFL = 'Y'"
    order_by:
      - variable: ADAE.ASTDT
        nulls: last
    keep: first

  - id: EOSDS
    dataset: DS
    key:
      - STUDYID
      - USUBJID
    filter: "DS.DSCAT = 'DISPOSITION EVENT' AND DS.DSDECOD <> 'SCREEN
      FAILURE' AND DS.DSDECOD <> 'FINAL LAB VISIT'"
    order_by:
      - variable: DS.DSSTDTC
        nulls: last
    keep: first

columns:
  # --- Carries from ADSL ---
  - copy:
      dataset: ADSL
      columns:
        - STUDYID
        - SITEID
        - USUBJID
        - AGE
        - AGEGR1
        - AGEGR1N
        - RACE
        - RACEN
        - SEX
        - TRTSDT
        - TRTEDT

  - name: TRTDUR
    type: float
    label: Duration of treatment (days)
    derivation: ADSL.TRTDURD

  - name: TRTP
    type: str
    label: Planned Treatment
    derivation: ADSL.TRT01P

  - name: TRTA
    type: str
    label: Actual Treatment
    derivation: ADSL.TRT01A

  - name: TRTAN
    type: float
    label: Actual Treatment (N)
    derivation: ADSL.TRT01AN

  - copy:
      dataset: ADSL
      columns: [SAFFL]

  # --- Event / censor machinery (internal) ---
  - name: _EVDT
    type: date
    label: First dermatologic event date (internal)
    derivation: DERM_EV.ASTDT

  - name: _DSSTDT
    type: date
    label: End-of-study disposition date (internal)
    derivation:
      to_date:
        source: EOSDS.DSSTDTC

  - name: _EOSDT
    type: date
    label: Censor date - death uses RFENDTC, otherwise
      disposition date (internal)
    derivation:
      case:
        - when: "ADSL.DCDECOD = 'DEATH'"
          then:
            to_date:
              source: ADSL.RFENDTC
        - otherwise: _DSSTDT

  - name: _IS_EVENT
    type: float
    label: Event won over censoring - earlier date, ties go to
      the event (internal)
    derivation:
      case:
        - when: "_EVDT IS NOT NULL AND _EVDT <= _EOSDT"
          then: 1
        - otherwise: 0

  # --- Analysis dates / value ---
  - name: ADT
    type: date
    label: Analysis Date
    derivation:
      case:
        - when: "_IS_EVENT = 1"
          then: _EVDT
        - otherwise: _EOSDT

  - name: CNSR
    type: float
    label: Censor
    derivation:
      case:
        - when: "_IS_EVENT = 1"
          then: 0
        - otherwise: 1

  - name: STARTDT
    type: date
    label: Time-to-Event Origin Date for Subject
    derivation: ADSL.TRTSDT

  - name: AVAL
    type: float
    label: Analysis Value
    derivation:
      diff:
        type: date
        start: STARTDT
        end: ADT
        unit: day
        closed: both

  - name: PARAM
    type: str
    label: Parameter
    derivation: "'Time to First Dermatologic Event'"

  - name: PARAMCD
    type: str
    label: Parameter Code
    derivation: "'TTDE'"

  # --- Provenance ---
  - name: EVNTDESC
    type: str
    label: Event or Censoring Description
    derivation:
      case:
        - when: "_IS_EVENT = 1"
          then: "'Dematologic Event Occured'"
        - otherwise: "'Study Completion Date'"

  - name: SRCDOM
    type: str
    label: Source Data
    derivation:
      case:
        - when: "_IS_EVENT = 1"
          then: "'ADAE'"
        - otherwise: "'ADSL'"

  - name: SRCVAR
    type: str
    label: Source Variable
    derivation:
      case:
        - when: "_IS_EVENT = 1"
          then: "'ASTDT'"
        - otherwise: "'RFENDT'"

  - name: SRCSEQ
    type: float
    label: Source Sequence Number
    derivation:
      case:
        - when: "_IS_EVENT = 1"
          then: DERM_EV.AESEQ
