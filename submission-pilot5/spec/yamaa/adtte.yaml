yamaa: "1.0"
type: spec
model: ADaM
domain: ADTTE
keys:
  - STUDYID
  - USUBJID
  - PARAMCD
input:
  ADSL:
    path: ../../data/adam/adsl-yamaa.parquet
    schema: adsl.yaml
  ADAE:
    path: ../../data/adam/adae-yamaa.parquet
    schema: adae.yaml
  DS: ../../data/sdtm/ds.parquet
base: ADSL

output:
  path: ../../data/adam/adtte-yamaa.parquet
  columns:
    - STUDYID
    - SITEID
    - USUBJID
    - AGE
    - AGEGR1
    - AGEGR1N
    - RACE
    - RACEN
    - SEX
    - TRTSDT
    - TRTEDT
    - TRTDUR
    - TRTP
    - TRTA
    - TRTAN
    - PARAM
    - PARAMCD
    - AVAL
    - STARTDT
    - ADT
    - CNSR
    - EVNTDESC
    - SRCDOM
    - SRCVAR
    - SRCSEQ
    - SAFFL

intermediates:
  # First dermatologic event per subject: the earliest ADAE record flagged as
  # the first dermatologic occurrence. `keep: first` by ASTDT makes the
  # "first" robust when a subject has several qualifying events.
  - id: DERM_EV
    dataset: ADAE
    key:
      - STUDYID
      - USUBJID
    filter: "ADAE.AOCC01FL = 'Y' AND ADAE.CQ01NAM = 'DERMATOLOGIC EVENTS' AND ADAE.SAFFL = 'Y'"
    order_by:
      - variable: ADAE.ASTDT
        nulls: last
    keep: first

  - id: EOSDS
    dataset: DS
    key:
      - STUDYID
      - USUBJID
    filter: "DS.DSCAT = 'DISPOSITION EVENT' AND DS.DSDECOD <> 'SCREEN FAILURE' AND DS.DSDECOD <> 'FINAL LAB
      VISIT'"
    order_by:
      - variable: DS.DSSTDTC
        nulls: last
    keep: first

columns:
  # --- Carries from ADSL ---
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: ADSL.STUDYID
    submission:
      core: Cond
      mandatory: true
      origins:
        - type: Predecessor
          description: ADSL.STUDYID
      length: 12
  - name: SITEID
    type: str
    label: Study Site Identifier
    derivation: ADSL.SITEID
    submission:
      core: Cond
      mandatory: false
      origins:
        - type: Predecessor
          description: ADSL.SITEID
      length: 3
  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: ADSL.USUBJID
    submission:
      core: Cond
      mandatory: true
      origins:
        - type: Predecessor
          description: ADSL.USUBJID
      length: 11
  - name: AGE
    type: float
    label: Age
    derivation: ADSL.AGE
    submission:
      core: Cond
      mandatory: false
      origins:
        - type: Predecessor
          description: ADSL.AGE
      length: 8
      significant_digits: 0
  - name: AGEGR1
    type: str
    label: Pooled Age Group 1
    derivation: ADSL.AGEGR1
    submission:
      core: Cond
      mandatory: false
      origins:
        - type: Predecessor
          description: ADSL.AGEGR1
      length: 5
      codelist: AGEGR1
  - name: AGEGR1N
    type: float
    label: Pooled Age Group 1 (N)
    derivation: ADSL.AGEGR1N
    submission:
      core: Cond
      mandatory: false
      origins:
        - type: Predecessor
          description: ADSL.AGEGR1N
      length: 8
      codelist: AGEGR1N
      significant_digits: 0
  - name: RACE
    type: str
    label: Race
    derivation: ADSL.RACE
    submission:
      core: Cond
      mandatory: false
      origins:
        - type: Predecessor
          description: ADSL.RACE
      length: 32
      codelist: RACE
  - name: RACEN
    type: float
    label: Race (N)
    derivation: ADSL.RACEN
    submission:
      core: Cond
      mandatory: false
      origins:
        - type: Predecessor
          description: ADSL.RACEN
      length: 8
      codelist: RACEN
      significant_digits: 0
  - name: SEX
    type: str
    label: Sex
    derivation: ADSL.SEX
    submission:
      core: Cond
      mandatory: false
      origins:
        - type: Predecessor
          description: ADSL.SEX
      length: 1
      codelist: SEX
  - name: TRTSDT
    type: date
    label: Date of First Exposure to Treatment
    derivation: ADSL.TRTSDT
    submission:
      core: Cond
      mandatory: false
      origins:
        - type: Predecessor
          description: ADSL.TRTSDT
      display_format: DATE9.
  - name: TRTEDT
    type: date
    label: Date of Last Exposure to Treatment
    derivation: ADSL.TRTEDT
    submission:
      core: Cond
      mandatory: false
      origins:
        - type: Predecessor
          description: ADSL.TRTEDT
      display_format: DATE9.
  - name: TRTDUR
    type: float
    label: Duration of treatment (days)
    derivation: ADSL.TRTDURD

    submission:
      core: Cond
      mandatory: false
      origins:
        - type: Predecessor
          description: ADSL.TRTDURD
      length: 8
      significant_digits: 0
  - name: TRTP
    type: str
    label: Planned Treatment
    derivation: ADSL.TRT01P

    submission:
      core: Cond
      mandatory: false
      origins:
        - type: Predecessor
          description: ADSL.TRT01P
      length: 20
      codelist: ARM
  - name: TRTA
    type: str
    label: Actual Treatment
    derivation: ADSL.TRT01A

    submission:
      core: Cond
      mandatory: false
      origins:
        - type: Predecessor
          description: ADSL.TRT01A
      length: 20
      codelist: ARM
  - name: TRTAN
    type: float
    label: Actual Treatment (N)
    derivation: ADSL.TRT01AN

    submission:
      core: Cond
      mandatory: false
      origins:
        - type: Predecessor
          description: ADSL.TRT01AN
      length: 8
      codelist: ARMN
      significant_digits: 0
  - name: SAFFL
    type: str
    label: Safety Population Flag
    derivation: ADSL.SAFFL
    submission:
      core: Cond
      mandatory: false
      origins:
        - type: Predecessor
          description: ADSL.SAFFL
      length: 1
      codelist: YN

  # --- Event / censor machinery (internal) ---
  - name: _EVDT
    type: date
    label: First dermatologic event date (internal)
    derivation: DERM_EV.ASTDT

  - name: _DSSTDT
    type: date
    label: End-of-study disposition date (internal)
    derivation:
      to_date:
        source: EOSDS.DSSTDTC

  - name: _EOSDT
    type: date
    label: Censor date - death uses RFENDTC, otherwise disposition date (internal)
    derivation:
      case:
        - when: "ADSL.DCDECOD = 'DEATH'"
          then:
            to_date:
              source: ADSL.RFENDTC
        - otherwise: _DSSTDT

  - name: _IS_EVENT
    type: float
    label: Event won over censoring - earlier date, ties go to the event (internal)
    derivation:
      case:
        - when: "_EVDT IS NOT NULL AND _EVDT <= _EOSDT"
          then: 1
        - otherwise: 0

  # --- Analysis dates / value ---
  - name: ADT
    type: date
    label: Analysis Date
    derivation:
      case:
        - when: "_IS_EVENT = 1"
          then: _EVDT
        - otherwise: _EOSDT

    submission:
      core: Cond
      mandatory: false
      origins:
        - type: Derived
      display_format: DATE9.
      method:
        name: Algorithm to derive ADTTE.ADT
        type: Computation
        description: if ADAE.ASTDT is not missing and occurred after TRTSDT then ADAE.ASTDT else convert
          ADSL.RFENDTC to a SAS numeric date
  - name: CNSR
    type: float
    label: Censor
    derivation:
      case:
        - when: "_IS_EVENT = 1"
          then: 0
        - otherwise: 1

    submission:
      core: Cond
      mandatory: false
      origins:
        - type: Derived
      length: 8
      codelist: CENSOR
      method:
        name: Algorithm to derive ADTTE.CNSR
        type: Computation
        description: if ADAE.TRTEMFL ="Y" then CNSR=0, else CNSR=1
      significant_digits: 0
  - name: STARTDT
    type: date
    label: Time-to-Event Origin Date for Subject
    derivation: ADSL.TRTSDT

    submission:
      core: Cond
      mandatory: false
      origins:
        - type: Derived
      display_format: DATE9.
      method:
        name: Algorithm to derive ADTTE.STARTDT
        type: Computation
        description: ADSL.RFSTDTC
  - name: AVAL
    type: float
    label: Analysis Value
    derivation:
      diff:
        type: date
        start: STARTDT
        end: ADT
        unit: day
        closed: both

    submission:
      core: Cond
      mandatory: false
      origins:
        - type: Derived
      length: 8
      method:
        name: Algorithm to derive ADTTE.AVAL
        type: Computation
        description: ADT-STARTDT+1
      significant_digits: 0
  - name: PARAM
    type: str
    label: Parameter
    derivation: "'Time to First Dermatologic Event'"

    submission:
      core: Cond
      mandatory: false
      origins:
        - type: Assigned
      length: 100
      codelist: PARAM_ADTTE
      method:
        name: Algorithm to derive ADTTE.PARAM
        type: Computation
        description: PARAM="Time to First Dermatologic Event"
  - name: PARAMCD
    type: str
    label: Parameter Code
    derivation: "'TTDE'"

  # --- Provenance ---
    submission:
      core: Cond
      mandatory: true
      origins:
        - type: Assigned
      length: 8
      codelist: PARAMCD_ADTTE
      method:
        name: Algorithm to derive ADTTE.PARAMCD
        type: Computation
        description: PARAMCD="TTDE"
  - name: EVNTDESC
    type: str
    label: Event or Censoring Description
    derivation:
      case:
        - when: "_IS_EVENT = 1"
          then: "'Dematologic Event Occured'"
        - otherwise: "'Study Completion Date'"

    submission:
      core: Cond
      mandatory: false
      origins:
        - type: Derived
      length: 25
      method:
        name: Algorithm to derive ADTTE.EVNTDESC
        type: Computation
        description: if ADTTE.CNSR = 0 then "Dematologic Event Occured", else if ADTTE.CNSR =1 then
          "Study Completion Date"
  - name: SRCDOM
    type: str
    label: Source Data
    derivation:
      case:
        - when: "_IS_EVENT = 1"
          then: "'ADAE'"
        - otherwise: "'ADSL'"

    submission:
      core: Cond
      mandatory: false
      origins:
        - type: Derived
      length: 4
      method:
        name: Algorithm to derive ADTTE.SRCDOM
        type: Computation
        description: The Source domain referred to in order to populate ADT (either ADAE or ADSL)
  - name: SRCVAR
    type: str
    label: Source Variable
    derivation:
      case:
        - when: "_IS_EVENT = 1"
          then: "'ASTDT'"
        - otherwise: "'RFENDT'"

    submission:
      core: Cond
      mandatory: false
      origins:
        - type: Derived
      length: 6
      method:
        name: Algorithm to derive ADTTE.SRCVAR
        type: Computation
        description: The Source variable referred to in order to populate ADT (either ASTDT or RFENDT)
  - name: SRCSEQ
    type: float
    label: Source Sequence Number
    derivation:
      case:
        - when: "_IS_EVENT = 1"
          then: DERM_EV.AESEQ
    submission:
      core: Cond
      mandatory: false
      origins:
        - type: Derived
      length: 8
      method:
        name: Algorithm to derive ADTTE.SRCSEQ
        type: Computation
        description: The value of ADAE.AESEQ if SRCDOM=ADAE, otherwise null.
      significant_digits: 0
submission:
  label: AE Time To 1st Derm. Event Analysis
  class: BASIC DATA STRUCTURE
  structure: one record per subject per parameter
  repeating: true
  reference_data: false
