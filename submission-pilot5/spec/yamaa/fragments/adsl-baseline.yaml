# Reproduce the submitted baseline rules, including package-specific
# conventions.
yamaa: "1.0"
type: spec
model: ADaM

columns:
  - name: HEIGHTBL
    type: float
    label: Baseline Height (cm)
    derivation:
      round_half_away_from_zero:
        source: BASE_HT.VSSTRESN
        digits: 1

  - name: WEIGHTBL
    type: float
    label: Baseline Weight (kg)
    derivation:
      round_half_away_from_zero:
        source: BASE_WT.VSSTRESN
        digits: 1

  - name: _BMIBL_RAW
    type: float
    label: Unrounded baseline BMI (internal)
    derivation: "WEIGHTBL / POWER(NULLIF(HEIGHTBL, 0) / 100, 2)"

  - name: BMIBL
    type: float
    label: Baseline BMI (kg/m^2)
    derivation:
      round_half_away_from_zero:
        source: _BMIBL_RAW
        digits: 1

  - name: BMIBLGR1
    type: str
    label: Pooled Baseline BMI Group 1
    derivation:
      cut:
        source: BMIBL
        breaks:
          - 25
          - 30
        labels:
          - "<25"
          - "25-<30"
          - ">=30"
        missing: ''

  - name: EDUCLVL
    type: float
    label: Years of Education
    derivation: SC_EDU.SCSTRESN

  - name: DISONSDT
    type: date
    label: Date of Onset of Disease
    derivation:
      impute:
        type: date
        source: MH_DX.MHSTDTC
        month: 6
        day: 15

  - name: VISIT1DT
    type: date
    label: Date of Visit 1
    derivation:
      impute:
        type: date
        source: SV_V1.SVSTDTC
        month: 1
        day: 1

  - name: _DURDIS_DAYS
    type: float
    label: Disease duration days (internal)
    derivation:
      diff:
        type: date
        start: DISONSDT
        end: VISIT1DT
        unit: day
        closed: both

  - name: _DURDIS_MONTHS
    type: float
    label: Disease duration months (internal)
    derivation: "_DURDIS_DAYS * 12 / 365.25"

  - name: DURDIS
    type: float
    label: Duration of Disease (Months)
    derivation:
      round_half_away_from_zero:
        source: _DURDIS_MONTHS
        digits: 1

  - name: DURDSGR1
    type: str
    label: Pooled Disease Duration Group 1
    derivation:
      case:
        - when: "DURDIS < 12"
          then: "'<12'"
        - otherwise: "'>=12'"

  - name: MMSETOT
    type: float
    label: MMSE Total
    derivation:
      aggregate:
        expr: "SUM(QS.QSSTRESN)"
        filter: "QS.VISITNUM = 1 AND QS.QSTESTCD LIKE 'MMITM%'"
