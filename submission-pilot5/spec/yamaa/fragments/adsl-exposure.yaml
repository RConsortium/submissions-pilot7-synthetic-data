# Reproduce the submitted exposure rules, including package-specific
# conventions.
yamaa: "1.0"
type: spec
model: ADaM

columns:
  - name: EX_MINDTC
    type: str
    label: Earliest Exposure Start (character)
    derivation:
      aggregate: "MIN(EX.EXSTDTC)"

  - name: TRTSDT
    type: date
    label: Date of First Exposure to Treatment
    derivation:
      impute:
        type: date
        source: EX_MINDTC
        month: 1
        day: 1

  - name: EOSDT
    type: date
    label: End of Study Date
    derivation:
      to_date:
        source: EOS.DSSTDTC

  - name: EX_MAXDTC
    type: str
    label: Latest exposure end (character, internal)
    derivation:
      aggregate:
        filter: "EX.EXDOSE > 0 OR (EX.EXDOSE = 0 AND EX.EXTRT
          = 'PLACEBO')"
        expr: "MAX(EX.EXENDTC)"

  - name: EX_ENDHI
    type: date
    label: Latest highest-imputed exposure end (internal)
    derivation:
      # All EXENDTC values are complete ISO dates, so highest imputation
      # is identity and MAX over text equals MAX over dates.
      to_date:
        source: EX_MAXDTC

  - name: EX_NMISSEND
    type: float
    label: Exposure records with missing end date (internal)
    derivation:
      aggregate:
        filter: >-
          EX.EXENDTC IS NULL AND (EX.EXDOSE > 0 OR (EX.EXDOSE
          = 0 AND EX.EXTRT = 'PLACEBO'))
        expr: "COUNT(EX.EXSEQ)"

  - name: TRTEDT
    type: date
    label: Date of Last Exposure to Treatment
    derivation:
      case:
        - when: "EOSDT IS NOT NULL AND (EX_NMISSEND > 0 OR EX_ENDHI
            > EOSDT)"
          then: EOSDT
        - when: "EX_ENDHI IS NOT NULL"
          then: EX_ENDHI

  - name: TRTDUR
    type: float
    label: Duration of Treatment (days)
    derivation:
      diff:
        type: date
        start: TRTSDT
        end: TRTEDT
        unit: day
        closed: both

  - name: TRTDURD
    type: float
    label: Total Treatment Duration (Days)
    derivation: TRTDUR

  # CUMDOSE sums per-record dose-days: EXDOSE x days on the record. Records
  # with a missing EXENDTC (ongoing exposure) run to TRTEDT, matching the
  # official derivation (verified: all 6 open records impute exactly).
  - name: _CUM_CLOSED
    type: float
    label: Closed-record dose-days (internal)
    derivation:
      aggregate:
        filter: "EX.EXENDTC IS NOT NULL"
        expr: "SUM(EX.EXDOSE * (EX.EXENDY - EX.EXSTDY + 1))"

  - name: _OPEN_DOSE
    type: float
    label: Open-record EXDOSE (internal)
    derivation: EX_OPEN.EXDOSE

  - name: _OPEN_STARTDT
    type: date
    label: Open-record start date (internal)
    derivation:
      impute:
        type: date
        source: EX_OPEN.EXSTDTC
        month: 1
        day: 1

  - name: _OPEN_DAYS
    type: float
    label: Open-record days to TRTEDT (internal)
    derivation:
      diff:
        type: date
        start: _OPEN_STARTDT
        end: TRTEDT
        unit: day
        closed: both

  - name: _OPEN_TOTAL
    type: float
    label: _OPEN_TOTAL (helper)
    derivation: _OPEN_DOSE * _OPEN_DAYS

  - name: _CUM0
    type: float
    label: _CUM0 (helper)
    derivation:
      case:
        - when: _CUM_CLOSED IS NULL
          then: 0
        - otherwise: _CUM_CLOSED

  - name: _OPEN0
    type: float
    label: _OPEN0 (helper)
    derivation:
      case:
        - when: _OPEN_TOTAL IS NULL
          then: 0
        - otherwise: _OPEN_TOTAL

  - name: CUMDOSE
    type: float
    label: Cumulative Dose (as planned)
    derivation: "_CUM0 + _OPEN0"

  - name: _AVGDD_RAW
    type: float
    label: Unrounded avg daily dose (internal)
    derivation: "CUMDOSE / NULLIF(TRTDUR, 0)"

  - name: AVGDD
    type: float
    label: Avg Daily Dose (as planned)
    derivation:
      round_half_away_from_zero:
        source: _AVGDD_RAW
        digits: 1
