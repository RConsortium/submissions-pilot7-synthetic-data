# Reproduce the submitted population rules, including package-specific
# conventions.
yamaa: "1.0"
type: spec
model: ADaM

columns:
  - name: SITEGR1
    type: str
    label: Pooled Site Group 1
    derivation:
      # Small sites pool to 900 in the official ADSL (observed mapping).
      case:
        - when: "SITEID IN ('702', '706', '707', '711', '714',
            '715', '717')"
          then: "'900'"
        - otherwise: SITEID

  - name: TRT01PN
    type: float
    label: Planned Treatment for Period 01 (N)
    derivation:
      mapping:
        source: DM.ARM
        dict:
          Placebo: 0
          Xanomeline Low Dose: 54
          Xanomeline High Dose: 81

  - name: TRT01A
    type: str
    label: Actual Treatment for Period 01
    derivation: TRT01P

  - name: TRT01AN
    type: float
    label: Actual Treatment for Period 01 (N)
    derivation: TRT01PN

  - name: AGEGR1
    type: str
    label: Pooled Age Group 1
    derivation:
      # R rule: <65 / 65-80 / >80 - age 65 falls in 65-80, so the boundary
      # is mixed and cannot be expressed with cut's single right flag.
      case:
        - when: "DM.AGE < 65"
          then: "'<65'"
        - when: "DM.AGE <= 80"
          then: "'65-80'"
        - otherwise: "'>80'"

  - name: AGEGR1N
    type: float
    label: Pooled Age Group 1 (N)
    derivation:
      mapping:
        source: AGEGR1
        dict:
          "<65": 1
          "65-80": 2
          ">80": 3

  - name: RACEN
    type: float
    label: Race (N)
    derivation:
      mapping:
        source: RACE
        dict:
          WHITE: 1
          BLACK OR AFRICAN AMERICAN: 2
          AMERICAN INDIAN OR ALASKA NATIVE: 6
          ASIAN: 7
          NATIVE HAWAIIAN OR OTHER PACIFIC ISLANDER: 5

  - name: DTHFL
    type: str
    label: Subject Died?
    derivation:
      case:
        - when: "DM.DTHFL IS NULL"
          then: "''"
        - otherwise: DM.DTHFL

  - name: SAFFL
    type: str
    label: Safety Population Flag
    derivation:
      flag:
        condition: "TRTSDT IS NOT NULL"
        false_value: "N"
        missing: "N"

  - name: ITTFL
    type: str
    label: Intent-To-Treat Population Flag
    derivation:
      flag:
        condition: "DM.ARMCD <> ''"
        false_value: "N"
        missing: "N"

  - name: N_ACTOT
    type: float
    label: Post-baseline ADAS-Cog records (helper)
    derivation:
      aggregate:
        expr: "COUNT(QS.QSSEQ)"
        filter: "QS.VISITNUM > 3 AND QS.QSTESTCD = 'ACTOT'"

  - name: N_CIBIC
    type: float
    label: Post-baseline CIBIC+ records (helper)
    derivation:
      aggregate:
        expr: "COUNT(QS.QSSEQ)"
        filter: "QS.VISITNUM > 3 AND QS.QSTESTCD = 'CIBIC'"

  - name: EFFFL
    type: str
    label: Efficacy Population Flag
    derivation:
      flag:
        condition: "SAFFL = 'Y' AND N_ACTOT > 0 AND N_CIBIC >
          0"
        false_value: "N"
        missing: "N"

  - name: N_WK8
    type: float
    label: Week 8 visit records (helper)
    derivation:
      aggregate:
        expr: "COUNT(SV.USUBJID)"
        filter: "SV.VISIT = 'WEEK 8'"

  - name: N_WK16
    type: float
    label: Week 16 visit records (helper)
    derivation:
      aggregate:
        expr: "COUNT(SV.USUBJID)"
        filter: "SV.VISIT = 'WEEK 16'"

  - name: N_WK24
    type: float
    label: Week 24 visit records (helper)
    derivation:
      aggregate:
        expr: "COUNT(SV.USUBJID)"
        filter: "SV.VISIT = 'WEEK 24'"

  - name: COMP8FL
    type: str
    label: Completers of Week 8 Population Flag
    derivation:
      flag:
        condition: "N_WK8 > 0"
        false_value: "N"
        missing: "N"

  - name: COMP16FL
    type: str
    label: Completers of Week 16 Population Flag
    derivation:
      flag:
        condition: "N_WK16 > 0"
        false_value: "N"
        missing: "N"

  - name: COMP24FL
    type: str
    label: Completers of Week 24 Population Flag
    derivation:
      flag:
        condition: "N_WK24 > 0"
        false_value: "N"
        missing: "N"

  - name: DCSREAS
    type: str
    label: Reason for Discontinuation from Study
    derivation:
      # Display values per the official ADSL codelist (observed mapping).
      case:
        - when: >-
            DS_DISP.DSDECOD <> 'COMPLETED' AND DS_DISP.DSTERM
            = 'PROTOCOL ENTRY CRITERIA NOT MET'
          then: "'I/E Not Met'"
        - when: "DS_DISP.DSDECOD = 'COMPLETED'"
          then: "''"
        - otherwise:
            mapping:
              source: DS_DISP.DSDECOD
              dict:
                "ADVERSE EVENT": "Adverse Event"
                "DEATH": "Death"
                "LACK OF EFFICACY": "Lack of Efficacy"
                "LOST TO FOLLOW-UP": "Lost to Follow-up"
                "PHYSICIAN DECISION": "Physician Decision"
                "PROTOCOL VIOLATION": "Protocol Violation"
                "STUDY TERMINATED BY SPONSOR": "Sponsor Decision"
                "WITHDRAWAL BY SUBJECT": "Withdrew Consent"

  - name: DCDECOD
    type: str
    label: Standardized Disposition Term
    derivation: DS_LAST.DSDECOD

  - name: EOSSTT
    type: str
    label: End of Study Status
    derivation:
      case:
        - when: "DCDECOD = 'COMPLETED'"
          then: "'COMPLETED'"
        - otherwise: "'DISCONTINUED'"

  - name: DISCONFL
    type: str
    label: Did the Subject Discontinue the Study?
    derivation:
      case:
        - when: "EOSSTT = 'DISCONTINUED'"
          then: "'Y'"
        - otherwise: "''"

  - name: DSRAEFL
    type: str
    label: Discontinued due to AE?
    derivation:
      flag:
        condition: "DCDECOD = 'ADVERSE EVENT'"
        false_value: ""
        missing: ""

  - name: VISNUMEN
    type: float
    label: End of Trt Visit (Vis 12 or Early Term.)
    derivation:
      aggregate:
        expr: "MAX(SV.VISITNUM)"
        filter: "SV.VISITNUM <= 12 AND SV.VISIT NOT LIKE 'UNSCHEDULED%'"

  - name: DS_ENDTC
    type: str
    label: Last disposition event date (character, internal)
    derivation: DS_LAST.DSSTDTC

  - name: SV_SCHED_ENDTC
    type: str
    label: Last scheduled visit end date (character,
      internal)
    derivation:
      # Scheduled protocol visits are VISITNUM 1-13; unscheduled (x.1),
      # AE follow-up (101) and retrieval (201) visits are excluded.
      aggregate:
        filter: "SV.VISITNUM < 100 AND SV.VISIT NOT LIKE 'UNSCHEDULED%'"
        expr: "MAX(SV.SVENDTC)"

  - name: RFENDTC
    type: str
    label: Subject Reference End Date/Time
    derivation:
      case:
        - when: "SV_SCHED_ENDTC IS NOT NULL AND SV_SCHED_ENDTC
            > DS_ENDTC"
          then: SV_SCHED_ENDTC
        - otherwise: DS_ENDTC

  - name: RFENDT
    type: date
    label: "Date of Discontinuation/Completion"
    derivation:
      to_date:
        source: RFENDTC
