yamaa: "1.0"
type: spec
model: ADaM
parent: ../../../spec/yamaa/templates/subject-analysis.yaml
clear:
  - columns.DSRAEFL.submission
domain: ADLBC
keys:
  - STUDYID
  - USUBJID
  - PARAMCD
  - AVISIT
  - LBSEQ
input:
  LB:
    path: ../../data/sdtm/lb.parquet
    key:
      - STUDYID
      - USUBJID
  SUPPLB: ../../data/sdtm/supplb.parquet
  ADSL:
    empty_string: missing
    key:
      - STUDYID
      - USUBJID
base: LB

output:
  path: ../../data/adam/adlbc-yamaa.parquet
  columns:
    - STUDYID
    - SUBJID
    - USUBJID
    - TRTP
    - TRTPN
    - TRTA
    - TRTAN
    - TRTSDT
    - TRTEDT
    - AGE
    - AGEGR1
    - AGEGR1N
    - RACE
    - RACEN
    - SEX
    - COMP24FL
    - DSRAEFL
    - SAFFL
    - AVISIT
    - AVISITN
    - ADY
    - ADT
    - VISIT
    - VISITNUM
    - PARAM
    - PARAMCD
    - PARAMN
    - PARCAT1
    - AVAL
    - BASE
    - CHG
    - A1LO
    - A1HI
    - R2A1LO
    - R2A1HI
    - BR2A1LO
    - BR2A1HI
    - ANL01FL
    - ALBTRVAL
    - ANRIND
    - BNRIND
    - ABLFL
    - AENTMTFL
    - LBSEQ
    - LBNRIND
    - LBSTRESN

windows:
  EOTFB_ORDER:
    group_by:
      - STUDYID
      - USUBJID
      - LBTESTCD
    order_by:
      - variable: _EOT_AWARE
        direction: desc
        nulls: last
      - variable: LBSEQ
        nulls: last
    filter: >-
      LB.LBCAT = 'CHEMISTRY' AND (LB.VISIT LIKE '%WEEK%' OR LB.VISIT
      LIKE '%SCREENING%' OR LB.VISIT LIKE '%UNSCHEDULED%') AND
      LB.VISITNUM <> 13 AND _EOT_AWARE IS NOT NULL AND _EOT_AWARE
      <> 0

  RN_ANL_ORDER:
    group_by:
      - STUDYID
      - USUBJID
      - PARAMCD
    order_by:
      - variable: ALBTRVAL
        direction: desc
        nulls: last
      - variable: LBSEQ
        nulls: last
    filter: >-
      VISITNUM >= 4 AND VISITNUM <= 12 AND NOT (VISIT LIKE '%UN%')
      AND ALBTRVAL IS NOT NULL

intermediates:
  # SUPPLB ENDPOINT joined in-spec (no staging script): IDVARVAL is
  # right-aligned text (e.g. '     259'), so str_pad formats the numeric
  # LBSEQ to 8 chars before matching. Only ENDPOINT is carried; LBTMSHI
  # is never referenced. Follows Pilot 3 adlbc.yaml and REQ-1263.
  - id: SUP_EP
    dataset: SUPPLB
    key:
      STUDYID: LB.STUDYID
      USUBJID: LB.USUBJID
      IDVARVAL:
        str_pad:
          source: LB.LBSEQ
          width: 8
    filter: "SUPPLB.QNAM = 'ENDPOINT'"

  - id: EOTFB
    dataset: LB
    filter: "LB._RN = 1 AND LB._EOT_AWARE <> 99"
    columns:
      - STUDYID
      - USUBJID
      - LBTESTCD
      - LBSEQ
      - LBDTC
      - VISIT
      - VISITNUM
      - LBTEST
      - LBSTRESU
      - LBSTRESN
      - LBBLFL
      - LBSTNRLO
      - LBSTNRHI
      - LBNRIND
    derivations:
      _ENDPOINT:
        first_available:
          sources:
            - SUP_EP.QVAL
      _EOT_AWARE:
        case:
          - when: "_ENDPOINT = 'Y' OR LB.VISITNUM = 12"
            then: 99.0
          - when: "LB.LBBLFL = 'Y'"
            then: 0.0
          - when: "LB.VISIT LIKE '%UNSCHEDULED%'"
            then:
          - otherwise:
              mapping:
                source: LB.VISIT
                unmapped:
                dict:
                  "WEEK 2": 2.0
                  "WEEK 4": 4.0
                  "WEEK 6": 6.0
                  "WEEK 8": 8.0
                  "WEEK 12": 12.0
                  "WEEK 16": 16.0
                  "WEEK 20": 20.0
                  "WEEK 24": 24.0
                  "WEEK 26": 26.0
      _RN:
        row_number:
          window: EOTFB_ORDER

columns:
  # --- Record aliases: every LB read goes through these so the grouped
  # --- eot2 template (one row per subject-param) can supply them via
  # --- aggregates while main/eot read the record directly.
  - name: VISIT
    type: str
    label: Visit Name

    derivation: _r_VISIT

  - name: VISITNUM
    type: float
    label: Visit Number

    derivation: _r_VISITNUM

  - name: PARAMCD
    type: str
    label: Parameter Code
    derivation: _r_LBTESTCD

  - name: ABLFL
    type: str
    label: Baseline Record Flag
    derivation:
      case:
        - when: "_r_LBBLFL IS NULL"
          then: "''"
        - otherwise: _r_LBBLFL
    verifications:
      - allowed_values:
          values:
            - Y
            - N
            - ''

  - name: _r_STUDYID
    type: str
    label: record STUDYID (internal)

  - name: _r_USUBJID
    type: str
    label: record USUBJID (internal)

  - name: _r_LBSEQ
    type: float
    label: record LBSEQ (internal)

  - name: _r_LBDTC
    type: str
    label: record LBDTC (internal)

  - name: _r_VISIT
    type: str
    label: record VISIT (internal)

  - name: _r_VISITNUM
    type: float
    label: record VISITNUM (internal)

  - name: _r_LBTEST
    type: str
    label: record LBTEST (internal)

  - name: _r_LBTESTCD
    type: str
    label: record LBTESTCD (internal)

  - name: _r_LBSTRESU
    type: str
    label: record LBSTRESU (internal)

  - name: _r_LBSTRESN
    type: float
    label: record LBSTRESN (internal)

  - name: _r_LBBLFL
    type: str
    label: record LBBLFL (internal)

  - name: _r_LO
    type: float
    label: record LBSTNRLO (internal)

  - name: _r_HI
    type: float
    label: record LBSTNRHI (internal)

  - name: _r_NRIND
    type: str
    label: record LBNRIND (internal)

  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: _r_STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: _r_USUBJID

  - name: DSRAEFL
    type: str
    label: "Discontinued due to AE?"
    derivation:
      case:
        - when: "ADSL.DSRAEFL IS NULL"
          then: "''"
        - otherwise: ADSL.DSRAEFL

  - name: AVISIT
    type: str
    label: Analysis Visit

  - name: AVISITN
    type: float
    label: Analysis Visit (N)

  - name: _IS_EOT
    type: float
    label: EOT row marker (internal)

  - name: ENDPOINT
    type: str
    label: Endpoint (helper)

  # --- Dates ---
  # LBDTC is collected as datetime text ("YYYY-MM-DDTHH:MM"); date_impute
  # admits date prefixes only, so the text first becomes a datetime via
  # datetime_impute and to_date then drops the time fields. This matches
  # the R derive_vars_dt(highest_imputation = "n"): no imputation, the
  # date part is taken as-is.
  - name: _LBDTTM
    type: datetime
    label: LBDTC as datetime (internal)
    derivation:
      impute:
        type: datetime
        source: _r_LBDTC
        time: first

  - name: ADT
    type: date
    label: Analysis Date
    derivation:
      to_date:
        source: _LBDTTM

  - name: ADY
    type: float
    label: Analysis Relative Day
    derivation:
      study_day:
        source: ADT
        reference: TRTSDT

  - name: PARAM
    type: str
    label: Parameter
    derivation:
      str_template: "{_r_LBTEST} ({_r_LBSTRESU})"

  - name: PARAMN
    type: float
    label: Parameter (N)
    derivation:
      mapping:
        source: PARAM
        dict:
          "Sodium (mmol/L)": 18
          "Potassium (mmol/L)": 19
          "Chloride (mmol/L)": 20
          "Bilirubin (umol/L)": 21
          "Alkaline Phosphatase (U/L)": 22
          "Gamma Glutamyl Transferase (U/L)": 23
          "Alanine Aminotransferase (U/L)": 24
          "Aspartate Aminotransferase (U/L)": 25
          "Blood Urea Nitrogen (mmol/L)": 26
          "Creatinine (umol/L)": 27
          "Urate (umol/L)": 28
          "Phosphate (mmol/L)": 29
          "Calcium (mmol/L)": 30
          "Glucose (mmol/L)": 31
          "Protein (g/L)": 32
          "Albumin (g/L)": 33
          "Cholesterol (mmol/L)": 34
          "Creatine Kinase (U/L)": 35

  - name: PARCAT1
    type: str
    label: Parameter Category 1
    derivation: "'CHEM'"

  # --- Values / baseline ---
  - name: AVAL
    type: float
    label: Analysis Value
    derivation: _r_LBSTRESN

  - name: BASE
    type: float
    label: Baseline Value
    derivation:
      aggregate:
        filter: "ABLFL = 'Y'"
        group_by:
          - STUDYID
          - USUBJID
          - PARAMCD
        expr: "ONLY(AVAL)"

  - name: CHG
    type: float
    label: Change from Baseline
    derivation:
      case:
        - when: "VISITNUM = 1"
          then:
        - otherwise: "AVAL - BASE"

  - name: A1LO
    type: float
    label: Analysis Range 1 Lower Limit
    derivation: _r_LO

  - name: A1HI
    type: float
    label: Analysis Range 1 Upper Limit
    derivation: _r_HI

  - name: R2A1LO
    type: float
    label: Ratio to Analysis Range 1 Lower Limit
    derivation: "AVAL / A1LO"

  - name: R2A1HI
    type: float
    label: Ratio to Analysis Range 1 Upper Limit
    derivation: "AVAL / A1HI"

  - name: BR2A1LO
    type: float
    label: "Base Ratio to Analysis Range 1 Lower Lim"
    derivation: "BASE / A1LO"

  - name: BR2A1HI
    type: float
    label: "Base Ratio to Analysis Range 1 Upper Lim"
    derivation: "BASE / A1HI"

  - name: _UPPER_DISTANCE
    type: float
    label: _UPPER_DISTANCE (helper)
    derivation: ABS(AVAL - 1.5 * A1HI)

  - name: _LOWER_DISTANCE
    type: float
    label: _LOWER_DISTANCE (helper)
    derivation: ABS(0.5 * A1LO - AVAL)

  - name: ALBTRVAL
    type: float
    label: "Amount Threshold Range"
    derivation:
      greatest:
        sources:
          - _UPPER_DISTANCE
          - _LOWER_DISTANCE

  - name: _LO_HALF
    type: float
    label: half of A1LO (internal)
    derivation: "0.5 * A1LO"

  - name: _HI_15
    type: float
    label: 1.5x A1HI (internal)
    derivation: "1.5 * A1HI"

  - name: ANRIND
    type: str
    label: Analysis Reference Range Indicator
    derivation:
      # Faithful to R's nested ifelse: NA propagates when limits are missing
      # but AVAL is present; only a missing AVAL forces "N".
      case:
        - when: "AVAL IS NULL"
          then: "'N'"
        - when: "AVAL < _LO_HALF"
          then: "'L'"
        - when: "_LO_HALF IS NULL"
          then:
        - when: "AVAL > _HI_15"
          then: "'H'"
        - when: "_HI_15 IS NULL"
          then:
        - otherwise: "'N'"

  - name: _BNRIND_RAW
    type: str
    label: Baseline Reference Range Indicator (working)
    derivation:
      aggregate:
        filter: "ABLFL = 'Y'"
        group_by:
          - STUDYID
          - USUBJID
          - PARAMCD
        expr: "ONLY(ANRIND)"

  - name: BNRIND
    type: str
    label: Baseline Reference Range Indicator
    derivation:
      case:
        - when: "_BNRIND_RAW IS NULL"
          then: "''"
        - otherwise: _BNRIND_RAW

  # --- Last-observation flag ---
  - name: _AENT_MAX
    type: float
    label: Max eligible AVISITN per subject-param (internal)
    derivation:
      aggregate:
        filter: >-
          VISITNUM <= 12 AND AVISITN > 0 AND AVISITN < 99 AND
          NOT (VISIT LIKE '%UN%')
        group_by:
          - STUDYID
          - USUBJID
          - PARAMCD
        expr: "MAX(AVISITN)"

  - name: AENTMTFL
    type: str
    label: "Last value in treatment visit"
    derivation:
      flag:
        condition: "_IS_EOT = 1 OR AVISITN = _AENT_MAX"
        false_value: ""
        missing: ""

  # --- Max-deviation flag ---
  # LBSEQ is declared here (not with the other LB carries below) because the
  # _RN_ANL window orders by it: keys are exempt from the validator's
  # forward-reference check, but at runtime a column is only readable after
  # its own declaration, so the window would KeyError on a later LBSEQ.
  - name: LBSEQ
    type: float
    label: Sequence Number
    derivation: _r_LBSEQ

  - name: _RN_ANL
    type: float
    label: rank by ALBTRVAL within subject-param (internal)
    derivation:
      row_number:
        window: RN_ANL_ORDER

  - name: _WINLB
    type: float
    label: winning LBSEQ per subject-param (internal)
    derivation:
      aggregate:
        filter: "_RN_ANL = 1"
        group_by:
          - STUDYID
          - USUBJID
          - PARAMCD
        expr: "ONLY(LBSEQ)"

  - name: ANL01FL
    type: str
    label: "Analysis Flag 01"
    derivation:
      flag:
        condition: "LBSEQ = _WINLB"
        false_value: ""
        missing: ""

  # --- LB carries ---
  - name: LBNRIND
    type: str
    label: Reference Range Indicator
    derivation:
      case:
        - when: "_r_NRIND IS NULL"
          then: "''"
        - otherwise: _r_NRIND

  - name: LBSTRESN
    type: float
    label: Numeric Result/Finding in Standard Units
    derivation: _r_LBSTRESN

rows:
  - id: main
    dataset: LB
    filter: >-
      LB.LBCAT = 'CHEMISTRY' AND (LB.VISIT LIKE '%WEEK%' OR LB.VISIT
      LIKE '%SCREENING%' OR LB.VISIT LIKE '%UNSCHEDULED%')
    derivations:
      _IS_EOT: 0.0
      ENDPOINT:
      AVISIT:
        case:
          - when: "_r_LBBLFL = 'Y'"
            then: "'Baseline'"
          - when: "_r_VISIT LIKE '%UNSCHEDULED%'"
            then: "''"
          - otherwise:
              mapping:
                source: _r_VISIT
                unmapped:
                dict:
                  "WEEK 2": "Week 2"
                  "WEEK 4": "Week 4"
                  "WEEK 6": "Week 6"
                  "WEEK 8": "Week 8"
                  "WEEK 12": "Week 12"
                  "WEEK 16": "Week 16"
                  "WEEK 20": "Week 20"
                  "WEEK 24": "Week 24"
                  "WEEK 26": "Week 26"
      AVISITN:
        mapping:
          source: AVISIT
          unmapped:
          dict:
            "Baseline": 0.0
            "Week 2": 2.0
            "Week 4": 4.0
            "Week 6": 6.0
            "Week 8": 8.0
            "Week 12": 12.0
            "Week 16": 16.0
            "Week 20": 20.0
            "Week 24": 24.0
            "Week 26": 26.0

      _r_STUDYID: LB.STUDYID
      _r_USUBJID: LB.USUBJID
      _r_LBSEQ: LB.LBSEQ
      _r_LBDTC: LB.LBDTC
      _r_VISIT: LB.VISIT
      _r_VISITNUM: LB.VISITNUM
      _r_LBTEST: LB.LBTEST
      _r_LBTESTCD: LB.LBTESTCD
      _r_LBSTRESU: LB.LBSTRESU
      _r_LBSTRESN: LB.LBSTRESN
      _r_LBBLFL: LB.LBBLFL
      _r_LO: LB.LBSTNRLO
      _r_HI: LB.LBSTNRHI
      _r_NRIND: LB.LBNRIND

  - id: eot
    dataset: LB
    filter: "LB.LBCAT = 'CHEMISTRY' AND (LB.VISITNUM = 12 OR ENDPOINT
      = 'Y')"
    derivations:
      ENDPOINT: SUP_EP.QVAL
      _IS_EOT: 1.0
      AVISIT: "'End of Treatment'"
      AVISITN: 99.0

      _r_STUDYID: LB.STUDYID
      _r_USUBJID: LB.USUBJID
      _r_LBSEQ: LB.LBSEQ
      _r_LBDTC: LB.LBDTC
      _r_VISIT: LB.VISIT
      _r_VISITNUM: LB.VISITNUM
      _r_LBTEST: LB.LBTEST
      _r_LBTESTCD: LB.LBTESTCD
      _r_LBSTRESU: LB.LBSTRESU
      _r_LBSTRESN: LB.LBSTRESN
      _r_LBBLFL: LB.LBBLFL
      _r_LO: LB.LBSTNRLO
      _r_HI: LB.LBSTNRHI
      _r_NRIND: LB.LBNRIND

  - id: eot2
    dataset: EOTFB
    filter: "EOTFB.VISITNUM <> 12"
    derivations:
      _r_STUDYID: EOTFB.STUDYID
      _r_USUBJID: EOTFB.USUBJID
      _r_LBTESTCD: EOTFB.LBTESTCD
      _r_LBSEQ: EOTFB.LBSEQ
      _r_LBDTC: EOTFB.LBDTC
      _r_VISIT: EOTFB.VISIT
      _r_VISITNUM: EOTFB.VISITNUM
      _r_LBTEST: EOTFB.LBTEST
      _r_LBSTRESU: EOTFB.LBSTRESU
      _r_LBSTRESN: EOTFB.LBSTRESN
      _r_LBBLFL: EOTFB.LBBLFL
      _r_LO: EOTFB.LBSTNRLO
      _r_HI: EOTFB.LBSTNRHI
      _r_NRIND: EOTFB.LBNRIND
      _IS_EOT: 1.0
      ENDPOINT:
      AVISIT: "'End of Treatment'"
      AVISITN: 99.0

verifications:
  - assert:
      id: treatment_date_order
      when: TRTSDT IS NOT NULL AND TRTEDT IS NOT NULL
      require: TRTEDT >= TRTSDT
