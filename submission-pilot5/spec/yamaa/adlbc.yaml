yamaa: '1.0'
type: spec
model: ADaM
domain: ADLBC
keys:
  - STUDYID
  - USUBJID
  - PARAMCD
  - AVISIT
  - LBSEQ
input:
  LB:
    path: ../../data/sdtm/lb.parquet
    key:
      - STUDYID
      - USUBJID
  SUPPLB: ../../data/sdtm/supplb.parquet
  ADSL:
    path: ../../data/adam/adsl-yamaa.parquet
    schema: adsl.yaml
    key:
      - STUDYID
      - USUBJID
base: LB

output:
  path: ../../data/adam/adlbc-yamaa.parquet
  columns:
    - STUDYID
    - SUBJID
    - USUBJID
    - TRTP
    - TRTPN
    - TRTA
    - TRTAN
    - TRTSDT
    - TRTEDT
    - AGE
    - AGEGR1
    - AGEGR1N
    - RACE
    - RACEN
    - SEX
    - COMP24FL
    - DSRAEFL
    - SAFFL
    - AVISIT
    - AVISITN
    - ADY
    - ADT
    - VISIT
    - VISITNUM
    - PARAM
    - PARAMCD
    - PARAMN
    - PARCAT1
    - AVAL
    - BASE
    - CHG
    - A1LO
    - A1HI
    - R2A1LO
    - R2A1HI
    - BR2A1LO
    - BR2A1HI
    - ANL01FL
    - ALBTRVAL
    - ANRIND
    - BNRIND
    - ABLFL
    - AENTMTFL
    - LBSEQ
    - LBNRIND
    - LBSTRESN

intermediates:
  # SUPPLB ENDPOINT joined in-spec (no staging script): IDVARVAL is
  # right-aligned text (e.g. '     259'), so str_pad formats the numeric
  # LBSEQ to 8 chars before matching. Only ENDPOINT is carried; LBTMSHI
  # is never referenced. Follows Pilot 3 adlbc.yaml and REQ-1263.
  - id: SUP_EP
    dataset: SUPPLB
    key:
      STUDYID: LB.STUDYID
      USUBJID: LB.USUBJID
      IDVARVAL:
        str_pad:
          source: LB.LBSEQ
          width: 8
    filter: SUPPLB.QNAM = 'ENDPOINT'

  - id: EOTFB
    dataset: LB
    filter: LB._RN = 1 AND LB._EOT_AWARE <> 99
    columns:
      - STUDYID
      - USUBJID
      - LBTESTCD
      - LBSEQ
      - LBDTC
      - VISIT
      - VISITNUM
      - LBTEST
      - LBSTRESU
      - LBSTRESN
      - LBBLFL
      - LBSTNRLO
      - LBSTNRHI
      - LBNRIND
    derivations:
      _ENDPOINT:
        first_available:
          sources:
            - SUP_EP.QVAL
      _EOT_AWARE:
        case:
          - when: _ENDPOINT = 'Y' OR LB.VISITNUM = 12
            then: 99.0
          - when: LB.LBBLFL = 'Y'
            then: 0.0
          - when: LB.VISIT LIKE '%UNSCHEDULED%'
            then:
          - otherwise:
              mapping:
                source: LB.VISIT
                unmapped:
                dict:
                  WEEK 2: 2.0
                  WEEK 4: 4.0
                  WEEK 6: 6.0
                  WEEK 8: 8.0
                  WEEK 12: 12.0
                  WEEK 16: 16.0
                  WEEK 20: 20.0
                  WEEK 24: 24.0
                  WEEK 26: 26.0
      _RN:
        row_number:
          window:
            group_by:
              - STUDYID
              - USUBJID
              - LBTESTCD
            order_by:
              - {variable: _EOT_AWARE, direction: desc, nulls: last}
              - {variable: LBSEQ, nulls: last}
            filter: LB.LBCAT = 'CHEMISTRY' AND (LB.VISIT LIKE '%WEEK%' OR LB.VISIT LIKE '%SCREENING%' OR LB.VISIT LIKE '%UNSCHEDULED%') AND LB.VISITNUM <> 13 AND _EOT_AWARE IS NOT NULL AND _EOT_AWARE <> 0

columns:
  # --- Record aliases: every LB read goes through these so the grouped
  # --- eot2 template (one row per subject-param) can supply them via
  # --- aggregates while main/eot read the record directly.
  - name: _r_STUDYID
    type: str
    label: record STUDYID (internal)
    derivation: LB.STUDYID

  - name: _r_USUBJID
    type: str
    label: record USUBJID (internal)
    derivation: LB.USUBJID

  - name: _r_LBSEQ
    type: float
    label: record LBSEQ (internal)
    derivation: LB.LBSEQ

  - name: _r_LBDTC
    type: str
    label: record LBDTC (internal)
    derivation: LB.LBDTC

  - name: _r_VISIT
    type: str
    label: record VISIT (internal)
    derivation: LB.VISIT

  - name: _r_VISITNUM
    type: float
    label: record VISITNUM (internal)
    derivation: LB.VISITNUM

  - name: _r_LBTEST
    type: str
    label: record LBTEST (internal)
    derivation: LB.LBTEST

  - name: _r_LBTESTCD
    type: str
    label: record LBTESTCD (internal)
    derivation: LB.LBTESTCD

  - name: _r_LBSTRESU
    type: str
    label: record LBSTRESU (internal)
    derivation: LB.LBSTRESU

  - name: _r_LBSTRESN
    type: float
    label: record LBSTRESN (internal)
    derivation: LB.LBSTRESN

  - name: _r_LBBLFL
    type: str
    label: record LBBLFL (internal)
    derivation: LB.LBBLFL

  - name: _r_LO
    type: float
    label: record LBSTNRLO (internal)
    derivation: LB.LBSTNRLO

  - name: _r_HI
    type: float
    label: record LBSTNRHI (internal)
    derivation: LB.LBSTNRHI

  - name: _r_NRIND
    type: str
    label: record LBNRIND (internal)
    derivation: LB.LBNRIND

  # Subject-level columns keep ADSL's types and labels through its schema link.
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: _r_STUDYID

    submission:
      data_type: text
      mandatory: false
      length: 12
      origins:
        - type: Predecessor
          description: ADSL.STUDYID
  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: _r_USUBJID

    submission:
      data_type: text
      mandatory: false
      key_sequence: 1
      length: 11
      origins:
        - type: Predecessor
          description: ADSL.USUBJID
  - name: SUBJID
    type: str
    label: Subject Identifier for the Study
    derivation: ADSL.SUBJID
    submission:
      data_type: text
      mandatory: false
      length: 4
      origins:
        - type: Predecessor
          description: ADSL.SUBJID
  - name: TRTP
    type: str
    label: Planned Treatment
    derivation: ADSL.TRT01P

    submission:
      data_type: text
      mandatory: false
      length: 20
      codelist: ARM
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADLBC.TRTP
        type: Computation
        description: ADSL.TRT01P
  - name: TRTPN
    type: float
    label: Planned Treatment (N)
    derivation: ADSL.TRT01PN

    submission:
      data_type: integer
      mandatory: false
      length: 8
      codelist: ARMN
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADLBC.TRTPN
        type: Computation
        description: ADSL.TRT01PN
  - name: TRTA
    type: str
    label: Actual Treatment
    derivation: ADSL.TRT01A

    submission:
      data_type: text
      mandatory: false
      length: 20
      codelist: ARM
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADLBC.TRTA
        type: Computation
        description: ADSL.TRT01A
  - name: TRTAN
    type: float
    label: Actual Treatment (N)
    derivation: ADSL.TRT01AN

    submission:
      data_type: integer
      mandatory: false
      length: 8
      codelist: ARMN
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADLBC.TRTAN
        type: Computation
        description: ADSL.TRT01AN
  - name: TRTSDT
    type: date
    label: Date of First Exposure to Treatment
    derivation: ADSL.TRTSDT
    submission:
      data_type: integer
      mandatory: false
      length: 8
      display_format: DATE9.
      origins:
        - type: Predecessor
          description: ADSL.TRTSDT
  - name: TRTEDT
    type: date
    label: Date of Last Exposure to Treatment
    derivation: ADSL.TRTEDT
    submission:
      data_type: integer
      mandatory: false
      length: 8
      display_format: DATE9.
      origins:
        - type: Predecessor
          description: ADSL.TRTEDT
  - name: AGE
    type: float
    label: Age
    derivation: ADSL.AGE
    submission:
      data_type: integer
      mandatory: false
      length: 8
      origins:
        - type: Predecessor
          description: ADSL.AGE
  - name: AGEGR1
    type: str
    label: Pooled Age Group 1
    derivation: ADSL.AGEGR1
    submission:
      data_type: text
      mandatory: false
      length: 5
      codelist: AGEGR1
      origins:
        - type: Predecessor
          description: ADSL.AGEGR1
  - name: AGEGR1N
    type: float
    label: Pooled Age Group 1 (N)
    derivation: ADSL.AGEGR1N
    submission:
      data_type: integer
      mandatory: false
      length: 8
      codelist: AGEGR1N
      origins:
        - type: Predecessor
          description: ADSL.AGEGR1N
  - name: RACE
    type: str
    label: Race
    derivation: ADSL.RACE
    submission:
      data_type: text
      mandatory: false
      length: 32
      codelist: RACE
      origins:
        - type: Predecessor
          description: ADSL.RACE
  - name: RACEN
    type: float
    label: Race (N)
    derivation: ADSL.RACEN
    submission:
      data_type: integer
      mandatory: false
      length: 8
      codelist: RACEN
      origins:
        - type: Predecessor
          description: ADSL.RACEN
  - name: SEX
    type: str
    label: Sex
    derivation: ADSL.SEX
    submission:
      data_type: text
      mandatory: false
      length: 1
      codelist: SEX
      origins:
        - type: Predecessor
          description: ADSL.SEX
  - name: COMP24FL
    type: str
    label: Completers of Week 24 Population Flag
    derivation: ADSL.COMP24FL
    submission:
      data_type: text
      mandatory: false
      length: 1
      codelist: YN
      origins:
        - type: Predecessor
          description: ADSL.COM01P24FL
  - name: DSRAEFL
    type: str
    label: Discontinued due to AE?
    derivation:
      case:
        - when: ADSL.DSRAEFL IS NULL
          then: "''"
        - otherwise: ADSL.DSRAEFL

    submission:
      data_type: text
      mandatory: false
      length: 1
      codelist: YN
      origins:
        - type: Predecessor
          description: ADSL.DSR01AEFL
  - name: SAFFL
    type: str
    label: Safety Population Flag
    derivation: ADSL.SAFFL
    submission:
      data_type: text
      mandatory: false
      length: 1
      codelist: YN
      origins:
        - type: Predecessor
          description: ADSL.SAF01FL
  - name: AVISIT
    type: str
    label: Analysis Visit

    submission:
      data_type: text
      mandatory: false
      key_sequence: 3
      length: 16
      codelist: AVISIT
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADLBC.AVISIT
        type: Computation
        description: "Last observed value for this lab parameter during treatment phase: 'Y' if VISITNUM=12, if subject discontinues prior to VISIT 12, then this variable is set to 'Y' if this is the last assessment of this analyte for the subject"
  - name: AVISITN
    type: float
    label: Analysis Visit (N)

    submission:
      data_type: integer
      mandatory: false
      length: 8
      codelist: AVISITN
      origins:
        - type: Assigned
  - name: _IS_EOT
    type: float
    label: EOT row marker (internal)

  - name: ENDPOINT
    type: str
    label: Endpoint (helper)

  # --- Dates ---
  # LBDTC is collected as datetime text ("YYYY-MM-DDTHH:MM"); date_impute
  # admits date prefixes only, so the text first becomes a datetime via
  # datetime_impute and to_date then drops the time fields. This matches
  # the R derive_vars_dt(highest_imputation = "n"): no imputation, the
  # date part is taken as-is.
  - name: _LBDTTM
    type: datetime
    label: LBDTC as datetime (internal)
    derivation:
      impute:
        type: datetime
        source: _r_LBDTC
        time: first

  - name: ADT
    type: date
    label: Analysis Date
    derivation:
      to_date:
        source: _LBDTTM

    submission:
      data_type: integer
      mandatory: false
      length: 8
      display_format: DATE9.
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADLBC.ADT
        type: Computation
        description: LB.LBDTC
  - name: ADY
    type: float
    label: Analysis Relative Day
    derivation:
      study_day:
        source: ADT
        reference: TRTSDT

    submission:
      data_type: integer
      mandatory: false
      length: 8
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADLBC.ADY
        type: Computation
        description: LB.LBDY
  - name: VISIT
    type: str
    label: Visit Name
    derivation: _r_VISIT

    submission:
      data_type: text
      mandatory: false
      length: 19
      codelist: VISIT
      origins:
        - type: Predecessor
          description: LB.VISIT
  - name: VISITNUM
    type: float
    label: Visit Number
    derivation:
      round_half_away_from_zero:
        source: _r_VISITNUM
        digits: 1
    submission:
      data_type: float
      mandatory: false
      length: 8
      significant_digits: 1
      codelist: VISITNUM
      origins:
        - type: Predecessor
          description: LB.VISITNUM
  - name: PARAM
    type: str
    label: Parameter
    derivation:
      str_template: '{_r_LBTEST} ({_r_LBSTRESU})'

    submission:
      data_type: text
      mandatory: false
      length: 100
      codelist: PARAM_ADLBC
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADLBC.PARAM
        type: Computation
        description: Concatenated LB.LBTEST, '(', LB.LBSTRESU and ')'
  - name: PARAMCD
    type: str
    label: Parameter Code
    derivation: _r_LBTESTCD

    submission:
      data_type: text
      mandatory: false
      key_sequence: 2
      length: 8
      codelist: PARAMCD_ADLBC
      origins:
        - type: Predecessor
          description: LB.TESTCD
  - name: PARAMN
    type: float
    label: Parameter (N)
    derivation:
      mapping:
        source: PARAM
        dict:
          Sodium (mmol/L): 18
          Potassium (mmol/L): 19
          Chloride (mmol/L): 20
          Bilirubin (umol/L): 21
          Alkaline Phosphatase (U/L): 22
          Gamma Glutamyl Transferase (U/L): 23
          Alanine Aminotransferase (U/L): 24
          Aspartate Aminotransferase (U/L): 25
          Blood Urea Nitrogen (mmol/L): 26
          Creatinine (umol/L): 27
          Urate (umol/L): 28
          Phosphate (mmol/L): 29
          Calcium (mmol/L): 30
          Glucose (mmol/L): 31
          Protein (g/L): 32
          Albumin (g/L): 33
          Cholesterol (mmol/L): 34
          Creatine Kinase (U/L): 35

    submission:
      data_type: integer
      mandatory: false
      length: 8
      codelist: PARAMN_ADLBC
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADLBC.PARAMN
        type: Computation
        description: Numeric code for Parameter
  - name: PARCAT1
    type: str
    label: Parameter Category 1
    derivation: "'CHEM'"

  # --- Values / baseline ---
    submission:
      data_type: text
      mandatory: false
      length: 5
      codelist: ADLBCAT
      origins:
        - type: Assigned
  - name: AVAL
    type: float
    label: Analysis Value
    derivation: _r_LBSTRESN

    submission:
      data_type: float
      mandatory: false
      length: 8
      significant_digits: 5
      origins:
        - type: Predecessor
          description: LB.LBSTRESN
  - name: ABLFL
    type: str
    label: Baseline Record Flag
    derivation:
      case:
        - when: _r_LBBLFL IS NULL
          then: "''"
        - otherwise: _r_LBBLFL

    submission:
      data_type: text
      mandatory: false
      length: 1
      origins:
        - type: Predecessor
          description: LB.LBBLFL
  - name: BASE
    type: float
    label: Baseline Value
    derivation:
      aggregate:
        filter: ABLFL = 'Y'
        group_by:
          - STUDYID
          - USUBJID
          - PARAMCD
        expr: ONLY(AVAL)

    submission:
      data_type: float
      mandatory: false
      length: 8
      significant_digits: 5
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADLBC.BASE
        type: Computation
        description: LB.LBSTNRHI
  - name: CHG
    type: float
    label: Change from Baseline
    derivation:
      case:
        - when: VISITNUM = 1
          then:
        - otherwise: AVAL - BASE

    submission:
      data_type: float
      mandatory: false
      length: 8
      significant_digits: 5
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADLBC.CHG
        type: Computation
        description: AVAL - BASE
  - name: A1LO
    type: float
    label: Analysis Range 1 Lower Limit
    derivation: _r_LO

    submission:
      data_type: float
      mandatory: false
      length: 8
      significant_digits: 5
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADLBC.A1LO
        type: Computation
        description: LB.LBSTNRLO
  - name: A1HI
    type: float
    label: Analysis Range 1 Upper Limit
    derivation: _r_HI

    submission:
      data_type: float
      mandatory: false
      length: 8
      significant_digits: 5
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADLBC.A1HI
        type: Computation
        description: LB.LBSTNRHI
  - name: R2A1LO
    type: float
    label: Ratio to Analysis Range 1 Lower Limit
    derivation: AVAL / A1LO

    submission:
      data_type: float
      mandatory: false
      length: 8
      significant_digits: 1
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADLBC.R2A1LO
        type: Computation
        description: AVAL / A1LO
  - name: R2A1HI
    type: float
    label: Ratio to Analysis Range 1 Upper Limit
    derivation: AVAL / A1HI

    submission:
      data_type: float
      mandatory: false
      length: 8
      significant_digits: 1
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADLBC.R2A1HI
        type: Computation
        description: AVAL / A1HI
  - name: BR2A1LO
    type: float
    label: Base Ratio to Analysis Range 1 Lower Lim
    derivation: BASE / A1LO

    submission:
      data_type: float
      mandatory: false
      length: 8
      significant_digits: 1
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADLBC.BR2A1LO
        type: Computation
        description: AVAL / A1LO at baseline
  - name: BR2A1HI
    type: float
    label: Base Ratio to Analysis Range 1 Upper Lim
    derivation: BASE / A1HI

    submission:
      data_type: float
      mandatory: false
      length: 8
      significant_digits: 1
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADLBC.BR2A1HI
        type: Computation
        description: AVAL / A1HI at baseline
  - name: _UPPER_DISTANCE
    type: float
    label: _UPPER_DISTANCE (helper)
    derivation: ABS(AVAL - 1.5 * A1HI)

  - name: _LOWER_DISTANCE
    type: float
    label: _LOWER_DISTANCE (helper)
    derivation: ABS(0.5 * A1LO - AVAL)

  - name: ALBTRVAL
    type: float
    label: Amount Threshold Range
    derivation:
      greatest:
        sources:
          - _UPPER_DISTANCE
          - _LOWER_DISTANCE

    submission:
      data_type: float
      mandatory: false
      length: 8
      significant_digits: 3
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADLBC.ALBTRVAL
        type: Computation
        description: Maximum of [LBSTRESN-(1.5*ULN)] and [(.5*LLN) - LBSTRESN]
  - name: _LO_HALF
    type: float
    label: half of A1LO (internal)
    derivation: 0.5 * A1LO

  - name: _HI_15
    type: float
    label: 1.5x A1HI (internal)
    derivation: 1.5 * A1HI

  - name: ANRIND
    type: str
    label: Analysis Reference Range Indicator
    derivation:
      # Faithful to R's nested ifelse: NA propagates when limits are missing
      # but AVAL is present; only a missing AVAL forces "N".
      case:
        - when: AVAL IS NULL
          then: "'N'"
        - when: AVAL < _LO_HALF
          then: "'L'"
        - when: _LO_HALF IS NULL
          then:
        - when: AVAL > _HI_15
          then: "'H'"
        - when: _HI_15 IS NULL
          then:
        - otherwise: "'N'"

    submission:
      data_type: text
      mandatory: false
      length: 1
      codelist: LNH
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADLBC.ANRIND
        type: Computation
        description: if AVAL < [0.5*LBSTNRLO) then ANRIND = 'Y' else if AVAL > [0.5*LBSTRNHI),'H','N'
  - name: _BNRIND_RAW
    type: str
    label: Baseline Reference Range Indicator (working)
    derivation:
      aggregate:
        filter: ABLFL = 'Y'
        group_by:
          - STUDYID
          - USUBJID
          - PARAMCD
        expr: ONLY(ANRIND)

  - name: BNRIND
    type: str
    label: Baseline Reference Range Indicator
    derivation:
      case:
        - when: _BNRIND_RAW IS NULL
          then: "''"
        - otherwise: _BNRIND_RAW

  # --- Last-observation flag ---
    submission:
      data_type: text
      mandatory: false
      length: 1
      codelist: LNH
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADLBC.BNRIND
        type: Computation
        description: if BASE < [0.5*LBSTNRLO) then ANRIND = 'Y' else if BASE > [0.5*LBSTRNHI),'H','N'
  - name: _AENT_MAX
    type: float
    label: Max eligible AVISITN per subject-param (internal)
    derivation:
      aggregate:
        filter: VISITNUM <= 12 AND AVISITN > 0 AND AVISITN < 99 AND NOT (VISIT LIKE '%UN%')
        group_by:
          - STUDYID
          - USUBJID
          - PARAMCD
        expr: MAX(AVISITN)

  - name: AENTMTFL
    type: str
    label: Last value in treatment visit
    derivation:
      flag:
        condition: _IS_EOT = 1 OR AVISITN = _AENT_MAX
        false_value: ''
        missing: ''

  # --- Max-deviation flag ---
  # LBSEQ is declared here (not with the other LB carries below) because the
  # _RN_ANL window orders by it: keys are exempt from the validator's
  # forward-reference check, but at runtime a column is only readable after
  # its own declaration, so the window would KeyError on a later LBSEQ.
    submission:
      data_type: text
      mandatory: false
      length: 1
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADLBC.AENTMTFL
        type: Computation
        description: "Last observed value for this lab parameter during treatment phase: 'Y' if VISITNUM=12, if subject discontinues prior to VISIT 12, then this variable is set to 'Y' if this is the last assessment of this analyte for the subject"
  - name: LBSEQ
    type: float
    label: Sequence Number
    derivation: _r_LBSEQ

    submission:
      data_type: integer
      mandatory: false
      key_sequence: 4
      length: 8
      origins:
        - type: Predecessor
          description: LB.LBSEQ
  - name: _RN_ANL
    type: float
    label: rank by ALBTRVAL within subject-param (internal)
    derivation:
      row_number:
        window:
          group_by:
            - STUDYID
            - USUBJID
            - PARAMCD
          order_by:
            - variable: ALBTRVAL
              direction: desc
              nulls: last
            - variable: LBSEQ
              nulls: last
          filter: VISITNUM >= 4 AND VISITNUM <= 12 AND NOT (VISIT LIKE '%UN%') AND ALBTRVAL IS NOT NULL

  - name: _WINLB
    type: float
    label: winning LBSEQ per subject-param (internal)
    derivation:
      aggregate:
        filter: _RN_ANL = 1
        group_by:
          - STUDYID
          - USUBJID
          - PARAMCD
        expr: ONLY(LBSEQ)

  - name: ANL01FL
    type: str
    label: Analysis Flag 01
    derivation:
      flag:
        condition: LBSEQ = _WINLB
        false_value: ''
        missing: ''

  # --- LB carries ---
    submission:
      data_type: text
      mandatory: false
      length: 1
      origins:
        - type: Assigned
      method:
        name: Algorithm to derive ADLBC.ANL01FL
        type: Computation
        description: If ALBTRVAL = max(ALBTRVAL) then ANL01FL is 'Y'
  - name: LBNRIND
    type: str
    label: Reference Range Indicator
    derivation:
      case:
        - when: _r_NRIND IS NULL
          then: "''"
        - otherwise: _r_NRIND

    submission:
      data_type: text
      mandatory: false
      length: 8
      codelist: LBNRIND
      origins:
        - type: Predecessor
          description: LB.LBNRIND
  - name: LBSTRESN
    type: float
    label: Numeric Result/Finding in Standard Units
    derivation: _r_LBSTRESN

    submission:
      data_type: float
      mandatory: false
      length: 8
      significant_digits: 5
      origins:
        - type: Predecessor
          description: LB.LBSTRESN
rows:
  - id: main
    dataset: LB
    filter: LB.LBCAT = 'CHEMISTRY' AND (LB.VISIT LIKE '%WEEK%' OR LB.VISIT LIKE '%SCREENING%' OR LB.VISIT LIKE '%UNSCHEDULED%')
    derivations:
      _IS_EOT: 0.0
      ENDPOINT:
      AVISIT:
        case:
          - when: _r_LBBLFL = 'Y'
            then: "'Baseline'"
          - when: _r_VISIT LIKE '%UNSCHEDULED%'
            then: "''"
          - otherwise:
              mapping:
                source: _r_VISIT
                unmapped:
                dict:
                  WEEK 2: Week 2
                  WEEK 4: Week 4
                  WEEK 6: Week 6
                  WEEK 8: Week 8
                  WEEK 12: Week 12
                  WEEK 16: Week 16
                  WEEK 20: Week 20
                  WEEK 24: Week 24
                  WEEK 26: Week 26
      AVISITN:
        mapping:
          source: AVISIT
          unmapped:
          dict:
            Baseline: 0.0
            Week 2: 2.0
            Week 4: 4.0
            Week 6: 6.0
            Week 8: 8.0
            Week 12: 12.0
            Week 16: 16.0
            Week 20: 20.0
            Week 24: 24.0
            Week 26: 26.0

  - id: eot
    dataset: LB
    filter: LB.LBCAT = 'CHEMISTRY' AND (LB.VISITNUM = 12 OR ENDPOINT = 'Y')
    derivations:
      ENDPOINT: SUP_EP.QVAL
      _IS_EOT: 1.0
      AVISIT: "'End of Treatment'"
      AVISITN: 99.0

  - id: eot2
    dataset: EOTFB
    filter: EOTFB.VISITNUM <> 12
    derivations:
      _r_STUDYID: EOTFB.STUDYID
      _r_USUBJID: EOTFB.USUBJID
      _r_LBTESTCD: EOTFB.LBTESTCD
      _r_LBSEQ: EOTFB.LBSEQ
      _r_LBDTC: EOTFB.LBDTC
      _r_VISIT: EOTFB.VISIT
      _r_VISITNUM: EOTFB.VISITNUM
      _r_LBTEST: EOTFB.LBTEST
      _r_LBSTRESU: EOTFB.LBSTRESU
      _r_LBSTRESN: EOTFB.LBSTRESN
      _r_LBBLFL: EOTFB.LBBLFL
      _r_LO: EOTFB.LBSTNRLO
      _r_HI: EOTFB.LBSTNRHI
      _r_NRIND: EOTFB.LBNRIND
      _IS_EOT: 1.0
      ENDPOINT:
      AVISIT: "'End of Treatment'"
      AVISITN: 99.0

verifications:
  - assert:
      id: treatment_date_order
      when: TRTSDT IS NOT NULL AND TRTEDT IS NOT NULL
      require: TRTEDT >= TRTSDT
submission:
  mode: historical
  artifact: adlbc.json
  label: Analysis Dataset Lab Blood Chemistry
  class: BASIC DATA STRUCTURE
  structure: one record per subject per parameter per analysis visit
  repeating: true
  reference_data: false
