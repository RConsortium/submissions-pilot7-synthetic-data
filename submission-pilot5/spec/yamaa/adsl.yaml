yamaa: "1.0"
type: spec
model: ADaM
parent: ../../../spec/yamaa/templates/adsl.yaml
include:
  - fragments/adsl-exposure.yaml
  - fragments/adsl-baseline.yaml
  - fragments/adsl-population.yaml
domain: ADSL
input:
  DM:
    empty_string: missing
  EX:
    path: ../../data/sdtm/ex.parquet
    key:
      - STUDYID
      - USUBJID
  VS: ../../data/sdtm/vs.parquet
  DS: ../../data/sdtm/ds.parquet
  SC: ../../data/sdtm/sc.parquet
  MH: ../../data/sdtm/mh.parquet
  SV:
    path: ../../data/sdtm/sv.parquet
    key:
      - STUDYID
      - USUBJID
  QS:
    path: ../../data/sdtm/qs.parquet
    key:
      - STUDYID
      - USUBJID
filter: "DM.ACTARM <> 'Screen Failure'"

output:
  path: ../../data/adam/adsl-yamaa.parquet
  columns:
    - STUDYID
    - USUBJID
    - SUBJID
    - SITEID
    - SITEGR1
    - ARM
    - TRT01P
    - TRT01PN
    - TRT01A
    - TRT01AN
    - TRTSDT
    - TRTEDT
    - TRTDURD
    - AVGDD
    - CUMDOSE
    - AGE
    - AGEGR1
    - AGEGR1N
    - AGEU
    - RACE
    - RACEN
    - SEX
    - ETHNIC
    - SAFFL
    - ITTFL
    - EFFFL
    - COMP8FL
    - COMP16FL
    - COMP24FL
    - DISCONFL
    - DSRAEFL
    - DTHFL
    - BMIBL
    - BMIBLGR1
    - HEIGHTBL
    - WEIGHTBL
    - EDUCLVL
    - DISONSDT
    - DURDIS
    - DURDSGR1
    - VISIT1DT
    - RFSTDTC
    - RFENDTC
    - VISNUMEN
    - RFENDT
    - DCDECOD
    - EOSSTT
    - DCSREAS
    - MMSETOT

intermediates:
  - id: BASE_HT
    dataset: VS
    key:
      - STUDYID
      - USUBJID
    filter: "VS.VSTESTCD = 'HEIGHT' AND VS.VISITNUM = 1"
    order_by:
      - variable: VS.VSDTC
        nulls: last
    keep: first

  - id: BASE_WT
    dataset: VS
    key:
      - STUDYID
      - USUBJID
    filter: "VS.VSTESTCD = 'WEIGHT' AND VS.VISITNUM = 3"
    order_by:
      - variable: VS.VSDTC
        nulls: last
    keep: first

  - id: DS_DISP
    dataset: DS
    key:
      - STUDYID
      - USUBJID
    filter: "DS.DSCAT = 'DISPOSITION EVENT'"
    order_by:
      - variable: DS.DSSTDTC
        nulls: last
    keep: first

  - id: SC_EDU
    dataset: SC
    key:
      - STUDYID
      - USUBJID
    filter: "SC.SCTESTCD = 'EDLEVEL'"
    order_by:
      - variable: SC.SCDTC
        nulls: last
    keep: first

  - id: MH_DX
    dataset: MH
    key:
      - STUDYID
      - USUBJID
    filter: "MH.MHCAT = 'PRIMARY DIAGNOSIS'"
    order_by:
      - variable: MH.MHSTDTC
        nulls: last
    keep: first

  - id: SV_V1
    dataset: SV
    key:
      - STUDYID
      - USUBJID
    filter: "SV.VISITNUM = 1"
    order_by:
      - variable: SV.SVSTDTC
        nulls: last
    keep: first

  - id: EOS
    dataset: DS
    key:
      - STUDYID
      - USUBJID
    filter: >-
      DS.DSCAT = 'DISPOSITION EVENT' AND DS.DSDECOD <> 'SCREEN
      FAILURE' AND DS.DSDECOD <> 'COMPLETED'
    order_by:
      - variable: DS.DSSEQ
        nulls: last
    keep: first

  - id: DS_LAST
    dataset: DS
    key:
      - STUDYID
      - USUBJID
    filter: "DS.DSCAT = 'DISPOSITION EVENT'"
    order_by:
      - variable: DS.DSSTDTC
        nulls: last
    keep: last

  - id: EX_OPEN
    dataset: EX
    key:
      - STUDYID
      - USUBJID
    filter: "EX.EXENDTC IS NULL"

verifications:
  - assert:
      id: treatment_date_order
      when: "TRTSDT IS NOT NULL AND TRTEDT IS NOT NULL"
      require: "TRTEDT >= TRTSDT"
