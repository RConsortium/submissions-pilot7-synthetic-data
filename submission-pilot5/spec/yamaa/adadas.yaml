yamaa: "1.0"
type: spec
model: ADaM
domain: ADADAS
keys:
  - STUDYID
  - USUBJID
  - PARAMCD
  - AVISITN
  - QSSEQ
input:
  QS: ../../data/sdtm/qs.parquet
  ADSL:
    path: ../../data/adam/adsl-yamaa.parquet
    schema: adsl.yaml
    key:
      - STUDYID
      - USUBJID
base: QS

output:
  path: ../../data/adam/adadas-yamaa.parquet
  columns:
    - STUDYID
    - SITEID
    - SITEGR1
    - USUBJID
    - TRTSDT
    - TRTEDT
    - TRTP
    - TRTPN
    - AGE
    - AGEGR1
    - AGEGR1N
    - RACE
    - RACEN
    - SEX
    - ITTFL
    - EFFFL
    - COMP24FL
    - AVISIT
    - AVISITN
    - VISIT
    - VISITNUM
    - ADY
    - ADT
    - PARAM
    - PARAMCD
    - PARAMN
    - AVAL
    - BASE
    - CHG
    - PCHG
    - ABLFL
    - ANL01FL
    - DTYPE
    - AWRANGE
    - AWTARGET
    - AWTDIFF
    - AWLO
    - AWHI
    - AWU
    - QSSEQ

# LOCF donors read this spec's own observed rows (SELF): the latest
# observed ACTOT analysis record at or before each visit. ANL01FL is a
# row-phase flag (exactly one 'Y' per subject/visit), so the filter plus
# AVISITN desc selects that visit's analysis record directly. A locf row
# emitted by an earlier template may enter the pool, but it only ever
# carries the observed donor's values forward, and an observed record at
# the visit itself always outranks it, so _HIT stays exact.
intermediates:
  - id: DONOR8
    dataset: SELF
    key:
      - STUDYID
      - USUBJID
    filter: "PARAMCD = 'ACTOT' AND ANL01FL = 'Y' AND AVISITN <= 8"
    order_by:
      - variable: AVISITN
        direction: desc
        nulls: last
    keep: first
    columns:
      - QSSEQ
      - AVAL
      - ADY
      - ADT
      - VISIT
      - VISITNUM
      - AVISITN

  - id: DONOR16
    dataset: SELF
    key:
      - STUDYID
      - USUBJID
    filter: "PARAMCD = 'ACTOT' AND ANL01FL = 'Y' AND AVISITN <= 16"
    order_by:
      - variable: AVISITN
        direction: desc
        nulls: last
    keep: first
    columns:
      - QSSEQ
      - AVAL
      - ADY
      - ADT
      - VISIT
      - VISITNUM
      - AVISITN

  - id: DONOR24
    dataset: SELF
    key:
      - STUDYID
      - USUBJID
    filter: "PARAMCD = 'ACTOT' AND ANL01FL = 'Y' AND AVISITN <= 24"
    order_by:
      - variable: AVISITN
        direction: desc
        nulls: last
    keep: first
    columns:
      - QSSEQ
      - AVAL
      - ADY
      - ADT
      - VISIT
      - VISITNUM
      - AVISITN

columns:
  # --- Subject / record fields: uniform across all four templates, so they
  # are column-level derivations now (QS.* / ADSL.* read the row's own
  # datasets). Only the fields that genuinely differ per template stay
  # template-level. The SELF donors above read AVISITN etc. from completed
  # observed rows, which column-level derivations are part of.
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: QS.STUDYID

    submission:
      core: Cond
      mandatory: true
      origins:
        - type: Predecessor
          description: QS.STUDYID
      length: 12
  - name: SITEID
    type: str
    label: Study Site Identifier
    derivation: ADSL.SITEID
    submission:
      core: Cond
      mandatory: false
      origins:
        - type: Predecessor
          description: ADSL.SITEID
      length: 3
  - name: SITEGR1
    type: str
    label: Pooled Site Group 1
    derivation: ADSL.SITEGR1
    submission:
      core: Cond
      mandatory: false
      origins:
        - type: Predecessor
          description: ADSL.SITEGR1
      length: 3

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: QS.USUBJID

    submission:
      core: Cond
      mandatory: true
      origins:
        - type: Predecessor
          description: QS.USUBJID
      length: 11
  - name: TRTSDT
    type: date
    label: Date of First Exposure to Treatment
    derivation: ADSL.TRTSDT
    submission:
      core: Cond
      mandatory: false
      origins:
        - type: Predecessor
          description: ADSL.TRTSDT
      display_format: DATE9.
  - name: TRTEDT
    type: date
    label: Date of Last Exposure to Treatment
    derivation: ADSL.TRTEDT
    submission:
      core: Cond
      mandatory: false
      origins:
        - type: Predecessor
          description: ADSL.TRTEDT
      display_format: DATE9.

  - name: TRTP
    type: str
    label: Planned Treatment
    derivation: ADSL.TRT01P

    submission:
      core: Cond
      mandatory: false
      origins:
        - type: Predecessor
          description: ADSL.TRT01P
      length: 20
      codelist: ARM
  - name: TRTPN
    type: float
    label: Planned Treatment (N)
    derivation: ADSL.TRT01PN

    submission:
      core: Cond
      mandatory: false
      origins:
        - type: Predecessor
          description: ADSL.TRT01PN
      length: 8
      codelist: ARMN
      significant_digits: 0
  - name: AGE
    type: float
    label: Age
    derivation: ADSL.AGE
    submission:
      core: Cond
      mandatory: false
      origins:
        - type: Predecessor
          description: ADSL.AGE
      length: 8
      significant_digits: 0
  - name: AGEGR1
    type: str
    label: Pooled Age Group 1
    derivation: ADSL.AGEGR1
    submission:
      core: Cond
      mandatory: false
      origins:
        - type: Predecessor
          description: ADSL.AGEGR1
      length: 5
      codelist: AGEGR1
  - name: AGEGR1N
    type: float
    label: Pooled Age Group 1 (N)
    derivation: ADSL.AGEGR1N
    submission:
      core: Cond
      mandatory: false
      origins:
        - type: Predecessor
          description: ADSL.AGEGR1N
      length: 8
      codelist: AGEGR1N
      significant_digits: 0
  - name: RACE
    type: str
    label: Race
    derivation: ADSL.RACE
    submission:
      core: Cond
      mandatory: false
      origins:
        - type: Predecessor
          description: ADSL.RACE
      length: 32
      codelist: RACE
  - name: RACEN
    type: float
    label: Race (N)
    derivation: ADSL.RACEN
    submission:
      core: Cond
      mandatory: false
      origins:
        - type: Predecessor
          description: ADSL.RACEN
      length: 8
      codelist: RACEN
      significant_digits: 0
  - name: SEX
    type: str
    label: Sex
    derivation: ADSL.SEX
    submission:
      core: Cond
      mandatory: false
      origins:
        - type: Predecessor
          description: ADSL.SEX
      length: 1
      codelist: SEX
  - name: ITTFL
    type: str
    label: Intent-To-Treat Population Flag
    derivation: ADSL.ITTFL
    submission:
      core: Cond
      mandatory: false
      origins:
        - type: Predecessor
          description: ADSL.ITTFL
      length: 1
      codelist: YN
  - name: EFFFL
    type: str
    label: Efficacy Population Flag
    derivation: ADSL.EFFFL
    submission:
      core: Cond
      mandatory: false
      origins:
        - type: Predecessor
          description: ADSL.EFFFL
      length: 1
      codelist: YN
  - name: COMP24FL
    type: str
    label: Completers of Week 24 Population Flag
    derivation: ADSL.COMP24FL
    submission:
      core: Cond
      mandatory: false
      origins:
        - type: Predecessor
          description: ADSL.COMP24FL
      length: 1
      codelist: YN

  - name: AVISIT
    type: str
    label: Analysis Visit

    submission:
      core: Cond
      mandatory: false
      origins:
        - type: Assigned
      length: 16
      codelist: AVISIT
      method:
        name: Algorithm to derive ADADAS.AVISIT
        type: Computation
        description: Derived based on windowing algorithm described in SAP, Section 8.2
  - name: AVISITN
    type: float
    label: Analysis Visit (N)

    submission:
      core: Cond
      mandatory: true
      origins:
        - type: Assigned
      length: 8
      codelist: AVISITN
      method:
        name: Algorithm to derive ADADAS.AVISITN
        type: Computation
        description: Numeric code for AVISIT
      significant_digits: 0
  - name: VISIT
    type: str
    label: Visit Name

    submission:
      core: Cond
      mandatory: false
      origins:
        - type: Derived
      length: 19
      codelist: VISIT
      method: Use QS.VISIT on observed rows and the selected LOCF donor value on generated rows.
  - name: VISITNUM
    type: float
    label: Visit Number

    submission:
      core: Cond
      mandatory: false
      origins:
        - type: Derived
      length: 8
      significant_digits: 1
      codelist: VISITNUM
      method: Use QS.VISITNUM on observed rows and the selected LOCF donor value on generated rows.
  - name: ADY
    type: float
    label: Analysis Relative Day

    submission:
      core: Cond
      mandatory: false
      origins:
        - type: Derived
      length: 8
      method:
        name: Algorithm to derive ADADAS.ADY
        type: Computation
        description: "ADY = ADT - TRTSDT + 1, if ADT>=TRTSDT. ADY = \nADT - TRTSDT, if ADT<TRTSDT."
      significant_digits: 0
  - name: ADT
    type: date
    label: Analysis Date

    submission:
      core: Cond
      mandatory: false
      origins:
        - type: Derived
      display_format: DATE9.
      method:
        name: Algorithm to derive ADADAS.ADT
        type: Computation
        description: SAS date from QS.QSDTC
  - name: PARAMCD
    type: str
    label: Parameter Code

    submission:
      core: Cond
      mandatory: true
      origins:
        - type: Other
          description: QS.QSTESTCD on observed rows; ACTOT on generated LOCF rows.
      length: 8
      codelist: PARAMCD_ADQSADAS
  - name: PARAM
    type: str
    label: Parameter
    derivation:
      # Uniform: locf templates only emit ACTOT, whose name matches the
      # obs mapping below, so one column-level mapping serves all templates.
      mapping:
        source: PARAMCD
        dict:
          "ACITM01": "Word Recall Task"
          "ACITM02": "Naming Objects And Fingers (Refer To 5 C"
          "ACITM03": "Delayed Word Recall"
          "ACITM04": "Commands"
          "ACITM05": "Constructional Praxis"
          "ACITM06": "Ideational Praxis"
          "ACITM07": "Orientation"
          "ACITM08": "Word Recognition"
          "ACITM09": "Attention/Visual Search Task"
          "ACITM10": "Maze Solution"
          "ACITM11": "Spoken Language Ability"
          "ACITM12": "Comprehension Of Spoken Language"
          "ACITM13": "Word Finding Difficulty In Spontaneous S"
          "ACITM14": "Recall Of Test Instructions"
          "ACTOT": "Adas-Cog(11) Subscore"

    submission:
      core: Cond
      mandatory: false
      origins:
        - type: Assigned
      length: 100
      codelist: PARAM_ADQSADAS
      comment: Decoded value for PARAMCD
  - name: PARAMN
    type: float
    label: Parameter (N)
    derivation:
      mapping:
        source: PARAMCD
        dict:
          "ACITM01": 1.0
          "ACITM02": 2.0
          "ACITM03": 3.0
          "ACITM04": 4.0
          "ACITM05": 5.0
          "ACITM06": 6.0
          "ACITM07": 7.0
          "ACITM08": 8.0
          "ACITM09": 9.0
          "ACITM10": 10.0
          "ACITM11": 11.0
          "ACITM12": 12.0
          "ACITM13": 13.0
          "ACITM14": 14.0
          "ACTOT": 15.0

    submission:
      core: Cond
      mandatory: false
      origins:
        - type: Assigned
      length: 8
      codelist: PARAMN_ADQSADAS
      comment: "Assign a numeric code for each value of PARAMCD \n(see codelist PARAMN_ADQSADAS)"
      significant_digits: 0
  - name: AVAL
    type: float
    label: Analysis Value

    submission:
      core: Cond
      mandatory: false
      origins:
        - type: Derived
      length: 16
      significant_digits: 13
      method:
        name: Algorithm to derive ADADAS.AVAL
        type: Computation
        description: QS.QSSTRESN where QSTESTCD=PARAMCD
      value_level:
        - id: ACITM01
          where:
            PARAMCD:
              - ACITM01
          label: Word Recall Task
          core: Cond
          mandatory: false
          origins:
            - type: Derived
          length: 16
          significant_digits: 13
          method:
            name: Algorithm to derive ADADAS.AVAL
            type: Computation
            description: QS.QSSTRESN where QSTESTCD=PARAMCD
        - id: ACITM02
          where:
            PARAMCD:
              - ACITM02
          label: Naming Objects And Fingers (Refer To 5 C
          core: Cond
          mandatory: false
          origins:
            - type: Derived
          length: 16
          significant_digits: 13
          method:
            name: Algorithm to derive ADADAS.AVAL
            type: Computation
            description: QS.QSSTRESN where QSTESTCD=PARAMCD
        - id: ACITM03
          where:
            PARAMCD:
              - ACITM03
          label: Delayed Word Recall
          core: Cond
          mandatory: false
          origins:
            - type: Derived
          length: 16
          significant_digits: 13
          method:
            name: Algorithm to derive ADADAS.AVAL
            type: Computation
            description: QS.QSSTRESN where QSTESTCD=PARAMCD
        - id: ACITM04
          where:
            PARAMCD:
              - ACITM04
          label: Commands
          core: Cond
          mandatory: false
          origins:
            - type: Derived
          length: 16
          significant_digits: 13
          method:
            name: Algorithm to derive ADADAS.AVAL
            type: Computation
            description: QS.QSSTRESN where QSTESTCD=PARAMCD
        - id: ACITM05
          where:
            PARAMCD:
              - ACITM05
          label: Constructional Praxis
          core: Cond
          mandatory: false
          origins:
            - type: Derived
          length: 16
          significant_digits: 13
          method:
            name: Algorithm to derive ADADAS.AVAL
            type: Computation
            description: QS.QSSTRESN where QSTESTCD=PARAMCD
        - id: ACITM06
          where:
            PARAMCD:
              - ACITM06
          label: Ideational Praxis
          core: Cond
          mandatory: false
          origins:
            - type: Derived
          length: 16
          significant_digits: 13
          method:
            name: Algorithm to derive ADADAS.AVAL
            type: Computation
            description: QS.QSSTRESN where QSTESTCD=PARAMCD
        - id: ACITM07
          where:
            PARAMCD:
              - ACITM07
          label: Orientation
          core: Cond
          mandatory: false
          origins:
            - type: Derived
          length: 16
          significant_digits: 13
          method:
            name: Algorithm to derive ADADAS.AVAL
            type: Computation
            description: QS.QSSTRESN where QSTESTCD=PARAMCD
        - id: ACITM08
          where:
            PARAMCD:
              - ACITM08
          label: Word Recognition
          core: Cond
          mandatory: false
          origins:
            - type: Derived
          length: 16
          significant_digits: 13
          method:
            name: Algorithm to derive ADADAS.AVAL
            type: Computation
            description: QS.QSSTRESN where QSTESTCD=PARAMCD
        - id: ACITM09
          where:
            PARAMCD:
              - ACITM09
          label: Attention/Visual Search Task
          core: Cond
          mandatory: false
          origins:
            - type: Derived
          length: 16
          significant_digits: 13
          method:
            name: Algorithm to derive ADADAS.AVAL
            type: Computation
            description: QS.QSSTRESN where QSTESTCD=PARAMCD
        - id: ACITM10
          where:
            PARAMCD:
              - ACITM10
          label: Maze Solution
          core: Cond
          mandatory: false
          origins:
            - type: Derived
          length: 16
          significant_digits: 13
          method:
            name: Algorithm to derive ADADAS.AVAL
            type: Computation
            description: QS.QSSTRESN where QSTESTCD=PARAMCD
        - id: ACITM11
          where:
            PARAMCD:
              - ACITM11
          label: Spoken Language Ability
          core: Cond
          mandatory: false
          origins:
            - type: Derived
          length: 16
          significant_digits: 13
          method:
            name: Algorithm to derive ADADAS.AVAL
            type: Computation
            description: QS.QSSTRESN where QSTESTCD=PARAMCD
        - id: ACITM12
          where:
            PARAMCD:
              - ACITM12
          label: Comprehension Of Spoken Language
          core: Cond
          mandatory: false
          origins:
            - type: Derived
          length: 16
          significant_digits: 13
          method:
            name: Algorithm to derive ADADAS.AVAL
            type: Computation
            description: QS.QSSTRESN where QSTESTCD=PARAMCD
        - id: ACITM13
          where:
            PARAMCD:
              - ACITM13
          label: Word Finding Difficulty In Spontaneous S
          core: Cond
          mandatory: false
          origins:
            - type: Derived
          length: 16
          significant_digits: 13
          method:
            name: Algorithm to derive ADADAS.AVAL
            type: Computation
            description: QS.QSSTRESN where QSTESTCD=PARAMCD
        - id: ACITM14
          where:
            PARAMCD:
              - ACITM14
          label: Recall Of Test Instructions
          core: Cond
          mandatory: false
          origins:
            - type: Derived
          length: 16
          significant_digits: 13
          method:
            name: Algorithm to derive ADADAS.AVAL
            type: Computation
            description: QS.QSSTRESN where QSTESTCD=PARAMCD
        - id: ACTOT
          where:
            PARAMCD:
              - ACTOT
          label: Adas-Cog(11) Subscore
          core: Cond
          mandatory: false
          origins:
            - type: Derived
          length: 16
          significant_digits: 13
          method:
            name: Algorithm to derive ADADAS.AVAL.ACTOT
            type: Computation
            description: Sum of ADAS scores for items 1, 2, 4, 5, 6, 7, 8, 11, 12, 13, and 14, see SAP
              section 14.2 for details on adjusting for missing values
  - name: ABLFL
    type: str
    label: Baseline Record Flag

    submission:
      core: Cond
      mandatory: false
      origins:
        - type: Assigned
      length: 1
      method: Set Y when an observed record has QS.QSBLFL = 'Y'; otherwise blank, including generated
        LOCF rows.
  - name: ANL01FL
    type: str
    label: "Analysis Flag 01"

    submission:
      core: Cond
      mandatory: false
      origins:
        - type: Assigned
      length: 1
      method:
        name: Algorithm to derive ADADAS.ANL01FL
        type: Computation
        description: If multiple visits fall into the same visit window, then the one closest to the
          target date is chosen for analysis. These are flagged with ANL01FL="Y".
  - name: DTYPE
    type: str
    label: Derivation Type

    submission:
      core: Cond
      mandatory: false
      origins:
        - type: Assigned
      length: 7
      codelist: DTYPE
      method:
        name: Algorithm to derive ADADAS.DTYPE
        type: Computation
        description: Set to "LOCF" if a record is imputated when PARAMCD="ACTOT"; otherwise, set to
          missing
  - name: AWTARGET
    type: float
    label: Analysis Window Target

    submission:
      core: Cond
      mandatory: false
      origins:
        - type: Assigned
      length: 8
      comment: Target day within the window, specified in the SAP.
      significant_digits: 0
  - name: AWTDIFF
    type: float
    label: "Analysis Window Diff from Target"

    submission:
      core: Cond
      mandatory: false
      origins:
        - type: Assigned
      length: 8
      comment: Absolute difference between AWTARGET and ADY
      significant_digits: 0
  - name: _DIFF
    type: float
    label: signed AWTARGET-ADY (internal)

  - name: _RN_ANL
    type: float
    label: rank by window closeness within subject-param-visit (internal)
    # Column-level default: the three locf templates inherit _RN_ANL = 1;
    # the obs template overrides it with its ranking window (REQ-0199).
    derivation: 1.0

  - name: _HIT
    type: float
    label: QSSEQ of an observed ANL01FL record at the LOCF visit, if any (internal)

  - name: _SRC_QSSEQ
    type: float
    label: carried QSSEQ (internal)

  - name: _SRC_AVAL
    type: float
    label: carried AVAL (internal)

  - name: _SRC_ADY
    type: float
    label: carried ADY (internal)

  - name: _SRC_ADT
    type: date
    label: carried ADT (internal)

  - name: _SRC_VISIT
    type: str
    label: carried VISIT (internal)

  - name: _SRC_VISITNUM
    type: float
    label: carried VISITNUM (internal)

  - name: QSSEQ
    type: float
    label: Sequence Number

  # --- Window metadata: uniform from AVISIT ---
    submission:
      core: Cond
      mandatory: true
      origins:
        - type: Derived
      length: 8
      significant_digits: 0
      method: Use QS.QSSEQ on observed rows and the selected LOCF donor value on generated rows.
  - name: AWRANGE
    type: str
    label: Analysis Window Valid Relative Range
    derivation:
      mapping:
        source: AVISIT
        dict:
          "Baseline": "<=1"
          "Week 8": "2-84"
          "Week 16": "85-140"
          "Week 24": ">140"

    submission:
      core: Cond
      mandatory: false
      origins:
        - type: Assigned
      length: 9
      comment: Window range, specified in the SAP.
  - name: AWLO
    type: float
    label: "Analysis Window Beginning Timepoint"
    derivation:
      mapping:
        source: AVISIT
        dict:
          "Baseline":
          "Week 8": 2.0
          "Week 16": 85.0
          "Week 24": 141.0

    submission:
      core: Cond
      mandatory: false
      origins:
        - type: Assigned
      length: 8
      comment: Start day of the window, specified in the SAP.
      significant_digits: 0
  - name: AWHI
    type: float
    label: "Analysis Window Ending Timepoint"
    derivation:
      mapping:
        source: AVISIT
        dict:
          "Baseline": 1.0
          "Week 8": 84.0
          "Week 16": 140.0
          "Week 24":
    submission:
      core: Cond
      mandatory: false
      origins:
        - type: Assigned
      length: 8
      comment: End day of the window, specified in the SAP.
      significant_digits: 0

  - name: AWU
    type: str
    label: Analysis Window Unit
    derivation: "'DAYS'"

  # --- Baseline / change: uniform over observed + LOCF rows ---
    submission:
      core: Cond
      mandatory: false
      origins:
        - type: Assigned
      length: 4
      codelist: AWU
      comment: Assigned as "DAYS".
  - name: BASE
    type: float
    label: Baseline Value
    derivation:
      aggregate:
        filter: "ABLFL = 'Y'"
        group_by:
          - STUDYID
          - USUBJID
          - PARAMCD
        expr: "ONLY(AVAL)"

    submission:
      core: Cond
      mandatory: false
      origins:
        - type: Derived
      length: 8
      method:
        name: Algorithm to derive ADADAS.BASE
        type: Computation
        description: QS.QSSTRESN when QS.QSBLFL=Y (QS.VISITNUM=3)
      significant_digits: 13
  - name: CHG
    type: float
    label: Change from Baseline
    derivation:
      case:
        - when: "ABLFL <> 'Y'"
          then: "AVAL - BASE"

    submission:
      core: Cond
      mandatory: false
      origins:
        - type: Derived
      length: 8
      method:
        name: Algorithm to derive ADADAS.CHG
        type: Computation
        description: AVAL - BASE
      significant_digits: 13
  - name: PCHG
    type: float
    label: Percent Change from Baseline
    derivation:
      case:
        # admiral returns NA when the baseline denominator is zero; the
        # engine raises division_by_zero instead, so guard it explicitly.
        - when: "ABLFL <> 'Y' AND BASE <> 0"
          then: "100 * (AVAL - BASE) / BASE"

    submission:
      core: Cond
      mandatory: false
      origins:
        - type: Derived
      length: 8
      method:
        name: Algorithm to derive ADADAS.PCHG
        type: Computation
        description: 100* (CHG/BASE)
      significant_digits: 13
rows:
  - id: obs
    dataset: QS
    filter: "QS.QSTESTCD IN ('ACITM01','ACITM02','ACITM03','ACITM04','ACITM05','ACITM06','ACITM07','ACITM08','ACITM09','ACITM10','ACITM11','ACITM12','ACITM13','ACITM14','ACTOT')"
    derivations:
      QSSEQ: QS.QSSEQ
      PARAMCD: QS.QSTESTCD
      ADT:
        impute:
          type: date
          source: QS.QSDTC
          day: 1
      ADY:
        study_day:
          source: ADT
          reference: TRTSDT
      AVISIT:
        case:
          - when: "ADY <= 1"
            then: "'Baseline'"
          - when: "ADY >= 2 AND ADY <= 84"
            then: "'Week 8'"
          - when: "ADY >= 85 AND ADY <= 140"
            then: "'Week 16'"
          - otherwise: "'Week 24'"
      AVAL: QS.QSSTRESN
      AVISITN:
        mapping:
          source: AVISIT
          dict:
            "Baseline": 0.0
            "Week 8": 8.0
            "Week 16": 16.0
            "Week 24": 24.0
      VISIT: QS.VISIT
