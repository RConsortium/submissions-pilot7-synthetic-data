yamaa: "1.0"
type: spec
model: ADaM
parent: ../../../spec/yamaa/templates/subject-analysis.yaml
domain: ADADAS
keys:
  - STUDYID
  - USUBJID
  - PARAMCD
  - AVISITN
  - QSSEQ
input:
  QS: ../../data/sdtm/qs.parquet
  ADSL:
    empty_string: missing
    key:
      - STUDYID
      - USUBJID
base: QS

output:
  path: ../../data/adam/adadas-yamaa.parquet
  columns:
    - STUDYID
    - SITEID
    - SITEGR1
    - USUBJID
    - TRTSDT
    - TRTEDT
    - TRTP
    - TRTPN
    - AGE
    - AGEGR1
    - AGEGR1N
    - RACE
    - RACEN
    - SEX
    - ITTFL
    - EFFFL
    - COMP24FL
    - AVISIT
    - AVISITN
    - VISIT
    - VISITNUM
    - ADY
    - ADT
    - PARAM
    - PARAMCD
    - PARAMN
    - AVAL
    - BASE
    - CHG
    - PCHG
    - ABLFL
    - ANL01FL
    - DTYPE
    - AWRANGE
    - AWTARGET
    - AWTDIFF
    - AWLO
    - AWHI
    - AWU
    - QSSEQ

windows:
  OBS_ORDER:
    group_by:
      - STUDYID
      - USUBJID
      - PARAMCD
      - AVISIT
    order_by:
      - variable: AWTDIFF
        nulls: last
      - variable: _DIFF
        nulls: last

# LOCF donors select observed ACTOT records directly from QS, using the same
# analysis-window ranking as the observed row template. SUBJECT_FOR_VISIT
# supplies treatment dates from generated ADSL. Each visit selects its latest
# eligible analysis record; generated LOCF rows do not become donors.
intermediates:
  - id: SUBJECT_FOR_VISIT
    dataset: ADSL
    key:
      - USUBJID

  - id: DONOR8
    dataset: QS
    key:
      - STUDYID
      - USUBJID
    filter: >-
      (QS.QSTESTCD IN ('ACITM01', 'ACITM02', 'ACITM03', 'ACITM04',
      'ACITM05', 'ACITM06', 'ACITM07', 'ACITM08', 'ACITM09', 'ACITM10',
      'ACITM11', 'ACITM12', 'ACITM13', 'ACITM14', 'ACTOT')) AND
      (QS.PARAMCD = 'ACTOT' AND QS.ANL01FL = 'Y' AND QS.AVISITN
      <= 8)
    order_by:
      - variable: QS.AVISITN
        direction: desc
        nulls: last
    keep: first
    columns:
      - QSSEQ
      - AVAL
      - ADY
      - ADT
      - VISIT
      - VISITNUM
      - AVISITN

    derivations:
      AVAL:
        type: float
        derivation: QS.QSSTRESN
      ADT:
        type: date
        derivation:
          impute:
            type: date
            source: QS.QSDTC
            day: 1
      TRTSDT:
        type: date
        derivation: SUBJECT_FOR_VISIT.TRTSDT
      ADY:
        type: float
        derivation:
          study_day:
            source: QS.ADT
            reference: QS.TRTSDT
      AVISIT:
        type: str
        derivation:
          case:
            - when: QS.ADY <= 1
              then: "'Baseline'"
            - when: QS.ADY >= 2 AND QS.ADY <= 84
              then: "'Week 8'"
            - when: QS.ADY >= 85 AND QS.ADY <= 140
              then: "'Week 16'"
            - otherwise: "'Week 24'"
      AVISITN:
        type: float
        derivation:
          mapping:
            source: QS.AVISIT
            dict:
              "Baseline": 0.0
              "Week 8": 8.0
              "Week 16": 16.0
              "Week 24": 24.0
      PARAMCD:
        type: str
        derivation: QS.QSTESTCD
      AWTARGET:
        type: float
        derivation:
          mapping:
            source: QS.AVISIT
            dict:
              "Baseline": 1.0
              "Week 8": 56.0
              "Week 16": 112.0
              "Week 24": 168.0
      AWTDIFF:
        type: float
        derivation: ABS(QS.AWTARGET - QS.ADY)
      _DIFF:
        type: float
        derivation: QS.AWTARGET - QS.ADY
      _RN_ANL:
        type: float
        derivation:
          row_number:
            window:
              group_by:
                - QS.STUDYID
                - QS.USUBJID
                - QS.PARAMCD
                - QS.AVISIT
              order_by:
                - variable: QS.AWTDIFF
                  nulls: last
                - variable: QS._DIFF
                  nulls: last
      ANL01FL:
        type: str
        derivation:
          flag:
            condition: QS._RN_ANL = 1
            false_value: ""
            missing: ""

  - id: DONOR16
    dataset: QS
    key:
      - STUDYID
      - USUBJID
    filter: >-
      (QS.QSTESTCD IN ('ACITM01', 'ACITM02', 'ACITM03', 'ACITM04',
      'ACITM05', 'ACITM06', 'ACITM07', 'ACITM08', 'ACITM09', 'ACITM10',
      'ACITM11', 'ACITM12', 'ACITM13', 'ACITM14', 'ACTOT')) AND
      (QS.PARAMCD = 'ACTOT' AND QS.ANL01FL = 'Y' AND QS.AVISITN
      <= 16)
    order_by:
      - variable: QS.AVISITN
        direction: desc
        nulls: last
    keep: first
    columns:
      - QSSEQ
      - AVAL
      - ADY
      - ADT
      - VISIT
      - VISITNUM
      - AVISITN

    derivations:
      AVAL:
        type: float
        derivation: QS.QSSTRESN
      ADT:
        type: date
        derivation:
          impute:
            type: date
            source: QS.QSDTC
            day: 1
      TRTSDT:
        type: date
        derivation: SUBJECT_FOR_VISIT.TRTSDT
      ADY:
        type: float
        derivation:
          study_day:
            source: QS.ADT
            reference: QS.TRTSDT
      AVISIT:
        type: str
        derivation:
          case:
            - when: QS.ADY <= 1
              then: "'Baseline'"
            - when: QS.ADY >= 2 AND QS.ADY <= 84
              then: "'Week 8'"
            - when: QS.ADY >= 85 AND QS.ADY <= 140
              then: "'Week 16'"
            - otherwise: "'Week 24'"
      AVISITN:
        type: float
        derivation:
          mapping:
            source: QS.AVISIT
            dict:
              "Baseline": 0.0
              "Week 8": 8.0
              "Week 16": 16.0
              "Week 24": 24.0
      PARAMCD:
        type: str
        derivation: QS.QSTESTCD
      AWTARGET:
        type: float
        derivation:
          mapping:
            source: QS.AVISIT
            dict:
              "Baseline": 1.0
              "Week 8": 56.0
              "Week 16": 112.0
              "Week 24": 168.0
      AWTDIFF:
        type: float
        derivation: ABS(QS.AWTARGET - QS.ADY)
      _DIFF:
        type: float
        derivation: QS.AWTARGET - QS.ADY
      _RN_ANL:
        type: float
        derivation:
          row_number:
            window:
              group_by:
                - QS.STUDYID
                - QS.USUBJID
                - QS.PARAMCD
                - QS.AVISIT
              order_by:
                - variable: QS.AWTDIFF
                  nulls: last
                - variable: QS._DIFF
                  nulls: last
      ANL01FL:
        type: str
        derivation:
          flag:
            condition: QS._RN_ANL = 1
            false_value: ""
            missing: ""

  - id: DONOR24
    dataset: QS
    key:
      - STUDYID
      - USUBJID
    filter: >-
      (QS.QSTESTCD IN ('ACITM01', 'ACITM02', 'ACITM03', 'ACITM04',
      'ACITM05', 'ACITM06', 'ACITM07', 'ACITM08', 'ACITM09', 'ACITM10',
      'ACITM11', 'ACITM12', 'ACITM13', 'ACITM14', 'ACTOT')) AND
      (QS.PARAMCD = 'ACTOT' AND QS.ANL01FL = 'Y' AND QS.AVISITN
      <= 24)
    order_by:
      - variable: QS.AVISITN
        direction: desc
        nulls: last
    keep: first
    columns:
      - QSSEQ
      - AVAL
      - ADY
      - ADT
      - VISIT
      - VISITNUM
      - AVISITN

    derivations:
      AVAL:
        type: float
        derivation: QS.QSSTRESN
      ADT:
        type: date
        derivation:
          impute:
            type: date
            source: QS.QSDTC
            day: 1
      TRTSDT:
        type: date
        derivation: SUBJECT_FOR_VISIT.TRTSDT
      ADY:
        type: float
        derivation:
          study_day:
            source: QS.ADT
            reference: QS.TRTSDT
      AVISIT:
        type: str
        derivation:
          case:
            - when: QS.ADY <= 1
              then: "'Baseline'"
            - when: QS.ADY >= 2 AND QS.ADY <= 84
              then: "'Week 8'"
            - when: QS.ADY >= 85 AND QS.ADY <= 140
              then: "'Week 16'"
            - otherwise: "'Week 24'"
      AVISITN:
        type: float
        derivation:
          mapping:
            source: QS.AVISIT
            dict:
              "Baseline": 0.0
              "Week 8": 8.0
              "Week 16": 16.0
              "Week 24": 24.0
      PARAMCD:
        type: str
        derivation: QS.QSTESTCD
      AWTARGET:
        type: float
        derivation:
          mapping:
            source: QS.AVISIT
            dict:
              "Baseline": 1.0
              "Week 8": 56.0
              "Week 16": 112.0
              "Week 24": 168.0
      AWTDIFF:
        type: float
        derivation: ABS(QS.AWTARGET - QS.ADY)
      _DIFF:
        type: float
        derivation: QS.AWTARGET - QS.ADY
      _RN_ANL:
        type: float
        derivation:
          row_number:
            window:
              group_by:
                - QS.STUDYID
                - QS.USUBJID
                - QS.PARAMCD
                - QS.AVISIT
              order_by:
                - variable: QS.AWTDIFF
                  nulls: last
                - variable: QS._DIFF
                  nulls: last
      ANL01FL:
        type: str
        derivation:
          flag:
            condition: QS._RN_ANL = 1
            false_value: ""
            missing: ""

columns:
  # --- Subject / record fields: uniform across all four templates, so they
  # are column-level derivations now (QS.* / ADSL.* read the row's own
  # datasets). Fields that differ per template remain template-level.
  - name: VISIT
    type: str
    label: Visit Name

  - name: VISITNUM
    type: float
    label: Visit Number

  - name: PARAMCD
    type: str
    label: Parameter Code

  - name: ABLFL
    type: str
    label: Baseline Record Flag
    verifications:
      - allowed_values:
          values:
            - Y
            - N
            - ''

  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: QS.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: QS.USUBJID

  - name: AVISIT
    type: str
    label: Analysis Visit

  - name: AVISITN
    type: float
    label: Analysis Visit (N)

  - name: ADY
    type: float
    label: Analysis Relative Day

  - name: ADT
    type: date
    label: Analysis Date

  - name: PARAM
    type: str
    label: Parameter
    derivation:
      # Uniform: locf templates only emit ACTOT, whose name matches the
      # obs mapping below, so one column-level mapping serves all templates.
      mapping:
        source: PARAMCD
        dict:
          "ACITM01": "Word Recall Task"
          "ACITM02": "Naming Objects And Fingers (Refer To 5 C"
          "ACITM03": "Delayed Word Recall"
          "ACITM04": "Commands"
          "ACITM05": "Constructional Praxis"
          "ACITM06": "Ideational Praxis"
          "ACITM07": "Orientation"
          "ACITM08": "Word Recognition"
          "ACITM09": "Attention/Visual Search Task"
          "ACITM10": "Maze Solution"
          "ACITM11": "Spoken Language Ability"
          "ACITM12": "Comprehension Of Spoken Language"
          "ACITM13": "Word Finding Difficulty In Spontaneous S"
          "ACITM14": "Recall Of Test Instructions"
          "ACTOT": "Adas-Cog(11) Subscore"

  - name: PARAMN
    type: float
    label: Parameter (N)
    derivation:
      mapping:
        source: PARAMCD
        dict:
          "ACITM01": 1.0
          "ACITM02": 2.0
          "ACITM03": 3.0
          "ACITM04": 4.0
          "ACITM05": 5.0
          "ACITM06": 6.0
          "ACITM07": 7.0
          "ACITM08": 8.0
          "ACITM09": 9.0
          "ACITM10": 10.0
          "ACITM11": 11.0
          "ACITM12": 12.0
          "ACITM13": 13.0
          "ACITM14": 14.0
          "ACTOT": 15.0

  - name: AVAL
    type: float
    label: Analysis Value

  - name: ANL01FL
    type: str
    label: "Analysis Flag 01"

  - name: DTYPE
    type: str
    label: Derivation Type

  - name: AWTARGET
    type: float
    label: Analysis Window Target

  - name: AWTDIFF
    type: float
    label: "Analysis Window Diff from Target"

    derivation: "ABS(AWTARGET - ADY)"

  - name: _DIFF
    type: float
    label: signed AWTARGET-ADY (internal)

    derivation: "AWTARGET - ADY"

  - name: _RN_ANL
    type: float
    label: rank by window closeness within
      subject-param-visit (internal)
    # Column-level default: the three locf templates inherit _RN_ANL = 1;
    # the obs template overrides it with its ranking window (REQ-0199).
    derivation: 1.0

  - name: _HIT
    type: float
    label: QSSEQ of an observed ANL01FL record at the LOCF
      visit, if any (internal)

  - name: _SRC_QSSEQ
    type: float
    label: carried QSSEQ (internal)

  - name: _SRC_AVAL
    type: float
    label: carried AVAL (internal)

  - name: _SRC_ADY
    type: float
    label: carried ADY (internal)

  - name: _SRC_ADT
    type: date
    label: carried ADT (internal)

  - name: _SRC_VISIT
    type: str
    label: carried VISIT (internal)

  - name: _SRC_VISITNUM
    type: float
    label: carried VISITNUM (internal)

  - name: QSSEQ
    type: float
    label: Sequence Number

  # --- Window metadata: uniform from AVISIT ---
  - name: AWRANGE
    type: str
    label: Analysis Window Valid Relative Range
    derivation:
      mapping:
        source: AVISIT
        dict:
          "Baseline": "<=1"
          "Week 8": "2-84"
          "Week 16": "85-140"
          "Week 24": ">140"

  - name: AWLO
    type: float
    label: "Analysis Window Beginning Timepoint"
    derivation:
      mapping:
        source: AVISIT
        dict:
          "Baseline":
          "Week 8": 2.0
          "Week 16": 85.0
          "Week 24": 141.0

  - name: AWHI
    type: float
    label: "Analysis Window Ending Timepoint"
    derivation:
      mapping:
        source: AVISIT
        dict:
          "Baseline": 1.0
          "Week 8": 84.0
          "Week 16": 140.0
          "Week 24":

  - name: AWU
    type: str
    label: Analysis Window Unit
    derivation: "'DAYS'"

  # --- Baseline / change: uniform over observed + LOCF rows ---
  - name: BASE
    type: float
    label: Baseline Value
    derivation:
      aggregate:
        filter: "ABLFL = 'Y'"
        group_by:
          - STUDYID
          - USUBJID
          - PARAMCD
        expr: "ONLY(AVAL)"

  - name: CHG
    type: float
    label: Change from Baseline
    derivation:
      case:
        - when: "ABLFL <> 'Y'"
          then: "AVAL - BASE"

  - name: PCHG
    type: float
    label: Percent Change from Baseline
    derivation:
      case:
        # admiral returns NA when the baseline denominator is zero; the
        # engine raises division_by_zero instead, so guard it explicitly.
        - when: "ABLFL <> 'Y' AND BASE <> 0"
          then: "100 * (AVAL - BASE) / BASE"

rows:
  - id: obs
    dataset: QS
    filter: >-
      QS.QSTESTCD IN ('ACITM01', 'ACITM02', 'ACITM03', 'ACITM04',
      'ACITM05', 'ACITM06', 'ACITM07', 'ACITM08', 'ACITM09', 'ACITM10',
      'ACITM11', 'ACITM12', 'ACITM13', 'ACITM14', 'ACTOT')
    derivations:
      QSSEQ: QS.QSSEQ
      PARAMCD: QS.QSTESTCD
      ADT:
        impute:
          type: date
          source: QS.QSDTC
          day: 1
      ADY:
        study_day:
          source: ADT
          reference: TRTSDT
      AVISIT:
        case:
          - when: "ADY <= 1"
            then: "'Baseline'"
          - when: "ADY >= 2 AND ADY <= 84"
            then: "'Week 8'"
          - when: "ADY >= 85 AND ADY <= 140"
            then: "'Week 16'"
          - otherwise: "'Week 24'"
      AVAL: QS.QSSTRESN
      AVISITN:
        mapping:
          source: AVISIT
          dict:
            "Baseline": 0.0
            "Week 8": 8.0
            "Week 16": 16.0
            "Week 24": 24.0
      VISIT: QS.VISIT
      VISITNUM: QS.VISITNUM
      AWTARGET:
        mapping:
          source: AVISIT
          dict:
            "Baseline": 1.0
            "Week 8": 56.0
            "Week 16": 112.0
            "Week 24": 168.0
      _RN_ANL:
        row_number:
          window: OBS_ORDER
      ABLFL:
        flag:
          condition: "QS.QSBLFL = 'Y'"
          false_value: ""
          missing: ""
      ANL01FL:
        flag:
          condition: "_RN_ANL = 1"
          false_value: ""
          missing: ""
      DTYPE: "''"
      _HIT:
      _SRC_QSSEQ:
      _SRC_AVAL:
      _SRC_ADY:
      _SRC_ADT:
      _SRC_VISIT:
      _SRC_VISITNUM:

  - id: locf8
    dataset: QS
    group_by:
      - QS.STUDYID
      - QS.USUBJID
    filter: "_HIT IS NULL AND _SRC_QSSEQ IS NOT NULL"
    derivations:
      _HIT:
        case:
          - when: "DONOR8.AVISITN = 8"
            then: DONOR8.QSSEQ
      _SRC_QSSEQ: DONOR8.QSSEQ
      _SRC_AVAL: DONOR8.AVAL
      _SRC_ADY: DONOR8.ADY
      _SRC_ADT: DONOR8.ADT
      _SRC_VISIT: DONOR8.VISIT
      _SRC_VISITNUM: DONOR8.VISITNUM
      AVISIT: "'Week 8'"
      AVISITN: 8.0
      AWTARGET: 56.0
      VISIT: _SRC_VISIT
      VISITNUM: _SRC_VISITNUM
      ADY: _SRC_ADY
      ADT: _SRC_ADT
      PARAMCD: "'ACTOT'"
      AVAL: _SRC_AVAL
      ABLFL: "''"
      ANL01FL: "'Y'"
      DTYPE: "'LOCF'"
      QSSEQ: _SRC_QSSEQ

  - id: locf16
    dataset: QS
    group_by:
      - QS.STUDYID
      - QS.USUBJID
    filter: "_HIT IS NULL AND _SRC_QSSEQ IS NOT NULL"
    derivations:
      _HIT:
        case:
          - when: "DONOR16.AVISITN = 16"
            then: DONOR16.QSSEQ
      _SRC_QSSEQ: DONOR16.QSSEQ
      _SRC_AVAL: DONOR16.AVAL
      _SRC_ADY: DONOR16.ADY
      _SRC_ADT: DONOR16.ADT
      _SRC_VISIT: DONOR16.VISIT
      _SRC_VISITNUM: DONOR16.VISITNUM
      AVISIT: "'Week 16'"
      AVISITN: 16.0
      AWTARGET: 112.0
      VISIT: _SRC_VISIT
      VISITNUM: _SRC_VISITNUM
      ADY: _SRC_ADY
      ADT: _SRC_ADT
      PARAMCD: "'ACTOT'"
      AVAL: _SRC_AVAL
      ABLFL: "''"
      ANL01FL: "'Y'"
      DTYPE: "'LOCF'"
      QSSEQ: _SRC_QSSEQ

  - id: locf24
    dataset: QS
    group_by:
      - QS.STUDYID
      - QS.USUBJID
    filter: "_HIT IS NULL AND _SRC_QSSEQ IS NOT NULL"
    derivations:
      _HIT:
        case:
          - when: "DONOR24.AVISITN = 24"
            then: DONOR24.QSSEQ
      _SRC_QSSEQ: DONOR24.QSSEQ
      _SRC_AVAL: DONOR24.AVAL
      _SRC_ADY: DONOR24.ADY
      _SRC_ADT: DONOR24.ADT
      _SRC_VISIT: DONOR24.VISIT
      _SRC_VISITNUM: DONOR24.VISITNUM
      AVISIT: "'Week 24'"
      AVISITN: 24.0
      AWTARGET: 168.0
      VISIT: _SRC_VISIT
      VISITNUM: _SRC_VISITNUM
      ADY: _SRC_ADY
      ADT: _SRC_ADT
      PARAMCD: "'ACTOT'"
      AVAL: _SRC_AVAL
      ABLFL: "''"
      ANL01FL: "'Y'"
      DTYPE: "'LOCF'"
      QSSEQ: _SRC_QSSEQ

verifications:
  - assert:
      id: treatment_date_order
      when: "TRTSDT IS NOT NULL AND TRTEDT IS NOT NULL"
      require: "TRTEDT >= TRTSDT"
