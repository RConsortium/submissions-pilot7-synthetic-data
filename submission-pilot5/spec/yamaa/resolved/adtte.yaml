yamaa: '1.0'
type: spec
model: ADaM
domain: ADTTE
keys:
- STUDYID
- USUBJID
input:
  ADSL:
    path: ../../../data/adam/adsl-yamaa.parquet
    relative_to: entry
    schema: adsl.yaml
    empty_string: present
  ADAE:
    path: ../../../data/adam/adae-yamaa.parquet
    relative_to: entry
    schema: adae.yaml
    empty_string: present
base: ADSL
output:
  path: ../../../data/adam/adtte-yamaa.parquet
  relative_to: entry
  columns:
  - STUDYID
  - SITEID
  - USUBJID
  - AGE
  - AGEGR1
  - AGEGR1N
  - RACE
  - RACEN
  - SEX
  - TRTSDT
  - TRTEDT
  - TRTDUR
  - TRTP
  - TRTA
  - TRTAN
  - PARAM
  - PARAMCD
  - AVAL
  - STARTDT
  - ADT
  - CNSR
  - EVNTDESC
  - SRCDOM
  - SRCVAR
  - SRCSEQ
  - SAFFL
  order_by:
  - variable: USUBJID
    direction: asc
    nulls: last
  - variable: PARAMCD
    direction: asc
    nulls: last
intermediates:
- id: FIRST_DERM
  dataset: ADAE
  key:
  - STUDYID
  - USUBJID
  filter: ADAE.AOCC01FL = 'Y'
  order_by:
  - variable: ADAE.ASTDT
    direction: asc
    nulls: last
  - variable: ADAE.AESEQ
    direction: asc
    nulls: last
  keep: first
columns:
- name: STUDYID
  type: str
  label: Study Identifier
  derivation: ADSL.STUDYID
  submission:
    mandatory: false
    data_type: text
    length: 12
    origins:
    - type: Predecessor
      description: ADSL.STUDYID
- name: SITEID
  type: str
  label: Study Site Identifier
  derivation: ADSL.SITEID
  submission:
    mandatory: false
    data_type: text
    length: 3
    origins:
    - type: Predecessor
      description: ADSL.SITEID
- name: USUBJID
  type: str
  label: Unique Subject Identifier
  derivation: ADSL.USUBJID
  submission:
    key_sequence: 1
    mandatory: false
    data_type: text
    length: 11
    origins:
    - type: Predecessor
      description: ADSL.USUBJID
- name: AGE
  type: float
  label: Age
  derivation: ADSL.AGE
  submission:
    mandatory: false
    data_type: integer
    length: 8
    origins:
    - type: Predecessor
      description: ADSL.AGE
- name: AGEGR1
  type: str
  label: Pooled Age Group 1
  derivation: ADSL.AGEGR1
  submission:
    mandatory: false
    data_type: text
    length: 5
    codelist: AGEGR1
    origins:
    - type: Predecessor
      description: ADSL.AGEGR1
- name: AGEGR1N
  type: float
  label: Pooled Age Group 1 (N)
  derivation: ADSL.AGEGR1N
  submission:
    mandatory: false
    data_type: integer
    length: 8
    codelist: AGEGR1N
    origins:
    - type: Predecessor
      description: ADSL.AGEGR1N
- name: RACE
  type: str
  label: Race
  derivation: ADSL.RACE
  submission:
    mandatory: false
    data_type: text
    length: 32
    codelist: RACE
    origins:
    - type: Predecessor
      description: ADSL.RACE
- name: RACEN
  type: float
  label: Race (N)
  derivation: ADSL.RACEN
  submission:
    mandatory: false
    data_type: integer
    length: 8
    codelist: RACEN
    origins:
    - type: Predecessor
      description: ADSL.RACEN
- name: SEX
  type: str
  label: Sex
  derivation: ADSL.SEX
  submission:
    mandatory: false
    data_type: text
    length: 1
    codelist: SEX
    origins:
    - type: Predecessor
      description: ADSL.SEX
- name: TRTSDT
  type: date
  label: Date of First Exposure to Treatment
  derivation: ADSL.TRTSDT
  submission:
    mandatory: false
    data_type: integer
    length: 8
    display_format: DATE9.
    origins:
    - type: Predecessor
      description: ADSL.TRTSDT
- name: TRTEDT
  type: date
  label: Date of Last Exposure to Treatment
  derivation: ADSL.TRTEDT
  submission:
    mandatory: false
    data_type: integer
    length: 8
    display_format: DATE9.
    origins:
    - type: Predecessor
      description: ADSL.TRTEDT
- name: TRTDUR
  type: float
  label: Duration of treatment (days)
  derivation: ADSL.TRTDURD
  submission:
    mandatory: false
    data_type: integer
    length: 8
    origins:
    - type: Predecessor
      description: ADSL.TRTDUR
- name: TRTP
  type: str
  label: Planned Treatment
  derivation: ADSL.TRT01P
  submission:
    mandatory: false
    data_type: text
    length: 20
    codelist: ARM
    origins:
    - type: Predecessor
      description: ADSL.TRTP
- name: TRTA
  type: str
  label: Actual Treatment
  derivation: ADSL.TRT01A
  submission:
    mandatory: false
    data_type: text
    length: 20
    codelist: ARM
    origins:
    - type: Predecessor
      description: ADSL.TRTA
- name: TRTAN
  type: float
  label: Actual Treatment (N)
  derivation: ADSL.TRT01AN
  submission:
    mandatory: false
    data_type: integer
    length: 8
    codelist: ARMN
    origins:
    - type: Predecessor
      description: ADSL.TRTAN
- name: PARAM
  type: str
  label: Parameter
  derivation: '''Time to First Dermatologic Event'''
  submission:
    mandatory: false
    data_type: text
    length: 100
    codelist: PARAM_ADTTE
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADTTE.PARAM
      type: Computation
      description: PARAM="Time to First Dermatologic Event"
- name: PARAMCD
  type: str
  label: Parameter Code
  derivation: '''TTDE'''
  submission:
    key_sequence: 2
    mandatory: false
    data_type: text
    length: 8
    codelist: PARAMCD_ADTTE
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADTTE.PARAMCD
      type: Computation
      description: PARAMCD="TTDE"
- name: STARTDT
  type: date
  label: Time-to-Event Origin Date for Subject
  derivation: ADSL.TRTSDT
  submission:
    mandatory: false
    data_type: integer
    length: 8
    display_format: DATE9.
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADTTE.STARTDT
      type: Computation
      description: ADSL.RFSTDTC
- name: HAS_EVENT
  type: str
  label: Dermatologic event flag
  derivation:
    case:
    - when: FIRST_DERM.AESEQ IS NOT NULL
      then: '''Y'''
    - otherwise: '''N'''
- name: ADT
  type: date
  label: Analysis Date
  derivation:
    case:
    - when: HAS_EVENT = 'Y'
      then: FIRST_DERM.ASTDT
    - otherwise: ADSL.RFENDT
  submission:
    mandatory: false
    data_type: integer
    length: 8
    display_format: DATE9.
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADTTE.ADT
      type: Computation
      description: if ADAE.ASTDT is not missing and occurred after TRTSDT then ADAE.ASTDT
        else convert ADSL.RFENDTC to a SAS numeric date
- name: AVAL
  type: float
  label: Analysis Value
  derivation:
    diff:
      type: date
      start: STARTDT
      end: ADT
      unit: day
      closed: both
  submission:
    mandatory: false
    data_type: integer
    length: 8
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADTTE.AVAL
      type: Computation
      description: ADT-STARTDT+1
- name: CNSR
  type: float
  label: Censor
  derivation:
    case:
    - when: HAS_EVENT = 'Y'
      then: 0
    - otherwise: 1
  submission:
    mandatory: false
    data_type: integer
    length: 8
    codelist: CENSOR
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADTTE.CNSR
      type: Computation
      description: if ADAE.TRTEMFL ="Y" then CNSR=0, else CNSR=1
- name: EVNTDESC
  type: str
  label: Event or Censoring Description
  derivation:
    case:
    - when: HAS_EVENT = 'Y'
      then: '''Dematologic Event Occured'''
    - otherwise: '''Study Completion Date'''
  submission:
    mandatory: false
    data_type: text
    length: 25
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADTTE.EVNTDESC
      type: Computation
      description: if ADTTE.CNSR = 0 then "Dematologic Event Occured", else if ADTTE.CNSR
        =1 then "Study Completion Date"
- name: SRCDOM
  type: str
  label: Source Data
  derivation:
    case:
    - when: HAS_EVENT = 'Y'
      then: '''ADAE'''
    - otherwise: '''ADSL'''
  submission:
    mandatory: false
    data_type: text
    length: 4
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADTTE.SRCDOM
      type: Computation
      description: The Source domain referred to in order to populate ADT (either
        ADAE or ADSL)
- name: SRCVAR
  type: str
  label: Source Variable
  derivation:
    case:
    - when: HAS_EVENT = 'Y'
      then: '''ASTDT'''
    - otherwise: '''RFENDT'''
  submission:
    mandatory: false
    data_type: text
    length: 6
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADTTE.SRCVAR
      type: Computation
      description: The Source variable referred to in order to populate ADT (either
        ASTDT or RFENDT)
- name: SRCSEQ
  type: float
  label: Source Sequence Number
  derivation: FIRST_DERM.AESEQ
  submission:
    mandatory: false
    data_type: integer
    length: 8
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADTTE.SRCSEQ
      type: Computation
      description: The value of ADAE.AESEQ if SRCDOM=ADAE, otherwise null.
- name: SAFFL
  type: str
  label: Safety Population Flag
  derivation: ADSL.SAFFL
  submission:
    mandatory: false
    data_type: text
    length: 1
    codelist: YN
    origins:
    - type: Predecessor
      description: ADSL.SAFFL
rows:
- id: all-subjects
  dataset: ADSL
  derivations: {}
submission:
  mode: historical
  artifact: adtte.json
  has_no_data: false
  label: AE Time To 1st Derm. Event Analysis
  class: BASIC DATA STRUCTURE
  structure: one record per subject per parameter
  repeating: true
  reference_data: false
  non_standard: false
