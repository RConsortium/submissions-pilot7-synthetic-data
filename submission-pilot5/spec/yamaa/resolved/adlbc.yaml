yamaa: '1.0'
type: spec
model: ADaM
domain: ADLBC
keys:
- STUDYID
- USUBJID
- PARAMCD
- LBSEQ
- AVISIT
input:
  LB:
    path: ../../../data/sdtm/lb.parquet
    relative_to: entry
    empty_string: present
  ADSL:
    path: ../../../data/adam/adsl-yamaa.parquet
    relative_to: entry
    schema: adsl.yaml
    empty_string: present
base: LB
output:
  path: ../../../data/adam/adlbc-yamaa.parquet
  relative_to: entry
  columns:
  - STUDYID
  - SUBJID
  - USUBJID
  - TRTP
  - TRTPN
  - TRTA
  - TRTAN
  - TRTSDT
  - TRTEDT
  - AGE
  - AGEGR1
  - AGEGR1N
  - RACE
  - RACEN
  - SEX
  - COMP24FL
  - DSRAEFL
  - SAFFL
  - AVISIT
  - AVISITN
  - ADY
  - ADT
  - VISIT
  - VISITNUM
  - PARAM
  - PARAMCD
  - PARAMN
  - PARCAT1
  - AVAL
  - BASE
  - CHG
  - A1LO
  - A1HI
  - R2A1LO
  - R2A1HI
  - BR2A1LO
  - BR2A1HI
  - ANL01FL
  - ALBTRVAL
  - ANRIND
  - BNRIND
  - ABLFL
  - AENTMTFL
  - LBSEQ
  - LBNRIND
  - LBSTRESN
intermediates:
- id: ADSL_SBJ
  dataset: ADSL
  key:
  - USUBJID
columns:
- name: STUDYID
  type: str
  label: Study Identifier
  submission:
    mandatory: false
    data_type: text
    length: 12
    origins:
    - type: Predecessor
      description: ADSL.STUDYID
- name: USUBJID
  type: str
  label: Unique Subject Identifier
  submission:
    key_sequence: 1
    mandatory: false
    data_type: text
    length: 11
    origins:
    - type: Predecessor
      description: ADSL.USUBJID
- name: SUBJID
  type: str
  label: Subject Identifier for the Study
  derivation: ADSL_SBJ.SUBJID
  submission:
    mandatory: false
    data_type: text
    length: 4
    origins:
    - type: Predecessor
      description: ADSL.SUBJID
- name: TRTP
  type: str
  label: Planned Treatment
  derivation: ADSL_SBJ.TRT01P
  submission:
    mandatory: false
    data_type: text
    length: 20
    codelist: ARM
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADLBC.TRTP
      type: Computation
      description: ADSL.TRT01P
- name: TRTPN
  type: float
  label: Planned Treatment (N)
  derivation: ADSL_SBJ.TRT01PN
  submission:
    mandatory: false
    data_type: integer
    length: 8
    codelist: ARMN
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADLBC.TRTPN
      type: Computation
      description: ADSL.TRT01PN
- name: TRTA
  type: str
  label: Actual Treatment
  derivation: ADSL_SBJ.TRT01A
  submission:
    mandatory: false
    data_type: text
    length: 20
    codelist: ARM
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADLBC.TRTA
      type: Computation
      description: ADSL.TRT01A
- name: TRTAN
  type: float
  label: Actual Treatment (N)
  derivation: ADSL_SBJ.TRT01AN
  submission:
    mandatory: false
    data_type: integer
    length: 8
    codelist: ARMN
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADLBC.TRTAN
      type: Computation
      description: ADSL.TRT01AN
- name: TRTSDT
  type: date
  label: Date of First Exposure to Treatment
  derivation: ADSL_SBJ.TRTSDT
  submission:
    mandatory: false
    data_type: integer
    length: 8
    display_format: DATE9.
    origins:
    - type: Predecessor
      description: ADSL.TRTSDT
- name: TRTEDT
  type: date
  label: Date of Last Exposure to Treatment
  derivation: ADSL_SBJ.TRTEDT
  submission:
    mandatory: false
    data_type: integer
    length: 8
    display_format: DATE9.
    origins:
    - type: Predecessor
      description: ADSL.TRTEDT
- name: AGE
  type: float
  label: Age
  derivation: ADSL_SBJ.AGE
  submission:
    mandatory: false
    data_type: integer
    length: 8
    origins:
    - type: Predecessor
      description: ADSL.AGE
- name: AGEGR1
  type: str
  label: Pooled Age Group 1
  derivation: ADSL_SBJ.AGEGR1
  submission:
    mandatory: false
    data_type: text
    length: 5
    codelist: AGEGR1
    origins:
    - type: Predecessor
      description: ADSL.AGEGR1
- name: AGEGR1N
  type: float
  label: Pooled Age Group 1 (N)
  derivation: ADSL_SBJ.AGEGR1N
  submission:
    mandatory: false
    data_type: integer
    length: 8
    codelist: AGEGR1N
    origins:
    - type: Predecessor
      description: ADSL.AGEGR1N
- name: RACE
  type: str
  label: Race
  derivation: ADSL_SBJ.RACE
  submission:
    mandatory: false
    data_type: text
    length: 32
    codelist: RACE
    origins:
    - type: Predecessor
      description: ADSL.RACE
- name: RACEN
  type: float
  label: Race (N)
  derivation: ADSL_SBJ.RACEN
  submission:
    mandatory: false
    data_type: integer
    length: 8
    codelist: RACEN
    origins:
    - type: Predecessor
      description: ADSL.RACEN
- name: SEX
  type: str
  label: Sex
  derivation: ADSL_SBJ.SEX
  submission:
    mandatory: false
    data_type: text
    length: 1
    codelist: SEX
    origins:
    - type: Predecessor
      description: ADSL.SEX
- name: COMP24FL
  type: str
  label: Completers of Week 24 Population Flag
  derivation: ADSL_SBJ.COMP24FL
  submission:
    mandatory: false
    data_type: text
    length: 1
    codelist: YN
    origins:
    - type: Predecessor
      description: ADSL.COM01P24FL
- name: DSRAEFL
  type: str
  label: Discontinued due to AE?
  derivation: ADSL_SBJ.DSRAEFL
  submission:
    mandatory: false
    data_type: text
    length: 1
    codelist: YN
    origins:
    - type: Predecessor
      description: ADSL.DSR01AEFL
- name: SAFFL
  type: str
  label: Safety Population Flag
  derivation: ADSL_SBJ.SAFFL
  submission:
    mandatory: false
    data_type: text
    length: 1
    codelist: YN
    origins:
    - type: Predecessor
      description: ADSL.SAF01FL
- name: _IS_EOT
  type: str
  label: 'Working value: _IS_EOT'
- name: _LBDTM_TXT
  type: str
  label: 'Working value: _LBDTM_TXT'
- name: _LBDTM
  type: datetime
  label: 'Working value: _LBDTM'
- name: _ADT_DATE
  type: date
  label: 'Working value: _ADT_DATE'
- name: _AVAL_BASE
  type: float
  label: 'Working value: _AVAL_BASE'
- name: _LBCAT
  type: str
  label: 'Working value: _LBCAT'
- name: _VISIT_RAW
  type: str
  label: 'Working value: _VISIT_RAW'
- name: _LBBLFL
  type: str
  label: 'Working value: _LBBLFL'
- name: _LBTESTCD
  type: str
  label: 'Working value: _LBTESTCD'
- name: _PARAM_BASE
  type: str
  label: 'Working value: _PARAM_BASE'
- name: _PARAMN_BASE
  type: float
  label: 'Working value: _PARAMN_BASE'
- name: ABLFL
  type: str
  label: Baseline Record Flag
  submission:
    mandatory: false
    data_type: text
    length: 1
    origins:
    - type: Predecessor
      description: LB.LBBLFL
- name: _BASELINE_AVAL
  type: float
  label: 'Working value: _BASELINE_AVAL'
- name: AVISIT
  type: str
  label: Analysis Visit
  submission:
    key_sequence: 3
    mandatory: false
    data_type: text
    length: 16
    codelist: AVISIT
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADLBC.AVISIT
      type: Computation
      description: 'Last observed value for this lab parameter during treatment phase:
        ''Y'' if VISITNUM=12, if subject discontinues prior to VISIT 12, then this
        variable is set to ''Y'' if this is the last assessment of this analyte for
        the subject'
- name: AVISITN
  type: float
  label: Analysis Visit (N)
  submission:
    mandatory: false
    data_type: integer
    length: 8
    codelist: AVISITN
    origins:
    - type: Assigned
- name: _RANK_AVISITN
  type: float
  label: 'Working value: _RANK_AVISITN'
- name: ADY
  type: float
  label: Analysis Relative Day
  derivation:
    study_day:
      source: _ADT_DATE
      reference: TRTSDT
  submission:
    mandatory: false
    data_type: integer
    length: 8
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADLBC.ADY
      type: Computation
      description: LB.LBDY
- name: ADT
  type: date
  label: Analysis Date
  derivation: _ADT_DATE
  submission:
    mandatory: false
    data_type: integer
    length: 8
    display_format: DATE9.
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADLBC.ADT
      type: Computation
      description: LB.LBDTC
- name: VISIT
  type: str
  label: Visit Name
  submission:
    mandatory: false
    data_type: text
    length: 19
    codelist: VISIT
    origins:
    - type: Predecessor
      description: LB.VISIT
- name: VISITNUM
  type: float
  label: Visit Number
  submission:
    mandatory: false
    data_type: float
    length: 8
    significant_digits: 1
    codelist: VISITNUM
    origins:
    - type: Predecessor
      description: LB.VISITNUM
- name: PARAM
  type: str
  label: Parameter
  derivation: _PARAM_BASE
  submission:
    mandatory: false
    data_type: text
    length: 100
    codelist: PARAM_ADLBC
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADLBC.PARAM
      type: Computation
      description: Concatenated LB.LBTEST, '(', LB.LBSTRESU and ')'
- name: PARAMCD
  type: str
  label: Parameter Code
  submission:
    key_sequence: 2
    mandatory: false
    data_type: text
    length: 8
    codelist: PARAMCD_ADLBC
    origins:
    - type: Predecessor
      description: LB.TESTCD
- name: PARAMN
  type: float
  label: Parameter (N)
  derivation: _PARAMN_BASE
  submission:
    mandatory: false
    data_type: integer
    length: 8
    codelist: PARAMN_ADLBC
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADLBC.PARAMN
      type: Computation
      description: Numeric code for Parameter
- name: PARCAT1
  type: str
  label: Parameter Category 1
  derivation: '''CHEM'''
  submission:
    mandatory: false
    data_type: text
    length: 5
    codelist: ADLBCAT
    origins:
    - type: Assigned
- name: AVAL
  type: float
  label: Analysis Value
  derivation: _AVAL_BASE
  submission:
    mandatory: false
    data_type: float
    length: 8
    significant_digits: 5
    origins:
    - type: Predecessor
      description: LB.LBSTRESN
- name: A1LO
  type: float
  label: Analysis Range 1 Lower Limit
  submission:
    mandatory: false
    data_type: float
    length: 8
    significant_digits: 5
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADLBC.A1LO
      type: Computation
      description: LB.LBSTNRLO
- name: _T2
  type: float
  label: 'Working value: _T2'
- name: _R2A1LO_R
  type: float
  label: 'Working value: _R2A1LO_R'
- name: A1HI
  type: float
  label: Analysis Range 1 Upper Limit
  submission:
    mandatory: false
    data_type: float
    length: 8
    significant_digits: 5
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADLBC.A1HI
      type: Computation
      description: LB.LBSTNRHI
- name: _T1
  type: float
  label: 'Working value: _T1'
- name: _R2A1HI_R
  type: float
  label: 'Working value: _R2A1HI_R'
- name: _ANRIND_BASE
  type: str
  label: 'Working value: _ANRIND_BASE'
- name: _BASELINE_ANRIND
  type: str
  label: 'Working value: _BASELINE_ANRIND'
- name: ALBTRVAL
  type: float
  label: Amount Threshold Range
  submission:
    mandatory: false
    data_type: float
    length: 8
    significant_digits: 3
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADLBC.ALBTRVAL
      type: Computation
      description: Maximum of [LBSTRESN-(1.5*ULN)] and [(.5*LLN) - LBSTRESN]
- name: _RANK_VAL
  type: float
  label: 'Working value: _RANK_VAL'
  derivation: ALBTRVAL
- name: R2A1LO
  type: float
  label: Ratio to Analysis Range 1 Lower Limit
  derivation: _AVAL_BASE / A1LO
  submission:
    mandatory: false
    data_type: float
    length: 8
    significant_digits: 1
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADLBC.R2A1LO
      type: Computation
      description: AVAL / A1LO
- name: R2A1HI
  type: float
  label: Ratio to Analysis Range 1 Upper Limit
  derivation: _AVAL_BASE / A1HI
  submission:
    mandatory: false
    data_type: float
    length: 8
    significant_digits: 1
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADLBC.R2A1HI
      type: Computation
      description: AVAL / A1HI
- name: ANRIND
  type: str
  label: Analysis Reference Range Indicator
  derivation: _ANRIND_BASE
  submission:
    mandatory: false
    data_type: text
    length: 1
    codelist: LNH
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADLBC.ANRIND
      type: Computation
      description: if AVAL < [0.5*LBSTNRLO) then ANRIND = 'Y' else if AVAL > [0.5*LBSTRNHI),'H','N'
- name: LBSEQ
  type: float
  label: Sequence Number
  submission:
    key_sequence: 4
    mandatory: false
    data_type: integer
    length: 8
    origins:
    - type: Predecessor
      description: LB.LBSEQ
- name: _PNM_BASE
  type: float
  label: 'Working value: _PNM_BASE'
- name: _BASE
  type: float
  label: 'Working value: _BASE'
- name: _IS_LAST_ELIGIBLE
  type: int
  label: 'Working value: _IS_LAST_ELIGIBLE'
- name: _PNM_BNRIND
  type: str
  label: 'Working value: _PNM_BNRIND'
- name: _BNRIND_VAL
  type: str
  label: 'Working value: _BNRIND_VAL'
- name: _ANL01_RANK
  type: int
  label: 'Working value: _ANL01_RANK'
  derivation:
    rank:
      method: competition
      window:
        group_by:
        - USUBJID
        - PARAMCD
        order_by:
        - variable: _RANK_VAL
          direction: desc
          nulls: last
        - variable: _RANK_AVISITN
          direction: asc
          nulls: last
        - variable: _ADT_DATE
          direction: asc
          nulls: last
        - variable: LBSEQ
          direction: asc
          nulls: last
        filter: _RANK_AVISITN >= 2 AND _RANK_AVISITN <= 24
- name: BASE
  type: float
  label: Baseline Value
  derivation: _BASE
  submission:
    mandatory: false
    data_type: float
    length: 8
    significant_digits: 5
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADLBC.BASE
      type: Computation
      description: LB.LBSTNRHI
- name: CHG
  type: float
  label: Change from Baseline
  derivation:
    case:
    - when: ABLFL = 'Y'
      then: null
    - otherwise: _AVAL_BASE - _BASE
  submission:
    mandatory: false
    data_type: float
    length: 8
    significant_digits: 5
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADLBC.CHG
      type: Computation
      description: AVAL - BASE
- name: BR2A1LO
  type: float
  label: Base Ratio to Analysis Range 1 Lower Lim
  derivation: _BASE / A1LO
  submission:
    mandatory: false
    data_type: float
    length: 8
    significant_digits: 1
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADLBC.BR2A1LO
      type: Computation
      description: AVAL / A1LO at baseline
- name: BR2A1HI
  type: float
  label: Base Ratio to Analysis Range 1 Upper Lim
  derivation: _BASE / A1HI
  submission:
    mandatory: false
    data_type: float
    length: 8
    significant_digits: 1
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADLBC.BR2A1HI
      type: Computation
      description: AVAL / A1HI at baseline
- name: ANL01FL
  type: str
  label: Analysis Flag 01
  derivation:
    case:
    - when: _ANL01_RANK = 1 AND _RANK_VAL IS NOT NULL
      then: '''Y'''
    - otherwise: ''''''
  submission:
    mandatory: false
    data_type: text
    length: 1
    origins:
    - type: Assigned
    method:
      name: Algorithm to derive ADLBC.ANL01FL
      type: Computation
      description: If ALBTRVAL = max(ALBTRVAL) then ANL01FL is 'Y'
- name: BNRIND
  type: str
  label: Baseline Reference Range Indicator
  derivation:
    case:
    - when: _BNRIND_VAL IS NULL
      then: ''''''
    - otherwise: _BNRIND_VAL
  submission:
    mandatory: false
    data_type: text
    length: 1
    codelist: LNH
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADLBC.BNRIND
      type: Computation
      description: if BASE < [0.5*LBSTNRLO) then ANRIND = 'Y' else if BASE > [0.5*LBSTRNHI),'H','N'
- name: AENTMTFL
  type: str
  label: Last value in treatment visit
  derivation:
    case:
    - when: _IS_EOT = 'Y'
      then: '''Y'''
    - when: _IS_LAST_ELIGIBLE = 1
      then: '''Y'''
    - otherwise: ''''''
  submission:
    mandatory: false
    data_type: text
    length: 1
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADLBC.AENTMTFL
      type: Computation
      description: 'Last observed value for this lab parameter during treatment phase:
        ''Y'' if VISITNUM=12, if subject discontinues prior to VISIT 12, then this
        variable is set to ''Y'' if this is the last assessment of this analyte for
        the subject'
- name: LBNRIND
  type: str
  label: Reference Range Indicator
  submission:
    mandatory: false
    data_type: text
    length: 8
    codelist: LBNRIND
    origins:
    - type: Predecessor
      description: LB.LBNRIND
- name: LBSTRESN
  type: float
  label: Numeric Result/Finding in Standard Units
  submission:
    mandatory: false
    data_type: float
    length: 8
    significant_digits: 5
    origins:
    - type: Predecessor
      description: LB.LBSTRESN
rows:
- id: base-ord
  dataset: LB
  filter: LB.LBCAT = 'CHEMISTRY' AND LB.VISIT NOT IN ('RETRIEVAL', 'AMBUL ECG REMOVAL')
  derivations:
    STUDYID: LB.STUDYID
    USUBJID: LB.USUBJID
    PARAMCD: LB.LBTESTCD
    _IS_EOT: ''''''
    VISIT: LB.VISIT
    VISITNUM:
      round_half_away_from_zero:
        source: LB.VISITNUM
        digits: 1
    LBSEQ: LB.LBSEQ
    LBNRIND: LB.LBNRIND
    LBSTRESN: LB.LBSTRESN
    A1LO: LB.LBSTNRLO
    A1HI: LB.LBSTNRHI
    _LBDTM_TXT: LB.LBDTC
    _LBDTM:
      impute:
        type: datetime
        source: _LBDTM_TXT
        time: first
        invalid: null
    _ADT_DATE:
      to_date:
        source: _LBDTM
    AVISIT:
      case:
      - when: LB.VISIT = 'SCREENING 1'
        then: '''Baseline'''
      - when: LB.VISIT = 'WEEK 2'
        then: '''Week 2'''
      - when: LB.VISIT = 'WEEK 4'
        then: '''Week 4'''
      - when: LB.VISIT = 'WEEK 6'
        then: '''Week 6'''
      - when: LB.VISIT = 'WEEK 8'
        then: '''Week 8'''
      - when: LB.VISIT = 'WEEK 12'
        then: '''Week 12'''
      - when: LB.VISIT = 'WEEK 16'
        then: '''Week 16'''
      - when: LB.VISIT = 'WEEK 20'
        then: '''Week 20'''
      - when: LB.VISIT = 'WEEK 24'
        then: '''Week 24'''
      - when: LB.VISIT = 'WEEK 26'
        then: '''Week 26'''
      - otherwise: ''''''
    AVISITN:
      case:
      - when: LB.VISIT = 'SCREENING 1'
        then: 0.0
      - when: LB.VISIT = 'WEEK 2'
        then: 2.0
      - when: LB.VISIT = 'WEEK 4'
        then: 4.0
      - when: LB.VISIT = 'WEEK 6'
        then: 6.0
      - when: LB.VISIT = 'WEEK 8'
        then: 8.0
      - when: LB.VISIT = 'WEEK 12'
        then: 12.0
      - when: LB.VISIT = 'WEEK 16'
        then: 16.0
      - when: LB.VISIT = 'WEEK 20'
        then: 20.0
      - when: LB.VISIT = 'WEEK 24'
        then: 24.0
      - when: LB.VISIT = 'WEEK 26'
        then: 26.0
      - otherwise: null
    ABLFL:
      case:
      - when: LB.LBBLFL = 'Y'
        then: '''Y'''
      - otherwise: ''''''
    _PARAM_BASE:
      mapping:
        source: LB.LBTESTCD
        dict:
          SODIUM: Sodium (mmol/L)
          K: Potassium (mmol/L)
          CL: Chloride (mmol/L)
          BILI: Bilirubin (umol/L)
          ALP: Alkaline Phosphatase (U/L)
          GGT: Gamma Glutamyl Transferase (U/L)
          ALT: Alanine Aminotransferase (U/L)
          AST: Aspartate Aminotransferase (U/L)
          BUN: Blood Urea Nitrogen (mmol/L)
          CREAT: Creatinine (umol/L)
          URATE: Urate (umol/L)
          PHOS: Phosphate (mmol/L)
          CA: Calcium (mmol/L)
          GLUC: Glucose (mmol/L)
          PROT: Protein (g/L)
          ALB: Albumin (g/L)
          CHOL: Cholesterol (mmol/L)
          CK: Creatine Kinase (U/L)
        case_sensitive: true
        unmapped: null
    _PARAMN_BASE:
      mapping:
        source: LB.LBTESTCD
        dict:
          SODIUM: 18.0
          K: 19.0
          CL: 20.0
          BILI: 21.0
          ALP: 22.0
          GGT: 23.0
          ALT: 24.0
          AST: 25.0
          BUN: 26.0
          CREAT: 27.0
