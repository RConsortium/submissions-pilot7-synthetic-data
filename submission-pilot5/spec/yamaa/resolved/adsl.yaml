        name: DURDIS_DAYS
        type: float
      - derivation:
          value: FLOOR(DURDIS_DAYS / 30.4375 * 10 + 0.5) / 10
        label: Duration of Disease (Months)
        name: DURDIS
        submission:
          data_type: float
          length: 8
          mandatory: false
          method:
            description: number of months between VISIT1DT and DISONSET
            name: Algorithm to derive ADSL.DURDIS
            type: Computation
          origins:
          - type: Derived
          significant_digits: 1
        type: float
      - derivation:
          value:
            case:
            - then: '''<12'''
              when: DURDIS < 12
            - otherwise: '''>=12'''
        label: Pooled Disease Duration Group 1
        name: DURDSGR1
        submission:
          codelist: DURDISC
          data_type: text
          length: 4
          mandatory: false
          method:
            description: grouping DURDIS values as <12 and >=12
            name: Algorithm to derive ADSL.DURDSGR1
            type: Computation
          origins:
          - type: Derived
        type: str
      - derivation:
          value: DS_DISP.VISITNUM
        label: Disposition visit number
        name: DS_VISITNUM
        type: float
      - derivation:
          value:
            case:
            - then: 12
              when: DS_VISITNUM = 13
            - otherwise: DS_VISITNUM
        label: End of Trt Visit (Vis 12 or Early Term.)
        name: VISNUMEN
        submission:
          data_type: integer
          length: 8
          mandatory: false
          method:
            description: if DS.VISITNUM=13 where DSTERM='PROTCOL COMPLETED' then VISNUMEN=12,
              otherwise VISNUMEN=DS.VISITNUM where DSTERM='PROTCOL COMPLETED'
            name: Algorithm to derive ADSL.VISNUMEN
            type: Computation
          origins:
          - type: Derived
        type: float
      - derivation:
          value:
            aggregate:
              expr: SUM(QS.QSSTRESN)
              filter: QS.QSCAT = 'MINI-MENTAL STATE'
              key:
              - STUDYID
              - USUBJID
        label: MMSE Total
        name: MMSETOT
        submission:
          data_type: integer
          length: 8
          mandatory: false
          method:
            description: sum of QS.QSORRES values for the subject when QSCAT = MINI-MENTAL
              STATE
            name: Algorithm to derive ADSL.MMSETOT
            type: Computation
          origins:
          - type: Derived
        type: float
      - derivation:
          value: TRTDUR
        label: Total Treatment Duration (Days)
        name: TRTDURD
        submission:
          data_type: integer
          length: 8
          mandatory: false
          method:
            description: TRTEDT-TRTSDT+1
            name: Algorithm to derive ADSL.TRTDUR
            type: Computation
          origins:
          - type: Derived
        type: float
      - derivation:
          value:
            case:
            - then: '''COMPLETED'''
              when: DCDECOD = 'COMPLETED'
            - otherwise: '''DISCONTINUED'''
        label: End of Study Status
        name: EOSSTT
        submission:
          data_type: text
          length: 12
          mandatory: false
          method:
            description: COMPLETED if ADSL.DCDECOD='COMPLETED'. DISCONTINUED if ADSL.DCDECOD
              not equal to COMPLETED.
            name: Algorithm to derive ADSL.EOSSTT
            type: Computation
          origins:
          - type: Derived
        type: str
      - derivation:
          value:
            case:
            - then: ''''''
              when: DCREASCD = 'Completed'
            - otherwise: DCREASCD
        label: Reason for Discontinuation from Study
        name: DCSREAS
        submission:
          codelist: DISCREAS
          data_type: text
          length: 18
          mandatory: false
          method:
            description: Grouping of DCDECOD values to support summarizing study completion
              status and reason for discontinuation
            name: Algorithm to derive ADSL.DCREASCD
            type: Computation
          origins:
          - type: Derived
        type: str
