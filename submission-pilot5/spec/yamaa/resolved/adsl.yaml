              1st dosing interval (i.e., visit4date-TRTSTDT+1 if 1st interval completed,
              TRTEDT-TRTSTDT+1 if subj discontinued <=visit 4 and > visit 3), 81mg
              per day for the # of days subj was in 2nd dosing interval (i.e., visit12date-visit4date
              if 2nd interval completed, TRTEDT-visit4date if subj discontinued <=
              visit 12 and > visit 4), and 54mg per day for the # of days subj was
              in 3rd dosing interval (i.e., TRTEDT - visit12date if subj continued
