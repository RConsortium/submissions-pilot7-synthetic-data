yamaa: '1.0'
type: spec
model: ADaM
domain: ADAE
keys:
- STUDYID
- USUBJID
- AESEQ
input:
  AE:
    path: ../../../data/sdtm/ae.parquet
    relative_to: entry
    empty_string: present
  ADSL:
    path: ../../../data/adam/adsl-yamaa.parquet
    relative_to: entry
    schema: adsl.yaml
    empty_string: present
base: AE
output:
  path: ../../../data/adam/adae-yamaa.parquet
  relative_to: entry
  columns:
  - STUDYID
  - SITEID
  - USUBJID
  - TRTA
  - TRTAN
  - AGE
  - AGEGR1
  - AGEGR1N
  - RACE
  - RACEN
  - SEX
  - SAFFL
  - TRTSDT
  - TRTEDT
  - ASTDT
  - ASTDTF
  - ASTDY
  - AENDT
  - AENDY
  - ADURN
  - ADURU
  - AETERM
  - AELLT
  - AELLTCD
  - AEDECOD
  - AEPTCD
  - AEHLT
  - AEHLTCD
  - AEHLGT
  - AEHLGTCD
  - AEBODSYS
  - AESOC
  - AESOCCD
  - AESEV
  - AESER
  - AESCAN
  - AESCONG
  - AESDISAB
  - AESDTH
  - AESHOSP
  - AESLIFE
  - AESOD
  - AEREL
  - AEACN
  - AEOUT
  - AESEQ
  - TRTEMFL
  - AOCCFL
  - AOCCSFL
  - AOCCPFL
  - AOCC02FL
  - AOCC03FL
  - AOCC04FL
  - CQ01NAM
  - AOCC01FL
intermediates:
- id: ADSL_SBJ
  dataset: ADSL
  key:
  - STUDYID
  - USUBJID
  order_by:
  - variable: ADSL.USUBJID
    direction: asc
    nulls: last
  keep: first
columns:
- name: STUDYID
  type: str
  label: Study Identifier
  derivation: AE.STUDYID
  submission:
    mandatory: false
    data_type: text
    length: 12
    origins:
    - type: Predecessor
      description: ADSL.STUDYID
- name: USUBJID
  type: str
  label: Unique Subject Identifier
  derivation: AE.USUBJID
  submission:
    key_sequence: 1
    mandatory: false
    data_type: text
    length: 11
    origins:
    - type: Predecessor
      description: ADSL.USUBJID
- name: SITEID
  type: str
  label: Study Site Identifier
  derivation: ADSL_SBJ.SITEID
  submission:
    mandatory: false
    data_type: text
    length: 3
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADAE.SITEID
      type: Computation
      description: ADSL.SITEID
- name: TRTA
  type: str
  label: Actual Treatment
  derivation: ADSL_SBJ.TRT01A
  submission:
    mandatory: false
    data_type: text
    length: 20
    codelist: ARM
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADAE.TRTA
      type: Computation
      description: ADSL.TRT01A
- name: TRTAN
  type: float
  label: Actual Treatment (N)
  derivation: ADSL_SBJ.TRT01AN
  submission:
    mandatory: false
    data_type: integer
    length: 8
    codelist: ARMN
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADAE.TRTAN
      type: Computation
      description: ADSL.TRT01AN
- name: AGE
  type: float
  label: Age
  derivation: ADSL_SBJ.AGE
  submission:
    mandatory: false
    data_type: integer
    length: 8
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADAE.AGE
      type: Computation
      description: ADSL.AGE
- name: AGEGR1
  type: str
  label: Pooled Age Group 1
  derivation: ADSL_SBJ.AGEGR1
  submission:
    mandatory: false
    data_type: text
    length: 5
    codelist: AGEGR1
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADAE.AGEGR1
      type: Computation
      description: ADSL.AGEGR1
- name: AGEGR1N
  type: float
  label: Pooled Age Group 1 (N)
  derivation: ADSL_SBJ.AGEGR1N
  submission:
    mandatory: false
    data_type: integer
    length: 8
    codelist: AGEGR1N
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADAE.AGEGR1N
      type: Computation
      description: ADSL.AGEGR1N
- name: RACE
  type: str
  label: Race
  derivation: ADSL_SBJ.RACE
  submission:
    mandatory: false
    data_type: text
    length: 32
    codelist: RACE
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADAE.RACE
      type: Computation
      description: ADSL.RACE
- name: RACEN
  type: float
  label: Race (N)
  derivation: ADSL_SBJ.RACEN
  submission:
    mandatory: false
    data_type: integer
    length: 8
    codelist: RACEN
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADAE.RACEN
      type: Computation
      description: ADSL.RACEN
- name: SEX
  type: str
  label: Sex
  derivation: ADSL_SBJ.SEX
  submission:
    mandatory: false
    data_type: text
    length: 1
    codelist: SEX
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADAE.SEX
      type: Computation
      description: ADSL.SEX
- name: SAFFL
  type: str
  label: Safety Population Flag
  derivation: ADSL_SBJ.SAFFL
  submission:
    mandatory: false
    data_type: text
    length: 1
    codelist: YN
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADAE.SAFFL
      type: Computation
      description: ADSL.SAFFL
- name: TRTSDT
  type: date
  label: Date of First Exposure to Treatment
  derivation: ADSL_SBJ.TRTSDT
  submission:
    mandatory: false
    data_type: integer
    length: 8
    display_format: DATE9.
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADAE.TRTSDT
      type: Computation
      description: ADSL.TRTSDT
- name: TRTEDT
  type: date
  label: Date of Last Exposure to Treatment
  derivation: ADSL_SBJ.TRTEDT
  submission:
    mandatory: false
    data_type: integer
    length: 8
    display_format: DATE9.
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADAE.TRTEDT
      type: Computation
      description: ADSL.TRTEDT
- name: ASTDT
  type: date
  label: Analysis Start Date
  derivation:
    case:
    - when: AE.AESTDTC LIKE '%-%'
      then:
        impute:
          type: date
          source: AE.AESTDTC
          month: 1
          day: 1
          invalid: null
    - otherwise: null
  submission:
    key_sequence: 3
    mandatory: false
    data_type: integer
    length: 8
    display_format: DATE9.
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADAE.ASTDT
      type: Computation
      description: AE.AESTDTC, converted to a numeric SAS date. Some events with partial
        dates are imputed in a conservative manner. If the day component is missing,
        a value of '01' is used. If both the month and day are missing no imputation
        is performed as these dates clearly indicate a start prior to the beginning
        of treatment. There are no events with completely missing start dates.
- name: ASTDTF
  type: str
  label: Analysis Start Date Imputation Flag
  derivation:
    case:
    - when: AE.AESTDTC LIKE '%-%' AND AE.AESTDTC NOT LIKE '%-%-%'
      then: '''D'''
    - otherwise: ''''''
  submission:
    mandatory: false
    data_type: text
    length: 1
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADAE.ASTDTF
      type: Computation
      description: ASTDTF='D' if the day value within the character date is imputed.
        Note that only day values needed to be imputed for this study.
- name: ASTDY_RAW
  type: float
  label: Analysis Start Day raw
  derivation:
    case:
    - when: ASTDT >= TRTSDT
      then:
        diff:
          type: date
          start: TRTSDT
          end: ASTDT
          unit: day
          closed: both
    - otherwise:
        diff:
          type: date
          start: TRTSDT
          end: ASTDT
          unit: day
          closed: right
- name: ASTDY
  type: float
  label: Analysis Start Relative Day
  derivation: ASTDY_RAW
  submission:
    mandatory: false
    data_type: integer
    length: 8
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADAE.ASTDY
      type: Computation
      description: IF ASTDT>=TRTSDT>MISSING then ASTDY=ASTDT-TRTSDT+1 Else if TRTSDT>ASTDT>MISSING
        then ASTDY=ASTDT-TRTSDT
- name: AENDT
  type: date
  label: Analysis End Date
  derivation:
    impute:
      type: date
      source: AE.AEENDTC
      month: 1
      day: 1
      invalid: null
  submission:
    mandatory: false
    data_type: integer
    length: 8
    display_format: DATE9.
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADAE.AENDT
      type: Computation
      description: AE.AEENDTC, converted to a numeric SAS date
- name: AENDY
  type: float
  label: Analysis End Relative Day
  derivation:
    study_day:
      source: AENDT
      reference: TRTSDT
  submission:
    mandatory: false
    data_type: integer
    length: 8
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADAE.AENDY
      type: Computation
      description: IF AENDT>=TRTSDT>MISSING then AENDY=AENDT-TRTSDT+1 Else if TRTSDT>AENDT>MISSING
        then AENDY=AENDT-TRTSDT
- name: ADURN
  type: float
  label: Analysis Duration (N)
  derivation:
    diff:
      type: date
      start: ASTDT
      end: AENDT
      unit: day
      closed: both
  submission:
    mandatory: false
    data_type: integer
    length: 8
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADAE.ADURN
      type: Computation
      description: ADURN=AENDT-ASTDT+1
- name: ADURU
  type: str
  label: Analysis Duration Units
  derivation:
    case:
    - when: ADURN IS NOT NULL
      then: '''DAYS'''
  submission:
    mandatory: false
    data_type: text
    length: 3
    codelist: ADURU
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADAE.ADURU
      type: Computation
      description: If ADURN is not missing then ADURU='DAYS'
- name: AETERM
  type: str
  label: Reported Term for the Adverse Event
  derivation: AE.AETERM
  submission:
    key_sequence: 2
    mandatory: false
    data_type: text
    length: 46
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADAE.AETERM
      type: Computation
      description: AE.AETERM
- name: AELLT
  type: str
  label: Lowest Level Term
  derivation: AE.AELLT
  submission:
    mandatory: false
    data_type: text
    length: 46
    codelist: ADVERSE_EVENT_DICTIONARY
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADAE.AELLT
      type: Computation
      description: AE.AELLT
- name: AELLTCD
  type: float
  label: Lowest Level Term Code
  derivation: AE.AELLTCD
  submission:
    mandatory: false
    data_type: integer
    length: 8
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADAE.AELLTCD
      type: Computation
      description: AE.AELLTCD
- name: AEDECOD
  type: str
  label: Dictionary-Derived Term
  derivation: AE.AEDECOD
  submission:
    mandatory: false
    data_type: text
    length: 46
    codelist: ADVERSE_EVENT_DICTIONARY
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADAE.AEDECOD
      type: Computation
      description: AE.AEDECOD
- name: AEPTCD
  type: float
  label: Preferred Term Code
  derivation: AE.AEPTCD
  submission:
    mandatory: false
    data_type: integer
    length: 8
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADAE.AEPTCD
      type: Computation
      description: AE.AEPTCD
- name: AEHLT
  type: str
  label: High Level Term
  derivation: AE.AEHLT
  submission:
    mandatory: false
    data_type: text
    length: 8
    codelist: ADVERSE_EVENT_DICTIONARY
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADAE.AEHLT
      type: Computation
      description: AE.AEHLT
- name: AEHLTCD
  type: float
  label: High Level Term Code
  derivation: AE.AEHLTCD
  submission:
    mandatory: false
    data_type: integer
    length: 8
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADAE.AEHLTCD
      type: Computation
      description: AE.AEHLTCD
- name: AEHLGT
  type: str
  label: High Level Group Term
  derivation: AE.AEHLGT
  submission:
    mandatory: false
    data_type: text
    length: 9
    codelist: ADVERSE_EVENT_DICTIONARY
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADAE.AEHLGT
      type: Computation
      description: AE.AEHLGT
- name: AEHLGTCD
  type: float
  label: High Level Group Term Code
  derivation: AE.AEHLGTCD
  submission:
    mandatory: false
    data_type: integer
    length: 8
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADAE.AEHLGTCD
      type: Computation
      description: AE.AEHLGTCD
- name: AEBODSYS
  type: str
  label: Body System or Organ Class
  derivation: AE.AEBODSYS
  submission:
    mandatory: false
    data_type: text
    length: 67
    codelist: ADVERSE_EVENT_DICTIONARY
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADAE.AEBODSYS
      type: Computation
      description: AE.AEBODSYS
- name: AESOC
  type: str
  label: Primary System Organ Class
  derivation: AE.AESOC
  submission:
    mandatory: false
    data_type: text
    length: 67
    codelist: ADVERSE_EVENT_DICTIONARY
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADAE.AESOC
      type: Computation
      description: AE.AESOC
- name: AESOCCD
  type: float
  label: Primary System Organ Class Code
  derivation: AE.AESOCCD
  submission:
    mandatory: false
    data_type: integer
    length: 8
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADAE.AESOCCD
      type: Computation
      description: AE.AESOCCD
- name: AESEV
  type: str
  label: Severity/Intensity
  derivation: AE.AESEV
  submission:
    mandatory: false
    data_type: text
    length: 8
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADAE.AESEV
      type: Computation
      description: AE.AESEV
- name: AESER
  type: str
  label: Serious Event
  derivation: AE.AESER
  submission:
    mandatory: false
    data_type: text
    length: 1
    codelist: YN
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADAE.AESER
      type: Computation
      description: AE.AESER
- name: AESCAN
  type: str
  label: Involves Cancer
  derivation: AE.AESCAN
  submission:
    mandatory: false
    data_type: text
    length: 1
    codelist: YN
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADAE.AESCAN
      type: Computation
      description: AE.AESCAN
- name: AESCONG
  type: str
  label: Congenital Anomaly or Birth Defect
  derivation: AE.AESCONG
  submission:
    mandatory: false
    data_type: text
    length: 1
    codelist: YN
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADAE.AESCONG
      type: Computation
      description: AE.AESCONG
- name: AESDISAB
  type: str
  label: Persist or Signif Disability/Incapacity
  derivation: AE.AESDISAB
  submission:
    mandatory: false
    data_type: text
    length: 1
    codelist: YN
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADAE.AESDISAB
      type: Computation
      description: AE.AESDISAB
- name: AESDTH
  type: str
  label: Results in Death
  derivation: AE.AESDTH
  submission:
    mandatory: false
    data_type: text
    length: 1
    codelist: YN
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADAE.AESDTH
      type: Computation
      description: AE.AESDTH
- name: AESHOSP
  type: str
  label: Requires or Prolongs Hospitalization
  derivation: AE.AESHOSP
  submission:
    mandatory: false
    data_type: text
    length: 1
    codelist: YN
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADAE.AESHOSP
      type: Computation
      description: AE.AESHOSP
- name: AESLIFE
  type: str
  label: Is Life Threatening
  derivation: AE.AESLIFE
  submission:
    mandatory: false
    data_type: text
    length: 1
    codelist: YN
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADAE.AESLIFE
      type: Computation
      description: AE.AESLIFE
- name: AESOD
  type: str
  label: Occurred with Overdose
  derivation: AE.AESOD
  submission:
    mandatory: false
    data_type: text
    length: 1
    codelist: YN
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADAE.AESOD
      type: Computation
      description: AE.AESOD
- name: AEREL
  type: str
  label: Causality
  derivation: AE.AEREL
  submission:
    mandatory: false
    data_type: text
    length: 8
    codelist: AECAUS
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADAE.AEREL
      type: Computation
      description: AE.AEREL
- name: AEACN
  type: str
  label: Action Taken with Study Treatment
  derivation: AE.AEACN
  submission:
    mandatory: false
    data_type: text
    length: 1
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADAE.AEACN
      type: Computation
      description: AE.AEACN
- name: AEOUT
  type: str
  label: Outcome of Adverse Event
  derivation: AE.AEOUT
  submission:
    mandatory: false
    data_type: text
    length: 26
    codelist: OUT
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADAE.AEOUT
      type: Computation
      description: AE.AEOUT
- name: AESEQ
  type: float
  label: Sequence Number
  derivation: AE.AESEQ
  submission:
    key_sequence: 4
    mandatory: false
    data_type: integer
    length: 8
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADAE.AESEQ
      type: Computation
      description: AE.AESEQ
- name: TRTEMFL
  type: str
  label: Treatment Emergent Analysis Flag
  derivation:
    case:
    - when: ASTDT IS NOT NULL AND TRTSDT IS NOT NULL AND ASTDT >= TRTSDT
      then: '''Y'''
    - otherwise: ''''''
  submission:
    mandatory: false
    data_type: text
    length: 1
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADAE.TRTEMFL
      type: Computation
      description: If ASTDT >= TRTSDT > . then TRTEMFL='Y'. Otherwise TRTEMFL='N'
- name: TE_RN
  type: float
  label: Row number among treatment-emergent AEs
  derivation:
    row_number:
      window:
        group_by:
        - STUDYID
        - USUBJID
        order_by:
        - variable: ASTDT
          direction: asc
          nulls: last
        - variable: AESEQ
          direction: asc
          nulls: last
        filter: TRTEMFL = 'Y'
- name: AOCCFL
  type: str
  label: 1st Occurrence within Subject Flag
  derivation:
    case:
    - when: TE_RN = 1
      then: '''Y'''
    - otherwise: ''''''
  submission:
    mandatory: false
    data_type: text
    length: 1
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADAE.AOCCFL
      type: Computation
      description: Subset to TRTEMFL='Y' and sort by Subject (USUBJID), Start Date
        (ASTDT), and Sequence Number (AESEQ) and flag the first record (set AOCCFL=?Y?)
        within each Subject
- name: TE_SOC_RN
  type: float
  label: Row number among TE AEs per SOC
  derivation:
    row_number:
      window:
        group_by:
        - STUDYID
        - USUBJID
        - AEBODSYS
        order_by:
        - variable: ASTDT
          direction: asc
          nulls: last
        - variable: AESEQ
          direction: asc
          nulls: last
        filter: TRTEMFL = 'Y'
- name: AOCCSFL
  type: str
  label: 1st Occurrence of SOC Flag
  derivation:
    case:
    - when: TE_SOC_RN = 1
      then: '''Y'''
    - otherwise: ''''''
  submission:
    mandatory: false
    data_type: text
    length: 1
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADAE.AOCCSFL
      type: Computation
      description: Subset to TRTEMFL='Y' and sort by Subject (USUBJID), System Organ
        Class (AEBODSYS), Start Date (ASTDT), and Sequence Number (AESEQ) and flag
        the first record (set AOCCSFL=?Y?) within each Subject and SOC
- name: TE_PT_RN
  type: float
  label: Row number among TE AEs per PT
  derivation:
    row_number:
      window:
        group_by:
        - STUDYID
        - USUBJID
        - AEBODSYS
        - AEDECOD
        order_by:
        - variable: ASTDT
          direction: asc
          nulls: last
        - variable: AESEQ
          direction: asc
          nulls: last
        filter: TRTEMFL = 'Y'
- name: AOCCPFL
  type: str
  label: 1st Occurrence of Preferred Term Flag
  derivation:
    case:
    - when: TE_PT_RN = 1
      then: '''Y'''
    - otherwise: ''''''
  submission:
    mandatory: false
    data_type: text
    length: 1
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADAE.AOCCPFL
      type: Computation
      description: Subset to TRTEMFL='Y' and sort by Subject (USUBJID), System Organ
        Class (AEBODSYS), Preferred Term (AEDECOD), Start Date (ASTDT), and Sequence
        Number (AESEQ) and flag the first record (set AOCCPFL=?Y?) within each Subject,
        SOC, and PT
- name: SER_RN
  type: float
  label: Row number among serious TE AEs
  derivation:
    row_number:
      window:
        group_by:
        - STUDYID
        - USUBJID
        order_by:
        - variable: ASTDT
          direction: asc
          nulls: last
        - variable: AESEQ
          direction: asc
          nulls: last
        filter: TRTEMFL = 'Y' AND AE.AESER = 'Y'
- name: AOCC02FL
  type: str
  label: 1st Occurrence 02 Flag for Serious
  derivation:
    case:
    - when: SER_RN = 1
      then: '''Y'''
    - otherwise: ''''''
  submission:
    mandatory: false
    data_type: text
    length: 1
    origins:
