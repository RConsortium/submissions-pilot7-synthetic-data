schema_version: "1.0"

domain: ADLBC

keys: [STUDYID, USUBJID, AVISIT, LBSEQ]

input:
  LB: ../data/sdtm/lb.parquet
  SUPPLB: ../data/sdtm/supplb.parquet
  ADSL: ../data/adam/adsl-yamaa.parquet

output:
  path: ../data/adam/adlbc-yamaa.parquet
  columns: [STUDYID, SUBJID, USUBJID, TRTP, TRTPN, TRTA, TRTAN, TRTSDT,
    TRTEDT, AGE, AGEGR1, AGEGR1N, RACE, RACEN, SEX, COMP24FL, DSRAEFL,
    SAFFL, AVISIT, AVISITN, ADY, ADT, VISIT, VISITNUM, PARAM, PARAMCD,
    PARAMN, PARCAT1, AVAL, BASE, CHG, A1LO, A1HI, R2A1LO, R2A1HI,
    BR2A1LO, BR2A1HI, ANL01FL, ALBTRVAL, ANRIND, BNRIND, ABLFL,
    AENTMTFL, LBSEQ, LBNRIND, LBSTRESN]

intermediates:
  - id: SUP_EP
    dataset: SUPPLB
    key: {STUDYID: LB.STUDYID, USUBJID: LB.USUBJID, IDVARVAL: LBSEQ_K}
    filter: "SUPPLB.QNAM = 'ENDPOINT'"
    no_match: null

  - id: BL
    dataset: LB
    key: {STUDYID: STUDYID, USUBJID: USUBJID, LBTESTCD: PARAMCD}
    filter: "LB.LBBLFL = 'Y'"
    no_match: null

columns:
  # Subject-level (from ADSL)
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: LB.STUDYID

  - name: SUBJID
    type: str
    label: Subject Identifier for the Study
    derivation: ADSL.SUBJID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: LB.USUBJID

  - name: TRTP
    type: str
    label: Planned Treatment
    derivation: ADSL.TRT01P

  - name: TRTPN
    type: float
    label: Planned Treatment (N)
    derivation: ADSL.TRT01PN

  - name: TRTA
    type: str
    label: Actual Treatment
    derivation: ADSL.TRT01A

  - name: TRTAN
    type: float
    label: Actual Treatment (N)
    derivation: ADSL.TRT01AN

  - name: TRTSDT
    type: date
    label: Date of First Exposure to Treatment
    derivation: ADSL.TRTSDT

  - name: TRTEDT
    type: date
    label: Date of Last Exposure to Treatment
    derivation: ADSL.TRTEDT

  - name: AGE
    type: float
    label: Age
    derivation: ADSL.AGE

  - name: AGEGR1
    type: str
    label: Pooled Age Group 1
    derivation: ADSL.AGEGR1

  - name: AGEGR1N
    type: float
    label: Pooled Age Group 1 (N)
    derivation: ADSL.AGEGR1N

  - name: RACE
    type: str
    label: Race
    derivation: ADSL.RACE

  - name: RACEN
    type: float
    label: Race (N)
    derivation: ADSL.RACEN

  - name: SEX
    type: str
    label: Sex
    derivation: ADSL.SEX

  - name: COMP24FL
    type: str
    label: Completers of Week 24 Population Flag
    derivation: ADSL.COMP24FL

  - name: DSRAEFL
    type: str
    label: Discontinued due to AE?
    derivation:
      first_available:
        sources: [ADSL.DSRAEFL]
        missing: ""

  - name: SAFFL
    type: str
    label: Safety Population Flag
    derivation: ADSL.SAFFL
  # Visit (row-template derived)
  - name: AVISIT
    type: str
    label: Analysis Visit

  - name: AVISITN
    type: float
    label: Analysis Visit (N)
  # Dates
  - name: ADT
    type: date
    label: Analysis Date
    derivation:
      str_extract:
        source: LB.LBDTC
        pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}"

  - name: ADY
    type: float
    label: Analysis Relative Day
    derivation:
      study_day:
        date: ADT
        reference: TRTSDT
  # Visit echoes
  - name: VISIT
    type: str
    label: Visit Name
    derivation: LB.VISIT

  - name: VISITNUM
    type: float
    label: Visit Number
    derivation: LB.VISITNUM
  # Parameters
  - name: PARAM
    type: str
    label: Parameter
    derivation:
      str_template:
        template: "{LB.LBTEST} ({LB.LBSTRESU})"

  - name: PARAMCD
    type: str
    label: Parameter Code
    derivation: LB.LBTESTCD

  - name: PARAMN
    type: float
    label: Parameter (N)
    derivation:
      mapping:
        source: PARAMCD
        dict:
          SODIUM: 18
          K: 19
          CL: 20
          BILI: 21
          ALP: 22
          GGT: 23
          ALT: 24
          AST: 25
          BUN: 26
          CREAT: 27
          URATE: 28
          PHOS: 29
          CA: 30
          GLUC: 31
          PROT: 32
          ALB: 33
          CHOL: 34
          CK: 35
        missing: null

  - name: PARCAT1
    type: str
    label: Parameter Category 1
    derivation: {literal: "CHEM"}
  # Values
  - name: AVAL
    type: float
    label: Analysis Value
    derivation: LB.LBSTRESN

  - name: ABLFL
    type: str
    label: Baseline Record Flag
    derivation:
      first_available:
        sources: [LB.LBBLFL]
        missing: ""

  - name: BASE
    type: float
    label: Baseline Value
    derivation: BL.LBSTRESN

  - name: CHG
    type: float
    label: Change from Baseline
    derivation:
      case:
        - when: "VISITNUM <> 1"
          then:
            compute:
              expr: "AVAL - BASE"
  # Limits
  - name: A1LO
    type: float
    label: Analysis Range 1 Lower Limit
    derivation: LB.LBSTNRLO

  - name: A1HI
    type: float
    label: Analysis Range 1 Upper Limit
    derivation: LB.LBSTNRHI

  - name: R2A1LO
    type: float
    label: Ratio to Analysis Range 1 Lower Limit
    derivation:
      compute:
        expr: "AVAL / A1LO"

  - name: R2A1HI
    type: float
    label: Ratio to Analysis Range 1 Upper Limit
    derivation:
      compute:
        expr: "AVAL / A1HI"

  - name: BR2A1LO
    type: float
    label: Base Ratio to Analysis Range 1 Lower Lim
    derivation:
      compute:
        expr: "BASE / A1LO"

  - name: BR2A1HI
    type: float
    label: Base Ratio to Analysis Range 1 Upper Lim
    derivation:
      compute:
        expr: "BASE / A1HI"
  - name: ALBTRVAL
    type: float
    label: Amount Threshold Range
    derivation:
      case:
        - when: "AVAL IS NULL OR A1LO IS NULL OR A1HI IS NULL"
          then: {literal: null}
        - otherwise:
            compute:
              expr: "GREATEST(ABS(AVAL - 1.5 * A1HI), ABS(0.5 * A1LO - AVAL))"

  # Predicates compare named values, so keep the four range thresholds.
  - name: A1LO_H
    type: float
    label: A1lo H (helper)
    derivation:
      compute:
        expr: "0.5 * A1LO"

  - name: A1HI_15
    type: float
    label: A1hi 15 (helper)
    derivation:
      compute:
        expr: "1.5 * A1HI"

  - name: ANRIND
    type: str
    label: Analysis Reference Range Indicator
    derivation:
      case:
        - when: "AVAL IS NULL"
          then: {literal: "N"}
        - when: "AVAL < A1LO_H"
          then: {literal: "L"}
        - when: "AVAL > A1HI_15"
          then: {literal: "H"}
        - when: "TRUE"
          then: {literal: "N"}

  - name: B_LO_H
    type: float
    label: B Lo H (helper)
    derivation:
      compute:
        expr: "0.5 * BL.LBSTNRLO"

  - name: B_HI_15
    type: float
    label: B Hi 15 (helper)
    derivation:
      compute:
        expr: "1.5 * BL.LBSTNRHI"

  - name: BNRIND
    type: str
    label: Baseline Reference Range Indicator
    derivation:
      case:
        - when: "BASE IS NULL"
          then: {literal: ""}
        - when: "BASE < B_LO_H"
          then: {literal: "L"}
        - when: "BASE > B_HI_15"
          then: {literal: "H"}
        - when: "TRUE"
          then: {literal: "N"}
  # Flags
  - name: IS_UNSCHED
    type: str
    label: Unscheduled visit (helper)

  - name: RK_ANL
    type: int
    label: Rk Anl (helper)
    derivation:
      rank:
        method: dense
        window:
          group_by: [STUDYID, USUBJID, PARAMCD]
          order_by:
            - variable: ALBTRVAL
              direction: desc
            - variable: LBSEQ
              direction: asc
          filter: "VISITNUM >= 4 AND VISITNUM <= 12 AND IS_UNSCHED IS NULL AND ALBTRVAL IS NOT NULL"

  - name: ANL01FL
    type: str
    label: Analysis Flag 01
    derivation:
      case:
        - when: "RK_ANL = 1"
          then: {literal: "Y"}
        - when: "TRUE"
          then: {literal: ""}

  - name: RK_ENT
    type: int
    label: Rk Ent (helper)
    derivation:
      rank:
        method: dense
        window:
          group_by: [STUDYID, USUBJID, PARAMCD]
          order_by:
            - variable: AVISITN
              direction: desc
          filter: "AVISITN > 0 AND AVISITN < 99 AND IS_UNSCHED IS NULL AND VISITNUM <= 12"

  - name: AENTMTFL
    type: str
    label: Last value in treatment visit
    derivation:
      case:
        - when: "AVISITN = 99 OR RK_ENT = 1"
          then: {literal: "Y"}
        - when: "TRUE"
          then: {literal: ""}
  # Record identifiers
  - name: LBSEQ
    type: float
    label: Sequence Number
    derivation: LB.LBSEQ

  - name: LBNRIND
    type: str
    label: Reference Range Indicator
    derivation:
      first_available:
        sources: [LB.LBNRIND]
        missing: ""

  - name: LBSTRESN
    type: float
    label: Numeric Result/Finding in Standard Units
    derivation: LB.LBSTRESN

  # Row-template internals (derived in every template)
  # SUPPLB.IDVARVAL is text, so format the numeric LBSEQ before matching.
  - name: LBSEQ_S
    type: str
    label: Sequence number as text (helper)

  - name: LBSEQ_PAD
    type: str
    label: Lbseq Pad (helper)

  - name: LBSEQ_K
    type: str
    label: Lbseq K (helper)

  - name: ENDPOINT
    type: str
    label: Endpoint (helper)

  - name: SRC_AVISITN
    type: float
    label: Src Avisitn (helper)

  - name: EOT_IND
    type: int
    label: Eot Ind (helper)

  - name: VIS_OK
    type: str
    label: Vis Ok (helper)

  - name: E2_VN
    type: float
    label: E2 Vn (helper)

  - name: E2_SEQ
    type: float
    label: E2 Seq (helper)

  - name: RN2
    type: int
    label: Rn2 (helper)

  - name: EOT_LBCAT
    type: str
    label: Eot Lbcat (helper)

rows:
  - id: main
    dataset: LB
    filter: "LB.LBCAT = 'CHEMISTRY' AND (LB.VISIT LIKE '%WEEK%' OR LB.VISIT LIKE '%UNSCHEDULED%' OR LB.VISIT LIKE '%SCREENING%')"
    derivations:
      AVISIT:
        case:
          - when: "LB.LBBLFL = 'Y'"
            then: {literal: "Baseline"}
          - when: "IS_UNSCHED IS NOT NULL"
            then: {literal: ""}
          - when: "TRUE"
            then:
              mapping:
                source: LB.VISIT
                dict: {"WEEK 2": "Week 2", "WEEK 4": "Week 4", "WEEK 6": "Week 6", "WEEK 8": "Week 8", "WEEK 12": "Week 12", "WEEK 16": "Week 16", "WEEK 20": "Week 20", "WEEK 24": "Week 24", "WEEK 26": "Week 26"}
                missing: null
                unmapped: null
      AVISITN:
        case:
          - when: "LB.LBBLFL = 'Y'"
            then: {literal: 0}
          - when: "IS_UNSCHED IS NOT NULL"
            then: {literal: null}
          - when: "TRUE"
            then:
              str_extract:
                source: LB.VISIT
                pattern: "[0-9]+"
                no_match: null
      IS_UNSCHED:
        str_extract:
          source: LB.VISIT
          pattern: "UNSCHEDULED"
          no_match: null
      LBSEQ_S: {literal: null}
      LBSEQ_PAD: {literal: null}
      LBSEQ_K: {literal: null}
      ENDPOINT: {literal: null}
      SRC_AVISITN: {literal: null}
      EOT_IND: {literal: null}
      VIS_OK: {literal: null}
      E2_VN: {literal: null}
      E2_SEQ: {literal: null}
      RN2: {literal: null}
      EOT_LBCAT: {literal: null}

  - id: eot
    dataset: LB
    group_by: [LB.STUDYID, LB.USUBJID, LB.LBSEQ, LB.LBCAT, LB.VISITNUM, LB.VISIT, LB.LBTEST, LB.LBSTRESU, LB.LBTESTCD, LB.LBSTRESN, LB.LBBLFL, LB.LBDTC, LB.LBSTNRLO, LB.LBSTNRHI, LB.LBNRIND]
    filter: "EOT_LBCAT = 'CHEMISTRY' AND (ENDPOINT = 'Y' OR E2_VN = 12)"
    derivations:
      AVISIT: {literal: "End of Treatment"}
      AVISITN: {literal: 99}
      EOT_LBCAT: LB.LBCAT
      E2_VN: LB.VISITNUM
      LBSEQ_S: LB.LBSEQ
      LBSEQ_PAD:
        str_template:
          template: "                {LBSEQ_S}"
      LBSEQ_K:
        str_extract:
          source: LBSEQ_PAD
          pattern: ".{8}$"
      ENDPOINT: SUP_EP.QVAL
      IS_UNSCHED:
        str_extract:
          source: LB.VISIT
          pattern: "UNSCHEDULED"
          no_match: null
      SRC_AVISITN: {literal: null}
      EOT_IND: {literal: null}
      VIS_OK: {literal: null}
      E2_SEQ: {literal: null}
      RN2: {literal: null}

  - id: eot2
    dataset: LB
    group_by: [LB.STUDYID, LB.USUBJID, LB.LBTESTCD, LB.LBSEQ, LB.LBCAT, LB.VISITNUM, LB.VISIT, LB.LBTEST, LB.LBSTRESU, LB.LBSTRESN, LB.LBBLFL, LB.LBDTC, LB.LBSTNRLO, LB.LBSTNRHI, LB.LBNRIND]
    filter: "RN2 = 1 AND EOT_IND = 0 AND SRC_AVISITN IS NOT NULL AND SRC_AVISITN <> 0 AND EOT_LBCAT = 'CHEMISTRY'"
    derivations:
      AVISIT: {literal: "End of Treatment"}
      AVISITN: {literal: 99}
      EOT_LBCAT: LB.LBCAT
      LBSEQ_S: LB.LBSEQ
      LBSEQ_PAD:
        str_template:
          template: "                {LBSEQ_S}"
      LBSEQ_K:
        str_extract:
          source: LBSEQ_PAD
          pattern: ".{8}$"
      ENDPOINT: SUP_EP.QVAL
      EOT_IND:
        case:
          - when: "ENDPOINT = 'Y' OR LB.VISITNUM = 12"
            then: {literal: 1}
          - when: "TRUE"
            then: {literal: 0}
      IS_UNSCHED:
        str_extract:
          source: LB.VISIT
          pattern: "UNSCHEDULED"
          no_match: null
      SRC_AVISITN:
        case:
          - when: "LB.LBBLFL = 'Y'"
            then: {literal: 0}
          - when: "IS_UNSCHED IS NOT NULL"
            then: {literal: null}
          - when: "TRUE"
            then:
              str_extract:
                source: LB.VISIT
                pattern: "[0-9]+"
                no_match: null
      VIS_OK:
        str_extract:
          source: LB.VISIT
          pattern: "WEEK|UNSCHEDULED|SCREENING"
          no_match: null
      E2_VN: LB.VISITNUM
      E2_SEQ: LB.LBSEQ
      RN2:
        row_number:
          window:
            group_by: [LB.STUDYID, LB.USUBJID, LB.LBTESTCD]
            order_by:
              - variable: EOT_IND
                direction: desc
              - variable: SRC_AVISITN
                direction: desc
              - variable: E2_SEQ
                direction: asc
            filter: "VIS_OK IS NOT NULL AND E2_VN <> 13 AND EOT_LBCAT = 'CHEMISTRY'"
