# Reproduce the submitted baseline rules, including package-specific
# conventions.
yamaa: "1.0"
type: spec
model: ADaM

columns:
  - name: HEIGHTBL_RAW
    type: float
    label: Baseline height, unrounded (helper)
    derivation: VS_HT.VSSTRESN

  - name: HEIGHTBL
    type: float
    label: Baseline Height (cm)
    derivation:
      round_half_away_from_zero:
        source: HEIGHTBL_RAW
        digits: 1

  - name: WEIGHTBL_RAW
    type: float
    label: Baseline weight, unrounded (helper)
    derivation: VS_WT.VSSTRESN

  - name: WEIGHTBL
    type: float
    label: Baseline Weight (kg)
    derivation:
      round_half_away_from_zero:
        source: WEIGHTBL_RAW
        digits: 1

  - name: BMIBL_RAW
    type: float
    label: Baseline BMI, unrounded (helper)
    derivation: "WEIGHTBL / POWER(NULLIF(HEIGHTBL, 0) / 100, 2)"

  - name: BMIBL
    type: float
    label: Baseline BMI (kg/m^2)
    derivation:
      round_half_away_from_zero:
        source: BMIBL_RAW
        digits: 1

  - name: BMIBLGR1
    type: str
    label: Pooled Baseline BMI Group 1
    derivation:
      cut:
        source: BMIBL
        breaks:
          - 25
          - 30
        labels:
          - "<25"
          - "25-<30"
          - ">=30"

        missing: ''

  - name: EDUCLVL
    type: float
    label: Years of Education
    derivation: SC_ED.SCSTRESN

  - name: DISONSDT
    type: date
    label: Date of Onset of Disease
    derivation:
      impute:
        type: date
        source: MH_DX.MHSTDTC
        month: 1
        day: 1

  - name: VISIT1DT
    type: date
    label: Date of Visit 1
    derivation:
      impute:
        type: date
        source: SV_V1.SVSTDTC
        month: 1
        day: 1

  - name: DURDISD
    type: float
    label: Disease duration in days, inclusive (helper)
    derivation:
      diff:
        type: date
        start: DISONSDT
        end: VISIT1DT
        unit: day
        closed: both

  - name: DURDIS_RAW
    type: float
    label: Disease duration in months, unrounded (helper)
    derivation: "DURDISD / 30.4375"

  - name: DURDIS
    type: float
    label: Duration of Disease (Months)
    derivation:
      round_half_away_from_zero:
        source: DURDIS_RAW
        digits: 1

  - name: DURDSGR1
    type: str
    label: Pooled Disease Duration Group 1
    derivation:
      cut:
        source: DURDIS
        breaks:
          - 12
        labels:
          - "<12"
          - ">=12"

  - name: MMSETOT
    type: float
    label: MMSE Total
    derivation:
      aggregate:
        expr: "SUM(QS.QSSTRESN)"
        filter: "QS.QSCAT = 'MINI-MENTAL STATE'"
