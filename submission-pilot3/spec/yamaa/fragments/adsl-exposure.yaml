# Reproduce the submitted exposure rules, including package-specific
# conventions.
yamaa: "1.0"
type: spec
model: ADaM

columns:
  - name: TRTSDT
    type: date
    label: Date of First Exposure to Treatment
    derivation:
      impute:
        type: date
        source: EX_FIRST.EXSTDTC
        month: 1
        day: last

  - name: TRTEDT
    type: date
    label: Date of Last Exposure to Treatment
    derivation:
      aggregate:
        derivations:
          EXENDT_RAW:
            type: date
            derivation:
              impute:
                type: date
                source: EX.EXENDTC
                month: 1
                day: last
          EOSDT:
            type: date
            derivation:
              impute:
                type: date
                source: DS_EOS.DSSTDTC
                month: 1
                day: last
          EXENDT_CAPPED:
            type: date
            derivation:
              least:
                sources:
                  - EXENDT_RAW
                  - EOSDT
        expr: "MAX(EXENDT_CAPPED)"

  - name: TRTDURD
    type: float
    label: Total Treatment Duration (Days)
    derivation:
      diff:
        type: date
        start: TRTSDT
        end: TRTEDT
        unit: day
        closed: both

  - name: CUMDOSE
    type: float
    label: Cumulative Dose (as planned)
    derivation:
      aggregate:
        derivations:
          EXSTDT:
            type: date
            derivation:
              impute:
                type: date
                source: EX.EXSTDTC
                month: 1
                day: last
          EXENDT_RAW:
            type: date
            derivation:
              impute:
                type: date
                source: EX.EXENDTC
                month: 1
                day: last
          EOSDT:
            type: date
            derivation:
              impute:
                type: date
                source: DS_EOS.DSSTDTC
                month: 1
                day: last
          EXENDT_CAPPED:
            type: date
            derivation:
              least:
                sources:
                  - EXENDT_RAW
                  - EOSDT
          EXDURD:
            type: float
            derivation:
              diff:
                type: date
                start: EXSTDT
                end: EXENDT_CAPPED
                unit: day
                closed: both
          EXDOSE_TOTAL:
            type: float
            derivation: "EX.EXDOSE * EXDURD"
        expr: "SUM(EXDOSE_TOTAL)"

  - name: AVGDD_RAW
    type: float
    label: Average daily dose, unrounded (helper)
    derivation: "CUMDOSE / NULLIF(TRTDURD, 0)"

  - name: AVGDD
    type: float
    label: Avg Daily Dose (as planned)
    derivation:
      round_half_away_from_zero:
        source: AVGDD_RAW
        digits: 1
