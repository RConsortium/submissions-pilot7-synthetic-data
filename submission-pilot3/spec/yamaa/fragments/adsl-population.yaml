# Reproduce the submitted population rules, including package-specific
# conventions.
yamaa: "1.0"
type: spec
model: ADaM

columns:
  - name: SITEGR1
    type: str
    label: Pooled Site Group 1
    derivation:
      case:
        - when: "SITEID IN ('702', '706', '707', '711', '714',
            '715', '717')"
          then: "'900'"
        - otherwise: SITEID

  - name: TRT01PN
    type: float
    label: Planned Treatment for Period 01 (N)
    derivation:
      mapping:
        source: DM.ARM
        dict:
          Placebo: 0
          Xanomeline Low Dose: 54
          Xanomeline High Dose: 81

  - name: TRT01A
    type: str
    label: Actual Treatment for Period 01
    derivation: DM.ARM

  - name: TRT01AN
    type: float
    label: Actual Treatment for Period 01 (N)
    derivation:
      mapping:
        source: DM.ARM
        dict:
          Placebo: 0
          Xanomeline Low Dose: 54
          Xanomeline High Dose: 81

  - name: AGEGR1
    type: str
    label: Pooled Age Group 1
    derivation:
      # NB: the reference groups 65 and 80 into "65-80" (closed [65, 80]
      # interval), which cut cannot express; hence the explicit case.
      case:
        - when: "DM.AGE < 65"
          then: "'<65'"
        - when: "DM.AGE <= 80"
          then: "'65-80'"
        - otherwise: "'>80'"

  - name: AGEGR1N
    type: float
    label: Pooled Age Group 1 (N)
    derivation:
      mapping:
        source: AGEGR1
        dict:
          "<65": 1
          "65-80": 2
          ">80": 3

  - name: RACEN
    type: float
    label: Race (N)
    derivation:
      mapping:
        source: DM.RACE
        dict:
          WHITE: 1
          BLACK OR AFRICAN AMERICAN: 2
          AMERICAN INDIAN OR ALASKA NATIVE: 6

  - name: SAFFL
    type: str
    label: Safety Population Flag
    derivation:
      case:
        - when: "DM.ARMCD <> 'Scrnfail' AND DM.ARMCD <> '' AND
            TRTSDT IS NOT NULL"
          then: "'Y'"
        - otherwise: "'N'"

  - name: ITTFL
    type: str
    label: Intent-To-Treat Population Flag
    derivation:
      case:
        - when: "DM.ARMCD <> 'Scrnfail' AND DM.ARMCD <> ''"
          then: "'Y'"
        - otherwise: "'N'"

  - name: N_ACTOT
    type: float
    label: Post-baseline ADAS-Cog records (helper)
    derivation:
      aggregate:
        expr: "COUNT(QS.QSSEQ)"
        filter: "QS.VISITNUM > 3 AND QS.QSTESTCD = 'ACTOT'"

  - name: N_CIBIC
    type: float
    label: Post-baseline CIBIC+ records (helper)
    derivation:
      aggregate:
        expr: "COUNT(QS.QSSEQ)"
        filter: "QS.VISITNUM > 3 AND QS.QSTESTCD = 'CIBIC'"

  - name: EFFFL
    type: str
    label: Efficacy Population Flag
    derivation:
      case:
        - when: "SAFFL = 'Y' AND N_ACTOT > 0 AND N_CIBIC > 0"
          then: "'Y'"
        - otherwise: "'N'"

  - name: N_WK8
    type: float
    label: Week 8 visit records (helper)
    derivation:
      aggregate:
        expr: "COUNT(SV.USUBJID)"
        filter: "SV.VISITNUM = 8"

  - name: COMP8FL
    type: str
    label: Completers of Week 8 Population Flag
    derivation:
      case:
        - when: "N_WK8 > 0"
          then: "'Y'"
        - otherwise: "'N'"

  - name: N_WK16
    type: float
    label: Week 16 visit records (helper)
    derivation:
      aggregate:
        expr: "COUNT(SV.USUBJID)"
        filter: "SV.VISITNUM = 10"

  - name: COMP16FL
    type: str
    label: Completers of Week 16 Population Flag
    derivation:
      case:
        - when: "N_WK16 > 0"
          then: "'Y'"
        - otherwise: "'N'"

  - name: N_WK24
    type: float
    label: Week 24 visit records (helper)
    derivation:
      aggregate:
        expr: "COUNT(SV.USUBJID)"
        filter: "SV.VISITNUM = 12"

  - name: COMP24FL
    type: str
    label: Completers of Week 24 Population Flag
    derivation:
      case:
        - when: "N_WK24 > 0"
          then: "'Y'"
        - otherwise: "'N'"

  - name: DISCONFL
    type: str
    label: Did the Subject Discontinue the Study?
    derivation:
      case:
        - when: "DS_EOS.DSSTDTC IS NOT NULL AND DS_EOS.DSDECOD
            <> 'COMPLETED'"
          then: "'Y'"

        - otherwise: "''"

  - name: DSRAEFL
    type: str
    label: Discontinued due to AE?
    derivation:
      case:
        - when: "DS_EOS.DSDECOD = 'ADVERSE EVENT'"
          then: "'Y'"

        - otherwise: "''"

  - name: DTHFL
    type: str
    label: Subject Died?
    derivation:
      case:
        - when: "DM.DTHFL = 'Y'"
          then: "'Y'"

        - otherwise: "''"

  - name: RFENDTC
    type: str
    label: Subject Reference End Date/Time
    derivation: DM.RFENDTC

  - name: VISNUMEN_ROUND
    type: float
    label: Last visit number, rounded (helper)
    derivation:
      round_half_away_from_zero:
        source: SV_LAST.VISITNUM
        digits: 0

  - name: VISNUMEN
    type: float
    label: End of Trt Visit (Vis 12 or Early Term.)
    derivation:
      case:
        - when: "VISNUMEN_ROUND = 13"
          then: 12
        - otherwise: VISNUMEN_ROUND

  - name: RFENDT
    type: date
    label: Date of Discontinuation/Completion
    derivation:
      impute:
        type: date
        source: DM.RFENDTC
        month: 1
        day: 1

  - name: DCDECOD
    type: str
    label: Standardized Disposition Term
    derivation: DS_EOS.DSDECOD

  - name: EOSSTT
    type: str
    label: End of Study Status
    derivation:
      case:
        - when: "DS_EOS.DSDECOD = 'COMPLETED'"
          then: "'COMPLETED'"
        - otherwise: "'DISCONTINUED'"

  - name: DCSREAS
    type: str
    label: Reason for Discontinuation from Study
    derivation:
      case:
        - when: "DS_EOS.DSTERM = 'PROTOCOL ENTRY CRITERIA NOT
            MET'"
          then: "'I/E Not Met'"
        - when: "DS_EOS.DSDECOD = 'COMPLETED'"
          then: "''"
        - otherwise:
            mapping:
              source: DS_EOS.DSDECOD
              dict:
                ADVERSE EVENT: Adverse Event
                DEATH: Death
                LACK OF EFFICACY: Lack of Efficacy
                LOST TO FOLLOW-UP: Lost to Follow-up
                PHYSICIAN DECISION: Physician Decision
                PROTOCOL VIOLATION: Protocol Violation
                STUDY TERMINATED BY SPONSOR: Sponsor
                  Decision
                WITHDRAWAL BY SUBJECT: Withdrew Consent
