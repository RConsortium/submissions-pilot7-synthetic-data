# ADADAS reproduces the submitted observations and LOCF records.
# Missing ACTOT visit slots are constructed by yamaa from QS and generated
# ADSL.
# No subject-level planning table or output repair is used.
yamaa: "1.0"
type: spec
model: ADaM

parent: ../../../spec/yamaa/templates/subject-analysis.yaml

include:
  - ../../../spec/yamaa/fragments/bds-record.yaml
  - ../../../spec/yamaa/fragments/analysis-flags.yaml

domain: ADADAS

keys:
  - STUDYID
  - USUBJID
  - PARAMCD
  - AVISIT
  - ADT

input:
  QS:
    path: ../../data/sdtm/qs.parquet
    ordinal: _QS_INPUT_ORDER
    key:
      - STUDYID
      - USUBJID
  ADSL:
    empty_string: missing
    key:
      - USUBJID

  AW:
    path: ../../data/mapping/analysis_window.csv
    types:
      AWTARGET: int
      AWLO: int
      AWHI: int

output:
  path: ../../data/adam/adadas-yamaa.parquet
  columns:
    - STUDYID
    - SITEID
    - SITEGR1
    - USUBJID
    - TRTSDT
    - TRTEDT
    - TRTP
    - TRTPN
    - AGE
    - AGEGR1
    - AGEGR1N
    - RACE
    - RACEN
    - SEX
    - ITTFL
    - EFFFL
    - COMP24FL
    - AVISIT
    - AVISITN
    - VISIT
    - VISITNUM
    - ADY
    - ADT
    - PARAM
    - PARAMCD
    - PARAMN
    - AVAL
    - BASE
    - CHG
    - PCHG
    - ABLFL
    - ANL01FL
    - DTYPE
    - AWRANGE
    - AWTARGET
    - AWTDIFF
    - AWLO
    - AWHI
    - AWU
    - QSSEQ

  order_by:
    - ROWSRC
    - _OBSERVED_ORDER
    - USUBJID
    - AVISITN

windows:
  ANL01_RN_ORDER:
    group_by:
      - USUBJID
      - PARAMCD
      - AVISIT
    order_by:
      - variable: AWTDIFF_RAW
        nulls: last
      - variable: DIFF_RAW
        nulls: last
    filter: "ROWSRC = 0"

  ADT_ORDER:
    group_by:
      - STUDYID
      - USUBJID
      - PARAMCD
    order_by:
      - variable: AVISITN
        nulls: last

intermediates:
  - id: SUBJECT_FOR_VISIT
    dataset: ADSL
    key:
      - STUDYID
      - USUBJID

  - id: AW_LOOKUP
    dataset: AW
    key:
      - AVISIT

  - id: COLLECTED_WEEK_8
    dataset: QS
    key:
      - USUBJID
    filter: "QS.QSTESTCD = 'ACTOT' AND QS._PLAN_ADY > 1 AND QS._PLAN_ADY
      <= 84"
    order_by:
      - QS.QSSEQ
    keep: first
    columns:
      - QSSEQ
    derivations:
      _PLAN_DATE:
        type: date
        derivation:
          to_date:
            source: QS.QSDTC
      _PLAN_ADY:
        type: int
        derivation:
          diff:
            type: date
            start: SUBJECT_FOR_VISIT.TRTSDT
            end: QS._PLAN_DATE
            unit: day
            closed: both

  - id: COLLECTED_WEEK_16
    dataset: QS
    key:
      - USUBJID
    filter: "QS.QSTESTCD = 'ACTOT' AND QS._PLAN_ADY > 84 AND QS._PLAN_ADY
      <= 140"
    order_by:
      - QS.QSSEQ
    keep: first
    columns:
      - QSSEQ
    derivations:
      _PLAN_DATE:
        type: date
        derivation:
          to_date:
            source: QS.QSDTC
      _PLAN_ADY:
        type: int
        derivation:
          diff:
            type: date
            start: SUBJECT_FOR_VISIT.TRTSDT
            end: QS._PLAN_DATE
            unit: day
            closed: both

  - id: COLLECTED_WEEK_24
    dataset: QS
    key:
      - USUBJID
    filter: "QS.QSTESTCD = 'ACTOT' AND QS._PLAN_ADY > 140"
    order_by:
      - QS.QSSEQ
    keep: first
    columns:
      - QSSEQ
    derivations:
      _PLAN_DATE:
        type: date
        derivation:
          to_date:
            source: QS.QSDTC
      _PLAN_ADY:
        type: int
        derivation:
          diff:
            type: date
            start: SUBJECT_FOR_VISIT.TRTSDT
            end: QS._PLAN_DATE
            unit: day
            closed: both

columns:
  # ---- row-phase working columns (values differ by template) ----
  - name: ROWSRC
    type: int
    label: Rowsrc (helper)

  - name: USUBJID
    type: str
    label: Unique Subject Identifier

  - name: PARAMCD
    type: str
    label: Parameter Code

  - name: ADT_RAW
    type: date
    label: Adt Raw (helper)

  - name: PLAN_AVISIT
    type: str
    label: Planned Analysis Visit (helper)

  - name: ABLFL
    type: str
    label: Baseline Record Flag

  - name: VISIT_RAW
    type: str
    label: Visit Raw (helper)

  - name: VISITNUM_RAW
    type: float
    label: Visitnum Raw (helper)

  - name: QSSEQ_RAW
    type: float
    label: Qsseq Raw (helper)

  - name: AVAL_RAW
    type: float
    label: Aval Raw (helper)

  # ---- shared derivations (including missing values on planned rows) ----
  - name: ADY_RAW
    type: float
    label: Ady Raw (helper)
    derivation:
      study_day:
        source: ADT_RAW
        reference: TRTSDT

  - name: AVISIT
    type: str
    label: Analysis Visit
    derivation:
      case:
        - when: "ROWSRC = 1"
          then: PLAN_AVISIT
        - otherwise:
            cut:
              source: ADY_RAW
              breaks:
                - 1
                - 84
                - 140
              labels:
                - "Baseline"
                - "Week 8"
                - "Week 16"
                - "Week 24"
              closed: right

  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: ADSL.STUDYID

  - name: PARAM
    type: str
    label: Parameter
    derivation:
      mapping:
        source: PARAMCD
        dict:
          ACITM01: "Word Recall Task"
          ACITM02: "Naming Objects And Fingers (Refer To 5 C"
          ACITM03: "Delayed Word Recall"
          ACITM04: "Commands"
          ACITM05: "Constructional Praxis"
          ACITM06: "Ideational Praxis"
          ACITM07: "Orientation"
          ACITM08: "Word Recognition"
          ACITM09: "Attention/Visual Search Task"
          ACITM10: "Maze Solution"
          ACITM11: "Spoken Language Ability"
          ACITM12: "Comprehension Of Spoken Language"
          ACITM13: "Word Finding Difficulty In Spontaneous S"
          ACITM14: "Recall Of Test Instructions"
          ACTOT: "Adas-Cog(11) Subscore"

  - name: PARAMN
    type: float
    label: Parameter (N)
    derivation:
      mapping:
        source: PARAMCD
        dict:
          ACITM01: 1.0
          ACITM02: 2.0
          ACITM03: 3.0
          ACITM04: 4.0
          ACITM05: 5.0
          ACITM06: 6.0
          ACITM07: 7.0
          ACITM08: 8.0
          ACITM09: 9.0
          ACITM10: 10.0
          ACITM11: 11.0
          ACITM12: 12.0
          ACITM13: 13.0
          ACITM14: 14.0
          ACTOT: 15.0

  - name: AVISITN
    type: float
    label: Analysis Visit (N)
    derivation:
      mapping:
        source: AVISIT
        dict:
          Baseline: 0.0
          "Week 8": 8.0
          "Week 16": 16.0
          "Week 24": 24.0

  # ---- analysis-window metadata (4-row lookup tribble) ----
  - name: AWRANGE
    type: str
    label: Analysis Window Valid Relative Range
    derivation: AW_LOOKUP.AWRANGE

  - name: AWTARGET
    type: float
    label: Analysis Window Target
    derivation: AW_LOOKUP.AWTARGET

  - name: AWLO
    type: float
    label: Analysis Window Beginning Timepoint
    derivation: AW_LOOKUP.AWLO

  - name: AWHI
    type: float
    label: Analysis Window Ending Timepoint
    derivation: AW_LOOKUP.AWHI

  - name: AWU
    type: str
    label: Analysis Window Unit
    derivation: "'DAYS'"

  # ---- record-selection flag (extreme record per subject/param/visit) ----
  - name: AWTDIFF_RAW
    type: float
    label: Awtdiff Raw (helper)
    derivation: "ABS(AWTARGET - ADY_RAW)"

  - name: DIFF_RAW
    type: float
    label: Diff Raw (helper)
    derivation: "AWTARGET - ADY_RAW"

  - name: ANL01_RN
    type: int
    label: Anl01 Rn (helper)
    derivation:
      row_number:
        window: ANL01_RN_ORDER

  - name: ANL01FL
    type: str
    label: Analysis Flag 01
    derivation:
      case:
        - when: "ROWSRC = 1"
          then: "'Y'"
        - when: "ANL01_RN = 1"
          then: "'Y'"
        - otherwise: "''"

  - name: ADT_Y
    type: date
    label: Adt Y (helper)
    derivation:
      case:
        - when: "ANL01FL = 'Y'"
          then: ADT_RAW
        - otherwise:

  - name: ADY_Y
    type: float
    label: Ady Y (helper)
    derivation:
      case:
        - when: "ANL01FL = 'Y'"
          then: ADY_RAW
        - otherwise:

  - name: VISIT_Y
    type: str
    label: Visit Y (helper)
    derivation:
      case:
        - when: "ANL01FL = 'Y'"
          then: VISIT_RAW
        - otherwise:

  - name: VISITNUM_Y
    type: float
    label: Visitnum Y (helper)
    derivation:
      case:
        - when: "ANL01FL = 'Y'"
          then: VISITNUM_RAW
        - otherwise:

  - name: QSSEQ_Y
    type: float
    label: Qsseq Y (helper)
    derivation:
      case:
        - when: "ANL01FL = 'Y'"
          then: QSSEQ_RAW
        - otherwise:

  - name: AVAL_Y
    type: float
    label: Aval Y (helper)
    derivation:
      case:
        - when: "ANL01FL = 'Y'"
          then: AVAL_RAW
        - otherwise:

  - name: ADT
    type: date
    label: Analysis Date
    derivation:
      case:
        - when: "ROWSRC = 1"
          then:
            locf:
              source: ADT_Y
              window: ADT_ORDER
        - otherwise: ADT_RAW

  - name: ADY
    type: float
    label: Analysis Relative Day
    derivation:
      case:
        - when: "ROWSRC = 1"
          then:
            locf:
              source: ADY_Y
              window: ADT_ORDER
        - otherwise: ADY_RAW

  - name: VISIT
    type: str
    label: Visit Name
    derivation:
      case:
        - when: "ROWSRC = 1"
          then:
            locf:
              source: VISIT_Y
              window: ADT_ORDER
        - otherwise: VISIT_RAW

  - name: VISITNUM
    type: float
    label: Visit Number
    derivation:
      case:
        - when: "ROWSRC = 1"
          then:
            locf:
              source: VISITNUM_Y
              window: ADT_ORDER
        - otherwise: VISITNUM_RAW

  - name: QSSEQ
    type: float
    label: Sequence Number
    derivation:
      case:
        - when: "ROWSRC = 1"
          then:
            locf:
              source: QSSEQ_Y
              window: ADT_ORDER
        - otherwise: QSSEQ_RAW

  - name: AVAL
    type: float
    label: Analysis Value
    derivation:
      case:
        - when: "ROWSRC = 1"
          then:
            locf:
              source: AVAL_Y
              window: ADT_ORDER
        - otherwise: AVAL_RAW

  # ---- window distance on the final (possibly carried) study day ----
  - name: AWTDIFF
    type: float
    label: Analysis Window Diff from Target
    derivation: "ABS(AWTARGET - ADY)"

  # ---- baseline and change from baseline ----
  - name: BASE
    type: float
    label: Baseline Value
    derivation:
      aggregate:
        expr: "ONLY(AVAL)"
        filter: "ABLFL = 'Y'"
        group_by:
          - STUDYID
          - USUBJID
          - PARAMCD

  - name: CHG
    type: float
    label: Change from Baseline
    derivation:
      case:
        - when: "ABLFL = ''"
          then: "AVAL - BASE"
        - otherwise:

  - name: PCHG
    type: float
    label: Percent Change from Baseline
    derivation:
      case:
        - when: "ABLFL = ''"
          then: "(AVAL - BASE) / NULLIF(BASE, 0) * 100"
        - otherwise:

  - name: DTYPE
    type: str
    label: Derivation Type
    derivation:
      case:
        - when: "ROWSRC = 1"
          then: "'LOCF'"
        - otherwise: "''"

  - name: _OBSERVED_ORDER
    type: int
    label: Collected source record order

  - name: _COLLECTED_QSSEQ
    type: float
    label: Existing ACTOT record at planned visit

rows:
  - id: collected
    dataset: QS
    filter: >-
      QS.QSTESTCD IN ('ACITM01', 'ACITM02', 'ACITM03', 'ACITM04',
      'ACITM05', 'ACITM06', 'ACITM07', 'ACITM08', 'ACITM09', 'ACITM10',
      'ACITM11', 'ACITM12', 'ACITM13', 'ACITM14', 'ACTOT')
    derivations:
      ROWSRC: 0
      USUBJID: QS.USUBJID
      PARAMCD: QS.QSTESTCD
      ADT_RAW:
        to_date:
          source: QS.QSDTC
      PLAN_AVISIT:
      ABLFL:
        first_available:
          sources:
            - QS.QSBLFL
          missing: ''
      VISIT_RAW: QS.VISIT
      VISITNUM_RAW: QS.VISITNUM
      QSSEQ_RAW: QS.QSSEQ
      AVAL_RAW: QS.QSSTRESN

      _OBSERVED_ORDER: QS._QS_INPUT_ORDER
      _COLLECTED_QSSEQ:

  - id: planned-week-8
    dataset: ADSL
    filter: "_COLLECTED_QSSEQ IS NULL"
    derivations:
      ROWSRC: 1
      USUBJID: ADSL.USUBJID
      PARAMCD: "'ACTOT'"
      ADT_RAW:
      PLAN_AVISIT: "'Week 8'"
      ABLFL: "''"
      VISIT_RAW:
      VISITNUM_RAW:
      QSSEQ_RAW:
      AVAL_RAW:
      _OBSERVED_ORDER: 0
      _COLLECTED_QSSEQ: COLLECTED_WEEK_8.QSSEQ

  - id: planned-week-16
    dataset: ADSL
    filter: "_COLLECTED_QSSEQ IS NULL"
    derivations:
      ROWSRC: 1
      USUBJID: ADSL.USUBJID
      PARAMCD: "'ACTOT'"
      ADT_RAW:
      PLAN_AVISIT: "'Week 16'"
      ABLFL: "''"
      VISIT_RAW:
      VISITNUM_RAW:
      QSSEQ_RAW:
      AVAL_RAW:
      _OBSERVED_ORDER: 0
      _COLLECTED_QSSEQ: COLLECTED_WEEK_16.QSSEQ

  - id: planned-week-24
    dataset: ADSL
    filter: "_COLLECTED_QSSEQ IS NULL"
    derivations:
      ROWSRC: 1
      USUBJID: ADSL.USUBJID
      PARAMCD: "'ACTOT'"
      ADT_RAW:
      PLAN_AVISIT: "'Week 24'"
      ABLFL: "''"
      VISIT_RAW:
      VISITNUM_RAW:
      QSSEQ_RAW:
      AVAL_RAW:
      _OBSERVED_ORDER: 0
      _COLLECTED_QSSEQ: COLLECTED_WEEK_24.QSSEQ

verifications:
  - row_count:
      min: 12463
      max: 12463
  - assert:
      id: treatment_date_order
      when: "TRTSDT IS NOT NULL AND TRTEDT IS NOT NULL"
      require: "TRTEDT >= TRTSDT"
