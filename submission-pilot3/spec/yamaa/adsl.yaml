yamaa: "1.0"
type: spec
model: ADaM
domain: ADSL

keys:
  - STUDYID
  - USUBJID

input:
  DM: ../../data/sdtm/dm.parquet
  DS: ../../data/sdtm/ds.parquet
  EX:
    path: ../../data/sdtm/ex.parquet
    key:
      - STUDYID
      - USUBJID
  QS:
    path: ../../data/sdtm/qs.parquet
    key:
      - STUDYID
      - USUBJID
  SV:
    path: ../../data/sdtm/sv.parquet
    key:
      - STUDYID
      - USUBJID
  VS: ../../data/sdtm/vs.parquet
  SC: ../../data/sdtm/sc.parquet
  MH: ../../data/sdtm/mh.parquet
base: DM

filter: "DM.ACTARMCD <> 'Scrnfail'"

output:
  path: ../../data/adam/adsl-yamaa.parquet
  columns:
    - STUDYID
    - USUBJID
    - SUBJID
    - SITEID
    - SITEGR1
    - ARM
    - TRT01P
    - TRT01PN
    - TRT01A
    - TRT01AN
    - TRTSDT
    - TRTEDT
    - TRTDURD
    - AVGDD
    - CUMDOSE
    - AGE
    - AGEGR1
    - AGEGR1N
    - AGEU
    - RACE
    - RACEN
    - SEX
    - ETHNIC
    - SAFFL
    - ITTFL
    - EFFFL
    - COMP8FL
    - COMP16FL
    - COMP24FL
    - DISCONFL
    - DSRAEFL
    - DTHFL
    - BMIBL
    - BMIBLGR1
    - HEIGHTBL
    - WEIGHTBL
    - EDUCLVL
    - DISONSDT
    - DURDIS
    - DURDSGR1
    - VISIT1DT
    - RFSTDTC
    - RFENDTC
    - VISNUMEN
    - RFENDT
    - DCDECOD
    - EOSSTT
    - DCSREAS
    - MMSETOT

intermediates:
  - id: EX_FIRST
    dataset: EX
    key:
      - STUDYID
      - USUBJID
    order_by:
      - variable: EX.EXSTDTC
        nulls: last
    keep: first

  - id: DS_EOS
    dataset: DS
    key:
      - STUDYID
      - USUBJID
    filter: "DS.DSCAT = 'DISPOSITION EVENT' AND DS.DSDECOD <> 'SCREEN FAILURE'"
    order_by:
      - variable: DS.DSSTDTC
        nulls: last
    keep: first

  - id: SV_V1
    dataset: SV
    key:
      - STUDYID
      - USUBJID
    filter: "SV.VISITNUM = 1"
    order_by:
      - variable: SV.SVSTDTC
        nulls: last
    keep: first

  - id: SV_LAST
    dataset: SV
    key:
      - STUDYID
      - USUBJID
    filter: "SV.VISITNUM < 100"
    order_by:
      - variable: SV.SVSTDTC
        nulls: last
    keep: last

  - id: VS_HT
    dataset: VS
    key:
      - STUDYID
      - USUBJID
    filter: "VS.VSTESTCD = 'HEIGHT' AND VS.VISITNUM = 1"
    order_by:
      - variable: VS.VSDTC
        nulls: last
    keep: first

  - id: VS_WT
    dataset: VS
    key:
      - STUDYID
      - USUBJID
    filter: "VS.VSTESTCD = 'WEIGHT' AND VS.VISITNUM = 3"
    order_by:
      - variable: VS.VSDTC
        nulls: last
    keep: first

  - id: SC_ED
    dataset: SC
    key:
      - STUDYID
      - USUBJID
    filter: "SC.SCTESTCD = 'EDLEVEL'"
    order_by:
      - variable: SC.SCDTC
        nulls: last
    keep: first

  - id: MH_DX
    dataset: MH
    key:
      - STUDYID
      - USUBJID
    filter: "MH.MHCAT = 'PRIMARY DIAGNOSIS'"
    order_by:
      - variable: MH.MHSTDTC
        nulls: last
    keep: first

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: DM.STUDYID

    submission:
      core: Cond
      mandatory: true
      length: 12
      origins:
        - type: Predecessor
          description: DM.STUDYID
  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: DM.USUBJID

    submission:
      core: Cond
      mandatory: true
      length: 11
      origins:
        - type: Predecessor
          description: DM.USUBJID
  - name: SUBJID
    type: str
    label: Subject Identifier for the Study
    derivation: DM.SUBJID

    submission:
      core: Cond
      mandatory: false
      length: 4
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADSL.SUBJID
        type: Computation
        description: DM.SUBJID
  - name: SITEID
    type: str
    label: Study Site Identifier
    derivation: DM.SITEID

    submission:
      core: Cond
      mandatory: false
      length: 3
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADSL.SITEID
        type: Computation
        description: DM.SITEID
  - name: SITEGR1
    type: str
    label: Pooled Site Group 1
    derivation:
      case:
        - when: "SITEID IN ('702', '706', '707', '711', '714', '715', '717')"
          then: "'900'"
        - otherwise: SITEID

    submission:
      core: Cond
      mandatory: false
      length: 3
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADSL.SITEGR1
        type: Computation
        description: refer to SAP, Section 7.1 - if not pooled then SITEGR1=SITEID. If pooled, SITEGR1
          will be 900
  - name: ARM
    type: str
    label: Description of Planned Arm
    derivation: DM.ARM

    submission:
      core: Cond
      mandatory: false
      length: 20
      origins:
        - type: Derived
      codelist: ARM
      method:
        name: Algorithm to derive ADSL.ARM
        type: Computation
        description: DM.ARM
  - name: TRT01P
    type: str
    label: Planned Treatment for Period 01
    derivation: DM.ARM

    submission:
      core: Cond
      mandatory: false
      length: 20
      origins:
        - type: Derived
      codelist: ARM
      method:
        name: Algorithm to derive ADSL.TRT01P
        type: Computation
        description: DM.ARM
  - name: TRT01PN
    type: float
    label: Planned Treatment for Period 01 (N)
    derivation:
      mapping:
        source: DM.ARM
        dict:
          Placebo: 0
          Xanomeline Low Dose: 54
          Xanomeline High Dose: 81

    submission:
      core: Cond
      mandatory: false
      length: 8
      origins:
        - type: Derived
      codelist: ARMN
      method:
        name: Algorithm to derive ADSL.TRT01PN
        type: Computation
        description: Numeric code for TRT01P which corresponds to the randomized dose
      significant_digits: 0
  - name: TRT01A
    type: str
    label: Actual Treatment for Period 01
    derivation: DM.ARM

    submission:
      core: Cond
      mandatory: false
      length: 20
      origins:
        - type: Derived
      codelist: ARM
      method:
        name: Algorithm to derive ADSL.TRT01A
        type: Computation
        description: TRT01A=TRT01P, i.e., no difference between actual and randomized treatment in this
          study.
  - name: TRT01AN
    type: float
    label: Actual Treatment for Period 01 (N)
    derivation:
      mapping:
        source: DM.ARM
        dict:
          Placebo: 0
          Xanomeline Low Dose: 54
          Xanomeline High Dose: 81

    submission:
      core: Cond
      mandatory: false
      length: 8
      origins:
        - type: Derived
      codelist: ARMN
      method:
        name: Algorithm to derive ADSL.TRT01AN
        type: Computation
        description: Numeric code for TRT01A which corresponds to the randomized dose
      significant_digits: 0
  - name: TRTSDT
    type: date
    label: Date of First Exposure to Treatment
    derivation:
      impute:
        type: date
        source: EX_FIRST.EXSTDTC
        month: 1
        day: last

    submission:
      core: Cond
      mandatory: false
      display_format: DATE9.
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADSL.TRTSDT
        type: Computation
        description: SV.SVSTDTC when SV.VISITNUM=3, converted to SAS date
  - name: TRTEDT
    type: date
    label: Date of Last Exposure to Treatment
    derivation:
      aggregate:
        derivations:
          EXENDT_RAW:
            type: date
            derivation: {impute: {type: date, source: EX.EXENDTC, month: 1, day: last}}
          EOSDT:
            type: date
            derivation: {impute: {type: date, source: DS_EOS.DSSTDTC, month: 1, day: last}}
          EXENDT_CAPPED:
            type: date
            derivation:
              least:
                sources:
                  - EXENDT_RAW
                  - EOSDT
        expr: "MAX(EXENDT_CAPPED)"

    submission:
      core: Cond
      mandatory: false
      display_format: DATE9.
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADSL.TRTEDT
        type: Computation
        description: The date of final dose (from the CRF) is EX.EXENDTC on the subject's last EX record.
          If the date of final dose is missing for the subject and the subject discontinued after visit
          3, use the date of discontinuation as the date of last dose. Convert the date to a SAS date.
  - name: TRTDURD
    type: float
    label: Total Treatment Duration (Days)
    derivation:
      diff:
        type: date
        start: TRTSDT
        end: TRTEDT
        unit: day
        closed: both

    submission:
      core: Cond
      mandatory: false
      length: 8
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADSL.TRTDUR
        type: Computation
        description: TRTEDT-TRTSDT+1
      significant_digits: 0
  - name: CUMDOSE
    type: float
    label: Cumulative Dose (as planned)
    derivation:
      aggregate:
        derivations:
          EXSTDT:
            type: date
            derivation: {impute: {type: date, source: EX.EXSTDTC, month: 1, day: last}}
          EXENDT_RAW:
            type: date
            derivation: {impute: {type: date, source: EX.EXENDTC, month: 1, day: last}}
          EOSDT:
            type: date
            derivation: {impute: {type: date, source: DS_EOS.DSSTDTC, month: 1, day: last}}
          EXENDT_CAPPED:
            type: date
            derivation:
              least:
                sources:
                  - EXENDT_RAW
                  - EOSDT
          EXDURD:
            type: float
            derivation:
              diff:
                type: date
                start: EXSTDT
                end: EXENDT_CAPPED
                unit: day
                closed: both
          EXDOSE_TOTAL:
            type: float
            derivation: "EX.EXDOSE * EXDURD"
        expr: "SUM(EXDOSE_TOTAL)"

    submission:
      core: Cond
      mandatory: false
      length: 8
      significant_digits: 1
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADSL.CUMDOSE
        type: Computation
        description: 'For ARMN=0 or 1: CUMDOSE=TRT01PN*TRTDUR. --- For ARMN=2: CUMDOSE will be based on 54mg
          per day for the # of days subj was in 1st dosing interval (i.e., visit4date-TRTSTDT+1 if 1st interval
          completed, TRTEDT-TRTSTDT+1 if subj discontinued <=visit 4 and > visit 3), 81mg per day for the #
          of days subj was in 2nd dosing interval (i.e., visit12date-visit4date if 2nd interval completed,
          TRTEDT-visit4date if subj discontinued <= visit 12 and > visit 4), and 54mg per day for the # of
          days subj was in 3rd dosing interval (i.e., TRTEDT - visit12date if subj continued after visit 12).'
  - name: AVGDD_RAW
    type: float
    label: Average daily dose, unrounded (helper)
    derivation: "CUMDOSE / NULLIF(TRTDURD, 0)"

  - name: AVGDD
    type: float
    label: Avg Daily Dose (as planned)
    derivation:
      round_half_away_from_zero:
        source: AVGDD_RAW
        digits: 1

    submission:
      core: Cond
      mandatory: false
      length: 8
      significant_digits: 1
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADSL.AVGDD
        type: Computation
        description: CUMDOSE/TRTDURD
  - name: AGE
    type: float
    label: Age
    derivation: DM.AGE

    submission:
      core: Cond
      mandatory: false
      length: 8
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADSL.AGE
        type: Computation
        description: DM.AGE
      significant_digits: 0
  - name: AGEGR1
    type: str
    label: Pooled Age Group 1
    derivation:
      # NB: the reference groups 65 and 80 into "65-80" (closed [65, 80]
      # interval), which cut cannot express; hence the explicit case.
      case:
        - when: "DM.AGE < 65"
          then: "'<65'"
        - when: "DM.AGE <= 80"
          then: "'65-80'"
        - otherwise: "'>80'"

    submission:
      core: Cond
      mandatory: false
      length: 5
      origins:
        - type: Derived
      codelist: AGEGR1
      method:
        name: Algorithm to derive ADSL.AGEGR1
        type: Computation
        description: Character variable derived from ADSL.AGEGR1N
  - name: AGEGR1N
    type: float
    label: Pooled Age Group 1 (N)
    derivation:
      mapping:
        source: AGEGR1
        dict:
          "<65": 1
          "65-80": 2
          ">80": 3

    submission:
      core: Cond
      mandatory: false
      length: 8
      origins:
        - type: Derived
      codelist: AGEGR1N
      method:
        name: Algorithm to derive ADSL.AGEGR1N
        type: Computation
        description: AGEGR1 = 1 if AGE <65. AGEGR1 = 2 if AGE 65-80. AGEGR1 = 3 if AGE >80.
      significant_digits: 0
  - name: AGEU
    type: str
    label: Age Units
    derivation: DM.AGEU

    submission:
      core: Cond
      mandatory: false
      length: 5
      origins:
        - type: Derived
      codelist: AGEU
      method:
        name: Algorithm to derive ADSL.AGEU
        type: Computation
        description: DM.AGEU
  - name: RACE
    type: str
    label: Race
    derivation: DM.RACE

    submission:
      core: Cond
      mandatory: false
      length: 32
      origins:
        - type: Derived
      codelist: RACE
      method:
        name: Algorithm to derive ADSL.RACE
        type: Computation
        description: DM.RACE
  - name: RACEN
    type: float
    label: Race (N)
    derivation:
      mapping:
        source: DM.RACE
        dict:
          WHITE: 1
          BLACK OR AFRICAN AMERICAN: 2
          AMERICAN INDIAN OR ALASKA NATIVE: 6

    submission:
      core: Cond
      mandatory: false
      length: 8
      origins:
        - type: Derived
      codelist: RACEN
      method:
        name: Algorithm to derive ADSL.RACEN
        type: Computation
        description: Numeric code for RACE
      significant_digits: 0
  - name: SEX
    type: str
    label: Sex
    derivation: DM.SEX

    submission:
      core: Cond
      mandatory: false
      length: 1
      origins:
        - type: Derived
      codelist: SEX
      method:
        name: Algorithm to derive ADSL.SEX
        type: Computation
        description: DM.SEX
  - name: ETHNIC
    type: str
    label: Ethnicity
    derivation: DM.ETHNIC

    submission:
      core: Cond
      mandatory: false
      length: 22
      origins:
        - type: Derived
      codelist: ETHNIC
      method:
        name: Algorithm to derive ADSL.ETHNIC
        type: Computation
        description: DM.ETHNIC
  - name: SAFFL
    type: str
    label: Safety Population Flag
    derivation:
      case:
        - when: "DM.ARMCD <> 'Scrnfail' AND DM.ARMCD <> '' AND TRTSDT IS NOT NULL"
          then: "'Y'"
        - otherwise: "'N'"

    submission:
      core: Cond
      mandatory: false
      length: 1
      origins:
        - type: Derived
      codelist: YN
      method:
        name: Algorithm to derive ADSL.SAFFL
        type: Computation
        description: Y if ITTFL='Y' and TRTSDT ne missing. N otherwise
  - name: ITTFL
    type: str
    label: Intent-To-Treat Population Flag
    derivation:
      case:
        - when: "DM.ARMCD <> 'Scrnfail' AND DM.ARMCD <> ''"
          then: "'Y'"
        - otherwise: "'N'"

    submission:
      core: Cond
      mandatory: false
      length: 1
      origins:
        - type: Derived
      codelist: YN
      method:
        name: Algorithm to derive ADSL.ITTFL
        type: Computation
        description: Y if ARMCD ne ' '. N otherwise
  - name: N_ACTOT
    type: float
    label: Post-baseline ADAS-Cog records (helper)
    derivation:
      aggregate:
        expr: "COUNT(QS.QSSEQ)"
        filter: "QS.VISITNUM > 3 AND QS.QSTESTCD = 'ACTOT'"

  - name: N_CIBIC
    type: float
    label: Post-baseline CIBIC+ records (helper)
    derivation:
      aggregate:
        expr: "COUNT(QS.QSSEQ)"
        filter: "QS.VISITNUM > 3 AND QS.QSTESTCD = 'CIBIC'"

  - name: EFFFL
    type: str
    label: Efficacy Population Flag
    derivation:
      case:
        - when: "SAFFL = 'Y' AND N_ACTOT > 0 AND N_CIBIC > 0"
          then: "'Y'"
        - otherwise: "'N'"

    submission:
      core: Cond
      mandatory: false
      length: 1
      origins:
        - type: Derived
      codelist: YN
      method:
        name: Algorithm to derive ADSL.EFFFL
        type: Computation
        description: Y if SAFFL='Y AND subject has at least one record in QS for ADAS-Cog with VISITNUM>3
          AND at least one record in QS for CIBIC+ with VISITNUM>3, N otherwise
  - name: N_WK8
    type: float
    label: Week 8 visit records (helper)
    derivation:
      aggregate:
        expr: "COUNT(SV.USUBJID)"
        filter: "SV.VISITNUM = 8"

  - name: COMP8FL
    type: str
    label: Completers of Week 8 Population Flag
    derivation:
      case:
        - when: "N_WK8 > 0"
          then: "'Y'"
        - otherwise: "'N'"

    submission:
      core: Cond
      mandatory: false
      length: 1
      origins:
        - type: Derived
      codelist: YN
      method:
        name: Algorithm to derive ADSL.COMP8FL
        type: Computation
        description: Y if subject has a SV.VISITNUM=8 and ENDDT >= date of visit 8, N otherwise
  - name: N_WK16
    type: float
    label: Week 16 visit records (helper)
    derivation:
      aggregate:
        expr: "COUNT(SV.USUBJID)"
        filter: "SV.VISITNUM = 10"

  - name: COMP16FL
    type: str
    label: Completers of Week 16 Population Flag
    derivation:
      case:
        - when: "N_WK16 > 0"
          then: "'Y'"
        - otherwise: "'N'"

    submission:
      core: Cond
      mandatory: false
      length: 1
      origins:
        - type: Derived
      codelist: YN
      method:
        name: Algorithm to derive ADSL.COMP16FL
        type: Computation
        description: Y if subject has a SV.VISITNUM=10 and ENDDT>=date of visit 10, N otherwise
  - name: N_WK24
    type: float
    label: Week 24 visit records (helper)
    derivation:
      aggregate:
        expr: "COUNT(SV.USUBJID)"
        filter: "SV.VISITNUM = 12"

  - name: COMP24FL
    type: str
    label: Completers of Week 24 Population Flag
    derivation:
      case:
        - when: "N_WK24 > 0"
          then: "'Y'"
        - otherwise: "'N'"

    submission:
      core: Cond
      mandatory: false
      length: 1
      origins:
        - type: Derived
      codelist: YN
      method:
        name: Algorithm to derive ADSL.COMP24FL
        type: Computation
        description: Y if subject has a SV.VISITNUM=12 and ENDDT>= date of visit 12 , N otherwise
  - name: DISCONFL
    type: str
    label: Did the Subject Discontinue the Study?
    derivation:
      case:
        - when: "DS_EOS.DSSTDTC IS NOT NULL AND DS_EOS.DSDECOD <> 'COMPLETED'"
          then: "'Y'"

    submission:
      core: Cond
      mandatory: false
      length: 1
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADSL.DISCONFL
        type: Computation
        description: Y if DCREASCD ^= 'Completed'. Null otherwise
  - name: DSRAEFL
    type: str
    label: Discontinued due to AE?
    derivation:
      case:
        - when: "DS_EOS.DSDECOD = 'ADVERSE EVENT'"
          then: "'Y'"

    submission:
      core: Cond
      mandatory: false
      length: 1
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADSL.DSRAEFL
        type: Computation
        description: Y if DCREASCD='Adverse Event'. Null otherwise
  - name: DTHFL
    type: str
    label: Subject Died?
    derivation:
      case:
        - when: "DM.DTHFL = 'Y'"
          then: "'Y'"

    submission:
      core: Cond
      mandatory: false
      length: 1
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADSL.DTHFL
        type: Computation
        description: DM.DTHFL
  - name: HEIGHTBL_RAW
    type: float
    label: Baseline height, unrounded (helper)
    derivation: VS_HT.VSSTRESN

  - name: HEIGHTBL
    type: float
    label: Baseline Height (cm)
    derivation:
      round_half_away_from_zero:
        source: HEIGHTBL_RAW
        digits: 1

    submission:
      core: Cond
      mandatory: false
      length: 8
      significant_digits: 1
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADSL.HEIGHTBL
        type: Computation
        description: VSSTRESN when VS.VSTESTCD='HEIGHT' and VS.VISITNUM=1
  - name: WEIGHTBL_RAW
    type: float
    label: Baseline weight, unrounded (helper)
    derivation: VS_WT.VSSTRESN

  - name: WEIGHTBL
    type: float
    label: Baseline Weight (kg)
    derivation:
      round_half_away_from_zero:
        source: WEIGHTBL_RAW
        digits: 1

    submission:
      core: Cond
      mandatory: false
      length: 8
      significant_digits: 1
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADSL.WEIGHTBL
        type: Computation
        description: VSSTRESN when VS.VSTESTCD='WEIGHT' and VS.VISITNUM=3
  - name: BMIBL_RAW
    type: float
    label: Baseline BMI, unrounded (helper)
    derivation: "WEIGHTBL / POWER(NULLIF(HEIGHTBL, 0) / 100, 2)"

  - name: BMIBL
    type: float
    label: Baseline BMI (kg/m^2)
    derivation:
      round_half_away_from_zero:
        source: BMIBL_RAW
        digits: 1

    submission:
      core: Cond
      mandatory: false
      length: 8
      significant_digits: 1
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADSL.BMIBL
        type: Computation
        description: WEIGHTBL / ((HEIGHTBL/100)**2)
  - name: BMIBLGR1
    type: str
    label: Pooled Baseline BMI Group 1
    derivation:
      cut:
        source: BMIBL
        breaks:
          - 25
          - 30
        labels:
          - "<25"
          - "25-<30"
          - ">=30"

    submission:
      core: Cond
      mandatory: false
      length: 6
      origins:
        - type: Derived
      codelist: BMICAT
      method:
        name: Algorithm to derive ADSL.BMIBLGR1
        type: Computation
        description: "BMIBLGR1=\"<25\" if . < BMIBL <25.\nBMIBLGR1=\"25-<30\" if 25 <=BMIBL <30.\nBMIBLGR1=\"\
          >=30\"if BMIBL >=30."
  - name: EDUCLVL
    type: float
    label: Years of Education
    derivation: SC_ED.SCSTRESN

    submission:
      core: Cond
      mandatory: false
      length: 8
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADSL.EDUCLVL
        type: Computation
        description: SC.SCSTRESN where SC.SCTESTCD=EDLEVEL
      significant_digits: 0
  - name: DISONSDT
    type: date
    label: Date of Onset of Disease
    derivation:
      impute:
        type: date
        source: MH_DX.MHSTDTC
        month: 1
        day: 1

    submission:
      core: Cond
      mandatory: false
      display_format: DATE9.
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADSL.DISONSDT
        type: Computation
        description: MH.MHSTDTC where MHCAT='PRIMARY DIAGNOSIS' converted to SAS date
  - name: VISIT1DT
    type: date
    label: Date of Visit 1
    derivation:
      impute:
        type: date
        source: SV_V1.SVSTDTC
        month: 1
        day: 1

    submission:
      core: Cond
      mandatory: false
      display_format: DATE9.
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADSL.VISIT1DT
        type: Computation
        description: SV.SVSTDTC when SV.VISITNUM=1, converted to SAS date
  - name: DURDISD
    type: float
    label: Disease duration in days, inclusive (helper)
    derivation:
      diff:
        type: date
        start: DISONSDT
        end: VISIT1DT
        unit: day
        closed: both

  - name: DURDIS_RAW
    type: float
    label: Disease duration in months, unrounded (helper)
    derivation: "DURDISD / 30.4375"

  - name: DURDIS
    type: float
    label: Duration of Disease (Months)
    derivation:
      round_half_away_from_zero:
        source: DURDIS_RAW
        digits: 1

    submission:
      core: Cond
      mandatory: false
      length: 8
      significant_digits: 1
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADSL.DURDIS
        type: Computation
        description: number of months between VISIT1DT and DISONSET
  - name: DURDSGR1
    type: str
    label: Pooled Disease Duration Group 1
    derivation:
      cut:
        source: DURDIS
        breaks:
          - 12
        labels:
          - "<12"
          - ">=12"

    submission:
      core: Cond
      mandatory: false
      length: 4
      origins:
        - type: Derived
      codelist: DURDISC
      method:
        name: Algorithm to derive ADSL.DURDSGR1
        type: Computation
        description: grouping DURDIS values as <12 and >=12
  - name: RFSTDTC
    type: str
    label: Subject Reference Start Date/Time
    derivation: DM.RFSTDTC

    submission:
      core: Cond
      mandatory: false
      length: 20
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADSL.RFSTDTC
        type: Computation
        description: DM.RFSTDTC
  - name: RFENDTC
    type: str
    label: Subject Reference End Date/Time
    derivation: DM.RFENDTC

    submission:
      core: Cond
      mandatory: false
      length: 20
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADSL.RFENDTC
        type: Computation
        description: DM.RFENDTC
  - name: VISNUMEN_ROUND
    type: float
    label: Last visit number, rounded (helper)
    derivation:
      round_half_away_from_zero:
        source: SV_LAST.VISITNUM
        digits: 0

  - name: VISNUMEN
    type: float
    label: End of Trt Visit (Vis 12 or Early Term.)
    derivation:
      case:
        - when: "VISNUMEN_ROUND = 13"
          then: 12
        - otherwise: VISNUMEN_ROUND

    submission:
      core: Cond
      mandatory: false
      length: 8
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADSL.VISNUMEN
        type: Computation
        description: if DS.VISITNUM=13 where DSTERM='PROTCOL COMPLETED' then VISNUMEN=12, otherwise
          VISNUMEN=DS.VISITNUM where DSTERM='PROTCOL COMPLETED'
      significant_digits: 0
  - name: RFENDT
    type: date
    label: Date of Discontinuation/Completion
    derivation:
      impute:
        type: date
        source: DM.RFENDTC
        month: 1
        day: 1

    submission:
      core: Cond
      mandatory: false
      display_format: DATE9.
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADSL.RFENDT
        type: Computation
        description: RFENDTC converted to SAS date
  - name: DCDECOD
    type: str
    label: Standardized Disposition Term
    derivation: DS_EOS.DSDECOD

    submission:
      core: Cond
      mandatory: false
      length: 27
      origins:
        - type: Derived
      codelist: DISCCD
      method:
        name: Algorithm to derive ADSL.DCDECOD
        type: Computation
        description: DS.DSDECOD where DSCAT='DISPOSITION EVENT'
  - name: EOSSTT
    type: str
    label: End of Study Status
    derivation:
      case:
        - when: "DS_EOS.DSDECOD = 'COMPLETED'"
          then: "'COMPLETED'"
        - otherwise: "'DISCONTINUED'"

    submission:
      core: Cond
      mandatory: false
      length: 12
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADSL.EOSSTT
        type: Computation
        description: COMPLETED if ADSL.DCDECOD='COMPLETED'. DISCONTINUED if ADSL.DCDECOD not equal to
          COMPLETED.
  - name: DCSREAS
    type: str
    label: Reason for Discontinuation from Study
    derivation:
      case:
        - when: "DS_EOS.DSTERM = 'PROTOCOL ENTRY CRITERIA NOT MET'"
          then: "'I/E Not Met'"
        - when: "DS_EOS.DSDECOD = 'COMPLETED'"
          then: "''"
        - otherwise:
            mapping:
              source: DS_EOS.DSDECOD
              dict:
                ADVERSE EVENT: Adverse Event
                DEATH: Death
                LACK OF EFFICACY: Lack of Efficacy
                LOST TO FOLLOW-UP: Lost to Follow-up
                PHYSICIAN DECISION: Physician Decision
                PROTOCOL VIOLATION: Protocol Violation
                STUDY TERMINATED BY SPONSOR: Sponsor Decision
                WITHDRAWAL BY SUBJECT: Withdrew Consent

    submission:
      core: Cond
      mandatory: false
      length: 18
      origins:
        - type: Derived
      codelist: DISCREAS
      method:
        name: Algorithm to derive ADSL.DCREASCD
        type: Computation
        description: Grouping of DCDECOD values to support summarizing study completion status and reason
          for discontinuation
  - name: MMSETOT
    type: float
    label: MMSE Total
    derivation:
      aggregate:
        expr: "SUM(QS.QSSTRESN)"
        filter: "QS.QSCAT = 'MINI-MENTAL STATE'"
    submission:
      core: Cond
      mandatory: false
      length: 8
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADSL.MMSETOT
        type: Computation
        description: sum of QS.QSORRES values for the subject when QSCAT = MINI-MENTAL STATE
      significant_digits: 0
submission:
  label: Subject-Level Analysis Dataset
  class: SUBJECT LEVEL ANALYSIS DATASET
  structure: one record per subject. Screen Failures are excluded.
  repeating: false
  reference_data: false
