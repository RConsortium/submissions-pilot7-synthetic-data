yamaa: "1.0"
type: spec
model: ADaM

parent: ../../../spec/yamaa/templates/adsl.yaml

domain: ADSL

input:
  DM:
    empty_string: missing
  DS: ../../data/sdtm/ds.parquet
  EX:
    path: ../../data/sdtm/ex.parquet
    key:
      - STUDYID
      - USUBJID
  QS:
    path: ../../data/sdtm/qs.parquet
    key:
      - STUDYID
      - USUBJID
  SV:
    path: ../../data/sdtm/sv.parquet
    key:
      - STUDYID
      - USUBJID
  VS: ../../data/sdtm/vs.parquet
  SC: ../../data/sdtm/sc.parquet
  MH: ../../data/sdtm/mh.parquet
filter: "DM.ACTARMCD <> 'Scrnfail'"

output:
  path: ../../data/adam/adsl-yamaa.parquet
  columns:
    - STUDYID
    - USUBJID
    - SUBJID
    - SITEID
    - SITEGR1
    - ARM
    - TRT01P
    - TRT01PN
    - TRT01A
    - TRT01AN
    - TRTSDT
    - TRTEDT
    - TRTDURD
    - AVGDD
    - CUMDOSE
    - AGE
    - AGEGR1
    - AGEGR1N
    - AGEU
    - RACE
    - RACEN
    - SEX
    - ETHNIC
    - SAFFL
    - ITTFL
    - EFFFL
    - COMP8FL
    - COMP16FL
    - COMP24FL
    - DISCONFL
    - DSRAEFL
    - DTHFL
    - BMIBL
    - BMIBLGR1
    - HEIGHTBL
    - WEIGHTBL
    - EDUCLVL
    - DISONSDT
    - DURDIS
    - DURDSGR1
    - VISIT1DT
    - RFSTDTC
    - RFENDTC
    - VISNUMEN
    - RFENDT
    - DCDECOD
    - EOSSTT
    - DCSREAS
    - MMSETOT

intermediates:
  - id: EX_FIRST
    dataset: EX
    key:
      - STUDYID
      - USUBJID
    order_by:
      - variable: EX.EXSTDTC
        nulls: last
    keep: first

  - id: DS_EOS
    dataset: DS
    key:
      - STUDYID
      - USUBJID
    filter: "DS.DSCAT = 'DISPOSITION EVENT' AND DS.DSDECOD <>
      'SCREEN FAILURE'"
    order_by:
      - variable: DS.DSSTDTC
        nulls: last
    keep: first

  - id: SV_V1
    dataset: SV
    key:
      - STUDYID
      - USUBJID
    filter: "SV.VISITNUM = 1"
    order_by:
      - variable: SV.SVSTDTC
        nulls: last
    keep: first

  - id: SV_LAST
    dataset: SV
    key:
      - STUDYID
      - USUBJID
    filter: "SV.VISITNUM < 100"
    order_by:
      - variable: SV.SVSTDTC
        nulls: last
    keep: last

  - id: VS_HT
    dataset: VS
    key:
      - STUDYID
      - USUBJID
    filter: "VS.VSTESTCD = 'HEIGHT' AND VS.VISITNUM = 1"
    order_by:
      - variable: VS.VSDTC
        nulls: last
    keep: first

  - id: VS_WT
    dataset: VS
    key:
      - STUDYID
      - USUBJID
    filter: "VS.VSTESTCD = 'WEIGHT' AND VS.VISITNUM = 3"
    order_by:
      - variable: VS.VSDTC
        nulls: last
    keep: first

  - id: SC_ED
    dataset: SC
    key:
      - STUDYID
      - USUBJID
    filter: "SC.SCTESTCD = 'EDLEVEL'"
    order_by:
      - variable: SC.SCDTC
        nulls: last
    keep: first

  - id: MH_DX
    dataset: MH
    key:
      - STUDYID
      - USUBJID
    filter: "MH.MHCAT = 'PRIMARY DIAGNOSIS'"
    order_by:
      - variable: MH.MHSTDTC
        nulls: last
    keep: first

columns:
  - name: TRTSDT
    type: date
    label: Date of First Exposure to Treatment
    derivation:
      impute:
        type: date
        source: EX_FIRST.EXSTDTC
        month: 1
        day: last

  - name: TRTEDT
    type: date
    label: Date of Last Exposure to Treatment
    derivation:
      aggregate:
        derivations:
          EXENDT_RAW:
            type: date
            derivation:
              impute:
                type: date
                source: EX.EXENDTC
                month: 1
                day: last
          EOSDT:
            type: date
            derivation:
              impute:
                type: date
                source: DS_EOS.DSSTDTC
                month: 1
                day: last
          EXENDT_CAPPED:
            type: date
            derivation:
              least:
                sources:
                  - EXENDT_RAW
                  - EOSDT
        expr: "MAX(EXENDT_CAPPED)"

  - name: TRTDURD
    type: float
    label: Total Treatment Duration (Days)
    derivation:
      diff:
        type: date
        start: TRTSDT
        end: TRTEDT
        unit: day
        closed: both

  - name: CUMDOSE
    type: float
    label: Cumulative Dose (as planned)
    derivation:
      aggregate:
        derivations:
          EXSTDT:
            type: date
            derivation:
              impute:
                type: date
                source: EX.EXSTDTC
                month: 1
                day: last
          EXENDT_RAW:
            type: date
            derivation:
              impute:
                type: date
                source: EX.EXENDTC
                month: 1
                day: last
          EOSDT:
            type: date
            derivation:
              impute:
                type: date
                source: DS_EOS.DSSTDTC
                month: 1
                day: last
          EXENDT_CAPPED:
            type: date
            derivation:
              least:
                sources:
                  - EXENDT_RAW
                  - EOSDT
          EXDURD:
            type: float
            derivation:
              diff:
                type: date
                start: EXSTDT
                end: EXENDT_CAPPED
                unit: day
                closed: both
          EXDOSE_TOTAL:
            type: float
            derivation: "EX.EXDOSE * EXDURD"
        expr: "SUM(EXDOSE_TOTAL)"

  - name: AVGDD_RAW
    type: float
    label: Average daily dose, unrounded (helper)
    derivation: "CUMDOSE / NULLIF(TRTDURD, 0)"

  - name: AVGDD
    type: float
    label: Avg Daily Dose (as planned)
    derivation:
      round_half_away_from_zero:
        source: AVGDD_RAW
        digits: 1

  - name: HEIGHTBL_RAW
    type: float
    label: Baseline height, unrounded (helper)
    derivation: VS_HT.VSSTRESN

  - name: HEIGHTBL
    type: float
    label: Baseline Height (cm)
    derivation:
      round_half_away_from_zero:
        source: HEIGHTBL_RAW
        digits: 1

  - name: WEIGHTBL_RAW
    type: float
    label: Baseline weight, unrounded (helper)
    derivation: VS_WT.VSSTRESN

  - name: WEIGHTBL
    type: float
    label: Baseline Weight (kg)
    derivation:
      round_half_away_from_zero:
        source: WEIGHTBL_RAW
        digits: 1

  - name: BMIBL_RAW
    type: float
    label: Baseline BMI, unrounded (helper)
    derivation: "WEIGHTBL / POWER(NULLIF(HEIGHTBL, 0) / 100, 2)"

  - name: BMIBL
    type: float
    label: Baseline BMI (kg/m^2)
    derivation:
      round_half_away_from_zero:
        source: BMIBL_RAW
        digits: 1

  - name: BMIBLGR1
    type: str
    label: Pooled Baseline BMI Group 1
    derivation:
      cut:
        source: BMIBL
        breaks:
          - 25
          - 30
        labels:
          - "<25"
          - "25-<30"
          - ">=30"

        missing: ''

  - name: EDUCLVL
    type: float
    label: Years of Education
    derivation: SC_ED.SCSTRESN

  - name: DISONSDT
    type: date
    label: Date of Onset of Disease
    derivation:
      impute:
        type: date
        source: MH_DX.MHSTDTC
        month: 1
        day: 1

  - name: VISIT1DT
    type: date
    label: Date of Visit 1
    derivation:
      impute:
        type: date
        source: SV_V1.SVSTDTC
        month: 1
        day: 1

  - name: DURDISD
    type: float
    label: Disease duration in days, inclusive (helper)
    derivation:
      diff:
        type: date
        start: DISONSDT
        end: VISIT1DT
        unit: day
        closed: both

  - name: DURDIS_RAW
    type: float
    label: Disease duration in months, unrounded (helper)
    derivation: "DURDISD / 30.4375"

  - name: DURDIS
    type: float
    label: Duration of Disease (Months)
    derivation:
      round_half_away_from_zero:
        source: DURDIS_RAW
        digits: 1

  - name: DURDSGR1
    type: str
    label: Pooled Disease Duration Group 1
    derivation:
      cut:
        source: DURDIS
        breaks:
          - 12
        labels:
          - "<12"
          - ">=12"

  - name: MMSETOT
    type: float
    label: MMSE Total
    derivation:
      aggregate:
        expr: "SUM(QS.QSSTRESN)"
        filter: "QS.QSCAT = 'MINI-MENTAL STATE'"

  - name: SITEGR1
    type: str
    label: Pooled Site Group 1
    derivation:
      case:
        - when: "SITEID IN ('702', '706', '707', '711', '714',
            '715', '717')"
          then: "'900'"
        - otherwise: SITEID

  - name: TRT01PN
    type: float
    label: Planned Treatment for Period 01 (N)
    derivation:
      mapping:
        source: DM.ARM
        dict:
          Placebo: 0
          Xanomeline Low Dose: 54
          Xanomeline High Dose: 81

  - name: TRT01A
    type: str
    label: Actual Treatment for Period 01
    derivation: DM.ARM

  - name: TRT01AN
    type: float
    label: Actual Treatment for Period 01 (N)
    derivation:
      mapping:
        source: DM.ARM
        dict:
          Placebo: 0
          Xanomeline Low Dose: 54
          Xanomeline High Dose: 81

  - name: AGEGR1
    type: str
    label: Pooled Age Group 1
    derivation:
      # NB: the reference groups 65 and 80 into "65-80" (closed [65, 80]
      # interval), which cut cannot express; hence the explicit case.
      case:
        - when: "DM.AGE < 65"
          then: "'<65'"
        - when: "DM.AGE <= 80"
          then: "'65-80'"
        - otherwise: "'>80'"

  - name: AGEGR1N
    type: float
    label: Pooled Age Group 1 (N)
    derivation:
      mapping:
        source: AGEGR1
        dict:
          "<65": 1
          "65-80": 2
          ">80": 3

  - name: RACEN
    type: float
    label: Race (N)
    derivation:
      mapping:
        source: DM.RACE
        dict:
          WHITE: 1
          BLACK OR AFRICAN AMERICAN: 2
          AMERICAN INDIAN OR ALASKA NATIVE: 6

  - name: SAFFL
    type: str
    label: Safety Population Flag
    derivation:
      case:
        - when: "DM.ARMCD <> 'Scrnfail' AND DM.ARMCD <> '' AND
            TRTSDT IS NOT NULL"
          then: "'Y'"
        - otherwise: "'N'"

  - name: ITTFL
    type: str
    label: Intent-To-Treat Population Flag
    derivation:
      case:
        - when: "DM.ARMCD <> 'Scrnfail' AND DM.ARMCD <> ''"
          then: "'Y'"
        - otherwise: "'N'"

  - name: N_ACTOT
    type: float
    label: Post-baseline ADAS-Cog records (helper)
    derivation:
      aggregate:
        expr: "COUNT(QS.QSSEQ)"
        filter: "QS.VISITNUM > 3 AND QS.QSTESTCD = 'ACTOT'"

  - name: N_CIBIC
    type: float
    label: Post-baseline CIBIC+ records (helper)
    derivation:
      aggregate:
        expr: "COUNT(QS.QSSEQ)"
        filter: "QS.VISITNUM > 3 AND QS.QSTESTCD = 'CIBIC'"

  - name: EFFFL
    type: str
    label: Efficacy Population Flag
    derivation:
      case:
        - when: "SAFFL = 'Y' AND N_ACTOT > 0 AND N_CIBIC > 0"
          then: "'Y'"
        - otherwise: "'N'"

  - name: N_WK8
    type: float
    label: Week 8 visit records (helper)
    derivation:
      aggregate:
        expr: "COUNT(SV.USUBJID)"
        filter: "SV.VISITNUM = 8"

  - name: COMP8FL
    type: str
    label: Completers of Week 8 Population Flag
    derivation:
      case:
        - when: "N_WK8 > 0"
          then: "'Y'"
        - otherwise: "'N'"

  - name: N_WK16
    type: float
    label: Week 16 visit records (helper)
    derivation:
      aggregate:
        expr: "COUNT(SV.USUBJID)"
        filter: "SV.VISITNUM = 10"

  - name: COMP16FL
    type: str
    label: Completers of Week 16 Population Flag
    derivation:
      case:
        - when: "N_WK16 > 0"
          then: "'Y'"
        - otherwise: "'N'"

  - name: N_WK24
    type: float
    label: Week 24 visit records (helper)
    derivation:
      aggregate:
        expr: "COUNT(SV.USUBJID)"
        filter: "SV.VISITNUM = 12"

  - name: COMP24FL
    type: str
    label: Completers of Week 24 Population Flag
    derivation:
      case:
        - when: "N_WK24 > 0"
          then: "'Y'"
        - otherwise: "'N'"

  - name: DISCONFL
    type: str
    label: Did the Subject Discontinue the Study?
    derivation:
      case:
        - when: "DS_EOS.DSSTDTC IS NOT NULL AND DS_EOS.DSDECOD
            <> 'COMPLETED'"
          then: "'Y'"

        - otherwise: "''"

  - name: DSRAEFL
    type: str
    label: Discontinued due to AE?
    derivation:
      case:
        - when: "DS_EOS.DSDECOD = 'ADVERSE EVENT'"
          then: "'Y'"

        - otherwise: "''"

  - name: DTHFL
    type: str
    label: Subject Died?
    derivation:
      case:
        - when: "DM.DTHFL = 'Y'"
          then: "'Y'"

        - otherwise: "''"

  - name: RFENDTC
    type: str
    label: Subject Reference End Date/Time
    derivation: DM.RFENDTC

  - name: VISNUMEN_ROUND
    type: float
    label: Last visit number, rounded (helper)
    derivation:
      round_half_away_from_zero:
        source: SV_LAST.VISITNUM
        digits: 0

  - name: VISNUMEN
    type: float
    label: End of Trt Visit (Vis 12 or Early Term.)
    derivation:
      case:
        - when: "VISNUMEN_ROUND = 13"
          then: 12
        - otherwise: VISNUMEN_ROUND

  - name: RFENDT
    type: date
    label: Date of Discontinuation/Completion
    derivation:
      impute:
        type: date
        source: DM.RFENDTC
        month: 1
        day: 1

  - name: DCDECOD
    type: str
    label: Standardized Disposition Term
    derivation: DS_EOS.DSDECOD

  - name: EOSSTT
    type: str
    label: End of Study Status
    derivation:
      case:
        - when: "DS_EOS.DSDECOD = 'COMPLETED'"
          then: "'COMPLETED'"
        - otherwise: "'DISCONTINUED'"

  - name: DCSREAS
    type: str
    label: Reason for Discontinuation from Study
    derivation:
      case:
        - when: "DS_EOS.DSTERM = 'PROTOCOL ENTRY CRITERIA NOT
            MET'"
          then: "'I/E Not Met'"
        - when: "DS_EOS.DSDECOD = 'COMPLETED'"
          then: "''"
        - otherwise:
            mapping:
              source: DS_EOS.DSDECOD
              dict:
                ADVERSE EVENT: Adverse Event
                DEATH: Death
                LACK OF EFFICACY: Lack of Efficacy
                LOST TO FOLLOW-UP: Lost to Follow-up
                PHYSICIAN DECISION: Physician Decision
                PROTOCOL VIOLATION: Protocol Violation
                STUDY TERMINATED BY SPONSOR: Sponsor
                  Decision
                WITHDRAWAL BY SUBJECT: Withdrew Consent

verifications:
  - assert:
      id: treatment_date_order
      when: "TRTSDT IS NOT NULL AND TRTEDT IS NOT NULL"
      require: "TRTEDT >= TRTSDT"
