# Submission Pilot 3 ADAE: the Pilot 3 layer and the Define-XML metadata
# that only this package records.
yamaa: "1.0"
type: spec
parent: ../../../spec/yamaa/cdiscpilot01/pilot3/adae.yaml
domain: ADAE

columns:
  - name: AOCC01FL
    submission:
      data_type: text
      mandatory: false
      length: 1
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADAE.AOCC01FL
        description: Subset to CQ01NAM='' and TRTEMFL='Y' and sort by Subject
          (USUBJID), Start Date (ASTDT), and Sequence Number (AESEQ) and flag
          the first record (set AOCC01FL=?Y?) within each Subject (Flag First
          Treatment Emergent Dermatological Event for Time to Event Analysis)

submission:
  mode: historical
  artifact: adae.xpt
  label: Adverse Events Analysis Dataset
  class: ADAM OTHER
  structure: one record per subject per adverse event
  repeating: true
