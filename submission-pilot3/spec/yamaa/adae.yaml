yamaa: "1.0"
type: spec
model: ADaM

parent: ../../../spec/yamaa/templates/subject-analysis.yaml

domain: ADAE

keys:
  - STUDYID
  - USUBJID
  - AESEQ

input:
  AE: ../../data/sdtm/ae.parquet
  ADSL:
    empty_string: missing
    key:
      - STUDYID
      - USUBJID
base: AE

# ADSL is read as a derived predecessor dataset, exactly as the pilot 3 R
# program reads the derived adsl.xpt (derive_vars_merged on STUDYID/USUBJID).
# Its STUDYID/USUBJID keys permit a direct implicit join from each AE row.

output:
  path: ../../data/adam/adae-yamaa.parquet
  columns:
    - STUDYID
    - SITEID
    - USUBJID
    - TRTA
    - TRTAN
    - AGE
    - AGEGR1
    - AGEGR1N
    - RACE
    - RACEN
    - SEX
    - SAFFL
    - TRTSDT
    - TRTEDT
    - ASTDT
    - ASTDTF
    - ASTDY
    - AENDT
    - AENDY
    - ADURN
    - ADURU
    - AETERM
    - AELLT
    - AELLTCD
    - AEDECOD
    - AEPTCD
    - AEHLT
    - AEHLTCD
    - AEHLGT
    - AEHLGTCD
    - AEBODSYS
    - AESOC
    - AESOCCD
    - AESEV
    - AESER
    - AESCAN
    - AESCONG
    - AESDISAB
    - AESDTH
    - AESHOSP
    - AESLIFE
    - AESOD
    - AEREL
    - AEACN
    - AEOUT
    - AESEQ
    - TRTEMFL
    - AOCCFL
    - AOCCSFL
    - AOCCPFL
    - AOCC02FL
    - AOCC03FL
    - AOCC04FL
    - CQ01NAM
    - AOCC01FL

windows:
  SEQ_OCC_ORDER:
    group_by:
      - STUDYID
      - USUBJID
    order_by:
      - variable: ASTDT
        nulls: last
      - variable: AESEQ
        nulls: last
    filter: "TRTEMFL = 'Y'"

  SEQ_OCCS_ORDER:
    group_by:
      - STUDYID
      - USUBJID
      - AEBODSYS
    order_by:
      - variable: ASTDT
        nulls: last
      - variable: AESEQ
        nulls: last
    filter: "TRTEMFL = 'Y'"

  SEQ_OCCP_ORDER:
    group_by:
      - STUDYID
      - USUBJID
      - AEBODSYS
      - AEDECOD
    order_by:
      - variable: ASTDT
        nulls: last
      - variable: AESEQ
        nulls: last
    filter: "TRTEMFL = 'Y'"

  SEQ_OCC02_ORDER:
    group_by:
      - STUDYID
      - USUBJID
    order_by:
      - variable: ASTDT
        nulls: last
      - variable: AESEQ
        nulls: last
    filter: "TRTEMFL = 'Y' AND AESER = 'Y'"

  SEQ_OCC03_ORDER:
    group_by:
      - STUDYID
      - USUBJID
      - AEBODSYS
    order_by:
      - variable: ASTDT
        nulls: last
      - variable: AESEQ
        nulls: last
    filter: "TRTEMFL = 'Y' AND AESER = 'Y'"

  SEQ_OCC04_ORDER:
    group_by:
      - STUDYID
      - USUBJID
      - AEBODSYS
      - AEDECOD
    order_by:
      - variable: ASTDT
        nulls: last
      - variable: AESEQ
        nulls: last
    filter: "TRTEMFL = 'Y' AND AESER = 'Y'"

  SEQ_OCC01_ORDER:
    group_by:
      - STUDYID
      - USUBJID
    order_by:
      - variable: ASTDT
        nulls: last
      - variable: AESEQ
        nulls: last
    filter: "TRTEMFL = 'Y' AND CQ01NAM = 'DERMATOLOGIC EVENTS'"

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: AE.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: AE.USUBJID

  - name: ASTDT
    type: date
    label: Analysis Start Date
    derivation:
      # Supply the first day when the month is collected. A year-only
      # source stays missing because no month-imputation rule is declared.
      impute:
        type: date
        source: AE.AESTDTC
        day: 1
        invalid:

  - name: ASTDTPR
    type: str
    label: Astdtpr (helper)
    derivation:
      precision:
        type: date
        source: ASTDT

  - name: ASTDTF
    type: str
    label: Analysis Start Date Imputation Flag
    derivation:
      case:
        - when: "ASTDTPR = 'month'"
          then: "'D'"

        - otherwise: "''"

  - name: ASTDY
    type: float
    label: Analysis Start Relative Day
    derivation:
      study_day:
        source: ASTDT
        reference: TRTSDT

  - name: AENDT
    type: date
    label: Analysis End Date
    derivation:
      # Complete a collected month to its last day; a year alone stays
      # missing because no month-imputation rule is declared.
      impute:
        type: date
        source: AE.AEENDTC
        day: last
        invalid:

  - name: AENDY
    type: float
    label: Analysis End Relative Day
    derivation:
      study_day:
        source: AENDT
        reference: TRTSDT

  - name: ADURN
    type: float
    label: Analysis Duration (N)
    derivation:
      diff:
        type: date
        start: ASTDT
        end: AENDT
        unit: day
        closed: both

  - name: ADURU
    type: str
    label: Analysis Duration Units
    derivation:
      case:
        - when: "ADURN IS NOT NULL"
          then: "'DAYS'"

        - otherwise: "''"

  - name: AETERM
    type: str
    label: Reported Term for the Adverse Event
    derivation: AE.AETERM

  - name: AELLT
    type: str
    label: Lowest Level Term
    derivation: AE.AELLT

  - name: AELLTCD
    type: float
    label: Lowest Level Term Code
    derivation: AE.AELLTCD

  - name: AEDECOD
    type: str
    label: Dictionary-Derived Term
    derivation: AE.AEDECOD

  - name: AEPTCD
    type: float
    label: Preferred Term Code
    derivation: AE.AEPTCD

  - name: AEHLT
    type: str
    label: High Level Term
    derivation: AE.AEHLT

  - name: AEHLTCD
    type: float
    label: High Level Term Code
    derivation: AE.AEHLTCD

  - name: AEHLGT
    type: str
    label: High Level Group Term
    derivation: AE.AEHLGT

  - name: AEHLGTCD
    type: float
    label: High Level Group Term Code
    derivation: AE.AEHLGTCD

  - name: AEBODSYS
    type: str
    label: Body System or Organ Class
    derivation: AE.AEBODSYS

  - name: AESOC
    type: str
    label: Primary System Organ Class
    derivation: AE.AESOC

  - name: AESOCCD
    type: float
    label: Primary System Organ Class Code
    derivation: AE.AESOCCD

  - name: AESEV
    type: str
    label: Severity/Intensity
    derivation: AE.AESEV

  - name: AESER
    type: str
    label: Serious Event
    derivation: AE.AESER

  - name: AESCAN
    type: str
    label: Involves Cancer
    derivation: AE.AESCAN

  - name: AESCONG
    type: str
    label: Congenital Anomaly or Birth Defect
    derivation: AE.AESCONG

  - name: AESDISAB
    type: str
    label: Persist or Signif Disability/Incapacity
    derivation: AE.AESDISAB

  - name: AESDTH
    type: str
    label: Results in Death
    derivation: AE.AESDTH

  - name: AESHOSP
    type: str
    label: Requires or Prolongs Hospitalization
    derivation: AE.AESHOSP

  - name: AESLIFE
    type: str
    label: Is Life Threatening
    derivation: AE.AESLIFE

  - name: AESOD
    type: str
    label: Occurred with Overdose
    derivation: AE.AESOD

  - name: AEREL
    type: str
    label: Causality
    derivation:
      first_available:
        sources:
          - AE.AEREL
        missing: ''

  - name: AEACN
    type: str
    label: Action Taken with Study Treatment
    derivation:
      first_available:
        sources:
          - AE.AEACN
        missing: ''

  - name: AEOUT
    type: str
    label: Outcome of Adverse Event
    derivation: AE.AEOUT

  - name: AESEQ
    type: float
    label: Sequence Number
    derivation: AE.AESEQ

  - name: TRTEMFL
    type: str
    label: Treatment Emergent Analysis Flag
    derivation:
      case:
        - when: "ASTDT IS NOT NULL AND TRTSDT IS NOT NULL AND
            ASTDT >= TRTSDT"
          then: "'Y'"

        - otherwise: "''"

  - name: CQ01_PT
    type: str
    label: Cq01 Pt (helper)
    derivation:
      str_extract:
        source: AE.AEDECOD
        pattern: "APPLICATION|DERMATITIS|ERYTHEMA|BLISTER"
        no_match:

  - name: CQ01_SOC
    type: str
    label: Cq01 Soc (helper)
    derivation:
      str_extract:
        source: AE.AEBODSYS
        pattern: "SKIN AND SUBCUTANEOUS TISSUE DISORDERS"
        no_match:

  - name: CQ01_EXCL
    type: str
    label: Cq01 Excl (helper)
    derivation:
      str_extract:
        source: AE.AEDECOD
        pattern: "COLD SWEAT|HYPERHIDROSIS|ALOPECIA"
        no_match:

  - name: CQ01NAM
    type: str
    label: Customized Query 01 Name
    derivation:
      case:
        - when: >-
            CQ01_PT IS NOT NULL OR (CQ01_SOC IS NOT NULL AND CQ01_EXCL
            IS NULL)
          then: "'DERMATOLOGIC EVENTS'"

        - otherwise: "''"

  - name: SEQ_OCC
    type: int
    label: Seq Occ (helper)
    derivation:
      row_number:
        window: SEQ_OCC_ORDER

  - name: SEQ_OCCS
    type: int
    label: Seq Occs (helper)
    derivation:
      row_number:
        window: SEQ_OCCS_ORDER

  - name: SEQ_OCCP
    type: int
    label: Seq Occp (helper)
    derivation:
      row_number:
        window: SEQ_OCCP_ORDER

  - name: SEQ_OCC02
    type: int
    label: Seq Occ02 (helper)
    derivation:
      row_number:
        window: SEQ_OCC02_ORDER

  - name: SEQ_OCC03
    type: int
    label: Seq Occ03 (helper)
    derivation:
      row_number:
        window: SEQ_OCC03_ORDER

  - name: SEQ_OCC04
    type: int
    label: Seq Occ04 (helper)
    derivation:
      row_number:
        window: SEQ_OCC04_ORDER

  - name: SEQ_OCC01
    type: int
    label: Seq Occ01 (helper)
    derivation:
      row_number:
        window: SEQ_OCC01_ORDER

  - name: AOCCFL
    type: str
    label: 1st Occurrence within Subject Flag
    derivation:
      case:
        - when: "SEQ_OCC = 1"
          then: "'Y'"
        - otherwise: "''"

  - name: AOCCSFL
    type: str
    label: 1st Occurrence of SOC Flag
    derivation:
      case:
        - when: "SEQ_OCCS = 1"
          then: "'Y'"
        - otherwise: "''"

  - name: AOCCPFL
    type: str
    label: 1st Occurrence of Preferred Term Flag
    derivation:
      case:
        - when: "SEQ_OCCP = 1"
          then: "'Y'"
        - otherwise: "''"

  - name: AOCC02FL
    type: str
    label: 1st Occurrence 02 Flag for Serious
    derivation:
      case:
        - when: "SEQ_OCC02 = 1"
          then: "'Y'"
        - otherwise: "''"

  - name: AOCC03FL
    type: str
    label: 1st Occurrence 03 Flag for Serious SOC
    derivation:
      case:
        - when: "SEQ_OCC03 = 1"
          then: "'Y'"
        - otherwise: "''"

  - name: AOCC04FL
    type: str
    label: 1st Occurrence 04 Flag for Serious PT
    derivation:
      case:
        - when: "SEQ_OCC04 = 1"
          then: "'Y'"
        - otherwise: "''"

  - name: AOCC01FL
    type: str
    label: 1st Occurrence 01 Flag for CQ01
    derivation:
      case:
        - when: "SEQ_OCC01 = 1"
          then: "'Y'"
        - otherwise: "''"

verifications:
  - assert:
      id: treatment_date_order
      when: "TRTSDT IS NOT NULL AND TRTEDT IS NOT NULL"
      require: "TRTEDT >= TRTSDT"
