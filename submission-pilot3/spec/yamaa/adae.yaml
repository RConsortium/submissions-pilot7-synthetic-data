yamaa: "1.0"
type: spec
model: ADaM
domain: ADAE

keys:
  - STUDYID
  - USUBJID
  - AESEQ

input:
  AE: ../../data/sdtm/ae.parquet
  ADSL:
    path: ../../data/adam/adsl-yamaa.parquet
    schema: adsl.yaml
    key:
      - STUDYID
      - USUBJID
base: AE

# ADSL is read as a derived predecessor dataset, exactly as the pilot 3 R
# program reads the derived adsl.xpt (derive_vars_merged on STUDYID/USUBJID).
# Its STUDYID/USUBJID keys permit a direct implicit join from each AE row.

output:
  path: ../../data/adam/adae-yamaa.parquet
  columns:
    - STUDYID
    - SITEID
    - USUBJID
    - TRTA
    - TRTAN
    - AGE
    - AGEGR1
    - AGEGR1N
    - RACE
    - RACEN
    - SEX
    - SAFFL
    - TRTSDT
    - TRTEDT
    - ASTDT
    - ASTDTF
    - ASTDY
    - AENDT
    - AENDY
    - ADURN
    - ADURU
    - AETERM
    - AELLT
    - AELLTCD
    - AEDECOD
    - AEPTCD
    - AEHLT
    - AEHLTCD
    - AEHLGT
    - AEHLGTCD
    - AEBODSYS
    - AESOC
    - AESOCCD
    - AESEV
    - AESER
    - AESCAN
    - AESCONG
    - AESDISAB
    - AESDTH
    - AESHOSP
    - AESLIFE
    - AESOD
    - AEREL
    - AEACN
    - AEOUT
    - AESEQ
    - TRTEMFL
    - AOCCFL
    - AOCCSFL
    - AOCCPFL
    - AOCC02FL
    - AOCC03FL
    - AOCC04FL
    - CQ01NAM
    - AOCC01FL

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: AE.STUDYID

    submission:
      core: Cond
      mandatory: true
      length: 12
      origins:
        - type: Predecessor
          description: AE.STUDYID
  - name: SITEID
    type: str
    label: Study Site Identifier
    derivation: ADSL.SITEID
    submission:
      core: Cond
      mandatory: false
      length: 3
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADAE.SITEID
        type: Computation
        description: ADSL.SITEID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: AE.USUBJID

    submission:
      core: Cond
      mandatory: true
      length: 11
      origins:
        - type: Predecessor
          description: AE.USUBJID
  - name: TRTA
    type: str
    label: Actual Treatment
    derivation: ADSL.TRT01A

    submission:
      core: Cond
      mandatory: false
      length: 20
      origins:
        - type: Derived
      codelist: ARM
      method:
        name: Algorithm to derive ADAE.TRTA
        type: Computation
        description: ADSL.TRT01A
  - name: TRTAN
    type: float
    label: Actual Treatment (N)
    derivation: ADSL.TRT01AN

    submission:
      core: Cond
      mandatory: false
      length: 8
      origins:
        - type: Derived
      codelist: ARMN
      method:
        name: Algorithm to derive ADAE.TRTAN
        type: Computation
        description: ADSL.TRT01AN
      significant_digits: 0
  - name: AGE
    type: float
    label: Age
    derivation: ADSL.AGE
    submission:
      core: Cond
      mandatory: false
      length: 8
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADAE.AGE
        type: Computation
        description: ADSL.AGE
      significant_digits: 0
  - name: AGEGR1
    type: str
    label: Pooled Age Group 1
    derivation: ADSL.AGEGR1
    submission:
      core: Cond
      mandatory: false
      length: 5
      origins:
        - type: Derived
      codelist: AGEGR1
      method:
        name: Algorithm to derive ADAE.AGEGR1
        type: Computation
        description: ADSL.AGEGR1
  - name: AGEGR1N
    type: float
    label: Pooled Age Group 1 (N)
    derivation: ADSL.AGEGR1N
    submission:
      core: Cond
      mandatory: false
      length: 8
      origins:
        - type: Derived
      codelist: AGEGR1N
      method:
        name: Algorithm to derive ADAE.AGEGR1N
        type: Computation
        description: ADSL.AGEGR1N
      significant_digits: 0
  - name: RACE
    type: str
    label: Race
    derivation: ADSL.RACE
    submission:
      core: Cond
      mandatory: false
      length: 32
      origins:
        - type: Derived
      codelist: RACE
      method:
        name: Algorithm to derive ADAE.RACE
        type: Computation
        description: ADSL.RACE
  - name: RACEN
    type: float
    label: Race (N)
    derivation: ADSL.RACEN
    submission:
      core: Cond
      mandatory: false
      length: 8
      origins:
        - type: Derived
      codelist: RACEN
      method:
        name: Algorithm to derive ADAE.RACEN
        type: Computation
        description: ADSL.RACEN
      significant_digits: 0
  - name: SEX
    type: str
    label: Sex
    derivation: ADSL.SEX
    submission:
      core: Cond
      mandatory: false
      length: 1
      origins:
        - type: Derived
      codelist: SEX
      method:
        name: Algorithm to derive ADAE.SEX
        type: Computation
        description: ADSL.SEX
  - name: SAFFL
    type: str
    label: Safety Population Flag
    derivation: ADSL.SAFFL
    submission:
      core: Cond
      mandatory: false
      length: 1
      origins:
        - type: Derived
      codelist: YN
      method:
        name: Algorithm to derive ADAE.SAFFL
        type: Computation
        description: ADSL.SAFFL
  - name: TRTSDT
    type: date
    label: Date of First Exposure to Treatment
    derivation: ADSL.TRTSDT
    submission:
      core: Cond
      mandatory: false
      display_format: DATE9.
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADAE.TRTSDT
        type: Computation
        description: ADSL.TRTSDT
  - name: TRTEDT
    type: date
    label: Date of Last Exposure to Treatment
    derivation: ADSL.TRTEDT
    submission:
      core: Cond
      mandatory: false
      display_format: DATE9.
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADAE.TRTEDT
        type: Computation
        description: ADSL.TRTEDT

  - name: ASTDT
    type: date
    label: Analysis Start Date
    derivation:
      # Supply the first day when the month is collected. A year-only
      # source stays missing because no month-imputation rule is declared.
      impute:
        type: date
        source: AE.AESTDTC
        day: 1
        invalid:
    submission:
      core: Cond
      mandatory: false
      display_format: DATE9.
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADAE.ASTDT
        type: Computation
        description: AE.AESTDTC, converted to a numeric SAS date. Some events with partial dates are
          imputed in a conservative manner. If the day component is missing, a value of '01' is used. If
          both the month and day are missing no imputation is performed as these dates clearly indicate a
          start prior to the beginning of treatment. There are no events with completely missing start
          dates.

  - name: ASTDTPR
    type: str
    label: Astdtpr (helper)
    derivation:
      precision:
        type: date
        source: ASTDT

  - name: ASTDTF
    type: str
    label: Analysis Start Date Imputation Flag
    derivation:
      case:
        - when: "ASTDTPR = 'month'"
          then: "'D'"

    submission:
      core: Cond
      mandatory: false
      length: 1
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADAE.ASTDTF
        type: Computation
        description: ASTDTF='D' if the day value within the character date is imputed. Note that only day
          values needed to be imputed for this study.
  - name: ASTDY
    type: float
    label: Analysis Start Relative Day
    derivation:
      study_day:
        source: ASTDT
        reference: TRTSDT

    submission:
      core: Cond
      mandatory: false
      length: 8
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADAE.ASTDY
        type: Computation
        description: IF ASTDT>=TRTSDT>MISSING then ASTDY=ASTDT-TRTSDT+1 Else if TRTSDT>ASTDT>MISSING then
          ASTDY=ASTDT-TRTSDT
      significant_digits: 0
  - name: AENDT
    type: date
    label: Analysis End Date
    derivation:
      # Complete a collected month to its last day; a year alone stays
      # missing because no month-imputation rule is declared.
      impute:
        type: date
        source: AE.AEENDTC
        day: last
        invalid:
    submission:
      core: Cond
      mandatory: false
      display_format: DATE9.
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADAE.AENDT
        type: Computation
        description: AE.AEENDTC, converted to a numeric SAS date

  - name: AENDY
    type: float
    label: Analysis End Relative Day
    derivation:
      study_day:
        source: AENDT
        reference: TRTSDT

    submission:
      core: Cond
      mandatory: false
      length: 8
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADAE.AENDY
        type: Computation
        description: IF AENDT>=TRTSDT>MISSING then AENDY=AENDT-TRTSDT+1 Else if TRTSDT>AENDT>MISSING then
          AENDY=AENDT-TRTSDT
      significant_digits: 0
  - name: ADURN
    type: float
    label: Analysis Duration (N)
    derivation:
      diff:
        type: date
        start: ASTDT
        end: AENDT
        unit: day
        closed: both

    submission:
      core: Cond
      mandatory: false
      length: 8
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADAE.ADURN
        type: Computation
        description: ADURN=AENDT-ASTDT+1
      significant_digits: 0
  - name: ADURU
    type: str
    label: Analysis Duration Units
    derivation:
      case:
        - when: "ADURN IS NOT NULL"
          then: "'DAYS'"

    submission:
      core: Cond
      mandatory: false
      length: 4
      origins:
        - type: Derived
      codelist: ADURU
      method:
        name: Algorithm to derive ADAE.ADURU
        type: Computation
        description: If ADURN is not missing then ADURU='DAYS'
  - name: AETERM
    type: str
    label: Reported Term for the Adverse Event
    derivation: AE.AETERM

    submission:
      core: Cond
      mandatory: false
      length: 46
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADAE.AETERM
        type: Computation
        description: AE.AETERM
  - name: AELLT
    type: str
    label: Lowest Level Term
    derivation: AE.AELLT

    submission:
      core: Cond
      mandatory: false
      length: 46
      origins:
        - type: Derived
      codelist: AEDICT
      method:
        name: Algorithm to derive ADAE.AELLT
        type: Computation
        description: AE.AELLT
  - name: AELLTCD
    type: float
    label: Lowest Level Term Code
    derivation: AE.AELLTCD

    submission:
      core: Cond
      mandatory: false
      length: 8
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADAE.AELLTCD
        type: Computation
        description: AE.AELLTCD
      significant_digits: 0
  - name: AEDECOD
    type: str
    label: Dictionary-Derived Term
    derivation: AE.AEDECOD

    submission:
      core: Cond
      mandatory: false
      length: 46
      origins:
        - type: Derived
      codelist: AEDICT
      method:
        name: Algorithm to derive ADAE.AEDECOD
        type: Computation
        description: AE.AEDECOD
  - name: AEPTCD
    type: float
    label: Preferred Term Code
    derivation: AE.AEPTCD

    submission:
      core: Cond
      mandatory: false
      length: 8
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADAE.AEPTCD
        type: Computation
        description: AE.AEPTCD
      significant_digits: 0
  - name: AEHLT
    type: str
    label: High Level Term
    derivation: AE.AEHLT

    submission:
      core: Cond
      mandatory: false
      length: 8
      origins:
        - type: Derived
      codelist: AEDICT
      method:
        name: Algorithm to derive ADAE.AEHLT
        type: Computation
        description: AE.AEHLT
  - name: AEHLTCD
    type: float
    label: High Level Term Code
    derivation: AE.AEHLTCD

    submission:
      core: Cond
      mandatory: false
      length: 8
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADAE.AEHLTCD
        type: Computation
        description: AE.AEHLTCD
      significant_digits: 0
  - name: AEHLGT
    type: str
    label: High Level Group Term
    derivation: AE.AEHLGT

    submission:
      core: Cond
      mandatory: false
      length: 9
      origins:
        - type: Derived
      codelist: AEDICT
      method:
        name: Algorithm to derive ADAE.AEHLGT
        type: Computation
        description: AE.AEHLGT
  - name: AEHLGTCD
    type: float
    label: High Level Group Term Code
    derivation: AE.AEHLGTCD

    submission:
      core: Cond
      mandatory: false
      length: 8
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADAE.AEHLGTCD
        type: Computation
        description: AE.AEHLGTCD
      significant_digits: 0
  - name: AEBODSYS
    type: str
    label: Body System or Organ Class
    derivation: AE.AEBODSYS

    submission:
      core: Cond
      mandatory: false
      length: 67
      origins:
        - type: Derived
      codelist: AEDICT
      method:
        name: Algorithm to derive ADAE.AEBODSYS
        type: Computation
        description: AE.AEBODSYS
  - name: AESOC
    type: str
    label: Primary System Organ Class
    derivation: AE.AESOC

    submission:
      core: Cond
      mandatory: false
      length: 67
      origins:
        - type: Derived
      codelist: AEDICT
      method:
        name: Algorithm to derive ADAE.AESOC
        type: Computation
        description: AE.AESOC
  - name: AESOCCD
    type: float
    label: Primary System Organ Class Code
    derivation: AE.AESOCCD

    submission:
      core: Cond
      mandatory: false
      length: 8
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADAE.AESOCCD
        type: Computation
        description: AE.AESOCCD
      significant_digits: 0
  - name: AESEV
    type: str
    label: Severity/Intensity
    derivation: AE.AESEV

    submission:
      core: Cond
      mandatory: false
      length: 8
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADAE.AESEV
        type: Computation
        description: AE.AESEV
  - name: AESER
    type: str
    label: Serious Event
    derivation: AE.AESER

    submission:
      core: Cond
      mandatory: false
      length: 1
      origins:
        - type: Derived
      codelist: YN
      method:
        name: Algorithm to derive ADAE.AESER
        type: Computation
        description: AE.AESER
  - name: AESCAN
    type: str
    label: Involves Cancer
    derivation: AE.AESCAN

    submission:
      core: Cond
      mandatory: false
      length: 1
      origins:
        - type: Derived
      codelist: YN
      method:
        name: Algorithm to derive ADAE.AESCAN
        type: Computation
        description: AE.AESCAN
  - name: AESCONG
    type: str
    label: Congenital Anomaly or Birth Defect
    derivation: AE.AESCONG

    submission:
      core: Cond
      mandatory: false
      length: 1
      origins:
        - type: Derived
      codelist: YN
      method:
        name: Algorithm to derive ADAE.AESCONG
        type: Computation
        description: AE.AESCONG
  - name: AESDISAB
    type: str
    label: Persist or Signif Disability/Incapacity
    derivation: AE.AESDISAB

    submission:
      core: Cond
      mandatory: false
      length: 1
      origins:
        - type: Derived
      codelist: YN
      method:
        name: Algorithm to derive ADAE.AESDISAB
        type: Computation
        description: AE.AESDISAB
  - name: AESDTH
    type: str
    label: Results in Death
    derivation: AE.AESDTH

    submission:
      core: Cond
      mandatory: false
      length: 1
      origins:
        - type: Derived
      codelist: YN
      method:
        name: Algorithm to derive ADAE.AESDTH
        type: Computation
        description: AE.AESDTH
  - name: AESHOSP
    type: str
    label: Requires or Prolongs Hospitalization
    derivation: AE.AESHOSP

    submission:
      core: Cond
      mandatory: false
      length: 1
      origins:
        - type: Derived
      codelist: YN
      method:
        name: Algorithm to derive ADAE.AESHOSP
        type: Computation
        description: AE.AESHOSP
  - name: AESLIFE
    type: str
    label: Is Life Threatening
    derivation: AE.AESLIFE

    submission:
      core: Cond
      mandatory: false
      length: 1
      origins:
        - type: Derived
      codelist: YN
      method:
        name: Algorithm to derive ADAE.AESLIFE
        type: Computation
        description: AE.AESLIFE
  - name: AESOD
    type: str
    label: Occurred with Overdose
    derivation: AE.AESOD

    submission:
      core: Cond
      mandatory: false
      length: 1
      origins:
        - type: Derived
      codelist: YN
      method:
        name: Algorithm to derive ADAE.AESOD
        type: Computation
        description: AE.AESOD
  - name: AEREL
    type: str
    label: Causality
    derivation: AE.AEREL

    submission:
      core: Cond
      mandatory: false
      length: 8
      origins:
        - type: Derived
      codelist: AECAUS
      method:
        name: Algorithm to derive ADAE.AEREL
        type: Computation
        description: AE.AEREL
  - name: AEACN
    type: str
    label: Action Taken with Study Treatment
    derivation: AE.AEACN

    submission:
      core: Cond
      mandatory: false
      length: 1
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADAE.AEACN
        type: Computation
        description: AE.AEACN
  - name: AEOUT
    type: str
    label: Outcome of Adverse Event
    derivation: AE.AEOUT

    submission:
      core: Cond
      mandatory: false
      length: 26
      origins:
        - type: Derived
      codelist: OUT
      method:
        name: Algorithm to derive ADAE.AEOUT
        type: Computation
        description: AE.AEOUT
  - name: AESEQ
    type: float
    label: Sequence Number
    derivation: AE.AESEQ

    submission:
      core: Cond
      mandatory: true
      length: 8
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADAE.AESEQ
        type: Computation
        description: AE.AESEQ
      significant_digits: 0
  - name: TRTEMFL
    type: str
    label: Treatment Emergent Analysis Flag
    derivation:
      case:
        - when: "ASTDT IS NOT NULL AND TRTSDT IS NOT NULL AND ASTDT >= TRTSDT"
          then: "'Y'"

    submission:
      core: Cond
      mandatory: false
      length: 1
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADAE.TRTEMFL
        type: Computation
        description: If ASTDT >= TRTSDT > . then TRTEMFL='Y'. Otherwise TRTEMFL='N'
  - name: CQ01_PT
    type: str
    label: Cq01 Pt (helper)
    derivation:
      str_extract:
        source: AE.AEDECOD
        pattern: "APPLICATION|DERMATITIS|ERYTHEMA|BLISTER"
        no_match:

  - name: CQ01_SOC
    type: str
    label: Cq01 Soc (helper)
    derivation:
      str_extract:
        source: AE.AEBODSYS
        pattern: "SKIN AND SUBCUTANEOUS TISSUE DISORDERS"
        no_match:

  - name: CQ01_EXCL
    type: str
    label: Cq01 Excl (helper)
    derivation:
      str_extract:
        source: AE.AEDECOD
        pattern: "COLD SWEAT|HYPERHIDROSIS|ALOPECIA"
        no_match:

  - name: CQ01NAM
    type: str
    label: Customized Query 01 Name
    derivation:
      case:
        - when: "CQ01_PT IS NOT NULL OR (CQ01_SOC IS NOT NULL AND CQ01_EXCL IS NULL)"
          then: "'DERMATOLOGIC EVENTS'"

    submission:
      core: Cond
      mandatory: false
      length: 19
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADAE.CQ01NAM
        type: Computation
        description: If AEDECOD contains any of the character strings of ('APPLICATION', 'DERMATITIS',
          'ERYTHEMA', 'BLISTER') OR if AEBODSYS='SKIN AND SUBC UTANEOUS TISSUE DISORDERS' but AEDECOD is
          not in ('COLD SWEAT', 'HYPERHIDROSIS', 'ALOPECIA') then CQ01NAM='DERMATOLOGIC EVENTS' Otherwise
          CQ01NAM=NULL
  - name: SEQ_OCC
    type: int
    label: Seq Occ (helper)
    derivation:
      row_number:
        window:
          group_by:
            - STUDYID
            - USUBJID
          order_by:
            - variable: ASTDT
              nulls: last
            - variable: AESEQ
              nulls: last
          filter: "TRTEMFL = 'Y'"

  - name: SEQ_OCCS
    type: int
    label: Seq Occs (helper)
    derivation:
      row_number:
        window:
          group_by:
            - STUDYID
            - USUBJID
            - AEBODSYS
          order_by:
            - variable: ASTDT
              nulls: last
            - variable: AESEQ
              nulls: last
          filter: "TRTEMFL = 'Y'"

  - name: SEQ_OCCP
    type: int
    label: Seq Occp (helper)
    derivation:
      row_number:
        window:
          group_by:
            - STUDYID
            - USUBJID
            - AEBODSYS
            - AEDECOD
          order_by:
            - variable: ASTDT
              nulls: last
            - variable: AESEQ
              nulls: last
          filter: "TRTEMFL = 'Y'"

  - name: SEQ_OCC02
    type: int
    label: Seq Occ02 (helper)
    derivation:
      row_number:
        window:
          group_by:
            - STUDYID
            - USUBJID
          order_by:
            - variable: ASTDT
              nulls: last
            - variable: AESEQ
              nulls: last
          filter: "TRTEMFL = 'Y' AND AESER = 'Y'"

  - name: SEQ_OCC03
    type: int
    label: Seq Occ03 (helper)
    derivation:
      row_number:
        window:
          group_by:
            - STUDYID
            - USUBJID
            - AEBODSYS
          order_by:
            - variable: ASTDT
              nulls: last
            - variable: AESEQ
              nulls: last
          filter: "TRTEMFL = 'Y' AND AESER = 'Y'"

  - name: SEQ_OCC04
    type: int
    label: Seq Occ04 (helper)
    derivation:
      row_number:
        window:
          group_by:
            - STUDYID
            - USUBJID
            - AEBODSYS
            - AEDECOD
          order_by:
            - variable: ASTDT
              nulls: last
            - variable: AESEQ
              nulls: last
          filter: "TRTEMFL = 'Y' AND AESER = 'Y'"

  - name: SEQ_OCC01
    type: int
    label: Seq Occ01 (helper)
    derivation:
      row_number:
        window:
          group_by:
            - STUDYID
            - USUBJID
          order_by:
            - variable: ASTDT
              nulls: last
            - variable: AESEQ
              nulls: last
          filter: "TRTEMFL = 'Y' AND CQ01NAM = 'DERMATOLOGIC EVENTS'"

  - name: AOCCFL
    type: str
