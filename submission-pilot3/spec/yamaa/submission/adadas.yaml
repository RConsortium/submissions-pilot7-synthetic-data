# Rebind the subject join directly for Predecessor metadata; retain the window lookup.
yamaa: '1.0'
type: spec
parent: ../adadas.yaml
output:
  path: ../../../../.build/pilot3-define/data/adadas.parquet
  columns:
  - STUDYID
  - SITEID
  - SITEGR1
  - USUBJID
  - TRTSDT
  - TRTEDT
  - TRTP
  - TRTPN
  - AGE
  - AGEGR1
  - AGEGR1N
  - RACE
  - RACEN
  - SEX
  - ITTFL
  - EFFFL
  - COMP24FL
  - AVISIT
  - AVISITN
  - VISIT
  - VISITNUM
  - ADY
  - ADT
  - PARAM
  - PARAMCD
  - PARAMN
  - AVAL
  - BASE
  - CHG
  - PCHG
  - ABLFL
  - ANL01FL
  - DTYPE
  - AWRANGE
  - AWTARGET
  - AWTDIFF
  - AWLO
  - AWHI
  - AWU
  - QSSEQ
columns:
- name: STUDYID
  type: str
  submission:
    core: Cond
    mandatory: true
    length: 12
    origins:
    - type: Predecessor
      description: ADSL.STUDYID
  derivation: ADSL.STUDYID
- name: SITEID
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 3
    origins:
    - type: Predecessor
      description: ADSL.SITEID
  derivation: ADSL.SITEID
- name: SITEGR1
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 3
    origins:
    - type: Predecessor
      description: ADSL.SITEGR1
  derivation: ADSL.SITEGR1
- name: USUBJID
  type: str
  submission:
    core: Cond
    mandatory: true
    length: 11
    origins:
    - type: Other
      description: QS.USUBJID on collected rows; PLAN.USUBJID on planned LOCF rows.
- name: TRTSDT
  type: date
  submission:
    core: Cond
    mandatory: false
    display_format: DATE9.
    origins:
    - type: Predecessor
      description: ADSL.TRTSDT
  derivation: ADSL.TRTSDT
- name: TRTEDT
  type: date
  submission:
    core: Cond
    mandatory: false
    display_format: DATE9.
    origins:
    - type: Predecessor
      description: ADSL.TRTEDT
  derivation: ADSL.TRTEDT
- name: TRTP
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 20
    origins:
    - type: Predecessor
      description: ADSL.TRT01P
    codelist: ARM
  derivation: ADSL.TRT01P
- name: TRTPN
  type: int
  submission:
    core: Cond
    mandatory: false
    length: 8
    origins:
    - type: Predecessor
      description: ADSL.TRT01PN
    codelist: ARMN
  derivation: ADSL.TRT01PN
- name: AGE
  type: int
  submission:
    core: Cond
    mandatory: false
    length: 8
    origins:
    - type: Predecessor
      description: ADSL.AGE
  derivation: ADSL.AGE
- name: AGEGR1
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 5
    origins:
    - type: Predecessor
      description: ADSL.AGEGR1
    codelist: AGEGR1
  derivation: ADSL.AGEGR1
- name: AGEGR1N
  type: int
  submission:
    core: Cond
    mandatory: false
    length: 8
    origins:
    - type: Predecessor
      description: ADSL.AGEGR1N
    codelist: AGEGR1N
  derivation: ADSL.AGEGR1N
- name: RACE
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 32
    origins:
    - type: Predecessor
      description: ADSL.RACE
    codelist: RACE
  derivation: ADSL.RACE
- name: RACEN
  type: int
  submission:
    core: Cond
    mandatory: false
    length: 8
    origins:
    - type: Predecessor
      description: ADSL.RACEN
    codelist: RACEN
  derivation: ADSL.RACEN
- name: SEX
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 1
    origins:
    - type: Predecessor
      description: ADSL.SEX
    codelist: SEX
  derivation: ADSL.SEX
- name: ITTFL
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 1
    origins:
    - type: Predecessor
      description: ADSL.ITTFL
    codelist: YN
  derivation: ADSL.ITTFL
- name: EFFFL
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 1
    origins:
    - type: Predecessor
      description: ADSL.EFFFL
    codelist: YN
  derivation: ADSL.EFFFL
- name: COMP24FL
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 1
    origins:
    - type: Predecessor
      description: ADSL.COMP24FL
    codelist: YN
  derivation: ADSL.COMP24FL
- name: AVISIT
  type: str
  submission:
    core: Cond
    mandatory: true
    length: 16
    origins:
    - type: Derived
    codelist: AVISIT
    method:
      name: Algorithm to derive ADADAS.AVISIT
      type: Computation
      description: Derived based on windowing algorithm described in SAP, Section 8.2
- name: AVISITN
  type: int
  submission:
    core: Cond
    mandatory: false
    length: 8
    origins:
    - type: Assigned
    codelist: AVISITN
    method:
      name: Algorithm to derive ADADAS.AVISITN
      type: Computation
      description: Numeric code for AVISIT
- name: VISIT
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 19
    origins:
    - type: Derived
    codelist: VISIT
    method: Copy QS.VISIT on collected rows. Carry the last analysis-selected value forward within STUDYID,
      USUBJID and PARAMCD to planned LOCF rows, in AVISITN order.
- name: VISITNUM
  type: float
  submission:
    core: Cond
    mandatory: false
    length: 8
    significant_digits: 1
    origins:
    - type: Derived
    codelist: VISITNUM
    method: Copy QS.VISITNUM on collected rows. Carry the last analysis-selected value forward within
      STUDYID, USUBJID and PARAMCD to planned LOCF rows, in AVISITN order.
- name: ADY
  type: int
  submission:
    core: Cond
    mandatory: false
    length: 8
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADADAS.ADY
      type: Computation
      description: "ADY = ADT - TRTSDT + 1, if ADT>=TRTSDT. ADY = \nADT - TRTSDT, if ADT<TRTSDT."
- name: ADT
  type: date
  submission:
    core: Cond
    mandatory: true
    display_format: DATE9.
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADADAS.ADT
      type: Computation
      description: SAS date from QS.QSDTC
- name: PARAM
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 100
    origins:
    - type: Assigned
    codelist: PARAM_ADQSADAS
    comment: Decoded value for PARAMCD
- name: PARAMCD
  type: str
  submission:
    core: Cond
    mandatory: true
    length: 8
    origins:
    - type: Other
      description: QS.QSTESTCD on collected rows; PLAN.PARAMCD on planned LOCF rows.
    codelist: PARAMCD_ADQSADAS
- name: PARAMN
  type: int
  submission:
    core: Cond
    mandatory: false
    length: 8
    origins:
    - type: Assigned
    codelist: PARAMN_ADQSADAS
    comment: "Assign a numeric code for each value of PARAMCD \n(see codelist PARAMN_ADQSADAS)"
- name: AVAL
  type: float
  submission:
    core: Cond
    mandatory: false
    length: 16
    significant_digits: 13
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADADAS.AVAL
      type: Computation
      description: QS.QSSTRESN where QSTESTCD=PARAMCD
    value_level:
    - id: ACITM01
      where:
        PARAMCD:
        - ACITM01
      label: Word Recall Task
      core: Cond
      mandatory: false
      length: 16
      significant_digits: 13
      origins:
      - type: Derived
      method:
        name: Algorithm to derive ADADAS.AVAL
        type: Computation
        description: QS.QSSTRESN where QSTESTCD=PARAMCD
    - id: ACITM02
      where:
        PARAMCD:
        - ACITM02
      label: Naming Objects And Fingers (Refer To 5 C
      core: Cond
      mandatory: false
      length: 16
      significant_digits: 13
      origins:
      - type: Derived
      method:
        name: Algorithm to derive ADADAS.AVAL
        type: Computation
        description: QS.QSSTRESN where QSTESTCD=PARAMCD
    - id: ACITM03
      where:
        PARAMCD:
        - ACITM03
      label: Delayed Word Recall
      core: Cond
      mandatory: false
      length: 16
      significant_digits: 13
      origins:
      - type: Derived
      method:
        name: Algorithm to derive ADADAS.AVAL
        type: Computation
        description: QS.QSSTRESN where QSTESTCD=PARAMCD
    - id: ACITM04
      where:
        PARAMCD:
        - ACITM04
      label: Commands
      core: Cond
      mandatory: false
      length: 16
      significant_digits: 13
      origins:
      - type: Derived
      method:
        name: Algorithm to derive ADADAS.AVAL
        type: Computation
        description: QS.QSSTRESN where QSTESTCD=PARAMCD
    - id: ACITM05
      where:
        PARAMCD:
        - ACITM05
      label: Constructional Praxis
      core: Cond
      mandatory: false
      length: 16
      significant_digits: 13
      origins:
      - type: Derived
      method:
        name: Algorithm to derive ADADAS.AVAL
        type: Computation
        description: QS.QSSTRESN where QSTESTCD=PARAMCD
    - id: ACITM06
      where:
        PARAMCD:
        - ACITM06
      label: Ideational Praxis
      core: Cond
      mandatory: false
      length: 16
      significant_digits: 13
      origins:
      - type: Derived
      method:
        name: Algorithm to derive ADADAS.AVAL
        type: Computation
        description: QS.QSSTRESN where QSTESTCD=PARAMCD
    - id: ACITM07
      where:
        PARAMCD:
        - ACITM07
      label: Orientation
      core: Cond
      mandatory: false
      length: 16
      significant_digits: 13
      origins:
      - type: Derived
      method:
        name: Algorithm to derive ADADAS.AVAL
        type: Computation
        description: QS.QSSTRESN where QSTESTCD=PARAMCD
    - id: ACITM08
      where:
        PARAMCD:
        - ACITM08
      label: Word Recognition
      core: Cond
      mandatory: false
      length: 16
      significant_digits: 13
      origins:
      - type: Derived
      method:
        name: Algorithm to derive ADADAS.AVAL
        type: Computation
        description: QS.QSSTRESN where QSTESTCD=PARAMCD
    - id: ACITM09
      where:
        PARAMCD:
        - ACITM09
      label: Attention/Visual Search Task
      core: Cond
      mandatory: false
      length: 16
      significant_digits: 13
      origins:
      - type: Derived
      method:
        name: Algorithm to derive ADADAS.AVAL
        type: Computation
        description: QS.QSSTRESN where QSTESTCD=PARAMCD
    - id: ACITM10
      where:
        PARAMCD:
        - ACITM10
      label: Maze Solution
      core: Cond
      mandatory: false
      length: 16
      significant_digits: 13
      origins:
      - type: Derived
      method:
        name: Algorithm to derive ADADAS.AVAL
        type: Computation
        description: QS.QSSTRESN where QSTESTCD=PARAMCD
    - id: ACITM11
      where:
        PARAMCD:
        - ACITM11
      label: Spoken Language Ability
      core: Cond
      mandatory: false
      length: 16
      significant_digits: 13
      origins:
      - type: Derived
      method:
        name: Algorithm to derive ADADAS.AVAL
        type: Computation
        description: QS.QSSTRESN where QSTESTCD=PARAMCD
    - id: ACITM12
      where:
        PARAMCD:
        - ACITM12
      label: Comprehension Of Spoken Language
      core: Cond
      mandatory: false
      length: 16
      significant_digits: 13
      origins:
      - type: Derived
      method:
        name: Algorithm to derive ADADAS.AVAL
        type: Computation
        description: QS.QSSTRESN where QSTESTCD=PARAMCD
    - id: ACITM13
      where:
        PARAMCD:
        - ACITM13
      label: Word Finding Difficulty In Spontaneous S
      core: Cond
      mandatory: false
      length: 16
      significant_digits: 13
      origins:
      - type: Derived
      method:
        name: Algorithm to derive ADADAS.AVAL
        type: Computation
        description: QS.QSSTRESN where QSTESTCD=PARAMCD
    - id: ACITM14
      where:
        PARAMCD:
        - ACITM14
      label: Recall Of Test Instructions
      core: Cond
      mandatory: false
      length: 16
      significant_digits: 13
      origins:
      - type: Derived
      method:
        name: Algorithm to derive ADADAS.AVAL
        type: Computation
        description: QS.QSSTRESN where QSTESTCD=PARAMCD
    - id: ACTOT
      where:
        PARAMCD:
        - ACTOT
      label: Adas-Cog(11) Subscore
      core: Cond
      mandatory: false
      length: 16
      significant_digits: 13
      origins:
      - type: Derived
      method:
        name: Algorithm to derive ADADAS.AVAL.ACTOT
        type: Computation
        description: Sum of ADAS scores for items 1, 2, 4, 5, 6, 7, 8, 11, 12, 13, and 14, see SAP section
          14.2 for details on adjusting for missing values
- name: BASE
  type: float
  submission:
    core: Cond
    mandatory: false
    length: 8
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADADAS.BASE
      type: Computation
      description: QS.QSSTRESN when QS.QSBLFL=Y (QS.VISITNUM=3)
    significant_digits: 13
- name: CHG
  type: float
  submission:
    core: Cond
    mandatory: false
    length: 8
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADADAS.CHG
      type: Computation
      description: AVAL - BASE
    significant_digits: 13
- name: PCHG
  type: float
  submission:
    core: Cond
    mandatory: false
    length: 8
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADADAS.PCHG
      type: Computation
      description: 100* (CHG/BASE)
    significant_digits: 13
- name: ABLFL
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 1
    origins:
    - type: Other
      description: QS.QSBLFL on collected rows; missing on planned LOCF rows.
- name: ANL01FL
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 1
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADADAS.ANL01FL
      type: Computation
      description: If multiple visits fall into the same visit window, then the one closest to the target
        date is chosen for analysis. These are flagged with ANL01FL="Y".
- name: DTYPE
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 7
    origins:
    - type: Derived
    codelist: DTYPE
    method:
      name: Algorithm to derive ADADAS.DTYPE
      type: Computation
      description: Set to "LOCF" if a record is imputated when PARAMCD="ACTOT"; otherwise, set to missing
- name: AWRANGE
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 9
    origins:
    - type: Assigned
    comment: Window range, specified in the SAP.
- name: AWTARGET
  type: int
  submission:
    core: Cond
    mandatory: false
    length: 8
    origins:
    - type: Assigned
    comment: Target day within the window, specified in the SAP.
- name: AWTDIFF
  type: int
  submission:
    core: Cond
    mandatory: false
    length: 8
    origins:
    - type: Assigned
    comment: Absolute difference between AWTARGET and ADY
- name: AWLO
  type: int
  submission:
    core: Cond
    mandatory: false
    length: 8
    origins:
    - type: Assigned
    comment: Start day of the window, specified in the SAP.
- name: AWHI
  type: int
  submission:
    core: Cond
    mandatory: false
    length: 8
    origins:
    - type: Assigned
    comment: End day of the window, specified in the SAP.
- name: AWU
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 4
    origins:
    - type: Assigned
    codelist: AWU
    comment: Assigned as "DAYS".
- name: QSSEQ
  type: int
  submission:
    core: Cond
    mandatory: false
    length: 8
    origins:
    - type: Derived
    method: Copy QS.QSSEQ on collected rows. Carry the last analysis-selected value forward within STUDYID,
      USUBJID and PARAMCD to planned LOCF rows, in AVISITN order.
submission:
  label: ADAS-Cog Analysis
  class: BASIC DATA STRUCTURE
  structure: one record per subject per parameter per analysis visit per analysis date
  repeating: true
  reference_data: false
input:
  ADSL:
    key:
    - USUBJID
clear:
- intermediates
intermediates:
- id: AW_LOOKUP
  dataset: AW
  key:
  - AVISIT
