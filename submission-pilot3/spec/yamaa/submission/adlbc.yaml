# Pilot 3 submission layer. Reference differences are reported by compare_define.py.
yamaa: '1.0'
type: spec
parent: ../adlbc.yaml
output:
  path: ../../../../.build/pilot3-define/data/adlbc.parquet
  columns:
  - STUDYID
  - SUBJID
  - USUBJID
  - TRTP
  - TRTPN
  - TRTA
  - TRTAN
  - TRTSDT
  - TRTEDT
  - AGE
  - AGEGR1
  - AGEGR1N
  - RACE
  - RACEN
  - SEX
  - COMP24FL
  - DSRAEFL
  - SAFFL
  - AVISIT
  - AVISITN
  - ADY
  - ADT
  - VISIT
  - VISITNUM
  - PARAM
  - PARAMCD
  - PARAMN
  - PARCAT1
  - AVAL
  - BASE
  - CHG
  - A1LO
  - A1HI
  - R2A1LO
  - R2A1HI
  - BR2A1LO
  - BR2A1HI
  - ANL01FL
  - ALBTRVAL
  - ANRIND
  - BNRIND
  - ABLFL
  - AENTMTFL
  - LBSEQ
  - LBNRIND
  - LBSTRESN
columns:
- name: STUDYID
  type: str
  submission:
    core: Cond
    mandatory: true
    length: 12
    origins:
    - type: Predecessor
      description: LB.STUDYID
- name: SUBJID
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 4
    origins:
    - type: Predecessor
      description: ADSL.SUBJID
- name: USUBJID
  type: str
  submission:
    core: Cond
    mandatory: true
    length: 11
    origins:
    - type: Predecessor
      description: LB.USUBJID
- name: TRTP
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 20
    origins:
    - type: Derived
    codelist: ARM
    method:
      name: Algorithm to derive ADLBC.TRTP
      type: Computation
      description: ADSL.TRT01P
- name: TRTPN
  type: int
  submission:
    core: Cond
    mandatory: false
    length: 8
    origins:
    - type: Derived
    codelist: ARMN
    method:
      name: Algorithm to derive ADLBC.TRTPN
      type: Computation
      description: ADSL.TRT01PN
- name: TRTA
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 20
    origins:
    - type: Derived
    codelist: ARM
    method:
      name: Algorithm to derive ADLBC.TRTA
      type: Computation
      description: ADSL.TRT01A
- name: TRTAN
  type: int
  submission:
    core: Cond
    mandatory: false
    length: 8
    origins:
    - type: Derived
    codelist: ARMN
    method:
      name: Algorithm to derive ADLBC.TRTAN
      type: Computation
      description: ADSL.TRT01AN
- name: TRTSDT
  type: date
  submission:
    core: Cond
    mandatory: false
    display_format: DATE9.
    origins:
    - type: Predecessor
      description: ADSL.TRTSDT
- name: TRTEDT
  type: date
  submission:
    core: Cond
    mandatory: false
    display_format: DATE9.
    origins:
    - type: Predecessor
      description: ADSL.TRTEDT
- name: AGE
  type: int
  submission:
    core: Cond
    mandatory: false
    length: 8
    origins:
    - type: Predecessor
      description: ADSL.AGE
- name: AGEGR1
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 5
    origins:
    - type: Predecessor
      description: ADSL.AGEGR1
    codelist: AGEGR1
- name: AGEGR1N
  type: int
  submission:
    core: Cond
    mandatory: false
    length: 8
    origins:
    - type: Predecessor
      description: ADSL.AGEGR1N
    codelist: AGEGR1N
- name: RACE
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 32
    origins:
    - type: Predecessor
      description: ADSL.RACE
    codelist: RACE
- name: RACEN
  type: int
  submission:
    core: Cond
    mandatory: false
    length: 8
    origins:
    - type: Predecessor
      description: ADSL.RACEN
    codelist: RACEN
- name: SEX
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 1
    origins:
    - type: Predecessor
      description: ADSL.SEX
    codelist: SEX
- name: COMP24FL
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 1
    origins:
    - type: Predecessor
      description: ADSL.COMP24FL
    codelist: YN
- name: DSRAEFL
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 1
    origins:
    - type: Derived
    codelist: YN
    method: Copy ADSL.DSRAEFL; represent a missing value as an empty string.
- name: SAFFL
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 1
    origins:
    - type: Predecessor
      description: ADSL.SAFFL
    codelist: YN
- name: AVISIT
  type: str
  submission:
    core: Cond
    mandatory: true
    length: 16
    origins:
    - type: Assigned
    codelist: AVISIT
    method:
      name: Algorithm to derive ADLBC.AVISIT
      type: Computation
      description: 'Last observed value for this lab parameter during treatment phase: ''Y'' if VISITNUM=12,
        if subject discontinues prior to VISIT 12, then this variable is set to ''Y'' if this is the last
        assessment of this analyte for the subject'
- name: AVISITN
  type: int
  submission:
    core: Cond
    mandatory: false
    length: 8
    origins:
    - type: Assigned
    codelist: AVISITN
- name: ADY
  type: int
  submission:
    core: Cond
    mandatory: false
    length: 8
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADLBC.ADY
      type: Computation
      description: LB.LBDY
- name: ADT
  type: date
  submission:
    core: Cond
    mandatory: false
    display_format: DATE9.
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADLBC.ADT
      type: Computation
      description: LB.LBDTC
- name: VISIT
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 19
    origins:
    - type: Predecessor
      description: LB.VISIT
    codelist: VISIT
- name: VISITNUM
  type: float
  submission:
    core: Cond
    mandatory: false
    length: 8
    significant_digits: 1
    origins:
    - type: Predecessor
      description: LB.VISITNUM
    codelist: VISITNUM
- name: PARAM
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 100
    origins:
    - type: Derived
    codelist: PARAM_ADLBC
    method:
      name: Algorithm to derive ADLBC.PARAM
      type: Computation
      description: Concatenated LB.LBTEST, '(',  LB.LBSTRESU and ')'
- name: PARAMCD
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 8
    origins:
    - type: Predecessor
      description: LB.LBTESTCD
    codelist: PARAMCD_ADLBC
- name: PARAMN
  type: int
  submission:
    core: Cond
    mandatory: false
    length: 8
    origins:
    - type: Derived
    codelist: PARAMN_ADLBC
    method:
      name: Algorithm to derive ADLBC.PARAMN
      type: Computation
      description: Numeric code for Parameter
- name: PARCAT1
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 5
    origins:
    - type: Assigned
    codelist: ADLBCAT
- name: AVAL
  type: float
  submission:
    core: Cond
    mandatory: false
    length: 8
    significant_digits: 5
    origins:
    - type: Predecessor
      description: LB.LBSTRESN
- name: BASE
  type: float
  submission:
    core: Cond
    mandatory: false
    length: 8
    significant_digits: 5
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADLBC.BASE
      type: Computation
      description: LB.LBSTNRHI
- name: CHG
  type: float
  submission:
    core: Cond
    mandatory: false
    length: 8
    significant_digits: 5
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADLBC.CHG
      type: Computation
      description: AVAL - BASE
- name: A1LO
  type: float
  submission:
    core: Cond
    mandatory: false
    length: 8
    significant_digits: 5
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADLBC.A1LO
      type: Computation
      description: LB.LBSTNRLO
- name: A1HI
  type: float
  submission:
    core: Cond
    mandatory: false
    length: 8
    significant_digits: 5
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADLBC.A1HI
      type: Computation
      description: LB.LBSTNRHI
- name: R2A1LO
  type: float
  submission:
    core: Cond
    mandatory: false
    length: 8
    significant_digits: 1
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADLBC.R2A1LO
      type: Computation
      description: AVAL / A1LO
- name: R2A1HI
  type: float
  submission:
    core: Cond
    mandatory: false
    length: 8
    significant_digits: 1
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADLBC.R2A1HI
      type: Computation
      description: AVAL / A1HI
- name: BR2A1LO
  type: float
  submission:
    core: Cond
    mandatory: false
    length: 8
    significant_digits: 1
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADLBC.BR2A1LO
      type: Computation
      description: AVAL / A1LO at baseline
- name: BR2A1HI
  type: float
  submission:
    core: Cond
    mandatory: false
    length: 8
    significant_digits: 1
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADLBC.BR2A1HI
      type: Computation
      description: AVAL / A1HI at baseline
- name: ANL01FL
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 1
    origins:
    - type: Assigned
    method:
      name: Algorithm to derive ADLBC.ANL01FL
      type: Computation
      description: If ALBTRVAL  = max(ALBTRVAL) then ANL01FL is 'Y'
- name: ALBTRVAL
  type: float
  submission:
    core: Cond
    mandatory: false
    length: 8
    significant_digits: 3
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADLBC.ALBTRVAL
      type: Computation
      description: Maximum of [LBSTRESN-(1.5*ULN)] and [(.5*LLN) - LBSTRESN]
- name: ANRIND
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 1
    origins:
    - type: Derived
    codelist: LNH
    method:
      name: Algorithm to derive ADLBC.ANRIND
      type: Computation
      description: if AVAL < [0.5*LBSTNRLO) then ANRIND = 'Y' else if AVAL > [0.5*LBSTRNHI),'H','N'
- name: BNRIND
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 1
    origins:
    - type: Derived
    codelist: LNH
    method:
      name: Algorithm to derive ADLBC.BNRIND
      type: Computation
      description: if BASE < [0.5*LBSTNRLO) then ANRIND = 'Y' else if BASE > [0.5*LBSTRNHI),'H','N'
- name: ABLFL
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 1
    origins:
    - type: Derived
    method: Copy LB.LBBLFL; represent a missing value as an empty string.
- name: AENTMTFL
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 1
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADLBC.AENTMTFL
      type: Computation
      description: 'Last observed value for this lab parameter during treatment phase: ''Y'' if VISITNUM=12,
        if subject discontinues prior to VISIT 12, then this variable is set to ''Y'' if this is the last
        assessment of this analyte for the subject'
- name: LBSEQ
  type: int
  submission:
    core: Cond
    mandatory: true
    length: 8
    origins:
    - type: Predecessor
      description: LB.LBSEQ
- name: LBNRIND
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 8
    origins:
    - type: Derived
    codelist: LBNRIND
    method: Copy LB.LBNRIND; represent a missing value as an empty string.
- name: LBSTRESN
  type: float
  submission:
    core: Cond
    mandatory: false
    length: 8
    significant_digits: 5
    origins:
    - type: Predecessor
      description: LB.LBSTRESN
submission:
  label: Analysis Dataset Lab Blood Chemistry
  class: BASIC DATA STRUCTURE
  structure: one record per subject per parameter per analysis visit
  repeating: true
  reference_data: false
