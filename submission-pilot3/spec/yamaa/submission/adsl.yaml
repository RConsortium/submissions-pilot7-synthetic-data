# Transcribed from the preserved Pilot 3 Define-XML; see program/adam/DEFINE.md.
yamaa: '1.0'
type: spec
parent: ../adsl.yaml
output:
  path: ../../../../.build/pilot3-define/data/adsl.parquet
  columns:
  - STUDYID
  - USUBJID
  - SUBJID
  - SITEID
  - SITEGR1
  - ARM
  - TRT01P
  - TRT01PN
  - TRT01A
  - TRT01AN
  - TRTSDT
  - TRTEDT
  - TRTDURD
  - AVGDD
  - CUMDOSE
  - AGE
  - AGEGR1
  - AGEGR1N
  - AGEU
  - RACE
  - RACEN
  - SEX
  - ETHNIC
  - SAFFL
  - ITTFL
  - EFFFL
  - COMP8FL
  - COMP16FL
  - COMP24FL
  - DISCONFL
  - DSRAEFL
  - DTHFL
  - BMIBL
  - BMIBLGR1
  - HEIGHTBL
  - WEIGHTBL
  - EDUCLVL
  - DISONSDT
  - DURDIS
  - DURDSGR1
  - VISIT1DT
  - RFSTDTC
  - RFENDTC
  - VISNUMEN
  - RFENDT
  - DCDECOD
  - EOSSTT
  - DCSREAS
  - MMSETOT
columns:
- name: STUDYID
  type: str
  submission:
    core: Cond
    mandatory: true
    length: 12
    origins:
    - type: Predecessor
      description: DM.STUDYID
- name: USUBJID
  type: str
  submission:
    core: Cond
    mandatory: true
    length: 11
    origins:
    - type: Predecessor
      description: DM.USUBJID
- name: SUBJID
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 4
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADSL.SUBJID
      type: Computation
      description: DM.SUBJID
- name: SITEID
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 3
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADSL.SITEID
      type: Computation
      description: DM.SITEID
- name: SITEGR1
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 3
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADSL.SITEGR1
      type: Computation
      description: refer to SAP, Section 7.1 - if not pooled then SITEGR1=SITEID. If pooled, SITEGR1 will
        be 900
- name: ARM
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 20
    origins:
    - type: Derived
    codelist: ARM
    method:
      name: Algorithm to derive ADSL.ARM
      type: Computation
      description: DM.ARM
- name: TRT01P
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 20
    origins:
    - type: Derived
    codelist: ARM
    method:
      name: Algorithm to derive ADSL.TRT01P
      type: Computation
      description: DM.ARM
- name: TRT01PN
  type: int
  submission:
    core: Cond
    mandatory: false
    length: 8
    origins:
    - type: Derived
    codelist: ARMN
    method:
      name: Algorithm to derive ADSL.TRT01PN
      type: Computation
      description: Numeric code for TRT01P which corresponds to the randomized dose
- name: TRT01A
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 20
    origins:
    - type: Derived
    codelist: ARM
    method:
      name: Algorithm to derive ADSL.TRT01A
      type: Computation
      description: TRT01A=TRT01P, i.e., no difference between actual and randomized treatment in this
        study.
- name: TRT01AN
  type: int
  submission:
    core: Cond
    mandatory: false
    length: 8
    origins:
    - type: Derived
    codelist: ARMN
    method:
      name: Algorithm to derive ADSL.TRT01AN
      type: Computation
      description: Numeric code for TRT01A which corresponds to the randomized dose
- name: TRTSDT
  type: date
  submission:
    core: Cond
    mandatory: false
    display_format: DATE9.
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADSL.TRTSDT
      type: Computation
      description: SV.SVSTDTC when SV.VISITNUM=3, converted to SAS date
- name: TRTEDT
  type: date
  submission:
    core: Cond
    mandatory: false
    display_format: DATE9.
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADSL.TRTEDT
      type: Computation
      description: The date of final dose (from the CRF) is EX.EXENDTC on the subject's last EX record.
        If the date of final dose is missing for the subject and the subject discontinued after visit
        3, use the date of discontinuation as the date of last dose. Convert the date to a SAS date.
- name: TRTDURD
  type: int
  submission:
    core: Cond
    mandatory: false
    length: 8
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADSL.TRTDUR
      type: Computation
      description: TRTEDT-TRTSDT+1
- name: AVGDD
  type: float
  submission:
    core: Cond
    mandatory: false
    length: 8
    significant_digits: 1
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADSL.AVGDD
      type: Computation
      description: CUMDOSE/TRTDURD
- name: CUMDOSE
  type: float
  submission:
    core: Cond
    mandatory: false
    length: 8
    significant_digits: 1
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADSL.CUMDOSE
      type: Computation
      description: 'For ARMN=0 or 1: CUMDOSE=TRT01PN*TRTDUR. --- For ARMN=2: CUMDOSE will be based on
        54mg per day for the # of days subj was in 1st dosing interval (i.e., visit4date-TRTSTDT+1 if
        1st interval completed, TRTEDT-TRTSTDT+1 if subj discontinued <=visit 4 and > visit 3), 81mg per
        day for the # of days subj was in 2nd dosing interval (i.e., visit12date-visit4date if 2nd interval
        completed, TRTEDT-visit4date if subj discontinued <= visit 12 and > visit 4), and 54mg per day
        for the # of days subj was in 3rd dosing interval (i.e., TRTEDT - visit12date if subj continued
        after visit 12).'
- name: AGE
  type: int
  submission:
    core: Cond
    mandatory: false
    length: 8
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADSL.AGE
      type: Computation
      description: DM.AGE
- name: AGEGR1
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 5
    origins:
    - type: Derived
    codelist: AGEGR1
    method:
      name: Algorithm to derive ADSL.AGEGR1
      type: Computation
      description: Character variable derived from ADSL.AGEGR1N
- name: AGEGR1N
  type: int
  submission:
    core: Cond
    mandatory: false
    length: 8
    origins:
    - type: Derived
    codelist: AGEGR1N
    method:
      name: Algorithm to derive ADSL.AGEGR1N
      type: Computation
      description: AGEGR1 = 1 if AGE <65. AGEGR1 = 2 if AGE 65-80. AGEGR1 = 3 if AGE >80.
- name: AGEU
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 5
    origins:
    - type: Derived
    codelist: AGEU
    method:
      name: Algorithm to derive ADSL.AGEU
      type: Computation
      description: DM.AGEU
- name: RACE
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 32
    origins:
    - type: Derived
    codelist: RACE
    method:
      name: Algorithm to derive ADSL.RACE
      type: Computation
      description: DM.RACE
- name: RACEN
  type: int
  submission:
    core: Cond
    mandatory: false
    length: 8
    origins:
    - type: Derived
    codelist: RACEN
    method:
      name: Algorithm to derive ADSL.RACEN
      type: Computation
      description: Numeric code for RACE
- name: SEX
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 1
    origins:
    - type: Derived
    codelist: SEX
    method:
      name: Algorithm to derive ADSL.SEX
      type: Computation
      description: DM.SEX
- name: ETHNIC
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 22
    origins:
    - type: Derived
    codelist: ETHNIC
    method:
      name: Algorithm to derive ADSL.ETHNIC
      type: Computation
      description: DM.ETHNIC
- name: SAFFL
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 1
    origins:
    - type: Derived
    codelist: YN
    method:
      name: Algorithm to derive ADSL.SAFFL
      type: Computation
      description: Y if ITTFL='Y' and TRTSDT ne missing. N otherwise
- name: ITTFL
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 1
    origins:
    - type: Derived
    codelist: YN
    method:
      name: Algorithm to derive ADSL.ITTFL
      type: Computation
      description: Y if ARMCD ne ' '. N otherwise
- name: EFFFL
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 1
    origins:
    - type: Derived
    codelist: YN
    method:
      name: Algorithm to derive ADSL.EFFFL
      type: Computation
      description: Y if SAFFL='Y AND subject has at least one record in QS for ADAS-Cog with VISITNUM>3
        AND at least one record in QS for CIBIC+ with VISITNUM>3, N otherwise
- name: COMP8FL
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 1
    origins:
    - type: Derived
    codelist: YN
    method:
      name: Algorithm to derive ADSL.COMP8FL
      type: Computation
      description: Y if subject has a SV.VISITNUM=8 and ENDDT >= date of visit 8, N otherwise
- name: COMP16FL
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 1
    origins:
    - type: Derived
    codelist: YN
    method:
      name: Algorithm to derive ADSL.COMP16FL
      type: Computation
      description: Y if subject has a SV.VISITNUM=10 and ENDDT>=date of visit 10, N otherwise
- name: COMP24FL
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 1
    origins:
    - type: Derived
    codelist: YN
    method:
      name: Algorithm to derive ADSL.COMP24FL
      type: Computation
      description: Y if subject has a SV.VISITNUM=12 and ENDDT>= date of visit 12 , N otherwise
- name: DISCONFL
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 1
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADSL.DISCONFL
      type: Computation
      description: Y if DCREASCD ^= 'Completed'. Null otherwise
- name: DSRAEFL
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 1
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADSL.DSRAEFL
      type: Computation
      description: Y if DCREASCD='Adverse Event'. Null otherwise
- name: DTHFL
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 1
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADSL.DTHFL
      type: Computation
      description: DM.DTHFL
- name: BMIBL
  type: float
  submission:
    core: Cond
    mandatory: false
    length: 8
    significant_digits: 1
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADSL.BMIBL
      type: Computation
      description: WEIGHTBL / ((HEIGHTBL/100)**2)
- name: BMIBLGR1
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 6
    origins:
    - type: Derived
    codelist: BMICAT
    method:
      name: Algorithm to derive ADSL.BMIBLGR1
      type: Computation
      description: 'BMIBLGR1="<25" if . < BMIBL <25.

        BMIBLGR1="25-<30" if 25 <=BMIBL <30.

        BMIBLGR1=">=30"if BMIBL >=30.'
- name: HEIGHTBL
  type: float
  submission:
    core: Cond
    mandatory: false
    length: 8
    significant_digits: 1
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADSL.HEIGHTBL
      type: Computation
      description: VSSTRESN when VS.VSTESTCD='HEIGHT' and VS.VISITNUM=1
- name: WEIGHTBL
  type: float
  submission:
    core: Cond
    mandatory: false
    length: 8
    significant_digits: 1
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADSL.WEIGHTBL
      type: Computation
      description: VSSTRESN when VS.VSTESTCD='WEIGHT' and VS.VISITNUM=3
- name: EDUCLVL
  type: int
  submission:
    core: Cond
    mandatory: false
    length: 8
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADSL.EDUCLVL
      type: Computation
      description: SC.SCSTRESN where SC.SCTESTCD=EDLEVEL
- name: DISONSDT
  type: date
  submission:
    core: Cond
    mandatory: false
    display_format: DATE9.
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADSL.DISONSDT
      type: Computation
      description: MH.MHSTDTC where MHCAT='PRIMARY DIAGNOSIS' converted to SAS date
- name: DURDIS
  type: float
  submission:
    core: Cond
    mandatory: false
    length: 8
    significant_digits: 1
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADSL.DURDIS
      type: Computation
      description: number of months between VISIT1DT and DISONSET
- name: DURDSGR1
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 4
    origins:
    - type: Derived
    codelist: DURDISC
    method:
      name: Algorithm to derive ADSL.DURDSGR1
      type: Computation
      description: grouping DURDIS values as <12 and >=12
- name: VISIT1DT
  type: date
  submission:
    core: Cond
    mandatory: false
    display_format: DATE9.
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADSL.VISIT1DT
      type: Computation
      description: SV.SVSTDTC when SV.VISITNUM=1, converted to SAS date
- name: RFSTDTC
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 20
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADSL.RFSTDTC
      type: Computation
      description: DM.RFSTDTC
- name: RFENDTC
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 20
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADSL.RFENDTC
      type: Computation
      description: DM.RFENDTC
- name: VISNUMEN
  type: int
  submission:
    core: Cond
    mandatory: false
    length: 8
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADSL.VISNUMEN
      type: Computation
      description: if DS.VISITNUM=13 where DSTERM='PROTCOL COMPLETED' then VISNUMEN=12, otherwise VISNUMEN=DS.VISITNUM
        where DSTERM='PROTCOL COMPLETED'
- name: RFENDT
  type: date
  submission:
    core: Cond
    mandatory: false
    display_format: DATE9.
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADSL.RFENDT
      type: Computation
      description: RFENDTC converted to SAS date
- name: DCDECOD
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 27
    origins:
    - type: Derived
    codelist: DISCCD
    method:
      name: Algorithm to derive ADSL.DCDECOD
      type: Computation
      description: DS.DSDECOD where DSCAT='DISPOSITION EVENT'
- name: EOSSTT
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 12
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADSL.EOSSTT
      type: Computation
      description: COMPLETED if ADSL.DCDECOD='COMPLETED'. DISCONTINUED if ADSL.DCDECOD not equal to COMPLETED.
- name: DCSREAS
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 18
    origins:
    - type: Derived
    codelist: DISCREAS
    method:
      name: Algorithm to derive ADSL.DCREASCD
      type: Computation
      description: Grouping of DCDECOD values to support summarizing study completion status and reason
        for discontinuation
- name: MMSETOT
  type: int
  submission:
    core: Cond
    mandatory: false
    length: 8
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADSL.MMSETOT
      type: Computation
      description: sum of QS.QSORRES values for the subject when QSCAT = MINI-MENTAL STATE
submission:
  label: Subject-Level Analysis Dataset
  class: SUBJECT LEVEL ANALYSIS DATASET
  structure: one record per subject. Screen Failures are excluded.
  repeating: false
  reference_data: false
