# Pilot 3 submission layer. Reference differences are reported by compare_define.py.
yamaa: '1.0'
type: spec
parent: ../adae.yaml
output:
  path: ../../../../.build/pilot3-define/data/adae.parquet
  columns:
  - STUDYID
  - SITEID
  - USUBJID
  - TRTA
  - TRTAN
  - AGE
  - AGEGR1
  - AGEGR1N
  - RACE
  - RACEN
  - SEX
  - SAFFL
  - TRTSDT
  - TRTEDT
  - ASTDT
  - ASTDTF
  - ASTDY
  - AENDT
  - AENDY
  - ADURN
  - ADURU
  - AETERM
  - AELLT
  - AELLTCD
  - AEDECOD
  - AEPTCD
  - AEHLT
  - AEHLTCD
  - AEHLGT
  - AEHLGTCD
  - AEBODSYS
  - AESOC
  - AESOCCD
  - AESEV
  - AESER
  - AESCAN
  - AESCONG
  - AESDISAB
  - AESDTH
  - AESHOSP
  - AESLIFE
  - AESOD
  - AEREL
  - AEACN
  - AEOUT
  - AESEQ
  - TRTEMFL
  - AOCCFL
  - AOCCSFL
  - AOCCPFL
  - AOCC02FL
  - AOCC03FL
  - AOCC04FL
  - CQ01NAM
  - AOCC01FL
columns:
- name: STUDYID
  type: str
  submission:
    core: Cond
    mandatory: true
    length: 12
    origins:
    - type: Predecessor
      description: AE.STUDYID
- name: SITEID
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 3
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADAE.SITEID
      type: Computation
      description: ADSL.SITEID
- name: USUBJID
  type: str
  submission:
    core: Cond
    mandatory: true
    length: 11
    origins:
    - type: Predecessor
      description: AE.USUBJID
- name: TRTA
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 20
    origins:
    - type: Derived
    codelist: ARM
    method:
      name: Algorithm to derive ADAE.TRTA
      type: Computation
      description: ADSL.TRT01A
- name: TRTAN
  type: int
  submission:
    core: Cond
    mandatory: false
    length: 8
    origins:
    - type: Derived
    codelist: ARMN
    method:
      name: Algorithm to derive ADAE.TRTAN
      type: Computation
      description: ADSL.TRT01AN
- name: AGE
  type: int
  submission:
    core: Cond
    mandatory: false
    length: 8
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADAE.AGE
      type: Computation
      description: ADSL.AGE
- name: AGEGR1
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 5
    origins:
    - type: Derived
    codelist: AGEGR1
    method:
      name: Algorithm to derive ADAE.AGEGR1
      type: Computation
      description: ADSL.AGEGR1
- name: AGEGR1N
  type: int
  submission:
    core: Cond
    mandatory: false
    length: 8
    origins:
    - type: Derived
    codelist: AGEGR1N
    method:
      name: Algorithm to derive ADAE.AGEGR1N
      type: Computation
      description: ADSL.AGEGR1N
- name: RACE
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 32
    origins:
    - type: Derived
    codelist: RACE
    method:
      name: Algorithm to derive ADAE.RACE
      type: Computation
      description: ADSL.RACE
- name: RACEN
  type: int
  submission:
    core: Cond
    mandatory: false
    length: 8
    origins:
    - type: Derived
    codelist: RACEN
    method:
      name: Algorithm to derive ADAE.RACEN
      type: Computation
      description: ADSL.RACEN
- name: SEX
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 1
    origins:
    - type: Derived
    codelist: SEX
    method:
      name: Algorithm to derive ADAE.SEX
      type: Computation
      description: ADSL.SEX
- name: SAFFL
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 1
    origins:
    - type: Derived
    codelist: YN
    method:
      name: Algorithm to derive ADAE.SAFFL
      type: Computation
      description: ADSL.SAFFL
- name: TRTSDT
  type: date
  submission:
    core: Cond
    mandatory: false
    display_format: DATE9.
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADAE.TRTSDT
      type: Computation
      description: ADSL.TRTSDT
- name: TRTEDT
  type: date
  submission:
    core: Cond
    mandatory: false
    display_format: DATE9.
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADAE.TRTEDT
      type: Computation
      description: ADSL.TRTEDT
- name: ASTDT
  type: date
  submission:
    core: Cond
    mandatory: false
    display_format: DATE9.
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADAE.ASTDT
      type: Computation
      description: AE.AESTDTC, converted to a numeric SAS date. Some events with partial dates are imputed
        in a conservative manner. If the day component is missing, a value of '01' is used. If both the
        month and day are missing no imputation is performed as these dates clearly indicate a start prior
        to the beginning of treatment. There are no events with completely missing start dates.
- name: ASTDTF
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 1
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADAE.ASTDTF
      type: Computation
      description: ASTDTF='D' if the day value within the character date is imputed. Note that only day
        values needed to be imputed for this study.
- name: ASTDY
  type: int
  submission:
    core: Cond
    mandatory: false
    length: 8
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADAE.ASTDY
      type: Computation
      description: IF ASTDT>=TRTSDT>MISSING then ASTDY=ASTDT-TRTSDT+1 Else if TRTSDT>ASTDT>MISSING then
        ASTDY=ASTDT-TRTSDT
- name: AENDT
  type: date
  submission:
    core: Cond
    mandatory: false
    display_format: DATE9.
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADAE.AENDT
      type: Computation
      description: AE.AEENDTC, converted to a numeric SAS date
- name: AENDY
  type: int
  submission:
    core: Cond
    mandatory: false
    length: 8
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADAE.AENDY
      type: Computation
      description: IF AENDT>=TRTSDT>MISSING then AENDY=AENDT-TRTSDT+1 Else if TRTSDT>AENDT>MISSING then
        AENDY=AENDT-TRTSDT
- name: ADURN
  type: int
  submission:
    core: Cond
    mandatory: false
    length: 8
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADAE.ADURN
      type: Computation
      description: ADURN=AENDT-ASTDT+1
- name: ADURU
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 3
    origins:
    - type: Derived
    codelist: ADURU
    method:
      name: Algorithm to derive ADAE.ADURU
      type: Computation
      description: If ADURN is not missing then ADURU='DAYS'
- name: AETERM
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 46
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADAE.AETERM
      type: Computation
      description: AE.AETERM
- name: AELLT
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 46
    origins:
    - type: Derived
    codelist: AEDICT
    method:
      name: Algorithm to derive ADAE.AELLT
      type: Computation
      description: AE.AELLT
- name: AELLTCD
  type: int
  submission:
    core: Cond
    mandatory: false
    length: 8
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADAE.AELLTCD
      type: Computation
      description: AE.AELLTCD
- name: AEDECOD
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 46
    origins:
    - type: Derived
    codelist: AEDICT
    method:
      name: Algorithm to derive ADAE.AEDECOD
      type: Computation
      description: AE.AEDECOD
- name: AEPTCD
  type: int
  submission:
    core: Cond
    mandatory: false
    length: 8
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADAE.AEPTCD
      type: Computation
      description: AE.AEPTCD
- name: AEHLT
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 8
    origins:
    - type: Derived
    codelist: AEDICT
    method:
      name: Algorithm to derive ADAE.AEHLT
      type: Computation
      description: AE.AEHLT
- name: AEHLTCD
  type: int
  submission:
    core: Cond
    mandatory: false
    length: 8
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADAE.AEHLTCD
      type: Computation
      description: AE.AEHLTCD
- name: AEHLGT
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 9
    origins:
    - type: Derived
    codelist: AEDICT
    method:
      name: Algorithm to derive ADAE.AEHLGT
      type: Computation
      description: AE.AEHLGT
- name: AEHLGTCD
  type: int
  submission:
    core: Cond
    mandatory: false
    length: 8
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADAE.AEHLGTCD
      type: Computation
      description: AE.AEHLGTCD
- name: AEBODSYS
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 67
    origins:
    - type: Derived
    codelist: AEDICT
    method:
      name: Algorithm to derive ADAE.AEBODSYS
      type: Computation
      description: AE.AEBODSYS
- name: AESOC
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 67
    origins:
    - type: Derived
    codelist: AEDICT
    method:
      name: Algorithm to derive ADAE.AESOC
      type: Computation
      description: AE.AESOC
- name: AESOCCD
  type: int
  submission:
    core: Cond
    mandatory: false
    length: 8
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADAE.AESOCCD
      type: Computation
      description: AE.AESOCCD
- name: AESEV
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 8
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADAE.AESEV
      type: Computation
      description: AE.AESEV
- name: AESER
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 1
    origins:
    - type: Derived
    codelist: YN
    method:
      name: Algorithm to derive ADAE.AESER
      type: Computation
      description: AE.AESER
- name: AESCAN
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 1
    origins:
    - type: Derived
    codelist: YN
    method:
      name: Algorithm to derive ADAE.AESCAN
      type: Computation
      description: AE.AESCAN
- name: AESCONG
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 1
    origins:
    - type: Derived
    codelist: YN
    method:
      name: Algorithm to derive ADAE.AESCONG
      type: Computation
      description: AE.AESCONG
- name: AESDISAB
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 1
    origins:
    - type: Derived
    codelist: YN
    method:
      name: Algorithm to derive ADAE.AESDISAB
      type: Computation
      description: AE.AESDISAB
- name: AESDTH
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 1
    origins:
    - type: Derived
    codelist: YN
    method:
      name: Algorithm to derive ADAE.AESDTH
      type: Computation
      description: AE.AESDTH
- name: AESHOSP
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 1
    origins:
    - type: Derived
    codelist: YN
    method:
      name: Algorithm to derive ADAE.AESHOSP
      type: Computation
      description: AE.AESHOSP
- name: AESLIFE
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 1
    origins:
    - type: Derived
    codelist: YN
    method:
      name: Algorithm to derive ADAE.AESLIFE
      type: Computation
      description: AE.AESLIFE
- name: AESOD
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 1
    origins:
    - type: Derived
    codelist: YN
    method:
      name: Algorithm to derive ADAE.AESOD
      type: Computation
      description: AE.AESOD
- name: AEREL
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 8
    origins:
    - type: Derived
    codelist: AECAUS
    method:
      name: Algorithm to derive ADAE.AEREL
      type: Computation
      description: AE.AEREL
- name: AEACN
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 1
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADAE.AEACN
      type: Computation
      description: AE.AEACN
- name: AEOUT
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 26
    origins:
    - type: Derived
    codelist: OUT
    method:
      name: Algorithm to derive ADAE.AEOUT
      type: Computation
      description: AE.AEOUT
- name: AESEQ
  type: int
  submission:
    core: Cond
    mandatory: true
    length: 8
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADAE.AESEQ
      type: Computation
      description: AE.AESEQ
- name: TRTEMFL
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 1
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADAE.TRTEMFL
      type: Computation
      description: If ASTDT >= TRTSDT > . then TRTEMFL='Y'. Otherwise TRTEMFL='N'
- name: AOCCFL
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 1
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADAE.AOCCFL
      type: Computation
      description: Subset to TRTEMFL='Y' and sort by Subject (USUBJID), Start Date (ASTDT), and Sequence
        Number (AESEQ) and flag the first record (set AOCCFL=?Y?) within each Subject
- name: AOCCSFL
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 1
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADAE.AOCCSFL
      type: Computation
      description: Subset to TRTEMFL='Y' and sort by Subject (USUBJID), System Organ Class (AEBODSYS),
        Start Date (ASTDT), and Sequence Number (AESEQ) and flag the first record (set AOCCSFL=?Y?) within
        each Subject and SOC
- name: AOCCPFL
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 1
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADAE.AOCCPFL
      type: Computation
      description: Subset to TRTEMFL='Y' and sort by Subject (USUBJID), System Organ Class (AEBODSYS),
        Preferred Term (AEDECOD), Start Date (ASTDT), and Sequence Number (AESEQ) and flag the first record
        (set AOCCPFL=?Y?) within each Subject, SOC, and PT
- name: AOCC02FL
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 1
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADAE.AOCC02FL
      type: Computation
      description: Subset to TRTEMFL='Y' and AESER='Y' and sort by Subject (USUBJID), Start Date (ASTDT),
        and Sequence Number (AESEQ) and flag the first record (set AOCC02FL=?Y?) within each Subject
- name: AOCC03FL
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 1
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADAE.AOCC03FL
      type: Computation
      description: Subset to TRTEMFL='Y' and AESER='Y' and sort by Subject (USUBJID), System Organ Class
        (AEBODSYS), Start Date (ASTDT), and Sequence Number (AESEQ) and flag the first record (set AOCC03FL=?Y?)
        within each Subject and SOC
- name: AOCC04FL
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 1
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADAE.AOCC04FL
      type: Computation
      description: Subset to TRTEMFL='Y' and AESER='Y' and sort by Subject (USUBJID), System Organ Class
        (AEBODSYS), Preferred Term (AEDECOD), Start Date (ASTDT), and Sequence Number (AESEQ) and flag
        the first record (set AOCC04FL=?Y?) within each Subject, SOC, and PT
- name: CQ01NAM
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 19
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADAE.CQ01NAM
      type: Computation
      description: If AEDECOD contains any of the character strings of ('APPLICATION', 'DERMATITIS', 'ERYTHEMA',
        'BLISTER') OR if AEBODSYS='SKIN AND SUBC UTANEOUS TISSUE DISORDERS' but AEDECOD is not in ('COLD
        SWEAT', 'HYPERHIDROSIS', 'ALOPECIA') then CQ01NAM='DERMATOLOGIC EVENTS' Otherwise CQ01NAM=NULL
- name: AOCC01FL
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 1
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADAE.AOCC01FL
      type: Computation
      description: Subset to CQ01NAM='' and TRTEMFL='Y' and sort by Subject (USUBJID), Start Date (ASTDT),
        and Sequence Number (AESEQ) and flag the first record (set AOCC01FL=?Y?) within each Subject (Flag
        First Treatment Emergent Dermatological Event for Time to Event Analysis)
submission:
  label: Adverse Events Analysis Dataset
  class: ADAM OTHER
  structure: one record per subject per adverse event
  repeating: true
  reference_data: false
