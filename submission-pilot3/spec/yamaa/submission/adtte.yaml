# Pilot 3 submission layer. Reference differences are reported by compare_define.py.
yamaa: '1.0'
type: spec
parent: ../adtte.yaml
output:
  path: ../../../../.build/pilot3-define/data/adtte.parquet
  columns:
  - STUDYID
  - SITEID
  - USUBJID
  - AGE
  - AGEGR1
  - AGEGR1N
  - RACE
  - RACEN
  - SEX
  - TRTSDT
  - TRTEDT
  - TRTDUR
  - TRTP
  - TRTA
  - TRTAN
  - PARAM
  - PARAMCD
  - AVAL
  - STARTDT
  - ADT
  - CNSR
  - EVNTDESC
  - SRCDOM
  - SRCVAR
  - SRCSEQ
  - SAFFL
columns:
- name: STUDYID
  type: str
  submission:
    core: Cond
    mandatory: true
    length: 12
    origins:
    - type: Predecessor
      description: ADSL.STUDYID
- name: SITEID
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 3
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADTTE.SITEID
      type: Computation
      description: ADSL.SITEID
- name: USUBJID
  type: str
  submission:
    core: Cond
    mandatory: true
    length: 11
    origins:
    - type: Predecessor
      description: ADSL.USUBJID
- name: AGE
  type: int
  submission:
    core: Cond
    mandatory: false
    length: 8
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADTTE.AGE
      type: Computation
      description: ADSL.AGE
- name: AGEGR1
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 5
    origins:
    - type: Derived
    codelist: AGEGR1
    method:
      name: Algorithm to derive ADTTE.AGEGR1
      type: Computation
      description: ADSL.AGEGR1
- name: AGEGR1N
  type: int
  submission:
    core: Cond
    mandatory: false
    length: 8
    origins:
    - type: Derived
    codelist: AGEGR1N
    method:
      name: Algorithm to derive ADTTE.AGEGR1N
      type: Computation
      description: ADSL.AGEGR1N
- name: RACE
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 32
    origins:
    - type: Derived
    codelist: RACE
    method:
      name: Algorithm to derive ADTTE.RACE
      type: Computation
      description: ADSL.RACE
- name: RACEN
  type: int
  submission:
    core: Cond
    mandatory: false
    length: 8
    origins:
    - type: Derived
    codelist: RACEN
    method:
      name: Algorithm to derive ADTTE.RACEN
      type: Computation
      description: ADSL.RACEN
- name: SEX
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 1
    origins:
    - type: Derived
    codelist: SEX
    method:
      name: Algorithm to derive ADTTE.SEX
      type: Computation
      description: ADSL.SEX
- name: TRTSDT
  type: date
  submission:
    core: Cond
    mandatory: false
    display_format: DATE9.
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADTTE.TRTSDT
      type: Computation
      description: ADSL.TRTSDT
- name: TRTEDT
  type: date
  submission:
    core: Cond
    mandatory: false
    display_format: DATE9.
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADTTE.TRTEDT
      type: Computation
      description: ADSL.TRTEDT
- name: TRTDUR
  type: int
  submission:
    core: Cond
    mandatory: false
    length: 8
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADTTE.TRTDUR
      type: Computation
      description: ADSL.TRTDUR
- name: TRTP
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 20
    origins:
    - type: Derived
    codelist: ARM
    method:
      name: Algorithm to derive ADTTE.TRTP
      type: Computation
      description: ADSL.TRT01P
- name: TRTA
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 20
    origins:
    - type: Derived
    codelist: ARM
    method:
      name: Algorithm to derive ADTTE.TRTA
      type: Computation
      description: ADSL.TRT01A
- name: TRTAN
  type: int
  submission:
    core: Cond
    mandatory: false
    length: 8
    origins:
    - type: Derived
    codelist: ARMN
    method:
      name: Algorithm to derive ADTTE.TRTAN
      type: Computation
      description: ADSL.TRT01AN
- name: PARAM
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 100
    origins:
    - type: Assigned
    codelist: PARAM_ADTTE
    method:
      name: Algorithm to derive ADTTE.PARAM
      type: Computation
      description: PARAM="Time to First Dermatologic Event"
- name: PARAMCD
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 8
    origins:
    - type: Assigned
    codelist: PARAMCD_ADTTE
    method:
      name: Algorithm to derive ADTTE.PARAMCD
      type: Computation
      description: PARAMCD="TTDE"
- name: AVAL
  type: int
  submission:
    core: Cond
    mandatory: false
    length: 8
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADTTE.AVAL
      type: Computation
      description: ADT-STARTDT+1
- name: STARTDT
  type: date
  submission:
    core: Cond
    mandatory: false
    display_format: DATE9.
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADTTE.STARTDT
      type: Computation
      description: ADSL.RFSTDTC
- name: ADT
  type: date
  submission:
    core: Cond
    mandatory: false
    display_format: DATE9.
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADTTE.ADT
      type: Computation
      description: if ADAE.ASTDT is not missing and occurred after TRTSDT then ADAE.ASTDT else convert
        ADSL.RFENDTC to a SAS numeric date
- name: CNSR
  type: int
  submission:
    core: Cond
    mandatory: false
    length: 8
    origins:
    - type: Derived
    codelist: CENSOR
    method:
      name: Algorithm to derive ADTTE.CNSR
      type: Computation
      description: if ADAE.TRTEMFL ="Y" then CNSR=0, else CNSR=1
- name: EVNTDESC
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 25
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADTTE.EVNTDESC
      type: Computation
      description: if ADTTE.CNSR = 0 then "Dematologic Event Occured", else if ADTTE.CNSR =1 then "Study
        Completion Date"
- name: SRCDOM
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 4
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADTTE.SRCDOM
      type: Computation
      description: The Source domain referred to in order to populate ADT (either ADAE or ADSL)
- name: SRCVAR
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 6
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADTTE.SRCVAR
      type: Computation
      description: The Source variable referred to in order to populate ADT (either ASTDT or RFENDT)
- name: SRCSEQ
  type: int
  submission:
    core: Cond
    mandatory: false
    length: 8
    origins:
    - type: Derived
    method:
      name: Algorithm to derive ADTTE.SRCSEQ
      type: Computation
      description: The value of ADAE.AESEQ if SRCDOM=ADAE, otherwise null.
- name: SAFFL
  type: str
  submission:
    core: Cond
    mandatory: false
    length: 1
    origins:
    - type: Derived
    codelist: YN
    method:
      name: Algorithm to derive ADTTE.SAFFL
      type: Computation
      description: ADSL.SAFFL
submission:
  label: AE Time To 1st Derm. Event Analysis
  class: BASIC DATA STRUCTURE
  structure: one record per subject per parameter
  repeating: true
  reference_data: false
