yamaa: "1.0"
type: spec
model: ADaM
domain: ADLBC

keys:
  - STUDYID
  - USUBJID
  - AVISIT
  - LBSEQ

input:
  LB:
    path: ../../data/sdtm/lb.parquet
    empty_string: present
  SUPPLB: ../../data/sdtm/supplb.parquet
  ADSL:
    path: ../../data/adam/adsl-yamaa.parquet
    schema: adsl.yaml
    key:
      - STUDYID
      - USUBJID

output:
  path: ../../data/adam/adlbc-yamaa.parquet
  columns:
    - STUDYID
    - SUBJID
    - USUBJID
    - TRTP
    - TRTPN
    - TRTA
    - TRTAN
    - TRTSDT
    - TRTEDT
    - AGE
    - AGEGR1
    - AGEGR1N
    - RACE
    - RACEN
    - SEX
    - COMP24FL
    - DSRAEFL
    - SAFFL
    - AVISIT
    - AVISITN
    - ADY
    - ADT
    - VISIT
    - VISITNUM
    - PARAM
    - PARAMCD
    - PARAMN
    - PARCAT1
    - AVAL
    - BASE
    - CHG
    - A1LO
    - A1HI
    - R2A1LO
    - R2A1HI
    - BR2A1LO
    - BR2A1HI
    - ANL01FL
    - ALBTRVAL
    - ANRIND
    - BNRIND
    - ABLFL
    - AENTMTFL
    - LBSEQ
    - LBNRIND
    - LBSTRESN

intermediates:
  - id: SUP_EP
    dataset: SUPPLB
    key: {STUDYID: LB.STUDYID, USUBJID: LB.USUBJID, IDVARVAL: LBSEQ_K}
    filter: "SUPPLB.QNAM = 'ENDPOINT'"

  - id: BL
    dataset: LB
    key: {STUDYID: STUDYID, USUBJID: USUBJID, LBTESTCD: PARAMCD}
    filter: "LB.LBBLFL = 'Y'"

columns:
  # Subject-level (from ADSL)
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: LB.STUDYID

    submission:
      core: Cond
      mandatory: true
      length: 12
      origins:
        - type: Predecessor
          description: LB.STUDYID
  - name: SUBJID
    type: str
    label: Subject Identifier for the Study
    derivation: ADSL.SUBJID
    submission:
      core: Cond
      mandatory: false
      length: 4
      origins:
        - type: Predecessor
          description: ADSL.SUBJID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: LB.USUBJID

    submission:
      core: Cond
      mandatory: true
      length: 11
      origins:
        - type: Predecessor
          description: LB.USUBJID
  - name: TRTP
    type: str
    label: Planned Treatment
    derivation: ADSL.TRT01P

    submission:
      core: Cond
      mandatory: false
      length: 20
      origins:
        - type: Derived
      codelist: ARM
      method:
        name: Algorithm to derive ADLBC.TRTP
        type: Computation
        description: ADSL.TRT01P
  - name: TRTPN
    type: float
    label: Planned Treatment (N)
    derivation: ADSL.TRT01PN

    submission:
      core: Cond
      mandatory: false
      length: 8
      origins:
        - type: Derived
      codelist: ARMN
      method:
        name: Algorithm to derive ADLBC.TRTPN
        type: Computation
        description: ADSL.TRT01PN
      significant_digits: 0
  - name: TRTA
    type: str
    label: Actual Treatment
    derivation: ADSL.TRT01A

    submission:
      core: Cond
      mandatory: false
      length: 20
      origins:
        - type: Derived
      codelist: ARM
      method:
        name: Algorithm to derive ADLBC.TRTA
        type: Computation
        description: ADSL.TRT01A
  - name: TRTAN
    type: float
    label: Actual Treatment (N)
    derivation: ADSL.TRT01AN

    submission:
      core: Cond
      mandatory: false
      length: 8
      origins:
        - type: Derived
      codelist: ARMN
      method:
        name: Algorithm to derive ADLBC.TRTAN
        type: Computation
        description: ADSL.TRT01AN
      significant_digits: 0
  - name: TRTSDT
    type: date
    label: Date of First Exposure to Treatment
    derivation: ADSL.TRTSDT
    submission:
      core: Cond
      mandatory: false
      display_format: DATE9.
      origins:
        - type: Predecessor
          description: ADSL.TRTSDT
  - name: TRTEDT
    type: date
    label: Date of Last Exposure to Treatment
    derivation: ADSL.TRTEDT
    submission:
      core: Cond
      mandatory: false
      display_format: DATE9.
      origins:
        - type: Predecessor
          description: ADSL.TRTEDT
  - name: AGE
    type: float
    label: Age
    derivation: ADSL.AGE
    submission:
      core: Cond
      mandatory: false
      length: 8
      origins:
        - type: Predecessor
          description: ADSL.AGE
      significant_digits: 0
  - name: AGEGR1
    type: str
    label: Pooled Age Group 1
    derivation: ADSL.AGEGR1
    submission:
      core: Cond
      mandatory: false
      length: 5
      origins:
        - type: Predecessor
          description: ADSL.AGEGR1
      codelist: AGEGR1
  - name: AGEGR1N
    type: float
    label: Pooled Age Group 1 (N)
    derivation: ADSL.AGEGR1N
    submission:
      core: Cond
      mandatory: false
      length: 8
      origins:
        - type: Predecessor
          description: ADSL.AGEGR1N
      codelist: AGEGR1N
      significant_digits: 0
  - name: RACE
    type: str
    label: Race
    derivation: ADSL.RACE
    submission:
      core: Cond
      mandatory: false
      length: 32
      origins:
        - type: Predecessor
          description: ADSL.RACE
      codelist: RACE
  - name: RACEN
    type: float
    label: Race (N)
    derivation: ADSL.RACEN
    submission:
      core: Cond
      mandatory: false
      length: 8
      origins:
        - type: Predecessor
          description: ADSL.RACEN
      codelist: RACEN
      significant_digits: 0
  - name: SEX
    type: str
    label: Sex
    derivation: ADSL.SEX
    submission:
      core: Cond
      mandatory: false
      length: 1
      origins:
        - type: Predecessor
          description: ADSL.SEX
      codelist: SEX
  - name: COMP24FL
    type: str
    label: Completers of Week 24 Population Flag
    derivation: ADSL.COMP24FL
    submission:
      core: Cond
      mandatory: false
      length: 1
      origins:
        - type: Predecessor
          description: ADSL.COMP24FL
      codelist: YN

  - name: DSRAEFL
    type: str
    label: Discontinued due to AE?
    derivation:
      first_available:
        sources:
          - ADSL.DSRAEFL
        missing: ""

    submission:
      core: Cond
      mandatory: false
      length: 1
      origins:
        - type: Derived
      codelist: YN
      method: Copy ADSL.DSRAEFL; represent a missing value as an empty string.
  - name: SAFFL
    type: str
    label: Safety Population Flag
    derivation: ADSL.SAFFL
    submission:
      core: Cond
      mandatory: false
      length: 1
      origins:
        - type: Predecessor
          description: ADSL.SAFFL
      codelist: YN

  # Visit (row-template derived)
  - name: AVISIT
    type: str
    label: Analysis Visit

    submission:
      core: Cond
      mandatory: true
      length: 16
      origins:
        - type: Assigned
      codelist: AVISIT
      method:
        name: Algorithm to derive ADLBC.AVISIT
        type: Computation
        description: "Last observed value for this lab parameter during treatment phase: 'Y' if VISITNUM=12,
          if subject discontinues prior to VISIT 12, then this variable is set to 'Y' if this is the last assessment
          of this analyte for the subject"
  - name: AVISITN
    type: float
    label: Analysis Visit (N)

  # Dates
    submission:
      core: Cond
      mandatory: false
      length: 8
      origins:
        - type: Assigned
      codelist: AVISITN
      significant_digits: 0
  - name: ADT
    type: date
    label: Analysis Date
    derivation:
      str_extract:
        source: LB.LBDTC
        pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}"

    submission:
      core: Cond
      mandatory: false
      display_format: DATE9.
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADLBC.ADT
        type: Computation
        description: LB.LBDTC
  - name: ADY
    type: float
    label: Analysis Relative Day
    derivation:
      study_day:
        source: ADT
        reference: TRTSDT

  # Visit echoes
    submission:
      core: Cond
      mandatory: false
      length: 8
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADLBC.ADY
        type: Computation
        description: LB.LBDY
      significant_digits: 0
  - name: VISIT
    type: str
    label: Visit Name
    derivation: LB.VISIT

    submission:
      core: Cond
      mandatory: false
      length: 19
      origins:
        - type: Predecessor
          description: LB.VISIT
      codelist: VISIT
  - name: VISITNUM
    type: float
    label: Visit Number
    derivation:

  # Parameters
      round_half_away_from_zero:
        source: LB.VISITNUM
        digits: 1
    submission:
      core: Cond
      mandatory: false
      length: 8
      significant_digits: 1
      origins:
        - type: Derived
      codelist: VISITNUM
      method: Round LB.VISITNUM to one decimal place, the precision of the declared visit codes.
  - name: PARAM
    type: str
    label: Parameter
    derivation:
      str_template: "{LB.LBTEST} ({LB.LBSTRESU})"

    submission:
      core: Cond
      mandatory: false
      length: 100
      origins:
        - type: Derived
      codelist: PARAM_ADLBC
      method:
        name: Algorithm to derive ADLBC.PARAM
        type: Computation
        description: Concatenated LB.LBTEST, '(',  LB.LBSTRESU and ')'
  - name: PARAMCD
    type: str
    label: Parameter Code
    derivation: LB.LBTESTCD

    submission:
      core: Cond
      mandatory: false
      length: 8
      origins:
        - type: Predecessor
          description: LB.LBTESTCD
      codelist: PARAMCD_ADLBC
  - name: PARAMN
    type: float
    label: Parameter (N)
    derivation:
      mapping:
        source: PARAMCD
        dict:
          SODIUM: 18
          K: 19
          CL: 20
          BILI: 21
          ALP: 22
          GGT: 23
          ALT: 24
          AST: 25
          BUN: 26
          CREAT: 27
          URATE: 28
          PHOS: 29
          CA: 30
          GLUC: 31
          PROT: 32
          ALB: 33
          CHOL: 34
          CK: 35

    submission:
      core: Cond
      mandatory: false
      length: 8
      origins:
        - type: Derived
      codelist: PARAMN_ADLBC
      method:
        name: Algorithm to derive ADLBC.PARAMN
        type: Computation
        description: Numeric code for Parameter
      significant_digits: 0
  - name: PARCAT1
    type: str
    label: Parameter Category 1
    derivation: "'CHEM'"

  # Values
    submission:
      core: Cond
      mandatory: false
      length: 5
      origins:
        - type: Assigned
      codelist: ADLBCAT
  - name: AVAL
    type: float
    label: Analysis Value
    derivation: LB.LBSTRESN

    submission:
      core: Cond
      mandatory: false
      length: 8
      significant_digits: 5
      origins:
        - type: Predecessor
          description: LB.LBSTRESN
  - name: ABLFL
    type: str
    label: Baseline Record Flag
    derivation:
      first_available:
        sources:
          - LB.LBBLFL
        missing: ""

    submission:
      core: Cond
      mandatory: false
      length: 1
      origins:
        - type: Derived
      method: Copy LB.LBBLFL; represent a missing value as an empty string.
  - name: BASE
    type: float
    label: Baseline Value
    derivation: BL.LBSTRESN

    submission:
      core: Cond
      mandatory: false
      length: 8
      significant_digits: 5
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADLBC.BASE
        type: Computation
        description: LB.LBSTNRHI
  - name: CHG
    type: float
    label: Change from Baseline
    derivation:
      case:
        - when: "VISITNUM <> 1"
          then: "AVAL - BASE"

    submission:
      core: Cond
      mandatory: false
      length: 8
      significant_digits: 5
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADLBC.CHG
        type: Computation
        description: AVAL - BASE
  - name: A1LO
    type: float
    label: Analysis Range 1 Lower Limit
    derivation: LB.LBSTNRLO

    submission:
      core: Cond
      mandatory: false
      length: 8
      significant_digits: 5
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADLBC.A1LO
        type: Computation
        description: LB.LBSTNRLO
  - name: A1HI
    type: float
    label: Analysis Range 1 Upper Limit
    derivation: LB.LBSTNRHI

    submission:
      core: Cond
      mandatory: false
      length: 8
      significant_digits: 5
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADLBC.A1HI
        type: Computation
        description: LB.LBSTNRHI
  - name: R2A1LO
    type: float
    label: Ratio to Analysis Range 1 Lower Limit
    derivation: "AVAL / A1LO"

    submission:
      core: Cond
      mandatory: false
      length: 8
      significant_digits: 1
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADLBC.R2A1LO
        type: Computation
        description: AVAL / A1LO
  - name: R2A1HI
    type: float
    label: Ratio to Analysis Range 1 Upper Limit
    derivation: "AVAL / A1HI"

    submission:
      core: Cond
      mandatory: false
      length: 8
      significant_digits: 1
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADLBC.R2A1HI
        type: Computation
        description: AVAL / A1HI
  - name: BR2A1LO
    type: float
    label: Base Ratio to Analysis Range 1 Lower Lim
    derivation: "BASE / A1LO"

    submission:
      core: Cond
      mandatory: false
      length: 8
      significant_digits: 1
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADLBC.BR2A1LO
        type: Computation
        description: AVAL / A1LO at baseline
  - name: BR2A1HI
    type: float
    label: Base Ratio to Analysis Range 1 Upper Lim
    derivation: "BASE / A1HI"

    submission:
      core: Cond
      mandatory: false
      length: 8
      significant_digits: 1
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADLBC.BR2A1HI
        type: Computation
        description: AVAL / A1HI at baseline
  - name: _UPPER_DISTANCE
    type: float
    label: _UPPER_DISTANCE (helper)
    derivation: ABS(AVAL - 1.5 * A1HI)

  - name: _LOWER_DISTANCE
    type: float
    label: _LOWER_DISTANCE (helper)
    derivation: ABS(0.5 * A1LO - AVAL)

  - name: ALBTRVAL
    type: float
    label: Amount Threshold Range
    derivation:
      case:
        - when: "AVAL IS NULL OR A1LO IS NULL OR A1HI IS NULL"
          then:
        - otherwise:
            greatest:
              sources:
                - _UPPER_DISTANCE
                - _LOWER_DISTANCE

    submission:
      core: Cond
      mandatory: false
      length: 8
      significant_digits: 3
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADLBC.ALBTRVAL
        type: Computation
        description: Maximum of [LBSTRESN-(1.5*ULN)] and [(.5*LLN) - LBSTRESN]
  - name: A1LO_H
    type: float
    label: A1lo H (helper)
    derivation: "0.5 * A1LO"

  - name: A1HI_15
    type: float
    label: A1hi 15 (helper)
    derivation: "1.5 * A1HI"

  - name: ANRIND
    type: str
    label: Analysis Reference Range Indicator
    derivation:
      case:
        - when: "AVAL IS NULL"
          then: "'N'"
        - when: "AVAL < A1LO_H"
          then: "'L'"
        - when: "AVAL > A1HI_15"
          then: "'H'"
        - when: "TRUE"
          then: "'N'"

    submission:
      core: Cond
      mandatory: false
      length: 1
      origins:
        - type: Derived
      codelist: LNH
      method:
        name: Algorithm to derive ADLBC.ANRIND
        type: Computation
        description: if AVAL < [0.5*LBSTNRLO) then ANRIND = 'Y' else if AVAL > [0.5*LBSTRNHI),'H','N'
  - name: B_LO_H
    type: float
    label: B Lo H (helper)
    derivation: "0.5 * BL.LBSTNRLO"

  - name: B_HI_15
    type: float
    label: B Hi 15 (helper)
    derivation: "1.5 * BL.LBSTNRHI"

  - name: BNRIND
    type: str
    label: Baseline Reference Range Indicator
    derivation:
      case:
        - when: "BASE IS NULL"
          then: "''"
        - when: "BASE < B_LO_H"
          then: "'L'"
        - when: "BASE > B_HI_15"
          then: "'H'"
        - when: "TRUE"
          then: "'N'"

  # Flags
    submission:
      core: Cond
      mandatory: false
      length: 1
      origins:
        - type: Derived
      codelist: LNH
      method:
        name: Algorithm to derive ADLBC.BNRIND
        type: Computation
        description: if BASE < [0.5*LBSTNRLO) then ANRIND = 'Y' else if BASE > [0.5*LBSTRNHI),'H','N'
  - name: IS_UNSCHED
    type: str
    label: Unscheduled visit (helper)

  - name: RK_ANL
    type: int
    label: Rk Anl (helper)
    derivation:
      rank:
        method: dense
        window:
          group_by:
            - STUDYID
            - USUBJID
            - PARAMCD
          order_by:
            - variable: ALBTRVAL
              direction: desc
              nulls: last
            - variable: LBSEQ
              nulls: last
          filter: "VISITNUM >= 4 AND VISITNUM <= 12 AND IS_UNSCHED IS NULL AND ALBTRVAL IS NOT NULL"

  - name: ANL01FL
    type: str
    label: Analysis Flag 01
    derivation:
      case:
        - when: "RK_ANL = 1"
          then: "'Y'"
        - when: "TRUE"
          then: "''"

    submission:
      core: Cond
      mandatory: false
      length: 1
      origins:
        - type: Assigned
      method:
        name: Algorithm to derive ADLBC.ANL01FL
        type: Computation
        description: If ALBTRVAL  = max(ALBTRVAL) then ANL01FL is 'Y'
  - name: RK_ENT
    type: int
    label: Rk Ent (helper)
    derivation:
      rank:
        method: dense
        window:
          group_by:
            - STUDYID
            - USUBJID
            - PARAMCD
          order_by:
            - variable: AVISITN
              direction: desc
              nulls: last
          filter: "AVISITN > 0 AND AVISITN < 99 AND IS_UNSCHED IS NULL AND VISITNUM <= 12"

  - name: AENTMTFL
    type: str
    label: Last value in treatment visit
    derivation:
      case:
        - when: "AVISITN = 99 OR RK_ENT = 1"
          then: "'Y'"
        - when: "TRUE"
          then: "''"

  # Record identifiers
    submission:
      core: Cond
      mandatory: false
      length: 1
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADLBC.AENTMTFL
        type: Computation
        description: "Last observed value for this lab parameter during treatment phase: 'Y' if VISITNUM=12,
          if subject discontinues prior to VISIT 12, then this variable is set to 'Y' if this is the last assessment
          of this analyte for the subject"
  - name: LBSEQ
    type: float
    label: Sequence Number
    derivation: LB.LBSEQ

    submission:
      core: Cond
      mandatory: true
      length: 8
      origins:
        - type: Predecessor
          description: LB.LBSEQ
      significant_digits: 0
  - name: LBNRIND
    type: str
    label: Reference Range Indicator
    derivation:
      first_available:
        sources:
          - LB.LBNRIND
        missing: ""

    submission:
      core: Cond
      mandatory: false
      length: 8
      origins:
        - type: Derived
      codelist: LBNRIND
      method: Copy LB.LBNRIND; represent a missing value as an empty string.
  - name: LBSTRESN
    type: float
    label: Numeric Result/Finding in Standard Units
    derivation: LB.LBSTRESN

  # Row-template internals (derived in every template)
  # SUPPLB.IDVARVAL is text, so format the numeric LBSEQ before matching.
    submission:
      core: Cond
      mandatory: false
      length: 8
      significant_digits: 5
      origins:
        - type: Predecessor
          description: LB.LBSTRESN
  - name: LBSEQ_S
    type: str
    label: Sequence number as text (helper)

  - name: LBSEQ_PAD
    type: str
    label: Lbseq Pad (helper)

  - name: LBSEQ_K
    type: str
    label: Lbseq K (helper)

  - name: ENDPOINT
    type: str
    label: Endpoint (helper)

  - name: SRC_AVISITN
    type: float
    label: Src Avisitn (helper)

  - name: EOT_IND
    type: int
    label: Eot Ind (helper)

  - name: VIS_OK
    type: str
    label: Vis Ok (helper)

  - name: E2_VN
    type: float
    label: E2 Vn (helper)

  - name: E2_SEQ
    type: float
    label: E2 Seq (helper)

  - name: RN2
    type: int
    label: Rn2 (helper)

  - name: EOT_LBCAT
    type: str
    label: Eot Lbcat (helper)

rows:
  - id: main
    dataset: LB
    filter: "LB.LBCAT = 'CHEMISTRY' AND (LB.VISIT LIKE '%WEEK%' OR LB.VISIT LIKE '%UNSCHEDULED%' OR LB.VISIT
      LIKE '%SCREENING%')"
    derivations:
      AVISIT:
        case:
          - when: "LB.LBBLFL = 'Y'"
            then: "'Baseline'"
          - when: "IS_UNSCHED IS NOT NULL"
            then: "''"
          - when: "TRUE"
            then:
              mapping:
                source: LB.VISIT
                dict: {"WEEK 2": "Week 2", "WEEK 4": "Week 4", "WEEK 6": "Week 6", "WEEK 8": "Week 8", "WEEK 12": "Week
                    12", "WEEK 16": "Week 16", "WEEK 20": "Week 20", "WEEK 24": "Week 24", "WEEK 26": "Week
                    26"}
                unmapped:
      AVISITN:
        case:
          - when: "LB.LBBLFL = 'Y'"
            then: 0
          - when: "IS_UNSCHED IS NOT NULL"
            then:
          - when: "TRUE"
            then:
              str_extract:
                source: LB.VISIT
                pattern: "[0-9]+"
                no_match:
      IS_UNSCHED:
        str_extract:
          source: LB.VISIT
          pattern: "UNSCHEDULED"
          no_match:
      LBSEQ_S:
      LBSEQ_PAD:
      LBSEQ_K:
      ENDPOINT:
      SRC_AVISITN:
      EOT_IND:
      VIS_OK:
      E2_VN:
      E2_SEQ:
      RN2:
      EOT_LBCAT:

  - id: eot
    dataset: LB
    group_by:
      - LB.STUDYID
      - LB.USUBJID
      - LB.LBSEQ
      - LB.LBCAT
      - LB.VISITNUM
      - LB.VISIT
      - LB.LBTEST
      - LB.LBSTRESU
      - LB.LBTESTCD
