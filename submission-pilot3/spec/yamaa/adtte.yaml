# Submission Pilot 3 ADTTE: the Pilot 3 layer and the Define-XML metadata
# that only this package records.
yamaa: "1.0"
type: spec
parent: ../../../spec/yamaa/cdiscpilot01/pilot3/adtte.yaml
domain: ADTTE

columns:
  - name: SITEID
    submission:
      data_type: text
      mandatory: false
      length: 3
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADTTE.SITEID
        description: ADSL.SITEID

  - name: AGE
    submission:
      data_type: integer
      mandatory: false
      length: 8
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADTTE.AGE
        description: ADSL.AGE

  - name: AGEGR1
