yamaa: '1.0'
type: spec
model: ADaM
domain: ADTTE

keys:
  - STUDYID
  - USUBJID

input:
  ADSL:
    path: ../../data/adam/adsl-yamaa.parquet
    schema: adsl.yaml
  ADAE:
    path: ../../data/adam/adae-yamaa.parquet
    schema: adae.yaml
  DS: ../../data/sdtm/ds.parquet
base: ADSL

output:
  path: ../../data/adam/adtte-yamaa.parquet
  columns:
    - STUDYID
    - SITEID
    - USUBJID
    - AGE
    - AGEGR1
    - AGEGR1N
    - RACE
    - RACEN
    - SEX
    - TRTSDT
    - TRTEDT
    - TRTDUR
    - TRTP
    - TRTA
    - TRTAN
    - PARAM
    - PARAMCD
    - AVAL
    - STARTDT
    - ADT
    - CNSR
    - EVNTDESC
    - SRCDOM
    - SRCVAR
    - SRCSEQ
    - SAFFL

intermediates:
  - id: EVTSRC
    dataset: ADAE
    key:
      - STUDYID
      - USUBJID
    filter: ADAE.AOCC01FL = 'Y' AND ADAE.CQ01NAM = 'DERMATOLOGIC EVENTS' AND ADAE.SAFFL = 'Y'
    order_by:
      - variable: ADAE.ASTDT
        nulls: last
    keep: first

  - id: DS_DISP
    dataset: DS
    key:
      - STUDYID
      - USUBJID
    filter: DS.DSCAT = 'DISPOSITION EVENT' AND DS.DSDECOD NOT IN ('SCREEN FAILURE', 'FINAL LAB VISIT')
    order_by:
      - variable: DS.DSSTDTC
        nulls: last
    keep: first

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: ADSL.STUDYID
    submission:
      data_type: text
      mandatory: false
      length: 12
      origins:
        - type: Predecessor
          description: ADSL.STUDYID
  - name: SITEID
    type: str
    label: Study Site Identifier
    derivation: ADSL.SITEID
    submission:
      data_type: text
      mandatory: false
      length: 3
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADTTE.SITEID
        type: Computation
        description: ADSL.SITEID
  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: ADSL.USUBJID
    submission:
      data_type: text
      mandatory: false
      key_sequence: 1
      length: 11
      origins:
        - type: Predecessor
          description: ADSL.USUBJID
  - name: AGE
    type: float
    label: Age
    derivation: ADSL.AGE
    submission:
      data_type: integer
      mandatory: false
      length: 8
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADTTE.AGE
        type: Computation
        description: ADSL.AGE
  - name: AGEGR1
    type: str
    label: Pooled Age Group 1
    derivation: ADSL.AGEGR1
    submission:
      data_type: text
      mandatory: false
      length: 5
      codelist: AGEGR1
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADTTE.AGEGR1
        type: Computation
        description: ADSL.AGEGR1
  - name: AGEGR1N
    type: float
    label: Pooled Age Group 1 (N)
    derivation: ADSL.AGEGR1N
    submission:
      data_type: integer
      mandatory: false
      length: 8
      codelist: AGEGR1N
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADTTE.AGEGR1N
        type: Computation
        description: ADSL.AGEGR1N
  - name: RACE
    type: str
    label: Race
    derivation: ADSL.RACE
    submission:
      data_type: text
      mandatory: false
      length: 32
      codelist: RACE
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADTTE.RACE
        type: Computation
        description: ADSL.RACE
  - name: RACEN
    type: float
    label: Race (N)
    derivation: ADSL.RACEN
    submission:
      data_type: integer
      mandatory: false
      length: 8
      codelist: RACEN
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADTTE.RACEN
        type: Computation
        description: ADSL.RACEN
  - name: SEX
    type: str
    label: Sex
    derivation: ADSL.SEX
    submission:
      data_type: text
      mandatory: false
      length: 1
      codelist: SEX
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADTTE.SEX
        type: Computation
        description: ADSL.SEX
  - name: SAFFL
    type: str
    label: Safety Population Flag
    derivation: ADSL.SAFFL
    submission:
      data_type: text
      mandatory: false
      length: 1
      codelist: YN
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADTTE.SAFFL
        type: Computation
        description: ADSL.SAFFL
  - name: TRTSDT
    type: date
    label: Date of First Exposure to Treatment
    derivation: ADSL.TRTSDT
    submission:
      data_type: integer
      mandatory: false
      length: 8
      display_format: DATE9.
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADTTE.TRTSDT
        type: Computation
        description: ADSL.TRTSDT
  - name: TRTEDT
    type: date
    label: Date of Last Exposure to Treatment
    derivation: ADSL.TRTEDT
    submission:
      data_type: integer
      mandatory: false
      length: 8
      display_format: DATE9.
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADTTE.TRTEDT
        type: Computation
        description: ADSL.TRTEDT
  - name: TRTDUR
    type: float
    label: Duration of treatment (days)
    derivation: ADSL.TRTDURD

    submission:
      data_type: integer
      mandatory: false
      length: 8
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADTTE.TRTDUR
        type: Computation
        description: ADSL.TRTDUR
  - name: TRTP
    type: str
    label: Planned Treatment
    derivation: ADSL.TRT01P

    submission:
      data_type: text
      mandatory: false
      length: 20
      codelist: ARM
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADTTE.TRTP
        type: Computation
        description: ADSL.TRT01P
  - name: TRTA
    type: str
    label: Actual Treatment
    derivation: ADSL.TRT01A

    submission:
      data_type: text
      mandatory: false
      length: 20
      codelist: ARM
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADTTE.TRTA
        type: Computation
        description: ADSL.TRT01A
  - name: TRTAN
    type: float
    label: Actual Treatment (N)
    derivation: ADSL.TRT01AN

    submission:
      data_type: integer
      mandatory: false
      length: 8
      codelist: ARMN
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADTTE.TRTAN
        type: Computation
        description: ADSL.TRT01AN
  - name: PARAM
    type: str
    label: Parameter
    derivation: "'Time to First Dermatologic Event'"

    submission:
      data_type: text
      mandatory: false
      length: 100
      codelist: PARAM_ADTTE
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADTTE.PARAM
        type: Computation
        description: PARAM="Time to First Dermatologic Event"
  - name: PARAMCD
    type: str
    label: Parameter Code
    derivation: "'TTDE'"

    submission:
      data_type: text
      mandatory: false
      key_sequence: 2
      length: 8
      codelist: PARAMCD_ADTTE
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADTTE.PARAMCD
        type: Computation
        description: PARAMCD="TTDE"
  - name: EOSDT
    type: date
    label: Eosdt (helper)
    derivation:
      impute:
        type: date
        source: DS_DISP.DSSTDTC
        month: 1
        day: 1

  - name: EOS2DT
    type: date
    label: Eos2dt (helper)
    derivation:
      case:
        - when: ADSL.DCDECOD = 'DEATH'
          then:
            impute:
              type: date
              source: ADSL.RFENDTC
              month: 1
              day: 1
        - otherwise: EOSDT

  - name: STARTDT
    type: date
    label: Time-to-Event Origin Date for Subject
    derivation: ADSL.TRTSDT

  # Event date wins when a qualifying ADAE record exists; otherwise the censor
  # date.
    submission:
      data_type: integer
      mandatory: false
      length: 8
      display_format: DATE9.
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADTTE.STARTDT
        type: Computation
        description: ADSL.RFSTDTC
  - name: ADT
    type: date
    label: Analysis Date
    derivation:
      first_available:
        sources:
          - EVTSRC.ASTDT
          - EOS2DT

    submission:
      data_type: integer
      mandatory: false
      length: 8
      display_format: DATE9.
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADTTE.ADT
        type: Computation
        description: if ADAE.ASTDT is not missing and occurred after TRTSDT then ADAE.ASTDT else convert ADSL.RFENDTC to a SAS numeric date
  - name: CNSR
    type: float
    label: Censor
    derivation:
      case:
        - when: EVTSRC.ASTDT IS NOT NULL
          then: 0
        - otherwise: 1

    submission:
      data_type: integer
      mandatory: false
      length: 8
      codelist: CENSOR
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADTTE.CNSR
        type: Computation
        description: if ADAE.TRTEMFL ="Y" then CNSR=0, else CNSR=1
  - name: EVNTDESC
    type: str
    label: Event or Censoring Description
    derivation:
      case:
        - when: EVTSRC.ASTDT IS NOT NULL
          then: "'Dematologic Event Occured'"
        - otherwise: "'Study Completion Date'"

    submission:
      data_type: text
      mandatory: false
      length: 25
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADTTE.EVNTDESC
        type: Computation
        description: if ADTTE.CNSR = 0 then "Dematologic Event Occured", else if ADTTE.CNSR =1 then "Study Completion Date"
  - name: SRCDOM
    type: str
    label: Source Data
    derivation:
      case:
        - when: EVTSRC.ASTDT IS NOT NULL
          then: "'ADAE'"
        - otherwise: "'ADSL'"

    submission:
      data_type: text
      mandatory: false
      length: 4
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADTTE.SRCDOM
        type: Computation
        description: The Source domain referred to in order to populate ADT (either ADAE or ADSL)
  - name: SRCVAR
    type: str
    label: Source Variable
    derivation:
      case:
        - when: EVTSRC.ASTDT IS NOT NULL
          then: "'ASTDT'"
        - otherwise: "'RFENDT'"

    submission:
      data_type: text
      mandatory: false
      length: 6
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADTTE.SRCVAR
        type: Computation
        description: The Source variable referred to in order to populate ADT (either ASTDT or RFENDT)
  - name: SRCSEQ
    type: float
    label: Source Sequence Number
    derivation:
      case:
        - when: EVTSRC.ASTDT IS NOT NULL
          then: EVTSRC.AESEQ

    submission:
      data_type: integer
      mandatory: false
      length: 8
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADTTE.SRCSEQ
        type: Computation
        description: The value of ADAE.AESEQ if SRCDOM=ADAE, otherwise null.
  - name: AVAL
    type: float
    label: Analysis Value
    derivation:
      diff:
        type: date
        start: STARTDT
        end: ADT
        unit: day
        closed: both
    submission:
      data_type: integer
      mandatory: false
      length: 8
      origins:
        - type: Derived
      method:
        name: Algorithm to derive ADTTE.AVAL
        type: Computation
        description: ADT-STARTDT+1
submission:
  mode: historical
  artifact: adtte.xpt
  label: AE Time To 1st Derm. Event Analysis
  class: BASIC DATA STRUCTURE
  structure: one record per subject per parameter
  repeating: true
  reference_data: false
