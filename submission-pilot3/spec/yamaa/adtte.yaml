yamaa: "1.0"
type: spec
model: ADaM
domain: ADTTE

keys:
  - STUDYID
  - USUBJID

input:
  ADSL:
    path: ../../data/adam/adsl-yamaa.parquet
    schema: adsl.yaml
  ADAE:
    path: ../../data/adam/adae-yamaa.parquet
    schema: adae.yaml
  DS: ../../data/sdtm/ds.parquet
base: ADSL

output:
  path: ../../data/adam/adtte-yamaa.parquet
  columns:
    - STUDYID
    - SITEID
    - USUBJID
    - AGE
    - AGEGR1
    - AGEGR1N
    - RACE
    - RACEN
    - SEX
    - TRTSDT
    - TRTEDT
    - TRTDUR
    - TRTP
    - TRTA
    - TRTAN
    - PARAM
    - PARAMCD
    - AVAL
    - STARTDT
    - ADT
    - CNSR
    - EVNTDESC
    - SRCDOM
    - SRCVAR
    - SRCSEQ
    - SAFFL

intermediates:
  - id: EVTSRC
    dataset: ADAE
    key:
      - STUDYID
      - USUBJID
    filter: "ADAE.AOCC01FL = 'Y' AND ADAE.CQ01NAM = 'DERMATOLOGIC
      EVENTS' AND ADAE.SAFFL = 'Y'"
    order_by:
      - variable: ADAE.ASTDT
        nulls: last
    keep: first

  - id: DS_DISP
    dataset: DS
    key:
      - STUDYID
      - USUBJID
    filter: "DS.DSCAT = 'DISPOSITION EVENT' AND DS.DSDECOD NOT IN
      ('SCREEN FAILURE', 'FINAL LAB VISIT')"
    order_by:
      - variable: DS.DSSTDTC
        nulls: last
    keep: first

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: ADSL.STUDYID

  - name: SITEID
    type: str
    label: Study Site Identifier
    derivation: ADSL.SITEID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: ADSL.USUBJID

  - name: AGE
    type: float
    label: Age
    derivation: ADSL.AGE

  - name: AGEGR1
    type: str
    label: Pooled Age Group 1
    derivation: ADSL.AGEGR1

  - name: AGEGR1N
    type: float
    label: Pooled Age Group 1 (N)
    derivation: ADSL.AGEGR1N

  - name: RACE
    type: str
    label: Race
    derivation: ADSL.RACE

  - name: RACEN
    type: float
    label: Race (N)
    derivation: ADSL.RACEN

  - name: SEX
    type: str
    label: Sex
    derivation: ADSL.SEX

  - name: SAFFL
    type: str
    label: Safety Population Flag
    derivation: ADSL.SAFFL

  - name: TRTSDT
    type: date
    label: Date of First Exposure to Treatment
    derivation: ADSL.TRTSDT

  - name: TRTEDT
    type: date
    label: Date of Last Exposure to Treatment
    derivation: ADSL.TRTEDT

  - name: TRTDUR
    type: float
    label: Duration of treatment (days)
    derivation: ADSL.TRTDURD

  - name: TRTP
    type: str
    label: Planned Treatment
    derivation: ADSL.TRT01P

  - name: TRTA
    type: str
    label: Actual Treatment
    derivation: ADSL.TRT01A

  - name: TRTAN
    type: float
    label: Actual Treatment (N)
    derivation: ADSL.TRT01AN

  - name: PARAM
    type: str
    label: Parameter
    derivation: "'Time to First Dermatologic Event'"

  - name: PARAMCD
    type: str
    label: Parameter Code
    derivation: "'TTDE'"

  - name: EOSDT
    type: date
    label: Eosdt (helper)
    derivation:
      impute:
        type: date
        source: DS_DISP.DSSTDTC
        month: 1
        day: 1

  - name: EOS2DT
    type: date
    label: Eos2dt (helper)
    derivation:
      case:
        - when: "ADSL.DCDECOD = 'DEATH'"
          then:
            impute:
              type: date
              source: ADSL.RFENDTC
              month: 1
              day: 1
        - otherwise: EOSDT

  - name: STARTDT
    type: date
    label: Time-to-Event Origin Date for Subject
    derivation: ADSL.TRTSDT

  # Event date wins when a qualifying ADAE record exists; otherwise the censor
  # date.
  - name: ADT
    type: date
    label: Analysis Date
    derivation:
      first_available:
        sources:
          - EVTSRC.ASTDT
          - EOS2DT

  - name: CNSR
    type: float
    label: Censor
    derivation:
      case:
        - when: "EVTSRC.ASTDT IS NOT NULL"
          then: 0
        - otherwise: 1

  - name: EVNTDESC
    type: str
    label: Event or Censoring Description
    derivation:
      case:
        - when: "EVTSRC.ASTDT IS NOT NULL"
          then: "'Dematologic Event Occured'"
        - otherwise: "'Study Completion Date'"

  - name: SRCDOM
    type: str
    label: Source Data
    derivation:
      case:
        - when: "EVTSRC.ASTDT IS NOT NULL"
          then: "'ADAE'"
        - otherwise: "'ADSL'"

  - name: SRCVAR
    type: str
    label: Source Variable
    derivation:
      case:
        - when: "EVTSRC.ASTDT IS NOT NULL"
          then: "'ASTDT'"
        - otherwise: "'RFENDT'"

  - name: SRCSEQ
    type: float
    label: Source Sequence Number
    derivation:
      case:
        - when: "EVTSRC.ASTDT IS NOT NULL"
          then: EVTSRC.AESEQ

  - name: AVAL
    type: float
    label: Analysis Value
    derivation:
      diff:
        type: date
        start: STARTDT
        end: ADT
        unit: day
        closed: both
