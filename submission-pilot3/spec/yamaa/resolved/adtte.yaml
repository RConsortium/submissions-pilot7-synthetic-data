      - derivation:
          value: '''TTDE'''
        label: Parameter Code
        name: PARAMCD
        submission:
          codelist: PARAMCD_ADTTE
          data_type: text
          key_sequence: 2
          length: 8
          mandatory: false
          method:
            description: PARAMCD="TTDE"
            name: Algorithm to derive ADTTE.PARAMCD
            type: Computation
          origins:
          - type: Derived
