              end: ADT
              start: STARTDT
              type: date
              unit: day
        label: Analysis Value
        name: AVAL
        submission:
          data_type: integer
          length: 8
          mandatory: false
          method:
            description: ADT-STARTDT+1
            name: Algorithm to derive ADTTE.AVAL
            type: Computation
          origins:
          - type: Derived
        type: float
      - derivation:
          value:
            case:
            - then: 0
              when: HAS_EVENT = 'Y'
            - otherwise: 1
        label: Censor
        name: CNSR
        submission:
          codelist: CENSOR
          data_type: integer
          length: 8
          mandatory: false
          method:
            description: if ADAE.TRTEMFL ="Y" then CNSR=0, else CNSR=1
            name: Algorithm to derive ADTTE.CNSR
            type: Computation
          origins:
          - type: Derived
        type: float
      - derivation:
          value:
            case:
            - then: '''Dematologic Event Occured'''
              when: HAS_EVENT = 'Y'
            - otherwise: '''Study Completion Date'''
        label: Event or Censoring Description
        name: EVNTDESC
        submission:
          data_type: text
          length: 25
          mandatory: false
          method:
            description: if ADTTE.CNSR = 0 then "Dematologic Event Occured", else
              if ADTTE.CNSR =1 then "Study Completion Date"
            name: Algorithm to derive ADTTE.EVNTDESC
            type: Computation
          origins:
          - type: Derived
        type: str
      - derivation:
          value:
            case:
            - then: '''ADAE'''
              when: HAS_EVENT = 'Y'
            - otherwise: '''ADSL'''
        label: Source Data
        name: SRCDOM
        submission:
          data_type: text
          length: 4
          mandatory: false
          method:
            description: The Source domain referred to in order to populate ADT (either
