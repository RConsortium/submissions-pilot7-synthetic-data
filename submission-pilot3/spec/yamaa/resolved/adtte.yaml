        submission:
          data_type: integer
          display_format: DATE9.
          length: 8
          mandatory: false
          method:
            description: ADSL.RFSTDTC
            name: Algorithm to derive ADTTE.STARTDT
            type: Computation
          origins:
          - type: Derived
        type: date
      - derivation:
          value:
            case:
            - then: '''Y'''
              when: FIRST_DERM.AESEQ IS NOT NULL
            - otherwise: '''N'''
        label: Dermatologic event flag
        name: HAS_EVENT
        type: str
      - derivation:
          value:
            case:
            - then: FIRST_DERM.ASTDT
              when: HAS_EVENT = 'Y'
            - otherwise: ADSL.RFENDT
        label: Analysis Date
        name: ADT
        submission:
          data_type: integer
          display_format: DATE9.
          length: 8
          mandatory: false
          method:
            description: if ADAE.ASTDT is not missing and occurred after TRTSDT then
