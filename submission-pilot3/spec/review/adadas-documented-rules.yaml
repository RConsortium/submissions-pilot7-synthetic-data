yamaa: '1.0'
type: spec
model: ADaM
domain: ADADAS
keys:
- STUDYID
- USUBJID
- PARAMCD
- AVISIT
- ADT
input:
  ADADAS_REF:
    path: ../../data/adam/adadas.parquet
    empty_string: present
  QS:
    path: ../../data/sdtm/qs.parquet
    empty_string: present
base: ADADAS_REF
output:
  path: ../../../.build/verification/submission-pilot3/adadas-documented-rules.parquet
  columns:
  - STUDYID
  - USUBJID
  - PARAMCD
  - AVISIT
  - ADT
  - AVISITN
  - ADY
  - ADT__LITERAL
  - PARAM
  - PARAMN
  - CHG
  - AWTDIFF
  - AWU
  - BASE
intermediates:
- id: REF
  dataset: ADADAS_REF
  key:
  - STUDYID
  - USUBJID
  - PARAMCD
  - AVISIT
  - ADT
  order_by:
  - variable: ADADAS_REF.USUBJID
    nulls: last
  keep: first
- id: P_QS
  dataset: QS
  key:
  - STUDYID
  - USUBJID
  - QSSEQ
  order_by:
  - variable: QS.QSSEQ
    nulls: last
  keep: first
- id: _F2_BASE_QS
  dataset: QS
  key:
    STUDYID: STUDYID
    USUBJID: USUBJID
    QSTESTCD: PARAMCD
  filter: QS.QSBLFL = 'Y' AND QS.VISITNUM = 3
  verifications:
  - unique:
    - STUDYID
    - USUBJID
    - QSTESTCD
columns:
- name: STUDYID
  type: str
  label: Study Identifier
  derivation: ADADAS_REF.STUDYID
- name: USUBJID
  type: str
  label: Unique Subject Identifier
  derivation: ADADAS_REF.USUBJID
- name: PARAMCD
  type: str
  label: Parameter Code
  derivation: ADADAS_REF.PARAMCD
- name: AVISIT
  type: str
  label: Analysis Visit
  derivation: ADADAS_REF.AVISIT
- name: ADT
  type: date
  label: Analysis Date
  derivation: ADADAS_REF.ADT
- name: QSSEQ
  type: float
  label: Reference QS Sequence Join Key
  derivation: REF.QSSEQ
- name: AVISITN
  type: float
  label: Analysis Visit Numeric Code Literal
  derivation:
    mapping:
      source: REF.AVISIT
      dict:
        Baseline: 0.0
        Week 2: 2.0
        Week 4: 4.0
        Week 6: 6.0
        Week 8: 8.0
        Week 10: 10.0
        Week 12: 12.0
        Week 14: 14.0
        Week 16: 16.0
        Week 18: 18.0
        Week 20: 20.0
        Week 22: 22.0
        Week 24: 24.0
        Week 26: 26.0
        Weeks 4-24: 98.0
        End of Treatment: 99.0
- name: ADY
  type: float
  label: Analysis Relative Day Literal
  derivation:
    study_day:
      source: REF.ADT
      reference: REF.TRTSDT
- name: ADT__LITERAL
  type: date
  label: Analysis Date Literal
  derivation:
    to_date:
      source: P_QS.QSDTC
- name: _PARAM_DECODE
  type: str
  label: Native Parameter Decode Helper
  derivation:
    mapping:
      source: REF.PARAMCD
      dict:
        ACITM01: Word Recall Task
        ACITM02: Naming Objects And Fingers (Refer To 5 C
        ACITM03: Delayed Word Recall
        ACITM04: Commands
        ACITM05: Constructional Praxis
        ACITM06: Ideational Praxis
        ACITM07: Orientation
        ACITM08: Word Recognition
        ACITM09: Attention/Visual Search Task
        ACITM10: Maze Solution
        ACITM11: Spoken Language Ability
        ACITM12: Comprehension Of Spoken Language
        ACITM13: Word Finding Difficulty In Spontaneous S
        ACITM14: Recall Of Test Instructions
        ACTOT: Adas-Cog(11) Subscore
- name: PARAM
  type: str
  label: Parameter Literal
  derivation:
    case:
    - when: _PARAM_DECODE IS NULL
      then: ''''''
    - otherwise: _PARAM_DECODE
- name: PARAMN
  type: float
  label: Parameter Numeric Code Literal
  derivation:
    mapping:
      source: REF.PARAMCD
      dict:
        ACITM01: 1.0
        ACITM02: 2.0
        ACITM03: 3.0
        ACITM04: 4.0
        ACITM05: 5.0
        ACITM06: 6.0
        ACITM07: 7.0
        ACITM08: 8.0
        ACITM09: 9.0
        ACITM10: 10.0
        ACITM11: 11.0
        ACITM12: 12.0
        ACITM13: 13.0
        ACITM14: 14.0
        ACTOT: 15.0
- name: CHG
  type: float
  label: Change from Baseline Literal
  derivation: REF.AVAL - REF.BASE
- name: AWTDIFF
  type: float
  label: Analysis Window Difference Literal
  derivation: ABS(REF.AWTARGET - REF.ADY)
- name: AWU
  type: str
  label: Analysis Window Unit Literal
  derivation: '''DAYS'''
- name: BASE
  type: float
  label: Baseline Value Literal
  derivation: _F2_BASE_QS.QSSTRESN
