yamaa: '1.0'
type: spec
model: ADaM
domain: ADSL
keys:
- STUDYID
- USUBJID
input:
  SV:
    path: ../../data/sdtm/sv.parquet
    empty_string: present
  EX:
    path: ../../data/sdtm/ex.parquet
    empty_string: present
  DS:
    path: ../../data/sdtm/ds.parquet
    empty_string: present
  ADSL_REF:
    path: ../../data/adam/adsl.parquet
    empty_string: present
  DM:
    path: ../../data/sdtm/dm.parquet
    empty_string: present
  QS:
    path: ../../data/sdtm/qs.parquet
    empty_string: present
    key:
    - STUDYID
    - USUBJID
  VS:
    path: ../../data/sdtm/vs.parquet
    empty_string: present
  SC:
    path: ../../data/sdtm/sc.parquet
    empty_string: present
  MH:
    path: ../../data/sdtm/mh.parquet
    empty_string: present
base: ADSL_REF
output:
  path: ../../../.build/verification/submission-pilot3/adsl-probe.parquet
  columns:
  - STUDYID
  - USUBJID
  - TRT01PN
  - TRT01A
  - TRT01AN
  - TRTSDT
  - TRTEDT
  - TRTDURD
  - AVGDD
  - AGEGR1
  - AGEGR1N
  - RACEN
  - SAFFL
  - ITTFL
  - EFFFL
  - BMIBL
  - BMIBLGR1
  - HEIGHTBL
  - WEIGHTBL
  - EDUCLVL
  - DISONSDT
  - DURDSGR1
  - VISIT1DT
  - VISNUMEN
  - RFENDT
  - DCDECOD
  - EOSSTT
  - MMSETOT
  - DISCONFL
  - DSRAEFL
intermediates:
- id: REF
  dataset: ADSL_REF
  key:
  - STUDYID
  - USUBJID
  order_by:
  - variable: ADSL_REF.USUBJID
    nulls: last
  keep: first
- id: P1_SV3
  dataset: SV
  key:
  - STUDYID
  - USUBJID
  filter: SV.VISITNUM = 3
  order_by:
  - variable: SV.SVSTDTC
    nulls: last
  keep: first
- id: P1_LAST_EX
  dataset: EX
  key:
  - STUDYID
  - USUBJID
  order_by:
  - variable: EX.EXSEQ
    nulls: last
  keep: last
- id: P1_DS_DISP
  dataset: DS
  key:
  - STUDYID
  - USUBJID
  filter: DS.DSCAT = 'DISPOSITION EVENT'
  order_by:
  - variable: DS.DSSTDTC
    nulls: last
  keep: first
- id: P2_DM
  dataset: DM
  key:
  - STUDYID
  - USUBJID
  order_by:
  - variable: DM.USUBJID
    nulls: last
  keep: first
- id: P4_HT
  dataset: VS
  key:
  - STUDYID
  - USUBJID
  filter: VS.VSTESTCD = 'HEIGHT' AND VS.VISITNUM = 1
  order_by:
  - variable: VS.VSDTC
    nulls: last
  keep: first
- id: P4_WT
  dataset: VS
  key:
  - STUDYID
  - USUBJID
  filter: VS.VSTESTCD = 'WEIGHT' AND VS.VISITNUM = 3
  order_by:
  - variable: VS.VSDTC
    nulls: last
  keep: first
- id: P4_ED
  dataset: SC
  key:
  - STUDYID
  - USUBJID
  filter: SC.SCTESTCD = 'EDLEVEL'
  order_by:
  - variable: SC.SCDTC
    nulls: last
  keep: first
- id: P4_DX
  dataset: MH
  key:
  - STUDYID
  - USUBJID
  filter: MH.MHCAT = 'PRIMARY DIAGNOSIS'
  order_by:
  - variable: MH.MHSTDTC
    nulls: last
  keep: first
- id: P4_SV1
  dataset: SV
  key:
  - STUDYID
  - USUBJID
  filter: SV.VISITNUM = 1
  order_by:
  - variable: SV.SVSTDTC
    nulls: last
  keep: first
- id: P4_PROTCOL
  dataset: DS
  key:
  - STUDYID
  - USUBJID
  filter: DS.DSTERM = 'PROTCOL COMPLETED'
  order_by:
  - variable: DS.DSSEQ
    nulls: last
  keep: last
- id: P5_DS_DISP
  dataset: DS
  key:
  - STUDYID
  - USUBJID
  filter: DS.DSCAT = 'DISPOSITION EVENT'
  order_by:
  - variable: DS.DSSTDTC
    nulls: last
  keep: first
columns:
- name: STUDYID
  type: str
  label: Study Identifier
  derivation: ADSL_REF.STUDYID
- name: USUBJID
  type: str
  label: Unique Subject Identifier
  derivation: ADSL_REF.USUBJID
- name: TRT01PN
  type: float
  label: TRT01PN
  derivation:
    mapping:
      source: REF.TRT01P
      dict:
        Placebo: 0
        Xanomeline Low Dose: 54
        Xanomeline High Dose: 81
- name: TRT01AN
  type: float
  label: TRT01AN
  derivation:
    mapping:
      source: REF.TRT01A
      dict:
        Placebo: 0
        Xanomeline Low Dose: 54
        Xanomeline High Dose: 81
- name: TRT01A
  type: str
  label: Actual Treatment for Period 01
  derivation: REF.TRT01P
- name: TRTSDT
  type: date
  label: TRTSDT
  derivation:
    impute:
      type: date
      source: P1_SV3.SVSTDTC
      invalid: null
- name: _P1_LAST_EXENDT
  type: date
  label: _P1_LAST_EXENDT
  derivation:
    impute:
      type: date
      source: P1_LAST_EX.EXENDTC
      invalid: null
- name: _P1_DISCDT
  type: date
  label: _P1_DISCDT
  derivation:
    impute:
      type: date
      source: P1_DS_DISP.DSSTDTC
      invalid: null
- name: TRTEDT
  type: date
  label: Date of Last Exposure to Treatment
  derivation:
    case:
    - when: _P1_LAST_EXENDT IS NOT NULL
      then: _P1_LAST_EXENDT
    - when: P1_DS_DISP.DSDECOD <> 'COMPLETED' AND P1_DS_DISP.VISITNUM > 3
      then: _P1_DISCDT
- name: TRTDURD
  type: float
  label: TRTDURD
  derivation:
    diff:
      type: date
      start: REF.TRTSDT
      end: REF.TRTEDT
      unit: day
      closed: both
- name: _P2_AVGDD_RAW
  type: float
  label: _P2_AVGDD_RAW
  derivation: REF.CUMDOSE / REF.TRTDURD
- name: AVGDD
  type: float
  label: AVGDD
  derivation:
    round_half_away_from_zero:
      source: _P2_AVGDD_RAW
      digits: 1
- name: AGEGR1
  type: str
  label: AGEGR1
  derivation:
    case:
    - when: REF.AGEGR1N = 1
      then: '''<65'''
    - when: REF.AGEGR1N = 2
      then: '''65-80'''
    - when: REF.AGEGR1N = 3
      then: '''>80'''
- name: AGEGR1N
  type: float
  label: AGEGR1N
  derivation:
    case:
    - when: REF.AGE IS NOT NULL AND REF.AGE < 65
      then: 1
    - when: REF.AGE >= 65 AND REF.AGE <= 80
      then: 2
    - when: REF.AGE > 80
      then: 3
- name: RACEN
  type: float
  label: RACEN
  derivation:
    mapping:
      source: REF.RACE
      dict:
        WHITE: 1
        BLACK OR AFRICAN AMERICAN: 2
        AMERICAN INDIAN OR ALASKA NATIVE: 6
        ASIAN: 7
        NATIVE HAWAIIAN OR OTHER PACIFIC ISLANDER: 5
- name: SAFFL
  type: str
  label: SAFFL
  derivation:
    case:
    - when: REF.ITTFL = 'Y' AND REF.TRTSDT IS NOT NULL
      then: '''Y'''
    - otherwise: '''N'''
- name: ITTFL
  type: str
  label: ITTFL
  derivation:
    case:
    - when: P2_DM.ARMCD IS NOT NULL AND P2_DM.ARMCD <> '' AND P2_DM.ARMCD <> ' '
      then: '''Y'''
    - otherwise: '''N'''
- name: _P3_ADAS_N
  type: float
  label: _P3_ADAS_N
  derivation:
    aggregate:
      expr: COUNT(QS.QSSEQ)
      filter: QS.QSCAT = 'ALZHEIMER''S DISEASE ASSESSMENT SCALE' AND QS.VISITNUM > 3
      key:
      - STUDYID
      - USUBJID
- name: _P3_CIBIC_N
  type: float
  label: _P3_CIBIC_N
  derivation:
    aggregate:
      expr: COUNT(QS.QSSEQ)
      filter: QS.QSCAT = 'CLINICIAN''S INTERVIEW-BASED IMPRESSION OF CHANGE (CIBIC+)' AND QS.VISITNUM
        > 3
      key:
      - STUDYID
      - USUBJID
- name: EFFFL
  type: str
  label: EFFFL
  derivation:
    case:
    - when: REF.SAFFL = 'Y' AND _P3_ADAS_N > 0 AND _P3_CIBIC_N > 0
      then: '''Y'''
    - otherwise: '''N'''
- name: _P3_BMIBL_RAW
  type: float
  label: _P3_BMIBL_RAW
  derivation: REF.WEIGHTBL / POWER(REF.HEIGHTBL / 100, 2)
- name: BMIBL
  type: float
  label: BMIBL
  derivation:
    round_half_away_from_zero:
      source: _P3_BMIBL_RAW
      digits: 1
- name: BMIBLGR1
  type: str
  label: BMIBLGR1
  derivation:
    case:
    - when: REF.BMIBL IS NOT NULL AND REF.BMIBL < 25
      then: '''<25'''
    - when: REF.BMIBL >= 25 AND REF.BMIBL < 30
      then: '''25-<30'''
    - when: REF.BMIBL >= 30
      then: '''>=30'''
    - otherwise: ''''''
- name: _P4_HEIGHTBL_RAW
  type: float
  label: _P4_HEIGHTBL_RAW
  derivation: P4_HT.VSSTRESN
- name: HEIGHTBL
  type: float
  label: HEIGHTBL
  derivation:
    round_half_away_from_zero:
      source: _P4_HEIGHTBL_RAW
      digits: 1
- name: _P4_WEIGHTBL_RAW
  type: float
  label: _P4_WEIGHTBL_RAW
  derivation: P4_WT.VSSTRESN
- name: WEIGHTBL
  type: float
  label: WEIGHTBL
  derivation:
    round_half_away_from_zero:
      source: _P4_WEIGHTBL_RAW
      digits: 1
- name: EDUCLVL
  type: float
  label: EDUCLVL
  derivation: P4_ED.SCSTRESN
- name: DISONSDT
  type: date
  label: DISONSDT
  derivation:
    impute:
      type: date
      source: P4_DX.MHSTDTC
      invalid: null
- name: VISIT1DT
  type: date
  label: VISIT1DT
  derivation:
    impute:
      type: date
      source: P4_SV1.SVSTDTC
      invalid: null
- name: DURDSGR1
  type: str
  label: DURDSGR1
  derivation:
    case:
    - when: REF.DURDIS IS NOT NULL AND REF.DURDIS < 12
      then: '''<12'''
    - when: REF.DURDIS >= 12
      then: '''>=12'''
- name: VISNUMEN
  type: float
  label: VISNUMEN
  derivation:
    case:
    - when: P4_PROTCOL.VISITNUM = 13
      then: 12
    - otherwise: P4_PROTCOL.VISITNUM
- name: RFENDT
  type: date
  label: RFENDT
  derivation:
    impute:
      type: date
      source: REF.RFENDTC
      invalid: null
- name: DCDECOD
  type: str
  label: DCDECOD
  derivation: P5_DS_DISP.DSDECOD
- name: EOSSTT
  type: str
  label: EOSSTT
  derivation:
    case:
    - when: REF.DCDECOD = 'COMPLETED'
      then: '''COMPLETED'''
    - otherwise: '''DISCONTINUED'''
- name: MMSETOT
  type: float
  label: MMSE total from documented original results
  derivation:
    aggregate:
      derivations:
        _P5_MM_ORRES:
          type: float
          derivation: QS.QSORRES
      expr: SUM(_P5_MM_ORRES)
      filter: QS.QSCAT = 'MINI-MENTAL STATE'
      key:
      - STUDYID
      - USUBJID
- name: DISCONFL
  type: str
  label: Discontinuation flag from documented grouped reason
  derivation:
    case:
    - when: REF.DCSREAS <> 'Completed'
      then: '''Y'''
    - otherwise: ''''''
- name: DSRAEFL
  type: str
  label: Discontinued due to adverse event from documented grouped reason
  derivation:
    case:
    - when: REF.DCSREAS = 'Adverse Event'
      then: '''Y'''
    - otherwise: ''''''
