schema_version: "1.0"
domain: ADTTE
keys: [STUDYID, USUBJID]

# One row per subject. Base is the derived ADSL staged by run.py (adsl-yamaa.parquet);
# the derivation logic under review is the ADTTE event-vs-censor decision.
# Event source: first qualifying ADAE record (AOCC01FL='Y',
# CQ01NAM='DERMATOLOGIC EVENTS', SAFFL='Y') by ASTDT.
# Censor source: DS disposition (DISPOSITION EVENT, excluding screen failure
# and final lab visit), with the death-date override (RFENDTC when
# DCDECOD='DEATH') observed through QC but not described in specs.
input:
  # ADSL/ADAE are the derived predecessors staged by run.py; DS is SDTM.
  ADSL: adam/adsl-yamaa.parquet
  ADAE: adam/adae-yamaa.parquet
  DS: sdtm/ds.parquet

base: ADSL

intermediates:
  - id: EVTSRC
    dataset: ADAE
    filter: "ADAE.AOCC01FL = 'Y' AND ADAE.CQ01NAM = 'DERMATOLOGIC EVENTS' AND ADAE.SAFFL = 'Y'"
    order_by: [ADAE.ASTDT]
    keep: first
  - id: DS_DISP
    dataset: DS
    filter: "DS.DSCAT = 'DISPOSITION EVENT' AND DS.DSDECOD NOT IN ('SCREEN FAILURE', 'FINAL LAB VISIT')"
    order_by: [DS.DSSTDTC]
    keep: first

output:
  path: adtte-yamaa.parquet
  columns: [STUDYID, SITEID, USUBJID, AGE, AGEGR1, AGEGR1N, RACE, RACEN,
    SEX, TRTSDT, TRTEDT, TRTDUR, TRTP, TRTA, TRTAN, PARAM, PARAMCD, AVAL,
    STARTDT, ADT, CNSR, EVNTDESC, SRCDOM, SRCVAR, SRCSEQ, SAFFL]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: ADSL.STUDYID

  - name: SITEID
    type: str
    label: Study Site Identifier
    derivation: ADSL.SITEID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: ADSL.USUBJID

  - name: AGE
    type: float
    label: Age
    derivation: ADSL.AGE

  - name: AGEGR1
    type: str
    label: Pooled Age Group 1
    derivation: ADSL.AGEGR1

  - name: AGEGR1N
    type: float
    label: Pooled Age Group 1 (N)
    derivation: ADSL.AGEGR1N

  - name: RACE
    type: str
    label: Race
    derivation: ADSL.RACE

  - name: RACEN
    type: float
    label: Race (N)
    derivation: ADSL.RACEN

  - name: SEX
    type: str
    label: Sex
    derivation: ADSL.SEX

  - name: SAFFL
    type: str
    label: Safety Population Flag
    derivation: ADSL.SAFFL

  - name: TRTSDT
    type: date
    label: Date of First Exposure to Treatment
    derivation: ADSL.TRTSDT

  - name: TRTEDT
    type: date
    label: Date of Last Exposure to Treatment
    derivation: ADSL.TRTEDT

  - name: TRTDUR
    type: float
    label: Duration of treatment (days)
    derivation: ADSL.TRTDURD

  - name: TRTP
    type: str
    label: Planned Treatment
    derivation: ADSL.TRT01P

  - name: TRTA
    type: str
    label: Actual Treatment
    derivation: ADSL.TRT01A

  - name: TRTAN
    type: float
    label: Actual Treatment (N)
    derivation: ADSL.TRT01AN

  - name: PARAM
    type: str
    label: Parameter
    derivation:
      literal: "Time to First Dermatologic Event"

  - name: PARAMCD
    type: str
    label: Parameter Code
    derivation:
      literal: TTDE

  # Censor date: disposition completion date; death overrides with RFENDTC
  # (QC-observed rule, not in the define Derivation text).
  - name: EOSDT
    type: date
    label: Eosdt (helper)
    derivation:
      date_impute:
        source: DS_DISP.DSSTDTC
        month: 1
        day: 1

  - name: EOS2DT
    type: date
    label: Eos2dt (helper)
    derivation:
      case:
        - when: "ADSL.DCDECOD = 'DEATH'"
          then:
            date_impute:
              source: ADSL.RFENDTC
              month: 1
              day: 1
        - otherwise:
            source: EOSDT

  - name: STARTDT
    type: date
    label: Time-to-Event Origin Date for Subject
    derivation: ADSL.TRTSDT

  # Event date wins when a qualifying ADAE record exists; otherwise the censor date.
  - name: ADT
    type: date
    label: Analysis Date
    derivation:
      first_available:
        sources: [EVTSRC.ASTDT, EOS2DT]

  - name: CNSR
    type: float
    label: Censor
    derivation:
      case:
        - when: "EVTSRC.ASTDT IS NOT NULL"
          then:
            literal: 0
        - otherwise:
            literal: 1

  - name: EVNTDESC
    type: str
    label: Event or Censoring Description
    derivation:
      case:
        - when: "EVTSRC.ASTDT IS NOT NULL"
          then:
            literal: "Dematologic Event Occured"
        - otherwise:
            literal: "Study Completion Date"

  - name: SRCDOM
    type: str
    label: Source Data
    derivation:
      case:
        - when: "EVTSRC.ASTDT IS NOT NULL"
          then:
            literal: ADAE
        - otherwise:
            literal: ADSL

  - name: SRCVAR
    type: str
    label: Source Variable
    derivation:
      case:
        - when: "EVTSRC.ASTDT IS NOT NULL"
          then:
            literal: ASTDT
        - otherwise:
            literal: RFENDT

  - name: SRCSEQ
    type: float
    label: Source Sequence Number
    derivation:
      case:
        - when: "EVTSRC.ASTDT IS NOT NULL"
          then:
            source: EVTSRC.AESEQ

  - name: AVAL
    type: float
    label: Analysis Value
    derivation:
      date_diff:
        start: STARTDT
        end: ADT
        unit: day
        bounds: inclusive
